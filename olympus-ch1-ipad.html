<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 올림포스 영어독해 9대 변별유형 · Chapter 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   지문 이해 보조 자료 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-ipad">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">올림포스 영어독해 9대 변별유형 · Chapter 1</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 올림포스 영어독해 9대 변별유형 · Chapter 1
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data": [{"no": "1", "title": "Gold Plating in Projects", "ktitle": "금도금 — 과잉 품질의 함정", "field": "경영·실무", "page": "기출 예제 01", "oneline": "‘금도금’ = 필요 없는 특성을 더해 결과를 불필요하게 향상하는 것.", "tldr": ["‘금도금’ = 필요 없는 특성을 더해 결과를 불필요하게 향상하는 것.", "전문가는 실력 과시 욕심에 선의로 금도금하기 쉽다.", "고객엔 가치를 못 더하고 자원만 낭비 — ‘최고는 좋음의 적’."], "analogy": "의뢰받은 보고서에 시키지도 않은 화려한 그래프·부록을 잔뜩 붙이는 거예요. 내 실력은 뽐낼 수 있지만 고객이 원한 건 아니고, 시간·비용만 더 들죠.", "bg": "분야는 프로젝트 경영이에요. 핵심 용어는 ‘금도금(gold plating)’ — 필요 없는 기능을 더해 결과를 과하게 꾸미는 것. → 왜 이것이 문제인지에 주목하며 읽으세요.", "flow": [{"kind": "정의", "t": "금도금 = 필요 없는 특성을 더해 결과를 ‘과잉’ 향상"}, {"kind": "동기", "t": "전문가가 실력을 시험·과시할 기회로 여김", "d": "전문성 강한 프로젝트일수록 흔함."}, {"kind": "유혹", "t": "선의로 더 많은·더 높은 품질을 추구"}, {"kind": "대가", "t": "고객엔 무가치 + 귀중한 자원 낭비"}, {"kind": "교훈", "t": "‘최고는 좋음의 적’"}], "quiz": [["‘금도금’이란 무엇인가?", "고객이 요구하지 않은, 비용은 들고 부가가치는 낮은 특성을 더해 결과를 불필요하게 향상하는 것이에요."], ["전문가가 금도금에 빠지기 쉬운 이유는?", "프로젝트를 자기 능력을 시험·강화할 기회로 보아, 선의로 더 높은 품질을 추구하려는 유혹이 있기 때문이에요."], ["핵심 한 문장?", "금도금은 전문가를 만족시킬 뿐 고객 가치는 못 더하고 자원만 낭비한다 — ‘최고는 좋음의 적’."]], "vocab": [["gold plating", "금도금(과잉 품질)"], ["needlessly", "불필요하게"], ["added value", "부가 가치"], ["justification", "명분·정당화"], ["autonomy", "자율성"], ["gratify", "만족시키다"], ["temptation", "유혹"]], "en": "Gold plating in the project means needlessly enhancing the expected results, namely, adding characteristics that are costly, not required, and that have low added value with respect to the targets ― in other words, giving more with no real justification other than to demonstrate one's own talent. Gold plating is especially interesting for project team members, as it is typical of projects with a marked professional component ― in other words, projects that involve specialists with proven experience and extensive professional autonomy. In these environments specialists often see the project as an opportunity to test and enrich their skill sets. There is therefore a strong temptation, in all good faith, to engage in gold plating, namely, to achieve more or higher-quality work that gratifies the professional but does not add value to the client's requests, and at the same time removes valuable resources from the project. As the saying goes, \"The best is the enemy of the good.\"", "ko": "프로젝트에서 금도금은 예상되는 결과를 불필요하게 향상하는 것, 즉 비용이 많이 들고 필요하지 않으며 목표와 관련하여 부가 가치가 낮은 특성을 추가하는 것으로, 다시 말해 자신의 재능을 입증하는 것 외에는 실질적인 명분이 없는 더 많은 것을 제공하는 것을 의미한다. 금도금은 특히 프로젝트 팀원들에 대해서 흥미로운데, 이는 전문적인 요소가 뚜렷한 프로젝트, 다시 말해 검증된 경험과 폭넓은 전문적 자율성을 갖춘 전문가가 참여하는 프로젝트에서 일반적이기 때문이다. 이러한 환경에서 전문가들은 종종 프로젝트를 자신의 다양한 능력을 테스트하고 강화할 기회로 여긴다. 따라서 선의로 금도금에 참여하려는 유혹, 즉 전문가를 만족시키지만, 고객의 요청에 가치를 더하지 않는 동시에 프로젝트에서 귀중한 자원을 없애는 더 많은 또는 더 높은 품질의 성과를 달성하려는 유혹이 있다. 속담에 있듯이, '최고는 좋음의 적'이다.", "read": [{"en": "Gold plating in the project means needlessly enhancing the expected results, namely, adding characteristics that are costly, not required, and that have low added value with respect to the targets ― in other words, giving more with no real justification other than to demonstrate one's own talent.", "ko": "프로젝트에서 금도금은 예상되는 결과를 불필요하게 향상하는 것, 즉 비용이 많이 들고 필요하지 않으며 목표와 관련하여 부가 가치가 낮은 특성을 추가하는 것으로, 다시 말해 자신의 재능을 입증하는 것 외에는 실질적인 명분이 없는 더 많은 것을 제공하는 것을 의미한다.", "chunks": [["Gold plating in the project means", "프로젝트에서 금도금은 ~을 의미한다"], ["needlessly enhancing the expected results,", "예상되는 결과를 불필요하게 향상하는 것을,"], ["namely, adding characteristics", "즉, 특성을 추가하는 것을"], ["that are costly, not required,", "비용이 많이 들고, 필요하지 않으며,"], ["and that have low added value", "그리고 부가 가치가 낮은"], ["with respect to the targets", "목표와 관련하여"], ["― in other words, giving more", "― 다시 말해, 더 많은 것을 제공하는 것이다"], ["with no real justification", "실질적인 명분 없이"], ["other than to demonstrate one's own talent.", "자신의 재능을 입증하는 것 외에는."]]}, {"en": "Gold plating is especially interesting for project team members, as it is typical of projects with a marked professional component ― in other words, projects that involve specialists with proven experience and extensive professional autonomy.", "ko": "금도금은 특히 프로젝트 팀원들에 대해서 흥미로운데, 이는 전문적인 요소가 뚜 1a\" stroke-width=\"1\"/>\n      <circle cx=\"28\" cy=\"11\" r=\"4\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 불필요한 장식(빨강): 테두리 프릴, 리본, 별 장식 -->\n      <rect x=\"-52\" y=\"-39\" width=\"104\" height=\"78\" rx=\"6\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n      <polygon points=\"-52.00,-44.00 -50.77,-40.70 -47.24,-40.55 -50.00,-38.35 -49.06,-34.95 -52.00,-36.90 -54.94,-34.95 -54.00,-38.35 -56.76,-40.55 -53.23,-40.70\" fill=\"#c8102e\"/><polygon points=\"52.00,-44.00 53.23,-40.70 56.76,-40.55 54.00,-38.35 54.94,-34.95 52.00,-36.90 49.06,-34.95 50.00,-38.35 47.24,-40.55 50.77,-40.70\" fill=\"#c8102e\"/><polygon points=\"-52.00,34.00 -50.77,37.30 -47.24,37.45 -50.00,39.65 -49.06,43.05 -52.00,41.10 -54.94,43.05 -54.00,39.65 -56.76,37.45 -53.23,37.30\" fill=\"#c8102e\"/><polygon points=\"52.00,34.00 53.23,37.30 56.76,37.45 54.00,39.65 54.94,43.05 52.00,41.10 49.06,43.05 50.00,39.65 47.24,37.45 50.77,37.30\" fill=\"#c8102e\"/><polygon points=\"0.00,-51.00 1.23,-47.70 4.76,-47.55 2.00,-45.35 2.94,-41.95 0.00,-43.90 -2.94,-41.95 -2.00,-45.35 -4.76,-47.55 -1.23,-47.70\" fill=\"#c8102e\"/>\n      <path d=\"M -10 -46 Q 0 -56 10 -46\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"56\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">needless extras · no value to client</text>\n    </g>\n  </g>\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"235\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">\"the best is the enemy of the good\" — 자원 낭비</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '금도금 = 필요 없는 특성을 더해 결과를 ‘과잉’ 향상'이고, 마지막은 '‘최고는 좋음의 적’'로 정리된다."}, {"no": "2", "title": "Ownership as a Bundle of Sticks", "ktitle": "소유권 = ‘막대 다발’", "field": "법·개념", "page": "기출 예제 02", "oneline": "변호사들은 소유권을 ‘막대 다발’에 비유한다.", "tldr": ["변호사들은 소유권을 ‘막대 다발’에 비유한다.", "소유권 = 분리·재결합 가능한 권리들의 묶음(판매·임대·저당…).", "한 토지에도 여러 당사자가 각자 ‘막대 하나’씩 소유할 수 있다."], "analogy": "하나의 ‘소유권’은 사실 여러 권리(팔 권리, 빌려줄 권리, 담보로 잡힐 권리…)를 묶은 다발이에요. 막대를 한 개씩 빼서 다른 사람에게 줄 수도 있는 거죠.", "bg": "분야는 법·개념이에요. 핵심 비유는 소유권을 ‘막대 다발(bundle of sticks)’로 보는 것 — 권리들의 묶음. → 소유가 하나가 아니라 여러 권리의 묶음이라는 시각에 주목하며 읽으세요.", "flow": [{"kind": "비유", "t": "소유권 = ‘막대 다발’", "d": "약 1세기 전 도입, 법학을 바꿈."}, {"kind": "의미", "t": "분리·재결합 가능한 권리들의 모음"}, {"kind": "‘내 것’", "t": "판매·임대·저당·증여·파괴 등 여러 막대를 소유"}, {"kind": "분할", "t": "한 토지 → 주인·은행·세입자·배관공·석유회사", "d": "각자 막대 하나씩."}, {"kind": "결론", "t": "소유권은 나눌 수 있는 권리 묶음이다"}], "quiz": [["‘막대 다발’ 비유가 유용한 이유는?", "소유권을 분리되고 다시 합쳐질 수 있는 권리들의 모음으로 볼 수 있게 해 주기 때문이에요."], ["한 토지에 막대가 나뉘는 예는?", "땅 주인·저당권을 가진 은행·세입자·진입 면허를 가진 배관공·광물권을 가진 석유회사가 각각 막대 하나씩 소유해요."], ["핵심 한 문장?", "소유권은 분리·재결합할 수 있는 여러 권리의 ‘막대 다발’이다."]], "vocab": [["ownership", "소유권"], ["bundle", "다발·묶음"], ["metaphor", "비유·은유"], ["interpersonal", "대인 관계의"], ["mortgage", "저당(잡히다)"], ["tenant", "세입자"], ["lease", "임대차 계약"]], "en": "Lawyers sometimes describe ownership as a bundle of sticks. This metaphor was introduced about a century ago, and it has dramatically transformed the teaching and practice of law. The metaphor is useful because it helps us see ownership as a grouping of interpersonal rights that can be separated and put back together. When you say It's mine in reference to a resource, often that means you own a lot of the sticks that make up the full bundle: the sell stick, the rent stick, the right to mortgage, license, give away, even destroy the thing. Often, though, we split the sticks up, as for a piece of land: there may be a landowner, a bank with a mortgage, a tenant with a lease, a plumber with a license to enter the land, an oil company with mineral rights. Each of these parties owns a stick in the bundle.", "ko": "변호사들은 때로는 소유권을 '막대 다발'로 묘사한다. 이 비유는 약 1세기 전에 도입되었고, 법학 교육과 실무를 극적으로 변화시켰다. 그 비유는 그것이 우리가 소유권을 분리될 수 있고 다시 합쳐질 수 있는 대인 관계적인 권리의 모음으로 보는 것을 도와 주기 때문에 유용하다. 어떤 자원에 관해 '그것은 내 것이다.'라고 말할 때, 흔히 그것은 여러분이 전체 다발을 구성하는 많은 막대, 즉 판매 막대, 임대 막대, 저당잡히고, 허가하고, 증여하며, 심지어 그것을 파괴할 권리를 소유한다는 것을 의미한다. 그러나 우리는 흔히 토지 한 면에 대해서처럼 그 막대들을 분할한다. 즉 땅 주인, 저당권을 가진 은행, 임대차 계약을 맺은 세입자, 토지 진입 면허를 가진 배관공, 광물에 대한 권리를 가진 석유 회사가 있을 수 있다. 이러한 각 당사자는 그 다발의 막대 하나를 소유한다.", "read": [{"en": "Lawyers sometimes describe ownership as a bundle of sticks.", "ko": "변호사들은 때로는 소유권을 '막대 다발'로 묘사한다.", "chunks": [["Lawyers sometimes describe", "변호사들은 때때로 묘사한다"], ["ownership as a bundle of sticks.", "소유권을 막대 다발로."]]}, {"en": "This metaphor was introduced about a century ago, and it has dramatically transformed the teaching and practice of law.", "ko": "이 비유는 약 1세기 전에 도입되었고, 법학 교육과 실무를 극적으로 변화시켰다.", "chunks": [["This metaphor was introduced", "이 비유는 도입되었다"], ["about a century ago,", "약 1세기 전에,"], ["and it has dramatically transformed", "그리고 그것은 극적으로 변화시켜왔다"], ["the teaching and practice of law.", "법학 교육과 실무를."]]}, {"en": "The metaphor is useful because it helps us see ownership as a grouping of interpersonal rights that can be separated and put back together.", "ko": "그 비유는 그것이 우리가 소유권을 분리될 수 있고 다시 합쳐질 수 있는 대인 관계적인 권리의 모음으로 보는 것을 도와 주기 때문에 유용하다.", "chunks": [["The metaphor is useful", "그 비유는 유용하다"], ["because it helps us see ownership", "왜냐하면 그것은 우리가 소유권을 보도록 돕기 때문이다"], ["as a grouping of interpersonal rights", "대인 관계적 권리의 모음으로"], ["that can be separated and put back together.", "분리되고 다시 합쳐질 수 있는."]]}, {"en": "When you say It's mine in reference to a resource, often that means you own a lot of the sticks that make up the full bundle: the sell stick, the rent stick, the right to mortgage, license, give away, even destroy the thing.", "ko": "어떤 자원에 관해 '그것은 내 것이다.'라고 말할 때, 흔히 그것은 여러분이 전체 다발을 구성하는 많은 막대, 즉 판매 막대, 임대 막대, 저당잡히고, 허가하고, 증여하며, 심지어 그것을 파괴할 권리를 소유한다는 것을 의미한다.", "chunks": [["When you say It's mine", "'그것은 내 것이다'라고 말할 때"], ["in reference to a resource,", "어떤 자원에 관해,"], ["often that means you own a lot of the sticks", "흔히 그것은 여러분이 많은 막대를 소유한다는 뜻이다"], ["that make up the full bundle:", "전체 다발을 구성하는:"], ["the sell stick, the rent stick,", "판매 막대, 임대 막대,"], ["the right to mortgage, license, give away,", "저당잡히고, 허가하고, 증여할 권리,"], ["even destroy the thing.", "심지어 그것을 파괴할 권리까지."]]}, {"en": "Often, though, we split the sticks up, as for a piece of land: there may be a landowner, a bank with a mortgage, a tenant with a lease, a plumber with a license to enter the land, an oil company with mineral rights.", "ko": "그러나 우리는 흔히 토지 한 면에 대해서처럼 그 막대들을 분할한다. 즉 땅 주인, 저당권을 가진 은행, 임대차 계약을 맺은 세입자, 토지 진입 면허를 가진 배관공, 광물에 대한 권리를 가진 석유 회사가 있을 수 있다.", "chunks": [["Often, though, we split the sticks up,", "그러나 흔히 우리는 막대들을 분할한다,"], ["as for a piece of land:", "예를 들어 토지 한 면에 대해서처럼:"], ["there may be a landowner,", "땅 주인,"], ["a bank with a mortgage,", "저당권을 가진 은행,"], ["a tenant with a lease,", "임대차 계약을 맺은 세입자,"], ["a plumber with a license to enter the land,", "토지 진입 면허를 가진 배관공,"], ["an oil company with mineral rights.", "광물에 대한 권리를 가진 석유 회사가 있을 수 있다."]]}, {"en": "Each of these parties owns a stick in the bundle.", "ko": "이러한 각 당사자는 그 다발의 막대 하나를 소유한다.", "chunks": [["Each of these parties", "이러한 각 당사자는"], ["owns a stick in the bundle.", "그 다발의 막대 하나를 소유한다."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 끈으로 묶인 막대 다발이 소유권 전체를 뜻하고, 오른쪽으로 막대들이 하나씩 분리되어 판매·임대·저당·증여·사용 등 서로 다른 권리자에게 나뉘는 그림\">\n  <text x=\"120\" y=\"34\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">소유권 = 막대 다발</text>\n  <line x1=\"120\" y1=\"117\" x2=\"99.5\" y2=\"62.5\" stroke=\"#1a1a1a\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"120\" y1=\"117\" x2=\"109.6\" y2=\"59.9\" stroke=\"#1a1a1a\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"120\" y1=\"117\" x2=\"120.0\" y2=\"59.0\" stroke=\"#1a1a1a\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"120\" y1=\"117\" x2=\"130.4\" y2=\"59.9\" stroke=\"#1a1a1a\" stroke-width=\"3\" stroke-linecap=\"round\"/><li roke-width=\"1.1\"/><text x=\"404\" y=\"128\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#1a1a1a\">저당</text><text x=\"538\" y=\"128\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#5e5e5e\">bank</text><line x1=\"350\" y1=\"162\" x2=\"385\" y2=\"162\" stroke=\"#1a1a1a\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><rect x=\"395\" y=\"151\" width=\"150\" height=\"22\" rx=\"4\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.1\"/><text x=\"404\" y=\"166\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#1a1a1a\">증여</text><text x=\"538\" y=\"166\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#5e5e5e\">heir</text><line x1=\"350\" y1=\"200\" x2=\"385\" y2=\"200\" stroke=\"#1a1a1a\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><rect x=\"395\" y=\"189\" width=\"150\" height=\"22\" rx=\"4\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.1\"/><text x=\"404\" y=\"204\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#1a1a1a\">사용</text><text x=\"538\" y=\"204\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#5e5e5e\">owner</text>\n  <text x=\"300\" y=\"248\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">ownership = a divisible bundle of rights</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '소유권 = ‘막대 다발’'이고, 마지막은 '소유권은 나눌 수 있는 권리 묶음이다'로 정리된다."}, {"no": "3", "title": "The Self-Fulfilling Talent Myth", "ktitle": "재능 결정론은 ‘자기충족적 예언’", "field": "교육·심리", "page": "no.01", "oneline": "‘재능이 성취를 결정한다’는 가정은 행동을 특정 방향으로 몬다.", "tldr": ["‘재능이 성취를 결정한다’는 가정은 행동을 특정 방향으로 몬다.", "즉시 못하는 아이는 ‘딴 거 해라’며 기회에서 밀려난다.", "그 결과 예언이 실현된다 — 생각이 ‘자기충족적’이 된다."], "analogy": "‘넌 수학에 소질 없어’라는 말을 들으면 그 분야를 멀리하게 되고, 결국 정말 못하게 되죠. 처음의 짐작이 ‘예언’이 되어 스스로 이루어지는 거예요.", "bg": "분야는 교육·심리예요. ‘재능이 성취를 결정한다’는 가정이 핵심 소재. → 이 믿음이 행동을 어떻게 ‘자기 충족적’으로 몰아가는지에 주목하며 읽으세요.", "flow": [{"kind": "가정", "t": "‘재능이 성취를 결정한다’"}, {"kind": "행동", "t": "즉시 못하는 아이 → ‘다른 거 해라’", "d": "스포츠·음악·수학에서 밀려남."}, {"kind": "결과", "t": "예언이 실현됨", "d": "정말 그 분야를 못하게 됨."}, {"kind": "결론", "t": "생각이 ‘자기충족적’이 된다"}], "quiz": [["재능에 대한 가정이 왜 위험한가?", "‘선천적 재능이 없으면 못한다’는 가정이 아이를 그 분야에서 일찍 밀어내, 시도 기회를 빼앗기 때문이에요."], ["예언이 ‘실현된다’는 말의 뜻은?", "스포츠·음악·수학을 ‘잊으라’던 아이가 정말 그 분야에 능숙해지지 못한 채 자란다는 거예요."], ["핵심 한 문장?", "재능이 성취를 결정한다는 믿음은 아이를 밀어내 그 예언을 스스로 실현시키는 자기충족적 예언이 된다."]], "vocab": [["talent", "재능"], ["determining", "결정적인"], ["innately", "선천적으로"], ["excel", "뛰어나다·탁월하다"], ["tone-deaf", "음치의"], ["self-fulfilling", "자기충족적인"], ["prediction", "예언·예측"]], "en": "When people assume that talent plays a major, even determining, role in how accomplished a person can become, that assumption points one toward certain decisions and actions. If you assume that people who are not innately gifted are never going to be good at something, then the children who don't excel at something right away are encouraged to try something else. The clumsy ones are pushed away from sports, the ones who can't carry a tune right away are told they should try something other than music, and the ones who don't immediately get comfortable with numbers are told they are no good at math. And, no surprise, the predictions come true: the girl who was told to forget about sports never becomes any good at hitting a tennis ball or kicking a soccer ball; the boy who was told he was tone-deaf never learns to play a musical instrument or to sing well; and the children who were told they were no good at math grow up believing it. The idea becomes self-fulfilling.", "ko": "재능이 한 개인이 얼마나 기량이 뛰어날 수 있는지에 대해 주된, 심지어는 결정적인 역할을 한다고 사람들이 가정할 때, 그 가정은 그 개인을 특정한 결정과 행동으로 향하게 한다. 만약 여러분이 선천적으로 탁월한 재능을 지니지 않은 사람들은 결코 어떤 것도 잘할 수 없다고 가정한다면, 어떤 것에서 즉시 탁월하지 못한 아이들은 다른 것을 시도하도록 권장된다. 서투른 아이들은 스포츠에서 밀려나고, 곧바로 정확하게 노래하지 못하는 아이들은 음악 이외의 것을 시도해야 한다는 말을 듣게 되며, 숫자에 바로 익숙해지지 못한 아이들은 수학에 소질이 없다는 말을 듣는다. 그리고 예상대로 그 예언은 실현된다: 다시 말해, 스포츠는 잊으라는 말을 들은 여자아이는 결코 테니스공을 치거나 축구공을 차는 데 능숙해지지 않고, 음치라는 말을 들은 남자아이는 결코 악기를 연주하거나 노래를 잘 부르는 법을 배우지 못하며, 수학에 소질이 없다는 말을 들은 아이들은 그것을 믿으면서 자라게 된다. 그 생각은 자기 충족적이 된다.", "read": [{"en": "When people assume that talent plays a major, even determining, role in how accomplished a person can become, that assumption points one toward certain decisions and actions.", "ko": "재능이 한 개인이 얼마나 기량이 뛰어날 수 있는지에 대해 주된, 심지어는 결정적인 역할을 한다고 사람들이 가정할 때, 그 가정은 그 개인을 특정한 결정과 행동으로 향하게 한다.", "chunks": [["When people assume that", "사람들이 ~라고 가정할 때"], ["talent plays a major, even determining, role", "재능이 주된, 심지어는 결정적인 역할을 한다고"], ["in how accomplished a person can become,", "한 개인이 얼마나 기량이 뛰어날 수 있는지에 대해,"], ["that assumption points one", "그 가정은 그 개인을 향하게 한다"], ["toward certain decisions and actions.", "특정한 결정과 행동으로."]]}, {"en": "If you assume that people who are not innately gifted are never going to be good at something, then the children who don't excel at something right away are encouraged to try something else.", "ko": "만약 여러분이 선천적으로 탁월한 재능을 지니지 않은 사람들은 결코 어떤 것도 잘할 수 없다고 가정한다면, 어떤 것에서 즉시 탁월하지 못한 아이들은 다른 것을 시도하도록 권장된다.", "chunks": [["If you assume that", "만약 여러분이 ~라고 가정한다면"], ["people who are not innately gifted", "선천적으로 탁월한 재능을 지니지 않은 사람들이"], ["are never going to be good at something,", "결코 어떤 것도 잘할 수 없다고,"], ["then the children who don't excel", "그러면 탁월하지 못한 아이들은"], ["at something right away", "즉시 어떤 것에서"], ["are encouraged to try something else.", "다른 것을 시도하도록 권장된다."]]}, {"en": "The clumsy ones are pushed away from sports, the ones who can't carry a tune right away are told they should try something other than music, and the ones who don't immediately get comfortable with numbers are told they are no good at math.", "ko": "서투른 아이들은 스포츠에서 밀려나고, 곧바로 정확하게 노래하지 못하는 아이들은 음악 이외의 것을 시도해야 한다는 말을 듣게 되며, 숫자에 바로 익숙해지지 못한 아이들은 수학에 소질이 없다는 말을 듣는다.", "chunks": [["The clumsy ones", "서투른 아이들은"], ["are pushed away from sports,", "스포츠에서 밀려나고,"], ["the ones who can't carry a tune right away", "곧바로 정확하게 노래하지 못하는 아이들은"], ["are told they should try something other than music,", "음악 이외의 것을 시도해야 한다는 말을 듣고,"], ["and the ones who don't immediately get comfortable with numbers", "그리고 숫자에 바로 익숙해지지 못한 아이들은"], ["are told they are no good at math.", "수학에 소질이 없다는 말을 듣는다."]]}, {"en": "And, no surprise, the predictions come true: the girl who was told to forget about sports never becomes any good at hitting a tennis ball or kicking a soccer ball; the boy who was told he was tone-deaf never learns to play a musical instrument or to sing well; and the children who were told they were no good at math grow up believing it.", "ko": "그리고 예상대로 그 예언은 실현된다: 다시 말해, 스포츠는 잊으라는 말을 들은 여자아이는 결코 테니스공을 치거나 축구공을 차는 데 능숙해지지 않고, 음치라는 말을 들은 남자아이는 결코 악기를 연주하거나 노래를 잘 부르는 법을 배우지 못하며, 수학에 소질이 없다는 말을 들은 아이들은 그것을 믿으면서 자라게 된다.", "chunks": [["And, no surprise,", "그리고 예상대로,"], ["the predictions come true:", "그 예언은 실현된다:"], ["the girl who was told to forget about sports", "스포츠는 잊으라는 말을 들은 여자아이는"], ["never becomes any good", "결코 능숙해지지 않고"], ["at hitting a tennis ball or kicking a soccer ball;", "테니스공을 치거나 축구공을 차는 데;"], ["the boy who was told he was tone-deaf", "음치라는 말을 들은 남자아이는"], ["never learns to play a musical instrument or to sing well;", "결코 악기를 연주하거나 노래를 잘 부르는 법을 배우지 못하며;"], ["and the children who were told they were no good at math", "그리고 수학에 소질이 없다는 말을 들은 아이들은"], ["grow up believing it.", "그것을 믿으면서 자라게 된다."]]}, {"en": "The idea becomes self-fulfilling.", "ko": "그 생각은 자기 충족적이 된다.", "chunks": [["The idea becomes", "그 생각은 ~이 된다"], ["self-fulfilling.", "자기 충족적인."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"‘재능이 성취를 결정한다’는 믿음이 아이를 그 분야에서 밀어내고, 그래서 정말 못하게 되어 다시 그 믿음을 강화하는 순환 고리 그림\">\n  <text x=\"300\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">자기충족적 예언 — 믿음이 결과를 만든다</text>\n  <line x1=\"320.0\" y1=\"74.05255888325765\" x2=\"349.2820323027551\" y2=\"155.94744111674234\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/><polygon points=\"349.2820323027551,155.94744111674234 342.9,145.1 347.4,143.5\" fill=\"#1FA34A\"/><line x1=\"329.2820323027551\" y1=\"175.0\" x2=\"270.7179676972449\" y2=\"175.0\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/><polygon points=\"270.7179676972449,175.0 283.1,172.6 283.1,177.4\" fill=\"#1FA34A\"/><line x1=\"250.7179676972449\" y1=\"155.94744111674234\" x2=\"280.0\" y2=\"74.05255888325765\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/><polygon points=\"280.0,74.05255888325765 278.1,86.5 273.6,84.9\" fill=\"#1FA34A\"/><rect x=\"228\" y=\"37\" width=\"144\" height=\"36\" rx=\"6\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/><text x=\"300\" y=\"53\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">‘재능이 결정한다’ 믿음</text><text x=\"300\" y=\"66\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1a1a1a\">belief</text><rect x=\"297\" y=\"157\" width=\"144\" height=\"36\" rx=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/><text x=\"369\" y=\"173\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">못하는 아이 → 밀어냄</text><text x=\"369\" y=\"186\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\">pushed out</text><rect x=\"159\" y=\"157\" width=\"144\" height=\"36\" rx=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/><text x=\"231\" y=\"173\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">정말 그 분야를 못함</text><text x=\"231\" y=\"186\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\">becomes true</text>\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">the assumption becomes self-fulfilling</text>\n</svg>", "caption": "이 지문은 4단계로 전개된다. 첫 출발점은 '‘재능이 성취를 결정한다’'이고, 마지막은 '생각이 ‘자기충족적’이 된다'로 정리된다."}, {"no": "4", "title": "Authentic Brand Storytelling", "ktitle": "진정성 스토리텔링 — 브랜드는 영웅이 아닌 멘토", "field": "마케팅", "page": "no.02", "oneline": "연결의 시대, 소셜미디어가 권력을 마케터→소비자로 옮겼다.", "tldr": ["연결의 시대, 소셜미디어가 권력을 마케터→소비자로 옮겼다.", "진정성 스토리텔링은 조작이 아니라 정직·진심으로 깊이 연결한다.", "브랜드는 ‘영웅’이 아니라 고객의 손을 잡는 ‘멘토’가 된다."], "analogy": "좋은 브랜드 광고는 자기 자랑(영웅)이 아니라, 고객을 주인공 삼아 ‘당신의 이야기, 내가 곁에서 돕겠다’는 멘토예요. 소비자가 직접 전하는 이야기가 더 힘이 세죠.", "bg": "분야는 마케팅이에요. ‘연결의 시대’에 소셜미디어가 권력을 마케터에서 소비자로 옮겼다는 것이 배경. → 브랜드 스토리텔링에서 ‘진정성’이 왜 중요해지는지에 주목하며 읽으세요.", "flow": [{"kind": "배경", "t": "연결의 시대 — 모바일·소셜미디어"}, {"kind": "전환", "t": "권력이 마케터 → 소비자로", "d": "소비자의 이야기가 더 강력."}, {"kind": "방식", "t": "진정성 스토리텔링 = 조작 ✗, 정직·진심"}, {"kind": "장치", "t": "감정에 싸인 이성적 메시지로 고객을 공감시킴"}, {"kind": "결론", "t": "브랜드 = 영웅이 아니라 ‘멘토’"}], "quiz": [["소셜미디어가 마케팅에서 바꾼 것은?", "권력을 마케터에서 소비자로 옮겨, 소비자가 직접 전하는 이야기가 브랜드의 이야기보다 더 강력해졌어요."], ["‘진정성 스토리텔링’의 핵심은?", "감정·이성을 조작 수단으로 쓰지 않고, 정직·진심으로 고객과 더 깊은 수준에서 연결하는 거예요."], ["핵심 한 문장?", "진정성 스토리텔링에서 강한 브랜드는 영웅이 아니라 고객 곁의 멘토로서 그 손을 잡아 준다."]], "vocab": [["connectivity", "연결(성)"], ["authentic", "진정성 있는·진짜의"], ["potent", "강력한"], ["manipulation", "조작"], ["sincerely", "진심으로·성실히"], ["empathetic", "공감하는"], ["relate to", "공감하다·이해하다"]], "en": "We are living in the age of connectivity driven by the permeating and relatively inexpensive and proliferated wireless broadband, fastest-growing mobile technology, and social media mediated peer-to-peer communication. As a result, marketing is changing with the power of authentic, relevant, and experiential storytelling. Social media is shifting the power from marketers to consumers where the stories told by the consumers themselves are often more potent than the ones told by the brands. Authentic storytelling does not use rational and emotional communication as a means of manipulation; instead, it uses the power of storytelling honestly and sincerely to connect with the customer at a deeper level. Authentic storytelling invites customers on a transformational journey through a rational message wrapped in emotion. \"A well-told story captures our attention, holds us in suspense, and pays off with a meaningful emotional experience.\" A well-told brand story uses characters through whose eyes the customer can see the world and be empathetic for the character. Customers therefore can relate to the character. Through demonstrating the day-to-day life challenges of their customers, strong brands hold their hands as a mentor rather than the hero.", "ko": "우리는 보급되고 있는 비교적 저렴하고 빠르게 확산된 무선 브로드밴드, 가장 빠르게 성장하는 모바일 기술, 그리고 소셜 미디어를 통한 개인 대 개인 커뮤니케이션이 주도하는 연결의 시대에 살고 있다. 그 결과, 마케팅은 진심에서 우러나오고, 관련성 있으며, 경험적인 스토리텔링의 힘으로 변화하고 있다. 소셜 미디어는 마케터에서 소비자로 권력을 이동시키고 있으며, 소비자가 직접 전하는 이야기가 흔히 브랜드가 전하는 이야기보다 더 강력하다. 진심에서 우러나온 스토리텔링은 합리적이고 감정적인 커뮤니케이션을 조작의 수단으로 사용하지 않고, 대신, 그것은 고객과 더 깊은 수준에서 연결되기 위해 스토리텔링의 힘을 정직하고 성실하게 사용한다. 진심에서 우러나온 스토리텔링은 감정으로 포장된 합리적인 메시지를 통해 고객을 변화의 여정으로 초대한다. \"잘 전달된 이야기는 우리의 주의를 끌고, 우리가 긴장감을 유지하게 하며, 의미 있는 감정적 경험으로 보상한다.\" 잘 전달된 브랜드 이야기는 고객이 캐릭터의 눈을 통해 세상을 보고 그것에 공감할 수 있는 캐릭터들을 사용한다. 따라서 고객은 그 캐릭터에게 공감할 수 있다. 자기 고객들의 일상적인 삶의 도전을 보여 주는 것을 통해 강력한 브랜드는 영웅이 아니라 멘토로서 그들의 손을 잡아 준다.", "read": [{"en": "We are living in the age of connectivity driven by the permeating and relatively inexpensive and proliferated wireless broadband, fastest-growing mobile technology, and social media mediated peer-to-peer communication.", "ko": "우리는 보급되고 있는 비교적 저렴하고 빠르게 확산된 무선 브로드밴드, 가장 빠르게 성장하는 모바일 기술, 그리고 소셜 미디어를 통한 개인 대 개인 커뮤니케이션이 주도하는 연결의 시대에 살고 있다.", "chunks": [["We are living in the age of connectivity", "우리는 연결의 시대에 살고 있다"], ["driven by the permeating and", "~에 의해 주도되는 — 보급되고 있고"], ["relatively inexpensive and proliferated wireless broadband,", "비교적 저렴하고 확산된 무선 브로드밴드,"], ["fastest-growing mobile technology,", "가장 빠르게 성장하는 모바일 기술,"], ["and social media mediated peer-to-peer communication.", "그리고 소셜 미디어를 통한 개인 대 개인 커뮤니케이션이."]]}, {"en": "As a result, marketing is changing with the power of authentic, relevant, and experiential storytelling.", "ko": "그 결과, 마케팅은 진심에서 우러나오고, 관련성 있으며, 경험적인 스토리텔링의 힘으로 변화하고 있다.", "chunks": [["As a result,", "그 결과,"], ["marketing is changing", "마케팅은 변화하고 있다"], ["with the power of authentic, relevant,", "진심에서 우러나오고, 관련성 있으며,"], ["and experiential storytelling.", "경험적인 스토리텔링의 힘으로."]]}, {"en": "Social media is shifting the power from marketers to consumers where the stories told by the consumers themselves are often more potent than the ones told by the brands.", "ko": "소셜 미디어는 마케터에서 소비자로 권력을 이동시키고 있으며, 소비자가 직접 전하는 이야기가 흔히 브랜드가 전하는 이야기보다 더 강력하다.", "chunks": [["Social media is shifting the power", "소셜 미디어는 권력을 이동시키고 있다"], ["from marketers to consumers", "마케터에서 소비자로"], ["where the stories told by the consumers themselves", "그곳에서 소비자가 직접 전하는 이야기가"], ["are often more potent", "흔히 더 강력하다"], ["than the ones told by the brands.", "브랜드가 전하는 이야기보다."]]}, {"en": "Authentic storytelling does not use rational and emotional communication as a means of manipulation; instead, it uses the power of storytelling honestly and sincerely to connect with the customer at a deeper level.", "ko": "진심에서 우러나온 스토리텔링은 합리적이고 감정적인 커뮤니케이션을 조작의 수단으로 사용하지 않고, 대신, 그것은 고객과 더 깊은 수준에서 연결되기 위해 스토리텔링의 힘을 정직하고 성실하게 사용한다.", "chunks": [["Authentic storytelling", "진심에서 우러나온 스토리텔링은"], ["does not use rational and emotional communication", "합리적이고 감정적인 커뮤니케이션을 사용하지 않는다"], ["as a means of manipulation;", "조작의 수단으로;"], ["instead, it uses the power of storytelling", "대신, 그것은 스토리텔링의 힘을 사용한다"], ["honestly and sincerely", "정직하고 성실하게"], ["to connect with the customer", "고객과 연결되기 위해"], ["at a deeper level.", "더 깊은 수준에서."]]}, {"en": "Authentic storytelling invites customers on a transformational journey through a rational message wrapped in emotion.", "ko": "진심에서 우러나온 스토리텔링은 감정으로 포장된 합리적인 메시지를 통해 고객을 변화의 여정으로 초대한다.", "chunks": [["Authentic storytelling invites customers", "진심에서 우러나온 스토리텔링은 고객을 초대한다"], ["on a transformational journey", "변화의 여정으로"], ["through a rational message", "합리적인 메시지를 통해"], ["wrapped in emotion.", "감정으로 포장된."]]}, {"en": "\"A well-told story captures our attention, holds us in suspense, and pays off with a meaningful emotional experience.\"", "ko": "\"잘 전달된 이야기는 우리의 주의를 끌고, 우리가 긴장감을 유지하게 하며, 의미 있는 감정적 경험으로 보상한다.\"", "chunks": [["\"A well-told story", "\"잘 전달된 이야기는"], ["captures our attention,", "우리의 주의를 끌고,"], ["holds us in suspense,", "우리가 긴장감을 유지하게 하며,"], ["and pays off", "그리고 보상한다"], ["with a meaningful emotional experience.\"", "의미 있는 감정적 경험으로.\""]]}, {"en": "A well-told brand story uses characters through whose eyes the customer can see the world and be empathetic for the character.", "ko": "잘 전달된 브랜드 이야기는 고객이 캐릭터의 눈을 통해 세상을 보고 그 캐릭터에게 공감할 수 있는 캐릭터들을 사용한다.", "chunks": [["A well-told brand story", "잘 전달된 브랜드 이야기는"], ["uses characters", "캐릭터들을 사용한다"], ["through whose eyes", "그 눈을 통해"], ["the customer can see the world", "고객이 세상을 볼 수 있는"], ["and be empathetic for the character.", "그리고 그 캐릭터에게 공감할 수 있는."]]}, {"en": "Customers therefore can relate to the character.", "ko": "따라서 고객은 그 캐릭터에게 공감할 수 있다.", "chunks": [["Customers therefore", "따라서 고객은"], ["can relate to the character.", "그 캐릭터에게 공감할 수 있다."]]}, {"en": "Through demonstrating the day-to-day life challenges of their customers, strong brands hold their hands as a mentor rather than the hero.", "ko": "자기 고객들의 일상적인 삶의 도전을 보여 주는 것을 통해 강력한 브랜드는 영웅이 아니라 멘토로서 그들의 손을 잡아 준다.", "chunks": [["Through demonstrating", "~을 보여 주는 것을 통해"], ["the day-to-day life challenges of their customers,", "자기 고객들의 일상적인 삶의 도전을,"], ["strong brands hold their hands", "강력한 브랜드는 그들의 손을 잡아 준다"], ["as a mentor", "멘토로서"], ["rather than the hero.", "영웅이 아니라."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 옛 방식에서는 브랜드가 영웅 자리에 있고, 오른쪽 연결의 시대에는 소비자가 영웅이 되고 브랜드는 곁에서 돕는 멘토 자리로 옮겨간 대조 그림\">\n  <text x=\"150\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">옛 방식 — 브랜드가 영웅</text>\n  <text x=\"450\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">연결의 시대 — 소비자가 영웅</text>\n  <line x1=\"300\" y1=\"44\" x2=\"300\" y2=\"210\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <!-- 좌: 브랜드가 단상 위 영웅 -->\n  <g transform=\"translate(110,70)\">\n    <rect x=\"-6\" y=\"78\" width=\"92\" height=\"14\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n    <rect x=\"14\" y=\"60\" width=\"52\" height=\"18\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n    <g transform=\"translate(40,40)\"><circle cx=\"0\" cy=\"-14.0\" r=\"9.0\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/><circle cx=\"-3.0\" cy=\"-15.0\" r=\"1.2\" fill=\"#c8102e\"/><circle cx=\"3.0\" cy=\"-15.0\" r=\"1.2\" fill=\"#c8102e\"/><path d=\"M -3.0 -10.0 Q 0 -8.0 3.0 -10.0\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"0.9\"/><line x1=\"0\" y1=\"-5.0\" x2=\"0\" y2=\"20.0\" stroke=\"#c8102e\" stroke-width=\"1.4\"/><line x1=\"0\" y1=\"2.0\" x2=\"-11.0\" y2=\"10.0\" stroke=\"#c8102e\" stroke-width=\"1.4\"/><line x1=\"0\" y1=\"2.0\" x2=\"11.0\" y2=\"10.0\" stroke=\"#c8102e\" stroke-width=\"1.4\"/><line x1=\"0\" y1=\"20.0\" x2=\"-8.0\" y2=\"38.0\" stroke=\"#c8102e\" stroke-width=\"1.4\"/><line x1=\"0\" y1=\"20.0\" x2=\"8.0\" y2=\"38.0\" stroke=\"#c8102e\" stroke-width=\"1.4\"/></g>\n    <text x=\"40\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">브랜드</text>\n    <text x=\"40\" y=\"108\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">\"look at me — the hero\"</text>\n  </g>\n  <!-- 우: 소비자 영웅 + 브랜드 멘토 곁에서 -->\n  <g transform=\"translate(360,70)\">\n    <rect x=\"44\" y=\"78\" width=\"60\" height=\"14\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n    <rect x=\"58\" y=\"60\" width=\"32\" height=\"18\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n    <g transform=\"translate(74,40)\"><circle cx=\"0\" cy=\"-15.400000000000002\" r=\"9.9\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/><circle cx=\"-3.3000000000000003\" cy=\"-16.5\" r=\"1.2\" fill=\"#1FA34A\"/><circle cx=\"3.3000000000000003\" cy=\"-16.5\" r=\"1.2\" fill=\"#1FA34A\"/><path d=\"M -3.3000000000000003 -11.0 Q 0 -8.8 3.3000000000000003 -11.0\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/><line x1=\"0\" y1=\"-5.5\" x2=\"0\" y2=\"22.0\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/><line x1=\"0\" y1=\"2.2\" x2=\"-12.100000000000001\" y2=\"11.0\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/><line x1=\"0\" y1=\"2.2\" x2=\"12.100000000000001\" y2=\"11.0\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/><line x1=\"0\" y1=\"22.0\" x2=\"-8.8\" y2=\"41.800000000000004\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/><line x1=\"0\" y1=\"22.0\" x2=\"8.8\" y2=\"41.800000000000004\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/></g>\n    <text x=\"74\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">소비자 = 영웅</text>\n    <g transform=\"translate(20,66)\"><circle cx=\"0\" cy=\"-10.08\" r=\"6.4799999999999995\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/><circle cx=\"-2.16\" cy=\"-10.799999999999999\" r=\"1.2\" fill=\"#1a1a1a\"/><circle cx=\"2.16\" cy=\"-10.799999999999999\" r=\"1.2\" fill=\"#1a1a1a\"/><path d=\"M -2.16 -7.199999999999999 Q 0 -5.76 2.16 -7.199999999999999\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/><line x1=\"0\" y1=\"-3.5999999999999996\" x2=\"0\" y2=\"14.399999999999999\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"1.44\" x2=\"-7.92\" y2=\"7.199999999999999\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"1.44\" x2=\"7.92\" y2=\"7.199999999999999\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"14.399999999999999\" x2=\"-5.76\" y2=\"27.36\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"14.399999999999999\" x2=\"5.76\" y2=\"27.36\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/></g>\n    <text x=\"6\" y=\"100\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#1a1a1a\">브랜드 = 멘토</text>\n    <line x1=\"30\" y1=\"62\" x2=\"52\" y2=\"52\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/><polygon points=\"52,52 41.7,59.3 39.7,54.9\" fill=\"#1a1a1a\"/>\n    <text x=\"74\" y=\"116\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">brand guides from the side</text>\n  </g>\n  <text x=\"300\" y=\"238\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">the brand is the mentor, not the hero</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '연결의 시대 — 모바일·소셜미디어'이고, 마지막은 '브랜드 = 영웅이 아니라 ‘멘토’'로 정리된다."}, {"no": "5", "title": "The Digital 'Moveable Feast'", "ktitle": "디지털 ‘움직이는 향연’", "field": "미디어·사회", "page": "no.03", "oneline": "‘움직이는 향연’ = 언제 어디서나 연결될 가능성을 개념화한 말.", "tldr": ["‘움직이는 향연’ = 언제 어디서나 연결될 가능성을 개념화한 말.", "디지털 시대 정보는 ‘누구에게서든 모두에게로’ 이동한다.", "각자 정보 ‘요리’를 맛보고 나누는 식탁 — 어디 가든 함께 있다."], "analogy": "모두가 음식 한 접시씩 들고 온 뷔페 같아요. 각자 남의 요리(정보)를 맛보고 자기 것도 내놓죠. 그 식탁은 전 세계를 돌아다니며, 어디를 가든 늘 당신을 따라다녀요.", "bg": "분야는 미디어·사회예요. 핵심 표현은 ‘움직이는 향연(moveable feast)’ — 언제 어디서나 연결될 가능성. → 늘 연결될 수 있다는 상태가 무엇을 의미하는지에 주목하며 읽으세요.", "flow": [{"kind": "용어", "t": "‘움직이는 향연’ = 언제·어디서나 연결 가능성"}, {"kind": "변화", "t": "정보가 일방향 ✗ → ‘누구에게서든 모두에게로’"}, {"kind": "비유", "t": "정보 ‘요리’로 가득 찬 식탁", "d": "각자 남의 요리를 한 조각씩 맛봄."}, {"kind": "확장", "t": "전 세계 수십억 향연과 상호작용(감시 포함)"}, {"kind": "결론", "t": "어디 가든 ‘함께 있다’"}], "quiz": [["디지털 시대 정보 흐름의 특징은?", "공식 매체→소비자 직선뿐 아니라 ‘누구에게서든 다른 모두에게로’ 이동할 가능성이 있어요."], ["‘향연(식탁)’ 비유가 말하는 것은?", "각자 정보 ‘요리’를 차려 놓고 남의 것을 맛보고 자기 것도 나누며, 그 식탁이 전 세계로 돌아다닌다는 거예요."], ["핵심 한 문장?", "디지털 시대의 정보 교류는 누구나 차리고 맛보는 ‘움직이는 향연’이며, 어디 가든 우리와 함께 있다."]], "vocab": [["conceptualize", "개념화하다"], ["potentiality", "가능성·잠재력"], ["circulate", "순환하다·돌다"], ["outlet", "(매체) 매장·창구"], ["interact", "상호 작용하다"], ["aptly", "적절하게"], ["component", "구성 요소"]], "en": "The expression \"Moveable Feast\" originally referred to the changing date of religious celebrations. It was later adopted by Ernest Hemingway to describe his experience of living in Paris. We use the term Moveable Feast to conceptualize the potentiality to connect with people, ideas, and information at any time and in any place. In the Digital Age, information circulates and travels not only in a straight line from official media outlets to consumers but has the potential to move from anyone to everyone else. The Moveable Feast is a table filled with information \"dishes\" that have been prepared by participating members of the feast. Each person may try a slice of everyone else's dish. Furthermore, this feast moves around the entire world and interacts with billions of other feasts-of-digits, complete with servings of information that are monitored by platforms and governments. At any given point in time, each person has the potential to connect with any other person by sampling their information, and perhaps by \"dishing dirt\" of their own, or by rejecting dishes that are not particularly tasty. This feast features all the components of social interaction in complex, dynamic information environments; as Hemingway most aptly described, \"it stays with you\" wherever you go.", "ko": "'움직이는 향연'이라는 표현은 원래 종교 축제의 변동되는 날짜와 관련이 있었다. 이 표현은 이후에 Ernest Hemingway가 자신이 파리에서 살았던 경험을 묘사하기 위해 채택했다. 우리는 '언제 어디서나' 사람들, 아이디어 및 정보와 연결될 수 있는 가능성을 개념화하기 위해 움직이는 향연이라는 용어를 사용한다. 디지털 시대에 정보는 공식 매스컴에서 소비자에게 직선으로 순환하고 이동할 뿐만 아니라 '누구에게서든 다른 모든 사람에게로' 이동할 수 있는 가능성이 있다. 움직이는 향연은 향연의 참가지들이 준비한 정보 '요리'로 가득 찬 식탁이다. 각 사람은 다른 모든 사람의 요리의 한 조각을 맛볼지도 모른다. 게다가 이 향연은 전 세계를 돌며 플랫폼과 정부에 의해 감시되는 정보의 제공을 포함한 수십억 개의 다른 디지털 향연과 상호 작용한다. 언제든지 각 사람은 그들(다른 사람)의 정보를 맛보고, 어쩌면 자신의 '비밀을 공유함'으로써, 혹은 특별히 맛있지 않은 요리(정보)를 거부함으로써 다른 어느 누구와도 연결될 가능성을 가지고 있다. 이 향연은 복잡하고 역동적인 정보 환경에서의 사회적 상호 작용의 모든 구성 요소를 특징으로 하고 있으며, Hemingway가 가장 적절하게 묘사했듯이 어디를 가든지 \"그것은 당신과 함께 있다.\"", "read": [{"en": "The expression \"Moveable Feast\" originally referred to the changing date of religious celebrations.", "ko": "'움직이는 향연'이라는 표현은 원래 종교 축제의 변동되는 날짜와 관련이 있었다.", "chunks": [["The expression \"Moveable Feast\"", "'움직이는 향연'이라는 표현은"], ["originally referred to", "원래 ~과 관련이 있었다"], ["the changing date of religious celebrations.", "종교 축제의 변동되는 날짜."]]}, {"en": "It was later adopted by Ernest Hemingway to describe his experience of living in Paris.", "ko": "이 표현은 이후에 Ernest Hemingway가 자신이 파리에서 살았던 경험을 묘사하기 위해 채택했다.", "chunks": [["It was later adopted", "이 표현은 이후에 채택되었다"], ["by Ernest Hemingway", "Ernest Hemingway에 의해"], ["to describe his experience", "그의 경험을 묘사하기 위해"], ["of living in Paris.", "파리에서 살았던."]]}, {"en": "We use the term Moveable Feast to conceptualize the potentiality to connect with people, ideas, and information at any time and in any place.", "ko": "우리는 '언제 어디서나' 사람들, 아이디어 및 정보와 연결될 수 있는 가능성을 개념화하기 위해 움직이는 향연이라는 용어를 사용한다.", "chunks": [["We use the term Moveable Feast", "우리는 '움직이는 향연'이라는 용어를 사용한다"], ["to conceptualize the potentiality", "~할 가능성을 개념화하기 위해"], ["to connect with people, ideas, and information", "사람들, 아이디어 및 정보와 연결될"], ["at any time and in any place.", "언제 어디서나."]]}, {"en": "In the Digital Age, information circulates and travels not only in a straight line from official media outlets to consumers but has the potential to move from anyone to everyone else.", "ko": "디지털 시대에 정보는 공식 매스컴에서 소비자에게 직선으로 순환하고 이동할 뿐만 아니라 '누구에게서든 다른 모든 사람에게로' 이동할 수 있는 가능성이 있다.", "chunks": [["In the Digital Age,", "디지털 시대에,"], ["information circulates and travels", "정보는 순환하고 이동한다"], ["not only in a straight line", "직선으로뿐만 아니라"], ["from official media outlets to consumers", "공식 매스컴에서 소비자에게로"], ["but has the potential to move", "이동할 가능성이 있다"], ["from anyone to everyone else.", "누구에게서든 다른 모든 사람에게로."]]}, {"en": "The Moveable Feast is a table filled with information \"dishes\" that have been prepared by participat ation environments; as Hemingway most aptly described, \"it stays with you\" wherever you go.", "ko": "이 향연은 복잡하고 역동적인 정보 환경에서의 사회적 상호 작용의 모든 구성 요소를 특징으로 하고 있으며, Hemingway가 가장 적절하게 묘사했듯이 어디를 가든지 \"그것은 당신과 함께 있다.\"", "chunks": [["This feast features", "이 향연은 ~을 특징으로 한다"], ["all the components of social interaction", "사회적 상호 작용의 모든 구성 요소를"], ["in complex, dynamic information environments;", "복잡하고 역동적인 정보 환경에서;"], ["as Hemingway most aptly described,", "Hemingway가 가장 적절하게 묘사했듯이,"], ["\"it stays with you\"", "\"그것은 당신과 함께 있다\""], ["wherever you go.", "어디를 가든지."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"둥근 식탁에 뉴스·밈·아이디어·영상 같은 정보 요리들이 놓여 있고, 각자 옆 사람의 요리를 한 조각씩 맛보듯 정보를 주고받는 ‘움직이는 향연’ 그림\">\n  <text x=\"300\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">움직이는 향연 — 정보 요리를 나눠 맛봄</text>\n  <ellipse cx=\"300\" cy=\"120\" rx=\"160\" ry=\"40\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"1.2\"/>\n  <line x1=\"323.63572234317115\" y1=\"64.08282436348586\" x2=\"440.9091043758722\" y2=\"88.91717563651414\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><polygon points=\"440.9091043758722,88.91717563651414 428.3,88.7 429.3,84.0\" fill=\"#999\"/><line x1=\"464.54482671904333\" y1=\"103.0\" x2=\"464.5448267190434\" y2=\"137.0\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><polygon points=\"464.5448267190434,137.0 462.1,124.6 466.9,124.6\" fill=\"#999\"/><line x1=\"440.90910437587223\" y1=\"151.08282436348586\" x2=\"323.63572234317115\" y2=\"175.91717563651414\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><polygon points=\"323.63572234317115,175.91717563651414 335.3,171.0 336.3,175.7\" fill=\"#999\"/><line x1=\"276.36427765682885\" y1=\"175.91717563651414\" x2=\"159.09089562412782\" y2=\"151.08282436348588\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><polygon points=\"159.090895624127 A34A\" stroke-width=\"1.3\"/><text x=\"135\" y=\"94\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">story</text>\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">a moveable feast — everyone tastes everyone else's dish</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '‘움직이는 향연’ = 언제·어디서나 연결 가능성'이고, 마지막은 '어디 가든 ‘함께 있다’'로 정리된다."}, {"no": "6", "title": "Subtraction in the Math of Midlife", "ktitle": "중년의 수학 — 뺄셈의 힘(감사)", "field": "심리·성찰", "page": "no.04", "oneline": "중년엔 ‘뺄셈’이 ‘덧셈’보다 강력할 때가 있다.", "tldr": ["중년엔 ‘뺄셈’이 ‘덧셈’보다 강력할 때가 있다.", "좋은 일을 떠올리고, 그것을 가능케 한 우연들을 ‘지워’ 본다.", "그 우연이 없었다면? → 현재가 얼마나 다행인지 깨닫고 감사한다."], "analogy": "좋은 일을 더 바라기(덧셈)보다, ‘그 우연이 하나라도 어긋났다면 지금이 없었겠구나’ 하고 빼서 상상해 보는 거예요. 그러면 지금 가진 것이 새삼 고맙죠.", "bg": "분야는 심리·성찰이에요. 핵심 비유는 인생의 ‘덧셈 vs 뺄셈’ — 중년엔 뺄셈이 더 강력할 때가 있다는 것. → ‘덜어내기’가 왜 더 나은 선택이 되는지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "중년의 수학 — 뺄셈 > 덧셈"}, {"kind": "1단계", "t": "좋은 일 + 그것을 가능케 한 우연들을 나열"}, {"kind": "2단계", "t": "그 우연이 ‘없었다면’ 상상", "d": "파티에 안 갔다면? 다른 수업을 골랐다면?"}, {"kind": "3단계", "t": "현재로 돌아와 ‘그래도 이루어졌다’ 확인"}, {"kind": "결론", "t": "안도·감사 → 삶이 생각보다 멋지다"}], "quiz": [["이 글이 권하는 ‘뺄셈’ 기법은?", "좋은 일을 가능케 한 우연들을 떠올린 뒤, 그것들이 ‘없었다면’ 어땠을지 상상해 보는 거예요."], ["이 상상이 주는 효과는?", "현재가 얼마나 다행인지 깨닫고 안도·감사하게 되어, 삶이 생각보다 멋지게 느껴져요."], ["핵심 한 문장?", "좋은 일을 가능케 한 우연을 ‘빼서’ 상상하면, 지금 가진 것에 새삼 감사하게 된다."]], "vocab": [["subtraction", "뺄셈"], ["circumstance", "상황·정황"], ["insignificant", "사소한·하찮은"], ["on a whim", "즉흥적으로"], ["randomness", "우연성·무작위성"], ["sigh of relief", "안도의 한숨"], ["grateful", "감사하는"]], "en": "In the mathematics of midlife, sometimes subtraction is more powerful than addition. Begin by thinking about something positive in your life ─ the birth of a child, your marriage, a spectacular career achievement. Then list all the circumstances that made it possible -perhaps a seemingly insignificant decision of where to eat dinner one night or a class you decided to enroll in on a whim or the friend of a friend who happened to tell you about a job opening. Next, write down all the events, circumstances, and decisions that might never have happened. What if you didn't go to that party or chose another class or skipped coffee with your cousin? Imagine your life without that chain of events and, more important, without that huge positive in your life. Now return to the present and remind yourself that life did go your way. Consider the happy, beautiful randomness that brought that person or opportunity into your life. Breathe a sigh of relief. Be grateful. Your life may be more wonderful than you think.", "ko": "중년의 수학에서는, 때때로 뺄셈이 덧셈보다 더 강력할 때가 있다. 자녀의 출생, 결혼, 멋진 경력 성취와 같은 인생에서 긍정적인 일을 떠올리는 것부터 시작하라. 그런 다음, 어느 날 저녁을 어디서 먹을지에 대한 외견상 사소한 결정, 즉흥적으로 등록하기로 한 수업, 우연히 구인 정보를 알려 준 친구의 친구 등 그러한 일을 가능하게 한 모든 상황을 나열해 보라. 다음으로, 결코 일어나지 않았을 수도 있었던 사건, 상황, 결정을 모두 적어 보라. 만약 그 파티에 가지 않았거나 다른 수업을 선택했거나 사촌과의 커피 약속을 건너뛰었다면 어땠을까? 그런 일련의 사건들이 없다면, 그리고 더 중요한 것은 여러분의 삶에 그 엄청난 긍정적인 것이 없다면 어떨지 상상해 보라. 이제 현재로 돌아와서 인생이 여러분이 원하는 대로 흘러갔다는 사실을 떠올려 보라. 그 사람이나 기회를 여러분의 인생에 가져다준 행복하고 아름다운 우연성을 생각해 보라. 안도의 한숨을 쉬어 보라. 감사하라. 여러분의 삶은 여러분이 생각하는 것보다 훨씬 더 멋질 수도 있다.", "read": [{"en": "In the mathematics of midlife, sometimes subtraction is more powerful than addition.", "ko": "중년의 수학에서는, 때때로 뺄셈이 덧셈보다 더 강력할 때가 있다.", "chunks": [["In the mathematics of midlife,", "중년의 수학에서는,"], ["sometimes subtraction is more powerful", "때때로 뺄셈이 더 강력하다"], ["than addition.", "덧셈보다."]]}, {"en": "Begin by thinking about something positive in your life ─ the birth of a child, your marriage, a spectacular career achievement.", "ko": "자녀의 출생, 결혼, 멋진 경력 성취와 같은 인생에서 긍정적인 일을 떠올리는 것부터 시작하라.", "chunks": [["Begin by thinking about", "~을 생각하는 것부터 시작하라"], ["something positive in your life", "인생에서 긍정적인 일을"], ["─ the birth of a child,", "─ 자녀의 출생,"], ["your marriage,", "결혼,"], ["a spectacular career achievement.", "멋진 경력 성취."]]}, {"en": "Then list all the circumstances that made it possible - perhaps a seemingly insignificant decision of where to eat dinner one night or a class you decided to enroll in on a whim or the friend of a friend who happened to tell you about a job opening.", "ko": "그런 다음, 어느 날 저녁을 어디서 먹을지에 대한 외견상 사소한 결정, 즉흥적으로 등록하기로 한 수업, 우연히 구인 정보를 알려 준 친구의 친구 등 그러한 일을 가능하게 한 모든 상황을 나열해 보라.", "chunks": [["Then list all the circumstances", "그런 다음, 모든 상황을 나열해 보라"], ["that made it possible", "그것을 가능하게 한"], ["- perhaps a seemingly insignificant decision", "- 아마도 외견상 사소한 결정,"], ["of where to eat dinner one night", "어느 날 저녁을 어디서 먹을지에 대한"], ["or a class you decided to enroll in on a whim", "또는 즉흥적으로 등록하기로 한 수업,"], ["or the friend of a friend who happened to tell you", "또는 우연히 알려 준 친구의 친구"], ["about a job opening.", "구인 정보를."]]}, {"en": "Next, write down all the events, circumstances, and decisions that might never have happened.", "ko": "다음으로, 결코 일어나지 않았을 수도 있었던 사건, 상황, 결정을 모두 적어 보라.", "chunks": [["Next, write down", "다음으로, ~을 적어 보라"], ["all the events, circumstances, and decisions", "모든 사건, 상황, 결정을"], ["that might never have happened.", "결코 일어나지 않았을 수도 있었던."]]}, {"en": "What if you didn't go to that party or chose another class or skipped coffee with your cousin?", "ko": "만약 그 파티에 가지 않았거나 다른 수업을 선택했거나 사촌과의 커피 약속을 건너뛰었다면 어땠을까?", "chunks": [["What if you didn't go to that party", "만약 그 파티에 가지 않았다면?"], ["or chose another class", "또는 다른 수업을 선택했다면?"], ["or skipped coffee with your cousin?", "또는 사촌과의 커피 약속을 건너뛰었다면?"]]}, {"en": "Imagine your life without that chain of events and, more important, without that huge positive in your life.", "ko": "그런 일련의 사건들이 없다면, 그리고 더 중요한 것은 여러분의 삶에 그 엄청난 긍정적인 것이 없다면 어떨지 상상해 보라.", "chunks": [["Imagine your life", "인생을 상상해 보라"], ["without that chain of events", "그 일련의 사건들이 없는"], ["and, more important,", "그리고 더 중요한 것은,"], ["without that huge positive in your life.", "인생에 그 엄청난 긍정적인 것이 없는."]]}, {"en": "Now return to the present and remind yourself that life did go your way.", "ko": "이제 현재로 돌아와서 인생이 여러분이 원하는 대로 흘러갔다는 사실을 떠올려 보라.", "chunks": [["Now return to the present", "이제 현재로 돌아오라"], ["and remind yourself", "그리고 스스로에게 상기시켜라"], ["that life did go your way.", "인생이 당신이 원하는 대로 흘러갔다는 사실을."]]}, {"en": "Consider the happy, beautiful randomness that brought that person or opportunity into your life.", "ko": "그 사람이나 기회를 여러분의 인생에 가져다준 행복하고 아름다운 우연성을 생각해 보라.", "chunks": [["Consider the happy, beautiful randomness", "행복하고 아름다운 우연성을 생각해 보라"], ["that brought that person or opportunity", "그 사람이나 기회를 가져다 준"], ["into your life.", "여러분의 인생에."]]}, {"en": "Breathe a sigh of relief. Be grateful. Your life may be more wonderful than you think.", "ko": "안도의 한숨을 쉬어 보라. 감사하라. 여러분의 삶은 여러분이 생각하는 것보다 훨씬 더 멋질 수도 있다.", "chunks": [["Breathe a sigh of relief.", "안도의 한숨을 쉬어 보라."], ["Be grateful.", "감사하라."], ["Your life may be more wonderful", "여러분의 삶은 더 멋질 수도 있다"], ["than you think.", "여러분이 생각하는 것보다."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"좋은 일과 그것을 가능케 한 우연들을 쌓은 더미에서, 우연 하나를 ‘뺄셈’으로 지워 상상해 보면 그 좋은 일이 사라지고, 다시 현재로 돌아오면 안도와 감사가 남는 과정 그림\">\n  <text x=\"300\" y=\"24\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">중년의 수학 — 뺄셈이 덧셈보다 강할 때</text>\n  <!-- 1: 좋은 일 + 우연들 더미 -->\n  <g transform=\"translate(20,46)\">\n    <text x=\"80\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">① 좋은 일 + 우연들</text>\n    <rect x=\"20\" y=\"78\" width=\"120\" height=\"22\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n    <text x=\"80\" y=\"93\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">그 좋은 일</text>\n    <rect x=\"32\" y=\"56\" width=\"96\" height=\"20\" rx=\"3\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1\"/>\n    <text x=\"80\" y=\"70\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">우연히 간 파티</text>\n    <rect x=\"42\" y=\"36\" width=\"76\" height=\"20\" rx=\"3\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1\"/>\n    <text x=\"80\" y=\"50\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">우연한 수업</text>\n  </g>\n  <line x1=\"190\" y1=\"118\" x2=\"238\" y2=\"118\" stroke=\"#c8102e\" stroke-width=\"1.6\"/><polygon points=\"238,118 225.6,120.4 225.6,115.6\" fill=\"#c8102e\"/>\n  <text x=\"214\" y=\"108\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">빼보면</text>\n  <!-- 2: 우연 제거 → 좋은 일도 사라짐 -->\n  <g transform=\"translate(250,46)\">\n    <text x=\"80\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">② 우연이 없었다면?</text>\n    <rect x=\"20\" y=\"78\" width=\"120\" height=\"22\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 2\"/>\n    <text x=\"80\" y=\"93\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">사라짐</text>\n    <line x1=\"73.60\" y1=\"49.60\" x2=\"86.40\" y2=\"62.40\" stroke=\"#c8102e\" stroke-width=\"2.88\" stroke-linecap=\"round\"/><line x1=\"86.40\" y1=\"49.60\" x2=\"73.60\" y2=\"62.40\" stroke=\"#c8102e\" stroke-width=\"2.88\" stroke-linecap=\"round\"/>\n    <text x=\"80\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">remove the chance</text>\n  </g>\n  <line x1=\"420\" y1=\"118\" x2=\"468\" y2=\"118\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/><polygon points=\"468,118 455.6,120.4 455.6,115.6\" fill=\"#1FA34A\"/>\n  <text x=\"444\" y=\"108\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">돌아오면</text>\n  <!-- 3: 현재 = 그래도 이루어짐 → 감사 -->\n  <g transform=\"translate(480,46)\">\n    <text x=\"55\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">③ 그래도 이루어짐</text>\n    <rect x=\"0\" y=\"60\" width=\"110\" height=\"40\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <path d=\"M 12.80 79.20 L 18.40 85.60 L 28.00 73.60\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"2.88\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    <text x=\"68\" y=\"76\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">안도·감사</text>\n    <text x=\"55\" y=\"92\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\">gratitude</text>\n  </g>\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">subtracting the lucky chances reveals how good life is</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '중년의 수학 — 뺄셈 > 덧셈'이고, 마지막은 '안도·감사 → 삶이 생각보다 멋지다'로 정리된다."}, {"no": "7", "title": "Do Languages Carve Up Emotion Differently?", "ktitle": "감정의 범주는 자의적인가", "field": "언어·심리", "page": "no.05", "oneline": "언어마다 감정 단어 수가 크게 다르다(영어 수백 vs Chewong 7개).", "tldr": ["언어마다 감정 단어 수가 크게 다르다(영어 수백 vs Chewong 7개).", "→ 감정의 ‘범주’는 문화마다 다소 자의적이다.", "다윈식 ‘선천적 반응설’과 충돌 — 어느 쪽이 옳은지는 미결."], "analogy": "같은 무지개를 두고 어떤 언어는 색을 5개로, 어떤 언어는 7개로 나누죠. 감정도 마찬가지 — 느낌 자체가 다른 게 아니라 ‘나누는 칸’이 문화마다 다른 거예요.", "bg": "분야는 언어·심리예요. 언어마다 감정 단어 수가 크게 다르다는 것이 출발점(영어 수백 개 vs Chewong어 7개). → 언어가 감정을 ‘다르게 나누는지’에 주목하며 읽으세요.", "flow": [{"kind": "관찰", "t": "감정 단어 수가 언어마다 크게 다름", "d": "영어 수백 ↔ Chewong 7개."}, {"kind": "해석", "t": "감정의 ‘범주’가 다소 자의적이다", "d": "느낌이 다른 게 아니라 ‘나눔’이 다름."}, {"kind": "함의", "t": "다윈식 ‘선천적 반응설’과 충돌"}, {"kind": "논쟁", "t": "객관적 기준은 아직 없음(Barrett vs Adolphs)"}, {"kind": "결론", "t": "어느 학설이 옳은지 ‘미결’"}], "quiz": [["감정 단어 수의 차이가 시사하는 것은?", "사람마다 느끼는 감정이 다른 게 아니라, 문화마다 감정을 나누는 ‘범주’가 다소 자의적이라는 거예요."], ["이 주장이 다윈의 견해와 부딪치는 지점은?", "감정이 ‘전형적 자극에 대한 선천적·타고난 반응’이라는 다윈의 생각을 약화시켜요."], ["핵심 한 문장?", "언어마다 감정의 범주가 다르며, 그것이 선천적인지 자의적인지는 아직 결론이 나지 않았다."]], "vocab": [["carve up", "나누다·분할하다"], ["domain", "영역"], ["arbitrary", "자의적인·임의의"], ["innate", "선천적인·타고난"], ["archetypal", "전형적인"], ["dismiss", "묵살하다·일축하다"], ["the jury is still out", "아직 결론이 안 났다"]], "en": "The English language has words for hundreds of emotions. Other languages have far fewer; for example, there are just seven in the Chewong language of the Malay Peninsula. As one emotion researcher put it, \"Different languages recognize different emotions. They carve up the domain of emotion differently.\" That's not to say that different people experience different emotions, but rather that the categories of emotion identified in various cultures are somewhat arbitrary. That supports the idea that our feelings are not, as Darwin believed, innate hardwired responses to a set of archetypal stimuli. In an article co-authored with Ralph Adolphs, Barrett argued that science has not yet identified truly objective criteria to reliably determine whether a person or an animal is in one emotional state or another. Adolphs, like the majority of emotion researchers, recognizes her point, but wouldn't go that far in dismissing the usual categories. As to which school of thought is correct, the jury is still out.", "ko": "영어에는 수백 가지 감정을 나타내는 단어가 있다. 다른 언어들은 훨씬 적은 단어를 가지고 있는데, 예를 들어 말레이 반도의 Chewong 언어에서는 단지 일곱 가지 감정 단어만 있다. 한 감정 연구자는 \"언어마다 서로 다른 감정을 인식합니다. 언어마다 감정의 영역을 서로 다르게 나눕니다.\"라고 말했다. 그것은 다른 사람들이 다른 감정을 경험한다는 것을 말하려는 것이 아니라, 다양한 문화에서 식별되는 감정의 범주가 다소 자의적이라는 것을 말하는 것이다. 그것은 우리의 감정이 다윈이 믿었던 것처럼 일련의 전형적인 자극에 대한 선천적인 타고난 반응이 아니라는 생각을 뒷받침한다. Ralph Adolphs와 공동 집필한 글에서 Barrett는 아직 과학이 사람이나 동물이 어떤 감정 상태에 있는지 확실히 판단할 수 있는 진정으로 객관적인 기준을 찾지 못했다고 주장했다. Adolphs는 대부분의 감정 연구자처럼 그녀의 주장을 인정하지만, 일반적인 범주를 완전히 묵살하지는 않을 것이다. 어느 학설이 옳은지에 관하여는 (배심원들이) 아직 결정을 못 내리고 있다.", "read": [{"en": "The English language has words for hundreds of emotions.", "ko": "영어에는 수백 가지 감정을 나타내는 단어가 있다.", "chunks": [["The English language has", "영어는 가지고 있다"], ["words for hundreds of emotions.", "수백 가지 감정을 나타내는 단어를."]]}, {"en": "Other languages have far fewer; for example, there are just seven in the Chewong language of the Malay Peninsula.", "ko": "다른 언어들은 훨씬 적은 단어를 가지고 있는데, 예를 들어 말레이 반도의 Chewong 언어에서는 단지 일곱 가지 감정 단어만 있다.", "chunks": [["Other languages have far fewer;", "다른 언어들은 훨씬 적게 가지고 있다;"], ["for example, there are just seven", "예를 들어, 단지 일곱 개만 있다"], ["in the Chewong language of the Malay Peninsula.", "말레이 반도의 Chewong 언어에서는."]]}, {"en": "As one emotion researcher put it, \"Different languages recognize different emotions. They carve up the domain of emotion differently.\"", "ko": "한 감정 연구자는 \"언어마다 서로 다른 감정을 인식합니다. 언어마다 감정의 영역을 서로 다르게 나눕니다.\"라고 말했다.", "chunks": [["As one emotion researcher put it,", "한 감정 연구자가 말했듯이,"], ["\"Different languages recognize different emotions.", "\"언어마다 서로 다른 감정을 인식합니다."], ["They carve up the domain of emotion", "언어마다 감정의 영역을 나눕니다"], ["differently.\"", "서로 다르게.\""]]}, {"en": "That's not to say that different people experience different emotions, but rather that the categories of emotion identified in various cultures are somewhat arbitrary.", "ko": "그것은 다른 사람들이 다른 감정을 경험한다는 것을 말하려는 것이 아니라, 다양한 문화에서 식별되는 감정의 범주가 다소 자의적이라는 것을 말하는 것이다.", "chunks": [["That's not to say that", "그것은 ~을 말하려는 것이 아니다"], ["different people experience different emotions,", "다른 사람들이 다른 감정을 경험한다는 것을,"], ["but rather that the categories of emotion", "오히려 ~ 감정의 범주가"], ["identified in various cultures", "다양한 문화에서 식별되는"], ["are somewhat arbitrary.", "다소 자의적이라는 것이다."]]}, {"en": "That supports the idea that our feelings are not, as Darwin believed, innate hardwired responses to a set of archetypal stimuli.", "ko": "그것은 우리의 감정이 다윈이 믿었던 것처럼 일련의 전형적인 자극에 대한 선천적인 타고난 반응이 아니라는 생각을 뒷받침한다.", "chunks": [["That supports the idea that", "그것은 ~라는 생각을 뒷받침한다"], ["our feelings are not,", "우리의 감정이 ~이 아니라는"], ["as Darwin believed,", "다윈이 믿었던 것처럼,"], ["innate hardwired responses", "선천적이고 타고난 반응이"], ["to a set of archetypal stimuli.", "일련의 전형적인 자극에 대한."]]}, {"en": "In an article co-authored with Ralph Adolphs, Barrett argued that science has not yet identified truly objective criteria to reliably determine whether a person or an animal is in one emotional state or another.", "ko": "Ralph Adolphs와 공동 집필한 글에서 Barrett는 아직 과학이 사람이나 동물이 어떤 감정 상태에 있는지 확실히 판단할 수 있는 진정으로 객관적인 기준을 찾지 못했다고 주장했다.", "chunks": [["In an article", "글에서"], ["co-authored with Ralph Adolphs,", "Ralph Adolphs와 공동 집필한,"], ["Barrett argued that", "Barrett는 ~라고 주장했다"], ["science has not yet identified", "과학이 아직 ~을 찾지 못했다고"], ["truly objective criteria", "진정으로 객관적인 기준을"], ["to reliably determine", "확실히 판단할 수 있는"], ["whether a person or an animal", "사람이나 동물이"], ["is in one emotional state or another.", "어떤 감정 상태에 있는지를."]]}, {"en": "Adolphs, like the majority of emotion researchers, recognizes her point, but wouldn't go that far in dismissing the usual categories.", "ko": "Adolphs는 대부분의 감정 연구자처럼 그녀의 주장을 인정하지만, 일반적인 범주를 완전히 묵살하지는 않을 것이다.", "chunks": [["Adolphs, like the majority of emotion researchers,", "Adolphs는, 대부분의 감정 연구자처럼,"], ["recognizes her point,", "그녀의 주장을 인정한다,"], ["but wouldn't go that far", "하지만 그렇게까지 나아가지는 않을 것이다"], ["in dismissing the usual categories.", "일반적인 범주를 묵살하는 데 있어서."]]}, {"en": "As to which school of thought is correct, the jury is still out.", "ko": "어느 학설이 옳은지에 관하여는 (배심원들이) 아직 결정을 못 내리고 있다.", "chunks": [["As to which school of thought is correct,", "어느 학설이 옳은지에 관하여,"], ["the jury is still out.", "(배심원들은) 아직 결정을 못 내리고 있다."]]}], "metaphor": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"같은 감정 스펙트럼 띠를 영어는 수백 개로 잘게 나누고 Chewong어는 7개로만 나눈다는 대조. 느낌 자체가 다른 게 아니라 나눔이 다르며, 두 학설은 아직 미결임을 보여줌\">\n  <text x=\"300\" y=\"24\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">같은 감정, 다른 ‘나눔’ — 단어 수 차이</text>\n  <text x=\"58\" y=\"68\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1FA34A\">영어 — 수백 개로 잘게</text>\n  <rect x=\"60\" y=\"78\" width=\"480\" h

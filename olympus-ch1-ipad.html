2e\" stroke-width=\"1.4\"/><line x1=\"403\" y1=\"120\" x2=\"403\" y2=\"140\" stroke=\"#c8102e\" stroke-width=\"1.4\"/><line x1=\"471\" y1=\"120\" x2=\"471\" y2=\"140\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n  <text x=\"548\" y=\"92\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"end\" fill=\"#5e5e5e\">same feeling</text>\n  <text x=\"548\" y=\"134\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"end\" fill=\"#5e5e5e\">same feeling</text>\n  <!-- 두 학설 미결 박스 -->\n  <g transform=\"translate(60,176)\">\n    <rect x=\"0\" y=\"0\" width=\"220\" height=\"48\" rx=\"6\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.2\"/>\n    <text x=\"110\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">선천적 반응설 (Darwin)</text>\n    <text x=\"110\" y=\"36\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">emotions are innate · universal</text>\n  </g>\n  <text x=\"300\" y=\"204\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">vs</text>\n  <g transform=\"translate(320,176)\">\n    <rect x=\"0\" y=\"0\" width=\"220\" height=\"48\" rx=\"6\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.2\"/>\n    <text x=\"110\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">구성설 (Barrett)</text>\n    <text x=\"110\" y=\"36\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">categories are learned</text>\n  </g>\n  <text x=\"300\" y=\"246\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">객관적 기준 아직 없음 — <tspan font-style=\"italic\" fill=\"#5e5e5e\">still unresolved</tspan></text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '감정 단어 수가 언어마다 크게 다름'이고, 마지막은 '어느 학설이 옳은지 ‘미결’'로 정리된다."}, {"no": "8", "title": "The Hidden Price of Convenience", "ktitle": "편리함의 숨은 대가", "field": "사회·소비", "page": "no.06", "oneline": "거대 조세 회피 기업은 가장 편리하고 값싼 선택일 수 있다.", "tldr": ["거대 조세 회피 기업은 가장 편리하고 값싼 선택일 수 있다.", "그 편리·저가엔 ‘금전 이상의’ 대가가 따른다.", "노동자·지구·지역 상점의 희생 — 우리에겐 ‘선택권’이 있다."], "analogy": "클릭 한 번에 싸게 받는 거대 쇼핑몰이 편하죠. 하지만 그 편리함의 ‘가격표’엔 노동자·환경·동네 가게의 희생이 안 보이게 적혀 있어요. 어떤 세상을 원하는지는 우리 선택이고요.", "bg": "분야는 사회·소비예요. 거대 조세 회피 기업의 제품이 가장 편리하고 값쌀 수 있다는 것이 단서. → ‘편리함’ 뒤에 숨은 대가가 무엇인지에 주목하며 읽으세요.", "flow": [{"kind": "인정", "t": "거대 기업 = 가장 편리·값싼 선택일 수 있음"}, {"kind": "경고", "t": "편리·저가엔 ‘금전 이상’의 대가"}, {"kind": "대가", "t": "노동자·지구·지역 번화가·독립 상점의 희생"}, {"kind": "질문", "t": "어떤 세상에서 아이를 키우고 싶은가?"}, {"kind": "결론", "t": "편리함이 왕일 필요 없다 — 우리에겐 선택권"}], "quiz": [["편리함의 ‘숨은 대가’는 무엇인가?", "노동자·지구·지역 번화가와 독립 소매업자의 희생 — 금전적인 것 이상의 비용이에요."], ["글이 독자에게 촉구하는 것은?", "어떤 세상에서 아이가 자라기를 원하는지 생각하고, 편리함이 ‘왕’이 될 필요가 없음을 기억하라는 거예요."], ["핵심 한 문장?", "거대 기업의 편리·저가에는 노동자·환경·지역 상권의 희생이 따르며, 어떤 세상을 택할지는 우리에게 달렸다."]], "vocab": [["tax-avoiding", "조세 회피의"], ["by all means", "아무쪼록·반드시"], ["at the expense of", "~을 희생하여"], ["bustling", "북적거리는"], ["artisan", "장인의"], ["fairtrade", "공정 무역의"], ["retailer", "소매업자"]], "en": "If we want a world ruled by a few gigantic tax-avoiding corporations, then by all means, please do continue to give your money to them. I agree with you, it is totally the most convenient (and often the cheapest) option. But we need to be careful what we wish for and remember that all of this convenience and the low cost comes at a price that is more than just financial. It comes at the expense of workers, at the expense of the planet, and at the expense of our local high streets and independent retailers. Think about the kind of world you want, right now and for your kids to grow up in. Do you want them to have a bustling high street? Do you want there to be local artisan markets, fairtrade goods, locally produced food? If you do, then remember that convenience doesn't have to be king. We have a choice.", "ko": "소수의 거대 조세 회피 기업이 지배하는 세상을 원한다면, 그렇다면 아무쪼록 계속해서 그들에게 돈을 주라. 그것이 가장 편리한(그리고 종종 가장 값싼) 선택 사항이라는 것에 동의한다. 하지만 우리가 원하는 것에 주의해야 하고, 이 모든 편리함과 저렴한 비용에는 단지 금전적인 것 이상의 대가가 따른다는 사실을 기억해야 한다. 그것은 노동자의 희생으로, 지구의 희생으로, 그리고 우리 지역의 번화가와 독립 소매업자의 희생으로 이루어진다. 여러분이 바로 지금, 그리고 여러분의 자녀들이 성장하길 바라는 세상이 어떤 세상인지 생각해 보라. 자녀가 북적거리는 번화가를 가지기를 원하는가? 그곳에 지역 장인 시장, 공정 무역 상품, 지역에서 생산된 식품이 있기를 원하는가? 그렇다면 편리함이 왕이 되어야 할 필요는 없다는 것을 기억하라. 우리에게는 선택권이 있다.", "read": [{"en": "If we want a world ruled by a few gigantic tax-avoiding corporations, then by all means, please do continue to give your money to them.", "ko": "소수의 거대 조세 회피 기업이 지배하는 세상을 원한다면, 그렇다면 아무쪼록 계속해서 그들에게 돈을 주라.", "chunks": [["If we want a world", "만약 우리가 세상을 원한다면"], ["ruled by a few gigantic tax-avoiding corporations,", "소수의 거대 조세 회피 기업이 지배하는,"], ["then by all means,", "그렇다면 아무쪼록,"], ["please do continue", "계속하라"], ["to give your money to them.", "그들에게 돈을 주는 것을."]]}, {"en": "I agree with you, it is totally the most convenient (and often the cheapest) option.", "ko": "그것이 가장 편리한(그리고 종종 가장 값싼) 선택 사항이라는 것에 동의한다.", "chunks": [["I agree with you,", "나는 당신에게 동의한다,"], ["it is totally the most convenient", "그것이 완전히 가장 편리한 ~이라는 것에"], ["(and often the cheapest) option.", "(그리고 종종 가장 저렴한) 선택 사항이다."]]}, {"en": "But we need to be careful what we wish for and remember that all of this convenience and the low cost comes at a price that is more than just financial.", "ko": "하지만 우리가 원하는 것에 주의해야 하고, 이 모든 편리함과 저렴한 비용에는 단지 금전적인 것 이상의 대가가 따른다는 사실을 기억해야 한다.", "chunks": [["But we need to be careful", "하지만 우리는 주의해야 한다"], ["what we wish for", "우리가 원하는 것에 대해"], ["and remember that", "그리고 ~을 기억해야 한다"], ["all of this convenience and the low cost", "이 모든 편리함과 저렴한 비용은"], ["comes at a price", "대가가 따른다"], ["that is more than just financial.", "단지 금전적인 것 이상의."]]}, {"en": "It comes at the expense of workers, at the expense of the planet, and at the expense of our local high streets and independent retailers.", "ko": "그것은 노동자의 희생으로, 지구의 희생으로, 그리고 우리 지역의 번화가와 독립 소매업자의 희생으로 이루어진다.", "chunks": [["It comes at the expense of workers,", "그것은 노동자의 희생으로 이루어진다,"], ["at the expense of the planet,", "지구의 희생으로,"], ["and at the expense of", "그리고 ~의 희생으로"], ["our local high streets and independent retailers.", "우리 지역의 번화가와 독립 소매업자."]]}, {"en": "Think about the kind of world you want, right now and for your kids to grow up in.", "ko": "여러분이 바로 지금, 그리고 여러분의 자녀들이 성장하길 바라는 세상이 어떤 세상인지 생각해 보라.", "chunks": [["Think about the kind of world you want,", "여러분이 원하는 세상의 종류에 대해 생각하라,"], ["right now and", "바로 지금,"], ["for your kids to grow up in.", "여러분의 자녀가 성장할."]]}, {"en": "Do you want them to have a bustling high street? Do you want there to be local artisan markets, fairtrade goods, locally produced food?", "ko": "자녀가 북적거리는 번화가를 가지기를 원하는가? 그곳에 지역 장인 시장, 공정 무역 상품, 지역에서 생산된 식품이 있기를 원하는가?", "chunks": [["Do you want them to have", "여러분은 그들이 가지기를 원하는가"], ["a bustling high street?", "북적거리는 번화가를?"], ["Do you want there to be", "여러분은 ~이 있기를 원하는가"], ["local artisan markets,", "지역 장인 시장,"], ["fairtrade goods,", "공정 무역 상품,"], ["locally produced food?", "지역에서 생산된 식품이?"]]}, {"en": "If you do, then remember that convenience doesn't have to be king.", "ko": "그렇다면 편리함이 왕이 되어야 할 필요는 없다는 것을 기억하라.", "chunks": [["If you do,", "만약 그렇다면,"], ["then remember that", "그렇다면 ~을 기억하라"], ["convenience doesn't have to be king.", "편리함이 왕이 되어야 하는 것은 아니다."]]}, {"en": "We have a choice.", "ko": "우리에게는 선택권이 있다.", "chunks": [["We have a choice.", "우리에게는 선택권이 있다."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"빙산처럼 수면 위에는 편리함과 낮은 가격만 보이고, 수면 아래에는 노동자·지구·지역 상점의 희생이라는 숨은 대가가 가려져 있다는 그림\">\n  <text x=\"300\" y=\"24\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">편리함의 빙산 — 숨은 대가</text>\n  <!-- 수면 -->\n  <line x1=\"40\" y1=\"108\" x2=\"560\" y2=\"108\" stroke=\"#999\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>\n  <text x=\"552\" y=\"103\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"end\" fill=\"#5e5e5e\">waterline</text>\n  <!-- 빙산 윗부분 (보이는 것, 초록 작게) -->\n  <polygon points=\"300,46 250,108 350,108\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n  <text x=\"300\" y=\"78\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">편리·저가</text>\n  <text x=\"300\" y=\"92\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\">cheap · easy</text>\n  <!-- 빙산 아랫부분 (숨은 대가, 빨강 크게) -->\n  <polygon points=\"250,108 350,108 410,225 190,225\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/>\n  <text x=\"300\" y=\"135\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">숨은 대가 — ‘금전 이상’</text>\n  <text x=\"300\" y=\"158\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">노동자 희생</text>\n  <text x=\"300\" y=\"178\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">지구 환경</text>\n  <text x=\"300\" y=\"198\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">지역 상점·번화가</text>\n  <text x=\"300\" y=\"250\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">convenience needn't be king — we have a choice</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '거대 기업 = 가장 편리·값싼 선택일 수 있음'이고, 마지막은 '편리함이 왕일 필요 없다 — 우리에겐 선택권'로 정리된다."}, {"no": "9", "title": "Blue Light and 'Endless Summer'", "ktitle": "청색광이 만든 ‘끝없는 여름’", "field": "건강·과학", "page": "no.07", "oneline": "현대 생활은 청색광에 거의 쉼 없이 노출된다.", "tldr": ["현대 생활은 청색광에 거의 쉼 없이 노출된다.", "청색광은 멜라토닌을 억제하고 ‘배고픔·각성’ 호르몬을 자극한다.", "몸이 ‘여름’이라 착각 → 끊임없이 살을 찌운다(끝없는 여름)."], "analogy": "화면의 청색광을 본 몸은 ‘아직 한낮·여름’이라고 속아요. 겨울 대비 살을 찌우려 하는데, 전등 때문에 그 겨울은 안 와요 — 그래서 일년 내내 ‘여름 모드’로 살이 붙죠.", "bg": "분야는 건강·과학이에요. 현대인이 청색광(blue light)에 거의 쉼 없이 노출된다는 것이 배경. → 이 ‘끝나지 않는 여름’ 같은 빛 노출이 몸에 무엇을 하는지에 주목하며 읽으세요.", "flow": [{"kind": "노출", "t": "화면·전구의 청색광에 거의 쉼 없이 노출"}, {"kind": "호르몬", "t": "멜라토닌↓(수면 방해) + 그렐린·코르티솔↑", "d": "배고픔·각성 자극."}, {"kind": "착각", "t": "몸이 청색광=일광 → ‘여름’이라 오인"}, {"kind": "결과", "t": "겨울 대비 살 찌움 → 겨울은 안 옴"}, {"kind": "결론", "t": "리듬 붕괴 → 365일 ‘끝없는 여름’"}], "quiz": [["청색광이 수면·체중에 미치는 영향은?", "수면 호르몬 멜라토닌을 억제하고 배고픔·각성 호르몬을 자극해, 수면 부족·비만과 연결돼요."], ["‘끝없는 여름’이라는 표현의 뜻은?", "청색광을 일광으로 착각한 몸이 늘 여름이라 여겨 끊임없이 살을 찌우는 상태를 가리켜요."], ["핵심 한 문장?", "끊임없는 청색광 노출이 몸을 ‘여름’으로 착각시켜 호르몬 리듬을 무너뜨리고 살을 찌운다."]], "vocab": [["wavelength", "파장"], ["emit", "방출하다"], ["suppress", "억제하다"], ["melatonin", "멜라토닌(수면 호르몬)"], ["deprivation", "결핍·부족"], ["perpetually", "끊임없이·영구히"], ["disrupt", "붕괴시키다·방해하다"]], "en": "Modern life is dominated by blue light, creating an unnatural and practically nonstop exposure to this wavelength. Televisions, cell phones, tablets, other electronic devices, and even certain energy-saving lightbulbs emit light in the blue range of the spectrum, which is known to interfere with sleep. Blue light suppresses the production of melatonin, the hormone that helps you fall asleep, and sleep deprivation is associated with obesity. Blue light also stimulates ghrelin and cortisol, which are, respectively, the \"hunger\" and \"awake\" hormones. And because our genetic programming associates blue light with daylight, this constant exposure tricks our bodies into thinking we're perpetually in the season with longer daylight hours (summer). This prompts us to constantly pack on pounds in anticipation of the shorter daylight hours of upcoming winter, which never arrives, thanks to electric lights. Now that this ancient rhythm has been completely disrupted, we live in 365 days of \"endless summer.\"", "ko": "현대 생활은 청색광이 지배하고 있어서 이 파장에 부자연스럽게 그리고 거의 쉬지 않고 노출된다. 텔레비전, 휴대전화, 태블릿, 기타 전자 기기, 심지어 특정 에너지 절약형 전구도 스펙트럼의 청색 범위에 있는 빛을 방출하는데 이 빛은 수면을 방해하는 것으로 알려져 있다. 청색광은 수면을 돕는 호르몬인 멜라토닌의 생성을 억제하며, 수면 부족은 비만과 관련이 있다. 또한 청색광은 그렐린과 코르티솔을 자극하는데 이것들은 각각 '배고픔'과 '각성' 호르몬이다. 그리고 우리의 유전자 프로그래밍은 청색광을 일광과 연관시키기 때문에, 이러한 지속적인 노출은 우리가 끊임없이 낮 시간이 더 긴 계절(여름)에 있다고 생각하도록 우리 몸을 속인다. 이로 인해 다가오는 겨울의 더 짧은 낮 시간을 예상하여 끊임없이 살을 찌우게 되는데, 이는 전등 때문에 결코 오지 않는다. 이 고대의 리듬이 완전히 붕괴되었기 때문에, 우리는 365일 '끝없는 여름'에 살고 있다.", "read": [{"en": "Modern life is dominated by blue light, creating an unnatural and practically nonstop exposure to this wavelength.", "ko": "현대 생활은 청색광이 지배하고 있어서 이 파장에 부자연스럽게 그리고 거의 쉬지 않고 노출된다.", "chunks": [["Modern life is dominated by blue light,", "현대 생활은 청색광에 의해 지배되고 있다,"], ["creating an unnatural and practically nonstop exposure", "부자연스럽고 거의 쉬지 않는 노출을 만들면서"], ["to this wavelength.", "이 파장에 대한."]]}, {"en": "Televisions, cell phones, tablets, other electronic devices, and even certain energy-saving lightbulbs emit light in the blue range of the spectrum, which is known to interfere with sleep.", "ko": "텔레비전, 휴대전화, 태블릿, 기타 전자 기기, 심지어 특정 에너지 절약형 전구도 스펙트럼의 청색 범위에 있는 빛을 방출하는데 이 빛은 수면을 방해하는 것으로 알려져 있다.", "chunks": [["Televisions, cell phones, tablets,", "텔레비전, 휴대전화, 태블릿,"], ["other electronic devices,", "기타 전자 기기,"], ["and even certain energy-saving lightbulbs", "심지어 특정 에너지 절약형 전구도"], ["emit light in the blue range of the spectrum,", "스펙트럼의 청색 범위에 있는 빛을 방출한다,"], ["which is known to interfere with sleep.", "이 빛은 수면을 방해하는 것으로 알려져 있다."]]}, {"en": "Blue light suppresses the production of melatonin, the hormone that helps you fall asleep, and sleep deprivation is associated with obesity.", "ko": "청색광은 수면을 돕는 호르몬인 멜라토닌의 생성을 억제하며, 수면 부족은 비만과 관련이 있다.", "chunks": [["Blue light suppresses", "청색광은 억제한다"], ["the production of melatonin,", "멜라토닌의 생성을,"], ["the hormone that helps you fall asleep,", "잠들도록 돕는 호르몬인,"], ["and sleep deprivation", "그리고 수면 부족은"], ["is associated with obesity.", "비만과 관련이 있다."]]}, {"en": "Blue light also stimulates ghrelin and cortisol, which are, respectively, the \"hunger\" and \"awake\" hormones.", "ko": "또한 청색광은 그렐린과 코르티솔을 자극하는데 이것들은 각각 '배고픔'과 '각성' 호르몬이다.", "chunks": [["Blue light also stimulates", "청색광은 또한 자극한다"], ["ghrelin and cortisol,", "그렐린과 코르티솔을,"], ["which are, respectively,", "이것들은 각각, ~이다"], ["the \"hunger\" and \"awake\" hormones.", "\"배고픔\"과 \"각성\" 호르몬."]]}, {"en": "And because our genetic programming associates blue light with daylight, this constant exposure tricks our bodies into thinking we're perpetually in the season with longer daylight hours (summer).", "ko": "그리고 우리의 유전자 프로그래밍은 청색광을 일광과 연관시키기 때문에, 이러한 지속적인 노출은 우리가 끊임없이 낮 시간이 더 긴 계절(여름)에 있다고 생각하도록 우리 몸을 속인다.", "chunks": [["And because our genetic programming", "그리고 우리의 유전자 프로그래밍은 ~이기 때문에"], ["associates blue light with daylight,", "청색광을 일광과 연관시킨다,"], ["this constant exposure tricks our bodies", "이 지속적인 노출은 우리 몸을 속인다"], ["into thinking we're perpetually", "~라고 생각하도록 — 우리가 끊임없이"], ["in the season with longer daylight hours (summer).", "낮 시간이 더 긴 계절(여름)에 있다고."]]}, {"en": "This prompts us to constantly pack on pounds in anticipation of the shorter daylight hours of upcoming winter, which never arrives, thanks to electric lights.", "ko": "이로 인해 다가오는 겨울의 더 짧은 낮 시간을 예상하여 끊임없이 살을 찌우게 되는데, 이는 전등 때문에 결코 오지 않는다.", "chunks": [["This prompts us", "이것은 우리를 ~하게 한다"], ["to constantly pack on pounds", "끊임없이 살을 찌우게"], ["in anticipation of", "~을 예상하여"], ["the shorter daylight hours of upcoming winter,", "다가오는 겨울의 더 짧은 낮 시간을,"], ["which never arrives,", "결코 오지 않는,"], ["thanks to electric lights.", "전등 덕분에."]]}, {"en": "Now that this ancient rhythm has been completely disrupted, we live in 365 days of \"endless summer.\"", "ko": "이 고대의 리듬이 완전히 붕괴되었기 때문에, 우리는 365일 '끝없는 여름'에 살고 있다.", "chunks": [["Now that this ancient rhythm", "이제 ~ 이 고대의 리듬이"], ["has been completely disrupted,", "완전히 붕괴되었기 때문에,"], ["we live in 365 days of \"endless summer.\"", "우리는 365일 \"끝없는 여름\"에 살고 있다."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"청색광 노출이 호르몬을 교란하고 몸이 계절을 여름으로 오인해 겨울 대비 살을 찌우는데 겨울이 오지 않아, 점선 순환 화살표로 365일 끝없는 여름이 반복됨을 보여주는 인과 사슬\">\n  <text x=\"300\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">청색광 → 끝없는 여름 (리듬 붕괴)</text>\n  <path d=\"M 517.0 92 V 74 H 85.0 V 92\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.3\" stroke-dasharray=\"4 2\"/><line x1=\"86.0\" y1=\"80\" x2=\"85.0\" y2=\"90\" stroke=\"#999\" stroke-width=\"1.3\"/><polygon points=\"85.0,90 83.8,77.4 88.6,77.9\" fill=\"#999\"/>\n  <text x=\"300\" y=\"68\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">winter never comes — loops forever</text>\n  <rect x=\"20\" y=\"92\" width=\"130\" height=\"64\" rx=\"6\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/><text x=\"85.0\" y=\"120\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">청색광 노출</text><text x=\"85.0\" y=\"138\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\">screens · bulbs</text><rect x=\"164\" y=\"92\" width=\"130\" height=\"64\" rx=\"6\" fill=\"#fdf2f4\" fill-opacity=\"0.5\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 2\"/><text x=\"229.0\" y=\"120\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">호르몬 교란</text><text x=\"229.0\" y=\"138\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\">melatonin↓ ghrelin↑</text><rect x=\"308\" y=\"92\" width=\"130\" height=\"64\" rx=\"6\" fill=\"#fdf2f4\" fill-opacity=\"0.5\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 2\"/><text x=\"373.0\" y=\"120\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">몸: ‘여름’ 오인</text><text x=\"373.0\" y=\"138\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\">mistakes it for summer</text><rect x=\"452\" y=\"92\" width=\"130\" height=\"64\" rx=\"6\" fill=\"#fdf2f4\" fill-opacity=\"0.5\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 2\"/><text x=\"517.0\" y=\"120\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">겨울 대비 살찜</text><text x=\"517.0\" y=\"138\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\">stores fat</text><line x1=\"151\" y1=\"124\" x2=\"163\" y2=\"124\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/><polygon points=\"163,124 150.6,126.4 150.6,121.6\" fill=\"#1a1a1a\"/><line x1=\"295\" y1=\"124\" x2=\"307\" y2=\"124\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/><polygon points=\"307,124 294.6,126.4 294.6,121.6\" fill=\"#1a1a1a\"/><line x1=\"439\" y1=\"124\" x2=\"451\" y2=\"124\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/><polygon points=\"451,124 438.6,126.4 438.6,121.6\" fill=\"#1a1a1a\"/>\n  <text x=\"300\" y=\"238\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">an endless summer · 365 days</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '화면·전구의 청색광에 거의 쉼 없이 노출'이고, 마지막은 '리듬 붕괴 → 365일 ‘끝없는 여름’'로 정리된다."}, {"no": "10", "title": "The Gambler's Fallacy", "ktitle": "도박꾼의 오류 — 확률은 기억이 없다", "field": "수학·심리", "page": "no.08", "oneline": "객관적 확률은 ‘보장’이 아니다 — 자기수정 과정이 아니다.", "tldr": ["객관적 확률은 ‘보장’이 아니다 — 자기수정 과정이 아니다.", "앞면이 10번 나와도 다음 뒷면 확률은 여전히 50%.", "‘이제 나올 때가 됐다’는 도박꾼의 오류일 뿐 — 균등은 ‘장기’에만."], "analogy": "동전은 방금 뭐가 나왔는지 기억하지 못해요. ‘앞면이 계속 나왔으니 이제 뒷면 차례’라는 건 착각 — 매번 50:50일 뿐이에요.", "bg": "분야는 수학·심리예요. 핵심 개념은 ‘도박사의 오류(gambler's fallacy)’ — 확률이 ‘보장’도 ‘자기수정’도 아니라는 점. → 사람들이 확률을 어떻게 오해하는지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "객관적 확률 ≠ 보장 / 자기수정 ✗"}, {"kind": "이유", "t": "동전엔 기억·의지가 없다", "d": "확률을 관리하는 ‘지배자’도 없음."}, {"kind": "예시", "t": "앞면 10번 → 다음 뒷면도 여전히 50%", "d": "‘나올 때가 됐다’ ✗."}, {"kind": "오류", "t": "도박꾼의 오류 → 카지노가 부유해짐"}, {"kind": "결론", "t": "확률은 ‘장기적으로만’ 균등해진다"}], "quiz": [["‘확률은 자기수정 과정이 아니다’의 뜻은?", "앞 결과가 다음 결과를 보정하지 않는다는 뜻 — 동전은 기억이 없어 매번 확률이 같아요."], ["도박꾼의 오류란?", "우연의 과정이 스스로를 바로잡아 ‘이제 내 차례’라고 믿는 착각이에요."], ["핵심 한 문장?", "확률은 기억 없이 매번 독립적이며, 균등해지는 것은 오직 ‘장기적으로’일 뿐이다."]], "vocab": [["probability", "확률"], ["guarantee", "보장(하다)"], ["self-correcting", "스스로 수정하는"], ["willpower", "의지력"], ["volition", "의지·결단"], ["fallacy", "오류"], ["even out", "균등해지다"]], "en": "An objectively obtained probability is not a guarantee. Although in the long run, we expect a coin to come up heads half the time, probability is not a self-correcting process. The coin has no memory, knowledge, willpower, or volition. There is not some overlord of the theory of probability making sure that everything works out just the way you expect. If you get \"heads\" ten times in a row, the probability of the coin coming up \"tails\" on the next toss is still 50%. Tails is not more likely and it is not \"due.\" The notion that chance processes correct themselves is part of the gambler's fallacy, and it has made many casino owners, including Steve Wynn, very wealthy. Millions of people have continued to put money into slot machines under the illusion that their payout is due. It's true that probabilities tend to even out, but only in the long run. And that long run can take more time and money than anyone has.", "ko": "객관적으로 얻는 확률은 보장되지 않는다. 장기적으로 볼 때, 우리는 동전이 절반 정도는 앞면이 나올 것으로 예상하지만, 확률은 스스로를 수정하는 과정이 아니다. 동전에는 기억, 지식, 의지력, 또는 의지가 없다. 모든 일이 반드시 우리의 예상 그대로 풀리게 하는 확률 이론의 대단한 지배자는 존재하지 않는다. 10번 연속으로 '앞면'이 나온다고 해도, 다음 던지기에서 동전이 '뒷면'이 나올 확률은 여전히 50%이다. 뒷면이 나올 가능성은 더 높지 않으며 '나올 때가 된' 것이 아니다. 우연의 과정이 스스로를 바로잡는다는 생각은 도박꾼 오류의 일부이며, Steve Wynn을 비롯한 많은 카지노 소유주가 이 오류로 큰 부를 얻었다. 수백만 명의 사람들이 지불금을 받을 때가 되었다는 착각에 빠져 계속해서 슬롯머신에 돈을 넣었다. 확률이 균등해지는 경향이 있는 것은 사실이지만, 이는 장기적으로 볼 때만 사실이다. 그리고 그 장기에는 어떤 사람이든지 가지고 있는 것보다 더 많은 시간과 돈이 필요할 수 있다.", "read": [{"en": "An objectively obtained probability is not a guarantee.", "ko": "객관적으로 얻는 확률은 보장되지 않는다.", "chunks": [["An objectively obtained probability", "객관적으로 얻은 확률은"], ["is not a guarantee.", "보장이 아니다."]]}, {"en": "Although in the long run, we expect a coin to come up heads half the time, probability is not a self-correcting process.", "ko": "장기적으로 볼 때, 우리는 동전이 절반 정도는 앞면이 나올 것으로 예상하지만, 확률은 스스로를 수정하는 과정이 아니다.", "chunks": [["Although in the long run,", "비록 장기적으로,"], ["we expect a coin to come up heads", "우리는 동전이 앞면이 나올 것이라고 예상하지만"], ["half the time,", "절반의 시간 동안,"], ["probability is not a self-correcting process.", "확률은 스스로를 수정하는 과정이 아니다."]]}, {"en": "The coin has no memory, knowledge, willpower, or volition.", "ko": "동전에는 기억, 지식, 의지력, 또는 의지가 없다.", "chunks": [["The coin has", "동전은 가지고 있지 않다"], ["no memory, knowledge, willpower, or volition.", "기억, 지식, 의지력, 또는 의지를."]]}, {"en": "There is not some overlord of the theory of probability making sure that everything works out just the way you expect.", "ko": "모든 일이 반드시 우리의 예상 그대로 풀리게 하는 확률 이론의 대단한 지배자는 존재하지 않는다.", "chunks": [["There is not", "~이 존재하지 않는다"], ["some overlord of the theory of probability", "확률 이론의 어떤 대단한 지배자가"], ["making sure that", "~을 확실하게 하는"], ["everything works out", "모든 일이 풀리는 것을"], ["just the way you expect.", "바로 여러분이 예상하는 방식으로."]]}, {"en": "If you get \"heads\" ten times in a row, the probability of the coin coming up \"tails\" on the next toss is still 50%.", "ko": "10번 연속으로 '앞면'이 나온다고 해도, 다음 던지기에서 동전이 '뒷면'이 나올 확률은 여전히 50%이다.", "chunks": [["If you get \"heads\" ten times in a row,", "만약 여러분이 '앞면'을 10번 연속으로 얻는다면,"], ["the probability of the coin coming up \"tails\"", "동전이 '뒷면'이 나올 확률은"], ["on the next toss", "다음 던지기에서"], ["is still 50%.", "여전히 50%이다."]]}, {"en": "Tails is not more likely and it is not \"due.\"", "ko": "뒷면이 나올 가능성은 더 높지 않으며 '나올 때가 된' 것이 아니다.", "chunks": [["Tails is not more likely", "뒷면이 나올 가능성은 더 높지 않으며"], ["and it is not \"due.\"", "'나올 때가 된' 것도 아니다."]]}, {"en": "The notion that chance processes correct themselves is part of the gambler's fallacy, and it has made many casino owners, including Steve Wynn, very wealthy.", "ko": "우연의 과정이 스스로를 바로잡는다는 생각은 도박꾼 오류의 일부이며, Steve Wynn을 비롯한 많은 카지노 소유주가 이 오류로 큰 부를 얻었다.", "chunks": [["The notion that chance processes correct themselves", "우연의 과정이 스스로를 바로잡는다는 생각은"], ["is part of the gambler's fallacy,", "도박꾼 오류의 일부이며,"], ["and it has made many casino owners,", "그리고 그것은 많은 카지노 소유주를 ~하게 만들었다,"], ["including Steve Wynn,", "Steve Wynn을 포함하여,"], ["very wealthy.", "매우 부유하게."]]}, {"en": "Millions of people have continued to put money into slot machines under the illusion that their payout is due.", "ko": "수백만 명의 사람들이 지불금을 받을 때가 되었다는 착각에 빠져 계속해서 슬롯머신에 돈을 넣었다.", "chunks": [["Millions of people have continued", "수백만 명의 사람들이 계속해왔다"], ["to put money into slot machines", "슬롯머신에 돈을 넣는 것을"], ["under the illusion that", "~라는 착각에 빠져"], ["their payout is due.", "지불금을 받을 때가 되었다는."]]}, {"en": "It's true that probabilities tend to even out, but only in the long run.", "ko": "확률이 균등해지는 경향이 있는 것은 사실이지만, 이는 장기적으로 볼 때만 사실이다.", "chunks": [["It's true that", "~이 사실이다"], ["probabilities tend to even out,", "확률이 균등해지는 경향이 있는 것은,"], ["but only in the long run.", "하지만 장기적으로만."]]}, {"en": "And that long run can take more time and money than anyone has.", "ko": "그리고 그 장기에는 어떤 사람이든지 가지고 있는 것보다 더 많은 시간과 돈이 필요할 수 있다.", "chunks": [["And that long run", "그리고 그 장기에는"], ["can take more time and money", "더 많은 시간과 돈이 필요할 수 있다"], ["than anyone has.", "어떤 사람이든지 가지고 있는 것보다."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"앞면이 열 번 연속 나온 동전들 뒤에 다음 동전이 와도 앞면 뒷면 확률은 여전히 각각 50퍼센트라는 것을, 동전엔 기억이 없다는 설명과 함께 막대로 보여주는 그림\">\n  <text x=\"300\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">도박꾼의 오류 — 동전엔 기억이 없다</text>\n  <text x=\"40\" y=\"52\" font-family=\"Noto Serif KR\" font-size=\"9.5\" fill=\"#1a1a1a\">앞면 10번 연속 →</text>\n  <circle cx=\"40\" cy=\"80\" r=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/><text x=\"40\" y=\"84\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">H</text><circle cx=\"80\" cy=\"80\" r=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/><text x=\"80\" y=\"84\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">H</text><circle cx=\"120\" cy=\"80\" r=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/><text x=\"120\" y=\"84\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">H</text><circle cx=\"160\" cy=\"80\" r=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/><text x=\"160\" y=\"84\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">H</text><circle cx=\"200\" cy=\"80\" r=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/><text x=\"200\" y=\"84\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">H</text><circle cx=\"240\" cy=\"80\" r=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/><text x=\"240\" y=\"84\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">H</text><circle cx=\"280\" cy=\"80\" r=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/><text x=\"280\" y=\"84\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">H</text><circle cx=\"320\" cy=\"80\" r=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/><text x=\"320\" y=\"84\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">H</text><circle cx=\"360\" cy=\"80\" r=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/><text x=\"360\" y=\"84\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">H</text><circle cx=\"400\" cy=\"80\" r=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/><text x=\"400\" y=\"84\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">H</text>\n  <text x=\"225\" y=\"110\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">10 heads in a row</text>\n  <!-- 다음 던짐 -->\n  <text x=\"300\" y=\"148\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">다음 던짐 — 여전히 반반</text>\n  <!-- 두 확률 막대 -->\n  <g transform=\"translate(160,160)\">\n    <rect x=\"0\" y=\"0\" width=\"130\" height=\"40\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"65\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">앞면 50%</text>\n    <text x=\"65\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\">heads</text>\n  </g>\n  <g transform=\"translate(310,160)\">\n    <rect x=\"0\" y=\"0\" width=\"130\" height=\"40\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"65\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">뒷면 50%</text>\n    <text x=\"65\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\">tails</text>\n  </g>\n  <text x=\"462\" y=\"184\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"end\" fill=\"#c8102e\">‘나올 때가 됐다’</text>\n  <line x1=\"469.60\" y1=\"175.60\" x2=\"478.40\" y2=\"184.40\" stroke=\"#c8102e\" stroke-width=\"1.98\" stroke-linecap=\"round\"/><line x1=\"478.40\" y1=\"175.60\" x2=\"469.60\" y2=\"184.40\" stroke=\"#c8102e\" stroke-width=\"1.98\" stroke-linecap=\"round\"/>\n  <text x=\"300\" y=\"238\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">the coin has no memory · 50 / 50 every time</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '객관적 확률 ≠ 보장 / 자기수정 ✗'이고, 마지막은 '확률은 ‘장기적으로만’ 균등해진다'로 정리된다."}, {"no": "11", "title": "Why Farms Are Flawed Laboratories", "ktitle": "농장은 결함 있는 실험실", "field": "농업·과학", "page": "기출 예제 01", "oneline": "환경적 학습 = 농부가 ‘이익 정보(결과)’를 관찰해 결정하는 것.", "tldr": ["환경적 학습 = 농부가 ‘이익 정보(결과)’를 관찰해 결정하는 것.", "핵심 기준은 ‘시험 가능성’ — 그런데 이게 진짜 문제다.", "농장은 통제 불가한 ‘결함 실험실’ → 상대적 이점도 측정 어렵다."], "analogy": "농부가 ‘이 방법이 잘됐나?’ 결과를 보고 배우려 해도, 진짜 실험실처럼 조건을 통제할 수 없어요. 날씨·토양이 제각각이라 깔끔한 비교가 안 되는 거죠.", "bg": "분야는 농업·과학이에요. 핵심 개념은 ‘환경적 학습’ — 농부가 결과(이익 정보)를 보고 결정한다는 것. → 농장이 왜 ‘결함 있는 실험실’인지에 주목하며 읽으세요.", "flow": [{"kind": "정의", "t": "환경적 학습 = ‘이익 정보(결과)’ 관찰로 결정"}, {"kind": "기준", "t": "상대적 이점·양립성·난이도·‘시험 가능성’ 평가"}, {"kind": "문제", "t": "‘시험 가능성’이 진짜 난제", "d": "농장 = 매우 결함 있는 실험실."}, {"kind": "한계", "t": "통제 조건 불가 + 복잡·관찰난 현상"}, {"kind": "결론", "t": "‘상대적 이점’ 측정조차 어렵다"}], "quiz": [["‘환경적 학습’이란?", "농부가 자기·이웃 농장의 경험적 ‘이익 정보(결과)’를 지침 삼아 결정을 내리는 거예요."], ["농장이 ‘결함 있는 실험실’인 이유는?", "연구 시설처럼 통제된 조건을 만들 수 없고, 복잡하고 관찰하기 어려운 현상에 자주 부딪치기 때문이에요."], ["핵심 한 문장?", "농부의 관찰 학습은 농장이 통제 불가한 실험실이라 ‘시험 가능성·상대적 이점’ 평가가 어렵다."]], "vocab": [["payoff", "이익·보상"], ["empirical", "경험적인"], ["compatibility", "양립성·호환성"], ["trialability", "시험 가능성"], ["flawed", "결함 있는"], ["controlled conditions", "통제된 조건"], ["confront", "직면하다"]], "en": "Environmental learning occurs when farmers base decisions on observations of \"payoff\" information. They may observe their own or neighbors' farms, but it is the empirical results they are using as a guide, not the neighbors themselves. They are looking at farming activities as experiments and assessing such factors as relative advantage, compatibility with existing resources, difficulty of use, and \"trialability\" ─ how well can it be experimented with. But that criterion of \"trialability\" turns out to be a real problem; it's true that farmers are always experimenting, but working farms are very flawed laboratories. Farmers cannot set up the controlled conditions of professional test plots in research facilities. Farmers also often confront complex and difficult-to-observe phenomena that would be hard to manage even if they could run controlled experiments. Moreover farmers can rarely acquire payoff information on more than a few of the production methods they might use, which makes the criterion of \"relative advantage\" hard to measure.", "ko": "환경적 학습은 농부들이 '이익' 정보에 관한 관찰에 근거하여 결정할 때 발생한다. 그들은 자기 자신이나 이웃의 농장을 관찰할 수도 있지만, 그들이 지침으로 삼고 있는 것은 이웃 자체가 아니라 경험적 결과이다. 그들은 농업 활동을 실험으로 보고 상대적 이점, 기존 자원과의 양립성, 사용의 어려움, 그리고 '시험 가능성', 즉 그것이 얼마나 잘 실험될 수 있는가와 같은 요인을 평가하고 있다. 하지만 그 '시험 가능성'의 기준은 진짜 문제인 것으로 밝혀지는데, 농부들이 항상 실험하는 것은 사실이지만, 연구하는 농장은 매우 결함이 있는 실험실이다. 농부는 연구 시설에서 전문적인 시험 구성의 통제된 조건을 마련할 수 없다. 통제된 실험을 할 수 있다고 해도, 농부는 복잡하고 관찰하기 어려워 관리하기 힘들 현상에 자주 직면하기도 한다. 게다가 농부는 자신이 사용할 수 있는 몇 가지 생산 방법을 넘어서는 것에 관한 이익 정보를 거의 얻을 수 없고, 이는 '상대적 이점'의 기준을 측정하기 어렵게 만든다.", "read": [{"en": "Environmental learning occurs when farmers base decisions on observations of \"payoff\" information.", "ko": "환경적 학습은 농부들이 '이익' 정보에 관한 관찰에 근거하여 결정할 때 발생한다.", "chunks": [["Environmental learning occurs", "환경적 학습은 일어난다"], ["when farmers base decisions", "농부들이 결정을 ~에 근거할 때"], ["on observations of \"payoff\" information.", "'이익' 정보에 관한 관찰에."]]}, {"en": "They may observe their own or neighbors' farms, but it is the empirical results they are using as a guide, not the neighbors themselves.", "ko": "그들은 자기 자신이나 이웃의 농장을 관찰할 수도 있지만, 그들이 지침으로 삼고 있는 것은 이웃 자체가 아니라 경험적 결과이다.", "chunks": [["They may observe", "그들은 관찰할 수도 있다"], ["their own or neighbors' farms,", "자기 자신이나 이웃의 농장을,"], ["but it is the empirical results", "하지만 ~인 것은 경험적 결과이다"], ["they are using as a guide,", "그들이 지침으로 삼는 것은,"], ["not the neighbors themselves.", "이웃 자체가 아니다."]]}, {"en": "They are looking at farming activities as experiments and assessing such factors as relative advantage, compatibility with existing resources, difficulty of use, and \"trialability\" ─ how well can it be experimented with.", "ko": "그들은 농업 활동을 실험으로 보고 상대적 이점, 기존 자원과의 양립성, 사용의 어려움, 그리고 '시험 가능성', 즉 그것이 얼마나 잘 실험될 수 있는가와 같은 요인을 평가하고 있다.", "chunks": [["They are looking at farming activities", "그들은 농업 활동을 보고 있다"], ["as experiments", "실험으로"], ["and assessing such factors as", "그리고 ~과 같은 요인을 평가하고 있다"], ["relative advantage,", "상대적 이점,"], ["compatibility with existing resources,", "기존 자원과의 양립성,"], ["difficulty of use,", "사용의 어려움,"], ["and \"trialability\"", "그리고 '시험 가능성'"], ["─ how well can it be experimented with.", "즉, 그것이 얼마나 잘 실험될 수 있는가."]]}, {"en": "But that criterion of \"trialability\" turns out to be a real problem; it's true that farmers are always experimenting, but working farms are very flawed laboratories.", "ko": "하지만 그 '시험 가능성'의 기준은 진짜 문제인 것으로 밝혀지는데, 농부들이 항상 실험하는 것은 사실이지만, 연구하는 농장은 매우 결함이 있는 실험실이다.", "chunks": [["But that criterion of \"trialability\"", "하지만 그 '시험 가능성'의 기준은"], ["turns out to be a real problem;", "진짜 문제인 것으로 밝혀진다;"], ["it's true that farmers are always experimenting,", "농부들이 항상 실험하는 것은 사실이지만,"], ["but working farms are very flawed laboratories.", "하지만 연구하는 농장은 매우 결함이 있는 실험실이다."]]}, {"en": "Farmers cannot set up the controlled conditions of professional test plots in research facilities.", "ko": "농부는 연구 시설에서 전문적인 시험 구성의 통제된 조건을 마련할 수 없다.", "chunks": [["Farmers cannot set up", "농부는 설치할 수 없다"], ["the controlled conditions", "통제된 조건을"], ["of professional test plots", "전문적인 시험 구성의"], ["in research facilities.", "연구 시설에서."]]}, {"en": "Farmers also often confront complex and difficult-to-observe phenomena that would be hard to manage even if they could run controlled experiments.", "ko": "통제된 실험을 할 수 있다고 해도, 농부는 복잡하고 관찰하기 어려워 관리하기 힘들 현상에 자주 직면하기도 한다.", "chunks": [["Farmers also often confront", "농부는 또한 자주 직면한다"], ["complex and difficult-to-observe phenomena", "복잡하고 관찰하기 어려운 현상에"], ["that would be hard to manage", "관리하기 힘들"], ["even if they could run controlled experiments.", "비록 통제된 실험을 할 수 있다 해도."]]}, {"en": "Moreover farmers can rarely acquire payoff information on more than a few of the production methods they might use, which makes the criterion of \"relative advantage\" hard to measure.", "ko": "게다가 농부는 자신이 사용할 수 있는 몇 가지 생산 방법을 넘어서는 것에 관한 이익 정보를 거의 얻을 수 없고, 이는 '상대적 이점'의 기준을 측정하기 어렵게 만든다.", "chunks": [["Moreover farmers can rarely acquire", "게다가 농부는 거의 얻을 수 없다"], ["payoff information", "이익 정보를"], ["on more than a few of the production methods", "몇 가지 이상의 생산 방법에 관한"], ["they might use,", "그들이 사용할 수 있는,"], ["which makes the criterion of \"relative advantage\"", "이는 '상대적 이점'의 기준을 ~하게 만든다"], ["hard to measure.", "측정하기 어렵게."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 실험실은 변수를 통제할 수 있어 깔끔하지만, 오른쪽 농장은 날씨 토양 병해충 등 통제 불가능한 변수가 뒤엉켜 시험 가능성이 낮은 결함 있는 실험실이라는 대조\">\n  <text x=\"150\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">실험실 — 통제 가능</text>\n  <text x=\"450\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">농장 — 결함 있는 실험실</text>\n  <line x1=\"300\" y1=\"40\" x2=\"300\" y2=\"210\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <!-- 좌: 실험실 (정렬된 플라스크 격자) -->\n  <g transform=\"translate(40,56)\">\n    <rect x=\"0\" y=\"0\" width=\"220\" height=\"150\" rx=\"6\" fill=\"#f0faf3\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <g transform=\"translate(40,40)\"><path d=\"M -8 -14 L -8 -4 L -14 10 Q -14 16 -8 16 L 8 16 Q 14 16 14 10 L 8 -4 L 8 -14 Z\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/><line x1=\"-10\" y1=\"-14\" x2=\"10\" y2=\"-14\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/></g><g transform=\"translate(110,40)\"><path d=\"M -8 -14 L -8 -4 L -14 10 Q -14 16 -8 16 L 8 16 Q 14 16 14 10 L 8 -4 L 8 -14 Z\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/><line x1=\"-10\" y1=\"-14\" x2=\"10\" y2=\" 문 연구자만의 영역이었다.", "온라인 접근으로 옛 기사가 새 기사의 ‘맥락’으로 자주 인용된다.", "독자는 뉴스를 더 큰 경제·사회·문화 이슈의 ‘결과’로 이해하게 된다."], "analogy": "예전엔 ‘오늘 신문’만 봤다면, 이제는 옛 기사까지 검색해 ‘이 사건의 배경’을 같이 읽죠. 뉴스가 일회성 구경거리가 아니라 큰 흐름의 한 장면으로 보이는 거예요.", "bg": "분야는 미디어예요. 웹 이전엔 신문 기록보관소(archive)가 전문 연구자만의 영역이었다는 것이 배경. → 온라인 아카이브가 저널리즘을 어떻게 확장하는지에 주목하며 읽으세요.", "flow": [{"kind": "과거", "t": "기록보관소 = 전문 연구자만의 영역 / 뉴스=‘최신’"}, {"kind": "변화", "t": "온라인 접근 → 옛 기사가 ‘맥락’으로 인용"}, {"kind": "독자", "t": "기저 이슈·맥락에 관여할 준비", "d": "인쇄 소비자에겐 불가능했던 일."}, {"kind": "결론", "t": "뉴스 = 일회성 구경거리 ✗ → 큰 이슈의 ‘결과’로 이해"}], "quiz": [["온라인 기록보관소가 저널리즘에 준 변화는?", "옛 기사가 새 기사의 맥락으로 자주 인용되며 저널리즘의 ‘유통 기한’이 크게 늘었어요."], ["온라인 뉴스 소비자가 인쇄 소비자와 다른 점은?", "뉴스의 기저 이슈·맥락에 더 깊이 관여할 준비가 되어 있다는 점이에요."], ["핵심 한 문장?", "쉽게 접근하는 온라인 기록보관소 덕에 독자는 뉴스를 더 큰 경제·사회·문화 이슈의 결과로 이해하게 됐다."]], "vocab": [["archive", "기록 보관소"], ["musty", "곰팡내 나는"], ["by definition", "당연히·정의상"], ["shelf life", "유통 기한"], ["departure", "새로운 출발·일탈"], ["emergent", "떠오르는·발생하는"], ["manifest", "분명한·명백한"]], "en": "Before the web, newspaper archives were largely the musty domain of professional researchers and journalism students. Journalism was, by definition, current. The general accessibility of archives has greatly extended the shelf life of journalism, with older stories now regularly cited to provide context for more current ones. With regard to how meaning is made of complex issues encountered in the news, this departure can be understood as a readiness by online news consumers to engage with the underlying issues and contexts of the news that was not apparent in, or even possible for, print consumers. One of the emergent qualities of online news, determined in part by the depth of readily accessible online archives, seems to be the possibility of understanding news stories as the manifest outcomes of larger economic, social and cultural issues rather than short-lived and unconnected media spectacles.", "ko": "웹 이전에 신문 기록 보관소는 주로 전문적 연구원과 언론학과 학생의 곰팡내 나는 영역이었다. 저널리즘은 당연히 최신에 관한 것이었다. 자료 보관소의 일반적 접근 가능성은 더 오래된 기사가 이제는 자주 더 최신 기사에 맥락을 제공하기 위해 인용되면서, 저널리즘의 유통 기한을 크게 늘리게 되었다. 뉴스에서 마주치는 복잡한 이슈에 관해 의미가 어떻게 형성되는가와 관련하여, 이 새로운 출발은 온라인 뉴스 소비자가 인쇄물 소비자에게는 명백하지 않았던, 또는 심지어 가능하지 않았던, 뉴스의 기저 이슈와 맥락에 관여할 준비로 이해될 수 있다. 온라인 뉴스의 떠오르는 특성 중 하나는, 부분적으로는 쉽게 접근할 수 있는 온라인 기록 보관소의 깊이로 결정되는데, 뉴스 기사가 수명이 짧고 연결성이 없는 미디어 구경거리가 아니라 더 큰 경제적, 사회적, 문화적 이슈의 분명한 결과로 이해될 가능성인 듯 보인다.", "read": [{"en": "Before the web, newspaper archives were largely the musty domain of professional researchers and journalism students.", "ko": "웹 이전에 신문 기록 보관소는 주로 전문적 연구원과 언론학과 학생의 곰팡내 나는 영역이었다.", "chunks": [["Before the web,", "웹 이전에,"], ["newspaper archives were largely", "신문 기록 보관소는 주로 ~이었다"], ["the musty domain", "곰팡내 나는 영역"], ["of professional researchers and journalism students.", "전문적 연구원과 언론학과 학생의."]]}, {"en": "Journalism was, by definition, current.", "ko": "저널리즘은 당연히 최신에 관한 것이었다.", "chunks": [["Journalism was, by definition,", "저널리즘은 당연히,"], ["current.", "최신에 관한 것이었다."]]}, {"en": "The general accessibility of archives has greatly extended the shelf life of journalism, with older stories now regularly cited to provide context for more current ones.", "ko": "자료 보관소의 일반적 접근 가능성은 더 오래된 기사가 이제는 자주 더 최신 기사에 맥락을 제공하기 위해 인용되면서, 저널리즘의 유통 기한을 크게 늘리게 되었다.", "chunks": [["The general accessibility of archives", "자료 보관소의 일반적 접근 가능성은"], ["has greatly extended the shelf life of journalism,", "저널리즘의 유통 기한을 크게 늘렸다,"], ["with older stories now regularly cited", "더 오래된 기사가 이제는 정기적으로 인용되면서"], ["to provide context", "맥락을 제공하기 위해"], ["for more current ones.", "더 최신 기사에."]]}, {"en": "With regard to how meaning is made of complex issues encountered in the news, this departure can be understood as a readiness by online news consumers to engage with the underlying issues and contexts of the news that was not apparent in, or even possible for, print consumers.", "ko": "뉴스에서 마주치는 복잡한 이슈에 관해 의미가 어떻게 형성되는가와 관련하여, 이 새로운 출발은 온라인 뉴스 소비자가 인쇄물 소비자에게는 명백하지 않았던, 또는 심지어 가능하지 않았던, 뉴스의 기저 이슈와 맥락에 관여할 준비로 이해될 수 있다.", "chunks": [["With regard t e=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"12.0\" x2=\"4.8\" y2=\"22.8\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/></g><g transform=\"translate(425,205)\"><circle cx=\"0\" cy=\"-8.4\" r=\"5.3999999999999995\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><circle cx=\"-1.7999999999999998\" cy=\"-9.0\" r=\"1.2\" fill=\"#1FA34A\"/><circle cx=\"1.7999999999999998\" cy=\"-9.0\" r=\"1.2\" fill=\"#1FA34A\"/><path d=\"M -1.7999999999999998 -6.0 Q 0 -4.8 1.7999999999999998 -6.0\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/><line x1=\"0\" y1=\"-3.0\" x2=\"0\" y2=\"12.0\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"1.2\" x2=\"-6.6\" y2=\"6.0\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"1.2\" x2=\"6.6\" y2=\"6.0\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"12.0\" x2=\"-4.8\" y2=\"22.8\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"12.0\" x2=\"4.8\" y2=\"22.8\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/></g><g transform=\"translate(450,205)\"><circle cx=\"0\" cy=\"-8.4\" r=\"5.3999999999999995\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><circle cx=\"-1.7999999999999998\" cy=\"-9.0\" r=\"1.2\" fill=\"#1FA34A\"/><circle cx=\"1.7999999999999998\" cy=\"-9.0\" r=\"1.2\" fill=\"#1FA34A\"/><path d=\"M -1.7999999999999998 -6.0 Q 0 -4.8 1.7999999999999998 -6.0\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/><line x1=\"0\" y1=\"-3.0\" x2=\"0\" y2=\"12.0\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"1.2\" x2=\"-6.6\" y2=\"6.0\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"1.2\" x2=\"6.6\" y2=\"6.0\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"12.0\" x2=\"-4.8\" y2=\"22.8\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"12.0\" x2=\"4.8\" y2=\"22.8\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/></g>\n  <text x=\"425\" y=\"244\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">모든 독자 — 맥락으로 활용</text>\n  <text x=\"150\" y=\"232\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">news = a one-off spectacle</text>\n</svg>", "caption": "이 지문은 4단계로 전개된다. 첫 출발점은 '기록보관소 = 전문 연구자만의 영역 / 뉴스=‘최신’'이고, 마지막은 '뉴스 = 일회성 구경거리 ✗ → 큰 이슈의 ‘결과’로 이해'로 정리된다."}]};

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

troke-width=\"2.2\"/>\n    <text x=\"100\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">명시적 · 언어로 전달 가능</text>\n    <text x=\"100\" y=\"37\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">explicit · verbally communicated</text>\n  </g>\n  <text x=\"400\" y=\"168\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">인간만의 결정적 차이 ↓</text>\n  <!-- 좌측 '곤충은 여기까지' 라벨 -->\n  <text x=\"95\" y=\"150\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">여기까지 공유</text>\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">shared base, but only humans can put it into words</text>\n</svg>", "caption": "가운데 what where when 일화적 기억 상자를 곤충(말벌)과 인간이 함께 공유하지만, 인간에게만 언어로 전달 가능한 명시적 기억이라는 추가 상자가 연결되어 결정적 차이를 보이는 그림"}, {"no": "8", "title": "Ageing Spectators", "ktitle": "고령화와 스포츠 후원의 재편", "field": "사회·스포츠", "page": "06강 Ex.08", "oneline": "고령화로 격렬한 스포츠의 참여·관람이 줄어든다.", "tldr": ["고령화로 격렬한 스포츠의 참여·관람이 줄어든다.", "이에 따라 시설·중계 시간·후원 구조를 재편해야 한다.", "스포츠는 ‘젊음’ 이미지에만 기대선 안 된다."], "analogy": "", "bg": "분야는 사회·스포츠 산업이에요. 배경은 ‘고령화(ageing)’ → 격렬한 스포츠 참여·관람 감소. → 그 변화가 시설·중계 시간·후원사 전략을 어떻게 재편하게 만드는지에 주목하며 읽으세요.", "flow": [{"kind": "배경", "t": "인구 고령화"}, {"kind": "전개", "t": "격렬 스포츠 참여·관람 ↓"}, {"kind": "대응", "t": "시설·중계·후원 재편 필요"}, {"kind": "결론", "t": "스포츠 후원 전략의 재발명"}], "quiz": [["고령화가 스포츠에 주는 영향은?", "격렬한 스포츠의 참여·관람이 줄어요."], ["그래서 무엇을 재편해야 하나요?", "시설·중계 시간·후원사 전략을 재편해야 해요."]], "vocab": [["★ ramifications for", "~에 미치는 영향·파급 효과"], ["★ substantial", "상당한·실질적인"], ["⊕ engage in", "~에 참여하다·종사하다"], ["★ athletic", "매우 힘차고 활발한·운동의"], ["◇ market (V)", "(상품을) 마케팅하다·판매하다"], ["⊕ older spectator / supporter", "나이 든 관중·팬"], ["⊕ access to", "~에 대한 접근성"], ["⊕ television coverage", "텔레비전 중계"], ["★ 'ageing viewer' syndrome", "고령화되고 있는 시청자 증후군"], ["★ herald", "알리다·도래를 예고하다"], ["⊕ realisation", "인식·깨달음"], ["★ sponsors", "후원사·스폰서"], ["◇ the under-35s", "35세 미만 (집단)"], ["★ combined with", "~과 결합된"], ["◇ comfort of older age", "노년의 안락함"]], "en": "With people living longer and the average age increasing markedly, the ramifications for sport are substantial. Fewer people are likely to engage in the most popular traditional and, incidentally, most athletic sports, such as soccer, other forms of football, and basketball. These sports will need to market their products differently in order to satisfy the requirements of the older spectator or supporter. This may mean far more comfortable sport areas with greater and better access to car parks, bars, and restaurants. It may mean showing top sports during the day or much earlier in the evening, with far less television coverage on Fridays and Saturdays when older viewers prefer to visit friends, go to restaurants or spend time at the local pub or club. The 'ageing viewer' syndrome, for such it may well be, will probably herald a realisation that new sponsors will be required for sport. Colas and sport shoes may be fine for the under-35s, but the older generation may prefer a good red wine and comfortable slippers. It will be the sporting organisations and sponsors who can create the idea of youth combined with the comfort of older age which will be most successful in the next half century.", "ko": "사람들이 더 오래 살고 평균 연령이 현저하게 증가함에 따라, 스포츠에 미치는 영향은 상당하다. 축구, 다른 형태의 축구, 농구와 같이 가장 인기가 있고 전통적이며 매우 힘찬 스포츠에 참여하는 사람들은 더 적어질 가능성이 있다. 이러한 스포츠는 나이 든 관중이나 팬의 요구를 만족시키기 위해 그들의 상품을 다르게 마케팅해야 할 것이다. 이것은 주차장, 술집, 식당에 대한 접근성이 더 크고 더 나은 훨씬 더 편안한 스포츠 공간을 의미할 수도 있다. 이것은 낮이나 저녁의 훨씬 더 이른 시간에 최고 스포츠를 보여 주고, 나이 든 시청자들이 친구들을 방문하거나 식당에 가거나 지역 술집·클럽에서 시간을 보내는 것을 선호하는 금요일·토요일에는 텔레비전 중계를 훨씬 더 줄이는 것을 의미할 수도 있다. '고령화 시청자' 증후군은, 실로 그렇게 부를 만한데, 아마도 스포츠에 새로운 후원사가 필요할 것이라는 인식의 도래를 알릴 것이다. 콜라와 운동화는 35세 미만에게는 괜찮을지 모르지만, 더 나이 든 세대는 훌륭한 적포도주와 편안한 슬리퍼를 선호할 수도 있다. 다음 반 세기 동안 가장 성공할 주체는, 노년의 안락함과 결합된 젊음의 개념을 만들어 낼 수 있는 스포츠 단체와 후원사일 것이다.", "read": [{"en": "With people living longer and the average age increasing markedly, the ramifications for sport are substantial.", "ko": "사람들이 더 오래 살고 평균 연령이 현저하게 증가함에 따라, 스포츠에 미치는 영향은 상당하다.", "chunks": [["With people living longer", "사람들이 더 오래 살고"], ["and the average age increasing markedly,", "평균 연령이 현저히 증가함에 따라,"], ["the ramifications for sport are substantial.", "스포츠에 미치는 영향은 상당하다."]]}, {"en": "Fewer people are likely to engage in the most popular traditional and, incidentally, most athletic sports, such as soccer, other forms of football, and basketball.", "ko": "축구, 다른 형태의 축구, 농구와 같이 가장 인기가 있고 전통적이며 매우 힘찬 스포츠에 참여하는 사람들은 더 적어질 가능성이 있다.", "chunks": [["Fewer people are likely to engage in", "더 적은 사람들이 ~에 참여할 가능성이 있다"], ["the most popular traditional and, incidentally, most athletic sports,", "가장 인기 있고 전통적이며, 덧붙여 매우 힘찬 스포츠에,"], ["such as soccer, other forms of football, and basketball.", "축구, 다른 형태의 축구, 농구 같은."]]}, {"en": "These sports will need to market their products differently in order to satisfy the requirements of the older spectator or supporter.", "ko": "이러한 스포츠는 나이 든 관중이나 팬의 요구를 만족시키기 위해 그들의 상품을 다르게 마케팅해야 할 것이다.", "chunks": [["These sports will need to market", "이러한 스포츠는 마케팅해야 할 것이다"], ["their products differently", "그들의 상품을 다르게"], ["in order to satisfy the requirements", "요구를 만족시키기 위해"], ["of the older spectator or supporter.", "나이 든 관중이나 팬의."]]}, {"en": "This may mean far more comfortable sport areas with greater and better access to car parks, bars, and restaurants.", "ko": "이것은 주차장, 술집, 식당에 대한 접근성이 더 크고 더 나은 훨씬 더 편안한 스포츠 공간을 의미할 수도 있다.", "chunks": [["This may mean", "이것은 의미할 수도 있다"], ["far more comfortable sport areas", "훨씬 더 편안한 스포츠 공간을"], ["with greater and better access", "더 크고 더 나은 접근성을 가진"], ["to car parks, bars, and restaurants.", "주차장, 술집, 식당에 대한."]]}, {"en": "It may mean showing top sports during the day or much earlier in the evening, with far less television coverage on Fridays and Saturdays when older viewers prefer to visit friends, go to restaurants or spend time at the local pub or club.", "ko": "이것은 낮이나 저녁의 훨씬 더 이른 시간에 최고 스포츠를 보여 주고, 나이 든 시청자들이 친구들을 방문하거나 식당에 가거나 지역 술집·클럽에서 시간을 보내는 것을 선호하는 금요일·토요일에는 텔레비전 중계를 훨씬 더 줄이는 것을 의미할 수도 있다.", "chunks": [["It may mean showing top sports", "이것은 최고 스포츠를 보여주는 것을 의미할 수도 있다"], ["during the day or much earlier in the evening,", "낮이나 저녁 훨씬 더 이른 시간에,"], ["with far less television coverage", "훨씬 더 적은 텔레비전 중계와 함께"], ["on Fridays and Saturdays", "금요일과 토요일에는"], ["when older viewers prefer to visit friends,", "나이 든 시청자들이 친구들을 방문하기를 선호하는,"], ["go to restaurants or spend time at the local pub or club.", "식당에 가거나 지역 술집·클럽에서 시간을 보내는."]]}, {"en": "The 'ageing viewer' syndrome, for such it may well be, will probably herald a realisation that new sponsors will be required for sport.", "ko": "'고령화 시청자' 증후군은, 실로 그렇게 부를 만한데, 아마도 스포츠에 새로운 후원사가 필요할 것이라는 인식의 도래를 알릴 것이다.", "chunks": [["The 'ageing viewer' syndrome,", "'고령화 시청자' 증후군은,"], ["for such it may well be,", "실로 그렇게 부를 만한데,"], ["will probably herald a realisation", "아마도 인식의 도래를 알릴 것이다"], ["that new sponsors will be required for sport.", "스포츠에 새로운 후원사가 필요할 것이라는."]]}, {"en": "Colas and sport shoes may be fine for the under-35s, but the older generation may prefer a good red wine and comfortable slippers.", "ko": "콜라와 운동화는 35세 미만에게는 괜찮을지 모르지만, 더 나이 든 세대는 훌륭한 적포도주와 편안한 슬리퍼를 선호할 수도 있다.", "chunks": [["Colas and sport shoes may be fine", "콜라와 운동화는 괜찮을 수도 있다"], ["for the under-35s,", "35세 미만에게는,"], ["but the older generation may prefer", "그러나 더 나이 든 세대는 선호할 수도 있다"], ["a good red wine and comfortable slippers.", "훌륭한 적포도주와 편안한 슬리퍼를."]]}, {"en": "It will be the sporting organisations and sponsors who can create the idea of youth combined with the comfort of older age which will be most successful in the next half century.", "ko": "다음 반 세기 동안 가장 성공할 주체는, 노년의 안락함과 결합된 젊음의 개념을 만들어 낼 수 있는 스포츠 단체와 후원사일 것이다.", "chunks": [["It will be the sporting organisations and sponsors", "~인 것은 스포츠 단체와 후원사일 것이다"], ["who can create the idea of youth", "젊음의 개념을 만들 수 있는"], ["combined with the comfort of older age", "노년의 안락함과 결합된"], ["which will be most successful", "가장 성공할"], ["in the next half century.", "다음 반 세기 동안."]]}], "metaphor": "<svg viewBox=\"0 0 600 275\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 인구 고령화가 격렬 스포츠 참여 감소로 이어지고 세 가지 재편 영역으로 연결되며, 하단에 콜라와 운동화로 표현된 젊음과 와인과 슬리퍼로 표현된 노년의 안락함을 결합한 주체가 승자가 되는 그림\">\n  <!-- 상단 인과 -->\n  <g transform=\"translate(30,22)\">\n    <rect x=\"0\" y=\"0\" width=\"150\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <text x=\"75\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">인구 고령화 ↑</text>\n    <text x=\"75\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">ageing population</text>\n  </g>\n  <line x1=\"180\" y1=\"42\" x2=\"232\" y2=\"42\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/><polygon points=\"232,42 224,38 224,46\" fill=\"#1a1a1a\"/>\n  <g transform=\"translate(235,22)\">\n    <rect x=\"0\" y=\"0\" width=\"175\" height=\"40\" rx=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <text x=\"87\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">격렬 스포츠 참여 ↓</text>\n    <text x=\"87\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">fewer in athletic sports</text>\n  </g>\n  <text x=\"500\" y=\"46\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">→ 재편 필요</text>\n  <!-- 3 재편 영역 -->\n  <g font-family=\"Noto Serif KR\" font-weight=\"700\">\n    <g transform=\"translate(30,78)\"><rect x=\"0\" y=\"0\" width=\"170\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.3\"/><text x=\"85\" y=\"17\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">① 시설·접근성</text><text x=\"85\" y=\"31\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">comfortable access</text></g>\n    <g transform=\"translate(215,78)\"><rect x=\"0\" y=\"0\" width=\"170\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.3\"/><text x=\"85\" y=\"17\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">② 중계 시간대</text><text x=\"85\" y=\"31\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">timing of coverage</text></g>\n    <g transform=\"translate(400,78)\"><rect x=\"0\" y=\"0\" width=\"170\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.3\"/><text x=\"85\" y=\"17\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">③ 새 후원사</text><text x=\"85\" y=\"31\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">new sponsors</text></g>\n  </g>\n  <!-- 하단 승자 결합 -->\n  <rect x=\"30\" y=\"138\" width=\"540\" height=\"118\" rx=\"8\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n  <text x=\"300\" y=\"158\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">승자 — 젊음 + 노년의 안락함 결합</text>\n  <!-- 젊음 클러스터 -->\n  <g transform=\"translate(95,170)\">\n    <!-- 콜라컵 -->\n    <g transform=\"translate(0,0)\">\n      <path d=\"M -10 0 L 10 0 L 7 38 L -7 38 Z\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"-9\" y1=\"8\" x2=\"9\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"2\" y1=\"-8\" x2=\"6\" y2=\"2\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"52\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">cola</text>\n    </g>\n    <!-- 운동화 -->\n    <g transform=\"translate(55,18)\">\n      <path d=\"M -22 12 L -22 4 Q -10 2 -2 -6 Q 4 -10 12 -6 L 20 6 Q 24 9 24 12 Z\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"-22\" y1=\"12\" x2=\"24\" y2=\"12\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <line x1=\"-2\" y1=\"-6\" x2=\"2\" y2=\"2\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/><line x1=\"4\" y1=\"-7\" x2=\"8\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <text x=\"0\" y=\"30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">sneakers</text>\n    </g>\n    <text x=\"30\" y=\"74\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">젊음</text>\n  </g>\n  <text x=\"300\" y=\"212\" font-family=\"Noto Serif\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">+</text>\n  <!-- 노년 안락 클러스터 -->\n  <g transform=\"translate(395,170)\">\n    <!-- 와인잔 -->\n    <g transform=\"translate(0,0)\">\n      <path d=\"M -11 0 Q -11 16 0 20 Q 11 16 11 0 Z\" fill=\"#fdf2f4\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"20\" x2=\"0\" y2=\"34\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"-8\" y1=\"36\" x2=\"8\" y2=\"36\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <path d=\"M -8 3 Q 0 9 8 3\" fill=\"#c8102e\" fill-opacity=\"0.25\" stroke=\"none\"/>\n      <text x=\"0\" y=\"50\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">red wine</text>\n    </g>\n    <!-- 슬리퍼 -->\n    <g transform=\"translate(58,20)\">\n      <ellipse cx=\"0\" cy=\"8\" rx=\"24\" ry=\"9\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <path d=\"M -18 4 Q -8 -6 6 0 Q 12 3 10 8\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">slippers</text>\n    </g>\n    <text x=\"35\" y=\"74\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">노년의 안락</text>\n  </g>\n  <!-- = 승자 -->\n  <text x=\"300\" y=\"250\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">= wins the next 50 years</text>\n</svg>", "caption": "상단에 인구 고령화가 격렬 스포츠 참여 감소로 이어지고 세 가지 재편 영역으로 연결되며, 하단에 콜라와 운동화로 표현된 젊음과 와인과 슬리퍼로 표현된 노년의 안락함을 결합한 주체가 승자가 되는 그림"}, {"no": "9", "title": "Portion-Trained Eaters", "ktitle": "정량에 길든 식습관", "field": "심리·식생활", "page": "06강 Ex.09", "oneline": "우리는 주어진 양을 통째로 먹도록 길들여져 있다.", "tldr": ["우리는 주어진 양을 통째로 먹도록 길들여져 있다.", "그래서 식당의 큰 1인분에 쉽게 과식한다.", "음식의 ‘밀도(칼로리)’에도 쉽게 속는다."], "analogy": "", "bg": "분야는 심리·식생활이에요. 핵심 — 우리는 ‘주어진 1인분을 통째로 먹도록 학습’돼 있다는 것. → 식당의 큰 1인분과 음식 밀도에 우리가 왜 쉽게 속는지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "‘정해진 양 = 다 먹는다’ 학습"}, {"kind": "전개", "t": "식당의 큰 1인분에 과식"}, {"kind": "전개", "t": "음식 밀도(칼로리)에 속음"}, {"kind": "결론", "t": "환경이 섭취량을 좌우"}], "quiz": [["우리는 양을 어떻게 학습했나요?", "주어진 1인분을 통째로 먹도록 길들여졌어요."], ["식당에서 왜 과식하나요?", "큰 1인분과 높은 밀도에 쉽게 속기 때문이에요."]], "vocab": [["⊕ three-fourths of", "~의 4분의 3"], ["⊕ typically", "일반적으로"], ["★ completely consume", "완전히 섭취하다·통째로 먹다"], ["★ defined quantity", "정해진 양"], ["◇ early exposures to", "~에 처음 접하는 것"], ["★ comfortable satiety", "충분한 포만감"], ["⊕ an adequate level of energy", "충분한 수준의 에너지"], ["★ entire portions", "1인분 전체"], ["★ energy dense / dilute", "에너지 밀도가 높은 / 낮은"], ["★ regardless of", "~에 관계없이"], ["◇ serving bowls", "1인분용 그릇 (제품)"], ["⊕ commercial source", "상업적 공급원"], ["★ vary between A and B", "A에서 B까지 다양하다"], ["★ yield satiety", "포만감을 가져오다"], ["★ be tricked", "속다·기만당하다"]], "en": "How often do you eat three-fourths of a sandwich or cookie? Typically, we completely consume items of defined quantity and have experience with these particular quantities. We can assume that, in early exposures to a sandwich, for example, consumption of one sandwich was followed by comfortable satiety and an adequate level of energy. We also tend to consume entire portions, often completely unaware of how energy dense or dilute they are. For example, many of us consume a \"bowlful\" of cereal in the morning, regardless of the type of cereal (high or low in calories or other nutrients). Indeed, the popular individual serving bowls of cereals from one commercial source vary between 70 and 130 kcal, and the fat content of the milk you probably add will make even larger differences. We learn, in early experiences with particular foods, what quantities yield satiety. However, we can easily be \"tricked,\" especially when eating at restaurants, because portion sizes are often larger and more fat and calorie dense than we expect.", "ko": "여러분은 샌드위치나 쿠키 하나의 4분의 3을 얼마나 자주 먹는가? 일반적으로 우리는 정해진 양의 음식을 완전히 섭취하며 이러한 특정 양에 대한 경험이 있다. 예를 들어, 샌드위치를 처음 접했을 때, 한 개를 다 먹은 후 충분한 포만감과 충분한 수준의 에너지가 뒤따랐다고 가정할 수 있다. 우리는 또한 흔히 음식이 얼마나 에너지 밀도가 높은지 혹은 낮은지 전혀 인지하지 못한 채 1인분 전체를 다 먹는 경향이 있다. 예를 들어, 우리 중 다수는 아침에 시리얼의 종류(칼로리나 다른 영양소가 높거나 낮은)에 관계없이 '한 그릇 가득한 분량'의 시리얼을 먹는다. 실제로, 한 상업적 공급원에서 나오는 인기 있는 1인분용 시리얼 그릇(제품)은 (열량이) 70kcal에서 130kcal까지 다양하며, 여러분이 아마도 추가할 우유의 지방 함량이 훨씬 더 큰 차이를 만들 것이다. 우리는 특정 음식에 대한 초기 경험에서 얼마큼의 양이 포만감을 가져오는지를 배운다. 그러나 우리는 특히 식당에서 식사할 때 쉽게 '속을' 수 있는데, 왜냐하면 1인분의 양이 우리가 예상하는 것보다 더 많고 지방·칼로리 밀도가 더 높은 경우가 흔하기 때문이다.", "read": [{"en": "How often do you eat three-fourths of a sandwich or cookie?", "ko": "여러분은 샌드위치나 쿠키 하나의 4분의 3을 얼마나 자주 먹는가?", "chunks": [["How often do you eat", "여러분은 얼마나 자주 먹는가"], ["three-fourths of a sandwich or cookie?", "샌드위치나 쿠키의 4분의 3을?"]]}, {"en": "Typically, we completely consume items of defined quantity and have experience with these particular quantities.", "ko": "일반적으로 우리는 정해진 양의 음식을 완전히 섭취하며 이러한 특정 양에 대한 경험이 있다.", "chunks": [["Typically,", "일반적으로,"], ["we completely consume items of defined quantity", "우리는 정해진 양의 음식을 완전히 섭취하고"], ["and have experience with these particular quantities.", "이러한 특정 양에 대한 경험이 있다."]]}, {"en": "We can assume that, in early exposures to a sandwich, for example, consumption of one sandwich was followed by comfortable satiety and an adequate level of energy.", "ko": "예를 들어, 샌드위치를 처음 접했을 때, 한 개를 다 먹은 후 충분한 포만감과 충분한 수준의 에너지가 뒤따랐다고 가정할 수 있다.", "chunks": [["We can assume that,", "우리는 ~을 가정할 수 있다,"], ["in early exposures to a sandwich, for example,", "예를 들어 샌드위치를 처음 접했을 때,"], ["consumption of one sandwich was followed by", "한 개를 다 먹은 후에 ~이 뒤따랐다고"], ["comfortable satiety and an adequate level of energy.", "충분한 포만감과 충분한 수준의 에너지."]]}, {"en": "We also tend to consume entire portions, often completely unaware of how energy dense or dilute they are.", "ko": "우리는 또한 흔히 음식이 얼마나 에너지 밀도가 높은지 혹은 낮은지 전혀 인지하지 못한 채 1인분 전체를 다 먹는 경향이 있다.", "chunks": [["We also tend to consume entire portions,", "우리는 또한 1인분 전체를 먹는 경향이 있다,"], ["often completely unaware", "흔히 전혀 인지하지 못한 채"], ["of how energy dense or dilute they are.", "그것이 얼마나 에너지 밀도가 높은지 낮은지를."]]}, {"en": "For example, many of us consume a \"bowlful\" of cereal in the morning, regardless of the type of cereal (high or low in calories or other nutrients).", "ko": "예를 들어, 우리 중 다수는 아침에 시리얼의 종류(칼로리나 다른 영양소가 높거나 낮은)에 관계없이 '한 그릇 가득한 분량'의 시리얼을 먹는다.", "chunks": [["For example, many of us consume", "예를 들어, 우리 중 다수는 먹는다"], ["a \"bowlful\" of cereal in the morning,", "아침에 '한 그릇 가득한 분량'의 시리얼을,"], ["regardless of the type of cereal", "시리얼의 종류에 관계없이"], ["(high or low in calories or other nutrients).", "(칼로리나 다른 영양소가 높거나 낮은)."]]}, {"en": "Indeed, the popular individual serving bowls of cereals from one commercial source vary between 70 and 130 kcal, and the fat content of the milk you probably add will make even larger differences.", "ko": "실제로, 한 상업적 공급원에서 나오는 인기 있는 1인분용 시리얼 그릇(제품)은 (열량이) 70kcal에서 130kcal까지 다양하며, 여러분이 아마도 추가할 우유의 지방 함량이 훨씬 더 큰 차이를 만들 것이다.", "chunks": [["Indeed, the popular individual serving bowls of cereals", "실제로, 인기 있는 1인분용 시리얼 그릇들은"], ["from one commercial source", "한 상업적 공급원에서 나오는"], ["vary between 70 and 130 kcal,", "(열량이) 70kcal와 130kcal 사이에서 다양하며,"], ["and the fat content of the milk", "그리고 우유의 지방 함량이"], ["you probably add", "여러분이 아마도 추가할"], ["will make even larger differences.", "훨씬 더 큰 차이를 만들 것이다."]]}, {"en": "We learn, in early experiences with particular foods, what quantities yield satiety.", "ko": "우리는 특정 음식에 대한 초기 경험에서 얼마큼의 양이 포만감을 가져오는지를 배운다.", "chunks": [["We learn,", "우리는 배운다,"], ["in early experiences with particular foods,", "특정 음식에 대한 초기 경험에서,"], ["what quantities yield satiety.", "어떤 양이 포만감을 가져오는지를."]]}, {"en": "However, we can easily be \"tricked,\" especially when eating at restaurants, because portion sizes are often larger and more fat and calorie dense than we expect.", "ko": "그러나 우리는 특히 식당에서 식사할 때 쉽게 '속을' 수 있는데, 왜냐하면 1인분의 양이 우리가 예상하는 것보다 더 많고 지방·칼로리 밀도가 더 높은 경우가 흔하기 때문이다.", "chunks": [["However, we can easily be \"tricked,\"", "그러나 우리는 쉽게 '속을' 수 있다,"], ["especially when eating at restaurants,", "특히 식당에서 식사할 때,"], ["because portion sizes are often larger and more fat and calorie dense", "왜냐하면 1인분의 양이 흔히 더 크고 지방·칼로리 밀도가 더 높기 때문이다"], ["than we expect.", "우리가 예상하는 것보다."]]}], "metaphor": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽은 정량 접시와 포만감을 짝지어 학습한 규칙, 가운데 위에는 에너지 밀도가 학습되지 않은 맹점을 빨강 점선으로 표시, 오른쪽은 같은 습관으로 식당의 크고 고밀도인 1인분을 통째로 먹어 속는 결과\">\n  <!-- 좌: 학습된 규칙 (초록) -->\n  <g transform=\"translate(25,52)\">\n    <rect x=\"0\" y=\"0\" width=\"215\" height=\"100\" rx=\"7\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <text x=\"107\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">학습된 규칙</text>\n    <!-- 접시 -->\n    <ellipse cx=\"48\" cy=\"58\" rx=\"30\" ry=\"11\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <ellipse cx=\"48\" cy=\"56\" rx=\"18\" ry=\"6\" fill=\"none\" stroke=\"#999\" stroke-width=\"1\"/>\n    <text x=\"48\" y=\"82\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">정량</text>\n    <!-- = -->\n ion of skills", "기술의 실행"], ["★ a core requirement", "핵심적인 요구 사항"], ["★ commit to a course of action", "행동 방침에 전념하다"], ["⊕ choose one option over another", "한 선택지를 다른 것보다 우선해 고르다"], ["★ past experiences", "과거 경험"], ["⊕ knowledge base", "지식 기반"], ["★ hinder", "방해하다·저해하다"], ["★ bias the decision-maker for/against", "의사 결정자를 ~로 편향시키다"], ["★ more than one right decision", "둘 이상의 올바른 결정"], ["⊕ skill level and expertise", "기술 수준·전문성"], ["★ the timescale within which", "~이 이뤄지는 시간 범위"], ["★ time-constrained", "시간 제약을 받는"]], "en": "Across different performance domains, successful performance is not just dependent on proficient movement control and the successful execution of skills; often effective decision-making is also a core requirement. In this context, decision-making can generally be viewed as the process of committing to a particular course of action (choosing one option over another) and relates to the choices that are made when a number of options are available to the performer for selection. In all cases, the decisions that are made are influenced by past experiences and the knowledge base the individual performer has of the specific situation. These past experiences can help or hinder decision-making but, generally speaking, will bias the decision-maker either for or against a certain course of action depending on whether that course of action was successful in the past. Another important aspect of making decisions in performance settings is that there is often more than one right decision, and the 'right' decision will often differ from individual to individual depending upon their skill level and expertise. Also, the timescale within which a decision is made also varies, as does the underpinning explanation of process which differs depending on whether the decision is time-constrained or not.", "ko": "다양한 수행 분야에 걸쳐 성공적인 수행은 능숙한 동작 제어와 성공적인 기술의 실행에 달렸을 뿐만 아니라, 흔히 효과적인 의사 결정 또한 핵심적인 요구 사항이다. 이러한 상황에서 의사 결정은 일반적으로 특정한 행동 방침에 전념하는 과정(한 선택지를 다른 선택지보다 우선하여 고르는 것)으로 여겨질 수 있으며, 선택을 위해 여러 선택지가 수행자에게 이용될 수 있을 때 내려지는 선택들과 관련된다. 모든 경우에, 내려지는 결정들은 과거의 경험과 개별 수행자가 그 특정 상황에 대해 가지고 있는 지식 기반에 의해 영향을 받는다. 이러한 과거 경험들은 의사 결정을 돕거나 방해할 수 있지만, 일반적으로 말해서 특정 행동 방침이 과거에 성공적이었는지의 여부에 따라 의사 결정자에게 그 행동 방침을 선호하거나 싫어하게 하는 편견을 가지게 할 것이다. 수행 환경에서 결정을 내리는 것의 또 다른 중요한 측면은 흔히 올바른 결정이 둘 이상 있다는 것이며, '올바른' 결정은 그들의 기술 수준과 전문성에 따라 흔히 개인마다 상이할 것이다. 또한, 결정이 이뤄지는 시간의 범위는 과정에 대해 뒷받침하는 설명이 그러는 것처럼 또한 다양한데, 그 설명은 그 결정이 시간 제약을 받는지의 여부에 따라 다르다.", "read": [{"en": "Across different performance domains, successful performance is not just dependent on proficient movement control and the successful execution of skills; often effective decision-making is also a core requirement.", "ko": "다양한 수행 분야에 걸쳐 성공적인 수행은 능숙한 동작 제어와 성공적인 기술의 실행에 달렸을 뿐만 아니라, 흔히 효과적인 의사 결정 또한 핵심적인 요구 사항이다.", "chunks": [["Across different performance domains,", "다양한 수행 분야에 걸쳐,"], ["successful performance is not just dependent on", "성공적인 수행은 ~에 달려 있는 것만이 아니다"], ["proficient movement control and the successful execution of skills;", "능숙한 동작 제어와 성공적인 기술 실행에;"], ["often effective decision-making is also a core requirement.", "흔히 효과적인 의사 결정 또한 핵심적인 요구 사항이다."]]}, {"en": "In this context, decision-making can generally be viewed as the process of committing to a particular course of action (choosing one option over another) and relates to the choices that are made when a number of options are available to the performer for selection.", "ko": "이러한 상황에서 의사 결정은 일반적으로 특정한 행동 방침에 전념하는 과정(한 선택지를 다른 선택지보다 우선하여 고르는 것)으로 여겨질 수 있으며, 선택을 위해 여러 선택지가 수행자에게 이용될 수 있을 때 내려지는 선택들과 관련된다.", "chunks": [["In this context, decision-making can generally be viewed as", "이런 상황에서 의사 결정은 일반적으로 ~으로 여겨질 수 있다"], ["the process of committing to a particular course of action", "특정한 행동 방침에 전념하는 과정"], ["(choosing one option over another)", "(한 선택지를 다른 선택지보다 우선해 고르는 것)"], ["and relates to the choices that are made", "그리고 ~인 선택들과 관련된다"], ["when a number of options are available to the performer", "여러 선택지가 수행자에게 이용 가능할 때"], ["for selection.", "선택을 위해."]]}, {"en": "In all cases, the decisions that are made are influenced by past experiences and the knowledge base the individual performer has of the specific situation.", "ko": "모든 경우에, 내려지는 결정들은 과거의 경험과 개별 수행자가 그 특정 상황에 대해 가지고 있는 지식 기반에 의해 영향을 받는다.", "chunks": [["In all cases, the decisions that are made", "모든 경우에, 내려지는 결정은"], ["are influenced by past experiences", "과거 경험에 의해 영향을 받는다"], ["and the knowledge base", "그리고 지식 기반에"], ["the individual performer has of the specific situation.", "개별 수행자가 특정 상황에 대해 가지고 있는."]]}, {"en": "These past experiences can help or hinder decision-making but, generally speaking, will bias the decision-maker either for or against a certain course of action depending on whether that course of action was successful in the past.", "ko": "이러한 과거 경험들은 의사 결정을 돕거나 방해할 수 있지만, 일반적으로 말해서 특정 행동 방침이 과거에 성공적이었는지의 여부에 따라 의사 결정자에게 그 행동 방침을 선호하거나 싫어하게 하는 편견을 가지게 할 것이다.", "chunks": [["These past experiences can help or hinder decision-making", "이러한 과거 경험은 의사 결정을 돕거나 방해할 수 있지만"], ["but, generally speaking,", "일반적으로 말해서,"], ["will bias the decision-maker either for or against", "의사 결정자를 선호 또는 반대로 편향시킬 것이다"], ["a certain course of action", "특정 행동 방침에 대해"], ["depending on whether that course of action was successful", "그 행동 방침이 성공적이었는지에 따라"], ["in the past.", "과거에."]]}, {"en": "Another important aspect of making decisions in performance settings is that there is often more than one right decision, and the 'right' decision will often differ from individual to individual depending upon their skill level and expertise.", "ko": "수행 환경에서 결정을 내리는 것의 또 다른 중요한 측면은 흔히 올바른 결정이 둘 이상 있다는 것이며, '올바른' 결정은 그들의 기술 수준과 전문성에 따라 흔히 개인마다 상이할 것이다.", "chunks": [["Another important aspect of making decisions in performance settings is", "수행 환경에서 결정을 내리는 또 다른 중요한 측면은"], ["that there is often more than one right decision,", "흔히 올바른 결정이 둘 이상 있다는 것이며,"], ["and the 'right' decision will often differ", "그리고 '올바른' 결정은 흔히 다르다"], ["from individual to individual", "개인마다"], ["depending upon their skill level and expertise.", "기술 수준과 전문성에 따라."]]}, {"en": "Also, the timescale within which a decision is made also varies, as does the underpinning explanation of process which differs depending on whether the decision is time-constrained or not.", "ko": "또한, 결정이 이뤄지는 시간의 범위는 과정에 대해 뒷받침하는 설명이 그러는 것처럼 또한 다양한데, 그 설명은 그 결정이 시간 제약을 받는지의 여부에 따라 다르다.", "chunks": [["Also, the timescale within which a decision is made", "또한, 결정이 이뤄지는 시간 범위도"], ["also varies,", "다양하며,"], ["as does the underpinning explanation of process", "뒷받침하는 과정의 설명이 그러하듯이"], ["which differs depending on", "~에 따라 다른"], ["whether the decision is time-constrained or not.", "결정이 시간 제약을 받는지의 여부."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 수행 성공은 동작 기술과 효과적 의사 결정의 합이라는 식, 가운데 효과적 의사 결정 핵심 상자에서 세 요인 과거 경험 편향, 정답 여러 개, 시간 제약으로 가지가 뻗는 그림\">\n  <!-- 상단 식 -->\n  <g transform=\"translate(0,26)\">\n    <text x=\"300\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">수행 성공 = 동작·기술 + <tspan fill=\"#1FA34A\">효과적 의사 결정</tspan></text>\n  </g>\n  <!-- 핵심 노드 -->\n  <g transform=\"translate(215,48)\">\n    <rect x=\"0\" y=\"0\" width=\"170\" height=\"44\" rx=\"22\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <text x=\"85\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">효과적 의사 결정</text>\n    <text x=\"85\" y=\"35\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">effective decision-making</text>\n  </g>\n  <!-- 가지 선 -->\n  <g stroke=\"#1FA34A\" stroke-width=\"1.4\">\n    <line x1=\"265\" y1=\"92\" x2=\"120\" y2=\"158\"/>\n    <line x1=\"300\" y1=\"92\" x2=\"300\" y2=\"158\"/>\n    <line x1=\"335\" y1=\"92\" x2=\"480\" y2=\"158\"/>\n  </g>\n  <!-- 요인 ① 편향 -->\n  <g transform=\"translate(35,160)\">\n    <rect x=\"0\" y=\"0\" width=\"170\" heig \" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">more than one right answer</text>\n  </g>\n  <!-- 요인 ③ 시간 제약 -->\n  <g transform=\"translate(395,160)\">\n    <rect x=\"0\" y=\"0\" width=\"170\" height=\"82\" rx=\"6\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.3\"/>\n    <text x=\"85\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">③ 시간 제약</text>\n    <g transform=\"translate(85,48)\">\n      <circle cx=\"0\" cy=\"0\" r=\"13\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-8\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"6\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n    </g>\n    <text x=\"85\" y=\"76\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">timescale changes the process</text>\n  </g>\n</svg>", "caption": "상단에 수행 성공은 동작 기술과 효과적 의사 결정의 합이라는 식, 가운데 효과적 의사 결정 핵심 상자에서 세 요인 과거 경험 편향, 정답 여러 개, 시간 제약으로 가지가 뻗는 그림"}, {"no": "11", "title": "Electronic Minorities", "ktitle": "전자적 소수 — 거리가 반대를 돕는다", "field": "사회·심리", "page": "06강 Ex.11", "oneline": "전자 매체·지리적 거리는 소수 의견에 힘을 준다.", "tldr": ["전자 매체·지리적 거리는 소수 의견에 힘을 준다.", "대면의 사회적 불편이 줄기 때문이다.", "그 결과 비전형적 견해를 주장·수용하기 쉬워진다."], "analogy": "", "bg": "분야는 사회·심리예요. 핵심 — 전자 매체와 ‘지리적 거리’가 소수 의견을 더 영향력 있게 만든다는 것. → 대면의 불편이 줄면 비전형적 견해의 주장·수용이 어떻게 쉬워지는지에 주목하며 읽으세요.", "flow": [{"kind": "명제", "t": "거리·전자매체 → 소수 의견 영향력 ↑"}, {"kind": "이유", "t": "대면 불편(압박) 감소"}, {"kind": "전개", "t": "비전형 견해 주장·수용 용이"}, {"kind": "결론", "t": "거리가 ‘반대(dissent)’를 돕는다"}], "quiz": [["전자 매체·거리가 소수 의견에 주는 효과는?", "더 영향력 있게 만들어 줘요."], ["그 이유는?", "대면의 사회적 불편이 줄어 비전형 견해를 내기 쉬워서예요."]], "vocab": [["★ emerging findings", "최근 나온 연구 결과"], ["★ minorities", "소수 집단·소수파"], ["★ argue their point of view electronically", "전자 매체로 자기 관점을 주장하다"], ["⊕ improve group performance", "집단 성과를 향상시키다"], ["★ claim in-group affiliation", "내집단 소속임을 주장하다"], ["★ maintain views consistently", "견해를 일관되게 유지하다"], ["⊕ persuasive advantage", "설득력 면에서의 이점"], ["★ geographically removed", "지리적으로 동떨어진"], ["★ play devil's advocate", "(논의 위해) 일부러 반대 의견을 내다"], ["★ induce A to V", "A가 ~하게 유도하다"], ["★ face-to-face disagreements", "대면 의견 차이"], ["★ assert an atypical view", "비전형적 견해를 주장하다"], ["★ fear of reprisal", "앙갚음·보복에 대한 두려움"], ["★ identity consequences", "정체성에 미칠 결과"], ["⊕ technology-mediated communication", "기술 매개 의사소통"]], "en": "Emerging findings suggest that minorities arguing their point of view electronically can be influential in ways that improve group performance, as long as they claim in-group affiliation and maintain their views consistently. Several fascinating studies have also demonstrated a persuasive and performance advantage for remote or geographically removed minorities. In these cases, groups with a minority advocate who is geographically remote seemed to perform better because the minority was able to play devil's advocate, effectively inducing the majority to think about alternatives. Perhaps being removed from the anxiety and discomfort of face-to-face disagreements makes it easier for the minority to assert an atypical view without fear of reprisal, and makes it easier for majorities to accept minority input without worrying about the identity consequences of publicly accepting it. Thus, increased opportunity for minority points of view to improve group decisions should be counted among the benefits of electronic or technology-mediated communication.", "ko": "최근 나온 연구 결과들은 전자 매체를 사용하여 자신의 관점을 주장하는 소수 집단이, 자신들이 내집단 소속임을 주장하고 자신들의 견해를 일관되게 유지하기만 하면, 집단 성과를 향상하는 방식으로 영향력을 발휘할 수 있음을 보여 준다. 몇 가지 흥미로운 연구들은 또한 멀리 있거나 지리적으로 동떨어져 있는 소수 집단에 대하여 설득력과 성과 면에서의 이점을 입증해 보였다. 이러한 경우들에서, 지리적으로 멀리 떨어진 소수 집단의 주창자가 있는 집단들이 더 나은 성과를 보이는 듯했는데, 이는 그 소수 집단이 논의를 위해 일부러 반대 의견을 밝힐 수 있었고, 다수 집단이 대안에 대해 고려하도록 실질적으로 유도했기 때문이다. 아마도 대면 상황에서의 의견 차이에서 오는 불안감·불편함으로부터 벗어나는 것이, 소수 집단이 앙갚음에 대한 두려움 없이 비전형적인 견해를 주장하는 것을 더 쉽게 만들고, 다수 집단이 공개적으로 그 견해를 수용하는 것에서 오는 정체성에 미칠 결과를 걱정하지 않고서 소수 집단의 의견을 받아들이는 것을 더 쉽게 만드는 것 같다. 따라서 소수 집단의 관점이 집단의 결정을 개선하는 기회가 늘어나는 것은 전자 매체를 사용하는 또는 기술을 매개로 하는 의사소통의 이점 중 하나로 간주되어야 한다.", "read": [{"en": "Emerging findings suggest that minorities arguing their point of view electronically can be influential in ways that improve group performance, as long as they claim in-group affiliation and maintain their views consistently.", "ko": "최근 나온 연구 결과들은 전자 매체를 사용하여 자신의 관점을 주장하는 소수 집단이, 자신들이 내집단 소속임을 주장하고 자신들의 견해를 일관되게 유지하기만 하면, 집단 성과를 향상하는 방식으로 영향력을 발휘할 수 있음을 보여 준다.", "chunks": [["Emerging findings suggest", "최근 나온 연구 결과는 시사한다"], ["that minorities arguing their point of view electronically", "전자 매체로 관점을 주장하는 소수 집단이"], ["can be influential in ways that improve group performance,", "집단 성과를 향상하는 방식으로 영향력을 발휘할 수 있다고,"], ["as long as they claim in-group affiliation", "그들이 내집단 소속임을 주장하기만 하면"], ["and maintain their views consistently.", "그리고 견해를 일관되게 유지하기만 하면."]]}, {"en": "Several fascinating studies have also demonstrated a persuasive and performance advantage for remote or geographically removed minorities.", "ko": "몇 가지 흥미로운 연구들은 또한 멀리 있거나 지리적으로 동떨어져 있는 소수 집단에 대하여 설득력과 성과 면에서의 이점을 입증해 보였다.", "chunks": [["Several fascinating studies have also demonstrated", "몇 가지 흥미로운 연구들은 또한 입증했다"], ["a persuasive and performance advantage", "설득력과 성과 면에서의 이점을"], ["for remote or geographically removed minorities.", "멀리 있거나 지리적으로 동떨어진 소수 집단에 대하여."]]}, {"en": "In these cases, groups with a minority advocate who is geographically remote seemed to perform better because the minority was able to play devil's advocate, effectively inducing the majority to think about alternatives.", "ko": "이러한 경우들에서, 지리적으로 멀리 떨어진 소수 집단의 주창자가 있는 집단들이 더 나은 성과를 보이는 듯했는데, 이는 그 소수 집단이 논의를 위해 일부러 반대 의견을 밝힐 수 있었고, 다수 집단이 대안에 대해 고려하도록 실질적으로 유도했기 때문이다.", "chunks": [["In these cases, groups with a minority advocate", "이러한 경우, 소수 집단 주창자를 가진 집단들은"], ["who is geographically remote", "지리적으로 멀리 있는"], ["seemed to perform better", "더 나은 성과를 보이는 듯했다"], ["because the minority was able to play devil's advocate,", "왜냐하면 소수 집단이 일부러 반대 의견을 낼 수 있었기 때문이다,"], ["effectively inducing the majority to think about alternatives.", "실질적으로 다수 집단이 대안에 대해 생각하도록 유도하며."]]}, {"en": "Perhaps being removed from the anxiety and discomfort of face-to-face disagreements makes it easier for the minority to assert an atypical view without fear of reprisal, and makes it easier for majorities to accept minority input without worrying about the identity consequences of publicly accepting it.", "ko": "아마도 대면 상황에서의 의견 차이에서 오는 불안감·불편함으로부터 벗어나는 것이, 소수 집단이 앙갚음에 대한 두려움 없이 비전형적인 견해를 주장하는 것을 더 쉽게 만들고, 다수 집단이 공개적으로 그 견해를 수용하는 것에서 오는 정체성에 미칠 결과를 걱정하지 않고서 소수 집단의 의견을 받아들이는 것을 더 쉽게 만드는 것 같다.", "chunks": [["Perhaps being removed from the anxiety and discomfort", "아마도 불안과 불편함에서 벗어나는 것이"], ["of face-to-face disagreements", "대면 의견 차이의"], ["makes it easier for the minority to assert an atypical view", "소수 집단이 비전형 견해를 주장하기 쉽게 만든다"], ["without fear of reprisal,", "앙갚음의 두려움 없이,"], ["and makes it easier for majorities to accept minority input", "그리고 다수 집단이 소수 의견을 수용하기 쉽게 만든다"], ["without worrying about the identity consequences of publicly accepting it.", "공개적으로 수용하는 것의 정체성에 미칠 결과를 걱정하지 않고서."]]}, {"en": "Thus, increased opportunity for minority points of view to improve group decisions should be counted among the benefits of electronic or technology-mediated communication.", "ko": "따라서 소수 집단의 관점이 집단의 결정을 개선하는 기회가 늘어나는 것은 전자 매체를 사용하는 또는 기술을 매개로 하는 의사소통의 이점 중 하나로 간주되어야 한다.", "chunks": [["Thus, increased opportunity for minority points of view", "따라서 소수 집단의 관점이 가지는 기회의 증가가"], ["to improve group decisions", "집단 결정을 개선할"], ["should be counted among the benefits", "이점 중 하나로 간주되어야 한다"], ["of electronic or technology-mediated communication.", "전자 매체 또는 기술 매개 의사소통의."]]}], "metaphor": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽은 대면 상황에서 마찰 때문에 위축된 소수를 빨강 점선으로, 오른쪽은 전자 매체와 거리가 불편을 .7\"/>\n      <circle cx=\"-3\" cy=\"-1\" r=\"1.3\" fill=\"#1FA34A\"/><circle cx=\"3\" cy=\"-1\" r=\"1.3\" fill=\"#1FA34A\"/>\n      <path d=\"M -4 4 Q 0 7 4 4\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"12\" x2=\"0\" y2=\"36\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/>\n      <line x1=\"0\" y1=\"19\" x2=\"-10\" y2=\"13\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/><line x1=\"0\" y1=\"19\" x2=\"10\" y2=\"28\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    </g>\n    <g transform=\"translate(82,58)\"><rect x=\"0\" y=\"0\" width=\"62\" height=\"22\" rx=\"6\" fill=\"#fff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><text x=\"31\" y=\"15\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">비전형 견해</text><path d=\"M 6 22 L 2 30 L 14 22 Z\" fill=\"#fff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/></g>\n    <text x=\"55\" y=\"140\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">소수 주장 ↑</text>\n    <!-- 다수 (수용, 열린 자세) -->\n    <g transform=\"translate(165,90)\">\n      <g><circle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#fff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/><line x1=\"0\" y1=\"10\" x2=\"0\" y2=\"30\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/><line x1=\"0\" y1=\"15\" x2=\"-11\" y2=\"9\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"15\" x2=\"11\" y2=\"9\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/></g>\n      <g transform=\"translate(34,2)\"><circle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#fff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/><line x1=\"0\" y1=\"10\" x2=\"0\" y2=\"28\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/><line x1=\"0\" y1=\"15\" x2=\"-11\" y2=\"9\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"15\" x2=\"11\" y2=\"9\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/></g>\n    </g>\n    <text x=\"185\" y=\"140\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">다수 수용 ↑</text>\n  </g>\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"222\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">distance removes discomfort → minority view improves the group's decision</text>\n  <text x=\"300\" y=\"242\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">→ 소수 견해가 집단 결정을 개선할 기회 증가 = 전자 매체 소통의 이점</text>\n</svg>", "caption": "왼쪽은 대면 상황에서 마찰 때문에 위축된 소수를 빨강 점선으로, 오른쪽은 전자 매체와 거리가 불편을 제거해 소수가 또렷이 주장하고 다수가 수용하는 모습을 초록으로 대조하고, 하단에 집단 결정 개선 결론"}, {"no": "12", "title": "Essentialism vs Non-Essentialism", "ktitle": "본질주의 vs 비본질주의 — ‘의자’란?", "field": "철학·논리", "page": "06강 Ex.12", "oneline": "본질주의: 의자는 필수 ‘속성’을 갖춰야 한다.", "tldr": ["본질주의: 의자는 필수 ‘속성’을 갖춰야 한다.", "비본질주의: 앉는 ‘기능’만 하면 의자다.", "‘의자’ 정의로 두 입장이 정면 대비된다."], "analogy": "", "bg": "분야는 철학·논리예요. 핵심 대비 — 어떤 것이 ‘의자’이려면 필수 속성이 있어야 한다는 ‘본질주의’와, 기능만 하면 된다는 ‘비본질주의’. → ‘의자’ 사례로 두 입장이 어떻게 갈리는지에 주목하며 읽으세요.", "flow": [{"kind": "질문", "t": "무엇이 ‘의자’인가?"}, {"kind": "입장 ①", "t": "본질주의 — 필수 속성 필요"}, {"kind": "입장 ②", "t": "비본질주의 — 기능 충족이면 OK"}, {"kind": "결론", "t": "의자 사례로 양극 대조"}], "quiz": [["본질주의와 비본질주의의 차이는?", "본질주의는 필수 속성을, 비본질주의는 기능 충족을 기준으로 삼아요."], ["어떤 사례로 둘을 대비하나요?", "‘의자’가 무엇이냐는 사례로요."]], "vocab": [["⊕ the concept of", "~의 개념"], ["★ essentialism", "본질주의"], ["★ specific properties", "특정한 속성"], ["★ be recognized and identified as", "~으로 인정되고 식별되다"], ["⊕ seat / backrest / legs", "앉는 부분·등받이·다리"], ["★ allow for", "~을 가능하게 하다"], ["★ essential characteristics", "본질적인 특징"], ["⊕ define the essence of", "~의 본질을 정의하다"], ["★ lack any defining properties", "본질적 속성이 결여되다"], ["⊕ fit the definition of", "~의 정의에 부합하다"], ["★ be classified as", "~으로 분류되다"], ["★ non-essentialism", "비본질주의"], ["★ challenge the notion that", "~라는 개념에 이의를 제기하다"], ["★ fulfill a functional purpose", "기능적 목적을 달성하다"], ["⊕ identification or classification", "식별 또는 분류"]], "en": "Consider the concept of a \"chair.\" According to essentialism, a chair has specific properties necessary to be recognized and identified as a chair. These properties may include having a seat, backrest, and legs, which allow for sitting. In other words, these essential characteristics define the essence of a chair. Under the essentialist viewpoint, it would not be considered a chair if an object lacks any defining properties. For instance, if we have an object with a seat and backrest but without legs, it would not fit the essentialist definition of a chair. The presence of legs is considered essential for an object to be classified as a chair. Non-essentialism, on the other hand, would challenge the notion that a chair requires specific essential properties. Instead, it might argue that any object can be considered a chair if it fulfills a functional purpose, such as providing a platform for sitting. According to non-essentialism, an object's essence or specific properties are not necessary for its identification or classification.", "ko": "'의자'라는 개념을 고려해 보자. 본질주의에 따르면, 의자는 의자로서 인정되고 식별되기 위해 필요한 특정한 속성들을 가진다. 이러한 속성들은 앉는 부분, 등받이 및 다리를 갖는 것을 포함할 수도 있는데, 그것들은 앉는 것을 가능하게 한다. 다른 말로 하면, 이러한 본질적인 특징들이 의자의 본질을 정의한다. 본질주의적 관점에서는, 만약 어떤 물체가 무엇이 되었든 본질적인 의미를 규정하는 속성이 결여되면 그것은 의자로 간주되지 않을 것이다. 예를 들어, 만약 우리에게 앉는 부분과 등받이는 있지만 다리가 없는 물체가 있다면, 그것은 의자의 본질주의적 정의에 부합하지 않을 것이다. 다리의 존재는 한 물체가 의자로 분류되기 위해 본질적인 것으로 간주된다. 반면에 비본질주의는 의자가 특정한 본질적 속성들을 필요로 한다는 생각에 이의를 제기할 것이다. 대신에, 그것은 어떤 물체든지 앉기 위한 대(臺)를 제공하는 것과 같은 기능적 목적을 달성한다면 의자로 간주될 수 있다고 주장할지도 모른다. 비본질주의에 따르면, 물체의 본질이나 특정한 속성들은 그것의 식별이나 분류를 위해 필요하지 않다.", "read": [{"en": "Consider the concept of a \"chair.\"", "ko": "'의자'라는 개념을 고려해 보자.", "chunks": [["Consider the concept of", "~의 개념을 고려해 보자"], ["a \"chair.\"", "'의자'."]]}, {"en": "According to essentialism, a chair has specific properties necessary to be recognized and identified as a chair.", "ko": "본질주의에 따르면, 의자는 의자로서 인정되고 식별되기 위해 필요한 특정한 속성들을 가진다.", "chunks": [["According to essentialism,", "본질주의에 따르면,"], ["a chair has specific properties", "의자는 특정한 속성들을 가진다"], ["necessary to be recognized and identified as a chair.", "의자로 인정·식별되기 위해 필요한."]]}, {"en": "These properties may include having a seat, backrest, and legs, which allow for sitting.", "ko": "이러한 속성들은 앉는 부분, 등받이 및 다리를 갖는 것을 포함할 수도 있는데, 그것들은 앉는 것을 가능하게 한다.", "chunks": [["These properties may include", "이러한 속성들은 포함할 수도 있다"], ["having a seat, backrest, and legs,", "앉는 부분·등받이·다리를 갖는 것을,"], ["which allow for sitting.", "그것들은 앉는 것을 가능하게 한다."]]}, {"en": "In other words, these essential characteristics define the essence of a chair.", "ko": "다른 말로 하면, 이러한 본질적인 특징들이 의자의 본질을 정의한다.", "chunks": [["In other words,", "다른 말로 하면,"], ["these essential characteristics", "이러한 본질적인 특징들이"], ["define the essence of a chair.", "의자의 본질을 정의한다."]]}, {"en": "Under the essentialist viewpoint, it would not be considered a chair if an object lacks any defining properties.", "ko": "본질주의적 관점에서는, 만약 어떤 물체가 무엇이 되었든 본질적인 의미를 규정하는 속성이 결여되면 그것은 의자로 간주되지 않을 것이다.", "chunks": [["Under the essentialist viewpoint,", "본질주의적 관점에서는,"], ["it would not be considered a chair", "그것은 의자로 간주되지 않을 것이다"], ["if an object lacks any defining properties.", "어떤 물체가 본질적인 속성이 결여되면."]]}, {"en": "For instance, if we have an object with a seat and backrest but without legs, it would not fit the essentialist definition of a chair.", "ko": "예를 들어, 만약 우리에게 앉는 부분과 등받이는 있지만 다리가 없는 물체가 있다면, 그것은 의자의 본질주의적 정의에 부합하지 않을 것이다.", "chunks": [["For instance,", "예를 들어,"], ["if we have an object with a seat and backrest", "만약 앉는 부분과 등받이는 있는 물체가 있지만"], ["but without legs,", "다리가 없다면,"], ["it would not fit the essentialist definition of a chair.", "그것은 의자의 본질주의적 정의에 부합하지 않을 것이다."]]}, {"en": "The presence of legs is considered essential for an object to be classified as a chair.", "ko": "다리의 존재는 한 물체가 의자로 분류되기 위해 본질적인 것으로 간주된다.", "chunks": [["The presence of legs is considered essential", "다리의 존재는 본질적인 것으로 간주된다"], ["for an object to be classified as a chair.", "한 물체가 의자로 분류되기 위해."]]}, {"en": "Non-essentialism, on the o /* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 영어독해연습 06강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 영어독해연습 08강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-ipad">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 영어독해연습 06강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 영어독해연습 06강

가지 핵심 기능을 담당해 가치를 더해요."]], "vocab": [["★ wholesaler", "도매상"], ["★ retailer", "소매상"], ["★ producer / manufacturer", "생산자·제조업체"], ["⊕ act as", "~의 역할을 하다"], ["◇ the middle step", "중간 단계"], ["★ distribution channel", "유통 경로"], ["⊕ reasonable", "타당한·합리적인"], ["◇ the point of ~ing", "~하는 것의 요점·의미"], ["★ pass A (straight) on to B", "A를 B에게 (곧바로) 전달하다"], ["⊕ channel members", "경로 구성원"], ["★ in bulk", "대량으로"], ["⊕ store", "보관하다·저장하다"], ["⊕ transport", "운송하다·수송하다"], ["★ stock (v.)", "(상품을) 갖춰 두다·비축하다"], ["◇ a range of / a variety of", "일정 범위의·다양한"], ["★ gain access to", "~을 입수하다·접근 가능하게 되다"]], "en": "A wholesaler is an organisation or individual acting as the middle step between a producer and a retailer. It is reasonable to ask what the point might be of having a wholesaler in the distribution channel. Why would the manufacturer not simply pass the sporting goods straight on to the retailer? However, a wholesaler can be important in helping other channel members. First, they usually buy goods in bulk from the manufacturer and then store them. When the retailer is ready to order some goods, the wholesaler transports the sporting goods to them. A wholesaler can also stock a large range of goods from a variety of different manufacturers. As a result, instead of having to contact all of these producers, the retailer only has to talk to the one wholesaler to gain access to a range of different sporting goods.", "ko": "도매상이란 생산자와 소매상 사이의 중간 단계 역할을 하는 조직 또는 개인이다. 유통 경로에서 도매상이 있는 것이 무슨 의미가 있을지 묻는 것은 타당한 일이다. 왜 제조업체가 단순히 스포츠 용품을 곧바로 소매상에게 전달하려 하지 않을까? 하지만 도매상은 (유통) 경로의 다른 구성원들을 돕는 데 중요할 수 있다. 우선, 그들은 보통 제조업체로부터 대량으로 상품을 구입하며, 그런 다음 그것을 보관한다. 소매상이 일정 수량의 상품을 주문할 준비가 되었을 때, 도매상은 스포츠 용품을 그들에게 운송한다. 또한 도매상은 다양한 서로 다른 제조업체에서 나온 광범위한 상품을 갖출 수 있다. 그 결과, 소매상은 이 생산업체 모두에게 연락할 필요 없이, 다양한 서로 다른 스포츠 용품을 입수하기 위해서 그 도매상 한 곳과 대화하기만 하면 된다.", "read": [{"en": "A wholesaler is an organisation or individual acting as the middle step between a producer and a retailer.", "ko": "도매상이란 생산자와 소매상 사이의 중간 단계 역할을 하는 조직 또는 개인이다.", "chunks": [["A wholesaler is", "도매상이란 ~이다"], ["an organisation or individual", "조직 또는 개인"], ["acting as the middle step", "중간 단계 역할을 하는"], ["between a producer and a retailer.", "생산자와 소매상 사이에서."]]}, {"en": "It is reasonable to ask what the point might be of having a wholesaler in the distribution channel.", "ko": "유통 경로에서 도매상이 있는 것이 무슨 의미가 있을지 묻는 것은 타당한 일이다.", "chunks": [["It is reasonable", "~은 타당한 일이다"], ["to ask", "묻는 것은"], ["what the point might be", "무슨 의미가 있을지"], ["of having a wholesaler", "도매상이 있는 것의"], ["in the distribution channel.", "유통 경로에서."]]}, {"en": "Why would the manufacturer not simply pass the sporting goods straight on to the retailer?", "ko": "왜 제조업체가 단순히 스포츠 용품을 곧바로 소매상에게 전달하려 하지 않을까?", "chunks": [["Why would the manufacturer", "왜 제조업체가 ~할까"], ["not simply pass", "단순히 전달하지 않을까"], ["the sporting goods", "스포츠 용품을"], ["straight on to the retailer?", "곧바로 소매상에게?"]]}, {"en": "However, a wholesaler can be important in helping other channel members.", "ko": "하지만 도매상은 (유통) 경로의 다른 구성원들을 돕는 데 중요할 수 있다.", "chunks": [["However,", "하지만,"], ["a wholesaler can be important", "도매상은 중요할 수 있다"], ["in helping other channel members.", "다른 경로 구성원들을 돕는 데."]]}, {"en": "First, they usually buy goods in bulk from the manufacturer and then store them.", "ko": "우선, 그들은 보통 제조업체로부터 대량으로 상품을 구입하며, 그런 다음 그것을 보관한다.", "chunks": [["First,", "우선,"], ["they usually buy goods in bulk", "그들은 보통 대량으로 상품을 구입한다"], ["from the manufacturer", "제조업체로부터"], ["and then store them.", "그런 다음 그것을 보관한다."]]}, {"en": "When the retailer is ready to order some goods, the wholesaler transports the sporting goods to them.", "ko": "소매상이 일정 수량의 상품을 주문할 준비가 되었을 때, 도매상은 스포츠 용품을 그들에게 운송한다.", "chunks": [["When the retailer is ready", "소매상이 준비가 되었을 때"], ["to order some goods,", "일정 수량의 상품을 주문할,"], ["the wholesaler transports", "도매상은 운송한다"], ["the sporting goods to them.", "스포츠 용품을 그들에게."]]}, {"en": "A wholesaler can also stock a large range of goods from a variety of different manufacturers.", "ko": "또한 도매상은 다양한 서로 다른 제조업체에서 나온 광범위한 상품을 갖출 수 있다.", "chunks": [["A wholesaler can also stock", "도매상은 또한 갖출 수 있다"], ["a large range of goods", "광범위한 상품을"], ["from a variety of different manufacturers.", "다양한 서로 다른 제조업체로부터."]]}, {"en": "As a result, instead of having to contact all of these producers, the retailer only has to talk to the one wholesaler to gain access to a range of different sporting goods.", "ko": "그 결과, 소매상은 이 생산업체 모두에게 연락할 필요 없이, 다양한 서로 다른 스포츠 용품을 입수하기 위해서 그 도매상 한 곳과 대화하기만 하면 된다.", "chunks": [["As a result,", "그 결과,"], ["instead of having to contact", "연락할 필요 없이"], ["all of these producers,", "이 생산업체 모두에게,"], ["the retailer only has to talk", "소매상은 대화하기만 하면 된다"], ["to the one wholesaler", "그 도매상 한 곳과"], ["to gain access to", "입수하기 위해서"], ["a range of different sporting goods.", "다양한 서로 다른 스포츠 용품을."]]}], "metaphor": "<svg viewBox=\"0 0 600 265\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 생산자에서 도매상을 거쳐 소매상으로 가는 사슬, 도매상 위에는 불필요한 마진이냐는 빨강 점선 의문 말풍선, 하단에는 도매상이 담당하는 네 가지 핵심 기능 박스\">\n  <!-- 상단 유통 사슬 -->\n  <g transform=\"translate(0,42)\">\n    <!-- 생산자 -->\n    <g transform=\"translate(45,0)\">\n      <rect x=\"0\" y=\"0\" width=\"92\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"46\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">생산자</text>\n      <text x=\"46\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">producer</text>\n    </g>\n    <line x1=\"137\" y1=\"20\" x2=\"217\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/><polygon points=\"217,20 209,16 209,24\" fill=\"#1a1a1a\"/>\n    <!-- 도매상 (허브, 초록 강조) -->\n    <g transform=\"translate(220,-4)\">\n      <rect x=\"0\" y=\"0\" width=\"115\" height=\"48\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <text x=\"57\" y=\"20\" font-family=\"Noto Serif KR\" fo ht=\"700\">\n    <g transform=\"translate(28,130)\"><rect x=\"0\" y=\"0\" width=\"130\" height=\"46\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/><text x=\"10\" y=\"20\" fill=\"#1FA34A\">① 대량구매·보관</text><text x=\"10\" y=\"37\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">bulk · store</text></g>\n    <g transform=\"translate(170,130)\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"46\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/><text x=\"10\" y=\"20\" fill=\"#1FA34A\">② 운송</text><text x=\"10\" y=\"37\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">transport</text></g>\n    <g transform=\"translate(302,130)\"><rect x=\"0\" y=\"0\" width=\"135\" height=\"46\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/><text x=\"10\" y=\"20\" fill=\"#1FA34A\">③ 다양 상품 비축</text><text x=\"10\" y=\"37\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">stock range</text></g>\n    <g transform=\"translate(449,130)\"><rect x=\"0\" y=\"0\" width=\"123\" height=\"46\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/><text x=\"10\" y=\"20\" fill=\"#1FA34A\">④ 단일 창구</text><text x=\"10\" y=\"37\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">one contact</text></g>\n  </g>\n  <text x=\"300\" y=\"205\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">not a needless margin — a working part of the chain</text>\n  <text x=\"300\" y=\"232\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">소매상은 도매상 한 곳만 접촉하면 다양한 상품을 확보</text>\n</svg>", "caption": "상단에 생산자에서 도매상을 거쳐 소매상으로 가는 사슬, 도매상 위에는 불필요한 마진이냐는 빨강 점선 의문 말풍선, 하단에는 도매상이 담당하는 네 가지 핵심 기능 박스"}, {"no": "3", "title": "Reality Testing", "ktitle": "현실 검증의 감정적 뿌리", "field": "심리·인지", "page": "06강 Ex.03", "oneline": "현실 검증은 겉보기엔 순수한 인지(논리) 능력 같다.", "tldr": ["현실 검증은 겉보기엔 순수한 인지(논리) 능력 같다.", "그러나 그 뿌리는 ‘자기와 타인’을 감정적으로 구별하는 데 있다.", "즉 논리적 사고도 감정적 토대 위에서 발달한다."], "analogy": "", "bg": "분야는 심리·인지예요. 핵심어 ‘현실 검증(reality testing)’ — 무엇이 실제인지 가려내는 능력. 논리적·인지적 능력처럼 보이는 게 출발점. → 그 능력이 사실은 무엇(감정)에 뿌리를 두는지에 주목하며 읽으세요.", "flow": [{"kind": "통념", "t": "현실 검증 = 인지·논리 능력"}, {"kind": "반전", "t": "실은 감정적 자기-타인 구별에 뿌리"}, {"kind": "전개", "t": "감정적 토대가 논리적 사고를 떠받침"}, {"kind": "결론", "t": "논리적 사고의 정서적 기원"}], "quiz": [["‘현실 검증’은 무슨 능력인가요?", "무엇이 실제인지 가려내는 능력이에요."], ["글이 밝히는 그 능력의 뿌리는?", "감정적으로 자기와 타인을 구별하는 데 뿌리를 둬요."]], "vocab": [["★ connect ideas logically", "생각을 논리적으로 연결하다"], ["★ reality testing", "현실 검증·현실 확인"], ["⊕ categorize", "분류하다·범주화하다"], ["◇ fantasy versus reality", "환상 대 현실"], ["◇ ongoing / continuously", "계속적인·끊임없이"], ["★ emotional interactions", "감정적 상호 작용"], ["★ put A in contact with B", "A를 B와 접촉하게 하다"], ["⊕ external reality", "외부 현실"], ["★ emotional investment", "감정적 투입·정서적 투자"], ["★ enable A to V", "A가 ~할 수 있게 하다"], ["⊕ recognize the difference between", "~의 차이를 인식하다"], ["★ cognitive capacity", "인지적 능력"], ["★ distinct from", "~과 구별되는·다른"], ["⊕ critical foundation", "대단히 중요한 기반"], ["★ irrational beliefs", "비이성적 믿음"]], "en": "Connecting ideas logically is the basis for reality testing, because a child around thirty to forty months old connects experiences inside herself with those outside and categorizes which are which (fantasy versus reality). Her ongoing emotional interactions support this ability to form a category of reality because they continuously put a \"me\" in contact (through the interactions) with a \"not me or you.\" This ongoing contact with someone who is \"not me\" provides constant contact with an external reality outside oneself. The emotional investment in relationships enables the child to recognize the difference between her fantasies and the actual behavior of others. While \"reality testing\" might appear to be a purely cognitive capacity, it requires an ability to organize an emotional sense of self that is distinct from one's sense of others. Such \"reality testing\" is a critical foundation for logical thinking. Without it, facts are often used to support irrational beliefs.", "ko": "논리적으로 생각을 연결하는 것은 현실 검증의 기초인데, 왜냐하면 약 30개월에서 40개월이 된 아이가 자신의 내부 경험과 외부 경험을 연결하고 어느 것이 어느 것인지(환상 대 현실) 분류하기 때문이다. 아이의 계속적인 감정적 상호 작용은 현실의 범주를 형성하는 이러한 능력을 뒷받침하는데, 왜냐하면 그것은 계속해서 (상호 작용을 통해) '나'를 '내가 아닌 존재 또는 너'와 접촉하도록 하기 때문이다. 이러한 '내가 아닌' 어떤 사람과의 지속적인 접촉은 자기 외부에 있는 외부 현실과의 지속적인 접촉을 제공한다. 관계에 대한 감정적 투입은 아이가 자신의 환상과 다른 사람들의 실제 행동의 차이를 인식할 수 있게 해 준다. '현실 검증'은 순전히 인지적인 능력으로 보일 수도 있지만, 그것은 타인에 대한 인식과 구별되는 자아에 대한 감정적 인식을 체계화하는 능력을 필요로 한다. 그러한 '현실 검증'은 합리적 사고의 대단히 중요한 기반이다. 그것이 없으면, 많은 경우 사실이 비이성적인 믿음을 뒷받침하는 데 사용된다.", "read": [{"en": "Connecting ideas logically is the basis for reality testing, because a child around thirty to forty months old connects experiences inside herself with those outside and categorizes which are which (fantasy versus reality).", "ko": "논리적으로 생각을 연결하는 것은 현실 검증의 기초인데, 왜냐하면 약 30개월에서 40개월이 된 아이가 자신의 내부 경험과 외부 경험을 연결하고 어느 것이 어느 것인지(환상 대 현실) 분류하기 때문이다.", "chunks": [["Connecting ideas logically", "생각을 논리적으로 연결하는 것은"], ["is the basis for reality testing,", "현실 검증의 기초이다,"], ["because a child around thirty to forty months old", "왜냐하면 약 30개월에서 40개월이 된 아이가"], ["connects experiences inside herself with those outside", "자신의 내부 경험과 외부 경험을 연결하고"], ["and categorizes which are which", "어느 것이 어느 것인지 분류한다"], ["(fantasy versus reality).", "(환상 대 현실)."]]}, {"en": "Her ongoing emotional interactions support this ability to form a category of reality because they continuously put a \"me\" in contact (through the interactions) with a \"not me or you.\"", "ko": "아이의 계속적인 감정적 상호 작용은 현실의 범주를 형성하는 이러한 능력을 뒷받침하는데, 왜냐하면 그것은 계속해서 (상호 작용을 통해) '나'를 '내가 아닌 존재 또는 너'와 접촉하도록 하기 때문이다.", "chunks": [["Her ongoing emotional interactions support", "아이의 계속적인 감정적 상호 작용은 뒷받침한다"], ["this ability to form a category of reality", "현실의 범주를 형성하는 이러한 능력을"], ["because they continuously put a \"me\"", "왜냐하면 그것이 계속 '나'를"], ["in contact (through the interactions)", "(상호 작용을 통해) 접촉시키기 때문이다"], ["with a \"not me or you.\"", "'내가 아닌 존재 또는 너'와."]]}, {"en": "This ongoing contact with someone who is \"not me\" provides constant contact with an external reality outside oneself.", "ko": "이러한 '내가 아닌' 어떤 사람과의 지속적인 접촉은 자기 외부에 있는 외부 현실과의 지속적인 접촉을 제공한다.", "chunks": [["This ongoing contact", "이러한 지속적인 접촉은"], ["with someone who is \"not me\"", "'내가 아닌' 어떤 사람과의"], ["provides constant contact", "지속적인 접촉을 제공한다"], ["with an external reality outside oneself.", "자기 외부에 있는 외부 현실과의."]]}, {"en": "The emotional investment in relationships enables the child to recognize the difference between her fantasies and the actual behavior of others.", "ko": "관계에 대한 감정적 투입은 아이가 자신의 환상과 다른 사람들의 실제 행동의 차이를 인식할 수 있게 해 준다.", "chunks": [["The emotional investment in relationships", "관계에 대한 감정적 투입은"], ["enables the child to recognize", "아이가 인식할 수 있게 해 준다"], ["the difference between her fantasies", "자신의 환상의 차이를"], ["and the actual behavior of others.", "그리고 다른 사람의 실제 행동의."]]}, {"en": "While \"reality testing\" might appear to be a purely cognitive capacity, it requires an ability to organize an emotional sense of self that is distinct from one's sense of others.", "ko": "'현실 검증'은 순전히 인지적인 능력으로 보일 수도 있지만, 그것은 타인에 대한 인식과 구별되는 자아에 대한 감정적 인식을 체계화하는 능력을 필요로 한다.", "chunks": [["While \"reality testing\"", "'현실 검증'은"], ["might appear to be a purely cognitive capacity,", "순전히 인지적인 능력으로 보일 수도 있지만,"], ["it requires an ability", "그것은 능력을 필요로 한다"], ["to organize an emotional sense of self", "자아에 대한 감정적 인식을 체계화하는"], ["that is distinct from one's sense of others.", "타인에 대한 인식과 구별되는."]]}, {"en": "Such \"reality testing\" is a critical foundation for logical thinking.", "ko": "그러한 '현실 검증'은 합리적 사고의 대단히 중요한 기반이다.", "chunks": [["Such \"reality testing\"", "그러한 '현실 검증'은"], ["is a critical foundation", "대단히 중요한 기반이다"], ["for logical thinking.", "합리적 사고의."]]}, {"en": "Without it, facts are often used to support irrational beliefs.", "ko": "그것이 없으면, 많은 경우 사실이 비이성적인 믿음을 뒷받침하는 데 사용된다.", "chunks": [["Without it,", "그것이 없으면,"], ["facts are often used", "사실이 많은 경우 사용된다"], ["to support irrational beliefs.", "비이성적인 믿음을 뒷받침하는 데."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"빙산 그림. 수면 위 작은 부분은 인지 능력처럼 보이는 현실 검증, 수면 아래 큰 부분은 감정적 자기-타인 구별이라는 진짜 뿌리이며, 나와 내가 아닌 것의 접촉을 표시\">\n  <!-- 수면 -->\n  <line x1=\"20\" y1=\"100\" x2=\"450\" y2=\"100\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n  <g stroke=\"#999\" stroke-width=\"0.9\">\n    <path d=\"M 30 108 Q 45 104 60 108\" fill=\"none\"/><path d=\"M 90 108 Q 105 104 120 108\" fill=\"none\"/>\n    <path d=\"M 150 108 Q 165 104 180 108\" fill=\"none\"/><path d=\"M 360 108 Q 375 104 390 108\" fill=\"none\"/>\n    <path d=\"M 410 108 Q 425 104 440 108\" fill=\"none\"/>\n  </g>\n  <text x=\"462\" y=\"104\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#5e5e5e\">surface</text>\n  <!-- 빙산 위 (회색 — 보이는 것) -->\n  <polygon points=\"200,40 250,100 150,100\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"1.5\"/>\n  <text x=\"200\" y=\"68\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5e5e5e\">현실 검증</text>\n  <text x=\"200\" y=\"82\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#999\">\"looks cognitive\"</text>\n  <text x=\"200\" y=\"30\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">표면 — 인지처럼 보임</text>\n  <!-- 빙산 아래 (초록 — 진짜 뿌리) -->\n  <polygon points=\"150,100 250,100 290,235 110,235\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n  <text x=\"200\" y=\"135\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">감정적 뿌리</text>\n  <text x=\"200\" y=\"150\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\">emotional self–other distinction</text>\n  <!-- me / not me 접촉 -->\n  <g transform=\"translate(200,190)\">\n    <circle cx=\"-30\" cy=\"0\" r=\"20\" fill=\"#fff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"-30\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"me\"</text>\n    <circle cx=\"30\" cy=\"0\" r=\"20\" fill=\"#fff\" stroke=\"#1FA34A\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/>\n    <text x=\"30\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"not me\"</text>\n    <line x1=\"-10\" y1=\"0\" x2=\"10\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n  </g>\n  <!-- 우측 결론 -->\n  <g transform=\"translate(470,120)\">\n    <text x=\"0\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#1a1a1a\">∴ 논리적 사고의</text>\n    <text x=\"0\" y=\"15\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#1a1a1a\">    토대</text>\n    <text x=\"0\" y=\"34\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">foundation of</text>\n    <text x=\"0\" y=\"46\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">logical thinking</text>\n    <line x1=\"0\" y1=\"58\" x2=\"105\" y2=\"58\" stroke=\"#c8102e\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/>\n    <text x=\"0\" y=\"74\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#c8102e\">없으면 사실이</text>\n    <text x=\"0\" y=\"87\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#c8102e\">비합리적 신념에 악용</text>\n  </g>\n  <text x=\"200\" y=\"258\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">the visible tip rests on an emotional base</text>\n</svg>", "caption": "빙산 그림. 수면 위 작은 부분은 인지 능력처럼 보이는 현실 검증, 수면 아래 큰 부분은 감정적 자기-타인 구별이라는 진짜 뿌리이며, 나와 내가 아닌 것의 접촉을 표시"}, {"no": "4", "title": "Imitation Across Species", "ktitle": "종을 넘는 모방, 그러나 미해결", "field": "생물·인지", "page": "06강 Ex.04", "oneline": "모방은 침팬지부터 메추라기까지 여러 종에서 널리 관찰된다.", "tldr": ["모방은 침팬지부터 메추라기까지 여러 종에서 널리 관찰된다.", "그러나 행동이 일치하게 되는 ‘메커니즘’은 아직 밝혀지지 않았다.", "모방의 ‘적응적 가치’ 또한 미해결 과제로 남아 있다."], "analogy": "", "bg": "분야는 생물·인지예요. 핵심어 ‘모방(imitation)’ — 침팬지부터 메추라기까지 널리 관찰됨. → 모방이 어디까지 퍼져 있는지, 그리고 무엇이 아직 ‘미해결’인지에 주목하며 읽으세요.", "flow": [{"kind": "관찰", "t": "모방은 여러 종에서 널리 나타남"}, {"kind": "한계", "t": "행동 일치의 메커니즘은 미규명"}, {"kind": "한계", "t": "모방의 적응적 가치도 불명확"}, {"kind": "결론", "t": "널리 퍼졌지만 ‘지도 없는’ 영역"}], "quiz": [["모방은 어떤 종들에서 관찰되나요?", "침팬지부터 메추라기까지 여러 종에서요."], ["아직 풀리지 않은 점은?", "행동 일치의 메커니즘과 모방의 적응적 가치예요."]], "vocab": [["★ imitation", "모방"], ["★ separate A from B", "A를 B와 구별하다·분리하다"], ["★ social learning", "사회적 학습"], ["★ genetically predisposed behavior", "유전적으로 결정된 행동"], ["★ trial-and-error learning", "시행착오 학습"], ["★ match A to B (= that of N)", "A를 B에 맞추다·일치시키다"], ["⊕ demonstrator", "시범자"], ["◇ be poorly understood", "제대로 이해되지 않다"], ["⊕ sensory modalities", "감각 양식"], ["⊕ perspective taking", "조망 수용·관점 채택"], ["★ opaque imitation", "불투명한 모방"], ["★ necessary and sufficient conditions", "필요충분조건"], ["★ adaptive", "적응적인·적응에 유리한"], ["⊕ acquisition (of behavior)", "(행동의) 습득"], ["★ innovative variants", "혁신적인 변형·새 변종 행동"]], "en": "Procedures have recently been developed that separate imitation from other forms of social influence and social learning, and the results of initial studies indicate that species from chimpanzees to quail can imitate. Such findings should not be surprising because social learning, whether by imitation or some other process, often provides greater benefits than genetically predisposed behavior or trial-and-error learning. However, the processes involved that enable animals to match their behavior to that of a demonstrator are poorly understood. Imitation may involve some form of coordination of visual and touch-based sensory modalities, perspective taking, or response facilitation. However, the role of such processes in opaque imitation is still unknown. A reasonable strategy to better understand the mechanisms involved in imitation would be to determine the necessary and sufficient conditions for opaque imitation to occur and to explore the range of behaviors that animals can imitate. Finally, the ability to learn from others may not only be adaptive in making more efficient the acquisition of behavior important for survival and reproduction but it may also free the animal from trial-and-error learning to engage in innovative variants that may be adopted by others.", "ko": "모방을 다른 형태의 사회적 영향 및 사회적 학습과 구별하는 절차들이 최근 개발되었고, 초기 연구 결과는 침팬지에서 메추라기에 이르는 종들이 모방할 수 있다는 것을 보여 준다. 그러한 연구 결과는 아마 놀라운 일이 아닐 터인데, 이는 사회적 학습이, 모방에 의한 것이든 다른 방법에 의한 것이든, 많은 경우 유전적으로 결정된 행동이나 시행착오 학습보다 더 큰 이점을 제공하기 때문이다. 그러나 동물이 자신의 행동을 시범자의 행동에 맞추는 것을 가능하게 하는 관련 과정은 제대로 이해되지 않고 있다. 모방은 시각적 감각 양식과 촉각에 기반한 감각 양식의 조정, 조망 수용, 또는 반응 촉진의 어떤 형태를 포함할 수도 있다. 하지만 그러한 과정들이 불투명한 모방에서 어떤 역할을 하는지는 여전히 알려지지 않았다. 모방에 관여하는 메커니즘을 더 잘 이해하기 위한 합리적인 전략은 불투명한 모방이 일어나기 위한 필요충분조건을 규명하고 동물이 모방할 수 있는 행동의 범위를 탐색하는 것일 것이다. 마지막으로, 다른 개체로부터 배우는 능력은 생존과 번식에 중요한 행동의 습득을 더 효율적으로 만드는 데 적응성이 있을 뿐만 아니라, 동물이 시행착오 학습에서 벗어나도록 하여 다른 개체들이 채택할 수도 있는 혁신적인 변형을 할 수 있게 해 줄 수도 있다.", "read": [{"en": "Procedures have recently been developed that separate imitation from other forms of social influence and social learning, and the results of initial studies indicate that species from chimpanzees to quail can imitate.", "ko": "모방을 다른 형태의 사회적 영향 및 사회적 학습과 구별하는 절차들이 최근 개발되었고, 초기 연구 결과는 침팬지에서 메추라기에 이르는 종들이 모방할 수 있다는 것을 보여 준다.", "chunks": [["Procedures have recently been developed", "절차들이 최근 개발되었다"], ["that separate imitation", "모방을 구별하는"], ["from other forms of social influence and social learning,", "다른 형태의 사회적 영향 및 사회적 학습과,"], ["and the results of initial studies indicate", "그리고 초기 연구 결과는 보여 준다"], ["that species from chimpanzees to quail can imitate.", "침팬지에서 메추라기에 이르는 종이 모방할 수 있다는 것을."]]}, {"en": "Such findings should not be surprising because social learning, whether by imitation or some other process, often provides greater benefits than genetically predisposed behavior or trial-and-error learning.", "ko": "그러한 연구 결과는 아마 놀라운 일이 아닐 터인데, 이는 사회적 학습이, 모방에 의한 것이든 다른 방법에 의한 것이든, 많은 경우 유전적으로 결정된 행동이나 시행착오 학습보다 더 큰 이점을 제공하기 때문이다.", "chunks": [["Such findings should not be surprising", "그러한 연구 결과는 놀랄 일이 아닐 것이다"], ["because social learning,", "왜냐하면 사회적 학습은,"], ["whether by imitation or some other process,", "모방에 의한 것이든 다른 방법에 의한 것이든,"], ["often provides greater benefits", "많은 경우 더 큰 이점을 제공하기 때문이다"], ["than genetically predisposed behavior", "유전적으로 결정된 행동이나"], ["or trial-and-error learning.", "시행착오 학습보다."]]}, {"en": "However, the processes involved that enable animals to match their behavior to that of a demonstrator are poorly understood.", "ko": "그러나 동물이 자신의 행동을 시범자의 행동에 맞추는 것을 가능하게 하는 관련 과정은 제대로 이해되지 않고 있다.", "chunks": [["However,", "그러나,"], ["the processes involved", "관련 과정들은"], ["that enable animals to match their behavior", "동물이 자신의 행동을 일치시키는 것을 가능하게 하는"], ["to that of a demonstrator", "시범자의 행동에"], ["are poorly understood.", "제대로 이해되지 않고 있다."]]}, {"en": "Imitation may involve some form of coordination of visual and touch-based sensory modalities, perspective taking, or response facilitation.", "ko": "모방은 시각적 감각 양식과 촉각에 기반한 감각 양식의 조정, 조망 수용, 또는 반응 촉진의 어떤 형태를 포함할 수도 있다.", "chunks": [["Imitation may involve", "모방은 ~을 포함할 수도 있다"], ["some form of coordination", "어떤 형태의 조정"], ["of visual and touch-based sensory modalities,", "시각적 그리고 촉각에 기반한 감각 양식의,"], ["perspective taking,", "조망 수용,"], ["or response facilitation.", "또는 반응 촉진을."]]}, {"en": "However, the role of such processes in opaque imitation is still unknown.", "ko": "하지만 그러한 과정들이 불투명한 모방에서 어떤 역할을 하는지는 여전히 알려지지 않았다.", "chunks": [["However,", "하지만,"], ["the role of such processes", "그러한 과정들의 역할은"], ["in opaque imitation", "불투명한 모방에서"], ["is still unknown.", "여전히 알려지지 않았다."]]}, {"en": "A reasonable strategy to better understand the mechanisms involved in imitation would be to determine the necessary and sufficient conditions for opaque imitation to occur and to explore the range of behaviors that animals can imitate.", "ko": "모방에 관여하는 메커니즘을 더 잘 이해하기 위한 합리적인 전략은 불투명한 모방이 일어나기 위한 필요충분조건을 규명하고 동물이 모방할 수 있는 행동의 범위를 탐색하는 것일 것이다.", "chunks": [["A reasonable strategy", "합리적인 전략은"], ["to better understand the mechanisms", "메커니즘을 더 잘 이해하기 위한"], ["involved in imitation", "모방에 관여하는"], ["would be to determine", "규명하는 것일 것이다"], ["the necessary and sufficient conditions", "필요충분조건을"], ["for opaque imitation to occur", "불투명한 모방이 일어나기 위한"], ["and to explore the range of behaviors", "그리고 행동의 범위를 탐색하는 것을"], ["that animals can imitate.", "동물이 모방할 수 있는."]]}, {"en": "Finally, the ability to learn from others may not only be adaptive in making more efficient the acquisition of behavior important for survival and reproduction but it may also free the animal from trial-and-error learning to engage in innovative variants that may be adopted by others.", "ko": "마지막으로, 다른 개체로부터 배우는 능력은 생존과 번식에 중요한 행동의 습득을 더 효율적으로 만드는 데 적응성이 있을 뿐만 아니라, 동물이 시행착오 학습에서 벗어나도록 하여 다른 개체들이 채택할 수도 있는 혁신적인 변형을 할 수 있게 해 줄 수도 있다.", "chunks": [["Finally,", "마지막으로,"], ["the ability to learn from others", "다른 개체로부터 배우는 능력은"], ["may not only be adaptive", "적응성이 있을 뿐만 아니라"], ["in making more efficient the acquisition of behavior", "행동의 습득을 더 효율적으로 만드는 데"], ["important for survival and reproduction", "생존과 번식에 중요한"], ["but it may also free the animal", "동물을 자유롭게 할 수도 있다"], ["from trial-and-error learning", "시행착오 학습에서"], ["to engage in innovative variants", "혁신적인 변형에 참여하기 위해"], ["that may be adopted by others.", "다른 개체들이 채택할 수도 있는."]]}], "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 침팬지부터 쥐 새 메추라기까지 여러 종이 모두 모방 가능함을 초록으로 묶고, 가운데 행동 일치 메커니즘은 물음표가 든 빨강 점선 박스로 미해결을 표시하며, 하단에 효율적 습득과 혁신 확산이라는 두 가치 박스\">\n  <!-- 상단: 종 스펙트럼 (모방 가능, 초록) -->\n  <text x=\"200\" y=\"22\" font-family=\ ic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">poorly understood — still unknown</text>\n  </g>\n  <!-- 하단: 이중 가치 (초록) -->\n  <text x=\"300\" y=\"200\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">그럼에도 모방의 이중 가치</text>\n  <g transform=\"translate(70,212)\">\n    <rect x=\"0\" y=\"0\" width=\"210\" height=\"46\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"105\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">효율적 습득</text>\n    <text x=\"105\" y=\"36\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">efficient acquisition</text>\n  </g>\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">+</text>\n  <g transform=\"translate(320,212)\">\n    <rect x=\"0\" y=\"0\" width=\"210\" height=\"46\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"105\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">혁신 확산</text>\n    <text x=\"105\" y=\"36\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">spread of innovation</text>\n  </g>\n</svg>", "caption": "상단에 침팬지부터 쥐 새 메추라기까지 여러 종이 모두 모방 가능함을 초록으로 묶고, 가운데 행동 일치 메커니즘은 물음표가 든 빨강 점선 박스로 미해결을 표시하며, 하단에 효율적 습득과 혁신 확산이라는 두 가치 박스"}, {"no": "5", "title": "Assimilated Delight", "ktitle": "동화된 기쁨 — 놀라움이 일상이 될 때", "field": "심리·마케팅", "page": "06강 Ex.05", "oneline": "새로운 기쁨(놀라움)은 곧 당연한 것으로 동화된다.", "tldr": ["새로운 기쁨(놀라움)은 곧 당연한 것으로 동화된다.", "그 결과 기대치가 올라가고 입소문이 퍼진다.", "경쟁사가 모방하면서 처음의 차별성은 사라진다."], "analogy": "", "bg": "분야는 심리·마케팅이에요. 핵심 개념 — 새로운 기쁨이 곧 ‘통상(normal)’으로 동화(assimilate)된다는 것. → 놀라움이 일상이 되면 기대·입소문·경쟁이 어떻게 연쇄적으로 변하는지에 주목하며 읽으세요.", "flow": [{"kind": "출발", "t": "새로운 기쁨 = 놀라움"}, {"kind": "전개", "t": "통상으로 동화 → 기대 상승"}, {"kind": "전개", "t": "입소문 → 경쟁사 모방"}, {"kind": "결론", "t": "차별성이 사라짐"}], "quiz": [["‘동화된 기쁨’이란?", "새로운 기쁨이 곧 당연한 것(통상)으로 받아들여지는 현상이에요."], ["그 결과 차별성은 어떻게 되나요?", "기대 상승·모방으로 처음의 차별성이 사라져요."]], "vocab": [["★ feelings of delight", "기쁨의 감정"], ["⊕ permanently / indefinitely", "영구히·무한히"], ["◇ physical intensity", "물리적 강렬함"], ["⊕ excitement / exhilaration", "흥분·신남"], ["★ raise expectations (well above normal)", "기대치를 (통상보다 훨씬) 끌어올리다"], ["★ assimilated delight", "동화된 기쁨"], ["★ incorporate A into B", "A를 B에 포함시키다·통합시키다"], ["◇ expectations of what is normal", "*통상적인 것*에 대한 기대"], ["⊕ feature", "특징·기능"], ["★ come to expect (V원형)", "~을 기대하게 되다 (점진적)"], ["⊕ competing organisations", "경쟁 조직·경쟁사"], ["★ duplicate", "모방하다·똑같이 만들다"], ["★ nothing unique about", "~에 고유한 점이 없음"], ["◇ delighting feature", "기쁘게 하는 특징"], ["★ be worth it", "그만한 가치가 있다"]], "en": "In the sports industry, feelings of delight do not stay permanently with a customer; they will not continue to feel the physical intensity of delight (such as excitement or exhilaration) indefinitely, although they are likely to remember the experience. If, for example, fitness centre customers remember being delighted the last time they used a service, their expectations may be raised well above normal. This may be termed assimilated delight, because the customer has incorporated the things that delighted them into their expectations of what is normal. The customer may even tell others about the features of the service, and as a result others may also come to expect a high level of performance as normal. Worse, competing organisations may hear about what is being offered and duplicate it themselves, which of course will mean that there is nothing unique about the original service. As a result, sport organisations must carefully consider whether the cost of providing a delighting feature is worth it.", "ko": "스포츠 산업에서, 기쁨의 감정은 고객에게 영구적으로 지속되지 않는데, 그들은 비록 그 경험은 기억할 가능성이 있지만, (흥분이나 신남과 같은) 기쁨의 물리적 강렬함을 무한히 계속해서 느끼지 않을 것이다. 예를 들어, 헬스장 고객이 지난번에 서비스를 이용했을 때 즐거웠던 기억이 있다면, 그들의 기대는 통상적인 수준보다 훨씬 높아질 수도 있다. 이것은 동화된 기쁨이라고 부를 수 있는데, 이는 고객이 자신을 즐겁게 했던 요소들을 통상적인 것에 대한 기대에 포함시켰기 때문이다. 고객은 심지어 서비스의 특징을 다른 사람들에게 이야기할 수도 있고, 그 결과 다른 사람들 또한 높은 수준의 운영을 통상적이라고 기대하게 될 수도 있다. 더 나쁜 것은, 경쟁 조직이 제공되는 것에 대해 듣고 그것을 직접 모방할 수도 있는데, 그것은 물론 원래 서비스에 고유한 점이 없다는 것을 의미할 것이다. 결과적으로 스포츠 조직은 기쁘게 하는 특징을 제공하는 데 드는 비용이 그만한 가치가 있는지를 신중히 고려해야 한다.", "read": [{"en": "In the sports industry, feelings of delight do not stay permanently with a customer; they will not continue to feel the physical intensity of delight (such as excitement or exhilaration) indefinitely, although they are likely to remember the experience.", "ko": "스포츠 산업에서, 기쁨의 감정은 고객에게 영구적으로 지속되지 않는데, 그들은 비록 그 경험은 기억할 가능성이 있지만, (흥분이나 신남과 같은) 기쁨의 물리적 강렬함을 무한히 계속해서 느끼지 않을 것이다.", "chunks": [["In the sports industry,", "스포츠 산업에서,"], ["feelings of delight do not stay permanently with a customer;", "기쁨의 감정은 고객에게 영구히 지속되지 않는다;"], ["they will not continue to feel", "그들은 계속 느끼지 않을 것이다"], ["the physical intensity of delight", "기쁨의 물리적 강렬함을"], ["(such as excitement or exhilaration)", "(흥분이나 신남과 같은)"], ["indefinitely,", "무한히,"], ["although they are likely to remember the experience.", "비록 그 경험은 기억할 가능성이 있지만."]]}, {"en": "If, for example, fitness centre customers remember being delighted the last time they used a service, their expectations may be raised well above normal.", "ko": "예를 들어, 헬스장 고객이 지난번에 서비스를 이용했을 때 즐거웠던 기억이 있다면, 그들의 기대는 통상적인 수준보다 훨씬 높아질 수도 있다.", "chunks": [["If, for example,", "예를 들어,"], ["fitness centre customers remember being delighted", "헬스장 고객이 즐거웠던 것을 기억한다면"], ["the last time they used a service,", "지난번에 서비스를 이용했을 때,"], ["their expectations may be raised", "그들의 기대는 올라갈 수도 있다"], ["well above normal.", "통상적인 수준보다 훨씬."]]}, {"en": "This may be termed assimilated delight, because the customer has incorporated the things that delighted them into their expectations of what is normal.", "ko": "이것은 동화된 기쁨이라고 부를 수 있는데, 이는 고객이 자신을 즐겁게 했던 요소들을 통상적인 것에 대한 기대에 포함시켰기 때문이다.", "chunks": [["This may be termed assimilated delight,", "이것은 동화된 기쁨이라고 부를 수 있는데,"], ["because the customer has incorporated", "왜냐하면 고객이 포함시켰기 때문이다"], ["the things that delighted them", "자신을 즐겁게 했던 것들을"], ["into their expectations of what is normal.", "통상적인 것에 대한 기대 속으로."]]}, {"en": "The customer may even tell others about the features of the service, and as a result others may also come to expect a high level of performance as normal.", "ko": "고객은 심지어 서비스의 특징을 다른 사람들에게 이야기할 수도 있고, 그 결과 다른 사람들 또한 높은 수준의 운영을 통상적이라고 기대하게 될 수도 있다.", "chunks": [["The customer may even tell others", "고객은 심지어 다른 사람들에게 말할 수도 있다"], ["about the features of the service,", "서비스의 특징에 대해,"], ["and as a result", "그리고 그 결과"], ["others may also come to expect", "다른 사람들도 ~을 기대하게 될 수도 있다"], ["a high level of performance", "높은 수준의 운영을"], ["as normal.", "통상적인 것으로."]]}, {"en": "Worse, competing organisations may hear about what is being offered and duplicate it themselves, which of course will mean that there is nothing unique about the original service.", "ko": "더 나쁜 것은, 경쟁 조직이 제공되는 것에 대해 듣고 그것을 직접 모방할 수도 있는데, 그것은 물론 원래 서비스에 고유한 점이 없다는 것을 의미할 것이다.", "chunks": [["Worse,", "더 나쁜 것은,"], ["competing organisations may hear", "경쟁 조직이 들을 수도 있다"], ["about what is being offered", "제공되는 것에 대해"], ["and duplicate it themselves,", "그리고 그것을 직접 모방할 수도 있다,"], ["which of course will mean", "그것은 물론 의미할 것이다"], ["that there is nothing unique", "고유한 점이 없다는 것을"], ["about the original service.", "원래 서비스에."]]}, {"en": "As a result, sport organisations must carefully consider whether the cost of providing a delighting feature is worth it.", "ko": "결과적으로 스포츠 조직은 기쁘게 하는 특징을 제공하는 데 드는 비용이 그만한 가치가 있는지를 신중히 고려해야 한다.", "chunks": [["As a result,", "결과적으로,"], ["sport organisations must carefully consider", "스포츠 조직은 신중하게 고려해야 한다"], ["whether the cost", "비용이"], ["of providing a delighting feature", "기쁘게 하는 특징을 제공하는 데 드는"], ["is worth it.", "그만한 가치가 있는지를."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"일정한 기쁨 제공 수준을 나타내는 초록 점선 위로, 기대=통상 수준이 계단처럼 올라가 둘 사이의 차별성 간격이 점점 줄어 결국 사라지는 그래프와, 단계별 라벨 그리고 비용 대비 가치 판단 결론\">\n  <!-- 축 -->\n  <line x1=\"45\" y1=\"35\" x2=\"45\" y2=\"182\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n  <line x1=\"45\" y1=\"182\" x2=\"465\" y2=\"182\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n  <!-- 기쁨 제공 수준 (초록 점선, 일정) -->\n  <line x1=\"45\" y1=\"55\" x2=\"455\" y2=\"55\" stroke=\"#1FA34A\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/>\n  <text x=\"50\" y=\"49\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"start\" fill=\"#1FA34A\" font-weight=\"700\">delight provided (constant)</text>\n  <!-- 기대=통상 수준 계단 (검정, 상승) -->\n  <polyline points=\"45,165 138,165 138,138 232,138 232,108 326,108 326,70 455,70\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.8\"/>\n  <text x=\"92\" y=\"178\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">기대=통상 수준 ↑</text>\n  <!-- 차별성 간격 화살표 (초록, 점점 축소) -->\n  <g stroke=\"#1FA34A\" stroke-width=\"1.3\">\n    <line x1=\"92\" y1=\"58\" x2=\"92\" y2=\"162\"/><polygon points=\"92,58 89,65 95,65\" fill=\"#1FA34A\"/><polygon points=\"92,162 89,155 95,155\" fill=\"#1FA34A\"/>\n    <line x1=\"185\" y1=\"58\" x2=\"185\" y2=\"135\"/><polygon points=\"185,58 182,65 188,65\" fill=\"#1FA34A\"/><polygon points=\"185,135 182,128 188,128\" fill=\"#1FA34A\"/>\n    <line x1=\"279\" y1=\"58\" x2=\"279\" y2=\"105\"/><polygon points=\"279,58 276,64 282,64\" fill=\"#1FA34A\"/><polygon points=\"279,105 276,99 282,99\" fill=\"#1FA34A\"/>\n  </g>\n  <text x=\"70\" y=\"110\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#1FA34A\" font-weight=\"700\">차별성</text>\n  <!-- 소멸 지점 -->\n  <text x=\"453\" y=\"46\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"end\" fill=\"#c8102e\" font-weight=\"700\">차별성 소멸 (gap → 0)</text>\n  <!-- 단계 라벨 (x축 아래) -->\n  <g font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" fill=\"#1a1a1a\" text-anchor=\"middle\">\n    <text x=\"92\" y=\"198\">기쁨 제공</text>\n    <text x=\"185\" y=\"198\">동화(통상화)</text>\n    <text x=\"279\" y=\"198\">입소문·기대↑</text>\n    <text x=\"392\" y=\"198\">경쟁사 모방</text>\n  </g>\n  <!-- 단계 화살표 -->\n  <g stroke=\"#999\" stroke-width=\"1\"><line x1=\"128\" y1=\"208\" x2=\"152\" y2=\"208\"/><polygon points=\"152,208 146,205 146,211\" fill=\"#999\"/>\n  <line x1=\"222\" y1=\"208\" x2=\"246\" y2=\"208\"/><polygon points=\"246,208 240,205 240,211\" fill=\"#999\"/>\n  <line x1=\"330\" y1=\"208\" x2=\"354\" y2=\"208\"/><polygon points=\"354,208 348,205 348,211\" fill=\"#999\"/></g>\n  <!-- 결론 -->\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif KR\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">∴ 기쁨 제공 비용이 그만한 가치인가?</text>\n  <text x=\"300\" y=\"256\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">is the cost worth it?</text>\n</svg>", "caption": "일정한 기쁨 제공 수준을 나타내는 초록 점선 위로, 기대=통상 수준이 계단처럼 올라가 둘 사이의 차별성 간격이 점점 줄어 결국 사라지는 그래프와, 단계별 라벨 그리고 비용 대비 가치 판단 결론"}, {"no": "6", "title": "Counterexamples", "ktitle": "반례 — 정의의 경계를 시험하기", "field": "논리·철학", "page": "06강 Ex.06", "oneline": "반례는 정의의 적절성을 시험하는 진단 도구다.", "tldr": ["반례는 정의의 적절성을 시험하는 진단 도구다.", "정의가 너무 좁은지, 너무 넓은지를 가려낸다.", "4개의 사례로 양쪽 극단을 보여 준다."], "analogy": "", "bg": "분야는 논리·철학이에요. 핵심어 ‘반례(counterexample)’ — 어떤 정의가 맞는지 시험하는 사례. → 반례가 정의의 ‘너무 좁음/너무 넓음’을 어떻게 진단하는지에 주목하며 읽으세요.", "flow": [{"kind": "개념", "t": "반례 = 정의를 시험하는 사례"}, {"kind": "기능 ①", "t": "정의가 너무 좁은지 진단"}, {"kind": "기능 ②", "t": "정의가 너무 넓은지 진단"}, {"kind": "결론", "t": "반례로 정의의 경계를 다듬음"}], "quiz": [["‘반례’는 어떤 역할을 하나요?", "정의가 너무 좁거나 넓은지 판별하는 진단 도구예요."], ["반례로 무엇을 다듬나요?", "정의의 경계(범위)를 다듬어요."]], "vocab": [["★ tell whether (S+V) or (S+V)", "~인지 아닌지를 알다·판별하다"], ["★ too broad / too narrow", "너무 포괄적인 / 너무 협소한"], ["★ counterexample", "반례 (정의를 깨는 특정 사례)"], ["◇ particular instance", "특정 사례·구체 사례"], ["★ prove (a definition) wrong", "(정의가) 틀렸음을 증명하다"], ["★ belong in (the concept)", "(개념에) 속하다"], ["⊕ be excluded by / be included in", "~에 의해 제외되다 / ~에 포함되다"], ["⊕ atheist", "무신론자"], ["◇ religious animal", "*종교적인 동물*"], ["◇ two-legged animal", "*두 발 달린 동물*"], ["★ degree-granting educational institution", "학위를 수여하는 교육 기관"], ["★ include too much / not include enough", "너무 많이 포함하다 / 충분히 포함하지 못하다"], ["⊕ a sheaf of (chopped) tobacco", "(잘게 썬) 담뱃잎 묶음"], ["⊕ rolled in white/brown paper", "흰/갈색 종이에 만"]], "en": "We can tell whether a definition is too broad or too narrow by looking for counterexamples. A counterexample is a particular instance that proves a definition wrong. If a definition is too narrow, a counterexample is something that belongs in the concept but is excluded by the definition. Atheists are counterexamples to the definition of humans as religious animals. However, if a definition is too broad, a counterexample is something that does not belong in the concept but is included in the definition. Birds are counterexamples to the definition of humans as two-legged animals. Let's look at a few other cases. \"A college is a degree-granting educational institution.\" A counterexample would be a law school. Law schools are degree-granting educational institutions, but they are not colleges. So this definition includes too much; it's too broad. \"A cigarette is a sheaf of chopped tobacco rolled in white paper.\" What about the brands that are rolled in brown paper? They are counterexamples proving that the definition does not include enough; it's too narrow.", "ko": "우리는 정의가 너무 포괄적인지 아니면 너무 협소한지를 반례를 찾아봄으로써 알 수 있다. 반례란 정의가 틀렸음을 증명하는 특정 사례이다. 정의가 너무 협소하다면, 반례는 그 개념에 속하지만 그 정의에 의해 제외되는 어떤 것이다. 무신론자는 인간을 종교적인 동물로 정의한 것에 대한 반례이다. 그러나 정의가 너무 포괄적이라면, 반례는 그 개념에 속하지 않지만 그 정의에 포함되는 어떤 것이다. 새는 인간을 두 발 달린 동물로 정의한 것에 대한 반례이다. 몇 가지 다른 사례를 살펴보자. '대학이란 학위를 수여하는 교육 기관이다.' 한 가지 반례는 로스쿨일 것이다. 로스쿨은 학위를 수여하는 교육 기관이지만, 대학은 아니다. 따라서 이 정의는 너무 많은 것을 포함하여, 너무 포괄적이다. '담배란 흰 종이로 만 잘게 썬 담뱃잎 묶음이다.' 갈색 종이에 만 브랜드는 어떻게 되는가? 그것들은 그 정의가 충분한 것을 포함하지 않고 있음을 증명하는 반례들이며, 그 정의는 너무 협소하다.", "read": [{"en": "We can tell whether a definition is too broad or too narrow by looking for counterexamples.", "ko": "우리는 정의가 너무 포괄적인지 아니면 너무 협소한지를 반례를 찾아봄으로써 알 수 있다.", "chunks": [["We can tell", "우리는 알 수 있다"], ["whether a definition is too broad or too narrow", "정의가 너무 포괄적인지 너무 협소한지를"], ["by looking for counterexamples.", "반례를 찾아봄으로써."]]}, {"en": "A counterexample is a particular instance that proves a definition wrong.", "ko": "반례란 정의가 틀렸음을 증명하는 특정 사례이다.", "chunks": [["A counterexample is", "반례란"], ["a particular instance", "특정 사례이다"], ["that proves a definition wrong.", "정의가 틀렸음을 증명하는."]]}, {"en": "If a definition is too narrow, a counterexample is something that belongs in the concept but is excluded by the definition.", "ko": "정의가 너무 협소하다면, 반례는 그 개념에 속하지만 그 정의에 의해 제외되는 어떤 것이다.", "chunks": [["If a definition is too narrow,", "정의가 너무 협소하다면,"], ["a counterexample is something", "반례는 어떤 것이다"], ["that belongs in the concept", "그 개념에 속하지만"], ["but is excluded by the definition.", "그 정의에 의해 제외되는."]]}, {"en": "Atheists are counterexamples to the definition of humans as religious animals.", "ko": "무신론자는 인간을 종교적인 동물로 정의한 것에 대한 반례이다.", "chunks": [["Atheists are counterexamples", "무신론자는 반례이다"], ["to the definition of humans", "인간의 정의에 대한"], ["as religious animals.", "종교적인 동물이라는."]]}, {"en": "However, if a definition is too broad, a counterexample is something that does not belong in the concept but is included in the definition.", "ko": "그러나 정의가 너무 포괄적이라면, 반례는 그 개념에 속하지 않지만 그 정의에 포함되는 어떤 것이다.", "chunks": [["However, if a definition is too broad,", "그러나 정의가 너무 포괄적이라면,"], ["a counterexample is something", "반례는 어떤 것이다"], ["that does not belong in the concept", "그 개념에 속하지 않지만"], ["but is included in the definition.", "그 정의에 포함되는."]]}, {"en": "Birds are counterexamples to the definition of humans as two-legged animals.", "ko": "새는 인간을 두 발 달린 동물로 정의한 것에 대한 반례이다.", "chunks": [["Birds are counterexamples", "새는 반례이다"], ["to the definition of humans", "인간의 정의에 대한"], ["as two-legged animals.", "두 발 달린 동물이라는."]]}, {"en": "Let's look at a few other cases. \"A college is a degree-granting educational institution.\" A counterexample would be a law school. Law schools are degree-granting educational institutions, but they are not colleges. So this definition includes too much; it's too broad.", "ko": "몇 가지 다른 사례를 살펴보자. '대학이란 학위를 수여하는 교육 기관이다.' 한 가지 반례는 로스쿨일 것이다. 로스쿨은 학위를 수여하는 교육 기관이지만, 대학은 아니다. 따라서 이 정의는 너무 많은 것을 포함하여, 너무 포괄적이다.", "chunks": [["Let's look at a few other cases.", "몇 가지 다른 사례를 살펴보자."], ["\"A college is a degree-granting educational institution.\"", "\"대학이란 학위를 수여하는 교육 기관이다.\""], ["A counterexample would be a law school.", "한 가지 반례는 로스쿨일 것이다."], ["Law schools are degree-granting educational institutions,", "로스쿨은 학위 수여 교육 기관이지만,"], ["but they are not colleges.", "대학은 아니다."], ["So this definition includes too much;", "따라서 이 정의는 너무 많이 포함한다;"], ["it's too broad.", "너무 포괄적이다."]]}, {"en": "\"A cigarette is a sheaf of chopped tobacco rolled in white paper.\" What about the brands that are rolled in brown paper? They are counterexamples proving that the definition does not include enough; it's too narrow.", "ko": "'담배란 흰 종이로 만 잘게 썬 담뱃잎 묶음이다.' 갈색 종이에 만 브랜드는 어떻게 되는가? 그것들은 그 정의가 충분한 것을 포함하지 않고 있음을 증명하는 반례들이며, 그 정의는 너무 협소하다.", "chunks": [["\"A cigarette is a sheaf of chopped tobacco", "\"담배란 잘게 썬 담뱃잎 묶음이다"], ["rolled in white paper.\"", "흰 종이로 만.\""], ["What about the brands", "~ 브랜드는 어떻게 되는가"], ["that are rolled in brown paper?", "갈색 종이에 만?"], ["They are counterexamples", "그것들은 반례이다"], ["proving that the definition does not include enough;", "그 정의가 충분히 포함하지 못함을 증명하는;"], ["it's too narrow.", "너무 협소하다."]]}], "metaphor": "<svg viewBox=\"0 0 600 262\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽은 너무 좁은 정의의 원 밖으로 진짜 멤버가 배제되어 빨강으로 표시되고, 오른쪽은 너무 넓은 정의의 원 안으로 비멤버가 침입해 빨강으로 표시되어, 두 방향의 반례를 대조하는 그림\">\n  <!-- 좌: 너무 좁음 -->\n  <g>\n    <text x=\"150\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">정의가 너무 좁음</text>\n    <circle cx=\"135\" cy=\"120\" r=\"60\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n    <text x=\"135\" y=\"100\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">정의 (예: 종교적 동물)</text>\n    <!-- 내부 정상 멤버 -->\n    <circle cx=\"118\" cy=\"128\" r=\"4\" fill=\"#999\"/><circle cx=\"148\" cy=\"132\" r=\"4\" fill=\"#999\"/><circle cx=\"133\" cy=\"148\" r=\"4\" fill=\"#999\"/>\n    <!-- 밖으로 배제된 진짜 멤버 (빨강) -->\n    <circle cx=\"225\" cy=\"95\" r=\"9\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n    <line x1=\"221\" y1=\"91\" x2=\"229\" y2=\"99\" stroke=\"#c8102e\" stroke-width=\"1.6\"/><line x1=\"229\" y1=\"91\" x2=\"221\" y2=\"99\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <path d=\"M 216 99 Q 195 112 178 118\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n    <polygon points=\"178,118 185,116 183,122\" fill=\"#c8102e\"/>\n    <text x=\"232\" y=\"82\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">무신론자</text>\n    <text x=\"232\" y=\"116\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\">a member, excluded</text>\n    <text x=\"150\" y=\"205\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">속하는데 배제됨 = 반례</text>\n  </g>\n  <!-- 중앙 구분 -->\n  <line x1=\"300\" y1=\"45\" x2=\"300\" y2=\"195\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <!-- 우: 너무 넓음 -->\n  <g>\n    <text x=\"450\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">정의가 너무 넓음</text>\n    <circle cx=\"450\" cy=\"120\" r=\"60\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n    <text x=\"450\" y=\"92\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">정의 (예: 두 발 동물)</text>\n    <!-- 내부 정상 멤버 -->\n    <circle cx=\"432\" cy=\"135\" r=\"4\" fill=\"#999\"/><circle cx=\"465\" cy=\"138\" r=\"4\" fill=\"#999\"/>\n    <!-- 안으로 침입한 비멤버 (빨강) — 새 -->\n    <g transform=\"translate(450,118)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"13\" ry=\"9\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <circle cx=\"-11\" cy=\"-6\" r=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <polygon points=\"-16,-6 -22,-4 -16,-2\" fill=\"#c8102e\"/>\n      <circle cx=\"-12\" cy=\"-7\" r=\"0.9\" fill=\"#c8102e\"/>\n      <line x1=\"-3\" y1=\"9\" x2=\"-3\" y2=\"15\" stroke=\"#c8102e\" stroke-width=\"1.2\"/><line x1=\"4\" y1=\"9\" x2=\"4\" y2=\"15\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n    </g>\n    <text x=\"450\" y=\"158\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">새 (bird)</text>\n    <text x=\"450\" y=\"205\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">안 속하는데 포함됨 = 반례</text>\n  </g>\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"238\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">a counterexample shows the definition is wrong — too narrow ↔ too broad</text>\n  <text x=\"300\" y=\"254\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">추가 사례: 로스쿨 = 너무 넓음 / 갈색 종이 담배 = 너무 좁음</text>\n</svg>", "caption": "왼쪽은 너무 좁은 정의의 원 밖으로 진짜 멤버가 배제되어 빨강으로 표시되고, 오른쪽은 너무 넓은 정의의 원 안으로 비멤버가 침입해 빨강으로 표시되어, 두 방향의 반례를 대조하는 그림"}, {"no": "7", "title": "Insect Cognition", "ktitle": "곤충의 인지 — 말벌의 일화 기억", "field": "생물·인지", "page": "06강 Ex.07", "oneline": "말벌은 무엇을·어디서·언제를 결합해 기억한다.", "tldr": ["말벌은 무엇을·어디서·언제를 결합해 기억한다.", "이는 인간의 일화 기억과 유사한 형태다.", "곤충도 단순 본능을 넘는 인지 능력을 보인다."], "analogy": "", "bg": "분야는 생물·인지예요. 핵심 — 곤충(말벌)도 ‘무엇을·어디서·언제(what/where/when)’를 함께 기억한다는 것. 인간의 ‘일화 기억(episodic memory)’과 비교돼요. → 곤충 기억이 인간 일화 기억과 어디까지 닮았는지에 주목하며 읽으세요.", "flow": [{"kind": "발견", "t": "말벌의 what/where/when 기억"}, {"kind": "비교", "t": "인간 일화 기억과 유사"}, {"kind": "함의", "t": "곤충도 정교한 인지 능력 보유"}, {"kind": "결론", "t": "단순 본능을 넘어서는 곤충 인지"}], "quiz": [["말벌이 기억하는 세 요소는?", "무엇을(what)·어디서(where)·언제(when)예요."], ["이것이 인간의 무엇과 닮았나요?", "‘일화 기억(episodic memory)’과 닮았어요."]], "vocab": [["★ depict A as", "A를 ~로 묘사하다"], ["★ genetically fixed, stereotyped behavior", "유전적으로 고정된·정형화된 행동"], ["★ elaborate conducts", "정교한 행동"], ["⊕ attentional /* navigational */ spatial", "주의·길찾기·공간의"], ["◇ hide nests in several places", "둥지를 여러 장소에 숨기다"], ["⊕ apparently", "겉보기에는·~인 것 같이"], ["★ the three wh's (what/where/when)", "세 가지 wh 요소 (무엇·어디·언제)"], ["★ be exclusive to", "~의 전용이다·~만의 것이다"], ["⊕ higher vertebrates", "고등 척추동물"], ["★ precursor of", "~의 선행 요건·전조"], ["★ episodic memory", "에피소드 기억·일화 기억"], ["★ explicit memory", "명시적 기억"], ["★ verbally communicated", "언어로 전달되는"], ["⊕ nonhuman counterparts", "인간이 아닌 상응 존재"], ["★ critically differ in being", "~라는 점에서 결정적으로 다르다"]], "en": "While insects are usually depicted as displaying genetically fixed, stereotyped behaviors, recent research has shown that they can have quite elaborate conducts, indicating a high degree of learning capacity and flexibility, displaying attentional capacities, navigational skills, and a good spatial memory. For instance, some species of wasps hide their nests in several places that they keep hidden and visit regularly to provide them with food. They apparently remember the quality of the supplies provided to each nest and the time when these were delivered in order to visit them again timely. This kind of memory (remembering the three wh's: what, where, and when something happened) was traditionally considered to be exclusive to higher vertebrates and is supposed to be a fundamental precursor of planning abilities and for the development of a complex representation of the world. In humans, this capacity has been termed episodic memory, but it critically differs from its nonhuman counterparts in being a form of explicit memory; that is, it can be verbally communicated to others (like when you tell your friend what happened last night at someone else's party).", "ko": "비록 곤충이 유전적으로 고정되고 정형화된 행동을 보여 주는 것으로 보통 묘사되지만, 최근 연구는 곤충이 상당히 정교한 행동을 할 수 있는데, 이는 높은 수준의 학습 능력·유연성, 주의력·길찾기·공간 기억력을 보여 준다는 것을 보여 주었다. 예를 들어, 일부 말벌 종은 둥지를 여러 장소에 숨겨 놓는데, 그것을 숨긴 상태로 유지하며 먹이를 공급하기 위해 정기적으로 방문한다. 말벌들은 시기적절하게 그 둥지들을 다시 방문하기 위해 각 둥지에 제공된 보급품의 질과 이것들이 공급된 시간을 기억하는 것처럼 보인다. 이러한 종류의 기억(세 가지 wh 요소, 즉 무엇이·어디서·언제 일어났는지 기억)은 전통적으로 고등 척추동물의 전용으로 여겨졌으며, 계획 능력과 세상에 대한 복잡한 표상의 발달을 위한 매우 중요한 선행 요건으로 일반적으로 믿어졌다. 인간의 경우, 이러한 능력은 에피소드 기억으로 일컬어져 왔지만, 그것이 명시적 기억의 한 형태라는 점에서 인간이 아닌 상응하는 존재들과는 결정적으로 다르다. 즉 (친구에게 지난 밤 다른 사람의 파티에서 무슨 일이 있었는지 말하는 것처럼) 그것이 다른 사람들에게 언어로 전달될 수 있다.", "read": [{"en": "While insects are usually depicted as displaying genetically fixed, stereotyped behaviors, recent research has shown that they can have quite elaborate conducts, indicating a high degree of learning capacity and flexibility, displaying attentional capacities, navigational skills, and a good spatial memory.", "ko": "비록 곤충이 유전적으로 고정되고 정형화된 행동을 보여 주는 것으로 보통 묘사되지만, 최근 연구는 곤충이 상당히 정교한 행동을 할 수 있는데, 이는 높은 수준의 학습 능력·유연성, 주의력·길찾기·공간 기억력을 보여 준다는 것을 보여 주었다.", "chunks": [["While insects are usually depicted", "비록 곤충이 보통 묘사되지만"], ["as displaying genetically fixed, stereotyped behaviors,", "유전적으로 고정되고 정형화된 행동을 보이는 것으로,"], ["recent research has shown", "최근 연구는 보여 주었다"], ["that they can have quite elaborate conducts,", "곤충이 상당히 정교한 행동을 할 수 있음을,"], ["indicating a high degree of learning capacity and flexibility,", "높은 수준의 학습 능력과 유연성을 나타내며,"], ["displaying attentional capacities, navigational skills, and a good spatial memory.", "주의력, 길 찾기 능력, 우수한 공간 기억력을 보여 주는."]]}, {"en": "For instance, some species of wasps hide their nests in several places that they keep hidden and visit regularly to provide them with food.", "ko": "예를 들어, 일부 말벌 종은 둥지를 여러 장소에 숨겨 놓는데, 그것을 숨긴 상태로 유지하며 먹이를 공급하기 위해 정기적으로 방문한다.", "chunks": [["For instance,", "예를 들어,"], ["some species of wasps hide their nests", "일부 말벌 종은 둥지를 숨긴다"], ["in several places", "여러 장소에"], ["that they keep hidden", "그것들을 숨긴 상태로 유지하며"], ["and visit regularly to provide them with food.", "정기적으로 방문해 먹이를 공급한다."]]}, {"en": "They apparently remember the quality of the supplies provided to each nest and the time when these were delivered in order to visit them again timely.", "ko": "말벌들은 시기적절하게 그 둥지들을 다시 방문하기 위해 각 둥지에 제공된 보급품의 질과 이것들이 공급된 시간을 기억하는 것처럼 보인다.", "chunks": [["They apparently remember", "말벌들은 ~을 기억하는 것처럼 보인다"], ["the quality of the supplies", "보급품의 질을"], ["provided to each nest", "각 둥지에 제공된"], ["and the time when these were delivered", "그리고 이것이 공급된 시간을"], ["in order to visit them again timely.", "시기적절하게 다시 방문하기 위해."]]}, {"en": "This kind of memory (remembering the three wh's: what, where, and when something happened) was traditionally considered to be exclusive to higher vertebrates and is supposed to be a fundamental precursor of planning abilities and for the development of a complex representation of the world.", "ko": "이러한 종류의 기억(세 가지 wh 요소, 즉 무엇이·어디서·언제 일어났는지 기억)은 전통적으로 고등 척추동물의 전용으로 여겨졌으며, 계획 능력과 세상에 대한 복잡한 표상의 발달을 위한 매우 중요한 선행 요건으로 일반적으로 믿어졌다.", "chunks": [["This kind of memory", "이러한 종류의 기억은"], ["(remembering the three wh's: what, where, and when something happened)", "(세 가지 wh 요소: 무엇이·어디서·언제 일어났는지 기억)"], ["was traditionally considered to be exclusive to higher vertebrates", "전통적으로 고등 척추동물의 전용으로 여겨졌다"], ["and is supposed to be a fundamental precursor", "그리고 매우 중요한 선행 요건으로 일반적으로 믿어진다"], ["of planning abilities", "계획 능력의"], ["and for the development of a complex representation of the world.", "세상에 대한 복잡한 표상의 발달을 위한."]]}, {"en": "In humans, this capacity has been termed episodic memory, but it critically differs from its nonhuman counterparts in being a form of explicit memory; that is, it can be verbally communicated to others (like when you tell your friend what happened last night at someone else's party).", "ko": "인간의 경우, 이러한 능력은 에피소드 기억으로 일컬어져 왔지만, 그것이 명시적 기억의 한 형태라는 점에서 인간이 아닌 상응하는 존재들과는 결정적으로 다르다. 즉 (친구에게 지난 밤 다른 사람의 파티에서 무슨 일이 있었는지 말하는 것처럼) 그것이 다른 사람들에게 언어로 전달될 수 있다.", "chunks": [["In humans, this capacity has been termed", "인간의 경우, 이 능력은 ~으로 일컬어져 왔다"], ["episodic memory,", "에피소드 기억으로,"], ["but it critically differs from its nonhuman counterparts", "그러나 인간이 아닌 상응하는 존재들과는 결정적으로 다르다"], ["in being a form of explicit memory;", "명시적 기억의 한 형태라는 점에서;"], ["that is, it can be verbally communicated to others", "즉, 다른 사람들에게 언어로 전달될 수 있다"], ["(like when you tell your friend what happened last night at someone else's party).", "(친구에게 지난 밤 다른 사람의 파티에서 무슨 일이 있었는지 말하는 것처럼)."]]}], "metaphor": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"가운데 what where when 일화적 기억 상자를 곤충(말벌)과 인간이 함께 공유하지만, 인간에게만 언어로 전달 가능한 명시적 기억이라는 추가 상자가 연결되어 결정적 차이를 보이는 그림\">\n  <!-- 공유 기억 상자 (중앙) -->\n  <g transform=\"translate(225,92)\">\n    <rect x=\"0\" y=\"0\" width=\"150\" height=\"56\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n    <text x=\"75\" y=\"20\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">what · where · when</text>\n    <text x=\"75\" y=\"38\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">일화적 기억 (공유)</text>\n    <text x=\"75\" y=\"51\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">episodic-like memory</text>\n  </g>\n  <!-- 좌: 말벌 -->\n  <g transform=\"translate(95,95)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"17\" ry=\"11\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <g stroke=\"#1a1a1a\" stroke-width=\"1.1\"><line x1=\"-7\" y1=\"-9\" x2=\"-7\" y2=\"9\"/><line x1=\"2\" y1=\"-10\" x2=\"2\" y2=\"10\"/><line x1=\"1

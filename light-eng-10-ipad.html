건 인류가 같은 사회적 관계를 공유하기 때문이다."]], "vocab": [["myth", "신화"], ["diverse", "다양한"], ["ultimately", "궁극적으로, 결국"], ["share", "공유하다"], ["no matter what", "무엇이든 상관없이"], ["sure bet", "확실한 일"]], "en": "It's possible that myths from diverse cultures share common features because ultimately we all share the same social relationships. No matter what your background is, it's a sure bet that you have friends and relations you like and acquaintances and enemies you don't. There are top cats and underdogs, 'haves' and 'have-nots', heroes and scoundrels. You fall in love, have babies and mourn one another's death. It doesn't matter if you live in the desert, in the Arctic chill, in a massive city, on the edge of a vast savannah or on a tropical island ─ fundamentally, you'll have a great deal in common with every other person on the planet. Naturally, the stories we all tell would reflect these same social forces of love, death, anxiety and competition for resources.", "ko": "다양한 문화의 신화가 공통된 특징을 공유하는 것이 가능한 것은 궁극적으로 우리는 모두 같은 사회적 관계를 공유하기 때문이다. 여러분의 배경이 무엇이든, 좋아하는 친구와 인연이 있고 그렇지 않은 지인과 적이 있다는 것은 분명한 사실이다. 사회적 강자와 약자, '가진 자'와 '못 가진 자', 영웅과 악당이 존재한다. 사랑에 빠지고, 아기를 낳고, 서로의 죽음을 슬퍼한다. 여러분이 사막에 살든, 북극의 추위 속에 살든, 대도시에 살든, 광활한 사바나 끝에 살든, 열대 섬에 살든 상관없이 기본적으로 지구상의 다른 모든 사람과 많은 공통점을 가질 것이다. 당연히 우리 모두가 하는 이야기에는 사랑, 죽음, 불안, 자원에 대한 경쟁이라는 이러한 같은 사회적 동력이 반영되어 있을 것이다.", "read": [{"en": "It's possible that myths from diverse cultures share common features because ultimately we all share the same social relationships.", "ko": "다양한 문화의 신화가 공통된 특징을 공유하는 것이 가능한 것은 궁극적으로 우리는 모두 같은 사회적 관계를 공유하기 때문이다.", "chunks": [["It's possible that myths from diverse cultures share common features", "다양한 문화의 신화가 공통된 특징을 공유하는 것이 가능한 것은"], ["because ultimately we all share the same social relationships", "궁극적으로 우리 모두가 같은 사회적 관계를 공유하기 때문이다"]]}, {"en": "No matter what your background is, it's a sure bet that you have friends and relations you like and acquaintances and enemies you don't.", "ko": "여러분의 배경이 무엇이든, 좋아하는 친구와 인연이 있고 그렇지 않은 지인과 적이 있다는 것은 분명한 사실이다.", "chunks": [["No matter what your background is,", "여러분의 배경이 무엇이든,"], ["it's a sure bet that", "~은 분명한 사실이다"], ["you have friends and relations you like", "여러분이 좋아하는 친구와 인연이 있고"], ["and acquaintances and enemies you don't.", "그리고 좋아하지 않는 지인과 적이 있다는 것."]]}, {"en": "There are top cats and underdogs, 'haves' and 'have-nots', heroes and scoundrels.", "ko": "사회적 강자와 약자, '가진 자'와 '못 가진 자', 영웅과 악당이 존재한다.", "chunks": [["There are top cats and underdogs,", "사회적 강자와 약자가 있고,"], ["'haves' and 'have-nots',", "'가진 자'와 '못 가진 자',"], ["heroes and scoundrels", "영웅과 악당이 존재한다"]]}, {"en": "You fall in love, have babies and mourn one another's death.", "ko": "사랑에 빠지고, 아기를 낳고, 서로의 죽음을 슬퍼한다.", "chunks": [["You fall in love,", "여러분은 사랑에 빠지고,"], ["have babies", "아기를 낳고,"], ["and mourn one another's death", "서로의 죽음을 슬퍼한다"]]}, {"en": "It doesn't matter if you live in the desert, in the Arctic chill, in a massive city, on the edge of a vast savannah or on a tropical island ─ fundamentally, you'll have a great deal in common with every other person on the planet.", "ko": "여러분이 사막에 살든, 북극의 추위 속에 살든, 대도시에 살든, 광활한 사바나 끝에 살든, 열대 섬에 살든 상관없이 기본적으로 지구상의 다른 모든 사람과 많은 공통점을 가질 것이다.", "chunks": [["It doesn't matter if you live in the desert,", "여러분이 사막에 살든,"], ["in the Arctic chill,", "북극의 추위 속에 살든,"], ["in a massive city,", "대도시에 살든,"], ["on the edge of a vast savannah or on a tropical island ─", "광활한 사바나 끝에 살든, 열대 섬에 살든 상관없이 ─"], ["fundamentally, you'll have a great deal in common", "기본적으로 많은 공통점을 갖게 될 것이다"], ["with every other person on the planet", "지구상의 다른 모든 사람과"]]}, {"en": "Naturally, the stories we all tell would reflect these same social forces of love, death, anxiety and competition for resources.", "ko": "당연히 우리 모두가 하는 이야기에는 사랑, 죽음, 불안, 자원에 대한 경쟁이라는 이러한 같은 사회적 동력이 반영되어 있을 것이다.", "chunks": [["Naturally, the stories we all tell", "당연히, 우리 모두가 하는 이야기는"], ["would reflect these same social forces", "이러한 같은 사회적 동력을 반영할 것이다"], ["of love, death, anxiety and competition for resources", "즉 사랑, 죽음, 불안, 자원에 대한 경쟁이라는"]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 그리스 기둥·아시아 탑·아프리카 마스크·북유럽 룬 등 다양한 문화의 신화 상징 네 개가 있고 화살표가 모두 아래로 수렴해 사랑·죽음·갈등·자원 경쟁이라는 인류 공통 사회 동력이라는 박스로 모이는 그림\">\n  <!-- 상단: 4개 다양 문화 신화 -->\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">다양 문화의 신화</text>\n\n  <!-- 그리스 (기둥) -->\n  <g transform=\"translate(80, 65)\">\n    <!-- 기둥 -->\n    <rect x=\"-12\" y=\"-20\" width=\"24\" height=\"4\" fill=\"#1a1a1a\"/>\n    <rect x=\"-9\" y=\"-16\" width=\"18\" height=\"32\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <!-- 세로줄 -->\n    <line x1=\"-5\" y1=\"-16\" x2=\"-5\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n    <line x1=\"0\" y1=\"-16\" x2=\"0\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n    <line x1=\"5\" y1=\"-16\" x2=\"5\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n    <rect x=\"-12\" y=\"16\" width=\"24\" height=\"4\" fill=\"#1a1a1a\"/>\n    <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">Greek</text>\n  </g>\n\n  <!-- 아시아 (탑/용) -->\n  <g transform=\"translate(225, 65)\">\n    <!-- 탑 -->\n    <polygon points=\"-12,15 -10,5 0,-3 10,5 12,15\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <polygon points=\"-10,5 -8,-2 0,-9 8,-2 10,5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <polygon points=\"-8,-2 -5,-8 0,-14 5,-8 8,-2\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <line x1=\"0\" y1=\"-14\" x2=\"0\" y2=\"-20\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <circle cx=\"0\" cy=\"-20\" r=\"1.8\" fill=\"#1a1a1a\"/>\n    <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">Asian</text>\n  </g>\n\n  <!-- 아프리카 (마스크) -->\n  <g transform=\"translate(375, 65)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"11\" ry=\"18\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <!-- 눈 -->\n    <ellipse cx=\"-4\" cy=\"-4\" rx=\"1.8\" ry=\"2.5\" fill=\"#1a1a1a\"/>\n    <ellipse cx=\"4\" cy=\"-4\" rx=\"1.8\" ry=\"2.5\" fill=\"#1a1a1a\"/>\n    <!-- 줄무늬 -->\n    <line x1=\"-8\" y1=\"3\" x2=\"-6\" y2=\"3\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <line x1=\"6\" y1=\"3\" x2=\"8\" y2=\"3\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <!-- 입 -->\n    <ellipse cx=\"0\" cy=\"8\" rx=\"3\" ry=\"2\" fill=\"#1a1a1a\"/>\n    <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">African</text>\n  </g>\n\n  <!-- 북유럽 (룬) -->\n  <g transform=\"translate(520, 65)\">\n    <rect x=\"-15\" y=\"-18\" width=\"30\" height=\"36\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <!-- 룬 글자 (간단한 ㅏ 형태) -->\n    <line x1=\"0\" y1=\"-12\" x2=\"0\" y2=\"12\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n    <line x1=\"0\" y1=\"-8\" x2=\"6\" y2=\"-12\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n    <line x1=\"0\" y1=\"0\" x2=\"-6\" y2=\"-3\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n    <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">Norse</text>\n  </g>\n\n  <!-- 수렴 화살표 -->\n  <g stroke=\"#1FA34A\" stroke-width=\"1.6\" fill=\"#1FA34A\">\n    <line x1=\"80\" y1=\"115\" x2=\"225\" y2=\"170\"/>\n    <polygon points=\"225,170 217,166 220,174\"/>\n    <line x1=\"225\" y1=\"115\" x2=\"275\" y2=\"170\"/>\n    <polygon points=\"275,170 268,164 268,173\"/>\n    <line x1=\"375\" y1=\"115\" x2=\"325\" y2=\"170\"/>\n    <polygon points=\"325,170 332,164 332,173\"/>\n    <line x1=\"520\" y1=\"115\" x2=\"375\" y2=\"170\"/>\n    <polygon points=\"375,170 383,166 380,174\"/>\n  </g>\n\n  <!-- 하단: 공통 기저 박스 -->\n  <g transform=\"translate(140, 170)\">\n    <rect x=\"0\" y=\"0\" width=\"320\" height=\"62\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <text x=\"160\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">공통 기저 — common social dynamics</text>\n    <text x=\"160\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">love · death · conflict · scarcity</text>\n    <text x=\"160\" y=\"53\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">사랑 · 죽음 · 갈등 · 자원 경쟁</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"255\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">myths differ in form — but reflect the same human relationships</text>\n</svg>", "caption": "다양 문화 신화 → 공통 기저(사랑·죽음·갈등·자원 경쟁)"}, {"no": "9", "title": "Empathy Becomes Compassion", "ktitle": "공감에서 연민으로", "field": "심리·신경", "page": "p71)", "oneline": "공감(empathy)은 고통을 ‘함께 느끼는’ 것이라 혼자선 압도된다.", "tldr": ["공감(empathy)은 고통을 ‘함께 느끼는’ 것이라 혼자선 압도된다.", "연민(compassion)이 더해지면 다른 뇌 부위가 켜진다.", "옥시토신·유대가 활성화돼 공감이 ‘돕는 힘’이 된다."], "analogy": "친구의 슬픔을 ‘같이’ 느끼기만 하면(공감) 둘 다 가라앉죠. 거기에 ‘도와주고 싶다’는 마음(연민)이 더해지면, 비로소 실제로 손을 내밀 힘이 생겨요.", "bg": "분야는 심리·신경과학이에요. 핵심 대비 — 고통을 함께 느끼는 ‘공감(empathy)’과, 따뜻하게 반응하려는 ‘연민(compassion)’. Tania Singer의 뇌 연구가 나와요. → 공감에서 연민으로 넘어갈 때 무엇이 달라지는지에 초점을 두고 읽으세요.", "flow": [{"kind": "전제", "t": "공감 = 고통을 함께 느낌"}, {"kind": "한계", "t": "공감만으론 압도된다"}, {"kind": "전환", "t": "연민 = 친절히 반응하려는 마음"}, {"kind": "기전", "t": "Singer — 다른 뇌부위·옥시토신·유대 활성", "d": "심박↓, 돌봄·쾌락 부위 켜짐."}, {"kind": "결론", "t": "연민이 공감을 ‘변화의 힘’으로"}], "quiz": [["‘공감’과 ‘연민’은 어떻게 다른가?", "공감은 남의 고통을 ‘함께 느끼는’ 것, 연민은 그 고통에 ‘친절히 반응하려는’ 마음이에요 — 활성화되는 뇌 부위도 달라요."], ["연민이 개입하면 몸·뇌에 무슨 일이?", "심박이 느려지고 ‘유대 호르몬’ 옥시토신이 분비되며, 돌봄·쾌락과 연결된 뇌 부위가 켜져요."], ["핵심 한 문장?", "공감만으론 압도되지만, 연민이 더해지면 비로소 ‘돕는 힘’이 된다."]], "vocab": [["empathy", "공감"], ["compassion", "연민"], ["chemistry", "화학 작용, 화학"], ["activate", "활성화하다"], ["versus", "~에 대해, ~와 대비하여"], ["oxytocin", "옥시토신 ('유대 호르몬')"]], "en": "When we switch from empathy to compassion, we change our very brain chemistry. Indeed, leading compassion researcher Tania Singer found that different parts of the brain are activated when we share someone's pain (empathy) versus when we want to respond warmly to someone's suffering (compassion). Our heart rate slows, we release the \"bonding hormone\" oxytocin, and the parts of the brain linked to caregiving and pleasure light up. Once compassion enters the picture, we do not necessarily experience other people's pain with them, explains Singer, but we feel concern for them and a strong desire to help. Rather than turning us away from others, our compassion connects us even more deeply to them and strengthens our social ties. To be clear, empathy is, in itself, a wonderful thing. It's a superpower all sensitive people share. But empathy alone can become overwhelming. That's where compassion comes in. It's what allows us to use our empathy to make a difference.", "ko": "우리가 공감에서 연민으로 전환할 때, 우리는 바로 우리의 뇌 화학 작용을 변경한다. 실제로 선도적인 연민 연구자인 Tania Singer는 우리가 누군가의 고통을 공유할 때(공감)와 대비하여 누군가의 고통에 친절하게 반응하고 싶어 할 때(연민)는 다른 뇌 부위가 활성화된다는 것을 발견했다. 우리는 심장 박동 수가 느려지고, '유대 호르몬'인 옥시토신을 분비하며, 돌봄과 쾌락과 연결된 뇌 부분이 켜진다. 일단 연민이 개입하면, 우리는 필연적으로 다른 사람의 고통을 그들과 함께 경험하지는 않지만, 그들에 대한 걱정과 돕고 싶은 강한 욕구를 느낀다고 Singer는 설명한다. 우리의 연민은 타인으로부터 우리를 멀어지게 하기보다 그들과 훨씬 더 깊게 연결하고 우리의 사회적 유대를 강화한다. 분명히 말하자면 공감은 그 자체로 훌륭한 것이다. 그것은 모든 감수성이 강한 사람들이 공유하는 특별한 능력이다. 하지만 공감만으로는 압도될 수 있다. 거기가 연민이 개입하는 지점이다. 그것이 우리가 공감을 사용하여 변화를 이룰 수 있게 해 주는 것이다.", "read": [{"en": "When we switch from empathy to compassion, we change our very brain chemistry.", "ko": "우리가 공감에서 연민으로 전환할 때, 우리는 바로 우리의 뇌 화학 작용을 변경한다.", "chunks": [["When we switch from empathy to compassion,", "우리가 공감에서 연민으로 전환할 때,"], ["we change our very brain chemistry", "바로 우리의 뇌 화학 작용을 변경한다"]]}, {"en": "Indeed, leading compassion researcher Tania Singer found that different parts of the brain are activated when we share someone's pain (empathy) versus when we want to respond warmly to someone's suffering (compassion).", "ko": "실제로 선도적인 연민 연구자인 Tania Singer는 우리가 누군가의 고통을 공유할 때(공감)와 대비하여 누군가의 고통에 친절하게 반응하고 싶어 할 때(연민)는 다른 뇌 부위가 활성화된다는 것을 발견했다.", "chunks": [["Indeed, leading compassion researcher Tania Singer found", "실제로 선도적인 연민 연구자 Tania Singer는 발견했다"], ["that different parts of the brain are activated", "뇌의 다른 부위가 활성화된다는 것을"], ["when we share someone's pain (empathy)", "누군가의 고통을 공유할 때(공감)"], ["versus when we want to respond warmly to someone's suffering (compassion)", "와 대비하여 누군가의 고통에 친절하게 반응하고 싶어 할 때(연민)"]]}, {"en": "Our heart rate slows, we release the \"bonding hormone\" oxytocin, and the parts of the brain linked to caregiving and pleasure light up.", "ko": "우리는 심장 박동 수가 느려지고, '유대 호르몬'인 옥시토신을 분비하며, 돌봄과 쾌락과 연결된 뇌 부분이 켜진다.", "chunks": [["Our heart rate slows,", "우리의 심장 박동 수가 느려지고,"], ["we release the \"bonding hormone\" oxytocin,", "'유대 호르몬'인 옥시토신을 분비하며,"], ["and the parts of the brain linked to caregiving and pleasure light up", "돌봄과 쾌락과 연결된 뇌 부분이 켜진다"]]}, {"en": "Once compassion enters the picture, we do not necessarily experience other people's pain with them, explains Singer, but we feel concern for them and a strong desire to help.", "ko": "일단 연민이 개입하면, 우리는 필연적으로 다른 사람의 고통을 그들과 함께 경험하지는 않지만, 그들에 대한 걱정과 돕고 싶은 강한 욕구를 느낀다고 Singer는 설명한다.", "chunks": [["Once compassion enters the picture,", "일단 연민이 개입하면,"], ["we do not necessarily experience other people's pain with them,", "우리는 다른 사람의 고통을 그들과 함께 경험하지는 않지만,"], ["explains Singer,", "Singer는 설명한다,"], ["but we feel concern for them and a strong desire to help", "그들에 대한 걱정과 돕고 싶은 강한 욕구를 느낀다"]]}, {"en": "Rather than turning us away from others, our compassion connects us even more deeply to them and strengthens our social ties.", "ko": "우리의 연민은 타인으로부터 우리를 멀어지게 하기보다 그들과 훨씬 더 깊게 /* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

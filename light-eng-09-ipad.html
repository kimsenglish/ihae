<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 Light 영어 09강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   지문 이해 보조 자료 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-ipad">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 Light 영어 09강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 Light 영어 09강
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */

 지지·소속감을 준다(긍정적)."], "analogy": "SNS에서 나와 생각이 같은 사람만 팔로우하면 마음은 편하죠. 그 ‘메아리 방’ 안에선 내 편견이 굳고 반대편과 멀어지지만, 같은 편끼리 모이면 지지와 소속감을 얻는 면도 있어요.", "bg": "분야는 사회·심리예요. ‘유유상종(birds of a feather flock together)’을 Kosinski가 Facebook 디지털 발자국으로 입증한 연구가 핵심. → 비슷한 사람끼리 모이는 경향이 온라인에서 어떻게 드러나는지에 초점을 두고 읽으세요.", "flow": [{"kind": "증거", "t": "Kosinski: 온라인서도 ‘비슷한 사람’과 상호작용"}, {"kind": "순기능", "t": "집단 소속 → 소속감"}, {"kind": "역기능", "t": "파벌·반향실·내집단 편향 → 기존 태도 강화", "d": "온·오프 양극화."}, {"kind": "양면", "t": "같은 무리 머묾 = 양극화 ↔ 지지·소속감"}], "quiz": [["‘끼리끼리 모임’이 낳는 부정적 결과는?", "파벌·반향실·내집단 편향을 만들어 기존의 배타적 태도를 강화하고 양극화로 이어져요."], ["같은 현상의 긍정적 면은?", "자기가 속한 집단에 함께 머무는 것이 지지와 소속감을 키워 준다는 점이에요."], ["핵심 한 문장?", "끼리끼리 모이는 것은 소속감을 주지만, 동시에 반향실·양극화를 낳는 양면성이 있다."]], "vocab": [["flock together", "떼 지어 모이다"], ["digital footprint", "디지털 발자국"], ["belonging", "소속감"], ["clique", "파벌"], ["echo chamber", "반향실(같은 의견만 메아리)"], ["in-group bias", "내집단 편향"], ["polarization", "양극화"]], "en": "Michal Kosinski and colleagues, in 2017, had concrete evidence to prove that birds of a feather do indeed flock together. In his research with over a hundred universities, he analysed the digital footprint left on Facebook by student participants and concluded that most people interact with others who are similar to them online. Essentially, we all develop a sense of belonging through membership in certain groups. Flocking together can have several consequences. It leads to the formation of cliques, echo chambers and in-group biases, all of which can reinforce existing attitudes and beliefs that are already exclusive or marginalizing. Polarization online and in real life is, in part, a symptom of the 'birds flocking together' phenomenon ─ not helpful. At the same time, however, sticking together with your tribe can foster a sense of support and belonging.", "ko": "Michal Kosinski와 동료들은 2017년, 같은 깃털의 새들이 정말 떼 지어 모인다는 것을 입증할 구체적 증거를 확보했다. 100개가 넘는 대학과 함께 진행한 그의 연구에서, 그는 학생 참가자들의 페이스북에 남겨진 디지털 발자국을 분석했으며 대부분의 사람이 온라인상에서 그들과 비슷한 타인들과 상호작용을 한다고 결론지었다. 본질적으로 우리는 모두 특정 집단의 구성원이 됨으로써 소속감을 갖기 시작한다. 함께 떼 지어 모이는 것은 몇 가지 결과를 낳을 수 있다. 그것은 파벌, 반향실, 그리고 내집단 편향의 형성으로 이어지고, 그것은 모두 이미 배타적이거나 주변화시키는 기존의 태도와 신념을 강화할 수 있다. 온라인 및 실제 삶에서의 양극화는 부분적으로 '떼 지어 모이는 새'현상의 증상인데, 이는 도움이 되지 않는다. 하지만 동시에 자기가 속한 집단에 붙어 함께 있는 것은 지지와 소속감을 촉진할 수 있다.", "read": [{"en": "Michal Kosinski and colleagues, in 2017, had concrete evidence to prove that birds of a feather do indeed flock together.", "ko": "Michal Kosinski와 동료들은 2017년, 같은 깃털의 새들이 정말 떼 지어 모인다는 것을 입증할 구체적 증거를 확보했다.", "chunks": [["Michal Kosinski and colleagues, in 2017,", "Michal Kosinski와 동료들은 2017년,"], ["had concrete evidence to prove", "~을 입증할 구체적 증거를 확보했다"], ["that birds of a feather do indeed flock together.", "같은 깃털의 새들이 정말로 떼 지어 모인다는 것을."]]}, {"en": "In his research with over a hundred universities, he analysed the digital footprint left on Facebook by student participants and concluded that most people interact with others who are similar to them online.", "ko": "100개가 넘는 대학과 함께 진행한 그의 연구에서, 그는 학생 참가자들의 페이스북에 남겨진 디지털 발자국을 분석했으며 대부분의 사람이 온라인상에서 그들과 비슷한 타인들과 상호작용을 한다고 결론지었다.", "chunks": [["In his research with over a hundred universities,", "100개가 넘는 대학과 함께 진행한 그의 연구에서,"], ["he analysed the digital footprint", "그는 디지털 발자국을 분석했다"], ["left on Facebook by student participants", "학생 참가자들에 의해 페이스북에 남겨진"], ["and concluded that most people interact", "그리고 대부분의 사람이 상호작용한다고 결론지었다"], ["with others who are similar to them online.", "온라인에서 비슷한 타인들과."]]}, {"en": "Essentially, we all develop a sense of belonging through membership in certain groups.", "ko": "본질적으로 우리는 모두 특정 집단의 구성원이 됨으로써 소속감을 갖기 시작한다.", "chunks": [["Essentially, we all develop", "본질적으로, 우리는 모두 ~을 발전시킨다"], ["a sense of belonging", "소속감을"], ["through membership in certain groups.", "특정 집단의 구성원이 됨으로써."]]}, {"en": "Flocking together can have several consequences.", "ko": "함께 떼 지어 모이는 것은 몇 가지 결과를 낳을 수 있다.", "chunks": [["Flocking together", "떼 지어 모이는 것은"], ["can have several consequences.", "몇 가지 결과를 낳을 수 있다."]]}, {"en": "It leads to the formation of cliques, echo chambers and in-group biases, all of which can reinforce existing attitudes and beliefs that are already exclusive or marginalizing.", "ko": "그것은 파벌, 반향실, 그리고 내집단 편향의 형성으로 이어지고, 그것은 모두 이미 배타적이거나 주변화시키는 기존의 태도와 신념을 강화할 수 있다.", "chunks": [["It leads to the formation of", "그것은 ~의 형성으로 이어진다"], ["cliques, echo chambers and in-group biases,", "파벌, 반향실, 그리고 내집단 편향의,"], ["all of which can reinforce", "그것들 모두는 ~을 강화할 수 있는데"], ["existing attitudes and beliefs", "기존의 태도와 신념을"], ["that are already exclusive or marginalizing.", "이미 배타적이거나 주변화시키는."]]}, {"en": "Polarization online and in real life is, in part, a symptom of the 'birds flocking together' phenomenon ─ not helpful.", "ko": "온라인 및 실제 삶에서의 양극화는 부분적으로 '떼 지어 모이는 새' 현상의 증상인데, 이는 도움이 되지 않는다.", "chunks": [["Polarization online and in real life", "온라인 및 실제 삶에서의 양극화는"], ["is, in part, a symptom of", "부분적으로 ~의 한 증상이다"], ["the 'birds flocking together' phenomenon", "'떼 지어 모이는 새' 현상의"], ["─ not helpful.", "─ 도움이 되지 않는."]]}, {"en": "At the same time, however, sticking together with your tribe can foster a sense of support and belonging.", "ko": "하지만 동시에 자기가 속한 집단에 붙어 함께 있는 것은 지지와 소속감을 촉진할 수 있다.", "chunks": [["At the same time, however,", "하지만 동시에,"], ["sticking together with your tribe", "자기가 속한 집단에 붙어 함께 있는 것은"], ["can foster a sense of support and belonging.", "지지와 소속감을 촉진할 수 있다."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"중앙에 비슷한 사람들의 모임이 있고 왼쪽으로는 소속감·정체성·심리적 안정이라는 긍정적 결과가, 오른쪽으로는 반향실·내집단 편향·양극화라는 부정적 결과가 양 갈래로 뻗어 나가는 그림\">\n  <!-- 중심: 비슷한 사람 모임 -->\n  <g transform=\"translate(300, 130)\">\n    <circle cx=\"0\" cy=\"0\" r=\"48\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <!-- 4명의 비슷한 stick figure (작게) -->\n    <g>\n      <g transform=\"translate(-18, -10)\">\n        <circle cx=\"0\" cy=\"-7\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <line x1=\"0\" y1=\"-2\" x2=\"0\" y2=\"12\ anchor=\"middle\" fill=\"#5e5e5e\" font-style=\"italic\">비슷한 타인과의 상호작용</text>\n\n  <!-- 좌 분기: 긍정 (belonging) -->\n  <line x1=\"252\" y1=\"130\" x2=\"180\" y2=\"130\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n  <polygon points=\"180,130 188,126 188,134\" fill=\"#1FA34A\"/>\n  <g transform=\"translate(20, 75)\">\n    <rect x=\"0\" y=\"0\" width=\"160\" height=\"110\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"80\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">긍정 효과</text>\n    <text x=\"80\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">belonging</text>\n    <!-- 따뜻한 원 -->\n    <circle cx=\"80\" cy=\"65\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <path d=\"M 73 65 Q 76 60 80 62 Q 84 60 87 65 Q 84 70 80 72 Q 76 70 73 65 Z\" fill=\"#1FA34A\" fill-opacity=\"0.3\"/>\n    <text x=\"80\" y=\"96\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">정체성 · 지지 · 심리적 안정</text>\n  </g>\n\n  <!-- 우 분기: 부정 (echo chamber) -->\n  <line x1=\"348\" y1=\"130\" x2=\"420\" y2=\"130\" stroke=\"#c8102e\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\n  <polygon points=\"420,130 412,126 412,134\" fill=\"#c8102e\"/>\n  <g transform=\"translate(420, 75)\">\n    <rect x=\"0\" y=\"0\" width=\"160\" height=\"110\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n    <text x=\"80\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">부정 효과</text>\n    <text x=\"80\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">echo chamber</text>\n    <!-- 닫힌 원 (반향실) -->\n    <g transform=\"translate(80, 65)\">\n      <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <!-- 안에 같은 화살표 메아리 -->\n      <path d=\"M -7 -3 L 5 -3\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <polygon points=\"5,-3 1,-5 1,-1\" fill=\"#c8102e\"/>\n      <path d=\"M -7 0 L 3 0\" stroke=\"#c8102e\" stroke-width=\"1\" opacity=\"0.6\"/>\n      <path d=\"M -7 3 L 1 3\" stroke=\"#c8102e\" stroke-width=\"0.8\" opacity=\"0.4\"/>\n    </g>\n    <text x=\"80\" y=\"96\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">파벌 · 내집단 편향 · 양극화</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"245\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">same act — two faces · belonging &amp; polarization</text>\n</svg>", "caption": "유유상종 → 양면 효과 (소속감 ↔ 반향실·내집단 편향)"}, {"no": "3", "title": "AI Bias from Unbiased Data", "ktitle": "편향 없는 데이터도 AI 편향을 낳는다", "field": "기술·윤리", "page": "p59 no.02", "oneline": "AI가 편향을 없앨 줄 알았지만, 편향은 여전히 생긴다.", "tldr": ["AI가 편향을 없앨 줄 알았지만, 편향은 여전히 생긴다.", "통념: ‘편향된 훈련 데이터’가 원인 → 편향 없는 데이터면 해결? — 거짓.", "편향 없는 데이터에서도 편향이 생긴다(여성 광고가 비싸 → 노출↓)."], "analogy": "재료를 깨끗이 골라도, ‘여성에게 광고 보내는 비용이 더 비싸다’ 같은 시스템 탓에 결과가 한쪽으로 기울어요. 데이터만 공정하다고 결과까지 공정한 건 아니에요.", "bg": "분야는 기술·윤리예요. ‘AI가 편향을 없애 줄 것’이라는 기대가 배경. 백인 얼굴 인식이 더 정확했다는 연구가 단서로 나와요. → 사람의 편견을 뺐는데도 왜 AI에 편향이 남는지에 주목하며 읽으세요.", "flow": [{"kind": "기대", "t": "AI가 인간의 편협함을 빼 차별을 끝낼 것"}, {"kind": "현실", "t": "편향은 여전히 발생(백인 얼굴을 더 잘 인식)"}, {"kind": "통념", "t": "‘편향된 훈련 데이터’가 원인 → 깨끗하면 해결?"}, {"kind": "반박", "t": "거짓 — 편향 없는 데이터서도 편향 발생"}, {"kind": "사례", "t": "성중립 광고도 여성 차별", "d": "여성 타깃이 비싸 → 노출 적어짐."}], "quiz": [["AI 편향에 대한 ‘통념’과 그 한계는?", "‘편향된 훈련 데이터가 원인이니 깨끗한 데이터면 해결된다’지만, 이는 거짓이에요."], ["편향 없는 데이터에서도 편향이 생긴 예는?", "성중립 광고인데도, 여성 타깃 광고가 더 비싸 노출이 줄어 결국 여성을 차별하게 된 경우예요."], ["핵심 한 문장?", "AI 편향은 편향된 데이터뿐 아니라 편향 없는 데이터에서도 생길 수 있다."]], "vocab": [["discrimination", "차별"], ["bigotry", "편협함·편견"], ["out of the loop", "순환에서 빼낸"], ["algorithm", "알고리즘"], ["conventional wisdom", "일반 통념"], ["emerge", "생겨나다·나타나다"], ["gender-neutral", "성별 중립적인"]], "en": "It was thought at first that AI would end discrimination and bias, by taking human bigotry out of the loop. Unfortunately, some famous studies have indicated that bias can still occur. For example, AI was shown to do a better job of recognizing white people, as compared to dark-skinned people. The bad performance was blamed on biased training data for the machine learning algorithm. Today, the conventional wisdom holds that biased training data are what cause AI bias, implying that unbiased training data will solve the problem. This is false. Although biased training data can, in fact, be a source of algorithmic bias, such bias can emerge even from unbiased data. For example, Lambrecht and Tucker showed that a gender-neutral ad could nevertheless discriminate against women, for the ironic reason that targeting women is sometimes more expensive, leading to fewer ads that target women.", "ko": "처음에는 인공지능이 인간의 편협함을 (정보) 순환에서 제거함으로써 차별과 편향을 끝낼 것으로 생각했다. 안타깝게도, 일부 유명한 연구는 편향이 여전히 일어날 수 있음을 보여주었다. 예를 들어, 인공지능은 피부색이 어두운 사람들에 비해 백인을 더 잘 인식한다는 것이 밝혀졌다. 그 나쁜 성능은 기계 학습 알고리즘을 위한 편향된 훈련 데이터 탓으로 돌려졌다. 오늘날, 일반 통념은 편향된 훈련 데이터가 인공지능 편향을 일으킨다는 것이며, 이는 편향되지 않은 훈련 데이터가 그 문제를 해결할 것임을 암시한다. 이것은 사실이 아니다. 비록 편향된 훈련 데이터가 실제로 알고리즘 편향의 원인이 될 수 있지만, 그런 편향은 편향되지 않은 데이터에서도 생겨날 수 있다. 예를 들어, Lambrecht와 Tucker는 성별 중립적인 광고임에도 불구하고 여성을 차별할 수 있는데, 그 이유는 아이러니하게도 여성을 대상으로 하는 것이 때때로 더 비용이 많이 들어, 여성을 표적으로 하는 광고 수가 더 줄어들기 때문이라는 것을 보여 주었다.", "read": [{"en": "It was thought at first that AI would end discrimination and bias, by taking human bigotry out of the loop.", "ko": "처음에는 인공지능이 인간의 편협함을 (정보) 순환에서 제거함으로써 차별과 편향을 끝낼 것으로 생각했다.", "chunks": [["It was thought at first", "처음에는 ~로 생각되었다"], ["that AI would end discrimination and bias,", "인공지능이 차별과 편향을 끝낼 것이라고,"], ["by taking human bigotry out of the loop.", "인간의 편협함을 (정보) 순환에서 제거함으로써."]]}, {"en": "Unfortunately, some famous studies have indicated that bias can still occur.", "ko": "안타깝게도, 일부 유명한 연구는 편향이 여전히 일어날 수 있음을 보여주었다.", "chunks": [["Unfortunately, some famous studies", "안타깝게도, 일부 유명한 연구는"], ["have indicated that", "~을 보여 주었다"], ["bias can still occur.", "편향이 여전히 일어날 수 있음을."]]}, {"en": "For example, AI was shown to do a better job of recognizing white people, as compared to dark-skinned people.", "ko": "예를 들어, 인공지능은 피부색이 어두운 사람들에 비해 백인을 더 잘 인식한다는 것이 밝혀졌다.", "chunks": [["For example, AI was shown to do", "예를 들어, 인공지능은 ~을 더 잘 한다는 것이 밝혀졌다"], ["a better job of recognizing white people,", "백인을 인식하는 일을,"], ["as compared to dark-skinned people.", "피부색이 어두운 사람들과 비교했을 때."]]}, {"en": "The bad performance was blamed on biased training data for the machine learning algorithm.", "ko": "그 나쁜 성능은 기계 학습 알고리즘을 위한 편향된 훈련 데이터 탓으로 돌려졌다.", "chunks": [["The bad performance was blamed on", "그 나쁜 성능은 ~의 탓으로 돌려졌다"], ["biased training data", "편향된 훈련 데이터"], ["for the machine learning algorithm.", "기계 학습 알고리즘을 위한."]]}, {"en": "Today, the conventional wisdom holds that biased training data are what cause AI bias, implying that unbiased training data will solve the problem.", "ko": "오늘날, 일반 통념은 편향된 훈련 데이터가 인공지능 편향을 일으킨다는 것이며, 이는 편향되지 않은 훈련 데이터가 그 문제를 해결할 것임을 암시한다.", "chunks": [["Today, the conventional wisdom holds that", "오늘날, 일반 통념은 ~이라고 본다"], ["biased training data are", "편향된 훈련 데이터가 ~이다"], ["what cause AI bias,", "인공지능 편향을 일으키는 것,"], ["implying that unbiased training data", "이는 편향되지 않은 훈련 데이터가 ~을 의미한다"], ["will solve the problem.", "그 문제를 해결할 것임을."]]}, {"en": "This is false.", "ko": "이것은 사실이 아니다.", "chunks": [["This is false.", "이것은 사실이 아니다."]]}, {"en": "Although biased training data can, in fact, be a source of algorithmic bias, such bias can emerge even from unbiased data.", "ko": "비록 편향된 훈련 데이터가 실제로 알고리즘 편향의 원인이 될 수 있지만, 그런 편향은 편향되지 않은 데이터에서도 생겨날 수 있다.", "chunks": [["Although biased training data can, in fact, be", "비록 편향된 훈련 데이터가 실제로 ~일 수 있지만"], ["a source of algorithmic bias,", "알고리즘 편향의 원인이,"], ["such bias can emerge even", "그런 편향은 또한 ~에서 생겨날 수 있다"], ["from unbiased data.", "편향되지 않은 데이터에서도."]]}, {"en": "For example, Lambrecht and Tucker showed that a gender-neutral ad could nevertheless discriminate against women, for the ironic reason that targeting women is sometimes more expensive, leading to fewer ads that target women.", "ko": "예를 들어, Lambrecht와 Tucker는 성별 중립적인 광고임에도 불구하고 여성을 차별할 수 있는데, 그 이유는 아이러니하게도 여성을 대상으로 하는 것이 때때로 더 비싸기 때문이라는 것을 보여주었다.", "chunks": [["For example, Lambrecht and Tucker showed that", "예를 들어, Lambrecht와 Tucker는 ~을 보여 주었다"], ["a gender-neutral ad could nevertheless discriminate against women,", "성별 중립적인 광고도 여성을 차별할 수 있다는 것을,"], ["for the ironic reason that targeting women", "그 이유는 아이러니하게도 여성을 대상으로 하는 것이"], ["is sometimes more expensive,", "때때로 더 비용이 많이 들어,"], ["leading to fewer ads that target women.", "여성을 표적으로 하는 광고 수가 더 줄어들기 때문이라는 것을."]]}], "metaphor": "<svg viewBox=\"0 0 600 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단은 편향된 데이터가 AI를 거쳐 편향된 결과를 내는 일반 통념의 흐름과, 편향되지 않은 깨끗한 데이터를 넣어도 AI를 거쳐 여전히 편향된 결과가 나오는 반전을 보여주고, 하단은 Lambrecht와 Tucker의 사례로 성별 중립 광고가 시장 비용 비대칭을 거쳐 여성에게 노출이 적어져 차별이 발생하는 4단계 메커니즘을 보여주는 그림\">\n  <!-- ━━━━━ 상단: 통념 vs 진짜 (콤팩트) ━━━━━ -->\n  <!-- 좌: 일반 통념 -->\n  <g transform=\"translate(20, 25)\">\n    <text x=\"125\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">일반 통념</text>\n    <rect x=\"0\" y=\"0\" width=\"250\" height=\"135\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- biased data (red dots) -->\n    <g transform=\"translate(45, 65)\">\n      <rect x=\"-25\" y=\"-22\" width=\"50\" height=\"44\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <g fill=\"#c8102e\">\n        <circle cx=\"-13\" cy=\"-10\" r=\"2.2\"/>\n        <circle cx=\"-3\" cy=\"-13\" r=\"2.2\"/>\n        <circle cx=\"10\" cy=\"-9\" r=\"2.2\"/>\n        <circle cx=\"-15\" cy=\"3\" r=\"2.2\"/>\n        <circle cx=\"-1\" cy=\"0\" r=\"2.2\"/>\n        <circle cx=\"13\" cy=\"4\" r=\"2.2\"/>\n        <circle cx=\"-8\" cy=\"13\" r=\"2.2\"/>\n        <circle cx=\"6\" cy=\"13\" r=\"2.2\"/>\n      </g>\n      <text x=\"0\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">biased data</text>\n    </g>\n\n    <!-- arrow -->\n    <line x1=\"78\" y1=\"65\" x2=\"100\" y2=\"65\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <polygon points=\"100,65 92,61 92,69\" fill=\"#1a1a1a\"/>\n\n    <!-- AI -->\n    <g transform=\"translate(125, 65)\">\n      <rect x=\"-22\" y=\"-15\" width=\"44\" height=\"30\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">AI</text>\n    </g>\n\n    <!-- arrow -->\n    <line x1=\"150\" y1=\"65\" x2=\"172\" y2=\"65\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <polygon points=\"172,65 164,61 164,69\" fill=\"#1a1a1a\"/>\n\n    <!-- biased result -->\n    <g transform=\"translate(200, 65)\">\n      <rect x=\"-25\" y=\"-22\" width=\"50\" height=\"44\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <g fill=\"#c8102e\">\n        <circle cx=\"-12\" cy=\"-8\" r=\"2.2\"/>\n        <circle cx=\"2\" cy=\"-10\" r=\"2.2\"/>\n        <circle cx=\"13\" cy=\"-3\" r=\"2.2\"/>\n        <circle cx=\"-8\" cy=\"6\" r=\"2.2\"/>\n        <circle cx=\"9\" cy=\"11\" r=\"2.2\"/>\n      </g>\n      <text x=\"0\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">biased result</text>\n    </g>\n\n    <text x=\"125\" y=\"106\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">\"데이터만 고치면 해결?\"</text>\n    <text x=\"125\" y=\"123\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">conventional view</text>\n  </g>\n\n  <!-- 가운데 but -->\n  <text x=\"297\" y=\"92\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">but</text>\n\n  <!-- 우: 진짜 — 깨끗한 데이터에서도 -->\n  <g transform=\"translate(320, 25)\">\n    <text x=\"130\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">진짜 — 깨끗한 데이터에서도</text>\n    <rect x=\"0\" y=\"0\" width=\"260\" height=\"135\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n\n    <!-- unbiased data (green dots) -->\n    <g transform=\"translate(45, 65)\">\n      <rect x=\"-25\" y=\"-22\" width=\"50\" height=\"44\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <g fill=\"#1FA34A\">\n        <circle cx=\"-13\" cy=\"-10\" r=\"2.2\"/>\n        <circle cx=\"0\" cy=\"-10\" r=\"2.2\"/>\n        <circle cx=\"13\" cy=\"-10\" r=\"2.2\"/>\n        <circle cx=\"-13\" cy=\"0\" r=\"2.2\"/>\n        <circle cx=\"0\" cy=\"0\" r=\"2.2\"/>\n        <circle cx=\"13\" cy=\"0\" r=\"2.2\"/>\n        <circle cx=\"-13\" cy=\"10\" r=\"2.2\"/>\n        <circle cx=\"0\" cy=\"10\" r=\"2.2\"/>\n        <circle cx=\"13\" cy=\"10\" r=\"2.2\"/>\n      </g>\n      <text x=\"0\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">unbiased data</text>\n    </g>\n\n    <line x1=\"78\" y1=\"65\" x2=\"100\" y2=\"65\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <polygon points=\"100,65 92,61 92,69\" fill=\"#1a1a1a\"/>\n\n    <g transform=\"translate(125, 65)\">\n      <rect x=\"-22\" y=\"-15\" width=\"44\" height=\"30\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">AI</text>\n    </g>\n\n    <line x1=\"150\" y1=\"65\" x2=\"172\" y2=\"65\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <polygon points=\"172,65 164,61 164,69\" fill=\"#1a1a1a\"/>\n\n    <!-- biased result (반전!) -->\n    <g transform=\"translate(200, 65)\">\n      <rect x=\"-25\" y=\"-22\" width=\"50\" height=\"44\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/>\n      <g fill=\"#c8102e\">\n        <circle cx=\"-12\" cy=\"-8\" r=\"2.2\"/>\n        <circle cx=\"2\" cy=\"-10\" r=\"2.2\"/>\n        <circle cx=\"13\" cy=\"-3\" r=\"2.2\"/>\n        <circle cx=\"-8\" cy=\"6\" r=\"2.2\"/>\n        <circle cx=\"9\" cy=\"11\" r=\"2.2\"/>\n      </g>\n      <text x=\"0\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">biased result</text>\n    </g>\n    <!-- ?! 표시 -->\n    <text x=\"244\" y=\"42\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"20\" font-weight=\"700\" fill=\"#c8102e\">?!</text>\n\n    <text x=\"130\" y=\"106\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">데이터는 깨끗한데 결과는 편향</text>\n    <text x=\"130\" y=\"123\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">bias still emerges</text>\n  </g>\n\n  <!-- ━━━━━ 하단: 왜? 메커니즘 — Lambrecht & Tucker ━━━━━ -->\n  <text x=\"300\" y=\"178\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">how it happens — Lambrecht &amp; Tucker (gender-neutral ad)</text>\n\n  <g transform=\"translate(20, 188)\">\n    <rect x=\"0\" y=\"0\" width=\"560\" height=\"68\" fill=\"#f0faf3\" fill-opacity=\"0.2\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n  </g>\n\n  <!-- Step 1: gender-neutral ad -->\n  <g transform=\"translate(30, 196)\">\n    <rect x=\"0\" y=\"0\" width=\"120\" height=\"50\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"60\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">gender-neutral</text>\n    <text x=\"60\" y=\"29\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">ad</text>\n    <text x=\"60\" y=\"44\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">성별 중립 광고</text>\n  </g>\n\n  <!-- arrow 1 -->\n  <line x1=\"155\" y1=\"221\" x2=\"178\" y2=\"221\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n  <polygon points=\"178,221 170,217 170,225\" fill=\"#1a1a1a\"/>\n\n  <!-- Step 2: cost asymmetry -->\n  <g transform=\"translate(183, 196)\">\n    <rect x=\"0\" y=\"0\" width=\"125\" height=\"50\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <text x=\"62\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">women = prized demo</text>\n    <text x=\"62\" y=\"27\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">$$$ more expensive</text>\n    <text x=\"62\" y=\"43\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">여성 = 핵심 인구 · 비용↑</text>\n  </g>\n\n  <!-- arrow 2 + 메커니즘 라벨 -->\n  <line x1=\"313\" y1=\"221\" x2=\"336\" y2=\"221\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n  <polygon points=\"336,221 328,217 328,225\" fill=\"#1a1a1a\"/>\n  <text x=\"325\" y=\"212\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">algorithm</text>\n  <text x=\"325\" y=\"236\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">picks cheaper</text>\n\n  <!-- Step 3: fewer ads to women -->\n  <g transform=\"translate(341, 196)\">\n    <rect x=\"0\" y=\"0\" width=\"125\" height=\"50\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <text x=\"62\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">fewer ads</text>\n    <text x=\"62\" y=\"29\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">shown to women</text>\n    <text x=\"62\" y=\"44\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">여성 노출 적음</text>\n  </g>\n\n  <!-- arrow 3 -->\n  <line x1=\"471\" y1=\"221\" x2=\"494\" y2=\"221\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n  <polygon points=\"494,221 485,216 485,226\" fill=\"#c8102e\"/>\n\n  <!-- Step 4: discrimination -->\n  <g transform=\"translate(499, 196)\">\n    <rect x=\"0\" y=\"0\" width=\"65\" height=\"50\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/>\n    <text x=\"32\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">bias</text>\n    <text x=\"32\" y=\"29\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">emerges</text>\n    <text x=\"32\" y=\"44\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">편향 발생</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"278\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">ironic: data is fair, but the market is not — bias enters anyway</text>\n</svg>", "caption": "통념(편향 데이터 → 편향) ↔ 진짜(깨끗한 데이터에서도 편향 발생)"}, {"no": "4", "title": "The Elusive Common Cold Cure", "ktitle": "감기 치료제는 왜 아직 없나 (아연 가설)", "field": "의학·과학", "page": "p60 no.03", "oneline": "감기는 흔하고 결근·생산성 저하로 경제적 비용도 크다.", "tldr": ["감기는 흔하고 결근·생산성 저하로 경제적 비용도 크다.", "오래 치료제를 찾았지만 ‘왜 걸리는지(취약성)’ 메커니즘은 불분명.", "아연이 바이러스 복제를 억제해 증상·기간을 줄일 수 있다는 추측 → 연구 중."], "analogy": "가장 흔한 병인데도 ‘왜 누구는 잘 걸리는지’ 정확한 이유를 아직 몰라요. 아연은 (걸리는 것 자체를 막기보다) 바이러스 ‘복사’를 억제해 증상·기간을 줄일 수 있다는 가설로 연구 중이죠.", "bg": "분야는 의학·과학이에요. 감기(common cold)가 얼마나 흔하고 경제적 비용이 큰지가 배경. → 이렇게 흔한 병의 ‘치료법’이 왜 아직 잡히지 않는지에 주목하며 읽으세요.", "flow": [{"kind": "문제", "t": "감기 = 매우 흔하고 경제적 비용도 큼"}, {"kind": "난제", "t": "치료제 오래 추구 but ‘취약성 메커니즘’ 불분명"}, {"kind": "단서", "t": "아연 결핍 = 면역 손상 / 단 모두가 결핍은 아님"}, {"kind": "가설", "t": "아연이 바이러스 ‘복제’ 억제 → 증상·기간↓"}, {"kind": "현재", "t": "아연 캔디·시럽 연구 중"}], "quiz": [["감기 치료제가 아직 없는 핵심 이유는?", "사람이 감기에 ‘왜 취약한지(걸리는지)’의 메커니즘이 여전히 불분명하기 때문이에요."], ["아연이 감기에 도움이 될 수 있다는 가설은?", "아연이 바이러스 복제를 억제해 증상의 심각도와 지속 기간을 줄일 수 있다는 거예요."], ["핵심 한 문장?", "감기는 취약성 메커니즘이 불분명해 치료제가 없지만, 아연이 바이러스 복제를 억제할 가능성이 연구되고 있다."]], "vocab": [["common cold", "일반 감기"], ["nuisance", "불편함·성가신 것"], ["hypothesis", "가설"], ["vulnerability", "취약성"], ["deficiency", "결핍"], ["impair", "손상하다"], ["replication", "복제"]], "en": "The common cold, one of our most common illnesses, affects American adults 2 to 4 times per year and children 6 to 10 times per year. Colds are even more frequent in young children in day care settings and preschools. Because of missed work and decreased productivity, colds can be economically costly as well as a physical nuisance. A cure for the common cold would be of great benefit, and scientists have long pursued this goal. Although scientists have suggested several hypotheses, the mechanism underlying a person's vulnerability to contracting a cold remains unclear. Zinc deficiency is known to impair immune function, but could all these people have been zinc deficient? This is doubtful. Some speculate that zinc can reduce the severity and duration of cold symptoms by inhibiting viral replication. This is why products such as zinc lozenges and zinc syrups are under investigation.", "ko": "가장 흔한 질병의 하나인 일반 감기는 미국 성인을 1년에 2회에서 4회 걸리게 하고, 어린이를 6회에서 10회 걸리게 한다. 감기는 보육 시설이나 유치원에 다니는 어린아이들에게 훨씬 더 자주 발생한다. 결근과 생산성의 저하로 인해, 감기는 신체적 불편함뿐 아니라 경제적으로도 비용이 많이 들 수 있다. 감기를 치료할 수 있다면 큰 도움이 될 것이며, 과학자들은 오랫동안 이 목표를 추구해 왔다. 과학자들이 여러 가설을 제시해 왔지만, 사람이 감기에 걸리는 것에 대한 취약성에 내재하는 메커니즘은 여전히 불분명하다. 아연 결핍이 면역 기능을 손상하는 것으로 알려졌지만, 이 모든 사람이 아연 결핍 상태였을까? 이것은 의심스럽다. 일부 사람들은 아연이 바이러스 복제를 억제함으로써 감기의 증상의 심각도와 지속 기간을 줄일 수 있다고 추측한다. 이러한 이유로 아연 캔디나 아연 시럽과 같은 제품이 연구되고 있는 것이다.", "read": [{"en": "The common cold, one of our most common illnesses, affects American adults 2 to 4 times per year and children 6 to 10 times per year.", "ko": "가장 흔한 질병의 하나인 일반 감기는 미국 성인을 1년에 2회에서 4회 걸리게 하고, 어린이를 6회에서 10회 걸리게 한다.", "chunks": [["The common cold,", "일반 감기는,"], ["one of our most common illnesses,", "가장 흔한 질병 중 하나인,"], ["affects American adults 2 to 4 times per year", "미국 성인을 1년에 2회에서 4회 걸리게 하고"], ["and children 6 to 10 times per year.", "어린이를 1년에 6회에서 10회."]]}, {"en": "Colds are even more frequent in young children in day care settings and preschools.", "ko": "감기는 보육 시설이나 유치원에 다니는 어린아이들에게 훨씬 더 자주 발생한다.", "chunks": [["Colds are even more frequent", "감기는 훨씬 더 자주 발생한다"], ["in young children in day care settings and preschools.", "보육 시설이나 유치원에 다니는 어린아이들에게."]]}, {"en": "Because of missed work and decreased productivity, colds can be economically costly as well as a physical nuisance.", "ko": "결근과 생산성의 저하로 인해, 감기는 신체적 불편함뿐 아니라 경제적으로도 비용이 많이 들 수 있다.", "chunks": [["Because of missed work and decreased productivity,", "결근과 생산성 저하로 인해,"], ["colds can be economically costly", "감기는 경제적으로 비용이 많이 들 수 있다"], ["as well as a physical nuisance.", "신체적 불편함뿐만 아니라."]]}, {"en": "A cure for the common cold would be of great benefit, and scientists have long pursued this goal.", "ko": "감기를 치료할 수 있다면 큰 도움이 될 것이며, 과학자들은 오랫동안 이 목표를 추구해 왔다.", "chunks": [["A cure for the common cold", "일반 감기에 대한 치료법은"], ["would be of great benefit,", "큰 도움이 될 것이다,"], ["and scientists have long pursued", "그리고 과학자들은 오랫동안 ~을 추구해 왔다"], ["this goal.", "이 목표를."]]}, {"en": "Although scientists have suggested several hypotheses, the mechanism underlying a person's vulnerability to contracting a cold remains unclear.", "ko": "과학자들이 여러 가설을 제시해 왔지만, 사람이 감기에 걸리는 것에 대한 취약성에 내재하는 메커니즘은 여전히 불분명하다.", "chunks": [["Although scientists have suggested several hypotheses,", "과학자들이 여러 가설을 제시해 왔지만,"], ["the mechanism underlying", "~의 기저에 있는 메커니즘은"], ["a person's vulnerability to contracting a cold", "사람이 감기에 걸리는 것에 대한 취약성"], ["remains unclear.", "여전히 불분명하다."]]}, {"en": "Zinc deficiency is known to impair immune function, but could all these people have been zinc deficient?", "ko": "아연 결핍이 면역 기능을 손상하는 것으로 알려졌지만, 이 모든 사람이 아연 결핍 상태였을까?", "chunks": [["Zinc deficiency is known to impair", "아연 결핍은 ~을 손상하는 것으로 알려져 있다"], ["immune function,", "면역 기능을,"], ["but could all these people have been", "그러나 이 모든 사람이 ~이었을까?"], ["zinc deficient?", "아연 결핍 상태?"]]}, {"en": "This is doubtful.", "ko": "이것은 의심스럽다.", "chunks": [["This is doubtful.", "이것은 의심스럽다."]]}, {"en": "Some speculate that zinc can reduce the severity and duration of cold symptoms by inhibiting viral replication.", "ko": "일부 사람들은 아연이 바이러스 복제를 억제함으로써 감기 증상의 심각도와 지속 기간을 줄일 수 있다고 추측한다.", "chunks": [["Some speculate that", "일부는 ~라고 추측한다"], ["zinc can reduce", "아연이 ~을 줄일 수 있다"], ["the severity and duration of cold symptoms", "감기 증상의 심각도와 지속 기간"], ["by inhibiting viral replication.", "바이러스 복제를 억제함으로써."]]}, {"en": "This is why products such as zinc lozenges and zinc syrups are under investigation.", "ko": "이러한 이유로 아연 캔디나 아연 시럽과 같은 제품이 연구되고 있는 것이다.", "chunks": [["This is why", "이러한 이유로"], ["products such as zinc lozenges and zinc syrups", "아연 캔디나 아연 시럽과 같은 제품이"], ["are under investigation.", "연구되고 있는 것이다."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"중앙 상단에 감기 미스터리 박스가 있고 하단에 아연 결핍 가설은 의심으로 갈라지고 아연이 바이러스 복제를 억제한다는 가설은 연구 중으로 갈라지는 두 갈래 가설 분기 그림\">\n  <!-- 중앙 상단: 감기 미스터리 -->\n  <g transform=\"translate(220, 18)\">\n    <rect x=\"0\" y=\"0\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.8\"/>\n    <text x=\"80\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"14\" font-weight=\"700\" text-anchor= -family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">가설 ② 아연 → 바이러스 복제 억제</text>\n    <rect x=\"0\" y=\"6\" width=\"280\" height=\"115\" fill=\"#f0faf3\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n\n    <!-- 아연 -->\n    <g transform=\"translate(25, 30)\">\n      <rect x=\"0\" y=\"0\" width=\"46\" height=\"60\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"23\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">Zinc</text>\n      <!-- 높은 막대 -->\n      <rect x=\"10\" y=\"6\" width=\"26\" height=\"52\" fill=\"#1FA34A\" fill-opacity=\"0.5\"/>\n      <text x=\"23\" y=\"74\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\">충분</text>\n    </g>\n\n    <line x1=\"80\" y1=\"60\" x2=\"105\" y2=\"60\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <polygon points=\"105,60 99,57 99,63\" fill=\"#1FA34A\"/>\n\n    <!-- 바이러스 복제 차단 -->\n    <g transform=\"translate(110, 30)\">\n      <rect x=\"0\" y=\"0\" width=\"80\" height=\"60\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <!-- 바이러스 (간단한 점들) + X -->\n      <g transform=\"translate(40, 30)\">\n        <circle cx=\"-12\" cy=\"0\" r=\"3\" fill=\"#1FA34A\" fill-opacity=\"0.4\"/>\n        <circle cx=\"-2\" cy=\"-5\" r=\"3\" fill=\"#1FA34A\" fill-opacity=\"0.4\"/>\n        <circle cx=\"8\" cy=\"2\" r=\"3\" fill=\"#1FA34A\" fill-opacity=\"0.4\"/>\n        <line x1=\"-18\" y1=\"-12\" x2=\"14\" y2=\"12\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n        <line x1=\"14\" y1=\"-12\" x2=\"-18\" y2=\"12\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      </g>\n      <text x=\"40\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">replication blocked</text>\n    </g>\n\n    <!-- 점선 — under research -->\n    <g transform=\"tr "자유 놀이"], ["navigation", "길 찾기·항해"], ["wayfinding", "길 찾기"], ["roam", "돌아다니다·배회하다"], ["sense of direction", "방향 감각"], ["spatial cognition", "공간 인지"], ["explorer", "탐험가"]], "en": "'Free play' teaches an awareness of space and the confidence to move about in it, important skills that are fundamental to navigation and wayfinding. Research shows that children who are allowed to roam free have a better sense of their surroundings, and a better sense of direction. This may explain why people who grow up in rural areas tend to be better navigators than those who grow up in cities. One study found that nine-year-olds who regularly cycle around their home towns are able to sketch them in greater detail than those who don't. This suggests an advanced level of spatial cognition for their age. Others have shown that eleven-year-olds who make their own way to school can draw more accurate maps of their local area than their peers who are accompanied by an adult or travel by car. This is the difference between active and passive learning: children who are driven everywhere never get the opportunity to make their own decisions or draw their own maps. They cease being explorers.", "ko": "'자유 놀이'는 공간 인식과 그 안에서 움직일 수 있는 자신감을 가르치는데, 위치 탐색과 길 찾기의 기본적인 중요한 기술이다. 연구는 자유롭게 돌아다니는 것이 허용되는 아이들은 주변 환경에 대한 더 좋은 감각과 더 나은 방향 감각을 가진다는 것을 보여준다. 이는 시골에서 자란 사람들이 도시에서 자란 사람들보다 길을 더 잘 찾는 경향이 있는 이유를 설명할 수도 있다. 한 연구는 자주 자전거를 타고 자신이 사는 시내를 돌아다니는 9세 어린이가 그러지 않는 어린이들보다 그곳을 더 자세하게 그릴 수 있다는 것을 알아냈다. 이는 그들의 나이에 비해 뛰어난 공간 인지 능력을 시사한다. 또 다른 연구는 스스로 통학하는 11세 어린이가 성인이 동행하거나 자동차로 이동하는 또래보다 자신이 사는 지역의 지도를 더 정확하게 그릴 수 있음을 보여주었다. 이것이 능동적 학습과 수동적 학습의 차이인데, 어디든 차로 이동하는 아이들은 그들 스스로 결정을 내리거나 그들 자신의 지도를 그릴 기회를 한 번도 갖지 못한다. 그들은 탐험가가 되기를 멈춘다.", "read": [{"en": "'Free play' teaches an awareness of space and the confidence to move about in it, important skills that are fundamental to navigation and wayfinding.", "ko": "'자유 놀이'는 공간 인식과 그 안에서 움직일 수 있는 자신감을 가르치는데, 위치 탐색과 길 찾기의 기본적인 중요한 기술이다.", "chunks": [["'Free play' teaches", nchor=\"middle\" fill=\"#c8102e\">passive learning — driven everywhere</text>\n\n  <!-- 좌 하단: 차 안 아이 -->\n  <g transform=\"translate(20, 175)\">\n    <rect x=\"0\" y=\"0\" width=\"210\" height=\"100\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n    <!-- 차 그림 -->\n    <g transform=\"translate(105, 60)\">\n      <!-- 차 외곽 -->\n      <path d=\"M -50 0 L -42 -20 L -28 -28 L 28 -28 L 42 -20 L 50 0 L 50 12 L -50 12 Z\" \n            fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 창문 -->\n      <path d=\"M -36 -6 L -28 -23 L 28 -23 L 36 -6 Z\" fill=\"#fdf2f4\" fill-opacity=\"0.5\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 안에 작은 아이 (수동) -->\n      <g transform=\"translate(0, -14)\">\n        <circle cx=\"0\" cy=\"-2\" r=\"5\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n        <circle cx=\"-1.5\" cy=\"-3\" r=\"0.6\" fill=\"#c8102e\"/>\n        <circle cx=\"1.5\" cy=\"-3\" r=\"0.6\" fill=\"#c8102e\"/>\n        <line x1=\"0\" y1=\"3\" x2=\"0\" y2=\"8\" stroke=\"#c8102e\" stroke-width=\"1.1\"/>\n      </g>\n      <!-- 바퀴 -->\n      <circle cx=\"-30\" cy=\"14\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"30\" cy=\"14\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    </g>\n    <text x=\"105\" y=\"93\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">no own decisions · driven everywhere</text>\n  </g>\n\n  <!-- 가운데 화살표 -->\n  <g transform=\"translate(240, 225)\">\n    <line x1=\"0\" y1=\"0\" x2=\"50\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"/>\n    <polygon points=\"50,0 41,-4 41,4\" fill=\"#c8102e\"/>\n    <text x=\"25\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">limited</text>\n  </g>\n\n  <!-- 우 하단: 흐릿한/빈 지도 -->\n  <g transform=\"translate(305, 175)\">\n    <rect x=\"0\" y=\"0\" width=\"275\" height=\"100\" fill=\"#fdf2f4\" fill-opacity=\"0.2\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n    <g transform=\"translate(15, 10)\">\n      <rect x=\"0\" y=\"0\" width=\"245\" height=\"80\" fill=\"#ffffff\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/>\n      <g stroke=\"#ccc\" stroke-width=\"0.8\" stroke-dasharray=\"2 2\" fill=\"none\">\n        <line x1=\"0\" y1=\"27\" x2=\"245\" y2=\"27\"/>\n        <line x1=\"0\" y1=\"54\" x2=\"245\" y2=\"54\"/>\n        <line x1=\"65\" y1=\"0\" x2=\"65\" y2=\"80\"/>\n        <line x1=\"150\" y1=\"0\" x2=\"150\" y2=\"80\"/>\n      </g>\n      <!-- 흐릿한 ? 표시 -->\n      <text x=\"120\" y=\"50\" font-family=\"Noto Serif\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\" opacity=\"0.45\">?</text>\n    </g>\n    <text x=\"137\" y=\"93\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">vague map · cease being explorers</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"287\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">active explorers — detailed maps · passive passengers — cease to explore</text>\n</svg>", "caption": "자유 놀이(자전거·자가 통학) → 정확한 동네 지도 능력"}]};
/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>

\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">엄격 테스트</text>\n    <text x=\"67\" y=\"50\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">designed · tested</text>\n  </g>\n  <!-- 차단 표시: ①→② 화살표 끊기 (픽토폰트 대신 도형 슬래시) -->\n  <line x1=\"368\" y1=\"104\" x2=\"448\" y2=\"124\" stroke=\"#1FA34A\" stroke-width=\"1.6\" stroke-dasharray=\"3 2\"/>\n  <g stroke=\"#1FA34A\" stroke-width=\"2.4\" fill=\"none\">\n    <line x1=\"346\" y1=\"118\" x2=\"360\" y2=\"100\"/>\n    <line x1=\"354\" y1=\"121\" x2=\"368\" y2=\"103\"/>\n  </g>\n  <text x=\"450\" y=\"80\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">→ 편향·불신 방지</text>\n  <!-- LAPD 주석 -->\n  <text x=\"215\" y=\"270\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">예: LAPD — 흑인·라틴계 공동체 과잉 표적 → 불평등 강화</text>\n</svg>", "caption": "가운데 편향된 과거 데이터에서 AI 예측, 소수 공동체 표적, 체포 기록 누적으로 다시 데이터로 돌아오는 빨강 악순환 고리가 있고, 오른쪽에 신중 설계와 엄격 테스트라는 초록 차단 장치가 고리를 끊는 그림"}, {"no": "7", "title": "The Oceans — Food Source and Waste Repository", "ktitle": "바다 — 식량원이자 쓰레기 저장소", "field": "환경·해양", "page": "11강 Ex.07", "oneline": "바다는 식량원이자 쓰레기 저장소 두 기능을 하는데, 둘 다 한계에 도달하고 있다.", "tldr": ["바다는 식량원이자 쓰레기 저장소 역할을 한다.", "두 기능 모두 한계에 도달하고 있다.", "바다의 수용력은 무한하지 않다."], "analogy": "", "bg": "분야는 환경·해양이에요. 바다가 ‘식량원’이자 ‘쓰레기 저장소’ 두 기능을 동시에 한다는 것이 핵심. → 두 기능 모두 어떤 한계에 부딪히는지에 주목하며 읽으세요.", "flow": [{"kind": "기능 ①", "t": "식량원"}, {"kind": "기능 ②", "t": "쓰레기 저장소"}, {"kind": "문제", "t": "두 기능 모두 한계"}, {"kind": "결론", "t": "바다 수용력의 유한함"}], "quiz": [["바다의 두 기능은?", "식량원과 쓰레기 저장소예요 — 둘 다 한계에 부딪혀요."]], "vocab": [["fishing method", "어획 방법"], ["efficient", "효율적인"], ["deplete", "고갈시키다·격감시키다"], ["fish stocks", "수산 자원·어족 자원"], ["marine organism", "해양 생물"], ["agriculture", "농업·경작"], ["farm the land", "육지를 경작하다"], ["untapped", "미개발의·이용되지 않은"], ["food resource", "식량 자원"], ["repository", "저장소·보관소"], ["infinite", "무한한"], ["absorb", "흡수하다"], ["pollutant", "오염 물질"], ["incidence", "발생률·빈도"], ["toxic plankton bloom", "유독성 플랑크톤 대발생"], ["undesirable", "바람직하지 않은"], ["operate", "작동하다·운영되다"]], "en": "We use the oceans as a source of food. However, present fishing methods have become so efficient that we have dangerously depleted fish stocks over large parts of the ocean. We are only just beginning to develop the technology to grow marine organisms as agriculture in the same way as we farm the land. Indeed, this is probably the last major untapped food resource on the planet. At the same time, we use the oceans as a repository for our waste, often assuming the oceans are so large that they have an infinite capacity to absorb our pollutants. Yet, it is clear from the increased incidence of toxic plankton blooms and other undesirable effects that this is not true. For all these reasons, it is important that we study the oceans and understand how they operate.", "ko": "우리는 바다를 식량의 원천으로 사용한다. 하지만 현재의 어획 방법은 매우 효율화되어서 우리는 바다의 광범위한 지역에서 수산 자원을 위험할 정도로 고갈시켰다. 우리는 육지를 경작하듯이 해양 생물을 농업 형태로 기르는 기술을 이제 막 개발하기 시작하고 있다. 실제로 이것이 아마 지구상에 있는 마지막 주요 미개발 식량 자원일 것이다. 동시에 우리는 바다를 우리의 쓰레기 저장소로 사용하면서, 많은 경우 바다는 매우 커서 우리의 오염 물질을 흡수할 수 있는 무한한 용량을 가진다고 가정한다. 하지만 유독성 플랑크톤 대발생과 다른 바람직하지 않은 결과의 발생률 증가로 보아 이것이 사실이 아님은 분명하다. 이 모든 이유로 우리는 바다를 연구하고 그 작동 방식을 이해하는 것이 중요하다.", "read": [{"en": "We use the oceans as a source of food.", "ko": "우리는 바다를 식량의 원천으로 사용한다.", "chunks": [["We use the oceans", "우리는 바다를 사용한다"], ["as a source of food.", "식량의 원천으로."]]}, {"en": "However, present fishing methods have become so efficient that we have dangerously depleted fish stocks over large parts of the ocean.", "ko": "하지만 현재의 어획 방법은 매우 효율화되어서 우리는 바다의 광범위한 지역에서 수산 자원을 위험할 정도로 고갈시켰다.", "chunks": [["However, present fishing methods have become", "하지만 현재의 어획 방법은 ~이 되었다"], ["so efficient that", "매우 효율적이어서"], ["we have dangerously depleted", "우리가 위험할 정도로 고갈시켰다"], ["fish stocks over large parts of the ocean.", "바다의 광범위한 지역에서 수산 자원을."]]}, {"en": "We are only just beginning to develop the technology to grow marine organisms as agriculture in the same way as we farm the land.", "ko": "우리는 육지를 경작하듯이 해양 생물을 농업 형태로 기르는 기술을 이제 막 개발하기 시작하고 있다.", "chunks": [["We are only just beginning", "우리는 이제 막 시작하고 있다"], ["to develop the technology", "기술을 개발하기"], ["to grow marine organisms as agriculture", "해양 생물을 농업 형태로 기르는"], ["in the same way as we farm the land.", "우리가 육지를 경작하는 것과 똑같은 방식으로."]]}, {"en": "Indeed, this is probably the last major untapped food resource on the planet.", "ko": "실제로 이것이 아마 지구상에 있는 마지막 주요 미개발 식량 자원일 것이다.", "chunks": [["Indeed,", "실제로,"], ["this is probably", "이것이 아마 ~일 것이다"], ["the last major untapped food resource", "마지막 주요 미개발 식량 자원"], ["on the planet.", "지구상에 있는."]]}, {"en": "At the same time, we use the oceans as a repository for our waste, often assuming the oceans are so large that they have an infinite capacity to absorb our pollutants.", "ko": "동시에 우리는 바다를 우리의 쓰레기 저장소로 사용하면서, 많은 경우 바다는 매우 커서 우리의 오염 물질을 흡수할 수 있는 무한한 용량을 가진다고 가정한다.", "chunks": [["At the same time,", "동시에,"], ["we use the oceans as a repository for our waste,", "우리는 바다를 우리의 쓰레기 저장소로 사용한다,"], ["often assuming", "많은 경우 ~이라고 가정하면서"], ["the oceans are so large that", "바다는 매우 커서"], ["they have an infinite capacity", "무한한 용량을 가진다"], ["to absorb our pollutants.", "우리의 오염 물질을 흡수할."]]}, {"en": "Yet, it is clear from the increased incidence of toxic plankton blooms and other undesirable effects that this is not true.", "ko": "하지만 유독성 플랑크톤 대발생과 다른 바람직하지 않은 결과의 발생률 증가로 보아 이것이 사실이 아님은 분명하다.", "chunks": [["Yet, it is clear", "하지만 ~은 분명하다"], ["from the increased incidence of toxic plankton blooms", "유독성 플랑크톤 대발생의 증가로 보아"], ["and other undesirable effects", "그리고 다른 바람직하지 않은 결과의"], ["that this is not true.", "이것이 사실이 아님은."]]}, {"en": "For all these reasons, it is important that we study the oceans and understand how they operate.", "ko": "이 모든 이유로 우리는 바다를 연구하고 그 작동 방식을 이해하는 것이 중요하다.", "chunks": [["For all these reasons,", "이 모든 이유로,"], ["it is important that", "~이 중요하다"], ["we study the oceans", "우리가 바다를 연구하고"], ["and understand how they operate.", "그리고 그 작동 방식을 이해하는 것이."]]}], "metaphor": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"가운데 바다에서 왼쪽 식량원 기능은 어획으로 자원이 고갈되고 양식은 이제 시작이며, 오른쪽 쓰레기 저장소 기능은 무한 흡수 가정이 유독성 플랑크톤으로 반증되어 두 기능 모두 한계임을 보여주는 그림\">\n  <!-- 중앙 바다 -->\n  <g transform=\"translate(255,95)\">\n    <ellipse cx=\"45\" cy=\"30\" rx=\"68\" ry=\"40\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <g stroke=\"#999\" stroke-width=\"0.9\" fill=\"none\"><path d=\"M 12 22 Q 24 18 36 22\"/><path d=\"M 54 28 Q 66 24 78 28\"/><path d=\"M 24 40 Q 36 36 48 40\"/></g>\n    <text x=\"45\" y=\"34\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">바다</text>\n    <text x=\"45\" y=\"48\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">two functions</text>\n  </g>\n  <!-- 좌 기능: 식량원 -->\n  <line x1=\"255\" y1=\"120\" x2=\"200\" y2=\"120\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/><polygon points=\"200,120 208,116 208,124\" fill=\"#1a1a1a\"/>\n  <text x=\"120\" y=\"34\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">① 식량원</text>\n  <g transform=\"translate(15,48)\">\n    <rect x=\"0\" y=\"0\" width=\"180\" height=\"40\" rx=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <text x=\"90\" y=\"17\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">어획 과효율 → 자원 고갈</text>\n    <text x=\"90\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#c8102e\">fish stocks depleted</text>\n  </g>\n  <g transform=\"translate(15,150)\">\n    <rect x=\"0\" y=\"0\" width=\"180\" height=\"40\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"90\" y=\"17\" font- 3\" fill=\"#c8102e\"/>\n  <line x1=\"450\" y1=\"120\" x2=\"450\" y2=\"88\" stroke=\"#1a1a1a\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"232\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">both functions are limited → we must study and understand the oceans</text>\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">두 기능 모두 한계 → 바다 연구·이해가 필수</text>\n</svg>", "caption": "가운데 바다에서 왼쪽 식량원 기능은 어획으로 자원이 고갈되고 양식은 이제 시작이며, 오른쪽 쓰레기 저장소 기능은 무한 흡수 가정이 유독성 플랑크톤으로 반증되어 두 기능 모두 한계임을 보여주는 그림"}, {"no": "8", "title": "Prepared Learning, Memes, and the Spread of Agriculture", "ktitle": "밈은 모방으로 퍼진다", "field": "인지·문화", "page": "11강 Ex.08", "oneline": "밈은 유용해서가 아니라 ‘모방’으로 퍼진다(농업 확산이 예증).", "tldr": ["밈은 반드시 유용해서 퍼지는 게 아니다.", "‘모방’ 자체가 확산의 동력이다.", "농업의 확산이 이를 예증한다."], "analogy": "", "bg": "분야는 인지·문화 진화예요. 핵심 — ‘밈(meme)’은 유용성이 아니라 ‘모방’으로 퍼진다는 것(농업 확산으로 예증). → 무엇이 밈의 확산을 좌우하는지에 주목하며 읽으세요.", "flow": [{"kind": "통념", "t": "밈 = 유용해서 확산"}, {"kind": "반론", "t": "모방으로 확산"}, {"kind": "예시", "t": "농업의 확산"}, {"kind": "결론", "t": "모방이 확산의 동력"}], "quiz": [["밈은 무엇으로 퍼지나요?", "유용성보다 ‘모방’으로 퍼져요(농업 확산이 예)."]], "vocab": [["at the very minimum", "최소한·아무리 적게 잡아도"], ["genetic evolution", "유전적 진화"], ["sense organs", "감각 기관"], ["developmental", "발달의·발달상의"], ["bias", "편향·성향"], ["prepared learning", "준비된 학습"], ["innately", "선천적으로·타고나게"], ["predisposed", "~하는 성향이 있는"], ["set about", "~하기 시작하다·착수하다"], ["imitate", "모방하다·따라 하다"], ["multiplication tables", "구구단"], ["replicate", "복제하다·재현하다"], ["host", "숙주"], ["meme", "밈·문화적 정보 단위"], ["beneficial", "유익한·이로운"], ["infectious", "전염성 있는"], ["fashionable", "유행하는·인기 있는"], ["be tied to", "~에 묶여 있다·구속되다"], ["vulnerable to", "~에 취약한"], ["endless toil", "끝없는 고된 노동"]], "en": "At the very minimum, genetic evolution has given all humans similarly programmed sense organs and brains, giving them a developmental bias called 'prepared learning'. This means that humans are innately prepared to learn certain behaviours and predisposed to avoid others. Humans are innately set up to see and hear things and then to set about imitating them. Thus, useful things like multiplication tables and less useful things like the crazy frog ring-tone are replicated and spread. Humans are the physical hosts needed for memes to spread. The meme does not need to be useful to the host. It does not even need to make sense or be beneficial. As an example, Blackmore argues that it was through infectious imitation, rather than an understanding of its long-term benefit, that agriculture became fashionable. Farming uses far more energy and time than hunting and gathering. Being tied to one location makes the farmer more vulnerable to drought, flood, disease or attack. So the farmer seems to have chosen a risky life of endless toil for no obvious benefit. Humans inherently learn some behaviours and avoid others, spreading memes not for usefulness but by copying others' actions or reactions, as shown in agriculture.", "ko": "최소한, 유전적 진화는 모든 인간에게 유사하게 프로그램된 감각 기관과 뇌를 부여하여, '준비된 학습'이라고 불리는 발달 편향을 제공했다. 이것은 인간이 특정 행동을 배우도록 선천적으로 준비되어 있고 다른 행동을 피하는 성향이 있다는 것을 의미한다. 인간은 선천적으로 사물을 보고 들은 다음, 그것들을 모방하기 시작하도록 설정되어 있다. 따라서 구구단과 같은 유용한 것들과 미친 개구리 벨소리와 같은 덜 유용한 것들이 복제되어 퍼진다. 인간은 밈이 퍼지는 데 필요한 물리적 숙주이다. 밈은 숙주에게 유용할 필요가 없다. 그것은 심지어 이치에 맞거나 유익할 필요도 없다. 예를 들어, Blackmore의 주장에 따르면, 농업이 유행하게 된 것은 장기적인 이점에 대한 이해보다는 바로 전염성 있는 모방을 통해서였다. 농업은 수렵과 채집보다 훨씬 더 많은 에너지와 시간을 사용한다. 한 장소에 묶여 있음으로써 농부는 가뭄, 홍수, 질병 또는 공격에 더 취약해진다. 따라서 농부는 명백한 이점 없이 끝없는 고된 노동의 위험한 삶을 선택한 것처럼 보인다. 인간은 선천적으로 어떤 행동들은 배우고 다른 행동들은 피하며, 농업에서 보이듯 유용성 때문이 아니라 다른 사람들의 행동이나 반응을 모방함으로써 밈을 퍼뜨린다.", "read": [{"en": "At the very minimum, genetic evolution has given all humans similarly programmed sense organs and brains, giving them a developmental bias called 'prepared learning'.", "ko": "최소한, 유전적 진화는 모든 인간에게 유사하게 프로그램된 감각 기관과 뇌를 부여하여, '준비된 학습'이라고 불리는 발달 편향을 제공했다.", "chunks": [["At the very minimum,", "최소한,"], ["genetic evolution has given all humans", "유전적 진화는 모든 인간에게 부여했다"], ["similarly programmed sense organs and brains,", "유사하게 프로그램된 감각 기관과 뇌를,"], ["giving them a developmental bias", "발달 편향을 제공하면서"], ["called 'prepared learning'.", "'준비된 학습'이라고 불리는."]]}, {"en": "This means that humans are innately prepared to learn certain behaviours and predisposed to avoid others.", "ko": "이것은 인간이 특정 행동을 배우도록 선천적으로 준비되어 있고 다른 행동을 피하는 성향이 있다는 것을 의미한다.", "chunks": [["This means that", "이것은 ~을 의미한다"], ["humans are innately prepared", "인간이 선천적으로 준비되어 있고"], ["to learn certain behaviours", "특정 행동을 배우도록"], ["and predisposed to avoid others.", "그리고 다른 행동을 피하는 성향이 있다는 것을."]]}, {"en": "Humans are innately set up to see and hear things and then to set about imitating them.", "ko": "인간은 선천적으로 사물을 보고 들은 다음, 그것들을 모방하기 시작하도록 설정되어 있다.", "chunks": [["Humans are innately set up", "인간은 선천적으로 설정되어 있다"], ["to see and hear things", "사물을 보고 듣고"], ["and then to set about imitating them.", "그리고 그것을 모방하기 시작하도록."]]}, {"en": "Thus, useful things like multiplication tables and less useful things like the crazy frog ring-tone are replicated and spread.", "ko": "따라서 구구단과 같은 유용한 것들과 미친 개구리 벨소리와 같은 덜 유용한 것들이 복제되어 퍼진다.", "chunks": [["Thus, useful things", "따라서 유용한 것들"], ["like multiplication tables", "구구단과 같은"], ["and less useful things", "그리고 덜 유용한 것들"], ["like the crazy frog ring-tone", "미친 개구리 벨소리와 같은"], ["are replicated and spread.", "복제되어 퍼진다."]]}, {"en": "Humans are the physical hosts needed for memes to spread.", "ko": "인간은 밈이 퍼지는 데 필요한 물리적 숙주이다.", "chunks": [["Humans are the physical hosts", "인간은 물리적 숙주이다"], ["needed for memes to spread.", "밈이 퍼지는 데 필요한."]]}, {"en": "The meme does not need to be useful to the host. It does not even need to make sense or be beneficial.", "ko": "밈은 숙주에게 유용할 필요가 없다. 그것은 심지어 이치에 맞거나 유익할 필요도 없다.", "chunks": [["The meme does not need to be useful", "밈은 유용할 필요가 없다"], ["to the host.", "숙주에게."], ["It does not even need", "그것은 심지어 ~할 필요도 없다"], ["to make sense or be beneficial.", "이치에 맞거나 유익할."]]}, {"en": "As an example, Blackmore argues that it was through infectious imitation, rather than an understanding of its long-term benefit, that agriculture became fashionable.", "ko": "예를 들어, Blackmore의 주장에 따르면, 농업이 유행하게 된 것은 장기적인 이점에 대한 이해보다는 바로 전염성 있는 모방을 통해서였다.", "chunks": [["As an example,", "예를 들어,"], ["Blackmore argues that", "Blackmore는 ~라고 주장한다"], ["it was through infectious imitation,", "바로 전염성 있는 모방을 통해서였다"], ["rather than an understanding of its long-term benefit,", "장기적인 이점에 대한 이해보다는,"], ["that agriculture became fashionable.", "농업이 유행하게 된 것은."]]}, {"en": "Farming uses far more energy and time than hunting and gathering.", "ko": "농업은 수렵과 채집보다 훨씬 더 많은 에너지와 시간을 사용한다.", "chunks": [["Farming uses far more energy and time", "농업은 훨씬 더 많은 에너지와 시간을 사용한다"], ["than hunting and gathering.", "수렵과 채집보다."]]}, {"en": "Being tied to one location makes the farmer more vulnerable to drought, flood, disease or attack.", "ko": "한 장소에 묶여 있음으로써 농부는 가뭄, 홍수, 질병 또는 공격에 더 취약해진다.", "chunks": [["Being tied to one location", "한 장소에 묶여 있음으로써"], ["makes the farmer more vulnerable", "농부를 더 취약하게 만든다"], ["to drought, flood, disease or attack.", "가뭄, 홍수, 질병 또는 공격에."]]}, {"en": "So the farmer seems to have chosen a risky life of endless toil for no obvious benefit.", "ko": "따라서 농부는 명백한 이점 없이 끝없는 고된 노동의 위험한 삶을 선택한 것처럼 보인다.", "chunks": [["So the farmer seems", "따라서 농부는 ~인 것처럼 보인다"], ["to have chosen a risky life", "위험한 삶을 선택한 것"], ["of endless toil", "끝없는 고된 노동의"], ["for no obvious benefit.", "명백한 이점 없이."]]}, {"en": "Humans inherently learn some behaviours and avoid others, spreading memes not for usefulness but by copying others' actions or reactions, as shown in agriculture.", "ko": "인간은 선천적으로 어떤 행동들은 배우고 다른 행동들은 피하며, 농업에서 보이듯 유용성 때문이 아니라 다른 사람들의 행동이나 반응을 모방함으로써 밈을 퍼뜨린다.", "chunks": [["Humans inherently learn some behaviours", "인간은 선천적으로 어떤 행동들은 배우고"], ["and avoid others,", "다른 행동들은 피하며,"], ["spreading memes", "밈을 퍼뜨린다"], ["not for usefulness", "유용성 때문이 아니라"], ["but by copying others' actions or reactions,", "다른 사람들의 행동이나 반응을 모방함으로써,"], ["as shown in agriculture.", "농업에서 보이듯이."]]}], "metaphor": "<svg viewBox=\"0 0 600 272\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽은 인간 숙주에서 유용한 곱셈표와 무용한 벨소리가 똑같이 모방으로 복제 확산되어 유용성과 무관함을 보여주고, 오른쪽은 비효율적인 농업이 그럼에도 전염성 모방으로 유행한 사례를 보여주는 그림\">\n  <!-- 좌 패널: 모방 확산 (유용성 무관) -->\n  <g transform=\"translate(20,40)\">\n    <rect x=\"0\" y=\"0\" width=\"320\" height=\"172\" rx=\"7\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.2\"/>\n    <text x=\"160\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">확산 동력 = 모방 (유용성과 무관)</text>\n    <!-- 숙주 인간 -->\n    <g transform=\"translate(45,90)\">\n      <circle cx=\"0\" cy=\"0\" r=\"12\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-2\" r=\"1.3\" fill=\"#1a1a1a\"/><circle cx=\"4\" cy=\"-2\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <path d=\"M -4 4 Q 0 7 4 4\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"12\" x2=\"0\" y2=\"38\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"20\" x2=\"-11\" y2=\"28\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"20\" x2=\"11\" y2=\"28\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"38\" x2=\"-8\" y2=\"54\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"38\" x2=\"8\" y2=\"54\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"70\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">인간 = 숙주</text>\n    </g>\n    <!-- 전염성 모방 확산 화살표 -->\n    <g stroke=\"#1FA34A\" stroke-width=\"1.4\" fill=\"none\">\n      <path d=\"M 62 75 Q 110 55 150 52\"/><path d=\"M 62 90 Q 120 90 160 105\"/><path d=\"M 62 105 Q 110 125 150 140\"/>\n    </g>\n    <polygon points=\"150,52 142,50 145,57\" fill=\"#1FA34A\"/><polygon points=\"160,105 152,102 153,110\" fill=\"#1FA34A\"/><polygon points=\"150,140 143,135 141,143\" fill=\"#1FA34A\"/>\n    <!-- 유용 밈 -->\n    <g transform=\"translate(160,40)\">\n      <rect x=\"0\" y=\"0\" width=\"140\" height=\"32\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <g transform=\"translate(16,16)\"><circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#fff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/><path d=\"M -3.5 0 L -1 3 L 4 -3\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/></g>\n      <text x=\"86\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">곱셈표 (유용)</text>\n      <text x=\"86\" y=\"26\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">replicated</text>\n    </g>\n    <!-- 무용 밈 -->\n    <g transform=\"translate(160,124)\">\n      <rect x=\"0\" y=\"0\" width=\"140\" height=\"32\" rx=\"5\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.3\"/>\n      <g transform=\"translate(16,16)\"><circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.2\"/><path d=\"M -3.5 0 L -1 3 L 4 -3\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.5\"/></g>\n      <text x=\"86\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5e5e5e\">벨소리 (무용)</text>\n      <text x=\"86\" y=\"26\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#999\">replicated too</text>\n    </g>\n    <text x=\"160\" y=\"100\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">both spread equally</text>\n  </g>\n  <!-- 우 패널: 농업 사례 -->\n  <g transform=\"translate(355,40)\">\n    <rect x=\"0\" y=\"0\" width=\"225\" height=\"172\" rx=\"7\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"112\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">예: 농업</text>\n    <!-- 비용 (빨강) -->\n    <g transform=\"translate(20,32)\">\n      <rect x=\"0\" y=\"0\" width=\"185\" height=\"56\" rx=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"92\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">비효율 — 에너지·시간 ↑</text>\n      <text x=\"92\" y=\"34\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">재해·공격에 취약</text>\n      <text x=\"92\" y=\"49\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#c8102e\">more energy &amp; time than foraging</text>\n    </g>\n    <!-- 그래도 유행 (초록) -->\n    <g transform=\"translate(112,98)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"16\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/><polygon points=\"0,16 -4,9 4,9\" fill=\"#1FA34A\"/></g>\n    <g transform=\"translate(20,116)\">\n      <rect x=\"0\" y=\"0\" width=\"185\" height=\"40\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"92\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">그래도 전염성 모방으로 유행</text>\n      <text x=\"92\" y=\"33\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">spread by infectious imitation</text>\n    </g>\n  </g>\n  <!-- 하단 -->\n  <text x=\"300\" y=\"258\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">spread not for usefulness, but by copying</text>\n</svg>", "caption": "왼쪽은 인간 숙주에서 유용한 곱셈표와 무용한 벨소리가 똑같이 모방으로 복제 확산되어 유용성과 무관함을 보여주고, 오른쪽은 비효율적인 농업이 그럼에도 전염성 모방으로 유행한 사례를 보여주는 그림"}, {"no": "9", "title": "Censorship in Ancient Greek History", "ktitle": "고대 그리스의 검열", "field": "역사·윤리", "page": "11강 Ex.09", "oneline": "고대 그리스 검열은 ‘공동선’을 명분으로 내세웠지만 실체는 가혹한 억압이었다.", "tldr": ["고대 그리스 검열은 ‘공동선’을 명분으로 삼았다.", "그러나 실제로는 가혹한 억압이었다.", "명분과 실체 사이에 괴리가 있다."], "analogy": "", "bg": "분야는 역사·윤리예요. 고대 그리스 ‘검열(censorship)’이 ‘공동선’을 명분으로 내세웠다는 점이 핵심. → 그 명분 뒤의 가혹한 억압 실체에 주목하며 읽으세요.", "flow": [{"kind": "명분", "t": "공동선(common good)"}, {"kind": "실체", "t": "가혹한 억압"}, {"kind": "대비", "t": "명분 vs 실체"}, {"kind": "결론", "t": "명분 뒤의 억압"}], "quiz": [["그리스 검열의 명분과 실체는?", "명분은 ‘공동선’, 실체는 가혹한 억압이었어요."]], "vocab": [["censorship", "검열"], ["authority", "권력 기관·당국"], ["practise", "시행하다·실행하다"], ["in the name of", "~의 명목으로"], ["heresy", "이단"], ["treason", "반역"], ["ideological error", "이념적 오류"], ["universally", "보편적으로"], ["impiety", "불경죄·불경"], ["charge", "죄목·혐의"], ["city state", "도시 국가"], ["invoke", "불러일으키다·자아내다"], ["divine", "신성한·신의"], ["impious", "불경한·신성 모독적인"], ["rigid", "엄격한·경직된"], ["militarism", "군국주의"], ["ban", "금지하다"], ["tyrant", "참주·폭군"], ["silence", "침묵시키다·잠재우다"], ["opponent", "반대자·정적"]], "en": "Censorship is a means of preventing the expression of ideas, speech, or behaviour. Social, religious, political, military, and other authorities practise censorship in the name of the common good of society, seeking to protect it from heresy, treason, or ideological error. In one form or another, censorship has existed universally throughout Greek history. Most of the censorship among the ancient Greeks occurred over religious and political ideas. The common charge was impiety (asebeia). Since they believed that the gods could actively help or harm the city state, impious behaviour that might invoke divine anger was punished. Sparta imposed a rigid system of censorship to protect its militarism: books, music, and even learned men were banned. Greek tyrants exercised censorship to silence and eliminate their opponents. Generally speaking, under the tyrants, and many other rulers, censorship was identical with harsh repression.", "ko": "검열은 사상, 언론 또는 행동의 표현을 막는 수단이다. 사회, 종교, 정치, 군사 및 기타의 권력 기관들은 사회의 공동선이라는 명목으로 검열을 시행하여, 사회를 이단, 반역, 혹은 이념적 오류로부터 보호하고자 한다. 어떤 형태로든 검열은 그리스 역사 전반에 걸쳐 보편적으로 존재해 왔다. 고대 그리스인들 사이에서 대부분의 검열은 종교적 및 정치적 사상에 대해 이루어졌다. 일반적인 죄목은 불경죄(아세베이아)였다. 그들은 신들이 도시 국가를 적극적으로 돕거나 해칠 수 있다고 믿었기 때문에, 신의 분노를 불러올 수도 있는 불경스러운 행동은 처벌되었다. 스파르타는 그들의 군국주의를 보호하기 위해 엄격한 검열 제도를 부과했고, 곧 책, 음악, 심지어 학식 있는 사람들까지 금지되었다. 그리스의 참주는 자신의 반대자들을 침묵시키고 제거하기 위해 검열을 시행했다. 일반적으로 말해서, 참주와 많은 다른 통치자들 치하에서 검열은 가혹한 억압과 동일했다.", "read": [{"en": "Censorship is a means of preventing the expression of ideas, speech, or behaviour.", "ko": "검열은 사상, 언론 또는 행동의 표현을 막는 수단이다.", "chunks": [["Censorship is a means of", "검열은 ~의 수단이다"], ["preventing the expression", "표현을 막는"], ["of ideas, speech, or behaviour.", "사상, 언론, 또는 행동의."]]}, {"en": "Social, religious, political, military, and other authorities practise censorship in the name of the common good of society, seeking to protect it from heresy, treason, or ideological error.", "ko": "사회, 종교, 정치, 군사 및 기타의 권력 기관들은 사회의 공동선이라는 명목으로 검열을 시행하여, 사회를 이단, 반역, 혹은 이념적 오류로부터 보호하고자 한다.", "chunks": [["Social, religious, political, military, and other authorities", "사회, 종교, 정치, 군사 및 기타의 권력 기관들은"], ["practise censorship", "검열을 시행한다"], ["in the name of the common good of society,", "사회의 공동선이라는 명목으로,"], ["seeking to protect it", "사회를 보호하고자 하면서"], ["from heresy, treason,", "이단, 반역,"], ["or ideological error.", "혹은 이념적 오류로부터."]]}, {"en": "In one form or another, censorship has existed universally throughout Greek history.", "ko": "어떤 형태로든 검열은 그리스 역사 전반에 걸쳐 보편적으로 존재해 왔다.", "chunks": [["In one form or another,", "어떤 형태로든,"], ["censorship has existed universally", "검열은 보편적으로 존재해 왔다"], ["throughout Greek history.", "그리스 역사 전반에 걸쳐."]]}, {"en": "Most of the censorship among the ancient Greeks occurred over religious and political ideas.", "ko": "고대 그리스인들 사이에서 대부분의 검열은 종교적 및 정치적 사상에 대해 이루어졌다.", "chunks": [["Most of the censorship", "대부분의 검열은"], ["among the ancient Greeks", "고대 그리스인들 사이에서"], ["occurred over", "~에 대해 이루어졌다"], ["religious and political ideas.", "종교적 및 정치적 사상."]]}, {"en": "The common charge was impiety (asebeia).", "ko": "일반적인 죄목은 불경죄(아세베이아)였다.", "chunks": [["The common charge was", "일반적인 죄목은 ~이었다"], ["impiety (asebeia).", "불경죄(아세베이아)."]]}, {"en": "Since they believed that the gods could actively help or harm the city state, impious behaviour that might invoke divine anger was punished.", "ko": "그들은 신들이 도시 국가를 적극적으로 돕거나 해칠 수 있다고 믿었기 때문에, 신의 분노를 불러올 수도 있는 불경스러운 행동은 처벌되었다.", "chunks": [["Since they believed that", "그들은 ~라고 믿었기 때문에"], ["the gods could actively help or harm the city state,", "신들이 도시 국가를 적극적으로 돕거나 해칠 수 있다고,"], ["impious behaviour", "불경스러운 행동은"], ["that might invoke divine anger", "신의 분노를 불러올 수도 있는"], ["was punished.", "처벌되었다."]]}, {"en": "Sparta imposed a rigid system of censorship to protect its militarism: books, music, and even learned men were banned.", "ko": "스파르타는 그들의 군국주의를 보호하기 위해 엄격한 검열 제도를 부과했고, 곧 책, 음악, 심지어 학식 있는 사람들까지 금지되었다.", "chunks": [["Sparta imposed", "스파르타는 부과했다"], ["a rigid system of censorship", "엄격한 검열 제도를"], ["to protect its militarism:", "그들의 군국주의를 보호하기 위해:"], ["books, music, and even learned men", "책, 음악, 그리고 심지어 학식 있는 사람들까지"], ["were banned.", "금지되었다."]]}, {"en": "Greek tyrants exercised censorship to silence and eliminate their opponents.", "ko": "그리스의 참주는 자신의 반대자들을 침묵시키고 제거하기 위해 검열을 시행했다.", "chunks": [["Greek tyrants exercised censorship", "그리스의 참주는 검열을 시행했다"], ["to silence and eliminate their opponents.", "자신의 반대자들을 침묵시키고 제거하기 위해."]]}, {"en": "Generally speaking, under the tyrants, and many other rulers, censorship was identical with harsh repression.", "ko": "일반적으로 말해서, 참주와 많은 다른 통치자들 치하에서 검열은 가혹한 억압과 동일했다.", "chunks": [["Generally speaking,", "일반적으로 말해서,"], ["under the tyrants,", "참주 치하에서,"], ["and many other rulers,", "그리고 다른 많은 통치자들 치하에서,"], ["censorship was identical with", "검열은 ~과 동일했다"], ["harsh repression.", "가혹한 억압."]]}], "metaphor": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 화자의 표현이 가운데 검열 장벽에 막히는데, 장벽 앞면에는 공동선이라는 명분이 회색으로 붙어 있고 그 실체는 빨강 가혹한 억압이며, 오른쪽에 스파르타와 78)\">검 열</text>\n  </g>\n  <!-- 막힘 표시 -->\n  <g transform=\"translate(176,110)\"><circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"#fff\" stroke=\"#c8102e\" stroke-width=\"1.6\"/><line x1=\"-4\" y1=\"-4\" x2=\"4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"1.7\"/><line x1=\"4\" y1=\"-4\" x2=\"-4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"1.7\"/></g>\n  <!-- 명분 라벨 (회색, 앞면) -->\n  <g transform=\"translate(150,200)\">\n    <rect x=\"0\" y=\"0\" width=\"140\" height=\"26\" rx=\"4\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"1.3\"/>\n    <text x=\"70\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5e5e5e\">명분: 공동선 (common good)</text>\n  </g>\n  <!-- 실체 (빨강) -->\n  <text x=\"320\" y=\"40\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">실체 = 가혹한 억압</text>\n  <g transform=\"translate(300,55)\">\n    <rect x=\"0\" y=\"0\" width=\"285\" height=\"44\" rx=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    <text x=\"12\" y=\"19\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" fill=\"#c8102e\">사례① 스파르타</text>\n    <text x=\"12\" y=\"34\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#c8102e\">군국주의 보호 → 책·음악·학자 금지</text>\n  </g>\n  <g transform=\"translate(300,108)\">\n    <rect x=\"0\" y=\"0\" width=\"285\" height=\"44\" rx=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    <text x=\"12\" y=\"19\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" fill=\"#c8102e\">사례② 참주 (tyrants)</text>\n    <text x=\"12\" y=\"34\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#c8102e\">반대자 침묵·제거</text>\n  </g>\n  <text x=\"442\" y=\"172\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">종교·정치 사상 집중 · 불경죄(asebeia)가 일반 죄목</text>\n  <!-- 하단 -->\n  <text x=\"300\" y=\"250\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">a 'common good' banner hides harsh repression</text>\n</svg>", "caption": "왼쪽 화자의 표현이 가운데 검열 장벽에 막히는데, 장벽 앞면에는 공동선이라는 명분이 회색으로 붙어 있고 그 실체는 빨강 가혹한 억압이며, 오른쪽에 스파르타와 참주 두 사례가 제시된 그림"}, {"no": "10", "title": "C. P. Snow and the Two Cultures — Science and the Humanities", "ktitle": "C. P. Snow의 두 문화", "field": "학문·문화", "page": "11강 Ex.10", "oneline": "C. P. Snow의 ‘두 문화’ — 단절된 과학과 인문학은 서로 협력해야 한다.", "tldr": ["C. P. Snow는 과학과 인문학을 ‘두 문화’로 보았다.", "둘은 서로 단절되어 있다.", "두 문화의 협력이 필요하다."], "analogy": "", "bg": "분야는 학문·문화론이에요. 핵심 개념 — C. P. Snow의 ‘두 문화(two cultures)’: 과학과 인문학의 단절. → 두 문화가 왜 협력해야 하는지에 주목하며 읽으세요.", "flow": [{"kind": "개념", "t": "두 문화(과학·인문학)"}, {"kind": "문제", "t": "서로 단절"}, {"kind": "주장", "t": "협력이 필요"}, {"kind": "결론", "t": "두 문화의 통합"}], "quiz": [["‘두 문화’란?", "C. P. Snow가 말한 과학과 인문학의 단절이에요 — 협력이 필요하죠."]], "vocab": [["curiously", "흥미롭게도"], ["trendy", "유행하는·인기 있는"], ["popular belief", "대중적인 믿음"], ["scientific knowledge", "과학적 지식"], ["at odds with", "~과 상충하는·맞지 않는"], ["cultured", "교양 있는"], ["central to", "~의 핵심인·중심적인"], ["deliver a lecture", "강연을 하다"], ["animosity", "적대감"], ["two cultures", "두 문화 (과학·인문학)"], ["humanities", "인문학"], ["hold up", "방해하다·지체시키다"], ["narrow", "좁아지다·좁히다"], ["philistinism", "속물근성·문화 무지"], ["appreciation", "이해·감상"], ["make the most of", "~을 최대한 활용하다"], ["mourn", "애도하다·슬퍼하다"], ["poetically", "시적으로"], ["deep regret", "깊은 후회"], ["invoke", "환기하다·불러일으키다"]], "en": "Curiously, it became rather trendy in the late 20th century to claim to know nothing about science or mathematics. There was a popular belief that scientific knowledge was somehow at odds with being a cultured individual, when in fact it is central to it. In 1959, the English scientist and novelist C. P. Snow delivered a famous lecture in which he spoke of the distance and even animosity that existed between the 'two cultures' of science and the arts, or humanities. This deep division in intellectual life was, he felt, holding up human progress. The divide remained, and even increased, in the following decades. It might now be narrowing, but it's far from closed. More people, though, now recognize that knowing about science is not a mark of philistinism, but the very opposite. An informed appreciation of the world around us, the laws it follows and how we can discover those laws, puts us in the best position to make the most of our individual lives and the resources the planet affords us as a species. The loss of wild places was mourned poetically by 19th-century writers such as Wordsworth or Thoreau and demonstrated a need to find out how to renew and protect the environment. But this deep regret for what humans have done to the world, invoked through the arts, can be used in helpful action through the application of science and understanding.", "ko": "흥미롭게도, 20세기 후반에는 과학이나 수학에 대해 아무 것도 모른다고 주장하는 것이 꽤 유행처럼 되었다. 사실은 그것이 교양 있는 개인이라는 것의 핵심이지만 과학적 지식이 교양 있는 개인이라는 것과 왠지 상충한다는 대중적인 믿음이 있었다. 1959년에 영국의 과학자이자 소설가인 C. P. Snow는 과학과 인문학(the arts, 즉 humanities)이라는 '두 문화' 사이에 존재하는 거리감과 심지어 적대감에 대해 이야기하는 유명한 강연을 했다. 그가 느끼기에, 지적인 삶에서의 이러한 깊은 분열이 인간의 진보를 방해하고 있었다. 그 분열은 다음 수십 년 동안 남아 있었고, 심지어 증가했다. 이제는 좁혀지고 있을지도 모르지만, 완전히 없어진 것은 결코 아니다. 그러나 이제는 더 많은 사람들이 과학에 대해 아는 것이 속물성의 표시가 아니라 정반대라는 것을 인식한다. 우리 주변 세상, 그것이 따르는 법칙들, 그리고 우리가 그러한 법칙들을 어떻게 발견할 수 있는지에 대한 깊이 있게 아는 이해를 통해, 우리는 각자의 삶, 그리고 지구가 하나의 종으로서의 우리에게 제공하는 자원을 최대한 활용할 수 있는 최상의 위치에 놓이게 된다. 야생 지역의 상실은 Wordsworth와 Thoreau와 같은 19세기 작가들에 의해 시적으로 애도되었고 환경을 되살리고 보호할 방법을 찾아야 할 필요성을 보여 주었다. 그러나 인간이 세상에 저지른 일에 대한 이러한 깊은 후회는, 인문학을 통해 환기되는데, 과학과 이해의 적용을 통해 도움이 되는 행동으로 쓰일 수 있다.", "read": [{"en": "Curiously, it became rather trendy in the late 20th century to claim to know nothing about science or mathematics.", "ko": "흥미롭게도, 20세기 후반에는 과학이나 수학에 대해 아무 것도 모른다고 주장하는 것이 꽤 유행처럼 되었다.", "chunks": [["Curiously,", "흥미롭게도,"], ["it became rather trendy", "꽤 유행처럼 되었다"], ["in the late 20th century", "20세기 후반에는"], ["to claim to know nothing", "아무 것도 모른다고 주장하는 것이"], ["about science or mathematics.", "과학이나 수학에 대해."]]}, {"en": "There was a popular belief that scientific knowledge was somehow at odds with being a cultured individual, when in fact it is central to it.", "ko": "사실은 그것이 교양 있는 개인이라는 것의 핵심이지만 과학적 지식이 교양 있는 개인이라는 것과 왠지 상충한다는 대중적인 믿음이 있었다.", "chunks": [["There was a popular belief that", "~라는 대중적인 믿음이 있었다"], ["scientific knowledge was", "과학적 지식이"], ["somehow at odds with", "왠지 ~과 상충한다는"], ["being a cultured individual,", "교양 있는 개인이라는 것과,"], ["when in fact it is central to it.", "사실은 그것이 그것의 핵심이지만."]]}, {"en": "In 1959, the English scientist and novelist C. P. Snow delivered a famous lecture in which he spoke of the distance and even animosity that existed between the 'two cultures' of science and the arts, or humanities.", "ko": "1959년에 영국의 과학자이자 소설가인 C. P. Snow는 과학과 인문학(the arts, 즉 humanities)이라는 '두 문화' 사이에 존재하는 거리감과 심지어 적대감에 대해 이야기하는 유명한 강연을 했다.", "chunks": [["In 1959,", "1959년에,"], ["the English scientist and novelist C. P. Snow", "영국의 과학자이자 소설가인 C. P. Snow는"], ["delivered a famous lecture", "유명한 강연을 했다"], ["in which he spoke of", "그 강연에서 그는 ~에 대해 이야기했다"], ["the distance and even animosity", "거리감과 심지어 적대감"], ["that existed between", "~ 사이에 존재하는"], ["the 'two cultures' of science and the arts,", "과학과 인문학(the arts)이라는 '두 문화',"], ["or humanities.", "즉 humanities."]]}, {"en": "This deep division in intellectual life was, he felt, holding up human progress.", "ko": "그가 느끼기에, 지적인 삶에서의 이러한 깊은 분열이 인간의 진보를 방해하고 있었다.", "chunks": [["This deep division", "이러한 깊은 분열이"], ["in intellectual life was,", "지적인 삶에서,"], ["he felt,", "그가 느끼기에,"], ["holding up human progress.", "인간의 진보를 방해하고 있었다."]]}, {"en": "The divide remained, and even increased, in the following decades. It might now be narrowing, but it's far from closed.", "ko": "그 분열은 다음 수십 년 동안 남아 있었고, 심지어 증가했다. 이제는 좁혀지고 있을지도 모르지만, 완전히 없어진 것은 결코 아니다.", "chunks": [["The divide remained,", "그 분열은 남아 있었다,"], ["and even increased,", "그리고 심지어 증가했다,"], ["in the following decades.", "다음 수십 년 동안."], ["It might now be na /* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 영어독해연습 11강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   지문 이해 보조 자료 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-ipad">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 영어독해연습 11강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 영어독해연습 11강
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data": [{"no": "1", "title": "Defining the Boundaries of a Field", "ktitle": "분야 경계 정의의 함정", "field": "학문·인식", "page": "11강 Ex.01", "oneline": "한 분야의 경계를 정의하려는 시도는 좁게 긋든 넓게 긋든 위험해, 사실상 어리석은 목표일 수 있다.", "tldr": ["한 분야의 경계를 정의하려는 시도가 소재다.", "너무 좁게 그어도, 너무 넓게 그어도 문제가 생긴다.", "그래서 경계 정의는 ‘어리석은 목표’일 수 있다."], "analogy": "", "bg": "분야는 학문·인식론이에요. 핵심 — 한 분야의 ‘경계를 정의(define boundaries)’하는 일이 사실 어리석은 목표일 수 있다는 것. → 경계를 좁게 긋든 넓게 긋든 어떤 위험이 있는지에 주목하며 읽으세요.", "flow": [{"kind": "통념", "t": "분야는 경계를 명확히 해야 한다"}, {"kind": "문제 ①", "t": "너무 좁게 그으면 위험"}, {"kind": "문제 ②", "t": "너무 넓게 그어도 위험"}, {"kind": "결론", "t": "경계 정의는 무의미할 수 있다"}], "quiz": [["분야 경계를 정의하는 일의 문제는?", "좁게 긋든 넓게 긋든 양쪽 다 위험해 사실상 어려운(무의미한) 목표예요."]], "vocab": [["define the boundaries of", "~의 경계를 정의하다"], ["objective", "목표·목적"], ["foolish", "어리석은"], ["narrow definition", "좁은 정의"], ["exclude", "배제하다·제외하다"], ["absorb", "흡수하다·받아들이다"], ["irrelevant", "무관한·관련 없는"], ["scholar", "학자"], ["proceed", "진행하다·나아가다"], ["tactic", "전략·전술"], ["sociology of markets", "시장 사회학"], ["diffuse", "분산된·널리 퍼진"], ["draw a circle around", "~를 중심으로 원을 그리다·경계 짓다"], ["impose", "부과·강제하다"], ["theoretical", "이론적인"], ["presumably", "짐작건대·아마"], ["leave out", "제외하다·빠뜨리다"], ["relevance", "관련성"], ["audience", "청중·독자"], ["reduce A to B", "A를 B로 축소시키다"]], "en": "Defining the boundaries of a field is, perhaps, a foolish objective. A narrow definition risks excluding issues that should be included. Too broad a definition, on the other hand, risks absorbing research problems that are just too irrelevant. In either case, of course, scholars can choose to ignore your definition. There are several ways one can proceed. One tactic is to focus on which scholars define themselves in the field. The problem with this approach is that the field of the sociology of markets is sufficiently diffuse that there may be multiple communities of scholars with differing concerns contained within it. Even if one could draw a circle around the field, one would still not understand what its focus or questions were. The opposite strategy is to impose a theoretical definition of the field. This approach has the advantage of focusing on a theoretical perspective, presumably of interest to a wide number of scholars. But one is likely to leave out scholars and issues that are of relevance to the field. You may quickly reduce your audience to those who agree with you.", "ko": "한 분야의 경계를 정의하는 것은 어쩌면 어리석은 목표이다. 좁은 정의는 포함되어야 할 주제를 배제할 위험이 있다. 반면에 너무 광범위한 정의는 정말로 너무 무관한 연구 문제까지 흡수할 위험이 있다. 물론 둘 중 어느 경우든, 학자들은 여러분의 정의를 무시하기로 선택할 수 있다. 계속 진행할 수 있는 몇 가지 방법이 있다. 한 가지 전략은 어떤 학자가 자신이 그 분야에 속한다고 정의하는지에 초점을 맞추는 것이다. 이 접근 방식과 관련한 문제점은, 시장 사회학 분야가 충분히 분산되어 있어서 그 안에 서로 다른 관심사를 가진 여러 학자 집단이 존재할 수도 있다는 것이다. 그 분야를 중심으로 원을 그릴 수 있을지라도, 그것의 초점이나 논점이 무엇인지는 여전히 이해가 안 될 것이다. 반대의 전략은 해당 분야에 대한 이론적 정의를 강제하는 것이다. 이 접근 방식은 짐작건대 많은 학자들에게 흥미로운 이론적 관점에 초점을 맞춘다는 장점이 있다. 하지만 해당 분야와 관련성이 있는 학자와 주제를 배제할 가능성이 있다. 여러분의 청중이 여러분에게 동의하는 사람들로 빠르게 축소될 수도 있다.", "read": [{"en": "Defining the boundaries of a field is, perhaps, a foolish objective.", "ko": "한 분야의 경계를 정의하는 것은 어쩌면 어리석은 목표이다.", "chunks": [["Defining the boundaries of a field", "한 분야의 경계를 정의하는 것은"], ["is, perhaps,", "어쩌면 ~이다,"], ["a foolish objective.", "어리석은 목표."]]}, {"en": "A narrow definition risks excluding issues that should be included.", "ko": "좁은 정의는 포함되어야 할 주제를 배제할 위험이 있다.", "chunks": [["A narrow definition", "좁은 정의는"], ["risks excluding", "배제할 위험이 있다"], ["issues that should be included.", "포함되어야 할 주제들을."]]}, {"en": "Too broad a definition, on the other hand, risks absorbing research problems that are just too irrelevant.", "ko": "반면에 너무 광범위한 정의는 정말로 너무 무관한 연구 문제까지 흡수할 위험이 있다.", "chunks": [["Too broad a definition,", "너무 광범위한 정의는,"], ["on the other hand,", "반면에,"], ["risks absorbing", "흡수할 위험이 있다"], ["research problems", "연구 문제들을"], ["that are just too irrelevant.", "정말로 너무 무관한."]]}, {"en": "In either case, of course, scholars can choose to ignore your definition.", "ko": "물론 둘 중 어느 경우든, 학자들은 여러분의 정의를 무시하기로 선택할 수 있다.", "c 당 분야에 대한 이론적 정의를."]]}, {"en": "This approach has the advantage of focusing on a theoretical perspective, presumably of interest to a wide number of scholars.", "ko": "이 접근 방식은 짐작건대 많은 학자들에게 흥미로운 이론적 관점에 초점을 맞춘다는 장점이 있다.", "chunks": [["This approach has the advantage", "이 접근 방식은 장점이 있다"], ["of focusing on a theoretical perspective,", "이론적 관점에 초점을 맞춘다는,"], ["presumably of interest", "짐작건대 흥미로운"], ["to a wide number of scholars.", "많은 학자들에게."]]}, {"en": "But one is likely to leave out scholars and issues that are of relevance to the field.", "ko": "하지만 해당 분야와 관련성이 있는 학자와 주제를 배제할 가능성이 있다.", "chunks": [["But one is likely to leave out", "하지만 ~을 배제할 가능성이 있다"], ["scholars and issues", "학자와 주제들을"], ["that are of relevance to the field.", "해당 분야와 관련성이 있는."]]}, {"en": "You may quickly reduce your audience to those who agree with you.", "ko": "여러분의 청중이 여러분에게 동의하는 사람들로 빠르게 축소될 수도 있다.", "chunks": [["You may quickly reduce", "여러분은 빠르게 축소할 수도 있다"], ["your audience", "여러분의 청중을"], ["to those who agree with you.", "여러분에게 동의하는 사람들로."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"가운데 분야 경계 원에서 좁히면 포함할 주제가 밖으로 배제되고 넓히면 무관한 문제가 안으로 흡수되어 양쪽 모두 빨강으로 실패하며, 아래 두 전략도 실패해 어리석은 목표가 됨을 보여주는 그림\">\n  <!-- 중앙 경계 원 -->\n  <circle cx=\"300\" cy=\"88\" r=\"46\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n  <text x=\"300\" y=\"84\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">분야 경계</text>\n  <text x=\"300\" y=\"98\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">a field</text>\n  <!-- 좁히면 → 배제 (좌) -->\n  <text x=\"150\" y=\"40\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">좁히면</text>\n  <path d=\"M 256 80 Q 200 70 158 62\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n  <polygon points=\"158,62 166,62 162,68\" ly=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">전략① 자기 정의</text>\n    <text x=\"112\" y=\"33\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">→ 분야가 분산돼 무의미</text>\n  </g>\n  <g transform=\"translate(315,168)\">\n    <rect x=\"0\" y=\"0\" width=\"225\" height=\"42\" rx=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n    <text x=\"112\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">전략② 이론적 정의 강제</text>\n    <text x=\"112\" y=\"33\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">→ 관련 학자·주제까지 배제</text>\n  </g>\n  <!-- 결론 -->\n  <text x=\"300\" y=\"238\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">either way, scholars can ignore it → a foolish objective</text>\n  <text x=\"300\" y=\"256\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">어느 쪽이든 학자가 무시하면 그만 — 경계 정의는 어리석은 목표</text>\n</svg>", "caption": "가운데 분야 경계 원에서 좁히면 포함할 주제가 밖으로 배제되고 넓히면 무관한 문제가 안으로 흡수되어 양쪽 모두 빨강으로 실패하며, 아래 두 전략도 실패해 어리석은 목표가 됨을 보여주는 그림"}, {"no": "2", "title": "The Deep Ocean Is No Longer Out of Reach", "ktitle": "더 이상 멀지 않은 심해", "field": "환경·해양", "page": "11강 Ex.02", "oneline": "인간 손길 밖이라 여겨지던 심해가 이제는 더 이상 그렇지 않다.", "tldr": ["심해는 오랫동안 인간 손길 밖이라 여겨졌다.", "그러나 이제는 더 이상 그렇지 않다.", "인간 활동이 심해까지 닿고 있다."], "analogy": "", "bg": "분야는 환경·해양이에요. ‘심해(deep ocean)는 인간 손길 밖’이라는 통념이 배경. → 심해가 더 이상 그렇지 않게 된 현실에 주목하며 읽으세요.", "flow": [{"kind": "통념", "t": "심해 = 인간 손길 밖"}, {"kind": "반전", "t": "더 이상 그렇지 않다"}, {"kind": "전개", "t": "인간 활동이 심해에 도달"}, {"kind": "함의", "t": "심해도 위협에 노출"}], "quiz": [["심해에 대한 통념은?", "인간의 손길이 닿지 않는 곳이라는 거예요."], ["글이 말하는 현실은?", "이제 심해도 인간 영향 밖이 아니에요."]], "vocab": [["out of sight and out of mind", "보이지도 않고 마음에도 없는·관심 밖의"], ["deep ocean", "심해"], ["vast", "광활한·광대한"], ["substantially", "크게·상당히"], ["mistakenness", "잘못됨·오류"], ["coastal", "해안의·연안의"], ["use up", "다 써 버리다·고갈시키다"], ["fishery", "어장·수산업"], ["fossil hydrocarbon", "화석 탄화수소"], ["exploitation", "이용·개발·착취"], ["extract", "추출하다·뽑아내다"], ["mineral", "광물·미네랄"], ["biochemical", "생화학적인"], ["depletion", "고갈·소실"], ["acidification", "산성화"], ["carbon dioxide concentration", "이산화탄소 농도"], ["ecosystem", "생태계"], ["recover from", "~로부터 회복하다"]], "en": "For most people, the deep ocean is out of sight and out of mind. Not long ago, common (even academic) thinking was that the ocean was so vast that humans were not capable of changing it substantially. This was especially true for the deep sea away from coastal human concentrations. The mistakenness of this idea is becoming increasingly clear. As we use up coastal resources such as fisheries and fossil hydrocarbons, we have moved into increasingly deeper water to continue exploitation. Also, new methods are being developed for extracting from the deep ocean new resources, such as important minerals rare on the continents, or for exploiting unusual biochemical characteristics of deep-sea organisms. Meanwhile, as we explore, we are increasingly finding the results of human activities, including plastics and other pollution as well as temperature changes, oxygen depletion, and acidification from increasing carbon dioxide concentrations. We are also learning how very long it would take ecosystems of the deep ocean to recover from damages we may cause.", "ko": "대부분의 사람에게 심해는 보이지도 않고 마음에도 없다. 얼마 전까지만 해도, 일반인의 (심지어 학계의) 생각은 바다가 매우 광활하여 인간이 그것을 크게 변화시킬 수 없다는 것이었다. 이것은 해안의 인구 집중 지역에서 멀리 떨어진 심해의 경우에 특히 그러했다. 이러한 생각이 잘못되었음이 점점 더 분명해지고 있다. 우리가 어장과 화석 탄화수소와 같은 해안 자원을 고갈시킴에 따라, 우리는 이용을 계속하기 위해 점점 더 더욱 깊은 바다로 나아갔다. 또한 심해로부터 육지에서는 희귀한 주요 광물 같은 새로운 자원을 추출하거나, 심해 생물의 특이한 생화학적 특성을 이용하기 위한 새로운 방법들이 개발되고 있다. 그러는 사이에 우리는 탐사하면서 이산화탄소 농도 증가로 인한 온도 변화, 산소 고갈, 그리고 산성화뿐만 아니라 플라스틱 및 기타 오염물도 포함하여 인간 활동의 결과를 점점 더 많이 발견하고 있다. 우리는 또한 우리가 초래할 수도 있는 손상으로부터 심해 생태계가 회복하는 데 정말로 얼마나 오랜 시간이 걸릴 것인지를 깨닫고 있다.", "read": [{"en": "For most people, the deep ocean is out of sight and out of mind.", "ko": "대부분의 사람에게 심해는 보이지도 않고 마음에도 없다.", "chunks": [["For most people,", "대부분의 사람에게,"], ["the deep ocean is", "심해는 ~이다"], ["out of sight and out of mind.", "보이지도 않고 마음에도 없는."]]}, {"en": "Not long ago, common (even academic) thinking was that the ocean was so vast that humans were not capable of changing it substantially.", "ko": "얼마 전까지만 해도, 일반인의 (심지어 학계의) 생각은 바다가 매우 광활하여 인간이 그것을 크게 변화시킬 수 없다는 것이었다.", "chunks": [["Not long ago,", "얼마 전까지만 해도,"], ["common (even academic) thinking was", "일반인의 (심지어 학계의) 생각은 ~이었다"], ["that the ocean was so vast", "바다가 매우 광활하여"], ["that humans were not capable of changing it", "인간이 그것을 변화시킬 수 없다는"], ["substantially.", "크게."]]}, {"en": "This was especially true for the deep sea away from coastal human concentrations.", "ko": "이것은 해안의 인구 집중 지역에서 멀리 떨어진 심해의 경우에 특히 그러했다.", "chunks": [["This was especially true", "이것은 특히 그러했다"], ["for the deep sea", "심해의 경우에"], ["away from coastal human concentrations.", "해안의 인구 집중 지역에서 멀리 떨어진."]]}, {"en": "The mistakenness of this idea is becoming increasingly clear.", "ko": "이러한 생각이 잘못되었음이 점점 더 분명해지고 있다.", "chunks": [["The mistakenness of this idea", "이러한 생각이 잘못되었음이"], ["is becoming increasingly clear.", "점점 더 분명해지고 있다."]]}, {"en": "As we use up coastal resources such as fisheries and fossil hydrocarbons, we have moved into increasingly deeper water to continue exploitation.", "ko": "우리가 어장과 화석 탄화수소와 같은 해안 자원을 고갈시킴에 따라, 우리는 이용을 계속하기 위해 점점 더 더욱 깊은 바다로 나아갔다.", "chunks": [["As we use up coastal resources", "우리가 해안 자원을 고갈시킴에 따라"], ["such as fisheries and fossil hydrocarbons,", "어장과 화석 탄화수소와 같은,"], ["we have moved into", "우리는 이동했다"], ["increasingly deeper water", "점점 더 깊은 바다로"], ["to continue exploitation.", "이용을 계속하기 위해."]]}, {"en": "Also, new methods are being developed for extracting from the deep ocean new resources, such as important minerals rare on the continents, or for exploiting unusual biochemical characteristics of deep-sea organisms.", "ko": "또한 심해로부터 육지에서는 희귀한 주요 광물 같은 새로운 자원을 추출하거나, 심해 생물의 특이한 생화학적 특성을 이용하기 위한 새로운 방법들이 개발되고 있다.", "chunks": [["Also, new methods are being developed", "또한 새로운 방법들이 개발되고 있다"], ["for extracting from the deep ocean", "심해로부터 추출하기 위한"], ["new resources,", "새로운 자원을,"], ["such as important minerals rare on the continents,", "육지에서 희귀한 주요 광물 같은,"], ["or for exploiting", "또는 이용하기 위해"], ["unusual biochemical characteristics of deep-sea organisms.", "심해 생물의 특이한 생화학적 특성을."]]}, {"en": "Meanwhile, as we explore, we are increasingly finding the results of human activities, including plastics and other pollution as well as temperature changes, oxygen depletion, and acidification from increasing carbon dioxide concentrations.", "ko": "그러는 사이에 우리는 탐사하면서 이산화탄소 농도 증가로 인한 온도 변화, 산소 고갈, 그리고 산성화뿐만 아니라 플라스틱 및 기타 오염물도 포함하여 인간 활동의 결과를 점점 더 많이 발견하고 있다.", "chunks": [["Meanwhile, as we explore,", "그러는 사이에, 우리는 탐사하면서,"], ["we are increasingly finding", "점점 더 많이 발견하고 있다"], ["the results of human activities,", "인간 활동의 결과를,"], ["including plastics and other pollution", "플라스틱 및 기타 오염물도 포함하여"], ["as well as temperature changes,", "온도 변화뿐만 아니라,"], ["oxygen depletion,", "산소 고갈,"], ["and acidification from increasing carbon dioxide concentrations.", "그리고 이산화탄소 농도 증가로 인한 산성화."]]}, {"en": "We are also learning how very long it would take ecosystems of the deep ocean to recover from damages we may cause.", "ko": "우리는 또한 우리가 초래할 수도 있는 손상으로부터 심해 생태계가 회복하는 데 정말로 얼마나 오랜 시간이 걸릴 것인지를 깨닫고 있다.", "chunks": [["We are also learning", "우리는 또한 깨닫고 있다"], ["how very long it would take", "얼마나 오랜 시간이 걸릴 것인지"], ["ecosystems of the deep ocean", "심해 생태계가"], ["to recover from damages", "손상으로부터 회복하는 데"], ["we may cause.", "우리가 초래할 수도 있는."]]}], "metaphor": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"바다 단면도. 왼쪽 과거는 인간 손이 닿지 않는 회색 심해, 오른쪽 현재는 해안 고갈과 새 기술로 인간이 심해로 진출해 플라스틱 온도 산소 산성화의 흔적을 남긴 모습을 빨강으로 표시\">\n  <!-- 수면 -->  fill=\"#c8102e\"/><text x=\"22\" y=\"3\" fill=\"#c8102e\">플라스틱</text></g>\n    <g transform=\"translate(470,135)\"><line x1=\"0\" y1=\"-10\" x2=\"0\" y2=\"7\" stroke=\"#c8102e\" stroke-width=\"1.5\"/><circle cx=\"0\" cy=\"9\" r=\"4.5\" fill=\"#c8102e\"/><path d=\"M 4 -10 l 5 -3 M 4 -5 l 5 -3\" stroke=\"#c8102e\" stroke-width=\"1.2\"/><text x=\"22\" y=\"4\" fill=\"#c8102e\">온도 변화 ↑</text></g>\n    <g transform=\"translate(470,172)\"><circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"#fff\" stroke=\"#c8102e\" stroke-width=\"1.3\"/><text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">O₂↓</text><text x=\"22\" y=\"3\" fill=\"#c8102e\">산소 고갈</text></g>\n    <g transform=\"translate(470,205)\"><circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"#fff\" stroke=\"#c8102e\" stroke-width=\"1.3\"/><text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">pH↓</text><text x=\"22\" y=\"3\" fill=\"#c8102e\">산성화</text></g>\n  </g>\n  <!-- 하단 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">already changing it — and recovery takes a very long time</text>\n</svg>", "caption": "바다 단면도. 왼쪽 과거는 인간 손이 닿지 않는 회색 심해, 오른쪽 현재는 해안 고갈과 새 기술로 인간이 심해로 진출해 플라스틱 온도 산소 산성화의 흔적을 남긴 모습을 빨강으로 표시"}, {"no": "3", "title": "Animal Feelings and Human Supremacy", "ktitle": "동물 감정과 인간 우월주의", "field": "윤리·동물", "page": "11강 Ex.03", "oneline": "동물 감정 인식은 생물학적 사실만이 아니라 사회적으로 구성되며, 인간 우월주의가 작용한다.", "tldr": ["동물의 감정 인식은 생물학적 사실만의 문제가 아니다.", "그것은 사회적으로 구성되는 면이 있다.", "인간 우월주의가 그 인식에 작용한다."], "analogy": "", "bg": "분야는 윤리·동물이에요. ‘동물의 감정 인식’이 단순 생물학적 사실인지, 사회적으로 구성되는지가 핵심. → 동물 감정에 대한 인식이 무엇에 좌우되는지에 주목하며 읽으세요.", "flow": [{"kind": "통념", "t": "동물 감정 = 생물학적 사실"}, {"kind": "반론", "t": "사회적으로 구성되기도 함"}, {"kind": "전개", "t": "인간 우월주의가 작용"}, {"kind": "결론", "t": "인식은 사실+사회 구성"}], "quiz": [["동물 감정 인식이 ‘사회적 구성’이라는 건?", "순수 생물학적 사실이 아니라 사회·인식 틀에 따라 달라진다는 거예요."]], "vocab": [["acknowledge", "인정하다·시인하다"], ["not necessarily", "반드시 ~은 아닌"], ["perceive", "인식하다·인지하다"], ["setting", "환경·맥락·상황"], ["research laboratory", "연구 실험실"], ["deprive A of B", "A에게서 B를 박탈하다"], ["legally and illegally", "합법·불법으로"], ["pandemic", "팬데믹·세계적 유행병"], ["buffer", "완충물·완화 장치"], ["emotional capacity", "감정 능력"], ["flow-on effect", "연동 효과·파급 효과"], ["wellbeing", "복지·안녕"], ["human-dominated", "인간이 지배하는"], ["contradictory", "상충하는·모순되는"], ["supremacy", "우월성·우위"], ["biological fact", "생물학적 사실"], ["social construct", "사회적 구성 개념"], ["dominant", "지배적인·우세한"]], "en": "Acknowledging that some animals can experience feelings ─ although not necessarily in a way that humans can understand ─ directly affects the way that different animals are perceived and treated in many settings, not just research laboratories. Animals are eaten, worn, deprived of their freedom and natural environments, legally and illegally sold, blamed for pandemics and used as a buffer to loneliness, to name just a few. In all these scenarios, the existence and extent of their emotional capacity is perceived differently both between and within species, with a direct flow-on effect on their life experiences and wellbeing in a human-dominated world. Questioning the basis for these at times contradictory perceptions of different species, or members of the same species in different environments, reveals the extent of human supremacy. It also reveals that perception of emotion in animals is not always driven by biological facts. In many cases, this perception is based on a social construct created and maintained by human beings as the more dominant animal. Human perceptions of animal emotions vary across species and contexts, shaping animals' wellbeing in ways that reveal human supremacy and reflect socially constructed beliefs rather than biological facts.", "ko": "비록 반드시 인간이 이해할 수 있는 방식으로는 아닐지라도 일부 동물이 감정을 경험할 수 있다는 것을 인정하는 것은 단지 연구 실험실뿐만이 아니라 다양한 환경에서 여러 동물이 인식되고 대우받는 방식에 직접적으로 영향을 미친다. 몇 개만 예를 들자면, 동물은 잡아먹히고, 착용되고, 자유와 자연 환경을 박탈당하고, 합법적으로 그리고 불법적으로 판매되며, 팬데믹의 원인으로 지목되고, 외로움에 대한 완충물로 사용된다. 이러한 모든 시나리오에서, 동물의 감정 능력의 존재와 정도는 종 간에 그리고 종 내에서도 다르게 인식되며, 인간이 지배하는 세상에서 동물의 삶의 경험과 복지에 직접적인 연동 효과를 미친다. 서로 다른 종의, 혹은 서로 다른 환경에 있는 같은 종 구성원에 대한 이러한 때로는 상충하는 인식의 근거를 따지는 것은 인간 우월성의 정도를 드러낸다. 그것은 또한 동물에게 있는 감정에 대한 인식이 항상 생물학적 사실에 의해 이끌리는 것은 아니라는 점을 드러낸다. 많은 경우, 이러한 인식은 더 지배적인 동물로서의 인간에 의해 창조되고 유지되는 사회적 구성 개념에 기초한다. 동물의 감정에 대한 인간의 인식은 종과 환경에 따라 다르며, 인간의 우월성을 드러내고 생물학적 사실보다는 사회적으로 구성된 생각을 반영하는 방식으로 동물의 복지에 영향을 미친다.", "read": [{"en": "Acknowledging that some animals can experience feelings ─ although not necessarily in a way that humans can understand ─ directly affects the way that different animals are perceived and treated in many settings, not just research laboratories.", "ko": "비록 반드시 인간이 이해할 수 있는 방식으로는 아닐지라도 일부 동물이 감정을 경험할 수 있다는 것을 인정하는 것은 단지 연구 실험실뿐만이 아니라 다양한 환경에서 여러 동물이 인식되고 대우받는 방식에 직접적으로 영향을 미친다.", "chunks": [["Acknowledging that some animals can experience feelings", "일부 동물이 감정을 경험할 수 있다는 것을 인정하는 것은"], ["─ although not necessarily in a way that humans can understand ─", "─ 비록 반드시 인간이 이해할 수 있는 방식으로는 아닐지라도 ─"], ["directly affects the way", "방식에 직접적으로 영향을 미친다"], ["that different animals are perceived and treated", "여러 동물이 인식되고 대우받는"], ["in many settings,", "다양한 환경에서,"], ["not just research laboratories.", "단지 연구 실험실뿐만이 아니라."]]}, {"en": "Animals are eaten, worn, deprived of their freedom and natural environments, legally and illegally sold, blamed for pandemics and used as a buffer to loneliness, to name just a few.", "ko": "몇 개만 예를 들자면, 동물은 잡아먹히고, 착용되고, 자유와 자연 환경을 박탈당하고, 합법적으로 그리고 불법적으로 판매되며, 팬데믹의 원인으로 지목되고, 외로움에 대한 완충물로 사용된다.", "chunks": [["Animals are eaten, worn,", "동물은 잡아먹히고, 착용되고,"], ["deprived of their freedom and natural environments,", "자유와 자연 환경을 박탈당하고,"], ["legally and illegally sold,", "합법적으로 그리고 불법적으로 판매되며,"], ["blamed for pandemics", "팬데믹의 원인으로 지목되고,"], ["and used as a buffer to loneliness,", "그리고 외로움에 대한 완충물로 사용된다,"], ["to name just a few.", "몇 개만 예를 들자면."]]}, {"en": "In all these scenarios, the existence and extent of their emotional capacity is perceived differently both between and within species, with a direct flow-on effect on their life experiences and wellbeing in a human-dominated world.", "ko": "이러한 모든 시나리오에서, 동물의 감정 능력의 존재와 정도는 종 간에 그리고 종 내에서도 다르게 인식되며, 인간이 지배하는 세상에서 동물의 삶의 경험과 복지에 직접적인 연동 효과를 미친다.", "chunks": [["In all these scenarios,", "이러한 모든 시나리오에서,"], ["the existence and extent of their emotional capacity", "동물의 감정 능력의 존재와 정도는"], ["is perceived differently", "다르게 인식된다"], ["both between and within species,", "종 간에 그리고 종 내에서도,"], ["with a direct flow-on effect", "직접적인 연동 효과를 미치며"], ["on their life experiences and wellbeing", "동물의 삶의 경험과 복지에"], ["in a human-dominated world.", "인간이 지배하는 세상에서."]]}, {"en": "Questioning the basis for these at times contradictory perceptions of different species, or members of the same species in different environments, reveals the extent of human supremacy.", "ko": "서로 다른 종의, 혹은 서로 다른 환경에 있는 같은 종 구성원에 대한 이러한 때로는 상충하는 인식의 근거를 따지는 것은 인간 우월성의 정도를 드러낸다.", "chunks": [["Questioning the basis for", "근거를 따지는 것은"], ["these at times contradictory perceptions", "때로는 상충하는 이러한 인식들의"], ["of different species,", "서로 다른 종의,"], ["or members of the same species", "혹은 같은 종 구성원의"], ["in different environments,", "서로 다른 환경에 있는,"], ["reveals the extent of human supremacy.", "인간 우월성의 정도를 드러낸다."]]}, {"en": "It also reveals that perception of emotion in animals is not always driven by biological facts.", "ko": "그것은 또한 동물에게 있는 감정에 대한 인식이 항상 생물학적 사실에 의해 이끌리는 것은 아니라는 점을 드러낸다.", "chunks": [["It also reveals that", "그것은 또한 ~을 드러낸다"], ["perception of emotion in animals", "동물에게 있는 감정에 대한 인식이"], ["is not always driven by", "항상 ~에 의해 이끌리는 것은 아니라는"], ["biological facts.", "생물학적 사실."]]}, {"en": "In many cases, this perception is based on a social construct created and maintained by human beings as the more dominant animal.", "ko": "많은 경우, 이러한 인식은 더 지배적인 동물로서의 인간에 의해 창조되고 유지되는 사회적 구성 개념에 기초한다.", "chunks": [["In many cases,", "많은 경우,"], ["this perception is based on", "이러한 인식은 ~에 기초한다"], ["a social construct", "사회적 구성 개념"], ["created and maintained by human beings", "인간에 의해 창조되고 유지되는"], ["as the more dominant animal.", "더 지배적인 동물로서."]]}, {"en": "Human perceptions of animal emotions vary across species and contexts, shaping animals' wellbeing in ways that reveal human supremacy and reflect socially constructed beliefs rather than biological facts.", "ko": "동물의 감정에 대한 인간의 인식은 종과 환경에 따라 다르며, 인간의 우월성을 드러내고 생물학적 사실보다는 사회적으로 구성된 생각을 반영하는 방식으로 동물의 복지에 영향을 미친다.", "chunks": [["Human perceptions of animal emotions", "동물의 감정에 대한 인간의 인식은"], ["vary across species and contexts,", "종과 환경에 따라 다르며,"], ["shaping animals' wellbeing", "동물의 복지에 영향을 미치며"], ["in ways that reveal human supremacy", "인간의 우월성을 드러내는 방식으로"], ["and reflect socially constructed beliefs", "그리고 사회적으로 구성된 생각을 반영하는"], ["rather than biological facts.", "생물학적 사실보다는."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 생물학적으로 유사한 감정 능력을 지닌 여러 동물이 가운데 인간 우월성이라는 렌즈를 통과하면서, 오른쪽에서는 어떤 동물은 공감받고 어떤 동물은 이용되는 모순된 인식으로 갈리는 그림\">\n  <!-- 좌: 생물학적으로 유사한 동물들 -->\n  <text x=\"95\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">유사한 감정 능력</text>\n  <text x=\"95\" y=\"46\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">(biological fact)</text>\n  <!-- 개 -->\n  <g transform=\"translate(60,80)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"16\" ry=\"9\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <circle cx=\"-14\" cy=\"-4\" r=\"7\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <ellipse cx=\"-18\" cy=\"-9\" rx=\"2.5\" ry=\"4\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    <circle cx=\"-16\" cy=\"-4\" r=\"0.9\" fill=\"#1a1a1a\"/>\n    <path d=\"M 16 -2 Q 22 -8 24 -12\" fi " font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">인간</text>\n    <text x=\"0\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">우월성</text>\n    <text x=\"0\" y=\"78\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">social construct</text>\n  </g>\n  <line x1=\"262\" y1=\"125\" x2=\"340\" y2=\"100\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n  <line x1=\"262\" y1=\"125\" x2=\"340\" y2=\"170\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n  <!-- 우: 모순된 인식 -->\n  <text x=\"455\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">모순된 인식·대우</text>\n  <!-- 공감받음 (초록) -->\n  <g transform=\"translate(350,72)\">\n    <rect x=\"0\" y=\"0\" width=\"215\" height=\"46\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <g transform=\"translate(22,23)\"><circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#fff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/><path d=\"M -4 0 L -1 3.5 L 5 -4\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/></g>\n    <text x=\"130\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">감정 인정 · 공감</text>\n    <text x=\"130\" y=\"35\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">feelings acknowledged (e.g. pet)</text>\n  </g>\n  <!-- 이용됨 (빨강) -->\n  <g transform=\"translate(350,148)\">\n    <rect x=\"0\" y=\"0\" width=\"215\" height=\"46\" rx=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    <g transform=\"translate(22,23)\"><circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#fff\" stroke=\"#c8102e\" stroke-width=\"1.3\"/><line x1=\"-4\" y1=\"-4\" x2=\"4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"1.6\"/><line x1=\"4\" y1=\"-4\" x2=\"-4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"1.6\"/></g>\n    <text x=\"130\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">감정 무시 · 이용</text>\n    <text x=\"130\" y=\"35\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\">eaten · worn · used</text>\n  </g>\n  <!-- 하단 -->\n  <text x=\"300\" y=\"253\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">biology alone can't explain it — a social construct decides</text>\n</svg>", "caption": "왼쪽 생물학적으로 유사한 감정 능력을 지닌 여러 동물이 가운데 인간 우월성이라는 렌즈를 통과하면서, 오른쪽에서는 어떤 동물은 공감받고 어떤 동물은 이용되는 모순된 인식으로 갈리는 그림"}, {"no": "4", "title": "Limits of the Experimental Method — The Tariff Example", "ktitle": "실험 방법의 한계 — 관세 사례", "field": "과학방법·사회과학", "page": "11강 Ex.04", "oneline": "사회 과학에선 변수를 통제할 수 없어 실험 방법에 본질적 한계가 있다(관세 예시).", "tldr": ["실험 방법은 변수 통제에 의존한다.", "사회 과학에선 변수를 통제할 수 없다(관세 예).", "그래서 실험 방법에 본질적 한계가 있다."], "analogy": "", "bg": "분야는 과학 방법론이에요. 핵심 — 사회 과학에선 변수를 통제할 수 없어 ‘실험 방법(experimental method)’에 한계가 있다는 것(관세 예시). → 자연과학과 달리 무엇이 안 되는지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "실험 = 변수 통제"}, {"kind": "문제", "t": "사회과학은 변수 통제 불가"}, {"kind": "예시", "t": "관세(tariff) 사례"}, {"kind": "결론", "t": "실험 방법의 한계"}], "quiz": [["사회 과학에서 실험 방법의 한계는?", "변수를 통제할 수 없어서예요(관세 사례)."]], "vocab": [["limit", "한계·제약"], ["experimental method", "실험 방법·실험법"], ["control", "통제·제어하다"], ["significant", "중요한·의미 있는"], ["controlled experiment", "통제된 실험"], ["investigator", "연구자·조사자"], ["prove or disprove", "증명하거나 반증하다"], ["proposition", "명제·제안"], ["tariff", "관세"], ["prosperity", "번영·번창"], ["hold constant", "일정하게 유지하다·통제하다"], ["sustained", "지속적인·꾸준한"], ["substantial", "상당한·실질적인"], ["thesis", "명제·논제"], ["duties", "관세 (= tariffs)"], ["tariff policy", "관세 정책"], ["in effect", "시행 중인·실제로"], ["strike", "파업"], ["establishment", "설립·확립"], ["doubtless", "의심할 여지 없이·필시"]], "en": "There are limits to the use of the experimental method when a scientist cannot control the situations that are significant for the solution of problems. In the social sciences, less use can be made of the method of controlled experiment because the investigator cannot control the situations. For example, one way to prove or disprove the proposition that high tariffs bring prosperity would be to apply very heavy tariffs to all goods entering the United States for a considerable period of time, while holding constant all other factors affecting business activity. If a sustained increase in prosperity followed, we would then have substantial evidence to support the thesis that high duties are a cause of prosperity. No investigator can control the country's tariff policy; and even if she could, while the high tariff was in effect, many other social changes would be taking place, such as strikes, the establishment of new industries, and perhaps even wars. Some of these other changes would doubtless have much more influence on the state of national prosperity than would the high tariff and would make it impossible to separate out the effects of the high tariff from the effects of all these other events.", "ko": "과학자가 문제 해결에 중요한 상황을 통제할 수 없을 때 실험 방법의 사용에 한계가 있다. 사회 과학에서는, 연구자가 상황을 통제할 수 없기 때문에 통제된 실험 방법이 덜 활용될 수 있다. 예를 들어, 높은 관세가 번영을 가져온다는 명제를 증명하거나 그 오류를 입증하는 한 가지 방법은 경제 활동에 영향을 미치는 다른 모든 요인을 일정하게 유지하면서 상당한 기간 동안 미국에 들어오는 모든 상품에 대해 매우 무거운 관세를 적용하는 것일 터이다. 만약 지속적인 번영의 증가가 이어진다면, 우리는 그렇다면 높은 세금이 번영의 원인이라는 명제를 뒷받침할 상당한 증거를 확보하게 될 것이다. 그 어떤 연구자도 국가의 관세 정책을 통제할 수 없으며, 설령 그렇게 할 수 있다 하더라도 높은 관세가 시행되는 중에 파업, 새로운 산업의 설립, 그리고 어쩌면 심지어 전쟁과 같은 다른 많은 사회적 변화가 일어나고 있을 것이다. 이러한 다른 변화 중 일부는 필시 높은 관세보다 국가 번영 상태에 훨씬 더 큰 영향을 미칠 것이며, 높은 관세의 효과를 이런 다른 모든 사건의 효과와 분리하는 것을 불가능하게 만들 것이다.", "read": [{"en": "There are limits to the use of the experimental method when a scientist cannot control the situations that are significant for the solution of problems.", "ko": "과학자가 문제 해결에 중요한 상황을 통제할 수 없을 때 실험 방법의 사용에 한계가 있다.", "chunks": [["There are limits", "한계가 있다"], ["to the use of the experimental method", "실험 방법의 사용에"], ["when a scientist cannot control the situations", "과학자가 상황을 통제할 수 없을 때"], ["that are significant for the solution of problems.", "문제 해결에 중요한."]]}, {"en": "In the social sciences, less use can be made of the method of controlled experiment because the investigator cannot control the situations.", "ko": "사회 과학에서는, 연구자가 상황을 통제할 수 없기 때문에 통제된 실험 방법이 덜 활용될 수 있다.", "chunks": [["In the social sciences,", "사회 과학에서는,"], ["less use can be made of", "~이 덜 활용될 수 있다"], ["the method of controlled experiment", "통제된 실험 방법이"], ["because the investigator cannot control the situations.", "연구자가 상황을 통제할 수 없기 때문에."]]}, {"en": "For example, one way to prove or disprove the proposition that high tariffs bring prosperity would be to apply very heavy tariffs to all goods entering the United States for a considerable period of time, while holding constant all other factors affecting business activity.", "ko": "예를 들어, 높은 관세가 번영을 가져온다는 명제를 증명하거나 그 오류를 입증하는 한 가지 방법은 경제 활동에 영향을 미치는 다른 모든 요인을 일정하게 유지하면서 상당한 기간 동안 미국에 들어오는 모든 상품에 대해 매우 무거운 관세를 적용하는 것일 터이다.", "chunks": [["For example, one way", "예를 들어, 한 가지 방법은"], ["to prove or disprove the proposition", "명제를 증명하거나 반증하는"], ["that high tariffs bring prosperity", "높은 관세가 번영을 가져온다는"], ["would be to apply very heavy tariffs", "매우 무거운 관세를 적용하는 것일 것이다"], ["to all goods entering the United States", "미국에 들어오는 모든 상품에"], ["for a considerable period of time,", "상당한 기간 동안,"], ["while holding constant all other factors", "다른 모든 요인을 일정하게 유지하면서"], ["affecting business activity.", "경제 활동에 영향을 미치는."]]}, {"en": "If a sustained increase in prosperity followed, we would then have substantial evidence to support the thesis that high duties are a cause of prosperity.", "ko": "만약 지속적인 번영의 증가가 이어진다면, 우리는 그렇다면 높은 세금이 번영의 원인이라는 명제를 뒷받침할 상당한 증거를 확보하게 될 것이다.", "chunks": [["If a sustained increase in prosperity followed,", "만약 지속적인 번영의 증가가 이어진다면,"], ["we would then have substantial evidence", "우리는 그렇다면 상당한 증거를 확보하게 될 것이다"], ["to support the thesis", "명제를 뒷받침할"], ["that high duties are a cause of prosperity.", "높은 세금이 번영의 원인이라는."]]}, {"en": "No investigator can control the country's tariff policy; and even if she could, while the high tariff was in effect, many other social changes would be taking place, such as strikes, the establishment of new industries, and perhaps even wars.", "ko": "그 어떤 연구자도 국가의 관세 정책을 통제할 수 없으며, 설령 그렇게 할 수 있다 하더라도 높은 관세가 시행되는 중에 파업, 새로운 산업의 설립, 그리고 어쩌면 심지어 전쟁과 같은 다른 많은 사회적 변화가 일어나고 있을 것이다.", "chunks": [["No investigator can control", "그 어떤 연구자도 통제할 수 없으며"], ["the country's tariff policy;", "국가의 관세 정책을;"], ["and even if she could,", "설령 그렇게 할 수 있다 하더라도,"], ["while the high tariff was in effect,", "높은 관세가 시행되는 중에,"], ["many other social changes would be taking place,", "다른 많은 사회적 변화가 일어나고 있을 것이다,"], ["such as strikes,", "파업,"], ["the establishment of new industries,", "새로운 산업의 설립,"], ["and perhaps even wars.", "그리고 어쩌면 심지어 전쟁과 같은."]]}, {"en": "Some of these other changes would doubtless have much more influence on the state of national prosperity than would the high tariff and would make it impossible to separate out the effects of the high tariff from the effects of all these other events.", "ko": "이러한 다른 변화 중 일부는 필시 높은 관세보다 국가 번영 상태에 훨씬 더 큰 영향을 미칠 것이며, 높은 관세의 효과를 이런 다른 모든 사건의 효과와 분리하는 것을 불가능하게 만들 것이다.", "chunks": [["Some of these other changes", "이러한 다른 변화 중 일부는"], ["would doubtless have much more influence", "필시 훨씬 더 큰 영향을 미칠 것이며"], ["on the state of national prosperity", "국가 번영 상태에"], ["than would the high tariff", "높은 관세보다"], ["and would make it impossible", "그리고 ~을 불가능하게 만들 것이다"], ["to separate out the effects of the high tariff", "높은 관세의 효과를 분리하는 것을"], ["from the effects of all these other events.", "이런 다른 모든 사건의 효과로부터."]]}], "metaphor": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 실험실은 단일 변수를 통제해 깔끔하게 인과를 분리하지만, 오른쪽 사회에서는 고관세에서 번영으로 가는 작은 신호가 파업 신산업 전쟁이라는 큰 교란 변수에 묻혀 효과를 분리할 수 없음을 보여주는 그림\">\n  <!-- 좌: 실험실 (통제 가능) -->\n  <g transform=\"translate(20,40)\">\n    <rect x=\"0\" y=\"0\" width=\"250\" height=\"158\" rx=\"7\" fill=\"#f0faf3\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"125\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">실험실 — 변수 통제 가능</text>\n    <!-- 단일 변수 입력 → 결과 -->\n    <g transform=\"translate(40,85)\">\n      <rect x=\"0\" y=\"-16\" width=\"46\" height=\"32\" rx=\"4\" fill=\"#fff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"23\" y=\"4\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">변수 1개</text>\n    </g>\n    <line x1=\"86\" y1=\"85\" x2=\"135\" y2=\"85\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/><polygon points=\"135,85 127,81 127,89\" fill=\"#1FA34A\"/>\n    <g transform=\"translate(138,85)\">\n      <rect x=\"0\" y=\"-16\" width=\"72\" height=\"32\" rx=\"4\" fill=\"#fff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"36\" y=\"-1\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">결과</text>\n      <text x=\"36\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">cause isolated</text>\n    </g>\n    <text x=\"125\" y=\"138\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">one variable → clean inference</text>\n  </g>\n  <!-- 우: 사회 (통제 불가) -->\n  <g transform=\"translate(330,40)\">\n    <rect x=\"0\" y=\"0\" width=\"250\" height=\"158\" rx=\"7\" fill=\"#fdf2f4\" fill-opacity=\"0.4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    <text x=\"125\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">사회 — 변수 통제 불가</text>\n    <!-- 작은 신호: 고관세 → 번영? (얇음) -->\n    <text x=\"55\" y=\"40\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">고관세→번영?</text>\n    <line x1=\"28\" y1=\"50\" x2=\"82\" y2=\"50\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/><polygon points=\"82,50 75,47 75,53\" fill=\"#1FA34A\"/>\n    <!-- 큰 교란 변수 3개 (굵음·평행) -->\n    <g stroke=\"#c8102e\" stroke-width=\"3.4\" fill=\"#c8102e\">\n      <line x1=\"28\" y1=\"78\" x2=\"186\" y2=\"78\"/><polygon points=\"186,78 176,73 176,83\"/>\n      <line x1=\"28\" y1=\"106\" x2=\"186\" y2=\"106\"/><polygon points=\"186,106 176,101 176,111\"/>\n      <line x1=\"28\" y1=\"134\" x2=\"186\" y2=\"134\"/><polygon points=\"186,134 176,129 176,139\"/>\n    </g>\n    <g font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" fill=\"#c8102e\">\n      <text x=\"195\" y=\"82\">파업</text>\n      <text x=\"195\" y=\"110\">신산업</text>\n      <text x=\"195\" y=\"138\">전쟁</text>\n    </g>\n    <text x=\"100\" y=\"152\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">confounders much larger</text>\n  </g>\n  <!-- 가운데 두 벽 라벨 -->\n  <g transform=\"translate(300,118)\">\n    <text x=\"0\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">vs</text>\n  </g>\n  <!-- 하단 두 벽 + 결론 -->\n  <g font-family=\"Noto Serif KR\" font-size=\"8.5\" font-weight=\"700\">\n    <g transform=\"translate(70,212)\"><rect x=\"0\" y=\"0\" width=\"215\" height=\"22\" rx=\"3\" fill=\"#fff\" stroke=\"#c8102e\" stroke-width=\"1.1\"/><text x=\"107\" y=\"15\" text-anchor=\"middle\" fill=\"#c8102e\">벽① 관세 정책 자체 통제 불가</text></g>\n    <g transform=\"translate(315,212)\"><rect x=\"0\" y=\"0\" width=\"215\" height=\"22\" rx=\"3\" fill=\"#fff\" stroke=\"#c8102e\" stroke-width=\"1.1\"/><text x=\"107\" y=\"15\" text-anchor=\"middle\" fill=\"#c8102e\">벽② 다른 변수 동시 변동</text></g>\n  </g>\n  <text x=\"300\" y=\"256\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">the tariff effect can't be isolated — limits of the experimental method</text>\n</svg>", "caption": "왼쪽 실험실은 단일 변수를 통제해 깔끔하게 인과를 분리하지만, 오른쪽 사회에서는 고관세에서 번영으로 가는 작은 신호가 파업 신산업 전쟁이라는 큰 교란 변수에 묻혀 효과를 분리할 수 없음을 보여주는 그림"}, {"no": "5", "title": "Tourism, HRM, and the Cyclical Vulnerability of Employees", "ktitle": "관광 산업 직원의 주기적 취약성", "field": "경영·관광", "page": "11강 Ex.05", "oneline": "관광 산업 직원은 평시엔 최대 자산이지만 위기 때 가장 먼저 희생되는 주기적 취약성을 띤다.", "tldr": ["관광 산업에서 직원은 평시엔 최대 자산이다.", "그러나 위기 때는 가장 먼저 희생된다.", "이 주기적 취약성이 핵심 문제다."], "analogy": "", "bg": "분야는 경영·관광이에요. 관광 산업 직원이 ‘평시엔 최대 자산, 위기엔 희생 대상’이라는 모순이 핵심. → 직원이 왜 ‘주기적으로 취약(cyclical vulnerability)’해지는지에 주목하며 읽으세요.", "flow": [{"kind": "명제", "t": "직원 = 최대 자산"}, {"kind": "반전", "t": "위기엔 가장 먼저 희생"}, {"kind": "전개", "t": "경기 순환에 따른 취약성"}, {"kind": "결론", "t": "주기적 취약성"}], "quiz": [["관광 산업 직원의 모순적 위치는?", "평시엔 최대 자산, 위기엔 가장 먼저 희생되는 거예요."]], "vocab": [["tourism and hospitality industry", "관광·환대 산업"], ["sensitive to", "~에 민감한·취약한"], ["economic cycles", "경제 주기·경기 순환"], ["political trouble", "정치적 혼란·격동"], ["uncertainty", "불확실성"], ["vulnerable to", "~에 취약한"], ["fluctuation", "변동·기복"], ["economic downturn", "경제 침체"], ["outbreak", "발생·발발"], ["fragility", "취약성·연약함"], ["pronounced", "두드러진·뚜렷한"], ["trade union", "노동 조합"], ["rail against", "~에 격분하다·맹비난하다"], ["shock absorber", "충격 흡수재·완충제"], ["cyclical", "순환적·주기적"], ["hard approach", "강경한 접근법"], ["HRM (human resource management)", "인적 자원 관리"], ["redundancy programme", "정리 해고 프로그램"], ["soft approach", "유연한 접근법"], ["customer responsiveness", "고객 대응 능력"]], "en": "The tourism and hospitality industry is particularly sensitive to economic cycles and political trouble and can be badly affected in times of uncertainty. For example, the global nature of the industry means that it is vulnerable to external events that cause fluctuations in tourist visits and spend. The global 2001-2004 economic downturn, 9/11, the Iraq War and the outbreak of SARS all led to a drop in revenue in the industry. These factors reduced the number of travellers internationally and left uncertainty and fragility in the tourism market. Many of these aspects are particularly pronounced in the airline industry and trade unions have often railed against the manner in which employees are used as 'shock absorbers' to protect the industry from the cyclical nature of the market. These hard approaches to HRM have seen major redundancy programmes in a number of airlines in recent years, especially after 9/11. On the other hand, a number of companies have sought a more soft approach to HRM which aimed at increasing the customer responsiveness of their front-line staff. British Airways, for example, had a series of initiatives in the 1980s and 1990s such as 'Putting People First' and 'Winning for Customers'. Among other things, these initiatives sought to introduce teamwork, implement extensive training programmes, enhance quality procedures, and develop multi-skilled staff. As companies alternate between hard and soft approaches to HRM, employees may become confused as to what the company message is. Ultimately, employees may well be a company's 'greatest asset', but in times of uncertainty and downturn are equally expendable as recent history suggests.", "ko": "관광 및 환대 산업은 경제 주기와 정치적 혼란에 특히 민감하며, 불확실한 시기에는 심각한 타격을 받을 수 있다. 예를 들어, 해당 산업의 전 세계적인 특성은 그것이 관광객 방문 및 지출의 변동을 초래하는 외부 사건에 취약하다는 것을 의미한다. 2001년부터 2004년까지의 세계 경제 침체, 9/11 테러, 이라크 전쟁, 그리고 SARS 발생은 모두 해당 산업의 수익 감소로 이어졌다. 이러한 요인들은 국제적으로 여행객 수를 줄였으며, 관광 시장에 불확실성과 취약성을 남겼다. 이러한 측면의 많은 부분은 특히 항공 산업에서 두드러지고, 노동 조합은 시장의 순환적 성격으로부터 해당 산업을 보호하기 위해 직원들이 '충격 흡수재'로 쓰이는 방식에 대해 자주 격분해 왔다. 인적 자원 관리(HRM)에 대한 이러한 강경한 접근법은 특히 9/11 테러 이후 최근에 여러 항공사에서 대규모 정리 해고를 일으켰다. 반면, 다수의 기업들은 고객을 직접 응대하는 직원들의 고객 대응 능력을 향상하는 데 목표를 둔 HRM에 대한 더욱 유연한 접근법을 추구했다. 예를 들어, British Airways는 1980년대와 1990년대에 '사람을 최우선으로'와 '고객을 위한 승리'와 같은 일련의 진취적 계획을 도입하였다. 무엇보다도, 이러한 진취적 계획은 팀워크 도입, 광범위한 교육 프로그램 시행, 수준 높은 서비스 절차 강화, 그리고 다기능 직원 육성을 목표로 하였다. 기업이 HRM에 대한 강경한 접근법과 유연한 접근법을 번갈아 적용하면서, 직원은 회사의 메시지가 무엇인지에 대해 혼란스러워질 수도 있다. 결국, 직원은 아마도 기업의 '가장 큰 자산'이겠지만, 불확실성과 경기 침체의 시기에는 최근의 역사가 보여 주듯이 한편으로는 쉽게 희생될 수 있다.", "read": [{"en": "The tourism and hospitality industry is particularly sensitive to economic cycles and political trouble and can be badly affected in times of uncertainty.", "ko": "관광 및 환대 산업은 경제 주기와 정치적 혼란에 특히 민감하며, 불확실한 시기에는 심각한 타격을 받을 수 있다.", "chunks": [["The tourism and hospitality industry", "관광 및 환대 산업은"], ["is particularly sensitive to", "~에 특히 민감하며"], ["economic cycles and political trouble", "경제 주기와 정치적 혼란"], ["and can be badly affected", "그리고 심각한 타격을 받을 수 있다"], ["in times of uncertainty.", "불확실한 시기에는."]]}, {"en": "For example, the global nature of the industry means that it is vulnerable to external events that cause fluctuations in tourist visits and spend.", "ko": "예를 들어, 해당 산업의 전 세계적인 특성은 그것이 관광객 방문 및 지출의 변동을 초래하는 외부 사건에 취약하다는 것을 의미한다.", "chunks": [["For example,", "예를 들어,"], ["the global nature of the industry", "해당 산업의 전 세계적인 특성은"], ["means that", "~을 의미한다"], ["it is vulnerable to external events", "그것이 외부 사건에 취약하다는 것을"], ["that cause fluctuations in tourist visits and spend.", "관광객 방문 및 지출의 변동을 초래하는."]]}, {"en": "The global 2001-2004 economic downturn, 9/11, the Iraq War and the outbreak of SARS all led to a drop in revenue in the industry.", "ko": "2001년부터 2004년까지의 세계 경제 침체, 9/11 테러, 이라크 전쟁, 그리고 SARS 발생은 모두 해당 산업의 수익 감소로 이어졌다.", "chunks": [["The global 2001-2004 economic downturn,", "2001년부터 2004년까지의 세계 경제 침체,"], ["9/11, the Iraq War", "9/11 테러, 이라크 전쟁"], ["and the outbreak of SARS", "그리고 SARS 발생은"], ["all led to", "모두 ~로 이어졌다"], ["a drop in revenue in the industry.", "해당 산업의 수익 감소."]]}, {"en": "These factors reduced the number of travellers internationally and left uncertainty and fragility in the tourism market.", "ko": "이러한 요인들은 국제적으로 여행객 수를 줄였으며, 관광 시장에 불확실성과 취약성을 남겼다.", "chunks": [["These factors reduced", "이러한 대하는 직원들의."]]}, {"en": "British Airways, for example, had a series of initiatives in the 1980s and 1990s such as 'Putting People First' and 'Winning for Customers'.", "ko": "예를 들어, British Airways는 1980년대와 1990년대에 '사람을 최우선으로'와 '고객을 위한 승리'와 같은 일련의 진취적 계획을 도입하였다.", "chunks": [["British Airways, for example,", "예를 들어, British Airways는"], ["had a series of initiatives", "일련의 진취적 계획을 도입하였다"], ["in the 1980s and 1990s", "1980년대와 1990년대에"], ["such as 'Putting People First'", "'사람을 최우선으로'와 같은"], ["and 'Winning for Customers'.", "그리고 '고객을 위한 승리'."]]}, {"en": "Among other things, these initiatives sought to introduce teamwork, implement extensive training programmes, enhance quality procedures, and develop multi-skilled staff.", "ko": "무엇보다도, 이러한 진취적 계획은 팀워크 도입, 광범위한 교육 프로그램 시행, 수준 높은 서비스 절차 강화, 그리고 다기능 직원 육성을 목표로 하였다.", "chunks": [["Among other things,", "무엇보다도,"], ["these initiatives sought to", "이러한 진취적 계획은 ~을 목표로 하였다"], ["introduce teamwork,", "팀워크 도입,"], ["implement extensive training programmes,", "광범위한 교육 프로그램 시행,"], ["enhance quality procedures,", "수준 높은 서비스 절차 강화,"], ["and develop multi-skilled staff.", "그리고 다기능 직원 육성."]]}, {"en": "As companies alternate between hard and soft approaches to HRM, employees may become confused as to what the company message is.", "ko": "기업이 HRM에 대한 강경한 접근법과 유연한 접근법을 번갈아 적용하면서, 직원은 회사의 메시지가 무엇인지에 대해 혼란스러워질 수도 있다.", "chunks": [["As companies alternate between", "기업이 ~ 사이를 번갈아 적용하면서"], ["hard and soft approaches to HRM,", "HRM에 대한 강경한 접근법과 유연한 접근법,"], ["employees may become confused", "직원은 혼란스러워질 수도 있다"], ["as to what the company message is.", "회사의 메시지가 무엇인지에 대해."]]}, {"en": "Ultimately, employees may well be a company's 'greatest asset', but in times of uncertainty and downturn are equally expendable as recent history suggests.", "ko": "결국, 직원은 아마도 기업의 '가장 큰 자산'이겠지만, 불확실성과 경기 침체의 시기에는 최근의 역사가 보여 주듯이 한편으로는 쉽게 희생될 수 있다.", "chunks": [["Ultimately, employees may well be", "결국, 직원은 아마도 ~일 것이다"], ["a company's 'greatest asset',", "기업의 '가장 큰 자산',"], ["but in times of uncertainty and downturn", "하지만 불확실성과 경기 침체의 시기에는"], ["are equally expendable", "한편으로는 쉽게 희생될 수 있다"], ["as recent history suggests.", "최근의 역사가 보여 주듯이."]]}], "metaphor": "<svg viewBox=\"0 0 600 292\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 외부 충격이 가운데 직원이라는 충격 흡수재 코일을 거쳐 오른쪽 관광 산업을 보호하고, 그 아래 강경 HRM과 유연 HRM을 왕복하면 직원이 혼란에 빠지며, 맨 아래 평시 최대 자산과 위기 희생의 역설을 보여주는 그림\">\n  <!-- Row1: 충격 → 흡수재 → 산업 -->\n  <g transform=\"translate(20,40)\">\n    <rect x=\"0\" y=\"0\" width=\"150\" height=\"66\" rx=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <text x=\"75\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">외부 충격</text>\n    <text x=\"75\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">경기침체 · 9/11</text>\n    <text x=\"75\" y=\"46\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">이라크전 · SARS</text>\n    <text x=\"75\" y=\"60\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#c8102e\">revenue ↓</text>\n  </g>\n  <line x1=\"172\" y1=\"73\" x2=\"208\" y2=\"73\" stroke=\"#c8102e\" stroke-width=\"2.4\"/><polygon points=\"208,73 199,68 199,78\" fill=\"#c8102e\"/>\n  <!-- 충격 흡수재 (직원) -->\n  <g transform=\"translate(212,40)\">\n    <rect x=\"0\" y=\"6\" width=\"8\" height=\"62\" fill=\"#1a1a1a\"/>\n    <polyline points=\"8,40 22,24 36,56 50,24 64,56 78,24 92,56 106,40\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n    <rect x=\"106\" y=\"6\" width=\"8\" height=\"62\" fill=\"#1a1a1a\"/>\n    <text x=\"57\" y=\"84\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">직원 = 충격 흡수재</text>\n    <text x=\"57\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">\"shock absorbers\"</text>\n  </g>\n  <line x1=\"328\" y1=\"73\" x2=\"364\" y2=\"73\" stroke=\"#1FA34A\" stroke-width=\"2.4\"/><polygon points=\"364,73 355,68 355,78\" fill=\"#1FA34A\"/>\n  <g transform=\"translate(368,46)\">\n    <rect x=\"0\" y=\"0\" width=\"150\" height=\"54\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"75\" y=\"24\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">관광 산업</text>\n    <text x=\"75\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">protected</text>\n  </g>\n  <!-- Row2: 강경 ⇄ 유연 → 혼란 -->\n  <g transform=\"translate(40,150)\">\n    <rect x=\"0\" y=\"0\" width=\"175\" height=\"46\" rx=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <text x=\"87\" y=\"19\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">강경 HRM (Hard)</text>\n    <text x=\"87\" y=\"35\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">→ 대규모 정리 해고</text>\n  </g>\n  <g transform=\"translate(385,150)\">\n    <rect x=\"0\" y=\"0\" width=\"175\" height=\"46\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"87\" y=\"19\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">유연 HRM (Soft)</text>\n    <text x=\"87\" y=\"35\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\">→ 역량 강화 (BA)</text>\n  </g>\n  <!-- 왕복 화살표 -->\n  <g transform=\"translate(300,173)\">\n    <line x1=\"-78\" y1=\"-6\" x2=\"78\" y2=\"-6\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/><polygon points=\"78,-6 70,-10 70,-2\" fill=\"#1a1a1a\"/>\n    <line x1=\"78\" y1=\"8\" x2=\"-78\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/><polygon points=\"-78,8 -70,4 -70,12\" fill=\"#1a1a1a\"/>\n    <text x=\"0\" y=\"-12\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">왕복 alternate</text>\n    <text x=\"0\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">→ 직원 혼란</text>\n  </g>\n  <!-- Row3: 역설 -->\n  <g transform=\"translate(40,222)\">\n    <rect x=\"0\" y=\"0\" width=\"520\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"135\" y=\"25\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">평시 = 최대 자산</text>\n    <text x=\"260\" y=\"25\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">↔</text>\n    <text x=\"390\" y=\"25\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">위기 = 희생 가능</text>\n  </g>\n  <text x=\"300\" y=\"282\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">the greatest asset in good times, expendable in crisis</text>\n</svg>", "caption": "왼쪽 외부 충격이 가운데 직원이라는 충격 흡수재 코일을 거쳐 오른쪽 관광 산업을 보호하고, 그 아래 강경 HRM과 유연 HRM을 왕복하면 직원이 혼란에 빠지며, 맨 아래 평시 최대 자산과 위기 희생의 역설을 보여주는 그림"}, {"no": "6", "title": "AI Predictive Policing and Algorithmic Bias", "ktitle": "예측 치안 AI와 알고리즘 편향", "field": "기술·윤리", "page": "11강 Ex.06", "oneline": "예측 치안 AI는 알고리즘 편향으로 차별을 낳을 수 있어 신중한 설계가 필요하다.", "tldr": ["예측 치안 AI는 범죄를 미리 예측하려 한다.", "그러나 학습 데이터의 편향이 차별을 낳는다.", "따라서 신중한 설계가 필요하다."], "analogy": "", "bg": "분야는 기술·윤리예요. 핵심어 ‘예측 치안(predictive policing)’과 ‘알고리즘 편향(algorithmic bias)’. → 예측 치안 AI가 왜 차별을 낳을 수 있고 신중한 설계가 필요한지에 주목하며 읽으세요.", "flow": [{"kind": "도입", "t": "예측 치안 AI 등장"}, {"kind": "문제", "t": "알고리즘 편향"}, {"kind": "결과", "t": "차별 재생산"}, {"kind": "결론", "t": "신중한 설계 필요"}], "quiz": [["예측 치안 AI의 문제는?", "데이터 편향 때문에 차별을 재생산할 수 있어요."]], "vocab": [["widely debated", "널리 논의되는"], ["application", "적용·응용"], ["law enforcement", "법 집행·치안"], ["predictive policing", "예측 치안"], ["algorithm", "알고리즘"], ["historical", "과거의·역사적인"], ["high-risk", "고위험의"], ["allocate", "할당하다·배분하다"], ["perpetuate", "영속화하다·지속시키다"], ["bias", "편견·편향"], ["discrimination", "차별"], ["minority community", "소수 공동체·소수 집단"], ["biased", "편향된"], ["over-policing", "과잉 치안·과도한 단속"], ["disproportionately", "불균형적으로"], ["reinforce", "강화하다·심화시키다"], ["inequality", "불평등"], ["unjust", "부당한"], ["heightened", "강화된·고조된"], ["surveillance", "감시"]], "en": "One of the most widely debated applications of AI in law enforcement is predictive policing, where algorithms analyze historical crime data to predict where crimes are likely to occur and who may be involved. By identifying high-risk areas and individuals, predictive policing aims to allocate law enforcement resources more efficiently and reduce crime. However, predictive policing has been criticized for perpetuating bias and discrimination, particularly against minority communities. If an AI system is trained on biased data that reflects historical patterns of over-policing in certain neighborhoods, it may disproportionately target those areas for increased law enforcement presence, reinforcing existing inequalities. This has raised concerns about the fairness and accuracy of predictive policing systems and the potential for unjust outcomes. For example, a predictive policing system used by the Los Angeles Police Department was found to disproportionately target Black and Latino communities, leading to heightened surveillance and increased arrests in those areas. Critics argue that predictive policing systems must be carefully designed and rigorously tested to ensure that they do not perpetuate racial bias or undermine trust in law enforcement.", "ko": "법 집행 분야에서 가장 널리 논의되는 AI의 적용 중 하나는 예측 치안인데, 여기서는 알고리즘이 과거 범죄 데이터를 분석하여 범죄가 어디에서 발생할 가능성이 있고 누가 연루될 수 있는지 예측한다. 고위험 지역과 개인들을 알아냄으로써, 예측 치안은 법 집행 자원을 더 효율적으로 할당하고 범죄를 줄이는 것을 목표로 한다. 그러나 예측 치안은, 특히 소수 공동체에 대한 편견과 차별을 영속화한다는 이유로 비판을 받아 왔다. 만약 AI 시스템이 특정 지역에서 과거의 과잉 치안 패턴을 반영하는 편향된 데이터로 훈련된다면, 그 지역을 불균형적으로 법 집행 인력을 증가할 표적으로 삼아 기존의 불평등을 강화시킬 수도 있을 것이다. 이는 예측 치안 시스템의 공정성과 정확성, 그리고 부당한 결과의 가능성에 대한 우려를 제기했다. 예를 들어, 로스앤젤레스 경찰국에서 사용된 예측 치안 시스템은 흑인과 라틴계 공동체를 불균형적으로 표적 삼아, 그러한 지역들에서 감시 강화와 체포 증가로 이어진 것으로 밝혀졌다. 비판론자들은 예측 치안 시스템이 인종적 편견을 영속화하거나 법 집행에 대한 신뢰를 훼손하지 않도록 신중하게 설계되고 엄격하게 테스트되어야 한다고 주장한다.", "read": [{"en": "One of the most widely debated applications of AI in law enforcement is predictive policing, where algorithms analyze historical crime data to predict where crimes are likely to occur and who may be involved.", "ko": "법 집행 분야에서 가장 널리 논의되는 AI의 적용 중 하나는 예측 치안인데, 여기서는 알고리즘이 과거 범죄 데이터를 분석하여 범죄가 어디에서 발생할 가능성이 있고 누가 연루될 수 있는지 예측한다.", "chunks": [["One of the most widely debated applications", "가장 널리 논의되는 적용 중 하나는"], ["of AI in law enforcement is", "법 집행 분야에서 AI의"], ["predictive policing,", "예측 치안인데,"], ["where algorithms analyze historical crime data", "여기서는 알고리즘이 과거 범죄 데이터를 분석한다"], ["to predict where crimes are likely to occur", "범죄가 어디에서 발생할 가능성이 있는지 예측하기 위해"], ["and who may be involved.", "그리고 누가 연루될 수 있는지."]]}, {"en": "By identifying high-risk areas and individuals, predictive policing aims to allocate law enforcement resources more efficiently and reduce crime.", "ko": "고위험 지역과 개인들을 알아냄으로써, 예측 치안은 법 집행 자원을 더 효율적으로 할당하고 범죄를 줄이는 것을 목표로 한다.", "chunks": [["By identifying high-risk areas and individuals,", "고위험 지역과 개인들을 알아냄으로써,"], ["predictive policing aims to", "예측 치안은 ~을 목표로 한다"], ["allocate law enforcement resources more efficiently", "법 집행 자원을 더 효율적으로 할당"], ["and reduce crime.", "그리고 범죄를 줄이는 것."]]}, {"en": "However, predictive policing has been criticized for perpetuating bias and discrimination, particularly against minority communities.", "ko": "그러나 예측 치안은, 특히 소수 공동체에 대한 편견과 차별을 영속화한다는 이유로 비판을 받아 왔다.", "chunks": [["However, predictive policing has been criticized", "그러나 예측 치안은 비판을 받아 왔다"], ["for perpetuating bias and discrimination,", "편견과 차별을 영속화한다는 이유로,"], ["particularly against minority communities.", "특히 소수 공동체에 대한."]]}, {"en": "If an AI system is trained on biased data that reflects historical patterns of over-policing in certain neighborhoods, it may disproportionately target those areas for increased law enforcement presence, reinforcing existing inequalities.", "ko": "만약 AI 시스템이 특정 지역에서 과거의 과잉 치안 패턴을 반영하는 편향된 데이터로 훈련된다면, 그 지역을 불균형적으로 법 집행 인력을 증가할 표적으로 삼아 기존의 불평등을 강화시킬 수도 있을 것이다.", "chunks": [["If an AI system is trained on biased data", "만약 AI 시스템이 편향된 데이터로 훈련된다면"], ["that reflects historical patterns of over-policing", "과거의 과잉 치안 패턴을 반영하는"], ["in certain neighborhoods,", "특정 지역에서,"], ["it may disproportionately target those areas", "그것은 그 지역을 불균형적으로 표적으로 삼을 수도 있을 것이다"], ["for increased law enforcement presence,", "법 집행 인력을 증가할,"], ["reinforcing existing inequalities.", "기존의 불평등을 강화하면서."]]}, {"en": "This has raised concerns about the fairness and accuracy of predictive policing systems and the potential for unjust outcomes.", "ko": "이는 예측 치안 시스템의 공정성과 정확성, 그리고 부당한 결과의 가능성에 대한 우려를 제기했다.", "chunks": [["This has raised concerns about", "이는 ~에 대한 우려를 제기했다"], ["the fairness and accuracy", "공정성과 정확성"], ["of predictive policing systems", "예측 치안 시스템의"], ["and the potential for unjust outcomes.", "그리고 부당한 결과의 가능성."]]}, {"en": "For example, a predictive policing system used by the Los Angeles Police Department was found to disproportionately target Black and Latino communities, leading to heightened surveillance and increased arrests in those areas.", "ko": "예를 들어, 로스앤젤레스 경찰국에서 사용된 예측 치안 시스템은 흑인과 라틴계 공동체를 불균형적으로 표적 삼아, 그러한 지역들에서 감시 강화와 체포 증가로 이어진 것으로 밝혀졌다.", "chunks": [["For example,", "예를 들어,"], ["a predictive policing system used by", "예측 치안 시스템은 ~에 의해 사용된"], ["the Los Angeles Police Department", "로스앤젤레스 경찰국"], ["was found to disproportionately target", "불균형적으로 표적 삼은 것으로 밝혀졌다"], ["Black and Latino communities,", "흑인과 라틴계 공동체를,"], ["leading to heightened surveillance", "감시 강화로 이어져"], ["and increased arrests", "그리고 체포 증가"], ["in those areas.", "그러한 지역들에서."]]}, {"en": "Critics argue that predictive policing systems must be carefully designed and rigorously tested to ensure that they do not perpetuate racial bias or undermine trust in law enforcement.", "ko": "비판론자들은 예측 치안 시스템이 인종적 편견을 영속화하거나 법 집행에 대한 신뢰를 훼손하지 않도록 신중하게 설계되고 엄격하게 테스트되어야 한다고 주장한다.", "chunks": [["Critics argue that", "비판론자들은 ~라고 주장한다"], ["predictive policing systems must be carefully designed", "예측 치안 시스템이 신중하게 설계되어야 한다"], ["and rigorously tested", "그리고 엄격하게 테스트되어야"], ["to ensure that they do not perpetuate racial bias", "인종적 편견을 영속화하지 않도록"], ["or undermine trust in law enforcement.", "또는 법 집행에 대한 신뢰를 훼손하지 않도록."]]}], "metaphor": "<svg viewBox=\"0 0 600 275\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"가운데 편향된 과거 데이터에서 AI 예측, 소수 공동체 표적, 체포 기록 누적으로 다시 데이터로 돌아오는 빨강 악순환 고리가 있고, 오른쪽에 신중 설계와 엄격 테스트라는 초록 차단 장치가 고리를 끊는 그림\">\n  <!-- 명목 목표 -->\n  <text x=\"215\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">명목 목표: 효율적 자원 배분 · 범죄 감소</text>\n  <!-- 4 노드 악순환 -->\n  <g font-family=\"Noto Serif KR\" font-weight=\"700\">\n    <g transform=\"translate(140,38)\"><rect x=\"0\" y=\"0\" width=\"150\" height=\"34\" rx=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/><text x=\"75\" y=\"15\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">① 편향된 과거 데이터</text><text x=\"75\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#c8102e\">over-policing history</text></g>\n    <g transform=\"translate(300,128)\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"34\" rx=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/><text x=\"60\" y=\"15\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">② AI 예측</text><text x=\"60\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#c8102e\">high-risk areas</text></g>\n    <g transform=\"translate(140,218)\"><rect x=\"0\" y=\"0\" width=\"150\" height=\"3

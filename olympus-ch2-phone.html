5\" rx=\"5\" ry=\"3.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\" transform=\"rotate(-30 -6 -5)\"/>\n      <ellipse cx=\"6\" cy=\"-8\" rx=\"5\" ry=\"3.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\" transform=\"rotate(30 6 -8)\"/>\n      <circle cx=\"0\" cy=\"-13\" r=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <!-- ✓ -->\n      <circle cx=\"0\" cy=\"-30\" r=\"8\" fill=\"#1FA34A\"/>\n      <path d=\"M -3 -30 L -0.5 -28 L 3 -33\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.7\"/>\n      <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">plant</text>\n    </g>\n\n    <!-- 3: human -->\n    <g transform=\"translate(490, 130)\">\n      <circle cx=\"0\" cy=\"-12\" r=\"4.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"-7\" x2=\"0\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"-3\" x2=\"-5\" y2=\"3\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"-3\" x2=\"5\" y2=\"3\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"6\" x2=\"-4\" y2=\"13\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"6\" x2=\"4\" y2=\"13\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <!-- ✓ -->\n      <circle cx=\"0\" cy=\"-30\" r=\"8\" fill=\"#1FA34A\"/>\n      <path d=\"M -3 -30 L -0.5 -28 L 3 -33\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.7\"/>\n      <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">human</text>\n    </g>\n\n    <!-- 4: large animal (코끼리) -->\n    <g transform=\"translate(555, 130)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"13\" ry=\"6.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <ellipse cx=\"-12\" cy=\"-3\" rx=\"5.5\" ry=\"4.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <path d=\"M -17,-1 Q -21,5 -19,9\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"-6\" y1=\"5\" x2=\"-6\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"-1\" y1=\"5\" x2=\"-1\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"4\" y1=\"5\" x2=\"4\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"9\" y1=\"5\" x2=\"9\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- ✓ -->\n      <circle cx=\"0\" cy=\"-23\" r=\"8\" fill=\"#1FA34A\"/>\n      <path d=\"M -3 -23 L -0.5 -21 L 3 -26\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.7\"/>\n      <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">large animal</text>\n    </g>\n\n    <!-- 4 billion years 시간축 (하단) -->\n    <g transform=\"translate(445, 200)\">\n      <!-- 양방향 화살표 -->\n      <line x1=\"-110\" y1=\"0\" x2=\"110\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <polygon points=\"-110,0 -103,-5 -103,5\" fill=\"#1FA34A\"/>\n      <polygon points=\"110,0 103,-5 103,5\" fill=\"#1FA34A\"/>\n      <!-- 라벨 -->\n      <rect x=\"-65\" y=\"-12\" width=\"130\" height=\"22\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">4 billion years</text>\n    </g>\n\n    <text x=\"445\" y=\"235\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">all equally evolved · equal products</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"265\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">no hierarchy — bacteria are as evolved as any of us</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '지구 생명 = 큰 생물로만 정의 ✗'이고, 마지막은 '가장 큰 종도 박테리아보다 ‘더 진화’한 게 아니다'로 정리된다."}, {"no": "17", "title": "Why Bad News Weighs More", "ktitle": "부정적·극단적 정보가 더 무겁다", "field": "심리·판단", "page": "no.05", "oneline": "어떤 개인 정보는 다른 것보다 ‘더 많이 알려 준다’.", "tldr": ["어떤 개인 정보는 다른 것보다 ‘더 많이 알려 준다’.", "부정적 정보는 ‘일반적 기대에서 벗어난 점’을 드러낸다.", "극단적(매우 +/−) 정보도 특이성을 드러내 판단에 더 큰 가중치를 받는다."], "analogy": "누군가에 대해 ‘평범한 칭찬’보다 ‘충격적인 잘못’이나 ‘유난히 대단한 행동’이 더 오래 기억에 남죠. 부정적이든 극단적이든 흔치 않은 정보일수록 눈에 띄고, 그 사람 판단에 더 크게 작용해요.", "bg": "분야는 심리·판단이에요. 핵심은 어떤 정보가 다른 정보보다 ‘더 많이 알려 준다’는 것. → 왜 나쁜 소식이 더 무겁게 작용하는지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "어떤 정보는 ‘더 많이 알려 줌’ → 눈에 띄고 주목"}, {"kind": "부정", "t": "부정적 정보 = 일반적(약간 +) 기대에서 벗어남"}, {"kind": "극단", "t": "매우 +/− 정보 = 특이한 특성을 드러냄"}, {"kind": "원리", "t": "더 ‘정보적’이라 관심의 초점이 됨"}, {"kind": "결론", "t": "부정·극단 정보가 판단에서 더 큰 가중치"}], "quiz": [["부정적 정보가 더 ‘정보적’인 이유는?", "우리가 타인에게 갖는 ‘약간 긍정적인’ 일반적 기대에서 벗어난 점을 드러내기 때문이에요."], ["극단적 정보가 주목받는 이유는?", "매우 긍정·부정적 행동은 그 사람의 ‘특이한 특성’을 드러내 더 많은 것을 알려 주기 때문이에요."], ["핵심 한 문장?", "부정적·극단적 정보가 더 많은 것을 알려 주기에, 사람을 판단할 때 더 큰 가중치를 갖는다."]], "vocab": [["informative", "정보를 많이 주는"], ["salient", "눈에 띄는·두드러진"], ["deviate from", "~에서 벗어나다"], ["evaluatively", "평가적으로"], ["target person", "대상자"], ["weight", "가중치·중요도"], ["interpersonal", "대인 관계의"]], "en": "Certain kinds of personal information are more informative than others, and what is informative will be salient, will attract attention, and hence will be given more weight in interpersonal judgments. Specifically, negative information about a person reveals a way that the person deviates from the mildly positive expectations we generally have about others. Similarly, evaluatively extreme information ─ e.g., very positive and very negative behaviors ─ reveals ways in which the person has unusual characteristics. These properties make this information more informative about the target person, and therefore they become the focus of our attention. Judgments of a person should be based on information that is informative about that person's qualities and characteristics. Therefore, negative and extreme information about a person will have increased importance, or weight, in our judgments.", "ko": "특정 종류의 개인 정보는 다른 것들보다 알려 주는 것이 더 많으며, 알려 주는 것이 많은 것은 눈에 띄고, 관심을 끌며, 따라서 개인 간의 관계 판단에 더 많은 가중치를 부여받을 것이다. 구체적으로 말해, 개인에 대한 부정적인 정보는 그 사람이 우리가 일반적으로 다른 사람에 대해 가지고 있는 약간 긍정적인 기대에서 벗어난 방식을 드러낸다. 마찬가지로, 평가적인 면에서 극단적인 정보, 예를 들어서 매우 긍정적인 행동과 매우 부정적인 행동은 그 사람이 특이한 특성을 가지는 방식을 드러낸다. 이러한 특성은 이 정보가 대상자에 대해 더 많은 정보를 제공하게 하며, 따라서 우리가 가지는 관심의 초점이 된다. 사람에 관한 판단은 그 사람의 자질과 특성을 알려 주는 정보를 바탕으로 하여 이루어질 것이다. 따라서 한 사람에 대한 부정적이고 극단적인 정보는 우리의 판단에서 중요도, 즉 가중치를 증가시킬 것이다.", "read": [{"en": "Certain kinds of personal information are more informative than others, and what is informative will be salient, will attract attention, and hence will be given more weight in interpersonal judgments.", "ko": "특정 종류의 개인 정보는 다른 것들보다 알려 주는 것이 더 많으며, 알려 주는 것이 많은 것은 눈에 띄고, 관심을 끌며, 따라서 개인 간의 관계 판단에 더 많은 가중치를 부여받을 것이다.", "chunks": [["Certain kinds of personal information", "특정 종류의 개인 정보는"], ["are more informative than others,", "다른 것들보다 더 많은 정보를 알려 주며,"], ["and what is informative will be salient,", "많은 정보를 주는 것은 눈에 띄고,"], ["will attract attention,", "관심을 끌며,"], ["and hence will be given more weight", "따라서 더 많은 가중치를 부여받는다"], ["in interpersonal judgments.", "개인 간의 판단에서."]]}, {"en": "Specifically, negative information about a person reveals a way that the person deviates from the mildly positive expectations we generally have about others.", "ko": "구체적으로 말해, 개인에 대한 부정적인 정보는 그 사람이 우리가 일반적으로 다른 사람에 대해 가지고 있는 약간 긍정적인 기대에서 벗어난 방식을 드러낸다.", "chunks": [["Specifically, negative information about a person", "구체적으로, 한 사람에 대한 부정적 정보는"], ["reveals a way that the person deviates from", "그 사람이 ~에서 벗어나는 방식을 드러낸다"], ["the mildly positive expectations", "약간 긍정적인 기대로부터"], ["we generally have about others.", "우리가 다른 사람에 대해 일반적으로 가지고 있는."]]}, {"en": "Similarly, evaluatively extreme information ─ e.g., very positive and very negative behaviors ─ reveals ways in which the person has unusual characteristics.", "ko": "마찬가지로, 평가적인 면에서 극단적인 정보, 예를 들어서 매우 긍정적인 행동과 매우 부정적인 행동은 그 사람이 특이한 특성을 가지는 방식을 드러낸다.", "chunks": [["Similarly, evaluatively extreme information ─", "마찬가지로, 평가적으로 극단적인 정보 ─"], ["e.g., very positive and very negative behaviors ─", "예를 들어, 매우 긍정적이거나 매우 부정적인 행동 ─"], ["reveals ways in which the person", "그 사람이 ~한 방식을 드러낸다"], ["has unusual characteristics.", "특이한 특성을 가지는."]]}, {"en": "These properties make this information more informative about the target person, and therefore they become the focus of our attention.", "ko": "이러한 특성은 이 정보가 대상자에 대해 더 많은 정보를 제공하게 하며, 따라서 우리가 가지는 관심의 초점이 된다.", "chunks": [["These properties make this information", "이러한 특성은 이 정보를 만든다"], ["more informative about the target person,", "대상자에 대해 더 많은 정보를 주는 것으로,"], ["and therefore they become", "그래서 그것들은 ~이 된다"], ["the focus of our attention.", "우리 관심의 초점."]]}, {"en": "Judgments of a person should be based on information that is informative about that person's qualities and characteristics.", "ko": "사람에 관한 판단은 그 사람의 자질과 특성을 알려 주는 정보를 바탕으로 하여 이루어질 것이다.", "chunks": [["Judgments of a person should be based on", "한 사람에 대한 판단은 ~에 기반해야 한다"], ["information that is informative", "많은 정보를 주는 정보"], ["about that person's qualities and characteristics.", "그 사람의 자질과 특성에 대해."]]}, {"en": "Therefore, negative and extreme information about a person will have increased importance, or weight, in our judgments.", "ko": "따라서 한 사람에 대한 부정적이고 극단적인 정보는 우리의 판단에서 중요도, 즉 가중치를 증가시킬 것이다.", "chunks": [["Therefore, negative and extreme information", "따라서 부정적이고 극단적인 정보는"], ["about a person", "한 사람에 대한"], ["will have increased importance, or weight,", "증가된 중요성, 즉 가중치를 가지게 된다"], ["in our judgments.", "우리의 판단에서."]]}], "metaphor": "<svg viewBox=\"0 0 600 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"5개 원이 가로로 연결된 인과 사슬. 입력 neg·ext 원에서 entropy ↑, salience ↑, attention ↑, weight ↑로 4 화살표를 따라 흐른다. 각 원 위·아래에 영문 라벨과 한글 라벨이 있고, 아래 결론 박스에 결정에 큰 영향이 표시.\">\n  <!-- 5 원 노드 가로 사슬 -->\n  <!-- 노드 1: 입력 -->\n  <g transform=\"translate(60, 110)\">\n    <circle cx=\"0\" cy=\"0\" r=\"34\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">negative</text>\n    <text x=\"0\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">· extreme</text>\n    <text x=\"0\" y=\"-50\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">입력</text>\n    <text x=\"0\" y=\"56\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">information</text>\n  </g>\n\n  <!-- 화살표 1 -->\n  <g transform=\"translate(105, 110)\">\n    <line x1=\"0\" y1=\"0\" x2=\"35\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <polygon points=\"35,0 27,-5 27,5\" fill=\"#c8102e\"/>\n  </g>\n\n  <!-- 노드 2: entropy -->\n  <g transform=\"translate(185, 110)\">\n    <circle cx=\"0\" cy=\"0\" r=\"32\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n    <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">entropy</text>\n    <text x=\"0\" y=\"10\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c8102e\">↑</text>\n    <text x=\"0\" y=\"-48\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">정보량</text>\n  </g>\n\n  <!-- 화살표 2 -->\n  <g transform=\"translate(220, 110)\">\n    <line x1=\"0\" y1=\"0\" x2=\"35\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <polygon points=\"35,0 27,-5 27,5\" fill=\"#c8102e\"/>\n  </g>\n\n  <!-- 노드 3: salience -->\n  <g transform=\"translate(300, 110)\">\n    <circle cx=\"0\" cy=\"0\" r=\"32\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n    <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">salience</text>\n    <text x=\"0\" y=\"10\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c8102e\">↑</text>\n    <text x=\"0\" y=\"-48\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">두드러짐</text>\n  </g>\n\n  <!-- 화살표 3 -->\n  <g transform=\"translate(335, 110)\">\n    <line x1=\"0\" y1=\"0\" x2=\"35\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <polygon points=\"35,0 27,-5 27,5\" fill=\"#c8102e\"/>\n  </g>\n\n  <!-- 노드 4: attention -->\n  <g transform=\"translate(415, 110)\">\n    <circle cx=\"0\" cy=\"0\" r=\"32\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n    <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">attention</text>\n    <text x=\"0\" y=\"10\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c8102e\">↑</text>\n    <text x=\"0\" y=\"-48\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">관심</text>\n  </g>\n\n  <!-- 화살표 4 -->\n  <g transform=\"translate(450, 110)\">\n    <line x1=\"0\" y1=\"0\" x2=\"35\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <polygon points=\"35,0 27,-5 27,5\" fill=\"#c8102e\"/>\n  </g>\n\n  <!-- 노드 5: weight (결과) -->\n  <g transform=\"translate(540, 110)\">\n    <circle cx=\"0\" cy=\"0\" r=\"36\" fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">decision</text>\n    <text x=\"0\" y=\"10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">weight ↑</text>\n    <text x=\"0\" y=\"-50\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">결정 가중치</text>\n    <text x=\"0\" y=\"58\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">final impact</text>\n  </g>\n\n  <!-- 하단 결론 박스 -->\n  <g transform=\"translate(300, 205)\">\n    <rect x=\"-235\" y=\"-13\" width=\"470\" height=\"26\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">same mechanism — both negativity and extremity carry high entropy</text>\n  </g>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '어떤 정보는 ‘더 많이 알려 줌’ → 눈에 띄고 주목'이고, 마지막은 '부정·극단 정보가 판단에서 더 큰 가중치'로 정리된다."}, {"no": "18", "title": "Division of Labor Expanded Morality", "ktitle": "분업이 도덕을 복잡하게 만들었다", "field": "역사·윤리", "page": "no.06", "oneline": "역사 초기, 사람들이 목동·사냥꾼·농부 등으로 나뉘었다.", "tldr": ["역사 초기, 사람들이 목동·사냥꾼·농부 등으로 나뉘었다.", "노동이 여러 갈래가 되자 ‘무엇이 옳은가’가 어려워졌다.", "개성·공동체 개념이 정교해지며 도덕성도 복잡해졌다."], "analogy": "모두가 똑같은 일을 하면 ‘옳은 일’도 단순하죠. 하지만 각자 다른 일을 하게 되자 ‘무엇이 옳은가’를 판단하기가 훨씬 복잡해졌어요.", "bg": "분야는 역사·윤리예요. 분업으로 역할이 다양해지며 ‘무엇이 옳은가’의 기준이 복잡해졌다는 것이 핵심. → 분업이 도덕성을 어떻게 확장했는지에 주목하며 읽으세요.", "flow": [{"kind": "시작", "t": "역사 초기 — 목동·사냥꾼·농부로 분화"}, {"kind": "난제", "t": "옳고 그름을 보는 ‘완전히 새 방식’ 필요"}, {"kind": "변화", "t": "노동이 두 종류(남/녀) → 수많은 종류로"}, {"kind": "질문", "t": "모두가 ‘각자 일’을 할 때 무엇이 옳은가?"}, {"kind": "결론", "t": "개성·공동체 개념 정교화 → 도덕성 복잡화"}], "quiz": [["분업이 도덕에 어려움을 준 이유는?", "사람마다 다른 일을 하게 되자, ‘다른 선택도 옳다’고 보는 새로운 기준이 필요해졌기 때문이에요."], ["도덕성은 어떻게 변했나?", "개성과 공동체에 대한 개념이 정교해지면서 도덕성의 복잡성이 확대됐어요."], ["핵심 한 문장?", "노동의 분화가 ‘무엇이 옳은가’를 복잡하게 만들며 도덕성을 확장시켰다."]], "vocab": [["at the dawn of", "~의 여명기에"], ["herder", "목동·목축인"], ["undoubtedly", "의심할 여지 없이"], ["divided into", "~으로 나뉜"], ["morality", "도덕성"], ["sophisticated", "정교한"], ["individuality", "개성"]], "en": "At the dawn of history, some of us became herders, others hunters and others farmers. This development of individual skills was undoubtedly a difficult challenge because it required a whole new way to understand right and wrong. For the first time in the history of our species, labor was not just divided into two kinds, the male kind and the female kind. Suddenly, one's labor might be any one of a number of different things. Within the sexes, one male or female could be doing something different from other males or females and still must be looked upon as doing right. How do we know what is right when everyone is doing his or her own thing? Morality expanded in complexity as the notion of individuality and community became more sophisticated. Before we could do different things, the idea that different things could be done needed to be accepted.", "ko": "역사의 여명기에 우리 중 일부는 목동, 다른 사람들은 사냥꾼, 또 다른 사람들은 농부가 되었다. 이러한 개인 기술의 발달은 옳고 그름을 이해하는 완전히 새로운 방식이 필요했기 때문에 의심할 여지 없이 어려운 문제였다. 인류 역사상 처음으로 노동이 단지 두 가지 종류, 즉 남성의 종류와 여성의 종류로만 나뉘지 않게 되었다. 갑자기 한 사람의 노동은 수많은 다양한 것 중 하나가 될 수도 있을 것이다. 성별 안에서 남성이나 여성은 다른 남성이나 여성과 다른 일을 하고 있을 수도 있는데, 그럼에도 불구하고 옳은 일을 하는 것으로 간주되어야 한다. 모두가 각자의 일을 할 때 무엇이 옳은지 어떻게 알 수 있을까? 개성과 공동체에 대한 개념이 더 정교해지면서 도덕성은 복잡성이 확대되었다. 우리가 다른 일을 할 수 있기 전에 다른 일을 할 수 있다는 생각이 수용되어야 했다.", "read": [{"en": "At the dawn of history, some of us became herders, others hunters and others farmers.", "ko": "역사의 여명기에 우리 중 일부는 목동, 다른 사람들은 사냥꾼, 또 다른 사람들은 농부가 되었다.", "chunks": [["At the dawn of history,", "역사의 여명기에,"], ["some of us became herders,", "우리 중 일부는 목동이 되었고,"], ["others hunters", "다른 사람들은 사냥꾼이 되었고"], ["and others farmers.", "또 다른 사람들은 농부가 되었다."]]}, {"en": "This development of individual skills was undoubtedly a difficult challenge because it required a whole new way to understand right and wrong.", "ko": "이러한 개인 기술의 발달은 옳고 그름을 이해하는 완전히 새로운 방식이 필요했기 때문에 의심할 여지 없이 어려운 문제였다.", "chunks": [["This development of individual skills", "이러한 개인 기술의 발달은"], ["was undoubtedly a difficult challenge", "의심할 여지 없이 어려운 문제였다"], ["because it required a whole new way", "왜냐하면 그것이 완전히 새로운 방식을 필요로 했기 때문이다"], ["to understand right and wrong.", "옳고 그름을 이해하는."]]}, {"en": "For the first time in the history of our species, labor was not just divided into two kinds, the male kind and the female kind.", "ko": "인류 역사상 처음으로 노동이 단지 두 가지 종류, 즉 남성의 종류와 여성의 종류로만 나뉘지 않게 되었다.", "chunks": [["For the first time in the history of our species,", "인류 역사상 처음으로,"], ["labor was not just divided into two kinds,", "노동이 단지 두 가지 종류로만 나뉜 것이 아니라,"], ["the male kind and the female kind.", "남성의 종류와 여성의 종류."]]}, {"en": "Suddenly, one's labor might be any one of a number of different things.", "ko": "갑자기 한 사람의 노동은 수많은 다양한 것 중 하나가 될 수도 있을 것이다.", "chunks": [["Suddenly,", "갑자기,"], ["one's labor might be", "한 사람의 노동은 ~일 수도 있을 것이다"], ["any one of a number of different things.", "여러 다양한 것 중 어느 하나."]]}, {"en": "Within the sexes, one male or female could be doing something different from other males or females and still must be looked upon as doing right.", "ko": "성별 안에서 남성이나 여성은 다른 남성이나 여성과 다른 일을 하고 있을 수도 있는데, 그럼에도 불구하고 옳은 일을 하는 것으로 간주되어야 한다.", "chunks": [["Within the sexes,", "성별 안에서,"], ["one male or female could be doing something different", "한 남성이나 여성이 다른 일을 하고 있을 수도 있고"], ["from other males or females", "다른 남성·여성과는 다른"], ["and still must be looked upon as doing right.", "그럼에도 옳은 일을 하는 것으로 간주되어야 한다."]]}, {"en": "How do we know what is right when everyone is doing his or her own thing?", "ko": "모두가 각자의 일을 할 때 무엇이 옳은지 어떻게 알 수 있을까?", "chunks": [["How do we know what is right", "무엇이 옳은지 어떻게 알 수 있을까"], ["when everyone is doing his or her own thing?", "모두가 각자의 일을 할 때?"]]}, {"en": "Morality expanded in complexity as the notion of individuality and community became more sophisticated.", "ko": "개성과 공동체에 대한 개념이 더 정교해지면서 도덕성은 복잡성이 확대되었다.", "chunks": [["Morality expanded in complexity", "도덕성은 복잡성이 확대되었다"], ["as the notion of individuality and community", "개성과 공동체의 개념이"], ["became more sophisticated.", "더 정교해지면서."]]}, {"en": "Before we could do different things, the idea that different things could be done needed to be accepted.", "ko": "우리가 다른 일을 할 수 있기 전에 다른 일을 할 수 있다는 생각이 수용되어야 했다.", "chunks": [["Before we could do different things,", "우리가 다른 일을 할 수 있기 전에,"], ["the idea that different things could be done", "다른 일이 행해질 수 있다는 생각이"], ["needed to be accepted.", "받아들여져야 했다."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 초기 분업으로 man과 woman 2 stick figure가 박스 안에 있고 single moral framework. 가운데: 사회 발전 화살표. 오른쪽: 4 stick figure가 herder(목동 막대기), hunter(활), farmer(낫), warrior(검) 도구를 각자 들고 있는 다양한 분업 + diverse moralities required 라벨.\">\n  <!-- 좌측 박스 — 초기 분업 (2 갈래) -->\n  <g>\n    <text x=\"115\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">초기 — 2 갈래</text>\n    <rect x=\"20\" y=\"30\" width=\"190\" height=\"205\" fill=\"#f6f6f6\" fill-opacity=\"0.6\" stroke=\"#999\" stroke-width=\"1.5\"/>\n\n    <!-- man stick figure (좌) -->\n    <g transform=\"translate(75, 130)\">\n      <circle cx=\"0\" cy=\"-22\" r=\"10\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <circle cx=\"-3\" cy=\"-23\" r=\"1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-23\" r=\"1\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 -18 Q 0 -16 3 -18\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"-12\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <line x1=\"0\" y1=\"-4\" x2=\"-11\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"-4\" x2=\"11\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"-7\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"7\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"55\" font- 5, 215)\">\n      <rect x=\"-115\" y=\"-12\" width=\"230\" height=\"22\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">diverse moralities required</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"258\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">one ethic cannot cover all roles — new frame needed</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '역사 초기 — 목동·사냥꾼·농부로 분화'이고, 마지막은 '개성·공동체 개념 정교화 → 도덕성 복잡화'로 정리된다."}, {"no": "19", "title": "Fast Fashion's Birth", "ktitle": "패스트 패션의 탄생 (자라)", "field": "경제·산업", "page": "no.07", "oneline": "1980년대 유행은 비디오로 며칠 만에 퍼질 만큼 빨라졌다.", "tldr": ["1980년대 유행은 비디오로 며칠 만에 퍼질 만큼 빨라졌다.", "반면 세계화로 산업은 분산돼 디자인을 1년 전 미리 확정해야 했다.", "고객은 더 빠른 패션을 원하는데 디자이너는 ‘작년 스타일’ — Ortega가 ‘즉석 패션’을 구상."], "analogy": "유행은 SNS처럼 며칠 만에 확 번지는데, 옷은 1년 전에 미리 만들어 둬야 했어요. 이 ‘속도 차이’를 본 자라 창업자가 ‘수요만큼 빠르게 만드는’ 패스트 패션을 떠올린 거죠.", "bg": "분야는 경제·산업이에요. 1980년대 유행이 비디오로 며칠 만에 퍼질 만큼 빨라진 것이 배경. → 패스트 패션이 어떻게 탄생했는지를 따라가며 읽으세요.", "flow": [{"kind": "유행", "t": "1980s — 비디오로 며칠 만에 유행 확산"}, {"kind": "역설", "t": "세계화로 산업은 분산·느려짐", "d": "디자인/제조가 다른 대륙."}, {"kind": "간극", "t": "디자이너는 1년 전 미리 확정 → ‘작년 스타일’"}, {"kind": "착안", "t": "고객은 더 빠른 패션 요구"}, {"kind": "탄생", "t": "Ortega(자라) — 수요만큼 빠른 ‘즉석 패션’ 구상"}], "quiz": [["1980년대 패션의 ‘속도 간극’이란?", "유행은 며칠 만에 퍼질 만큼 빨라졌는데, 분산된 산업 탓에 디자이너는 1년 전 미리 옷을 확정해야 했어요."], ["Ortega가 구상한 새 회사의 핵심은?", "수요가 생기는 것과 같은 속도로 디자인·출시되는 ‘즉석(패스트) 패션’이에요."], ["핵심 한 문장?", "유행 속도와 느린 생산의 간극에서, 수요만큼 빠른 ‘패스트 패션’이 탄생했다."]], "vocab": [["trendsetter", "유행 선도자"], ["ignite", "불붙이다·점화하다"], ["fad", "일시적 유행"], ["globalization", "세계화"], ["disaggregate", "분산시키다·해체하다"], ["value chain", "가치 사슬"], ["magnate", "거물"]], "en": "Fashions were changing rapidly in the 1980s. A new video from a trendsetter like pop star Madonna or rock band Duran Duran, for instance, could be seen everywhere within days, igniting a fad that might last a summer or a year ─ no one could predict. At the same time, the fashion industry itself was slowing down. Globalization opened up sources of cheap labor, but it also disaggregated internal functions at the big fashion houses. Design and marketing took place on one continent, and fabric sourcing, manufacturing, and finishing on another. Since each step in the value chain required additional time to coordinate, designers had to finalize their products up to a year in advance of the selling season. So, while customers were demanding faster and fresher fashions, designers were pushing last year's looks. Recognizing this dynamic, Spanish retail magnate Amancio Ortega envisioned a new type of company, one that addressed the important social job by creating instant fashions: clothes that could be designed and brought to market as fast as demand arose.", "ko": "패션은 1980년대에 빠르게 변하고 있었다. 예를 들어, 팝 스타 Madonna나 록 밴드 Duran Duran 같은 유행 선도자의 새로운 비디오는 며칠 만에 어디에서나 볼 수 있었고, 여름 한철 또는 1년 동안 지속될 수도 있는 일시적 유행에 불을 붙였는데, 아무도 예측할 수 없었다. 동시에 패션 산업 자체는 속도가 느려지고 있었다. 세계화는 저렴한 노동의 공급원을 개방했지만, 그것은 또한 대형 고급 의상실의 내부적인 기능을 분산하였다. 디자인과 마케팅은 한 대륙에서, 원단의 해외 구매, 제조, 마감은 다른 대륙에서 이루어졌다. 가치 사슬의 각 단계는 조정을 위한 추가적인 시간을 필요로 했기 때문에, 디자이너들은 판매 시즌보다 최대 1년 앞서 제품을 완성해야 했다. 그래서 고객들은 더 빠르고 더 새로운 패션을 요구하는 반면, 디자이너들은 지난해의 스타일을 밀어붙이고 있었다. 이러한 역학 관계를 깨닫고, 스페인의 소매업 거물 Amancio Ortega는 새로운 유형의 회사, 다시 말해, 즉각적인 패션, 즉 수요가 생기는 것과 같은 속도로 디자인되어 출시될 수 있는 의복을 만듦으로써 중요한 사회적 과제에 대처하는 회사를 구상했다.", "read": [{"en": "Fashions were changing rapidly in the 1980s.", "ko": "패션은 1980년대에 빠르게 변하고 있었다.", "chunks": [["Fashions were changing rapidly", "패션은 빠르게 변하고 있었다"], ["in the 1980s.", "1980년대에."]]}, {"en": "A new video from a trendsetter like pop star Madonna or rock band Duran Duran, for instance, could be seen everywhere within days, igniting a fad that might last a summer or a year ─ no one could predict.", "ko": "예를 들어, 팝 스타 Madonna나 록 밴드 Duran Duran 같은 유행 선도자의 새로운 비디오는 며칠 만에 어디에서나 볼 수 있었고, 여름 한철 또는 1년 동안 지속될 수도 있는 일시적 유행에 불을 붙였는데, 아무도 예측할 수 없었다.", "chunks": [["A new video from a trendsetter", "유행 선도자의 새 비디오는"], ["like pop star Madonna or rock band Duran Duran,", "팝 스타 Madonna나 록 밴드 Duran Duran 같은,"], ["for instance,", "예를 들어,"], ["could be seen everywhere within days,", "며칠 만에 어디에서나 볼 수 있었고,"], ["igniting a fad", "일시적 유행에 불을 붙였다"], ["that might last a summer or a year ─", "여름 한철 또는 1년 동안 지속될 수도 있는 ─"], ["no one could predict.", "아무도 예측할 수 없었던."]]}, {"en": "At the same time, the fashion industry itself was slowing down.", "ko": "동시에 패션 산업 자체는 속도가 느려지고 있었다.", "chunks": [["At the same time,", "동시에,"], ["the fashion industry itself", "패션 산업 자체는"], ["was slowing down.", "속도가 느려지고 있었다."]]}, {"en": "Globalization opened up sources of cheap labor, but it also disaggregated internal functions at the big fashion houses.", "ko": "세계화는 저렴한 노동의 공급원을 개방했지만, 그것은 또한 대형 고급 의상실의 내부적인 기능을 분산하였다.", "chunks": [["Globalization opened up sources of cheap labor,", "세계화는 저렴한 노동 공급원을 개방했지만,"], ["but it also disaggregated internal functions", "또한 내부적 기능을 분산하였다"], ["at the big fashion houses.", "대형 고급 의상실의."]]}, {"en": "Design and marketing took place on one continent, and fabric sourcing, manufacturing, and finishing on another.", "ko": "디자인과 마케팅은 한 대륙에서, 원단의 해외 구매, 제조, 마감은 다른 대륙에서 이루어졌다.", "chunks": [["Design and marketing took place", "디자인과 마케팅은 이루어졌다"], ["on one continent,", "한 대륙에서,"], ["and fabric sourcing, manufacturing, and finishing", "그리고 원단 구매, 제조, 마감은"], ["on another.", "다른 대륙에서."]]}, {"en": "Since each step in the value chain required additional time to coordinate, designers had to finalize their products up to a year in advance of the selling season.", "ko": "가치 사슬의 각 단계는 조정을 위한 추가적인 시간을 필요로 했기 때문에, 디자이너들은 판매 시즌보다 최대 1년 앞서 제품을 완성해야 했다.", "chunks": [["Since each step in the value chain", "가치 사슬의 각 단계가"], ["required additional time to coordinate,", "조정을 위한 추가 시간을 필요로 했기 때문에,"], ["designers had to finalize their products", "디자이너들은 제품을 완성해야 했다"], ["up to a year in advance of the selling season.", "판매 시즌보다 최대 1년 앞서."]]}, {"en": "So, while customers were demanding faster and fresher fashions, designers were pushing last year's looks.", "ko": "그래서 고객들은 더 빠르고 더 새로운 패션을 요구하는 반면, 디자이너들은 지난해의 스타일을 밀어붙이고 있었다.", "chunks": [["So, while customers were demanding", "그래서, 고객들이 ~을 요구하는 동안"], ["faster and fresher fashions,", "더 빠르고 더 새로운 패션을,"], ["designers were pushing", "디자이너들은 ~을 밀어붙이고 있었다"], ["last year's looks.", "지난해의 스타일을."]]}, {"en": "Recognizing this dynamic, Spanish retail magnate Amancio Ortega envisioned a new type of company, one that addressed the important social job by creating instant fashions: clothes that could be designed and brought to market as fast as demand arose.", "ko": "이러한 역학 관계를 깨닫고, 스페인의 소매업 거물 Amancio Ortega는 새로운 유형의 회사, 다시 말해, 즉각적인 패션, 즉 수요가 생기는 것과 같은 속도로 디자인되어 출시될 수 있는 의복을 만듦으로써 중요한 사회적 과제에 대처하는 회사를 구상했다.", "chunks": [["Recognizing this dynamic,", "이 역학 관계를 깨닫고,"], ["Spanish retail magnate Amancio Ortega", "스페인 소매업 거물 Amancio Ortega는"], ["envisioned a new type of company,", "새로운 유형의 회사를 구상했다,"], ["one that addressed the important social job", "중요한 사회적 과제에 대처하는"], ["by creating instant fashions:", "즉각적 패션을 창조함으로써:"], ["clothes that could be designed and brought to market", "디자인되어 시장에 출시될 수 있는 의복"], ["as fast as demand arose.", "수요가 생기는 것만큼 빠르게."]]}], "metaphor": "<svg viewBox=\"0 0 600 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: fast fashion trends — 며칠 timeline에 Madonna look과 Duran Duran 박스가 빠르게 사라지는 그림. 오른쪽: slow industry — Asia spinning, USA weaving, Italy designing, Spain sewing 4 대륙 분업과 1년 timeline. 하단: Ortega의 instant fashion 통찰 박스.\">\n  <!-- 좌측 박스 — fast fashion trends -->\n  <g>\n    <text x=\"155\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">트렌드 — days (fast)</text>\n    <rect x=\"20\" y=\"30\" width=\"265\" height=\"170\" fill=\"#fdf2f4\" fill-opacity=\"0. "110\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <polygon points=\"110,0 102,-5 102,5\" fill=\"#1FA34A\"/>\n      <!-- 12 눈금 -->\n      <g stroke=\"#1FA34A\" stroke-width=\"1.2\">\n        <line x1=\"-100\" y1=\"-4\" x2=\"-100\" y2=\"4\"/>\n        <line x1=\"-80\" y1=\"-4\" x2=\"-80\" y2=\"4\"/>\n        <line x1=\"-60\" y1=\"-4\" x2=\"-60\" y2=\"4\"/>\n        <line x1=\"-40\" y1=\"-4\" x2=\"-40\" y2=\"4\"/>\n        <line x1=\"-20\" y1=\"-4\" x2=\"-20\" y2=\"4\"/>\n        <line x1=\"0\" y1=\"-4\" x2=\"0\" y2=\"4\"/>\n        <line x1=\"20\" y1=\"-4\" x2=\"20\" y2=\"4\"/>\n        <line x1=\"40\" y1=\"-4\" x2=\"40\" y2=\"4\"/>\n        <line x1=\"60\" y1=\"-4\" x2=\"60\" y2=\"4\"/>\n        <line x1=\"80\" y1=\"-4\" x2=\"80\" y2=\"4\"/>\n        <line x1=\"100\" y1=\"-4\" x2=\"100\" y2=\"4\"/>\n      </g>\n      <text x=\"0\" y=\"-13\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">1 year ahead</text>\n      <text x=\"-100\" y=\"18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">M1</text>\n      <text x=\"100\" y=\"18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">M12</text>\n    </g>\n\n    <text x=\"445\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">supply chain spans continents</text>\n  </g>\n\n  <!-- 하단 결론 박스 — Ortega의 통찰 -->\n  <g transform=\"translate(300, 240)\">\n    <rect x=\"-225\" y=\"-22\" width=\"450\" height=\"44\" rx=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <!-- 격차 표시 (좌·우) -->\n    <text x=\"-195\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#c8102e\" font-weight=\"700\">days</text>\n    <text x=\"-195\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#1FA34A\" font-weight=\"700\">vs 1 year</text>\n    <!-- 양방향 격차 화살표 -->\n    <g transform=\"translate(-140, 4)\">\n      <line x1=\"0\" y1=\"0\" x2=\"35\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <polygon points=\"0,0 7,-4 7,4\" fill=\"#1a1a1a\"/>\n      <polygon points=\"35,0 28,-4 28,4\" fill=\"#1a1a1a\"/>\n      <text x=\"17\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1a1a1a\">gap</text>\n    </g>\n    <!-- Ortega 결론 -->\n    <text x=\"55\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">Ortega's insight → instant fashion</text>\n    <text x=\"55\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">격차에서 instant fashion 사업 구상</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"280\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">a paradox spotted → a new industry born</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '1980s — 비디오로 며칠 만에 유행 확산'이고, 마지막은 'Ortega(자라) — 수요만큼 빠른 ‘즉석 패션’ 구상'로 정리된다."}, {"no": "20", "title": "Doing Nothing Is Also a Decision", "ktitle": "‘아무것도 안 함’도 하나의 결정", "field": "환경·윤리", "page": "no.08", "oneline": "생태 능력을 지키려면 ‘지속적 개입’이 필요하다.", "tldr": ["생태 능력을 지키려면 ‘지속적 개입’이 필요하다.", "적극적 관리는 ‘자연은 스스로 둬야’는 일부의 의혹을 산다.", "그러나 우리의 영향이 크기에, ‘아무것도 안 함’도 하나의 관리 결정이다."], "analogy": "치료법을 아는 환자를 ‘그냥 두는 것’도 결국 하나의 선택이고 책임이죠. 자연도 마찬가지 — 개입하든 안 하든, 영향이 큰 우리는 책임에서 벗어날 수 없어요.", "bg": "분야는 환경·윤리예요. 생태 능력을 지키려면 ‘지속적 개입’이 필요하다는 것이 출발점. → ‘아무것도 안 하기’도 왜 하나의 결정인지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "생태 능력 유지 = 지속적 개입 필요"}, {"kind": "환영", "t": "대다수: 인간이 야생을 돌볼 책임 = 합당"}, {"kind": "의혹", "t": "일부: ‘자연은 스스로 두라’ → 적극 관리에 의혹"}, {"kind": "반박", "t": "우리 영향이 커 개입 안 해도 책임 있음"}, {"kind": "결론", "t": "‘아무것도 안 함’도 하나의 관리 결정이다"}], "quiz": [["생태 능력을 유지하려면 무엇이 필요한가?", "잠재적 위협을 통제하고 특정 종·서식지를 돕기 위한 ‘지속적인 개입’이 필요해요."], ["‘아무것도 안 함도 결정’이라는 말의 뜻은?", "치료법을 아는 환자를 안 치료하는 것도 책임이듯, 개입하지 않는 것 자체가 책임 있는 관리 결정이라는 거예요."], ["핵심 한 문장?", "우리의 영향이 워낙 커서, 자연에 개입하지 않는 ‘아무것도 안 함’도 하나의 관리 결정이자 책임이다."]], "vocab": [["intervene", "개입하다"], ["persistently", "지속적으로"], ["arouse suspicion", "의혹을 불러일으키다"], ["look after itself", "스스로를 돌보다"], ["notwithstanding", "~에도 불구하고"], ["bear in mind", "명심하다"], ["malaise", "병·불편"]], "en": "If our aim is to maintain the full long-term ecological capacity of our natural areas, then we will have to intervene persistently to control potential threats and favor certain species and habitats. Improvements that target populations and habitats directly are generally positively welcomed by the majority of people who do not find it unreasonable that we humans should take responsibility for the care of the planet's wildlife. Nevertheless, active management may arouse suspicion in some people or societal groups who tend to prefer for nature \"to look after itself.\" Notwithstanding our personal opinions, our influence on our planet is so vast that we surely have to be held responsible for what goes on in certain ecosystems, even if we decide not to intervene. We must bear in mind that doing nothing is a management decision in itself, just as not treating a sick person whose malaise and its cure is known to us does not make us any less responsible for their health than if we decide to treat them.", "ko": "우리의 목표가 자연 지역의 완전한 장기적 생태 능력을 유지하는 것이라면, 잠재적인 위협을 통제하고 특정 종과 서식지를 돕기 위해 지속적으로 개입해야 할 것이다. 개체군과 서식지를 직접 대상으로 삼는 개선은, 일반적으로 우리 인간이 지구의 야생 동물을 돌볼 책임을 져야 한다는 것이 불합리하지 않다고 생각하는 대다수의 사람에게 긍정적으로 환영받는다. 그렇기는 하나 자연이 '스스로 돌보는 것'을 선호하는 경향이 있는 일부 사람들이나 사회적 집단에게 적극적인 관리는 의혹을 불러일으킬 수 있다. 우리의 개인적인 의견에도 불구하고 우리가 지구에 미치는 영향이 매우 크므로, 비록 우리가 개입하지 않기로 결정하더라도, 특정 생태계에서 일어나는 일에 대해 분명히 책임을 져야 한다. 우리는 아무것도 하지 않는 것 그 자체가 하나의 관리 결정임을 명심해야 하는데, 이는 병과 그 치료법이 우리에게 알려져 있는 병자를 치료하지 '않는다'고 해서 그들의 건강에 대한 책임이 그들을 치료하기로 결정하는 경우보다 조금도 더 적지 않은 것과 꼭 마찬가지이다.", "read": [{"en": "If our aim is to maintain the full long-term ecological capacity of our natural areas, then we will have to intervene persistently to control potential threats and favor certain species and habitats.", "ko": "우리의 목표가 자연 지역의 완전한 장기적 생태 능력을 유지하는 것이라면, 잠재적인 위협을 통제하고 특정 종과 서식지를 돕기 위해 지속적으로 개입해야 할 것이다.", "chunks": [["If our aim is to maintain", "우리의 목표가 유지하는 것이라면"], ["the full long-term ecological capacity of our natural areas,", "자연 지역의 완전한 장기적 생태 능력을,"], ["then we will have to intervene persistently", "그러면 우리는 지속적으로 개입해야 할 것이다"], ["to control potential threats and favor certain species and habitats.", "잠재적 위협을 통제하고 특정 종·서식지를 돕기 위해."]]}, {"en": "Improvements that target populations and habitats directly are generally positively welcomed by the majority of people who do not find it unreasonable that we humans should take responsibility for the care of the planet's wildlife.", "ko": "개체군과 서식지를 직접 대상으로 삼는 개선은, 일반적으로 우리 인간이 지구의 야생 동물을 돌볼 책임을 져야 한다는 것이 불합리하지 않다고 생각하는 대다수의 사람에게 긍정적으로 환영받는다.", "chunks": [["Improvements that target populations and habitats directly", "개체군과 서식지를 직접 대상으로 삼는 개선은"], ["are generally positively welcomed", "일반적으로 긍정적으로 환영받는다"], ["by the majority of people", "대다수의 사람에게"], ["who do not find it unreasonable", "불합리하게 여기지 않는"], ["that we humans should take responsibility", "우리 인간이 책임을 져야 한다는 것을"], ["for the care of the planet's wildlife.", "지구의 야생 동물에 대한 돌봄에 대한."]]}, {"en": "Nevertheless, active management may arouse suspicion in some people or societal groups who tend to prefer for nature \"to look after itself.\"", "ko": "그렇기는 하나 자연이 '스스로 돌보는 것'을 선호하는 경향이 있는 일부 사람들이나 사회적 집단에게 적극적인 관리는 의혹을 불러일으킬 수 있다.", "chunks": [["Nevertheless, active management may arouse suspicion", "그렇기는 하나, 적극적 관리는 의혹을 불러일으킬 수 있다"], ["in some people or societal groups", "일부 사람이나 사회적 집단에게"], ["who tend to prefer", "~을 선호하는 경향이 있는"], ["for nature \"to look after itself.\"", "자연이 '스스로 돌보기'를."]]}, {"en": "Notwithstanding our personal opinions, our influence on our planet is so vast that we surely have to be held responsible for what goes on in certain ecosystems, even if we decide not to intervene.", "ko": "우리의 개인적인 의견에도 불구하고 우리가 지구에 미치는 영향이 매우 크므로, 비록 우리가 개입하지 않기로 결정하더라도, 특정 생태계에서 일어나는 일에 대해 분명히 책임을 져야 한다.", "chunks": [["Notwithstanding our personal opinions,", "우리의 개인적 의견에도 불구하고,"], ["our influence on our planet is so vast", "지구에 대한 우리의 영향은 너무 커서"], ["that we surely have to be held responsible", "확실히 책임을 떠맡아야 한다"], ["for what goes on in certain ecosystems,", "특정 생태계에서 일어나는 일에 대해,"], ["even if we decide not to intervene.", "비록 우리가 개입하지 않기로 결정하더라도."]]}, {"en": "We must bear in mind that doing nothing is a management decision in itself, just as not treating a sick person whose malaise and its cure is known to us does not make us any less responsible for their health than if we decide to treat them.", "ko": "우리는 아무것도 하지 않는 것 그 자체가 하나의 관리 결정임을 명심해야 하는데, 이는 병과 그 치료법이 우리에게 알려져 있는 병자를 치료하지 '않는다'고 해서 그들의 건강에 대한 책임이 그들을 치료하기로 결정하는 경우보다 조금도 더 적지 않은 것과 꼭 마찬가지이다.", "chunks": [["We must bear in mind", "우리는 명심해야 한다"], ["that doing nothing is a management decision in itself,", "아무것도 하지 않는 것 그 자체가 하나의 관리 결정임을,"], ["just as not treating a sick person", "병자를 치료하지 않는 것이"], ["whose malaise and its cure is known to us", "병과 치료법이 우리에게 알려져 있는"], ["does not make us any less responsible for their health", "그들의 건강에 대한 책임을 우리에게 조금도 덜어 주지 않는 것과 똑같이"], ["than if we decide to treat them.", "우리가 치료하기로 결정하는 경우보다."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 의사가 cure 약병을 들고 있고 가운데에 차단 X가 있어 약이 환자에게 전달되지 않으며 환자는 침대에 누워 아파하는 장면. 오른쪽: 결론 박스 — inaction is still an active management decision.\">\n  <!-- 좌측 박스 — 의사 + 환자 + 치료 거부 -->\n  <g>\n    <text x=\"155\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">알려진 치료법 · 환자 아픔 · 의사 거부</text>\n    <rect x=\"20\" y=\"30\" width=\"265\" height=\"210\" fill=\"#fdf2f4\" fill-opacity=\"0.2    <!-- 약병 (의사 오른손) -->\n      <g transform=\"translate(30, 7)\">\n        <!-- 병뚜껑 -->\n        <rect x=\"-4\" y=\"-10\" width=\"8\" height=\"3\" fill=\"#1a1a1a\"/>\n        <!-- 병 본체 -->\n        <rect x=\"-5\" y=\"-7\" width=\"10\" height=\"14\" rx=\"1\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <!-- 라벨 -->\n        <line x1=\"-3\" y1=\"-2\" x2=\"3\" y2=\"-2\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n        <line x1=\"-3\" y1=\"1\" x2=\"3\" y2=\"1\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n        <text x=\"0\" y=\"-14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">cure</text>\n      </g>\n    </g>\n\n    <!-- 차단 X (가운데) -->\n    <g transform=\"translate(155, 140)\">\n      <circle cx=\"0\" cy=\"0\" r=\"22\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"2.5\"/>\n      <line x1=\"-11\" y1=\"-11\" x2=\"11\" y2=\"11\" stroke=\"#c8102e\" stroke-width=\"3.5\"/>\n      <line x1=\"11\" y1=\"-11\" x2=\"-11\" y2=\"11\" stroke=\"#c8102e\" stroke-width=\"3.5\"/>\n      <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">refuses to treat</text>\n    </g>\n\n    <!-- 환자 (우) — 침대에 누움 -->\n    <g transform=\"translate(235, 135)\">\n      <!-- 침대 -->\n      <rect x=\"-35\" y=\"-2\" width=\"70\" height=\"18\" rx=\"2\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 베개 -->\n      <rect x=\"-32\" y=\"-7\" width=\"22\" height=\"10\" rx=\"2\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <!-- 환자 (누운 stick figure) -->\n      <circle cx=\"-22\" cy=\"-4\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 눈 (감김 — 아픔) -->\n      <line x1=\"-25\" y1=\"-5\" x2=\"-22\" y2=\"-3\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"-19\" y1=\"-5\" x2=\"-22\" y2=\"-3\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <!-- 입 (찡그림) -->\n      <path d=\"M -25 -1 Q -22 1 -19 -1\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <!-- 이불 (몸 덮음) -->\n      <path d=\"M -16 2 L 30 2 L 30 12 L -16 12 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 머리 위 ⚡ 또는 ✗ (고통) -->\n      <text x=\"-22\" y=\"-16\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c8102e\">!</text>\n\n      <!-- 라벨 -->\n      <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">sick patient</text>\n      <text x=\"0\" y=\"44\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">suffers</text>\n    </g>\n  </g>\n\n  <!-- 우측 박스 — 결론 (inaction = decision) -->\n  <g>\n    <text x=\"445\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">부작위도 — active decision</text>\n    <rect x=\"315\" y=\"30\" width=\"265\" height=\"210\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 큰 등호 + 명제 -->\n    <g transform=\"translate(445, 110)\">\n      <!-- 좌측: refuses to treat -->\n      <rect x=\"-110\" y=\"-22\" width=\"100\" height=\"44\" rx=\"4\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <text x=\"-60\" y=\"-5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">refuses to treat</text>\n      <text x=\"-60\" y=\"8\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">inaction</text>\n      <text x=\"-60\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">치료 거부 · 부작위</text>\n\n      <!-- = 부호 -->\n      <line x1=\"-7\" y1=\"-5\" x2=\"7\" y2=\"-5\" stroke=\"#1FA34A\" stroke-width=\"2.5\"/>\n      <line x1=\"-7\" y1=\"5\" x2=\"7\" y2=\"5\" stroke=\"#1FA34A\" stroke-width=\"2.5\"/>\n\n      <!-- 우측: active decision -->\n      <rect x=\"10\" y=\"-22\" width=\"100\" height=\"44\" rx=\"4\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/>\n      <text x=\"60\" y=\"-5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">active decision</text>\n      <text x=\"60\" y=\"8\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">a management call</text>\n      <text x=\"60\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">관리 결정의 일종</text>\n    </g>\n\n    <!-- 아래 = irresponsible -->\n    <g transform=\"translate(445, 180)\">\n      <rect x=\"-110\" y=\"-12\" width=\"220\" height=\"26\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"-1\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">→ irresponsible to refuse</text>\n      <text x=\"0\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">방관도 책임이 따른다</text>\n    </g>\n\n    <text x=\"445\" y=\"226\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">applies to environment · policy · management</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"262\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">choosing not to act is still choosing</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '생태 능력 유지 = 지속적 개입 필요'이고, 마지막은 '‘아무것도 안 함’도 하나의 관리 결정이다'로 정리된다."}]};

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

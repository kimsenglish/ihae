features</text>\n  </g>\n\n  <!-- 우측 박스 — 큰 방 (combined) -->\n  <g>\n    <text x=\"445\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">큰 방 — combined, weighted</text>\n    <rect x=\"310\" y=\"30\" width=\"270\" height=\"225\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 큰 방 평면도 (큰 직사각형) -->\n    <g transform=\"translate(445, 145)\">\n      <!-- 4 벽 (더 크게) -->\n      <rect x=\"-115\" y=\"-65\" width=\"230\" height=\"125\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n      <!-- 위쪽 벽 — blue wall (초록 줄무늬 + 초록 라벨) -->\n      <rect x=\"-115\" y=\"-65\" width=\"230\" height=\"7\" fill=\"#1FA34A\"/>\n      <g stroke=\"#f0faf3\" stroke-width=\"0.8\">\n        <line x1=\"-110\" y1=\"-65\" x2=\"-110\" y2=\"-58\"/>\n        <line x1=\"-100\" y1=\"-65\" x2=\"-100\" y2=\"-58\"/>\n        <line x1=\"-90\" y1=\"-65\" x2=\"-90\" y2=\"-58\"/>\n        <line x1=\"-80\" y1=\"-65\" x2=\"-80\" y2=\"-58\"/>\n        <line x1=\"-70\" y1=\"-65\" x2=\"-70\" y2=\"-58\"/>\n        <line x1=\"-60\" y1=\"-65\" x2=\"-60\" y2=\"-58\"/>\n        <line x1=\"-50\" y1=\"-65\" x2=\"-50\" y2=\"-58\"/>\n        <line x1=\"-40\" y1=\"-65\" x2=\"-40\" y2=\"-58\"/>\n        <line x1=\"-30\" y1=\"-65\" x2=\"-30\" y2=\"-58\"/>\n        <line x1=\"-20\" y1=\"-65\" x2=\"-20\" y2=\"-58\"/>\n        <line x1=\"-10\" y1=\"-65\" x2=\"-10\" y2=\"-58\"/>\n        <line x1=\"0\" y1=\"-65\" x2=\"0\" y2=\"-58\"/>\n        <line x1=\"10\" y1=\"-65\" x2=\"10\" y2=\"-58\"/>\n        <line x1=\"20\" y1=\"-65\" x2=\"20\" y2=\"-58\"/>\n        <line x1=\"30\" y1=\"-65\" x2=\"30\" y2=\"-58\"/>\n        <line x1=\"40\" y1=\"-65\" x2=\"40\" y2=\"-58\"/>\n        <line x1=\"50\" y1=\"-65\" x2=\"50\" y2=\"-58\"/>\n        <line x1=\"60\" y1=\"-65\" x2=\"60\" y2=\"-58\"/>\n        <line x1=\"70\" y1=\"-65\" x2=\"70\" y2=\"-58\"/>\n        <line x1=\"80\" y1=\"-65\" x2=\"80\" y2=\"-58\"/>\n        <line x1=\"90\" y1=\"-65\" x2=\"90\" y2=\"-58\"/>\n        <line x1=\"100\" y1=\"-65\" x2=\"100\" y2=\"-58\"/>\n        <line x1=\"110\" y1=\"-65\" x2=\"110\" y2=\"-58\"/>\n      </g>\n      <!-- \"blue wall\" 라벨 + ✓ -->\n      <text x=\"0\" y=\"-77\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">blue wall</text>\n      <g transform=\"translate(125, -61)\">\n        <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#1FA34A\"/>\n        <path d=\"M -3 0 L -0.5 2.5 L 3.5 -2\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.7\"/>\n      </g>\n\n      <!-- 가운데 어린이 stick figure -->\n      <g>\n        <circle cx=\"0\" cy=\"-2\" r=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n        <circle cx=\"-2\" cy=\"-3\" r=\"0.8\" fill=\"#1a1a1a\"/>\n        <circle cx=\"2\" cy=\"-3\" r=\"0.8\" fill=\"#1a1a1a\"/>\n        <path d=\"M -2 1 Q 0 3 2 1\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n        <line x1=\"0\" y1=\"5\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <line x1=\"0\" y1=\"11\" x2=\"-7\" y2=\"17\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <line x1=\"0\" y1=\"11\" x2=\"7\" y2=\"17\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <line x1=\"0\" y1=\"22\" x2=\"-5\" y2=\"35\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <line x1=\"0\" y1=\"22\" x2=\"5\" y2=\"35\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      </g>\n\n      <!-- 두 가지 정보 화살표 -->\n      <!-- geometry: 4 코너 -->\n      <g stroke=\"#1FA34A\" stroke-width=\"1.2\" fill=\"none\" stroke-dasharray=\"2 2\" opacity=\"0.55\">\n        <line x1=\"0\" y1=\"-2\" x2=\"-110\" y2=\"-55\"/>\n        <line x1=\"0\" y1=\"-2\" x2=\"110\" y2=\"-55\"/>\n        <line x1=\"0\" y1=\"-2\" x2=\"-110\" y2=\"52\"/>\n        <line x1=\"0\" y1=\"-2\" x2=\"110\" y2=\"52\"/>\n      </g>\n      <!-- blue wall direct 화살표 (위쪽 벽으로 굵게) -->\n      <line x1=\"0\" y1=\"-10\" x2=\"0\" y2=\"-52\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <polygon points=\"0,-52 -4,-45 4,-45\" fill=\"#1FA34A\"/>\n      <text x=\"20\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#1FA34A\" font-weight=\"700\">+ landmark</text>\n\n      <!-- 라벨 (방 아래) -->\n      <text x=\"0\" y=\"80\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">geometry + blue wall · weighted</text>\n      <text x=\"0\" y=\"92\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">두 정보 가중 결합</text>\n    </g>\n\n    <text x=\"445\" y=\"247\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">geometry privileged (stable) · nongeometric · ecological validity</text>\n  </g>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '‘기하학(모양)’ 정보에만 의존'이고, 마지막은 '가까운 랜드마크에 더 가중 (Weber 법칙)'로 정리된다."}, {"no": "12", "title": "Autonomy: Why AI Must Learn", "ktitle": "진짜 ‘자율’ 에이전트는 학습한다", "field": "AI·과학", "page": "기출 예제 02", "oneline": "설계자의 사전 지식에만 의존하면 ‘자율성 부족’이다.", "tldr": ["설계자의 사전 지식에만 의존하면 ‘자율성 부족’이다.", "합리적 에이전트는 부족·틀린 지식을 ‘학습’으로 보완해야 한다.", "진화처럼 ‘초기 지식 + 학습 능력’을 주면 다양한 환경에서 성공한다."], "analogy": "갓 태어난 동물도 본능(초기 지식)은 있지만, 살면서 ‘스스로 배워야’ 살아남죠. AI도 처음 약간의 지식을 주되, 경험으로 배우게 해야 진짜 똑똑해져요.", "bg": "분야는 AI·과학이에요. 핵심 개념은 ‘자율성(autonomy)’ — 설계자의 사전 지식에만 의존하면 자율성이 부족하다는 것. → AI가 왜 ‘스스로 학습’해야 하는지에 주목하며 읽으세요.", "flow": [{"kind": "정의", "t": "설계자 지식에만 의존 = ‘자율성 부족’"}, {"kind": "원칙", "t": "합리적 에이전트 = 학습으로 부족·오류 보완", "d": "먼지 예측 청소기 > 못 하는 청소기."}, {"kind": "현실", "t": "처음엔 완전 자율 불필요 → 약간의 도움 필요"}, {"kind": "비유", "t": "진화: 본능(반사) + 스스로 학습", "d": "초기 지식 + 학습 능력."}, {"kind": "결론", "t": "학습 통합 → 하나의 에이전트가 다양한 환경서 성공"}], "quiz": [["에이전트가 ‘자율성이 부족하다’는 것은?", "자신이 지각한 것보다 설계자의 사전 지식에만 의존하는 상태예요."], ["진화 비유가 말하는 설계 원칙은?", "동물에게 본능(반사)을 주듯, AI에게도 ‘초기 지식 + 스스로 학습할 능력’을 함께 줘야 한다는 거예요."], ["핵심 한 문장?", "합리적 에이전트는 사전 지식을 학습으로 보완해야 하며, 그래야 다양한 환경에서 성공한다."]], "vocab": [["agent", "에이전트·행위자"], ["autonomy", "자율성"], ["percept", "지각한 내용"], ["compensate for", "~을 보완하다"], ["foresee", "예측하다"], ["reflex", "반사 (신경)"], ["incorporation", "통합·포함"]], "en": "To the extent that an agent relies on the prior knowledge of its designer rather than on its own percepts, we say that the agent lacks autonomy. A rational agent should be autonomous ― it should learn what it can to compensate for partial or incorrect prior knowledge. For example, a vacuum-cleaning agent that learns to foresee where and when additional dirt will appear will do better than one that does not. As a practical matter, one seldom requires complete autonomy from the start: when the agent has had little or no experience, it would have to act randomly unless the designer gave some assistance. So, just as evolution provides animals with enough built-in reflexes to survive long enough to learn for themselves, it would be reasonable to provide an artificial intelligent agent with some initial knowledge as well as an ability to learn. After sufficient experience of its environment, the behavior of a rational agent can become effectively independent of its prior knowledge. Hence, the incorporation of learning allows one to design a single rational agent that will succeed in a vast variety of environments.", "ko": "에이전트가 자신이 지각한 내용보다 설계자의 사전 지식에 의존하는 경우, 우리는 그 에이전트가 자율성이 부족하다고 말한다. 합리적 에이전트는 자율적이어야 하는데, 불완전하거나 부정확한 사전 지식을 보완할 수 있도록 학습할 수 있는 것을 학습해야 한다. 예를 들어, 또 다른 먼지가 어디에서 그리고 언제 나타날지 예측하는 방법을 학습하는 진공 청소 에이전트는 그렇게 하지 않는 것보다 더 잘할 것이다. 현실적으로는 처음부터 완전한 자율성이 거의 필요하지 않은데, 에이전트가 경험이 거의 없거나 전혀 없을 때, 설계자가 약간의 지원을 제공하지 않는다면, 그것은 임의로 작동해야 할 것이다. 따라서 진화가 동물이 스스로 학습할 수 있을 만큼 충분히 오래 생존할 수 있도록 필요한 만큼의 타고난 반사 신경을 제공하는 것처럼, 인공 지능 에이전트에게 학습할 수 있는 능력뿐만 아니라 약간의 초기 지식을 제공하는 것이 합리적일 것이다. 환경을 충분히 경험한 후, 합리적인 에이전트의 행동은 사전 지식으로부터 사실상 독립할 수 있다. 따라서 학습의 통합은 아주 다양한 환경에서 성공할 하나의 합리적 에이전트를 설계할 수 있게 한다.", "read": [{"en": "To the extent that an agent relies on the prior knowledge of its designer rather than on its own percepts, we say that the agent lacks autonomy.", "ko": "에이전트가 자신이 지각한 내용보다 설계자의 사전 지식에 의존하는 정도까지, 우리는 그 에이전트가 자율성이 부족하다고 말한다.", "chunks": [["To the extent that an agent relies", "에이전트가 의존하는 정도까지"], ["on the prior knowledge of its designer", "설계자의 사전 지식에"], ["rather than on its own percepts,", "자신이 지각한 내용보다는,"], ["we say that the agent lacks autonomy.", "우리는 그 에이전트가 자율성이 부족하다고 말한다."]]}, {"en": "A rational agent should be autonomous ― it should learn what it can to compensate for partial or incorrect prior knowledge.", "ko": "합리적 에이전트는 자율적이어야 하는데, 불완전하거나 부정확한 사전 지식을 보완할 수 있도록 학습할 수 있는 것을 학습해야 한다.", "chunks": [["A rational agent should be autonomous ― it should learn what it can to compensate for partial or incorrect prior knowledge.", "합리적 에이전트는 자율적이어야 하는데, 불완전하거나 부정확한 사전 지식을 보완할 수 있도록 학습할 수 있는 것을 학습해야 한다."]]}, {"en": "For example, a vacuum-cleaning agent that learns to foresee where and when additional dirt will appear will do better than one that does not.", "ko": "예를 들어, 추가 먼지가 어디에서 그리고 언제 나타날지 예측하는 법을 학습하는 진공청소기 에이전트는 그렇지 않은 것보다 더 잘할 것이다.", "chunks": [["For example, a vacuum-cleaning agent", "예를 들어, 진공청소기 에이전트는"], ["that learns to foresee", "예측하는 법을 학습하는"], ["where and when additional dirt will appear", "추가 먼지가 어디에서 그리고 언제 나타날지"], ["will do better than one that does not.", "그렇지 않은 것보다 더 잘할 것이다."]]}, {"en": "As a practical matter, one seldom requires complete autonomy from the start: when the agent has had little or no experience, it would have to act randomly unless the designer gave some assistance.", "ko": "실용적으로는 처음부터 완전한 자율성이 거의 필요하지 않다. 즉 에이전트가 경험이 거의 없거나 전혀 없을 때, 설계자가 약간의 지원을 제공하지 않는다면 그것은 임의로 작동해야 할 것이다.", "chunks": [["As a practical matter,", "실용적으로,"], ["one seldom requires complete autonomy", "완전한 자율성이 거의 필요하지 않다"], ["from the start:", "처음부터:"], ["when the agent has had little or no experience,", "에이전트가 경험이 거의 또는 전혀 없을 때,"], ["it would have to act randomly", "그것은 무작위로 행동해야 할 것이다"], ["unless the designer gave some assistance.", "설계자가 약간의 도움을 주지 않는다면."]]}, {"en": "So, just as evolution provides animals with enough built-in reflexes to survive long enough to learn for themselves, it would be reasonable to provide an artificial intelligent agent with some initial knowledge as well as an ability to learn.", "ko": "따라서 진화가 동물에게 스스로 학습할 만큼 충분히 오래 생존하도록 충분한 내장된 반사 능력을 제공하는 것처럼, 인공 지능 에이전트에게 학습할 수 있는 능력뿐만 아니라 약간의 초기 지식을 제공하는 것이 합리적일 것이다.", "chunks": [["So, just as evolution provides animals", "따라서, 진화가 동물에게 제공하는 것처럼"], ["with enough built-in reflexes", "충분한 내장된 반사 능력을"], ["to survive long enough", "충분히 오래 생존할 수 있을 만큼"], ["to learn for themselves,", "스스로 학습할 만큼,"], ["it would be reasonable to provide", "제공하는 것이 합리적일 것이다"], ["an artificial intelligent agent", "인공 지능 에이전트에게"], ["with some initial knowledge", "약간의 초기 지식을"], ["as well as an ability to learn.", "학습할 수 있는 능력뿐만 아니라."]]}, {"en": "After sufficient experience of its environment, the behavior of a rational agent can become effectively independent of its prior knowledge.", "ko": "환경에 대한 충분한 경험 후, 합리적 에이전트의 행동은 사전 지식으로부터 사실상 독립적일 수 있다.", "chunks": [["After sufficient experience of its environment,", "환경에 대한 충분한 경험 후,"], ["the behavior of a rational agent", "합리적 에이전트의 행동은"], ["can become effectively independent", "사실상 독립적일 수 있다"], ["of its prior knowledge.", "사전 지식으로부터."]]}, {"en": "Hence, the incorporation of learning allows one to design a single rational agent that will succeed in a vast variety of environments.", "ko": "따라서 학습의 통합은 아주 다양한 환경에서 성공할 하나의 합리적 에이전트를 설계할 수 있게 한다.", "chunks": [["Hence,", "따라서,"], ["the incorporation of learning", "학습의 통합은"], ["allows one to design", "설계할 수 있게 한다"], ["a single rational agent", "하나의 합리적 에이전트를"], ["that will succeed in a vast variety of environments.", "아주 다양한 환경에서 성공할."]]}], "metaphor": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: initial knowledge 박스 (책 아이콘 + designer's prior). 가운데 + 부호. 오른쪽 1: learning ability 박스 (순환 화살표 + from environment). 가운데 = 부호. 오른쪽 2: autonomous rational agent 박스 (로봇 + universal·adaptive)의 합성 수식 그림.\">\n  <!-- 박스 1: Initial Knowledge -->\n  <g>\n    <text x=\"100\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\">초기 지식</text>\n    <rect x=\"20\" y=\"32\" width=\"160\" height=\"160\" rx=\"6\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.5\"/>\n    <!-- 아이콘: 책 -->\n    <g transform=\"translate(100, 95)\">\n      <!-- 책 그림자 -->\n      <rect x=\"-30\" y=\"-22\" width=\"60\" height=\"44\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"0.8\"/>\n      <!-- 왼쪽 페이지 -->\n      <path d=\"M -28,-20 L 0,-22 L 0,22 L -28,20 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 오른쪽 페이지 -->\n      <path d=\"M 0,-22 L 28,-20 L 28,20 L 0,22 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 책등 -->\n      <line x1=\"0\" y1=\"-22\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 페이지 텍스트 -->\n      <line x1=\"-24\" y1=\"-13\" x2=\"-4\" y2=\"-14\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <line x1=\"-24\" y1=\"-7\" x2=\"-4\" y2=\"-8\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <line x1=\"-24\" y1=\"-1\" x2=\"-4\" y2=\"-2\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <line x1=\"-24\" y1=\"14\" x2=\"-4\" y2=\"15\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <line x1=\"4\" y1=\"-13\" x2=\"24\" y2=\"-14\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <line x1=\"4\" y1=\"-7\" x2=\"24\" y2=\"-8\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <line x1=\"4\" y1=\"-1\" x2=\"24\" y2=\"-2\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <line x1=\"4\" y1=\"14\" x2=\"24\" y2=\"15\" stroke=\"#999\" stroke-width=\"0.6\"/>\n    </g>\n    <!-- 라벨 박스 안 -->\n    <text x=\"100\" y=\"155\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">initial knowledge</text>\n    <text x=\"100\" y=\"173\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">designer's prior</text>\n  </g>\n\n  <!-- + 부호 -->\n  <g transform=\"translate(195, 112)\">\n    <text x=\"0\" y=\"6\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"28\" text-anchor=\"middle\" fill=\"#1a1a1a\">+</text>\n  </g>\n\n  <!-- 박스 2: Learning Ability -->\n  <g>\n    <text x=\"290\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\">학습 능력</text>\n    <rect x=\"210\" y=\"32\" width=\"160\" height=\"160\" rx=\"6\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.5\"/>\n    <!-- 아이콘: 순환 화살표 (feedback loop) -->\n    <g transform=\"translate(290, 95)\">\n      <!-- 원형 화살표 -->\n      <path d=\"M -25,0 A 25,25 0 1,1 25,0\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2.2\"/>\n      <polygon points=\"25,0 19,-6 19,6\" fill=\"#1a1a1a\"/>\n      <path d=\"M 25,2 A 25,25 0 0,1 -25,2\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2.2\" stroke-dasharray=\"2 2\"/>\n      <!-- 가운데 -->\n      <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">try</text>\n      <text x=\"0\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">→ adjust</text>\n    </g>\n    <!-- 라벨 박스 안 -->\n    <text x=\"290\" y=\"155\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">learning ability</text>\n    <text x=\"290\" y=\"173\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">from environment</text>\n  </g>\n\n  <!-- = 부호 -->\n  <g transform=\"translate(385, 112)\">\n    <line x1=\"-10\" y1=\"-5\" x2=\"10\" y2=\"-5\" stroke=\"#1FA34A\" stroke-width=\"2.5\"/>\n    <line x1=\"-10\" y1=\"5\" x2=\"10\" y2=\"5\" stroke=\"#1FA34A\" stroke-width=\"2.5\"/>\n  </g>\n\n  <!-- 박스 3: Autonomous Rational Agent -->\n  <g>\n    <text x=\"490\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\">자율적 합리 에이전트</text>\n    <rect x=\"400\" y=\"32\" width=\"180\" height=\"160\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <!-- 아이콘: agent (로봇 + 환경 인식 안테나) -->\n    <g transform=\"translate(490, 95)\">\n      <!-- 안테나 -->\n      <line x1=\"-8\" y1=\"-32\" x2=\"-8\" y2=\"-25\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <circle cx=\"-8\" cy=\"-34\" r=\"2.5\" fill=\"#1FA34A\"/>\n      <line x1=\"8\" y1=\"-32\" x2=\"8\" y2=\"-25\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <circle cx=\"8\" cy=\"-34\" r=\"2.5\" fill=\"#1FA34A\"/>\n      <!-- 머리 (사각형) -->\n      <rect x=\"-15\" y=\"-25\" width=\"30\" height=\"22\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 눈 (사각형 픽셀) -->\n      <rect x=\"-9\" y=\"-19\" width=\"5\" height=\"5\" fill=\"#1FA34A\"/>\n      <rect x=\"4\" y=\"-19\" width=\"5\" height=\"5\" fill=\"#1FA34A\"/>\n      <!-- 입 (가는 사각형) -->\n      <rect x=\"-6\" y=\"-9\" width=\"12\" height=\"2\" fill=\"#1a1a1a\"/>\n      <!-- 목 -->\n      <line x1=\"0\" y1=\"-3\" x2=\"0\" y2=\"3\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 몸 (사각형) -->\n      <rect x=\"-18\" y=\"3\" width=\"36\" height=\"28\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 가슴 - 표시 (control panel) -->\n      <circle cx=\"-8\" cy=\"14\" r=\"2\" fill=\"#c8102e\"/>\n      <circle cx=\"0\" cy=\"14\" r=\"2\" fill=\"#1FA34A\"/>\n      <circle cx=\"8\" cy=\"14\" r=\"2\" fill=\"#999\"/>\n      <rect x=\"-12\" y=\"22\" width=\"24\" height=\"4\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n      <!-- 팔 -->\n      <line x1=\"-18\" y1=\"9\" x2=\"-26\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <line x1=\"18\" y1=\"9\" x2=\"26\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 다리 -->\n      <line x1=\"-9\" y1=\"31\" x2=\"-9\" y2=\"44\" stroke=\"#1a1a1a\" stroke-width=\"1.7\"/>\n      <line x1=\"9\" y1=\"31\" x2=\"9\" y2=\"44\" stroke=\"#1a1a1a\" stroke-width=\"1.7\"/>\n      <rect x=\"-13\" y=\"44\" width=\"9\" height=\"3\" fill=\"#1a1a1a\"/>\n      <rect x=\"4\" y=\"44\" width=\"9\" height=\"3\" fill=\"#1a1a1a\"/>\n    </g>\n    <!-- 라벨 박스 안 -->\n    <text x=\"490\" y=\"160\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">autonomous agent</text>\n    <text x=\"490\" y=\"176\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">universal · adaptive</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"218\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">like animal evolution — reflexes + learning</text>\n  <text x=\"300\" y=\"232\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">동물 진화 유비 — 반사 + 학습</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '설계자 지식에만 의존 = ‘자율성 부족’'이고, 마지막은 '학습 통합 → 하나의 에이전트가 다양한 환경서 성공'로 정리된다."}, {"no": "13", "title": "Predicting Where Music Goes", "ktitle": "음악 ‘예측력’은 익숙함에서 온다", "field": "음악·인지", "page": "no.01", "oneline": "음악이 어디로 갈지 ‘예측’하는 능력은 양식·구조 이해에 달렸다.", "tldr": ["음악이 어디로 갈지 ‘예측’하는 능력은 양식·구조 이해에 달렸다.", "같은 작곡가 곡을 익히면 새 곡도 더 정확히 초견 연주한다.", "바흐 합창곡 변형 실험: 기대를 어기면 초견 정확도가 손상된다."], "analogy": "좋아하는 작가의 책을 여러 권 읽으면 ‘다음에 이렇게 흘러가겠지’ 예상이 되죠. 음악도 같은 작곡가에 익숙해지면 처음 보는 악보도 더 잘 짚어 연주해요.", "bg": "분야는 음악·인지예요. 음악이 어디로 갈지 ‘예측’하는 능력이 양식·구조 이해에 달렸다는 것이 핵심. → 그 예측 능력이 무엇에서 나오는지에 주목하며 읽으세요.", "flow": [{"kind": "질문", "t": "예측·패턴 인식 능력은 어떻게 길러지나?"}, {"kind": "근거", "t": "양식·구조·화음·악구 이해 ↑ → 예측 ↑"}, {"kind": "효과", "t": "같은 작곡가에 익숙 → 새 곡 초견 정확도↑", "d": "낯선 작곡가는 더 어려움."}, {"kind": "실험", "t": "바흐 합창곡 선율·화성 변형 → 초견 성과 손상"}, {"kind": "결론", "t": "기대(축적 지식)를 어기면 초견 정확도가 떨어진다"}], "quiz": [["음악의 ‘예측력’은 무엇에 달려 있나?", "음악 양식·구조·화음·악구를 얼마나 잘 이해하는지, 즉 축적된 경험에 달려 있어요."], ["바흐 합창곡 실험이 보여준 것은?", "선율을 바꾸고 화성을 흐트러뜨려 ‘기대를 어기자’ 노련한 합창단원의 초견 성과가 손상됐어요."], ["핵심 한 문장?", "음악 예측·초견 능력은 양식에 대한 익숙함에서 나오며, 그 기대를 어기면 정확도가 떨어진다."]], "vocab": [["pattern recognition", "패턴 인식"], ["sight-read", "초견으로 연주하다"], ["harmony", "화음·화성"], ["phrasing", "악구 나누기"], ["accumulated", "축적된"], ["chorale", "합창곡·찬송가"], ["violate", "어기다·위반하다"]], "en": "How can pattern recognition and prediction skills be developed? The ability to \"guess\" or predict where the music is likely to go is dependent on how well the musician understands the different musical styles and their structure, typical formulas, harmony, and phrasing. Musicians are more likely to sight-read a new piece by the same composer with a higher level of accuracy when they become familiar with the composer's melodic shapes, choices of harmony, and compositional style from having learned other pieces by the same composer. This is because accumulated experience allows musicians to predict upcoming material when reading a new (yet similar) work for the first time. Similarly, musicians will have more difficulty in sight-reading a work by a composer they have never played before. This point has also been shown in choral singing, where, in one study, altering the melody and disrupting the underlying harmony in four obscure Bach chorales damaged the sight-singing performance of experienced choral singers. This type of finding suggests that musical accomplishment leads to the accumulation of knowledge of melodic patterns and harmony relevant to a particular musical period/style and that these play an important role in sight-reading performance. Violating these expectations affects the accuracy of sight-reading.", "ko": "패턴 인식 및 예측 능력은 어떻게 개발될 수 있는가? 음악이 어떻게 전개될지를 '추측하'거나 예측하는 능력은 음악가가 다양한 음악 스타일과 그 구조, 전형적인 공식, 화음, 그리고 악구를 나누는 것을 얼마나 잘 이해하는지에 달려 있다. 음악가는 동일한 작곡가의 다른 곡들을 배워서 그 작곡가의 선율 형태, 화음 선택, 그리고 작곡 스타일에 익숙해지면 동일 작곡가의 새로운 곡을 더 높은 수준의 정확성으로 악보를 처음 보면서 연주할 가능성이 더 크다. 이는 음악가가 축적된 경험으로 새로운 (하지만 유사한) 곡을 처음 읽을 때 이어지는 (곡의) 내용을 예측할 수 있게 하기 때문이다. 마찬가지로, 음악가는 이전에 연주해 본 적이 없는 작곡가의 작품을 악보를 처음 보면서 연주하는 데 더 많은 어려움을 겪을 것이다. 이 점은 합창에서도 확인된 바 있는데, 한 연구에서, 잘 알려지지 않은 바흐의 합창곡 찬송가 네 곡에서 선율을 바꾸고 기본 화성을 방해했더니, 노련한 합창단원들의 악보를 처음 보면서 부르는 성과가 손상되었다. 이러한 유형의 연구 결과는 음악적 성과가 특정한 음악 시대/양식과 관련된 선율 패턴과 화음에 대한 지식의 축적으로 이어지며, 이것들이 악보를 처음 보면서 연주하는 데 중요한 역할을 한다는 것을 시사한다. 이러한 기대를 어기는 것은 악보를 처음 보면서 연주하는 정확도에 영향을 미친다.", "read": [{"en": "How can pattern recognition and prediction skills be developed?", "ko": "패턴 인식 및 예측 능력은 어떻게 개발될 수 있는가?", "chunks": [["How can pattern recognition and prediction skills", "패턴 인식 및 예측 능력은 어떻게"], ["be developed?", "개발될 수 있는가?"]]}, {"en": "The ability to \"guess\" or predict where the music is likely to go is dependent on how well the musician understands the different musical styles and their structure, typical formulas, harmony, and phrasing.", "ko": "음악이 어떻게 전개될지를 '추측'하거나 예측하는 능력은 음악가가 다양한 음악 스타일과 그 구조, 전형적인 공식, 화음, 그리고 악구를 나누는 것을 얼마나 잘 이해하는지에 달려 있다.", "chunks": [["The ability to \"guess\" or predict", "'추측'하거나 예측하는 능력은"], ["where the music is likely to go", "음악이 어떻게 전개될지"], ["is dependent on", "~에 달려 있다"], ["how well the musician understands", "음악가가 얼마나 잘 이해하는지에"], ["the different musical styles and their structure,", "다양한 음악 스타일과 그 구조,"], ["typical formulas, harmony, and phrasing.", "전형적인 공식, 화음, 악구 나누기를."]]}, {"en": "Musicians are more likely to sight-read a new piece by the same composer with a higher level of accuracy when they become familiar with the composer's melodic shapes, choices of harmony, and compositional style from having learned other pieces by the same composer.", "ko": "음악가는 동일한 작곡가의 다른 곡들을 배워서 그 작곡가의 선율 형태, 화음 선택, 그리고 작곡 스타일에 익숙해지면 동일 작곡가의 새로운 곡을 더 높은 수준의 정확성으로 악보를 처음 보면서 연주할 가능성이 더 크다.", "chunks": [["Musicians are more likely to sight-read", "음악가는 악보를 처음 보면서 연주할 가능성이 더 크다"], ["a new piece by the same composer", "동일한 작곡가의 새로운 곡을"], ["with a higher level of accuracy", "더 높은 수준의 정확성으로"], ["when they become familiar with the composer's", "그 작곡가의 ~에 익숙해지면"], ["melodic shapes, choices of harmony, and compositional style", "선율 형태, 화음 선택, 그리고 작곡 스타일에"], ["from having learned other pieces by the same composer.", "동일한 작곡가의 다른 곡들을 배워서."]]}, {"en": "This is because accumulated experience allows musicians to predict upcoming material when reading a new (yet similar) work for the first time.", "ko": "이는 음악가가 축적된 경험으로 새로운 (하지만 유사한) 곡을 처음 읽을 때 이어지는 (곡의) 내용을 예측할 수 있게 하기 때문이다.", "chunks": [["This is because accumulated experience", "이는 축적된 경험이"], ["allows musicians to predict upcoming material", "음악가가 이어지는 내용을 예측할 수 있게 하기 때문이다"], ["when reading a new (yet similar) work", "새로운 (그러나 유사한) 곡을 읽을 때"], ["for the first time.", "처음으로."]]}, {"en": "Similarly, musicians will have more difficulty in sight-reading a work by a composer they have never played before.", "ko": "마찬가지로, 음악가는 이전에 연주해 본 적이 없는 작곡가의 작품을 악보를 처음 보면서 연주하는 데 더 많은 어려움을 겪을 것이다.", "chunks": [["Similarly, musicians will have more difficulty", "마찬가지로, 음악가는 더 많은 어려움을 겪을 것이다"], ["in sight-reading a work", "곡을 sight-reading하는 데"], ["by a composer they have never played before.", "이전에 연주해 본 적이 없는 작곡가의."]]}, {"en": "This point has also been shown in choral singing, where, in one study, altering the melody and disrupting the underlying harmony in four obscure Bach chorales damaged the sight-singing performance of experienced choral singers.", "ko": "이 점은 합창에서도 확인된 바 있는데, 한 연구에서, 잘 알려지지 않은 바흐의 합창곡 찬송가 네 곡에서 선율을 바꾸고 기본 화성을 방해했더니, 노련한 합창단원들의 악보를 처음 보면서 부르는 성과가 손상되었다.", "chunks": [["This point has also been shown in choral singing,", "이 점은 합창에서도 확인된 바 있는데,"], ["where, in one study,", "한 연구에서,"], ["altering the melody and disrupting the underlying harmony", "선율을 바꾸고 기저 화성을 방해하는 것이"], ["in four obscure Bach chorales", "잘 알려지지 않은 바흐의 합창곡 찬송가 네 곡에서"], ["damaged the sight-singing performance", "악보를 처음 보면서 부르는 성과를 손상시켰다"], ["of experienced choral singers.", "노련한 합창단원들의."]]}, {"en": "This type of finding suggests that musical accomplishment leads to the accumulation of knowledge of melodic patterns and harmony relevant to a particular musical period/style and that these play an important role in sight-reading performance.", "ko": "이러한 유형의 연구 결과는 음악적 성과가 특정한 음악 시대/양식과 관련된 선율 패턴과 화음에 대한 지식의 축적으로 이어지며, 이것들이 악보를 처음 보면서 연주하는 데 중요한 역할을 한다는 것을 시사한다.", "chunks": [["This type of finding suggests", "이러한 유형의 연구 결과는 시사한다"], ["that musical accomplishment leads to", "음악적 성과가 ~로 이어지며"], ["the accumulation of knowledge", "지식의 축적"], ["of melodic patterns and harmony", "선율 패턴과 화음에 대한"], ["relevant to a particular musical period/style", "특정 음악 시대/양식과 관련된"], ["and that these play an important role", "그리고 이것들이 중요한 역할을 한다"], ["in sight-reading performance.", "sight-reading 성과에서."]]}, {"en": "Violating these expectations affects the accuracy of sight-reading.", "ko": "이러한 기대를 어기는 것은 악보를 처음 보면서 연주하는 정확도에 영향을 미친다.", "chunks": [["Violating these expectations", "이러한 기대를 어기는 것은"], ["affects the accuracy of sight-reading.", "sight-reading의 정확도에 영향을 미친다."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 같은 작곡가 학습 박스 — 5선 악보에 음표 5개와 화음 패턴이 내재화되는 그림. 가운데 pattern recognition 화살표. 오른쪽: 새 곡 sight-reading 박스 — 5선 악보에 실선 음표 3개 + 점선 음표 2개로 다음 음 예측을 표시. 하단에 기대 위반 시 손상 경고.\">\n  <!-- 좌측 박스 — same composer 학습 -->\n  <g>\n    <text x=\"145\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">같은 작곡가 다수 학습</text>\n    <rect x=\"20\" y=\"30\" width=\"240\" height=\"190\" fill=\"#fdf2f4\" fill-opacity=\"0.18\" stroke=\"#999\" stroke-width=\"1.5\"/>\n\n    <!-- 5선 악보 -->\n    <g transform=\"translate(40, 100)\">\n      <!-- 5 staff lines -->\n      <line x1=\"0\" y1=\"0\" x2=\"200\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"8\" x2=\"200\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"16\" x2=\"200\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"24\" x2=\"200\" y2=\"24\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"32\" x2=\"200\" y2=\"32\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n\n      <!-- treble clef (단순 G 표시) -->\n      <text x=\"5\" y=\"28\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"32\" fill=\"#1a1a1a\">𝄞</text>\n\n      <!-- 박자표 -->\n      <text x=\"30\" y=\"14\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"11\" fill=\"#1a1a1a\">4</text>\n      <text x=\"30\" y=\"28\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"11\" fill=\"#1a1a1a\">4</text>\n\n      <!-- 음표 5개 (학습된 패턴, 실선) -->\n      <g>\n        <!-- 음표 1 -->\n        <ellipse cx=\"55\" cy=\"20\" rx=\"4.5\" ry=\"3.2\" fill=\"#1a1a1a\" transform=\"rotate(-15 55 20)\"/>\n        <line x1=\"59\" y1=\"20\" x2=\"59\" y2=\"2\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <!-- 음표 2 -->\n        <ellipse cx=\"80\" cy=\"16\" rx=\"4.5\" ry=\"3.2\" fill=\"#1a1a1a\" transform=\"rotate(-15 80 16)\"/>\n        <line x1=\"84\" y1=\"16\" x2=\"84\" y2=\"-2\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <!-- 음표 3 -->\n        <ellipse cx=\"105\" cy=\"12\" rx=\"4.5\" ry=\"3.2\" fill=\"#1a1a1a\" transform=\"rotate(-15 105 12)\"/>\n        <line x1=\"109\" y1=\"12\" x2=\"109\" y2=\"-6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <!-- 음표 4 -->\n        <ellipse cx=\"130\" cy=\"16\" rx=\"4.5\" ry=\"3.2\" fill=\"#1a1a1a\" transform=\"rotate(-15 130 16)\"/>\n        <line x1=\"134\" y1=\"16\" x2=\"134\" y2=\"-2\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <!-- 음표 5 -->\n        <ellipse cx=\"155\" cy=\"20\" rx=\"4.5\" ry=\"3.2\" fill=\"#1a1a1a\" transform=\"rotate(-15 155 20)\"/>\n        <line x1=\"159\" y1=\"20\" x2=\"159\" y2=\"2\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <!-- 음표 6 -->\n        <ellipse cx=\"180\" cy=\"24\" rx=\"4.5\" ry=\"3.2\" fill=\"#1a1a1a\" transform=\"rotate(-15 180 24)\"/>\n        <line x1=\"184\" y1=\"24\" x2=\"184\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      </g>\n\n      <!-- 패턴 표시 (음표 위 곡선 = phrase) -->\n      <path d=\"M 50 -8 Q 110 -18 185 -8\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"115\" y=\"-23\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">phrasing · style</text>\n    </g>\n\n    <!-- 라벨: internalize -->\n    <g transform=\"translate(140, 175)\">\n      <rect x=\"-80\" y=\"-12\" width=\"160\" height=\"28\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">harmony · melodic shapes</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">화성·선율·작곡 스타일</text>\n    </g>\n  </g>\n\n  <!-- 가운데 화살표 -->\n  <g transform=\"translate(265, 125)\">\n    <text x=\"35\" y=\"-20\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">pattern</text>\n    <text x=\"35\" y=\"-8\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">recognition</text>\n    <line x1=\"0\" y1=\"0\" x2=\"65\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"65,0 57,-5 57,5\" fill=\"#1FA34A\"/>\n    <text x=\"35\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">패턴 내재화</text>\n  </g>\n\n  <!-- 우측 박스 — new piece sight-reading -->\n  <g>\n    <text x=\"465\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">새 곡 — sight-reading 정확도 ↑</text>\n    <rect x=\"340\" y=\"30\" width=\"240\" height=\"190\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 5선 악보 (새 곡) -->\n    <g transform=\"translate(360, 100)\">\n      <line x1=\"0\" y1=\"0\" x2=\"200\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"8\" x2=\"200\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"16\" x2=\"200\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"24\" x2=\"200\" y2=\"24\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"32\" x2=\"200\" y2=\"32\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n\n      <text x=\"5\" y=\"28\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"32\" fill=\"#1a1a1a\">𝄞</text>\n\n      <text x=\"30\" y=\"14\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"11\" fill=\"#1a1a1a\">4</text>\n      <text x=\"30\" y=\"28\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"11\" fill=\"#1a1a1a\">4</text>\n\n      <!-- 실선 음표 3개 (보고 있는 음) -->\n      <g>\n        <ellipse cx=\"55\" cy=\"20\" rx=\"4.5\" ry=\"3.2\" fill=\"#1a1a1a\" transform=\"rotate(-15 55 20)\"/>\n        <line x1=\"59\" y1=\"20\" x2=\"59\" y2=\"2\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <ellipse cx=\"80\" cy=\"16\" rx=\"4.5\" ry=\"3.2\" fill=\"#1a1a1a\" transform=\"rotate(-15 80 16)\"/>\n        <line x1=\"84\" y1=\"16\" x2=\"84\" y2=\"-2\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <ellipse cx=\"105\" cy=\"12\" rx=\"4.5\" ry=\"3.2\" fill=\"#1a1a1a\" transform=\"rotate(-15 105 12)\"/>\n        <line x1=\"109\" y1=\"12\" x2=\"109\" y2=\"-6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      </g>\n\n      <!-- 점선 음표 2개 (예측·아직 안 본 음) -->\n      <g>\n        <ellipse cx=\"135\" cy=\"14\" rx=\"4.5\" ry=\"3.2\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.5\" stroke-dasharray=\"1.5 1\" transform=\"rotate(-15 135 14)\"/>\n        <line x1=\"139\" y1=\"14\" x2=\"139\" y2=\"-4\" stroke=\"#1FA34A\" stroke-width=\"1.3\" stroke-dasharray=\"2 1\"/>\n        <ellipse cx=\"165\" cy=\"18\" rx=\"4.5\" ry=\"3.2\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.5\" stroke-dasharray=\"1.5 1\" transform=\"rotate(-15 165 18)\"/>\n        <line x1=\"169\" y1=\"18\" x2=\"169\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.3\" stroke-dasharray=\"2 1\"/>\n      </g>\n\n      <!-- 예측 화살표 (실선 끝 → 점선 첫번째) -->\n      <g transform=\"translate(118, -10)\">\n        <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">predicted</text>\n      </g>\n    </g>\n\n    <!-- 라벨: 정확도 ↑ -->\n    <g transform=\"translate(460, 175)\">\n      <rect x=\"-90\" y=\"-12\" width=\"180\" height=\"28\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">predict next notes · accuracy ↑</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">다음 음 예측 · 정확도 ↑</text>\n    </g>\n  </g>\n\n  <!-- 하단 경고: 기대 위반 시 손상 -->\n  <g transform=\"translate(300, 240)\">\n    <rect x=\"-200\" y=\"-12\" width=\"400\" height=\"20\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"3 2\"/>\n    <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">⚠ choir study — expectation violated → performance strained</text>\n  </g>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '예측·패턴 인식 능력은 어떻게 길러지나?'이고, 마지막은 '기대(축적 지식)를 어기면 초견 정확도가 떨어진다'로 정리된다."}, {"no": "14", "title": "Why Fashion Knockoffs Are Legal", "ktitle": "패션 모방은 왜 합법인가", "field": "경제·법", "page": "no.02", "oneline": "패션 디자인 노동은 보호받지 못해 ‘모조품’이 합법이다.", "tldr": ["패션 디자인 노동은 보호받지 못해 ‘모조품’이 합법이다.", "많은 창의 분야는 ‘소유권 보상’보다 경쟁·혁신을 더 중시한다.", "음반업계는 로비로 소유권 법을 얻었지만 — 여론은 등 돌렸다."], "analogy": "요리 레시피나 코미디 개그를 베껴도 불법은 아니죠. 패션도 그래서 ‘활발한 경쟁’을 택했어요. 반대로 음반업계는 ‘내 것’ 법을 따냈지만, 3만 명을 고소하다 미움만 샀고요.", "bg": "분야는 경제·법이에요. 패션 디자인이 법적으로 보호받지 못해 ‘모조품(knockoff)’이 합법이라는 것이 출발점. → 보호 부재가 패션 산업에 어떤 영향을 주는지에 주목하며 읽으세요.", "flow": [{"kind": "사실", "t": "패션 디자인 노동은 보호 ✗ → 모조품 합법"}, {"kind": "선택", "t": "요리·코미디 등도 ‘경쟁·혁신 > 소유권 보상’"}, {"kind": "규칙", "t": "‘네가 뿌린 걸 내가 거둔다’ — 디자이너 로비 실패"}, {"kind": "대조", "t": "음반업계는 로비 성공 → 소유권 법 확보", "d": "3만 명 소송."}, {"kind": "결론", "t": "불법 다운로드는 못 막고 여론만 등 돌림"}], "quiz": [["패션업계가 ‘소유권’ 대신 택한 가치는?", "활발한 경쟁과 제한 없는 혁신 — 창의 노동을 소유권으로 보상하는 것보다 이를 더 중시했어요."], ["음반업계의 대응과 결과는?", "로비로 소유권 법을 얻어 3만 명 이상을 고소·위협했지만, 불법 다운로드는 못 막고 여론만 불리해졌어요."], ["핵심 한 문장?", "패션은 모방을 허용해 경쟁·혁신을 택했고, 소유권 법을 관철한 음반업계는 오히려 여론의 반감을 샀다."]], "vocab": [["fortune", "부·재산"], ["knockoff", "모조품·짝퉁"], ["theft", "절도"], ["reap", "거두다"], ["secure (legislation)", "(법률을) 확보하다"], ["file (legal action)", "(소송을) 제기하다"], ["popular opinion", "여론"]], "en": "In fashion, designers build fortunes based on copying each other's creations. The labor that goes into original dress designs is not protected. Knockoffs are not theft. They are perfectly legal. In many pockets of the modern economy ─ chefs' recipes, coaches' sports plays, stand-up comedians' routines, and numerous other creative arenas ─ we have decided that vibrant competition and unrestricted innovation matter more than rewarding creative labor with ownership. In other words, the rule is often I reap what you sow. Every year fashion designers push Congress to change the rules, so they can reap what they \"sew,\" but they lose. The music recording industry, on the other hand, was more effective than the high-end fashion houses at lobbying Congress. It secured legislation so that digital music conforms to the industry's ownership story. Based on that law, the industry has filed, settled, or threatened legal action against at least thirty thousand people. Unfortunately for the big music labels, all that activity hasn't ended illegal downloading ─ but it did turn popular opinion against them.", "ko": "패션 분야에서는 디자이너들이 서로의 창작물을 모방함으로써 부를 쌓아간다. 독창적인 드레스 디자인에 들어가는 노동은 보호받지 못한다. 모조품은 절도가 아니다. 그것들은 완전히 합법적이다. 요리사의 레시피, 코치의 스포츠 전략, 스탠드업 코미디언의 틀에 박힌 연기 그리고 수많은 다른 창의적 영역과 같은 현대 경제의 많은 분야에서 우리는 활발한 경쟁과 제한 없는 혁신이 창의적 노동에 대해 소유권으로 보상하는 것보다 더 중요하다고 결정했다. 다시 말해, 종종 규칙은 '네가 뿌린 씨앗을 내가 거두는 것'이다. 매년 패션 디자이너들은 그들이 '바느질한' 것을 자신들이 거둘 수 있도록 규칙을 변경해 달라고 의회에 압력을 가하지만, 그들은 실패한다. 반면, 음반 업계는 고급 패션 하우스보다 의회를 로비하는 데 더 효과적이었다. 그것(음반 업계)은 디지털 음악이 그 업계의 소유권 관련 내용에 부합하도록 법률을 확보했다. 그 법에 근거하여, 그 업계는 최소 삼만 명 이상의 사람들을 상대로 하여 소송을 제기하거나 소송에 합의하거나 소송을 하겠다고 위협했다. 대형 음반사에 불행히도, 그러한 모든 활동이 불법 다운로딩을 종식시키지는 못했으나 여론을 그들에게 불리하게 바꾸었다.", "read": [{"en": "In fashion, designers build fortunes based on copying each other's creations.", "ko": "패션 분야에서는 디자이너들이 서로의 창작물을 모방함으로써 부를 쌓아간다.", "chunks": [["In fashion,", "패션 분야에서,"], ["designers build fortunes", "디자이너들은 부를 쌓는다"], ["based on copying each other's creations.", "서로의 창작물을 모방함으로써."]]}, {"en": "The labor that goes into original dress designs is not protected.", "ko": "독창적인 드레스 디자인에 들어가는 노동은 보호받지 못한다.", "chunks": [["The labor that goes into", "들어가는 노동은"], ["original dress designs", "독창적 드레스 디자인에"], ["is not protected.", "보호받지 못한다."]]}, {"en": "Knockoffs are not theft.", "ko": "모조품은 절도가 아니다.", "chunks": [["Knockoffs are not theft.", "모조품은 절도가 아니다."]]}, {"en": "They are perfectly legal.", "ko": "그것들은 완전히 합법적이다.", "chunks": [["They are perfectly legal.", "그것들은 완전히 합법적이다."]]}, {"en": "In many pockets of the modern economy ─ chefs' recipes, coaches' sports plays, stand-up comedians' routines, and numerous other creative arenas ─ we have decided that vibrant competition and unrestricted innovation matter more than rewarding creative labor with ownership.", "ko": "요리사의 레시피, 코치의 스포츠 전략, 스탠드업 코미디언의 틀에 박힌 연기 그리고 수많은 다른 창의적 영역과 같은 현대 경제의 많은 분야에서, 우리는 활발한 경쟁과 제한 없는 혁신이 창의적 노동에 대해 소유권으로 보상하는 것보다 더 중요하다고 결정했다.", "chunks": [["In many pockets of the modern economy ─", "현대 경제의 많은 분야에서 ─"], ["chefs' recipes, coaches' sports plays,", "요리사 레시피, 코치의 스포츠 전략,"], ["stand-up comedians' routines,", "스탠드업 코미디언의 틀에 박힌 연기,"], ["and numerous other creative arenas ─", "그리고 수많은 다른 창의적 영역에서 ─"], ["we have decided that vibrant competition and unrestricted innovation", "우리는 활발한 경쟁과 제한 없는 혁신이"], ["matter more than rewarding creative labor", "창의적 노동에 보상하는 것보다 더 중요하다고 결정했다"], ["with ownership.", "소유권으로."]]}, {"en": "In other words, the rule is often I reap what you sow.", "ko": "다시 말해, 종종 규칙은 '네가 뿌린 씨앗을 내가 거두는 것'이다.", "chunks": [["In other words,", "다시 말해,"], ["the rule is often", "종종 규칙은 ~이다"], ["I reap what you sow.", "네가 뿌린 것을 내가 거둔다는 것."]]}, {"en": "Every year fashion designers push Congress to change the rules, so they can reap what they \"sew,\" but they lose.", "ko": "매년 패션 디자이너들은 그들이 '바느질한' 것을 자신들이 거둘 수 있도록 규칙을 변경해 달라고 의회에 압력을 가하지만, 그들은 실패한다.", "chunks": [["Every year fashion designers push Congress", "매년 패션 디자이너들은 의회에 압력을 가한다"], ["to change the rules,", "규칙을 바꾸도록,"], ["so they can reap what they \"sew,\"", "자신들이 '바느질한' 것을 거둘 수 있도록,"], ["but they lose.", "하지만 그들은 실패한다."]]}, {"en": "The music recording industry, on the other hand, was more effective than the high-end fashion houses at lobbying Congress.", "ko": "반면, 음반 업계는 고급 패션 하우스보다 의회를 로비하는 데 더 효과적이었다.", "chunks": [["The music recording industry, on the other hand,", "반면, 음반 업계는,"], ["was more effective", "더 효과적이었다"], ["than the high-end fashion houses", "고급 패션 하우스보다"], ["at lobbying Congress.", "의회를 로비하는 데."]]}, {"en": "It secured legislation so that digital music conforms to the industry's ownership story.", "ko": "그것(음반 업계)은 디지털 음악이 그 업계의 소유권 관련 내용에 부합하도록 법률을 확보했다.", "chunks": [["It secured legislation", "그것은 법률을 확보했다"], ["so that digital music conforms to", "디지털 음악이 ~에 부합하도록"], ["the industry's ownership story.", "그 업계의 소유권 이야기에."]]}, {"en": "Based on that law, the industry has filed, settled, or threatened legal action against at least thirty thousand people.", "ko": "그 법에 근거하여, 그 업계는 최소 삼만 명 이상의 사람들을 상대로 하여 소송을 제기하거나 소송에 합의하거나 소송을 하겠다고 위협했다.", "chunks": [["Based on that law,", "그 법에 근거하여,"], ["the industry has filed, settled, or threatened legal action", "그 업계는 소송을 제기하거나 합의하거나 위협했다"], ["against at least thirty thousand people.", "최소 삼만 명을 상대로."]]}, {"en": "Unfortunately for the big music labels, all that activity hasn't ended illegal downloading ─ but it did turn popular opinion against them.", "ko": "대형 음반사에 불행히도, 그러한 모든 활동이 불법 다운로딩을 종식시키지는 못했으나 여론을 그들에게 불리하게 바꾸었다.", "chunks": [["Unfortunately for the big music labels,", "대형 음반사에 불행히도,"], ["all that activity hasn't ended illegal downloading ─", "그러한 모든 활동이 불법 다운로드를 종식시키지 못했다 ─"], ["but it did turn popular opinion against them.", "하지만 여론을 그들에게 불리하게 바꾸었다."]]}], "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 원본 드레스에서 화살표가 knockoff 드레스로 가서 ✓ legal 표시와 함께 산업 번성. 오른쪽: LP 음반과 ⚖ 저울·gavel로 30000 lawsuits 시도했으나 ✗ downloads continue로 실패.\">\n  <!-- 좌측 박스 — 패션 (knockoff legal · thriving) -->\n  <g>\n    <text x=\"155\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">패션 — knockoff 합법·번성</text>\n    <rect x=\"20\" y=\"30\" width=\"265\" height=\"220\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 원본 드레스 (좌측) -->\n    <g transform=\"translate(75, 130)\">\n      <!-- 상의 -->\n      <path d=\"M -10,-25 L -8,-15 L -5,-25 L 5,-25 L 8,-15 L 10,-25 L 14,-10 L -14,-10 Z\" \n            fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 스커트 (사다리꼴) -->\n      <polygon points=\"-14,-10 14,-10 22,30 -22,30\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 라벨 -->\n      <text x=\"0\" y=\"50\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">original</text>\n    </g>\n\n    <!-- 화살표 (copy) -->\n    <g transform=\"translate(120, 125)\">\n      <text x=\"20\" y=\"-8\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">copy</text>\n "0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- LP 음반 (가운데 좌측) -->\n    <g transform=\"translate(385, 100)\">\n      <!-- LP 외곽 -->\n      <circle cx=\"0\" cy=\"0\" r=\"32\" fill=\"#1a1a1a\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- LP 홈 -->\n      <circle cx=\"0\" cy=\"0\" r=\"28\" fill=\"none\" stroke=\"#5e5e5e\" stroke-width=\"0.5\"/>\n      <circle cx=\"0\" cy=\"0\" r=\"24\" fill=\"none\" stroke=\"#5e5e5e\" stroke-width=\"0.5\"/>\n      <circle cx=\"0\" cy=\"0\" r=\"20\" fill=\"none\" stroke=\"#5e5e5e\" stroke-width=\"0.5\"/>\n      <circle cx=\"0\" cy=\"0\" r=\"16\" fill=\"none\" stroke=\"#5e5e5e\" stroke-width=\"0.5\"/>\n      <!-- LP 라벨 (가운데) -->\n      <circle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      <circle cx=\"0\" cy=\"0\" r=\"1.5\" fill=\"#1a1a1a\"/>\n      <!-- 라벨 -->\n      <text x=\"0\" y=\"48\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">record industry</text>\n    </g>\n\n    <!-- Gavel (소송 망치, 우측) -->\n    <g transform=\"translate(490, 100)\">\n      <!-- 받침판 -->\n      <rect x=\"-18\" y=\"20\" width=\"36\" height=\"6\" rx=\"1\" fill=\"#1a1a1a\"/>\n      <!-- 망치 머리 (수직 회전) -->\n      <rect x=\"-7\" y=\"-12\" width=\"14\" height=\"22\" rx=\"2\" fill=\"#1a1a1a\" transform=\"rotate(35 0 -1)\"/>\n      <!-- 망치 손잡이 -->\n      <line x1=\"0\" y1=\"-1\" x2=\"-30\" y2=\"-30\" stroke=\"#1a1a1a\" stroke-width=\"4\" stroke-linecap=\"round\" transform=\"rotate(35 0 -1)\"/>\n      <!-- 라벨 -->\n      <text x=\"0\" y=\"48\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">⚖ law · gavel</text>\n    </g>\n\n    <!-- 라벨: 30K lawsuits -->\n    <g transform=\"translate(440, 175)\">\n      <rect x=\"-115\" y=\"-12\" width=\"230\" height=\"28\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">30,000 lawsuits</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">3만 명 소송 시도</text>\n    </g>\n\n    <!-- ✗ 결과 -->\n    <g transform=\"translate(440, 215)\">\n      <!-- 큰 ✗ 표시 -->\n      <g transform=\"translate(-100, 0)\">\n        <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n        <line x1=\"-4\" y1=\"-4\" x2=\"4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n        <line x1=\"4\" y1=\"-4\" x2=\"-4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      </g>\n      <text x=\"20\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">downloads continue</text>\n      <text x=\"20\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">public opinion sours</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"272\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">protection ≠ thriving — sometimes open imitation wins</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '패션 디자인 노동은 보호 ✗ → 모조품 합법'이고, 마지막은 '불법 다운로드는 못 막고 여론만 등 돌림'로 정리된다."}, {"no": "15", "title": "Outsourced Knowledge Isn't Knowing", "ktitle": "검색에 맡긴 지식 ≠ 진짜 아는 것", "field": "인지·학습", "page": "no.03", "oneline": "검색엔진·앱에 지식을 ‘위임’하는 것은 실제로 아는 것과 다르다.", "tldr": ["검색엔진·앱에 지식을 ‘위임’하는 것은 실제로 아는 것과 다르다.", "머릿속 지식이 풍부하면 더 빠르고 유연하게 문제를 푼다.", "게다가 내적 지식이 없으면 ‘효과적으로 검색’조차 못 한다."], "analogy": "요리할 때 매번 레시피를 검색하면 손이 자꾸 멈추죠. 머릿속에 기본이 있어야 빠르게 응용하고, 사실 ‘뭘 검색할지’도 알 수 있어요.", "bg": "분야는 인지·학습이에요. 검색엔진·앱에 지식을 ‘위임(outsource)’하는 것과 실제로 ‘아는 것’의 차이가 핵심. → 둘이 왜 같지 않은지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "검색·앱에 지식 위임 ≠ 실제로 아는 것"}, {"kind": "약점", "t": "기기 고장·인터넷 장애 시 위탁 지식 사용 불가"}, {"kind": "핵심", "t": "머릿속 인과 패턴 풍부 → 더 빠르고 유연한 사고", "d": "실시간 회의엔 즉각 회상 필요."}, {"kind": "역설", "t": "내적 지식 없으면 ‘효과적 검색’도 불가"}, {"kind": "결론", "t": "사람들은 검색에 필요한 사전 이해를 과소평가한다"}], "quiz": [["지식을 검색에 ‘위임’하는 것의 한계는?", "기기·인터넷 장애 시 못 쓰고, 머릿속 지식이 없으면 사고가 느리고 유연하지 못해요."], ["내적 지식이 ‘검색’에도 필요한 이유는?", "사전 이해가 없으면 무엇을 어떻게 효과적으로 검색해야 할지조차 모르기 때문이에요."], ["핵심 한 문장?", "검색에 맡긴 지식은 진짜 아는 것과 달라, 내적 지식이 빠른 사고와 효과적 검색의 토대다."]], "vocab": [["relegate", "위임하다·맡기다"], ["outsourced", "외부에 위탁한"], ["causal", "인과의"], ["fluidly", "유연하게"], ["recall", "회상·기억해 냄"], ["internal knowledge", "내적 지식"], ["underestimate", "과소평가하다"]], "en": "Relegating knowledge to search engines and apps differs greatly from actually knowing something. Outsourced knowledge can become unavailable when a device crashes or the internet fails. But even when all external sources are working fine, you think differently. If you cognitively know in your own head a rich array of causal patterns, you can problem-solve and create new ideas more rapidly and fluidly. Our weekly lab meetings include many back-and-forth exchanges between about a dozen people. These exchanges require fast recall of models, patterns, and paradigms to recognize flaws or generate new ideas and solutions. If everyone had to pause and Google information, the process would take much longer or would not work at all. Moreover, without enough internal knowledge, you wouldn't know how to search effectively. People grossly underestimate how much prior understanding is needed to perform efficient searches for information.", "ko": "검색 엔진과 앱에 지식을 위임하는 것은 실제로 어떤 것을 아는 것과 크게 다르다. 기기가 고장 나거나 인터넷에 장애가 발생하면 외부에 위탁한 지식은 사용할 수 없게 될 수 있다. 그러나 모든 외부 자료가 정상적으로 작동하는 경우조차도 여러분은 다르게 생각한다. 만약 풍부하게 많은 인과 관계 패턴을 머릿속에서 인지적으로 알고 있다면 더 빠르고 유연하게 문제를 해결하고 새로운 아이디어를 창출할 수 있다. 우리의 주간 연구실 회의는 약 12명 사이에 오가는 수많은 대화를 포함한다. 이러한 대화는 결함을 인식하거나 새로운 아이디어와 해결책을 창출하기 위해 모델, 패턴, 패러다임을 빠르게 떠올리는 것을 필요로 한다. 모든 사람이 잠시 멈추고 정보를 구글에서 검색해야 한다면 과정이 훨씬 더 오래 걸리거나 전혀 작동하지 않을 것이다. 게다가 내적 지식이 충분하지 않으면 여러분은 효과적으로 검색하는 방법을 모를 것이다. 사람들은 효율적인 정보 검색을 수행하기 위해 얼마나 많은 사전 이해가 필요한지를 매우 과소평가한다.", "read": [{"en": "Relegating knowledge to search engines and apps differs greatly from actually knowing something.", "ko": "검색 엔진과 앱에 지식을 위임하는 것은 실제로 어떤 것을 아는 것과 크게 다르다.", "chunks": [["Relegating knowledge to search engines and apps", "검색 엔진과 앱에 지식을 위임하는 것은"], ["differs greatly from", "크게 다르다"], ["actually knowing something.", "실제로 무엇인가를 아는 것과."]]}, {"en": "Outsourced knowledge can become unavailable when a device crashes or the internet fails.", "ko": "기기가 고장 나거나 인터넷에 장애가 발생하면 외부에 위탁한 지식은 사용할 수 없게 될 수 있다.", "chunks": [["Outsourced knowledge", "외부에 위탁한 지식은"], ["can become unavailable", "사용할 수 없게 될 수 있다"], ["when a device crashes or the internet fails.", "기기가 고장 나거나 인터넷에 장애가 발생할 때."]]}, {"en": "But even when all external sources are working fine, you think differently.", "ko": "그러나 모든 외부 자료가 정상적으로 작동하는 경우조차도 여러분은 다르게 생각한다.", "chunks": [["But even when all external sources are working fine,", "그러나 모든 외부 자료가 정상적으로 작동할 때조차도,"], ["you think differently.", "여러분은 다르게 생각한다."]]}, {"en": "If you cognitively know in your own head a rich array of causal patterns, you can problem-solve and create new ideas more rapidly and fluidly.", "ko": "만약 풍부하게 많은 인과 관계 패턴을 머릿속에서 인지적으로 알고 있다면 더 빠르고 유연하게 문제를 해결하고 새로운 아이디어를 창출할 수 있다.", "chunks": [["If you cognitively know in your own head", "만약 머릿속에서 인지적으로 알고 있다면"], ["a rich array of causal patterns,", "풍부하게 많은 인과 관계 패턴을,"], ["you can problem-solve and create new ideas", "문제 해결과 새 아이디어 창출을 할 수 있다"], ["more rapidly and fluidly.", "더 빠르고 유연하게."]]}, {"en": "Our weekly lab meetings include many back-and-forth exchanges between about a dozen people.", "ko": "우리의 주간 연구실 회의는 약 12명 사이에 오가는 수많은 대화를 포함한다.", "chunks": [["Our weekly lab meetings", "우리의 주간 연구실 회의는"], ["include many back-and-forth exchanges", "오가는 수많은 대화를 포함한다"], ["between about a dozen people.", "약 12명 사이에."]]}, {"en": "These exchanges require fast recall of models, patterns, and paradigms to recognize flaws or generate new ideas and solutions.", "ko": "이러한 대화는 결함을 인식하거나 새로운 아이디어와 해결책을 창출하기 위해 모델, 패턴, 패러다임을 빠르게 떠올리는 것을 필요로 한다.", "chunks": [["These exchanges require", "이러한 대화는 필요로 한다"], ["fast recall of models, patterns, and paradigms", "모델, 패턴, 패러다임의 빠른 회상을"], ["to recognize flaws", "결함을 인식하거나"], ["or generate new ideas and solutions.", "새로운 아이디어와 해결책을 창출하기 위해."]]}, {"en": "If everyone had to pause and Google information, the process would take much longer or would not work at all.", "ko": "모든 사람이 잠시 멈추고 정보를 구글에서 검색해야 한다면 과정이 훨씬 더 오래 걸리거나 전혀 작동하지 않을 것이다.", "chunks": [["If everyone had to pause and Google information,", "모든 사람이 잠시 멈추고 정보를 구글 검색해야 한다면,"], ["the process would take much longer", "그 과정은 훨씬 더 오래 걸리거나"], ["or would not work at all.", "전혀 작동하지 않을 것이다."]]}, {"en": "Moreover, without enough internal knowledge, you wouldn't know how to search effectively.", "ko": "게다가 내적 지식이 충분하지 않으면 여러분은 효과적으로 검색하는 방법을 모를 것이다.", "chunks": [["Moreover, without enough internal knowledge,", "게다가, 충분한 내적 지식 없이는,"], ["you wouldn't know how to search effectively.", "효과적으로 검색하는 방법을 모를 것이다."]]}, {"en": "People grossly underestimate how much prior understanding is needed to perform efficient searches for information.", "ko": "사람들은 효율적인 정보 검색을 수행하기 위해 얼마나 많은 사전 이해가 필요한지를 매우 과소평가한다.", "chunks": [["People grossly underestimate", "사람들은 크게 과소평가한다"], ["how much prior understanding is needed", "얼마나 많은 사전 이해가 필요한지를"], ["to perform efficient searches for information.", "효율적인 정보 검색을 수행하기 위해."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 사람이 머리가 비어있고 노트북에 의존하지만 기기 차단 ✗로 막힘. 오른쪽: 사람의 머리 안에 인과 패턴 그물이 짜여 있고 빠른 회상·유연·창의의 별 생각이 발산.\">\n  <!-- 좌측 박스 — 외주 지식 -->\n  <g>\n    <text x=\"155\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">외주 지식 — outsourced</text>\n    <rect x=\"20\" y=\"30\" width=\"265\" height=\"195\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 사람 (좌측, 머리 안 비어있음) -->\n    <g transform=\"translate(85, 130)\">\n      <!-- 머리 (큰 원, 비어있음) -->\n      <circle cx=\"0\" cy=\"-25\" r=\"20\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 눈 -->\n      <circle cx=\"-6\" cy=\"-28\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <circle cx=\"6\" cy=\"-28\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <!-- 입 (당황) -->\n      <ellipse cx=\"0\" cy=\"-19\" rx=\"2.5\" ry=\"1.5\" fill=\"#1a1a1a\"/>\n      <!-- 머리 안 ? 표시 -->\n      <text x=\"0\" y=\"-43\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c8102e\">?</text>\n\n      <!-- 몸 -->\n      <line x1=\"0\" y1=\"-5\" x2=\"0\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 팔 (우측 기기로 뻗음) -->\n      <line x1=\"0\" y1=\"3\" x2=\"25\" y2=\"15\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"3\" x2=\"-12\" y2=\"15\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 다리 -->\n      <line x1=\"0\" y1=\"20\" x2=\"-7\" y2=\"42\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"20\" x2=\"7\" y2=\"42\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    </g>\n\n    <!-- 의존 화살표 (사람 → 기기) -->\n    <g transform=\"translate(125, 145)\">\n      <text x=\"20\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">depends on</text>\n      <line x1=\"0\" y1=\"0\" x2=\"38\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/>\n      <polygon points=\"38,0 31,-4 31,4\" fill=\"#c8102e\"/>\n    </g>\n\n    <!-- 노트북 (우측) -->\n    <g transform=\"translate(210, 140)\">\n      <!-- 화면 -->\n      <rect x=\"-22\" y=\"-22\" width=\"44\" height=\"32\" rx=\"2\" fill=\"#1a1a1a\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <rect x=\"-19\" y=\"-19\" width=\"38\" height=\"26\" fill=\"#ffffff\"/>\n      <!-- 화면 안 검색 라인 -->\n      <line x1=\"-15\" y1=\"-13\" x2=\"15\" y2=\"-13\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <line x1=\"-15\" y1=\"-8\" x2=\"10\" y2=\"-8\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <line x1=\"-15\" y1=\"-3\" x2=\"12\" y2=\"-3\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <line x1=\"-15\" y1=\"2\" x2=\"8\" y2=\"2\" stroke=\"#999\" stroke-width=\"0.6\"/>\n      <!-- 받침대 -->\n      <polygon points=\"-26,10 26,10 22,16 -22,16\" fill=\"#1a1a1a\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n\n      <!-- ✗ 표시 (기기 차단) -->\n      <g transform=\"translate(20, -25)\">\n        <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.7\"/>\n        <line x1=\"-4\" y1=\"-4\" x2=\"4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n        <line x1=\"4\" y1=\"-4\" x2=\"-4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      </g>\n      <!-- 라벨 -->\n      <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">search engine</text>\n    </g>\n\n    <!-- 부정적 결과 (하단) -->\n    <g transform=\"translate(155, 200)\">\n      <rect x=\"-120\" y=\"-12\" width=\"240\" height=\"20\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">fragile · slow recall · not retained</text>\n    </g>\n  </g>\n\n  <!-- 우측 박스 — 내적 인과 패턴 -->\n  <g>\n    <text x=\"445\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">내적 인과 패턴 — internalized</text>\n    <rect x=\"315\" y=\"30\" width=\"265\" height=\"195\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 사람 (가운데, 머리 안에 인과 패턴 그물) -->\n    <g transform=\"translate(445, 130)\">\n      <!-- 머리 (큰 원, 내부 인과 그물) -->\n      <circle cx=\"0\" cy=\"-30\" r=\"26\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n\n      <!-- 머리 안 인과 패턴 그물 (작은 노드 + 연결) -->\n      <g stroke=\"#1FA34A\" stroke-width=\"1.2\" fill=\"none\">\n        <line x1=\"-13\" y1=\"-38\" x2=\"0\" y2=\"-30\"/>\n        <line x1=\"13\" y1=\"-38\" x2=\"0\" y2=\"-30\"/>\n        <line x1=\"-13\" y1=\"-22\" x2=\"0\" y2=\"-30\"/>\n        <line x1=\"13\" y1=\"-22\" x2=\"0\" y2=\"-30\"/>\n        <line x1=\"-13\" y1=\"-38\" x2=\"13\" y2=\"-38\"/>\n        <line x1=\"-13\" y1=\"-22\" x2=\"13\" y2=\"-22\"/>\n        <line x1=\"-13\" y1=\"-38\" x2=\"-13\" y2=\"-22\"/>\n        <line x1=\"13\" y1=\"-38\" x2=\"13\" y2=\"-22\"/>\n      </g>\n      <g fill=\"#1FA34A\">\n        <circle cx=\"-13\" cy=\"-38\" r=\"2.5\"/>\n        <circle cx=\"13\" cy=\"-38\" r=\"2.5\"/>\n        <circle cx=\"0\" cy=\"-30\" r=\"3\"/>\n        <circle cx=\"-13\" cy=\"-22\" r=\"2.5\"/>\n        <circle cx=\"13\" cy=\"-22\" r=\"2.5\"/>\n      </g>\n\n      <!-- 몸 -->\n      <line x1=\"0\" y1=\"-4\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <!-- 팔 (자유롭게 양옆으로) -->\n      <line x1=\"0\" y1=\"3\" x2=\"-18\" y2=\"-2\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <line x1=\"0\" y1=\"3\" x2=\"18\" y2=\"-2\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 다리 -->\n      <line x1=\"0\" y1=\"22\" x2=\"-8\" y2=\"44\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"8\" y2=\"44\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    </g>\n\n    <!-- 머리 위 빠른 회상 별·번개 -->\n    <g transform=\"translate(445, 55)\">\n      <!-- 번개 ⚡ -->\n      <path d=\"M -5,-12 L 2,-4 L -2,-4 L 4,12 L -3,2 L 1,2 Z\" fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"0.8\"/>\n      <!-- 작은 별들 -->\n      <polygon points=\"-22,-3 -20.5,0.5 -17,0.5 -19.5,3 -18.5,6.5 -22,4.5 -25.5,6.5 -24.5,3 -27,0.5 -23.5,0.5\" \n               fill=\"#1FA34A\"/>\n      <polygon points=\"22,-3 23.5,0.5 27,0.5 24.5,3 25.5,6.5 22,4.5 18.5,6.5 19.5,3 17,0.5 20.5,0.5\" \n               fill=\"#1FA34A\"/>\n    </g>\n\n    <!-- 긍정 결과 (하단) -->\n    <g transform=\"translate(445, 200)\">\n      <rect x=\"-120\" y=\"-12\" width=\"240\" height=\"20\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">fast · flexible · creative recall</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"245\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">device dependency ≠ real knowing — patterns must be internalized</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '검색·앱에 지식 위임 ≠ 실제로 아는 것'이고, 마지막은 '사람들은 검색에 필요한 사전 이해를 과소평가한다'로 정리된다."}, {"no": "16", "title": "Bacteria Are as 'Evolved' as We Are", "ktitle": "가장 단순한 생명도 똑같이 진화했다", "field": "생물·진화", "page": "no.04", "oneline": "지구 생명은 ‘가장 큰 생물’로만 정의되지 않는다.", "tldr": ["지구 생명은 ‘가장 큰 생물’로만 정의되지 않는다.", "가장 풍부한 생명은 가장 단순한 박테리아일 수 있다.", "모든 생명은 40억 년 진화의 ‘동등한’ 산물 — 박테리아도 덜 진화한 게 아니다."], "analogy": "진화를 ‘점점 더 복잡해지는 사다리’로 보기 쉽지만, 사실은 각자 자리에 꼭 맞게 자란 거예요. 박테리아도 인간만큼 오랜 진화의 ‘완성품’이죠.", "bg": "분야는 생물·진화예요. ‘지구 생명을 가장 큰 생물로만 정의할 수 없다’는 것이 출발점. → 박테리아가 인간만큼 ‘진화한’ 존재라는 주장의 근거에 주목하며 읽으세요.", "flow": [{"kind": "통념 깨기", "t": "지구 생명 = 큰 생물로만 정의 ✗"}, {"kind": "사실", "t": "가장 풍부한 생명 = 가장 단순한 박테리아일 수도"}, {"kind": "주장", "t": "진화 = ‘더 복잡함을 향한 직선 발전’ 아님"}, {"kind": "근거", "t": "모든 생명 = 40억 년 진화의 ‘동등한’ 산물", "d": "모든 생태 지위를 채움."}, {"kind": "결론", "t": "가장 큰 종도 박테리아보다 ‘더 진화’한 게 아니다"}], "quiz": [["진화에 대한 흔한 오해를 글은 어떻게 반박하나?", "진화는 ‘더 복잡한 생물을 향한 직선 발전’이 아니라고 해요."], ["박테리아와 인간의 진화적 위치는?", "둘 다 40억 년 진화의 ‘동등한’ 산물이라, 큰 종이 박테리아보다 더 진화한 게 아니에요."], ["핵심 한 문장?", "모든 생명은 40억 년 진화의 동등한 산물이며, 단순한 박테리아도 인간만큼 진화했다."]], "vocab": [["inhabit", "서식하다·거주하다"], ["abundant", "풍부한"], ["organism", "유기체·생물"], ["product", "산물·결과물"], ["ecological niche", "생태적 지위"], ["solely", "오로지·단지"], ["equal", "동등한"]], "en": "Life on Earth is not defined solely by the largest creatures that we see inhabiting the lands and the oceans of the planet, even though those are the ones with which we are most familiar. Rather, it appears that the most abundant life on Earth may also be the simplest life ─ bacteria. In this sense, we cannot view the evolution of life on Earth as being a continuing evolution toward more-complex organisms. All the life that exists today is the equal product of 4 b.y. of evolution, whether it be the simplest bacteria, the smallest plants, humans, or the largest organisms on the planet. That is, evolution has allowed organisms to evolve to fill essentially all of the available ecological niches. The largest species ─ those that we see on the surface of the planet ─ are in some sense no more evolved than the simplest bacteria.", "ko": "지구상의 생명체는 지구의 육지와 바다에 서식하는 우리가 보는 가장 큰 생물로만 정의되지는 않는데, 비록 그것들이 우리에게 가장 친숙한 생명체라 할지라도 그렇다. 오히려 지구상에서 가장 풍부한 생명체는 가장 단순한 생명체인 박테리아일 수도 있는 것처럼 보인다. 이런 의미에서, 우리는 지구 생명체의 진화를 더 복잡한 유기체를 향한 계속된 진화라고 볼 수 없다. 오늘날 존재하는 모든 생명체는 그것이 지구상에서 가장 단순한 박테리아든, 가장 작은 식물이든, 인간이든 또는 가장 큰 유기체든, 40억 년에 걸친 진화의 동등한 산물이다. 다시 말하면 진화를 통해 유기체는 서서히 발전하여 본질적으로 모든 이용 가능한 생태적 지위를 채워 왔다. 우리가 지구 표면에서 보는 가장 큰 종은 어떤 의미에서 가장 단순한 박테리아보다 더 진화하지 않았다.", "read": [{"en": "Life on Earth is not defined solely by the largest creatures that we see inhabiting the lands and the oceans of the planet, even though those are the ones with which we are most familiar.", "ko": "지구상의 생명체는 지구의 육지와 바다에 서식하는 우리가 보는 가장 큰 생물로만 정의되지는 않는데, 비록 그것들이 우리에게 가장 친숙한 생명체라 할지라도 그렇다.", "chunks": [["Life on Earth is not defined solely", "지구상의 생명체는 ~으로만 정의되지 않는다"], ["by the largest creatures that we see", "우리가 보는 가장 큰 생물로"], ["inhabiting the lands and the oceans of the planet,", "지구의 육지와 바다에 서식하는,"], ["even though those are the ones", "비록 그것들이 ~이라 할지라도"], ["with which we are most familiar.", "우리에게 가장 친숙한 것이라."]]}, {"en": "Rather, it appears that the most abundant life on Earth may also be the simplest life ─ bacteria.", "ko": "오히려 지구상에서 가장 풍부한 생명체는 가장 단순한 생명체인 박테리아일 수도 있는 것처럼 보인다.", "chunks": [["Rather, it appears that", "오히려, ~인 것처럼 보인다"], ["the most abundant life on Earth", "지구상에서 가장 풍부한 생명체는"], ["may also be the simplest life ─ bacteria.", "또한 가장 단순한 생명체, 즉 박테리아일 수도 있다."]]}, {"en": "In this sense, we cannot view the evolution of life on Earth as being a continuing evolution toward more-complex organisms.", "ko": "이런 의미에서, 우리는 지구 생명체의 진화를 더 복잡한 유기체를 향한 계속된 진화라고 볼 수 없다.", "chunks": [["In this sense,", "이런 의미에서,"], ["we cannot view the evolution of life on Earth", "우리는 지구 생명의 진화를 ~로 볼 수 없다"], ["as being a continuing evolution", "지속적 진화로"], ["toward more-complex organisms.", "더 복잡한 유기체를 향한."]]}, {"en": "All the life that exists today is the equal product of 4 b.y. of evolution, whether it be the simplest bacteria, the smallest plants, humans, or the largest organisms on the planet.", "ko": "오늘날 존재하는 모든 생명체는 그것이 지구상에서 가장 단순한 박테리아든, 가장 작은 식물이든, 인간이든 또는 가장 큰 유기체든, 40억 년에 걸친 진화의 동등한 산물이다.", "chunks": [["All the life that exists today", "오늘날 존재하는 모든 생명체는"], ["is the equal product of 4 b.y. of evolution,", "40억 년에 걸친 진화의 동등한 산물이다,"], ["whether it be the simplest bacteria,", "그것이 가장 단순한 박테리아든,"], ["the smallest plants, humans, or the largest organisms on the planet.", "가장 작은 식물이든, 인간이든, 또는 지구상의 가장 큰 유기체이든."]]}, {"en": "That is, evolution has allowed organisms to evolve to fill essentially all of the available ecological niches.", "ko": "다시 말하면 진화를 통해 유기체는 서서히 발전하여 본질적으로 모든 이용 가능한 생태적 지위를 채워 왔다.", "chunks": [["That is, evolution has allowed organisms", "다시 말해, 진화는 유기체로 하여금 ~하도록 해 왔다"], ["to evolve to fill essentially all", "진화하여 본질적으로 모든 것을 채우도록"], ["of the available ecological niches.", "이용 가능한 생태적 지위의."]]}, {"en": "The largest species ─ those that we see on the surface of the planet ─ are in some sense no more evolved than the simplest bacteria.", "ko": "우리가 지구 표면에서 보는 가장 큰 종은 어떤 의미에서 가장 단순한 박테리아보다 더 진화하지 않았다.", "chunks": [["The largest species ─", "가장 큰 종은 ─"], ["those that we see on the surface of the planet ─", "지구 표면에서 우리가 보는 것들 ─"], ["are in some sense no more evolved", "어떤 의미에서 더 진화하지 않았다"], ["than the simplest bacteria.", "가장 단순한 박테리아보다."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 통념의 피라미드 — 꼭대기에 인간, 중간에 대형 동물, 아래에 식물, 바닥에 박테리아. 큰 X로 부정. 오른쪽: 평등 수평 배열 — 박테리아·식물·인간·대형 동물이 같은 높이에 ✓로 표시되고 아래 4 billion years 시간축이 모두에게 동등하게 적용.\">\n  <!-- 좌측 박스 — 통념 피라미드 (틀림) -->\n  <g>\n    <text x=\"155\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">통념 — pyramid 위계</text>\n    <rect x=\"20\" y=\"30\" width=\"265\" height=\"225\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 피라미드 (삼각형 외곽) -->\n    <polygon points=\"155,55 75,220 235,220\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\" opacity=\"0.6\"/>\n\n    <!-- 단 1: human (꼭대기) -->\n    <g transform=\"translate(155, 75)\">\n      <circle cx=\"0\" cy=\"-7\" r=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"-3\" x2=\"0\" y2=\"7\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"-4\" y2=\"5\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"4\" y2=\"5\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"7\" x2=\"-3\" y2=\"13\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"7\" x2=\"3\" y2=\"13\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <text x=\"14\" y=\"2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\">human</text>\n    </g>\n\n    <!-- 단 2: large animal (중상) -->\n    <g transform=\"translate(155, 115)\">\n      <!-- 코끼리 단순 -->\n      <ellipse cx=\"0\" cy=\"0\" rx=\"14\" ry=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <ellipse cx=\"-13\" cy=\"-3\" rx=\"6\" ry=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"

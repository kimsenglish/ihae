<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 올림포스 영어독해 9대 변별유형 · Chapter 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   지문 이해 보조 자료 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>

<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">

    <div class="b-sub">올림포스 영어독해 9대 변별유형 · Chapter 2</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

<script>
/* ============================================================
   데이터 (P.data) — 올림포스 영어독해 9대 변별유형 · Chapter 2

const P = {"data": [{"no": "1", "title": "Crossing Cultures as 'Becoming'", "ktitle": "전형적 범주는 빠르게 인식되지만, 박쥐 같은 비전형은 분류 어려움과 두려움을 만든다.", "field": "문화·성장", "page": "기출 예제 01", "oneline": "문화를 넘어가는 것은 ‘나는 누구인가’의 기반에 도전한다.", "tldr": ["문화를 넘어가는 것은 ‘나는 누구인가’의 기반에 도전한다.", "고향에서 ‘뿌리째 뽑힘’이 타인·나·내 고향 문화를 새로 이해하게 한다.", "적응 = 단순 생존이 아니라 재창조·성장의 ‘되어가는’ 여정 — 옛 나를 버리진 않는다."], "analogy": "낯선 나라에서 살아보면 그 나라뿐 아니라 ‘내가 어떤 사람인지’도 새로 보이죠. 옛 나를 버리는 게 아니라, 처음처럼 다시 발견하며 자라는 거예요.", "bg": "분야는 문화·성장이에요. ‘문화를 넘어가는 일’이 ‘나는 누구인가’의 기반을 흔든다는 것이 핵심. → 문화 횡단이 왜 단순 적응이 아니라 ‘되어감(becoming)’인지에 주목하며 읽으세요.", "flow": [{"kind": "도전", "t": "문화 넘기 = ‘나는 누구인가’의 기반에 도전"}, {"kind": "효과", "t": "타인·나·내 고향 문화를 새로 이해", "d": "‘뿌리째 뽑힘’이 통찰을 줌."}, {"kind": "역설", "t": "고통·상반 감정 ‘덕분에’ 새 정의의 특권을 얻음"}, {"kind": "의미", "t": "단순 생존 ✗ → 재창조·변화·성장의 여정"}, {"kind": "단서", "t": "옛 나·‘문화의 불변하는 것들’은 버리지 않는다"}], "quiz": [["문화를 넘어가는 경험이 주는 이해는?", "새 환경의 사람·문화뿐 아니라 ‘나 자신과 내 고향 문화’까지 새롭게 이해하게 돼요."], ["이 적응을 ‘단순 생존 이상’이라 하는 이유는?", "재창조·변화·성장의 ‘되어가는’ 여정이며, 옛 개성과 소중한 ‘문화의 불변하는 것들’은 버리지 않기 때문이에요."], ["핵심 한 문장?", "문화를 넘는 경험은 고통을 통해 나와 내 문화를 새롭게 발견하는 성장의 여정이다."]], "vocab": [["crossing cultures", "문화를 넘어가기"], ["uprooted", "뿌리째 뽑힌"], ["ambivalence", "상반된 감정·양가감정"], ["privileged", "특권을 가진"], ["reinvention", "재창조·재창안"], ["compel", "강요하다·~하게 만들다"], ["invariant", "불변하는 것"]], "en": "The process of crossing cultures challenges the very basis of who we are as cultural beings. It offers opportunities for new learning and growth. Being \"uprooted\" from our home brings us understanding not only of the people and their culture in our new environment, but of ourselves and our home culture. Although the difficulties that can arise from crossing cultures are often shocking, success stories are everywhere. Despite, or rather because of, the suffering and ambivalence we undergo when we cross cultures, we gradually find ourselves uniquely privileged to define ourselves and others anew with clarity and insight that we could not have cultivated without leaving home. Adapting to a new and unfamiliar culture, then, is more than survival. It is a life-changing journey. It is a process of \"becoming\" ─ personal reinvention, transformation, growth, reaching out beyond the boundaries of our own existence. The process does not require that we abandon our former personalities and the cultures into which we were born. Rather, it compels us to find ourselves as if for the first time, particularly those \"cultural invariants\" within us ─ aspects that we hold dear and refuse to compromise.", "ko": "문화를 넘어가는 과정은 문화적 존재로서 우리가 누구인지에 대한 바로 그 기반에 도전한다. 그것은 새로운 배움과 성장을 위한 기회를 제공한다. 우리의 고향에서 '뿌리째 뽑히는' 것은 우리의 새로운 환경에 있는 사람들과 그들의 문화(에 대한 이해)뿐만 아니라 우리 자신과 우리의 고향 문화에 대한 이해도 가져다준다. 비록 문화를 넘어가는 것에서 발생할 수 있는 어려움이 흔히 충격적이더라도, 성공담은 어디에나 있다. 우리가 문화를 넘어가면서 겪는 고통, 그리고 상반되는 감정에도 불구하고, 혹은 오히려 이것 때문에, 우리는 고향을 떠나지 않고는 기를 수 없었던 명확성과 통찰력으로 우리 자신과 다른 사람들을 새롭게 정의할 수 있는 특권을 특별히 누리고 있다는 것을 점차 알게 된다. 새롭고 낯선 문화에 적응하는 것은, 그러니까, 생존 그 이상이다. 그것은 삶을 바꾸는 여정이다. 그것은 개인적인 재창조, 변화, 성장, 우리 자신의 존재의 경계 너머로 뻗어가는 '되어가는 것'의 과정이다. 그 과정은 우리가 우리 이전의 개성과 우리가 태어난 문화를 버릴 것을 요구하지 않는다. 오히려, 그것은 우리로 하여금 우리 자신을, 특히 우리 내면의 그 '문화의 불변하는 것들' ― 우리가 소중히 여기고 타협하기를 거부하는 측면들 ― 을 마치 처음인 것처럼 발견할 것을 강요한다.", "read": [{"en": "The process of crossing cultures challenges the very basis of who we are as cultural beings.", "ko": "문화를 넘어가는 과정은 문화적 존재로서 우리가 누구인지에 대한 바로 그 기반에 도전한다.", "chunks": [["The process of crossing cultures", "문화를 넘어가는 과정은"], ["challenges the very basis", "바로 그 기반에 도전한다"], ["of who we are", "우리가 누구인지에 대한"], ["as cultural beings.", "문화적 존재로서."]]}, {"en": "It offers opportunities for new learning and growth.", "ko": "그것은 새로운 배움과 성장을 위한 기회를 제공한다.", "chunks": [["It offers opportunities", "그것은 기회를 제공한다"], ["for new learning and growth.", "새로운 배움과 성장을 위한."]]}, {"en": "Being \"uprooted\" from our home brings us understanding not only of the people and their culture in our new environment, but of ourselves and our home culture.", "ko": "우리의 고향에서 '뿌리째 뽑히는' 것은 우리의 새로운 환경에 있는 사람들과 그들의 문화(에 대한 이해)뿐 \">new</text>\n    </g>\n\n    <!-- 가운데 사람 (크고·견고·솟아오름) -->\n    <g transform=\"translate(460, 80)\">\n      <!-- ★ 풍선 (cultural invariants 발견) -->\n      <g transform=\"translate(0, -8)\">\n        <polygon points=\"0,-10 3,-3 10,-3 4.5,2 6.5,9 0,5 -6.5,9 -4.5,2 -10,-3 -3,-3\" \n                 fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n      </g>\n\n      <!-- 머리 (실선·견고) -->\n      <circle cx=\"0\" cy=\"14\" r=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <circle cx=\"-4\" cy=\"12\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"12\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <path d=\"M -4 18 Q 0 21 4 18\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n\n      <!-- 몸 (실선·굵음) -->\n      <line x1=\"0\" y1=\"27\" x2=\"0\" y2=\"62\" stroke=\"#1a1a1a\" stroke-width=\"1.8\"/>\n\n      <!-- 두 팔이 두 원 가리킴 -->\n      <line x1=\"0\" y1=\"38\" x2=\"-55\" y2=\"55\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <polygon points=\"-55,55 -47,53 -47,59\" fill=\"#1FA34A\"/>\n      <line x1=\"0\" y1=\"38\" x2=\"55\" y2=\"55\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <polygon points=\"55,55 47,53 47,59\" fill=\"#1FA34A\"/>\n\n      <!-- 두 다리 (안정) -->\n      <line x1=\"0\" y1=\"62\" x2=\"-9\" y2=\"82\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <line x1=\"0\" y1=\"62\" x2=\"9\" y2=\"82\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    </g>\n\n    <text x=\"460\" y=\"215\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">uniquely privileged · invariants discovered</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"244\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">the suffering itself becomes the privilege</text>\n</svg>", "caption": "뿌리 뽑힘(고통·양면감정) → 오히려 특권 → cultural invariants를 처음 본 듯 발견"}, {"no": "2", "title": "The Wizard of Oz and Motivation", "ktitle": "훌륭한 리더십은 공감과 진정성의 결합이다. 공감은 수단이 아니라 그 자체로 가치다.", "field": "심리·동기", "page": "기출 예제 02", "oneline": "도로시 일행은 ‘마법사가 주리라’ 기대하며 고생해 나아간다.", "tldr": ["도로시 일행은 ‘마법사가 주리라’ 기대하며 고생해 나아간다.", "마법사는 ‘힘은 처음부터 너희 안에 있었다’를 깨닫게 한다.", "집=장소가 아니라 ‘느낌’ — 원하던 자질은 이미 가진 것이었다."], "analogy": "용기·지혜·마음을 찾아 먼 길을 떠났지만, 사실 그 여정 자체에서 이미 다 보여줬죠. 찾던 것은 밖에 있던 게 아니라 처음부터 내 안에 있던 거예요.", "bg": "분야는 심리·동기예요. 『오즈의 마법사』 도로시 일행이 ‘마법사가 주리라’ 기대하며 나아가는 이야기가 소재. → 기대가 동기에 어떤 역할을 하는지에 주목하며 읽으세요.", "flow": [{"kind": "행동", "t": "마법사가 ‘부족한 것’을 주리라 기대 → 고생"}, {"kind": "반전", "t": "마법사: ‘힘은 처음부터 너희 안에 있었다’"}, {"kind": "의미 ①", "t": "집 = 장소가 아니라 ‘안전·편안함의 느낌’"}, {"kind": "의미 ②", "t": "용기·지성·감정 = 이미 가진 속성", "d": "내적 조건 ✗ → 관계 맺는 방식."}, {"kind": "결론", "t": "‘기대’가 그 자질을 이미 발휘하게 한 동기였다"}], "quiz": [["마법사가 도로시 일행에게 깨닫게 한 것은?", "원하던 것을 줄 사람은 마법사가 아니라, 그 힘은 처음부터 ‘그들 자신’에게 있었다는 거예요."], ["등장인물들의 ‘기대’가 한 역할은?", "원하는 걸 얻으리란 기대가 여정의 동기가 되었고, 그 여정에서 이미 용기·지성·감정을 발휘했어요."], ["핵심 한 문장?", "우리가 찾는 자질은 이미 우리 안에 있으며, 기대가 그것을 발휘하게 하는 동기가 된다."]], "vocab": [["motivation", "동기 부여"], ["persist", "끈질기게 계속하다"], ["adversary", "적·반대자"], ["fulfill", "실현하다·이루다"], ["attribute", "속성·자질"], ["long for", "간절히 바라다"], ["likelihood", "가능성"]], "en": "Consider The Wizard of Oz as a psychological study of motivation. Dorothy and her three friends work hard to get to the Emerald City, overcoming barriers, persisting against all adversaries. They do so because they expect the Wizard to give them what they are missing. Instead, the wonderful (and wise) Wizard makes them aware that they, not he, always had the power to fulfill their wishes. For Dorothy, home is not a place but a feeling of security, of comfort with people she loves; it is wherever her heart is. The courage the Lion wants, the intelligence the Scarecrow longs for, and the emotions the Tin Man dreams of are attributes they already possess. They need to think about these attributes not as internal conditions but as positive ways in which they are already relating to others. After all, didn't they demonstrate those qualities on the journey to Oz, a journey motivated by little more than an expectation, an idea about the future likelihood of getting something they wanted?", "ko": "'오즈의 마법사'를 동기 부여에 관한 심리학적 연구로 생각해 보라. Dorothy와 그녀의 세 친구는 에메랄드 시로 가기 위해 열심히 노력하면서, 장벽을 극복하고, 모든 적에게 끈질기게 맞선다. 그들은 마법사가 그들에게 없는 것을 줄 거라고 기대하기 때문에 그렇게 한다. 대신에, 그 멋진 (그리고 현명한) 마법사는 자신이 아니라 그들이 항상 자신들의 소원을 실현할 힘을 가지고 있었음을 그들이 깨닫게 한다. Dorothy에게, '집'은 장소가 아니라 그녀가 사랑하는 사람들과 함께하는 편안한 느낌, 안전하다는 느낌이며, 그녀의 마음이 있는 곳이면 어디든 집이다. 사자가 원하는 용기, 허수아비가 바라는 지성, 양철 인간이 꿈꾸는 감정은 그들이 이미 가지고 있는 속성이다. 그들은 이러한 속성을 내적인 조건이 아니라 이미 자신들이 다른 이들과 관계를 맺는 긍정적인 방식으로 생각할 필요가 있다. 결국, 그들은 자신들이 원하는 뭔가를 얻을 수 있을 거라는 미래의 가능성에 관한 생각, 즉 어떤 '기대'에 지나지 않는 것에 의해 동기가 부여된 여행인, 오즈로 가는 여정에서 그러한 자질들을 보여주지 않았는가?", "read": [{"en": "Consider The Wizard of Oz as a psychological study of motivation.", "ko": "'오즈의 마법사'를 동기 부여에 관한 심리학적 연구로 생각해 보라.", "chunks": [["Consider The Wizard of Oz", "'오즈의 마법사'를 생각해 보라"], ["as a psychological study of motivation.", "동기 부여에 관한 심리학적 연구로."]]}, {"en": "Dorothy and her three friends work hard to get to the Emerald City, overcoming barriers, persisting against all adversaries.", "ko": "Dorothy와 그녀의 세 친구는 에메랄드 시로 가기 위해 열심히 노력하면서, 장벽을 극복하고, 모든 적에게 끈질기게 맞선다.", "chunks": [["Dorothy and her three friends work hard", "Dorothy와 그녀의 세 친구는 열심히 노력한다"], ["to get to the Emerald City,", "에메랄드 시에 도달하기 위해,"], ["overcoming barriers,", "장벽을 극복하면서,"], ["persisting against all adversaries.", "모든 적에 끈질기게 맞서면서."]]}, {"en": "They do so because they expect the Wizard to give them what they are missing.", "ko": "그들은 마법사가 그들에게 없는 것을 줄 거라고 기대하기 때문에 그렇게 한다.", "chunks": [["They do so", "그들은 그렇게 한다"], ["because they expect the Wizard", "왜냐하면 그들이 마법사가 ~할 것을 기대하기 때문이다"], ["to give them what they are missing.", "그들에게 그들이 없는 것을 줄 것을."]]}, {"en": "Instead, the wonderful (and wise) Wizard makes them aware that they, not he, always had the power to fulfill their wishes.", "ko": "대신에, 그 멋진 (그리고 현명한) 마법사는 자신이 아니라 그들이 항상 자신들의 소원을 실현할 힘을 가지고 있었음을 그들이 깨닫게 한다.", "chunks": [["Instead, the wonderful (and wise) Wizard", "대신에, 멋지고 (현명한) 마법사는"], ["makes them aware", "그들을 깨닫게 한다"], ["that they, not he,", "그(마법사)가 아니라 바로 그들이"], ["always had the power", "항상 힘을 가지고 있었음을"], ["to fulfill their wishes.", "자신들의 소원을 실현할."]]}, {"en": "For Dorothy, home is not a place but a feeling of security, of comfort with people she loves; it is wherever her heart is.", "ko": "Dorothy에게, '집'은 장소가 아니라 그녀가 사랑하는 사람들과 함께하는 편안한 느낌, 안전하다는 느낌이며, 그녀의 마음이 있는 곳이면 어디든 집이다.", "chunks": [["For Dorothy,", "Dorothy에게,"], ["home is not a place", "'집'은 장소가 아니라"], ["but a feeling of security,", "안전하다는 느낌이다,"], ["of comfort with people she loves;", "그녀가 사랑하는 사람들과 함께하는 편안함의;"], ["it is wherever her heart is.", "그녀의 마음이 있는 곳이면 어디든 집이다."]]}, {"en": "The courage the Lion wants, the intelligence the Scarecrow longs for, and the emotions the Tin Man dreams of are attributes they already possess.", "ko": "사자가 원하는 용기, 허수아비가 바라는 지성, 양철 인간이 꿈꾸는 감정은 그들이 이미 가지고 있는 속성이다.", "chunks": [["The courage the Lion wants,", "사자가 원하는 용기,"], ["the intelligence the Scarecrow longs for,", "허수아비가 갈망하는 지성,"], ["and the emotions the Tin Man dreams of", "그리고 양철 인간이 꿈꾸는 감정은"], ["are attributes", "속성이다"], ["they already possess.", "그들이 이미 가지고 있는."]]}, {"en": "They need to think about these attributes not as internal conditions but as positive ways in which they are already relating to others.", "ko": "그들은 이러한 속성을 내적인 조건이 아니라 이미 자신들이 다른 이들과 관계를 맺는 긍정적인 방식으로 생각할 필요가 있다.", "chunks": [["They need to think about these attributes", "그들은 이 속성을 ~로 생각할 필요가 있다"], ["not as internal conditions", "내적인 조건으로가 아니라"], ["but as positive ways", "긍정적인 방식으로"], ["in which they are already relating to others.", "그들이 이미 다른 이들과 관계를 맺고 있는."]]}, {"en": "After all, didn't they demonstrate those qualities on the journey to Oz, a journey motivated by little more than an expectation, an idea about the future likelihood of getting something they wanted?", "ko": "결국, 그들은 자신들이 원하는 뭔가를 얻을 수 있을 거라는 미래의 가능성에 관한 생각, 즉 e=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">emotion</text>\n    </g>\n\n    <!-- Lion (자기 안 courage) -->\n    <g transform=\"translate(553, 130)\">\n      <g stroke=\"#1a1a1a\" stroke-width=\"1.1\" fill=\"none\">\n        <line x1=\"0\" y1=\"-13\" x2=\"0\" y2=\"-18\"/>\n        <line x1=\"-7\" y1=\"-11\" x2=\"-12\" y2=\"-15\"/>\n        <line x1=\"7\" y1=\"-11\" x2=\"12\" y2=\"-15\"/>\n        <line x1=\"-11\" y1=\"-4\" x2=\"-17\" y2=\"-5\"/>\n        <line x1=\"11\" y1=\"-4\" x2=\"17\" y2=\"-5\"/>\n        <line x1=\"-10\" y1=\"5\" x2=\"-16\" y2=\"7\"/>\n        <line x1=\"10\" y1=\"5\" x2=\"16\" y2=\"7\"/>\n      </g>\n      <circle cx=\"0\" cy=\"-3\" r=\"11\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <circle cx=\"-3\" cy=\"-4\" r=\"0.9\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-4\" r=\"0.9\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 1 Q 0 3 3 1\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"8\" x2=\"0\" y2=\"36\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- ★ 가슴 courage -->\n      <polygon points=\"0,21 1.7,17 5.5,17 2.7,14.5 3.7,11 0,13 -3.7,11 -2.7,14.5 -5.5,17 -1.7,17\" \n               fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"0.5\"/>\n      <line x1=\"0\" y1=\"15\" x2=\"-10\" y2=\"25\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"15\" x2=\"10\" y2=\"25\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"36\" x2=\"-7\" y2=\"53\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"36\" x2=\"7\" y2=\"53\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <path d=\"M 0 35 Q 12 38 14 32\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"66\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">courage</text>\n    </g>\n\n    <text x=\"465\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">they always had the power</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"263\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">home is wherever the heart is — power was already within</text>\n</svg>", "caption": "Dorothy 일행은 Wizard에게 받으러 가지만, 이미 자기 안에 있던 자질을 깨닫고 돌아옴"}, {"no": "3", "title": "Stories Support the Whole Child", "ktitle": "언어와 감정은 평행하지만 서로를 증명하지 않는다. 감정 단어의 부재가 감정 회로의 부재는 아니다.", "field": "교육·발달", "page": "no.01", "oneline": "이야기는 모든 문화에 있고, 아이 ‘전부’를 키울 잠재력이 있다.", "tldr": ["이야기는 모든 문화에 있고, 아이 ‘전부’를 키울 잠재력이 있다.", "어휘·문제해결·언어능력·사고를 다듬는 데 도움을 준다.", "그 영향은 ‘언어 과목’의 경계를 뛰어넘는다."], "analogy": "이야기를 듣고 나누다 보면 새 단어도 배우고, ‘왜 그랬을까?’ 생각도 깊어지죠. 단순히 ‘국어 공부’가 아니라 아이의 사고·관계까지 통째로 자라는 거예요.", "bg": "분야는 교육·아동 발달이에요. 이야기가 모든 문화에 있고 아이를 통째로 키울 잠재력이 있다는 것이 출발점. → 이야기가 아이의 ‘어떤 면’을 함께 키우는지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "이야기는 모든 문화에 존재 → 아이 ‘전부’ 지원 잠재력"}, {"kind": "언어", "t": "어휘·문제해결·언어능력·사고 다듬기"}, {"kind": "맥락", "t": "성인과 상호작용=맥락화 언어 / 설명=비맥락화 언어"}, {"kind": "환경", "t": "가정·학교·보육 모두에서 문해력 발달 지원"}, {"kind": "결론", "t": "이야기의 영향은 ‘언어 과목’ 경계를 넘는다"}], "quiz": [["이야기가 어린이 언어 발달에 주는 도움은?", "새 어휘 학습, 문제 해결, 언어 능력 개발, 사고를 다듬는 데 도움을 줘요."], ["이 글이 강조하는 이야기의 ‘더 넓은’ 영향은?", "읽기 준비·이해·논리적 사고 같은 인지 기술까지, 그 영향이 언어 과목의 경계를 뛰어넘는다는 점이에요."], ["핵심 한 문장?", "이야기는 언어뿐 아니라 사고·인지까지 아이 전부를 키우며, 언어 과목의 경계를 넘어선다."]], "vocab": [["literacy", "문해력"], ["competency", "능력·역량"], ["contextualized", "맥락화된"], ["cognitive", "인지의"], ["comprehension", "이해(력)"], ["narrative", "이야기·서사"], ["surpass", "뛰어넘다·능가하다"]], "en": "Just as stories are present in all cultural groups, they also have the potential to support the whole child across diverse areas and contexts. Stories are widely recognized for the role they play in helping young children develop language and literacy. Listening to stories and having conversations about stories helps children learn new vocabulary, solve problems, develop language and new language competencies, and refine their thinking. Through stories, children learn contextualized language while interacting with adults and decontextualized language individually in the context of telling stories or explaining their thoughts. Storytelling, story reading, and story play are widely recognized as experiences that support children's literacy development in the home environment, in schools, and in childcare settings. Studies confirming the benefits of children's exposure to stories for cognitive skills such as reading readiness, comprehension, and logical thought abound, but the influence of narratives surpasses the boundaries of language arts.", "ko": "이야기가 모든 문화 집단에 존재하듯이, 그것은 다양한 영역과 맥락에서 아이 전부를 지원할 잠재력도 가지고 있다. 이야기는 어린아이들이 언어와 문해력을 발달시키는 데 도움을 주는 역할로 널리 인정받고 있다. 이야기를 듣고 이야기에 대해 대화하는 것은 아이들이 새로운 어휘를 배우고, 문제를 해결하고, 언어와 새로운 언어 능력을 개발하며, 자신의 사고를 다듬는 데 도움을 준다. 이야기를 통해 아이들은 성인과 상호 작용하면서 맥락화된 언어를 배우고, 이야기를 전하거나 자신의 생각을 설명하는 맥락에서 개별적으로 비맥락화된 언어를 배운다. 이야기하기, 이야기 읽기, 이야기 놀이는 가정 환경, 학교, 그리고 보육 환경에서 아이들의 문해력 발달을 지원하는 경험으로 널리 인정받고 있다. 읽기 준비, 이해력, 그리고 논리적 사고와 같은 인지적 기술을 위해 아이들이 이야기를 접하는 것의 이점을 입증하는 연구들은 풍부하지만, 내러티브의 영향은 언어 과목의 경계를 뛰어넘는다.", "read": [{"en": "Just as stories are present in all cultural groups, they also have the potential to support the whole child across diverse areas and contexts.", "ko": "이야기가 모든 문화 집단에 존재하듯이, 그것은 다양한 영역과 맥락에서 아이 전부를 지원할 잠재력도 가지고 있다.", "chunks": [["Just as stories are present in all cultural groups,", "이야기가 모든 문화 집단에 존재하듯이,"], ["they also have the potential", "그것 또한 잠재력을 가지고 있다"], ["to support the whole child", "아이 전체를 지원할"], ["across diverse areas and contexts.", "다양한 영역과 맥락에 걸쳐."]]}, {"en": "Stories are widely recognized for the role they play in helping young children develop language and literacy.", "ko": "이야기는 어린아이들이 언어와 문해력을 발달시키는 데 도움을 주는 역할로 널리 인정받고 있다.", "chunks": [["Stories are widely recognized", "이야기는 널리 인정받는다"], ["for the role they play", "그것이 하는 역할로"], ["in helping young children develop", "어린아이들이 ~을 발달시키는 것을 돕는 데에"], ["language and literacy.", "언어와 문해력을."]]}, {"en": "Listening to stories and having conversations about stories helps children learn new vocabulary, solve problems, develop language and new language competencies, and refine their thinking.", "ko": "이야기를 듣고 이야기에 대해 대화하는 것은 아이들이 새로운 어휘를 배우고, 문제를 해결하고, 언어와 새로운 언어 능력을 발달시키고, 사고를 정교하게 하는 데 도움을 준다.", "chunks": [["Listening to stories and having conversations about stories", "이야기를 듣고 이야기에 대해 대화하는 것은"], ["helps children learn new vocabulary,", "아이들이 새 어휘를 배우고,"], ["solve problems,", "문제를 해결하고,"], ["develop language and new language competencies,", "언어와 새로운 언어 능력을 발달시키고,"], ["and refine their thinking.", "사고를 정교하게 다듬는 것을 돕는다."]]}, {"en": "Through stories, children learn contextualized language while interacting with adults and decontextualized language individually in the context of telling stories or explaining their thoughts.", "ko": "이야기를 통해, 아이들은 어른들과 상호 작용하면서 맥락 내 언어를 배우고, 이야기를 들려주거나 자신의 생각을 설명하는 맥락에서 개별적으로 맥락 분리 언어를 배운다.", "chunks": [["Through stories,", "이야기를 통해,"], ["children learn contextualized language", "아이들은 맥락 내 언어를 배우고"], ["while interacting with adults", "어른들과 상호 작용하면서"], ["and decontextualized language individually", "그리고 개별적으로 맥락 분리 언어를 배운다"], ["in the context of telling stories", "이야기를 들려주거나"], ["or explaining their thoughts.", "자신의 생각을 설명하는 맥락에서."]]}, {"en": "Storytelling, story reading, and story play are widely recognized as experiences that support children's literacy development in the home environment, in schools, and in childcare settings.", "ko": "이야기 들려주기, 이야기 읽기, 그리고 이야기 놀이는 가정 환경, 학교, 그리고 보육 환경에서 아이들의 문해력 발달을 지원하는 경험으로 널리 인정받는다.", "chunks": [["Storytelling, story reading, and story play", "이야기 들려주기, 이야기 읽기, 그리고 이야기 놀이는"], ["are widely recognized as experiences", "경험으로 널리 인정받는다"], ["that support children's literacy development", "아이들의 문해력 발달을 지원하는"], ["in the home environment, in schools,", "가정 환경에서, 학교에서,"], ["and in childcare settings.", "그리고 보육 환경에서."]]}, {"en": "Studies confirming the benefits of children's exposure to stories for cognitive skills such as reading readiness, comprehension, and logical thought abound, but the influence of narratives surpasses the boundaries of language arts.", "ko": "아이들이 이야기에 노출되는 것의 이점이 읽기 준비도, 이해력, 논리적 사고와 같은 인지 능력에 대해 확증하는 연구가 풍부하지만, 서사의 영향력은 국어과의 경계를 넘어선다.", "chunks": [["Studies confirming the benefits", "이점을 확증하는 연구들이"], ["of children's exposure to stories", "아이들이 이야기에 노출되는 것의"], ["for cognitive skills such as reading readiness, comprehension, and logical thought", "읽기 준비도, 이해력, 그리고 논리적 사고와 같은 인지 능력에 대한"], ["abound,", "풍부하다,"], ["but the influence of narratives", "그러나 서사의 영향력은"], ["surpasses the boundaries of language arts.", "국어과의 경계를 넘어선다."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"가운데 펼친 책(STORY)을 중심으로 다섯 발달 영역(언어·문해/인지/사회/정서/창의)이 방사형으로 뻗어 있고, 외곽의 점선 타원이 모든 문화의 보편성을 표시한 그림.\">\n  <!-- 외곽 점선 타원 — 모든 문화 보편 -->\n  <ellipse cx=\"300\" cy=\"130\" rx=\"278\" ry=\"118\" fill=\"#f0faf3\" fill-opacity=\"0.2\" stroke=\"#1FA34A\" stroke-width=\"1.6\" stroke-dasharray=\"6 4\"/>\n\n  <!-- 상단 외곽 라벨 -->\n  <text x=\"300\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">all cultural groups — universal</text>\n\n  <!-- 가지 5개: 중심에서 점선으로 -->\n  <g stroke=\"#1FA34A\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\" fill=\"none\">\n    <line x1=\"278\" y1=\"115\" x2=\"135\" y2=\"85\"/>     <!-- → Language & Literacy -->\n    <line x1=\"300\" y1=\"105\" x2=\"300\" y2=\"60\"/>     <!-- → Cognitive -->\n    <line x1=\"322\" y1=\"115\" x2=\"465\" y2=\"85\"/>     <!-- → Social -->\n    <line x1=\"320\" y1=\"155\" x2=\"445\" y2=\"200\"/>    <!-- → Emotional -->\n    <line x1=\"280\" y1=\"155\" x2=\"155\" y2=\"200\"/>    <!-- → Creative -->\n  </g>\n\n  <!-- 중심: 펼친 책 -->\n  <g transform=\"translate(300, 130)\">\n    <!--  가지 2: Cognitive (위) -->\n  <g transform=\"translate(300, 50)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"42\" ry=\"20\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">Cognitive</text>\n    <text x=\"0\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">인지·사고</text>\n  </g>\n\n  <!-- 가지 3: Social (우상) -->\n  <g transform=\"translate(490, 85)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"45\" ry=\"22\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">Social</text>\n    <text x=\"0\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">사회·관계</text>\n  </g>\n\n  <!-- 가지 4: Emotional (우하) -->\n  <g transform=\"translate(470, 205)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"48\" ry=\"22\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">Emotional</text>\n    <text x=\"0\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">정서·공감</text>\n  </g>\n\n  <!-- 가지 5: Creative (좌하) -->\n  <g transform=\"translate(130, 205)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"45\" ry=\"22\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">Creative</text>\n    <text x=\"0\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">창의·상상</text>\n  </g>\n\n  <!-- 가운데 본문 인용 (책 위쪽) -->\n  <text x=\"300\" y=\"170\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">\"the whole child across diverse areas\"</text>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">five domains, one story — engine of whole-child development</text>\n</svg>", "caption": "이야기 = 모든 문화에 보편 + 언어·문해 + 인지·사회·정서·창의 발달의 동시 떠받침"}, {"no": "4", "title": "Integrity: 'Honest Abe'", "ktitle": "친환경 생활은 전부 아니면 전무가 아니다. 가능한 만큼 작은 변화가 진짜 중요하다.", "field": "윤리·인물", "page": "no.02", "oneline": "진실성은 도덕·윤리 원칙을 지키는, 인격의 강점을 드러내는 덕목이다.", "tldr": ["진실성은 도덕·윤리 원칙을 지키는, 인격의 강점을 드러내는 덕목이다.", "링컨은 정직으로 ‘정직한 에이브’라는 별명을 얻었다.", "개인적·정치적 대가에도 ‘옳은 일’을 고집 — 진실성의 본질."], "analogy": "손해를 보더라도 ‘옳으니까 한다’는 사람을 보면 믿음이 가죠. 링컨이 반대를 무릅쓰고 노예제 폐지를 밀어붙인 게 바로 그 ‘진실성’이에요.", "bg": "분야는 윤리예요. 핵심 덕목은 ‘진실성(integrity)’ — 도덕·윤리 원칙을 지키는 인격의 강점. ‘정직한 에이브(링컨)’가 예로 나와요. → 진실성이 어떤 덕목인지에 주목하며 읽으세요.", "flow": [{"kind": "정의", "t": "진실성 = 도덕·윤리 원칙 준수 → 인격의 강점"}, {"kind": "본보기", "t": "흔들리지 않는 도덕적 나침반 = 우리에게 감화"}, {"kind": "사례", "t": "링컨 — 정직으로 ‘정직한 에이브’"}, {"kind": "증명", "t": "극심한 반대에도 노예제 폐지 헌신 확고"}, {"kind": "결론", "t": "대가에도 ‘옳은 일’ 고집 = 진실성의 본질"}], "quiz": [["진실성(integrity)이란?", "도덕적·윤리적 원칙을 준수하는, 인격의 강점을 드러내는 덕목이에요."], ["링컨이 진실성의 본보기인 이유는?", "극심한 반대에도 노예제 폐지에 헌신하고, 개인·정치적 대가에도 옳은 일을 고집했기 때문이에요."], ["핵심 한 문장?", "진실성은 대가를 치르더라도 옳은 일을 지키는 것이며, 링컨이 그 본질을 구현한다."]], "vocab": [["integrity", "진실성·고결함"], ["virtue", "덕목"], ["adhere to", "~을 고수하다·준수하다"], ["embody", "구현하다"], ["unwavering", "흔들리지 않는"], ["steadfast", "확고한"], ["abolition", "폐지"]], "en": "Integrity is a virtue that illuminates the strength of one's character. It's about adhering to moral and ethical principles, and this characteristic is beautifully embodied in the lives of certain individuals. Their commitment to honesty and their unwavering moral compass serve as an inspiration for us all. Let's explore some examples of such inspiring figures whose lives demonstrate a high level of integrity. Abraham Lincoln, the 16th President of the United States, remains an enduring symbol of honesty and integrity. His dedication to truthfulness was so profound that he earned the nickname \"Honest Abe\". Lincoln demonstrated integrity in his personal and political life, remaining steadfast in his commitment to the abolition of slavery, despite the intense opposition and challenges he faced. His insistence on doing what was right, regardless of personal or political cost, embodies the essence of integrity.", "ko": "진실성은 인격의 강점을 분명하게 하는 덕목이다. 그것은 도덕적, 윤리적 원칙을 준수하는 것에 관한 것이며, 이 특성은 특정 개인의 삶에서 아름답게 구현된다. 정직에 대한 그들의 헌신과 흔들리지 않는 도덕적 나침반은 우리 모두에게 우리 모두에게 영감을 준다. 높은 수준의 진실성을 삶으로 증명한 이러한 감화를 주는 인물들의 몇 가지 사례를 살펴보자. 미국의 제16대 대통령인 Abraham Lincoln은 정직과 진실성의 영원한 상징으로 남아 있다. 정직에 대한 그의 헌신은 아주 커서 '정직한 Abe'라는 별명을 얻었다. Lincoln은 개인적, 정치적 삶에서 진실성을 보여 주었고 그가 직면했던 극심한 반대와 난관에도 불구하고 노예제 폐지에 대한 헌신을 확고히 유지했다. 개인적 또는 정치적 대가를 치르더라도 옳은 일을 하겠다는 그의 고집은 진실성의 본질을 구현한다.", "read": [{"en": "Integrity is a virtue that illuminates the strength of one's character.", "ko": "진실성은 인격의 강점을 분명하게 하는 덕목이다.", "chunks": [["Integrity is a virtue", "진실성은 덕목이다"], ["that illuminates the strength", "강점을 분명히 드러내는"], ["of one's character.", "인격의."]]}, {"en": "It's about adhering to moral and ethical principles, and this characteristic is beautifully embodied in the lives of certain individuals.", "ko": "그것은 도덕적, 윤리적 원칙을 준수하는 것에 관한 것이며, 이 특성은 특정 개인의 삶에서 아름답게 구현된다.", "chunks": [["It's about adhering to moral and ethical principles,", "그것은 도덕적·윤리적 원칙을 준수하는 것에 관한 것이다,"], ["and this characteristic is beautifully embodied", "그리고 이 특성은 아름답게 구현된다"], ["in the lives of certain individuals.", "특정 개인의 삶에서."]]}, {"en": "Their commitment to honesty and their unwavering moral compass serve as an inspiration for us all.", "ko": "정직에 대한 그들의 헌신과 흔들리지 않는 도덕적 나침반은 우리 모두에게 감화를 주는 것의 역할을 한다.", "chunks": [["Their commitment to honesty", "정직에 대한 그들의 헌신과"], ["and their unwavering moral compass", "흔들리지 않는 도덕적 나침반은"], ["serve as an inspiration for us all.", "우리 모두에게 감화의 역할을 한다."]]}, {"en": "Let's explore some examples of such inspiring figures whose lives demonstrate a high level of integrity.", "ko": "그러한 감화를 주는 인물들 중에서 그들의 삶이 높은 수준의 진실성을 보여 주는 몇 가지 예시를 살펴보자.", "chunks": [["Let's explore some examples", "몇 가지 예시를 살펴보자"], ["of such inspiring figures", "그러한 감화를 주는 인물들의"], ["whose lives demonstrate", "그 삶이 보여 주는"], ["a high level of integrity.", "높은 수준의 진실성을."]]}, {"en": "Abraham Lincoln, the 16th President of the United States, remains an enduring symbol of honesty and integrity.", "ko": "미국 제16대 대통령 Abraham Lincoln은 정직과 진실성의 지속적인 상징으로 남아 있다.", "chunks": [["Abraham Lincoln,", "Abraham Lincoln은,"], ["the 16th President of the United States,", "미국 제16대 대통령으로서,"], ["remains an enduring symbol", "지속적인 상징으로 남아 있다"], ["of honesty and integrity.", "정직과 진실성의."]]}, {"en": "His dedication to truthfulness was so profound that he earned the nickname \"Honest Abe\".", "ko": "진실에 대한 그의 헌신이 너무도 깊어서 그는 '정직한 Abe'라는 별명을 얻었다.", "chunks": [["His dedication to truthfulness", "진실에 대한 그의 헌신은"], ["was so profound", "너무도 깊어서"], ["that he earned the nickname \"Honest Abe\".", "그가 '정직한 Abe'라는 별명을 얻었다."]]}, {"en": "Lincoln demonstrated integrity in his personal and political life, remaining steadfast in his commitment to the abolition of slavery, despite the intense opposition and challenges he faced.", "ko": "Lincoln은 개인적, 정치적 삶에서 진실성을 보여 주었고, 그가 직면했던 극심한 반대와 난관에도 불구하고 노예제 폐지에 대한 헌신을 확고히 유지했다.", "chunks": [["Lincoln demonstrated integrity", "Lincoln은 진실성을 보여 주었다"], ["in his personal and political life,", "그의 개인적·정치적 삶에서,"], ["remaining steadfast in his commitment", "한결같이 ~에 대한 헌신을 유지하면서"], ["to the abolition of slavery,", "노예제 폐지,"], ["despite the intense opposition", "극심한 반대에도 불구하고"], ["and challenges he faced.", "그리고 그가 직면했던 난관에도."]]}, {"en": "His insistence on doing what was right, regardless of personal or political cost, embodies the essence of integrity.", "ko": "개인적이거나 정치적인 대가에 관계없이 옳은 것을 행하는 것에 대한 그의 고집은 진실성의 본질을 구현한다.", "chunks": [["His insistence on doing what was right,", "옳은 것을 행하는 것에 대한 그의 고집은,"], ["regardless of personal or political cost,", "개인적·정치적 대가에 관계없이,"], ["embodies the essence of integrity.", "진실성의 본질을 구현한다."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: integrity 정의 — 도덕 원칙 박스에서 화살표로 인물의 가슴 별로 내려와 영감 빛이 위로 발산. 오른쪽: stovepipe hat 쓴 Lincoln 실루엣과 끊어진 사슬로 노예제 폐지를 표현.\">\n  <!-- 좌측 박스 — Integrity 정의 -->\n  <g>\n    <text x=\"135\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Integrity — 인격 강점의 덕목</text>\n    <rect x=\"20\" y=\"30\" width=\"230\" height=\"200\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 위쪽: 원칙 박스 -->\n    <g transform=\"translate(135, 65)\">\n      <rect x=\"-90\" y=\"-15\" width=\"180\" height=\"30\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"-1\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">moral · ethical principles</text>\n      <text x=\"0\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">도덕·윤리 원칙</text>\n    </g>\n\n    <!-- embodied 화살표 -->\n    <g transform=\"translate(135, 95)\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"20\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/>\n      <polygon points=\"0,20 -5,12 5,12\" fill=\"#1FA34A\"/>\n      <text x=\"-26\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"end\" fill=\"#1FA34A\">embodied</text>\n      <text x=\"26\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#5e5e5e\">삶으로 구현</text>\n    </g>\n\n    <!-- stick figure (인물·가슴에 ★) -->\n    <g transform=\"translate(135, 145)\">\n      <!-- 빛 발산 (위쪽) -->\n      <g stroke=\"#1FA34A\" stroke-width=\"1.3\" fill=\"none\">\n        <line x1=\"0\" y1=\"-23\" x2=\"0\" y2=\"-32\"/>\n        <line x1=\"-9\" y1=\"-19\" x2=\"-15\" y2=\"-26\"/>\n        <line x1=\"9\" y1=\"-19\" x2=\"15\" y2=\"-26\"/>\n        <line x1=\"-13\" y1=\"-13\" x2=\"-22\" y2=\"-15\"/>\n        <line x1=\"13\" y1=\"-13\" x2=\"22\" y2=\"-15\"/>\n      </g>\n      <!-- 머리 -->\n      <circle cx=\"0\" cy=\"-13\" r=\"11\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <circle cx=\"-3\" cy=\"-14\" r=\"1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-14\" r=\"1\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 -9 Q 0 -7 3 -9\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <!-- 몸 -->\n      <line x1=\"0\" y1=\"-2\" x2=\"0\" y2=\"35\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <!-- ★ 가슴 -->\n      <polygon points=\"0,13 2.5,7 9,7 4,3 5.5,-3.5 0,0 -5.5,-3.5 -4,3 -9,7 -2.5,7\" \n               fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"0.6\"/>\n      <!-- 팔 -->\n      <line x1=\"0\" y1=\"6\" x2=\"-13\" y2=\"18\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"6\" x2=\"13\" y2=\"18\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 다리 -->\n      <line x1=\"0\" y1=\"35\" x2=\"-9\" y2=\"55\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"35\" x2=\"9\" y2=\"55\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    </g>\n\n    <text x=\"135\" y=\"220\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">inspiration for us all</text>\n  </g>\n\n  <!-- 가운데 화살표 -->\n  <g transform=\"translate(258, 125)\">\n    <text x=\"20\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">exemplar</text>\n    <line x1=\"0\" y1=\"0\" x2=\"40\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"40,0 32,-5 32,5\" fill=\"#1FA34A\"/>\n    <text x=\"20\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">대표 사례</text>\n  </g>\n\n  <!-- 우측 박스 — Lincoln -->\n  <g>\n    <text x=\"445\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Abraham Lincoln · 16th President</text>\n    <rect x=\"310\" y=\"30\" width=\"270\" height=\"200\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- Lincoln 인물 (좌측, x=375 영역) -->\n    <g transform=\"translate(380, 0)\">\n      <!-- Stovepipe hat (긴 실린더) -->\n      <rect x=\"-12\" y=\"55\" width=\"24\" height=\"6\" fill=\"#1a1a1a\"/>     <!-- 챙 -->\n      <rect x=\"-8\" y=\"28\" width=\"16\" height=\"28\" fill=\"#1a1a1a\"/>     <!-- 본체 -->\n      <rect x=\"-8\" y=\"48\" width=\"16\" height=\"3\" fill=\"#c8102e\"/>      <!-- 챙 위 빨간 띠 -->\n\n      <!-- 머리 -->\n      <circle cx=\"0\" cy=\"73\" r=\"11\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 귀 (살짝) -->\n      <ellipse cx=\"-11\" cy=\"73\" rx=\"1.5\" ry=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <ellipse cx=\"11\" cy=\"73\" rx=\"1.5\" ry=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <!-- 눈 (진지) -->\n      <circle cx=\"-3.5\" cy=\"72\" r=\"1.2\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3.5\" cy=\"72\" r=\"1.2\" fill=\"#1a1a1a\"/>\n      <!-- 입 (가는 선) -->\n      <line x1=\"-3\" y1=\"78\" x2=\"3\" y2=\"78\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <!-- 턱수염 (chin beard) -->\n      <path d=\"M -7 80 Q -5 90 0 92 Q 5 90 7 80 L 6 86 L -6 86 Z\" fill=\"#1a1a1a\"/>\n\n      <!-- 몸 (키 큰) -->\n      <line x1=\"0\" y1=\"86\" x2=\"0\" y2=\"165\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n\n      <!-- 팔 -->\n      <line x1=\"0\" y1=\"105\" x2=\"-15\" y2=\"135\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <line x1=\"0\" y1=\"105\" x2=\"18\" y2=\"118\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n\n      <!-- 다리 -->\n      <line x1=\"0\" y1=\"165\" x2=\"-9\" y2=\"195\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <line x1=\"0\" y1=\"165\" x2=\"9\" y2=\"195\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n\n      <!-- \"Honest Abe\" 라벨 (가슴 옆) -->\n      <g transform=\"translate(-37, 135)\">\n        <rect x=\"-25\" y=\"-8\" width=\"50\" height=\"16\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">\"Honest Abe\"</text>\n      </g>\n      <line x1=\"-12\" y1=\"135\" x2=\"-7\" y2=\"120\" stroke=\"#1FA34A\" stroke-width=\"0.9\" stroke-dasharray=\"2 2\"/>\n    </g>\n\n    <!-- 우측: 사슬 끊기 (노예제 폐지) -->\n    <g transform=\"translate(495, 120)\">\n      <!-- \"abolish slavery\" 라벨 위 -->\n      <text x=\"0\" y=\"-50\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">abolish slavery</text>\n      <text x=\"0\" y=\"-38\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">노예제 폐지</text>\n\n      <!-- 사슬 위쪽 3 고리 -->\n      <ellipse cx=\"0\" cy=\"-25\" rx=\"9\" ry=\"5\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.7\"/>\n      <ellipse cx=\"0\" cy=\"-15\" rx=\"5\" ry=\"8\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.7\"/>\n      <ellipse cx=\"0\" cy=\"-5\" rx=\"9\" ry=\"5\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.7\"/>\n\n      <!-- 끊김 표시 (✗ 초록 + 빨강 빗금) -->\n      <g transform=\"translate(0, 8)\">\n        <line x1=\"-12\" y1=\"-4\" x2=\"12\" y2=\"4\" stroke=\"#1FA34A\" stroke-width=\"2.5\"/>\n        <text x=\"22\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1FA34A\" font-weight=\"700\">broken</text>\n      </g>\n\n      <!-- 사슬 아래쪽 3 고리 (떨어짐) -->\n      <ellipse cx=\"-3\" cy=\"22\" rx=\"5\" ry=\"8\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.7\" transform=\"rotate(-12 0 22)\"/>\n      <ellipse cx=\"-3\" cy=\"34\" rx=\"9\" ry=\"5\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.7\" transform=\"rotate(-12 0 34)\"/>\n      <ellipse cx=\"-3\" cy=\"44\" rx=\"5\" ry=\"8\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.7\" transform=\"rotate(-12 0 44)\"/>\n    </g>\n\n    <!-- \"despite opposition · threats\" 빨강 (위쪽) -->\n    <text x=\"445\" y=\"222\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">despite opposition · threats</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"246\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">dedication to truthfulness · unwavering moral compass</text>\n</svg>", "caption": "도덕·윤리 원칙이 삶으로 구현될 때 감화가 됨 — 대표 사례 = Abraham Lincoln"}, {"no": "5", "title": "Thinking 'Outside the Box', Literally", "ktitle": "몸을 ‘상자 밖’에 두면 창의력이 는다", "field": "심리·창의성", "page": "no.03", "oneline": "몸의 움직임은 ‘움직임=사고’라는 무의식적 은유를 활성화한다.", "tldr": ["몸의 움직임은 ‘움직임=사고’라는 무의식적 은유를 활성화한다.", "‘꽉 막힘/흐름’ 같은 말처럼, 창의 표현을 ‘몸으로’ 연출하면 창의 상태가 된다.", "실험: 문자 그대로 ‘상자 밖’에 앉은 사람이 해법을 20% 더 냈다."], "analogy": "‘틀을 깬다’는 말을 몸으로 실천해 진짜 상자 ‘밖’에 앉았더니 아이디어가 더 쏟아졌어요. 몸의 자세가 생각의 자세를 바꾸는 거죠.", "bg": "분야는 심리·창의성이에요. 핵심은 몸의 움직임이 ‘움직임=사고’라는 무의식적 은유를 활성화한다는 것(‘상자 밖에서 생각하기’를 문자 그대로). → 신체 행동이 창의적 사고에 어떻게 작용하는지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "몸의 움직임 → ‘움직임=사고’ 은유 활성화"}, {"kind": "언어", "t": "‘꽉 막힘/틀에 박힘’ vs ‘흐름/굴러감’"}, {"kind": "실험", "t": "창의 표현을 ‘몸으로’ 연출 → 창의 상태", "d": "‘상자 밖에서 생각하기’."}, {"kind": "결과", "t": "상자 ‘밖’ 참가자 = 해법 목록 20%↑"}, {"kind": "결론", "t": "몸의 자세가 사고의 창의성을 바꾼다"}], "quiz": [["몸을 움직이는 것이 사고와 어떻게 연결되나?", "‘움직임=사고’를 잇는 무의식적 은유를 활성화해, 창의 관련 표현을 몸으로 연출하면 창의 상태가 돼요."], ["Polman 실험 결과는?", "문자 그대로 ‘상자 밖’에 앉아 사고한 참가자가 상자 안 참가자보다 평균 20% 더 긴 창의적 해법을 냈어요."], ["핵심 한 문장?", "‘상자 밖에서 생각하기’를 몸으로 실천하면 실제로 창의력이 높아진다."]], "vocab": [["ingrained", "깊이 밴·뿌리박힌"], ["metaphor", "은유"], ["in a rut", "틀에 박힌"], ["on a roll", "잘 풀리는·신나는"], ["act out", "연출하다·실연하다"], ["figure of speech", "비유적 표현"], ["on average", "평균적으로"]], "en": "By moving our bodies, we activate a deeply ingrained and mostly unconscious metaphor connecting dynamic motion with dynamic thinking. Call to mind the words we use when we can't seem to come up with an original idea ─ we're \"stuck,\" \"in a rut\" ─ and those we reach for when we feel visited by the muse. Then we're \"on a roll,\" our thoughts are \"flowing.\" Research has demonstrated that people can be placed in a creative state of mind by physically acting out creativity-related figures of speech ─ like \"thinking outside the box.\" Psychologist Evan Polman of the University of Wisconsin ─ Madison designed an experiment in which participants were asked to complete a creative thinking task. Some students carried out the assignment while sitting inside a five-foot-square cardboard box; others completed the task while sitting next to the box. The participants who did their thinking literally \"outside the box\" came up with a list of creative solutions that was, on average, 20 percent longer than the list produced by those who brainstormed inside the box.", "ko": "몸을 움직임으로써, 우리는 역동적인 '움직임'과 역동적인 '사고'를 연결하는 깊이 몸에 밴 그리고 대체로 무의식적인 은유를 활성화한다. 우리가 독창적인 아이디어를 떠올릴 수 없을 것 같을 때 사용하는 \"꽉 막혔다\", \"틀에 박혀 있다\"와 같은 말과 뮤즈의 방문을 받았다고 느낄 때 우리가 손을 뻗는 말을 상기해 보라. 그때 우리는 \"굴러가고\" 있으며, 우리의 생각은 \"흐르고\" 있다. 연구는 사람들이 \"새로운 방식으로 생각하기\"와 같은 창의성과 관련된 비유적 표현을 신체적으로 연출함으로써 창의적인 상태로 들어갈 수 있음을 입증했다. Wisconsin 대학교 Madison 캠퍼스의 심리학자 Evan Polman은 참가자들이 창의적인 사고 과제를 완료하도록 요청 받는 한 실험을 설계했다. 일부 학생들은 5피트 정사각형의 판지 상자 안에 앉아 과제를 수행했고, 다른 학생들은 상자 옆에 앉아 과제를 수행했다. 문자 그대로 '상자 밖에서' 사고한 참가자들은 평균적으로 상자 안에서 브레인스토밍한 참가자들보다 20퍼센트 더 긴 창의적인 해결책 목록을 생각해 냈다.", "read": [{"en": "By moving our bodies, we activate a deeply ingrained and mostly unconscious metaphor connecting dynamic motion with dynamic thinking.", "ko": "몸을 움직임으로써, 우리는 역동적인 '움직임'과 역동적인 '사고'를 연결하는 깊이 몸에 밴 그리고 대체로 무의식적인 은유를 활성화한다.", "chunks": [["By moving our bodies,", "몸을 움직임으로써,"], ["we activate a deeply ingrained and mostly unconscious metaphor", "우리는 깊이 몸에 밴 그리고 대체로 무의식적인 은유를 활성화한다"], ["connecting dynamic motion with dynamic thinking.", "역동적 움직임을 역동적 사고와 연결하는."]]}, {"en": "Call to mind the words we use when we can't seem to come up with an original idea ─ we're \"stuck,\" \"in a rut\" ─ and those we reach for when we feel visited by the muse.", "ko": "우리가 독창적인 아이디어를 떠올릴 수 없을 것 같을 때 사용하는 '꽉 막혔다', '틀에 박혀 있다'와 같은 말과, 뮤즈의 방문을 받았다고 느낄 때 우리가 끌어내는 말들을 떠올려 보라.", "chunks": [["Call to mind the words we use", "우리가 사용하는 말을 떠올려 보라"], ["when we can't seem to come up with an original idea ─", "독창적인 아이디어를 떠올릴 수 없을 것 같을 때 ─"], ["we're \"stuck,\" \"in a rut\" ─", "'꽉 막혔다,' '틀에 박혀 있다' ─"], ["and those we reach for", "그리고 우리가 끌어내는 것들을"], ["when we feel visited by the muse.", "뮤즈의 방문을 받았다고 느낄 때."]]}, {"en": "Then we're \"on a roll,\" our thoughts are \"flowing.\"", "ko": "그때 우리는 '순조롭게 진행 중'이고, 우리의 생각은 '흐른다.'", "chunks": [["Then we're \"on a roll,\"", "그때 우리는 '순조롭게 진행 중'이고,"], ["our thoughts are \"flowing.\"", "우리의 생각은 '흘러간다.'"]]}, {"en": "Research has demonstrated that people can be placed in a creative state of mind by physically acting out creativity-related figures of speech ─ like \"thinking outside the box.\"", "ko": "연구는 사람들이 '틀을 벗어나 생각하는 것'과 같은 창의성 관련 비유 표현을 몸으로 실행함으로써 창의적인 마음 상태에 놓일 수 있음을 증명해 왔다.", "chunks": [["Research has demonstrated", "연구는 증명해 왔다"], ["that people can be placed in a creative state of mind", "사람들이 창의적인 마음 상태에 놓일 수 있음을"], ["by physically acting out creativity-related figures of speech ─", "창의성 관련 비유 표현을 몸으로 실행함으로써 ─"], ["like \"thinking outside the box.\"", "'틀을 벗어나 생각하는 것'과 같은."]]}, {"en": "Psychologist Evan Polman of the University of Wisconsin ─ Madison designed an experiment in which participants were asked to complete a creative thinking task.", "ko": "Wisconsin-Madison 대학의 심리학자 Evan Polman은 참가자들이 창의적 사고 과제를 완수하도록 요청받는 실험을 설계했다.", "chunks": [["Psychologist Evan Polman of the University of Wisconsin ─ Madison", "University of Wisconsin─Madison의 심리학자 Evan Polman은"], ["designed an experiment", "실험을 설계했다"], ["in which participants were asked", "그 실험에서 참가자들은 요청받았다"], ["to complete a creative thinking task.", "창의적 사고 과제를 완수하도록."]]}, {"en": "Some students carried out the assignment while sitting inside a five-foot-square cardboard box; others completed the task while sitting next to the box.", "ko": "일부 학생들은 5피트 정사각형 종이 상자 안에 앉아서 과제를 수행했고; 다른 학생들은 상자 옆에 앉아서 과제를 완수했다.", "chunks": [["Some students carried out the assignment", "일부 학생들은 과제를 수행했다"], ["while sitting inside a five-foot-square cardboard box;", "5피트 정사각형 종이 상자 안에 앉아서;"], ["others completed the task", "다른 학생들은 과제를 완수했다"], ["while sitting next to the box.", "상자 옆에 앉아서."]]}, {"en": "The participants who did their thinking literally \"outside the box\" came up with a list of creative solutions that was, on average, 20 percent longer than the list produced by those who brainstormed inside the box.", "ko": "글자 그대로 '상자 밖'에서 사고한 참가자들은, 상자 안에서 브레인스토밍한 사람들이 만든 목록보다 평균적으로 20퍼센트 더 긴 창의적 해결책 목록을 떠올렸다.", "chunks": [["The participants who did their thinking literally \"outside the box\"", "글자 그대로 '상자 밖'에서 사고한 참가자들은"], ["came up with a list of creative solutions", "창의적 해결책 목록을 떠올렸다"], ["that was, on average, 20 percent longer", "평균적으로 20퍼센트 더 긴"], ["than the list produced", "만들어진 목록보다"], ["by those who brainstormed inside the box.", "상자 안에서 브레인스토밍한 사람들이."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 큰 빨강 박스 안에 갇힌 점선 사람이 막힌 사고를 표현. 가운데: step outside 화살표. 오른쪽: 같은 사람이 작은 박스 밖에서 자유롭게 움직이고 머리 위로 별 생각이 흐르며 20% more creative 라벨.\">\n  <!-- 좌측 박스 — stuck -->\n  <g>\n    <text x=\"140\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">갇힘 — stuck, in a rut</text>\n    <rect x=\"20\" y=\"30\" width=\"240\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" strok    <text x=\"460\" y=\"225\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">thoughts flowing · on a roll</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"246\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">the metaphor works literally — dynamic motion = dynamic thinking</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '몸의 움직임 → ‘움직임=사고’ 은유 활성화'이고, 마지막은 '몸의 자세가 사고의 창의성을 바꾼다'로 정리된다."}, {"no": "6", "title": "Funding Unconventional Science", "ktitle": "틀을 벗어난 연구를 살린 자금", "field": "과학·제도", "page": "no.04", "oneline": "저자는 양자역학 ‘기초’ 연구자 발렌티니를 박사후로 데려왔다.", "tldr": ["저자는 양자역학 ‘기초’ 연구자 발렌티니를 박사후로 데려왔다.", "가능했던 건 한 ‘기부자’의 예상치 못한 지원 덕분.", "공식 기관(NSF) 자금만으론 못 했을 일 — 향후 지원에 해가 됐을 것."], "analogy": "남들이 잘 안 하는 ‘기초 분야’ 연구는 정부 지원 받기가 어려워요. 마침 그 분야를 아끼던 후원자가 나타나 준 덕에, 박사후 연구원 한 명을 그 연구에 앉힐 수 있었던 거죠.", "bg": "분야는 과학·제도예요. 저자가 양자역학 ‘기초’ 연구자 발렌티니를 박사후로 데려온 일화가 소재. → 비주류·기초 과학에 자금을 대는 일이 왜 중요한지에 주목하며 읽으세요.", "flow": [{"kind": "결정", "t": "양자역학 ‘기초’ 연구자 발렌티니를 박사후로 영입"}, {"kind": "가능 이유", "t": "그 분야를 아끼던 ‘기부자’의 예상치 못한 지원"}, {"kind": "판단", "t": "새·중요 결과를 낼 인재 지원 = 돈을 잘 쓴 것"}, {"kind": "대조", "t": "NSF 자금만이었다면 불가능", "d": "기초 연구 공유 = 향후 지원에 해."}, {"kind": "결론", "t": "유연한 사적 지원이 비주류 연구를 살린다"}], "quiz": [["저자가 발렌티니를 영입할 수 있었던 이유는?", "양자역학 기초에 관심을 둔 한 기부자의 예상치 못한 아낌없는 지원을 받았기 때문이에요."], ["공식 기관(NSF) 자금만이었다면 왜 어려웠나?", "기초 연구를 하는 박사후와 보조금을 공유하면 향후 지원금을 받을 가능성에 해가 될 수 있었기 때문이에요."], ["핵심 한 문장?", "비주류지만 중요한 기초 연구는 경직된 공식 자금보다 유연한 사적 지원으로 살아날 수 있었다."]], "vocab": [["postdoc", "박사 후 연구원"], ["donor", "기부자"], ["foundations", "기초·근본"], ["quantum mechanics", "양자역학"], ["grant", "보조금·지원금"], ["generous", "아낌없는·관대한"], ["unexpected", "예상치 못한"]], "en": "I met Antony Valentini in London in 1999, when I was a visiting professor at Imperial College. And after discussions with Christopher Isham, head of the theory group there, we decided to offer him a postdoc and bring him back into science. We were able to do this because I had some unexpected and generous support from a donor who happened to care about the foundations of quantum mechanics. I felt that supporting one of the few people who had proved he could contribute new and important results to this field was putting that money to good use. Had I been supported only by funds from the National Science Foundation, I would not have been able to do this. Though the NSF has been generous to me for my work on quantum gravity, sharing the grant with a postdoc working on foundations of quantum theory could have hurt the chances for future funding.", "ko": "나는 1999년 Imperial College에서 객원 교수로 재직하던 시절 런던에서 Antony Valentini를 만났다. 그리고 그곳 이론 그룹 책임자였던 Christopher Isham과 논의한 끝에, 우리는 그에게 박사 후 연구원을 제안하고 그를 다시 과학계로 불러들이기로 했다. 우리가 이렇게 할 수 있었던 것은 내가 양자역학의 기초에 우연히 관심을 두게 된 한 기부자의 예상하지 못한 아낌없는 지원을 받았기 때문이다. 나는 이 분야에 새롭고 중요한 결과를 가져올 수 있음을 증명한 몇 안 되는 사람 중 한 명을 지원하는 것이 그 돈을 잘 사용하는 것으로 생각했다. 만약 내가 National Science Foundation의 자금만 지원 받았다면 이 일을 할 수 없었을 것이다. 양자 중력에 관한 나의 연구에 대해 NSF는 관대했지만, 이 보조금을 양자 이론의 기초를 연구하는 박사 후 연구원과 공유했다면 향후 지원금을 받을 가능성에 해가 되었을 것이다.", "read": [{"en": "I met Antony Valentini in London in 1999, when I was a visiting professor at Imperial College.", "ko": "나는 1999년 Imperial College에서 객원 교수로 재직하던 시절 런던에서 Antony Valentini를 만났다.", "chunks": [["I met Antony Valentini in London in 1999,", "나는 1999년 런던에서 Antony Valentini를 만났다,"], ["when I was a visiting professor", "내가 객원 교수였을 때"], ["at Imperial College.", "Imperial College에서."]]}, {"en": "And after discussions with Christopher Isham, head of the theory group there, we decided to offer him a postdoc and bring him back into science.", "ko": "그리고 그곳 이론 그룹 책임자였던 Christopher Isham과 논의한 후, 우리는 그에게 박사 후 자리를 제안하고 그를 다시 과학계로 복귀시키기로 결정했다.", "chunks": [["And after discussions with Christopher Isham,", "그리고 Christopher Isham과의 논의 후,"], ["head of the theory group there,", "그곳 이론 그룹 책임자였던,"], ["we decided to offer him a postdoc", "우리는 그에게 박사 후 자리를 제안하기로 결정했다"], ["and bring him back into science.", "그리고 그를 다시 과학계로 복귀시키기로."]]}, {"en": "We were able to do this because I had some unexpected and generous support from a donor who happened to care about the foundations of quantum mechanics.", "ko": "우리는 마침 양자 역학의 토대에 관심을 갖고 있던 한 기부자로부터 예상치 못한 너그러운 후원을 받았기 때문에 이렇게 할 수 있었다.", "chunks": [["We were able to do this", "우리는 이렇게 할 수 있었다"], ["because I had some unexpected and generous support", "왜냐하면 내가 예상치 못한 너그러운 후원을 받았기 때문이다"], ["from a donor", "한 기부자로부터"], ["who happened to care about the foundations of quantum mechanics.", "마침 양자 역학의 토대에 관심을 갖고 있던."]]}, {"en": "I felt that supporting one of the few people who had proved he could contribute new and important results to this field was putting that money to good use.", "ko": "나는 이 분야에 새롭고 중요한 결과를 기여할 수 있음을 증명했던 몇 안 되는 사람 중 한 명을 후원하는 것이 그 돈을 요긴하게 사용하는 것이라고 느꼈다.", "chunks": [["I felt that supporting one of the few people", "나는 ~한 몇 안 되는 사람 중 한 명을 후원하는 것이"], ["who had proved he could contribute", "기여할 수 있음을 증명했던"], ["new and important results to this field", "이 분야에 새롭고 중요한 결과를"], ["was putting that money to good use.", "그 돈을 요긴하게 사용하는 것이라고 느꼈다."]]}, {"en": "Had I been supported only by funds from the National Science Foundation, I would not have been able to do this.", "ko": "만약 내가 국립 과학 재단(NSF)의 자금만으로 후원받고 있었다면, 나는 이것을 할 수 없었을 것이다.", "chunks": [["Had I been supported only", "만약 내가 ~만 받고 있었더라면"], ["by funds from the National Science Foundation,", "국립 과학 재단(NSF)의 자금을,"], ["I would not have been able to do this.", "나는 이것을 할 수 없었을 것이다."]]}, {"en": "Though the NSF has been generous to me for my work on quantum gravity, sharing the grant with a postdoc working on foundations of quantum theory could have hurt the chances for future funding.", "ko": "비록 NSF가 양자 중력에 대한 내 연구에는 너그러웠지만, 양자 이론의 토대를 연구하는 박사 후 연구원과 보조금을 나누는 것은 미래 자금 지원의 가능성을 해쳤을 수도 있었다.", "chunks": [["Though the NSF has been generous to me", "비록 NSF가 나에게 너그러웠지만"], ["for my work on quantum gravity,", "나의 양자 중력 연구에 대해,"], ["sharing the grant with a postdoc", "박사 후 연구원과 보조금을 나누는 것은"], ["working on foundations of quantum theory", "양자 이론의 토대를 연구하는"], ["could have hurt the chances for future funding.", "미래 자금 지원의 가능성을 해쳤을 수도 있었을 것이다."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: NSF 자금 기관 박스에서 share funds 화살표가 future funding threatened 경고에 막혀 postdoc would NOT happen 결과. 오른쪽: 양자역학 토대에 관심 있는 기부자 박스에서 unexpected support 화살표가 Antony Valentini postdoc 성공 결과로 이어지는 대조.\">\n  <!-- 좌측 박스 — If only NSF -->\n  <g>\n    <text x=\"155\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">NSF만이었다면 — 불가</text>\n    <rect x=\"20\" y=\"30\" width=\"270\" height=\"215\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- NSF 기관 박스 -->\n    <g transform=\"translate(155, 65)\">\n      <rect x=\"-72\" y=\"-15\" width=\"144\" height=\"32\" rx=\"3\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <text x=\"0\" y=\"-1\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\">NSF</text>\n      <text x=\"0\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">quantum gravity funds</text>\n    </g>\n\n    <!-- 아래 화살표 (조건) -->\n    <g transform=\"translate(155, 100)\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"20\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <polygon points=\"0,20 -5,12 5,12\" fill=\"#c8102e\"/>\n      <text x=\"35\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"start\" fill=\"#c8102e\">share with</text>\n      <text x=\"35\" y=\"24\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#5e5e5e\">foundations researcher</text>\n    </g>\n\n    <!-- 경고 박스 -->\n    <g tran

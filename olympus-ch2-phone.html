 <rect x=\"310\" y=\"30\" width=\"270\" height=\"215\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 기부자 박스 -->\n    <g transform=\"translate(445, 65)\">\n      <rect x=\"-105\" y=\"-15\" width=\"210\" height=\"32\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"0\" y=\"-1\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\">unexpected donor</text>\n      <text x=\"0\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">cares about foundations of QM</text>\n    </g>\n\n    <!-- 화살표 (직접 지원) -->\n    <g transform=\"translate(445, 100)\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"20\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/>\n      <polygon points=\"0,20 -5,12 5,12\" fill=\"#1FA34A\"/>\n      <text x=\"35\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"start\" fill=\"#1FA34A\">generous</text>\n      <text x=\"35\" y=\"24\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#5e5e5e\">unexpected support</text>\n    </g>\n\n    <!-- Imperial College + Valentini (성공 박스) -->\n    <g transform=\"translate(445, 175)\">\n      <rect x=\"-110\" y=\"-30\" width=\"220\" height=\"60\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n\n      <!-- Imperial College 작은 라벨 (왼쪽 상단) -->\n      <text x=\"-100\" y=\"-18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#5e5e5e\">1999 · Imperial College</text>\n\n      <!-- Valentini stick figure -->\n      <g transform=\"translate(-65, 5)\">\n        <circle cx=\"0\" cy=\"-7\" r=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n        <circle cx=\"-2\" cy=\"-8\" r=\"0.8\" fill=\"#1a1a1a\"/>\n        <circle cx=\"2\" cy=\"-8\" r=\"0.8\" fill=\"#1a1a1a\"/>\n        <path d=\"M -2.5 -4 Q 0 -2 2.5 -4\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"13\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <line x1=\"0\" y1=\"4\" x2=\"-7\" y2=\"9\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <line x1=\"0\" y1=\"4\" x2=\"7\" y2=\"9\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <line x1=\"0\" y1=\"13\" x2=\"-5\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <line x1=\"0\" y1=\"13\" x2=\"5\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      </g>\n\n      <!-- 라벨 -->\n      <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\">Antony Valentini</text>\n      <text x=\"0\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">postdoc</text>\n\n      <!-- ✓ 표시 -->\n      <g transform=\"translate(85, 5)\">\n        <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#1FA34A\"/>\n        <path d=\"M -4 0 L -1 4 L 5 -3\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.2\"/>\n      </g>\n    </g>\n\n    <text x=\"445\" y=\"237\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">brought back into science · new results in QM foundations</text>\n  </g>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '양자역학 ‘기초’ 연구자 발렌티니를 박사후로 영입'이고, 마지막은 '유연한 사적 지원이 비주류 연구를 살린다'로 정리된다."}, {"no": "7", "title": "Why Complex Ecosystems Resist Stress", "ktitle": "복잡한 생태계가 더 잘 버틴다(그물 vs 외줄)", "field": "생태·과학", "page": "no.05", "oneline": "생태계가 흡수할 스트레스 양은 ‘상호 연결’의 결과다.", "tldr": ["생태계가 흡수할 스트레스 양은 ‘상호 연결’의 결과다.", "복잡할수록(가지·대체 경로 많을수록) 스트레스에 더 잘 저항한다.", "그물은 한 곳 끊겨도 버티지만, 외줄 고리는 끊기면 전체가 무너진다."], "analogy": "길이 하나뿐이면 막히면 끝이지만, 우회로가 많으면 한 길이 막혀도 돌아갈 수 있죠. 생태계도 연결이 그물처럼 촘촘할수록 충격을 잘 견뎌요.", "bg": "분야는 생태·과학이에요. 핵심 개념은 생태계가 견디는 스트레스 양이 ‘상호 연결(interconnection)’의 결과라는 것. → 복잡한 생태계가 왜 더 잘 버티는지에 주목하며 읽으세요.", "flow": [{"kind": "원리", "t": "스트레스 흡수량 = 상호 연결의 결과"}, {"kind": "법칙", "t": "복잡할수록 스트레스에 더 잘 저항", "d": "스라소니에 대체 먹이=토끼 고갈에도 생존."}, {"kind": "구조", "t": "가지(대체 경로) = 그물망", "d": "그물 vs 끊기면 무너지는 외줄 고리."}, {"kind": "신호", "t": "환경오염 = 연결 끊김·인위적 단순화"}, {"kind": "결론", "t": "단순화될수록 스트레스·붕괴에 취약"}], "quiz": [["복잡한 생태계가 스트레스에 강한 이유는?", "대체 경로(가지)가 많아, 한 연결이 끊겨도 다른 경로로 버틸 수 있기 때문이에요."], ["‘그물 vs 외줄 고리’ 비유의 뜻은?", "그물은 한 곳이 끊겨도 버티지만, 가지 없는 외줄 고리는 어디든 끊기면 전체가 무너진다는 거예요."], ["핵심 한 문장?", "상호 연결이 복잡한(그물 같은) 생태계일수록 스트레스를 잘 견디고, 단순화되면 붕괴에 취약하다."]], "vocab": [["ecosystem", "생태계"], ["absorb", "흡수하다"], ["interconnection", "상호 연결"], ["depletion", "고갈"], ["branching", "분기·가지치기"], ["crisscross", "교차하다"], ["vulnerable", "취약한"]], "en": "The amount of stress which an ecosystem can absorb before it is driven to collapse is a result of its various interconnections and their relative speeds of response. The more complex the ecosystem, the more successfully it can resist a stress. For example, in the rabbit-lynx system, if the lynx had an alternative source of food they might survive the sudden depletion of rabbits. In this way, branching ─ which establishes alternative pathways ─ increases the resistance of an ecosystem to stress. Most ecosystems are so complex that the cycles are not simple circular paths, but are crisscrossed with branches to form a network or a fabric of interconnections. Like a net, in which each knot is connected to others by several strands, such a fabric can resist collapse better than a simple, unbranched circle of threads ─ which if cut anywhere breaks down as a whole. Environmental pollution is often a sign that ecological links have been cut and that the ecosystem has been artificially simplified and made more vulnerable to stress and to final collapse.", "ko": "생태계가 붕괴하게 되기 전에 그것이 흡수할 수 있는 스트레스의 양은 그것의 다양한 상호 연결과 그 연결의 상대적인 반응 속도의 결과이다. 생태계는 더 복잡하면 할수록, 스트레스에 더 성공적으로 저항할 수 있다. 예를 들어, 토끼-스라소니 시스템에서, 만약 스라소니가 대체 먹이원을 가지고 있다면, 그들은 토끼가 급격히 고갈되더라도 생존할 수도 있을 것이다. 이러한 방식으로, 대체 경로를 설정하는 분기는 생태계의 스트레스에 대한 저항력을 증가시킨다. 대부분의 생태계는 매우 복잡해서 순환이 단순한 원형 경로가 아니라, 가지로 교차되어 네트워크, 즉 상호 연결의 구조를 형성한다. 몇몇 가닥에 의해서 각각의 매듭이 다른 것들과 연결된 그물처럼, 이러한 구조는 어디서든 끊어진다면 전체가 무너지는 단순하고 가지가 없는 원형의 실보다 붕괴를 더 잘 견딜 수 있다. 환경 오염은 흔히 생태 연결 고리가 끊어졌으며, 생태계가 인위적으로 단순화되어 스트레스와 최종 붕괴에 더 취약해졌다는 신호이다.", "read": [{"en": "The amount of stress which an ecosystem can absorb before it is driven to collapse is a result of its various interconnections and their relative speeds of response.", "ko": "생태계가 붕괴하게 되기 전에 그것이 흡수할 수 있는 스트레스의 양은 그것의 다양한 상호 연결과 그 연결의 상대적인 반응 속도의 결과이다.", "chunks": [["The amount of stress", "스트레스의 양은"], ["which an ecosystem can absorb", "생태계가 흡수할 수 있는"], ["before it is driven to collapse", "그것이 붕괴로 내몰리기 전에"], ["is a result of its various interconnections", "그 다양한 상호 연결의 결과이다"], ["and their relative speeds of response.", "그리고 그 연결의 상대적 반응 속도의."]]}, {"en": "The more complex the ecosystem, the more successfully it can resist a stress.", "ko": "생태계가 더 복잡하면 할수록, 그것은 스트레스에 더 성공적으로 저항할 수 있다.", "chunks": [["The more complex the ecosystem,", "생태계가 복잡할수록,"], ["the more successfully it can resist a stress.", "그것은 그만큼 더 성공적으로 스트레스에 저항할 수 있다."]]}, {"en": "For example, in the rabbit-lynx system, if the lynx had an alternative source of food they might survive the sudden depletion of rabbits.", "ko": "예를 들어, 토끼-스라소니 시스템에서, 만약 스라소니가 대체 먹이원을 가지고 있다면 그것들은 토끼의 갑작스러운 감소에서 살아남을 수 있을 것이다.", "chunks": [["For example, in the rabbit-lynx system,", "예를 들어, 토끼-스라소니 시스템에서,"], ["if the lynx had an alternative source of food", "만약 스라소니가 대체 먹이원을 가지고 있다면"], ["they might survive the sudden depletion of rabbits.", "그것들은 토끼의 갑작스러운 감소에서 살아남을 수 있을 것이다."]]}, {"en": "In this way, branching ─ which establishes alternative pathways ─ increases the resistance of an ecosystem to stress.", "ko": "이렇게 해서, 대체 경로를 마련하는 분기는 생태계의 스트레스에 대한 저항력을 증가시킨다.", "chunks": [["In this way, branching ─", "이렇게 해서, 분기는 ─"], ["which establishes alternative pathways ─", "대체 경로를 마련하는 ─"], ["increases the resistance of an ecosystem to stress.", "생태계의 스트레스에 대한 저항력을 증가시킨다."]]}, {"en": "Most ecosystems are so complex that the cycles are not simple circular paths, but are crisscrossed with branches to form a network or a fabric of interconnections.", "ko": "대부분의 생태계는 너무 복잡해서 그 주기가 단순한 원형 경로가 아니라, 분기로 교차되어 상호 연결의 네트워크나 직물을 이룬다.", "chunks": [["Most ecosystems are so complex", "대부분의 생태계는 너무 복잡해서"], ["that the cycles are not simple circular paths,", "그 주기가 단순한 원형 경로가 아니라,"], ["but are crisscrossed with branches", "분기로 교차되어"], ["to form a network or a fabric of interconnections.", "상호 연결의 네트워크나 직물을 이룬다."]]}, {"en": "Like a net, in which each knot is connected to others by several strands, such a fabric can resist collapse better than a simple, unbranched circle of threads ─ which if cut anywhere breaks down as a whole.", "ko": "그물처럼, 각 매듭이 여러 가닥으로 다른 매듭과 연결되어 있는, 그런 직물은 어디든 잘리면 전체로 무너지는 단순한, 분기 없는 실의 원보다 붕괴에 더 잘 저항할 수 있다.", "chunks": [["Like a net,", "그물처럼,"], ["in which each knot is connected to others", "그 안에서 각 매듭이 다른 매듭과 연결된"], ["by several strands,", "여러 가닥에 의해,"], ["such a fabric can resist collapse better", "그런 직물은 붕괴에 더 잘 저항할 수 있다"], ["than a simple, unbranched circle of threads ─", "단순한. 분기 없는 실의 원보다 ─"], ["which if cut anywhere breaks down as a whole.", "어디든 잘리면 전체로서 무너지는."]]}, {"en": "Environmental pollution is often a sign that ecological links have been cut and that the ecosystem has been artificially simplified and made more vulnerable to stress and to final collapse.", "ko": "환경 오염은 종종 생태학적 연결이 끊겼고 생태계가 인공적으로 단순화되었으며 스트레스와 최종 붕괴에 더 취약해졌다는 신호이다.", "chunks": [["Environmental pollution is often a sign", "환경 오염은 종종 신호이다"], ["that ecological links have been cut", "생태학적 연결이 끊겼다는"], ["and that the ecosystem has been artificially simplified", "그리고 생태계가 인공적으로 단순화되었다는"], ["and made more vulnerable to stress", "그리고 스트레스에 더 취약해졌다는"], ["and to final collapse.", "그리고 최종 붕괴에."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: lynx를 중심으로 rabbit·deer·mouse·bird·hare가 다중 실선으로 연결된 그물 직물 구조. 오른쪽: lynx → rabbit → grass의 단순 직선 사슬에서 가운데 rabbit 노드가 끊겨 전체가 무너지는 모습 대조.\">\n  <!-- 좌측 박스 — woven fabric -->\n  <g>\n    <text x=\"155\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">복잡한 그물 — 저항력 ↑</text>\n    <rect x=\"20\" y=\"30\" width=\"270\" height=\"215\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 다중 연결 선 (그물) -->\n    <g stroke=\"#1FA34A\" stroke-width=\"1.4\" fill=\"none\">\n      <!-- lynx → 주변 -->\n      <line x1=\"155\" y1=\"135\" x2=\"90\" y2=\"80\"/>\n      <line x1=\"155\" y1=\"135\" x2=\"220\" y2=\"80\"/>\n      <line x1=\"155\" y1=\"135\" x2=\"70\" y2=\"155\"/>\n      <line x1=\"155\" y1=\"135\" x2=\"240\" y2=\"155\"/>\n      <line x1=\"155\" y1=\"135\" x2=\"105\" y2=\"215\"/>\n      <line x1=\"155\" y1=\"135\" x2=\"205\" y2=\"215\"/>\n      <!-- 주변 노드들끼리도 (crisscrossed) -->\n      <line x1=\"90\" y1=\"80\" x2=\"220\" y2=\"80\" opacity=\"0.5\"/>\n      <line x1=\"90\" y1=\"80\" x2=\"70\" y2=\"155\" opacity=\"0.5\"/>\n      <line x1=\"220\" y1=\"80\" x2=\"240\" y2=\"155\" opacity=\"0.5\"/>\n      <line x1=\"70\" y1=\"155\" x2=\"105\" y2=\"215\" opacity=\"0.5\"/>\n      <line x1=\"240\" y1=\"155\" x2=\"205\" y2=\"215\" opacity=\"0.5\"/>\n      <line x1=\"105\" y1=\"215\" x2=\"205\" y2=\"215\" opacity=\"0.5\"/>\n      <line x1=\"90\" y1=\"80\" x2=\"240\" y2=\"155\" opacity=\"0.3\"/>\n      <line x1=\"220\" y1=\"80\" x2=\"70\" y2=\"155\" opacity=\"0.3\"/>\n    </g>\n\n    <!-- 노드 6개 + lynx 중심 -->\n    <g>\n      <!-- rabbit -->\n      <circle cx=\"90\" cy=\"80\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"90\" y=\"83\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">rabbit</text>\n      <!-- deer -->\n      <circle cx=\"220\" cy=\"80\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"220\" y=\"83\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">deer</text>\n      <!-- vole -->\n      <circle cx=\"70\" cy=\"155\" r=\"13\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"70\" y=\"158\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">vole</text>\n      <!-- hare -->\n      <circle cx=\"240\" cy=\"155\" r=\"13\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"240\" y=\"158\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">hare</text>\n      <!-- mouse -->\n      <circle cx=\"105\" cy=\"215\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"105\" y=\"218\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">mouse</text>\n      <!-- bird -->\n      <circle cx=\"205\" cy=\"215\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"205\" y=\"218\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">bird</text>\n\n      <!-- lynx 중심 -->\n      <circle cx=\"155\" cy=\"135\" r=\"20\" fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <text x=\"155\" y=\"139\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">lynx</text>\n    </g>\n\n    <text x=\"155\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">branching · alternative pathways</text>\n  </g>\n\n  <!-- 우측 박스 — simplified chain -->\n  <g>\n    <text x=\"445\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">단순화 — 연결 끊김</text>\n    <rect x=\"310\" y=\"30\" width=\"270\" height=\"215\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 단순 사슬: grass → rabbit → lynx (위에서 아래) -->\n    <!-- lynx (위) -->\n    <g>\n      <circle cx=\"445\" cy=\"75\" r=\"22\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n      <text x=\"445\" y=\"79\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">lynx</text>\n    </g>\n\n    <!-- 화살표 1: lynx → rabbit (위에서 위쪽으로 시선, 사슬 차단됨) -->\n    <g>\n      <line x1=\"445\" y1=\"97\" x2=\"445\" y2=\"118\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      <polygon points=\"445,118 440,110 450,110\" fill=\"#c8102e\"/>\n    </g>\n\n    <!-- rabbit (가운데) — 끊긴 표시 -->\n    <g>\n      <circle cx=\"445\" cy=\"140\" r=\"22\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.8\" stroke-dasharray=\"3 2\"/>\n      <text x=\"445\" y=\"144\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">rabbit</text>\n      <!-- 큰 X (depleted) -->\n      <line x1=\"430\" y1=\"125\" x2=\"460\" y2=\"155\" stroke=\"#c8102e\" stroke-width=\"3\"/>\n      <line x1=\"460\" y1=\"125\" x2=\"430\" y2=\"155\" stroke=\"#c8102e\" stroke-width=\"3\"/>\n    </g>\n\n    <!-- 끊김 표시 (사슬 차단) -->\n    <g transform=\"translate(485, 140)\">\n      <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" fill=\"#c8102e\">depleted</text>\n      <text x=\"0\" y=\"9\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#5e5e5e\">고갈</text>\n    </g>\n\n    <!-- 차단 화살표 -->\n    <g>\n      <line x1=\"445\" y1=\"162\" x2=\"445\" y2=\"183\" stroke=\"#c8102e\" stroke-width=\"2\" stroke-dasharray=\"3 2\"/>\n      <line x1=\"438\" y1=\"170\" x2=\"452\" y2=\"178\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      <line x1=\"452\" y1=\"170\" x2=\"438\" y2=\"178\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    </g>\n\n    <!-- grass (아래) -->\n    <g>\n      <circle cx=\"445\" cy=\"205\" r=\"22\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n      <text x=\"445\" y=\"209\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">grass</text>\n    </g>\n\n    <!-- 좌측 라벨: no alternative -->\n    <g transform=\"translate(355, 140)\">\n      <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" fill=\"#c8102e\" text-anchor=\"middle\">no alternative</text>\n      <text x=\"0\" y=\"9\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#5e5e5e\" text-anchor=\"middle\">대체 경로 없음</text>\n    </g>\n\n    <text x=\"445\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">\"the connections have been broken\"</text>\n  </g>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '스트레스 흡수량 = 상호 연결의 결과'이고, 마지막은 '단순화될수록 스트레스·붕괴에 취약'로 정리된다."}, {"no": "8", "title": "Even Einstein Resisted a Changing Universe", "ktitle": "아인슈타인도 ‘변하는 우주’를 거부했다", "field": "과학사·우주", "page": "no.06", "oneline": "고대~1920년대까지 우주는 영원·불변으로 여겨졌다.", "tldr": ["고대~1920년대까지 우주는 영원·불변으로 여겨졌다.", "이 믿음이 너무 깊어 아인슈타인조차 의심 없이 받아들였다.", "수학은 ‘팽창/수축’을 말했지만, 그는 ‘우주 상수’로 정적 우주를 붙들려 했다."], "analogy": "누구나 ‘하늘은 늘 그대로’라 믿었어요. 아인슈타인의 방정식조차 ‘우주는 변한다’고 했는데, 그는 그게 믿기지 않아 억지로 ‘붙잡는 값(우주 상수)’을 끼워 넣었죠.", "bg": "분야는 과학사·우주론이에요. 고대부터 1920년대까지 우주가 ‘영원·불변’으로 여겨졌다는 것이 배경. → 아인슈타인조차 ‘변하는 우주’를 왜 거부했는지에 주목하며 읽으세요.", "flow": [{"kind": "통념", "t": "우주는 영원·불변 (개별 별이 나고 죽어도 전체는 그대로)"}, {"kind": "깊이", "t": "믿음이 깊어 아인슈타인조차 의심 없이 수용"}, {"kind": "발견", "t": "상대성 방정식: 우주는 정적일 수 없다 → 팽창/수축"}, {"kind": "거부", "t": "믿기지 않아 ‘우주 상수’를 추가 → 정적 유지 시도"}, {"kind": "교훈", "t": "뿌리 깊은 통념은 천재의 눈도 가린다"}], "quiz": [["1920년대까지 우주는 어떻게 여겨졌나?", "개별 별이 나고 죽어도 전체 모습은 그대로인, 영원하고 변하지 않는 것으로 여겨졌어요."], ["아인슈타인이 ‘우주 상수’를 더한 이유는?", "방정식이 ‘팽창/수축’을 말했지만 정적 우주라는 믿음이 강해, 모든 것을 정적으로 ‘붙들기’ 위해서였어요."], ["핵심 한 문장?", "불변의 우주라는 통념이 너무 깊어, 아인슈타인조차 방정식의 결과를 거부하고 우주 상수를 더했다."]], "vocab": [["eternal", "영원한"], ["galaxy", "은하"], ["deeply rooted", "깊이 뿌리박힌"], ["relativity", "상대성(이론)"], ["static", "정적인"], ["contract", "수축하다"], ["cosmological constant", "우주 상수"]], "en": "To the ancients, looking out at the night sky, the Universe seemed eternal and unchanging. Right up until the 1920s, what we now know to be the Milky Way galaxy, an island of a few hundred billion stars, was thought to be the entire Universe, in which individual stars might be born, live and die but the overall appearance always remained the same, like a forest in which individual trees live and die without changing the overall appearance. The idea of an unchanging Universe was so deeply rooted that even Albert Einstein, usually willing to entertain new ideas, accepted it without question. When he applied the equations of his general theory of relativity to describe the behaviour of the entire Universe (all of space and time), he found that the mathematics said that the Universe could not be static, but must be either expanding or contracting. This seemed so improbable to him that he added an extra factor to the equations, called the cosmological constant, to hold everything still.", "ko": "고대인들에게, 밤하늘을 바라볼 때, 우주는 영원하고 변하지 않는 것처럼 보였다. 1920년대까지 수천억 개의 별들의 섬인 현재 우리가 은하계라 알고 있는 것이 전체 우주로 여겨졌는데, 그것은 마치 개별 나무들이 살고 죽어도 전체적인 모습은 변하지 않는 숲처럼 개별 별들이 태어나고 살고 죽을 수도 있지만 전체적인 모습은 항상 그대로였다. 변하지 않는 우주의 개념은 너무 깊이 뿌리박혀 있어서, 보통 새로운 아이디어를 고려하는 데 주저하지 않는 Albert Einstein조차도 그것을 아무런 의심 없이 받아들였다. 그가 자신의 일반 상대성 이론의 방정식을 적용해 전체 우주(모든 공간과 시간)의 행동을 설명하려 했을 때, 그는 수학적으로 우주는 정적일 수 없고 팽창하거나 수축하고 있음에 틀림없다는 것을 발견했다. 이것이 그에게 너무 사실 같지 않아 보였기 때문에, 그는 모든 것을 정적인 상태로 유지하기 위해 방정식에 우주 상수라고 불리는 추가 요소를 더했다.", "read": [{"en": "To the ancients, looking out at the night sky, the Universe seemed eternal and unchanging.", "ko": "고대인들에게, 밤하늘을 바라볼 때, 우주는 영원하고 변하지 않는 것처럼 보였다.", "chunks": [["To the ancients,", "고대인들에게,"], ["looking out at the night sky,", "밤하늘을 바라볼 때,"], ["the Universe seemed eternal and unchanging.", "우주는 영원하고 변하지 않는 것처럼 보였다."]]}, {"en": "Right up until the 1920s, what we now know to be the Milky Way galaxy, an island of a few hundred billion stars, was thought to be the entire Universe, in which individual stars might be born, live and die but the overall appearance always remained the same, like a forest in which individual trees live and die without changing the overall appearance.", "ko": "1920년대까지, 수천억 개의 별들의 섬인 현재 우리가 은하수 은하라고 알고 있는 것이 전체 우주로 여겨졌는데, 그 안에서 개별 별들이 태어나고 살고 죽지만 전체 모습은 항상 똑같이 남아 있는, 마치 개별 나무들이 살고 죽어도 전체 모습이 바뀌지 않는 숲처럼 여겨졌다.", "chunks": [["Right up until the 1920s,", "1920년대까지,"], ["what we now know to be the Milky Way galaxy,", "현재 우리가 은하수 은하라고 알고 있는 것,"], ["an island of a few hundred billion stars,", "수천억 개의 별들의 섬은,"], ["was thought to be the entire Universe,", "전체 우주로 여겨졌다,"], ["in which individual stars might be born, live and die", "그 안에서 개별 별들이 태어나고, 살고, 죽지만"], ["but the overall appearance always remained the same,", "전체 모습은 항상 똑같이 남아 있는,"], ["like a forest in which individual trees live and die", "마치 개별 나무들이 살고 죽지만"], ["without changing the overall appearance.", "전체 모습을 바꾸지 않는 숲처럼."]]}, {"en": "The idea of an unchanging Universe was so deeply rooted that even Albert Einstein, usually willing to entertain new ideas, accepted it without question.", "ko": "변하지 않는 우주라는 생각은 너무 깊이 뿌리내려 있어서, 보통 새로운 생각을 기꺼이 받아들이는 Albert Einstein조차도 그것을 의심 없이 받아들였다.", "chunks": [["The idea of an unchanging Universe", "변하지 않는 우주라는 생각은"], ["was so deeply rooted", "너무도 깊이 뿌리내려서"], ["that even Albert Einstein,", "Albert Einstein조차도,"], ["usually willing to entertain new ideas,", "보통 새로운 생각을 기꺼이 받아들이는,"], ["accepted it without question.", "그것을 의심 없이 받아들였다."]]}, {"en": "When he applied the equations of his general theory of relativity to describe the behaviour of the entire Universe (all of space and time), he found that the mathematics said that the Universe could not be static, but must be either expanding or contracting.", "ko": "그가 일반 상대성 이론의 방정식을 모든 공간과 시간을 포함한 전체 우주의 행동을 묘사하기 위해 적용했을 때, 그는 수학이 우주가 정적일 수 없고 팽창하거나 수축하고 있어야 함을 말한다는 것을 발견했다.", "chunks": [["When he applied the equations of his general theory of relativity", "그가 일반 상대성 이론의 방정식을 적용했을 때"], ["to describe the behaviour of the entire Universe", "전체 우주의 행동을 묘사하기 위해"], ["(all of space and time),", "(모든 공간과 시간의),"], ["he found that the mathematics said", "그는 수학이 말한다는 것을 발견했다"], ["that the Universe could not be static,", "우주가 정적일 수 없으며,"], ["but must be either expanding or contracting.", "팽창하거나 수축하고 있어야 한다고."]]}, {"en": "This seemed so improbable to him that he added an extra factor to the equations, called the cosmological constant, to hold everything still.", "ko": "이것이 그에게 너무 있을 법하지 않아 보여서, 그는 모든 것을 정지 상태로 유지하기 위해 방정식에 추가 인수, 즉 우주 상수라 불리는 것을 더했다.", "chunks": [["This seemed so improbable to him", "이것이 그에게 너무 있을 법하지 않게 보여서"], ["that he added an extra factor to the equations,", "그는 방정식에 추가 인수를 더했다,"], ["called the cosmological constant,", "우주 상수라 불리는,"], ["to hold everything still.", "모든 것을 정지 상태로 유지하기 위해."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 빨강 점선 박스 안에 5 그루의 나무가 있고 일부는 자라고 일부는 죽어가지만 숲 전체는 불변. 가운데: general relativity → dynamic universe 화살표 초록. 오른쪽: Einstein이 cosmological constant Λ 자물쇠를 동적 우주에 채워 정적으로 잠그는 그림.\">\n  <!-- 좌측 박스 — 정적 우주관 = 숲 -->\n  <g>\n    <text x=\"145\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">정적 우주관 — 숲의 나무</text>\n    <rect x=\"20\" y=\"30\" width=\"245\" height=\"215\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- \"Universe\" 작은 라벨 (박스 왼쪽 위) -->\n    <text x=\"33\" y=\"46\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\">Universe</text>\n\n    <!-- 별 점들 (배경) -->\n    <g fill=\"#999\">\n      <circle cx=\"55\" cy=\"60\" r=\"0.8\"/>\n      <circle cx=\"80\" cy=\"50\" r=\"0.8\"/>\n      <circle cx=\"125\" cy=\"55\" r=\"1\"/>\n      <circle cx=\"175\" cy=\"48\" r=\"0.8\"/>\n      <circle cx=\"220\" cy=\"60\" r=\"0.8\"/>\n      <circle cx=\"245\" cy=\"75\" r=\"0.8\"/>\n    </g>\n\n    <!-- 땅 (지표선) -->\n    <line x1=\"30\" y1=\"195\" x2=\"255\" y2=\"195\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n\n    <!-- 나무 1: 작은 (자라는·new) -->\n    <g transform=\"translate(55, 195)\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-18\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <ellipse cx=\"0\" cy=\"-22\" rx=\"9\" ry=\"11\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">new</text>\n    </g>\n\n    <!-- 나무 2: 성숙 -->\n    <g transform=\"translate(95, 195)\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-32\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <ellipse cx=\"0\" cy=\"-40\" rx=\"14\" ry=\"17\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    </g>\n\n    <!-- 나무 3: 죽어가는 (점선·앙상) -->\n    <g transform=\"translate(140, 195)\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-28\" stroke=\"#999\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <!-- 앙상한 가지 -->\n      <line x1=\"0\" y1=\"-20\" x2=\"-7\" y2=\"-26\" stroke=\"#999\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"0\" y1=\"-20\" x2=\"7\" y2=\"-26\" stroke=\"#999\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"0\" y1=\"-25\" x2=\"-10\" y2=\"-32\" stroke=\"#999\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"0\" y1=\"-25\" x2=\"9\" y2=\"-31\" stroke=\"#999\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\"/>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#999\">die</text>\n    </g>\n\n    <!-- 나무 4: 큰 성숙 -->\n    <g transform=\"translate(190, 195)\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-38\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <ellipse cx=\"0\" cy=\"-46\" rx=\"16\" ry=\"18\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    </g>\n\n    <!-- 나무 5: 중간 -->\n    <g transform=\"translate(235, 195)\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-28\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <ellipse cx=\"0\" cy=\"-35\" rx=\"12\" ry=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    </g>\n\n    <text x=\"145\" y=\"220\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">individual trees live &amp; die — overall unchanged</text>\n    <text x=\"145\" y=\"235\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">전체 모습은 변함 없음 — like a forest</text>\n  </g>\n\n  <!-- 가운데 화살표 (일반 상대성 = 동적) -->\n  <g transform=\"translate(275, 130)\">\n    <text x=\"30\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">general</text>\n    <text x=\"30\" y=\"-19\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">relativity</text>\n    <text x=\"30\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">→ dynamic</text>\n    <line x1=\"0\" y1=\"5\" x2=\"60\" y2=\"5\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"60,5 52,0 52,10\" fill=\"#1FA34A\"/>\n    <text x=\"30\" y=\"25\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">방정식의 도전</text>\n  </g>\n\n  <!-- 우측 박스 — Einstein 우주 상수로 잠금 -->\n  <g>\n    <text x=\"455\" y=\"22\" font-family=\"Noto Seri y=\"70\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">Einstein</text>\n    </g>\n\n    <!-- 자물쇠 + Λ (cosmological constant) -->\n    <g transform=\"translate(500, 140)\">\n      <!-- 자물쇠 본체 -->\n      <rect x=\"-22\" y=\"-5\" width=\"44\" height=\"34\" rx=\"4\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      <!-- 자물쇠 고리 -->\n      <path d=\"M -13 -5 L -13 -16 Q -13 -25 0 -25 Q 13 -25 13 -16 L 13 -5\" \n            fill=\"none\" stroke=\"#c8102e\" stroke-width=\"2.5\"/>\n      <!-- Λ (lambda) 본체 안 -->\n      <text x=\"0\" y=\"20\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"22\" text-anchor=\"middle\" fill=\"#c8102e\">Λ</text>\n      <!-- 라벨 위 -->\n      <text x=\"0\" y=\"-34\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">cosmological</text>\n      <text x=\"0\" y=\"-24\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">constant</text>\n      <!-- 라벨 아래 -->\n      <text x=\"0\" y=\"50\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">우주 상수로 잠금</text>\n    </g>\n\n    <!-- Einstein 손 → 자물쇠 화살표 -->\n    <line x1=\"417\" y1=\"148\" x2=\"470\" y2=\"148\" stroke=\"#c8102e\" stroke-width=\"1.6\" stroke-dasharray=\"3 2\"/>\n    <polygon points=\"470,148 463,144 463,152\" fill=\"#c8102e\"/>\n\n    <text x=\"455\" y=\"220\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">\"added an extra cosmological constant\"</text>\n    <text x=\"455\" y=\"235\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">방정식의 동적성을 도그마로 누름</text>\n  </g>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '우주는 영원·불변 (개별 별이 나고 죽어도 전체는 그대로)'이고, 마지막은 '뿌리 깊은 통념은 천재의 눈도 가린다'로 정리된다."}, {"no": "9", "title": "Countering the Stress of Strangers", "ktitle": "낯섦의 스트레스를 ‘배려·감사·놀이’로", "field": "심리·웰빙", "page": "no.07", "oneline": "현대 생활은 매일 ‘낯선 사람’에 스트레스 반응을 부추긴다.", "tldr": ["현대 생활은 매일 ‘낯선 사람’에 스트레스 반응을 부추긴다.", "만성 스트레스 → 자기중심적·방어적 삶으로 흐를 수 있다.", "해법 셋: 배려 기르기(마음챙김)·사회적 감사·즐거운 사회활동 몰입(우뇌)."], "analogy": "매일 낯선 사람에 시달리면 마음이 ‘방어 모드’로 굳기 쉬워요. 그럴 때 의식적으로 ‘배려하기, 고마워하기, 같이 놀고 자연 즐기기’가 마음을 다시 열어 주죠.", "bg": "분야는 심리·웰빙이에요. 현대 생활이 매일 ‘낯선 사람’에 대한 스트레스 반응을 부추긴다는 것이 출발점. → 이 스트레스에 어떻게 대응할 수 있는지에 주목하며 읽으세요.", "flow": [{"kind": "문제", "t": "낯선 사람에 대한 스트레스 → 자기중심·방어적 성향"}, {"kind": "해법 ①", "t": "의도적 ‘배려’ 기르기 + 마음챙김"}, {"kind": "해법 ②", "t": "‘사회적 감사’ 실천 (타인에 감사 표현)"}, {"kind": "해법 ③", "t": "놀이·춤·예술·자연 등 즐거운 사회활동 몰입", "d": "우뇌 자극 → 친사회적."}, {"kind": "결론", "t": "긍정 감정↑ → 우울·고립·도덕적 자기도취↓"}], "quiz": [["낯섦에 대한 만성 스트레스 반응의 위험은?", "자기 보호·거리 두기에 치우친 자기중심적 삶으로 이어질 수 있어요."], ["글이 제시한 세 가지 해법은?", "의도적 배려(마음챙김), 사회적 감사 실천, 놀이·예술·자연 같은 즐거운 사회활동 몰입이에요."], ["핵심 한 문장?", "낯섦의 스트레스가 부르는 자기중심성은 배려·감사·즐거운 사회활동으로 친사회적으로 바꿀 수 있다."]], "vocab": [["novelty", "새로움·낯섦"], ["chronic", "만성적인"], ["self-centered", "자기중심적인"], ["cultivate", "기르다·함양하다"], ["mindfulness", "마음챙김"], ["gratitude", "감사"], ["immersion", "몰입"]], "en": "Too often modern life encourages a stress response in reaction to the novelty of encountering strangers on a daily basis. In combination with early experience that makes one stress reactive to novelty, a chronic stress response can lead to a self-centered orientation to living: the security ethic, brutal or detached imagination. To counter this pressure to focus on self-protection or distancing, here are three suggestions. First, the individual can intentionally cultivate a caring response to others. Mindfulness training can assist with a focus on sensory and perceptual input under relaxed breathing. Paying attention to the newness of a situation or encounter and appreciating it enlists the right brain holistic response and fosters an engagement ethic. A second approach is to practice social gratitude in which appreciation of others is acknowledged and expressed. A third practice that fosters prosocial orientation and an engagement ethic, through a stimulation of the right brain, is immersion in delightful social activities such as playing, dancing, art and music making, and/or being in nature. Playful activity enlivens the positive emotions and promotes emotional presence, decreasing chances for depression, self-isolation, and moral narcissism.", "ko": "너무 자주 현대 생활은 매일 낯선 사람들을 만나는 새로움에 대한 반응으로 스트레스 반응을 부추긴다. 새로움에 스트레스 반응을 하게 만드는 초기 경험과 결합하여, 만성적인 스트레스 반응은 보안 윤리, 잔인하거나 무관심한 상상력과 같은 자기중심적인 삶의 성향으로 이어질 수 있다. 자기 보호나 거리 두기에 초점을 맞추라는 이러한 압박에 대응하기 위해, 여기 세 가지 제안이 있다. 첫째, 개인은 의도적으로 타인에 대한 배려하는 반응을 기를 수 있다. 마음 챙김 훈련은 이완된 호흡 상태에서 감각적이고 지각적인 입력에 집중하는 데 도움을 줄 수 있다. 상황이나 만남의 새로움에 주의를 기울이고 그것을 감사히 여기는 것은 우뇌의 통합적 반응을 유도하고 참여 윤리를 촉진한다. 두 번째 접근법은 다른 사람들에 대한 감사를 인정하고 표현하는 사회적 감사를 실천하는 것이다. 오른쪽 뇌의 자극을 통해 친사회적 성향과 참여 윤리를 촉진하는 세 번째 실천은 놀이, 춤, 예술 및 음악 만들기, 그리고/또는 자연 속에 있는 것과 같은 즐거운 사회적 활동에 몰입하는 것이다. 유쾌한 활동은 긍정적인 감정을 북돋고 정서적 존재감을 촉진하여 우울증, 자기 고립, 도덕적 나르시시즘의 가능성을 줄여 준다.", "read": [{"en": "Too often modern life encourages a stress response in reaction to the novelty of encountering strangers on a daily basis.", "ko": "너무 자주 현대 생활은 매일 낯선 사람들을 만나는 새로움에 대한 반응으로 스트레스 반응을 부추긴다.", "chunks": [["Too often modern life encourages a stress response", "너무 자주 현대 생활은 스트레스 반응을 부추긴다"], ["in reaction to the novelty of encountering strangers", "낯선 사람을 만나는 새로움에 대한 반응으로"], ["on a daily basis.", "매일."]]}, {"en": "In combination with early experience that makes one stress reactive to novelty, a chronic stress response can lead to a self-centered orientation to living: the security ethic, brutal or detached imagination.", "ko": "새로움에 스트레스 반응적이 되게 만드는 초기 경험과 결합하여, 만성적 스트레스 반응은 안전 윤리, 잔인하거나 무관심한 상상력과 같은 삶에 대한 자기 중심적 성향으로 이어질 수 있다.", "chunks": [["In combination with early experience", "초기 경험과 결합하여"], ["that makes one stress reactive to novelty,", "새로움에 스트레스 반응을 보이게 만드는,"], ["a chronic stress response can lead to", "만성적 스트레스 반응은 ~으로 이어질 수 있다"], ["a self-centered orientation to living:", "삶에 대한 자기 중심적 성향으로:"], ["the security ethic,", "보안 윤리,"], ["brutal or detached imagination.", "잔인하거나 무관심한 상상력."]]}, {"en": "To counter this pressure to focus on self-protection or distancing, here are three suggestions.", "ko": "자기 보호나 거리 두기에 집중하려는 이 압력에 대응하기 위해, 여기 세 가지 제안이 있다.", "chunks": [["To counter this pressure", "이 압력에 대응하기 위해"], ["to focus on self-protection or distancing,", "자기 보호 또는 거리 두기에 집중하려는,"], ["here are three suggestions.", "여기 세 가지 제안이 있다."]]}, {"en": "First, the individual can intentionally cultivate a caring response to others.", "ko": "첫째, 개인은 타인에 대한 배려 반응을 의도적으로 기를 수 있다.", "chunks": [["First, the individual can intentionally cultivate", "첫째, 개인은 의도적으로 기를 수 있다"], ["a caring response to others.", "타인에 대한 배려 반응을."]]}, {"en": "Mindfulness training can assist with a focus on sensory and perceptual input under relaxed breathing.", "ko": "마음 챙김 훈련은 편안한 호흡 하에 감각적·지각적 입력에 집중하는 것을 도울 수 있다.", "chunks": [["Mindfulness training can assist with", "마음 챙김 훈련은 ~을 도울 수 있다"], ["a focus on sensory and perceptual input", "감각적·지각적 입력에 집중하는 것을"], ["under relaxed breathing.", "편안한 호흡 하에."]]}, {"en": "Paying attention to the newness of a situation or encounter and appreciating it enlists the right brain holistic response and fosters an engagement ethic.", "ko": "상황이나 만남의 새로움에 주의를 기울이고 그것을 음미하는 것은 우뇌의 전체론적 반응을 끌어내고 참여 윤리를 조성한다.", "chunks": [["Paying attention to the newness", "새로움에 주의를 기울이는 것"], ["of a situation or encounter", "상황이나 만남의"], ["and appreciating it", "그리고 그것을 음미하는 것은"], ["enlists the right brain holistic response", "우뇌의 전체론적 반응을 끌어내고"], ["and fosters an engagement ethic.", "참여 윤리를 조성한다."]]}, {"en": "A second approach is to practice social gratitude in which appreciation of others is acknowledged and expressed.", "ko": "두 번째 방법은 그 안에서 타인에 대한 음미가 인정되고 표현되는 사회적 감사를 실천하는 것이다.", "chunks": [["A second approach is", "두 번째 방법은 ~이다"], ["to practice social gratitude", "사회적 감사를 실천하는 것이다"], ["in which appreciation of others", "그 안에서 타인에 대한 음미가"], ["is acknowledged and expressed.", "인정되고 표현되는."]]}, {"en": "A third practice that fosters prosocial orientation and an engagement ethic, through a stimulation of the right brain, is immersion in delightful social activities such as playing, dancing, art and music making, and/or being in nature.", "ko": "우뇌의 자극을 통해 친사회적 성향과 참여 윤리를 조성하는 세 번째 실천은 놀이, 춤, 미술·음악 만들기, 그리고/또는 자연 속에 있는 것과 같은 즐거운 사회적 활동에의 몰입이다.", "chunks": [["A third practice", "세 번째 실천은"], ["that fosters prosocial orientation", "친사회적 성향을 조성하는"], ["and an engagement ethic,", "그리고 참여 윤리를,"], ["through a stimulation of the right brain,", "우뇌의 자극을 통해,"], ["is immersion in delightful social activities", "즐거운 사회적 활동에의 몰입이다"], ["such as playing, dancing, art and music making, and/or being in nature.", "놀이, 춤, 미술·음악 만들기, 그리고/또는 자연 속에 있는 것 같은."]]}, {"en": "Playful activity enlivens the positive emotions and promotes emotional presence, decreasing chances for depression, self-isolation, and moral narcissism.", "ko": "놀이 활동은 긍정 감정에 활력을 불어넣고 정서적 현전을 촉진하는데, 그 결과 우울증, 자기 고립, 도덕적 나르시시즘의 가능성을 감소시킨다.", "chunks": [["Playful activity enlivens the positive emotions", "놀이 활동은 긍정 감정에 활력을 불어넣고"], ["and promotes emotional presence,", "정서적 현전을 촉진한다,"], ["decreasing chances for depression,", "~의 가능성을 감소시키면서: 우울증,"], ["self-isolation, and moral narcissism.", "자기 고립, 그리고 도덕적 나르시시즘."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 빨강 점선 박스 안에서 modern life→chronic stress→self-centered·brutal·detached imagination로 이어지는 수직 인과 사슬. 가운데 counter 화살표. 오른쪽: ①caring·mindfulness ②social gratitude ③play·nature 세 처방 박스가 세로로 배치된 그림.\">\n  <!-- 좌측 박스 — 인과 사슬 -->\n  <g>\n    <text x=\"135\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">현대 생활 → 만성 스트레스</text>\n    <rect x=\"20\" y=\"30\" width=\"230\" height=\"225\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 박스 1: modern life -->\n    <g transform=\"translate(135, 55)\">\n      <rect x=\"-95\" y=\"-12\" width=\"190\" height=\"28\" rx=\"3\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">modern life · daily novelty</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">매일 낯선 사람들 만남</text>\n    </g>\n\n    <!-- 화살표 1 -->\n    <g transform=\"translate(135, 85)\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"16\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <polygon points=\"0,16 -4,10 4,10\" fill=\"#c8102e\"/>\n    </g>\n\n    <!-- 박스 2: chronic stress -->\n    <g transform=\"translate(135, 115)\">\n      <rect x=\"-95\" y=\"-12\" width=\"190\" height=\"28\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">chronic stress response</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">만성 스트레스 반응</text>\n    </g>\n\n    <!-- 화살표 2 -->\n    <g transform=\"translate(135, 145)\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"16\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <polygon points=\"0,16 -4,10 4,10\" fill=\"#c8102e\"/>\n    </g>\n\n    <!-- 부정적 결과 3개 -->\n    <g font-family=\"Noto Serif\" font-style=\"italic\" fill=\"#c8102e\">\n      <g transform=\"translate(135, 178)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"95\" ry=\"11\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n        <text x=\"0\" y=\"3\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">self-centered orientation</text>\n      </g>\n      <g transform=\"translate(135, 203)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"95\" ry=\"11\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n        <text x=\"0\" y=\"3\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">brutal imagination</text>\n      </g>\n      <g transform=\"translate(135, 228)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"95\" ry=\"11\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n        <text x=\"0\" y=\"3\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">detached imagination</text>\n      </g>\n    </g>\n  </g>\n\n  <!-- 가운데 화살표 -->\n  <g transform=\"translate(258, 130)\">\n    <text x=\"22\" y=\"-18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">counter</text>\n    <line x1=\"0\" y1=\"0\" x2=\"45\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"45,0 37,-5 37,5\" fill=\"#1FA34A\"/>\n    <text x=\"22\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">세 처방</text>\n  </g>\n\n  <!-- 우측 박스 — 3 처방 -->\n  <g>\n    <text x=\"450\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Three Antidotes — 세 처방</text>\n    <rect x=\"315\" y=\"30\" width=\"265\" height=\"225\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 처방 ① -->\n    <g transform=\"translate(450, 75)\">\n      <rect x=\"-122\" y=\"-22\" width=\"244\" height=\"44\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <!-- 번호 ① -->\n      <circle cx=\"-105\" cy=\"0\" r=\"12\" fill=\"#1FA34A\"/>\n      <text x=\"-105\" y=\"4\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"13\" text-anchor=\"middle\" fill=\"#ffffff\">1</text>\n      <!-- 라벨 -->\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">caring response · mindfulness</text>\n      <text x=\"0\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">배려 반응 · 마음 챙김</text>\n    </g>\n\n    <!-- 처방 ② -->\n    <g transform=\"translate(450, 140)\">\n      <rect x=\"-122\" y=\"-22\" width=\"244\" height=\"44\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-105\" cy=\"0\" r=\"12\" fill=\"#1FA34A\"/>\n      <text x=\"-105\" y=\"4\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"13\" text-anchor=\"middle\" fill=\"#ffffff\">2</text>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">social gratitude</text>\n      <text x=\"0\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">사회적 감사</text>\n    </g>\n\n    <!-- 처방 ③ -->\n    <g transform=\"translate(450, 205)\">\n      <rect x=\"-122\" y=\"-22\" width=\"244\" height=\"44\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-105\" cy=\"0\" r=\"12\" fill=\"#1FA34A\"/>\n      <text x=\"-105\" y=\"4\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"13\" text-anchor=\"middle\" fill=\"#ffffff\">3</text>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">play · nature immersion</text>\n      <text x=\"0\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">놀이 · 자연 몰입</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"266\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">shift from self-protection → caring · gratitude · play</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '낯선 사람에 대한 스트레스 → 자기중심·방어적 성향'이고, 마지막은 '긍정 감정↑ → 우울·고립·도덕적 자기도취↓'로 정리된다."}, {"no": "10", "title": "Why Dinosaurs Couldn't Adapt", "ktitle": "공룡이 적응 못 한 이유 — 적응은 느리다", "field": "진화·환경", "page": "no.08", "oneline": "공룡은 적응해 수백만 년 살았지만, ‘우주에서 온’ 급변엔 적응 못 했다.", "tldr": ["공룡은 적응해 수백만 년 살았지만, ‘우주에서 온’ 급변엔 적응 못 했다.", "적응은 거의 항상 너무 ‘느려서’ 점진적 변화 외엔 대처 못 한다.", "선호되는 반응은 ‘이주’ — 단, 적합한 환경이 접근 가능할 때만."], "analogy": "천천히 추워지면 털을 진화시킬 시간이 있지만, 어느 날 갑자기 빙하기가 닥치면 못 따라가죠. 공룡은 운석이라는 ‘갑작스러운 변화’에 적응할 시간이 없었어요.", "bg": "분야는 진화·환경이에요. 공룡이 오래 적응해 살아남았다는 것이 배경. → 그런 공룡이 운석 충돌 같은 ‘갑작스러운 충격’에는 왜 적응 못 했는지에 주목하며 읽으세요.", "flow": [{"kind": "사실", "t": "공룡은 적응해 수백만 년 생존"}, {"kind": "한계", "t": "‘우주에서 온’ 급변엔 적응 실패"}, {"kind": "원리", "t": "적응 = 너무 느림 → 점진적 변화에만 대처"}, {"kind": "대안", "t": "선호 반응 = ‘이주’ (적합 환경 접근 가능할 때만)"}, {"kind": "교훈", "t": "급변하는 오늘날 환경에도 적용되는 교훈"}], "quiz": [["공룡이 멸종한 핵심 이유는?", "적응은 너무 느린 과정인데, 운석처럼 ‘이전에 겪지 못한 급변’에는 적응할 시간이 없었기 때문이에요."], ["급변에 ‘선호되는 반응’은 무엇인가?", "더 적합한 환경으로의 ‘이주’예요 — 단, 그런 환경에 접근할 수 있을 때만 가능해요."], ["핵심 한 문장?", "적응은 느려 급변에 무력하므로, 적응도 이주도 못 하는 종은 생존할 수 없다."]], "vocab": [["adapt", "적응하다"], ["originate", "유래하다·비롯되다"], ["cope with", "대처하다"], ["gradual", "점진적인"], ["migration", "이주"], ["habitat", "서식지"], ["geopolitical", "지정학적인"]], "en": "Dinosaurs had indeed adapted and, as a group, they survived for millions of years. Under other circumstances, they almost certainly would have survived many more. But they couldn't adapt to environmental conditions that they had never before experienced ─ which originated in an object from outer space. Studies of evolution now recognize that adaptation is almost always too slow a process to cope with any but the most gradual environmental changes. Adaptations seem to yield species with truly distinct properties only in isolated environments. The favored response to changing conditions is most often migration to a new location with a more suitable environment ─ but of course only if such an environment is accessible. When a species can't adapt or relocate to a suitable habitat, it doesn't stand a chance. In our rapidly changing environment, people would do well to take this into consideration. Despite technological advances, the lesson is probably relevant when evaluating the likely geopolitical implications of today's changing environment.", "ko": "공룡들은 확실히 적응했고, 한 집단으로서 수백만 년 동안 생존했다. 다른 상황이었다면 거의 확실히 더 오랫동안 생존했을 것이다. 하지만 공룡은 이전에 경험하지 못했던 환경 조건, 즉 우주에서 온 물체에서 유래한 환경 조건에 적응할 수 없었다. 진화 연구는 적응이 거의 항상 너무 느린 과정이어서 가장 점진적인 환경의 변화 이외에는 어떤 것도 대처할 수 없다는 것을 이제는 인식한다. 적응은 고립된 환경에서만 진정으로 뚜렷한 특성을 가진 종을 만드는 것처럼 보인다. 변화하는 상황에 대한 선호되는 반응은 대개 더 적합한 환경이 있는 새로운 장소로 이동하는 것이지만, 물론 그런 환경이 접근할 수 있을 때만 가능하다. 어떤 종이 적응하거나 적합한 서식지로 이주할 수 없다면 종은 생존할 가능성이 없다. 급변하는 환경 속에서 사람들은 이를 고려해야 할 것이다. 기술 발전에도 불구하고, 오늘날 변화하는 환경의 가능성 있는 지정학적 영향을 평가할 때 이 교훈은 아마도 관련이 있을 것이다.", "read": [{"en": "Dinosaurs had indeed adapted and, as a group, they survived for millions of years.", "ko": "공룡들은 확실히 적응했고, 한 집단으로서 수백만 년 동안 생존했다.", "chunks": [["Dinosaurs had indeed adapted", "공룡은 실제로 적응했고"], ["and, as a group,", "그리고, 한 집단으로서,"], ["they survived for millions of years.", "그들은 수백만 년 동안 생존했다."]]}, {"en": "Under other circumstances, they almost certainly would have survived many more.", "ko": "다른 상황이었다면 거의 확실히 더 오랫동안 생존했을 것이다.", "chunks": [["Under other circumstances,", "다른 상황이었다면,"], ["they almost certainly would have survived", "그들은 거의 확실히 생존했을 것이다"], ["many more.", "훨씬 더 오랫동안."]]}, {"en": "But they couldn't adapt to environmental conditions that they had never before experienced ─ which originated in an object from outer space.", "ko": "하지만 공룡은 이전에 경험하지 못했던 환경 조건, 즉 우주에서 온 물체에서 비롯된 환경 조건에 적응할 수 없었다.", "chunks": [["But they couldn't adapt", "하지만 그들은 적응할 수 없었다"], ["to environmental conditions", "환경 조건에"], ["that they had never before experienced ─", "이전에 경험하지 못했던 ─"], ["which originated in an object from outer space.", "우주 공간에서 날아온 물체에서 비롯된."]]}, {"en": "Studies of evolution now recognize that adaptation is almost always too slow a process to cope with any but the most gradual environmental changes.", "ko": "진화 연구는 이제 적응이 거의 항상 너무 느린 과정이어서 가장 점진적인 환경 변화 외에는 어떤 것에도 대처할 수 없음을 인정한다.", "chunks": [["Studies of evolution now recognize", "진화 연구는 이제 인정한다"], ["that adaptation is almost always too slow a process", "적응이 거의 항상 너무 느린 과정이라는 것을"], ["to cope with any but the most gradual environmental changes.", "가장 점진적인 환경 변화 외에는 어떤 변화에도 대처하기에는."]]}, {"en": "Adaptations seem to yield species with truly distinct properties only in isolated environments.", "ko": "적응은 오직 고립된 환경에서만 진정으로 뚜렷한 속성을 가진 종을 산출하는 것처럼 보인다.", "chunks": [["Adaptations seem to yield species", "적응은 종을 산출하는 것 같다"], ["with truly distinct properties", "진정으로 뚜렷한 속성을 가진"], ["only in isolated environments.", "오직 고립된 환경에서만."]]}, {"en": "The favored response to changing conditions is most often migration to a new location with a more suitable environment ─ but of course only if such an environment is accessible.", "ko": "변화하는 조건에 대한 선호되는 반응은 가장 흔히 더 적합한 환경을 가진 새로운 장소로의 이주이다 ─ 하지만 물론 그러한 환경이 접근 가능할 때만.", "chunks": [["The favored response to changing conditions", "변화하는 조건에 대한 선호되는 반응은"], ["is most often migration", "가장 흔히 이주이다"], ["to a new location with a more suitable environment ─", "더 적합한 환경을 가진 새로운 장소로의 ─"], ["but of course only if such an environment is accessible.", "하지만 물론 그러한 환경이 접근 가능할 때만."]]}, {"en": "When a species can't adapt or relocate to a suitable habitat, it doesn't stand a chance.", "ko": "종이 적응할 수도 적합한 서식지로 이주할 수도 없을 때, 그것은 가망이 없다.", "chunks": [["When a species can't adapt", "종이 적응할 수 없거나"], ["or relocate to a suitable habitat,", "적합한 서식지로 이주할 수 없을 때,"], ["it doesn't stand a chance.", "그것은 가망이 없다."]]}, {"en": "In our rapidly changing environment, people would do well to take this into consideration.", "ko": "우리의 빠르게 변하는 환경에서, 사람들은 이것을 고려하는 것이 좋을 것이다.", "chunks": [["In our rapidly changing environment,", "우리의 빠르게 변하는 환경에서,"], ["people would do well to take this into consideration.", "사람들은 이것을 고려하는 것이 좋을 것이다."]]}, {"en": "Despite technological advances, the lesson is probably relevant when evaluating the likely geopolitical implications of today's changing environment.", "ko": "기술 진보에도 불구하고, 그 교훈은 오늘날의 변화하는 환경의 그럴듯한 지정학적 함의를 평가할 때 아마도 적절하다.", "chunks": [["Despite technological advances,", "기술 진보에도 불구하고,"], ["the lesson is probably relevant", "그 교훈은 아마도 적절하다"], ["when evaluating the likely geopolitical implications", "그럴듯한 지정학적 함의를 평가할 때"], ["of today's changing environment.", "오늘날의 변화하는 환경의."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 거대 운석이 대각선으로 떨어져 sauropod 공룡 실루엣 위에 큰 X 표시. 오른쪽: 오늘날 교훈 3가지 — adaptation too slow, migration most common, needs accessible environment.\">\n  <!-- 좌측 박스 — 공룡 멸종 -->\n  <g>\n    <text x=\"155\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Dinosaurs — adapted but...</text>\n    <rect x=\"20\" y=\"30\" width=\"270\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 별 점들 (배경 우주) -->\n    <g fill=\"#999\">\n      <circle cx=\"50\" cy=\"55\" r=\"0.8\"/>\n      <circle cx=\"80\" cy=\"48\" r=\"0.7\"/>\n      <circle cx=\"120\" cy=\"52\" r=\"0.8\"/>\n      <circle cx=\"250\" cy=\"60\" r=\"0.8\"/>\n    </g>\n\n    <!-- 운석 (우상단에서 떨어짐) -->\n    <g transform=\"translate(230, 70)\">\n      <!-- 불꽃 꼬리 (대각선) -->\n      <g stroke=\"#c8102e\" stroke-width=\"1.4\" fill=\"none\" opacity=\"0.7\">\n        <line x1=\"6\" y1=\"-6\" x2=\"40\" y2=\"-40\"/>\n        <line x1=\"2\" y1=\"-2\" x2=\"32\" y2=\"-35\" stroke-width=\"1.1\"/>\n        <line x1=\"10\" y1=\"-3\" x2=\"38\" y2=\"-30\" stroke-width=\"1\"/>\n      </g>\n      <!-- 운석 본체 (검정 거친 원) -->\n      <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#1a1a1a\"/>\n      <!-- 운석 표면 텍스처 (작은 점) -->\n      <circle cx=\"-3\" cy=\"-2\" r=\"2\" fill=\"#5e5e5e\"/>\n      <circle cx=\"4\" cy=\"3\" r=\"1.5\" fill=\"#5e5e5e\"/>\n      <circle cx=\"-4\" cy=\"4\" r=\"1.5\" fill=\"#5e5e5e\"/>\n      <!-- 라벨 위 -->\n      <text x=\"32\" y=\"-46\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" fill=\"#c8102e\">object from</text>\n      <text x=\"32\" y=\"-36\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" fill=\"#c8102e\">outer space</text>\n    </g>\n\n    <!-- 땅 (지표선) -->\n    <line x1=\"30\" y1=\"190\" x2=\"280\" y2=\"190\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n\n    <!-- Sauropod 공룡 실루엣 -->\n    <g transform=\"translate(120, 165)\">\n      <!-- 꼬리 (좌측 길게 가늘어짐) -->\n      <path d=\"M -25,5 Q -45,8 -60,2 Q -72,-3 -78,-10\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n      <!-- 몸체 (큰 ellipse) -->\n      <ellipse cx=\"0\" cy=\"5\" rx=\"32\" ry=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <!-- 목 (긴 곡선, 우상단으로) -->\n      <path d=\"M 25,-5 Q 38,-25 48,-38 Q 50,-43 53,-46\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n      <!-- 머리 (작은 ellipse) -->\n      <ellipse cx=\"58\" cy=\"-48\" rx=\"9\" ry=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 눈 -->\n      <circle cx=\"60\" cy=\"-49\" r=\"0.9\" fill=\"#1a1a1a\"/>\n      <!-- 다리 4개 (앞 2 · 뒤 2) -->\n      <rect x=\"-22\" y=\"15\" width=\"6\" height=\"20\" rx=\"1\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <rect x=\"-10\" y=\"17\" width=\"6\" height=\"18\" rx=\"1\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <rect x=\"10\" y=\"17\" width=\"6\" height=\"18\" rx=\"1\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <rect x=\"20\" y=\"15\" width=\"6\" height=\"20\" rx=\"1\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    </g>\n\n    <!-- 큰 X (멸종 표시) — 공룡 위에 -->\n    <g transform=\"translate(120, 130)\">\n      <line x1=\"-40\" y1=\"-30\" x2=\"40\" y2=\"50\" stroke=\"#c8102e\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n      <line x1=\"40\" y1=\"-30\" x2=\"-40\" y2=\"50\" stroke=\"#c8102e\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n    </g>\n\n    <text x=\"155\" y=\"215\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">couldn't adapt to unprecedented shock</text>\n  </g>\n\n  <!-- 우측 박스 — 오늘날 교훈 -->\n  <g>\n    <text x=\"445\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Lessons for Today — 교훈</text>\n    <rect x=\"310\" y=\"30\" width=\"270\" height=\"200\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 교훈 1: adaptation = too slow -->\n    <g transform=\"translate(445, 65)\">\n      <rect x=\"-122\" y=\"-15\" width=\"244\" height=\"32\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-105\" cy=\"0\" r=\"10\" fill=\"#1FA34A\"/>\n      <text x=\"-105\" y=\"3.5\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"11\" text-anchor=\"middle\" fill=\"#ffffff\">1</text>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">adaptation = too slow</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">적응은 너무 느린 과정</text>\n    </g>\n\n    <!-- 교훈 2: migration = most common -->\n    <g transform=\"translate(445, 115)\">\n      <rect x=\"-122\" y=\"-15\" width=\"244\" height=\"32\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-105\" cy=\"0\" r=\"10\" fill=\"#1FA34A\"/>\n      <text x=\"-105\" y=\"3.5\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"11\" text-anchor=\"middle\" fill=\"#ffffff\">2</text>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">migration = most common</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">이주가 가장 흔한 대응</text>\n    </g>\n\n    <!-- 교훈 3: BUT — needs accessible (조건) -->\n    <g transform=\"translate(445, 165)\">\n      <rect x=\"-122\" y=\"-15\" width=\"244\" height=\"32\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n      <circle cx=\"-105\" cy=\"0\" r=\"10\" fill=\"#c8102e\"/>\n      <text x=\"-105\" y=\"4\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"14\" text-anchor=\"middle\" fill=\"#ffffff\">!</text>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">needs accessible environment</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">접근 가능해야 가능 — 조건</text>\n    </g>\n\n    <text x=\"445\" y=\"215\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">applies to today's rapidly changing environment</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"246\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">adaptation alone may not save us — accessibility matters</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '공룡은 적응해 수백만 년 생존'이고, 마지막은 '급변하는 오늘날 환경에도 적용되는 교훈'로 정리된다."}, {"no": "11", "title": "How Children Find Hidden Objects", "ktitle": "아이는 공간 크기 따라 단서를 달리 쓴다", "field": "인지·발달", "page": "기출 예제 01", "oneline": "작은 공간: 아이는 ‘기하학(모양·형태)’ 정보에만 의존한다.", "tldr": ["작은 공간: 아이는 ‘기하학(모양·형태)’ 정보에만 의존한다.", "큰 공간: 기하학+비기하학(파란 벽 등) 정보를 ‘함께’ 쓴다.", "기하학이 더 안정적이라 ‘특권’을 가지며, 가까운 단서에 더 가중."], "analogy": "좁은 방에선 ‘모서리·모양’만 보고 위치를 찾지만, 넓은 방에선 ‘파란 벽’ 같은 표시도 같이 봐요. 변하지 않는 단서(모양)를 더 믿는 거죠.", "bg": "분야는 인지·발달이에요. 핵심은 아이가 숨은 물건을 찾을 때 ‘기하학(모양·형태)’ 정보에 의존한다는 것. → 작은 공간에서 아이가 어떤 단서에 기대는지에 주목하며 읽으세요.", "flow": [{"kind": "작은 공간", "t": "‘기하학(모양)’ 정보에만 의존"}, {"kind": "큰 공간", "t": "기하학 + 비기하학(파란 벽) ‘함께’ 사용"}, {"kind": "해석", "t": "두 정보가 ‘가중된 방식’으로 결합"}, {"kind": "이유", "t": "기하학이 더 안정적 → ‘특권’ / 큰 특징=더 신뢰"}, {"kind": "추가", "t": "가까운 랜드마크에 더 가중 (Weber 법칙)"}], "quiz": [["작은 공간과 큰 공간에서 아이의 단서 사용은?", "작은 공간에선 기하학(모양) 정보에만 의존하지만, 큰 공간에선 비기하학(파란 벽) 정보까지 함께 써요."], ["기하학 정보가 ‘특권’을 갖는 이유는?", "비기하학 정보보다 시간이 지나도 더 안정적이기 때문이에요."], ["핵심 한 문장?", "아이는 공간 크기에 따라 기하·비기하 정보를 가중 결합하며, 더 안정적인 기하 정보에 우선권을 둔다."]], "vocab": [["geometric", "기하학적인"], ["enclosure", "에워싸인 장소"], ["incorporate", "포함하다·결합하다"], ["weighted", "가중된"], ["privileged", "특권을 가진"], ["landmark", "랜드마크·표지물"], ["validity", "타당성"]], "en": "While it has been found that young children rely exclusively on geometric information to determine the location of an object hidden in a small enclosure, exclusive use of geometry does not occur in larger spaces. Although, in a small room, children failed to incorporate information about nongeometric features (i.e., a blue wall), they used both types of information in a larger room. These findings suggest that geometric and nongeometric information may be combined in a weighted fashion. Geometry may be privileged because it is more stable across time than is nongeometric information. Whether or not nongeometric landmark information is combined with geometry may depend on the ecological validity of nongeometric features; for example, larger features may be more stable and hence more reliable. Further, a variety of mobile animals give more weight to nearer than to farther landmarks in estimation, consistent with Weber's law in which smaller distances would be coded more accurately than larger distances.", "ko": "어린아이들은 작은 에워싸인 장소에 숨겨진 물체의 위치를 파악하는 데 오로지 기하학적 정보에만 의존하는 것으로 밝혀졌지만, 더 큰 공간에서는 기하학의 단독 사용이 일어나지 않는다. 비록 작은 방에서 아이들은 비기하학적 특징(예를 들어, 파란색 벽)에 대한 정보를 포함하는 데 실패했지만, 그들은 더 큰 방에서 두 가지 유형의 정보를 모두 사용했다. 이러한 연구 결과는 기하학적 그리고 비기하학적 정보가 가중된 방식으로 결합될 수 있음을 시사한다. 기하학은 비기하학적 정보가 그러한 것보다 시간이 지나도 더 안정적이기 때문에 특권을 가질 수도 있다. 비기하학적 랜드마크 정보가 기하학과 결합하는지 또는 아닌지의 여부는 비기하학적 특징의 생태학적 타당성에 달려있을 수 있다. 예를 들어, 더 큰 특징은 더 안정적일 수 있고 그래서 더 일관된다. 게다가, 다양한 이동하는 동물은 추정 시 더 멀리 있는 랜드마크보다 더 가까이 있는 것에 더 많은 가중치를 부여하는데, (이는) 적은 거리가 큰 거리보다 더 정확하게 부호화 된다는 Weber의 법칙과도 모순되지 않는다.", "read": [{"en": "While it has been found that young children rely exclusively on geometric information to determine the location of an object hidden in a small enclosure, exclusive use of geometry does not occur in larger spaces.", "ko": "어린아이들은 작은 에워싸인 장소에 숨겨진 물체의 위치를 파악하는 데 오로지 기하학적 정보에만 의존하는 것으로 밝혀졌지만, 더 큰 공간에서는 기하학의 단독 사용이 일어나지 않는다.", "chunks": [["While it has been found that young children rely exclusively on geometric information", "어린아이들이 기하학적 정보에만 오로지 의존하는 것으로 밝혀졌지만"], ["to determine the location of an object hidden in a small enclosure,", "작은 에워싸인 장소에 숨겨진 물체의 위치를 파악하기 위해,"], ["exclusive use of geometry does not occur", "기하학의 단독 사용은 일어나지 않는다"], ["in larger spaces.", "더 큰 공간에서는."]]}, {"en": "Although, in a small room, children failed to incorporate information about nongeometric features (i.e., a blue wall), they used both types of information in a larger room.", "ko": "비록 작은 방에서 아이들이 비기하학적 특징(즉, 파란색 벽)에 대한 정보를 통합하는 데 실패했지만, 그들은 더 큰 방에서 두 가지 유형의 정보 모두를 사용했다.", "chunks": [["Although, in a small room,", "비록, 작은 방에서,"], ["children failed to incorporate information", "아이들이 정보를 통합하는 데 실패했지만"], ["about nongeometric features (i.e., a blue wall),", "비기하학적 특징(즉, 파란색 벽)에 대한,"], ["they used both types of information", "그들은 두 가지 유형의 정보 모두를 사용했다"], ["in a larger room.", "더 큰 방에서는."]]}, {"en": "These findings suggest that geometric and nongeometric information may be combined in a weighted fashion.", "ko": "이러한 연구 결과는 기하학적·비기하학적 정보가 가중된 방식으로 결합될 수 있음을 시사한다.", "chunks": [["These findings suggest", "이러한 연구 결과는 시사한다"], ["that geometric and nongeometric information", "기하학적·비기하학적 정보가"], ["may be combined", "결합될 수 있음을"], ["in a weighted fashion.", "가중된 방식으로."]]}, {"en": "Geometry may be privileged because it is more stable across time than is nongeometric information.", "ko": "기하학은 비기하학적 정보가 그러한 것보다 시간이 지나도 더 안정적이기 때문에 특권을 가질 수도 있다.", "chunks": [["Geometry may be privileged", "기하학은 특권을 가질 수도 있다"], ["because it is more stable across time", "시간에 걸쳐 더 안정적이기 때문에"], ["than is nongeometric information.", "비기하학적 정보가 그러한 것보다."]]}, {"en": "Whether or not nongeometric landmark information is combined with geometry may depend on the ecological validity of nongeometric features; for example, larger features may be more stable and hence more reliable.", "ko": "비기하학적 랜드마크 정보가 기하학과 결합되는지 또는 아닌지의 여부는 비기하학적 특징의 생태학적 타당성에 달려 있을 수 있다. 예를 들어, 더 큰 특징은 더 안정적일 수 있고 그래서 더 신뢰할 수 있다.", "chunks": [["Whether or not nongeometric landmark information", "비기하학적 랜드마크 정보가 ~인지 아닌지의 여부는"], ["is combined with geometry", "기하학과 결합되는지"], ["may depend on the ecological validity", "생태학적 타당성에 달려 있을 수 있다"], ["of nongeometric features;", "비기하학적 특징의;"], ["for example,", "예를 들어,"], ["larger features may be more stable", "더 큰 특징은 더 안정적일 수 있고"], ["and hence more reliable.", "그래서 더 신뢰할 수 있다."]]}, {"en": "Further, a variety of mobile animals give more weight to nearer than to farther landmarks in estimation, consistent with Weber's law in which smaller distances would be coded more accurately than larger distances.", "ko": "게다가, 다양한 이동하는 동물은 추정 시 더 멀리 있는 랜드마크보다 더 가까이 있는 것에 더 많은 가중치를 부여하는데, (이는) 더 작은 거리가 더 큰 거리보다 더 정확하게 부호화된다는 Weber의 법칙과 일치한다.", "chunks": [["Further,", "게다가,"], ["a variety of mobile animals", "다양한 이동하는 동물은"], ["give more weight to nearer than to farther landmarks", "더 멀리 있는 랜드마크보다 더 가까이 있는 것에 더 많은 가중치를 부여한다"], ["in estimation,", "추정에서,"], ["consistent with Weber's law", "Weber의 법칙과 일치한다"], ["in which smaller distances would be coded more accurately", "그 안에서는 작은 거리가 더 정확히 부호화되는"], ["than larger distances.", "더 큰 거리보다."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽: 작은 방의 평면도, 위쪽 벽에 blue wall 표시(빨강 점선)에 X 무시. 가운데 어린이 stick figure가 4 코너를 보며 geometry만 사용. 오른쪽: 큰 방 평면도, 위쪽 blue wall(초록 줄무늬)에 V, 어린이가 geometry와 blue wall 두 화살표를 함께 사용하는 가중 결합 그림.\">\n  <!-- 좌측 박스 — 작은 방 (geometric only) -->\n  <g>\n    <text x=\"155\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">작은 방 — geometric only</text>\n    <rect x=\"20\" y=\"30\" width=\"270\" height=\"225\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 작은 방 평면도 (정사각형 작게) -->\n    <g transform=\"translate(155, 145)\">\n      <!-- 4 벽 -->\n      <rect x=\"-55\" y=\"-50\" width=\"110\" height=\"100\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n      <!-- 위쪽 벽 — blue wall (회색 줄무늬 + 빨강 라벨) -->\n      <rect x=\"-55\" y=\"-50\" width=\"110\" height=\"6\" fill=\"#999\"/>\n      <g stroke=\"#fdf2f4\" stroke-width=\"0.8\">\n        <line x1=\"-50\" y1=\"-50\" x2=\"-50\" y2=\"-44\"/>\n        <line x1=\"-40\" y1=\"-50\" x2=\"-40\" y2=\"-44\"/>\n        <line x1=\"-30\" y1=\"-50\" x2=\"-30\" y2=\"-44\"/>\n        <line x1=\"-20\" y1=\"-50\" x2=\"-20\" y2=\"-44\"/>\n        <line x1=\"-10\" y1=\"-50\" x2=\"-10\" y2=\"-44\"/>\n        <line x1=\"0\" y1=\"-50\" x2=\"0\" y2=\"-44\"/>\n        <line x1=\"10\" y1=\"-50\" x2=\"10\" y2=\"-44\"/>\n        <line x1=\"20\" y1=\"-50\" x2=\"20\" y2=\"-44\"/>\n        <line x1=\"30\" y1=\"-50\" x2=\"30\" y2=\"-44\"/>\n        <line x1=\"40\" y1=\"-50\" x2=\"40\" y2=\"-44\"/>\n        <line x1=\"50\" y1=\"-50\" x2=\"50\" y2=\"-44\"/>\n      </g>\n      <!-- \"blue wall\" 라벨 + ✗ -->\n      <text x=\"0\" y=\"-62\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">blue wall</text>\n      <g transform=\"translate(60, -47)\">\n        <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n        <line x1=\"-3.5\

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 영어독해연습 05강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 영어독해연습 08강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-phone">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 영어독해연습 05강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 영어독해연습 05강
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data":[{"no":"1","title":"New Discoveries about Dolphin Cognition and Culture","ktitle":"돌고래의 인지·문화 — 인간만의 것이 아니다","field":"동물·인지","page":"05강 Ex.01","oneline":"새 연구로 돌고래의 인지·감정·의식이 드러났다.","tldr":["새 연구로 돌고래의 인지·감정·의식이 드러났다.","구문·거울 자기인식·가리키기 이해 등 ‘인간만의 것’으로 여겨진 특성을 보인다.","문화의 증거도 있다 — 범고래 방언이 세대 전승, 병코돌고래는 해면을 도구로."],"analogy":"‘이건 사람만 한다’던 능력들 — 단어 순서 이해, 거울 속 자기 알아보기 —을 돌고래도 해요. 게다가 가족마다 다른 ‘사투리’를 물려주고 도구까지 쓰니, 동물에게도 ‘문화’가 있는 셈이죠.","bg":"돌고래가 구문·자기인식·도구 사용 등 인간(과 일부 영장류)에게만 있다고 여겨진 정교한 특성과 ‘문화’(전승되는 방언 등)를 지닌다는 연구를 소개한 글이에요.","flow":[{"kind":"발견","t":"새 천 년대, 돌고래 인지·감정·의식 연구"},{"kind":"능력","t":"구문·의미·어순 이해, 거울 자기인식, 가리키기 이해","d":"인간만의 것으로 여겨졌던 특성."},{"kind":"문화 ①","t":"범고래 — 가족별 방언이 세대 전승"},{"kind":"문화 ②","t":"병코돌고래 — 해면을 도구로 사용"},{"kind":"결론","t":"돌고래에게도 ‘문화’가 있다"}],"quiz":[["돌고래가 보이는, ‘인간만의 것’으로 여겨졌던 능력은?","구문·의미·어순 이해, 거울 자기인식, 가리키기 제스처 이해, 신체 부위 지칭 이해 등이에요."],["돌고래에게 ‘문화’가 있다는 증거는?","범고래의 방언이 가족마다 다르고 세대로 전승되며, 병코돌고래는 해저에서 먹이 찾을 때 해면을 도구로 써요."],["핵심 한 문장?","돌고래는 인간만의 것으로 여겨진 정교한 인지 능력과 전승되는 ‘문화’를 지닌다."]],"vocab":[["cognition","인지·인식"],["consciousness","의식"],["emphasis","강조·중점"],["obtain","얻다·획득하다"],["inner","내면의·내적인"],["exhibit","보이다·드러내다"],["sophisticated","정교한·복잡한"]],"en":"The new millennium has brought discoveries about dolphin cognition, emotion, and consciousness, creating a bridge to what is known about dolphin behavior with an emphasis on communication. New data on dolphin intelligence allow us to obtain a broader picture of the inner lives of dolphins. We see that dolphins exhibit sophisticated characteristics previously attributed only to humans and possibly to other higher primates. We know that dolphins understand syntax, semantics, and word order, and are capable of mirror-self-recognition, comprehension of pointing gestures, and understanding reference to body parts. They can identify the same abstract object using vision or echolocation. There is evidence that dolphins have culture. For instance, killer whales have vocal dialects that are distinct to each family group and are passed down through generations; some bottlenose dolphins use sponges as tools when foraging along the sea floor.","ko":"새 천년에 들어 돌고래의 인지, 감정, 의식에 대한 발견이 이루어져서, 소통에 중점을 두고 돌고래의 행동에 대해 알려진 것을 잇는 다리를 만들었다. 돌고래의 지능에 대한 새로운 자료 덕분에 우리는 돌고래의 내적인 삶에 대한 더 폭넓은 이해를 얻을 수 있다. 우리는 돌고래가 이전에는 인간에게만 그리고 아마도 다른 고등 영장류에게 있다고 생각되었던 정교한 특성을 보인다는 것을 알고 있다. 우리는 돌고래가 구문, 의미, 어순을 이해하며, 거울 자아 인식, 가리키는 제스처의 이해, 신체 부위에 대한 언급의 이해에 대한 능력이 있음을 알고 있다. 그들은 시각 또는 반향 정위를 사용하여 동일한 추상적인 물체를 식별할 수 있다. 돌고래에게 문화가 있다는 증거가 있다. 예를 들어, 범고래는 각 가족 집단에게 고유하며 여러 세대에 걸쳐 전승되는 음성 방언을 가지고 있으며, 일부 큰돌고래는 해저를 따라 먹이를 찾아다닐 때 해면을 도구로 사용한다.","read":[{"en":"The new millennium has brought discoveries about dolphin cognition, emotion, and consciousness, creating a bridge to what is known about dolphin behavior with an emphasis on communication.","ko":"새 천년에 들어 돌고래의 인지, 감정, 의식에 대한 발견이 이루어져서, 소통에 중점을 두고 돌고래의 행동에 대해 알려진 것을 잇는 다리를 만들었다.","chunks":[["The new millennium","새 천년이"],["has brought discoveries","발견을 가져왔다"],["about dolphin cognition, emotion, and consciousness,","돌고래의 인지, 감정, 의식에 대한,"],["creating a bridge","다리를 만들어 내며"],["to what is known about dolphin behavior","돌고래의 행동에 대해 알려진 것을 향한"],["with an emphasis on communication.","의사소통에 중점을 두고."]]},{"en":"New data on dolphin intelligence allow us to obtain a broader picture of the inner lives of dolphins.","ko":"돌고래의 지능에 대한 새로운 자료 덕분에 우리는 돌고래의 내적인 삶에 대한 더 폭넓은 이해를 얻을 수 있다.","chunks":[["New data on dolphin intelligence","돌고래의 지능에 대한 새로운 자료가"],["allow us to obtain","우리에게 ~을 얻게 해 준다"],["a broader picture","더 폭넓은 그림을"],["of the inner lives of dolphins.","돌고래의 내적인 삶에 대한."]]},{"en":"We see that dolphins exhibit sophisticated characteristics previously attributed only to humans and possibly to other higher primates.","ko":"우리는 돌고래가 이전에는 인간에게만 그리고 아마도 다른 고등 영장류에게 있다고 생각되었던 정교한 특성을 보인다는 것을 알고 있다.","chunks":[["We see that","우리는 ~을 본다"],["dolphins exhibit","돌고래가 ~을 보인다는 것을"],["sophisticated characteristics","정교한 특성을"],["previously attributed onl ) -->\n    <g transform=\"translate(125, 60)\">\n      <!-- 몸통 (유선형 — 머리는 둥글고, 꼬리쪽 가늘어짐) -->\n      <path d=\"M -62 0 Q -55 -4 -40 -5 Q -10 -16 20 -14 Q 42 -11 52 -4 Q 58 0 52 4 Q 42 9 20 11 Q -10 15 -40 8 Q -55 6 -62 4 Z\" \n            fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/>\n      <!-- 부리 (rostrum) - 머리 앞쪽 돌출 -->\n      <path d=\"M 50 -3 Q 60 -2 64 0 Q 60 3 50 4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <!-- 등지느러미 (위쪽, 곡선) -->\n      <path d=\"M -5 -15 Q 0 -28 12 -22 Q 16 -18 10 -14 Z\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <!-- 가슴지느러미 (앞쪽, 아래로 -->\n      <path d=\"M 22 7 Q 28 16 18 18 Q 13 14 17 8 Z\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <!-- 꼬리 (수평 부채꼴 — fluke) -->\n      <g transform=\"translate(-62, 1)\">\n        <path d=\"M 0 0 Q -8 -10 -18 -8 L -12 -2 L -18 4 Q -8 9 0 1 Z\" \n              fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      </g>\n      <!-- 눈 -->\n      <circle cx=\"38\" cy=\"-3\" r=\"1.4\" fill=\"#1a1a1a\"/>\n      <!-- 입 라인 -->\n      <line x1=\"48\" y1=\"2\" x2=\"58\" y2=\"2\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n      <!-- 분기공 (blowhole) - 머리 위 작은 점 -->\n      <circle cx=\"30\" cy=\"-10\" r=\"0.8\" fill=\"#1a1a1a\"/>\n    </g>\n\n    <!-- 같은 능력 (3개 한 줄 + echolocation 별도) -->\n    <g font-family=\"Noto Serif\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1FA34A\">\n      <g transform=\"translate(50, 115)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"32\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">syntax ✓</text>\n      </g>\n      <g transform=\"translate(125, 115)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"36\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">mirror-self ✓</text>\n      </g>\n      <g transform=\"translate(200, 115)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"38\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">semantics ✓</text>\n      </g>\n      <!-- echolocation 별도 — 돌고래 고유 -->\n      <g transform=\"translate(125, 142)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"80\" ry=\"11\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">+ cross-sensory via echolocation</text>\n      </g>\n    </g>\n\n    <!-- 문화 미니 라벨 (하단) -->\n    <g transform=\"translate(0, 168)\">\n      <rect x=\"20\" y=\"0\" width=\"210\" height=\"20\" fill=\"#1FA34A\" fill-opacity=\"0.1\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"125\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">CULTURE</text>\n      <text x=\"125\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">vocal dialects · sponges as foraging tools</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"248\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">no longer human-only — dolphins share cognition &amp; culture</text>\n</svg>","caption":"인간 고유의 능력 박스 → 돌고래도 보유 + 문화까지"},{"no":"2","title":"Technology Cannot Bear the Weight of the Ecological Crisis","ktitle":"기술이 생태 위기를 다 풀어주진 못한다","field":"환경·기술","page":"05강 Ex.02","oneline":"많은 이가 기술을 모든 생태 문제의 해답으로 믿는다.","tldr":["많은 이가 기술을 모든 생태 문제의 해답으로 믿는다.","기술은 역할은 하지만 ‘무한 풍요의 꿈’을 떠받칠 순 없다.","인구·소비 증가를 보상 못 하고, 새 문제를 낳으며 ‘소비를 줄일 필요’를 외면시킨다."],"analogy":"물이 새는 배에서 ‘더 좋은 펌프’만 믿는 격이에요. 펌프(기술)는 도움이 되지만, 정작 ‘물을 덜 들어오게(소비를 줄이기)’ 하지 않으면 근본 해결이 안 되죠.","bg":"기술을 생태 위기의 만능 해결책으로 믿는 ‘풍요주의(cornucopian)’를 비판하며, 기술이 인구·소비 증가를 보상 못 하고 오히려 소비 감축의 필요를 가린다는 글이에요.","flow":[{"kind":"믿음","t":"기술 = 모든 생태 문제의 해답이라는 신앙"},{"kind":"한계","t":"역할은 있지만 ‘무한 풍요의 꿈’은 못 떠받침"},{"kind":"부작용","t":"비싸·전문화 / ‘해결책’이 새 문제를 낳아 더 많은 기술 요구"},{"kind":"근본","t":"정작 ‘소비 감축’의 필요를 외면시킴"},{"kind":"결론","t":"문제의 원인(기술과학·자본·국가 체제)에 더 갇히게 됨"}],"quiz":[["기술이 생태 위기를 ‘떠받칠 수 없다’는 이유는?","통제 없는 인구·소비 증가를 보상하지 못하고, 비싸지거나 새 문제를 낳으며 더 많은 기술 개입을 부르기 때문이에요."],["기술 만능 믿음이 가리는 ‘근본 필요’는?","실제로 ‘소비를 줄이는 것’ — 그리고 문제를 일으키는 집단적 사고방식에서 벗어나는 것이에요."],["핵심 한 문장?","기술은 생태 위기에 역할은 하지만, 소비 감축 없이 그것만으로는 위기를 떠받칠 수 없다."]],"vocab":[["faith","믿음·신앙"],["ecological","생태적인·생태계의"],["ecocrisis","생태 위기"],["appropriate","적절한·알맞은"],["affordable","(가격이) 적당한·감당 가능한"],["resolve","해결하다"],["cornucopian","풍요로운·풍요의"]],"en":"Many people, including those in most governments, place their faith in new technologies as the solution to every present and indeed future ecological problem. And it is true that appropriate, clean, and affordable technology has an important role to play in resolving the ecocrisis; but it cannot bear the weight of cornucopian dreams. Technology is vanishingly unlikely to be able to compensate for uncontrolled expansion of either population or consumption. For example, it tends to become increasingly expensive and/or specialized, and technological 'solutions' notoriously tend to create new problems, which then seem to require more technological intervention, and so on. Still more fundamentally, such 'solutions' to ecological problems ignore the urgent need actually to reduce consumption (thereby, of course, spending less) and lock us into a collective mindset ─ run by technoscience, financed by capital, and protected by state power ─ which is a principal cause of the problems. Then more of that cause can only be perceived, with increasingly desperate denial, as the only solution.","ko":"대부분의 정부에 속한 사람들을 포함하여, 많은 사람들이 현재의, 그리고 실제로 미래의 모든 생태계 문제에 대한 해결책으로 신기술에 믿음을 두고 있다. 그리고 적절하고 청정하며 적당한 가격의 기술이 생태 위기를 해결하는 데 해야 할 중요한 역할이 있는 것은 사실이지만, 그것이 풍요로운 꿈의 무게를 감당할 수는 없다. 기술이 인구나 소비의 통제되지 않은 팽창을 보상할 수 있는 가능성은 극히 낮다. 예를 들어, 기술은 점점 더 비싸지고/비싸지거나 전문화되는 경향이 있으며, 기술적인 '해결책'은 새로운 문제들을 만들어 내는 경향이 있는 것으로 악명이 높은데, 그런 다음 그 문제들은 더 많은 기술적 개입을 요구하고 그리고 그런 식으로 계속되는 것 같다. 한층 더 근본적으로는, 생태 문제에 대한 그러한 '해결책'은 실제로 소비를 줄여야(그럼으로써 당연히 더 적게 써야) 할 시급한 필요성을 무시하고, 집단적 사고방식, 즉 기술 과학에 의해 운영되고 자본에 의해 자금이 조달되며 국가 권력에 의해 보호되는 사고방식에 우리를 가두는데, 그것이 그 문제의 주요한 '원인'이다. 그러면 점점 더 필사적으로 부인하면서도, 그 원인의 더 많은 부분이 유일한 해결책으로 인식될 수 있을 뿐이다.","read":[{"en":"Many people, including those in most governments, place their faith in new technologies as the solution to every present and indeed future ecological problem.","ko":"대부분의 정부에 속한 사람들을 포함하여, 많은 사람들이 현재의, 그리고 실제로 미래의 모든 생태계 문제에 대한 해결책으로 신기술에 믿음을 두고 있다.","chunks":[["Many people,","많은 사람들이,"],["including those in most governments,","대부분의 정부에 속한 사람들을 포함하여,"],["place their faith in new technologies","신기술에 그들의 믿음을 둔다"],["as the solution","해결책으로"],["to every present and indeed future ecological problem.","모든 현재의, 그리고 실제로 미래의 생태 문제에 대한."]]},{"en":"And it is true that appropriate, clean, and affordable technology has an important role to play in resolving the ecocrisis; but it cannot bear the weight of cornucopian dreams.","ko":"그리고 적절하고 청정하며 적당한 가격의 기술이 생태 위기를 해결하는 데 해야 할 중요한 역할이 있는 것은 사실이지만, 그것이 풍요로운 꿈의 무게를 감당할 수는 없다.","chunks":[["And it is true that","그리고 ~인 것은 사실이다"],["appropriate, clean, and affordable technology","적절하고 청정하며 적당한 가격의 기술이"],["has an important role to play","할 중요한 역할이 있다"],["in resolving the ecocrisis;","생태 위기를 해결하는 데에;"],["but it cannot bear the weight","하지만 그것은 무게를 감당할 수 없다"],["of cornucopian dreams.","풍요로운 꿈의."]]},{"en":"Technology is vanishingly unlikely to be able to compensate for uncontrolled expansion of either population or consumption.","ko":"기술이 인구나 소비의 통제되지 않은 팽창을 보상할 수 있는 가능성은 극히 낮다.","chunks":[["Technology is vanishingly unlikely","기술이 ~할 가능성은 극히 낮다"],["to be able to compensate for","~을 보완할 수 있을"],["uncontrolled expansion","통제되지 않은 팽창을"],["of either population or consumption.","인구 또는 소비의."]]},{"en":"For example, it tends to become increasingly expensive and/or specialized, and technological 'solutions' notoriously tend to create new problems, which then seem to require more technological intervention, and so on.","ko":"예를 들어, 기술은 점점 더 비싸지고/비싸지거나 전문화되는 경향이 있으며, 기술적인 '해결책'은 새로운 문제들을 만들어 내는 경향이 있는 것으로 악명이 높은데, 그런 다음 그 문제들은 더 많은 기술적 개입을 요구하고 그리고 그런 식으로 계속되는 것 같다.","chunks":[["For example,","예를 들어,"],["it tends to become increasingly expensive and/or specialized,","그것은 점점 더 비싸지고/비싸지거나 전문화되는 경향이 있다,"],["and technological 'solutions' notoriously tend to create new problems,","그리고 기술적 '해결책'은 새 문제들을 만들어 내는 경향이 있는 것으로 악명이 높다,"],["which then seem to require","그러면 그것은 ~을 요구하는 것 같다"],["more technological intervention, and so on.","더 많은 기술적 개입을, 그리고 그런 식으로 계속된다."]]},{"en":"Still more fundamentally, such 'solutions' to ecological problems ignore the urgent need actually to reduce consumption (thereby, of course, spending less) and lock us into a collective mindset ─ run by technoscience, financed by capital, and protected by state power ─ which is a principal cause of the problems.","ko":"한층 더 근본적으로는, 생태 문제에 대한 그러한 '해결책'은 실제로 소비를 줄여야(그럼으로써 당연히 더 적게 써야) 할 시급한 필요성을 무시하고, 집단적 사고방식, 즉 기술 과학에 의해 운영되고 자본에 의해 자금이 조달되며 국가 권력에 의해 보호되는 사고방식에 우리를 가두는데, 그것이 그 문제의 주요한 '원인'이다.","chunks":[["Still more fundamentally,","한층 더 근본적으로는,"],["such 'solutions' to ecological problems","생태 문제에 대한 그러한 '해결책'은"],["ignore the urgent need","시급한 필요성을 무시한다"],["actually to reduce consumption","실제로 소비를 줄여야 할"],["(thereby, of course, spending less)","(그럼으로써 당연히, 더 적게 쓰는)"],["and lock us into a collective mindset","그리고 우리를 집단적 사고방식에 가둔다"],["─ run by technoscience,","─ 기술 과학에 의해 운영되고,"],["financed by capital,","자본에 의해 자금이 조달되며,"],["and protected by state power ─","그리고 국가 권력에 의해 보호되는 ─"],["which is a principal cause of the problems.","그것이 그 문제의 주요 원인이다."]]},{"en":"Then more of that cause can only be perceived, with increasingly desperate denial, as the only solution.","ko":"그러면 점점 더 필사적으로 부인하면서도, 그 원인의 더 많은 부분이 유일한 해결책으로 인식될 수 있을 뿐이다.","chunks":[["Then more of that cause","그러면 그 원인의 더 많은 부분이"],["can only be perceived,","~로 인식될 수 있을 뿐이다,"],["with increasingly desperate denial,","점점 더 필사적으로 부인하면서,"],["as the only solution.","유일한 해결책으로."]]}],"metaphor":"<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"가운데에 4단계 빨강 악순환 고리(① 기술 해결책 → ② 새 문제 생성 → ③ 더 많은 기술 개입 필요 → ④ 다시 ①로)가 있고, 좌측에 인구·소비 팽창 박스가 보완 실패를 보여주며, 하단에 사고방식에 사람들이 갇혀 원인이 해결책으로 잘못 인식되는 함정 박스가 배치된 그림\">\n  <!-- 좌측: 보완 실패 (uncontrolled expansion) -->\n  <g transform=\"translate(15, 30)\">\n    <text x=\"70\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">보완 불가능한 팽창</text>\n    <rect x=\"0\" y=\"0\" width=\"140\" height=\"120\" fill=\"#fdf2f4\" fill-opacity=\"0.35\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n    \n    <!-- 인구 아이콘 -->\n    <g transform=\"translate(40, 30)\">\n      <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"6\" x2=\"0\" y2=\"18\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"11\" x2=\"-5\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"11\" x2=\"5\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"18\" x2=\"-4\" y2=\"27\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"18\" x2=\"4\" y2=\"27\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    </g>\n    <g transform=\"translate(60, 32)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"5\" x2=\"0\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"16\" x2=\"-3\" y2=\"23\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"16\" x2=\"3\" y2=\"23\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    </g>\n    <g transform=\"translate(80, 30)\">\n      <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"6\" x2=\"0\" y2=\"18\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"11\" x2=\"-5\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"11\" x2=\"5\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"18\" x2=\"-4\" y2=\"27\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"18\" x2=\"4\" y2=\"27\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    </g>\n    <g transform=\"translate(100, 32)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"5\" x2=\"0\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"16\" x2=\"-3\" y2=\"23\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"16\" x2=\"3\" y2=\"23\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    </g>\n    \n    <!-- 팽창 화살표 -->\n    <line x1=\"20\" y1=\"72\" x2=\"120\" y2=\"72\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n    <polygon points=\"120,72 113,68 113,76\" fill=\"#c8102e\"/>\n    <text x=\"70\" y=\"68\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">uncontrolled expansion</text>\n    \n    <text x=\"70\" y=\"92\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">인구 · 소비</text>\n    <text x=\"70\" y=\"108\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">tech vanishingly unlikely to compensate</text>\n  </g>\n\n  <!-- 가운데: 악순환 사이클 -->\n  <g transform=\"translate(305, 130)\">\n    <!-- 사이클 원 (점선) -->\n    <circle cx=\"0\" cy=\"0\" r=\"78\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n    \n    <!-- 4개 노드 (12·3·6·9시 위치) -->\n    <!-- 12시: 기술 해결책 -->\n    <g transform=\"translate(0, -78)\">\n      <circle cx=\"0\" cy=\"0\" r=\"22\" fill=\"#fdf2f4\" stroke - 3→6 -->\n      <path d=\"M 75 22 A 78 78 0 0 1 22 75\" fill=\"none\"/>\n      <polygon points=\"22,75 30,70 29,78\"/>\n      <!-- 6→9 -->\n      <path d=\"M -22 75 A 78 78 0 0 1 -75 22\" fill=\"none\"/>\n      <polygon points=\"-75,22 -70,30 -78,29\"/>\n      <!-- 9→12 -->\n      <path d=\"M -75 -22 A 78 78 0 0 1 -22 -75\" fill=\"none\"/>\n      <polygon points=\"-22,-75 -30,-70 -29,-78\"/>\n    </g>\n    \n    <!-- 중앙 라벨 -->\n    <text x=\"0\" y=\"-4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">vicious</text>\n    <text x=\"0\" y=\"8\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">cycle</text>\n    <text x=\"0\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">악순환</text>\n  </g>\n\n  <!-- 우측: 함정 박스 (mindset trap) -->\n  <g transform=\"translate(440, 30)\">\n    <text x=\"75\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">사고방식의 함정</text>\n    <rect x=\"0\" y=\"0\" width=\"150\" height=\"160\" fill=\"#fdf2f4\" fill-opacity=\"0.35\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    \n    <!-- 가둬진 사람 (격자 안) -->\n    <g transform=\"translate(75, 50)\">\n      <!-- 격자 (감옥 창살) -->\n      <rect x=\"-30\" y=\"-22\" width=\"60\" height=\"48\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <line x1=\"-20\" y1=\"-22\" x2=\"-20\" y2=\"26\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <line x1=\"-10\" y1=\"-22\" x2=\"-10\" y2=\"26\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"-22\" x2=\"0\" y2=\"26\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <line x1=\"10\" y1=\"-22\" x2=\"10\" y2=\"26\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <line x1=\"20\" y1=\"-22\" x2=\"20\" y2=\"26\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <!-- 안에 작은 사람 -->\n      <circle cx=\"0\" cy=\"-8\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"-3\" x2=\"0\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"2\" x2=\"-5\" y2=\"7\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"2\" x2=\"5\" y2=\"7\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"10\" x2=\"-4\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"10\" x2=\"4\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    </g>\n    \n    <!-- 사고방식 3축 라벨 -->\n    <g transform=\"translate(75, 95)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">technoscience</text>\n      <text x=\"0\" y=\"13\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">+ capital + state</text>\n    </g>\n    \n    <!-- 함정 결론 -->\n    <g transform=\"translate(75, 130)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">소비 감축 회피</text>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">cause = 'only solution'</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">tech is real but limited — the cause cannot also be the cure</text>\n</svg>","caption":"도식은 기술 만능 믿음이 새 문제를 낳고 소비 감축 필요를 가리는 악순환을 보여 준다."},{"no":"3","title":"Animal Welfare vs Animal Rights","ktitle":"동물 복지 vs 동물 권리","field":"윤리·법","page":"05강 Ex.03","oneline":"복지론: 인간이 가하는 고통에서 동물을 더 보호하라(법적 보호 강화).","tldr":["복지론: 인간이 가하는 고통에서 동물을 더 보호하라(법적 보호 강화).","권리론: 복지법은 ‘동물을 인간이 써도 된다’를 전제 — 충분치 않다.","문제는 ‘비인도적 대우’가 아니라 ‘동물을 인간 자원으로 보는 것’ 자체다."],"analogy":"‘일을 시키되 잘 대해 주자’(복지)와 ‘애초에 그렇게 부려선 안 된다’(권리)의 차이예요. 복지론은 대우 개선, 권리론은 ‘쓰는 것’ 자체를 문제 삼죠.","bg":"동물 보호법을 두고 ‘복지(고통 경감)’를 주장하는 쪽과 ‘권리(동물을 자원으로 쓰지 말 것)’를 주장하는 쪽의 근본적 차이를 정리한 글이에요.","flow":[{"kind":"배경","t":"오래된 동물 보호법(도살·실험 규제·잔혹 방지)"},{"kind":"쟁점","t":"이 법이 충분한가 — 복지 vs 권리"},{"kind":"복지론","t":"인간이 가하는 고통에서 ‘법적 보호 강화’"},{"kind":"권리론","t":"복지법은 ‘동물 사용’을 전제 → 불충분"},{"kind":"핵심","t":"문제 = 비인도적 대우 ✗ → ‘동물을 자원으로 봄’"}],"quiz":[["동물 ‘복지론’이 추구하는 것은?","도살·실험·식용 등에서 인간이 가하는 고통·결핍으로부터 동물을 더 보호하도록 법적 보호를 강화하는 거예요."],["권리론이 복지론을 ‘불충분’하다 보는 이유는?","복지법은 ‘동물을 식용·실험에 써도 된다’를 전제로 최악만 막을 뿐이라, 애초에 동물을 자원으로 쓰는 것 자체가 문제라고 보기 때문이에요."],["핵심 한 문장?","복지론은 동물 대우 개선을, 권리론은 ‘동물을 인간 자원으로 쓰는 것’ 자체의 부당함을 문제 삼는다."]],"vocab":[["legislation","법률·법령"],["regulate","규제하다"],["slaughter","도살·학살"],["experimentation","실험"],["cruelty","잔혹·잔혹 행위"],["adequate","적절한·충분한"],["debate","논쟁·토론"]],"en":"Many countries have had legislation to protect animals in place for decades, even for centuries. This legislation may regulate practices such as slaughter or experimentation, or may be more generally aimed at preventing cruelty. But whether this kind of legislation is adequate lies at the heart of a key debate between those who argue, in a legal context, for the promotion of animal welfare and those who argue for the promotion of animal rights. Those who argue for animal welfare seek increased legal protection for animals from human-inflicted pain and other kinds of suffering (for example, insufficient food and space). Animal rights advocates maintain that this welfare legislation does not go far enough. Welfare legislation accepts, they argue, that animals may be used by humans for food and as experimental subjects; it merely tries to curb the worst excesses of these practices. The problem, on the rights view, is more fundamental than this: animals are not the kinds of thing that humans should use in this way at all. The problem, therefore, is not one about treating animals inhumanely, but instead one about understanding them as human resources.","ko":"많은 국가에서 수십 년, 심지어 수 세기 동안 동물을 보호하기 위한 법률을 시행해 왔다. 이러한 법률은 도살이나 실험과 같은 행위를 규제할 수도 있고, 또는 더 일반적으로는 잔혹 행위를 방지하는 것을 목표로 할 수도 있다. 그러나 이러한 종류의 법률이 적절한지의 여부는 법적 맥락에서 동물 '복지' 증진에 찬성론을 펴는 사람들과 동물 '권리' 증진에 찬성론을 펴는 사람들 사이 주요 논쟁의 핵심에 놓여 있다. 동물 복지에 찬성론을 펴는 사람들은 인간이 가하는 고통과 다른 종류의 괴로움(예를 들어, 충분하지 못한 음식과 공간)으로부터 동물에 대한 강화된 법적 보호를 추구한다. 동물 권리 옹호자들은 이러한 복지 법률이 충분하지 않다고 주장한다. 그들의 주장에 따르면, 복지 법률은 동물이 인간에 의해 음식과 실험 대상으로 사용될 수도 있다는 것을 받아들이는데, 그 법률은 단지 이러한 관행의 가장 심한 잔혹 행위를 억제하려 할 뿐이라는 것이다. 권리의 관점에서 볼 때, 문제는 이보다 더 근본적인데, 즉 동물은 결코 인간이 이런 식으로 이용해서는 안되는 존재라는 것이다. 따라서 문제는 동물을 비인도적으로 대하는 것에 대한 것이 아니라, 대신에 동물을 인간의 자원으로 이해하는 것에 관한 것이다.","read":[{"en":"Many countries have had legislation to protect animals in place for decades, even for centuries.","ko":"많은 국가에서 수십 년, 심지어 수 세기 동안 동물을 보호하기 위한 법률을 시행해 왔다.","chunks":[["Many countries have had legislation","많은 국가에서 법률을 시행해 왔다"],["to protect animals","동물을 보호하기 위해"],["in place","제자리에·시행 중인 상태로"],["for decades, even for centuries.","수십 년, 심지어 수 세기 동안."]]},{"en":"This legislation may regulate practices such as slaughter or experimentation, or may be more generally aimed at preventing cruelty.","ko":"이러한 법률은 도살이나 실험과 같은 행위를 규제할 수도 있고, 또는 더 일반적으로는 잔혹 행위를 방지하는 것을 목표로 할 수도 있다.","chunks":[["This legislation may regulate practices","이 법률은 행위를 규제할 수도 있다"],["such as slaughter or experimentation,","도살이나 실험과 같은,"],["or may be more generally aimed at","또는 더 일반적으로 ~을 목표로 할 수도 있다"],["preventing cruelty.","잔혹 행위를 방지하는 것."]]},{"en":"But whether this kind of legislation is adequate lies at the heart of a key debate between those who argue, in a legal context, for the promotion of animal welfare and those who argue for the promotion of animal rights.","ko":"그러나 이러한 종류의 법률이 적절한지의 여부는 법적 맥락에서 동물 '복지' 증진에 찬성론을 펴는 사람들과 동물 '권리' 증진에 찬성론을 펴는 사람들 사이 주요 논쟁의 핵심에 놓여 있다.","chunks":[["But whether this kind of legislation is adequate","그러나 이러한 종류의 법률이 적절한지의 여부는"],["lies at the heart of a key debate","주요 논쟁의 핵심에 놓여 있다"],["between those who argue, in a legal context,","~ 사람들 사이의, 법적 맥락에서, 찬성론을 펴는"],["for the promotion of animal welfare","동물 복지의 증진에 대한"],["and those who argue","그리고 찬성론을 펴는 사람들"],["for the promotion of animal rights.","동물 권리의 증진에 대한."]]},{"en":"Those who argue for animal welfare seek increased legal protection for animals from human-inflicted pain and other kinds of suffering (for example, insufficient food and space).","ko":"동물 복지에 찬성론을 펴는 사람들은 인간이 가하는 고통과 다른 종류의 괴로움(예를 들어, 충분하지 못한 음식과 공간)으로부터 동물에 대한 강화된 법적 보호를 추구한다.","chunks":[["Those who argue for animal welfare","동물 복지에 찬성론을 펴는 사람들은"],["seek increased legal protection","강화된 법적 보호를 추구한다"],["for animals from human-inflicted pain","인간이 가하는 고통으로부터 동물에 대한"],["and other kinds of suffering","그리고 다른 종류의 괴로움"],["(for example, insufficient food and space).","(예: 충분하지 못한 음식과 공간)."]]},{"en":"Animal rights advocates maintain that this welfare legislation does not go far enough.","ko":"동물 권리 옹호자들은 이러한 복지 법률이 충분하지 않다고 주장한다.","chunks":[["Animal rights advocates","동물 권리 옹호자들은"],["maintain that","~라고 주장한다"],["this welfare legislation","이러한 복지 법률이"],["does not go far enough.","충분하지 않다는 것을."]]},{"en":"Welfare legislation accepts, they argue, that animals may be used by humans for food and as experimental subjects; it merely tries to curb the worst excesses of these practices.","ko":"그들의 주장에 따르면, 복지 법률은 동물이 인간에 의해 음식과 실험 대상으로 사용될 수도 있다는 것을 받아들이는데, 그 법률은 단지 이러한 관행의 가장 심한 잔혹 행위를 억제하려 할 뿐이라는 것이다.","chunks":[["Welfare legislation accepts,","복지 법률은 받아들인다,"],["they argue,","그들의 주장에 따르면,"],["that animals may be used by humans","동물이 인간에 의해 사용될 수도 있다는 것을"],["for food and as experimental subjects;","음식 용도로 그리고 실험 대상으로;"],["it merely tries to curb","그것은 단지 ~을 억제하려 할 뿐이다"],["the worst excesses of these practices.","이러한 관행의 가장 심한 잔혹 행위를."]]},{"en":"The problem, on the rights view, is more fundamental than this: animals are not the kinds of thing that humans should use in this way at all.","ko":"권리의 관점에서 볼 때, 문제는 이보다 더 근본적인데, 즉 동물은 결코 인간이 이런 식으로 이용해서는 안되는 존재라는 것이다.","chunks":[["The problem, on the rights view,","문제는, 권리의 관점에서,"],["is more fundamental than this:","이보다 더 근본적이다:"],["animals are not the kinds of thing","동물은 ~한 종류의 것이 아니다"],["that humans should use in this way","인간이 이런 식으로 사용해야 할"],["at all.","결코."]]},{"en":"The problem, therefore, is not one about treating animals inhumanely, but instead one about understanding them as human resources.","ko":"따라서 문제는 동물을 비인도적으로 대하는 것에 대한 것이 아니라, 대신에 동물을 인간의 자원으로 이해하는 것에 관한 것이다.","chunks":[["The problem, therefore, is","따라서 문제는"],["not one about treating animals inhumanely,","동물을 비인도적으로 대하는 것에 대한 것이 아니라,"],["but instead one about understanding them","대신에 그들을 이해하는 것에 관한 것이다"],["as human resources.","인간의 자원으로."]]}],"metaphor":"<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 복지론 박스에 동물 사용 인정 + 최악만 억제하는 그림과, 오른쪽 권리론 박스에 동물 사용 자체를 거부하는 그림이 대조되어 있으며, 가운데 vs 라벨과 하단에 진짜 쟁점인 framing 박스(동물을 인간 자원으로 이해)가 배치된 그림\">\n  <!-- 좌측: 복지론 -->\n  <g transform=\"translate(15, 25)\">\n    <text x=\"130\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">Welfare · 복지론</text>\n    <rect x=\"0\" y=\"0\" width=\"260\" height=\"155\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.4\"/>\n    \n    <!-- 인간 사용 인정 -->\n    <g transform=\"translate(60, 50)\">\n      <!-- 사람 -->\n      <circle cx=\"0\" cy=\"-8\" r=\"9\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"-3\" cy=\"-9\" r=\"1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-9\" r=\"1\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 -5 Q 0 -3 3 -5\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"1\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"9\" x2=\"-9\" y2=\"14\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"9\" x2=\"15\" y2=\"12\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"-6\" \" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">이용 자체 거부 · welfare law 불충분</text>\n    </g>\n  </g>\n\n  <!-- 하단: 진짜 쟁점 = framing -->\n  <g transform=\"translate(60, 200)\">\n    <rect x=\"0\" y=\"0\" width=\"480\" height=\"55\" fill=\"#1a1a1a\" fill-opacity=\"0.04\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <text x=\"240\" y=\"18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">the real issue — not inhumane treatment but <tspan fill=\"#c8102e\">FRAMING</tspan></text>\n    <text x=\"240\" y=\"36\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">animals understood as <tspan fill=\"#c8102e\" font-weight=\"700\">\"human resources\"</tspan></text>\n    <text x=\"240\" y=\"50\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">동물을 인간의 자원으로 이해하는 틀 자체가 문제</text>\n  </g>\n</svg>","caption":"좌:복지론(use OK, curb worst) vs 우:권리론(don't use at all) + 하단 framing 박스"},{"no":"4","title":"Personal Bonds in Ancient Greek Education","ktitle":"고대 그리스 교육 — 사제 간 ‘인간적 유대’","field":"교육·역사","page":"05강 Ex.04","oneline":"고대 그리스 교육은 ‘교사-학생의 인격적 관계’ 속에서 이뤄졌다.","tldr":["고대 그리스 교육은 ‘교사-학생의 인격적 관계’ 속에서 이뤄졌다.","사제 간의 깊고 사적인 유대가 ‘필수’로 여겨졌다.","배움의 많은 부분이 글이 아니라 ‘대면 구술 관계’를 통해 일어났다."],"analogy":"교과서로 혼자 배우는 게 아니라, 스승과 직접 부대끼며 묻고 답하는 ‘관계’ 속에서 배웠어요. 그 깊은 인간적 유대가 배움의 핵심이었죠.","bg":"고대 그리스 교육이 교재가 아니라 ‘교사-학생의 깊은 인격적 유대와 구술 대화’를 통해 이뤄졌음을(플라톤의 아카데미 등) 설명한 글이에요.","flow":[{"kind":"맥락","t":"교육 = 교사-학생의 ‘인격적 관계’ 속에서"},{"kind":"방식","t":"가정 방문 개인지도 / 학습 공동체(플라톤 아카데미)"},{"kind":"핵심","t":"깊고 사적인 사제 유대가 ‘필수’ (감정·열정도 작용)"},{"kind":"결론","t":"배움은 글보다 ‘대면 구술 관계’로 일어남"}],"quiz":[["고대 그리스 교육에서 ‘필수’로 여겨진 것은?","교사와 학생 사이의 깊고 절대적으로 사적인 인격적 유대예요."],["배움은 주로 무엇을 통해 일어났나?","글(written materials)보다 사제 간의 ‘대면 구술 관계’를 통해 일어났어요."],["핵심 한 문장?","고대 그리스 교육은 교재가 아니라 사제 간의 깊은 인격적 유대와 구술 대화를 통해 이루어졌다."]],"vocab":[["consistently","일관되게·지속적으로"],["context","맥락·상황"],["personal relations","개인적 관계"],["tutor","개인 교사·가정 교사"],["community","공동체·지역사회"],["approach","접근법·방식"],["descendent","후대의·후속의"]],"en":"In ancient Greece, education consistently occurred in the context of the personal relations among teachers and students. Most often, it involved a tutor who traveled to homes or other community locations where they worked with individuals or small groups of students. Additionally, collecting teachers and students into learning communities was another approach to creating a social learning context, such as Plato's Academy and its descendent organizations. It is important to note that a close relationship between student and teacher was consistently seen as essential: \"advanced education involved a deep and absolutely personal bond between teacher and pupil, a bond in which ... emotion, if not passion, played a considerable part.\" Indeed, Plato, in the Dialogues, supported the active engagement of students in learning. Much of what was learned occurred through these interpersonal oral relationships rather than through written materials.","ko":"고대 그리스에서 교육은 일관되게 교사와 학생 간의 개인적 관계의 상황에서 이루어졌다. 아주 많은 경우, 교육은 가정이나 다른 공동체의 지역으로 이동하는 개인 교사를 필요로 하였는데, 거기서 개인 교사들은 개인이나 작은 집단의 학생들과 함께 공부했다. 아울러 교사와 학생을 학습 공동체로 모으는 것은 플라톤의 아카데미와 그 후대의 조직과 같은 사회적 학습 환경을 만드는 또 다른 접근법이었다. 학생과 교사 사이의 긴밀한 관계가 지속적으로 필수적인 것으로 여겨졌다는 점에 주목하는 것이 중요한데, \"고등 교육은 교사와 학생 사이의 깊고 절대적으로 개인적인 유대, 곧 ... 열정은 아니라 해도 감정이 상당한 역할을 한 유대를 포함했다.\" 실제로 플라톤은 Dialogues에서 학생들이 학습에 적극적으로 참여하는 것을 지지했다. 학습되는 것 중 많은 부분이 글로 쓰인 자료를 통해서라기보다는 이러한 사람과 사람 사이의 구술적인 관계를 통해 생겨났다.","read":[{"en":"In ancient Greece, education consistently occurred in the context of the personal relations among teachers and students.","ko":"고대 그리스에서 교육은 일관되게 교사와 학생 간의 개인적 관계의 상황에서 이루어졌다.","chunks":[["In ancient Greece,","고대 그리스에서,"],["education consistently occurred","교육은 일관되게 이루어졌다"],["in the context of the personal relations","개인적 관계의 맥락에서"],["among teachers and students.","교사와 학생 간의."]]},{"en":"Most often, it involved a tutor who traveled to homes or other community locations where they worked with individuals or small groups of students.","ko":"아주 많은 경우, 교육은 가정이나 다른 공동체의 지역으로 이동하는 개인 교사를 필요로 하였는데, 거기서 개인 교사들은 개인이나 작은 집단의 학생들과 함께 공부했다.","chunks":[["Most often,","아주 많은 경우,"],["it involved a tutor","그것은 개인 교사를 필요로 하였다"],["who traveled to homes or other community locations","가정이나 다른 공동체의 지역으로 이동하는"],["where they worked with individuals or small groups of students.","거기서 그들은 개인이나 작은 집단의 학생들과 함께 공부했다."]]},{"en":"Additionally, collecting teachers and students into learning communities was another approach to creating a social learning context, such as Plato's Academy and its descendent organizations.","ko":"아울러 교사와 학생을 학습 공동체로 모으는 것은 플라톤의 아카데미와 그 후대의 조직과 같은 사회적 학습 환경을 만드는 또 다른 접근법이었다.","chunks":[["Additionally,","게다가,"],["collecting teachers and students into learning communities","교사와 학생을 학습 공동체로 모으는 것은"],["was another approach","또 다른 접근법이었다"],["to creating a social learning context,","사회적 학습 맥락을 만드는 것에 대한,"],["such as Plato's Academy and its descendent organizations.","플라톤의 아카데미와 그 후대의 조직과 같은."]]},{"en":"It is important to note that a close relationship between student and teacher was consistently seen as essential: \"advanced education involved a deep and absolutely personal bond between teacher and pupil, a bond in which ... emotion, if not passion, played a considerable part.\"","ko":"학생과 교사 사이의 긴밀한 관계가 지속적으로 필수적인 것으로 여겨졌다는 점에 주목하는 것이 중요한데, \"고등 교육은 교사와 학생 사이의 깊고 절대적으로 개인적인 유대, 곧 ... 열정은 아니라 해도 감정이 상당한 역할을 한 유대를 포함했다.\"","chunks":[["It is important to note that","~을 주목하는 것이 중요하다"],["a close relationship between student and teacher","학생과 교사 사이의 긴밀한 관계가"],["was consistently seen as essential:","지속적으로 필수적인 것으로 여겨졌다는 점:"],["\"advanced education involved","\"고등 교육은 ~을 포함했다"],["a deep and absolutely personal bond","깊고 절대적으로 개인적인 유대를"],["between teacher and pupil,","교사와 학생 사이의,"],["a bond in which ... emotion, if not passion,","유대, 곧 ... 감정이, 열정은 아니라 해도,"],["played a considerable part.\"","상당한 역할을 한.\""]]},{"en":"Indeed, Plato, in the Dialogues, supported the active engagement of students in learning.","ko":"실제로 플라톤은 Dialogues에서 학생들이 학습에 적극적으로 참여하는 것을 지지했다.","chunks":[["Indeed,","실제로,"],["Plato, in the Dialogues,","플라톤은, Dialogues에서,"],["supported the active engagement of students","학생들의 적극적인 참여를 지지했다"],["in learning.","학습에서의."]]},{"en":"Much of what was learned occurred through these interpersonal oral relationships rather than through written materials.","ko":"학습되는 것 중 많은 부분이 글로 쓰인 자료를 통해서라기보다는 이러한 사람과 사람 사이의 구술적인 관계를 통해 생겨났다.","chunks":[["Much of what was learned","학습되는 것 중 많은 부분이"],["occurred through these interpersonal oral relationships","이러한 사람과 사람 사이의 구술적 관계를 통해 일어났다"],["rather than through written materials.","글로 쓰인 자료를 통해서라기보다는."]]}],"metaphor":"<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에 순회 개인 교사가 여러 집을 이동하며 1대1로 가르치는 그림과, 오른쪽에 플라톤의 아카데미 같은 학습 공동체에서 한 교사가 여러 학생과 원형 모임을 갖는 그림이 대조되어 있고, 하단에 두 형태가 공유하는 공통 핵심 — 개인적 유대 · 구술적 관계 — 박스가 배치되며, 글로 쓰인 자료는 흐릿하게 옆에 배치된 그림\">\n  <!-- 좌측: 순회 개인 교사 -->\n  <g transform=\"translate(15, 25)\">\n    <text x=\"130\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">형태 ① 순회 개인 교사 — Traveling Tutor</text>\n    <rect x=\"0\" y=\"0\" width=\"260\" height=\"150\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.4\"/>\n    \n    <!-- 집 1 (좌) -->\n    <g transform=\"translate(35, 80)\">\n      <polygon points=\"-18,0 0,-15 18,0\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <rect x=\"-18\" y=\"0\" width=\"36\" height=\"22\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <rect x=\"-4\" y=\"8\" width=\"8\" height=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <text x=\"0\" y=\"35\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">home A</text>\n    </g>\n    \n    <!-- 집 th=\"0.8\" stroke-dasharray=\"1 1\"/>\n    <line x1=\"4\" y1=\"20\" x2=\"26\" y2=\"20\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"1 1\"/>\n    <line x1=\"4\" y1=\"26\" x2=\"26\" y2=\"26\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"1 1\"/>\n  </g>\n</svg>","caption":"좌:순회 교사(집→집·1대1) / 우:학습 공동체(Academy) + 공통 핵심 박스"},{"no":"5","title":"The Search for Approval","ktitle":"인정 욕구 — 어린 시절 패턴의 연장","field":"심리","page":"05강 Ex.05","oneline":"아이는 사랑을 확보하려 양육자의 ‘인정’을 구한다.","tldr":["아이는 사랑을 확보하려 양육자의 ‘인정’을 구한다.","이 욕구는 성인기까지 이어지지만, 자기 확신이 없으면 ‘과도한 인정 욕구’가 된다.","뿌리엔 ‘사랑이 거둬질까’ 하는 두려움 — 어린 시절 패턴의 연장이다."],"analogy":"어릴 때 ‘잘했지?’ 하고 부모 눈치를 보던 게, 어른이 돼서도 남의 인정에 매달리는 모습으로 이어져요. ‘인정 못 받으면 사랑도 사라질까’ 하는 두려움이 바탕이죠.","bg":"사랑을 확보하려는 아동기 ‘인정 욕구’가 성인기까지 이어지며, 자기 확신이 부족하면 과도해지는 — 그 뿌리가 어린 시절 패턴임을 설명한 심리 글이에요.","flow":[{"kind":"기원","t":"아동기 — 사랑 확보 위해 양육자 ‘인정’을 구함"},{"kind":"지속","t":"성인기에도 타인(특히 사랑·존경하는 이)의 인정 필요"},{"kind":"왜곡","t":"자기 확신 부족 시 → ‘과도한 인정 욕구’"},{"kind":"두려움","t":"‘사랑이 거둬져 무력해질까’ 하는 두려움"},{"kind":"뿌리","t":"어린 시절 ‘무조건적 사랑 부족’ 패턴의 연장"}],"quiz":[["인정 욕구가 ‘건강하지 않게’ 변하는 경우는?","자신의 독립성·권리·효능감에 확신이 없을 때, 인정 욕구가 과도해져요."],["과도한 인정 욕구의 ‘뿌리’는?","어린 시절 부모에게서 무조건적 사랑·인정을 충분히 못 받았다고 느끼며 생긴 패턴의 연장이에요."],["핵심 한 문장?","인정 욕구는 사랑을 확보하려는 아동기 패턴의 연장이며, 자기 확신이 없으면 과도해진다."]],"vocab":[["approval","인정·승인"],["challenge","어려움·도전"],["formative","형성기의·발달기의"],["caretaker","양육자·돌보는 사람"],["secure","확보하다·보장하다"],["persist","지속되다·계속되다"],["adulthood","성인기·성인 시절"]],"en":"The search for approval has its own challenges. In the formative period of childhood the child seeks the approval of its caretakers as a means of securing their love. This persists into adulthood where there is a general need for the approval of others, especially loved ones, or those who are admired or looked up to because they have particular qualities or skills. But this can turn into an unhealthy, excessive need for approval if the individual is uncertain about his or her own independence, rights, responsibilities and effectiveness (the ability to influence things). The constant searching for approval is based on the fear that the other's love will be withdrawn and that you will be left helpless and unloved. This, of course, is an extension of a childhood pattern whereby the individual feels that he or she never received enough (unconditional) approval or love from her or his parents. As a result they learn to feel unworthy and that they don't have the right to expect unconditional love and approval.","ko":"인정을 구하는 일은 그 나름의 어려움이 있다. 어린 시절의 형성기에 아이는 양육자의 사랑을 확보하기 위한 수단으로 그들의 인정을 구한다. 이는 다른 사람, 특히 사랑하는 사람이나 특별한 자질이나 기술을 가지고 있어 존경하거나 우러러보는 사람의 인정을 받고자 하는 일반적인 욕구가 있는 성인기까지 지속된다. 그러나 만약 개인이 자신의 독립성, 권리, 책임, 효능감(상황에 영향을 미칠 수 있는 능력)에 대해 확신하지 못한다면, 이것은 인정에 대한 불건전하고 지나친 욕구로 변할 수 있다. 끊임없는 인정 추구는 상대방의 사랑이 철회될 것이라는 두려움, 그리고 자신이 무력하고 사랑받지 못한 채로 남겨질 것이라는 두려움에 근거한다. 물론 이것은 개인이 자신의 부모로부터 충분한 (무조건적인) 인정이나 사랑을 결코 받지 못했다고 느끼는 아동기 패턴의 연장이다. 결과적으로 그들은 무가치하다고 느끼는 것을, 그리고 자신은 무조건적인 사랑과 인정을 기대할 권리가 없다는 것을 배운다.","read":[{"en":"The search for approval has its own challenges.","ko":"인정을 구하는 일은 그 나름의 어려움이 있다.","chunks":[["The search for approval","인정을 구하는 일은"],["has its own challenges.","그 나름의 어려움이 있다."]]},{"en":"In the formative period of childhood the child seeks the approval of its caretakers as a means of securing their love.","ko":"어린 시절의 형성기에 아이는 양육자의 사랑을 확보하기 위한 수단으로 그들의 인정을 구한다.","chunks":[["In the formative period of childhood","어린 시절의 형성기에"],["the child seeks the approval of its caretakers","아이는 양육자의 인정을 구한다"],["as a means of securing their love.","그들의 사랑을 확보하기 위한 수단으로."]]},{"en":"This persists into adulthood where there is a general need for the approval of others, especially loved ones, or those who are admired or looked up to because they have particular qualities or skills.","ko":"이는 다른 사람, 특히 사랑하는 사람이나 특별한 자질이나 기술을 가지고 있어 존경하거나 우러러보는 사람의 인정을 받고자 하는 일반적인 욕구가 있는 성인기까지 지속된다.","chunks":[["This persists into adulthood","이는 성인기까지 지속된다"],["where there is a general need","거기에는 일반적인 욕구가 있다"],["for the approval of others,","다른 사람들의 인정에 대한,"],["especially loved ones,","특히 사랑하는 사람들,"],["or those who are admired or looked up to","또는 존경받거나 우러러보이는 사람들"],["because they have particular qualities or skills.","그들이 특별한 자질이나 기술을 가지고 있기 때문에."]]},{"en":"But this can turn into an unhealthy, excessive need for approval if the individual is uncertain about his or her own independence, rights, responsibilities and effectiveness (the ability to influence things).","ko":"그러나 만약 개인이 자신의 독립성, 권리, 책임, 효능감(상황에 영향을 미칠 수 있는 능력)에 대해 확신하지 못한다면, 이것은 인정에 대한 불건전하고 지나친 욕구로 변할 수 있다.","chunks":[["But this can turn into","그러나 이것은 ~로 변할 수 있다"],["an unhealthy, excessive need for approval","인정에 대한 불건전하고 지나친 욕구로"],["if the individual is uncertain about","만약 개인이 ~에 대해 확신하지 못한다면"],["his or her own independence, rights, responsibilities and effectiveness","자신의 독립성, 권리, 책임, 효능감에 대해"],["(the ability to influence things).","(상황에 영향을 미칠 수 있는 능력)."]]},{"en":"The constant searching for approval is based on the fear that the other's love will be withdrawn and that you will be left helpless and unloved.","ko":"끊임없는 인정 추구는 상대방의 사랑이 철회될 것이라는 두려움, 그리고 자신이 무력하고 사랑받지 못한 채로 남겨질 것이라는 두려움에 근거한다.","chunks":[["The constant searching for approval","끊임없는 인정 추구는"],["is based on the fear that","~ 두려움에 근거한다"],["the other's love will be withdrawn","상대방의 사랑이 철회될 것이라는"],["and that you will be left","그리고 당신이 ~ 채로 남겨질 것이라는"],["helpless and unloved.","무력하고 사랑받지 못한."]]},{"en":"This, of course, is an extension of a childhood pattern whereby the individual feels that he or she never received enough (unconditional) approval or love from her or his parents.","ko":"물론 이것은 개인이 자신의 부모로부터 충분한 (무조건적인) 인정이나 사랑을 결코 받지 못했다고 느끼는 아동기 패턴의 연장이다.","chunks":[["This, of course, is an extension","물론 이것은 연장이다"],["of a childhood pattern","아동기 패턴의"],["whereby the individual feels that","그것에 의해 개인이 ~을 느끼는"],["he or she never received enough (unconditional) approval or love","그가 충분한 (무조건적인) 인정이나 사랑을 결코 받지 못했다는 것을"],["from her or his parents.","자신의 부모로부터."]]},{"en":"As a result they learn to feel unworthy and that they don't have the right to expect unconditional love and approval.","ko":"결과적으로 그들은 무가치하다고 느끼는 것을, 그리고 자신은 무조건적인 사랑과 인정을 기대할 권리가 없다는 것을 배운다.","chunks":[["As a result","결과적으로"],["they learn to feel unworthy","그들은 무가치하다고 느끼는 것을 배운다"],["and that they don't have the right","그리고 권리가 없다는 것을"],["to expect unconditional love and approval.","무조건적인 사랑과 인정을 기대할."]]}],"metaphor":"<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에 어린이가 양육자에게 인정·사랑을 구하는 그림, 가운데에 성인기로 지속되는 인정 추구가 자기 불확실 조건에서 빨강 불건전 욕구로 갈라지는 그림, 오른쪽에 학습된 자기관 사고 풍선 '나는 무가치하다'와 사랑 철회 두려움이 표시된 그림 - 어린 시절에서 성인기까지의 발달 흐름\">\n  <!-- 시간 축 (하단) -->\n  <line x1=\"20\" y1=\"220\" x2=\"580\" y2=\"220\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/>\n  <polygon points=\"580,220 572,216 572,224\" fill=\"#999\"/>\n  <text x=\"585\" y=\"223\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#5e5e5e\">time</text>\n\n  <!-- 좌측: 어린 시절 -->\n  <g transform=\"translate(20, 25)\">\n    <text x=\"80\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">어린 시절 — Formative</text>\n    \n    <!-- 양육자 (큰 stick) -->\n    <g transform=\"translate(40, 70)\">\n      <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-3\" cy=\"-1\" r=\"1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-1\" r=\"1\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 4 Q 0 6 3 4\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"11\" x2=\"0\" y2=\"45\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"-10\" y2=\"32\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"10\" y2=\"32\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"45\" x2=\"-7\" y2=\"65\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/> t x=\"0\" y=\"10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">no right to expect</text>\n      <text x=\"0\" y=\"21\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">unconditional love</text>\n    </g>\n    \n    <!-- 두 두려움 라벨 (하단) -->\n    <g transform=\"translate(15, 122)\">\n      <rect x=\"0\" y=\"0\" width=\"180\" height=\"42\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.1\" stroke-dasharray=\"3 2\"/>\n      <text x=\"90\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">FEAR · 두 두려움</text>\n      <text x=\"90\" y=\"27\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">love withdrawn · helpless &amp; unloved</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">a childhood pattern extended — learning to feel unworthy</text>\n</svg>","caption":"어린 시절 사랑 확보 수단 → 성인기 지속 + 자기 불확실 → 불건전 욕구로 변질 → 학습된 자기관"},{"no":"6","title":"Hull's Motivation Principle and Modern Goal Pursuit","ktitle":"목표가 가까울수록 더 힘낸다 (Hull의 원리)","field":"심리·동기","page":"05강 Ex.06","oneline":"Hull: 목표 달성이 가까워질수록 쏟는 노력이 커진다(목표 기울기).","tldr":["Hull: 목표 달성이 가까워질수록 쏟는 노력이 커진다(목표 기울기).","미로 속 쥐가 먹이에 가까울수록 빨라진 관찰에서 나왔다.","인간도 같다 — 적립카드 막판 구매 가속, 운동·경기 ‘마지막 한 번’."],"analogy":"커피 10잔 쿠폰이 9칸 차면 마지막 한 잔을 더 자주 사러 가게 되죠. 결승선이 보이면 더 힘이 나는 ‘목표 기울기’ 효과예요.","bg":"‘목표가 가까울수록 노력이 커진다’는 Hull의 동기 원리(목표 기울기)를, 쥐 실험부터 적립카드·운동·스포츠의 ‘마지막 한 번’까지로 설명한 글이에요.","flow":[{"kind":"원리","t":"Hull — 목표 달성이 가까울수록 노력↑"},{"kind":"근거","t":"미로 쥐: 먹이에 가까울수록 속도↑"},{"kind":"적용 ①","t":"적립카드 ‘10번째 무료’ 막판 구매 가속"},{"kind":"적용 ②","t":"운동·경기 ‘마지막 한 번’의 힘"},{"kind":"결론","t":"목표 기울기는 인간 동기의 핵심 원리"}],"quiz":[["Hull의 동기 원리(목표 기울기)란?","목표 달성이 가까워질수록 그에 쏟는 노력이 커진다는 거예요(미로 쥐가 먹이에 가까울수록 빨라지듯)."],["인간에게서 보이는 예는?","적립카드 막판 구매 가속, 운동 루틴 끝의 추가 노력, 경기 막판의 ‘마지막 한 번’이에요."],["핵심 한 문장?","목표가 가까울수록 더 큰 노력을 쏟는 ‘목표 기울기’는 쥐부터 인간까지 나타나는 동기 원리다."]],"vocab":[["motivation","동기 부여·동기"],["extensive","광범위한·폭넓은"],["observe","관찰하다·발견하다"],["effort","노력"],["invest","투입하다·투자하다"],["accomplish","달성하다·성취하다"],["attainment","달성·성취"]],"en":"Motivation has an extensive history in academic research. Some of the earliest work on this topic was by Clark Hull, who observed that effort invested in accomplishing a goal increases as goal attainment becomes more likely. Although this conclusion was drawn by observing rats running a maze to achieve a food reward ─ with speed increasing as distance to the food decreased ─ it is nevertheless useful in seeking to explain goal pursuit in humans. Indeed, much of the modern work on motivation has built on this foundation to understand what promotes goal pursuit and achievement. For example, mirroring Hull's rats, consumers have been shown to accelerate coffee purchases as they approach the end of a '10th free' loyalty card. In the sports context, athletes are often observed to give 'one last push' as they complete a given event, and this is also often a feature both of others' efforts to motivate them despite their fatigue, and of their own self-talk. This method of motivation can also be seen when a person puts in extra effort as they reach the end of a given exercise routine. Given the centrality of motivation to success in most life domains, this topic has fascinated scholars in a range of disciplines in the social sciences, including economics and psychology.","ko":"동기 부여는 학문적 연구에서 광범위한 역사를 가지고 있다. 이 주제에 대한 가장 초기의 연구 중 일부는 Clark Hull에 의한 것인데, 그는 목표 도달 가능성이 더 높아질수록 목표 달성에 투입되는 노력이 증가한다는 것을 관찰했다. 비록 이 결론은 쥐들이 먹이 보상을 얻기 위해 미로를 달리면서 먹이까지의 거리가 감소함에 따라 속도가 증가하는 것을 관찰함으로써 도출되었지만, 그럼에도 불구하고 그것은 인간의 목표 추구에 대한 설명을 하려고 할 때 유용하다. 실제로 동기 부여에 관한 현대의 연구의 많은 부분이 목표 추구와 성취를 촉진하는 것이 무엇인지 이해하기 위해 이 토대를 기반으로 해 왔다. 예컨대 Hull의 실험 쥐와 유사하게, 소비자들은 '10번째 무료' 고객 카드의 마지막이 다가올수록 커피 구매를 가속화하는 것으로 나타났다. 스포츠의 상황에서도, 운동선수들이 주어진 해당 경기를 마칠 때 '마지막 전력투구'를 가하는 모습이 자주 관찰되는데, 이것은 또한 많은 경우 그 선수들의 피로에도 불구하고 그들에게 의욕을 갖게 하려는 다른 사람들의 노력과 선수 자신의 자기 대화 둘 다의 특징이다. 이러한 동기 부여 방식은 또한 어떤 사람이 특정한 운동 루틴의 마지막에 도달하면서 추가 노력을 기울일 때에도 볼 수 있다. 대부분의 삶의 영역에서 성공에 대한 동기 부여의 중심적 역할을 고려할 때, 이 주제는 경제학과 심리학을 포함하여 사회과학의 다양한 분야에서 학자들을 매료시켰다.","read":[{"en":"Motivation has an extensive history in academic research.","ko":"동기 부여는 학문적 연구에서 광범위한 역사를 가지고 있다.","chunks":[["Motivation","동기 부여는"],["has an extensive history","광범위한 역사를 가지고 있다"],["in academic research.","학문적 연구에서."]]},{"en":"Some of the earliest work on this topic was by Clark Hull, who observed that effort invested in accomplishing a goal increases as goal attainment becomes more likely.","ko":"이 주제에 대한 가장 초기의 연구 중 일부는 Clark Hull에 의한 것인데, 그는 목표 도달 가능성이 더 높아질수록 목표 달성에 투입되는 노력이 증가한다는 것을 관찰했다.","chunks":[["Some of the earliest work on this topic","이 주제에 대한 가장 초기의 연구 중 일부는"],["was by Clark Hull,","Clark Hull에 의한 것이었다,"],["who observed that","그는 ~을 관찰했다"],["effort invested in accomplishing a goal","목표 달성에 투입되는 노력이"],["increases","증가한다는 것을"],["as goal attainment becomes more likely.","목표 도달 가능성이 더 높아질수록."]]},{"en":"Although this conclusion was drawn by observing rats running a maze to achieve a food reward ─ with speed increasing as distance to the food decreased ─ it is nevertheless useful in seeking to explain goal pursuit in humans.","ko":"비록 이 결론은 쥐들이 먹이 보상을 얻기 위해 미로를 달리면서 먹이까지의 거리가 감소함에 따라 속도가 증가하는 것을 관찰함으로써 도출되었지만, 그럼에도 불구하고 그것은 인간의 목표 추구에 대한 설명을 하려고 할 때 유용하다.","chunks":[["Although this conclusion was drawn","비록 이 결론은 도출되었지만"],["by observing rats running a maze","쥐들이 미로를 달리는 것을 관찰함으로써"],["to achieve a food reward","먹이 보상을 얻기 위해"],["─ with speed increasing as distance to the food decreased ─","─ 먹이까지의 거리가 감소함에 따라 속도가 증가하면서 ─"],["it is nevertheless useful","그것은 그럼에도 불구하고 유용하다"],["in seeking to explain goal pursuit in humans.","인간의 목표 추구를 설명하려고 시도하는 데에."]]},{"en":"Indeed, much of the modern work on motivation has built on this foundation to understand what promotes goal pursuit and achievement.","ko":"실제로 동기 부여에 관한 현대의 연구의 많은 부분이 목표 추구와 성취를 촉진하는 것이 무엇인지 이해하기 위해 이 토대를 기반으로 해 왔다.","chunks":[["Indeed,","실제로,"],["much of the modern work on motivation","동기 부여에 관한 현대 연구의 많은 부분이"],["has built on this foundation","이 토대를 기반으로 해 왔다"],["to understand what promotes","~을 촉진하는 것이 무엇인지 이해하기 위해"],["goal pursuit and achievement.","목표 추구와 성취를."]]},{"en":"For example, mirroring Hull's rats, consumers have been shown to accelerate coffee purchases as they approach the end of a '10th free' loyalty card.","ko":"예컨대 Hull의 실험 쥐와 유사하게, 소비자들은 '10번째 무료' 고객 카드의 마지막이 다가올수록 커피 구매를 가속화하는 것으로 나타났다.","chunks":[["For example,","예를 들어,"],["mirroring Hull's rats,","Hull의 실험 쥐와 유사하게,"],["consumers have been shown","소비자들은 ~한 것으로 나타났다"],["to accelerate coffee purchases","커피 구매를 가속화하는"],["as they approach the end of a '10th free' loyalty card.","'10번째 무료' 적립 카드의 마지막이 다가올수록."]]},{"en":"In the sports context, athletes are often observed to give 'one last push' as they complete a given event, and this is also often a feature both of others' efforts to motivate them despite their fatigue, and of their own self-talk.","ko":"스포츠의 상황에서도, 운동선수들이 주어진 해당 경기를 마칠 때 '마지막 전력투구'를 가하는 모습이 자주 관찰되는데, 이것은 또한 많은 경우 그 선수들의 피로에도 불구하고 그들에게 의욕을 갖게 하려는 다른 사람들의 노력과 선수 자신의 자기 대화 둘 다의 특징이다.","chunks":[["In the sports context,","스포츠의 상황에서,"],["athletes are often observed","운동선수들은 자주 관찰된다"],["to give 'one last push'","'마지막 전력투구'를 가하는"],["as they complete a given event,","주어진 경기를 마칠 때,"],["and this is also often a feature","그리고 이것은 또한 흔히 특징이다"],["both of others' efforts to motivate them despite their fatigue,","그들의 피로에도 불구하고 그들에게 의욕을 갖게 하려는 다른 사람들의 노력의,"],["and of their own self-talk.","그리고 그들 자신의 자기 대화의."]]},{"en":"This method of motivation can also be seen when a person puts in extra effort as they reach the end of a given exercise routine.","ko":"이러한 동기 부여 방식은 또한 어떤 사람이 특정한 운동 루틴의 마지막에 도달하면서 추가 노력을 기울일 때에도 볼 수 있다.","chunks":[["This method of motivation can also be seen","이러한 동기 부여 방식은 또한 ~에서 볼 수 있다"],["when a person puts in extra effort","어떤 사람이 추가 노력을 기울일 때"],["as they reach the end of a given exercise routine.","주어진 운동 루틴의 마지막에 도달하면서."]]},{"en":"Given the centrality of motivation to success in most life domains, this topic has fascinated scholars in a range of disciplines in the social sciences, including economics and psychology.","ko":"대부분의 삶의 영역에서 성공에 대한 동기 부여의 중심적 역할을 고려할 때, 이 주제는 경제학과 심리학을 포함하여 사회과학의 다양한 분야에서 학자들을 매료시켰다.","chunks":[["Given the centrality of motivation","동기 부여의 중심성을 고려할 때"],["to success in most life domains,","대부분의 삶의 영역에서 성공에 대한,"],["this topic has fascinated scholars","이 주제는 학자들을 매료시켜 왔다"],["in a range of disciplines in the social sciences,","사회과학의 다양한 분야의,"],["including economics and psychology.","경제학과 심리학을 포함하여."]]}],"metaphor":"<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에 쥐가 미로에서 도착선 가까울수록 속도가 빨라지는 그림과 가속 그래프, 가운데 원리 화살표, 오른쪽에 인간의 세 가지 평행 사례 - 적립 카드 마지막 칸 가속, 운동선수 마지막 push, 운동 루틴 마지막 추가 노력 - 미니 카드가 배치된 그림\">\n  <!-- 좌측: 쥐 + 미로 -->\n  <g transform=\"translate(15, 30)\">\n    <text x=\"125\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">Clark Hull의 실험 — Rat in Maze</text>\n    <rect x=\"0\" y=\"0\" width=\"250\" height=\"160\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.4\"/>\n    \n    <!-- 미로 (직선화된 단순화) -->\n    <g transform=\"translate(20, 60)\">\n      <!-- 시작 -->\n      <text x=\"0\" y=\"-12\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">START</text>\n      <line x1=\"0\" y1=\"-5\" x2=\"0\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      \n      <!-- 미로 길 (위/아래 벽) -->\n      <line x1=\"0\" y1=\"-5\" x2=\"200\" y2=\"-5\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <line x1=\"0\" y1=\"40\" x2=\"200\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      \n      <!-- 미로 분기벽들 (작게) -->\n      <line x1=\"50\" y1=\"-5\" x2=\"50\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"100\" y1=\"40\" x2=\"100\" y2=\"15\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"150\" y1=\"-5\" x2=\"150\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      \n      <!-- 쥐 (4개 위치 — 가속 표현) -->\n      <!-- 위치 1: 느림 -->\n      <g transform=\"translate(20, 17)\" opacity=\"0.45\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"6\" ry=\"3.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <circle cx=\"5\" cy=\"-1\" r=\"2.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <path d=\"M -6 1 Q -10 4 -11 2\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n        <circle cx=\"4.5\" cy=\"-2\" r=\"0.5\" fill=\"#1a1a1a\"/>\n        <polygon points=\"3,-3 4,-5 5,-3\" fill=\"#1a1a1a\"/>\n        <polygon points=\"6,-3 7,-5 8,-3\" fill=\"#1a1a1a\"/>\n      </g>\n      <!-- 위치 2 -->\n      <g transform=\"translate(75, 17)\" opacity=\"0.6\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"6\" ry=\"3.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <circle cx=\"5\" cy=\"-1\" r=\"2.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <path d=\"M -6 1 Q -10 4 -11 2\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n        <circle cx=\"4.5\" cy=\"-2\" r=\"0.5\" fill=\"#1a1a1a\"/>\n        <polygon points=\"3,-3 4,-5 5,-3\" fill=\"#1a1a1a\"/>\n        <polygon points=\"6,-3 7,-5 8,-3\" fill=\"#1a1a1a\"/>\n      </g>\n      <!-- 위치 3 -->\n      <g transform=\"translate(130, 17)\" opacity=\"0.8\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"6\" ry=\"3.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <circle cx=\"5\" cy=\"-1\" r=\"2.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <path d=\"M -6 1 Q -10 4 -11 2\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        <c

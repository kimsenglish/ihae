면화된 결과일 수 있어요."],["의식적 마음의 한계는?","우리 행동의 논리·근거를 늘 분별·식별하지는 못한다는 거예요."],["핵심 한 문장?","행동은 마음에서 시작되지만, 충동 행동처럼 그 이유를 의식이 못 짚을 때도 있고 결과는 정신적 성숙도에 달렸다."]],"vocab":[["reasoned","합리적인·논리에 기반한"],["instance","사례·경우"],["identify","알아내다·식별하다"],["atrocious","극악무도한·끔찍한"],["fundamental","근본적인·본질적인"],["lose one's mind","제정신을 잃다·미친 행동을 하다"],["momentarily","잠시·일시적으로"]],"en":"Every action starts in the mind. We may know about the reasoned thought process in most cases but there are instances where one may not be able to identify the thought process. If a person does something stupid or atrocious against his fundamental nature, he may say that he had lost his mind momentarily. When pressed, he may be unable to offer any other explanation for his actions. He may not be able to identify it but the actual cause might be a result of some kind of repressed emotion surfacing in impulsive behaviour. Impulsive behaviour is a result of emotive build-up and appears as sparks in our mind leading to instantaneous rational or irrational behaviour. The conscious mind may not be able to discern and identify the logic or the rationale behind many of our actions. Though mankind is endowed with rational thinking, irrational actions happen often. The outcome will largely depend upon mental maturity.","ko":"모든 행동은 마음에서 시작된다. 우리는 대부분의 경우 그 합리적인 사고 과정에 대해 알 수도 있지만, 그 사고 과정을 알아내지 못할 수도 있는 경우가 있다. 만약 어떤 사람이 자신의 근본적인 본성에 반하는 어떤 어리석거나 극악무도한 일을 한다면, 그는 자신이 잠시 제정신이 아니었다고 말할 수도 있다. 압박을 받으면 그는 자신의 행동에 대해 다른 어떤 설명도 제시하지 못할 수도 있다. 그는 실제 원인을 알아내지 못할 수도 있지만, 그것(실제 원인)은 어떤 억눌린 감정이 충동적 행동으로 드러난 것의 결과일 수도 있다. 충동적인 행동은 감정 축적의 결과이며 우리 마음속에서 불꽃처럼 나타나 즉각적인 이성적 혹은 비이성적 행동으로 이어진다. 의식적인 마음은 우리 행동 중 많은 것의 이면에 있는 논리나 근거를 분간하고 알아내지 못할 수도 있다. 비록 인류는 이성적인 사고를 타고났지만, 비이성적인 행동이 자주 일어난다. 그 결과는 정신적 성숙도에 따라 크게 좌우될 것이다.","read":[{"en":"Every action starts in the mind.","ko":"모든 행동은 마음에서 시작된다.","chunks":[["Every action","모든 행동은"],["starts in the mind.","마음에서 시작된다."]]},{"en":"We may know about the reasoned thought process in most cases but there are instances where one may not be able to identify the thought process.","ko":"우리는 대부분의 경우 그 합리적인 사고 과정에 대해 알 수도 있지만, 그 사고 과정을 알아내지 못할 수도 있는 경우가 있다.","chunks":[["We may know about","우리는 ~에 대해 알 수도 있다"],["the reasoned thought process","합리적 사고 과정에"],["in most cases","대부분의 경우"],["but there are instances","그러나 사례가 있다"],["where one may not be able to identify","그 사고 과정을 알아내지 못할 수도 있는"],["the thought process.","그 사고 과정을."]]},{"en":"If a person does something stupid or atrocious against his fundamental nature, he may say that he had lost his mind momentarily.","ko":"만약 어떤 사람이 자신의 근본적인 본성에 반하는 어떤 어리석거나 극악무도한 일을 한다면, 그는 자신이 잠시 제정신이 아니었다고 말할 수도 있다.","chunks":[["If a person does something","만약 어떤 사람이 어떤 일을 한다면"],["stupid or atrocious","어리석거나 극악무도한"],["against his fundamental nature,","자신의 근본적인 본성에 반하는,"],["he may say that","그는 ~라고 말할 수도 있다"],["he had lost his mind momentarily.","자신이 잠시 제정신이 아니었다고."]]},{"en":"When pressed, he may be unable to offer any other explanation for his actions.","ko":"압박을 받으면 그는 자신의 행동에 대해 다른 어떤 설명도 제시하지 못할 수도 있다.","chunks":[["When pressed,","압박을 받으면,"],["he may be unable to offer","그는 제시하지 못할 수도 있다"],["any other explanation for his actions.","자신의 행동에 대한 어떤 다른 설명도."]]},{"en":"He may not be able to identify it but the actual cause might be a result of some kind of repressed emotion surfacing in impulsive behaviour.","ko":"그는 실제 원인을 알아내지 못할 수도 있지만, 그것(실제 원인)은 어떤 억눌린 감정이 충동적 행동으로 드러난 것의 결과일 수도 있다.","chunks":[["He may not be able to identify it","그는 그것을 알아내지 못할 수도 있다"],["but the actual cause might be","하지만 실제 원인은 ~일 수도 있다"],["a result of some kind of repressed emotion","어떤 종류의 억눌린 감정의 결과"],["surfacing in impulsive behaviour.","충동적 행동으로 드러나는."]]},{"en":"Impulsive behaviour is a result of emotive build-up and appears as sparks in our mind leading to instantaneous rational or irrational behaviour.","ko":"충동적인 행동은 감정 축적의 결과이며 우리 마음속에서 불꽃처럼 나타나 즉각적인 이성적 혹은 비이성적 행동으로 이어진다.","chunks":[["Impulsive behaviour is a result of","충동적 행동은 ~의 결과이다"],["emotive build-up","감정 축적의"],["and appears as sparks in our mind","그리고 우리 마음 속에서 불꽃으로 나타난다"],["leading to instantaneous rational or irrational behaviour.","즉각적인 이성적 혹은 비이성적 행동으로 이어지는."]]},{"en":"The conscious mind may not be able to discern and identify the logic or the rationale behind many of our actions.","ko":"의식적인 마음은 우리 행동 중 많은 것의 이면에 있는 논리나 근거를 분간하고 알아내지 못할 수도 있다.","chunks":[["The conscious mind may not be able to","의식적 마음은 ~하지 못할 수도 있다"],["discern and identify","분간하고 알아내는 것을"],["the logic or the rationale","논리나 근거를"],["behind many of our actions.","우리 행동 중 많은 것의 이면에 있는."]]},{"en":"Though mankind is endowed with rational thinking, irrational actions happen often.","ko":"비록 인류는 이성적인 사고를 타고났지만, 비이성적인 행동이 자주 일어난다.","chunks":[["Though mankind is endowed with","비록 인류는 ~을 부여받았지만"],["rational thinking,","이성적 사고를,"],["irrational actions happen often.","비이성적 행동이 자주 일어난다."]]},{"en":"The outcome will largely depend upon mental maturity.","ko":"그 결과는 정신적 성숙도에 따라 크게 좌우될 것이다.","chunks":[["The outcome will largely depend upon","그 결과는 ~에 크게 좌우될 것이다"],["mental maturity.","정신적 성숙도에."]]}],"metaphor":"<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"빙산 메타포 그림 - 수면 위의 작은 빙산은 의식적 마음과 합리적 사고를, 수면 아래의 큰 빙산은 억눌린 감정의 축적을 보여 주며, 아래에서 위로 spark 화살표가 표면을 뚫고 충동적 행동으로 분출되는 모습\">\n  <!-- 배경: 하늘과 바다 -->\n  <rect x=\"0\" y=\"0\" width=\"600\" height=\"135\" fill=\"#ffffff\"/>\n  <rect x=\"0\" y=\"135\" width=\"600\" height=\"105\" fill=\"#f6f6f6\"/>\n  \n  <!-- 수면선 -->\n  <line x1=\"0\" y1=\"135\" x2=\"600\" y2=\"135\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n  <text x=\"15\" y=\"131\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\" font-weight=\"700\">↑ surface · 의식 표면</text>\n\n  <!-- 빙산 (수면 위) - 작음 -->\n  <g transform=\"translate(220, 135)\">\n    <polygon points=\"-45,0 -30,-50 5,-72 35,-50 50,0\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n    <!-- 빙산 텍스처 (작은 선들) -->\n    <line x1=\"-25\" y1=\"-15\" x2=\"-15\" y2=\"-25\" stroke=\"#1a1a1a\" stroke-width=\"0.5\" opacity=\"0.5\"/>\n    <line x1=\"15\" y1=\"-25\" x2=\"25\" y2=\"-35\" stroke=\"#1a1a1a\" stroke-width=\"0.5\" opacity=\"0.5\"/>\n    <line x1=\"-5\" y1=\"-40\" x2=\"5\" y2=\"-50\" stroke=\"#1a1a1a\" stroke-width=\"0.5\" opacity=\"0.5\"/>\n    \n    <!-- 라벨: 의식 -->\n    <text x=\"0\" y=\"-32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">conscious mind</text>\n    <text x=\"0\" y=\"-18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">reasoned thought</text>\n  </g>\n  \n  <!-- ? 사고 풍선 (의식이 분간 못 함) -->\n  <g transform=\"translate(360, 65)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"42\" ry=\"20\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n    <circle cx=\"-35\" cy=\"18\" r=\"5\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.1\"/>\n    <circle cx=\"-43\" cy=\"28\" r=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    <text x=\"0\" y=\"-4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">?</text>\n    <text x=\"0\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">cannot discern</text>\n  </g>\n\n  <!-- 빙산 (수면 아래) - 컴팩트하게 축소 -->\n  <g transform=\"translate(220, 135)\">\n    <polygon points=\"-45,0 -72,25 -75,55 -55,85 -10,98 38,90 60,68 65,42 50,0\" \n             fill=\"#f6f6f6\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <!-- 빙산 내부 텍스처 (억눌린 감정들) -->\n    <text x=\"-30\" y=\"25\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\" opacity=\"0.85\">anger</text>\n    <text x=\"28\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\" opacity=\"0.85\">fear</text>\n    <text x=\"-22\" y=\"52\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\" opacity=\"0.85\">resentment</text>\n    <text x=\"20\" y=\"65\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\" opacity=\"0.85\">shame</text>\n    <text x=\"-15\" y=\"80\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\" opacity=\"0.85\">grief</text>\n    \n    <!-- 중앙 라벨 (빙산 아래쪽이 아니라 빙산 안쪽 하단으로) -->\n    <rect x=\"-44\" y=\"86\" width=\"80\" height=\"12\" fill=\"#c8102e\" fill-opacity=\"0.85\"/>\n    <text x=\"-4\" y=\"95\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">REPRESSED · build-up</text>\n  </g>\n\n  <!-- Spark 화살표 (아래에서 위로 분출 + 우측 충동 행동 박스로 휨) -->\n  <g transform=\"translate(220, 135)\">\n    <!-- 수면 아래 깊이 → 수면까지 (점선) -->\n    <path d=\"M 0 70 Q -3 40 0 15 Q 2 5 5 0\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.8\" stroke-dasharray=\"5 2\"/>\n    <!-- 스파크 점들 (튀어오름) -->\n    <circle cx=\"-2\" cy=\"55\" r=\"1.8\" fill=\"#c8102e\"/>\n    <circle cx=\"2\" cy=\"30\" r=\"2\" fill=\"#c8102e\"/>\n    <circle cx=\"3\" cy=\"10\" r=\"1.8\" fill=\"#c8102e\"/>\n    <!-- 표면 뚫는 지점 강조 -->\n    <circle cx=\"5\" cy=\"0\" r=\"5\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    \n    <!-- 표면 위로 빠져나와 우측 박스로 (실선) -->\n    <path d=\"M 5 -3 Q 80 -25 195 -20\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <polygon points=\"200,-20 192,-24 192,-16\" fill=\"#c8102e\"/>\n    \n    <!-- spark surfaces 텍스트 (수면 바로 위) -->\n    <text x=\"40\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" fill=\"#c8102e\">spark surfaces →</text>\n  </g>\n\n  <!-- 충동 행동 박스 (우측, 빙산 옆) -->\n  <g transform=\"translate(420, 105)\">\n    <rect x=\"0\" y=\"0\" width=\"155\" height=\"38\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <text x=\"77\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">impulsive behaviour</text>\n    <text x=\"77\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">immature · harmful actions</text>\n  </g>\n\n  <!-- 좌측 라벨: 합리적 행동 (대부분) -->\n  <g transform=\"translate(15, 50)\">\n    <rect x=\"0\" y=\"0\" width=\"125\" height=\"55\" fill=\"#f0faf3\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"62\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">most actions</text>\n    <text x=\"62\" y=\"30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">explained by</text>\n    <text x=\"62\" y=\"44\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">reasoned thought</text>\n  </g>\n  <!-- 연결선 (왼쪽 → 의식) -->\n  <line x1=\"140\" y1=\"77\" x2=\"180\" y2=\"100\" stroke=\"#1FA34A\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 252)\">\n    <text x=\"300\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">outcome depends on <tspan fill=\"#1FA34A\">mental maturity</tspan> · 결과는 정신적 성숙도에 좌우</text>\n  </g>\n</svg>","caption":"빙산 메타포: 수면 위(의식·합리)와 수면 아래(억눌린 감정)가 연결되고, 억눌린 감정이 표면으로 올라와 충동 행동으로 드러남"},{"no":"8","title":"Rivers of Thinking","ktitle":"‘생각의 강’ — 굳어진 사고의 길","field":"인지","page":"05강 Ex.08","oneline":"뇌는 일상을 위해 ‘생각의 강(신경 경로)’을 만든다(de Bono).","tldr":["뇌는 일상을 위해 ‘생각의 강(신경 경로)’을 만든다(de Bono).","산을 흐르는 물이 깊은 골을 파듯, 사고도 깊은 경로를 만든다.","이 경로는 빠른 판단·전문성·일상 루틴을 가능케 한다(꼭 나쁜 건 아니다)."],"analogy":"산비탈 물이 흐르며 골을 파면 다음 물도 그 길로 흐르죠. 우리 생각도 ‘늘 가던 길(신경 경로)’이 깊어져, 매일 아침 루틴을 생각 없이 해내게 해요.","bg":"de Bono의 ‘생각의 강’ 개념 — 뇌가 물길처럼 깊은 신경 경로를 만들어 정보 해석·반응을 좌우하며, 그것이 빠른 판단·전문성에 도움이 된다는 글이에요.","flow":[{"kind":"개념","t":"뇌는 ‘생각의 강(신경 경로)’을 형성 (de Bono)"},{"kind":"비유","t":"산을 흐르는 물 → 깊은 골·물길을 팜"},{"kind":"영향","t":"정보 해석·세상 인식·반응 방식을 좌우"},{"kind":"이점","t":"빠른 판단·전문성·일상 루틴 가능 (꼭 나쁜 건 아님)"}],"quiz":[["‘생각의 강’이란 무엇에 비유되나?","산을 흐르며 깊은 골을 파는 물 — 반복으로 깊어지는 뇌의 신경 경로(사고 패턴)에 비유돼요."],["이 사고 경로의 ‘이점’은?","빠른 판단, 전문성 형성, 그리고 아침 루틴·출근길처럼 큰 생각 없이 일상을 해내게 해 줘요."],["핵심 한 문장?","뇌는 물길처럼 깊은 ‘생각의 강’을 만들어 해석·반응을 좌우하며, 이는 빠른 판단·전문성에 도움이 된다."]],"vocab":[["human nature","인간의 본성"],["thought pattern","사고 패턴"],["neural","신경의·신경계의"],["pathway","경로·통로"],["so-called","소위·이른바"],["get through","~을 헤쳐 나가다·통과하다"],["mental image","심상·정신적 이미지"]],"en":"It is human nature for our brains to form thought patterns ─ neural pathways or so-called rivers of thinking ─ to get through our daily activities. To better understand this concept, developed by Edward de Bono, create a mental image of water running down a mountain. It may start as a series of slow drips or scattered streams, but the water eventually comes together and flows in the same direction, creating deep grooves or pathways over time ─ even cutting through rock and creating gullies. These pathways are a good analogy to what happens with our thinking. We develop deep mental pathways that influence how we interpret information, what we see in the world around us, and how we respond. It's not all bad. These rivers of thinking help us extract order, make quick decisions, and create expertise. These patterns are why we can go through our morning routine without much thought or drive to work without directions. They help us survive and are essential to how we work and live.","ko":"우리의 뇌가 우리의 일상 활동을 하기 위해 사고 패턴, 즉 신경 경로 또는 소위 생각의 강을 형성하는 것이 인간의 본성이다. Edward de Bono에 의해 개발된 이 개념을 더 잘 이해하기 위해, 산에서 흘러내리는 물의 심상을 만들어 보라. 그것은 일련의 천천히 떨어지는 물방울이나 드문드문 있는 물줄기로 시작할 지도 모르지만, 그 물은 결국 하나로 모여 같은 방향으로 흐르며 시간이 지나면서 깊은 홈이나 경로를 만들고, 심지어는 바위도 가르고 골짜기를 만들기도 한다. 이러한 경로는 우리의 사고와 관련해 일어나는 일에 대한 좋은 비유이다. 우리는 우리가 정보를 해석하는 방법, 우리 주변 세계에서 보는 것, 그리고 반응하는 방식에 영향을 미치는 깊은 정신적 경로를 발달시킨다. 그것이 완전히 나쁜 것은 아니다. 이러한 생각의 강은 우리가 질서를 끌어내고, 빠른 결정을 내리며, 전문 지식을 형성하는 데 도움을 준다. 이러한 패턴 덕분에 우리는 별다른 생각 없이 아침 일과를 하거나 길 안내 없이도 운전해서 출근할 수 있다. 그것은 우리가 생존하는 데 도움이 되며, 우리가 일하고 살아가는 방식에 필수적이다.","read":[{"en":"It is human nature for our brains to form thought patterns ─ neural pathways or so-called rivers of thinking ─ to get through our daily activities.","ko":"우리의 뇌가 우리의 일상 활동을 하기 위해 사고 패턴, 즉 신경 경로 또는 소위 생각의 강을 형성하는 것이 인간의 본성이다.","chunks":[["It is human nature","인간의 본성이다"],["for our brains to form thought patterns","우리 뇌가 사고 패턴을 형성하는 것은"],["─ neural pathways or so-called rivers of thinking ─","─ 신경 경로 또는 소위 사고의 강 ─"],["to get through our daily activities.","우리의 일상 활동을 헤쳐 나가기 위해."]]},{"en":"To better understand this concept, developed by Edward de Bono, create a mental image of water running down a mountain.","ko":"Edward de Bono에 의해 개발된 이 개념을 더 잘 이해하기 위해, 산에서 흘러내리는 물의 심상을 만들어 보라.","chunks":[["To better understand this concept,","이 개념을 더 잘 이해하기 위해,"],["developed by Edward de Bono,","Edward de Bono에 의해 개발된,"],["create a mental image","심상을 만들어 보라"],["of water running down a mountain.","산에서 흘러내리는 물의."]]},{"en":"It may start as a series of slow drips or scattered streams, but the water eventually comes together and flows in the same direction, creating deep grooves or pathways over time ─ even cutting through rock and creating gullies.","ko":"그것은 일련의 천천히 떨어지는 물방울이나 드문드문 있는 물줄기로 시작할 지도 모르지만, 그 물은 결국 하나로 모여 같은 방향으로 흐르며 시간이 지나면서 깊은 홈이나 경로를 만들고, 심지어는 바위도 가르고 골짜기를 만들기도 한다.","chunks":[["It may start as","그것은 ~로 시작될 수도 있다"],["a series of slow drips or scattered streams,","일련의 천천히 떨어지는 물방울이나 드문드문 있는 물줄기로,"],["but the water eventually comes together","그러나 그 물은 결국 하나로 모인다"],["and flows in the same direction,","그리고 같은 방향으로 흐른다,"],["creating deep grooves or pathways over time","시간이 지나면서 깊은 홈이나 경로를 만들면서"],["─ even cutting through rock and creating gullies.","─ 심지어 바위도 가르고 골짜기를 만들기까지."]]},{"en":"These pathways are a good analogy to what happens with our thinking.","ko":"이러한 경로는 우리의 사고와 관련해 일어나는 일에 대한 좋은 비유이다.","chunks":[["These pathways are a good analogy","이러한 경로는 좋은 비유이다"],["to what happens with our thinking.","우리의 사고에 일어나는 일에 대한."]]},{"en":"We develop deep mental pathways that influence how we interpret information, what we see in the world around us, and how we respond.","ko":"우리는 우리가 정보를 해석하는 방법, 우리 주변 세계에서 보는 것, 그리고 반응하는 방식에 영향을 미치는 깊은 정신적 경로를 발달시킨다.","chunks":[["We develop deep mental pathways","우리는 깊은 정신적 경로를 발달시킨다"],["that influence","~에 영향을 미치는"],["how we interpret information,","우리가 정보를 해석하는 방식,"],["what we see in the world around us,","우리 주변 세계에서 보는 것,"],["and how we respond.","그리고 어떻게 반응하는지."]]},{"en":"It's not all bad.","ko":"그것이 완전히 나쁜 것은 아니다.","chunks":[["It's not all bad.","그것이 완전히 나쁜 것은 아니다."]]},{"en":"These rivers of thinking help us extract order, make quick decisions, and create expertise.","ko":"이러한 생각의 강은 우리가 질서를 끌어내고, 빠른 결정을 내리며, 전문 지식을 형성하는 데 도움을 준다.","chunks":[["These rivers of thinking help us","이러한 생각의 강은 우리가 ~하는 데 도움을 준다"],["extract order,","질서를 끌어내고,"],["make quick decisions,","빠른 결정을 내리고,"],["and create expertise.","그리고 전문 지식을 형성하는"]]},{"en":"These patterns are why we can go through our morning routine without much thought or drive to work without directions.","ko":"이러한 패턴 덕분에 우리는 별다른 생각 없이 아침 일과를 하거나 길 안내 없이도 운전해서 출근할 수 있다.","chunks":[["These patterns are why","이러한 패턴 덕분에"],["we can go through our morning routine","우리가 아침 일과를 할 수 있다"],["without much thought","별다른 생각 없이"],["or drive to work without directions.","또는 길 안내 없이도 운전해서 출근할 수 있다."]]},{"en":"They help us survive and are essential to how we work and live.","ko":"그것은 우리가 생존하는 데 도움이 되며, 우리가 일하고 살아가는 방식에 필수적이다.","chunks":[["They help us survive","그것은 우리가 생존하는 데 도움이 된다"],["and are essential to","그리고 ~에 필수적이다"],["how we work and live.","우리가 일하고 살아가는 방식에."]]}],"metaphor":"<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"산 정상에서 흩어진 물방울들이 시작되어 시간이 지나면서 모이고 깊은 골을 패며 강을 형성하는 본문 비유의 직접 시각화 - 좌측 산 위 흩어진 drips와 streams, 가운데 over time 화살표, 우측 깊은 강과 골짜기 - 그리고 우측에 4가지 긍정 효과 라벨 (질서 추출·빠른 결정·전문성·자동화) 배치\">\n  <!-- 산 윤곽 (배경) -->\n  <path d=\"M 0 200 L 50 130 L 130 80 L 200 65 L 260 75 L 320 100 L 380 130 L 450 155 L 530 180 L 600 200 L 600 240 L 0 240 Z\" \n        fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n\n  <!-- 좌측: 시작 - 흩어진 물방울 -->\n  <g transform=\"translate(10, 35)\">\n    <text x=\"105\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">시작 — slow drips · scattered streams</text>\n    \n    <!-- 산 정상 -->\n    <text x=\"105\" y=\"42\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">mountain top</text>\n    \n    <!-- 흩어진 물방울 (drips) -->\n    <g fill=\"#1FA34A\">\n      <ellipse cx=\"40\" cy=\"55\" rx=\"2\" ry=\"3\"/>\n      <ellipse cx=\"60\" cy=\"50\" rx=\"1.8\" ry=\"2.5\"/>\n      <ellipse cx=\"80\" cy=\"58\" rx=\"2.2\" ry=\"3\"/>\n      <ellipse cx=\"100\" cy=\"48\" rx=\"1.8\" ry=\"2.5\"/>\n      <ellipse cx=\"125\" cy=\"55\" rx=\"2\" ry=\"3\"/>\n      <ellipse cx=\"150\" cy=\"50\" rx=\"1.8\" ry=\"2.5\"/>\n      <ellipse cx=\"175\" cy=\"58\" rx=\"2\" ry=\"3\"/>\n    </g>\n    \n    <!-- 짧은 streams (각각 다른 방향) -->\n    <g stroke=\"#1FA34A\" stroke-width=\"1.2\" fill=\"none\">\n      <path d=\"M 40 58 Q 38 70 35 85\"/>\n      <path d=\"M 60 53 Q 62 65 58 80\"/>\n      <path d=\"M 80 61 Q 83 75 75 88\"/>\n      <path d=\"M 100 51 Q 105 65 100 80\"/>\n      <path d=\"M 125 58 Q 122 72 125 85\"/>\n      <path d=\"M 150 53 Q 153 68 148 82\"/>\n      <path d=\"M 175 61 Q 170 75 175 88\"/>\n    </g>\n  </g>\n\n  <!-- 가운데: over time 화살표 -->\n  <g transform=\"translate(245, 100)\">\n    <line x1=\"0\" y1=\"0\" x2=\"55\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n    <polygon points=\"55,0 47,-5 47,5\" fill=\"#1a1a1a\"/>\n    <text x=\"27\" y=\"-8\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">over time</text>\n    <text x=\"27\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">시간 지나면</text>\n    <text x=\"27\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">come together</text>\n  </g>\n\n  <!-- 우측: 깊은 강 + 골짜기 (cut through rock) -->\n  <g transform=\"translate(320, 35)\">\n    <text x=\"135\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">결과 — deep grooves · river · cut through rock</text>\n    \n    <!-- 강 (깊은 골, 굵은 흐름) -->\n    <g transform=\"translate(0, 30)\">\n      <!-- 바위들 (가르고 지나간 자국) -->\n      <g fill=\"#999\" stroke=\"#1a1a1a\" stroke-width=\"0.8\">\n        <polygon points=\"35,32 28,38 25,52 35,58 45,52 42,38\"/>\n        <polygon points=\"220,30 213,36 210,50 220,56 230,50 227,36\"/>\n      </g>\n      <text x=\"35\" y=\"68\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">rock</text>\n      \n      <!-- 강 (cut through) -->\n      <path d=\"M 0 45 Q 60 38 100 50 Q 145 64 195 52 Q 240 42 270 50\" \n            fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"14\" opacity=\"0.85\"/>\n      <!-- 강 가장자리 골 (groove) -->\n      <path d=\"M 0 38 Q 60 31 100 43 Q 145 57 195 45 Q 240 35 270 43\" \n            fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <path d=\"M 0 52 Q 60 45 100 57 Q 145 71 195 59 Q 240 49 270 57\" \n            fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      \n      <!-- 강 화살표 (흐름 방향) -->\n      <polygon points=\"270,50 262,43 260,57\" fill=\"#1FA34A\"/>\n      <text x=\"135\" y=\"20\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">river of thinking</text>\n      \n      <!-- gully (골짜기) 깊이 라벨 -->\n      <g transform=\"translate(155, 78)\">\n        <line x1=\"-30\" y1=\"0\" x2=\"30\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"0.6\"/>\n        <line x1=\"-30\" y1=\"-3\" x2=\"-30\" y2=\"3\" stroke=\"#1a1a1a\" stroke-width=\"0.6\"/>\n        <line x1=\"30\" y1=\"-3\" x2=\"30\" y2=\"3\" stroke=\"#1a1a1a\" stroke-width=\"0.6\"/>\n        <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">deep groove · gully</text>\n      </g>\n    </g>\n  </g>\n\n  <!-- 하단: 4가지 긍정 효과 -->\n  <g transform=\"translate(15, 175)\">\n    <text x=\"285\" y=\"-3\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">긍정적 효과 — Essential to Survival</text>\n    \n    <!-- 4 효과 카드 -->\n    <g transform=\"translate(0, 8)\">\n      <rect x=\"0\" y=\"0\" width=\"135\" height=\"38\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"67\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">extract order</text>\n      <text x=\"67\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">질서 추출</text>\n    </g>\n    <g transform=\"translate(145, 8)\">\n      <rect x=\"0\" y=\"0\" width=\"135\" height=\"38\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"67\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">quick decisions</text>\n      <text x=\"67\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">빠른 결정</text>\n    </g>\n    <g transform=\"translate(290, 8)\">\n      <rect x=\"0\" y=\"0\" width=\"135\" height=\"38\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"67\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">expertise</text>\n      <text x=\"67\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">전문성 형성</text>\n    </g>\n    <g transform=\"translate(435, 8)\">\n      <rect x=\"0\" y=\"0\" width=\"135\" height=\"38\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"67\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">auto-routines</text>\n      <text x=\"67\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">일상 자동화</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"248\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">— Edward de Bono · these patterns help us survive</text>\n</svg>","caption":"★ 본문 비유 직접 시각화: 산 위 물방울 → 모임 → 깊은 골 → 강 (생각의 강)"},{"no":"9","title":"The Emerging Power Shift","ktitle":"권력 이동 — 청소년이 목소리를 얻다","field":"미디어·사회","page":"05강 Ex.09","oneline":"작고 주변부였던 이들이 가시성·목소리를 얻는 ‘권력 이동’이 일어난다.","tldr":["작고 주변부였던 이들이 가시성·목소리를 얻는 ‘권력 이동’이 일어난다.","역사적으로 정보·소통을 통제받던 청소년에게 특히 중요하다.","디지털 미디어가 어른-청소년 권력관계를 흔든다 — 청소년을 ‘혁신 주체’로 봐야."],"analogy":"예전엔 어른이 정해 준 정보만 받던 청소년이, 디지털 미디어로 직접 ‘목소리’를 내게 됐어요. 통제받던 변두리가 무대 중앙으로 나오는 ‘권력 이동’이죠.","bg":"디지털 미디어가 어른-청소년의 기존 권력관계를 흔들어, 통제받던 청소년을 정당한 사회·정치 주체이자 혁신의 주체로 보게 한다는 글이에요.","flow":[{"kind":"현상","t":"작고 주변부 행위자가 가시성·목소리를 얻는 ‘권력 이동’"},{"kind":"대상","t":"정보·소통을 통제받던 청소년에게 특히 중요"},{"kind":"작용","t":"디지털 미디어가 어른-청소년 권력관계를 ‘교란’"},{"kind":"결론","t":"청소년 = 정당한 사회·정치 주체, 새 미디어 변화의 ‘혁신 주체’"}],"quiz":[["이 ‘권력 이동’이 청소년에게 특히 중요한 이유는?","청소년은 역사적으로 정보·소통 접근을 제도적으로 통제받아 왔는데, 디지털 미디어가 그 권력관계를 흔들기 때문이에요."],["글이 요구하는 청소년에 대한 인식은?","정당한 사회·정치 행위자일 뿐 아니라 새 미디어 변화의 ‘혁신가·견인자’로 인정하라는 거예요."],["핵심 한 문장?","디지털 미디어가 어른-청소년 권력관계를 흔들어, 청소년을 정당한 사회 주체이자 혁신의 주체로 부상시킨다."]],"vocab":[["emerging","새로 등장하는·부상하는"],["power shift","권력 이동"],["edge","주변부의·가장자리의"],["visibility","가시성·드러남"],["voice","발언권·목소리"],["particularly","특히"],["lens","관점·렌즈"]],"en":"The emerging power shift, where smaller and edge players are gaining more visibility and voice, is particularly important to children and youth. If we look at children and youth through the lens of digital media, we have a population that has been historically subject to a higher degree of systematic and institutional control in the kinds of information and social communication to which they have access. This is one reason why the alchemy between youth and digital media has been distinctive; it disrupts the existing set of power relations between adult authority and young people. While many studies of children, youth, and media have for decades stressed the status of young people as competent and full social subjects, digital media increasingly insist that we acknowledge this viewpoint. Not only must we see youth as legitimate social and political actors, but we must also recognize them as potential innovators and drivers of new media change.","ko":"더 소규모이고 주변부에 있는 참가자들이 더 많은 가시성과 발언권을 얻고 있는, 새로 등장하는 권력의 이동은 아동과 청소년에게 특히 중요하다. 디지털 미디어의 렌즈를 통해 아동과 청소년을 바라보면, 접근할 수 있는 정보와 사회적 소통의 종류에서, 역사적으로 더 높은 수준의 체계적이고 제도적인 통제를 받아 온 인구 집단이 있다. 이것이 바로 청소년과 디지털 미디어 사이의 마법 같은 결합이 독특했던 한 가지 이유인데, 그것은 성인의 권위와 젊은이들 사이의 기존 권력 관계 형태를 혼란에 빠뜨린다. 수십 년 동안 아동, 청소년, 그리고 미디어에 대한 많은 연구에서 유능하고 완전한 사회적 주체로서의 젊은이들의 지위를 강조해 왔지만, 디지털 미디어는 점점 더 우리가 이 관점을 인정할 것을 주장한다. 우리는 청소년을 정당한 사회적 그리고 정치적 행위자로 바라봐야 할 뿐만 아니라, 또한 그들을 뉴 미디어 변화의 잠재적 혁신가이자 추진자로 인식해야 한다.","read":[{"en":"The emerging power shift, where smaller and edge players are gaining more visibility and voice, is particularly important to children and youth.","ko":"더 소규모이고 주변부에 있는 참가자들이 더 많은 가시성과 발언권을 얻고 있는, 새로 등장하는 권력의 이동은 아동과 청소년에게 특히 중요하다.","chunks":[["The emerging power shift,","새로 등장하는 권력 이동은,"],["where smaller and edge players","거기서 더 소규모이고 주변부에 있는 참가자들이"],["are gaining more visibility and voice,","더 많은 가시성과 발언권을 얻고 있는,"],["is particularly important","특히 중요하다"],["to children and youth.","아동과 청소년에게."]]},{"en":"If we look at children and youth through the lens of digital media, we have a population that has been historically subject to a higher degree of systematic and institutional control in the kinds of information and social communication to which they have access.","ko":"디지털 미디어의 렌즈를 통해 아동과 청소년을 바라보면, 접근할 수 있는 정보와 사회적 소통의 종류에서, 역사적으로 더 높은 수준의 체계적이고 제도적인 통제를 받아 온 인구 집단이 있다.","chunks":[["If we look at children and youth","만약 우리가 아동과 청소년을 바라본다면"],["through the lens of digital media,","디지털 미디어의 렌즈를 통해,"],["we have a population","우리에게는 인구 집단이 있다"],["that has been historically subject to","역사적으로 ~의 대상이 되어 온"],["a higher degree of systematic and institutional control","더 높은 수준의 체계적이고 제도적인 통제의"],["in the kinds of information and social communication","정보와 사회적 소통의 종류에서"],["to which they have access.","그들이 접근할 수 있는."]]},{"en":"This is one reason why the alchemy between youth and digital media has been distinctive; it disrupts the existing set of power relations between adult authority and young people.","ko":"이것이 바로 청소년과 디지털 미디어 사이의 마법 같은 결합이 독특했던 한 가지 이유인데, 그것은 성인의 권위와 젊은이들 사이의 기존 권력 관계 형태를 혼란에 빠뜨린다.","chunks":[["This is one reason why","이것이 ~인 한 가지 이유이다"],["the alchemy between youth and digital media","청소년과 디지털 미디어 사이의 마법 같은 결합이"],["has been distinctive;","독특해 온;"],["it disrupts the existing set of power relations","그것은 기존 권력 관계의 형태를 혼란에 빠뜨린다"],["between adult authority and young people.","성인의 권위와 젊은이들 사이의."]]},{"en":"While many studies of children, youth, and media have for decades stressed the status of young people as competent and full social subjects, digital media increasingly insist that we acknowledge this viewpoint.","ko":"수십 년 동안 아동, 청소년, 그리고 미디어에 대한 많은 연구에서 유능하고 완전한 사회적 주체로서의 젊은이들의 지위를 강조해 왔지만, 디지털 미디어는 점점 더 우리가 이 관점을 인정할 것을 주장한다.","chunks":[["While many studies of children, youth, and media","아동, 청소년, 그리고 미디어에 대한 많은 연구들이 ~하는 동안에도"],["have for decades stressed","수십 년 동안 강조해 왔지만"],["the status of young people","젊은이들의 지위를"],["as competent and full social subjects,","유능하고 완전한 사회적 주체로서의,"],["digital media increasingly insist that","디지털 미디어는 점점 더 ~을 주장한다"],["we acknowledge this viewpoint.","우리가 이 관점을 인정할 것을."]]},{"en":"Not only must we see youth as legitimate social and political actors, but we must also recognize them as potential innovators and drivers of new media change.","ko":"우리는 청소년을 정당한 사회적 그리고 정치적 행위자로 바라봐야 할 뿐만 아니라, 또한 그들을 뉴 미디어 변화의 잠재적 혁신가이자 추진자로 인식해야 한다.","chunks":[["Not only must we see youth","우리는 청소년을 ~로 바라봐야 할 뿐만 아니라"],["as legitimate social and political actors,","정당한 사회적 그리고 정치적 행위자로,"],["but we must also recognize them","우리는 또한 그들을 ~로 인식해야 한다"],["as potential innovators and drivers","잠재적 혁신가와 추진자로"],["of new media change.","뉴 미디어 변화의."]]}],"metaphor":"<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 전통적 권력 구조에서 큰 성인이 중심에 있고 청소년이 주변부 작은 인물로 배치된 그림과, 가운데 디지털 미디어 alchemy 화살표를 거쳐 오른쪽 디지털 시대에 청소년이 중심에 혁신가·추진자로 자리잡고 성인은 주변부로 밀려난 모습이 대조된 그림\">\n  <!-- 좌측: 전통적 권력 구조 (Before) -->\n  <g transform=\"translate(15, 30)\">\n    <text x=\"120\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">전통 — Adult Authority 중심</text>\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"195\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.4\"/>\n    \n    <!-- 중심 큰 성인 -->\n    <g transform=\"translate(120, 80)\">\n      <!-- 큰 원 (권위 영역) -->\n      <circle cx=\"0\" cy=\"0\" r=\"38\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.7\"/>\n      <!-- 성인 stick (큼) -->\n      <circle cx=\"0\" cy=\"-15\" r=\"11\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <circle cx=\"-3\" cy=\"-16\" r=\"1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-16\" r=\"1\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 \" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">social actor</text>\n    </g>\n    <g transform=\"translate(125, 153)\">\n      <rect x=\"0\" y=\"0\" width=\"100\" height=\"32\" fill=\"#f0faf3\" fill-opacity=\"0.7\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <text x=\"50\" y=\"13\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">② innovator</text>\n      <text x=\"50\" y=\"26\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">media driver</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">visibility · voice gained — youth as drivers of new media change</text>\n</svg>","caption":"전통:성인 중심·청소년 주변부 → alchemy → 청소년 혁신가로 이동"},{"no":"10","title":"Tree Etiquette","ktitle":"나무의 ‘예절’ — 잘 자란 나무의 모습","field":"자연·생태","page":"05강 Ex.10","oneline":"숲에는 나무의 ‘예절(올바른 모습)’에 대한 불문율이 있다.","tldr":["숲에는 나무의 ‘예절(올바른 모습)’에 대한 불문율이 있다.","곧은 줄기·고른 뿌리·옆가지를 죽여 봉합한 매끈한 기둥·꼭대기의 대칭 수관.","이렇게 자란 나무는 아주 오래 산다(침엽수는 꼭대기 가지가 수평)."],"analogy":"잘 자란 나무는 ‘자세 바른 모범생’ 같아요 — 곧은 줄기, 사방 고른 뿌리, 군더더기 가지는 일찍 정리해 매끈한 기둥, 꼭대기엔 균형 잡힌 수관. 그래야 오래 살죠.","bg":"숲에서 ‘잘 자란(예절 바른)’ 나무의 이상적 형태 — 곧은 줄기, 고른 뿌리, 봉합된 옆가지, 대칭 수관 — 와 그런 나무가 장수함을 묘사한 글이에요.","flow":[{"kind":"전제","t":"숲엔 나무 ‘예절(올바른 모습)’의 불문율"},{"kind":"형태","t":"곧은 줄기 + 사방 고른 뿌리"},{"kind":"기둥","t":"어릴 적 옆가지는 죽여 봉합 → 매끈한 긴 기둥"},{"kind":"수관","t":"꼭대기엔 위로 뻗은 대칭 수관"},{"kind":"결론","t":"이런 나무는 장수 (침엽수는 꼭대기 가지 수평)"}],"quiz":[["‘잘 자란’ 활엽수의 이상적 모습은?","곧은 줄기, 사방으로 고른 뿌리, 옆가지를 죽여 봉합한 매끈한 기둥, 꼭대기의 대칭 수관이에요."],["이런 형태가 주는 결과는?","그렇게 이상적으로 자란 나무는 아주 오래 살 수 있어요(침엽수는 꼭대기 가지가 수평·약간 아래)."],["핵심 한 문장?","숲의 ‘예절’대로 곧고 균형 있게 자란 나무가 오래 산다."]],"vocab":[["unwritten","암묵적·기록되지 않은"],["guideline","지침·가이드라인"],["etiquette","에티켓·예법"],["lay down","규정하다·제정하다"],["upright","똑바로 선·직립의"],["acceptable","허용되는·받아들일 수 있는"],["mature","성숙한·다 자란"]],"en":"In the forest, there are unwritten guidelines for tree etiquette. These guidelines lay down the proper appearance for upright members of ancient forests and acceptable forms of behavior. This is what a mature, well-behaved seasonal tree looks like. It has a ramrod-straight trunk with a regular, orderly arrangement of wood fibers. The roots stretch out evenly in all directions and reach down into the earth under the tree. In its youth, the tree had narrow branches extending sideways from its trunk. They died back a long time ago, and the tree sealed them off with fresh bark and new wood so that what you see now is a long, smooth column. Only when you get to the top do you see a symmetrical crown formed of strong branches angling upward like arms raised to heaven. An ideally formed tree such as this can grow very old. Similar rules hold for conifers, except that the topmost branches should be horizontal or bent slightly downward.","ko":"숲에는 나무 에티켓에 대한 암묵적 지침이 있다. 이 지침은 고대 숲의 똑바로 선 구성원이 갖추어야 할 적절한 외관과 허용되는 행동 양식을 규정한다. 성숙하고 제대로 자란 계절 나무의 모습은 다음과 같다. 그것은 규칙적이고 질서 정연한 나무 섬유 배열이 있는 꼿꼿한 줄기를 가지고 있다. 뿌리는 사방으로 고르게 뻗어 나가 나무 아래의 땅속까지 내려간다. 젊었을 때 그 나무는 자신의 줄기에서 옆으로 뻗어나가는 가는 가지들을 가지고 있었다. 그것(그 가지)들은 오래전에 죽었고, 그 나무는 새로 생긴 나무껍질과 새로운 목질로 그것들을 봉인하였으며, 그래서 지금 여러분이 보는 것은 길고 매끈한 기둥이다. 꼭대기에 도달해야만 하늘을 향해 팔을 들어 올린 것처럼 위로 비스듬히 뻗은 튼튼한 가지들로 형성된 대칭적인 수관(樹冠)을 볼 수 있다. 이와 같이 이상적으로 형성된 나무는 아주 오래 자랄 수 있다. 맨 꼭대기의 가지들이 수평이거나 약간 아래로 구부러져 있어야 한다는 점을 제외하면, 비슷한 규칙이 침엽수에도 적용된다.","read":[{"en":"In the forest, there are unwritten guidelines for tree etiquette.","ko":"숲에는 나무 에티켓에 대한 암묵적 지침이 있다.","chunks":[["In the forest,","숲에는,"],["there are unwritten guidelines","암묵적 지침이 있다"],["for tree etiquette.","나무 에티켓에 대한."]]},{"en":"These guidelines lay down the proper appearance for upright members of ancient forests and acceptable forms of behavior.","ko":"이 지침은 고대 숲의 똑바로 선 구성원이 갖추어야 할 적절한 외관과 허용되는 행동 양식을 규정한다.","chunks":[["These guidelines lay down","이 지침은 ~을 규정한다"],["the proper appearance","적절한 외관을"],["for upright members of ancient forests","고대 숲의 똑바로 선 구성원이 갖추어야 할"],["and acceptable forms of behavior.","그리고 허용되는 행동 양식을."]]},{"en":"This is what a mature, well-behaved seasonal tree looks like.","ko":"성숙하고 제대로 자란 계절 나무의 모습은 다음과 같다.","chunks":[["This is what","이것이 ~한 모습이다"],["a mature, well-behaved seasonal tree","성숙하고 제대로 자란 계절 나무가"],["looks like.","보이는."]]},{"en":"It has a ramrod-straight trunk with a regular, orderly arrangement of wood fibers.","ko":"그것은 규칙적이고 질서 정연한 나무 섬유 배열이 있는 꼿꼿한 줄기를 가지고 있다.","chunks":[["It has a ramrod-straight trunk","그것은 꼿꼿한 줄기를 가지고 있다"],["with a regular, orderly arrangement","규칙적이고 질서 정연한 배열이 있는"],["of wood fibers.","나무 섬유의."]]},{"en":"The roots stretch out evenly in all directions and reach down into the earth under the tree.","ko":"뿌리는 사방으로 고르게 뻗어 나가 나무 아래의 땅속까지 내려간다.","chunks":[["The roots stretch out evenly","뿌리는 고르게 뻗어 나간다"],["in all directions","사방으로"],["and reach down into the earth","그리고 땅속까지 내려간다"],["under the tree.","나무 아래의."]]},{"en":"In its youth, the tree had narrow branches extending sideways from its trunk.","ko":"젊었을 때 그 나무는 자신의 줄기에서 옆으로 뻗어나가는 가는 가지들을 가지고 있었다.","chunks":[["In its youth,","젊었을 때,"],["the tree had narrow branches","그 나무는 가는 가지를 가지고 있었다"],["extending sideways from its trunk.","줄기에서 옆으로 뻗어나가는."]]},{"en":"They died back a long time ago, and the tree sealed them off with fresh bark and new wood so that what you see now is a long, smooth column.","ko":"그것(그 가지)들은 오래전에 죽었고, 그 나무는 새로 생긴 나무껍질과 새로운 목질로 그것들을 봉인하였으며, 그래서 지금 여러분이 보는 것은 길고 매끈한 기둥이다.","chunks":[["They died back a long time ago,","그것들은 오래전에 죽었다,"],["and the tree sealed them off","그리고 그 나무는 그것들을 봉인했다"],["with fresh bark and new wood","새로 생긴 나무껍질과 새로운 목질로"],["so that","그래서"],["what you see now","지금 여러분이 보는 것은"],["is a long, smooth column.","길고 매끈한 기둥이다."]]},{"en":"Only when you get to the top do you see a symmetrical crown formed of strong branches angling upward like arms raised to heaven.","ko":"꼭대기에 도달해야만 하늘을 향해 팔을 들어 올린 -width=\"1.3\"/>\n    <text x=\"74\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">③ smooth column</text>\n    <text x=\"74\" y=\"27\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">side branches died &amp; sealed</text>\n    <text x=\"74\" y=\"40\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">옆 가지 죽어 봉인</text>\n    <line x1=\"-5\" y1=\"23\" x2=\"-65\" y2=\"23\" stroke=\"#1FA34A\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n    <polygon points=\"-65,23 -60,19 -60,27\" fill=\"#1FA34A\"/>\n  </g>\n\n  <!-- ④ 사방 고른 뿌리 - 좌측 하단 -->\n  <g transform=\"translate(20, 175)\">\n    <rect x=\"0\" y=\"0\" width=\"148\" height=\"32\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n    <text x=\"74\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">④ roots stretch evenly</text>\n    <text x=\"74\" y=\"26\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">in all directions</text>\n    <line x1=\"153\" y1=\"14\" x2=\"190\" y2=\"14\" stroke=\"#1FA34A\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n    <polygon points=\"190,14 185,10 185,18\" fill=\"#1FA34A\"/>\n  </g>\n\n  <!-- 우측: 침엽수 예외 -->\n  <g transform=\"translate(490, 175)\">\n    <text x=\"48\" y=\"-6\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">침엽수 예외</text>\n    <rect x=\"0\" y=\"0\" width=\"95\" height=\"78\" fill=\"#fdf2f4\" fill-opacity=\"0.4\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n    \n    <!-- 침엽수 -->\n    <g transform=\"translate(48, 60)\">\n      <!-- 기둥 -->\n      <rect x=\"-3\" y=\"-15\" width=\"6\" height=\"20\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 위가지 (수평·아래) -->\n      <line x1=\"0\" y1=\"-13\" x2=\"-15\" y2=\"-12\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <line x1=\"0\" y1=\"-13\" x2=\"15\" y2=\"-12\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <line x1=\"0\" y1=\"-10\" x2=\"-18\" y2=\"-6\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"-10\" x2=\"18\" y2=\"-6\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"-5\" x2=\"-22\" y2=\"2\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"-5\" x2=\"22\" y2=\"2\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"-13\" x2=\"0\" y2=\"-18\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 위 가지 강조 (수평) -->\n      <text x=\"0\" y=\"-25\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">top: horizontal</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 248)\">\n    <rect x=\"170\" y=\"0\" width=\"260\" height=\"25\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"300\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">ideally formed → grows very old</text>\n    <text x=\"300\" y=\"21\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">이상적 형성 → 장수</text>\n  </g>\n</svg>","caption":"★ 본문 비유 직접 시각화: 모범 나무의 5개 부분 라벨링 + 침엽수 예외 미니"},{"no":"11","title":"Heidegger on Technology","ktitle":"하이데거 — 기술은 ‘끌어내어 드러냄’","field":"철학·기술","page":"05강 Ex.11","oneline":"하이데거: 기술은 무언가를 산출하는 ‘끌어내어 드러냄(bringing-forth)’이다.","tldr":["하이데거: 기술은 무언가를 산출하는 ‘끌어내어 드러냄(bringing-forth)’이다.","‘production(pro=앞으로+ducere=이끌다)’도 ‘끌어냄’을 뜻한다.","따라서 기술은 ‘지식의 산출’, 즉 인식론과 깊이 연결된다."],"analogy":"기술을 단순한 ‘도구·효율’로만 보지 말자는 거예요. 가려져 있던 것을 ‘끌어내어 드러내는’ 활동이라, 우리가 사는 세계를 새롭게 보게(알게) 해 주죠.","bg":"하이데거가 기술을 단순 도구가 아니라 ‘끌어내어 드러냄(bringing-forth)’으로 보아, 기술이 지식 산출(인식론)과 깊이 연결됨을 설명한 철학 글이에요.","flow":[{"kind":"정의","t":"하이데거: 기술 = ‘끌어내어 드러냄(bringing-forth)’"},{"kind":"어원","t":"production = pro(앞으로)+ducere(이끌다) → ‘끌어냄’"},{"kind":"연결","t":"기술 = ‘지식의 산출’ → 인식론과 연결"},{"kind":"의미","t":"효율 도구를 넘어, 우리가 사는 ‘세계’를 자각하게 함"}],"quiz":[["하이데거는 기술을 무엇이라 보았나?","무언가를 산출해 내는 ‘끌어내어 드러냄(bringing-forth)’이라고 봤어요."],["기술이 ‘인식론’과 연결되는 이유는?","기술이 곧 ‘지식의 산출’이며, 우리가 사는 세계를 새롭게 자각·관찰하게 하기 때문이에요."],["핵심 한 문장?","하이데거에게 기술은 단순 도구가 아니라 지식을 ‘끌어내어 드러내는’ 활동, 즉 인식론과 깊이 연결된 것이다."]],"vocab":[["bringing-forth","앞으로 이끌어내기·산출"],["produce","생산하다·만들어내다"],["combination","결합·조합"],["refer to","~을 가리키다·언급하다"],["connected to","~와 연결된"],["production","생산·산출"],["hence","따라서·그래서"]],"en":"Heidegger thought of technology as a 'bringing-forth', something that produces something. Interestingly enough, the Latin combination of pro and ducere in the word production also refers to something that can be called \"bringing forth' (pro=forward and ducere=to lead). Technology, then, is deeply connected to the production of knowledge, and hence to epistemology. This is not only because the more administrative pedagogical technologies used in teaching and learning bring with them tools for efficiency in educational spheres. It is also connected to the critique of technology and its critical uses, that is, the deeper penetration of technological processes that help us be aware of the worlds (in the phenomenological sense) we inhabit, be it in the observation of new technologies of seeing or those of hearing.","ko":"Heidegger는 기술을 '앞으로 이끌어내기', 즉 무언가를 생산해 내는 것으로 생각했다. 매우 흥미롭게도, 생산이라는 단어에 있는 라틴어의 pro와 ducere의 조합 또한 '앞으로 이끌어내기'라고 부를 수 있는 것을 가리킨다. 그렇다면, 기술은 지식의 생산과 깊이 연결되어 있으며, 따라서 인식론과도 깊이 연결되어 있다. 이는 교수와 학습에 사용되는 더 많은 관리용 교육 기술들이 교육 영역에서의 효율성을 위한 도구들을 함께 가져오기 때문만은 아니다. 그것은 또한 기술에 대한 비판적 분석과 그것의 비판적 활용, 즉 새로운 시각 기술의 관찰에서든 청각 기술의 관찰에서든, 우리가 거주하는 (현상학적 의미에서의) 세계를 인식하는 데 도움이 되는 기술 과정에 대한 더 깊은 통찰과도 연결되어 있다.","read":[{"en":"Heidegger thought of technology as a 'bringing-forth', something that produces something.","ko":"Heidegger는 기술을 '앞으로 이끌어내기', 즉 무언가를 생산해 내는 것으로 생각했다.","chunks":[["Heidegger thought of technology","Heidegger는 기술을 ~로 생각했다"],["as a 'bringing-forth',","'앞으로 이끌어내기'로,"],["something that produces something.","무언가를 생산해 내는 것."]]},{"en":"Interestingly enough, the Latin combination of pro and ducere in the word production also refers to something that can be called \"bringing forth' (pro=forward and ducere=to lead).","ko":"매우 흥미롭게도, 생산이라는 단어에 있는 라틴어의 pro와 ducere의 조합 또한 '앞으로 이끌어내기'라고 부를 수 있는 것을 가리킨다.","chunks":[["Interestingly enough,","매우 흥미롭게도,"],["the Latin combination of pro and ducere","라틴어의 pro와 ducere의 조합"],["in the word production","생산이라는 단어에 있는"],["also refers to something","또한 ~을 가리킨다"],["that can be called \"bringing forth'","'앞으로 이끌어내기'라고 부를 수 있는"],["(pro=forward and ducere=to lead).","(pro = 앞으로, 그리고 ducere = 이끌다)."]]},{"en":"Technology, then, is deeply connected to the production of knowledge, and hence to epistemology.","ko":"그렇다면, 기술은 지식의 생산과 깊이 연결되어 있으며, 따라서 인식론과도 깊이 연결되어 있다.","chunks":[["Technology, then, is deeply connected to","그렇다면 기술은 ~과 깊이 연결되어 있다"],["the production of knowledge,","지식의 생산,"],["and hence to epistemology.","그리고 따라서 인식론과도."]]},{"en":"This is not only because the more administrative pedagogical technologies used in teaching and learning bring with them tools for efficiency in educational spheres.","ko":"이는 교수와 학습에 사용되는 더 많은 관리용 교육 기술들이 교육 영역에서의 효율성을 위한 도구들을 함께 가져오기 때문만은 아니다.","chunks":[["This is not only because","이는 ~ 때문만은 아니다"],["the more administrative pedagogical technologies","더 많은 관리용 교육 기술들이"],["used in teaching and learning","교수와 학습에 사용되는"],["bring with them tools","도구들을 함께 가져온다"],["for efficiency in educational spheres.","교육 영역에서의 효율성을 위한."]]},{"en":"It is also connected to the critique of technology and its critical uses, that is, the deeper penetration of technological processes that help us be aware of the worlds (in the phenomenological sense) we inhabit, be it in the observation of new technologies of seeing or those of hearing.","ko":"그것은 또한 기술에 대한 비판적 분석과 그것의 비판적 활용, 즉 새로운 시각 기술의 관찰에서든 청각 기술의 관찰에서든, 우리가 거주하는 (현상학적 의미에서의) 세계를 인식하는 데 도움이 되는 기술 과정에 대한 더 깊은 통찰과도 연결되어 있다.","chunks":[["It is also connected to","그것은 또한 ~과 연결되어 있다"],["the critique of technology and its critical uses,","기술과 그것의 비판적 활용에 대한 비판적 분석,"],["that is,","즉,"],["the deeper penetration of technological processes","기술 과정에 대한 더 깊은 통찰"],["that help us be aware of the worlds","우리가 세계를 인식하는 데 도움이 되는"],["(in the phenomenological sense)","(현상학적 의미에서의)"],["we inhabit,","우리가 거주하는,"],["be it in the observation of new technologies of seeing","새로운 시각 기술의 관찰에서든"],["or those of hearing.","또는 청각 기술의 그것(관찰)에서든."]]}],"metaphor":"<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에 가려진 영역을 표현하는 점선 박스와 물음표가 있고, 가운데 bringing-forth 화살표가 pro와 ducere 어원 라벨과 함께 표시되어 있으며, 오른쪽에 드러난 세계를 나타내는 실선 박스 안에 시각·청각 차원과 효율 도구·비판적 인식 두 측면이 배치된 그림\">\n  <!-- 좌측: 가려진 영역 (Hidden) -->\n  <g transform=\"translate(15, 30)\">\n    <text x=\"100\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">가려진 / 잠재된 영역</text>\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"165\" fill=\"#f6f6f6\" fill-opacity=\"0.5\" stroke=\"#999\" stroke-width=\"1.6\" stroke-dasharray=\"6 4\"/>\n    \n    <!-- 물음표 + 가려진 객체들 -->\n    <g transform=\"translate(100, 50)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"40\" text-anchor=\"middle\" fill=\"#999\" opacity=\"0.6\">?</text>\n    </g>\n    \n    <!-- 흐릿한 객체 윤곽들 -->\n    <g opacity=\"0.45\">\n      <circle cx=\"50\" cy=\"100\" r=\"14\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <rect x=\"125\" y=\"90\" width=\"30\" height=\"22\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <polygon points=\"80,130 95,115 110,130 95,145\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n    </g>\n    \n    <text x=\"100\" y=\"155\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">not yet revealed</text>\n  </g>\n\n  <!-- 가운데: bringing-forth 어원 + 화살표 -->\n  <g transform=\"translate(225, 30)\">\n    <!-- 어원 박스 -->\n    <rect x=\"0\" y=\"0\" width=\"150\" height=\"58\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <text x=\"75\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">bringing-forth</text>\n    <line x1=\"20\" y1=\"20\" x2=\"130\" y2=\"20\" stroke=\"#c8102e\" stroke-width=\"0.6\" opacity=\"0.4\"/>\n    <text x=\"75\" y=\"34\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">Latin: <tspan font-weight=\"700\" fill=\"#c8102e\">pro</tspan> + <tspan font-weight=\"700\" fill=\"#c8102e\">ducere</tspan></text>\n    <text x=\"75\" y=\"48\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">= forward + to lead</text>\n    \n    <!-- 큰 화살표 (좌→우) -->\n    <g transform=\"translate(75, 95)\">\n      <line x1=\"-65\" y1=\"0\" x2=\"65\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"2.5\"/>\n      <polygon points=\"65,0 55,-7 55,7\" fill=\"#c8102e\"/>\n    </g>\n    \n    <text x=\"75\" y=\"118\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">앞으로 이끌어내기 = 산출</text>\n    \n    <!-- 연결: 지식 생산·인식론 -->\n    <g transform=\"translate(0, 135)\">\n      <rect x=\"0\" y=\"0\" width=\"150\" height=\"50\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"75\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">technology</text>\n      <text x=\"75\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">↓ deeply connected</text>\n      <text x=\"75\" y=\"42\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">knowledge · epistemology</text>\n    </g>\n  </g>\n\n  <!-- 우측: 드러난 세계 -->\n  <g transform=\"translate(385, 30)\">\n    <text x=\"100\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">드러난 세계 — Worlds We Inhabit</text>\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"165\" fill=\"#f0faf3\" fill-opacity=\"0.45\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    \n    <!-- 거주하는 세계 (집 + 사람) -->\n    <g transform=\"translate(100, 50)\">\n      <!-- 집 -->\n      <polygon points=\"-25,0 0,-22 25,0\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <rect x=\"-22\" y=\"0\" width=\"44\" height=\"32\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <rect x=\"-5\" y=\"12\" width=\"10\" height=\"20\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n      <!-- 사람 (안에서) -->\n      <g transform=\"translate(-12, 15)\">\n        <circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n        <line x1=\"0\" y1=\"3\" x2=\"0\" y2=\"12\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n      </g>\n      <text x=\"0\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">we inhabit</text>\n    </g>\n    \n    <!-- 두 측면 (효율 + 비판적·현상학적) -->\n    <!-- 좌측: 효율 도구 -->\n    <g transform=\"translate(10, 95)\">\n      <rect x=\"0\" y=\"0\" width=\"85\" height=\"38\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"42\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">tools for</text>\n      <text x=\"42\" y=\"26\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">efficiency</text>\n    </g>\n    <!-- 우측: 비판적·현상학적 인식 -->\n    <g transform=\"translate(105, 95)\">\n      <rect x=\"0\" y=\"0\" width=\"85\" height=\"38\" fill=\"#f0faf3\" fill-opacity=\"0.7\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <text x=\"42\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">critical +</text>\n      <text x=\"42\" y=\"26\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">phenomenological</text>\n    </g>\n    \n    <!-- 감각 차원 (시각·청각) -->\n    <g transform=\"translate(15, 142)\">\n      <!-- 눈 (시각) -->\n      <ellipse cx=\"20\" cy=\"6\" rx=\"14\" ry=\"6\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <circle cx=\"20\" cy=\"6\" r=\"3\" fill=\"#1FA34A\"/>\n      <text x=\"20\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">seeing</text>\n      \n      <!-- 귀 (청각) -->\n      <g transform=\"translate(95, 0)\">\n        <path d=\"M 14 -2 Q 22 -2 22 6 Q 22 14 14 14 Q 8 14 7 9 Q 8 6 11 6 Q 14 6 14 9\" \n              fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <text x=\"14\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">hearing</text>\n      </g>\n      \n      <text x=\"160\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">all senses</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">technology → bringing-forth → deeper insight into the worlds we inhabit</text>\n</svg>","caption":"가려진 영역 → bringing-forth(pro+ducere) → 드러난 세계 (시각·청각 차원)"},{"no":"12","title":"Fan Editors","ktitle":"팬 편집자의 정보 찾기와 장벽","field":"미디어·정보","page":"05강 Ex.12","oneline":"팬 편집자는 정확·집중적이라 신뢰받는 ‘전문 자료’를 찾아 쓴다.","tldr":["팬 편집자는 정확·집중적이라 신뢰받는 ‘전문 자료’를 찾아 쓴다.","대개 개별로, 때론 (정보 부족 시) 자발적으로 협업한다.","공통 장벽: 유료벽·링크 소멸·언어 장벽·‘최신 편향(옛 자료 찾기 어려움)’."],"analogy":"덕질 정보를 모으는 편집자들은 ‘믿을 만한 출처’를 파고들죠. 그런데 유료 페이지, 깨진 링크, 외국어, ‘옛날 자료가 안 검색됨’ 같은 벽에 자주 부딪혀요.","bg":"팬 편집자(fan editors)가 신뢰할 ‘전문 자료’를 개별·협업으로 찾는 방식과, 유료벽·링크 소멸·언어·최신 편향 등 공통 정보 장벽을 정리한 글이에요.","flow":[{"kind":"출처","t":"정확·집중적이라 신뢰받는 ‘전문 자료’를 찾아 씀"},{"kind":"방식","t":"대개 개별 / 때론 정보 부족 시 ‘자발적 협업’"},{"kind":"장벽","t":"유료벽·링크 소멸·언어 장벽"},{"kind":"한계","t":"‘최신 편향(recentism)’ — 디지털 이전 자료 찾기 어려움"}],"quiz":[["팬 편집자가 ‘전문 자료’를 찾는 이유는?","정확성과 집중적 다룸으로 평판이 높아 권위 있다고 여겨지기 때문이에요."],["그들이 겪는 공통 정보 장벽은?","유료벽, 링크 소멸(link rot), 언어 장벽, 그리고 옛(디지털 이전) 자료를 찾기 힘든 ‘최신 편향’이에요."],["핵심 한 문장?","팬 편집자는 신뢰할 전문 자료를 개별·협업으로 찾지만, 유료벽·링크 소멸·언어·최신 편향 같은 장벽에 부딪힌다."]],"vocab":[["fan editor","팬 편집자"],["consult","참고하다·조회하다"],["specialist","전문의·전문가"],["track down","추적하다·찾아내다"],["authoritative","권위 있는·믿을 만한"],["reputation","명성·평판"],["accuracy","정확성"]],"en":"Fan editors often consult \"specialist sources\" to track down information about their media interests). These works are considered authoritative due to their reputation for accuracy and focused coverage, and after sufficient \"enculturation,\" fan editors will often learn to seek out these sources whenever an information need arises. While fan editors usually seek information individually, they will sometimes collaborate with others who share their taste in media. This collaboration tends to emerge spontaneously, often in response to a lack of accessible information, and it usually occurs within established groups of editors. And regardless of whether information seeking is done individually or collaboratively, fan editors commonly face several key informational barriers. Paywalled sources, for instance, often block off content, and link rot can hinder an editor's ability to locate information. Language barriers can also hinder editors, leading some to use machine translation tools or to seek help from multilingual colleagues. Finally, the issue of \"recentism\" often makes it difficult for fan editors to find pre-digital sources.","ko":"팬 편집자들은 미디어와 관련된 자신의 관심사에 대한 정보를 추적하기 위해 자주 '전문 출처'를 참고한다. 이러한 출처는 정확성과 집중적인 취급 범위에 대한 그들의 평판 때문에 권위 있는 것으로 간주되며, 충분한 '문화 적응' 후에, 팬 편집자들은 정보 필요가 발생할 때마다 이러한 출처를 찾아내는 법을 자주 익히게 될 것이다. 팬 편집자들은 대개 개별적으로 정보를 찾지만, 그들은 때때로 미디어 취향을 공유하는 다른 사람들과 협업할 것이다. 이러한 협업은 흔히 이용 가능한 정보의 부족에 대한 반응으로 자발적으로 나타나는 경향이 있으며, 그것은 대개 기존의 편집자 집단 내에서 일어난다. 그리고 정보 탐색이 개별적으로 이루어지든 협업을 통해 이루어지든 관계없이, 팬 편집자들은 흔히 몇 가지 주요 정보 장벽에 직면한다. 예를 들어, 유료화된 출처는 콘텐츠를 자주 차단하고, 링크 로트(시간이 지나면서 링크가 끊어지는 현상)는 편집자의 정보를 찾는 능력을 방해할 수 있다. 언어 장벽도 편집자를 방해하여, 일부는 기계 번역 도구를 사용하거나 여러 언어를 사용하는 동료에게 도움을 청해야 할 수도 있다. 마지막으로, '최근주의(recentism)'의 문제는 흔히 팬 편집자들이 디지털 이전 시대의 자료를 찾는 것을 어렵게 만든다.","read":[{"en":"Fan editors often consult \"specialist sources\" to track down information about their media interests).","ko":"팬 편집자들은 미디어와 관련된 자신의 관심사에 대한 정보를 추적하기 위해 자주 '전문 출처'를 참고한다.","chunks":[["Fan editors often consult","팬 편집자들은 자주 ~을 참고한다"],["\"specialist sources\"","'전문 출처'를"],["to track down information","정보를 추적하기 위해"],["about their media interests).","미디어 관련 자신의 관심사에 대한."]]},{"en":"These works are considered authoritative due to their reputation for accuracy and focused coverage, and after sufficient \"enculturation,\" fan editors will often learn to seek out these sources whenever an information need arises.","ko":"이러한 출처는 정확성과 집중적인 취급 범위에 대한 그들의 평판 때문에 권위 있는 것으로 간주되며, 충분한 '문화 적응' 후에, 팬 편집자들은 정보 필요가 발생할 때마다 이러한 출처를 찾아내는 법을 자주 익히게 될 것이다.","chunks":[["These works are considered authoritative","이러한 출처는 권위 있는 것으로 간주된다"],["due to their reputation","그들의 평판 때문에"],["for accuracy and focused coverage,","정확성과 집중적인 취급 범위에 대한,"],["and after sufficient \"enculturation ff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <line x1=\"0\" y1=\"3\" x2=\"0\" y2=\"9\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      </g>\n      <g transform=\"translate(40, 28)\">\n        <circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <line x1=\"0\" y1=\"3\" x2=\"0\" y2=\"9\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      </g>\n      <g transform=\"translate(50, 28)\">\n        <circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <line x1=\"0\" y1=\"3\" x2=\"0\" y2=\"9\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      </g>\n      <text x=\"115\" y=\"33\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">when info lacks · within group</text>\n    </g>\n    \n    <text x=\"180\" y=\"62\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">regardless of method · same barriers</text>\n  </g>\n\n  <!-- 하단: 4가지 정보 장벽 -->\n  <g transform=\"translate(15, 145)\">\n    <text x=\"285\" y=\"-3\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">4가지 정보 장벽 — Information Barriers</text>\n    \n    <!-- 장벽 ① 유료화 -->\n    <g transform=\"translate(0, 8)\">\n      <rect x=\"0\" y=\"0\" width=\"135\" height=\"78\" fill=\"#fdf2f4\" fill-opacity=\"0.35\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"14\" y=\"15\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"10\" fill=\"#c8102e\">①</text>\n      <text x=\"67\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">paywall</text>\n      <!-- 자물쇠 + $ -->\n      <g transform=\"translate(67, 40)\">\n        <rect x=\"-12\" y=\"-2\" width=\"24\" height=\"18\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n        <path d=\"M -7 -2 L -7 -8 Q -7 -13 0 -13 Q 7 -13 7 -8 L 7 -2\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n        <text x=\"0\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">$</text>\n      </g>\n      <text x=\"67\" y=\"71\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">유료화 차단</text>\n    </g>\n    \n    <!-- 장벽 ② 링크 로트 -->\n    <g transform=\"translate(145, 8)\">\n      <rect x=\"0\" y=\"0\" width=\"135\" height=\"78\" fill=\"#fdf2f4\" fill-opacity=\"0.35\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"14\" y=\"15\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"10\" fill=\"#c8102e\">②</text>\n      <text x=\"67\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">link rot</text>\n      <!-- 끊어진 체인 링크 -->\n      <g transform=\"translate(67, 40)\">\n        <!-- 왼쪽 링크 -->\n        <ellipse cx=\"-12\" cy=\"0\" rx=\"7\" ry=\"5\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.5\" transform=\"rotate(20 -12 0)\"/>\n        <!-- 오른쪽 링크 -->\n        <ellipse cx=\"12\" cy=\"0\" rx=\"7\" ry=\"5\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.5\" transform=\"rotate(-20 12 0)\"/>\n        <!-- 끊김 표시 (X) -->\n        <line x1=\"-3\" y1=\"-3\" x2=\"3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <line x1=\"3\" y1=\"-3\" x2=\"-3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      </g>\n      <text x=\"67\" y=\"71\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">링크 끊김</text>\n    </g>\n    \n    <!-- 장벽 ③ 언어 장벽 -->\n    <g transform=\"translate(290, 8)\">\n      <rect x=\"0\" y=\"0\" width=\"135\" height=\"78\" fill=\"#fdf2f4\" fill-opacity=\"0.35\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"14\" y=\"15\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"10\" fill=\"#c8102e\">③</text>\n      <text x=\"67\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">language</text>\n      <!-- 두 말풍선 -->\n      <g transform=\"translate(67, 40)\">\n        <ellipse cx=\"-14\" cy=\"0\" rx=\"10\" ry=\"7\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n        <text x=\"-14\" y=\"2.5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">EN</text>\n        <ellipse cx=\"14\" cy=\"0\" rx=\"10\" ry=\"7\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n        <text x=\"14\" y=\"2.5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">FR</text>\n        <!-- 차단 -->\n        <line x1=\"-5\" y1=\"0\" x2=\"5\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n        <line x1=\"-2\" y1=\"-3\" x2=\"2\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      </g>\n      <text x=\"67\" y=\"71\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">언어 장벽</text>\n    </g>\n    \n    <!-- 장벽 ④ recentism -->\n    <g transform=\"translate(435, 8)\">\n      <rect x=\"0\" y=\"0\" width=\"135\" height=\"78\" fill=\"#fdf2f4\" fill-opacity=\"0.35\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"14\" y=\"15\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"10\" fill=\"#c8102e\">④</text>\n      <text x=\"67\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">recentism</text>\n      <!-- 시간축: 과거 ←→ 현재. 과거는 X 차단 -->\n      <g transform=\"translate(67, 40)\">\n        <line x1=\"-30\" y1=\"0\" x2=\"30\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <polygon points=\"30,0 24,-4 24,4\" fill=\"#1a1a1a\"/>\n        <!-- 과거 (좌측, 차단) -->\n        <text x=\"-25\" y=\"-6\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\">pre-digital</text>\n        <g transform=\"translate(-25, 2)\">\n          <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n          <line x1=\"-3\" y1=\"-3\" x2=\"3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n          <line x1=\"3\" y1=\"-3\" x2=\"-3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n        </g>\n        <!-- 현재 -->\n        <text x=\"25\" y=\"-6\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\">digital</text>\n        <circle cx=\"25\" cy=\"2\" r=\"3\" fill=\"#1FA34A\"/>\n      </g>\n      <text x=\"67\" y=\"71\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">과거 자료 부재</text>\n    </g>\n  </g>\n</svg>","caption":"상단:두 탐색 방식(개별/협업·조건부) + 하단:네 정보 장벽"}]};

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">B</span>
      <span class="tname">핵심 요약</span>
      <span class="thint">— 읽고 나서 핵심 정리</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg && !d.analogy) return '';
  const bg = d.bg ? `<p class="callout bg">${d.bg}</p>` : '';
  const analogy = d.analogy ? `<p class="callout analogy"><b>비유로 보면</b><br>${d.analogy}</p>` : '';
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">A</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 배경 개념과 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${bg}${analogy}</div>
  </details>`;
}

function renderFlow(d) {function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">논리 흐름</span>
      <span class="thint">— 글의 전개</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderBG(d);
  html += renderTLDR(d);
  html += renderFlow(d);
  html += renderQuiz(d);
  html += renderRead(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

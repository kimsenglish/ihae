<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 올림포스 영어독해기본1 Unit 11 (3지문)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   올림포스 영어독해기본1 Unit 11 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>

<div class="wrap">

<!-- 학원 브랜드 헤더 -->

  <div class="b-title">

  </div>
  <div class="b-meta">

    <span class="en">KIM KA YOUNG ENGLISH</span>

</header>

<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">

  <span class="pub">published by warm &amp; wise books</span>
</footer>

<script>
/* ============================================================
   데이터 (P.data) — 올림포스 영어독해기본1 Unit 11 5개 지문

 [["★pessimist", "비관론자"], ["avoid", "피하다"], ["◇move the goalposts", "(자기에게 유리하게) 기준을 바꾸다"], ["doomer", "운명론자, 종말론자"], ["predict", "예측하다"], ["shift", "바꾸다, 옮기다"], ["biologist", "생물학자"], ["decade", "10년"], ["utter", "완전한, 전적인"], ["breakdown", "붕괴, 와해"], ["capacity", "능력, 수용력"], ["support", "지탱하다, 부양하다"], ["humanity", "인류"], ["terribly", "정말, 몹시"], ["◇have another go", "다시 한 번 시도하다"], ["deadline", "기한, 시한"], ["pessimistic", "비관적인"], ["stance", "자세, 입장"]], "quiz": [["이 지문의 핵심 구조는?", "화살 빗나감 → 골대를 옮김 → '맞춤' — moving the goalposts"], ["도식이 강조하는 결론은?", "비관론자는 예측이 빗나갈 때마다 '골대(기준)를 옮겨' 틀림을 피하므로, 비관적 자세는 결코 반증되지 않는 '안전한' 입장처럼 보인다."]], "en": "The reason pessimists often sound smart is that they can avoid being 'wrong' by moving the goalposts. When a doomer predicts that the world will end in five years, and it doesn't, they just shift the date. The American biologist Paul R. Ehrlich ─ author of the 1968 book The Population Bomb ─ has been doing this for decades. In 1970 he said that 'sometime in the next 15 years, the end will come. And by \"the end\" I mean an utter breakdown of the capacity of the planet to support humanity.' Of course, that was terribly wrong. He had another go: he said that 'England will not exist in the year 2000.' Wrong again. Ehrlich will keep pushing this deadline back. A pessimistic stance is a safe one.", "ko": "비관론자들이 종종 현명하게 '들리는' 이유는 골대를 옮김으로써 '틀림'을 피할 수 있기 때문이다. 어떤 운명론자가 5년 내에 세상이 끝날 것이라고 예측하지만 그렇지 않다면, 그들은 그저 날짜를 바꾼다. 1968년 저서 The Population Bomb의 저자인 미국의 생물학자 Paul R. Ehrlich는 수십 년 동안 이렇게 해 오고 있다. 1970년에 그는 '앞으로 15년 내에 언젠가, 종말이 올 것이다. 그리고 나는 '종말'이란 인류를 지탱할 수 있는 지구 능력의 완전한 붕괴를 의미한다'라고 말했다. 물론 그것은 정말 틀렸다. 그는 다시 한 번 했는데, '영국은 2000년에 존재하지 않을 것이다'라고 말했다. 또 틀렸다. Ehrlich는 이 시한을 계속 뒤로 미룰 것이다. 비관적 자세는 안전한 것이다.", "read": [{"en": "The reason pessimists often sound smart is that they can avoid being 'wrong' by moving the goalposts.", "ko": "비관론자들이 종종 현명하게 '들리는' 이유는 골대를 옮김으로써 '틀림'을 피할 수 있기 때문이다.", "chunks": [["The reason pessimists often sound smart", "비관론자들이 종종 똑똑하게 들리는 이유는"], ["is that they can avoid being 'wrong'", "그들이 '틀림'을 피할 수 있기 때문이다"], ["by moving the goalposts.", "골대를 옮김으로써"]]}, {"en": "When a doomer predicts that the world will end in five years, and it doesn't, they just shift the date.", "ko": "어떤 운명론자가 5년 내에 세상이 끝날 것이라고 예측하지만 그렇지 않다면, 그들은 그저 날짜를 바꾼다.", "chunks": [["When a doomer predicts", "어떤 운명론자가 예측할 때"], ["that the world will end in five years,", "세상이 5년 내에 끝날 것이라고,"], ["and it doesn't,", "그런데 그렇지 않으면,"], ["they just shift the date.", "그들은 그저 날짜를 바꾼다."]]}, {"en": "The American biologist Paul R. Ehrlich ─ author of the 1968 book The Population Bomb ─ has been doing this for decades.", "ko": "1968년 저서 The Population Bomb의 저자인 미국의 생물학자 Paul R. Ehrlich는 수십 년 동안 이렇게 해 오고 있다.", "chunks": [["The American biologist Paul R. Ehrlich ─", "미국의 생물학자 Paul R. Ehrlich는 ─"], ["author of the 1968 book The Population Bomb ─", "1968년 저서 The Population Bomb의 저자인 ─"], ["has been doing this for decades.", "수십 년 동안 이것을 해 오고 있다."]]}, {"en": "In 1970 he said that 'sometime in the next 15 years, the end will come. And by \"the end\" I mean an utter breakdown of the capacity of the planet to support humanity.'", "ko": "1970년에 그는 '앞으로 15년 내에 언젠가, 종말이 올 것이다. 그리고 나는 '종말'이란 인류를 지탱할 수 있는 지구 능력의 완전한 붕괴를 의미한다'라고 말했다.", "chunks": [["In 1970 he said that", "1970년에 그는 말했다"], ["'sometime in the next 15 years, the end will come.", "'앞으로 15년 내 언젠가, 종말이 올 것이다."], ["And by \"the end\" I mean an utter breakdown", "그리고 '종말'이란 완전한 붕괴를 의미한다"], ["of the capacity of the planet to support humanity.'", "인류를 지탱하는 지구 능력의'"]]}, {"en": "Of course, that was terribly wrong.", "ko": "물론 그것은 정말 틀렸다.", "chunks": [["Of course,", "물론,"], ["that was terribly wrong.", "그것은 정말 틀렸다."]]}, {"en": "He had another go: he said that 'England will not exist in the year 2000.'", "ko": "그는 다시 한 번 했는데, '영국은 2000년에 존재하지 않을 것이다'라고 말했다.", "chunks": [["He had another go:", "그는 다시 한 번 했다:"], ["he said that 'England will not exist in the year 2000.'", "그는 '영국은 2000년에 존재하지 않을 것이다'라고 말했다."]]}, {"en": "Wrong again.", "ko": "또 틀렸다.", "chunks": [["Wrong again.", "또 틀렸다."]]}, {"en": "Ehrlich will keep pushing this deadline back.", "ko": "Ehrlich는 이 시한을 계속 뒤로 미룰 것이다.", "chunks": [["Ehrlich will keep pushing", "Ehrlich는 계속 미룰 것이다"], ["this deadline back.", "이 시한을 뒤로."]]}, {"en": "A pessimistic stance is a safe one.", "ko": "비관적 자세는 안전한 것이다.", "chunks": [["A pessimistic stance", "비관적인 자세는"], ["is a safe one.", "안전한 것이다."]]}]}, {"no": "2", "title": "Why We Understand Differently", "ktitle": "새 이야기 → 기억 라이브러리에서 가장 가까운 script 찾기 → 예상·이해", "field": "인지·해석", "page": "Unit11 no.03", "oneline": "사람마다 이해가 다른 이유는 기억이 다르기 때문이며, 이해란 기억 속 가장 가까운 항목(=올바른 knowledge structure / script)을 찾아 그것으로 새 사건을 해석하는 과정이다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에 들어오는 새 이야기 카드가 가운데 기억 라이브러리의 여러 script 박스(wedding, restaurant, cocktail party, job interview, funeral) 중 cocktail party 박스를 가장 가까운 항목으로 찾아 초록으로 강조하고, 오른쪽에서 그 script가 예상을 만들어 이야기를 이해하는 흐름. 하단에 사람마다 기억 라이브러리가 달라 이해도 달라진다는 결론.\">\n\n  <!-- 상단 흐름: 좌 → 중 → 우 -->\n  \n  <!-- 좌측: new story 입력 -->\n  <g transform=\"translate(15, 25)\">\n    <text x=\"65\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">새 이야기</text>\n    <!-- 입력 카드 -->\n    <g transform=\"translate(10, 12)\">\n      <rect x=\"0\" y=\"0\" width=\"110\" height=\"130\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 따옴표 표시 -->\n      <text x=\"8\" y=\"22\" font-family=\"Noto Serif\" font-size=\"20\" font-weight=\"700\" fill=\"#999\">\"</text>\n      <text x=\"11\" y=\"42\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\">I went to</text>\n      <text x=\"11\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\">a cocktail</text>\n      <text x=\"11\" y=\"68\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\">party last</te late(168, 72)\">\n      <rect x=\"0\" y=\"0\" width=\"72\" height=\"40\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"1.1\"/>\n      <text x=\"36\" y=\"18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\" font-weight=\"700\">birthday</text>\n      <text x=\"36\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#999\">script</text>\n    </g>\n\n    <!-- 선택 화살표 (점선) — cocktail party 박스로 -->\n    <path d=\"M 125 64 L 125 70\" stroke=\"#1FA34A\" stroke-width=\"1.8\" stroke-dasharray=\"2 2\"/>\n    <text x=\"125\" y=\"135\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">closest match</text>\n  </g>\n\n  <!-- 중→우 화살표 (초록) -->\n  <line x1=\"430\" y1=\"100\" x2=\"455\" y2=\"100\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n  <polygon points=\"455,100 447,95 447,105\" fill=\"#1FA34A\"/>\n  <text x=\"442\" y=\"93\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">apply</text>\n\n  <!-- 우측: 예상 → 이해 -->\n  <g transform=\"translate(460, 25)\">\n    <text x=\"65\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">예상 → 이해</text>\n\n    <!-- 예상 박스 (작은 항목) -->\n    <g transform=\"translate(0, 16)\">\n      <rect x=\"0\" y=\"0\" width=\"130\" height=\"92\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"8\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" fill=\"#1FA34A\" letter-spacing=\"0.1em\">EXPECT:</text>\n      <text x=\"8\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" fill=\"#1a1a1a\">· drinks</text>\n      <text x=\"8\" y=\"45\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" fill=\"#1a1a1a\">· small talk</text>\n      <text x=\"8\" y=\"58\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" fill=\"#1a1a1a\">· mingling</text>\n      <text x=\"8\" y=\"71\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" fill=\"#1a1a1a\">· canapés</text>\n      <text x=\"65\" y=\"85\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">→ what happens</text>\n    </g>\n    \n    <!-- 결과 -->\n    <g transform=\"translate(65, 128)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">UNDERSTOOD ✓</text>\n    </g>\n  </g>\n\n  <!-- 하단: 다른 기억 = 다른 이해 -->\n  <g transform=\"translate(15, 187)\">\n    <rect x=\"0\" y=\"0\" width=\"570\" height=\"65\" rx=\"5\" fill=\"#fdf2f4\" fill-opacity=\"0.4\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n    <text x=\"14\" y=\"18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" fill=\"#c8102e\" letter-spacing=\"0.12em\">BUT — DIFFERENT PEOPLE</text>\n    <text x=\"285\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">different memory libraries → different scripts → different understandings</text>\n    <text x=\"285\" y=\"56\" font-family=\"Noto Serif KR\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">사람마다 라이브러리가 달라 — 같은 이야기도 다르게 이해된다</text>\n  </g>\n</svg>", "caption": "새 이야기 → 기억 라이브러리에서 가장 가까운 script 찾기 → 예상·이해", "tldr": ["사람마다 이해가 다른 이유는 기억이 다르기 때문이며, 이해란 기억 속 가장 가까운 항목(=올바른 knowledge structure / script)을 찾아 그것으로 새 사건을 해석하는 과정이다.", "새 이야기 → 기억 라이브러리에서 가장 가까운 script 찾기 → 예상·이해"], "bg": "분야는 인지·해석이에요. 핵심 — 사람마다 이해가 다른 이유가 ‘기억의 차이’라는 것. → ‘이해’가 기억 속 무엇과 연결되는 일인지에 주목하며 읽으세요.", "flow": [], "analogy": "", "vocab": [["obvious", "명백한, 분명한"], ["◇relate to", "~와 관련되다"], ["★knowledge structure", "지식 구조"], ["claim", "주장하다"], ["require", "요구하다, 필요로 하다"], ["create", "만들어 내다"], ["expectation", "예상, 기대"], ["◇take place", "일어나다, 발생하다"], ["◇in terms of", "~의 관점에서"], ["normal", "일반적인, 정상적인"], ["★script", "(상황) 대본, 각본"], ["◇bring out", "끌어내다, 꺼내다"], ["ordinarily", "보통, 일반적으로"], ["guide", "안내하다, 이끌다"], ["◇be about to", "막 ~하려 하다"]], "quiz": [["이 지문의 핵심 구조는?", "새 이야기 → 기억 라이브러리에서 가장 가까운 script 찾기 → 예상·이해"], ["도식이 강조하는 결론은?", "사람마다 이해가 다른 이유는 기억이 다르기 때문이며, 이해란 기억 속 가장 가까운 항목(=올바른 knowledge structure / script)을 찾아 그것으로 새 사건을 해석하는 과정이다."]], "en": "We all understand differently ─ this much is obvious. The reason we understand differently is that our memories are different. Our experiences simply are not yours. In order to understand anything, we must find the closest item in memory to which it relates. Schank and Abelson claimed that understanding required one to find the correct knowledge structure, and to use that structure to create expectations for what events were likely to take place, so that new events could be understood in terms of what was normal. Thus, when a story about a cocktail party was being told, an understander brought out his cocktail party script which told him about what ordinarily happens at cocktail parties, and he used that script to guide his understanding of the story he was about to hear.", "ko": "우리는 모두 다르게 이해하는데, 이 점만큼은 명백하다. 우리가 다르게 이해하는 이유는 우리의 기억이 다르기 때문이다. 우리의 경험은 절대로 여러분의 경험이 아니다. 어떤 것을 이해하기 위해서, 우리는 기억에서 그것과 관련된 가장 가까운 항목을 찾아야 한다. Schank와 Abelson은, 이해는 한 사람에게 올바른 지식 구조를 찾고, 그 구조를 사용하여 어떤 사건이 일어날지에 대한 예측을 하도록 요구하며, 그럼으로써 새로운 사건이 일반적인 것의 관점에서 이해될 수 있다고 주장했다. 그러므로, 칵테일파티에 관한 이야기를 들을 때, 이해자는 칵테일파티에서 일반적으로 일어나는 것에 대해 그에게 말해 주는 칵테일파티 대본을 끌어내서, 그가 막 들으려 하는 이야기의 이해를 안내하도록 그 대본을 사용했다.", "read": [{"en": "We all understand differently ─ this much is obvious.", "ko": "우리는 모두 다르게 이해하는데, 이 점만큼은 명백하다.", "chunks": [["We all understand differently ─", "우리는 모두 다르게 이해한다 ─"], ["this much is obvious.", "이 점만큼은 명백하다."]]}, {"en": "The reason we understand differently is that our memories are different.", "ko": "우리가 다르게 이해하는 이유는 우리의 기억이 다르기 때문이다.", "chunks": [["The reason we understand differently", "우리가 다르게 이해하는 이유는"], ["is that our memories are different.", "우리의 기억이 다르기 때문이다."]]}, {"en": "Our experiences simply are not yours.", "ko": "우리의 경험은 절대로 여러분의 경험이 아니다.", "chunks": [["Our experiences simply are not yours.", "우리의 경험은 절대로 여러분의 것이 아니다."]]}, {"en": "In order to understand anything, we must find the closest item in memory to which it relates.", "ko": "어떤 것을 이해하기 위해서, 우리는 기억에서 그것과 관련된 가장 가까운 항목을 찾아야 한다.", "chunks": [["In order to understand anything,", "무엇이든 이해하기 위해서,"], ["we must find the closest item in memory", "우리는 기억에서 가장 가까운 항목을 찾아야 한다"], ["to which it relates.", "그것이 관련되는"]]}, {"en": "Schank and Abelson claimed that understanding required one to find the correct knowledge structure, and to use that structure to create expectations for what events were likely to take place, so that new events could be understood in terms of what was normal.", "ko": "Schank와 Abelson은, 이해는 한 사람에게 올바른 지식 구조를 찾고, 그 구조를 사용하여 어떤 사건이 일어날지에 대한 예측을 하도록 요구하며, 그럼으로써 새로운 사건이 일반적인 것의 관점에서 이해될 수 있다고 주장했다.", "chunks": [["Schank and Abelson claimed that", "Schank와 Abelson은 주장했다"], ["understanding required one to find the correct knowledge structure,", "이해는 사람에게 올바른 지식 구조를 찾도록 요구한다고,"], ["and to use that structure to create expectations", "그리고 그 구조를 사용해 예상을 만들도록"], ["for what events were likely to take place,", "어떤 사건이 일어날 가능성이 있는지에 대한,"], ["so that new events could be understood", "그래서 새로운 사건이 이해될 수 있도록"], ["in terms of what was normal.", "일반적인 것의 관점에서"]]}, {"en": "Thus, when a story about a cocktail party was being told, an understander brought out his cocktail party script which told him about what ordinarily happens at cocktail parties, and he used that script to guide his understanding of the story he was about to hear.", "ko": "그러므로, 칵테일파티에 관한 이야기를 들을 때, 이해자는 칵테일파티에서 일반적으로 일어나는 것에 대해 그에게 말해 주는 칵테일파티 대본을 끌어내서, 그가 막 들으려 하는 이야기의 이해를 안내하도록 그 대본을 사용했다.", "chunks": [["Thus, when a story about a cocktail party was being told,", "그러므로, 칵테일파티에 관한 이야기가 전해질 때,"], ["an understander brought out his cocktail party script", "이해자는 자신의 칵테일파티 대본을 끌어냈다"], ["which told him about what ordinarily happens at cocktail parties,", "칵테일파티에서 보통 일어나는 일을 그에게 알려 주는,"], ["and he used that script to guide his understanding", "그리고 그는 그 대본을 사용해 이해를 안내했다"], ["of the story he was about to hear.", "막 들으려 하는 이야기의"]]}]}, {"no": "3", "title": "Red: The Colour That Arrests the Eye", "ktitle": "인간: 눈에 띔 = 장점 (소방차·우체통) ↔ 자연: 눈에 띔 = 약점 (Red Admiral만 예외)", "field": "심리·색채", "page": "Unit11 no.04", "oneline": "붉은색은 눈에 가장 강하게 작용하는 색이라 인간은 경고·표시에 적극 사용하지만, 야생 동물에게는 너무 눈에 띄어 위장에 불리하므로 진짜 붉은 종은 거의 없다 — Red Admiral 하나만 예외.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 인간 영역에 소방차·경고등·우체통·적십자가 모두 붉은색으로 그려져 시야 확보의 장점으로 사용되는 모습과, 오른쪽 자연 영역에 적갈색 위장인 Red Squirrel·Red Deer가 회색조로 그려지고 그 위에 진짜 붉은 Red Admiral 나비 한 마리만 두드러지는 대조 그림. 가운데 vs, 하단에 같은 특성이 정반대 결과를 낳는다는 결론.\">\n\n  <!-- 상단 라벨 -->\n  <g transform=\"translate(0, 18)\">\n    <text x=\"145\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">인간 — 눈에 띔 = 장점</text>\n    <text x=\"455\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">자연 — 눈에 띔 = 약점</text>\n  </g>\n\n  <!-- 좌측: 인간 영역 -->\n  <g transform=\"translate(15, 28)\">\n    <rect x=\"0\" y=\"0\" width=\"260\" height=\"155\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    \n    <!-- 1. 소방차 (좌상단) -->\n    <g transform=\"translate(55, 50)\">\n      <!-- 차체 -->\n      <rect x=\"-32\" y=\"-12\" width=\"64\" height=\"22\" fill=\"#c8102e\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 운전석 -->\n      <rect x=\"-32\" y=\"-22\" width=\"20\" height=\"10\" fill=\"#c8102e\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 창문 -->\n      <rect x=\"-29\" y=\"-20\" width=\"14\" height=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-wid 언가를 멀리서도 보이게 하길 원한다면, 우리는 그것을 붉은색으로 칠한다. 야생 동물 중에 정말로 붉은 동물이 거의 없는 것은 아마도 붉은색이 너무 눈에 띄기 때문일 것인데, 심지어 이른바 북방청서나 붉은사슴도 실제로는 드러내 보이기보다는 숨기는 적갈색의 음영이다. 붉은색의 나비도 비교적 거의 없는 편이다. 영국, 그리고 실제로, 모든 유럽 대륙에서, 단 하나의 종만이 핏방울처럼, 완전한 밝은 붉은색의 패턴을 지니고 있는데, 붉은제독나비이다.", "read": [{"en": "Of all the colours of the rainbow the one that makes the greatest impact on the eye is red.", "ko": "무지개의 모든 색 중에서 눈에 가장 큰 영향을 미치는 것은 붉은색이다.", "chunks": [["Of all the colours of the rainbow", "무지개의 모든 색 중에서"], ["the one that makes the greatest impact on the eye", "눈에 가장 큰 영향을 미치는 것은"], ["is red.", "붉은색이다."]]}, {"en": "There is something instantly arresting about the colour of fire and danger.", "ko": "불과 위험의 색에 관한 즉각적으로 시선을 사로잡는 무언가가 있다.", "chunks": [["There is something instantly arresting", "즉각적으로 시선을 사로잡는 무언가가 있다"], ["about the colour of fire and danger.", "불과 위험의 색에 관해."]]}, {"en": "It is charged with alarm and urgency.", "ko": "그것은 경고와 긴급함으로 가득 차 있다.", "chunks": [["It is charged with", "그것은 ~로 가득 차 있다"], ["alarm and urgency.", "경고와 긴급함으로."]]}, {"en": "We have red fire engines, red warning lights and the Red Cross.", "ko": "우리에게는 붉은색 소방차, 붉은색 경고등, 적십자가 있다.", "chunks": [["We have red fire engines,", "우리에게는 붉은색 소방차,"], ["red warning lights and the Red Cross.", "붉은색 경고등, 그리고 적십자가 있다."]]}, {"en": "If we want something to be seen from a distance, such as a post box or (formerly) a telephone kiosk, we paint it red.", "ko": "만일 우리가 우체통이나 (이전에) 공중전화 박스와 같이, 무언가를 멀리서도 보이게 하길 원한다면, 우리는 그것을 붉은색으로 칠한다.", "chunks": [["If we want something to be seen from a distance,", "만일 우리가 무언가를 멀리서 보이게 하고 싶다면,"], ["such as a post box or (formerly) a telephone kiosk,", "우체통이나 (이전의) 공중전화 박스처럼,"], ["we paint it red.", "우리는 그것을 붉은색으로 칠한다."]]}, {"en": "Perhaps it is because red is so obvious that few wild animals are truly red: even the so-called Red Squirrel and the Red Deer are really shades of reddish-brown that conceal rather than advertise.", "ko": "야생 동물 중에 정말로 붉은 동물이 거의 없는 것은 아마도 붉은색이 너무 눈에 띄기 때문일 것인데, 심지어 이른바 북방청서나 붉은사슴도 실 function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

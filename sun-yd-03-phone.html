<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 영어독해연습 03강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   지문 이해 보조 자료 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-phone">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 영어독해연습 03강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 영어독해연습 03강

   ============================================================ */
const P = {"data": [{"no": "1", "title": "p30 (Exercise 1) 지문 ① · Why Low Self-Esteem People Are Less Consistent", "ktitle": "낮은 자존감 = 덜 일관된 자기평가", "field": "심리", "page": "p.30 Ex.1", "oneline": "낮은 자존감은 단지 자기평가가 ‘덜 긍정적’인 게 아니다.", "tldr": ["낮은 자존감은 단지 자기평가가 ‘덜 긍정적’인 게 아니다.", "평가 자체가 ‘덜 일관적’(분산이 큼)이라는 게 핵심이다.", "높은 자존감은 긍정은 강하게 인정·부정은 강하게 거부 — 일관적이다."], "analogy": "확신 있는 사람은 ‘난 이런 사람’이라고 딱 답하지만, 자존감 낮은 사람은 ‘좋기도 하고 아니기도 하고…’ 흔들리죠. 차이는 ‘좋다/나쁘다’만이 아니라 ‘얼마나 일관되냐’예요.", "bg": "분야는 심리예요. 낮은 자존감을 단순히 ‘자기평가가 덜 긍정적인 것’으로 보는 통념이 출발점. → 낮은 자존감이 그 통념과 어떻게 다른지에 주목하며 읽으세요.", "flow": [{"kind": "질문 Q", "t": "낮은 자존감은 ‘부정적’이기만 한 걸까?"}, {"kind": "연구", "t": "Campbell·Fehr 실험", "d": "긍정/부정 형용사 세트로 자기평가를 조사."}, {"kind": "높은 자존감", "t": "강하고 일관되게 평가", "d": "긍정은 인정, 부정은 거부."}, {"kind": "낮은 자존감", "t": "중간적·가변적 평가", "d": "긍정도 부정도 강하게 못 박지 못함 → 분산↑."}, {"kind": "결론", "t": "차이는 ‘긍정성’ + ‘일관성’", "d": "평균뿐 아니라 일관성에서도 갈린다."}], "quiz": [["낮은 자존감의 진짜 특징은 무엇인가?", "단지 평가가 덜 긍정적인 게 아니라, 평가가 ‘덜 일관적’(중간·가변적, 분산이 큼)이라는 점이에요."], ["높은 자존감인 사람의 자기평가는 어떤 모습인가?", "긍정 형용사는 강하게 인정하고 부정 형용사는 강하게 거부 — 즉 일관적이에요."], ["핵심 한 문장?", "자존감 차이는 ‘긍정성(평균)’뿐 아니라 ‘평가의 일관성’에서도 나타난다."]], "vocab": [["self-esteem", "자존감"], ["evidence", "증거"], ["consistent", "일관된"], ["self-description", "자기 기술·자기 묘사"], ["rate", "평가하다"], ["uniformly", "일관되게"], ["endorse", "인정하다·지지하다"], ["scatter", "분산되다·흩어지다"]], "en": "There is evidence that low self-esteem people are less evaluatively consistent in their self-descriptions. When Campbell and Fehr examined how subjects rated themselves on sets of adjectives that were either uniformly positive or uniformly negative, subjects with low self-esteem not only gave ratings that were (on average) less positive or more negative, but their ratings within each set exhibited more individual scatter or greater variance. High self-esteem subjects strongly and consistently endorsed the positive adjectives and rejected the negative adjectives. Low self-esteem subjects did not, in contrast, strongly and consistently endorse the negative adjectives and reject the positive adjectives. Rather, they gave more intermediate ratings and more variable ratings to both types of adjectives. Therefore, it appears that low and high self-esteem individuals differ not only in the average positivity of their self-views, but also in the extent to which their self-views are evaluatively consistent with one another.", "ko": "낮은 자존감을 가진 사람은 자기 기술에서 평가적으로 덜 일관적이라는 증거가 있다. Campbell과 Fehr가 실험 대상자들이 일관되게 긍정적이거나 일관되게 부정적인 형용사 세트로 자신을 어떻게 평가하는지를 조사했을 때, 낮은 자존감을 가진 실험 대상자들은 (평균적으로) 덜 긍정적이거나 더 부정적인 평가를 했을 뿐만 아니라, 각 세트 내에서 그들의 평가는 더 개별적인 산포도나 더 큰 분산을 보였다. 높은 자존감을 가진 실험 대상자들은 강하고 일관되게 긍정적인 형용사를 인정했고 부정적인 형용사를 거부했다. 이와 대조적으로, 낮은 자존감을 가진 실험 대상자들은 부정적인 형용사를 (자신에게 해당하는 것으로) 인정하고 긍정적인 형용사를 거부하는 것을 강하고 일관되게 하지 않았다. 오히려 그들은 두 유형의 형용사 모두에 대해 더 중간적인 평가와 더 가변적인 평가를 내렸다. 그러므로 낮은 자존감과 높은 자존감을 가진 사람은 자기관의 평균적 긍정성에서뿐만 아니라, 자기관이 평가적으로 서로 일관성을 갖는 정도에서도 차이가 있는 것으로 보인다.", "read": [{"en": "There is evidence that low self-esteem people are less evaluatively consistent in their self-descriptions.", "ko": "낮은 자존감을 가진 사람은 자기 기술에서 평가적으로 덜 일관적이라는 증거가 있다.", "chunks": [["There is evidence", "증거가 있다"], ["that low self-esteem people", "낮은 자존감을 가진 사람들이"], ["are less evaluatively consistent", "평가적으로 덜 일관적이라는"], ["in their self-descriptions.", "자기 기술에서."]]}, {"en": "When Campbell and Fehr examined how subjects rated themselves on sets of adjectives that were either uniformly positive or uniformly negative, subjects with low self-esteem not only gave ratings that were (on average) less positive or more negative, but their ratings within each set exhibited more individual scatter or greater variance.", "ko": "Campbell과 Fehr가 실험 대상자들이 일관되게 긍정적이거나 일관되게 부정적인 형용사 세트로 자신을 어떻게 평가하는지를 조사했을 때, 낮은 자존감을 가진 실험 대상자들은 (평균적으로) 덜 긍정적이거나 더 부정적인 평가를 했을 뿐만 아니라, 각 세트 내에서 그들의 평가는 더 개별적인 산포도나 더 큰 분산을 보였다.", "chunks": [["When Campbell and Fehr examined", "Campbell과 Fehr가 조사했을 때"], ["how subjects rated themselves", "실험 대상자들이 자신을 어떻게 평가하는지를"], ["on sets of adjectives nt-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#5e5e5e\" text-anchor=\"middle\">endorse</text>\n    <!-- 점들 — 중간 영역에 흩어짐 -->\n    <g fill=\"#c8102e\">\n      <circle cx=\"85\" cy=\"124\" r=\"3\"/>\n      <circle cx=\"110\" cy=\"128\" r=\"3\"/>\n      <circle cx=\"135\" cy=\"122\" r=\"3\"/>\n      <circle cx=\"155\" cy=\"130\" r=\"3\"/>\n      <circle cx=\"175\" cy=\"125\" r=\"3\"/>\n      <circle cx=\"120\" cy=\"130\" r=\"3\"/>\n    </g>\n\n    <!-- 결과 라벨 -->\n    <text x=\"125\" y=\"170\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">intermediate &amp; variable ratings</text>\n    <text x=\"125\" y=\"183\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">분산 높음 · 일관성 낮음</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">low SE differs in evaluative consistency — not just in average positivity</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '낮은 자존감은 ‘부정적’이기만 한 걸까?'이고, 마지막은 '차이는 ‘긍정성’ + ‘일관성’'로 정리된다."}, {"no": "2", "title": "p31 (Exercise 2) 지문 ② · Literacy and the Quality of Life", "ktitle": "문해력과 삶의 질", "field": "사회·교육", "page": "p.31 Ex.2", "oneline": "문해력은 개인 능력을 넘어 삶의 질·인권·자유를 떠받치는 사회적 토대다.", "tldr": ["문해력은 개인 능력을 넘어 삶의 질·인권·자유를 떠받치는 사회적 토대다.", "문해력이 부재한 사회는 흔히 더 억압적·가혹하다.", "문해력에는 ‘특권 집단에 속하는 힘’이 따라온다."], "analogy": "글을 못 읽으면 계약서·약 설명서·투표 안내문 앞에서 늘 남에게 기대야 하죠. 문해력은 단순 ‘읽기’가 아니라 ‘스스로 살아갈 힘’이에요.", "bg": "분야는 사회·교육이에요. 핵심어는 ‘문해력(literacy)’. → 문해력이 개인 능력을 넘어 삶의 질·인권·자유와 어떻게 연결되는지에 주목하며 읽으세요.", "flow": [{"kind": "주장", "t": "문해력 = 삶의 질·인권의 토대"}, {"kind": "근거", "t": "문해력 없는 사회 = 억압·가혹", "d": "인권·존엄을 짓밟는 경향."}, {"kind": "역사 인용", "t": "Samuel Johnson", "d": "‘인쇄술 없는 곳은 다수가 야만적’ — 늘 사실이었다."}, {"kind": "함의", "t": "문해력 = 특권 집단의 힘"}, {"kind": "결론", "t": "문해력과 삶의 질은 함께 간다"}], "quiz": [["글이 말하는 문해력의 의미는 단순 ‘읽고 쓰기’인가?", "아니에요 — 삶의 질·인권·자유를 떠받치는 ‘사회적 토대이자 힘’으로 봐요."], ["Samuel Johnson 인용은 무엇을 강조하나?", "문해력(인쇄술)의 부재가 ‘야만성’과 연결된다는 점이 옛날부터 사실이었음을 강조해요."], ["핵심 한 문장?", "문해력은 개인을 넘어 사회의 질·인권을 좌우하는 토대다."]], "vocab": [["literate", "문해력이 있는"], ["literacy", "문해력"], ["take ~ for granted", "~을 당연하게 여기다"], ["play out", "전개되다·드러나다"], ["squalid", "지저분한·비참한"], ["undernourished", "영양 부족인"], ["repressive", "억압하는"], ["barbarous", "야만적인"], ["dignity", "존엄·품위"]], "en": "The power and value of being literate in a literate society are played out every day around the world. Many individuals, and in fact whole societies, make considerable sacrifices to become literate just as others take it for granted. Societies that do not practice literate behavior are often squalid, undernourished in mind and body, repressive of human rights and dignity, brutal, and harsh. Present-day examples are easy to list, but in fact this has always been the case. As Samuel Johnson observed more than two centuries ago, \"The mass of every people must be barbarous where there is no printing.\" We admit that various forms of \"barbarity\" can be found in all societies, but they are much more prevalent where literate behavior is absent. Literacy and quality of life go hand in hand. With literacy comes the power of belonging to a privileged group and the freedom that derives from that power. Frederick Douglass, who struggled as a slave to learn to read, said it best: \"Once you learn to read, you will be forever free.\"", "ko": "문해력의 사회에서 문해력이 있는 것의 힘과 가치는 세계 곳곳에서 매일 드러난다. 많은 개인, 그리고 사실상 전체 사회가 다른 이들이 그것을 당연하게 여기는 것과 마찬가지로 문해력을 갖기 위해 상당한 희생을 치른다. 문해력 있는 행동을 실천하지 않는 사회는 흔히 지저분하고, 심신이 피폐하며, 인권과 존엄을 억압하고, 잔인하며, 가혹하다. 오늘날의 사례는 열거하기 쉽지만, 사실상 이것은 항상 사실이었다. Samuel Johnson이 2세기보다 더 오래 전에 말했듯이, \"인쇄술이 없는 곳에서는 모든 민족의 다수가 야만적일 수밖에 없다.\" 우리는 다양한 형태의 \"야만성\"이 모든 사회에서 발견될 수 있다는 것을 인정하지만, 그것은 문해력 있는 행동이 부재한 곳에 훨씬 더 널리 퍼져 있다. 문해력과 삶의 질은 함께 간다. 문해력에는 특권 집단에 속하는 힘과 그 힘에서 파생되는 자유가 따라온다. 노예로서 읽는 법을 배우기 위해 고군분투했던 Frederick Douglass가 그것을 가장 잘 표현했다. \"일단 읽는 법을 배우면, 영원히 자유로워질 것이다.\"", "read": [{"en": "The power and value of being literate in a literate society are played out every day around the world.", "ko": "문해력의 사회에서 문해력이 있는 것의 힘과 가치는 세계 곳곳에서 매일 드러난다.", "chunks": [["The power and value", "힘과 가치는"], ["of being literate", "문해력이 있는 것의"], ["in a literate society", "문해력의 사회에서"], ["are played out every day", "매일 드러난다"], ["around the world.", "세계 곳곳에서."]]}, {"en": "Many individuals, and in fact whole societies, make considerable sacrifices to become literate just as others take it for granted.", "ko": "많은 개인, 그리고 사실상 전체 사회가 다른 이들이 그것을 당연하게 여기는 것과 마찬가지로 문해력을 갖기 위해 상당한 희생을 치른다.", "chunks": [["Many individuals,", "많은 개인,"], ["and in fact whole societies,", "그리고 사실상 전체 사회가,"], ["make considerable sacrifices", "상당한 희생을 치른다"], ["to become literate", "문해력을 갖기 위해"], ["just as others take it for granted.", "다른 이들이 그것을 당연하게 여기는 것과 마찬가지로."]]}, {"en": "Societies that do not practice literate behavior are often squalid, undernourished in mind and body, repressive of human rights and dignity, brutal, and harsh.", "ko": "문해력 있는 행동을 실천하지 않는 사회는 흔히 지저분하고, 심신이 피폐하며, 인권과 존엄을 억압하고, 잔인하며, 가혹하다.", "chunks": [["Societies that do not practice literate behavior", "문해력 있는 행동을 실천하지 않는 사회는"], ["are often squalid,", "흔히 지저분하고,"], ["undernourished in mind and body,", "심신이 피폐하며,"], ["repressive of human rights and dignity,", "인권과 존엄을 억압하고,"], ["brutal, and harsh.", "잔인하며, 가혹하다."]]}, {"en": "Present-day examples are easy to list, but in fact this has always been the case.", "ko": "오늘날의 사례는 열거하기 쉽지만, 사실상 이것은 항상 사실이었다.", "chunks": [["Present-day examples", "오늘날의 사례는"], ["are easy to list,", "열거하기 쉽다,"], ["but in fact", "하지만 사실"], ["this has always been the case.", "이것은 항상 그래왔다."]]}, {"en": "As Samuel Johnson observed more than two centuries ago, \"The mass of every people must be barbarous where there is no printing.\"", "ko": "Samuel Johnson이 2세기보다 더 오래 전에 말했듯이, \"인쇄술이 없는 곳에서는 모든 민족의 다수가 야만적일 수밖에 없다.\"", "chunks": [["As Samuel Johnson observed", "Samuel Johnson이 말했듯이"], ["more than two centuries ago,", "2세기 보다 더 오래 전에,"], ["\"The mass of every people", "\"모든 민족의 다수는"], ["must be barbarous", "야만적일 수밖에 없다"], ["where there is no printing.\"", "인쇄술이 없는 곳에서는.\""]]}, {"en": "We admit that various forms of \"barbarity\" can be found in all societies, but they are much more prevalent where literate behavior is absent.", "ko": "우리는 다양한 형태의 \"야만성\"이 모든 사회에서 발견될 수 있다는 것을 인정하지만, 그것은 문해력 있는 행동이 부재한 곳에 훨씬 더 널리 퍼져 있다.", "chunks": [["We admit that", "우리는 ~을 인정한다"], ["various forms of \"barbarity\"", "다양한 형태의 \"야만성\"이"], ["can be found in all societies,", "모든 사회에서 발견될 수 있다는 것을,"], ["but they are much more prevalent", "그러나 그것은 훨씬 더 널리 퍼져 있다"], ["where literate behavior is absent.", "문해력 있는 행동이 부재한 곳에서."]]}, {"en": "Literacy and quality of life go hand in hand.", "ko": "문해력과 삶의 질은 함께 간다.", "chunks": [["Literacy and quality of life", "문해력과 삶의 질은"], ["go hand in hand.", "함께 간다."]]}, {"en": "With literacy comes the power of belonging to a privileged group and the freedom that derives from that power.", "ko": "문해력에는 특권 집단에 속하는 힘과 그 힘에서 파생되는 자유가 따라온다.", "chunks": [["With literacy", "문해력과 함께"], ["comes the power", "힘이 따라온다"], ["of belonging to a privileged group", "특권 집단에 속하는"], ["and the freedom", "그리고 자유가"], ["that derives from that power.", "그 힘에서 파생되는."]]}, {"en": "Frederick Douglass, who struggled as a slave to learn to read, said it best: \"Once you learn to read, you will be forever free.\"", "ko": "노예로서 읽는 법을 배우기 위해 고군분투했던 Frederick Douglass가 그것을 가장 잘 표현했다. \"일단 읽는 법을 배우면, 영원히 자유로워질 것이다.\"", "chunks": [["Frederick Douglass,", "Frederick Douglass가,"], ["who struggled as a slave", "노예로서 고군분투했던"], ["to learn to read,", "읽는 법을 배우기 위해,"], ["said it best:", "그것을 가장 잘 표현했다:"], ["\"Once you learn to read,", "\"일단 읽는 법을 배우면,"], ["you will be forever free.\"", "영원히 자유로워질 것이다.\""]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 문해 부재 사회의 잠긴 문과 갇힌 사람, 가운데 책이 e x1=\"0\" y1=\"17\" x2=\"8\" y2=\"24\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"3 2\"/>\n      <line x1=\"0\" y1=\"32\" x2=\"-6\" y2=\"48\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"3 2\"/>\n      <line x1=\"0\" y1=\"32\" x2=\"6\" y2=\"48\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"3 2\"/>\n    </g>\n\n    <!-- repressive 키워드들 -->\n    <g font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#c8102e\">\n      <text x=\"40\" y=\"155\" text-anchor=\"middle\">repressive</text>\n      <text x=\"40\" y=\"168\" text-anchor=\"middle\">brutal</text>\n    </g>\n\n    <!-- 인용 -->\n    <text x=\"100\" y=\"183\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">\"no printing → barbarous\"</text>\n  </g>\n\n  <!-- 가운데: 책 → 열쇠 변환 -->\n  <g transform=\"translate(230, 100)\">\n    <!-- 책 -->\n    <g transform=\"translate(0, 0)\">\n      <path d=\"M 0 -12 L 0 12 L 22 16 L 22 -8 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <path d=\"M 0 -12 L 22 -8 L 44 -12 L 44 12 L 22 16 Z\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <!-- 책 줄 -->\n      <line x1=\"26\" y1=\"-6\" x2=\"40\" y2=\"-7\" stroke=\"#1FA34A\" stroke-width=\"0.7\"/>\n      <line x1=\"26\" y1=\"-2\" x2=\"40\" y2=\"-3\" stroke=\"#1FA34A\" stroke-width=\"0.7\"/>\n      <line x1=\"26\" y1=\"2\" x2=\"40\" y2=\"1\" stroke=\"#1FA34A\" stroke-width=\"0.7\"/>\n      <line x1=\"26\" y1=\"6\" x2=\"40\" y2=\"5\" stroke=\"#1FA34A\" stroke-width=\"0.7\"/>\n    </g>\n    <text x=\"22\" y=\"-20\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">literacy</text>\n\n    <!-- 화살표 → 열쇠 -->\n    <line x1=\"50\" y1=\"2\" x2=\"78\" y2=\"2\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <polygon points=\"78,2 70,-3 70,7\" fill=\"#1FA34A\"/>\n    \n    <!-- 열쇠 -->\n    <g transform=\"translate(86, 2)\ fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-31\" r=\"1.2\" fill=\"#1a1a1a\"/>\n      <path d=\"M -4 -25 Q 0 -22 4 -25\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <!-- 몸 -->\n      <line x1=\"0\" y1=\"-19\" x2=\"0\" y2=\"15\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 팔 (책 든 자세) -->\n      <line x1=\"0\" y1=\"-10\" x2=\"-12\" y2=\"-2\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"-10\" x2=\"12\" y2=\"-2\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 다리 -->\n      <line x1=\"0\" y1=\"15\" x2=\"-8\" y2=\"35\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"15\" x2=\"8\" y2=\"35\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 책 (가슴 앞) -->\n      <rect x=\"-9\" y=\"-4\" width=\"18\" height=\"11\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"-4\" x2=\"0\" y2=\"7\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n    </g>\n\n    <!-- 권리·존엄·자유 라벨 (떠다님) -->\n    <g font-family=\"Noto Serif\" font-style=\"italic\" font-weight=\"700\" fill=\"#1FA34A\" font-size=\"9.5\">\n      <g transform=\"translate(35, 30)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"22\" ry=\"9\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">rights</text>\n      </g>\n      <g transform=\"translate(170, 35)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"22\" ry=\"9\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">dignity</text>\n      </g>\n      <g transform=\"translate(170, 130)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"24\" ry=\"9\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">freedom</text>\n      </g>\n    </g>\n\n    <!-- Frederick Douglass 인용 -->\n    <text x=\"100\" y=\"183\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">\"forever free\" — Frederick Douglass</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">literacy and quality of life go hand in hand</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '문해력 = 삶의 질·인권의 토대'이고, 마지막은 '문해력과 삶의 질은 함께 간다'로 정리된다."}, {"no": "3", "title": "p32 (Exercise 3) 지문 ③ · Analytic vs Holistic — How Culture Shapes Attention", "ktitle": "문화가 빚는 ‘주의’ 방식", "field": "문화·인지", "page": "p.32 Ex.3", "oneline": "문화가 자아관을 빚고, 그 자아관이 ‘무엇에 주의를 기울이는가’까지 가른다.", "tldr": ["문화가 자아관을 빚고, 그 자아관이 ‘무엇에 주의를 기울이는가’까지 가른다.", "서구 = 내적 속성 중시 → 초점 대상에 집중 → ‘분석적(analytic)’.", "동양 = 사회적 관계 중시 → 대상+상황까지 → ‘총체적(holistic)’."], "analogy": "서양에서 자란 사람은 가운데 인물에, 동아시아에서 자란 사람은 배경·관계까지 함께 보죠. 문화가 ‘나를 보는 방식’을 만들고, 그게 다시 ‘무엇에 주목하는지’까지 정해요.", "bg": "분야는 문화·인지예요. 핵심 대비 — 분석적(analytic) vs 종합적(holistic) 사고. → 문화가 빚은 자아관이 ‘무엇에 주의를 기울이는가’까지 어떻게 가르는지에 주목하며 읽으세요.", "flow": [{"kind": "주장", "t": "문화 → 자아관 → 주의 방식"}, {"kind": "서구", "t": "내적 속성 발견 → 초점 대상 집중", "d": "상황보다 대상에 단단히 → ‘분석적’."}, {"kind": "동양", "t": "사회 관계 동조 → 대상+상황", "d": "주변 맥락까지, 관계를 추론 → ‘총체적’."}, {"kind": "결론", "t": "이 예측은 실제로 입증됐다"}], "quiz": [["‘분석적’ 주의와 ‘총체적’ 주의는 어떻게 다른가?", "분석적은 초점 대상에 집중(서구), 총체적은 대상+주변 상황·관계까지 본다(동양)는 차이예요."], ["주의 방식의 차이는 무엇에서 비롯된다고 하나?", "문화가 빚은 ‘자아관’(독립적 vs 관계적)에서 비롯돼요."], ["핵심 한 문장?", "문화가 자아관을 빚고, 그 자아관이 무엇에 주의를 두는지를 가른다."]], "vocab": [["culturally", "문화적으로"], ["profound", "깊은·중대한"], ["attribute", "속성"], ["bear out", "입증하다·뒷받침하다"], ["relevant to", "~와 관련 있는"], ["firmly grounded in", "~에 단단히 기반을 둔"], ["in lieu of", "~ 대신에"], ["analytic", "분석적인"], ["holistic", "전체론적인"], ["attuned to", "~에 잘 맞춰진"]], "en": "Culturally shared views of the self have been suggested to have profound influences on basic attention processes. In Western cultures, individuals are encouraged to discover their internal attributes such as desires and personal goals, and therefore they may be expected to focus their attention on events that are relevant to such desires and goals. As a result, their attention may become focused. This cognitive style, which is anchored in a focal object in lieu of its context, has been called analytic. In contrast, in Eastern cultures individuals are more attuned to various aspects of ever-important social relations and, as a consequence, they may be expected to attend more broadly to a focal object as well as to its surrounding context, drawing inferences about the relationship between the object and its context. This mode of cognition has been called holistic. These predictions have been borne out. For example, when presented with an animated vignette of an underwater scene and subsequently asked to remember what they saw, European Americans were more likely to recall focal objects, whereas Japanese were more likely to refer to contextual information as well as relationships between the focal objects.", "ko": "문화적으로 공유된 자아관은 기본적인 주의 과정에 매우 큰 영향을 미친다고 제안되어 왔다. 서구 문화에서는, 개인이 욕구와 개인적 목표와 같은 자신의 내적 속성을 발견하도록 장려되며, 따라서 그들은 그러한 욕구 및 목표와 관련된 일에 자신의 주의를 집중하도록 기대될 수도 있다. 결과적으로, 그들의 주의가 (거기에) 집중될 수도 있다. 상황 대신에 초점 대상에 단단히 기반을 두고 있는 이러한 인지 스타일은 '분석적'이라고 불려 왔다. 이와 대조적으로, 동양 문화에서는 개인이 언제나 중요한 사회적 관계의 다양한 측면에 더 맞춰져 있으며, 결과적으로 그들은 초점 대상에 더하여 그것의 주변 상황에까지도 더 폭넓게 주의를 기울이고, 대상과 그것의 상황 간의 관계를 추론하도록 기대될 수도 있다. 이러한 인지 방식은 '총체적'이라고 불려 왔다. 이러한 예측은 입증되어 왔다. 예를 들어, 수중 장면을 보여 주는 만화 영화로 제작된 짤막한 장면을 제시받고 그 뒤에 자신이 본 것을 기억해 보라는 요청을 받았을 때, 유럽계 미국인은 초점 대상을 기억해 낼 가능성이 더 많았던 반면에 일본인은 상황적 정보에 더하여 초점 대상 간의 관계도 언급할 가능성이 더 많았다.", "read": [{"en": "Culturally shared views of the self have been suggested to have profound influences on basic attention processes.", "ko": "문화적으로 공유된 자아관은 기본적인 주의 과정에 매우 큰 영향을 미친다고 제안되어 왔다.", "chunks": [["Culturally shared views of the self", "문화적으로 공유된 자아관은"], ["have been suggested", "제안되어 왔다"], ["to have profound influences", "매우 큰 영향을 미친다고"], ["on basic attention processes.", "기본적인 주의 과정에."]]}, {"en": "In Western cultures, individual "언제나 중요한 사회적 관계의 다양한 측면에"], ["and, as a consequence,", "그리고 결과적으로,"], ["they may be expected to attend more broadly", "그들은 더 폭넓게 주의를 기울이도록 기대될 수도 있다"], ["to a focal object as well as to its surrounding context,", "초점 대상에 더하여 그것의 주변 상황에까지도,"], ["drawing inferences about the relationship", "관계에 대한 추론을 이끌어 내며"], ["between the object and its context.", "대상과 그것의 상황 사이의."]]}, {"en": "This mode of cognition has been called holistic.", "ko": "이러한 인지 방식은 '총체적'이라고 불려 왔다.", "chunks": [["This mode of cognition", "이러한 인지 방식은"], ["has been called holistic.", "'총체적'이라고 불려 왔다."]]}, {"en": "These predictions have been borne out.", "ko": "이러한 예측은 입증되어 왔다.", "chunks": [["These predictions", "이러한 예측은"], ["have been borne out.", "입증되어 왔다."]]}, {"en": "For example, when presented with an animated vignette of an underwater scene and subsequently asked to remember what they saw, European Americans were more likely to recall focal objects, whereas Japanese were more likely to refer to contextual information as well as relationships between the focal objects.", "ko": "예를 들어, 수중 장면을 보여 주는 만화 영화로 제작된 짤막한 장면을 제시받고 그 뒤에 자신이 본 것을 기억해 보라는 요청을 받았을 때, 유럽계 미국인은 초점 대상을 기억해 낼 가능성이 더 많았던 반면에 일본인은 상황적 정보에 더하여 초점 대상 간의 관계도 언급할 가능성이 더 많았다.", "chunks": [["For example,", "예를 들어,"], ["when presented with an animated vignette", "만화 영화 짤막한 장면을 제시받았을 때"], ["of an underwater scene", "수중 장면의"], ["and subsequently asked to remember", "그 뒤에 기억해 보라는 요청을 받았을 때"], ["what they saw,", "자신이 본 것을,"], ["European Americans were more likely to recall focal objects,", "유럽계 미국인은 초점 대상을 기억해 낼 가능성이 더 많았다,"], ["whereas Japanese were more likely to refer to contextual information", "반면에 일본인은 상황적 정보를 언급할 가능성이 더 많았다"], ["as well as relationships between the focal objects.", "초점 대상 간의 관계도."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"같은 수중 장면을 왼쪽에서는 큰 초점 물고기만 빨갛게 강조하고 배경을 흐릿하게 처리한 분석형 시각으로, 오른쪽에서는 물고기·식물·바위·기포 모든 요소를 살리고 객체 사이 관계선을 그린 총체형 시각으로 대조한 그림\">\n  <!-- 좌측: 분석형 ,-8 22,0 24,8\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <circle cx=\"-10\" cy=\"-2\" r=\"1.6\" fill=\"#1FA34A\"/>\n      <circle cx=\"-10\" cy=\"-2\" r=\"0.6\" fill=\"#ffffff\"/>\n    </g>\n\n    <!-- 관계선 (객체들 사이 연결, 초록 점선) -->\n    <g stroke=\"#1FA34A\" stroke-width=\"0.9\" stroke-dasharray=\"2 2\" fill=\"none\" opacity=\"0.6\">\n      <line x1=\"46\" y1=\"40\" x2=\"120\" y2=\"90\"/>\n      <line x1=\"225\" y1=\"55\" x2=\"150\" y2=\"90\"/>\n      <line x1=\"40\" y1=\"140\" x2=\"120\" y2=\"100\"/>\n      <line x1=\"225\" y1=\"140\" x2=\"150\" y2=\"100\"/>\n      <line x1=\"80\" y1=\"150\" x2=\"120\" y2=\"100\"/>\n      <line x1=\"195\" y1=\"152\" x2=\"150\" y2=\"100\"/>\n    </g>\n\n    <text x=\"135\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">focal objects + context + relations</text>\n    <text x=\"135\" y=\"193\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">Japanese</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"247\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">culture shapes attention itself — not just values</text>\n</svg>", "caption": "이 지문은 4단계로 전개된다. 첫 출발점은 '문화 → 자아관 → 주의 방식'이고, 마지막은 '이 예측은 실제로 입증됐다'로 정리된다."}, {"no": "4", "title": "p33 (Exercise 4) 지문 ④ · Demand Revealed by Price — The Artificial Heart", "ktitle": "가격이 드러내는 잠재 수요", "field": "경제", "page": "p.33 Ex.4", "oneline": "사고 싶어도 비싸서 못 사던 ‘잠재 수요’가 있다.", "tldr": ["사고 싶어도 비싸서 못 사던 ‘잠재 수요’가 있다.", "가격이 충분히 낮아지면 그 수요가 비로소 드러난다.", "인공 심장: 100만→10만→100달러로 떨어질수록 살 사람이 늘어난다."], "analogy": "비싸서 못 사던 신제품이 가격이 뚝 떨어지면 ‘나도 살까?’ 하는 사람이 확 늘죠. 그 ‘숨어 있던 수요’가 가격이 내려야 보이는 거예요.", "bg": "분야는 경제예요. 핵심 개념은 ‘잠재 수요(latent demand)’ — 사고 싶어도 비싸서 못 사던 수요. → 그 잠재 수요가 무엇에 의해 드러나는지에 주목하며 읽으세요.", "flow": [{"kind": "정의", "t": "잠재 수요 = 사고 싶지만 못 사는 수요", "d": "시장에 안 드러난 상태."}, {"kind": "100만 달러", "t": "생사 걸린 경우만 사용"}, {"kind": "10만 달러", "t": "더 많은 사람이 구매", "d": "심장 멈추기 전에도 이식."}, {"kind": "100·10달러", "t": "필요한 누구나 구매 — 대중화"}, {"kind": "결론", "t": "가격이 낮아질수록 수요가 드러난다"}], "quiz": [["‘잠재 수요(latent demand)’란?", "사고 싶지만 가격이 비싸 못 사서 ‘시장에 드러나지 않은’ 수요예요."], ["인공 심장 예시가 보여주는 것은?", "가격이 100만→10만→100달러로 낮아질수록 살 수 있는 사람이 늘어 숨은 수요가 드러난다는 점이에요."], ["핵심 한 문장?", "잠재 수요는 가격이 충분히 낮아질 때 비로소 드러난다."]], "vocab": [["demand", "수요"], ["latent", "잠재된"], ["potential", "잠재적인·가능성"], ["artificial", "인공의"], ["plastic surgery", "성형 수술"], ["reveal", "드러내다"], ["matter of life and death", "생사가 걸린 문제"], ["implant", "이식하다"]], "en": "When a patient chooses to buy he or she becomes a part of demand. Wanting to buy (drugs, plastic surgery, artificial hip, etc.) but not doing so leaves that potential patient invisible, part of latent demand that does not effectively participate in the market. That extra demand will be revealed if the price goes low enough. For example, consider the development of an artificial heart. If each heart costs $1 million, they would only be used in matters of life and death. If further development reduced the cost of artificial hearts to $100,000 each, more people would get them. The artificial hearts would still be used only for people with serious illnesses, but they might be implanted long before a person's natural heart gave out. If the cost of making an artificial heart dropped to $100, one would be readily available to anyone who needed it. Consider what would happen if the cost of an artificial heart dropped to $10 and could be easily implanted during a 15-minute visit to the doctor. Some people who had never been ill but were just worried might have new hearts implanted.", "ko": "환자가 구매를 선택할 때 그 사람은 수요의 일부가 된다. (약물, 성형 수술, 인공 고관절 등을) 구매하기를 원하지만 그렇게 하지 않게 되면 그 잠재적인 환자는 눈에 띄지 않는, 시장에 실질적으로 참여하지 않는 '잠재 수요'의 일부로 남게 된다. 가격이 충분히 낮아지면 그러한 추가 수요가 드러날 것이다. 예를 들어, 인공 심장의 개발을 고려해 보라. 만약 각 심장의 비용이 100만 달러라면 그것은 오직 생사가 걸린 문제에만 사용될 것이다. 만약 추가적인 발전으로 인공 심장의 비용이 개당 10만 달러로 줄어들면, 더 많은 사람들이 인공 심장을 구매할 것이다. 인공 심장은 여전히 심각한 질병을 앓고 있는 사람들에게만 사용되겠지만, 사람의 타고난 심장이 멈추기 훨씬 전에 이식될지도 모른다. 만약 인공 심장 제작 비용이 100달러로 떨어지면, 그것을 필요로 하는 사람이면 누구나 하나를 쉽게 구입할 수 있을 것이다. 만약 인공 심장 비용이 10달러로 떨어지고 15분간의 병원 진료로 쉽게 이식받을 수 있다면 무슨 일이 일어날지 생각해 보라. 한 번도 병에 걸린 적은 없지만 그저 걱정하는 일부 사람들이 새로운 심장을 이식받을지도 모른다.", "read": [{"en": "When a patient chooses to buy he or she becomes a part of demand.", "ko": "환자가 구매를 선택할 때 그 사람은 수요의 일부가 된다.", "chunks": [["When a patient chooses to buy", "환자가 구매를 선택할 때"], ["he or she becomes", "그 사람은 ~이 된다"], ["a part of demand.", "수요의 일부."]]}, {"en": "Wanting to buy (drugs, plastic surgery, artificial hip, etc.) but not doing so leaves that potential patient invisible, part of latent demand that does not effectively participate in the market.", "ko": "(약물, 성형 수술, 인공 고관절 등을) 구매하기를 원하지만 그렇게 하지 않게 되면 그 잠재적인 환자는 눈에 띄지 않는, 시장에 실질적으로 참여하지 않는 '잠재 수요'의 일부로 남게 된다.", "chunks": [["Wanting to buy", "구매하기를 원하는 것"], ["(drugs, plastic surgery, artificial hip, etc.)", "(약물, 성형 수술, 인공 고관절 등을)"], ["but not doing so", "하지만 그렇게 하지 않는 것은"], ["leaves that potential patient invisible,", "그 잠재적인 환자를 눈에 띄지 않게 두며,"], ["part of latent demand", "'잠재 수요'의 일부로"], ["that does not effectively participate in the market.", "시장에 실질적으로 참여하지 않는."]]}, {"en": "That extra demand will be revealed if the price goes low enough.", "ko": "가격이 충분히 낮아지면 그러한 추가 수요가 드러날 것이다.", "chunks": [["That extra demand", "그러한 추가 수요는"], ["will be revealed", "드러날 것이다"], ["if the price goes low enough.", "가격이 충분히 낮아지면."]]}, {"en": "For example, consider the development of an artificial heart.", "ko": "예를 들어, 인공 심장의 개발을 고려해 보라.", "chunks": [["For example,", "예를 들어,"], ["consider the development", "~을 고려해 보라"], ["of an artificial heart.", "인공 심장의 개발을."]]}, {"en": "If each heart costs $1 million, they would only be used in matters of life and death.", "ko": "만약 각 심장의 비용이 100만 달러라면 그것은 오직 생사가 걸린 문제에만 사용될 것이다.", "chunks": [["If each heart costs $1 million,", "만약 각 심장이 100만 달러라면,"], ["they would only be used", "그것은 ~만 사용될 것이다"], ["in matters of life and death.", "생사가 걸린 문제에."]]}, {"en": "If further development reduced the cost of artificial hearts to $100,000 each, more people would get them.", "ko": "만약 추가적인 발전으로 인공 심장의 비용이 개당 10만 달러로 줄어들면, 더 많은 사람들이 인공 심장을 구매할 것이다.", "chunks": [["If further development reduced the cost", "만약 추가 발전이 비용을 줄인다면"], ["of artificial hearts to $100,000 each,", "인공 심장의 비용을 개당 10만 달러로,"], ["more people would get them.", "더 많은 사람들이 그것을 얻게 될 것이다."]]}, {"en": "The artificial hearts would still be used only for people with serious illnesses, but they might be implanted long before a person's natural heart gave out.", "ko": "인공 심장은 여전히 심각한 질병을 앓고 있는 사람들에게만 사용되겠지만, 사람의 타고난 심장이 멈추기 훨씬 전에 이식될지도 모른다.", "chunks": [["The artificial hearts would still be used", "인공 심장은 여전히 사용될 것이다"], ["only for people with serious illnesses,", "심각한 질병을 앓고 있는 사람들에게만,"], ["but they might be implanted", "하지만 그것은 이식될 수도 있다"], ["long before a person's natural heart", "사람의 타고난 심장이 ~하기 훨씬 전에"], ["gave out.", "멈추기."]]}, {"en": "If the cost of making an artificial heart dropped to $100, one would be readily available to anyone who needed it.", "ko": "만약 인공 심장 제작 비용이 100달러로 떨어지면, 그것을 필요로 하는 사람이면 누구나 하나를 쉽게 구입할 수 있을 것이다.", "chunks": [["If the cost of making an artificial heart", "만약 인공 심장 제작 비용이"], ["dropped to $100,", "100달러로 떨어지면,"], ["one would be readily available", "그것은 쉽게 이용 가능할 것이다"], ["to anyone who needed it.", "그것을 필요로 하는 누구에게나."]]}, {"en": "Consider what would happen if the cost of an artificial heart dropped to $10 and could be easily implanted during a 15-minute visit to the doctor.", "ko": "만약 인공 심장 비용이 10달러로 떨어지고 15분간의 병원 진료로 쉽게 이식받을 수 있다면 무슨 일이 일어날지 생각해 보라.", "chunks": [["Consider what would happen", "무슨 일이 일어날지 생각해 보라"], ["if the cost of an artificial heart dropped to $10", "인공 심장 비용이 10달러로 떨어지고"], ["and could be easily implanted", "그리고 쉽게 이식될 수 있다면"], ["during a 15-minute visit to the doctor.", "15분간의 병원 진료로."]]}, {"en": "Some people who had never been ill but were just worried might have new hearts implanted.", "ko": "한 번도 병에 걸린 적은 없지만 그저 걱정하는 일부 사람들이 새로운 심장을 이식받을지도 모른다.", "chunks": [["Some people", "일부 사람들이"], ["who had never been ill", "한 번도 병에 걸린 적 없던"], ["but were just worried", "하지만 그저 걱정하던"], ["might have new hearts implanted.", "새로운 심장을 이식받을지도 모른다."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"인공 심장 가격이 100만 달러에서 10만 달러로 100달러로 10달러로 4단계로 떨어질 때마다 수요자 stick figure 수가 1명에서 2명에서 다수로 8명으로 점점 늘어나는 가격 사다리 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">가격이 충분히 낮아질 때 — 잠재 수요가 드러난다</text>\n\n  <!-- 좌측 세로축 라벨 -->\n  <text x=\"18\" y=\"135\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" fill=\"#1a1a1a\" transform=\"rotate(-90, 18, 135)\" text-anchor=\"middle\">price ↓ / demand ↑</text>\n\n  <!-- 4단 사다리 (계단형) -->\n  <!-- 단계 1: $1M -->\n  <g transform=\"translate(60, 50)\">\n    <rect x=\"0\" y=\"0\" width=\"125\" height=\"38\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    <text x=\"10\" y=\"16\" font-family=\"Noto Serif\" font-style=\"italic\" font-weight=\"700\" font-size=\"13\" fill=\"#c8102e\">$1M</text>\n    <text x=\"10\" y=\"30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#5e5e5e\">life-and-death only</text>\n    <!-- 인공 심장 작은 아이콘 -->\n    <g transform=\"translate(108, 19)\">\n      <path d=\"M 0 -3 Q -4 -7 -7 -3 Q -7 2 0 6 Q 7 2 7 -3 Q 4 -7 0 -3 Z\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n    </g>\n    <!-- 수요자: 1명 -->\n    <g transform=\"translate(150, 19)\">\n      <circle cx=\"0\" cy=\"-6\" r=\"3.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"-2\" x2=\"0\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"2\" x2=\"-3\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1 =\"#1FA34A\" stroke-width=\"0.9\"/>\n      </g>\n      <g transform=\"translate(77, 0)\">\n        <circle cx=\"0\" cy=\"-6\" r=\"3.5\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n        <line x1=\"0\" y1=\"-2\" x2=\"0\" y2=\"8\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n        <line x1=\"0\" y1=\"2\" x2=\"-3\" y2=\"6\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n        <line x1=\"0\" y1=\"2\" x2=\"3\" y2=\"6\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n        <line x1=\"0\" y1=\"8\" x2=\"-3\" y2=\"14\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n        <line x1=\"0\" y1=\"8\" x2=\"3\" y2=\"14\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n      </g>\n    </g>\n  </g>\n\n  <!-- 가격 ↓ 화살표 (왼쪽) -->\n  <g transform=\"translate(40, 60)\">\n    <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"160\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <polygon points=\"0,160 -4,152 4,152\" fill=\"#1FA34A\"/>\n  </g>\n\n  <!-- 우측 demand ↑ 화살표 -->\n  <g transform=\"translate(560, 60)\">\n    <line x1=\"0\" y1=\"160\" x2=\"0\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <polygon points=\"0,0 -4,8 4,8\" fill=\"#1FA34A\"/>\n    <text x=\"-8\" y=\"100\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" fill=\"#1FA34A\" transform=\"rotate(-90, -8, 100)\" text-anchor=\"middle\">latent → revealed</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">extra demand revealed as price drops</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '잠재 수요 = 사고 싶지만 못 사는 수요'이고, 마지막은 '가격이 낮아질수록 수요가 드러난다'로 정리된다."}, {"no": "5", "title": "p34 (Exercise 5) 지문 ⑤ · Historians as Narrative Makers", "ktitle": "역사가는 ‘서사’를 만든다", "field": "역사·인문", "page": "p.34 Ex.5", "oneline": "역사가는 증거를 고르고 해석하는 데서 그치지 않는다.", "tldr": ["역사가는 증거를 고르고 해석하는 데서 그치지 않는다.", "그 증거로 이해하기 쉬운 ‘이야기(서사)’를 짓는다.", "연대기 순서·관점·어조·아이러니로 사건을 ‘이해 가능하게’ 만든다."], "analogy": "같은 사건도 기자마다 다른 ‘기사’를 쓰듯, 역사가도 증거를 골라 ‘이야기’로 엮어요. 사실의 나열이 아니라 관점·어조가 들어간 서사죠.", "bg": "분야는 역사·인문이에요. ‘역사가는 증거를 고르고 해석한다’가 출발점. → 역사가가 단순 기록자를 넘어 무엇을 하는 존재인지에 주목하며 읽으세요.", "flow": [{"kind": "주장", "t": "역사가는 증거 선택·해석 ‘이상’을 한다", "d": "증거를 구조화해 서사를 창조."}, {"kind": "방법 ①", "t": "연대기 순서", "d": "변화의 원인을 중심으로 그럴듯하게."}, {"kind": "방법 ②", "t": "관점·어조 부여", "d": "특정 시각에서 사건을 조명."}, {"kind": "예시", "t": "아이러니 강조 (Bush)", "d": "‘국가 재건’ 비판 → 후에 이라크 전쟁."}, {"kind": "결론", "t": "역사 = 증거로 지은 서사"}], "quiz": [["역사가가 ‘증거를 고르고 해석하는 이상’으로 하는 일은?", "증거를 구조화해 이해하기 쉬운 ‘이야기(서사)’를 짓는 일이에요."], ["역사가는 어떻게 사건을 ‘이해 가능하게’ 만드나?", "연대기 순서로 배열하고, 관점·어조를 부여하며, 아이러니 같은 장치를 써요."], ["핵심 한 문장?", "역사가는 증거를 골라 관점·어조가 담긴 ‘서사’를 만든다."]], "vocab": [["interpret", "해석하다"], ["organize", "구조화하다"], ["narrative", "서사"], ["persuasive", "설득력 있는"], ["plausible", "그럴듯한·타당해 보이는"], ["chronological", "연대기적인"], ["cast A in a particular light", "A를 특정한 관점에서 조명하다"], ["irony", "아이러니"]], "en": "Historians do more than select and interpret evidence: they also organize the evidence in order to create an understandable (and, they hope, persuasive) narrative. Chronological order is generally part of making history plausible, especially when the causes of change are central, although in practice much historical writing must go back and forth in time in order to pick up various threads of a complex story. Historians also make events understandable by casting them in a particular light or giving their narrative a particular tone. For example, a historian might highlight historical ironies, such as the way President George W. Bush once criticized \"nation building,\" in which the U.S. rebuilds a country's economic and political structure when its government fails; but later, as a consequence of launching a war in Iraq, Bush had to attempt exactly that. Historians can also romanticize events, as did those who described John F. Kennedy's term as President as \"Camelot,\" alluding to a Broadway musical about the heroic King Arthur and the Knights of the Round Table. Similarly, one historian may view a certain chain of events as improvement, while another may perceive it as a decline. These are just a few of the ways historians may make narrative sense of history.", "ko": "역사가는 증거를 선택하고 해석하는 이상의 일을 하는데, 즉 그들은 이해하기 쉬운 (그리고 설득력이 있기를 바라는) 서사를 창조하기 위해 증거를 구조화하기도 한다. 연대기적 순서는 일반적으로 역사를 그럴듯하게 만드는 과정의 일부로서 특히 변화의 원인이 중심이 될 때 그러하며, 다만 실제로는 복잡한 이야기의 다양한 맥락을 포착하기 위해 많은 역사 서술은 시간상 앞뒤를 오가야 한다. 역사가는 또한 특정한 관점에서 사건을 조명하거나 자신의 서사에 특정한 어조를 부여함으로써 사건을 이해하기 쉽게 만든다. 예를 들어, 어떤 역사가는 역사적 아이러니를 강조할 수도 있는데, 이를테면 George W. Bush 대통령이 한때 한 나라의 정부가 무너질 때 미국이 그 나라의 경제 및 정치 구조를 재건하는 '국가 재건'을 비판했으나, 후에 이라크에서 전쟁을 시작한 결과로 Bush는 바로 그것을 시도할 수밖에 없었던 경우처럼 말이다. 역사가는 또한 영웅적인 아서 왕과 원탁의 기사들에 관한 브로드웨이 뮤지컬을 넌지시 암시하며 John F. Kennedy 대통령의 임기를 '카멜롯'이라 묘사한 사람들이 그랬던 것과 같이 사건을 낭만적으로 묘사할 수도 있다. 마찬가지로, 한 역사가는 특정한 사건의 연속을 진보라고 볼 수도 있는 반면, 다른 역사가는 그것을 쇠퇴라고 인식할 수도 있다. 이것은 역사가가 역사의 서사적 의미를 만들어 낼 수도 있는 방식 중 몇 가지일 뿐이다.", "read": [{"en": "Historians do more than select and interpret evidence: they also organize the evidence in order to create an understandable (and, they hope, persuasive) narrative.", "ko": "역사가는 증거를 선택하고 해석하는 이상의 일을 하는데, 즉 그들은 이해하기 쉬운 (그리고 설득력이 있기를 바라는) 서사를 창조하기 위해 증거를 구조화하기도 한다.", "chunks": [["Historians do more than select and interpret evidence:", "역사가는 증거를 선택하고 해석하는 이상의 일을 한다:"], ["they also organize the evidence", "그들은 증거를 구조화하기도 한다"], ["in order to create an understandable", "이해하기 쉬운 ~을 창조하기 위해"], ["(and, they hope, persuasive) narrative.", "(그리고 설득력 있기를 바라는) 서사를."]]}, {"en": "Chronological order is generally part of making history plausible, especially when the causes of change are central, although in practice much historical writing must go back and forth in time in order to pick up various threads of a complex story.", "ko": "연대기적 순서는 일반적으로 역사를 그럴듯하게 만드는 과정의 일부로서 특히 변화의 원인이 중심이 될 때 그러하며, 다만 실제로는 복잡한 이야기의 다양한 맥락을 포착하기 위해 많은 역사 서술은 시간상 앞뒤를 오가야 한다.", "chunks": [["Chronological order is generally part", "연대기적 순서는 일반적으로 일부이다"], ["of making history plausible,", "역사를 그럴듯하게 만드는,"], ["especially when the causes of change are central,", "특히 변화의 원인이 중심이 될 때,"], ["although in practice", "비록 실제로는"], ["much historical writing must go back and forth in time", "많은 역사 서술은 시간상 앞뒤를 오가야 한다"], ["in order to pick up various threads", "다양한 맥락을 포착하기 위해"], ["of a complex story.", "복잡한 이야기의."]]}, {"en": "Historians also make events understandable by casting them in a particular light or giving their narrative a particular tone.", "ko": "역사가는 또한 특정한 관점에서 사건을 조명하거나 자신의 서사에 특정한 어조를 부여함으로써 사건을 이해하기 쉽게 만든다.", "chunks": [["Historians also make events understandable", "역사가는 또한 사건을 이해하기 쉽게 만든다"], ["by casting them in a particular light", "특정한 관점에서 그것을 조명함으로써"], ["or giving their narrative a particular tone.", "또는 자신의 서사에 특정한 어조를 부여함으로써."]]}, {"en": "For example, a historian might highlight historical ironies, such as the way President George W. Bush once criticized \"nation building,\" in which the U.S. rebuilds a country's economic and political structure when its government fails; but later, as a consequence of launching a war in Iraq, Bush had to attempt exactly that.", "ko": "예를 들어, 어떤 역사가는 역사적 아이러니를 강조할 수도 있는데, 이를테면 George W. Bush 대통령이 한때 한 나라의 정부가 무너질 때 미국이 그 나라의 경제 및 정치 구조를 재건하는 '국가 재건'을 비판했으나, 후에 이라크에서 전쟁을 시작한 결과로 Bush는 바로 그것을 시도할 수밖에 없었던 경우처럼 말이다.", "chunks": [["For example,", "예를 들어,"], ["a historian might highlight historical ironies,", "어떤 역사가는 역사적 아이러니를 강조할 수도 있다,"], ["such as the way President George W. Bush once criticized \"nation building,\"", "이를테면 George W. Bush 대통령이 한때 '국가 재건'을 비판했던 방식,"], ["in which the U.S. rebuilds a country's economic and political structure", "거기서 미국은 한 나라의 경제·정치 구조를 재건한다"], ["when its government fails;", "그 정부가 무너질 때;"], ["but later, as a consequence of launching a war in Iraq,", "그러나 후에, 이라크 전쟁을 시작한 결과로,"], ["Bush had to attempt exactly that.", "Bush는 바로 그것을 시도할 수밖에 없었다."]]}, {"en": "Historians can also romanticize events, as did those who described John F. Kennedy's term as President as \"Camelot,\" alluding to a Broadway musical about the heroic King Arthur and the Knights of the Round Table.", "ko": "역사가는 또한 영웅적인 아서 왕과 원탁의 기사들에 관한 브로드웨이 뮤지컬을 넌지시 암시하며 John F. Kennedy 대통령의 임기를 '카멜롯'이라 묘사한 사람들이 그랬던 것과 같이 사건을 낭만적으로 묘사할 수도 있다.", "chunks": [["Historians can also romanticize events,", "역사가는 또한 사건을 낭만적으로 묘사할 수도 있다,"], ["as did those", "~한 사람들이 그랬던 것과 같이"], ["who described John F. Kennedy's term as President", "John F. Kennedy의 대통령 임기를 묘사한"], ["as \"Camelot,\"", "'카멜롯'으로,"], ["alluding to a Broadway musical", "브로드웨이 뮤지컬을 넌지시 암시하며"], ["about the heroic King Arthur", "영웅적인 아서 왕에 관한"], ["and the Knights of the Round Table.", "그리고 원탁의 기사들에 관한."]]}, {"en": "Similarly, one historian may view a certain chain of events as improvement, while another may perceive it as a decline.", "ko": "마찬가지로, 한 역사가는 특정한 사건의 연속을 진보라고 볼 수도 있는 반면, 다른 역사가는 그것을 쇠퇴라고 인식할 수도 있다.", "chunks": [["Similarly,", "마찬가지로,"], ["one historian may view", "한 역사가는 ~로 볼 수도 있다"], ["a certain chain of events", "특정한 사건의 연속을"], ["as improvement,", "진보로,"], ["while another may perceive it", "반면에 다른 역사가는 그것을 인식할 수도 있다"], ["as a decline.", "쇠퇴로."]]}, {"en": "These are just a few of the ways historians may make narrative sense of history.", "ko": "이것은 역사가가 역사의 서사적 의미를 만들어 낼 수도 있는 방식 중 몇 가지일 뿐이다.", "chunks": [["These are just a few", "이것은 몇 가지일 뿐이다"], ["of the ways", "방식 중에서"], ["historians may make narrative sense", "역사가가 서사적 의미를 만들 수도 있는"], ["of history.", "역사의."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽의 같은 증거 더미가 가운데 역사가의 손을 거쳐 오른쪽에 아이러니·낭만화·진보·쇠퇴 네 갈래 서사 톤으로 다르게 구성되어 나오는 그림\">\n  <!-- 좌측: 같은 증거 더미 -->\n  <g transform=\"translate(20, 50)\">\n    <text x=\"80\" y=\"-12\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">증거 더미 — same evidence</text>\n    <rect x=\"0\" y=\"0\" width=\"160\" height=\"170\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.3\" stroke-dasharray=\"3 3\"/>\n\n    <!-- 증거 조각들 (날짜·사건 카드들) -->\n    <g font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">\n      <g transform=\"translate(20, 18)\">\n        <rect x=\"0\" y=\"0\" width=\"55\" height=\"22\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"0.9\"/>\n        <text x=\"27\" y=\"9\" text-anchor=\"middle\">1961</text>\n        <text x=\"27\" y=\"18\" text-anchor=\"middle\">JFK</text>\n      </g>\n      <g transform=\"translate(85, 22)\">\n        <rect x=\"0\" y=\"0\" width=\"55\" height=\"22\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"0.9\"/>\n        <text x=\"27\" y=\"9\" text-anchor=\"middle\">2003</text>\n        <text x=\"27\" y=\"18\" text-anchor=\"middle\">Iraq</text>\n      </g>\n      <g transform=\"translate(15, 55)\">\n        <rect x=\"0\" y=\"0\" width=\"55\" height=\"22\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"0.9\"/>\n        <text x=\"27\" y=\"9\" text-anchor=\"middle\">events</text>\n        <text x=\"27\" y=\"18\" text-anchor=\"middle\">·</text>\n      </g>\n      <g transform=\"translate(85, 58)\">\n        <rect x=\"0\" y=\"0\" width=\"55\" height=\"22\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"0.9\"/>\n        <text x=\"27\" y=\"9\" text-anchor=\"middle\">causes</text>\n        <text x=\"27\" y=\"18\" text-anchor=\"middle\">·</text>\n      </g>\n      <g transform=\"translate(20, 92)\">\n        <rect x=\"0\" y=\"0\" width=\"55\" height=\"22\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"0.9\"/>\n        <text x=\"27\" y=\"9\" text-anchor=\"middle\">dates</text>\n        <text x=\"27\" y=\"18\" text-anchor=\"middle\">·</text>\n      </g>\n      <g transform=\"translate(85, 95)\">\n        <rect x=\"0\" y=\"0\" width=\"55\" height=\"22\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"0.9\"/>\n        <text x=\"27\" y=\"9\" text-anchor=\"middle\">facts</text>\n        <text x=\"27\" y=\"18\" text-anchor=\"middle\">·</text>\n      </g>\n    </g>\n    <text x=\"80\" y=\"148\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">raw chronological data</text>\n  </g>\n\n  <!-- 가운데: 역사가의 손(펜) -->\n  <g transform=\"translate(205, 95)\">\n    <text x=\"55\" y=\"-32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">historian</text>\n    <text x=\"55\" y=\"-20\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">관점 · 어조 · 순서</text>\n    \n    <!-- 펜을 든 손 (간단 도형) -->\n    <g transform=\"translate(20, 0)\">\n      <!-- 손목 -->\n      <rect x=\"0\" y=\"-8\" width=\"22\" height=\"16\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 손가락 (단순) -->\n      <ellipse cx=\"28\" cy=\"0\" rx=\"10\" ry=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 펜 -->\n      <line x1=\"34\" y1=\"-3\" x2=\"64\" y2=\"-18\" stroke=\"#c8102e\" stroke-width=\"2.4\"/>\n      <polygon points=\"64,-18 70,-22 67,-14\" fill=\"#c8102e\"/>\n    </g>\n\n    <!-- 화살표 → 오른쪽 -->\n    <line x1=\"90\" y1=\"0\" x2=\"115\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <polygon points=\"115,0 107,-4 107,4\" fill=\"#1a1a1a\"/>\n    <text x=\"100\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">cast in a light</text>\n  </g>\n\n  <!-- 우측: 4갈래 서사 톤 -->\n  <g transform=\"translate(335, 25)\">\n    <text x=\"125\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">4가지 서사 톤 — narrative sense</text>\n    <rect x=\"0\" y=\"0\" width=\"250\" height=\"220\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n\n    <!-- 1. 아이러니 (Bush 사례) -->\n    <g transform=\"translate(10, 10)\">\n      <rect x=\"0\" y=\"0\" width=\"230\" height=\"44\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <text x=\"8\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" fill=\"#c8102e\">ironies</text>\n      <text x=\"8\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#5e5e5e\">아이러니 — Bush가 비판했던 \"nation building\"을</text>\n      <text x=\"8\" y=\"40\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#5e5e5e\">Iraq 전쟁 후 직접 해야 했음</text>\n    </g>\n\n    <!-- 2. 낭만화 (JFK = Camelot) -->\n    <g transform=\"translate(10, 60)\">\n      <rect x=\"0\" y=\"0\" width=\"230\" height=\"44\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"8\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" fill=\"#1FA34A\">romanticize</text>\n      <text x=\"8\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#5e5e5e\">낭만화 — JFK 임기를 \"Camelot\"으로</text>\n      <text x=\"8\" y=\"40\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#5e5e5e\">King Arthur 뮤지컬에 빗댐</text>\n    </g>\n\n    <!-- 3. 진보 -->\n    <g transform=\"translate(10, 110)\">\n      <rect x=\"0\" y=\"0\" width=\"110\" height=\"44\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"8\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" fill=\"#1FA34A\">improvement</text>\n      <text x=\"75\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#5e5e5e\">· 진보</text>\n      <!-- 상승 곡선 (박스 아래쪽으로) -->\n      <polyline points=\"8,38 30,34 55,30 80,26 100,22\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <polygon points=\"100,22 95,26 97,19\" fill=\"#1FA34A\"/>\n    </g>\n\n    <!-- 4. 쇠퇴 -->\n    <g transform=\"translate(130, 110)\">\n      <rect x=\"0\" y=\"0\" width=\"110\" height=\"44\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <text x=\"8\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" fill=\"#c8102e\">decline</text>\n      <text x=\"50\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#5e5e5e\">· 쇠퇴</text>\n      <!-- 하강 곡선 (박스 위쪽에서 아래로) -->\n      <polyline points=\"8,22 30,26 55,30 80,34 100,38\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <polygon points=\"100,38 93,34 97,42\" fill=\"#c8102e\"/>\n    </g>\n\n    <text x=\"125\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">same evidence → different narratives</text>\n    <text x=\"125\" y=\"200\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">narrative is constructed</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"260\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">historians do more than select — they create the story</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '역사가는 증거 선택·해석 ‘이상’을 한다'이고, 마지막은 '역사 = 증거로 지은 서사'로 정리된다."}, {"no": "6", "title": "p35 (Exercise 6) 지문 ⑥ · Prestige — A Uniquely Human Form of Status", "ktitle": "명망 — 인간만의 지위", "field": "인류·사회", "page": "p.35 Ex.6", "oneline": "명망은 힘으로 지배하는 우세함과 달리, 사람들이 <span class='g'>배울 만하다</span>고 여기는 대상에게 부여하는 <span class='g'>인간 고유의 지위</span>다.", "tldr": ["동물도 힘·공격성에 기반한 우세함은 인식한다.", "그러나 명망은 단순 지배가 아니라 배울 만하다고 여겨지는 사람에게 부여되는 지위다.", "따라서 명망은 인간 사회의 학습과 문화 전승을 설명하는 핵심 개념이다."], "analogy": "싸움 잘하는 일진(우세함)과, 다들 따라 하고 싶어 하는 ‘롤모델 선배’(명망)는 다르죠. 명망은 힘이 아니라 ‘배우고 싶음’에서 나와요.", "bg": "분야는 인류·사회예요. 핵심 대비 — 힘·공격성 기반의 ‘우세함(dominance)’과 인간 특유의 ‘명망(prestige)’. → 둘이 어떻게 다른지에 주목하며 읽으세요.", "flow": [{"kind": "정의", "t": "명망 = 인간만이 인식하는 지위"}, {"kind": "우세함", "t": "힘·공격성 (동물·인간 공통)", "d": "무시무시한 전사는 어디서나 찬양."}, {"kind": "명망 = 반대", "t": "‘배울 만한 사람’ — 전문가·연장자"}, {"kind": "확장", "t": "한 분야 성공 → 전 영역 영향", "d": "여론 선도자, 모든 결정 모방."}, {"kind": "결론", "t": "명망 = 문화 전파를 키우는 진화적 장치"}], "quiz": [["‘우세함(dominance)’과 ‘명망(prestige)’의 차이는?", "우세함은 힘·공격성(동물도 인식), 명망은 ‘배울 만한 사람’에게 주어지는 인간 고유의 지위예요."], ["명망은 왜 진화했을 거라고 보나?", "성공한 사람을 따라 배우는 ‘문화 전파’의 이점을 키우기 위해서예요."], ["핵심 한 문장?", "명망은 힘이 아니라 ‘배울 만함’에서 나오는 인간 고유의 지위다."]], "vocab": [["prestige", "명망"], ["status", "지위"], ["recognize", "인식하다"], ["dominance", "우세함·지배"], ["aggressive", "공격적인"], ["fearsome", "무시무시한"], ["warrior", "전사"], ["celebrate", "찬양하다·기리다"]], "en": "Prestige is a particular form of status that only humans recognize. Most animals observe the advantages of dominance, such as being the most powerful or aggressive individual, and these are also important for humans: fearsome warriors are celebrated universally. Prestige is almost the opposite. Prestigious individuals are ones worthy of learning from ─ they are experts, older people. And if someone has prestige in one field, they become high-status individuals and their influence won't be limited to their field; we are likely to copy all their decisions. Indeed, prestige may have evolved as a way to enhance the benefits of cultural transmission. Success in one area of life affords someone the status of general opinion leader. We want to learn from successful individuals, or even simply be associated with them in some way, so that their reputation rubs off on us. That's why a golfing hero can sell you a watch.", "ko": "명망은 오직 인간만이 인식하는 특정 형태의 지위이다. 대부분의 동물은 가장 강력하거나 공격적인 개체가 되는 것과 같은 우세함의 장점을 인식하며, 이것은 인간에게도 또한 중요한데, 곧 무시무시한 전사는 어디에서나 찬양을 받는다. 명망은 거의 그 반대이다. 명망 있는 사람은 배울 만한 가치가 있는 사람으로, 전문가이고 연장자이다. 그리고 만약 어떤 사람이 한 분야에서 명망이 있으면, 그는 높은 지위의 인물이 되고 그의 영향력은 자신의 분야로만 국한되지 않을 것이며, 우리는 그의 모든 결정을 모방할 가능성이 있다. 사실상, 명망은 문화 전파의 이점을 증대시키는 한 가지 방법으로 진화했을 수도 있다. 삶의 한 영역에서의 성공은 어떤 사람에게 여론 선도자의 지위를 제공한다. 우리는 성공한 사람으로부터 배우거나, 혹은 심지어 그들의 명성이 우리에게 옮겨오도록 그들과 그저 어떤 방식으로든 연관되기를 원한다. 그것이 골프 영웅이 여러분에게 시계를 팔 수 있는 이유이다.", "read": [{"en": "Prestige is a particular form of status that only humans recognize.", "ko": "명망은 오직 인간만이 인식하는 특정 형태의 지위이다.", "chunks": [["Prestige is", "명망은 ~이다"], ["a particular form of status", "특정 형태의 지위"], ["that only humans recognize.", "오직 인간만이 인식하는."]]}, {"en": "Most animals observe the advantages of dominance, such as being the most powerful or aggressive individual, and these are also important for humans: fearsome warriors are celebrated universally.", "ko": "대부분의 동물은 가장 강력하거나 공격적인 개체가 되는 것과 같은 우세함의 장점을 인식하며, 이것은 인간에게도 또한 중요한데, 곧 무시무시한 전사는 어디에서나 찬양을 받는다.", "chunks": [["Most animals observe the advantages of dominance,", "대부분의 동물은 우세함의 장점을 인식한다,"], ["such as being the most powerful or aggressive individual,", "가장 강력하거나 공격적인 개체가 되는 것과 같은,"], ["and these are also important for humans:", "그리고 이것은 인간에게도 중요하다:"], ["fearsome warriors", "무시무시한 전사는"], ["are celebrated universally.", "어디에서나 찬양을 받는다."]]}, {"en": "Prestige is almost the opposite.", "ko": "명망은 거의 그 반대이다.", "chunks": [["Prestige is", "명망은 ~이다"], ["almost the opposite.", "거의 그 반대."]]}, {"en": "Prestigious individuals are ones worthy of learning from ─ they are experts, older people.", "ko": "명망 있는 사람은 배울 만한 가치가 있는 사람으로, 전문가이고 연장자이다.", "chunks": [["Prestigious individuals are ones", "명망 있는 사람은 ~한 사람이다"], ["worthy of learning from ─", "배울 만한 가치가 있는 ─"], ["they are experts,", "그들은 전문가이다,"], ["older people.", "연장자."]]}, {"en": "And if someone has prestige in one field, they become high-status individuals and their influence won't be limited to their field; we are likely to copy all their decisions.", "ko": "그리고 만약 어떤 사람이 한 분야에서 명망이 있으면, 그는 높은 지위의 인물이 되고 그의 영향력은 자신의 분야로만 국한되지 않을 것이며, 우리는 그의 모든 결정을 모방할 가능성이 있다.", "chunks": [["And if someone has prestige in one field,", "그리고 만약 어떤 사람이 한 분야에서 명망이 있으면,"], ["they become high-status individuals", "그들은 높은 지위의 인물이 된다"], ["and their influence won't be limited to their field;", "그리고 그들의 영향력은 자신의 분야로만 국한되지 않을 것이다;"], ["we are likely to copy all their decisions.", "우리는 그들의 모든 결정을 모방할 가능성이 있다."]]}, {"en": "Indeed, prestige may have evolved as a way to enhance the benefits of cultural transmission.", "ko": "사실상, 명망은 문화 전파의 이점을 증대시키는 한 가지 방법으로 진화했을 수도 있다.", "chunks": [["Indeed,", "사실,"], ["prestige may have evolved", "명망은 "5\" y2=\"30\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n    </g>\n\n    <text x=\"135\" y=\"197\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">cultural transmission · golfing hero sells a watch</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">prestige is almost the opposite of dominance</text>\n</svg>", "caption": "우세함은 힘으로 지배하는 지위이고, 명망은 배울 만하다고 인정받는 사람에게 부여되는 인간 고유의 지위라는 대비"}, {"no": "7", "title": "p36 (Exercise 7) 지문 ① · Emotion vs Feeling: The Cognitive Assignment We Make", "ktitle": "감정 vs 느낌", "field": "심리·인지", "page": "p.36 Ex.7", "oneline": "‘감정’은 무의식적 신경 반응이다.", "tldr": ["‘감정’은 무의식적 신경 반응이다.", "‘느낌’은 그 감정에 우리가 인지적으로 의미를 ‘배당’하는 것이다.", "전쟁 북은 편을 ‘정하지’ 않고, 이미 정한 편의 에너지를 ‘증폭’할 뿐이다."], "analogy": "전쟁 북소리는 없던 편을 만들지 않고, 이미 정한 편을 향해 ‘힘을 북돋울’ 뿐이에요. 감정(북소리)은 에너지고, 느낌은 그 에너지를 ‘어디에 쓸지’ 정하는 해석이죠.", "bg": "분야는 심리·인지예요. 핵심 구분 — 무의식적 신경 반응인 ‘감정(emotion)’과 그 의식적 경험인 ‘느낌(feeling)’. → 둘이 어떻게 구별되는지에 주목하며 읽으세요.", "flow": [{"kind": "정의", "t": "감정 = 무의식 신경 반응 / 느낌 = 인지적 배당"}, {"kind": "핵심 능력", "t": "인간은 감정의 의미를 ‘생각·결정’한다"}, {"kind": "예시", "t": "고대 전쟁 북", "d": "이해를 돕는 전형적 예."}, {"kind": "포인트", "t": "북은 ‘편’을 정하지 않는다", "d": "이미 정해진 편에서 작동."}, {"kind": "결론", "t": "감정은 ‘방향’이 아니라 ‘에너지 증폭’"}], "quiz": [["‘감정’과 ‘느낌’은 어떻게 구분되나?", "감정은 무의식적 신경 반응, 느낌은 그 감정에 ‘의미를 배당하는’ 인지적 해석이에요."], ["전쟁 북 비유의 핵심은?", "북은 편을 ‘정해주지’ 않고, 이미 정한 편의 에너지를 ‘증폭’할 뿐이라는 점이에요."], ["핵심 한 문장?", "감정은 무의식 반응이고, 느낌은 그것에 의미를 부여하는 해석이다."]], "vocab": [["refer to", "지칭하다·언급하다"], ["unconscious", "무의식적인"], ["neurobiological", "신경생물학적인"], ["cognitive", "인지의·인지적"], ["assignment", "부여·할당"], ["complicated", "복잡한"], ["dynamic", "역학·동력"]], "en": "Emotions can be used to refer to the unconscious, neurobiological response, while feelings are the cognitive assignments we make to those emotions. This is undoubtedly a much more complicated dynamic and there is a great degree of highly detailed information explaining the interworking of these two. However, the most noteworthy application of the distinction between emotion and feeling is that human beings have some ability to cognitively assign, that is, to think about and make a decision about, just what a given emotion we experience might mean. This can be more easily grasped when thinking about a more concrete exemplar ─ ancient war drums. Most would agree that hearing a beating war drum does not lead one to pick a side in a given conflict. A beating war drum merely helps one march more energetically on whichever side was chosen to begin with. The neurobiological experience set off by the auditory sensation of the drums causes one to \"feel\" more energy toward a given end and step more quickly. Perhaps Shakespeare knew something of this when he wrote Timon's words, \"follow thy drum ...\".", "ko": "감정은 무의식적인 신경생물학적 반응을 지칭하는 데 사용될 수 있는 반면, 느낌은 우리가 그 감정에 대해 시행하는 인지적인 배당 과제이다. 이것은 의심할 여지 없이 훨씬 더 복잡한 역학이며, 이 둘의 상호 작용을 설명하는 매우 세부적인 정보가 많이 존재한다. 그러나 감정과 느낌의 구분을 적용할 때 가장 주목할 만한 점은, 인간이 우리가 경험하는 특정한 감정이 무엇을 의미할 수도 있는지를 인지적인 면에 배당할 수 있는, 다시 말하면 그것에 대하여 생각하고 결정할 수 있는 능력을 가지고 있다는 것이다. 이것은 더 구체적인 전형적인 예, 즉 고대의 전쟁 북을 떠올려 보면 더 쉽게 이해될 수 있다. 대부분의 사람들은 누가 전쟁 북소리를 듣는다고 해서 특정한 분쟁에서 어느 편을 선택하게 되는 것은 아니라는 데 동의할 것이다. 울리는 전쟁 북은 처음에 선택된 것이 어느 편이든 그편에서 사람이 더 힘차게 행진하도록 도울 뿐이다. 북이 주는 청각적 자극에 의해 촉발되는 신경 생물학적 경험은 사람으로 하여금 특정한 목표를 향해 더 큰 에너지를 \"느끼게\" 하고 발걸음을 더 빠르게 한다. 아마 셰익스피어는 Timon의 대사, \"그대의 북소리를 따르라...\"를 쓸 때 이것에 대해 뭔가 알고 있었을 것이다.", "read": [{"en": "Emotions can be used to refer to the unconscious, neurobiological response, while feelings are the cognitive assignments we make to those emotions.", "ko": "감정은 무의식적인 신경생물학적 반응을 지칭하는 데 사용될 수 있는 반면, 느낌은 우리가 그 감정에 대해 시행하는 인지적인 배당 과제이다.", "chunks": [["Emotions can be used", "감정은 사용될 수 있다"], ["to refer to the unconscious, neurobiological response,", "무의식적인 신경생물학적 반응을 지칭하는 데,"], ["while feelings are the cognitive assignments", "반면에 느낌은 인지적인 배당 과제이다"], ["we make to those emotions.", "우리가 그 감정에 대해 시행하는."]]}, {"en": "This is undoubtedly a much more complicated dynamic and there is a great degree of highly detailed information explaining the interworking of these two.", "ko": "이것은 의심할 여지 없이 훨씬 더 복잡한 역학이며, 이 둘의 상호 작용을 설명하는 매우 세부적인 정보가 많이 존재한다.", "chunks": [["This is undoubtedly", "이것은 의심할 여지 없이"], ["a much more complicated dynamic", "훨씬 더 복잡한 역학이다"], ["and there is a great degree of", "그리고 상당히 많은 양의 ~이 있다"], ["highly detailed information", "매우 세부적인 정보가"], ["explaining the interworking of these two.", "이 둘의 상호 작용을 설명하는."]]}, {"en": "However, the most noteworthy application of the distinction between emotion and feeling is that human beings have some ability to cognitively assign, that is, to think about and make a decision about, just what a given emotion we experience might mean.", "ko": "그러나 감정과 느낌의 구분을 적용할 때 가장 주목할 만한 점은, 인간이 우리가 경험하는 특정한 감정이 무엇을 의미할 수도 있는지를 인지적인 면에 배당할 수 있는, 다시 말하면 그것에 대하여 생각하고 결정할 수 있는 능력을 가지고 있다는 것이다.", "chunks": [["However, the most noteworthy application", "그러나 가장 주목할 만한 적용은"], ["of the distinction between emotion and feeling", "감정과 느낌의 구별의"], ["is that human beings have some ability", "인간이 어떤 능력을 가지고 있다는 것이다"], ["to cognitively assign, that is,", "인지적으로 배당할 수 있는, 다시 말해,"], ["to think about and make a decision about,", "~에 대해 생각하고 결정할 수 있는 능력,"], ["just what a given emotion we experience might mean.", "우리가 경험하는 특정한 감정이 무엇을 의미할 수도 있는지에 대해."]]}, {"en": "This can be more easily grasped when thinking about a more concrete exemplar ─ ancient war drums.", "ko": "이것은 더 구체적인 전형적인 예, 즉 고대의 전쟁 북을 떠올려 보면 더 쉽게 이해될 수 있다.", "chunks": [["This can be more easily grasped", "이것은 더 쉽게 이해될 수 있다"], ["when thinking about", "~을 떠올려 보면"], ["a more concrete exemplar", "더 구체적인 전형적인 예"], ["─ ancient war drums.", "즉 고대의 전쟁 북을."]]}, {"en": "Most would agree that hearing a beating war drum does not lead one to pick a side in a given conflict.", "ko": "대부분의 사람들은 누가 전쟁 북소리를 듣는다고 해서 특정한 분쟁에서 어느 편을 선택하게 되는 것은 아니라는 데 동의할 것이다.", "chunks": [["Most would agree", "대부분의 사람들은 동의할 것이다"], ["that hearing a beating war drum", "울리는 전쟁 북을 듣는 것이"], ["does not lead one", "사람으로 하여금 ~하게 이끌지 않는다는 것에"], ["to pick a side", "편을 선택하도록"], ["in a given conflict.", "특정한 분쟁에서."]]}, {"en": "A beating war drum merely helps one march more energetically on whichever side was chosen to begin with.", "ko": "울리는 전쟁 북은 처음에 선택된 것이 어느 편이든 그편에서 사람이 더 힘차게 행진하도록 도울 뿐이다.", "chunks": [["A beating war drum merely helps one march", "울리는 전쟁 북은 사람이 행진하도록 그저 도울 뿐이다"], ["more energetically", "더 힘차게"], ["on whichever side", "어느 편에서든"], ["was chosen to begin with.", "처음에 선택된 것이."]]}, {"en": "The neurobiological experience set off by the auditory sensation of the drums causes one to \"feel\" more energy toward a given end and step more quickly.", "ko": "북이 주는 청각적 자극에 의해 촉발되는 신경 생물학적 경험은 사람으로 하여금 특정한 목표를 향해 더 큰 에너지를 \"느끼게\" 하고 발걸음을 더 빠르게 한다.", "chunks": [["The neurobiological experience", "신경생물학적 경험은"], ["set off by the auditory sensation of the drums", "북의 청각적 자극에 의해 촉발된"], ["causes one", "사람으로 하여금 ~하게 한다"], ["to \"feel\" more energy", "더 큰 에너지를 \"느끼고\""], ["toward a given end", "특정한 목표를 향해"], ["and step more quickly.", "그리고 발걸음을 더 빠르게 하도록."]]}, {"en": "Perhaps Shakespeare knew something of this when he wrote Timon's words, \"follow thy drum ...\".", "ko": "아마 셰익스피어는 Timon의 대사, \"그대의 북소리를 따르라...\"를 쓸 때 이것에 대해 뭔가 알고 있었을 것이다.", "chunks": [["Perhaps Shakespeare knew", "아마 셰익스피어는 알고 있었을 것이다"], ["something of this", "이것에 대해 뭔가"], ["when he wrote Timon's words,", "Timon의 대사를 썼을 때"], ["\"follow thy drum ...\".", "\"그대의 북소리를 따르라...\"를."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 전쟁 북이 울리고 청각 자극이 가운데 사람의 머리 안 인지 박스로 들어가 이미 정한 편이라는 사전 결정에 의미가 부여되며, 오른쪽으로 행동 에너지가 증폭되어 더 빠른 행진으로 나타나는 그림\">\n  <!-- 좌측: 전쟁 북 (자극) -->\n  <g transform=\"translate(20, 60)\">\n    <text x=\"55\" y=\"-12\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=

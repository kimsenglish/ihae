   \n    <!-- 사람 (옆모습) -->\n    <g transform=\"translate(100, 75)\">\n      <!-- 머리 (크게, 안에 인지 박스 들어감) -->\n      <ellipse cx=\"0\" cy=\"0\" rx=\"42\" ry=\"38\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <!-- 눈 -->\n      <circle cx=\"22\" cy=\"-5\" r=\"2\" fill=\"#1a1a1a\"/>\n      <!-- 입 -->\n      <path d=\"M 22 10 Q 28 13 32 8\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      \n      <!-- 머리 안 인지 박스 (이미 정한 목표) -->\n      <g transform=\"translate(-12, -2)\">\n        <rect x=\"-22\" y=\"-12\" width=\"44\" height=\"24\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n        <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">pre-chosen</text>\n        <text x=\"0\" y=\"8\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">side</text>\n      </g>\n    </g>\n    \n    <!-- 화살표 좌→ 머리로 들어옴 -->\n    <line x1=\"35\" y1=\"75\" x2=\"55\" y2=\"75\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <polygon points=\"55,75 47,71 47,79\" fill=\"#c8102e\"/>\n    \n    <!-- 화살표 머리→ 우로 나감 -->\n    <line x1=\"145\" y1=\"75\" x2=\"170\" y2=\"75\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n    <polygon points=\"170,75 162,71 162,79\" fill=\"#1FA34A\"/>\n    \n    <text x=\"100\" y=\"138\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">we assign meaning</text>\n    <text x=\"100\" y=\"151\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">자극에 의미 부여</text>\n  </g>\n\n  <!-- 우측: 행동 에너지 증폭 + 더 빠른 행진 -->\n  <g transform=\"translate(415, 60)\">\n    <text x=\"80\" y=\"-12\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">결과 — 에너지 증폭</text>\n    <text x=\"80\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">\"feel more energy\"</text>\n    \n    <!-- 행진하는 사람 (더 빠르게) -->\n    <g transform=\"translate(80, 75)\">\n      <!-- 머리 -->\n      <circle cx=\"0\" cy=\"-22\" r=\"11\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <circle cx=\"-3\" cy=\"-23\" r=\"1.2\" fill=\"#1FA34A\"/>\n      <circle cx=\"3\" cy=\"-23\" r=\"1.2\" fill=\"#1FA34A\"/>\n      <!-- 결의 표정 -->\n      <line x1=\"-4\" y1=\"-17\" x2=\"4\" y2=\"-17\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <!-- 몸 -->\n      <line x1=\"0\" y1=\"-11\" x2=\"0\" y2=\"20\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <!-- 팔 (큰 동작) -->\n      <line x1=\"0\" y1=\"-5\" x2=\"-15\" y2=\"-15\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <line x1=\"0\" y1=\"-5\" x2=\"18\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <!-- 다리 (성큼 걷는 자세) -->\n      <line x1=\"0\" y1=\"20\" x2=\"-12\" y2=\"40\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <line x1=\"0\" y1=\"20\" x2=\"14\" y2=\"42\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n    </g>\n    \n    <!-- 속도선 (motion lines) -->\n    <g stroke=\"#1FA34A\" stroke-width=\"1.4\" fill=\"none\">\n      <line x1=\"20\" y1=\"65\" x2=\"30\" y2=\"65\"/>\n      <line x1=\"15\" y1=\"75\" x2=\"28\" y2=\"75\"/>\n      <line x1=\"20\" y1=\"85\" x2=\"30\" y2=\"85\"/>\n    </g>\n    \n    <!-- 에너지 표시 (위 화살표) -->\n    <g transform=\"translate(135, 60)\">\n      <line x1=\"0\" y1=\"10\" x2=\"0\" y2=\"-10\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <polygon points=\"0,-10 -4,-3 4,-3\" fill=\"#1FA34A\"/>\n      <text x=\"0\" y=\"-15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">energy ↑</text>\n    </g>\n    \n    <text x=\"80\" y=\"138\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">march more energetically</text>\n    <text x=\"80\" y=\"151\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">더 힘차게 행진</text>\n  </g>\n\n  <!-- 하단 인용 (Shakespeare) -->\n  <text x=\"300\" y=\"230\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">\"follow thy drum...\" — Shakespeare, Timon</text>\n  \n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"250\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">drum does NOT pick the side — it amplifies the side already chosen</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '감정 = 무의식 신경 반응 / 느낌 = 인지적 배당'이고, 마지막은 '감정은 ‘방향’이 아니라 ‘에너지 증폭’'로 정리된다."}, {"no": "8", "title": "p37 (Exercise 8) 지문 ② · Mesopotamia: Irrigation as the Foundation of Power", "ktitle": "관개가 만든 권력", "field": "역사·문명", "page": "p.37 Ex.8", "oneline": "관개(물 대기)는 메소포타미아 농업의 ‘열쇠’였다.", "tldr": ["관개(물 대기)는 메소포타미아 농업의 ‘열쇠’였다.", "대규모 관개는 전례 없는 협력·조직을 요구했다.", "그 결과 복잡한 사회 구조·도시국가·권력 집중으로 이어졌다."], "analogy": "큰 댐·수로를 만들려면 수많은 사람을 모아 ‘조직’해야 하죠. 그 조직을 누가 쥐느냐가 곧 권력이 됩니다 — 물 관리가 곧 권력이 된 거예요.", "bg": "분야는 역사·문명이에요. 핵심어는 ‘관개(irrigation)’ — 메소포타미아 농업의 열쇠. → 관개가 문명에 어떤 결과를 가져왔는지에 주목하며 읽으세요.", "flow": [{"kind": "핵심", "t": "관개 = 농업 잠재력의 열쇠"}, {"kind": "기술", "t": "운하·제방·저수지", "d": "강 흐름을 통제, 홍수 방지."}, {"kind": "필요", "t": "전례 없는 협력·조직"}, {"kind": "결과", "t": "복잡한 사회·도시국가 등장"}, {"kind": "권력", "t": "사제·권력자가 노동을 조직·감독", "d": "물 관리 → 권력 집중."}], "quiz": [["관개가 메소포타미아에서 한 역할은?", "농업 잠재력을 끌어낸 ‘열쇠’였고, 대규모 협력을 요구해 사회·권력 구조를 키웠어요."], ["관개가 ‘권력’과 연결된 이유는?", "대규모 협력·조직이 필요했고, 그 노동을 조직·감독한 사제·권력자에게 힘이 집중됐기 때문이에요."], ["핵심 한 문장?", "관개가 요구한 대규모 협력이 복잡한 사회와 권력 집중을 낳았다."]], "vocab": [["unlock", "드러내다·열다"], ["agricultural", "농업의"], ["potential", "잠재력"], ["lay", "있다·놓여 있다 (lie의 과거)"], ["irrigation", "관개"], ["particularly", "특히"]], "en": "The key to unlocking the agricultural potential of Mesopotamia lay in irrigation. Early Mesopotamians, particularly the Sumerians, were pioneers in developing sophisticated irrigation techniques. They constructed canals, dikes, and reservoirs to control the flow of the rivers, diverting water to their fields during dry periods and protecting their settlements from floods. This monumental effort required cooperation and organization on a scale previously unseen, leading to the development of complex social structures and the rise of powerful city-states. Early irrigation was relatively small-scale, involving the digging of simple channels to divert water to nearby fields. Over time, these systems became more elaborate, with complex networks of canals spanning vast distances. The construction and maintenance of these systems required a significant labor force, which was often organized and directed by temple priests or powerful leaders. This centralized control over water resources provided a basis for political power and social hierarchy.", "ko": "메소포타미아의 농업 잠재력을 드러내는 열쇠는 관개에 있었다. 초기 메소포타미아인들, 특히 수메르인들은 정교한 관개 기술을 개발하는 데 선구자였다. 그들은 강의 흐름을 통제하기 위해 운하, 제방, 저수지를 건설하여, 건기에는 물을 경작지로 돌리고, 홍수로부터 그들의 정착지를 보호했다. 이러한 거대한 노력에는 전에 본 적이 없는 규모의 협력과 조직이 필요했으며, 이는 복잡한 사회 구조의 발달과 강력한 도시 국가의 등장으로 이어졌다. 초기의 관개는 비교적 소규모로, 가까운 경작지로 물을 돌리기 위해 단순한 수로를 파는 것을 포함했다. 시간이 지나면서 이러한 시스템은 더 정교해져 복잡한 운하망이 아주 먼 거리까지 뻗게 되었다. 이러한 시스템의 건설과 유지에는 상당한 노동력이 필요했으며, 이는 흔히 사원 사제나 권력자들에 의해 조직되고 감독되었다. 수자원에 대한 이러한 중앙 집권화된 통제는 정치적 권력과 사회적 위계의 기반을 제공하였다.", "read": [{"en": "The key to unlocking the agricultural potential of Mesopotamia lay in irrigation.", "ko": "메소포타미아의 농업 잠재력을 드러내는 열쇠는 관개에 있었다.", "chunks": [["The key to unlocking", "드러내는 열쇠는"], ["the agricultural potential of Mesopotamia", "메소포타미아의 농업 잠재력을"], ["lay in irrigation.", "관개에 있었다."]]}, {"en": "Early Mesopotamians, particularly the Sumerians, were pioneers in developing sophisticated irrigation techniques.", "ko": "초기 메소포타미아인들, 특히 수메르인들은 정교한 관개 기술을 개발하는 데 선구자였다.", "chunks": [["Early Mesopotamians,", "초기 메소포타미아인들은,"], ["particularly the Sumerians,", "특히 수메르인들은,"], ["were pioneers in developing", "개발하는 데 있어 선구자였다"], ["sophisticated irrigation techniques.", "정교한 관개 기술을."]]}, {"en": "They constructed canals, dikes, and reservoirs to control the flow of the rivers, diverting water to their fields during dry periods and protecting their settlements from floods.", "ko": "그들은 강의 흐름을 통제하기 위해 운하, 제방, 저수지를 건설하여, 건기에는 물을 경작지로 돌리고, 홍수로부터 그들의 정착지를 보호했다.", "chunks": [["They constructed canals, dikes, and reservoirs", "그들은 운하, 제방, 저수지를 건설했다"], ["to control the flow of the rivers,", "강의 흐름을 통제하기 위해,"], ["diverting water to their fields", "경작지로 물을 돌리고"], ["during dry periods", "건기에는"], ["and protecting their settlements from floods.", "그리고 홍수로부터 정착지를 보호하면서."]]}, {"en": "This monumental effort required cooperation and organization on a scale previously unseen, leading to the development of complex social structures and the rise of powerful city-states.", "ko": "이러한 거대한 노력에는 전에 본 적이 없는 규모의 협력과 조직이 필요했으며, 이는 복잡한 사회 구조의 발달과 강력한 도시 국가의 등장으로 이어졌다.", "chunks": [["This monumental effort required", "이 거대한 노력은 ~을 필요로 했다"], ["cooperation and organization", "협력과 조직을"], ["on a scale previously unseen,", "이전에 보지 못한 규모의,"], ["leading to the development of", "~의 발달로 이어졌다"], ["complex social structures", "복잡한 사회 구조"], ["and the rise of powerful city-states.", "그리고 강력한 도시 국가의 등장."]]}, {"en": "Early irrigation was relatively small-scale, involving the digging of simple channels to divert water to nearby fields.", "ko": "초기의 관개는 비교적 소규모로, 가까운 경작지로 물을 돌리기 위해 단순한 수로를 파는 것을 포함했다.", "chunks": [["Early irrigation was relatively small-scale,", "초기 관개는 비교적 소규모였다,"], ["involving the digging of simple channels", "단순한 수로를 파는 것을 포함하여"], ["to divert water to nearby fields.", "가까운 경작지로 물을 돌리기 위해."]]}, {"en": "Over time, these systems became more elaborate, with complex networks of canals spanning vast distances.", "ko": "시간이 지나면서 이러한 시스템은 더 정교해져 복잡한 운하망이 아주 먼 거리까지 뻗게 되었다.", "chunks": [["Over time,", "시간이 지나면서,"], ["these systems became more elaborate,", "이러한 시스템은 더 정교해졌다,"], ["with complex networks of canals", "복잡한 운하망이"] "8\" ry=\"3\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"-130\" y=\"42\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7\" text-anchor=\"middle\" fill=\"#5e5e5e\">reservoir</text>\n  </g>\n\n  <!-- 좌측 시작 라벨 -->\n  <text x=\"120\" y=\"232\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\" transform=\"rotate(-90, 120, 232)\">irrigation</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '관개 = 농업 잠재력의 열쇠'이고, 마지막은 '사제·권력자가 노동을 조직·감독'로 정리된다."}, {"no": "9", "title": "p38 (Exercise 9) 지문 ③ · Civilization as Exchange: The Enemy of Culture", "ktitle": "문명 = 교류 — 해방과 정체성 약화의 양면", "field": "인문·사회", "page": "p.38 Ex.9", "oneline": "‘문화’가 농업처럼 뿌리내림이라면, ‘문명’은 교류와 탈출의 힘이다. 문명은 해방과 선택지를 주지만, 동시에 기존 문화와 정체성을 약화·파괴할 수 있다.", "tldr": ["문화는 뿌리내림·정착의 이미지와 연결된다.", "문명은 교류와 이동을 통해 문화의 경계를 벗어나는 힘이다.", "그래서 문명은 해방을 주지만, 동시에 기존 문화와 정체성을 약화하거나 파괴할 수 있다."], "analogy": "여러 곳 사람들과 ‘주고받다(교환)’ 보면 더 낫고 싼 것을 비교·선택하게 되죠. 문명은 그 교환을 통해 ‘예전의 우리’에 갇히지 않게 해 줘요 — 해방이자 동시에 불안이기도 하고요.", "bg": "분야는 인문·사회예요. 핵심 비유 — ‘문화’가 농업(뿌리내림)이라면 ‘문명’은 교류라는 것. → 문화와 문명을 어떻게 구별하는지에 주목하며 읽으세요.", "flow": [{"kind": "비유", "t": "문화 = 농업 / 문명 = 교류"}, {"kind": "연결", "t": "다른 사회와 연결 → 비교 가능"}, {"kind": "선택", "t": "더 낫고 싼 것을 고른다", "d": "새로운 것·안 해본 것."}, {"kind": "효과", "t": "시야 확장·삶 향상"}, {"kind": "결론", "t": "문명 = 탈출·해방 (동시에 불안)", "d": "더 이상 ‘지금의 나’일 필요 없음."}], "quiz": [["글에서 ‘문화’와 ‘문명’은 각각 무엇에 비유되나?", "문화는 ‘농업(정착·뿌리)’, 문명은 ‘교류(이동·비교)’에 비유돼요."], ["교류(문명)가 우리에게 주는 효과는?", "비교·선택을 가능하게 해 시야를 넓히고 삶을 향상시키며, ‘옛 방식’에서 벗어나게 해요(해방이자 불안)."], ["핵심 한 문장?", "문명은 교류로 비교·선택을 낳아 우리를 옛 방식에서 벗어나게 한다."]], "vocab": [["metaphorical", "은유적인·비유적인"], ["basis", "기반·기초"], ["exchange", "교류·교환"], ["compare", "비교하다"], ["in relation to", "~과 관련하여"], ["option", "선택지"]], "en": "If culture finds its metaphorical basis in agriculture, civilization finds it in exchange. When our society is connected to other societies, we are connected to other people, and we can suddenly compare things and judge them in relation to each other. As a result, we have a choice between better and cheaper options; we can pick the new and the never-before-tried. Such choices broaden our horizons and improve our lives. This is why civilization depends on the unencumbered circulation of goods, people, ideas, faiths, and ways of life. The consequences of such interaction may be unsettling, but they can also be liberating. We no longer have to be confined to, and carry the burden of, our culture, and we no longer have to be who we are. Civilization provides us with a means of escape. Or, differently put, exchange is the enemy of culture. When presented with alternatives, we give up our old ways. We no longer do the things we used to do and we are no longer quite the same people as before. This is how civilization undermines and destroys culture.", "ko": "문화가 농업에서 그 은유적 기반을 찾는다면, 문명은 교류에서 그것을 찾는다. 우리 사회가 다른 사회와 연결될 때, 우리는 다른 사람들과 연결되며, 우리는 갑자기 사물들을 비교하고 서로 관련하여 판단할 수 있게 된다. 그 결과, 우리는 더 낫고 더 저렴한 선택지들 사이에서 선택하는데, 즉 우리는 새로운 것들과 전에는 한 번도 시도해 보지 못한 것들을 고를 수 있는 것이다. 그런 선택은 우리의 시야를 넓혀 주고 우리의 삶을 향상시킨다. 이 때문에 문명은 재화, 사람, 사상, 신앙, 그리고 생활방식의 방해받지 않는 순환에 의존한다. 이러한 상호 작용의 결과는 불안하게 할 수도 있지만, 동시에 해방감을 줄 수도 있다. 우리는 더 이상 우리 문화에 갇히거나 그것의 짐을 짊어져야만 할 필요가 없고, 더 이상 지금의 우리가 될 필요도 없다. 문명은 우리에게 탈출의 수단을 제공한다. 또는 달리 말하면, 교류는 문화의 적이다. 대안이 제시되는 경우, 우리는 오래된 방식을 포기한다. 우리는 더 이상 전에 했던 일을 하지 않으며, 더 이상 전과 완전히 같은 사람은 아니다. 이것이 문명이 문화를 약화시키고 파괴하는 방식이다.", "read": [{"en": "If culture finds its metaphorical basis in agriculture, civilization finds it in exchange.", "ko": "문화가 농업에서 그 은유적 기반을 찾는다면, 문명은 교류에서 그것을 찾는다.", "chunks": [["If culture finds its metaphorical basis", "문화가 그 은유적 기반을 찾는다면"], ["in agriculture,", "농업에서,"], ["civilization finds it", "문명은 그것을 찾는다"], ["in exchange.", "교류에서."]]}, {"en": "When our society is connected to other societies, we are connected to other people, and we can suddenly compare things and judge them in relation to each other.", "ko": "우리 사회가 다른 사회와 연결될 때, 우리는 다른 사람들과 연결되며, 우리는 갑자기 사물들을 비교하고 서로 관련하여 판단할 수 있게 된다.", "chunks": [["When our society is connected to other societies,", "우리 사회가 다른 사회와 연결될 때,"], ["we are connected to other people,", "우리는 다른 사람들과 연결되고,"], ["and we can suddenly compare things", "그리고 우리는 갑자기 사물들을 비교할 수 있다"], ["and judge them", "그리고 그것들을 판단할 수 있다"], ["in relation to each other.", "서로와 관련하여."]]}, {"en": "As a result, we have a choice between better and cheaper options; we can pick the new and the never-before-tried.", "ko": "그 결과, 우리는 더 낫고 더 저렴한 선택지들 사이에서 선택하는데, 즉 우리는 새로운 것들과 전에는 한 번도 시도해 보지 못한 것들을 고를 수 있는 것이다.", "chunks": [["As a result,", "그 결과,"], ["we have a choice", "우리는 선택권을 갖는다"], ["between better and cheaper options;", "더 낫고 더 저렴한 선택지들 사이에서;"], ["we can pick the new", "우리는 새로운 것을 고를 수 있다"], ["and the never-before-tried.", "그리고 한 번도 시도해 보지 못한 것을."]]}, {"en": "Such choices broaden our horizons and improve our lives.", "ko": "그런 선택은 우리의 시야를 넓혀 주고 우리의 삶을 향상시킨다.", "chunks": [["Such choices broaden our horizons", "그러한 선택은 우리의 시야를 넓혀 준다"], ["and improve our lives.", "그리고 우리의 삶을 향상시킨다."]]}, {"en": "This is why civilization depends on the unencumbered circulation of goods, people, ideas, faiths, and ways of life.", "ko": "이 때문에 문명은 재화, 사람, 사상, 신앙, 그리고 생활방식의 방해받지 않는 순환에 의존한다.", "chunks": [["This is why", "이 때문에"], ["civilization depends on", "문명은 ~에 의존한다"], ["the unencumbered circulation of", "~의 방해받지 않는 순환에"], ["goods, people, ideas, faiths, and ways of life.", "재화, 사람, 사상, 신앙, 그리고 생활방식의."]]}, {"en": "The consequences of such interaction may be unsettling, but they can also be liberating.", "ko": "이러한 상호 작용의 결과는 불안하게 할 수도 있지만, 동시에 해방감을 줄 수도 있다.", "chunks": [["The consequences of such interaction", "그러한 상호 작용의 결과는"], ["may be unsettling,", "불안하게 할 수도 있다,"], ["but they can also be liberating.", "그러나 동시에 해방감을 줄 수도 있다."]]}, {"en": "We no longer have to be confined to, and carry the burden of, our culture, and we no longer have to be who we are.", "ko": "우리는 더 이상 우리 문화에 갇히거나 그것의 짐을 짊어져야만 할 필요가 없고, 더 이상 지금의 우리가 될 필요도 없다.", "chunks": [["We no longer have to be", "우리는 더 이상 ~할 필요가 없다"], ["confined to, and carry the burden of,", "~에 갇히거나, ~의 짐을 짊어지지"], ["our culture,", "우리 문화의,"], ["and we no longer have to be", "그리고 우리는 더 이상 ~일 필요가 없다"], ["who we are.", "지금의 우리가."]]}, {"en": "Civilization provides us with a means of escape.", "ko": "문명은 우리에게 탈출의 수단을 제공한다.", "chunks": [["Civilization provides us", "문명은 우리에게 ~을 제공한다"], ["with a means of escape.", "탈출의 수단을."]]}, {"en": "Or, differently put, exchange is the enemy of culture.", "ko": "또는 달리 말하면, 교류는 문화의 적이다.", "chunks": [["Or, differently put,", "또는, 달리 말하면,"], ["exchange is the enemy of culture.", "교류는 문화의 적이다."]]}, {"en": "When presented with alternatives, we give up our old ways.", "ko": "대안이 제시되는 경우, 우리는 오래된 방식을 포기한다.", "chunks": [["When presented with alternatives,", "대안이 제시되면,"], ["we give up our old ways.", "우리는 오래된 방식을 포기한다."]]}, {"en": "We no longer do the things we used to do and we are no longer quite the same people as before.", "ko": "우리는 더 이상 전에 했던 일을 하지 않으며, 더 이상 전과 완전히 같은 사람은 아니다.", "chunks": [["We no longer do", "우리는 더 이상 ~을 하지 않는다"], ["the things we used to do", "예전에 하곤 했던 것들을"], ["and we are no longer", "그리고 우리는 더 이상 ~ 아니다"], ["quite the same people as before.", "전과 완전히 같은 사람."]]}, {"en": "This is how civilization undermines and destroys culture.", "ko": "이것이 문명이 문화를 약화시키고 파괴하는 방식이다.", "chunks": [["This is how", "이것이 ~하는 방식이다"], ["civilization undermines and destroys culture.", "문명이 문화를 약화시키고 파괴하는."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 옛 문화 영역의 집·전통이 점선으로 옅어지며 무너지고, 가운데 exchange 다리 위로 사람이 건너 오른쪽 문명 영역의 새 선택지·해방으로 향하는 양면성 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">교류(exchange) — 해방의 다리이자 문화의 적</text>\n\n  <!-- 좌측: culture (옛 문화 영역) -->\n  <g transform=\"translate(20, 50)\">\n    <text x=\"100\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">culture — 농업적 기반</text>\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"160\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/>\n\n    <!-- 옛 집 (전통, 점선·무너지는 중) -->\n    <g transform=\"translate(50, 90)\" opacity=\"0.55\">\n      <!-- 지붕 (점선) -->\n      <path d=\"M -22 0 L 0 -25 L 22 0 Z\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n      <!-- 벽 (점선) -->\n      <rect x=\"-18\" y=\"0\" width=\"36\" height=\"30\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n      <!-- 문 -->\n      <rect x=\"-5\" y=\"12\" width=\"10\" height=\"18\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\"/>\n    </g>\n\n    <!-- 옛 자아 (점선 stick figure, 사라지는 중) -->\n    <g transform=\"translate(130, 95)\" opacity=\"0.5\">\n      <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"0\" y1=\"8\" x2=\"0\" y2=\"25\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"0\" y1=\"13\" x2=\"-7\" y2=\"18\" stroke=\"#c8102e\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"0\" y1=\"13\" x2=\"7\" y2=\"18\" stroke=\"#c8102e\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"0\" y1=\"25\" x2=\"-5\" y2=\"38\" stroke=\"#c8102e\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"0\" y1=\"25\" x2=\"5\" y2=\"38\" stroke=\"#c8102e\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\"/>\n    </g>\n\n    <!-- 옛 도구 (사라지는 중) -->\n    <g transform=\"translate(45, 145)\" opacity=\"0.45\">\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-18\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"2 2\"/>\n      <path d=\"M -4 -18 L 4 -18 L 6 -22 L -6 -22 Z\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"2 2\"/>\n    </g>\n\n    <text x=\"100\" y=\"148\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">old ways · old self</text>\n  </g>\n\n  <!-- 가운데: exchange 다리 -->\n  <g transform=\"translate(225, 130)\">\n    <!-- 다리 (가로 곡선) -->\n    <path d=\"M 0 30 Q 75 -10 150 30\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"2.4\"/>\n    <!-- 다리 지지대들 -->\n    <line x1=\"20\" y1=\"22\" x2=\"20\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <line x1=\"75\" y1=\"3\" x2=\"75\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <line x1=\"100\" y1=\"10\" x2=\"100\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <line x1=\"130\" y1=\"22\" x2=\"130\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n\n    <!-- 다리 위 사람 (오른쪽으로 향함) -->\n    <g transform=\"translate(70, -10)\">\n      <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <circle cx=\"-2\" cy=\"-1\" r=\"0.9\" fill=\"#1a1a1a\"/>\n      <circle cx=\"2\" cy=\"-1\" r=\"0.9\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 3 Q 0 5 3 3\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"8\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"14\" x2=\"-8\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"14\" x2=\"9\" y2=\"18\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"-5\" y2=\"35\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"7\" y2=\"35\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    </g>\n\n    <!-- 다리 위 라벨 -->\n    <text x=\"75\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">exchange</text>\n    <text x=\"75\" y=\"-18\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">교류</text>\n    <text x=\"75\" y=\"62\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">circulation of goods, people, ideas, faiths</text>\n  </g>\n\n  <!-- 우측: civilization (새 영역) -->\n  <g transform=\"translate(380, 50)\">\n    <text x=\"100\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">civilization — 새 선택지</text>\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"160\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 새 선택지 라벨 (떠다님) -->\n    <g font-family=\"Noto Serif\" font-style=\"italic\" font-weight=\"700\" fill=\"#1FA34A\" font-size=\"9.5\">\n      <g transform=\"translate(45, 30)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"32\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">new options</text>\n      </g>\n      <g transform=\"translate(150, 38)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"35\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">never-tried</text>\n      </g>\n      <g transform=\"translate(40, 75)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"32\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">liberating</text>\n      </g>\n      <g transform=\"translate(150, 80)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"32\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">escape</text>\n      </g>\n      <g transform=\"translate(55, 120)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"36\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">compare · judge</text>\n      </g>\n      <g transform=\"translate(155, 122)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"32\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" text-anchor=\"middle\">broaden</text>\n      </g>\n    </g>\n\n    <text x=\"100\" y=\"150\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">improve our lives</text>\n  </g>\n\n  <!-- 하단 결론 (양면성) -->\n  <text x=\"300\" y=\"237\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">liberating · BUT exchange undermines and destroys culture</text>\n  <text x=\"300\" y=\"251\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">해방 — 그러나 옛 자아·옛 방식은 사라진다</text>\n</svg>", "caption": "문화는 뿌리내림, 문명은 교류와 탈출. 문명은 해방의 길이지만 기존 문화와 정체성을 약화할 수도 있다는 양면 구조"}, {"no": "10", "title": "p39 (Exercise 10) 지문 ④ · Science and Democracy: Legitimacy by Representation", "ktitle": "과학과 민주주의 = 대표성", "field": "과학·정치철학", "page": "p.39 Ex.10", "oneline": "과학과 민주주의는 모두 ‘대표성’으로 권위를 정당화한다.", "tldr": ["과학과 민주주의는 모두 ‘대표성’으로 권위를 정당화한다.", "대표는 곧 ‘단순화’라서 늘 ‘더 나은 대안’의 여지를 남긴다.", "그래서 둘 다 비판·개선 메커니즘이 내장돼 있다."], "analogy": "지도가 실제 땅을 ‘대표(단순화)’하듯, 과학 이론과 정치 대표도 현실을 줄여 보여줘요. 줄였으니 ‘더 잘 줄이는 법’이 늘 가능 — 그래서 비판·개선이 내장돼 있죠.", "bg": "분야는 과학·정치철학이에요. 핵심 공통점 — 과학과 민주주의가 모두 ‘대표성(representation)’으로 권위를 정당화한다는 것. → 둘이 어떻게 닮았는지에 주목하며 읽으세요.", "flow": [{"kind": "공통점", "t": "둘 다 ‘대표성’으로 권위 정당화"}, {"kind": "한계", "t": "대표는 결코 완벽·완전하지 않다"}, {"kind": "핵심", "t": "대표 = 단순화 → 대안 암시", "d": "다른 단순화 방식이 늘 가능."}, {"kind": "귀결", "t": "무엇을 대표할지 끝없는 갈등"}, {"kind": "결론", "t": "비판적 평가 → 내장된 개선 메커니즘"}], "quiz": [["과학과 민주주의의 공통 원리는?", "둘 다 ‘대표성(representation)’으로 권위가 정당화된다는 점이에요."], ["‘대표는 단순화’라는 말이 함의하는 것은?", "단순화 방식엔 늘 대안이 있어, 비판하고 개선할 여지가 내장돼 있다는 거예요."], ["핵심 한 문장?", "과학·민주주의는 ‘대표성(단순화)’에 기대고, 그래서 비판·개선이 내장돼 있다."]], "vocab": [["principle", "원칙·원리"], ["ideal", "이상"], ["oppose", "반대하다"], ["illegitimate", "부당한·정당하지 않은"], ["claim", "주장"], ["authority", "권위"]], "en": "Science and democracy share important principles and ideals that oppose illegitimate claims for knowledge and power. The authority of both scientific knowledge and democratic governance is legitimated by representation. It is only when this representation is accepted as legitimate that it can support the authority of the knowledge claims made, or the authority of particular forms of governance. Representation is, however, never perfect or complete. Since both scientific practices and democratic governance, in principle, admit potential alternative representations, continuous struggles over what is represented and what is not can be foreseen. To represent means to simplify, which implies the existence of alternatives ─ alternative ways of simplifying complicated issues. This further means that both science and democracy have inbuilt mechanisms for improvement, which are based on critical assessments of existing representations.", "ko": "과학과 민주주의는 지식과 권력에 대한 부당한 주장에 반대하는 중요한 원칙과 이상을 공유한다. 과학적 지식과 민주적 통치 둘 다의 권위는 대표성에 의해 정당화된다. 이 대표성이 정당한 것으로 받아들여질 때에만, 제시된 지식 주장의 권위, 혹은 특정한 통치 방식의 권위를 뒷받침할 수 있다. 하지만 대표성은 결코 완벽하거나 완전하지 않다. 과학 활동과 민주적 통치는 둘 다 '원칙적으로' 대안적 대표성의 가능성을 인정하기 때문에, 무엇이 대표되고 무엇이 대표되지 않는지를 둘러싼 지속적인 갈등이 예상될 수 있다. 대표한다는 것은 단순화하는 것을 의미하며, 이는 대안, 즉 복잡한 문제들을 단순화하는 대안 방식이 존재함을 암시한다. 이는 나아가 과학과 민주주의 둘 다 기존의 대표성에 대한 비판적 평가를 바탕으로 한 내재된 개선 메커니즘을 가지고 있다는 것을 의미한다.", "read": [{"en": "Science and democracy share important principles and ideals that oppose illegitimate claims for knowledge and power.", "ko": "과학과 민주주의는 지식과 권력에 대한 부당한 주장에 반대하는 중요한 원칙과 이상을 공유한다.", "chunks": [["Science and democracy share", "과학과 민주주의는 공유한다"], ["important principles and ideals", "중요한 원칙과 이상을"], ["that oppose illegitimate claims", "부당한 주장에 반대하는"], ["for knowledge and power.", "지식과 권력에 대한."]]}, {"en": "The authority of both scientific knowledge and democratic governance is legitimated by representation.", "ko": "과학적 지식과 민주적 통치 둘 다의 권위는 대표성에 의해 정당화된다.", "chunks": [["The authority of both", "둘 다의 권위는"], ["scientific knowledge and democratic governance", "과학 지식과 민주적 통치"], ["is legitimated by representation.", "대표성에 의해 정당화된다."]]}, {"en": "It is only when this representation is accepted as legitimate that it can support the authority of the knowledge claims made, or the authority of particular forms of governance.", "ko": "이 대표성이 정당한 것으로 받아들여질 때에만, 제시된 지식 주장의 권위, 혹은 특정한 통치 방식의 권위를 뒷받침할 수 있다.", "chunks": [["It is only when", "오직 ~할 때에만"], ["this representation is accepted as legitimate", "이 대표성이 정당한 것으로 받아들여질"], ["that it can support", "~이 뒷받침할 수 있다"], ["the authority of the knowledge claims made,", "제시된 지식 주장의 권위,"], ["or the authority of particular forms of governance.", "또는 특정 통치 방식의 권위를."]]}, {"en": "Representation is, however, never perfect or complete.", "ko": "하지만 대표성은 결코 완벽하거나 완전하지 않다.", "chunks": [["Representation is, however,", "하지만 대표성은"], ["never perfect or complete.", "결코 완벽하거나 완전하지 않다."]]}, {"en": "Since both scientific practices and democratic governance, in principle, admit potential alternative representations, continuous struggles over what is represented and what is not can be foreseen.", "ko": "과학 활동과 민주적 통치는 둘 다 '원칙적으로' 대안적 대표성의 가능성을 인정하기 때문에, 무엇이 대표되고 무엇이 대표되지 않는지를 둘러싼 지속적인 갈등이 예상될 수 있다.", "chunks": [["Since both scientific practices and democratic governance,", "과학 활동과 민주적 통치 둘 다,"], ["in principle,", "원칙적으로,"], ["admit potential alternative representations,", "잠재적인 대안적 대표성을 인정하기 때문에,"], ["continuous struggles", "지속적인 갈등이"], ["over what is represented and what is not", "무엇이 대표되고 무엇이 대표되지 않는지를 둘러싼"], ["can be foreseen.", "예상될 수 있다."]]}, {"en": "To represent means to simplify, which implies the existence of alternatives ─ alternative ways of simplifying complicated issues.", "ko": "대표한다는 것은 단순화하는 것을 의미하며, 이는 대안, 즉 복잡한 문제들을 단순화하는 대안 방식이 존재함을 암시한다.", "chunks": [["To represent means to simplify,", "대표한다는 것은 단순화한다는 것을 의미한다,"], ["which implies the existence of alternatives", "이는 대안의 존재를 암시한다"], ["─ alternative ways of simplifying complicated issues.", "즉 복잡한 문제들을 단순화하는 대안 방식들의."]]}, {"en": "This further means that both science and democracy have inbuilt mechanisms for improvement, which are based on critical assessments of existing representations.", "ko": "이는 나아가 과학과 민주주의 둘 다 기존의 대표성에 대한 비판적 평가를 바탕으로 한 내재된 개선 메커니즘을 가지고 있다는 것을 의미한다.", "chunks": [["This further means that", "이는 나아가 ~을 의미한다"], ["both science and democracy have", "과학과 민주주의 둘 다 가지고 있다는 것을"], ["inbuilt mechanisms for improvement,", "내재된 개선 메커니즘을,"], ["which are based on", "이는 ~에 기반한다"], ["critical assessments of existing representations.", "기존 대표성에 대한 비판적 평가에."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"중앙에 현재 대표성 박스가 있고 둘레에 다른 단순화 방식들이 점선 박스로 떠 있으며 외곽에서 비판적 평가 화살표가 중앙으로 들어와 개선 메커니즘으로 이어지는 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">representation — never perfect, always improvable</text>\n\n  <!-- 중앙: 현재 대표성 박스 -->\n  <g transform=\"translate(300, 140)\">\n    <!-- 박스 (현재 대표) -->\n    <rect x=\"-65\" y=\"-30\" width=\"130\" height=\"60\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <text x=\"0\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-weight=\"700\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\">current</text>\n    <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-weight=\"700\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\">representation</text>\n    <text x=\"0\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">단순화한 도식</text>\n\n    <!-- science · democracy 분야 라벨 -->\n    <g transform=\"translate(0, 50)\">\n      <text x=\"-30\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a M 0 -8 A 12 12 0 1 1 -2 8\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <polygon points=\"-2,8 -8,5 -3,13\" fill=\"#1FA34A\"/>\n    </g>\n    <text x=\"95\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" fill=\"#1FA34A\">improve</text>\n    <text x=\"95\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#5e5e5e\">개선</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">inbuilt mechanism for improvement — alternatives drive critique</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '둘 다 ‘대표성’으로 권위 정당화'이고, 마지막은 '비판적 평가 → 내장된 개선 메커니즘'로 정리된다."}, {"no": "11", "title": "p40 (Exercise 11) 지문 ⑤ · Tropical Soils: Life Depends on Recycling Past Life", "ktitle": "열대 토양 — 영양분은 식물에 있다", "field": "생태·과학", "page": "p.40 Ex.11", "oneline": "열대는 비·풍화가 심해 영양분이 흙에서 씻겨 나간다.", "tldr": ["열대는 비·풍화가 심해 영양분이 흙에서 씻겨 나간다.", "그래서 영양분은 ‘토양’이 아니라 ‘식물’에 저장·재활용된다.", "고유 식생이 사라지면 토양 생산력도 함께 사라진다."], "analogy": "통장에 돈이 없고 ‘몸(식물)’에만 돈이 든 셈이에요. 그 몸(숲)을 베어내면 영양분 통장도 텅 비어, 몇십 년 안에 농사조차 안 됩니다.", "bg": "분야는 생태·과학이에요. 열대의 비·풍화로 흙의 영양분이 씻겨 나간다는 것이 핵심. → 그런데도 열대 생태계가 어떻게 유지되는지에 주목하며 읽으세요.", "flow": [{"kind": "배경", "t": "열대 = 강우·풍화 ↑"}, {"kind": "과정", "t": "빗물이 영양분을 씻어 내림", "d": "토양·암석에서 침출."}, {"kind": "핵심", "t": "영양분은 ‘식물’에 보존·재활용", "d": "흙이 아니라 식생이 보관."}, {"kind": "위험", "t": "고유 식생 사라지면 생산력도 사라짐"}, {"kind": "결론", "t": "산림 파괴 후 수십 년 내 농사 불가"}], "quiz": [["열대 토양에서 영양분은 주로 어디에 있나?", "‘토양(흙)’이 아니라 ‘식물 자체’에 저장·재활용돼 있어요."], ["그래서 산림이 파괴되면 무슨 일이 생기나?", "영양분이 식물과 함께 사라져, 수십 년 안에 작물·가축을 기를 수 없을 만큼 토양 생산력이 떨어져요."], ["핵심 한 문장?", "열대 토양의 영양분은 흙이 아닌 식물에 있어, 식생이 사라지면 생산력도 사라진다."]], "vocab": [["geology", "지질·지질학"], ["climate", "기후"], ["region", "지역·지방·권역"], ["sustained", "지속적인·지속된"], ["abundant", "풍부한"], ["rainfall", "강우량"]], "en": "Differences in geology and climate make soils in different regions more or less capable of sustained agriculture. In particular, the abundant rainfall and high weathering rates on the gentle slopes of many tropical landscapes mean that after enough time, rainfall seeping into the ground leaches out almost all of the nutrients from both the soil and the weathered rocks beneath the soil. Once this happens, the lush vegetation essentially feeds on itself, retaining and recycling nutrients inherited from rocks weathered long ago. As most of the nutrients in these areas reside not in the soil but in the plants themselves, once the native vegetation disappears, so does the productive capacity of the soil. Often too few nutrients remain to support either crops or livestock within decades of deforestation. Nutrient-poor tropical soils illustrate the general rule that life depends on recycling past life.", "ko": "지질과 기후의 차이는 여러 지역의 토양이 지속 가능한 농업을 하는 능력을 더 크거나 더 작게 만든다. 특히, 많은 열대 지형에 있는 완만한 경사면의 풍부한 강우량과 높은 풍화 속도는, 시간이 충분히 지나면, 땅속으로 스며드는 빗물이 토양과 토양 아래 풍화된 암석 둘 다에서 거의 모든 영양분을 침출시킨다는 것을 의미한다. 일단 이런 일이 발생하면, 울창한 식생은 본질적으로 스스로에 의존하여 살아가며, 오래전 풍화된 암석으로부터 물려받은 영양분을 보존하고 재활용하게 된다. 이 지역의 영양분 대부분이 토양이 아니라 식물 자체에 존재하기 때문에, 일단 고유 식생이 사라지면 토양의 생산력도 또한 사라진다. 산림이 파괴된 후 수십 년 안에 작물이나 가축을 기를 수 있을 만큼의 영양분이 거의 남지 않게 되는 경우가 흔하다. 영양분이 부족한 열대 토양은 생명체는 과거 생명체의 재활용에 의존한다는 일반적인 법칙을 보여 준다.", "read": [{"en": "Differences in geology and climate make soils in different regions more or less capable of sustained agriculture.", "ko": "지질과 기후의 차이는 여러 지역의 토양이 지속 가능한 농업을 하는 능력을 더 크거나 더 작게 만든다.", "chunks": [["Differences in geology and climate", "지질과 기후의 차이는"], ["make soils in different regions", "여러 지역의 토양을 ~하게 만든다"], ["more or less capable of sustained agriculture.", "지속 가능한 농업을 더 크거나 더 작게 할 수 있게."]]}, {"en": "In particular, the abundant rainfall and high weathering rates on the gentle slopes of many tropical landscapes mean that after enough time, rainfall seeping into the ground leaches out almost all of the nutrients from both the soil and the weathered rocks beneath the soil.", "ko": "특히, 많은 열대 지형에 있는 완만한 경사면의 풍부한 강우량과 높은 풍화 속도는, 시간이 충분히 지나면, 땅속으로 스며드는 빗물이 토양과 토양 아래 풍화된 암석 둘 다에서 거의 모든 영양분을 침출시킨다는 것을 의미한다.", "chunks": [["In particular,", "특히,"], ["the abundant rainfall and high weathering rates", "풍부한 강우량과 높은 풍화 속도는"], ["on the gentle slopes of many tropical landscapes", "많은 열대 지형의 완만한 경사면에 있는"], ["mean that after enough time,", "시간이 충분히 지나면 ~을 의미한다"], ["rainfall seeping into the ground", "땅속으로 스며드는 빗물이"], ["leaches out almost all of the nutrients", "거의 모든 영양분을 침출시킨다"], ["from both the soil and the weathered rocks", "토양과 풍화된 암석 둘 다에서"], ["beneath the soil.", "토양 아래의."]]}, {"en": "Once this happens, the lush vegetation essentially feeds on itself, retaining and recycling nutrients inherited from rocks weathered long ago.", "ko": "일단 이런 일이 발생하면, 울창한 식생은 본질적으로 스스로에 의존하여 살아가며, 오래전 풍화된 암석으로부터 물려받은 영양분을 보존하고 재활용하게 된다.", "chunks": [["Once this happens,", "일단 이런 일이 발생하면,"], ["the lush vegetation essentially feeds on itself,", "울창한 식생은 본질적으로 스스로에 의존하여 살아가며,"], ["retaining and recycling nutrients", "영양분을 보존하고 재활용하면서"], ["inherited from rocks weathered long ago.", "오래전 풍화된 암석으로부터 물려받은."]]}, {"en": "As most of the nutrients in these areas reside not in the soil but in the plants themselves, once the native vegetation disappears, so does the productive capacity of the soil.", "ko": "이 지역의 영양분 대부분이 토양이 아니라 식물 자체에 존재하기 때문에, 일단 고유 식생이 사라지면 토양의 생산력도 또한 사라진다.", "chunks": [["As most of the nutrients in these areas", "이 지역의 영양분 대부분이"], ["reside not in the soil but in the plants themselves,", "토양이 아니라 식물 자체에 존재하기 때문에,"], ["once the native vegetation disappears,", "일단 고유 식생이 사라지면,"], ["so does the productive capacity of the soil.", "토양의 생산력도 또한 그러하다."]]}, {"en": "Often too few nutrients remain to support either crops or livestock within decades of deforestation.", "ko": "산림이 파괴된 후 수십 년 안에 작물이나 가축을 기를 수 있을 만큼의 영양분이 거의 남지 않게 되는 경우가 흔하다.", "chunks": [["Often too few nutrients remain", "흔히 너무 적은 영양분만이 남는다"], ["to support either crops or livestock", "작물이나 가축을 기를 만큼"], ["within decades of deforestation.", "산림이 파괴된 후 수십 년 안에."]]}, {"en": "Nutrient-poor tropical soils illustrate the general rule that life depends on recycling past life.", "ko": "영양분이 부족한 열대 토양은 생명체는 과거 생명체의 재활용에 의존한다는 일반적인 법칙을 보여 준다.", "chunks": [["Nutrient-poor tropical soils", "영양분이 부족한 열대 토양은"], ["illustrate the general rule", "일반적인 법칙을 보여 준다"], ["that life depends on recycling past life.", "생명체는 과거 생명체의 재활용에 의존한다는."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 열대 식생이 살아있을 때 영양분이 식물 안에서 재활용되는 순환 화살표가 있고, 오른쪽 식생이 사라진 후 빈 흙에서 영양분이 빗물에 침출되어 흘러나가 작물도 가축도 기를 수 없는 상태를 대조한 그림\">\n  <!-- 좌측: 식생 살아있음 -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">식생 살아있음 — recycling</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"210\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 강우 (위에서 떨어지는 빗방울) -->\n    <g stroke=\"#1FA34A\" stroke-width=\"1.1\" fill=\"none\" opacity=\"0.5\">\n      <line x1=\"40\" y1=\"10\" x2=\"40\" y2=\"22\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"70\" y1=\"8\" x2=\"70\" y2=\"20\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"100\" y1=\"12\" x2=\"100\" y2=\"24\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"22\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"230\" y1=\"8\" x2=\"230\" y2=\"20\" stroke-dasharray=\"2 2\"/>\n    </g>\n    <text x=\"135\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">rainfall</text>\n\n    <!-- 나무 (큰, 영양분 보존) -->\n    <g transform=\"translate(135, 130)\">\n      <!-- 줄기 -->\n      <rect x=\"-4\" y=\"0\" width=\"8\" height=\"35\" fill=\"#1FA34A\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <!-- 잎 (다층) -->\n      <ellipse cx=\"0\" cy=\"-30\" rx=\"42\" ry=\"22\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <ellipse cx=\"-20\" cy=\"-15\" rx=\"25\" ry=\"16\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <ellipse cx=\"20\" cy=\"-15\" rx=\"25\" ry=\"16\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <!-- 잎 세부 (점 모양) -->\n      <g fill=\"#1FA34A\" opacity=\"0.6\">\n        <circle cx=\"-15\" cy=\"-35\" r=\"2\"/>\n        <circle cx=\"5\" cy=\"-40\" r=\"2\"/>\n        <circle cx=\"20\" cy=\"-32\" r=\"2\"/>\n        <circle cx=\"-25\" cy=\"-20\" r=\"1.5\"/>\n        <circle cx=\"25\" cy=\"-18\" r=\"1.5\"/>\n      </g>\n    </g>\n\n    <!-- 뿌리 (땅 아래) -->\n    <g transform=\"translate(135, 165)\" stroke=\"#1FA34A\" stroke-width=\"1.4\" fill=\"none\">\n      <line x1=\"-4\" y1=\"0\" x2=\"-15\" y2=\"15\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"18\"/>\n      <line x1=\"4\" y1=\"0\" x2=\"15\" y2=\"15\"/>\n      <line x1=\"-15\" y1=\"15\" x2=\"-20\" y2=\"22\"/>\n      <line x1=\"15\" y1=\"15\" x2=\"20\" y2=\"22\"/>\n    </g>\n\n    <!-- 땅 표면 -->\n    <line x1=\"10\" y1=\"165\" x2=\"260\" y2=\"165\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <!-- 흙 (얕음) -->\n    <rect x=\"10\" y=\"165\" width=\"250\" height=\"30\" fill=\"#f6f6f6\" opacity=\"0.4\"/>\n\n    <!-- 영양분 순환 화살표 (식물 → 떨어진 잎 → 흙 → 다시 뿌리) -->\n    <!-- 잎 → 흙 (아래로) -->\n    <g transform=\"translate(75, 75)\">\n      <path d=\"M 0 0 Q -5 30 -5 75\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.5\" stroke-dasharray=\"4 2\"/>\n      <polygon points=\"-5,75 -9,68 -1,68\" fill=\"#1FA34A\"/>\n      <text x=\"-25\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1FA34A\" font-weight=\"700\">leaf drop</text>\n    </g>\n    <!-- 흙 → 뿌리 (위로 다시) -->\n    <g transform=\"translate(195, 180)\">\n      <path d=\"M 0 0 Q 5 -25 -50 -50\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.5\" stroke-dasharray=\"4 2\"/>\n      <polygon points=\"-50,-50 -47,-43 -42,-49\" fill=\"#1FA34A\"/>\n      <text x=\"0\" y=\"-15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1FA34A\" font-weight=\"700\">absorb</text>\n    </g>\n\n    <!-- 라벨 -->\n    <text x=\"135\" y=\"200\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">nutrients IN the plants — feeds on itself</text>\n  </g>\n\n  <!-- 가운데 라벨 -->\n  <g transform=\"translate(298, 130)\">\n    <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">→</text>\n    <text x=\"0\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">식생</text>\n    <text x=\"0\" y=\"26\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">사라짐</text>\n  </g>\n\n  <!-- 우측: 식생 사라짐 -->\n  <g transform=\"translate(320, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">식생 제거 — productivity gone</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"210\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 강우 -->\n    <g stroke=\"#c8102e\" stroke-width=\"1.1\" fill=\"none\" opacity=\"0.6\">\n      <line x1=\"40\" y1=\"10\" x2=\"40\" y2=\"22\"/>\n      <line x1=\"70\" y1=\"8\" x2=\"70\" y2=\"20\"/>\n      <line x1=\"100\" y1=\"12\" x2=\"100\" y2=\"24\"/>\n      <line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"22\"/>\n      <line x1=\"170\" y1=\"8\" x2=\"170\" y2=\"20\"/>\n      <line x1=\"200\" y1=\"12\" x2=\"200\" y2=\"24\"/>\n      <line x1=\"230\" y1=\"10\" x2=\"230\" y2=\"22\"/>\n    </g>\n    <text x=\"135\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">rainfall · weathering</text>\n\n    <!-- 잘린 그루터기 (벌목된) -->\n    <g transform=\"translate(80, 155)\">\n      <!-- 그루터기 -->\n      <rect x=\"-7\" y=\"0\" width=\"14\" height=\"10\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <ellipse cx=\"0\" cy=\"0\" rx=\"7\" ry=\"2\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <!-- 자른 자국 (X) -->\n      <line x1=\"-4\" y1=\"-1.5\" x2=\"4\" y2=\"1.5\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      <line x1=\"4\" y1=\"-1.5\" x2=\"-4\" y2=\"1.5\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    </g>\n    <g transform=\"translate(190, 158)\">\n      <rect x=\"-7\" y=\"0\" width=\"14\" height=\"10\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <ellipse cx=\"0\" cy=\"0\" rx=\"7\" ry=\"2\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <line x1=\"-4\" y1=\"-1.5\" x2=\"4\" y2=\"1.5\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      <line x1=\"4\" y1=\"-1.5\" x2=\"-4\" y2=\"1.5\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    </g>\n    <text x=\"125\" y=\"148\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\" text-anchor=\"middle\">deforestation</text>\n\n    <!-- 땅 표면 -->\n    <line x1=\"10\" y1=\"165\" x2=\"260\" y2=\"165\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <rect x=\"10\" y=\"165\" width=\"250\" height=\"30\" fill=\"#f6f6f6\" opacity=\"0.5\"/>\n\n    <!-- 영양분이 빠져나감 (아래 방향 화살표들) -->\n    <g stroke=\"#c8102e\" stroke-width=\"1.4\" fill=\"#c8102e\">\n      <line x1=\"40\" y1=\"175\" x2=\"40\" y2=\"200\" stroke-dasharray=\"3 2\"/>\n      <polygon points=\"40,200 36,192 44,192\"/>\n      <line x1=\"100\" y1=\"178\" x2=\"100\" y2=\"203\" stroke-dasharray=\"3 2\"/>\n      <polygon points=\"100,203 96,195 104,195\"/>\n      <line x1=\"160\" y1=\"175\" x2=\"160\" y2=\"200\" stroke-dasharray=\"3 2\"/>\n      <polygon points=\"160,200 156,192 164,192\"/>\n      <line x1=\"220\" y1=\"178\" x2=\"220\" y2=\"203\" stroke-dasharray=\"3 2\"/>\n      <polygon points=\"220,203 216,195 224,195\"/>\n    </g>\n    <text x=\"135\" y=\"195\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">leaches out</text>\n\n    <!-- 결과 라벨 -->\n    <text x=\"135\" y=\"200\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\"></text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"258\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">life depends on recycling past life</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '열대 = 강우·풍화 ↑'이고, 마지막은 '산림 파괴 후 수십 년 내 농사 불가'로 정리된다."}, {"no": "12", "title": "p41 (Exercise 12) 지문 ⑥ · Trust on a Team: Sharing Information Builds the Inner Circle", "ktitle": "신뢰 = 정보 공유", "field": "조직·경영", "page": "p.41 Ex.12", "oneline": "팀의 신뢰는 ‘정보를 얼마나 공유하느냐’로 드러난다.", "tldr": ["팀의 신뢰는 ‘정보를 얼마나 공유하느냐’로 드러난다.", "리더가 기밀(재정·예산·경쟁사 데이터)까지 나누면 신뢰의 신호다.", "그러면 팀은 ‘핵심 집단(안쪽)에 속한다’고 느낀다."], "analogy": "친구가 비밀까지 털어놓으면 ‘날 진짜 믿는구나’ 싶죠. 팀도 똑같아요 — 리더가 예산·기밀까지 공유하면 ‘우리가 안쪽 사람’이라는 신뢰가 생겨요.", "bg": "분야는 조직·경영이에요. 핵심 — 팀의 신뢰가 ‘정보 공유 정도’로 드러난다는 것. → 신뢰와 정보 공유가 어떻게 맞물리는지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "지식은 힘이다"}, {"kind": "척도", "t": "신뢰 = 정보 공유 정도", "d": "혼자만 앎(낮음) ↔ 공개 공유(높음)."}, {"kind": "신호", "t": "리더가 기밀까지 공유 = 신뢰의 신호", "d": "재정·예산·경쟁사 데이터까지."}, {"kind": "효과", "t": "팀이 ‘핵심 집단’ 소속감을 느낌"}, {"kind": "결론", "t": "공유가 신뢰를 키운다"}], "quiz": [["팀의 신뢰를 측정하는 한 가지 방법은?", "사람들이 정보를 ‘혼자만 아는지(낮은 신뢰) vs 공개적으로 공유하는지(높은 신뢰)’를 보는 거예요."], ["리더가 기밀까지 공유하면 무슨 효과가 있나?", "팀에게 ‘너희를 신뢰한다’는 신호가 되어, 팀이 ‘핵심 집단(안쪽)에 속한다’고 느껴요."], ["핵심 한 문장?", "정보를 얼마나 공유하느냐가 팀 신뢰의 척도다."]], "vocab": [["measure", "측정하다·평가하다"], ["amount", "양·정도"], ["trust", "신뢰"], ["keep to oneself", "자신만 알고 있다·혼자만 간직하다"], ["openly", "공개적으로"], ["signal", "신호를 보내다·시사하다"]], "en": "Knowledge is power. And one way to measure the amount of trust on a team is by looking at how much information people keep to themselves (low trust) or share openly (high trust). Team leaders signal that they trust their team when they share privileged information with them. This could be sharing the team's finances, or the budget handed down from higher-ups, so that the whole team knows what they're working with and where the priorities are. It could also be competitive data or customer trends that are widely available but rarely shared. It could even be passing on information shared by another team. In a meeting, any time someone says, \"This stays here,\" the atmosphere changes. People know whatever follows is spoken in trust, and they respond to that feeling of being trusted with trustworthy behavior. People begin to feel like they're in the inner circle when they receive more information about their work or the environment than they usually do. They start to see how their work fits into the larger organizational whole.", "ko": "지식은 힘이다. 그리고 팀 내에서 신뢰의 정도를 측정하는 한 가지 방법은 사람들이 얼마나 많은 정보를 자신만 알고 있는가(낮은 신뢰), 아니면 공개적으로 공유하는가(높은 신뢰)를 보는 것이다. 팀 리더들이 팀원들과 기밀 정보를 공유할 때, 그들은 자신들이 팀을 신뢰한다는 신호를 보내는 것이다. 이것은 팀의 재정 또는 상부에서 내려온 예산을 공유하는 것일 수도 있을 것이며, 그리하여 팀 전체가 자신들이 무슨 일을 하고 있는지 그리고 우선 순위가 어디에 있는지를 안다. 그것은 또한 널리 이용 가능하지만, 잘 공유되지 않는 경쟁사 데이터나 고객 동향일 수도 있다. 그것은 심지어 다른 팀에서 공유된 정보를 전달하는 것일 수도 있다. 회의할 때 어떤 사람이 \"이것은 여기서만 하는 말입니다.\"라고 말할 때는 언제나 분위기가 달라진다. 사람들은 이어지는 말이 무엇이든 그것이 신뢰 속에서 하는 말임을 알며, 그래서 그들은 신뢰받는다는 느낌에 대하여 신뢰할 만한 행동으로 반응한다. 사람들은 자신의 업무나 환경에 대해 평소보다 더 많은 정보를 받게 되면, 자신이 조직 내부의 핵심 집단에 들어와 있다는 느낌을 받기 시작한다. 그들은 자신의 업무가 더 큰 조직 전체에서 어떻게 맞물리는지를 살피기 시작한다.", "read": [{"en": "Knowledge is power.", "ko": "지식은 힘이다.", "chunks": [["Knowledge is power.", "지식은 힘이다."]]}, {"en": "And one way to measure the amount of trust on a team is by looking at how much information people keep to themselves (low trust) or share openly (high trust).", "ko": "그리고 팀 내에서 신뢰의 정도를 측정하는 한 가지 방법은 사람들이 얼마나 많은 정보를 자신만 알고 있는가(낮은 신뢰), 아니면 공개적으로 공유하는가(높은 신뢰)를 보는 것이다.", "chunks": [["And one way", "그리고 한 가지 방법은"], ["to measure the amount of trust on a team", "팀 내 신뢰의 정도를 측정하는"], ["is by looking at", "~을 봄으로써이다"], ["how much information", "얼마나 많은 정보를"], ["people keep to themselves (low trust)", "사람들이 자신만 알고 있는가 (낮은 신뢰)"], ["or share openly (high trust).", "또는 공개적으로 공유하는가 (높은 신뢰)를."]]}, {"en": "Team leaders signal that they trust their team when they share privileged information with them.", "ko": "팀 리더들이 팀원들과 기밀 정보를 공유할 때, 그들은 자신들이 팀을 신뢰한다는 신호를 보내는 것이다.", "chunks": [["Team leaders signal that", "팀 리더들은 ~을 신호로 보낸다"], ["they trust their team", "자신이 팀을 신뢰한다는 것을"], ["when they share privileged information with them.", "팀원들과 기밀 정보를 공유할 때."]]}, {"en": "This could be sharing the team's finances, or the budget handed down from higher-ups, so that the whole team knows what they're working with and where the priorities are.", "ko": "이것은 팀의 재정 또는 상부에서 내려온 예산을 공유하는 것일 수도 있을 것이며, 그리하여 팀 전체가 자신들이 무슨 일을 하고 있는지 그리고 우선 순위가 어디에 있는지를 안다.", "chunks": [["This could be sharing", "이것은 ~을 공유하는 것일 수도 있다"], ["the team's finances,", "팀의 재정,"], ["or the budget handed down from higher-ups,", "또는 상부에서 내려온 예산을,"], ["so that the whole team knows", "팀 전체가 알 수 있도록"], ["what they're working with", "자신들이 무엇으로 일하고 있는지"], ["and where the priorities are.", "그리고 우선 순위가 어디에 있는지."]]}, {"en": "It could also be competitive data or customer trends that are widely available but rarely shared.", "ko": "그것은 또한 널리 이용 가능하지만, 잘 공유되지 않는 경쟁사 데이터나 고객 동향일 수도 있다.", "chunks": [["It could also be", "그것은 또한 ~일 수도 있다"], ["competitive data or customer trends", "경쟁사 데이터 또는 고객 동향"], ["that are widely available", "널리 이용 가능하지만"], ["but rarely shared.", "잘 공유되지 않는."]]}, {"en": "It could even be passing on information shared by another team.", "ko": "그것은 심지어 다른 팀에서 공유된 정보를 전달하는 것일 수도 있다.", "chunks": [["It could even be", "그것은 심지어 ~일 수도 있다"], ["passing on information", "정보를 전달하는 것"], ["shared by another team.", "다른 팀에 의해 공유된."]]}, {"en": "In a meeting, any time someone says, \"This stays here,\" the atmosphere changes.", "ko": "회의할 때 어떤 사람이 \"이것은 여기서만 하는 말입니다.\"라고 말할 때는 언제나 분위기가 달라진다.", "chunks": [["In a meeting,", "회의 중에,"], ["any time someone says,", "누군가가 ~라고 말할 때마다,"], ["\"This stays here,\"", "\"이것은 여기서만 하는 말입니다,\""], ["the atmosphere changes.", "분위기가 달라진다."]]}, {"en": "People know whatever follows is spoken in trust, and they respond to that feeling of being trusted with trustworthy behavior.", "ko": "사람들은 이어지는 말이 무엇이든 그것이 신뢰 속에서 하는 말임을 알며, 그래서 그들은 신뢰받는다는 느낌에 대하여 신뢰할 만한 행동으로 반응한다.", "chunks": [["People know", "사람들은 안다"], ["whatever follows is spoken in trust,", "이어지는 것이 무엇이든 신뢰 속에서 하는 말이라는 것을,"], ["and they respond to", "그리고 그들은 ~에 반응한다"], ["that feeling of being trusted", "신뢰받는다는 그 느낌에"], ["with trustworthy behavior.", "신뢰할 만한 행동으로."]]}, {"en": "People begin to feel like they're in the inner circle when they receive more information about their work or the environment than they usually do.", "ko": "사람들은 자신의 업무나 환경에 대해 평소보다 더 많은 정보를 받게 되면, 자신이 조직 내부의 핵심 집단에 들어와 있다는 느낌을 받기 시작한다.", "chunks": [["People begin to feel like", "사람들은 ~인 것처럼 느끼기 시작한다"], ["they're in the inner circle", "자신이 핵심 집단에 있는"], ["when they receive more information", "그들이 더 많은 정보를 받을 때"], ["about their work or the environment", "자신의 업무나 환경에 대해"], ["than they usually do.", "평소보다."]]}, {"en": "They start to see how their work fits into the larger organizational whole.", "ko": "그들은 자신의 업무가 더 큰 조직 전체에서 어떻게 맞물리는지를 살피기 시작한다.", "chunks": [["They start to see", "그들은 살피기 시작한다"], ["how their work fits into", "자신의 업무가 어떻게 ~에 맞물리는지"], ["the larger organizational whole.", "더 큰 조직 전체에."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 리더가 재정·경쟁사·타팀 정보 세 박스를 점층적으로 팀에게 전달하면 팀원들이 외곽에서 inner circle 동심원 안쪽으로 이동하는 모습을 보여주는 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">\"Knowledge is power\" — 정보 공유가 신뢰의 신호</text>\n\n  <!-- 좌측: 리더 + 점층 정보 박스 -->\n  <g transform=\"translate(20, 50)\">\n    <text x=\"100\" y=\"-10\" f roke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <polygon points=\"0,-22 -3,-16 3,-16\" fill=\"#1FA34A\"/>\n    </g>\n\n    <!-- 외곽 라벨 -->\n    <text x=\"0\" y=\"-85\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">outer · low trust</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">people respond to feeling trusted with trustworthy behavior</text>\n</svg>", "caption": "이 지문은 5단계로 전개된다. 첫 출발점은 '지식은 힘이다'이고, 마지막은 '공유가 신뢰를 키운다'로 정리된다."}]};

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

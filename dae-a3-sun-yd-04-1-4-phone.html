<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 영어독해연습 04강 (지문 1-4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 영어독해연습 04강 지문 1-4 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>

<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 영어독해연습 04강 · 지문 1-4</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 영어독해연습 04강 지문 1-4

const P = {"data":[{"no":"1","title":"Probabilistic Categorization & Bats","ktitle":"박쥐는 왜 두려운가 — 두 범주 모두에서 비전형인 존재","field":"수능특강 영어독해연습","page":"04강 Ex.01","oneline":"확률론적 분류 체계에서 전형적 구성원은 공유 특징이 많아 빠르게 인식되지만, 박쥐 같은 비전형(아웃라이어)은 잘못 분류되어 인지 부담을 주며 — 이 분류 어려움이 두려움으로 이어진다.","metaphor":"<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 포유류 원과 오른쪽 조류 원 안에 각각 강아지와 새가 전형으로 놓여 있고, 두 원 사이 변두리에 박쥐가 빨강 점선과 물음표 마크와 함께 양쪽 모두 비전형으로 표시되며 하단에 잘못 분류 → 인지 부담 → 두려움의 인과 사슬이 그려진 그림\">\n\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">확률론적 분류 — 박쥐는 두 범주 모두에서 비전형</text>\n\n  <!-- 좌측 원: Mammals -->\n  <circle cx=\"170\" cy=\"130\" r=\"72\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n  <text x=\"170\" y=\"46\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">Mammals · 포유류</text>\n\n  <!-- 좌측 전형: 강아지 -->\n  <g transform=\"translate(170, 135)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"18\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <circle cx=\"-15\" cy=\"-3\" r=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <ellipse cx=\"-19\" cy=\"-9\" rx=\"2.5\" ry=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    <circle cx=\"-17\" cy=\"-3\" r=\"0.9\" fill=\"#1a1a1a\"/>\n    <line x1=\"-8\" y1=\"10\" x2=\"-8\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <line x1=\"2\" y1=\"10\" x2=\"2\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <path d=\"M 18 -2 Q 24 -8 26 -10\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-w 5\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">misclassified</text>\n    </g>\n    <line x1=\"190\" y1=\"13\" x2=\"215\" y2=\"13\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <polygon points=\"215,13 207,9 207,17\" fill=\"#c8102e\"/>\n    <g transform=\"translate(220, 0)\">\n      <rect x=\"0\" y=\"0\" width=\"130\" height=\"26\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <text x=\"65\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">cognitive load</text>\n    </g>\n    <line x1=\"355\" y1=\"13\" x2=\"380\" y2=\"13\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <polygon points=\"380,13 372,9 372,17\" fill=\"#c8102e\"/>\n    <g transform=\"translate(385, 0)\">\n      <rect x=\"0\" y=\"0\" width=\"140\" height=\"26\" rx=\"3\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <text x=\"70\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">fear · 두려움</text>\n    </g>\n  </g>\n</svg>","caption":"두 범주 어느 쪽에서도 비전형 — 박쥐는 왜 두려운가","tldr":["확률론적 분류 체계에서는 전형적 구성원이 공유 특징이 많아 빠르게 인식된다.","박쥐는 포유류이지만 새처럼 보이고 움직여 두 범주 모두에서 비전형적이다.","이 잘못 분류될 듯한 인지 부담이 박쥐에 대한 두려움으로 이어진다."],"bg":"확률론적 범주화는 전형적인 사례를 중심으로 빠르게 인식하고, 경계에 놓인 비전형 사례는 더 오래 판단하게 만든다. 박쥐는 포유류이지만 새처럼 보이고 움직여 범주 경계를 흔드는 사례라 인지 부담과 낯섦을 만든다.","flow":[{"kind":"원리","t":"확률론적 범주화: 중심에 가까운 전형일수록 빠르게 인식"},{"kind":"전형","t":"공유 특징이 많은 구성원은 범주 판단이 쉽다."},{"kind":"예외","t":"박쥐는 포유류와 조류 어느 쪽에서도 전형적이지 않다."},{"kind":"결론","t":"범주 경계의 애매함 → 인지 부담 → 낯섦과 두려움"}],"vocab":[["probabilistic","확률론적·확률에 기반한"],["exemplar","전형·본보기"],["category member","범주 구성원·범주에 속하는 것"],["share features with","~와 특징을 공유하다"],["in a sense","어떤 의미에서는"],["atypical","비전형적인·이례적인"],["outlier","아웃라이어·예외적 사례 (분포에서 벗어난 것)"],["lousy","형편없는·매우 안 좋은"],["observable","관찰할 수 있는"],["misclassify","잘못 분류하다"]],"quiz":[["확률론적 범주화에서 전형적 구성원은 왜 빨리 인식되나?","공유 특징이 많아 범주의 중심에 가깝기 때문에 머리가 빠르게 분류할 수 있다."],["박쥐가 두려움을 유발하는 논리는?","포유류이지만 새처럼 보이고 움직여 어느 범주에도 전형적으로 들어맞지 않아 분류 부담과 낯섦을 만들기 때문이다."],["이 지문에서 박쥐는 단순히 “이상한 동물”이 아니라 무엇의 예인가?","범주 경계에 놓인 비전형적 사례, 즉 인지적 분류를 어렵게 만드는 아웃라이어의 예이다."]],"en":"In the probabilistic view, the typical exemplars or category members are recognized more quickly because they share more features with other category members. In a sense, the typical category member is closer to the centre of the category. And a similar effect might be observed with the exceptional category members. A very atypical member of a category (like bats as atypical mammals, or even as atypical birds if your category for \"bird\" is based on observable features) is really an outlier. It really is the case that the bat is a lousy member of the mammal category. It looks like a bird, acts like a bird, and cannot see very well. A probabilistic categorization system would assume that bats will be misclassified and will present people with some difficulty. It is plausible that our own inability to classify them readily corresponds to the fact that bats are often feared. Perhaps we fear bats because they do not fit into a simple, basic category very easily.","ko":"확률론적 관점에서, 전형적인 예나 범주 구성원은 다른 구성원들과 더 많은 특징을 공유하기 때문에 더 빠르게 인식된다. 어떤 의미에서는, 전형적인 범주 구성원은 범주의 중심에 더 가깝다. 그리고 예외적인 범주 구성원에 대해서도 비슷한 효과가 관찰될 수 있다. 범주의 매우 비전형적인 구성원(가령 비전형적 포유류로서의 박쥐, 또는 '조류' 범주를 관찰 가능한 특징으로 정의한다면 비전형적 조류로서의 박쥐)은 진짜 아웃라이어이다. 박쥐가 포유류 범주의 형편없는 구성원이라는 것은 정말 사실이다. 박쥐는 조류처럼 생겼고, 조류처럼 행동하며, 시력이 좋지 않다. 확률론적 분류 체계는 박쥐가 잘못 분류되며 사람들에게 다소 어려움을 줄 것이라고 가정할 것이다. 우리가 박쥐를 쉽게 분류하지 못한다는 점이, 박쥐가 흔히 두려워지는 대상이라는 사실과 부합한다는 것이 그럴듯하다. 어쩌면 우리가 박쥐를 두려워하는 것은, 그것이 단순하고 기본적인 범주에 쉽게 들어맞지 않기 때문일지도 모른다.","read":[{"en":"In the probabilistic view, the typical exemplars or category members are recognized more quickly because they share more features with other category members.","ko":"확률론적 관점에서, 전형적인 예나 범주 구성원은 다른 구성원들과 더 많은 특징을 공유하기 때문에 더 빠르게 인식된다.","chunks":[]},{"en":"In a sense, the typical category member is closer to the centre of the category.","ko":"어떤 의미에서는, 전형적인 범주 구성원은 범주의 중심에 더 가깝다.","chunks":[]},{"en":"And a similar effect might be observed with the exceptional category members.","ko":"그리고 예외적인 범주 구성원에 대해서도 비슷한 효과가 관찰될 수 있다.","chunks":[]},{"en":"A very atypical member of a category (like bats as atypical mammals, or even as atypical birds if your category for \"bird\" is based on observable features) is really an outlier.","ko":"범주의 매우 비전형적인 구성원(가령 비전형적 포유류로서의 박쥐, 또는 '조류' 범주를 관찰 가능한 특징으로 정의한다면 비전형적 조류로서의 박쥐)은 진짜 아웃라이어이다.","chunks":[]},{"en":"It really is the case that the bat is a lousy member of the mammal category.","ko":"박쥐가 포유류 범주의 형편없는 구성원이라는 것은 정말 사실이다.","chunks":[]},{"en":"It looks like a bird, acts like a bird, and cannot see very well.","ko":"박쥐는 조류처럼 생겼고, 조류처럼 행동하며, 시력이 좋지 않다.","chunks":[]},{"en":"A probabilistic categorization system would assume that bats will be misclassified and will present people with some difficulty.","ko":"확률론적 분류 체계는 박쥐가 잘못 분류되며 사람들에게 다소 어려움을 줄 것이라고 가정할 것이다.","chunks":[]},{"en":"It is plausible that our own inability to classify them readily corresponds to the fact that bats are often feared.","ko":"우리가 박쥐를 쉽게 분류하지 못한다는 점이, 박쥐가 흔히 두려워지는 대상이라는 사실과 부합한다는 것이 그럴듯하다.","chunks":[]},{"en":"Perhaps we fear bats because they do not fit into a simple, basic category very easily.","ko":"어쩌면 우리가 박쥐를 두려워하는 것은, 그것이 단순하고 기본적인 범주에 쉽게 들어맞지 않기 때문일지도 모른다.","chunks":[]}],"analogy":"책상 위 동물 카드를 포유류와 조류로 나누는데 박쥐 카드만 어느 칸에도 딱 맞지 않는 상황과 같다. 기준이 흔들리는 순간, 머리는 더 오래 멈추고 그 낯섦을 불안으로 느낀다."},{"no":"2","title":"Brilliant Leadership: Empathy & Authenticity","ktitle":"공감과 진정성이 만드는 훌륭한 리더십","field":"수능특강 영어독해연습","page":"04강 Ex.02","oneline":"훌륭한 리더십은 공감(empathy)과 진정성(authenticity)의 연결을 핵심으로 한다 — 공감은 조직 목표를 위한 수단이 아니라 그 자체로 가치이며, 칸트의 의무론적 인격 개념과 일치한다. 진정성은 공감을 결과 중심이 아닌 가치 중심으로 규정한다.","metaphor":"<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 칸트의 진실성 인용이 놓이고, 좌측에는 일반 리더가 공감을 도구처럼 들고 결과 박스로 화살표를 쏘는 수단주의 모습, 우측에는 공감 원과 진정성 원이 양방향 화살표로 결합한 가치 중심 리더십의 모습이 대조된 그림\">\n\n  <!-- 상단 Kant 인용 박스 -->\n  <g transform=\"translate(110, 8)\">\n    <rect x=\"0\" y=\"0\" width=\"380\" height=\"36\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <text x=\"190\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\" letter-spacing=\"0.18em\">— KANT · 의무론</text>\n    <text x=\"190\" y=\"29\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">\"truthfulness is the heart of virtue · 인격 = 진실성\"</text>\n  </g>\n\n  <!-- 좌측: 일반 리더 — 수단주의 -->\n  <g transform=\"translate(15, 55)\">\n    <text x=\"135\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">일반 리더 — empathy = a means</text>\n    <rect x=\"0\" y=\"6\" width=\"270\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- stick figure 리더 -->\n    <g transform=\"translate(55, 90)\">\n      <circle cx=\"0\" cy=\"0\" r=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-1\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"-1\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <line x1=\"-3\" y1=\"5\" x2=\"3\" y2=\"5\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"13\" x2=\"0\" y2=\"52\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"18\" y2=\"14\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"-12\" y2=\"32\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"52\" x2=\"-8\" y2=\"76\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"52\" x2=\"8\" y2=\"76\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"92\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">leader</text>\n    </g>\n\n    <!-- 손에 든 하트 (공감 = 도구) -->\n    <g transform=\"translate(88, 90)\">\n      <path d=\"M 0 0 C -3 -6 -11 -6 -11 0 C -11 5 0 12 0 12 C 0 12 11 5 11 0 C 11 -6 3 -6 0 0 Z\"\n            fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"0.8\"/>\n      <text x=\"0\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">empathy</text>\n      <text x=\"0\" y=\"25\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">tool · 수단</text>\n    </g>\n\n    <!-- 화살표: 도구를 결과를 향해 -->\n    <line x1=\"108\" y1=\"98\" x2=\"170\" y2=\"120\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n    <polygon points=\"170,120 161,117 164,124\" fill=\"#c8102e\"/>\n\n    <!-- outcome 박스 -->\n    <g transform=\"translate(170, 105)\">\n      <rect x=\"0\" y=\"0\" width=\"90\" height=\"42\" rx=\"3\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"45\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">outcome</text>\n      <text x=\"45\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">조직 목표</text>\n    </g>\n\n    <!-- 하단 라벨 -->\n    <text x=\"135\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">outcome-driven · 결과 중심</text>\n  </g>\n\n  <!-- 가운데 vs -->\n  <text x=\"299\" y=\"165\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 우측: 훌륭한 리더 — 가치 중심 결합 -->\n  <g transform=\"translate(315, 55)\">\n    <text x=\"135\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">훌륭한 리더 — empathy in its own right</text>\n    <rect x=\"0\" y=\"6\" width=\"270\" height=\"200\" fill=\"#f0faf3\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n\n    <!-- empathy 원 -->\n    <g transform=\"translate(80, 110)\">\n      <circle cx=\"0\" cy=\"0\" r=\"38\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">empathy</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">공감</text>\n    </g>\n\n    <!-- authenticity 원 -->\n    <g transform=\"translate(190, 110)\">\n      <circle cx=\"0\" cy=\"0\" r=\"42\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">authenticity</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">진정성</text>\n    </g>\n\n    <!-- 양방향 화살표 ⇄ -->\n    <g transform=\"translate(135, 110)\">\n      <line x1=\"-12\" y1=\"-5\" x2=\"12\" y2=\"-5\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <polygon points=\"12,-5 5,-9 5,-1\" fill=\"#1FA34A\"/>\n      <line x1=\"-12\" y1=\"5\" x2=\"12\" y2=\"5\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <polygon points=\"-12,5 -5,1 -5,9\" fill=\"#1FA34A\"/>\n    </g>\n\n    <!-- 결합 라벨 (위) -->\n    <text x=\"135\" y=\"62\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">→ Brilliant Leadership ←</text>\n\n    <!-- 하단 라벨 -->\n    <text x=\"135\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">values-driven · 가치 중심</text>\n  </g>\n</svg>","caption":"공감을 수단이 아닌 그 자체 가치로 — 진정성과의 결합","tldr":["공감은 조직 목표를 위한 수단만이 아니라 그 자체로 가치가 있다.","진정성은 공감을 결과 중심 기술이 아니라 사람을 존중하는 태도로 만든다.","그래서 훌륭한 리더십은 공감과 진정성의 결합 위에 세워진다."],"bg":"리더십에서 공감이 단순한 성과 도구가 아니라 사람을 “수단이 아닌 목적 그 자체”로 대하는 태도임을 설명하는 글. 칸트식 관점과 진정성이 결합될 때 공감은 기술이 아니라 가치 중심 리더십이 된다.","flow":[{"kind":"일반 관점","t":"공감 = 조직 목표 달성을 위한 유용한 수단"},{"kind":"철학적 전환","t":"칸트식 관점: 사람은 수단이 아니라 목적 그 자체"},{"kind":"조건","t":"진정성(authenticity)이 있어야 공감이 겉치레 기술이 되지 않음"},{"kind":"결론","t":"훌륭한 리더십 = 공감 + 진정성의 가치 중심 결합"}],"vocab":[["central to","~의 중심에 있는·핵심인"],["linkage","연결고리·연관 관계"],["empathy","공감·감정이입"],["authenticity","진정성·진실성"],["on the premise that","~라는 전제하에"],["sensitivity","민감성·세심함"],["in its own right","그 자체로·독립적으로"],["underscore","강조하다·역설하다"],["virtue","미덕·덕목"],["stakeholder","이해관계자 (조직과 이해를 공유하는 자)"]],"quiz":[["일반적 리더십에서 공감은 어떻게 오해될 수 있나?","조직 성과를 높이기 위한 수단이나 기술처럼 쓰일 수 있다."],["칸트식 관점이 공감을 다르게 보게 하는 이유는?","사람을 목표 달성의 도구가 아니라 목적 그 자체로 대해야 한다고 보기 때문이다."],["진정성이 빠지면 공감은 어떻게 변질될 수 있나?","상대를 존중하는 가치가 아니라, 성과를 끌어내기 위한 겉치레 전략처럼 보일 수 있다."]],"en":"Central to the notion of brilliant leadership is the critical linkage between empathy and authenticity. While leaders may act on the premise that sensitivity to employee concerns is helpful in achieving organizational goals, brilliant leaders believe that empathy has value in its own right. In this regard, empathy is less a means to an end (e.g., profiting) but rather is consistent with Kant's notion of \"Character,\" which underscores truthfulness as a core element of virtue. From a stakeholder perspective, particularly employees, brilliant leaders would be seen as behaving in ways that reveal a genuineness of motives. Guided by the deontologically-based philosophical guidepost, \"We should do our duty for no other reason than because it's the right thing to do,\" the brilliant leader's empathetic conduct is derived less from strategic or tactical interests than it is from one's personal sense of integrity. That, then, is a defining feature of authenticity: it frames empathy as values-driven rather than outcome-driven.","ko":"훌륭한 리더십이라는 개념의 중심에는 공감과 진정성 사이의 매우 중요한 연결고리가 있다. 리더들은 직원의 관심사에 민감하게 반응하는 것이 조직 목표 달성에 도움이 된다는 전제하에 행동할 수 있지만, 훌륭한 리더는 공감이 그 자체로 가치가 있다고 믿는다. 이런 점에서, 공감은 목적(이익 등)을 위한 수단이라기보다는 — 진실성을 미덕의 핵심으로 강조하는 칸트의 '인격' 개념과 일치한다. 이해관계자, 특히 직원의 관점에서 볼 때 훌륭한 리더는 동기의 진실성을 드러내는 방식으로 행동한다고 여겨질 것이다. 의무론에 기반한 철학적 지침(\"그것이 옳은 일이라는 이유 외에 다른 이유 없이 의무를 다해야 한다\")에 따라, 훌륭한 리더의 공감적 행동은 전략적·전술적 이익보다는 진실성에 대한 개인적 감각에서 비롯된다. 그렇다면 그것은 진정성의 결정적인 특징이다 — 진정성은 공감을 결과 중심이 아닌 가치 중심으로 규정한다.","read":[{"en":"Central to the notion of brilliant leadership is the critical linkage between empathy and authenticity.","ko":"훌륭한 리더십이라는 개념의 중심에는 공감과 진정성 사이의 매우 중요한 연결고리가 있다.","chunks":[]},{"en":"While leaders may act on the premise that sensitivity to employee concerns is helpful in achieving organizational goals, brilliant leaders believe that empathy has value in its own right.","ko":"리더들은 직원의 관심사에 민감하게 반응하는 것이 조직 목표 달성에 도움이 된다는 전제하에 행동할 수 있지만, 훌륭한 리더는 공감이 그 자체로 가치가 있다고 믿는다.","chunks":[]},{"en":"In this regard, empathy is less a means to an end (e.g., profiting) but rather is consistent with Kant's notion of \"Character,\" which underscores truthfulness as a core element of virtue.","ko":"이런 점에서, 공감은 목적(이익 등)을 위한 수단이라기보다는 — 진실성을 미덕의 핵심으로 강조하는 칸트의 '인격' 개념과 일치한다.","chunks":[]},{"en":"From a stakeholder perspective, particularly employees, brilliant leaders would be seen as behaving in ways that reveal a genuineness of motives.","ko":"이해관계자, 특히 직원의 관점에서 볼 때 훌륭한 리더는 동기의 진실성을 드러내는 방식으로 행동한다고 여겨질 것이다.","chunks":[]},{"en":"Guided by the deontologically-based philosophical guidepost, \"We should do our duty for no other reason than because it's the right thing to do,\" the brilliant leader's empathetic conduct is derived less from strategic or tactical interests than it is from one's personal sense of integrity.","ko":"의무론에 기반한 철학적 지침(\"그것이 옳은 일이라는 이유 외에 다른 이유 없이 의무를 다해야 한다\")에 따라, 훌륭한 리더의 공감적 행동은 전략적·전술적 이익보다는 진실성에 대한 개인적 감각에서 비롯된다.","chunks":[]},{"en":"That, then, is a defining feature of authenticity: it frames empathy as values-driven rather than outcome-driven.","ko":"그렇다면 그것은 진정성의 결정적인 특징이다 — 진정성은 공감을 결과 중심이 아닌 가치 중심으로 규정한다.","chunks":[]}],"analogy":"직원의 말을 듣는 척만 해서 성과를 끌어내려는 리더와, 그 사람 자체를 존중해서 귀 기울이는 리더는 겉보기엔 비슷해도 완전히 다르다. 이 글은 두 번째 태도가 훌륭한 리더십의 핵심이라고 본다."},{"no":"3","title":"Language vs Emotion: Two Constructions","ktitle":"언어와 감정은 평행하지만 서로를 입증하지 않는다","field":"수능특강 영어독해연습","page":"04강 Ex.03","oneline":"언어는 사회적으로, 감정은 생물학적으로 구성되며 서로 독립적으로 형성된다 — 그래서 한 문화의 감정 단어 유무는 그 감정 회로의 유무를 보장하지 않는다. 감정과 언어는 평행하지만 서로의 존재를 입증하지 못한다 (타히티 사례가 보여 줌).","metaphor":"<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"위 트랙에 사람들이 단어 풍선으로 grief sadness joy를 말하는 사회적 언어 구성과, 아래 트랙에 뇌 회로 세 개가 점선으로 연결된 생물학적 감정 구성이 평행으로 놓이고 사이에 ≠ 기호가 반복되며 하단에 타히티 사례 박스가 결론을 입증하는 그림\">\n\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">두 평행 트랙 — 서로의 존재를 입증하지 못한다</text>\n\n  <!-- Language track (위) -->\n  <g transform=\"translate(20, 28)\">\n    <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#1a1a1a\">Language · 언어 (socially constructed)</text>\n    <rect x=\"0\" y=\"8\" width=\"560\" height=\"65\" rx=\"3\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n\n    <!-- 사람 1 -->\n    <g transform=\"translate(50, 48)\">\n      <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"-2\" cy=\"-1\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <circle cx=\"2\" cy=\"-1\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <line x1=\"0\" y1=\"8\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"13\" x2=\"-6\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"13\" x2=\"6\" y2=\"2 f2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n    <text x=\"230\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">Tahiti — no word for 'grief' / yet feels \"aching &amp; strange\" ✓</text>\n  </g>\n</svg>","caption":"언어 = 사회적 / 감정 = 생물학적 — 평행하지만 서로를 보장하지 못함","tldr":["언어는 사회적으로 구성되고, 기본 감정은 생물학적으로 구성된다.","따라서 감정 단어의 유무가 감정 회로의 유무를 보장하지 않는다.","타히티 사례는 말과 감정이 평행하지만 서로를 입증하지 못함을 보여 준다."],"bg":"타히티 사례처럼 어떤 문화에 특정 감정 단어가 없다고 해서 그 감정 경험이나 생물학적 반응 자체가 없는 것은 아니다. 언어는 사회적으로, 감정 반응은 생물학적으로 구성되므로 두 체계는 연결되지만 서로의 존재를 그대로 증명하지는 못한다.","flow":[{"kind":"언어","t":"감정 단어는 문화와 사회 속에서 구성된다."},{"kind":"감정","t":"기본 감정 반응은 생물학적 체계와 연결된다."},{"kind":"사례","t":"타히티: 특정 감정 단어의 부재가 감정 경험의 부재를 뜻하지 않음"},{"kind":"결론","t":"언어와 감정은 평행하지만, 단어 유무가 감정 회로 유무를 증명하지 않는다."}],"vocab":[["socially constructed","사회적으로 구성된"],["cultural collective","문화 공동체"],["agree upon","~에 합의하다·동의하다"],["abstract","추상적인"],["represent","나타내다·대표하다"],["conversely","반대로·역으로"],["craft","(정교하게) 만들어 내다"],["circuitry","(신경) 회로 체계"],["phenomenology","현상학·주관적 경험"],["analogous","유사한·비슷한"]],"quiz":[["감정 단어가 없다는 사실만으로 무엇을 결론내리면 안 되나?","그 문화 사람들이 그 감정을 느끼지 못한다고 결론내리면 안 된다."],["언어와 감정이 각각 어떻게 구성된다고 설명하나?","언어는 사회적으로 구성되고, 기본 감정 반응은 생물학적으로 구성된다고 본다."],["타히티 사례가 보여 주는 핵심은?","특정 감정 단어의 부재가 그 감정 경험 자체의 부재를 보장하지 않는다는 점이다."]],"en":"Language is socially constructed; over time our cultural collectives agreed upon various abstract symbols and sounds to represent objects, people, places, and experiences. Conversely, basic emotions are biologically constructed; over time evolution repeatedly crafted responses to important life situations ─ which we later associated with symbols, words, and phrases. The presence of a unique emotion word in one culture does not imply the presence of unique circuitry or unique phenomenology for a special emotion found only in that culture. Similarly, the absence of a specific basic emotion word in one culture does not imply the absence of analogous basic emotion circuitry. Emotions and language are parallel processes that can inform and provide context about one another, but ultimately cannot guarantee the existence of one another. An example of this is in Robert Levy's pioneering work in Tahiti, where he found that Tahitians had no words for \"grief\" and \"sadness.\" Nevertheless, they experienced a \"sick, strange\" feeling when processing the loss of a loved one.","ko":"언어는 사회적으로 구성된다 — 시간이 흐르면서 우리 문화 공동체는 사물·사람·장소·경험을 나타내기 위해 다양한 추상적 기호와 소리에 합의해 왔기 때문이다. 반대로, 기본 감정은 생물학적으로 구성된다 — 시간이 흐르며 진화가 중요한 삶의 상황에 대한 반응을 거듭 만들어 냈고, 이를 우리가 나중에 기호·단어·구절과 연관 지었다. 한 문화에 고유한 감정 단어가 있다고 해서, 그 문화에만 있는 특별한 감정의 고유 신경 회로나 고유 주관적 경험이 존재하는 것은 아니다. 마찬가지로, 한 문화에 특정 기본 감정 단어가 없다고 해서 유사한 기본 감정 회로가 없다는 뜻은 아니다. 감정과 언어는 평행한 과정이다 — 서로에 대한 정보를 주고 맥락을 제공할 수 있지만, 궁극적으로 서로의 존재를 보장하지는 못한다. 이에 대한 한 예는 Robert Levy의 타히티 선구 연구에 있다 — 거기서 그는 타히티인들에게 '비탄'과 '슬픔'을 뜻하는 단어가 없다는 것을 발견했다. 그럼에도 불구하고, 타히티인들은 사랑하는 사람의 상실을 처리하는 과정에서 '아프고, 이상한' 감정을 경험했다.","read":[{"en":"Language is socially constructed; over time our cultural collectives agreed upon various abstract symbols and sounds to represent objects, people, places, and experiences.","ko":"언어는 사회적으로 구성된다 — 시간이 흐르면서 우리 문화 공동체는 사물·사람·장소·경험을 나타내기 위해 다양한 추상적 기호와 소리에 합의해 왔기 때문이다.","chunks":[]},{"en":"Conversely, basic emotions are biologically constructed; over time evolution repeatedly crafted responses to important life situations ─ which we later associated with symbols, words, and phrases.","ko":"반대로, 기본 감정은 생물학적으로 구성된다 — 시간이 흐르며 진화가 중요한 삶의 상황에 대한 반응을 거듭 만들어 냈고, 이를 우리가 나중에 기호·단어·구절과 연관 지었다.","chunks":[]},{"en":"The presence of a unique emotion word in one culture does not imply the presence of unique circuitry or unique phenomenology for a special emotion found only in that culture.","ko":"한 문화에 고유한 감정 단어가 있다고 해서, 그 문화에만 있는 특별한 감정의 고유 신경 회로나 고유 주관적 경험이 존재하는 것은 아니다.","chunks":[]},{"en":"Similarly, the absence of a specific basic emotion word in one culture does not imply the absence of analogous basic emotion circuitry.","ko":"마찬가지로, 한 문화에 특정 기본 감정 단어가 없다고 해서 유사한 기본 감정 회로가 없다는 뜻은 아니다.","chunks":[]},{"en":"Emotions and language are parallel processes that can inform and provide context about one another, but ultimately cannot guarantee the existence of one another.","ko":"감정과 언어는 평행한 과정이다 — 서로에 대한 정보를 주고 맥락을 제공할 수 있지만, 궁극적으로 서로의 존재를 보장하지는 못한다.","chunks":[]},{"en":"An example of this is in Robert Levy's pioneering work in Tahiti, where he found that Tahitians had no words for \"grief\" and \"sadness.\"","ko":"이에 대한 한 예는 Robert Levy의 타히티 선구 연구에 있다 — 거기서 그는 타히티인들에게 '비탄'과 '슬픔'을 뜻하는 단어가 없다는 것을 발견했다.","chunks":[]},{"en":"Nevertheless, they experienced a \"sick, strange\" feeling when processing the loss of a loved one.","ko":"그럼에도 불구하고, 타히티인들은 사랑하는 사람의 상실을 처리하는 과정에서 '아프고, 이상한' 감정을 경험했다.","chunks":[]}],"analogy":"색 이름을 모른다고 색을 보지 못하는 것은 아니다. 마찬가지로 어떤 문화에 특정 감정 단어가 없더라도, 그 감정을 느끼는 신체·뇌 반응은 존재할 수 있다."},{"no":"4","title":"Saving the Planet: Not All-or-Nothing","ktitle":"친환경 실천은 전부 아니면 전무가 아니다","field":"수능특강 영어독해연습","page":"04강 Ex.04","oneline":"친환경 생활(식물성 식단·제로 웨이스트)은 전부 아니면 전무의 양자택일이 아니다 — 가능한 만큼 작은 변화를 실천하는 것이 완벽한 실천보다 진짜 중요하다.","metaphor":"<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 양자택일 사고가 압박과 죄책감을 만든다는 빨강 점선 박스, 중앙에 0퍼센트에서 100퍼센트로 이어진 스펙트럼 슬라이더 위 세 곳에 초록 체크 핸들이 어디든 가능함을 보여주고 양 끝은 회색 X로 통념을 부정하며 하단에 작은 실천도 의미 있다는 초록 박스가 결론을 적은 그림\">\n\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">친환경은 양자택일이 아니다 — 스펙트럼이다</text>\n\n  <!-- 상단 빨강 박스: all-or-nothing 통념 -->\n  <g transform=\"translate(60, 26)\">\n    <rect x=\"0\" y=\"0\" width=\"480\" height=\"42\" rx=\"4\" fill=\"#fdf2f4\" fill-opacity=\"0.5\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n    <text x=\"240\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight =\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">육·유제품 조금 줄이기 / 가능할 때 낱개 구매 — 진짜 중요한 것</text>\n  </g>\n</svg>","caption":"친환경은 양자택일 아닌 스펙트럼 — 가능한 만큼이 진짜 중요","tldr":["친환경 생활은 완벽한 실천과 포기 사이의 양자택일이 아니다.","식물성 식단·제로 웨이스트도 가능한 만큼 실천하는 방식이 현실적이다.","작은 변화가 쌓일 때 완벽주의보다 더 지속 가능한 힘이 된다."],"bg":"친환경 실천에서 흔한 “전부 아니면 전무”식 사고를 비판하는 글. 완벽한 식물성 식단이나 제로 웨이스트가 아니어도, 불완전하지만 지속 가능한 작은 실천이 실제 변화를 만든다는 관점이다.","flow":[{"kind":"오해","t":"친환경 실천을 완벽 아니면 실패로 생각함"},{"kind":"문제","t":"완벽주의는 죄책감과 포기로 이어질 수 있음"},{"kind":"전환","t":"실천은 스펙트럼이며 가능한 만큼 해도 의미가 있음"},{"kind":"결론","t":"작은 변화의 지속성이 완벽주의보다 중요함"}],"vocab":[["lifestyle change","생활 방식의 변화"],["plant-based diet","식물성 식단 (육·유제품 최소화)"],["pledge to","~하기로 약속·맹세하다"],["zero-waste","제로 웨이스트의·쓰레기 무배출"],["drastic","급진적인·과감한"],["feel pressured into","~로 떠밀린 듯 느끼다"],["follow suit","(남이 한 대로) 따라하다"],["inadequate","불충분한·부적절한"],["all-or-nothing","전부 아니면 전무의·양자택일"],["venture","시도·모험적 사업"]],"quiz":[["이 글이 비판하는 사고방식은?","친환경 생활을 완벽하게 하지 못하면 아무 의미가 없다고 보는 전부 아니면 전무식 사고이다."],["글이 제안하는 더 현실적인 태도는?","가능한 만큼 작은 변화를 지속하는 태도이다."],["식물성 식단·제로 웨이스트 예시는 어떤 결론을 돕나?","친환경 실천은 양자택일이 아니라 스펙트럼이며, 불완전한 실천도 의미가 있다는 결론을 돕는다."]],"en":"There are some pretty big lifestyle changes you can choose to make if you want to help the planet. For instance, you could follow a plant-based diet, or you could pledge to go zero-waste. If you're surrounded by people who are making these drastic changes, you might feel pressured into following suit: you might feel that if you don't make these changes, your efforts to save the planet are inadequate. Despite what you might hear, a plant-based diet or zero-waste living is not necessarily an all-or-nothing venture. Reducing your meat and dairy intake a little is better than not doing so at all; buying fruit, veg and grains loose when you can is better than always buying them wrapped in plastic. The fact is, you don't have to follow a vegan or a zero-waste lifestyle perfectly to make a difference. Making little changes where you can and how you can is what truly counts.","ko":"지구를 돕고 싶다면 선택해서 실천할 수 있는 꽤 큰 생활 방식의 변화가 몇 가지 있다. 예를 들어, 식물성 식단을 따르거나 제로 웨이스트를 실천하겠다고 약속할 수 있다. 이런 급진적 변화를 실천하는 사람들에게 둘러싸여 있다면, 따라 해야 한다는 압박감을 느낄 수 있다 — 이런 변화를 실천하지 않으면 지구를 구하려는 노력이 부족하다고 느낄 수 있다. 여러분이 듣게 될지도 모르는 것과는 달리, 식물성 식단이나 제로 웨이스트 생활은 반드시 전부 아니면 전무의 시도는 아니다. 육류·유제품을 조금이라도 줄이는 것이 전혀 안 줄이는 것보다 낫다 — 가능할 때 과일·채소·곡물을 포장 없이 낱개로 사는 것이 늘 비닐 포장된 것을 사는 것보다 낫다. 사실, 변화를 만들기 위해 비건이나 제로 웨이스트 생활을 완벽하게 따라야 할 필요는 없다. 가능한 곳에서 가능한 방식으로 작은 변화를 실천하는 것이야말로 진짜 중요한 것이다.","read":[{"en":"There are some pretty big lifestyle changes you can choose to make if you want to help the planet.","ko":"지구를 돕고 싶다면 선택해서 실천할 수 있는 꽤 큰 생활 방식의 변화가 몇 가지 있다.","chunks":[]},{"en":"For instance, you could follow a plant-based diet, or you could pledge to go zero-waste.","ko":"예를 들어, 식물성 식단을 따르거나 제로 웨이스트를 실천하겠다고 약속할 수 있다.","chunks":[]},{"en":"If you're surrounded by people who are making these drastic changes, you might feel pressured into following suit: you might feel that if you don't make these changes, your efforts to save the planet are inadequate.","ko":"이런 급진적 변화를 실천하는 사람들에게 둘러싸여 있다면, 따라 해야 한다는 압박감을 느낄 수 있다 — 이런 변화를 실천하지 않으면 지구를 구하려는 노력이 부족하다고 느낄 수 있다.","chunks":[]},{"en":"Despite what you might hear, a plant-based diet or zero-waste living is not necessarily an all-or-nothing venture.","ko":"여러분이 듣게 될지도 모르는 것과는 달리, 식물성 식단이나 제로 웨이스트 생활은 반드시 전부 아니면 전무의 시도는 아니다.","chunks":[]},{"en":"Reducing your meat and dairy intake a little is better than not doing so at all; buying fruit, veg and grains loose when you can is better than always buying them wrapped in plastic.","ko":"육류·유제품을 조금이라도 줄이는 것이 전혀 안 줄이는 것보다 낫다 — 가능할 때 과일·채소·곡물을 포장 없이 낱개로 사는 것이 늘 비닐 포장된 것을 사는 것보다 낫다.","chunks":[]},{"en":"The fact is, you don't have to follow a vegan or a zero-waste lifestyle perfectly to make a difference.","ko":"사실, 변화를 만들기 위해 비건이나 제로 웨이스트 생활을 완벽하게 따라야 할 필요는 없다.","chunks":[]},{"en":"Making little changes where you can and how you can is what truly counts.","ko":"가능한 곳에서 가능한 방식으로 작은 변화를 실천하는 것이야말로 진짜 중요한 것이다.","chunks":[]}],"analogy":"운동을 매일 두 시간 못 한다고 건강관리를 포기할 필요는 없다. 십 분 걷기라도 꾸준하면 의미가 있듯, 친환경 실천도 완벽보다 지속 가능한 만큼의 변화가 중요하다."}]};

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">B</span>
      <span class="tname">핵심 요약</span>
      <span class="thint">— 읽고 나서 핵심 정리</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg && !d.analogy) return '';
  const bg = d.bg ? `<p class="callout bg">${d.bg}</p>` : '';
  const analogy = d.analogy ? `<p class="callout analogy"><b>비유로 보면</b><br>${d.analogy}</p>` : '';
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">A</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 배경 개념과 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${bg}${analogy}</div>
  </details>`;
}

function renderFlow(d) {function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">논리 흐름</span>
      <span class="thint">— 글의 전개</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderBG(d);
  html += renderTLDR(d);
  html += renderFlow(d);
  html += renderQuiz(d);
  html += renderRead(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

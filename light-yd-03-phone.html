<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 Light 영어독해연습 03강 (6지문)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 Light 영어독해연습 03강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-phone">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 Light 영어독해연습 03강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 Light 영어독해연습 03강 6개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data":[{"no":"13","title":"Can Courage Be Learned?","ktitle":"용기는 배울 수 있는가","field":"심리·자기계발","page":"p20 no13","oneline":"용기가 <span class='r'>유전·성격 특성</span>이라면 학습은 무의미하지만 — 연구는 <span class='g'>82%가 강화 전략을 선택</span>한다는 사실로 <span class='g'>후천적 보강 가능성</span>을 뒷받침한다.","metaphor":"<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"두 가설(유전·고정 성격)이 만약 옳다면 용기는 학습 불가지만, 연구의 82% 강화 전략 선택이 그 가설들을 반박해 용기의 후천적 보강 가능성을 보여주는 그림\">\n  <!-- 좌측: 두 가설 박스 (학습 불가 결론) -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"120\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">만약 두 가설이 맞다면</text>\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"170\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 가설 1: 유전 -->\n    <g transform=\"translate(120, 35)\">\n      <rect x=\"-95\" y=\"-16\" width=\"190\" height=\"34\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <text x=\"-85\" y=\"2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#c8102e\">if H₁:</text>\n      <text x=\"-55\" y=\"2\" font-family=\"Noto Serif KR\" font-size=\"11\" fill=\"#1a1a1a\">용기 = 유전 회로</text>\n      <text x=\"78\" y=\"2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"end\" fill=\"#c8102e\">genes</text>\n    </g>\n\n    <!-- 가설 2: 고정 성격 -->\n    <g transform=\"translate(120, 80)\">\n      <rect x=\"-95\" y=\"-16\" width=\"190\" height=\"34\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <text x=\"-85\" y=\"2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#c8102e\">if H₂:</text>\n      <text x=\"-55\" y=\"2\" font-family=\"Noto Serif KR\" font-size=\"11\" fill=\"#1a1a1a\">용기 = 고정 성격</text>\n      <text x=\"78\" y=\"2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"end\" fill=\"#c8102e\">trait</text>\n    </g>\n\n    <!-- 결론: unlearnable -->\n    <g transform=\"translate(120, 130)\">\n      <rect x=\"-80\" y=\"-14\" width=\"160\" height=\"28\" rx=\"14\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">→ unlearnable ✗</text>\n    </g>\n  </g>\n\n  <!-- 가운데 BUT 화살표 -->\n  <g transform=\"translate(265, 110)\">\n    <text x=\"20\" y=\"-8\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">but</text>\n    <line x1=\"0\" y1=\"0\" x2=\"40\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"40,0 32,-5 32,5\" fill=\"#1FA34A\"/>\n    <text x=\"20\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">연구 결과</text>\n  </g>\n\n  <!-- 우측: 82% 게이지 + 결론 -->\n  <g transform=\"translate(320, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">실제 연구 결과</text>\n    <rect x=\"0\" y=\"0\" width=\"260\" height=\"170\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 82% 게이지 -->\n    <g transform=\"translate(135, 50)\">\n      <rect x=\"-100\" y=\"-15\" width=\"200\" height=\"30\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <rect x=\"-100\" y=\"-15\" width=\"164\" height=\"30\" fill=\"#1FA34A\"/>\n      <text x=\"0\" y=\"5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">82%</text>\n    </g>\n    <text x=\"135\" y=\"82\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">chose courage-enhancing strategies</text>\n\n    <!-- 결론: learnable -->\n    <g transform=\"translate(135, 125)\">\n      <rect x=\"-95\" y=\"-14\" width=\"190\" height=\"28\" rx=\"14\" fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">→ courage CAN be enhanced ✓</text>\n    </g>\n  </g>\n\n  <!-- 하단: 세 예시 라벨 -->\n  <text x=\"300\" y=\"225\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">examples: actor · boxer · everyday person — rituals for favorable outcomes</text>\n</svg>","caption":"두 가설(유전·고정 성격)이 맞다면 용기는 학습 불가지만 — 연구는 82%가 강화 전략을 선택한다는 사실로 후천적 보강이 가능함을 보여준다.","tldr":["용기가 단순 ‘성격’이면 노력해도 소용없겠지만, 연구는 ‘배울 수 있다’고 본다.","연구 대상자의 82%가 용기 강화 전략을 시도한다.","반복 노출·익숙해지기 같은 방법으로 용기를 키울 수 있다."],"analogy":"수영이 무섭던 사람도 물에 자꾸 들어가면 덜 무서워지죠. 용기도 ‘타고난 성격’이 아니라 연습으로 키우는 근육 같은 거예요.","bg":"‘용기는 학습 가능한가?’를 다루는 글. 용기에 유전적 요소가 있을 수 있지만, 연구는 전략(반복 노출 등)으로 ‘용기 지수’를 끌어올릴 수 있다고 봐요.","flow":[{"kind":"질문 Q","t":"용기는 ‘터득’될 수 있을까?"},{"kind":"만약","t":"단순 성격이면 — 노력해도 무의미","d":"용기가 그냥 타고난 특성이라면."},{"kind":"연구","t":"희망이 있다","d":"82%가 용기 강화 전략을 시도."},{"kind":"방법","t":"반복 노출·익숙해지기","d":"배우는 무대에, 권투 선수는 링에 익숙해진다."},{"kind":"결론","t":"용기 = 학습·강화 가능한 능력","cls":"close"}],"vocab":[["concern","관련시키다"],["hard-wiring","(타고난) 회로·배선"],["genetic","유전적인"],["component","(구성) 요소·성분"],["trait","특성·특징"],["boost","끌어올리다·증진하다"]],"quiz":[["용기가 ‘단순한 성격 특성’이라면 왜 문제인가?","그렇다면 더 잘 발휘하려 노력해도 소용이 없기 때문. 하지만 연구는 용기가 ‘배울 수 있다’고 봐요."],["연구가 보여주는 희망적 결과는?","연구 대상자의 82%가 어려운 상황에 맞서도록 돕는 ‘용기 강화 전략’을 시도한다는 점이에요."],["핵심 한 문장?","용기는 타고난 성격이 아니라 연습으로 키울 수 있는 능력이다."]],"en":"The million-dollar question where courage is concerned is whether or not courage can be learned. If fear and courage are to be found at least in part in the hard-wiring of our brains, then it certainly makes sense to assume that there is a genetic component to bravery. If bravery is simply a personality trait, then there isn't much point in trying to learn how to do it better. Fortunately, the research suggests there is hope for people who want to boost their courage quotient. Studies show that people ─ as many as 82 percent of those studied ─ overwhelmingly opt to try courage-enhancing strategies to help them face difficult circumstances. Actors who are nervous before opening night spend time on the stage, familiarizing themselves with the auditorium; boxers strut and look angry to overcome the butterflies in their stomachs; people pray or knock on wood or wear favorite pieces of clothing, all because they think this will help to give them a more favorable outcome and allow them to face an uncertain, even risky future.","ko":"용기와 관련된 백만 달러짜리 질문은 용기가 터득될 수 있느냐 여부이다. 두려움과 용기가 적어도 부분적으로 우리 뇌의 (타고난) 회로 안에서 발견될 수 있다면, 그렇다면 용기에 유전적 요소가 있다고 가정하는 것이 분명히 이치에 맞다. 용기가 단순히 성격 특성이라면, 그것을 더 잘 발휘하는 법을 배우려고 노력하는 것에는 별 의미가 없다. 다행히도 연구는 용기 지수를 끌어올리고 싶은 사람들에게 희망이 있다고 시사한다. 연구는 사람들 ─ 연구 대상자 중 무려 82%나 되는 사람들 ─ 이 어려운 상황에 직면하도록 돕는 용기 강화 전략을 시도하는 것을 압도적으로 선택한다는 것을 보여 준다. 초연 전날 밤에 긴장한 배우들은 무대 위에서 시간을 보내며 객석에 익숙해지고, 권투 선수들은 긴장을 극복하기 위해 뽐내며 걸으며 화나 보이고, 사람들은 기도하거나 나무를 두드리거나 가장 좋아하는 옷을 입는데, 모두 이것이 그들에게 더 유리한 결과를 주고 불확실하고 심지어 위험한 미래에 맞서게 해 줄 것이라고 생각하기 때문이다.","read":[{"en":"The million-dollar question where courage is concerned is whether or not courage can be learned.","ko":"용기와 관련된 백만 달러짜리 질문은 용기가 터득될 수 있느냐 여부이다.","chunks":[["The million-dollar question where courage is concerned is whether or not courage can be learned.","용기와 관련된 백만 달러짜리 질문은 용기가 터득될 수 있느냐 여부이다."]]},{"en":"If fear and courage are to be found at least in part in the hard-wiring of our brains, then it certainly makes sense to assume that there is a genetic component to bravery.","ko":"두려움과 용기가 적어도 부분적으로 우리 뇌의 (타고난) 회로 안에서 발견될 수 있다면, 그렇다면 용기에 유전적 요소가 있다고 가정하는 것이 분명히 이치에 맞다.","chunks":[["If fear and courage are to be found at least in part in the hard-wiring of our brains, then it certainly makes sense to assume that there is a genetic pening night spend time on the stage, familiarizing themselves with the auditorium; boxers strut and look angry to overcome the butterflies in their stomachs; people pray or knock on wood or wear favorite pieces of clothing, all because they think this will help to give them a more favorable outcome and allow them to face an uncertain, even risky future.","초연 전날 밤에 긴장한 배우들은 무대 위에서 시간을 보내며 객석에 익숙해지고, 권투 선수들은 긴장을 극복하기 위해 뽐내며 걸으며 화나 보이고, 사람들은 기도하거나 나무를 두드리거나 가장 좋아하는 옷을 입는데, 모두 이것이 그들에게 더 유리한 결과를 주고 불확실하고 심지어 위험한 미래에 맞서게 해 줄 것이라고 생각하기 때문이다."]]}]},{"no":"14","title":"Two Brain Systems","ktitle":"뇌의 두 시스템","field":"신경과학","page":"p21 no14","oneline":"뇌에는 <span class='g'>언어적 시스템</span>과 <span class='g'>비언어적(시각 심상) 시스템</span>이 분리돼 있지만 — 보통 사람에선 둘이 <span class='g'>끊임없이 상호작용</span>해 사물 인식·심상 기억을 가능하게 한다.","metaphor":"<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 뇌 손상 환자의 뇌에서 시각·언어 두 시스템이 분리된 모습과, 오른쪽 보통 사람의 뇌에서 두 시스템이 양방향 화살표로 끊임없이 상호 작용하는 모습 대조\">\n  <!-- 좌측: 뇌 손상 환자 — 분리 -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">뇌 손상 환자 — 분리</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"180\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n\n    <!-- 뇌 외곽 -->\n    <g transform=\"translate(135, 95)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"100\" ry=\"60\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 좌반구 — Visual -->\n      <ellipse cx=\"-45\" cy=\"0\" rx=\"35\" ry=\"40\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n      <text x=\"-45\" y=\"-3\" font-family=\"Noto Serif\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">Visual</text>\n      <text x=\"-45\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">시각 심상</text>\n      <!-- 우반구 — Verbal -->\n      <ellipse =\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\">시각 심상</text>\n      <!-- 우반구 — Verbal -->\n      <ellipse cx=\"45\" cy=\"0\" rx=\"35\" ry=\"40\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <text x=\"45\" y=\"-3\" font-family=\"Noto Serif\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">Verbal</text>\n      <text x=\"45\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\">단어 식별</text>\n      <!-- 양방향 화살표 -->\n      <g transform=\"translate(0, 0)\">\n        <line x1=\"-10\" y1=\"-5\" x2=\"10\" y2=\"-5\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n        <polygon points=\"10,-5 5,-9 5,-1\" fill=\"#1FA34A\"/>\n        <line x1=\"10\" y1=\"5\" x2=\"-10\" y2=\"5\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n        <polygon points=\"-10,5 -5,1 -5,9\" fill=\"#1FA34A\"/>\n      </g>\n    </g>\n\n    <text x=\"135\" y=\"170\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">continually interacting — recognize · remember</text>\n  </g>\n</svg>","caption":"뇌 손상 환자에선 두 시스템이 분리되지만(한쪽만 작동), 보통 사람에선 두 시스템이 끊임없이 상호 작용한다 — 그래서 사물 인식과 심상 기반 기억이 가능하다.","tldr":["뇌엔 ‘시각(심상)’ 시스템과 ‘언어’ 시스템이 따로 있다.","뇌 손상 환자 연구로 둘이 ‘별개’임이 드러난다.","둘은 독립적이지만 평소엔 함께 작동해 인식·기억을 돕는다."],"analogy":"사진 앱과 이름 검색 앱이 따로지만, 평소엔 ‘사진 보고 이름 떠올리기’처럼 같이 쓰죠. 뇌의 시각·언어 시스템도 그래요.","bg":"뇌의 ‘언어적/비언어적(시각적 심상)’ 두 시스템을 다루는 글. 손상 부위에 따라 한쪽만 망가지는 환자 사례로 둘이 별개임을 보여줘요.","flow":[{"kind":"단서 ①","t":"시각피질 손상 → 시각 기억 곤란","cls":"pivot","d":"단어 외울 때 심상 도움 못 받음."},{"kind":"단서 ②","t":"언어영역 손상 → ‘이름’으로 못 알아봄","cls":"pivot","d":"보면 알지만 이름만으론 식별 곤란."},{"kind":"해석","t":"두 시스템은 별개다","d":"언어적 / 비언어적(시각) 시스템 분리."},{"kind":"결론","t":"분리돼 있지만 끊임없이 상호작용","cls":"close"}],"vocab":[["cortex","(뇌의) 피질"],["imagery","심상·이미지"],["reveal","밝혀내다·드러내다"],["verbal","언어의·말로 된"],["intact","온전한·손상되지 않은"],["identify","식별하다·알아보다"]],"quiz":[["뇌의 ‘언어’ 영역이 손상된 환자의 특징은?","사물을 ‘보고’ 식별하는 건 되는데, 같은 사물을 ‘이름’만으로 식별하는 데는 어려움을 겪어요."],["이 사례들이 보여주는 것은?","뇌에 시각(비언어)·언어 두 시스템이 ‘별개’로 존재한다는 점이에요."],["핵심 한 문장?","시각·언어 두 시스템은 분리돼 있지만 끊임없이 상호작용한다."]],"en":"Patients with damage to the back of the brain, where the visual cortex lies, often have visual memory problems and do not benefit from visual imagery when trying to memorize words. This suggests that the visual brain regions (temporo-occipital cortex) are necessary for forming visual images. A study of brain-damaged patients has revealed separate verbal and nonverbal systems in the brain. Some patients whose visual brain areas are intact but who have suffered damage to the brain's language areas have no problems identifying an object by sight but have great difficulty identifying the same object from its name alone. Such patients still have access to their nonverbal (visual imagery) system, but have problems accessing the verbal identity system. In most people these two systems do not work independently, but are continually interacting to enable skills such as object recognition and imagery-based memory.","ko":"시각 피질이 위치한 뇌 뒤쪽에 손상을 입은 환자들은 흔히 시각 기억에 문제가 있고, 단어를 암기하려고 할 때 시각적 심상으로부터 도움을 받지 못한다. 이는 시각적 뇌 영역(측두-후두 피질)이 시각 이미지를 형성하는 데 필요하다는 것을 시사한다. 뇌가 손상된 환자들에 대한 한 연구는 뇌에서 별개의 언어적·비언어적 시스템을 밝혀냈다. 시각적 뇌 영역은 온전하지만 뇌의 언어적 영역에 손상을 입은 일부 환자는 사물을 보아 식별하는 데는 문제가 없지만, 그 동일한 사물을 이름만으로 식별하는 데는 큰 어려움을 겪는다. 그러한 환자들은 여전히 비언어적(시각적 심상) 시스템에는 접근할 수 있지만, 언어적 식별 시스템에 접근하는 데는 문제가 있다. 대부분 사람에게 이 두 시스템은 독립적으로 작동하지 않고, 사물 인식이나 심상 기반 기억 같은 기능을 가능하게 하도록 끊임없이 상호 작용한다.","read":[{"en":"Patients with damage to the back of the brain, where the visual cortex lies, often have visual memory problems and do not benefit from visual imagery when trying to memorize words.","ko":"시각 피질이 위치한 뇌 뒤쪽에 손상을 입은 환자들은 흔히 시각 기억에 문제가 있고, 단어를 암기하려고 할 때 시각적 심상으로부터 도움을 받지 못한다.","chunks":[["Patients with damage to the back of the brain, where the visual cortex lies, often have visual memory problems and do not benefit from visual imagery when trying ently, but are continually interacting to enable skills such as object recognition and imagery-based memory.","ko":"대부분 사람에게 이 두 시스템은 독립적으로 작동하지 않고, 사물 인식이나 심상 기반 기억 같은 기능을 가능하게 하도록 끊임없이 상호 작용한다.","chunks":[["In most people these two systems do not work independently, but are continually interacting to enable skills such as object recognition and imagery-based memory.","대부분 사람에게 이 두 시스템은 독립적으로 작동하지 않고, 사물 인식이나 심상 기반 기억 같은 기능을 가능하게 하도록 끊임없이 상호 작용한다."]]}]},{"no":"15","title":"Cognitive Bias toward Coherence","ktitle":"일관성 편향","field":"인지심리","page":"p22 no15","oneline":"일관성 편향의 한 축은 <span class='g'>과거 경험에 기반한 예상</span>이며 — 카드 실험은 사람이 <span class='g'>'예상하는 것을 본다'</span>는 점을 보여준다. 예상이 실제 지각을 만든다.","metaphor":"<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"실제 검은 하트 킹이라는 이상한 카드가, 과거 경험에서 비롯된 예상을 거쳐 사람에게는 정상 카드로 지각되는 인과의 그림\">\n  <!-- 좌측: 실제 카드 (검은 하트 킹 — 이상) -->\n  <g transform=\"translate(30, 35)\">\n    <text x=\"80\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">실제 카드 — 이상</text>\n    <rect x=\"20\" y=\"0\" width=\"120\" height=\"160\" rx=\"6\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.8\" stroke-dasharray=\"4 2\"/>\n    <!-- 카드 상단: K + 하트 -->\n    <text x=\"35\" y=\"22\" font-family=\"Noto Serif\" font-size=\"15\" font-weight=\"700\" fill=\"#1a1a1a\">K</text>\n    <!-- 검은 하트 (이상) -->\n    <path d=\"M 35 32 Q 30 26 33 30 Q 39 26 36 32 L 35 40 Z\" fill=\"#1a1a1a\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    \n    <!-- 가운데 큰 하트 (검정) -->\n    <g transform=\"translate(80, 80)\">\n      <path d=\"M 0 -15 C -15 -28, -28 -10, 0 15 C 28 -10, 15 -28, 0 -15 Z\" fill=\"#1a1a1a\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    </g>\n    \n    <!-- 우하 K + 하트 (뒤집힘) -->\n    <g transform=\"translate(125, 140) rotate(180)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-size=\"15\" font-weight=\"700\" fill=\"#1a1a1a\">K</text>\n      <path d=\"M 0 10 Q -5 4 -2 8 살표 -->\n  <g transform=\"translate(335, 125)\">\n    <line x1=\"0\" y1=\"0\" x2=\"50\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"50,0 42,-5 42,5\" fill=\"#1FA34A\"/>\n    <text x=\"25\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">expectation forms perception</text>\n  </g>\n\n  <!-- 우측: 보이는 것 (정상 카드) -->\n  <g transform=\"translate(410, 35)\">\n    <text x=\"80\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">보이는 것 — 정상</text>\n    <rect x=\"20\" y=\"0\" width=\"120\" height=\"160\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n    <!-- 카드 상단: K + 빨간 하트 -->\n    <text x=\"35\" y=\"22\" font-family=\"Noto Serif\" font-size=\"15\" font-weight=\"700\" fill=\"#c8102e\">K</text>\n    <path d=\"M 35 32 Q 30 26 33 30 Q 39 26 36 32 L 35 40 Z\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    \n    <!-- 가운데 큰 빨간 하트 -->\n    <g transform=\"translate(80, 80)\">\n      <path d=\"M 0 -15 C -15 -28, -28 -10, 0 15 C 28 -10, 15 -28, 0 -15 Z\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n    </g>\n    \n    <g transform=\"translate(125, 140) rotate(180)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-size=\"15\" font-weight=\"700\" fill=\"#c8102e\">K</text>\n      <path d=\"M 0 10 Q -5 4 -2 8 Q 4 4 1 10 L 0 18 Z\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    </g>\n\n    <text x=\"80\" y=\"184\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">perceived as regular card</text>\n  </g>\n</svg>","caption":"실제로는 검은 하트 킹(이상)이지만, 과거 경험의 예상이 작동해 사람은 정상 카드로 본다 — 예상이 지각을 형성한 결과다.","tldr":["뇌는 일관성을 좋아해, ‘예상한 것’을 보도록 지각을 왜곡한다.","예: ‘검은 하트 킹’ 같은 조작 카드를 평범한 카드로 인식.","과거의 일관된 경험이 미래 지각도 일관되게 만든다."],"analogy":"오타가 있어도 글이 술술 읽히죠 — 뇌가 ‘이럴 거야’ 예상한 대로 메워 읽기 때문이에요. 카드 실험의 ‘검은 하트 킹’도 그래서 평범한 카드로 보입니다.","bg":"‘일관성 편향(coherence bias)’ — 과거 경험으로 만든 예상이 지각을 좌우한다는 인지심리 글. ‘불가능한 카드(검은 하트 킹)’ 실험이 대표 사례예요.","flow":[{"kind":"핵심","t":"일관성 편향 — 예상이 지각을 바꾼다"},{"kind":"원인","t":"‘과거 경험을 쓴 추론’","d":"무엇을 볼지 미리 예상."},{"kind":"실험","t":"불가능한 카드 — 검은 하트 킹","d":"조작 카드를 짧게 보여주고 식별 요청."},{"kind":"결과","t":"이상함 못 알아채고 ‘평범한 카드’로 인식","d":"하트를 스페이드로 — 예상대로 본 것."},{"kind":"결론","t":"우리는 ‘보려고 예상한 것’을 본다","cls":"close"}],"vocab":[["cognitive","인지의·인식의"],["bias","편향·편견"],["coherence","일관성·응집성"],["extrapolation","(과거에 근거한) 추론·외삽"],["perception","지각·인식"],["expectation","예상·기대"]],"quiz":[["‘검은 하트 킹’을 평범한 카드로 본 이유는?","하트·스페이드를 구별 못 해서가 아니라, ‘예상한 것(평범한 카드)’대로 지각하기 때문이에요(일관성 편향)."],["일관성 편향은 무엇에 기반하나?","‘과거 경험을 사용한 추론’ — 과거의 일관된 경험이 미래 지각도 일관되게 만들어요."],["핵심 한 문장?","우리는 실제가 아니라 ‘보려고 예상한 것’을 본다."]],"en":"Various factors are behind the cognitive bias towards coherence. One is the extrapolation of past experience that influences our perceptions through expectations about what we are going to perceive. A case in point here is the well-known playing-card experiment involving impossible cards. A subject is briefly shown a variety of playing cards, some of which are doctored (such as a black king of hearts) and is asked to identify them. In the majority of cases, the subjects did not note the unusual features of the doctored cards, but rather perceived them as regular cards. The black king of hearts would thus be identified as a king of spades ─ not because the subject cannot differentiate heart-shapes from spade-shapes, but because he sees what he is expecting to see, namely a regular playing card. Our expectations about what we are going to perceive can strongly influence what we do in fact perceive. In this way, having perceived various coherent phenomena in the past, we can expect that future perceived phenomena are similarly coherent, and this expectation may make it more likely that we in fact experience them as coherent, whether they are coherent or not.","ko":"일관성을 향한 인지 편향 뒤에는 다양한 요인이 있다. 한 요인은 우리가 무엇을 지각하게 될지에 대한 예상을 통해 우리의 지각에 영향을 미치는 \"과거 경험을 사용한 추론\"이다. 여기에 적절한 사례는 불가능한 카드를 포함한 잘 알려진 카드놀이 실험이다. 실험 대상자는 짧은 시간 동안 다양한 카드를 보게 되는데, 그 카드 중 일부는 (검은색 하트 킹과 같이) 조작된 것이며, 그것을 식별하라고 요청받는다. 다수의 경우에 그 실험 대상자들은 조작된 카드의 이상한 특징을 알아내지 못했고, 오히려 그것을 일반적인 카드로 인식했다. 검은색 하트 킹은 이처럼 스페이드 킹으로 인식될 것인데, 이는 실험 대상자가 하트 모양을 스페이드 모양과 구별할 수 없기 때문이 아니라, 그가 예상하고 있는 것 — 즉 일반적인 놀이용 카드를 보기 때문이다. 우리가 지각하게 될 것에 대한 우리의 예상은 우리가 실제로 지각하는 것에 강력하게 영향을 미칠 수 있다. 이런 식으로 과거에 다양한 일관된 현상을 지각해 왔기에 우리는 향후 지각될 현상이 유사하게 일관된다고 예상할 수 있고, 이러한 예상으로 인해, 일관성이 있든 없든, 우리가 실제로 그것을 일관된 것으로 경험하게 될 가능성이 더 높아질 수 있다.","read":[{"en":"Various factors are behind the cognitive bias towards coherence.","ko":"일관성을 향한 인지 편향 뒤에는 다양한 요인이 있다.","chunks":[["Various factors are behind the cognitive bias towards coherence.","일관성을 향한 인지 편향 뒤에는 다양한 요인이 있다."]]},{"en":"One is the extrapolation of past experience that influences our perceptions through expectations about what we are going to perceive.","ko":"한 요인은 우리가 무엇을 지각하게 될지에 대한 예상을 통해 우리의 지각에 영향을 미치는 \"과거 경험을 사용한 추론\"이다.","chunks":[["One is the extrapolation of past experience that influences our perceptions through expectations about what we are going to perceive.","한 요인은 우리가 무엇을 지각하게 될지에 대한 예상을 통해 우리의 지각에 영향을 미치는 \"과거 경험을 사용한 추론\"이다."]]},{"en":"A case in point here is the well-known playing-card experiment involving impossible cards.","ko":"여기에 적절한 사례는 불가능한 카드를 포함한 잘 알려진 카드놀이 실험이다.","chunks":[["A case in point here is the well-known playing-card experiment involving impossible cards.","여기에 적절한 사례는 불가능한 카드를 포함한 잘 알려진 카드놀이 실험이다."]]},{"en":"A subject is briefly shown a variety of playing cards, some of which are doctored (such as a black king of hearts) and is asked to identify them.","ko":"실험 대상자는 짧은 시간 동안 다양한 카드를 보게 되는데, 그 카드 중 일부는 (검은색 하트 킹과 같이) 조작된 것이며, 그것을 식별하라고 요청받는다.","chunks":[["A subject is briefly shown a variety of playing cards, some of which are doctored (such as a black king of hearts) and is asked to identify them.","실험 대상자는 짧은 시간 동안 다양한 카드를 보게 되  수 있다.","chunks":[["In this way, having perceived various coherent phenomena in the past, we can expect that future perceived phenomena are similarly coherent, and this expectation may make it more likely that we in fact experience them as coherent, whether they are coherent or not.","이런 식으로 과거에 다양한 일관된 현상을 지각해 왔기에 우리는 향후 지각될 현상이 유사하게 일관된다고 예상할 수 있고, 이러한 예상으로 인해, 일관성이 있든 없든, 우리가 실제로 그것을 일관된 것으로 경험하게 될 가능성이 더 높아질 수 있다."]]}]},{"no":"16","title":"Reciprocal Altruism","ktitle":"상호 이타주의","field":"진화생물","page":"p23 no16","oneline":"상호 이타주의는 <span class='r'>유전적 이익 없는</span> 비친족 도움 — 흡혈박쥐는 <span class='g'>호혜 신뢰가 있을 때만</span> 피를 나누고 <span class='r'>위반자는 무시</span>해, 굶주리는 시기를 함께 버틴다.","metaphor":"<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 두 박쥐가 피를 서로 나누는 호혜 성립 장면과, 오른쪽 위반 박쥐가 다른 박쥐들에게 무시당하는 처벌 장면의 대조\">\n  <!-- 좌측: 호혜 성립 (두 박쥐 피 나눔) -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">호혜 성립 — trust</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"180\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 박쥐 A (좌) -->\n    <g transform=\"translate(70, 90)\">\n      <!-- 몸 -->\n      <ellipse cx=\"0\" cy=\"0\" rx=\"13\" ry=\"9\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <!-- 머리 -->\n      <circle cx=\"0\" cy=\"-8\" r=\"6\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <!-- 귀 (뾰족) -->\n      <polygon points=\"-3,-13 -5,-17 -2,-15\" fill=\"#1FA34A\"/>\n      <polygon points=\"3,-13 5,-17 2,-15\" fill=\"#1FA34A\"/>\n      <!-- 눈 -->\n      <circle cx=\"-1.5\" cy=\"-8\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <circle cx=\"1.5\" cy=\"-8\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <!-- 날개 (좌) -->\n      <path d=\"M -10 -2 Q -28 -8 -25 8\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <path d=\"M -10 -2 Q -20 -2 -25 8\" fill=\"none\" stroke=\"#1FA34A 11\" y2=\"14\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    </g>\n\n    <text x=\"135\" y=\"167\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">ignored — strategy enforced</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"235\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">strategy to survive lean times — reciprocity sustained by punishment</text>\n</svg>","caption":"좌측: 두 박쥐가 서로 피를 나눔(호혜 성립). 우측: 한 박쥐가 받기만 하는 위반자가 되면 다른 박쥐들이 무시한다 — 위반자 처벌이 호혜를 유지한다.","tldr":["혈연도 아닌데 남을 돕는 건 유전적 이득이 없어 보여 이해가 어렵다.","흡혈박쥐는 사냥 실패한 동료에게 피를 나눠준다 — 단, ‘되갚을 거라 신뢰될 때만’.","과거에 안 갚은 박쥐는 ‘이기적’ 평판이 생겨 나중에 외면당한다."],"analogy":"친구가 급할 때 돈 빌려주는 건 ‘나도 급하면 갚아줄 것’이란 신뢰 때문이죠. 안 갚는 사람은 평판이 나빠져 다음엔 아무도 안 도와줘요 — 흡혈박쥐도 똑같습니다.","bg":"‘상호 이타주의(reciprocal altruism)’ — 혈연 아닌 개체를 돕는 행동이 ‘호혜성·신뢰·평판’으로 진화했다는 글. 흡혈박쥐의 피 나눔이 대표 사례예요.","flow":[{"kind":"정의","t":"상호 이타주의 = 비친족 돕기"},{"kind":"의문","t":"유전적 이득 없는데 왜?"},{"kind":"사례","t":"흡혈박쥐 피 나눔","d":"사냥 실패한 동료를 먹임."},{"kind":"조건","t":"‘되갚을 신뢰’가 있을 때만","d":"안 갚으면 평판↓ → 나중에 외면."},{"kind":"결론","t":"호혜·신뢰·평판 기반 생존 전략","cls":"close"}],"vocab":[["reciprocal","상호 간의·호혜적인"],["altruism","이타주의·이타 행동"],["be related to","~과 (혈연·관련) 관계가 있다"],["genetic","유전적인"],["regurgitate","(삼킨 것을) 토해내다·게워내다"],["nestmate","(같은) 서식처 동료·둥지 동료"]],"quiz":[["흡혈박쥐는 아무에게나 피를 나눠줄까?","아니에요 — ‘되갚을 거라 신뢰되는’ 동료에게만 나눠줘요. 과거에 안 갚은 박쥐는 외면당해요."],["상호 이타주의가 유지되는 이유는?","호혜성·신뢰·평판 덕분에, 먹이가 불확실한 시기를 서로 도와 버티게 해주기 때문이에요."],["핵심 한 문장?","상호 이타주의는 호혜성·신뢰·평판에 기반한 생존 전략이다."]],"en":"Reciprocal altruism is when we help others we are not related to. At first, reciprocal altruism seems more difficult to understand as there is no obvious genetic benefit. One strange example of reciprocal altruism comes from the blood-sucking vampire bat of South America. If, after a night's hunting, a particular bat has been unsuccessful, other bats will regurgitate some of the blood they have swallowed to feed their hungry nestmate ─ but only if they can be trusted to return the favour. Bats who have broken such blood deals in the past gain a reputation for being selfish and are ignored in the future, should they go hungry. Given the unpredictability of meals, reciprocal altruism is a strategy to get individuals through lean times. If you have a particularly good day hunting, then sharing with others less successful creates a debt to be paid back when you are not so fortunate.","ko":"호혜적 이타주의란 우리가 (혈연)관계가 없는 다른 사람들을 돕는 것이다. 처음에는 상호 이타주의가 명백한 유전적 이익이 없기 때문에 이해하기가 더 어려워 보인다. 상호 이타주의의 기이한 한 예는 남미의 피를 빨아먹는 뱀파이어 박쥐에서 나온다. 만약 하룻밤의 사냥 후에 특정 박쥐가 사냥에 실패했다면, 다른 박쥐들은 자신들이 삼킨 피의 일부를 토해내어 배고픈 동료를 먹이지만, 오직 그들이 호의를 되돌려줄 것이라고 신뢰될 수 있을 때만 그렇게 한다. 과거에 그런 피 거래를 어긴 박쥐는 이기적이라는 평판을 얻고, 혹시 굶주리게 되더라도 향후에는 무시당한다. 식사의 예측 불가능성을 고려할 때, 상호 이타주의는 개체들이 먹이가 부족한 시기를 버티게 하는 전략이다. 만약 사냥에서 특히 좋은 하루를 보낸다면, 덜 성공한 다른 이들과 나누는 것은 운이 좋지 않을 때 돌려받게 될 빚을 만든다.","read":[{"en":"Reciprocal altruism is when we help others we are not related to.","ko":"호혜적 이타주의란 우리가 (혈연)관계가 없는 다른 사람들을 돕는 것이다.","chunks":[["Reciprocal altruism is when we help others we are not related to.","호혜적 이타주의란 우리가 (혈연)관계가 없는 다른 사람들을 돕는 것이다."]]},{"en":"At first, reciprocal altruism seems more difficult to understand as there is no obvious genetic benefit.","ko":"처음에는 상호 이타주의가 명백한 유전적 이익이 없기 때문에 이해하기가 더 어려워 보인다.","chunks":[["At first, reciprocal altruism seems more difficult to understand as there is no obvious genetic benefit.","처음에는 상호 이타주의가 명백한 유전적 이익이 없기 때문에 이해하기가 더 어려워 보인다."]]},{"en":"One strange example of reciprocal altruism comes from the blood-sucking vampire bat of South America.","ko":"상호 이타주의의 기이한 한 예는 남미의 피를 빨아먹는 뱀파이어 박쥐에서 나온다.","chunks":[["One strange example of reciprocal altruism comes from the blood-sucking vampire bat of South America.","상호 이타주의의 기이한 한 예는 남미의 피를 빨아먹는 뱀파이어 박쥐에서 나온다."]]},{"en":"If, after a night's hunting, a particular bat has been unsuccessful, other bats will regurgitate some of the blood they have swallowed to feed their hungry nestmate ─ but only if they can be trusted to return the favour.","ko":"만약 하룻밤의 사냥 후에 특정 박쥐가 사냥에 실패했다면, 다른 박쥐들은 자신들이 삼킨 피의 일부를 토해내어 배고픈 동료를 먹이지만, 오직 그들이 호의를 되돌려줄 것이라고 신뢰될 수 있을 때만 그렇게 한다.","chunks":[["If, after a night's hunting, a particular bat has been unsuccessful, other bats will regurgitate some of the blood they have swallowed to feed their hungry nestmate ─ but only if they can be trusted to return the favour.","만약 하룻밤의 사냥 후에 특정 박쥐가 사냥에 실패했다면, 다른 박쥐들은 자신들이 삼킨 피의 일부를 토해내어 배고픈 동료를 먹이지만, 오직 그들이 호의를 되돌려줄 것이라고 신뢰될 수 있을 때만 그렇게 한다."]]},{"en":"Bats who have broken such blood deals in the past gain a reputation for being selfish and are ignored in the future, should they go hungry.","ko":"과거에 그런 피 거래를 어긴 박쥐는 이기적이라는 평판을 얻고, 혹시 굶주리게 되더라도 향후에는 무시당한다.","chunks":[["Bats who have broken such blood deals in the past gain a reputation for being selfish and are ignored in the future, should they go hungry.","과거에 그런 피 거래를 어긴 박쥐는 이기적이라는 평판을 얻고, 혹시 굶주리게 되더라도 향후에는 무시당한다."]]},{"en":"Given the unpredictability of meals, reciprocal altruism is a strategy to get individuals through lean times.","ko":"식사의 예측 불가능성을 고려할 때, 상호 이타주의는 개체들이 먹이가 부족한 시기를 버티게 하는 전략이다.","chunks":[["Given the unpredictability of meals, reciprocal altruism is a strategy to get individuals through lean times.","식사의 예측 불가능성을 고려할 때, 상호 이타주의는 개체들이 먹이가 부족한 시기를 버티게 하는 전략이다."]]},{"en":"If you have a particularly good day hunting, then sharing with others less successful creates a debt to be paid back when you are not so fortunate.","ko":"만약 사냥에서 특히 좋은 하루를 보낸다면, 덜 성공한 다른 이들과 나누는 것은 운이 좋지 않을 때 돌려받게 될 빚을 만든다.","chunks":[["If you have a particularly good day hunting, then sharing with others less successful creates a debt to be paid back when you are not so fortunate.","만약 사냥에서 특히 좋은 하루를 보낸다면, 덜 성공한 다른 이들과 나누는 것은 운이 좋지 않을 때 돌려받게 될 빚을 만든다."]]}]},{"no":"17","title":"Triple Bottom Line","ktitle":"Triple Bottom Line (3P)","field":"경영·사회","page":"p24 no17","oneline":"전통적 'bottom line'은 <span class='r'>수익성만</span> 보지만 — 부상하는 <span class='g'>triple bottom line</span>은 <span class='g'>경제·사회·환경(3P)</span>을 함께 본다.","metaphor":"<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"전통적인 단일 수익성 잣대가 경제·사회·환경 세 축을 함께 보는 Triple Bottom Line으로 확장되는 그림과 학생 세대 70·79% 지지 데이터\">\n  <!-- 좌측: 전통 bottom line (수익성만) -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"80\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">전통 — 단일 잣대</text>\n    <rect x=\"0\" y=\"0\" width=\"160\" height=\"130\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.3\"/>\n\n    <!-- 단일 박스: profit -->\n    <g transform=\"translate(80, 60)\">\n      <rect x=\"-45\" y=\"-22\" width=\"90\" height=\"44\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">$</text>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">profit only</text>\n    </g>\n\n    <text x=\"80\" y=\"118\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">\"bottom line\"</text>\n  </g>\n\n  <!-- 가운데 evolves 화살표 -->\n  <g transform=\"translate(195, 90)\">\n    <line x1=\"0\" y1=\"0\" x2=\"35\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"35,0 27,-5 27,5\" fill=\"#1FA34A\"/>\n    <text x=\"17\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">evolves</text>\n    <text x=\"17\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">확장</text>\n  </g>\n\n  <!-- 우측: Triple Bottom Line (3개) -->\n  <g transform=\"translate(245, 30)\">\n    <text x=\"170\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Triple Bottom Line — 3개 잣대</text>\n    <rect x=\"0\" y=\"0\" width=\"340\" height=\"130\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- Profit -->\n    <g transform=\"translate(57, 60)\">\n      <rect x=\"-42\" y=\"-22\" width=\"84\" height=\"44\" rx=\"4\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">$</text>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">profit</text>\n    </g>\n\n    <!-- People -->\n    <g transform=\"translate(170, 60)\">\n      <rect x=\"-42\" y=\"-22\" width=\"84\" height=\"44\" rx=\"4\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <!-- 사람 아이콘 -->\n      <circle cx=\"0\" cy=\"-5\" r=\"4\" fill=\"#1FA34A\"/>\n      <path d=\"M -7 8 L -4 -2 L 4 -2 L 7 8 Z\" fill=\"#1FA34A\"/>\n      <text x=\"0\" y=\"18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">people</text>\n    </g>\n\n    <!-- Planet -->\n    <g transform=\"translate(283, 60)\">\n      <rect x=\"-42\" y=\"-22\" width=\"84\" height=\"44\" rx=\"4\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <!-- 지구 아이콘 -->\n      <circle cx=\"0\" cy=\"-3\" r=\"7\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <path d=\"M -7 -3 Q 0 -6 7 -3\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n      <path d=\"M -7 -3 Q 0 0 7 -3\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n      <text x=\"0\" y=\"18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">planet</text>\n    </g>\n\n    <text x=\"170\" y=\"118\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">3P — economic · social · environmental</text>\n  </g>\n\n  <!-- 하단: 학생 세대 지지 -->\n  <g transform=\"translate(50, 185)\">\n    <text x=\"0\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" fill=\"#5e5e5e\">학생 세대 동조 :</text>\n    <!-- 70% 게이지 -->\n    <text x=\"120\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">70%</text>\n    <rect x=\"85\" y=\"6\" width=\"70\" height=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <rect x=\"85\" y=\"6\" width=\"49\" height=\"14\" fill=\"#1FA34A\"/>\n    <!-- 79% 게이지 -->\n    <text x=\"240\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">79%</text>\n    <rect x=\"205\" y=\"6\" width=\"70\" height=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <rect x=\"205\" y=\"6\" width=\"55\" height=\"14\" fill=\"#1FA34A\"/>\n    \n    <text x=\"170\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">future generations support broader corporate responsibility</text>\n  </g>\n</svg>","caption":"전통 잣대는 수익성 한 가지만 보지만, 부상하는 Triple Bottom Line은 profit·people·planet 세 축을 함께 본다 — 학생 세대 70%·79%가 동조.","tldr":["전통적으로 기업은 ‘수익(bottom line)’만 봤다.","오늘날엔 경제·사회·환경을 함께 보는 ‘Triple Bottom Line(3P)’를 말한다.","3P = 이익(profit)·사람(people)·지구(planet). 곧 기업의 사회적 책임이다."],"analogy":"성적표에 ‘점수’만 있는 게 아니라 ‘인성·봉사’도 들어가는 셈이에요. 기업도 이제 ‘돈’ 한 줄이 아니라 ‘돈·사람·지구’ 세 줄로 평가받습니다.","bg":"‘Triple Bottom Line(3P: profit·people·planet)’ — 기업이 이익만이 아니라 사회·환경 성과까지 고려해야 한다는 경영 개념. 기업의 사회적 책임(CSR)과 연결돼요.","flow":[{"kind":"전통","t":"bottom line = 수익만","d":"결정이 회사 수익성에 미치는 영향만 고려."},{"kind":"전환","t":"오늘날: Triple Bottom Line","cls":"pivot","d":"경제·사회·환경 성과를 함께."},{"kind":"3P","t":"이익 · 사람 · 지구"},{"kind":"의미","t":"기업의 사회적 책임(CSR)"},{"kind":"결론","t":"젊은 세대가 바라는 기업의 모습","cls":"close"}],"vocab":[["pay attention to","~에 주의를 기울이다"],["accountant","회계사·회계원"],["bottom line","최종 결산 결과·핵심 손익"],["profitability","수익성"],["triple","삼중의·세 배의"],["performance","성과·수행"]],"quiz":[["전통적 ‘bottom line’과 ‘triple bottom line’의 차이는?","전통적 bottom line은 ‘수익’만, triple bottom line은 경제·사회·환경(3P: 이익·사람·지구)을 함께 봐요."],["‘3P’가 가리키는 것은?","profit(이익)·people(사람)·planet(지구)이에요."],["핵심 한 문장?","기업은 이익뿐 아니라 사람·지구까지 함께 고려해야 한다."]],"en":"It is common for managers to make decisions while paying attention to what accountants call the \"bottom line\" ─ that is, considering how the decision will affect the profitability of the firm. But more and more today, we talk about the triple bottom line ─ a concept that focuses on a firm's economic, social, and environmental performance. Some call this triple bottom line the concern for the \"3 P's\" ─ profit, people, and planet. You might think of it more generally as acting with a sense of corporate social responsibility. And, by the way, that's most likely how you'd like your future employers to behave. \"Students nowadays want to work for companies that help enhance the quality of life in their surrounding community,\" says one observer. And in one survey, 70% of students report that \"a company's reputation and ethics\" was \"very important\" when deciding whether or not to accept a job offer; in another survey, 79% of 13-25 year olds say they \"want to work for a company that cares about how it affects or contributes to society.\"","ko":"관리자들이 회계사들이 'bottom line'이라 부르는 것에 유의하면서, 즉 결정이 회사 수익성에 어떻게 영향을 미칠지를 고려하면서 결정을 내리는 것은 흔한 일이다. 하지만 오늘날 우리는 점점 더 회사의 경제적·사회적·환경적 성과에 초점을 맞춘 개념인 triple bottom line에 관해 이야기한다. 어떤 사람들은 이 triple bottom line을 '3P' — 이익·사람·지구 — 에 대한 관심이라 부른다. 여러분은 그것을 더 일반적으로는 기업의 사회적 책임 의식을 갖고 행동하는 것으로 생각할 수도 있다. 그리고 그건 그렇고, 그것이 여러분이 미래의 고용주가 행동하길 바라는 방식일 가능성이 가장 높다. 한 관찰자는 \"요즘 학생들은 인근 지역사회의 삶의 질을 향상하는 데 기여하는 회사에서 일하길 원한다\"라고 말한다. 한 조사에서는 학생의 70%가 일자리 제안 수락 결정 시 \"회사의 평판과 윤리\"가 \"매우 중요\"했다고 답하고, 또 다른 조사에서는 13~25세의 79%가 \"사회에 어떻게 영향을 미치거나 기여하는지를 신경 쓰는 회사에서 일하길 원한다\"고 말한다.","read":[{"en":"It is common for managers to make decisions while paying attention to what accountants call the \"bottom line\" ─ that is, considering how the decision will affect the profitability of the firm.","ko":"관리자들이 회계사들이 'bottom line'이라 부르는 것에 유의하면서, 즉 결정이 회사 수익성에 어떻게 영향을 미칠지를 고려하면서 결정을 내리는 것은 흔한 일이다.","chunks":[["It is common for managers to make decisions while paying attention to what accountants call the \"bottom line\" ─ that is, considering how the decision will affect the profitability of the firm.","관리자들이 회계사들이 'bottom line'이라 부르는 것에 유의하면서, 즉 결정이 회사 수익성에 어떻게 영향을 미칠지를 고려하면서 결정을 내리는 것은 흔한 일이다."]]},{"en":"But more and more today, we talk about the triple bottom line ─ a concept that focuses on a firm's economic, social, and environmental performance.","ko":"하지만 오늘날 우리는 점점 더 회사의 경제적·사회적·환경적 성과에 초점을 맞춘 개념인 triple bottom line에 관해 이야기한다.","chunks":[["But more and more today, we talk about the triple bottom line ─ a concept that focuses on a firm's economic, social, and environmental performance.","하지만 오늘날 우리는 점점 더 회사의 경제적·사회적·환경적 성과에 초점을 맞춘 개념인 triple bottom line에 관해 이야기한다."]]},{"en":"Some call this triple bottom line the concern for the \"3 P's\" ─ profit, people, and planet.","ko":"어떤 사람들은 이 triple bottom line을 '3P' — 이익·사람·지구 — 에 대한 관심이라 부른다.","chunks":[["Some call this triple bottom line the concern for the \"3 P's\" ─ profit, people, and planet.","어떤 사람들은 이 triple bottom line을 '3P' — 이익·사람·지구 — 에 대한 관심이라 부른다."]]},{"en":"You might think of it more generally as acting with a sense of corporate social responsibility.","ko":"여러분은 그것을 더 일반적으로는 기업의 사회적 책임 의식을 갖고 행동하는 것으로 생각할 수도 있다.","chunks":[["You might think of it more generally as acting with a sense of corporate social responsibility.","여러분은 그것을 더 일반적으로는 기업의 사회적 책임 의식을 갖고 행동하는 것으로 생각할 수도 있다."]]},{"en":"And, by the way, that's most likely how you'd like your future employers to behave.","ko":"그리고 그건 그렇고, to Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">fall</text>\n\n    <!-- 아래쪽: 타락한 인간 -->\n    <g transform=\"translate(220, 175)\">\n      <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <!-- 표정 (찡그림) -->\n      <line x1=\"-3\" y1=\"-1\" x2=\"-1\" y2=\"1\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      <line x1=\"1\" y1=\"1\" x2=\"3\" y2=\"-1\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      <path d=\"M -2 3 Q 0 1 2 3\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      <!-- 몸 (구부정) -->\n      <path d=\"M 0 8 Q 3 16 6 22\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <line x1=\"3\" y1=\"14\" x2=\"-5\" y2=\"20\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <line x1=\"3\" y1=\"14\" x2=\"10\" y2=\"22\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <text x=\"3\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">fallen</text>\n    </g>\n  </g>\n\n  <!-- 가운데 vs -->\n  <text x=\"300\" y=\"115\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 우측: Risen Apes — 상향 -->\n  <g transform=\"translate(315, 25)\">\n    <text x=\"135\" y=\"-5\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">진화론적 관점 — \"Risen Apes\"</text>\n    <rect x=\"0\" y=\"10\" width=\"270\" height=\"190\" fill=\"#f0faf3\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 아래쪽: 원시 유인원 (시작점) -->\n    <g transform=\"translate(50, 175)\">\n      <!-- 구부정한 유인원 -->\n      <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-2\" cy=\"-1\" r=\"0.9\" fill=\"#1FA34A\"/>\n      <circle cx=\"2\" cy=\"-1\" r=\"0.9\" fill=\"#1FA34A\"/>\n      <!-- 몸 (구부정) -->\n      <path d=\"M 0 8 Q 4 16 8 22\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <!-- 팔 (구부정·길게) -->\n      <path d=\"M 2 13 Q -6 20 -10 26\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <path d=\"M 4 13 Q 12 20 14 26\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"2\" y=\"42\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">ape (primitive)</text>\n    </g>\n\n    <!-- 상향 화살표 (긴 곡선) -->\n    <path d=\"M 70 165 Q 130 130 200 95\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"200,95 195,103 207,98\" fill=\"#1FA34A\"/>\n    <text x=\"135\" y=\"125\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">rise</text>\n\n    <!-- 위쪽: 진화한 인간 -->\n    <g transform=\"translate(220, 50)\">\n      <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-2\" cy=\"-1\" r=\"0.9\" fill=\"#1FA34A\"/>\n      <circle cx=\"2\" cy=\"-1\" r=\"0.9\" fill=\"#1FA34A\"/>\n      <path d=\"M -3 3 Q 0 5 3 3\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n      <!-- 몸 (반듯) -->\n      <line x1=\"0\" y1=\"8\" x2=\"0\" y2=\"24\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <!-- 팔 (당당) -->\n      <line x1=\"0\" y1=\"14\" x2=\"-7\" y2=\"20\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"14\" x2=\"7\" y2=\"20\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">risen ape</text>\n    </g>\n  </g>\n</svg>","caption":"고대 관점: 시간이 흐를수록 완전함에서 타락(Fallen Angels · 하향). 진화론적 관점: 시간이 흐를수록 원시에서 진보(Risen Apes · 상향) — 미래 낙관에 근거를 준다.","tldr":["진화에서 ‘진보’를 보는 사람에겐 미래 낙관이 단순 희망이 아니다.","미래 예측의 출발점은 ‘과거’ — 과거 변화 양상에서 미래를 배운다.","Kurzweil은 정보 처리의 기하급수적 성장으로 미래를 예측한다."],"analogy":"지금까지 매년 키가 자란 아이라면 내년에도 클 거라 보는 게 합리적이죠. ‘진화적 낙관주의’도 과거의 진보 추세로 미래를 낙관하는 거예요.","bg":"‘진화적 낙관주의(evolutionary optimism)’ — 진화·역사의 장기적 진보 패턴을 근거로 미래를 낙관하는 시각. 미래학자 커즈와일의 ‘기하급수적 성장’ 예측이 사례예요.","flow":[{"kind":"관점","t":"진화 = ‘진보’로 본다"},{"kind":"주장","t":"미래 낙관은 단순 희망이 아니다","d":"증거가 장기적 진보를 보여줌."},{"kind":"근거","t":"미래 예측의 출발점 = 과거","d":"과거 변화 양상에서 미래를 배운다."},{"kind":"사례","t":"Kurzweil","d":"정보 처리의 기하급수적 성장으로 예측."},{"kind":"결론","t":"과거 진보 = 미래 낙관의 인지적 기반","d":"Desmond Morris의 말처럼 — 우리는 ‘타락한 천사’이길 선호할지 몰라도, 현실에선 ‘진화한 유인원’이다.","cls":"close"}],"vocab":[["perceive","인지하다·지각하다"],["optimistic","낙관적인·낙관주의의"],["wishful thinking","희망 사항(만의 생각)·바람대로의 사고"],["widespread","널리 퍼진·만연한"],["anticipate","예측하다·예상하다"],["departure","출발(점)·이탈"]],"quiz":[["‘진화적 낙관주의’의 근거는?","과거에 널리 퍼진 장기적 ‘진보’ 패턴 — 미래 예측의 출발점이 ‘과거’이기 때문이에요."],["Kurzweil의 예측은 무엇에 기반하나?","정보 처리의 역사적 ‘기하급수적 성장’에 대한 양적 평가에 기반해요."],["핵심 한 문장?","과거의 진보 패턴이 미래에 대한 낙관을 정당화한다."]],"en":"For those who perceive progress (in some manner or form) within evolution, an optimistic view of the future is not merely wishful thinking; the evidence seems to indicate widespread long-term progress in the past (perhaps the biggest trend in history). In predicting or anticipating the future, our major source of information and point of departure is the past; it is from the past and the patterns of change observed that we learn to anticipate the future. Kurzweil, a futurist, for one, clearly believes that based on his quantitative assessment of the historical exponential growth of information processing, he can reliably predict at least certain aspects of the future, which include increasing intelligence and information processing, in the shape of things to come. The progressive vision of evolution is the cognitive foundation and motivational inspiration behind \"evolutionary optimism,\" which diametrically opposes the ancient view that time is a fall from perfection; to reverse metaphors, time becomes a progression from the most primitive and primordial. As Desmond Morris, a zoologist, has noted, although we may prefer to think of ourselves as \"fallen angels,\" in reality, we are \"risen apes.\"","ko":"진화 내에서 (어떤 방식 또는 형태로든) 진보를 인지하는 사람들에게, 미래에 대한 낙관적 관점은 단순한 희망 사항이 아니며, 증거는 과거에 널리 퍼진 장기적 진보(아마도 역사상 가장 큰 흐름)를 보여 주는 듯하다. 미래를 예측·예상할 때 우리의 주요 정보원이자 출발점은 과거이며, 우리는 다름 아닌 과거와 관찰된 변화의 양상으로부터 미래를 예측하는 법을 배운다. 일례로, 미래학자 Kurzweil은 정보 처리의 역사적 기하급수적 성장에 대한 자신의 양적 평가를 기반으로, 지능과 정보 처리의 증가를 포함하는 최소한 미래의 특정 측면들을 다가올 미래의 형태로 믿을 만하게 예측할 수 있다고 분명히 확신한다. 진화에 대한 진보적 시각은 \"진화적 낙관주의\" 이면의 인지적 기반이자 동기적 영감이며, 이는 시간이 완전함에서의 타락이라는 고대 관점에 정면으로 맞선다 — 비유를 뒤집어 보면, 시간은 가장 원시적인 것에서의 진보가 된다. 동물학자 Desmond Morris가 언급했듯이, 우리는 스스로를 \"타락한 천사\"로 여기는 것을 선호할지도 모르지만, 현실에서 우리는 \"진화한 유인원\"이다.","read":[{"en":"For those who perceive progress (in some manner or form) within evolution, an optimistic view of the future is not merely wishful thinking; the evidence seems to indicate widespread long-term progress in the past (perhaps the biggest trend in history).","ko":"진화 내에서 (어떤 방식 또는 형태로든) 진보를 인지하는 사람들에게, 미래에 대한 낙관적 관점은 단순한 희망 사항이 아니며, 증거는 과거에 널리 퍼진 장기적 진보(아마도 역사상 가장 큰 흐름)를 보여 주는 듯하다.","chunks":[["For those who perceive progress (in some manner or form) within evolution, an optimistic view of the future is not merely wishful thinking; the evidence seems to indicate widespread long-term progress in the past (perhaps the biggest trend in history).","진화 내에서 (어떤 방식 또는 형태로든) 진보를 인지하는 사람들에게, 미래에 대한 낙관적 관점은 단순한 희망 사항이 아니며, 증거는 과거에 널리 퍼진 장기적 진보(아마도 역사상 가장 큰 흐름)를 보여 주는 듯하다."]]},{"en":"In predicting or anticipating the future, our major source of information and point of departure is the past; it is from the past and the patterns of change observed that we learn to anticipate the future.","ko":"미래를 예측·예상할 때 우리의 주요 정보원이자 출발점은 과거이며, 우리는 다름 아닌 과거와 관찰된 변화의 양상으로부터 미래를 예측하는 법을 배운다.","chunks":[["In predicting or anticipating the future, our major source of information and point of departure is the past; it is from the past and the patterns of change observed that we learn to anticipate the future.","미래를 예측·예상할 때 우리의 주요 정보원이자 출발점은 과거이며, 우리는 다름 아닌 과거와 관찰된 변화의 양상으로부터 미래를 예측하는 법을 배운다."]]},{"en":"Kurzweil, a futurist, for one, clearly believes that based on his quantitative assessment of the historical exponential growth of information processing, he can reliably predict at least certain aspects of the future, which include increasing intelligence and information processing, in the shape of things to come.","ko":"일례로, 미래학자 Kurzweil은 정보 처리의 역사적 기하급수적 성장에 대한 자신의 양적 평가를 기반으로, 지능과 정보 처리의 증가를 포함하는 최소한 미래의 특정 측면들을 다가올 미래의 형태로 믿을 만하게 예측할 수 있다고 분명히 확신한다.","chunks":[["Kurzweil, a futurist, for one, clearly believes that based on his quantitative assessment of the historical exponential growth of information processing, he can reliably predict at least certain aspects of the future, which include increasing intelligence and information processing, in the shape of things to come.","일례로, 미래학자 Kurzweil은 정보 처리의 역사적 기하급수적 성장에 대한 자신의 양적 평가를 기반으로, 지능과 정보 처리의 증가를 포함하는 최소한 미래의 특정 측면들을 다가올 미래의 형태로 믿을 만하게 예측할 수 있다고 분명히 확신한다."]]},{"en":"The progressive vision of evolution is the cognitive foundation and motivational inspiration behind \"evolutionary optimism,\" which diametrically opposes the ancient view that time is a fall from perfection; to reverse metaphors, time becomes a progression from the most primitive and primordial.","ko":"진화에 대한 진보적 시각은 \"진화적 낙관주의\" 이면의 인지적 기반이자 동기적 영감이며, 이는 시간이 완전함에서의 타락이라는 고대 관점에 정면으로 맞선다 — 비유를 뒤집어 보면, 시간은 가장 원시적인 것에서의 진보가 된다.","chunks":[["The progressive vision of evolution is the cognitive foundation and motivational inspiration behind \"evolutionary optimism,\" which diametrically opposes the ancient view that time is a fall from perfection; to reverse metaphors, time becomes a progression from the most primitive and primordial.","진화에 대한 진보적 시각은 \"진화적 낙관주의\" 이면의 인지적 기반이자 동기적 영감이며, 이는 시간이 완전함에서의 타락이라는 고대 관점에 정면으로 맞선다 — 비유를 뒤집어 보면, 시간은 가장 원시적인 것에서의 진보가 된다."]]},{"en":"As Desmond Morris, a zoologist, has noted, although we may prefer to think of ourselves as \"fallen angels,\" in reality, we are \"risen apes.\"","ko":"동물학자 Desmond Morris가 언급했듯이, 우리는 스스로를 \"타락한 천사\"로 여기는 것을 선호할지도 모르지만, 현실에서 우리는 \"진화한 유인원\"이다.","chunks":[["As Desmond Morris, a zoologist, has noted, although we may prefer to think of ourselves as \"fallen angels,\" in reality, we are \"risen apes.\"","동물학자 Desmond Morris가 언급했듯이, 우리는 스스로를 \"타락한 천사\"로 여기는 것을 선호할지도 모르지만, 현실에서 우리는 \"진화한 유인원\"이다."]]}]}]};

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">배경지식 30초</span>
      <span class="thint">— 이 글이 어떤 글이냐</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout bg">${d.bg}</p></div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 작동 원리</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 영어독해연습 09강 10지문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 영어독해연습 09강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body>
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 영어독해연습 09강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 영어독해연습 09강 10개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */

g transform=\"translate(130, 90)\">\n      <path d=\"M 0 -10 L 3 -3 L 10 -3 L 4 2 L 6 9 L 0 5 L -6 9 L -4 2 L -10 -3 L -3 -3 Z\" \n            fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n    </g>\n    <text x=\"130\" y=\"175\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">superior results</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">→ open innovation · reduces transaction costs</text>\n</svg>", "caption": "고립된 한 사람의 아이디어는 실행되지 못한 ‘죽은 글자’에 머물지만, 자신을 외부에 열고 타인의 아이디어와 결합할 때 더 나은 결과가 나오며, 이것이 열린 혁신의 토대가 된다.", "tldr": ["고립된 'one-man show'에서는 아이디어가 실행되지 못한 'dead letters'에 머물 수 있다.", "자신을 외부 아이디어에 열고 타인의 생각과 결합할 때 더 나은 결과가 나오며, 이것이 open conversation과 open innovation의 핵심이다.", "열린 대화 문화는 더 우수한 결과를 만들고 거래 비용을 줄이는 토대가 된다."], "bg": "분야는 사회·창의예요. 고립된 ‘1인 쇼(one-man show)’와 자신을 외부에 개방해 타인의 아이디어와 결합하는 방식이 대비됩니다. → 아이디어가 어떻게 ‘죽은 글자’를 넘어 실현되는지에 주목하며 읽으세요.", "flow": [{"kind": "폐쇄", "t": "one-man show: 고립된 한 사람의 아이디어는 실행되지 못하고 dead letters로 남을 수 있음"}, {"kind": "전환", "t": "open oneself to outside ideas: 외부 아이디어와 대화를 받아들임"}, {"kind": "결합", "t": "자신의 아이디어 + 타인의 아이디어 → 더 나은 결과"}, {"kind": "확장", "t": "open conversation이 superior results를 만들고 open innovation의 토대가 됨"}, {"kind": "결론", "t": "열린 대화 문화는 아이디어를 현실화하고 거래 비용도 줄인다", "cls": "close"}], "vocab": [["★imagination", "상상력"], ["deliberate", "의도적인·고의의"], ["◇dead letter", "사문(死文)·죽은 글자 (효력 없는 것)"], ["realm", "영역·왕국"], ["★ideation", "아이디어 실현·관념 형성 (작동하는 아이디어)"], ["◇in isolation", "홀로·고립되어"], ["converse", "대화하다"], ["⊕non-confrontationalnon‑ + confront + ‑ation + ‑al", "대립적이지 않은"], ["agenda", "의제·안건"], ["◇come into play", "작동하게 되다·영향을 미치기 시작하다"], ["★transaction cost", "거래 비용"]], "quiz": [["이 지문의 핵심 구조는?", "방화벽 안의 한 사람 ↔ 대화하는 세 사람의 아이디어 결합"], ["도식이 강조하는 결론은?", "고립된 'one-man show'에선 아이디어가 '죽은 글자'에 그치지만, 자신을 외부에 개방해 타인의 아이디어와 결합하면 우월한 결과가 나온다 — 이 열린 대화 문화가 곧 열린 혁신으로, 거래 비용을 줄인다."]], "en": "Imagination gives life to ideas by drawing from the well of received education and on the basis of experience to date. In the absence of deliberate actions, ideas end up as dead letters and, as Steve Jobs said, result in regrets. Turned into actions with a useful purpose, ideas leave the realm of fantasy. This process of ideation (ideas in action) can be started and completed in isolation ─ the 'one-man show', the solo agent surrounded by firewalls ─ or by opening ourselves to external contexts and realities, an approach that allows for superior results by combining in different ways our own ideas with those of others. An open culture of conversing enables a way of thinking that allows participants to have their say on equal terms, in a non-confrontational, non-status, friendly manner. All participants set their own agenda based on their passion. Thus, new knowledge is created from questions that arise during these conversations ─ a process that invariably leads to surprising learning and outcomes. It is here that open innovation comes into play, as a culture so effective that it reduces transaction costs caused in the ideation process.", "ko": "상상력은 받은 교육이라는 샘으로부터 이끌어 냄으로 그리고 지금까지의 경험을 바탕으로 아이디어에 생명을 불어넣는다. 의도적인 행동이 없으면, 아이디어는 결국 죽은 글자에 불과하게 되고 스티브 잡스가 말했듯이 후회를 초래한다. 유용한 목적을 가진 행동으로 전환되면, 아이디어는 공상의 영역을 벗어난다. 이러한 아이디어 실현 (작동을 하는 아이디어) 과정은 '원맨쇼', 즉 방화벽에 둘러싸인 단독 행위자로 홀로 시작하고 완성할 수도 있고, 또는 외부 상황과 현실에 자신을 개방함으로써, 즉 우리 자신의 아이디어와 다른 사람의 아이디어를 다양한 방식으로 결합하여 더 나은 결과를 고려하는 접근 방식으로 시작하고 완성할 수도 있다. 개방적인 대화 문화는 참여자가 동등한 조건으로, 대립적이지 않고 지위와 상관없이 우호적인 방식으로 자신의 의견을 말할 수 있게 하는 사고방식을 가능하게 한다. 모든 참여자는 자신의 열정을 바탕으로 자기 자신의 의제를 설정한다. 따라서 이러한 대화를 하는 중에 발생하는 질문에서 새로운 지식이 창출되는데, 이는 늘 놀라운 학습과 성과를 낳는 과정이다. 바로 여기에서, 매우 효과적이어서 아이디어 실현 과정에서 발생되는 거래 비용을 줄이는 문화로서, 열린 혁신이 작동하게 된다.", "read": [{"en": "Imagination gives life to ideas by drawing from the well of received education and on the basis of experience to date.", "ko": "상상력은 받은 교육이라는 샘으로부터 이끌어 냄으로 그리고 지금까지의 경험을 바탕으로 아이디어에 생명을 불어넣는다.", "chunks": [["Imagination gives life to ideas", "상상력은 아이디어에 생명을 불어넣는다"], ["by drawing from the well of received education", "받은 교육이라는 샘에서 이끌어 냄으로써"], ["and on the basis of experience to date.", "그리고 지금까지의 경험을 바탕으로."]]}, {"en": "In the absence of deliberate actions, ideas end up as dead letters and, as Steve Jobs said, result in regrets.", "ko": "의도적인 행동이 없으면, 아이디어는 결국 죽은 글자에 불과하게 되고 스티브 잡스가 말했듯이 후회를 초래한다.", "chunks": [["In the absence of deliberate actions,", "의도적인 행동이 없으면,"], ["ideas end up as dead letters", "아이디어는 결국 죽은 글자가 되고"], ["and, as Steve Jobs said,", "그리고, 스티브 잡스가 말했듯이,"], ["result in regrets.", "후회를 초래한다."]]}, {"en": "Turned into actions with a useful purpose, ideas leave the realm of fantasy.", "ko": "유용한 목적을 가진 행동으로 전환되면, 아이디어는 공상의 영역을 벗어난다.", "chunks": [["Turned into actions with a useful purpose,", "유용한 목적을 가진 행동으로 전환되면,"], ["ideas leave the realm of fantasy.", "아이디어는 공상의 영역을 벗어난다."]]}, {"en": "This process of ideation (ideas in action) can be started and completed in isolation ─ the 'one-man show', the solo agent surrounded by firewalls ─ or by opening ourselves to external contexts and realities, an approach that allows for superior results by combining in different ways our own ideas with those of others.", "ko": "이러한 아이디어 실현 (작동을 하는 아이디어) 과정은 '원맨쇼', 즉 방화벽에 둘러싸인 단독 행위자로 홀로 시작하고 완성할 수도 있고, 또는 외부 상황과 현실에 자신을 개방함으로써, 즉 우리 자신의 아이디어와 다른 사람의 아이디어를 다양한 방식으로 결합하여 더 나은 결과를 고려하는 접근 방식으로 시작하고 완성할 수도 있다.", "chunks": [["This process of ideation (ideas in action)", "이 아이디어 실현 (작동하는 아이디어) 과정은"], ["can be started and completed in isolation", "홀로 시작되고 완성될 수 있다"], ["─ the 'one-man show', the solo agent surrounded by firewalls ─", "즉 '원맨쇼', 방화벽에 둘러싸인 단독 행위자로"], ["or by opening ourselves to external contexts and realities,", "또는 외부 상황과 현실에 자신을 개방함으로써,"], ["an approach that allows for superior results", "더 나은 결과를 가능하게 하는 접근 방식인데"], ["by combining in different ways our own ideas with those of others.", "우리 자신의 아이디어를 다른 사람의 것과 다양한 방식으로 결합함으로써."]]}, {"en": "An open culture of conversing enables a way of thinking that allows participants to have their say on equal terms, in a non-confrontational, non-status, friendly manner.", "ko": "개방적인 대화 문화는 참여자가 동등한 조건으로, 대립적이지 않고 지위와 상관없이 우호적인 방식으로 자신의 의견을 말할 수 있게 하는 사고방식을 가능하게 한다.", "chunks": [["An open culture of conversing", "개방적인 대화 문화는"], ["enables a way of thinking", "사고방식을 가능하게 한다"], ["that allows participants to have their say", "참여자가 자신의 의견을 말할 수 있게 하는"], ["on equal terms,", "동등한 조건으로,"], ["in a non-confrontational, non-status, friendly manner.", "대립적이지 않고 지위와 상관없이 우호적인 방식으로."]]}, {"en": "All participants set their own agenda based on their passion.", "ko": "모든 참여자는 자신의 열정을 바탕으로 자기 자신의 의제를 설정한다.", "chunks": [["All participants set their own agenda", "모든 참여자는 자신의 의제를 설정한다"], ["based on their passion.", "자신의 열정을 바탕으로."]]}, {"en": "Thus, new knowledge is created from questions that arise during these conversations ─ a process that invariably leads to surprising learning and outcomes.", "ko": "따라서 이러한 대화를 하는 중에 발생하는 질문에서 새로운 지식이 창출되는데, 이는 늘 놀라운 학습과 성과를 낳는 과정이다.", "chunks": [["Thus, new knowledge is created", "따라서 새로운 지식이 창출된다"], ["from questions that arise during these conversations", "이러한 대화 중에 발생하는 질문에서"], ["─ a process that invariably leads to surprising learning and outcomes.", "즉 늘 놀라운 학습과 성과로 이어지는 과정이다."]]}, {"en": "It is here that open innovation comes into play, as a culture so effective that it reduces transaction costs caused in the ideation process.", "ko": "바로 여기에서, 매우 효과적이어서 아이디어 실현 과정에서 발생되는 거래 비용을 줄이는 문화로서, 열린 혁신이 작동하게 된다.", "chunks": [["It is here that open innovation comes into play,", "바로 여기에서 열린 혁신이 작동하게 되는데,"], ["as a culture so effective", "매우 효과적인 문화로서"], ["that it reduces transaction costs", "그래서 그것이 거래 비용을 줄인다"], ["caused in the ideation process.", "아이디어 실현 과정에서 발생되는."]]}]}, {"no": "2", "title": "Variability in Dolphin Society and Female Reproductive Success", "ktitle": "돌고래 사회의 '변동성' — 집단생활과 어미의 나이·경험이 암컷의 번식 성공을 높인다", "field": "생물·사회", "page": "09강 no.02", "oneline": "돌고래 사회의 핵심 특징은 높은 변동성이며, 암컷의 번식 성공은 ① 더 크고 안정적인 집단생활과 ② 어미의 나이·경험이라는 두 요인에 의해 향상된다.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 큰 안정적 돌고래 집단과 오른쪽 경험 많은 어미와 새끼라는 두 요인이 화살표로 모여 아래쪽 번식 성공 ↑로 이어지는 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">두 요인 → 암컷 번식 성공 ↑</text>\n  <text x=\"300\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">in a society of high variability</text>\n\n  <!-- 좌측: 요인 ① 집단생활 -->\n  <g transform=\"translate(20, 50)\">\n    <text x=\"125\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">① 더 크고 안정적인 집단</text>\n    <rect x=\"0\" y=\"6\" width=\"250\" height=\"120\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 돌고래 무리 (4-5마리) -->\n    <g transform=\"translate(35, 50)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"20\" ry=\"8\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <path d=\"M 18 -2 L 24 -7 L 22 0 Z\" fill=\"#1FA34A\"/>\n      <path d=\"M -15 0 L -22 -4 L -22 4 Z\" fill=\"#1FA34A\"/>\n      <circle cx=\"14\" cy=\"-2\" r=\"0.8\" fill=\"#1a1a1a\"/>\n      <path d=\"M -5 -7 L -2 -10 L 1 -7\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n    </g>\n    <g transform=\"translate(85, 35)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"18\" ry=\"7\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <path d=\"M 16 -2 L 22 -6 L 20 0 Z\" fill=\"#1FA34A\"/>\n      <path d=\"M -14 0 L -20 -3 L -20 3 Z\" fill=\"#1FA34A\"/>\n      <circle cx=\"13\" cy=\"-2\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <path d=\"M -5 -6 L -2 -9 L 1 -6\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n    </g>\n    <g transform=\"transla ont-weight=\"700\">proximity · control of environment</text>\n  </g>\n\n  <!-- 두 요인 → 결과 화살표 -->\n  <line x1=\"145\" y1=\"180\" x2=\"240\" y2=\"220\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n  <polygon points=\"240,220 233,214 232,222\" fill=\"#1FA34A\"/>\n  <line x1=\"455\" y1=\"180\" x2=\"360\" y2=\"220\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n  <polygon points=\"360,220 367,214 368,222\" fill=\"#1FA34A\"/>\n\n  <!-- 하단: 번식 성공 ↑ -->\n  <g transform=\"translate(180, 215)\">\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"36\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <text x=\"120\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">female reproductive success</text>\n    <text x=\"120\" y=\"30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">↑ ↑</text>\n  </g>\n</svg>", "caption": "① 큰 집단 + ② 경험 많은 어미 → 번식 성공 ↑", "tldr": ["돌고래 사회의 핵심 특징은 높은 변동성이며, 암컷의 번식 성공은 ① 더 크고 안정적인 집단생활과 ② 어미의 나이·경험이라는 두 요인에 의해 향상된다.", "① 큰 집단 + ② 경험 많은 어미 → 번식 성공 ↑"], "bg": "분야는 생물·사회예요. 돌고래 사회의 핵심 특징인 ‘높은 변동성(variability)’과 암컷 번식 성공의 두 요인이 핵심. → 무엇이 암컷의 번식 성공을 좌우하는지에 주목하며 읽으세요.", "flow": [{"kind": "핵심", "t": "돌고래 사회의 핵심 특징은 높은 변동성이며, 암컷의 번식 성공은 ① 더 크고 안정적인 집단생활과 ② 어미의 나이·경험이라는 두 요인에 의해 향상된다."}, {"kind": "읽기 방향", "t": "① 큰 집단 + ② 경험 많은 어미 → 번식 성공 ↑"}, {"kind": "정리", "t": "분야는 생물·사회예요. 돌고래 사회의 핵심 특징인 ‘높은 변동성(variability)’과 암컷 번식 성공의 두 요인이 핵심. → 무엇이 암컷의 번식 성공을 좌우하는지에 주목하며 읽으세요.", "cls": "close"}], "vocab": [["★hallmark", "전형적 특징·징표"], ["★variability", "변동성·가변성"], ["◇social fabric", "사회 구조·사회적 조직"], ["calf", "(돌고래·소 등의) 새끼"], ["rear", "기르다·양육하다"], ["★reproductive success", "번식 성공"], ["predation", "포식·포식 작용"], ["⊕allomaternal careallo‑(다른) + maternal(어미의)", "대리 양육 (어미가 아닌 개체의 돌봄)"], ["primiparous", "초산의 (처음 출산한)"], ["synchrony", "동시성·동조"], ["associate", "동료 (here)"]], "quiz": [["이 지문의 핵심 구조는?", "① 큰 집단 + ② 경험 많은 어미 → 번식 성공 ↑"], ["도식이 강조하는 결론은?", "돌고래 사회의 핵심 특징은 높은 변동성이며, 암컷의 번식 성공은 ① 더 크고 안정적인 집단생활과 ② 어미의 나이·경험이라는 두 요인에 의해 향상된다."]], "en": "One of the hallmarks of dolphin society is a high degree of variability. This variability both enriches the social fabric and complicates the researcher's desire for simple, absolute descriptions. Not all females can be clearly identified as belonging to a band on the basis of our current criteria. Females employ a variety of approaches to calf rearing, ranging from those who attempt to rear them alone to those who rear them with band members in nursery groups of various and changeable sizes. Overall, females rearing calves in larger, more stable groups enjoy significantly greater reproductive success than do others. Thus, female reproductive success seems to be enhanced by group living, likely through improved protection of calves from predation and other threats and calf exposure to other individuals for socialization, learning, and possibly allomaternal care. Likewise, reproductive success increases with mother's age and maternal experience. In an examination of the behavioral differences between primiparous and experienced mothers, it was shown that experienced mothers tended to maintain greater synchrony with and closer distances to their calves, thereby providing increased control over their calves' environment. Experienced mothers also tended to include other mothers with calves as close associates.", "ko": "돌고래 사회의 특징 중 하나는 높은 수준의 변동성이다. 이러한 변동성은 사회 구조를 풍부하게 하기도 하지만, 동시에 단순하고 확실한 설명을 하고자 하는 연구자의 욕구를 복잡하게 하기도 한다. 현재 우리의 기준에 근거해서는 모든 암컷이 어느 한 무리에 속한다고 명확히 식별할 수는 없다. 암컷은 새끼 양육에 다양한 방식을 사용하는데, 그 범위가 혼자서 새끼를 기르려고 시도하는 암컷부터 다양하고 변동 가능한 규모의 보육 집단에서 무리의 구성원들과 함께 새끼를 기르는 암컷에 이르기까지 다양하다. 전반적으로, 더 크고 더 안정적인 집단에서 새끼를 기르는 암컷은 다른 암컷보다 상당히 더 높은 번식 성공을 누린다. 따라서 암컷의 번식 성공은 집단생활에 의해 향상되는 것으로 보이는데, 이는 아마도 포식 및 기타 위협으로부터 새끼가 더 잘 보호받고 사회화, 학습, 그리고 어쩌면 대리 양육을 위해 새끼가 다른 개체들과 접하기 때문일 것이다. 마찬가지로, 어미의 나이와 모성 경험이 많을수록 번식의 성공은 증가한다. 초산을 한 어미와 경험 많은 어미 사이의 행동 차이에 대한 조사에서, 경험 많은 어미는 새끼와 더 큰 동시성과 더 가까운 거리를 유지하고, 그리하여 새끼의 환경을 더 많이 통제하는 경향이 있는 것으로 나타났다. 또한 경험 많은 어미는 새끼와 함께 있는 다른 어미를 가까운 동료로 포함하는 경향이 있었다.", "read": [{"en": "One of the hallmarks of dolphin society is a high degree of variability.", "ko": "돌고래 사회의 특징 중 하나는 높은 수준의 변동성이다.", "chunks": [["One of the hallmarks of dolphin society", "돌고래 사회의 특징 중 하나는"], ["is a high degree of variability.", "높은 수준의 변동성이다."]]}, {"en": "This variability both enriches the social fabric and complicates the researcher's desire for simple, absolute descriptions.", "ko": "이러한 변동성은 사회 구조를 풍부하게 하기도 하지만, 동시에 단순하고 확실한 설명을 하고자 하는 연구자의 욕구를 복잡하게 하기도 한다.", "chunks": [["This variability", "이 변동성은"], ["both enriches the social fabric", "사회 구조를 풍부하게 하기도 하고"], ["and complicates the researcher's desire", "연구자의 욕구를 복잡하게 하기도 한다"], ["for simple, absolute descriptions.", "단순하고 확실한 설명에 대한."]]}, {"en": "Not all females can be clearly identified as belonging to a band on the basis of our current criteria.", "ko": "현재 우리의 기준에 근거해서는 모든 암컷이 어느 한 무리에 속한다고 명확히 식별할 수는 없다.", "chunks": [["Not all females can be clearly identified", "모든 암컷이 명확히 식별될 수 있는 것은 아니다"], ["as belonging to a band", "한 무리에 속한다고"], ["on the basis of our current criteria.", "현재 우리의 기준에 근거해서는."]]}, {"en": "Females employ a variety of approaches to calf rearing, ranging from those who attempt to rear them alone to those who rear them with band members in nursery groups of various and changeable sizes.", "ko": "암컷은 새끼 양육에 다양한 방식을 사용하는데, 그 범위가 혼자서 새끼를 기르려고 시도하는 암컷부터 다양하고 변동 가능한 규모의 보육 집단에서 무리의 구성원들과 함께 새끼를 기르는 암컷에 이르기까지 다양하다.", "chunks": [["Females employ a variety of approaches to calf rearing,", "암컷은 새끼 양육에 다양한 방식을 사용하는데,"], ["ranging from those who attempt to rear them alone", "혼자서 새끼를 기르려 시도하는 암컷부터"], ["to those who rear them with band members", "무리 구성원들과 함께 새끼를 기르는 암컷에 이르기까지"], ["in nursery groups of various and changeable sizes.", "다양하고 변동 가능한 규모의 보육 집단에서."]]}, {"en": "Overall, females rearing calves in larger, more stable groups enjoy significantly greater reproductive success than do others.", "ko": "전반적으로, 더 크고 더 안정적인 집단에서 새끼를 기르는 암컷은 다른 암컷보다 상당히 더 높은 번식 성공을 누린다.", "chunks": [["Overall, females rearing calves", "전반적으로, 새끼를 기르는 암컷은"], ["in larger, more stable groups", "더 크고 더 안정적인 집단에서"], ["enjoy significantly greater reproductive success", "상당히 더 높은 번식 성공을 누린다"], ["than do others.", "다른 암컷보다."]]}, {"en": "Thus, female reproductive success seems to be enhanced by group living, likely through improved protection of calves from predation and other threats and calf exposure to other individuals for socialization, learning, and possibly allomaternal care.", "ko": "따라서 암컷의 번식 성공은 집단생활에 의해 향상되는 것으로 보이는데, 이는 아마도 포식 및 기타 위협으로부터 새끼가 더 잘 보호받고 사회화, 학습, 그리고 어쩌면 대리 양육을 위해 새끼가 다른 개체들과 접하기 때문일 것이다.", "chunks": [["Thus, female reproductive success seems to be enhanced by group living,", "따라서 암컷의 번식 성공은 집단생활에 의해 향상되는 듯하다,"], ["likely through improved protection of calves", "아마도 새끼의 더 나은 보호를 통해"], ["from predation and other threats", "포식 및 기타 위협으로부터"], ["and calf exposure to other individuals", "그리고 새끼가 다른 개체들과 접하는 것을 통해"], ["for socialization, learning, and possibly allomaternal care.", "사회화, 학습, 그리고 어쩌면 대리 양육을 위한."]]}, {"en": "Likewise, reproductive success increases with mother's age and maternal experience.", "ko": "마찬가지로, 어미의 나이와 모성 경험이 많을수록 번식의 성공은 증가한다.", "chunks": [["Likewise, reproductive success increases", "마찬가지로, 번식 성공은 증가한다"], ["with mother's age and maternal experience.", "어미의 나이와 모성 경험과 함께."]]}, {"en": "In an examination of the behavioral differences between primiparous and experienced mothers, it was shown that experienced mothers tended to maintain greater synchrony with and closer distances to their calves, thereby providing increased control over their calves' environment.", "ko": "초산을 한 어미와 경험 많은 어미 사이의 행동 차이에 대한 조사에서, 경험 많은 어미는 새끼와 더 큰 동시성과 더 가까운 거리를 유지하고, 그리하여 새끼의 환경을 더 많이 통제하는 경향이 있는 것으로 나타났다.", "chunks": [["In an examination of the behavioral differences", "행동 차이에 대한 조사에서"], ["between primiparous and experienced mothers,", "초산 어미와 경험 많은 어미 사이의,"], ["it was shown that experienced mothers tended to maintain", "경험 많은 어미가 유지하는 경향이 있는 것으로 나타났다"], ["greater synchrony with and closer distances to their calves,", "새끼와 더 큰 동시성과 더 가까운 거리를,"], ["thereby providing increased control over their calves' environment.", "그리하여 새끼의 환경에 대한 더 큰 통제를 제공하면서."]]}, {"en": "Experienced mothers also tended to include other mothers with calves as close associates.", "ko": "또한 경험 많은 어미는 새끼와 함께 있는 다른 어미를 가까운 동료로 포함하는 경향이 있었다.", "chunks": [["Experienced mothers also tended to include", "경험 많은 어미는 또한 포함하는 경향이 있었다"], ["other mothers with calves", "새끼와 함께 있는 다른 어미를"], ["as close associates.", "가까운 동료로."]]}]}, {"no": "3", "title": "Babies as Little Scientists: Testing the Social World", "ktitle": "아기는 어른의 '이상한 행동'에 표현적·과장된 제스처로 반응하며 적극적으로 '심리 실험'을 한다", "field": "발달·심리", "page": "09강 no.03", "oneline": "아기는 단지 보고 배우는 데 그치지 않고, 어른의 특이한 행동(정지 얼굴·역모방)에 표현적·과장된 제스처로 반응하며 어른의 반응을 끌어내 'figure out'하려는 능동적 심리 실험을 한다.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"좌측에 무표정한 엄마 얼굴을 향해 아기가 표현적 제스처로 반응하는 정지 얼굴 실험과, 우측에 아기를 흉내내는 어른과 그것을 과장된 동작으로 시험하는 아기의 역모방 실험이 두 박스로 대조되고 하단에 'figure out' 공통 결론이 놓인 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">아기 = 능동적 심리 실험가</text>\n  <text x=\"300\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">testing the social world</text>\n\n  <!-- 좌측: 실험 ① 정지 얼굴 -->\n  <g transform=\"translate(20, 50)\">\n    <text x=\"115\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">실험 ① still-face</text>\n    <rect x=\"0\" y=\"6\" width=\"230\" height=\"150\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 엄마 (정지 얼굴 - 무표정) -->\n    <g transform= dth=\"1\"/>\n      <line x1=\"-30\" y1=\"-8\" x2=\"-32\" y2=\"-12\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      <line x1=\"24\" y1=\"-12\" x2=\"26\" y2=\"-18\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      <line x1=\"30\" y1=\"-8\" x2=\"32\" y2=\"-12\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    </g>\n\n    <text x=\"115\" y=\"143\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">expressive gestures · \"what's wrong?\"</text>\n  </g>\n\n  <!-- 우측: 실험 ② 역모방 -->\n  <g transform=\"translate(350, 50)\">\n    <text x=\"115\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">실험 ② reverse imitation</text>\n    <rect x=\"0\" y=\"6\" width=\"230\" height=\"150\" fill=\"#f0faf3\" fill-opacity=\"0.25\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n\n    <!-- 어른 (아기 흉내) -->\n    <g transform=\"translate(55, 70)\">\n      <circle cx=\"0\" cy=\"0\" r=\"22\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 흉내내는 표정 (눈을 크게 뜸) -->\n      <circle cx=\"-7\" cy=\"-3\" r=\"2.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <circle cx=\"-7\" cy=\"-3\" r=\"1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"7\" cy=\"-3\" r=\"2.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <circle cx=\"7\" cy=\"-3\" r=\"1\" fill=\"#1a1a1a\"/>\n      <!-- 동그란 입 (놀란 흉내) -->\n      <circle cx=\"0\" cy=\"9\" r=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">adult mimics</text>\n    </g>\n\n    <!-- 화살표 (양방향: 어른 ↔ 아기) -->\n    <line x1=\"85\" y1=\"65\" x2=\"135\" y2=\"65\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <polygon points=\"135,65 128,61 128,69\" fill=\"#1FA34A\"/>\n    <line x1=\"135\" y1=\"75\" x2=\"85\" y2=\"75\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <polygon points=\"85,75 92,71 92,79\" fill=\"#1FA34A\"/>\n\n    <!-- 아기 + 과장된 동작 -->\n    <g transform=\"translate(175, 70)\">\n      <circle cx=\"0\" cy=\"-15\" r=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-16\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"-16\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <!-- 미소 — 활발 -->\n      <path d=\"M -5 -10 Q 0 -7 5 -10\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 몸 -->\n      <ellipse cx=\"0\" cy=\"6\" rx=\"11\" ry=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 과장된 팔 (위로 크게) -->\n      <line x1=\"-9\" y1=\"0\" x2=\"-22\" y2=\"-10\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <line x1=\"9\" y1=\"0\" x2=\"22\" y2=\"-10\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <!-- 동작 라인 (큰 motion lines) -->\n      <path d=\"M -26 -14 Q -30 -16 -32 -22\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <path d=\"M -22 -16 Q -26 -22 -28 -28\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <path d=\"M 26 -14 Q 30 -16 32 -22\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <path d=\"M 22 -16 Q 26 -22 28 -28\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n    </g>\n\n    <text x=\"115\" y=\"143\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">exaggerated motions · \"do they really copy?\"</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(170, 215)\">\n    <rect x=\"0\" y=\"0\" width=\"260\" height=\"36\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n    <text x=\"130\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">공통 — 반응을 끌어내 'figure out'</text>\n    <text x=\"130\" y=\"30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">get a reaction → active experiment</text>\n  </g>\n</svg>", "caption": "정지 얼굴 → expressive gestures · 역모방 → exaggerated motions → 공통: figure out", "tldr": ["아기는 단지 보고 배우는 데 그치지 않고, 어른의 특이한 행동(정지 얼굴·역모방)에 표현적·과장된 제스처로 반응하며 어른의 반응을 끌어내 'figure out'하려는 능동적 심리 실험을 한다.", "정지 얼굴 → expressive gestures · 역모방 → exaggerated motions → 공통: figure out"], "bg": "분야는 발달심리예요. 아기가 단지 보고 배우는 게 아니라 어른의 특이 행동에 반응하며 ‘검증한다’는 것이 핵심(꼬마 과학자). → 아기가 어떻게 가설을 시험하는지에 주목하며 읽으세요.", "flow": [{"kind": "핵심", "t": "아기는 단지 보고 배우는 데 그치지 않고, 어른의 특이한 행동(정지 얼굴·역모방)에 표현적·과장된 제스처로 반응하며 어른의 반응을 끌어내 'figure out'하려는 능동적 심리 실험을 한다."}, {"kind": "읽기 방향", "t": "정지 얼굴 → expressive gestures · 역모방 → exaggerated motions → 공통: figure out"}, {"kind": "정리", "t": "분야는 발달심리예요. 아기가 단지 보고 배우는 게 아니라 어른의 특이 행동에 반응하며 ‘검증한다’는 것이 핵심(꼬마 과학자). → 아기가 어떻게 가설을 시험하는지에 주목하며 읽으세요.", "cls": "close"}], "vocab": [["perform", "수행하다·하다"], ["adopt", "(자세·태도를) 취하다·채택하다"], ["impassive", "감정이 없는·무표정한"], ["perturbed", "불안해하는·동요된"], ["★expressive", "표현력이 풍부한"], ["★imitate", "모방하다·흉내 내다"], ["peculiar", "특이한·기이한"], ["⊕exaggeratedexaggerate + ‑ed", "과장된"], ["intrigued", "강한 흥미를 느끼는"], ["◇figure out", "알아내다·이해하다"]], "quiz": [["이 지문의 핵심 구조는?", "정지 얼굴 → expressive gestures · 역모방 → exaggerated motions → 공통: figure out"], ["도식이 강조하는 결론은?", "아기는 단지 보고 배우는 데 그치지 않고, 어른의 특이한 행동(정지 얼굴·역모방)에 표현적·과장된 제스처로 반응하며 어른의 반응을 끌어내 'figure out'하려는 능동적 심리 실험을 한다."]], "en": "Children learn from the patterns they see, but they also perform psychological experiments to explore the inner as well as the outer world. For example, Ed Tronick got nine-month-olds to watch their mothers suddenly adopt a perfectly still pose ─ a kind of impassive, iron face. As you might expect, the babies were perturbed by this, and often even started crying. But they would also produce a large number of unusual and expressive gestures, as if they were trying somehow to test what was wrong. In another study, instead of having a baby imitate an adult, the adult imitated the baby, mimicking everything that the baby did. Faced with this extremely peculiar behavior, one-year-olds performed a different kind of experiment. They produced odd exaggerated gestures as if they were testing whether the experimenter really would imitate those actions too. They would wiggle a hand in some particularly strange way to see if the adult would do the same. The babies were as intrigued by the mimicry as they were by the stone face and, in each case, they tried to get a reaction from the adult that would help them figure out what was going on.", "ko": "아이들은 그들이 보는 패턴을 통해 배우기도 하지만, 또한 외부 세계뿐만 아니라 내면 세계를 탐구하기 위해 심리 실험을 수행하기도 한다. 예를 들어, Ed Tronick은 9개월 된 아기들에게 엄마가 갑자기 완벽하게 가만히 있는 자세, 즉 일종의 감정이 없는 굳은 얼굴을 취하는 것을 지켜보게 했다. 예상할 수도 있듯이, 아기들은 이에 불안해 했으며, 심지어 울기 시작하는 경우도 흔했다. 하지만 아기들은 또한 무엇이 잘못되었는지 어떻게든 시험해 보려는 듯, 특이하고 표현력이 풍부한 제스처를 많이 취하곤 했다. 또 다른 연구에서는, 아기가 어른을 모방하게 하는 대신 어른이 아기를 모방하여 아기가 하는 모든 것을 흉내 냈다. 이 매우 특이한 행동에 직면하여, 한 살짜리 아기들은 다른 종류의 실험을 수행했다. 그들은 실험자가 그러한 행동도 실제로 모방할지를 시험하고 있는 듯이 이상하고 과장된 제스처를 취했다. 그들은 어른도 똑같이 할 것인지 확인하기 위해 어떤 특히 이상한 방식으로 손을 흔들곤 했다. 아기들은 무표정한 얼굴에 그랬던 만큼이나 흉내에 강한 흥미를 가졌고, 각각의 경우에 무슨 일이 일어나고 있는지 알아내는 데 도움이 될 반응을 어른으로부터 얻으려고 애썼다.", "read": [{"en": "Children learn from the patterns they see, but they also perform psychological experiments to explore the inner as well as the outer world.", "ko": "아이들은 그들이 보는 패턴을 통해 배우기도 하지만, 또한 외부 세계뿐만 아니라 내면 세계를 탐구하기 위해 심리 실험을 수행하기도 한다.", "chunks": [["Children learn from the patterns they see,", "아이들은 자신이 보는 패턴으로부터 배우지만,"], ["but they also perform psychological experiments", "그들은 또한 심리 실험을 수행한다"], ["to explore the inner as well as the outer world.", "외부 세계뿐만 아니라 내면 세계를 탐구하기 위해."]]}, {"en": "For example, Ed Tronick got nine-month-olds to watch their mothers suddenly adopt a perfectly still pose ─ a kind of impassive, iron face.", "ko": "예를 들어, Ed Tronick은 9개월 된 아기들에게 엄마가 갑자기 완벽하게 가만히 있는 자세, 즉 일종의 감정이 없는 굳은 얼굴을 취하는 것을 지켜보게 했다.", "chunks": [["For example, Ed Tronick got nine-month-olds", "예를 들어, Ed Tronick은 9개월 된 아기들에게 ~하게 했다"], ["to watch their mothers suddenly adopt a perfectly still pose", "엄마가 갑자기 완벽하게 가만히 있는 자세를 취하는 것을 보도록"], ["─ a kind of impassive, iron face.", "즉 일종의 감정 없는 굳은 얼굴을."]]}, {"en": "As you might expect, the babies were perturbed by this, and often even started crying.", "ko": "예상할 수도 있듯이, 아기들은 이에 불안해 했으며, 심지어 울기 시작하는 경우도 흔했다.", "chunks": [["As you might expect,", "예상할 수 있듯이,"], ["the babies were perturbed by this,", "아기들은 이에 불안해했고,"], ["and often even started crying.", "심지어 울기 시작하는 경우도 흔했다."]]}, {"en": "But they would also produce a large number of unusual and expressive gestures, as if they were trying somehow to test what was wrong.", "ko": "하지만 아기들은 또한 무엇이 잘못되었는지 어떻게든 시험해 보려는 듯, 특이하고 표현력이 풍부한 제스처를 많이 취하곤 했다.", "chunks": [["But they would also produce", "하지만 그들은 또한 만들어내곤 했다"], ["a large number of unusual and expressive gestures,", "특이하고 표현력이 풍부한 제스처를 많이,"], ["as if they were trying somehow", "마치 어떻게든 ~하려는 듯이"], ["to test what was wrong.", "무엇이 잘못되었는지 시험해 보려고."]]}, {"en": "In another study, instead of having a baby imitate an adult, the adult imitated the baby, mimicking everything that the baby did.", "ko": "또 다른 연구에서는, 아기가 어른을 모방하게 하는 대신 어른이 아기를 모방하여 아기가 하는 모든 것을 흉내 냈다.", "chunks": [["In another study,", "또 다른 연구에서는,"], ["instead of having a baby imitate an adult,", "아기가 어른을 모방하게 하는 대신,"], ["the adult imitated the baby,", "어른이 아기를 모방했다,"], ["mimicking everything that the baby did.", "아기가 하는 모든 것을 흉내 내면서."]]}, {"en": "Faced with this extremely peculiar behavior, one-year-olds performed a different kind of experiment.", "ko": "이 매우 특이한 행동에 직면하여, 한 살짜리 아기들은 다른 종류의 실험을 수행했다.", "chunks": [["Faced with this extremely peculiar behavior,", "이 매우 특이한 행동에 직면하여,"], ["one-year-olds performed a different kind of experiment.", "한 살짜리 아기들은 다른 종류의 실험을 수행했다."]]}, {"en": "They produced odd exaggerated gestures as if they were testing whether the experimenter really would imitate those actions too.", "ko": "그들은 실험자가 그러한 행동도 실제로 모방할지를 시험하고 있는 듯이 이상하고 과장된 제스처를 취했다.", "chunks": [["They produced odd exaggerated gestures", "그들은 이상하고 과장된 제스처를 취했다"], ["as if they were testing", "마치 시험하고 있는 듯이"], ["whether the experimenter really would imitate those actions too.", "실험자가 그런 행동도 정말 모방할지를."]]}, {"en": "They would wiggle a hand in some particularly strange way to see if the adult would do the same.", "ko": "그들은 어른도 똑같이 할 것인지 확인하기 위해 어떤 특히 이상한 방식으로 손을 흔들곤 했다.", "chunks": [["They would wiggle a hand", "그들은 손을 흔들곤 했다"], ["in some particularly strange way", "특히 이상한 어떤 방식으로"], ["to see if the adult would do the same.", "어른이 똑같이 할지 확인하기 위해."]]}, {"en": "The babies were as intrigued by the mimicry as they were by the stone face and, in each case, they tried to get a reaction from the adult that would help them figure out what was going on.", "ko": "아기들은 무표정한 얼굴에 그랬던 만큼이나 흉내에 강한 흥미를 가졌고, 각각의 경우에 무슨 일이 일어나고 있는지 알아내는 데 도움이 될 반응을 어른으로부터 얻으려고 애썼다.", "chunks": [["The babies were as intrigued by the mimicry", "아기들은 흉내에 그만큼 강한 흥미를 느꼈다"], ["as they were by the stone face", "무표정한 얼굴에 그랬던 만큼이나"], ["and, in each case, they tried to get a reaction from the adult", "그리고 각 경우에 어른으로부터 반응을 얻으려 했다"], ["that would help them figure out what was going on.", "무슨 일이 일어나는지 알아내는 데 도움이 될."]]}]}, {"no": "4", "title": "Rival vs. Non-rival Resources and the Paradox of Pricing", "ktitle": "비경쟁적 자원은 '0의 가격'에서 가치가 극대화되지만, 그 가격에서는 시장이 공급하지 않는다 — 가격의 역설", "field": "경제·자원", "page": "09강 no.04", "oneline": "비경쟁적(non-rival) 자원은 함께 써도 줄지 않아 가격을 매기면 비효율적이며, 그 사회적 가치는 가격 0에서 극대화되지만 — 바로 그 가격에서는 시장이 공급하지 않는 역설이 발생한다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 한 사람이 파이를 먹으면 남이 못 먹는 경쟁적 자원과 가로등 아래 여러 사람이 함께 쓰는 비경쟁적 자원의 대조, 하단에 가격 0에서 가치 극대화 영역과 시장이 공급하는 가격 영역이 서로 어긋나는 가격의 역설 그림\">\n  <!-- 상단: 정의 대조 -->\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">rival vs non-rival — 그리고 가격의 역설</text>\n\n  <!-- 좌상: rival -->\n  <g transform=\"transl 105,38 115,38\" fill=\"#c8102e\"/>\n      <text x=\"110\" y=\"62\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">시장 공급만 가능</text>\n      <text x=\"110\" y=\"74\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">artificial scarcity</text>\n    </g>\n  </g>\n</svg>", "caption": "rival = 줄어듦 · non-rival = 안 줄어듦 → 그러나 가치 극대 영역과 시장 공급 영역은 어긋남", "tldr": ["비경쟁적(non-rival) 자원은 함께 써도 줄지 않아 가격을 매기면 비효율적이며, 그 사회적 가치는 가격 0에서 극대화되지만 — 바로 그 가격에서는 시장이 공급하지 않는 역설이 발생한다.", "rival = 줄어듦 · non-rival = 안 줄어듦 → 그러나 가치 극대 영역과 시장 공급 영역은 어긋남"], "bg": "분야는 경제·자원이에요. 핵심 대비 — 함께 써도 줄지 않는 ‘비경쟁적(non-rival)’ 자원과 경쟁적 자원. → 비경쟁 자원에 가격을 매기는 게 왜 비효율적인지에 주목하며 읽으세요.", "flow": [{"kind": "핵심", "t": "비경쟁적(non-rival) 자원은 함께 써도 줄지 않아 가격을 매기면 비효율적이며, 그 사회적 가치는 가격 0에서 극대화되지만 — 바로 그 가격에서는 시장이 공급하지 않는 역설이 발생한다."}, {"kind": "읽기 방향", "t": "rival = 줄어듦 · non-rival = 안 줄어듦 → 그러나 가치 극대 영역과 시장 공급 영역은 어긋남"}, {"kind": "정리", "t": "분야는 경제·자원이에요. 핵심 대비 — 함께 써도 줄지 않는 ‘비경쟁적(non-rival)’ 자원과 경쟁적 자원. → 비경쟁 자원에 가격을 매기는 게 왜 비효율적인지에 주목하며 읽으세요.", "cls": "close"}], "vocab": [["★scarce", "희소한·부족한"], ["★rival", "경쟁적인 (한 사람이 쓰면 남이 못 쓰는)"], ["★non-rivalnon‑ + rival", "비경쟁적인 (함께 써도 줄지 않는)"], ["inadequate", "불충분한·부족한"], ["★rationing", "배급·할당"], ["inefficient", "비효율적인"], ["patent", "특허를 받다"], ["⊕excludableexclude + ‑able", "배제 가능한 (대가 없이는 못 쓰게 하는)"], ["substitution", "대체·대용"], ["★artificial", "인위적인·인공의"], ["⊕paradoxicallyparadox + ‑ical + ‑ly", "역설적이게도"]], "quiz": [["이 지문의 핵심 구조는?", "rival = 줄어듦 · non-rival = 안 줄어듦 → 그러나 가치 극대 영역과 시장 공급 영역은 어긋남"], ["도식이 강조하는 결론은?", "비경쟁적(non-rival) 자원은 함께 써도 줄지 않아 가격을 매기면 비효율적이며, 그 사회적 가치는 가격 0에서 극대화되지만 — 바로 그 가격에서는 시장이 공급하지 않는 역설이 발생한다."]], "en": "All scarce resources are rival, meaning that use by one person leaves less of the resource (in quality or quantity) for others to use. Many resources, however, are non-rival, which means that use by one person does not leave less for others to use. When this is true, there is no competition for use and the resource is not scarce in an economic sense, even if total supply is inadequate. Examples include streetlights, many different ecosystem services, and information. Price rationing in this case reduces use and hence value to society without affecting quantity, which is inefficient. For example, if someone develops a cheap, clean solar energy technology and then patents it (which makes it excludable), it can be sold at a price. A positive price will reduce use, leading to less substitution away from competing energy sources, such as coal, and society as a whole suffers. Markets will only provide non-rival resources if they are made excludable and can be sold at a price, but this creates artificial scarcity. Paradoxically, the value of non-rival resources to society is maximized at a price of zero, but at that price, markets will not provide it.", "ko": "모든 '희소' 자원은 '경쟁적'인데, 이는 한 사람이 사용하면 다른 사람이 사용할 수 있는 자원이 (질적으로나 양적으로) 줄어들게 된다는 것을 의미한다. 그러나 많은 자원은 비경쟁적 자원인데, 이는 한 사람이 사용한다고 해서 다른 사람이 사용할 수 있는 양이 줄어들지 않는다는 것을 의미한다. 이것이 사실일 때, 사용을 위한 경쟁이 없고, 총공급량이 불충분하더라도 경제적 의미에서 그 자원은 희소하지 않다. 예로는 가로등, 많은 다양한 생태계 서비스, 정보가 있다. 이 경우 가격 배급은 양에 영향을 주지 않으면서도 사용을 줄이고 따라서 사회에 대한 가치를 감소시키는데, 이는 비효율적이다. 예를 들어, 누군가가 값싸고 깨끗한 태양 에너지 기술을 개발한 후 그것에 대한 특허를 획득하면(이로 인해 그것은 배제성이 있게 됨), 그것은 상당한 가격에 판매될 수 있다. 양의 가격은 사용을 줄여, 석탄과 같은 경쟁 에너지원으로부터 벗어나려는 대체가 줄어들게 될 것이어서 사회 전체가 손해를 본다. 비경쟁적 자원은 배제적이 되고 상당한 가격에 판매될 수 있는 경우에만 시장에서 공급이 될 것이지만, 이는 인위적인 희소성을 만들어 낸다. 역설적이게도, 사회에 대한 비경쟁적 자원의 가치는 0의 가격에서 극대화되지만, 그 가격에서는 시장이 그것을 공급하지 않을 것이다.", "read": [{"en": "All scarce resources are rival, meaning that use by one person leaves less of the resource (in quality or quantity) for others to use.", "ko": "모든 '희소' 자원은 '경쟁적'인데, 이는 한 사람이 사용하면 다른 사람이 사용할 수 있는 자원이 (질적으로나 양적으로) 줄어들게 된다는 것을 의미한다.", "chunks": [["All scarce resources are rival,", "모든 희소 자원은 경쟁적이다,"], ["meaning that use by one person", "한 사람의 사용이 ~을 의미한다"], ["leaves less of the resource (in quality or quantity)", "그 자원을 (질적·양적으로) 더 적게 남긴다는 것을"], ["for others to use.", "다른 사람이 쓸."]]}, {"en": "Many resources, however, are non-rival, which means that use by one person does not leave less for others to use.", "ko": "그러나 많은 자원은 비경쟁적 자원인데, 이는 한 사람이 사용한다고 해서 다른 사람이 사용할 수 있는 양이 줄어들지 않는다는 것을 의미한다.", "chunks": [["Many resources, however, are non-rival,", "그러나 많은 자원은 비경쟁적이다,"], ["which means that use by one person", "이는 한 사람의 사용이 ~을 의미한다"], ["does not leave less for others to use.", "다른 사람이 쓸 몫을 더 적게 남기지 않는다는 것을."]]}, {"en": "When this is true, there is no competition for use and the resource is not scarce in an economic sense, even if total supply is inadequate.", "ko": "이것이 사실일 때, 사용을 위한 경쟁이 없고, 총공급량이 불충분하더라도 경제적 의미에서 그 자원은 희소하지 않다.", "chunks": [["When this is true,", "이것이 사실일 때,"], ["there is no competition for use", "사용을 위한 경쟁이 없고"], ["and the resource is not scarce in an economic sense,", "그 자원은 경제적 의미에서 희소하지 않다,"], ["even if total supply is inadequate.", "총공급량이 불충분하더라도."]]}, {"en": "Examples include streetlights, many different ecosystem services, and information.", "ko": "예로는 가로등, 많은 다양한 생태계 서비스, 정보가 있다.", "chunks": [["Examples include", "예로는 ~이 있다"], ["streetlights, many different ecosystem services, and information.", "가로등, 다양한 생태계 서비스, 그리고 정보가."]]}, {"en": "Price rationing in this case reduces use and hence value to society without affecting quantity, which is inefficient.", "ko": "이 경우 가격 배급은 양에 영향을 주지 않으면서도 사용을 줄이고 따라서 사회에 대한 가치를 감소시키는데, 이는 비효율적이다.", "chunks": [["Price rationing in this case", "이 경우 가격 배급은"], ["reduces use and hence value to society", "사용을, 따라서 사회에 대한 가치를 줄인다"], ["without affecting quantity,", "양에 영향을 주지 않으면서,"], ["which is inefficient.", "이는 비효율적이다."]]}, {"en": "For example, if someone develops a cheap, clean solar energy technology and then patents it (which makes it excludable), it can be sold at a price.", "ko": "예를 들어, 누군가가 값싸고 깨끗한 태양 에너지 기술을 개발한 후 그것에 대한 특허를 획득하면(이로 인해 그것은 배제성이 있게 됨), 그것은 상당한 가격에 판매될 수 있다.", "chunks": [["For example, if someone develops", "예를 들어, 누군가가 개발하고"], ["a cheap, clean solar energy technology", "값싸고 깨끗한 태양 에너지 기술을"], ["and then patents it (which makes it excludable),", "그 후 특허를 받으면 (이로 인해 배제 가능해짐),"], ["it can be sold at a price.", "그것은 (상당한) 가격에 판매될 수 있다."]]}, {"en": "A positive price will reduce use, leading to less substitution away from competing energy sources, such as coal, and society as a whole suffers.", "ko": "양의 가격은 사용을 줄여, 석탄과 같은 경쟁 에너지원으로부터 벗어나려는 대체가 줄어들게 될 것이어서 사회 전체가 손해를 본다.", "chunks": [["A positive price will reduce use,", "양(陽)의 가격은 사용을 줄일 것이고,"], ["leading to less substitution", "더 적은 대체로 이어진다"], ["away from competing energy sources, such as coal,", "석탄 같은 경쟁 에너지원에서 벗어나는,"], ["and society as a whole suffers.", "그래서 사회 전체가 손해를 본다."]]}, {"en": "Markets will only provide non-rival resources if they are made excludable and can be sold at a price, but this creates artificial scarcity.", "ko": "비경쟁적 자원은 배제적이 되고 상당한 가격에 판매될 수 있는 경우에만 시장에서 공급이 될 것이지만, 이는 인위적인 희소성을 만들어 낸다.", "chunks": [["Markets will only provide non-rival resources", "시장은 비경쟁적 자원을 공급할 뿐이다"], ["if they are made excludable and can be sold at a price,", "그것이 배제 가능해지고 (상당한) 가격에 팔릴 수 있는 경우에만,"], ["but this creates artificial scarcity.", "하지만 이는 인위적인 희소성을 만든다."]]}, {"en": "Paradoxically, the value of non-rival resources to society is maximized at a price of zero, but at that price, markets will not provide it.", "ko": "역설적이게도, 사회에 대한 비경쟁적 자원의 가치는 0의 가격에서 극대화되지만, 그 가격에서는 시장이 그것을 공급하지 않을 것이다.", "chunks": [["Paradoxically,", "역설적이게도,"], ["the value of non-rival resources to society", "사회에 대한 비경쟁적 자원의 가치는"], ["is maximized at a price of zero,", "0의 가격에서 극대화되지만,"], ["but at that price, markets will not provide it.", "그 가격에서는 시장이 그것을 공급하지 않을 것이다."]]}]}, {"no": "5", "title": "Resilience: From Ancient Survival to Modern Complexity", "ktitle": "회복 탄력성은 생존에 필수적이며, 고대의 '명백한 위험'에서 현대의 '더 복잡한 필요'로 그 양상이 바뀌었다", "field": "심리·적응", "page": "09강 no.05", "oneline": "회복 탄력성은 개인·종의 생존에 필수적이며, 고대에는 맹수 같은 명백한 위험에 맞서는 것이었지만, 현대 </text>\n    </g>\n\n    <!-- 가운데에서 4 needs로 연결선 (점선) -->\n    <line x1=\"120\" y1=\"95\" x2=\"60\" y2=\"58\" stroke=\"#1FA34A\" stroke-width=\"1\" stroke-dasharray=\"2 2\" opacity=\"0.7\"/>\n    <line x1=\"150\" y1=\"95\" x2=\"210\" y2=\"58\" stroke=\"#1FA34A\" stroke-width=\"1\" stroke-dasharray=\"2 2\" opacity=\"0.7\"/>\n    <line x1=\"120\" y1=\"125\" x2=\"60\" y2=\"138\" stroke=\"#1FA34A\" stroke-width=\"1\" stroke-dasharray=\"2 2\" opacity=\"0.7\"/>\n    <line x1=\"150\" y1=\"125\" x2=\"210\" y2=\"138\" stroke=\"#1FA34A\" stroke-width=\"1\" stroke-dasharray=\"2 2\" opacity=\"0.7\"/>\n\n    <text x=\"135\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">complex needs · invisible challenges</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">essence: keep your nerve · same need for resilience</text>\n</svg>", "caption": "고대 = 단순·가시 위험(맹수) ↔ 현대 = 복합·비가시 요구(돈·건강·잠재력·유대)", "tldr": ["회복 탄력성은 개인·종의 생존에 필수적이며, 고대에는 맹수 같은 명백한 위험에 맞서는 것이었지만, 현대에는 돈·건강·잠재력·사회적 유대라는 더 복잡한 필요를 충족하는 형태로 바뀌었다.", "고대 = 단순·가시 위험(맹수) ↔ 현대 = 복합·비가시 요구(돈·건강·잠재력·유대)"], "bg": "분야는 심리·적응이에요. 핵심어는 ‘회복 탄력성(resilience)’ — 고대의 명백한 위험 대응에서 현대의 다양한 도전으로 의미가 넓어졌다는 것. → 회복 탄력성이 왜 필수인지에 주목하며 읽으세요.", "flow": [{"kind": "핵심", "t": "회복 탄력성은 개인·종의 생존에 필수적이며, 고대에는 맹수 같은 명백한 위험에 맞서는 것이었지만, 현대에는 돈·건강·잠재력·사회적 유대라는 더 복잡한 필요를 충족하는 형태로 바뀌었다."}, {"kind": "읽기 방향", "t": "고대 = 단순·가시 위험(맹수) ↔ 현대 = 복합·비가시 요구(돈·건강·잠재력·유대)"}, {"kind": "정리", "t": "분야는 심리·적응이에요. 핵심어는 ‘회복 탄력성(resilience)’ — 고대의 명백한 위험 대응에서 현대의 다양한 도전으로 의미가 넓어졌다는 것. → 회복 탄력성이 왜 필수인지에 주목하며 읽으세요.", "cls": "close"}], "vocab": [["★resilience", "회복 탄력성·회복력"], ["◇keep one's nerve", "침착함을 유지하다"], ["primitive", "원초적인·원시의"], ["⊕inevitabilityin‑ + evitable + ‑ity", "불가피함·필연성"], ["◇fend off", "막아 내다·물리치다"], ["overt", "명백한·공공연한"], ["maul", "(짐승이) 상처를 입히다·할퀴다"], ["predator", "포식자"], ["flee", "달아나다·도망치다"], ["◇fulfil one's potential", "잠재력을 발휘하다"], ["lifespan", "수명"]], "quiz": [["이 지문의 핵심 구조는?", "고대 = 단순·가시 위험(맹수) ↔ 현대 = 복합·비가시 요구(돈·건강·잠재력·유대)"], ["도식이 강조하는 결론은?", "회복 탄력성은 개인·종의 생존에 필수적이며, 고대에는 맹수 같은 명백한 위험에 맞서는 것이었지만, 현대에는 돈·건강·잠재력·사회적 유대라는 더 복잡한 필요를 충족하는 형태로 바뀌었다."]], "en": "Resilience is when the unexpected happens but we keep our nerve and handle whatever challenge is resting in our lap. Resilience is necessary for our physical survival, for our mental and physical well-being, for our ability to realise our potential, and for the successful achievement of our life goals. At a basic, primitive level, our primary goal as humans is physical survival; the avoidance of death for as long as possible despite its inevitability. Resilience is vital for our survival, both as individual human beings and as a species. In ancient times, resilience would have been required to fend off much more overt dangers like being mauled to death by an animal whilst out hunting for food. Imagine if, in those times when survival was the order of the day, a man stood frozen with fear upon seeing a predator appear in front of him. Regardless of whether that man was expecting to encounter such a threat during that hunting trip, he would need to keep his nerve and either fight the animal or flee from it. Those would be the only survival options available to him. Without a can-do attitude and quick problem-solving followed by quick action, that man would be dead. In the modern day we are still fighting for our survival but now our needs are more complicated, even though they still ultimately serve to keep us alive. Modern survival means having enough money for fuel, clothing and shelter; thoughtfully looking after our bodies well enough to prevent life-threatening illness; fulfilling our potential in order to easily maintain emotional well-being which, in addition to making life worth living, directly and indirectly affects our ability to achieve our basic survival needs for fuel, clothing and shelter; and creating a family or social network to keep us feeling valued and, as research suggests, enabling a longer lifespan.", "ko": "회복 탄력성이란 예상치 못한 일이 일어나더라도 침착함을 유지하며 우리 앞에 놓인 어떤 어려움이든 처리해 내는 것이다. 회복 탄력성은 우리의 신체적 생존, 정신적ㆍ신체적 건강, 잠재력을 실현하는 능력, 인생 목표의 성공적 달성을 위해 필수적이다. 기본적이고 원초적인 수준에서, 인간으로서 우리의 주요한 목표는 신체적 생존, 즉 죽음이 불가피하더라도 가능한 한 오랫동안 죽음을 피하는 것이다. 회복 탄력성은 인간 개개인으로서 그리고 하나의 종으로서 모두, 생존을 위해 매우 중요하다. 고대에는, 먹을 것을 구하러 사냥을 나갔다가 동물에게 상처를 입어 죽는 것과 같이 훨씬 더 명백한 위험을 막아 내기 위해 회복 탄력성이 필요했을 것이다. 생존이 가장 중요한 과제였던 그 시절에 한 남자가 자기 앞에 포식자가 나타나는 것을 보자마자 두려움에 얼어붙어서 있었다고 상상해 보라. 그 사냥 여행을 하는 동안 그러한 위협에 부닥칠 것을 예상하고 있었는지의 여부와 관계없이, 그 남자는 침착함을 유지하며 그 동물과 싸우거나 그것으로부터 도망쳐야 할 것이다. 그것이 그가 선택할 수 있는 유일한 생존의 선택지일 것이다. 할 수 있다는 태도와 빠른 문제 해결에 이은 빠른 행동이 없다면, 그 남자는 죽을 것이다. 현대에도 우리는 생존을 위해 여전히 싸우고 있지만, 그것이 여전히 결국 우리를 계속 살아 있게 하는 데 도움이 된다 하더라도 우리의 필요는 이제 더 복잡해졌다. 현대의 생존이란 연료, 의복, 주거에 필요한 충분한 돈을 가지고 있고, 생명을 위협하는 질병을 예방할 수 있을 만큼 충분히 사려 깊게 우리 몸을 잘 돌보고, 삶을 살 가치가 있게 만들 뿐만 아니라 직간접적으로 연료, 의복, 주거에 대한 기본적인 생존 필요를 충족하는 우리의 능력에 영향을 미치는 정서적 행복을 쉽게 유지하기 위해 잠재력을 발휘하고, 가족 또는 사회적 네트워크를 만들어 우리가 소중하다고 계속 느끼게 하여, 연구에서 시사하는 바와 같이, 수명을 연장할 수 있게 하는 것을 뜻한다.", "read": [{"en": "Resilience is when the unexpected happens but we keep our nerve and handle whatever challenge is resting in our lap.", "ko": "회복 탄력성이란 예상치 못한 일이 일어나더라도 침착함을 유지하며 우리 앞에 놓인 어떤 어려움이든 처리해 내는 것이다.", "chunks": [["Resilience is when the unexpected happens", "회복 탄력성이란 예상치 못한 일이 일어나도"], ["but we keep our nerve", "하지만 우리가 침착함을 유지하며"], ["and handle whatever challenge is resting in our lap.", "우리 앞에 놓인 어떤 어려움이든 처리하는 것이다."]]}, {"en": "Resilience is necessary for our physical survival, for our mental and physical well-being, for our ability to realise our potential, and for the successful achievement of our life goals.", "ko": "회복 탄력성은 우리의 신체적 생존, 정신적ㆍ신체적 건강, 잠재력을 실현하는 능력, 인생 목표의 성공적 달성을 위해 필수적이다.", "chunks": [["Resilience is necessary for our physical survival,", "회복 탄력성은 우리의 신체적 생존,"], ["for our mental and physical well-being,", "정신적·신체적 건강,"], ["for our ability to realise our potential,", "잠재력을 실현하는 능력,"], ["and for the successful achievement of our life goals.", "그리고 인생 목표의 성공적 달성을 위해 필수적이다."]]}, {"en": "At a basic, primitive level, our primary goal as humans is physical survival; the avoidance of death for as long as possible despite its inevitability.", "ko": "기본적이고 원초적인 수준에서, 인간으로서 우리의 주요한 목표는 신체적 생존, 즉 죽음이 불가피하더라도 가능한 한 오랫동안 죽음을 피하는 것이다.", "chunks": [["At a basic, primitive level,", "기본적이고 원초적인 수준에서,"], ["our primary goal as humans is physical survival;", "인간으로서 우리의 주요 목표는 신체적 생존이다;"], ["the avoidance of death for as long as possible", "가능한 한 오랫동안 죽음을 피하는 것"], ["despite its inevitability.", "그것의 불가피함에도 불구하고."]]}, {"en": "Resilience is vital for our survival, both as individual human beings and as a species.", "ko": "회복 탄력성은 인간 개개인으로서 그리고 하나의 종으로서 모두, 생존을 위해 매우 중요하다.", "chunks": [["Resilience is vital for our survival,", "회복 탄력성은 우리의 생존에 필수적이다,"], ["both as individual human beings and as a species.", "개개의 인간으로서, 또 하나의 종으로서 모두."]]}, {"en": "In ancient times, resilience would have been required to fend off much more overt dangers like being mauled to death by an animal whilst out hunting for food.", "ko": "고대에는, 먹을 것을 구하러 사냥을 나갔다가 동물에게 상처를 입어 죽는 것과 같이 훨씬 더 명백한 위험을 막아 내기 위해 회복 탄력성이 필요했을 것이다.", "chunks": [["In ancient times,", "고대에는,"], ["resilience would have been required", "회복 탄력성이 필요했을 것이다"], ["to fend off much more overt dangers", "훨씬 더 명백한 위험을 막아 내기 위해"], ["like being mauled to death by an animal", "동물에게 물려 죽는 것과 같은"], ["whilst out hunting for food.", "먹을 것을 구하러 사냥을 나갔다가."]]}, {"en": "Imagine if, in those times when survival was the order of the day, a man stood frozen with fear upon seeing a predator appear in front of him.", "ko": "생존이 가장 중요한 과제였던 그 시절에 한 남자가 자기 앞에 포식자가 나타나는 것을 보자마자 두려움에 얼어붙어서 있었다고 상상해 보라.", "chunks": [["Imagine if,", "상상해 보라,"], ["in those times when survival was the order of the day,", "생존이 가장 중요한 과제였던 그 시절에,"], ["a man stood frozen with fear", "한 남자가 두려움에 얼어붙어 서 있었다고"], ["upon seeing a predator appear in front of him.", "포식자가 자기 앞에 나타나는 것을 보자마자."]]}, {"en": "Regardless of whether that man was expecting to encounter such a threat during that hunting trip, he would need to keep his nerve and either fight the animal or flee from it.", "ko": "그 사냥 여행을 하는 동안 그러한 위협에 부닥칠 것을 예상하고 있었는지의 여부와 관계없이, 그 남자는 침착함을 유지하며 그 동물과 싸우거나 그것으로부터 도망쳐야 할 것이다.", "chunks": [["Regardless of whether that man was expecting", "그 남자가 예상하고 있었는지와 관계없이"], ["to encounter such a threat during that hunting trip,", "그 사냥 여행 중 그런 위협에 부닥칠 것을,"], ["he would need to keep his nerve", "그는 침착함을 유지해야 할 것이다"], ["and either fight the animal or flee from it.", "그리고 그 동물과 싸우거나 그것으로부터 도망쳐야."]]}, {"en": "Those would be the only survival options available to him.", "ko": "그것이 그가 선택할 수 있는 유일한 생존의 선택지일 것이다.", "chunks": [["Those would be the only survival options", "그것이 유일한 생존 선택지일 것이다"], ["available to him.", "그에게 가능한."]]}, {"en": "Without a can-do attitude and quick problem-solving followed by quick action, that man would be dead.", "ko": "할 수 있다는 태도와 빠른 문제 해결에 이은 빠른 행동이 없다면, 그 남자는 죽을 것이다.", "chunks": [["Without a can-do attitude and quick problem-solving", "할 수 있다는 태도와 빠른 문제 해결이 없다면"], ["followed by quick action,", "그에 이은 빠른 행동이,"], ["that man would be dead.", "그 남자는 죽을 것이다."]]}, {"en": "In the modern day we are still fighting for our survival but now our needs are more complicated, even though they still ultimately serve to keep us alive.", "ko": "현대에도 우리는 생존을 위해 여전히 싸우고 있지만, 그것이 여전히 결국 우리를 계속 살아 있게 하는 데 도움이 된다 하더라도 우리의 필요는 이제 더 복잡해졌다.", "chunks": [["In the modern day we are still fighting for our survival", "현대에도 우리는 여전히 생존을 위해 싸우고 있지만"], ["but now our needs are more complicated,", "이제 우리의 필요는 더 복잡하다,"], ["even though they still ultimately serve", "그것들이 여전히 결국 도움이 되더라도"], ["to keep us alive.", "우리를 계속 살아 있게 하는 데."]]}, {"en": "Modern survival means having enough money for fuel, clothing and shelter; thoughtfully looking after our bodies well enough to prevent life-threatening illness; fulfilling our potential in order to easily maintain emotional well-being which, in addition to making life worth living, directly and indirectly affects our ability to achieve our basic survival needs for fuel, clothing and shelter; and creating a family or social network to keep us feeling valued and, as research suggests, enabling a longer lifespan.", "ko": "현대의 생존이란 연료, 의복, 주거에 필요한 충분한 돈을 가지고 있고, 생명을 위협하는 질병을 예방할 수 있을 만큼 충분히 사려 깊게 우리 몸을 잘 돌보고, 삶을 살 가치가 있게 만들 뿐만 아니라 직간접적으로 연료, 의복, 주거에 대한 기본적인 생존 필요를 충족하는 우리의 능력에 영향을 미치는 정서적 행복을 쉽게 유지하기 위해 잠재력을 발휘하고, 가족 또는 사회적 네트워크를 만들어 우리가 소중하다고 계속 느끼게 하여, 연구에서 시사하는 바와 같이, 수명을 연장할 수 있게 하는 것을 뜻한다.", "chunks": [["Modern survival means having enough money for fuel, clothing and shelter;", "현대의 생존은 연료·의복·주거에 충분한 돈을 갖는 것을 뜻한다;"], ["thoughtfully looking after our bodies well enough to prevent life-threatening illness;", "생명을 위협하는 질병을 막을 만큼 충분히 몸을 잘 돌보는 것;"], ["fulfilling our potential in order to easily maintain emotional well-being", "정서적 행복을 쉽게 유지하기 위해 잠재력을 발휘하는 것"], ["which, in addition to making life worth living, directly and indirectly affects our ability", "그 행복은, 삶을 살 가치 있게 만들 뿐 아니라, 직간접적으로 우리의 능력에 영향을 준다"], ["to achieve our basic survival needs for fuel, clothing and shelter;", "연료·의복·주거의 기본 생존 필요를 충족할;"], ["and creating a family or social network to keep us feeling valued", "그리고 우리가 소중하다고 느끼게 하는 가족·사회적 네트워크를 만드는 것"], ["and, as research suggests, enabling a longer lifespan.", "그리고, 연구가 시사하듯, 더 긴 수명을 가능하게 하는."]]}]}, {"no": "6", "title": "Climate Change as a Hyperobject: The Detection Problem", "ktitle": "기후 변화는 '초객체'여서 오직 현상을 통해서만 드러난다 — 투명 인간처럼, 그래서 누군가는 보고 누군가는 못 본다", "field": "환경·철학", "page": "09강 no.07", "oneline": "기후 변화는 형태·위치가 없는 초객체(hyperobject)여서, 투명 인간이 붕대·옷으로만 드러나듯 오직 현상(기온·해수면)을 통해서만 드러난다 → 그래서 누군가는 보고 누군가는 못 보는 감지 문제가 생긴다.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 투명 인간이 붕대와 옷으로만 형태가 드러나는 모습과, 오른쪽 기후 변화 초객체가 본체는 보이지 않고 기온·해수면 같은 현상으로만 드러나는 모습의 평행 비유 — 본문 직접 비유 시각화\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">hyperobject — 현상으로만 드러나는 것</text>\n  <text x=\"300\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">parallel: The Invisible Man ↔ climate change</text>\n\n  <!-- 좌측: 투명 인간 -->\n  <g transform=\"translate(20, 50)\">\n    <text x=\"135\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">The Invisible Man</text>\n    <rect x=\"0\" y=\"6\" width=\"270\" height=\"170\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.2\"/>\n\n    <!-- 투명 인간 본체 (점선 윤곽만) - 옷·붕대로만 보이는 부분 -->\n    <g transform=\"translate(135, 85)\">\n      <!-- 머리 (점선) - 보이지 않음 -->\n      <circle cx=\"0\" cy=\"-50\" r=\"18\" fill=\"none\" stroke=\"#ccc\" stroke-width=\"1.2\" stroke-dasharray=\"2 2\"/>\n      <!-- 붕대 감긴 부분 (실선) -->\n      <g stroke=\"#1a1a1a\" stroke-width=\"1.4\" fill=\"#ffffff\">\n        <!-- 머리 붕대 -->\n        <path d=\"M -18 -55 Q -15 -60 -8 -60 L 8 -60 Q 15 -60 18 -55 L 18 -42 Q 15 -38 8 -38 L -8 -38 Q -15 -38 -18 -42 Z\"/>\n        <!-- 붕대 줄무늬 -->\n        <line x1=\"-18\" y1=\"-50\" x2=\"18\" y2=\"-50\" stroke=\"#1a1a1a\" stroke-width=\"0.6\"/>\n        <line x1=\"-18\" y1=\"-46\" x2=\"18\" y2=\"-46\" stroke=\"#1a1a1a\" stroke-width=\"0.6\"/>\n      </g>\n      <!-- 어두운 안경 (선글라스) -->\n      <circle cx=\"-6\" cy=\"-48\" r=\"3\" fill=\"#1a1a1a\"/>\n      <circle cx=\"6\" cy=\"-48\" r=\"3\" fill=\"#1a1a1a\"/>\n      <line x1=\"-3\" y1=\"-48\" x2=\"3\" y2=\"-48\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n\n      <!-- 목 (점선) -->\n      <line x1=\"-3\" y1=\"-37\" x2=\"-3\" y2=\"-32\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"3\" y1=\"-37\" x2=\"3\" y2=\"-32\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n\n      <!-- 외투 (실선) -->\n      <path d=\"M -22 -32 L 22 -32 L 28 -10 L 30 30 L 22 50 L -22 50 L -30 30 L -28 -10 Z\" \n            fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 외투 단추 -->\n      <circle cx=\"0\" cy=\"-22\" r=\"1.5\" fill=\"#1a1a1a\"/>\n      <circle cx=\"0\" cy=\"-10\" r=\"1.5\" fill=\"#1a1a1a\"/>\n      <circle cx=\"0\" cy=\"2\" r=\"1.5\" fill=\"#1a1a1a\"/>\n      <circle cx=\"0\" cy=\"14\" r=\"1.5\" fill=\"#1a1a1a\"/>\n      <!-- 깃 -->\n      <path d=\"M -8 -32 L 0 -22 L 8 -32\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n\n      <!-- 다리 (점선 - 보이지 않음) -->\n      <line x1=\"-10\" y1=\"50\" x2=\"-10\" y2=\"68\" stroke=\"#ccc\" stroke-width=\"1.2\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"10\" y1=\"50\" x2=\"10\" y2=\"68\" stroke=\"#ccc\" stroke-width=\"1.2\" stroke-dasharray=\"2 2\"/>\n\n      <!-- 신발 (실선) -->\n      <ellipse cx=\"-10\" cy=\"70\" rx=\"6\" ry=\"2.5\" fill=\"#1a1a1a\"/>\n      <ellipse cx=\"10\" cy=\"70\" rx=\"6\" ry=\"2.5\" fill=\"#1a1a1a\"/>\n    </g>\n\n    <text x=\"135\" y=\"160\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">visible only via bandages &amp; clothes</text>\n  </g>\n\n  <!-- 가운데 평행 -->\n  <text x=\"300\" y=\"135\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">∥</text>\n\n  <!-- 우측: 기후 변화 (초객체) -->\n  <g transform=\"translate(310, 50)\">\n    <text x=\"135\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">climate change · hyperobject</text>\n    <rect x=\"0\" y=\"6\" width=\"270\" height=\"170\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 기후 변화 본체 (점선·옅음 - massive, nonlocal) -->\n    <g transform=\"translate(135, 85)\">\n      <!-- 거대·비국부적 본체 (큰 점선 원) -->\n \"22\" y2=\"-15\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <polygon points=\"22,-17 19,-11 25,-11\" fill=\"#1FA34A\"/>\n      <text x=\"22\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">sea level</text>\n    </g>\n\n    <text x=\"135\" y=\"160\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">visible only via temperature &amp; sea level</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"242\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">→ detection problem: some see · others cannot</text>\n</svg>", "caption": "투명 인간 = 붕대·옷으로만 보임 ∥ 기후 변화 = 기온·해수면으로만 보임", "tldr": ["기후 변화는 형태·위치가 없는 초객체(hyperobject)여서, 투명 인간이 붕대·옷으로만 드러나듯 오직 현상(기온·해수면)을 통해서만 드러난다 → 그래서 누군가는 보고 누군가는 못 보는 감지 문제가 생긴다.", "투명 인간 = 붕대·옷으로만 보임 ∥ 기후 변화 = 기온·해수면으로만 보임"], "bg": "분야는 환경·철학이에요. 핵심 개념은 형태·위치가 없는 ‘초객체(hyperobject)’로서의 기후 변화. 투명 인간 비유가 나와요. → 보이지 않는 기후 변화를 어떻게 인식하는지에 주목하며 읽으세요.", "flow": [{"kind": "핵심", "t": "기후 변화는 형태·위치가 없는 초객체(hyperobject)여서, 투명 인간이 붕대·옷으로만 드러나듯 오직 현상(기온·해수면)을 통해서만 드러난다 → 그래서 누군가는 보고 누군가는 못 보는 감지 문제가 생긴다."}, {"kind": "읽기 방향", "t": "투명 인간 = 붕대·옷으로만 보임 ∥ 기후 변화 = 기온·해수면으로만 보임"}, {"kind": "정리", "t": "분야는 환경·철학이에요. 핵심 개념은 형태·위치가 없는 ‘초객체(hyperobject)’로서의 기후 변화. 투명 인간 비유가 나와요. → 보이지 않는 기후 변화를 어떻게 인식하는지에 주목하며 읽으세요.", "cls": "close"}], "vocab": [["⊕overwhelmingoverwhelm + ‑ing", "압도적인"], ["★detection", "감지·탐지"], ["★phenomenon", "현상 (pl. phenomena)"], ["perceive", "인지하다·감지하다"], ["coin", "(신조어를) 만들어 내다"], ["⊕nonlocalnon‑ + local", "비국부적인 (특정 위치에 없는)"], ["defy", "거스르다·저항하다"], ["pinpoint", "정확한·콕 집은"], ["★reveal", "드러내다·보여 주다"], ["lack", "~이 없다·부족하다"]], "quiz": [["이 지문의 핵심 구조는?", "투명 인간 = 붕대·옷으로만 보임 ∥ 기후 변화 = 기온·해수면으로만 보임"], ["도식이 강조하는 결론은?", "기후 변화는 형태·위치가 없는 초객체(hyperobject)여서, 투명 인간이 붕대·옷으로만 드러나듯 오직 현상(기온·해수면)을 통해서만 드러난다 → 그래서 누군가는 보고 누군가는 못 보는 감지 문제가 생긴다."]], "en": "Despite overwhelming scientific evidence, climate change still has a detection problem. That is, it is a phenomenon that some people perceive on the planet, in the news, or in their own lives, while others do not. The environmental philosopher Timothy Morton has labeled climate change a hyperobject, a term he coined to describe realities that are massive, nonlocal, and \"sticky\" in that they reveal themselves only through phenomena created by the interaction of other objects, a condition known as \"interobjectivity.\" As such, climate change defies humans' understanding of an object that can be easily seen, touched, or described and has a singular pinpoint location. Like the main character in the 1933 film The Invisible Man, climate change cannot be detected except by measuring something associated with it, such as temperature or sea-level rise. These are the phenomena of climate change, and, like the bandages and clothing worn by the invisible man, they reveal the shape of the object. Without his suit, bandages, gloves, and sunglasses, the invisible man would indeed be invisible on screen. Similarly, climate change lacks a form, shape, or even location; it is revealed only through its phenomena, and this creates the detection problem. Some people can see climate change, while others cannot see it.", "ko": "압도적인 과학적 증거에도 불구하고 기후 변화는 여전히 감지 문제가 있다. 즉, 그것은 어떤 사람들은 지구상에서, 뉴스에서, 혹은 자신의 삶에서 인지하는 반면, 다른 사람들은 인지하지 못하는 현상이다. 환경 철학자 Timothy Morton은 기후 변화를 '초객체'라고 명명했는데, 이는 그것들이 다른 객체들의 상호 작용, 즉 '상호 객체성'이라 알려진 상태에 의해 생성되는 현상을 통해서만 자신을 드러내기 때문에 거대하고, 비국부적이며, '떼어낼 수 없는(들러붙는)' 실체를 설명하기 위해 그가 만든 용어이다. 따라서 기후 변화는 쉽게 보거나, 만지거나, 설명할 수 있으며 단일한 정확한 위치를 가진 객체에 대한 인간의 이해를 거스른다. 1933년 영화 '투명 인간'의 주인공처럼, 기후 변화는 기온이나 해수면 상승과 같이 그것과 관련된 무언가를 측정하지 않으면 감지할 수 없다. 이러한 것들이 기후 변화의 현상이며, 투명 인간이 두른 붕대와 착용한 옷처럼, 그것들은 객체의 형태를 드러낸다. 그의 슈트, 붕대, 장갑, 그리고 선글라스가 없다면 그 투명 인간은 실제로 화면에 보이지 않을 것이다. 마찬가지로 기후 변화도 형태나 모양, 심지어 위치조차 없고, 그것은 오직 현상을 통해서만 드러나며, 이로 인해 감지 문제가 발생한다. 어떤 사람들은 기후 변화를 볼 수 있는 반면, 다른 사람들은 볼 수 없다.", "read": [{"en": "Despite overwhelming scientific evidence, climate change still has a detection problem.", "ko": "압도적인 과학적 증거에도 불구하고 기후 변화는 여전히 감지 문제가 있다.", "chunks": [["Despite overwhelming scientific evidence,", "압도적인 과학적 증거에도 불구하고,"], ["climate change still has a detection problem.", "기후 변화는 여전히 감지 문제가 있다."]]}, {"en": "That is, it is a phenomenon that some people perceive on the planet, in the news, or in their own lives, while others do not.", "ko": "즉, 그것은 어떤 사람들은 지구상에서, 뉴스에서, 혹은 자신의 삶에서 인지하는 반면, 다른 사람들은 인지하지 못하는 현상이다.", "chunks": [["That is, it is a phenomenon", "즉, 그것은 현상이다"], ["that some people perceive on the planet, in the news, or in their own lives,", "어떤 사람들은 지구상에서, 뉴스에서, 또는 자신의 삶에서 인지하는,"], ["while others do not.", "반면 다른 사람들은 인지하지 못하는."]]}, {"en": "The environmental philosopher Timothy Morton has labeled climate change a hyperobject, a term he coined to describe realities that are massive, nonlocal, and \"sticky\" in that they reveal themselves only through phenomena created by the interaction of other objects, a condition known as \"interobjectivity.\"", "ko": "환경 철학자 Timothy Morton은 기후 변화를 '초객체'라고 명명했는데, 이는 그것들이 다른 객체들의 상호 작용, 즉 '상호 객체성'이라 알려진 상태에 의해 생성되는 현상을 통해서만 자신을 드러내기 때문에 거대하고, 비국부적이며, '떼어낼 수 없는(들러붙는)' 실체를 설명하기 위해 그가 만든 용어이다.", "chunks": [["The environmental philosopher Timothy Morton has labeled climate change a hyperobject,", "환경 철학자 Timothy Morton은 기후 변화를 '초객체'라고 명명했는데,"], ["a term he coined to describe realities", "이는 실체를 설명하기 위해 그가 만든 용어이다"], ["that are massive, nonlocal, and \"sticky\"", "거대하고, 비국부적이며, '들러붙는'"], ["in that they reveal themselves only through phenomena", "그것들이 오직 현상을 통해서만 자신을 드러낸다는 점에서"], ["created by the interaction of other objects,", "다른 객체들의 상호 작용에 의해 생성되는,"], ["a condition known as \"interobjectivity.\"", "'상호 객체성'이라 알려진 상태."]]}, {"en": "As such, climate change defies humans' understanding of an object that can be easily seen, touched, or described and has a singular pinpoint

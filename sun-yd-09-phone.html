\" y2=\"40\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <polygon points=\"100,42 96,32 104,32\" fill=\"#c8102e\"/>\n\n    <text x=\"160\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" fill=\"#c8102e\">arrogance · tyranny</text>\n    <text x=\"160\" y=\"48\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#c8102e\">→ 오만 · 폭정</text>\n    <text x=\"160\" y=\"64\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\">harmful · oppressive</text>\n    <text x=\"160\" y=\"76\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\">misuse possible</text>\n  </g>\n\n  <!-- 하단: 메커니즘 박스 -->\n  <g transform=\"translate(20, 222)\">\n    <rect x=\"0\" y=\"0\" width=\"560\" height=\"42\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <text x=\"12\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1a1a1a\">★★ democratic framework + consensual approach</text>\n    <text x=\"12\" y=\"30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" fill=\"#1FA34A\" font-weight=\"700\">consensus · information exchange · transparency · tolerance · public preventing misuse</text>\n    <!-- 조준선 — 박스에서 good master로 -->\n    <line x1=\"280\" y1=\"0\" x2=\"200\" y2=\"-26\" stroke=\"#1FA34A\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/>\n    <polygon points=\"200,-26 207,-22 204,-30\" fill=\"#1FA34A\"/>\n    <text x=\"395\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" fill=\"#1FA34A\">→ ensures emancipative role</text>\n  </g>\n</svg>", "caption": "good master = 해방 ↔ evil master = 억압 · 민주적 통제·합의가 해방 방향으로 조준", "tldr": ["과학은 선한 주인이자 악한 주인(해방적/억압적) 양면을 지니며, 과학이 해방적 역할을 하도록 보장하는 길은 합의·정보 교환·투명성·관용, 그리고 민주적 통제(국민이 오용을 막는 것)에 있다.", "good master = 해방 ↔ evil master = 억압 · 민주적 통제·합의가 해방 방향으로 조준"], "bg": "분야는 과학·윤리예요. 핵심 — 과학이 ‘해방적/억압적’ 양면(선한 주인·악한 주인)을 지닌다는 것. → 과학이 해방적 역할을 하도록 보장하는 길이 무엇인지에 주목하며 읽으세요.", "flow": [{"kind": "핵심", "t": "과학은 선한 주인이자 악한 주인(해방적/억압적) 양면을 지니며, 과학이 해방적 역할을 하도록 보장하는 길은 합의·정보 교환·투명성·관용, 그리고 민주적 통제(국민이 오용을 막는 것)에 있다."}, {"kind": "읽기 방향", "t": "good master = 해방 ↔ evil master = 억압 · 민주적 통제·합의가 해방 방향으로 조준"}, {"kind": "정리", "t": "분야는 과학·윤리예요. 핵심 — 과학이 ‘해방적/억압적’ 양면(선한 주인·악한 주인)을 지닌다는 것. → 과학이 해방적 역할을 하도록 보장하는 길이 무엇인지에 주목하며 읽으세요.", "cls": "close"}], "vocab": [["★evil", "악한·악"], ["★liberation", "해방"], ["breed", "낳다·야기하다"], ["arrogance", "오만·거만"], ["tyranny", "폭정·독재"], ["⊕emancipativeemancipate + ‑ive", "해방적인"], ["⊕consensualconsensus + ‑al", "합의에 의한"], ["transparency", "투명성"], ["tolerance", "관용·용인"], ["superstition", "미신"], ["⊕misusemis‑ + use", "오용·남용"]], "quiz": [["이 지문의 핵심 구조는?", "good master = 해방 ↔ evil master = 억압 · 민주적 통제·합의가 해방 방향으로 조준"], ["도식이 강조하는 결론은?", "과학은 선한 주인이자 악한 주인(해방적/억압적) 양면을 지니며, 과학이 해방적 역할을 하도록 보장하는 길은 합의·정보 교환·투명성·관용, 그리고 민주적 통제(국민이 오용을 막는 것)에 있다."]], "en": "Science can be considered as a good and an evil master. This is because science is knowledge and knowledge is power, and with power come wisdom and liberation. But at the same time, science can also breed arrogance and tyranny. Science does have the potential to be beneficial or harmful, emancipative or oppressive. In the twentieth century, there were several examples which spoke about the dual role of science. Now the question is how we can ensure that science plays an emancipative role in the world. The answer to this question may lie in a consensual approach to various issues threatening mankind and his own survival today. This may be possible only through the proper exchange of information, transparency, and tolerance for multiple viewpoints. In a progressive society, science may play a liberating role by helping people overcome their poverty, ignorance, and superstition. However, in a democratic political framework, the people themselves can prevent the misuse of science, and this would help them to grow and develop themselves in a proper and planned manner.", "ko": "과학은 선한 주인이자 악한 주인으로 간주될 수 있다. 이는 과학이 지식이고, 지식은 힘이며, 힘에는 지혜와 해방이 따르기 때문이다. 하지만 동시에 과학은 오만과 폭정을 낳을 수도 있다. 과학은 이롭거나 해로울 수도, 해방적이거나 억압적일 수도 있는 가능성을 정말로 가지고 있다. 20세기에는 과학의 이중적인 역할에 대해 말한 여러 사례가 존재했다. 이제 문제는, 과학이 세상에서 해방적인 역할을 하도록 우리가 어떻게 보장할 수 있을까이다. 이 문제에 대한 답은 오늘날 인류와 그 자신의 생존을 위협하는 다양한 문제에 대한 합의적 접근 방식에 있을 수도 있다. 이는 정보의 적절한 교환, 투명성, 그리고 다양한 관점에 대한 관용을 통해서만 가능할지도 모른다. 진보적인 사회에서는, 과학은 사람들이 빈곤, 무지, 그리고 미신을 극복하도록 도와줌으로써 해방적 역할을 할 수도 있다. 그러나 민주주의 정치 체제에서는, 사람들 스스로가 과학의 오용을 막을 수 있으며, 이는 그들이 적절하고 계획된 방식으로 스스로 성장하고 발전하도록 도울 것이다.", "read": [{"en": "Science can be considered as a good and an evil master.", "ko": "과학은 선한 주인이자 악한 주인으로 간주될 수 있다.", "chunks": [["Science can be considered as", "과학은 ~으로 간주될 수 있다"], ["a good and an evil master.", "선한 주인이자 악한 주인."]]}, {"en": "This is because science is knowledge and knowledge is power, and with power come wisdom and liberation.", "ko": "이는 과학이 지식이고, 지식은 힘이며, 힘에는 지혜와 해방이 따르기 때문이다.", "chunks": [["This is because science is knowledge", "이는 과학이 지식이기 때문이다"], ["and knowledge is power,", "그리고 지식은 힘이며,"], ["and with power come wisdom and liberation.", "그리고 힘에는 지혜와 해방이 따라온다."]]}, {"en": "But at the same time, science can also breed arrogance and tyranny.", "ko": "하지만 동시에 과학은 오만과 폭정을 낳을 수도 있다.", "chunks": [["But at the same time,", "하지만 동시에,"], ["science can also breed arrogance and tyranny.", "과학은 오만과 폭정도 낳을 수 있다."]]}, {"en": "Science does have the potential to be beneficial or harmful, emancipative or oppressive.", "ko": "과학은 이롭거나 해로울 수도, 해방적이거나 억압적일 수도 있는 가능성을 정말로 가지고 있다.", "chunks": [["Science does have the potential", "과학은 정말로 가능성을 지닌다"], ["to be beneficial or harmful,", "이롭거나 해로울,"], ["emancipative or oppressive.", "해방적이거나 억압적일."]]}, {"en": "In the twentieth century, there were several examples which spoke about the dual role of science.", "ko": "20세기에는 과학의 이중적인 역할에 대해 말한 여러 사례가 존재했다.", "chunks": [["In the twentieth century,", "20세기에는,"], ["there were several examples", "여러 사례가 있었다"], ["which spoke about the dual role of science.", "과학의 이중적 역할에 대해 말해 주는."]]}, {"en": "Now the question is how we can ensure that science plays an emancipative role in the world.", "ko": "이제 문제는, 과학이 세상에서 해방적인 역할을 하도록 우리가 어떻게 보장할 수 있을까이다.", "chunks": [["Now the question is", "이제 문제는 ~이다"], ["how we can ensure", "우리가 어떻게 보장할 수 있을까"], ["that science plays an emancipative role in the world.", "과학이 세상에서 해방적 역할을 하도록."]]}, {"en": "The answer to this question may lie in a consensual approach to various issues threatening mankind and his own survival today.", "ko": "이 문제에 대한 답은 오늘날 인류와 그 자신의 생존을 위협하는 다양한 문제에 대한 합의적 접근 방식에 있을 수도 있다.", "chunks": [["The answer to this question may lie in", "이 질문에 대한 답은 ~에 있을지 모른다"], ["a consensual approach to various issues", "다양한 문제에 대한 합의적 접근에"], ["threatening mankind and his own survival today.", "오늘날 인류와 그 자신의 생존을 위협하는."]]}, {"en": "This may be possible only through the proper exchange of information, transparency, and tolerance for multiple viewpoints.", "ko": "이는 정보의 적절한 교환, 투명성, 그리고 다양한 관점에 대한 관용을 통해서만 가능할지도 모른다.", "chunks": [["This may be possible only through", "이는 오직 ~을 통해서만 가능할지 모른다"], ["the proper exchange of information, transparency,", "정보의 적절한 교환, 투명성,"], ["and tolerance for multiple viewpoints.", "그리고 다양한 관점에 대한 관용."]]}, {"en": "In a progressive society, science may play a liberating role by helping people overcome their poverty, ignorance, and superstition.", "ko": "진보적인 사회에서는, 과학은 사람들이 빈곤, 무지, 그리고 미신을 극복하도록 도와줌으로써 해방적 역할을 할 수도 있다.", "chunks": [["In a progressive society,", "진보적인 사회에서는,"], ["science may play a liberating role", "과학은 해방적 역할을 할 수 있다"], ["by helping people overcome their poverty, ignorance, and superstition.", "사람들이 빈곤·무지·미신을 극복하도록 도움으로써."]]}, {"en": "However, in a democratic political framework, the people themselves can prevent the misuse of science, and this would help them to grow and develop themselves in a proper and planned manner.", "ko": "그러나 민주주의 정치 체제에서는, 사람들 스스로가 과학의 오용을 막을 수 있으며, 이는 그들이 적절하고 계획된 방식으로 스스로 성장하고 발전하도록 도울 것이다.", "chunks": [["However, in a democratic political framework,", "그러나 민주적 정치 체제에서는,"], ["the people themselves can prevent the misuse of science,", "국민 스스로가 과학의 오용을 막을 수 있고,"], ["and this would help them to grow and develop themselves", "이는 그들이 스스로 성장하고 발전하도록 도울 것이다"], ["in a proper and planned manner.", "적절하고 계획된 방식으로."]]}]}, {"no": "8", "title": "Shifting Attitudes Toward Animals: Beyond 'Cuteness'", "ktitle": "'귀여운 동물' 캠페인이 감정을 자극하지만, 동물에 대한 태도 변화의 중심은 '귀여움'이 아니라 더 넓은 윤리적 원칙이다", "field": "심리·동물", "page": "09강 no.09", "oneline": "'귀여운 동물' 캠페인이 감정을 자극하지만, 변화의 중심은 더 넓은 윤리적 원칙과 자연에 대한 경외다 → 많은 사람이 윤리적 입장을 채택해 소비 습관(유기농·채식·비건)을 바꾼다.", "metaphor": "<svg viewBox=\"0 0 600 265\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"좌측 작은 귀여운 코알라 캠페인이 감정을 자극하는 모습과, 우측 큰 윤리적 원칙과 자연에 대한 경외라는 중심 동력이 대조되고, 하단에 결과로서 유기농·채식·비건 소비 습관 변화 세 아이콘이 놓인 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">중심은 '귀여움'이 아니라 '윤리 원칙'</text>\n  <text x=\"300\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">cute animals (peripheral) · ethical principles (central)</text>\n\n  <!-- 좌측: 귀여움 (작게 - 일부) -->\n  <g transform=\"translate(20, 50)\">\n    <text x=\"105\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">'cute animal' — peripheral</text>\n    <rect x=\"0\" y=\"6\" width=\"210\" height=\"115\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 작은 코알라 -->\n    <g transform=\"translate(105, 65)\">\n      <!-- 머리 -->\n      <circle cx=\"0\" cy=\"0\" r=\"22\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 귀 (큰 둥근 귀) -->\n      <circle cx=\"-18\" cy=\"-15\" r=\"9\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"-18\" cy=\"-15\" r=\"5\" fill=\"#fdf2f4 -2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">→ 결과: 윤리적 입장 → 소비 습관 변화</text>\n    <rect x=\"0\" y=\"6\" width=\"560\" height=\"68\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n\n    <!-- 유기농 -->\n    <g transform=\"translate(95, 40)\">\n      <circle cx=\"0\" cy=\"0\" r=\"20\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <!-- 잎 -->\n      <path d=\"M 0 -8 Q -8 -4 -6 4 Q 2 8 8 0 Q 6 -8 0 -8 Z\" fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"-8\" x2=\"6\" y2=\"0\" stroke=\"#ffffff\" stroke-width=\"0.8\"/>\n      <text x=\"50\" y=\"-5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#1FA34A\">organic</text>\n      <text x=\"50\" y=\"8\" font-family=\"Noto Serif KR\" font-size=\"9.5\" fill=\"#1FA34A\">유기농</text>\n    </g>\n\n    <!-- 채식 -->\n    <g transform=\"translate(265, 40)\">\n      <circle cx=\"0\" cy=\"0\" r=\"20\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <!-- 당근 모양 -->\n      <polygon points=\"0,-9 4,3 -4,3\" fill=\"#1FA34A\"/>\n      <line x1=\"0\" y1=\"-9\" x2=\"-2\" y2=\"-13\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"-9\" x2=\"2\" y2=\"-13\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"-9\" x2=\"0\" y2=\"-14\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"50\" y=\"-5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#1FA34A\">vegetarian</text>\n      <text x=\"50\" y=\"8\" font-family=\"Noto Serif KR\" font-size=\"9.5\" fill=\"#1FA34A\">채식</text>\n    </g>\n\n    <!-- 비건 -->\n    <g transform=\"translate(435, 40)\">\n      <circle cx=\"0\" cy=\"0\" r=\"20\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <!-- V 글자 -->\n      <path d=\"M -7 -7 L 0 8 L 7 -7\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"2.2\"/>\n      <text x=\"50\" y=\"-5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#1FA34A\">vegan</text>\n      <text x=\"50\" y=\"8\" font-family=\"Noto Serif KR\" font-size=\"9.5\" fill=\"#1FA34A\">비건</text>\n    </g>\n  </g>\n</svg>", "caption": "cute = peripheral ≠ ethical principles = CENTRAL → organic · vegetarian · vegan", "tldr": ["'귀여운 동물' 캠페인이 감정을 자극하지만, 변화의 중심은 더 넓은 윤리적 원칙과 자연에 대한 경외다 → 많은 사람이 윤리적 입장을 채택해 소비 습관(유기농·채식·비건)을 바꾼다.", "cute = peripheral ≠ ethical principles = CENTRAL → organic · vegetarian · vegan"], "bg": "분야는 심리·동물이에요. ‘귀여운 동물’ 캠페인의 감정 자극이 배경. → 동물에 대한 태도 변화의 진짜 중심이 감정인지 더 넓은 윤리 원칙인지에 주목하며 읽으세요.", "flow": [{"kind": "핵심", "t": "'귀여운 동물' 캠페인이 감정을 자극하지만, 변화의 중심은 더 넓은 윤리적 원칙과 자연에 대한 경외다 → 많은 사람이 윤리적 입장을 채택해 소비 습관(유기농·채식·비건)을 바꾼다."}, {"kind": "읽기 방향", "t": "cute = peripheral ≠ ethical principles = CENTRAL → organic · vegetarian · vegan"}, {"kind": "정리", "t": "분야는 심리·동물이에요. ‘귀여운 동물’ 캠페인의 감정 자극이 배경. → 동물에 대한 태도 변화의 진짜 중심이 감정인지 더 넓은 윤리 원칙인지에 주목하며 읽으세요.", "cls": "close"}], "vocab": [["⊕sensitivitysensitive + ‑ity", "민감도·세심함"], ["★welfare", "복지·안녕"], ["provoke", "유발하다·불러일으키다"], ["⊕affectiveaffect + ‑ive", "정서적인·감정의"], ["cruelty", "학대·잔혹함"], ["◇flagship species", "깃대종 (보전 상징 종)"], ["⊕awe-inspiringawe + inspiring", "경외심을 불러일으키는"], ["⊕attunementattune + ‑ment", "조화·맞춤"], ["stance", "입장·태도"], ["⊕sustainabilitysustain + ‑able + ‑ity", "지속 가능성"]], "quiz": [["이 지문의 핵심 구조는?", "cute = peripheral ≠ ethical principles = CENTRAL → organic · vegetarian · vegan"], ["도식이 강조하는 결론은?", "'귀여운 동물' 캠페인이 감정을 자극하지만, 변화의 중심은 더 넓은 윤리적 원칙과 자연에 대한 경외다 → 많은 사람이 윤리적 입장을 채택해 소비 습관(유기농·채식·비건)을 바꾼다."]], "en": "A greater sensitivity and concern towards the welfare and wellbeing of the natural environment and ecological systems are contributing to shifts in people's feelings about other animals. Images of animals are used by activist organizations to provoke strong affective responses as part of initiatives to fight animal cruelty. Among wild animals, koalas are often to be found in 'cute animal' digital portrayals and are strategically used as charismatic flagship species in conservation awareness and fundraising efforts. While cute affects play some role in these affective connections, broader ethical principles concerning animal rights and the awe-inspiring power and beauty of nature are central to these transformations. A notable move towards attunement to issues such as animal welfare in farming, the horse racing industry and the fur industry, together with heightened awareness of the environmental impacts of factory farming, is evident in countries comprising the Global North. Many people have adopted an ethical stance on the treatment and use of animals and are changing their consumption habits accordingly. Practices such as the adoption of organic, vegetarian and vegan diets are also expanding rapidly in response to concern about animal welfare and environmental sustainability.", "ko": "자연환경과 생태계의 복지와 안녕에 대한 더 커진 민감도와 관심은 다른 동물에 대한 사람들의 감정 변화의 원인이 되고 있다. 동물 학대와 싸우기 위한 계획의 일환으로 (동물 보호) 활동가와 관련된 단체들은 강한 정서적 반응을 유발하기 위해 동물 이미지를 사용하고 있다. 야생 동물 중 코알라는 '귀여운 동물' 디지털 묘사에서 자주 발견될 수 있으며, 보호 인식 및 기금 모금 활동에서 매력적인 깃대종으로 전략적으로 활용되고 있다. 이러한 정서적 연결에 있어 귀여운 정서도 어느 정도 역할을 하지만, 동물 권리에 대한 더 넓은 윤리적 원칙과 경외심을 불러일으키는 자연의 힘과 아름다움이 이러한 변화의 중심이다. 공장식 축산의 환경적 영향에 대한 고조된 인식과 함께, 축산업, 경마 산업, 그리고 모피 산업에서 동물 복지와 같은 문제에 대해 조화를 향한 주목할 만한 움직임이 북반구의 선진국에 속한 국가들에서 분명히 나타나고 있다. 많은 사람이 동물의 처우와 사용에 관한 윤리적 입장을 채택하였고, 그에 따라 자신의 소비 습관을 바꾸고 있다. 동물 복지와 환경 지속 가능성에 대한 관심에 대응하여 유기농 식단, 채식, 그리고 비건 식단 채택 같은 실천도 빠르게 확산되고 있다.", "read": [{"en": "A greater sensitivity and concern towards the welfare and wellbeing of the natural environment and ecological systems are contributing to shifts in people's feelings about other animals.", "ko": "자연환경과 생태계의 복지와 안녕에 대한 더 커진 민감도와 관심은 다른 동물에 대한 사람들의 감정 변화의 원인이 되고 있다.", "chunks": [["A greater sensitivity and concern", "더 커진 민감도와 관심은"], ["towards the welfare and wellbeing of the natural environment and ecological systems", "자연환경과 생태계의 복지와 안녕에 대한"], ["are contributing to shifts in people's feelings about other animals.", "다른 동물에 대한 사람들의 감정 변화에 기여하고 있다."]]}, {"en": "Images of animals are used by activist organizations to provoke strong affective responses as part of initiatives to fight animal cruelty.", "ko": "동물 학대와 싸우기 위한 계획의 일환으로 (동물 보호) 활동가와 관련된 단체들은 강한 정서적 반응을 유발하기 위해 동물 이미지를 사용하고 있다.", "chunks": [["Images of animals are used by activist organizations", "동물 이미지는 활동가 단체들에 의해 사용된다"], ["to provoke strong affective responses", "강한 정서적 반응을 유발하기 위해"], ["as part of initiatives to fight animal cruelty.", "동물 학대와 싸우는 계획의 일환으로."]]}, {"en": "Among wild animals, koalas are often to be found in 'cute animal' digital portrayals and are strategically used as charismatic flagship species in conservation awareness and fundraising efforts.", "ko": "야생 동물 중 코알라는 '귀여운 동물' 디지털 묘사에서 자주 발견될 수 있으며, 보호 인식 및 기금 모금 활동에서 매력적인 깃대종으로 전략적으로 활용되고 있다.", "chunks": [["Among wild animals, koalas are often to be found", "야생 동물 중 코알라는 자주 발견된다"], ["in 'cute animal' digital portrayals", "'귀여운 동물' 디지털 묘사에서"], ["and are strategically used as charismatic flagship species", "그리고 매력적인 깃대종으로 전략적으로 활용된다"], ["in conservation awareness and fundraising efforts.", "보호 인식 및 기금 모금 활동에서."]]}, {"en": "While cute affects play some role in these affective connections, broader ethical principles concerning animal rights and the awe-inspiring power and beauty of nature are central to these transformations.", "ko": "이러한 정서적 연결에 있어 귀여운 정서도 어느 정도 역할을 하지만, 동물 권리에 대한 더 넓은 윤리적 원칙과 경외심을 불러일으키는 자연의 힘과 아름다움이 이러한 변화의 중심이다.", "chunks": [["While cute affects play some role", "귀여운 정서가 어느 정도 역할을 하지만"], ["in these affective connections,", "이러한 정서적 연결에서,"], ["broader ethical principles concerning animal rights", "동물 권리에 관한 더 넓은 윤리적 원칙과"], ["and the awe-inspiring power and beauty of nature", "경외심을 불러일으키는 자연의 힘과 아름다움이"], ["are central to these transformations.", "이러한 변화의 중심이다."]]}, {"en": "A notable move towards attunement to issues such as animal welfare in farming, the horse racing industry and the fur industry, together with heightened awareness of the environmental impacts of factory farming, is evident in countries comprising the Global North.", "ko": "공장식 축산의 환경적 영향에 대한 고조된 인식과 함께, 축산업, 경마 산업, 그리고 모피 산업에서 동물 복지와 같은 문제에 대해 조화를 향한 주목할 만한 움직임이 북반구의 선진국에 속한 국가들에서 분명히 나타나고 있다.", "chunks": [["A notable move towards attunement to issues", "문제에 대한 조화로의 주목할 만한 움직임이"], ["such as animal welfare in farming, the horse racing industry and the fur industry,", "축산업·경마 산업·모피 산업에서의 동물 복지 같은,"], ["together with heightened awareness of the environmental impacts of factory farming,", "공장식 축산의 환경적 영향에 대한 고조된 인식과 더불어,"], ["is evident in countries comprising the Global North.", "북반구 선진국에 속한 국가들에서 분명히 나타난다."]]}, {"en": "Many people have adopted an ethical stance on the treatment and use of animals and are changing their consumption habits accordingly.", "ko": "많은 사람이 동물의 처우와 사용에 관한 윤리적 입장을 채택하였고, 그에 따라 자신의 소비 습관을 바꾸고 있다.", "chunks": [["Many people have adopted an ethical stance", "많은 사람이 윤리적 입장을 채택했다"], ["on the treatment and use of animals", "동물의 처우와 사용에 관해"], ["and are changing their consumption habits accordingly.", "그리고 그에 따라 소비 습관을 바꾸고 있다."]]}, {"en": "Practices such as the adoption of organic, vegetarian and vegan diets are also expanding rapidly in response to concern about animal welfare and environmental sustainability.", "ko": "동물 복지와 환경 지속 가능성에 대한 관심에 대응하여 유기농 식단, 채식, 그리고 비건 식단 채택 같은 실천도 빠르게 확산되고 있다.", "chunks": [["Practices such as the adoption of organic, vegetarian and vegan diets", "유기농·채식·비건 식단 채택 같은 실천이"], ["are also expanding rapidly", "또한 빠르게 확산되고 있다"], ["in response to concern about animal welfare and environmental sustainability.", "동물 복지와 환경 지속 가능성에 대한 관심에 대응하여."]]}]}, {"no": "9", "title": "Consumerism: Old Roots, but Born Full-blown with Industrial Capitalism", "ktitle": "과시·사치 소비는 자본주의 이전부터 있었지만, 본격적 '소비주의'는 산업 자본주의의 부상과 함께 비로소 나타났다", "field": "사회·경제", "page": "09강 no.10", "oneline": "과시·사치 소비는 자본주의 이전부터 있었고 소비문화 요소도 19세기엔 갖춰졌지만, 본격적 소비주의는 산업 자본주의의 부상과 함께 비로소 나타나 — 대량 공산품·백화점·유행·대중 광고로 확산되었다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"좌측 자본주의 이전 시기에 소수 엘리트가 과시·사치 소비를 하는 모습에서 가운데 산업 자본주의 게이트를 거쳐 우측 본격 소비주의가 공산품·백화점·유행·광고 네 요소로 폭발적으로 나타나는 시간 흐름 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">consumerism — 자본주의 이전부터, 그러나 산업 자본주의와 함께 본격화</text>\n  <text x=\"300\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">pre-existed · but born full-blown with industrial capitalism</text>\n\n  <!-- 좌측: 자본주의 이전 (소수 엘리트) -->\n  <g transform=\"translate(20, 50)\">\n    <text x=\"85\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">pre-capitalism — 엘리트만</text>\n    <rect x=\"0\" y=\"6\" width=\"170\" height=\"170\" fill=\"#fdf2f4\" fill-opacity=\"0.2\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 엘리트 1명 (보석·왕관 - 사치 표시) -->\n    <g transform=\"translate(85, 85)\">\n      <!-- 왕관 -->\n      <path d=\"M -12 -28 L -9 -38 L -5 -32 L 0 -42 L 5 -32 L 9 -38 L 12 -28 Z\" \n            fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 왕관 보석 -->\n      <circle cx=\"-7\" cy=\"-34\" r=\"1.5\" fill=\"#c8102e\"/>\n      <circle cx=\"0\" cy=\"-37\" r=\"1.7\" fill=\"#c8102e\"/>\n      <circle cx=\"7\" cy=\"-34\" r=\"1.5\" fill=\"#c8102e\"/>\n      <!-- 머리 -->\n      <circle cx=\"0\" cy=\"-15\" r=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-16\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"-16\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <path d=\"M -4 -10 Q 0 -8 4 -10\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <!-- 몸 + 의상 -->\n      <path d=\"M -15 -2 L -22 28 L 22 28 L 15 -2 Z\" 업 자본주의 (turning point) → full-blown consumerism (4 요소)"}, {"kind": "정리", "t": "분야는 사회·경제예요. 과시·사치 소비는 오래됐지만 ‘본격적 소비주의(consumerism)’의 탄생 시점이 핵심 쟁점. → 소비주의가 언제·무엇과 함께 본격화됐는지에 주목하며 읽으세요.", "cls": "close"}], "vocab": [["★conspicuous", "이목을 끄는·과시적인"], ["⊕emergenceemerge + ‑ence", "출현·등장"], ["◇social positioning", "사회적 지위 설정"], ["◇in place", "자리 잡은·갖춰진"], ["◇full-blown", "본격적인·완전히 발달한"], ["★consumerismconsume + ‑er + ‑ism", "소비주의"], ["restricted", "국한된·제한된"], ["◇sweep over", "휩쓸다·뒤덮다"], ["⊕cyclicalcycle + ‑ical", "주기적인·순환적인"], ["standing", "지위·신분"], ["stimulate", "자극하다·촉진하다"]], "quiz": [["이 지문의 핵심 구조는?", "pre-capitalism = 엘리트 과시 → 산업 자본주의 (turning point) → full-blown consumerism (4 요소)"], ["도식이 강조하는 결론은?", "과시·사치 소비는 자본주의 이전부터 있었고 소비문화 요소도 19세기엔 갖춰졌지만, 본격적 소비주의는 산업 자본주의의 부상과 함께 비로소 나타나 — 대량 공산품·백화점·유행·대중 광고로 확산되었다."]], "en": "Writers such as Braudel and Mukerji make an important point, namely, that conspicuous or luxury consumption did not start with the emergence of capitalism. Yet even though the fundamental elements of a consumer culture ─ the use of goods for both social positioning and as a symbolic means of self-expression ─ were both in place by the nineteenth century, it is only with the rise of industrial capitalism that a full-blown consumerism appeared. After the eighteenth century, activities that were once restricted to the elite were now practiced by the masses as well. A flood of common industrial goods swept over the market that itself expanded through new opportunities for buying. Innovations such as the department store made shopping a regular and attractive activity. Fashion became a social force and led to the cyclical abandonment and adoption of different styles whether goods were still useful or not. Status or standing was marked by consumption differences extending to the veritable limits of social groupings in society. The appearance of mass advertising aimed at ordinary citizens through newspapers, radio, popular magazines, and later television stimulated purchasing and innovated an entire language of media-assisted consumption.", "ko": "Braudel Mukerji 같은 저술가들은 중요한 점을 지적하는데, 즉 이목을 끌거나 사치스러운 소비가 자본주의의 출현과 함께 시작된 것이 아니라는 것이다. 하지만 사회적 지위를 위해서 뿐만 아니라 자기표현의 상징적 수단으로서도 상품을 사용하는 것과 같은 소비문화의 기본 요소가 19세기쯤에 이미 둘 다 존재했음에도 불구하고, 본격적인 소비주의는 산업 자본주의가 부상하고 나서야 나타났다. 18세기 이후, 한때 엘리트 층에게만 국한되었던 활동이 이제 일반 대중에 의해서도 행해졌다. 대량의 일반 공산품이 새로운 구매 기회를 통해 그 (시장) 자체가 확장되었던 시장을 휩쓸었다. 백화점과 같은 획기적인 발상은 쇼핑을 정기적이고 매력적인 활동으로 만들었다. 유행은 사회적 힘이 되어 상품이 여전히 유용하든지 그렇지 않든지 간에 주기적으로 다양한 스타일을 버리고 채택하게 만들었다. 신분이나 지위는 사회에서 사회적 집단의 실질적인 경계까지 확장된 소비의 차이에 의해 특징지어졌다. 신문, 라디오, 대중 잡지, 그리고 이후에는 텔레비전을 통한 일반 시민을 겨냥한 대중 광고의 등장은 구매를 자극했고 미디어가 매개하는 소비의 전체 언어를 새롭게 만들어냈다.", "read": [{"en": "Writers such as Braudel and Mukerji make an important point, namely, that conspicuous or luxury consumption did not start with the emergence of capitalism.", "ko": "Braudel Mukerji 같은 저술가들은 중요한 점을 지적하는데, 즉 이목을 끌거나 사치스러운 소비가 자본주의의 출현과 함께 시작된 것이 아니라는 것이다.", "chunks": [["Writers such as Braudel and Mukerji make an important point,", "Braudel과 Mukerji 같은 저술가들은 중요한 점을 지적하는데,"], ["namely, that conspicuous or luxury consumption", "즉, 과시적이거나 사치스러운 소비가"], ["did not start with the emergence of capitalism.", "자본주의의 출현과 함께 시작된 것이 아니라는 것이다."]]}, {"en": "Yet even though the fundamental elements of a consumer culture ─ the use of goods for both social positioning and as a symbolic means of self-expression ─ were both in place by the nineteenth century, it is only with the rise of industrial capitalism that a full-blown consumerism appeared.", "ko": "하지만 사회적 지위를 위해서 뿐만 아니라 자기표현의 상징적 수단으로서도 상품을 사용하는 것과 같은 소비문화의 기본 요소가 19세기쯤에 이미 둘 다 존재했음에도 불구하고, 본격적인 소비주의는 산업 자본주의가 부상하고 나서야 나타났다.", "chunks": [["Yet even though the fundamental elements of a consumer culture", "하지만 소비문화의 기본 요소가"], ["─ the use of goods for both social positioning and as a symbolic means of self-expression ─", "즉 사회적 지위와 자기표현의 상징적 수단으로 상품을 사용하는 것이"], ["were both in place by the nineteenth century,", "19세기쯤 둘 다 자리 잡았음에도,"], ["it is only with the rise of industrial capitalism", "오직 산업 자본주의의 부상과 함께"], ["that a full-blown consumerism appeared.", "본격적인 소비주의가 나타났다."]]}, {"en": "After the eighteenth century, activities that were once restricted to the elite were now practiced by the masses as well.", "ko": "18세기 이후, 한때 엘리트 층에게만 국한되었던 활동이 이제 일반 대중에 의해서도 행해졌다.", "chunks": [["After the eighteenth century,", "18세기 이후,"], ["activities that were once restricted to the elite", "한때 엘리트에게만 국한되었던 활동이"], ["were now practiced by the masses as well.", "이제 대중에 의해서도 행해졌다."]]}, {"en": "A flood of common industrial goods swept over the market that itself expanded through new opportunities for buying.", "ko": "대량의 일반 공산품이 새로운 구매 기회를 통해 그 (시장) 자체가 확장되었던 시장을 휩쓸었다.", "chunks": [["A flood of common industrial goods swept over the market", "대량의 일반 공산품이 시장을 휩쓸었다"], ["that itself expanded", "그 자체가 확장된"], ["through new opportunities for buying.", "새로운 구매 기회를 통해."]]}, {"en": "Innovations such as the department store made shopping a regular and attractive activity.", "ko": "백화점과 같은 획기적인 발상은 쇼핑을 정기적이고 매력적인 활동으로 만들었다.", "chunks": [["Innovations such as the department store", "백화점과 같은 획기적 발상은"], ["made shopping a regular and attractive activity.", "쇼핑을 정기적이고 매력적인 활동으로 만들었다."]]}, {"en": "Fashion became a social force and led to the cyclical abandonment and adoption of different styles whether goods were still useful or not.", "ko": "유행은 사회적 힘이 되어 상품이 여전히 유용하든지 그렇지 않든지 간에 주기적으로 다양한 스타일을 버리고 채택하게 만들었다.", "chunks": [["Fashion became a social force", "유행은 사회적 힘이 되었고"], ["and led to the cyclical abandonment and adoption of different styles", "다양한 스타일의 주기적 버림과 채택으로 이어졌다"], ["whether goods were still useful or not.", "상품이 여전히 유용하든 아니든."]]}, {"en": "Status or standing was marked by consumption differences extending to the veritable limits of social groupings in society.", "ko": "신분이나 지위는 사회에서 사회적 집단의 실질적인 경계까지 확장된 소비의 차이에 의해 특징지어졌다.", "chunks": [["Status or standing was marked by consumption differences", "신분이나 지위는 소비의 차이로 특징지어졌다"], ["extending to the veritable limits of social groupings in society.", "사회의 사회적 집단의 실질적 경계까지 확장된."]]}, {"en": "The appearance of mass advertising aimed at ordinary citizens through newspapers, radio, popular magazines, and later television stimulated purchasing and innovated an entire language of media-assisted consumption.", "ko": "신문, 라디오, 대중 잡지, 그리고 이후에는 텔레비전을 통한 일반 시민을 겨냥한 대중 광고의 등장은 구매를 자극했고 미디어가 매개하는 소비의 전체 언어를 새롭게 만들어냈다.", "chunks": [["The appearance of mass advertising", "대중 광고의 등장은"], ["aimed at ordinary citizens", "일반 시민을 겨냥한"], ["through newspapers, radio, popular magazines, and later television", "신문·라디오·대중 잡지, 그리고 이후 텔레비전을 통해"], ["stimulated purchasing and innovated an entire language of media-assisted consumption.", "구매를 자극하고 미디어가 매개하는 소비의 전체 언어를 새롭게 만들었다."]]}]}, {"no": "10", "title": "The Hidden Costs of Telling: Why Explicit Isn't Always Better", "ktitle": "더 명시적인 것이 늘 더 나은 교수는 아니다 — 스스로 알아내는 경험이 '주체성'을 길러, 숙련된 교사는 '설명 모드'에 시간을 적게 쓴다", "field": "심리·소통", "page": "09강 no.11", "oneline": "'더 명시적일수록 더 나은 교수'라는 통념은 틀렸다 — 스스로 알아내는 경험이 짜릿함·주체성(agency)을 길러 정체성까지 바꾸므로, '말해 주기'에는 숨은 손실이 있고 숙련된 교사는 '설명 모드'에 시간을 적게 쓴다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"좌측 학생이 스스로 알아내며 전구가 켜진 짜릿한 순간을 통해 '나는 알아내는 사람'이라는 주체적 정체성을 얻는 모습과, 우측 학생이 지시를 들으며 '나는 스스로 못 하는 사람'이라는 수동적 정체성을 갖는 모습의 대조 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">'명시적일수록 더 나은 교수'라는 통념 = 틀림</text>\n  <text x=\"300\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">hidden costs of telling · figuring out builds agency</text>\n\n  <!-- 좌측: 스스로 알아냄 -->\n  <g transform=\"translate(20, 50)\">\n    <text x=\"135\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">figure out — 스스로 알아냄</text>\n    <rect x=\"0\" y=\"6\" width=\"265\ accomplished", "숙련된·기량이 뛰어난"]], "quiz": [["이 지문의 핵심 구조는?", "figure out → 짜릿함 → 주체적 정체성 ↔ told → 숨은 손실 → 수동적 정체성"], ["도식이 강조하는 결론은?", "'더 명시적일수록 더 나은 교수'라는 통념은 틀렸다 — 스스로 알아내는 경험이 짜릿함·주체성(agency)을 길러 정체성까지 바꾸므로, '말해 주기'에는 숨은 손실이 있고 숙련된 교사는 '설명 모드'에 시간을 적게 쓴다."]], "en": "The assumption that just being more explicit will make for better instruction assumes that language is simply a delivery system for information, a literal packaging of knowledge. It is not. Each utterance in a social interaction does much more work. For example, there are hidden costs in telling people things. If a student can figure something out for him- or herself, explicitly providing the information preempts the student's opportunity to build a sense of agency and independence, which, in turn, affects the relationship between teacher and student. Think about it. When you figure something out for yourself, there is a certain thrill in the figuring. After a few successful experiences, you might start to think that figuring things out is something that you can actually do. Maybe you are even a figuring-out kind of person, encouraging an agentive dimension to identity. When you are told what to do, particularly without asking, it feels different. Being told explicitly what to do and how to do it ─ over and over again ─ provides the foundation for a different set of feelings and a different story about what you can and can't do, and who you are. The interpretation might be that you are the kind of person who cannot figure things out for yourself. This is doubtless one reason why recent research has shown that most accomplished teachers do not spend a lot of time in telling mode.", "ko": "단지 더 명시적이기만 하면 더 나은 교수에 도움이 될 것이라는 가정은 언어를 단순히 정보 전달 체계, 즉 지식을 문자 그대로 포장한 것으로 전제한다. 그렇지 않다. 사회적 상호 작용에서 각각의 발화는 훨씬 더 많은 일을 한다. 예를 들어, 사람들에게 무언가를 말해 주는 데는 숨겨진 손실이 있다. 만약 학생이 스스로 무언가를 알아낼 수 있다면, 명시적으로 정보를 제공하는 것은 주체성과 자립심을 기르려는 학생의 기회를 선점하게 되고, 이는 결국 교사와 학생 사이의 관계에 영향을 미친다. 그것에 관해 생각해 보라. 여러분이 스스로 무언가를 알아낼 때, 그 알아내는 것에는 어떤 짜릿함이 있다. 몇 번의 성공적인 경험 후에는, 무언가를 알아내는 것이 여러분이 실제로 할 수 있는 일이라고 생각하기 시작할 수도 있다. 어쩌면 여러분은 심지어 무언가를 알아내는 유형의 사람일지도 모르며, 정체성에 대한 주체적인 면을 장려한다. 특히 여러분에게 묻지도 않고, (여러분이) 무엇을 하라는 말을 들을 때, 그것은 다르게 느껴진다. 반복적으로 무엇을 하고 어떻게 할지 명시적으로 말을 듣는 것은 전혀 다른 종류의 감정들과 여러분이 할 수 있는 것과 없는 것, 그리고 여러분이 어떤 사람인지에 대한 다른 이야기를 위한 토대를 제공한다. 그 해석은 여러분이 스스로 무언가를 알아낼 수 없는 유형의 사람이라는 것일 수도 있다. 이것은 의심할 여지없이 최근 연구에서 대부분의 숙련된 교사들이 설명 중심의 방식에 많은 시간을 보내지 않는다는 것이 드러난 한 가지 이유이다.", "read": [{"en": "The assumption that just being more explicit will make for better instruction assumes that language is simply a delivery system for information, a literal packaging of knowledge.", "ko": "단지 더 명시적이기만 하면 더 나은 교수에 도움이 될 것이라는 가정은 언어를 단순히 정보 전달 체계, 즉 지식을 문자 그대로 포장한 것으로 전제한다.", "chunks": [["The assumption that just being more explicit", "단지 더 명시적이기만 하면"], ["will make for better instruction", "더 나은 교수에 도움이 될 것이라는 가정은"], ["assumes that language is simply a delivery system for information,", "언어가 단순히 정보 전달 체계라고 전제한다,"], ["a literal packaging of knowledge.", "즉 지식을 문자 그대로 포장한 것."]]}, {"en": "It is not.", "ko": "그렇지 않다.", "chunks": [["It is not.", "그렇지 않다."]]}, {"en": "Each utterance in a social interaction does much more work.", "ko": "사회적 상호 작용에서 각각의 발화는 훨씬 더 많은 일을 한다.", "chunks": [["Each utterance in a social interaction", "사회적 상호작용에서 각각의 발화는"], ["does much more work.", "훨씬 더 많은 일을 한다."]]}, {"en": "For example, there are hidden costs in telling people things.", "ko": "예를 들어, 사람들에게 무언가를 말해 주는 데는 숨겨진 손실이 있다.", "chunks": [["For example, there are hidden costs", "예를 들어, 숨겨진 손실이 있다"], ["in telling people things.", "사람들에게 무언가를 말해 주는 데에."]]}, {"en": "If a student can figure something out for him- or herself, explicitly providing the information preempts the student's opportunity to build a sense of agency and independence, which, in turn, affects the relationship between teacher and student.", "ko": "만약 학생이 스스로 무언가를 알아낼 수 있다면, 명시적으로 정보를 제공하는 것은 주체성과 자립심을 기르려는 학생의 기회를 선점하게 되고, 이는 결국 교사와 학생 사이의 관계에 영향을 미친다.", "chunks": [["If a student function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>

      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

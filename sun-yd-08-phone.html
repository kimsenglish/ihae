<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 영어독해연습 08강 12지문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 영어독해연습 08강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body>
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 영어독해연습 08강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 영어독해연습 08강 12개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */

호초)도 부서지죠.","bg":"바다는 인류가 배출한 CO₂를 흡수하는 최대의 '탄소 저장고'다. 그 흡수가 한계에 다다르면 어떤 연쇄가 일어나는지를 다룬 글.","flow":[{"kind":"원인","t":"대기 온도·해수 산성도 상승 → CO₂ 흡수 능력 저하"},{"kind":"메커니즘","t":"심해 pH 변화·석회화율 저하 (조개·산호)"},{"kind":"결과","t":"산호초 위협(해양 생물 25% 서식)·먹이망·탄소 저장 기능 손상"}],"vocab":[["atmospheric","대기의"],["overall","전체적인"],["absorb","흡수하다"],["potentially","잠재적으로"],["hinder","방해하다"],["marine","해양의"],["erode","저하시키다침식하다"],["coral reef","산호초"],["biodiversity","생물 다양성"],["severe","심각한"],["adverse","부정적인"],["function","기능"],["reservoir","저장소"]],"quiz":[["산호초가 차지하는 면적은 작은데 왜 중요한가?","지구 표면의 1% 미만이지만 전체 해양 생물 다양성의 25%가 사는 곳이기 때문이다."],["산성화가 '탄소 저장고'로서의 바다에 주는 영향은?","바다가 CO₂를 흡수하는 능력이 떨어져, 탄소 저장 기능 자체가 약해진다."]],"en":"The current trend of increasing global atmospheric temperatures and increasing seawater acidity reduces the overall capacity of oceans to absorb more CO₂. If allowed to continue unstopped, this could potentially change pH in the deep-sea regions and hinder the critical processes associated with carbon particulate burial. Similarly, complex relationships between water temperatures and ocean acidity in marine systems eroding calcification rates in shell-bearing organisms and threaten the survival of coral reefs. Coral reefs cover less than 1 percent of the Earth's surface but are home to 25 percent of all marine biodiversity. By the end of the century, current levels of carbon dioxide emissions could result in the most acidic levels of ocean pH in 20 million years, which would have severe adverse effects on ocean water chemistry (both coastal and deep sea), the marine life and food webs, and the function of oceans as a carbon reservoir.","ko":"상승하는 전 세계 대기 온도와 증가하는 해수 산성도의 현재 추세는 바다가 더 많은 이산화 탄소를 흡수할 수 있는 전체적인 능력을 감소시킨다. 이 추세가 멈추지 않고 계속되도록 허용된다면, 심해 지역의 pH를 잠재적으로 변화시킬 수 있으며, 탄소 입자 매몰과 관련된 대단히 중요한 과정들을 방해할 수 있다. 마찬가지로 해양 시스템에서 수온과 해수 산성도 간의 복잡한 관계는 껍데기를 가진 유기체들의 석회화율을 저하시켜 산호초의 생존을 위협한다. 산호초는 지구 표면의 1퍼센트도 채 되지 않는 면적을 차지하지만 전체 해양 생물 다양성의 25퍼센트의 서식지이다. 금세기 말까지는, 현재 수준의 이산화 탄소 배출량이라면 지난 \" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-weight=\"700\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\">generate</text>\n      <text x=\"60\" y=\"29\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">생성</text>\n    </g>\n    <text x=\"80\" y=\"186\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">human language</text>\n  </g>\n</svg>","caption":"방대한 텍스트 → 신경망 가중치 미세 조정 → 인간 언어 이해·해석·생성","tldr":["LLM은 방대한 데이터로 인간 언어를 이해·해석·생성하는 AI다.","신경망(딥러닝)으로 페타바이트급 데이터를 학습하며, 모델은 '가중치(parameters)'라는 숫자 뭉치다.","데이터 자체는 모델에 저장되지 않고, 새 정보에 따라 숫자(가중치)가 미세 조정된다."],"analogy":"모델이 데이터를 '저장'하는 게 아니라, 요리사가 수많은 요리를 맛본 뒤 '감(=가중치)'을 미세하게 조정하는 것과 같아요. 레시피 원본을 들고 다니는 게 아니라 손맛이 바뀌는 거죠.","bg":"LLM(대규모 언어 모델)이 '무엇을 학습하고 어떻게 작동하는가'를 설명하는 글. 핵심 오해 — 데이터가 모델 안에 저장된다? → 아니다.","flow":[{"kind":"정의","t":"LLM = 방대한 데이터로 언어 이해·생성하는 AI"},{"kind":"구조","t":"신경망 + 가중치(parameters) 숫자 뭉치"},{"kind":"학습","t":"데이터는 저장 ✗ → 새 정보에 가중치 미세 조정"}],"vocab":[["sophisticated","정교한"],["enormous","엄청난"],["neural network","신경망"],["massive","막대한거대한"],["fundamentally","근본적으로"],["string","연속"],["weight","가중치(입력 중요도의 조절 값)"],["decode","해석하다"],["contain","포함하다"],["adjust","조정되다"],["slightly","조금약간"],["be involved in ~","에 포함되어 있다"],["mark","나타내다표시하다"]],"quiz":[["LLM에서 '가중치(weights/parameters)'란?","모델을 이루는 큰 숫자들로, 코드와 결합해 학습 모델을 구성한다."],["데이터는 모델 안에 저장되는가?","아니다. 데이터는 저장되지 않고, 학습하며 모델 내부 숫자가 조금씩 조정될 뿐이다."]],"en":"Large Language Models (LLMs) are extremely strong artificial intelligence (AI) systems that use sophisticated algorithms and enormous volumes of data to understand, interpret, and generate human language. Deep learning techniques, specifically neural networks, are typically used in the construction of LLMs in order to process and learn from massive volumes of data. LLMs must be fundamentally trained on a large volume of data, typically measured in petabytes. Large strings of numbers, referred to as \"weights\" or \"parameters,\" combined with code that decodes and applies the numbers make up machine learning models. The data that models learn from is not stored in or contained in the models themselves. Rather, certain numbers within a model adjust slightly in response to new information as it gains knowledge. Large language models require the successful development of several essential steps, which are involved in the training process. Large-scale text data collection and preprocessing from a variety of sources, including books, articles, websites, and other textual corpora, usually marks the start of the process.","ko":"대규모 언어 모델(LLMs)은 인간의 언어를 이해하고 해석하며 생성하기 위해 정교한 알고리즘과 엄청난 양의 데이터를 사용하는 매우 강력한 인공 지능(AI) 시스템이다. 막대한 양의 데이터를 처리하고 학습하기 위해, LLM을 구축하는 데 딥 러닝 기법, 구체적으로는 신경망이 일반적으로 사용된다. LLM은 근본적으로 보통 페타바이트 단위로 측정되는 대량의 데이터를 바탕으로 훈련되어야 한다. 숫자를 해석하고 적용하는 코드와 결합된 '가중치' 또는 '매개 변수'라고 언급되는 숫자의 긴 연속이 기계 학습 모델을 구성한다. 모델이 학습하는 원천이 되는 데이터는 모델 자체에 저장되거나 포함되어 있는 것이 아니다. 그러기는커녕 모델이 지식을 얻음에 따라 모델 내의 특정한 수들이 새로운 정보에 반응하여 조금씩 조정된다. 대규모 언어 모델은 몇 가지 필수적인 단계의 성공적인 개발을 필요로 하는데, 그 단계는 훈련 과정에 포함되어 있다. 책, 기사, 웹 사이트 및 다른 텍스트 말뭉치를 포함한 다양한 출처로부터 대규모 텍스트를 수집하고 전처리하는 것이 보통 그 과정의 시작을 나타낸다.","read":[{"en":"Large Language Models (LLMs) are extremely strong artificial intelligence (AI) systems that use sophisticated algorithms and enormous volumes of data to understand, interpret, and generate human language.","ko":"대규모 언어 모델(LLMs)은 인간의 언어를 이해하고 해석하며 생성하기 위해 정교한 알고리즘과 엄청난 양의 데이터를 사용하는 매우 강력한 인공 지능(AI) 시스템이다.","chunks":[["Large Language Models (LLMs) are extremely strong artificial intelligence (AI) systems that use sophisticated algorithms and enormous volumes of data to understand, interpret, and generate human language.","대규모 언어 모델(LLMs)은 인간의 언어를 이해하고 해석하며 생성하기 위해 정교한 알고리즘과 엄청난 양의 데이터를 사용하는 매우 강력한 인공 지능(AI) 시스템이다."]]},{"en":"Deep learning techniques, specifically neural networks, are typically used in the construction of LLMs in order to process and learn from massive volumes of data.","ko": y2=\"52\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n    </g>\n    <text x=\"205\" y=\"158\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">\"less human\"</text>\n    <text x=\"122\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">conversation degrades</text>\n  </g>\n</svg>","caption":"기술이 효율 ↑ but 양날의 검 — 대화는 패스트푸드化, 인간성·느린 대화 능력 ↓","tldr":["이모지·스마트폰은 응답을 빠르고 효율적으로 만들지만, 그게 좋기만 한지 의문을 던진다.","기술은 효율·생산성을 높였으나 '양날의 검' — 우리가 덜 인간다워질 수 있다.","빠름에 적응하며 대화는 '패스트푸드'처럼 되고, 느린 대화를 즐기는 능력을 잃을 수 있다."],"analogy":"이메일을 며칠 기다리던 시절이 '슬로푸드'라면, 스마트폰 시대의 즉답 문화는 '패스트푸드'예요. 빠르고 편하지만, 천천히 음미하는 대화의 맛은 사라지죠.","bg":"스마트폰·이모지가 만든 '즉답 문화'를 비판적으로 보는 글. 효율의 이면(인간성·느린 소통의 상실)을 짚는다.","flow":[{"kind":"현상","t":"이모지·스마트폰 → 초고속·효율적 응답"},{"kind":"전환","t":"양날의 검 — 효율↑ but 덜 인간다워질 위험"},{"kind":"대조","t":"과거: 며칠 기다림(이메일/전화 구분) ↔ 현재: 즉답 기대"}],"vocab":[["efficient","효율적인"],["response","응답"],["be linked to ~","과 관련되다"],["separate","분리하다"],["double-edged sword","양날의 검"],["adapt to ~","에 적응하다"],["hyper-productivity","초생산성"],["conversation","대화"],["arrival","등장도착"],["urgent","긴급한"],["division","구분"],["era","시대"],["immediate","즉각적인"]],"quiz":[["글쓴이가 말하는 기술의 '양날의 검'이란?","효율·생산성은 높여주지만, 그 대가로 인간다움과 느린 대화 능력을 잃을 수 있다는 것."],["스마트폰 이전과 이후 소통의 차이는?","이전엔 이메일(며칠)과 전화(긴급)를 구분했지만, 이후엔 모든 것에 즉각적인 답을 기대한다."]],"en":"Emojis help us to be super-quick and efficient when responding. Yet, this also raises a question: is this actually a good thing? This kind of rapid response is closely linked to the development of the smartphone. Our communication is now so directly influenced by technology that the two cannot be separated. Technology has increased our efficiency and productivity, but it is a double-edged sword. We may end up less human than we ever wanted. As we adapt to rapidity and hyper-productivity, our conversation may become like fast food, and we may lose the ability to produce and enjoy slow talk. Before the arrival of the smartphone, we were able to wait a couple of days for an answer to an email, and for urgent matters, we made a call. We knew the division between these two forms of communication. In the smartphone era, we cannot and do not wait. We expect an immediate answer for everything.","ko":"이모지는 응답할 때 우리가 매우 빠르고 효율적으로 하도록 도와준다. 하지만, 이것은 '이것이 실제로 좋은 것인가?'라는 의문도 제기한다. 이러한 유형의 빠른 응답은 스마트폰의 발전과 밀접하게 관련되어 있다. 우리의 의사소통은 이제 기술의 영향을 매우 직접적으로 받고 있으므로, 둘은 분리할 수 없다. 기술은 우리의 효율성과 생산성을 높여 주었지만, 그것은 양날의 검이다. 우리는 결국 지금껏 우리가 원했던 것보다 덜 인간적인 존재가 될지도 모른다. 우리가 빠른 속도와 초생산성에 적응하면서, 우리의 대화는 마치 패스트푸드처럼 될 수도 있고, 우리는 느린 대화를 만들어 내고 즐기는 능력을 잃게 될지도 모른다. 스마트폰이 등장하기 전에는, 이메일에 대한 답장을 며칠 기다릴 수 있었고, 긴급한 일의 경우에는 전화를 걸었다. 우리는 이 두 가지 의사소통 방식 사이의 구분을 알고 있었다. 스마트폰 시대에, 우리는 기다릴 수도 없고, 기다리지도 않는다. 우리는 모든 일에 즉각적인 답변을 기대한다.","read":[{"en":"Emojis help us to be super-quick and efficient when responding.","ko":"이모지는 응답할 때 우리가 매우 빠르고 효율적으로 하도록 도와준다.","chunks":[["Emojis help us to be super-quick and efficient when responding.","이모지는 응답할 때 우리가 매우 빠르고 효율적으로 하도록 도와준다."]]},{"en":"Yet, this also raises a question: is this actually a good thing?","ko":"하지만, 이것은 '이것이 실제로 좋은 것인가?'라는 의문도 제기한다.","chunks":[["Yet, this also raises a question: is this actually a good thing?","하지만, 이것은 '이것이 실제로 좋은 것인가?'라는 의문도 제기한다."]]},{"en":"This kind of rapid response is closely linked to the development of the smartphone.","ko":"이러한 유형의 빠른 응답은 스마트폰의 발전과 밀접하게 관련되어 있다.","chunks":[["This kind of rapid response is closely linked to the development of the smartphone.","이러한 유형의 빠른 응답은 스마트폰의 발전과 밀접하게 관련되어 있다."]]},{"en":"Our communication is now so directly influenced by technology that the two cannot be separated.","ko":"우리의 의사소통은 이제 기술의 영향을 매우 직접적으로 받고 있으므로, 둘은 분리할 수 없다.","chunks":[["Our communication is now so directly influenced by technology that the two cannot be separated.","우리의 의사소통은 이제 기술의 영향을 매우 직접적으로 받고 있으므로, 둘은 분리할 수 없다."]]},{"en":"Technology has increased our efficiency and productivity, but it is a double-edged sword.","ko":"기술은 우리의 효율성과 생산성을 높여 주었지만, 그것은 양날의 검이다.","chunks":[["Technology has increased our efficiency and productivity, but it is a double-edged sword.","기술은 우리의 효율성과 생산성을 높여 주었지만, 그것은 양날의 검이다."]]},{"en":"We may end up less human than we ever wanted.","ko":"우리는 결국 지금껏 우리가 원했던 것보다 덜 인간적인 존재가 될지도 모른다.","chunks":[["We may end up less human than we ever wanted.","우리는 결국 지금껏 우리가 원했던 것보다 덜 인간적인 존재가 될지도 모른다."]]},{"en":"As we adapt to rapidity and hyper-productivity, our conversation may become like fast food, and we may lose the ability to produce and enjoy slow talk.","ko":"우리가 빠른 속도와 초생산성에 적응하면서, 우리의 대화는 마치 패스트푸드처럼 될 수도 있고, 우리는 느린 대화를 만들어 내고 즐기는 능력을 잃게 될지도 모른다.","chunks":[["As we adapt to rapidity and hyper-productivity, our conversation may become like fast food, and we may lose the ability to produce and enjoy slow talk.","우리가 빠른 속도와 초생산성에 적응하면서, 우리의 대화는 마치 패스트푸드처럼 될 수도 있고, 우리는 느린 대화를 만들어 내고 즐기는 능력을 잃게 될지도 모른다."]]},{"en":"Before the arrival of the smartphone, we were able to wait a couple of days for an answer to an email, and for urgent matters, we made a call.","ko":"스마트폰이 등장하기 전에는, 이메일에 대한 답장을 며칠 기다릴 수 있었고, 긴급한 일의 경우에는 전화를 걸었다.","chunks":[["Before the arrival of the smartphone, we were able to wait a couple of days for an answer to an email, and for urgent matters, we made a call.","스마트폰이 등장하기 전에는, 이메일에 대한 답장을 며칠 기다릴 수 있었고, 긴급한 일의 경우에는 전화를 걸었다."]]},{"en":"We knew the division between these two forms of communication.","ko":"우리는 이 두 가지 의사소통 방식 사이의 구분을 알고 있었다.","chunks":[["We knew the division between these two forms of communication.","우리는 이 두 가지 의사소통 방식 사이의 구분을 알고 있었다."]]},{"en":"In the smartphone era, we cannot and do not wait.","ko":"스마트폰 시대에, 우리는 기다릴 수도 없고, 기다리지도 않는다.","chunks":[["In the smartphone era, we cannot and do not wait.","스마트폰 시대에, 우리는 기다릴 수도 없고, 기다리지도 않는다."]]},{"en":"We expect an immediate answer for everything.","ko":"우리는 모든 일에 즉각적인 답변을 기대한다.","chunks":[["We expect an immediate answer for everything.", l=\"#c8102e\"/>\n      <text x=\"39\" y=\"-9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">visitation ↑</text>\n      <text x=\"39\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">방문 폭증</text>\n    </g>\n  </g>\n\n  <!-- 우측: 시소 (임계점) -->\n  <g transform=\"translate(360, 30)\">\n    <text x=\"115\" y=\"-12\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">과잉 관광 — 임계점</text>\n    <rect x=\"0\" y=\"0\" width=\"230\" height=\"220\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n    <!-- 시소 받침대 -->\n    <polygon points=\"108,158 122,158 115,128\" fill=\"#1a1a1a\"/>\n    <line x1=\"30\" y1=\"158\" x2=\"200\" y2=\"158\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <!-- 시소 막대 (오른쪽으로 기울어짐) -->\n    <line x1=\"38\" y1=\"115\" x2=\"170\" y2=\"148\" stroke=\"#1a1a1a\" stroke-width=\"2.5\"/>\n    <!-- 왼쪽: benefits (작음, 위로) -->\n    <g transform=\"translate(38, 93)\">\n      <rect x=\"-22\" y=\"0\" width=\"44\" height=\"22\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">benefits</text>\n      <text x=\"0\" y=\"-5\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">이익</text>\n    </g>\n    <!-- 오른쪽: costs (큼, 막대 끝에 매달림 — 박스 아래변이 막대 끝과 정렬) -->\n    <g transform=\"translate(170, 112)\">\n      <rect x=\"-30\" y=\"0\" width=\"60\" height=\"36\" fill=\"#c8102e\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <text x=\"0\" y=\"16\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">costs</text>\n      <text x=\"0\" y=\"29\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">overcrowd · poor mgmt</text>\n    </g>\n    <!-- 임계점 라벨 -->\n    <text x=\"115\" y=\"195\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">tipping point: costs &gt; benefits</text>\n    <text x=\"115\" y=\"208\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">→ 지속 가능 관광 위협</text>\n  </g>\n</svg>","caption":"위협받는 자연 → 관광객 폭증 → 비용 > 이익 임계점 → 지속 가능성 위협","tldr":["'마지막 기회 관광' — 사라져가는 자연(빙하·산호초·멸종위기종)을 보려는 여행.","방문 증가는 인식·보호 기회도 되지만 '과잉 관광' 위험도 키운다.","과잉 관광 = 비용이 이익을 넘는 임계점(tipping point) → 지속가능성 위협. 장기·사실 기반 관리 필요."],"analogy":"녹는 빙하를 '지금 아니면 못 본다'며 몰려가는 건, 마지막 한 조각 케이크에 모두가 포크를 들이대는 것과 같아요. 다 같이 달려들수록 그 케이크는 더 빨리 사라지죠.","bg":"기후변화로 위협받는 명소를 '지금 보려는' 관광 트렌드와, 그것이 부르는 과잉 관광 문제를 다룬 글.","flow":[{"kind":"동기","t":"위협받는 자연을 보려는 욕구 → 마지막 기회 관광"},{"kind":"양면","t":"인식·보호 기회 ↔ 과잉 관광 위험"},{"kind":"임계점","t":"비용 > 이익 tipping point → 지속가능성 위협"},{"kind":"대응","t":"전 이해관계자 참여·장기·사실 기반 관리"}],"vocab":[["entirely","전적으로전부"],["habitat","서식지"],["pursue","추구하다계속하다"],["refer to ~ as ... ~","을 ...이라고 부르다[일컫다]"],["diminish","줄어들다"],["glacier","빙하"],["heightened","증가한"],["resource","(보통 복수로) 자원"],["outweigh ~","보다 더 크다~보다 중요하다"],["overcrowding","과밀혼잡"],["sustainable","지속 가능한"],["implement","실행하다"],["sustainability best practice","지속 가능성 최우수 실천 사례"],["site-specific","특정 장소에 맞춘장소 맞춤형의"],["call upon ~","을 요구하다"],["destination","관광지목적지"],["engage with ~","과 관계를 맺다"]],"quiz":[["'과잉 관광(over-tourism)'을 한마디로 정의하면?","관광의 비용이 지역사회에 주는 이익을 넘어서는 임계점(tipping point)."],["마지막 기회 관광의 역설은?","사라지는 것을 보려는 방문이 오히려 그 명소를 더 위협한다는 점이다."]],"en":"Recognizing changes in the natural world caused in part or entirely due to human activities such as climate change, pollution and habitat loss - tourists are pursuing what is referred to as \"last chance\" tourism. Last chance tourism is travel motivated by the desire to see threatened or diminishing natural attractions, including glaciers, coral reefs and endangered species. Locations featuring these attractions may continue to experience heightened visitation, simultaneously creating opportunities for increased awareness and resource protection as well as increased risk of over-tourism. Over-tourism is acknowledged as a major threat to the industry. Over-tourism describes the tipping point which the costs of tourism outweigh the benefits for local communities due to overcrowding or poor management. If not managed properly, over-tourism is a threat to sustainable tourism development. The growing concern for over-tourism offers opportunities for tourism professionals to implement sustainability best practices and improve site-specific sustainable destination-level management plans. Over-tourism is a complex trend in the travel industry and calls upon destination managers to engage with all sectors and stakeholders involved in tourism towards long-term, fact-based planning to mitigate over-tourism.","ko":"기후 변화, 오염, 서식지 파괴와 같은 전적으로 또는 부분적으로 인간 활동에 의해 초래된 자연계의 변화를 인식하면서, 관광객들은 '마지막 기회 관광'이라고 불리는 형태의 여행을 추구하고 있다. 마지막 기회 관광은 빙하, 산호초, 멸종 위기의 종 등을 포함하여 위협받거나 줄어드는 자연의 명소를 보기 위한 욕구에서 비롯된 여행이다. 이러한 명소를 특징으로 하는 지역들은 방문자 증가를 지속적으로 겪을 수도 있으며, 그리하여 인식 제고 및 자원 보호의 기회와 아울러 과잉 관광의 위험 증가까지도 동시에 만들어 낸다. 과잉 관광은 그 산업에 대한 주요 위협으로 인정된다. 과잉 관광은 관광객 과밀이나 부실한 관리로 인해 지역 사회가 관광에서 얻는 이익보다 비용이 더 커지는 임계점을 가리킨다. 적절히 관리되지 않으면, 과잉 관광은 지속 가능한 관광 개발에 위협이 된다. 과잉 관광에 대한 우려가 커짐에 따라, 관광 전문가들은 지속 가능성 최우수 실천 사례를 실행하고 특정 장소에 맞춘 지속 가능한 관광지 차원의 관리 계획을 개선할 수 있는 기회를 가지게 된다. 과잉 관광은 관광 산업 내의 복합적인 추세이며, 관광지 관리자들에게 과잉 관광을 완화하기 위한 장기적이고 사실에 기반한 계획 수립을 위하여 관광과 관련된 모든 부문 및 이해 당사자들과 관계를 맺을 것을 요구한다.","read":[{"en":"Recognizing changes in the natural world caused in part or entirely due to human activities such as climate change, pollution and habitat loss - tourists are pursuing what is referred to as \"last chance\" tourism.","ko":"기후 변화, 오염, 서식지 파괴와 같은 전적으로 또는 부분적으로 인간 활동에 의해 초래된 자연계의 변화를 인식하면서, 관광객들은 '마지막 기회 \" fill=\"#1FA34A\" font-weight=\"700\">GHG ↓</text>\n      <text x=\"0\" y=\"53\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">온실가스 감소</text>\n    </g>\n    <line x1=\"105\" y1=\"40\" x2=\"105\" y2=\"160\" stroke=\"#1FA34A\" stroke-width=\"0.6\" stroke-dasharray=\"2 2\" opacity=\"0.5\"/>\n    <line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"160\" stroke=\"#1FA34A\" stroke-width=\"0.6\" stroke-dasharray=\"2 2\" opacity=\"0.5\"/>\n    <text x=\"155\" y=\"185\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">environmental + economic gains</text>\n  </g>\n</svg>","caption":"매립·강에 버려진 폐기물 → 재활용/사료/부가가치 상품 → 환경 악화↓·온실가스↓","tldr":["과일 가공 폐기물이 매립·강에 버려져 생태계를 위협한다.","폐기물을 재활용·사료·부가가치 상품으로 전환하면 환경 악화·온실가스를 줄일 수 있다.","비용·규제·인센티브 부족으로 기업은 전통적 폐기 방식을 고수 — 그래서 유망한 연구 분야다."],"analogy":"버려지던 과일 찌꺼기를 사료·상품으로 바꾸는 건, 음식물 쓰레기를 퇴비로 만들어 다시 텃밭에 쓰는 것과 같아요. 버리면 오염, 살리면 자원이 되는 거죠.","bg":"과일 가공에서 나오는 대량 폐기물을 '자원'으로 전환하는 지속가능 처리(valorization)를 다룬 글.","flow":[{"kind":"문제","t":"과일 가공 폐기물 → 매립·강 → 생태계 위협"},{"kind":"해결","t":"재활용·사료·부가가치 상품화 → 환경악화·온실가스↓"},{"kind":"장벽","t":"고비용·규제·인센티브 부족 → 전통 폐기 방식 고수"}],"vocab":[["utilize","활용하다"],["significant","중요한상당한"],["dump","버리다"],["landfill","쓰레기 매립지"],["ecosystem","생태계"],["disposal","처리처분"],["recycle","재활용하다"],["livestock feed","가축 사료"],["extract","추출하다"],["lessen","줄이다"],["degradation","악화타락"],["recover","획득하다회수하다회복하다"],["value-added","부가 가치의"],["requirement","요건"],["financial","재정적인"],["incentive","유인"],["in light of ~","을 고려하여[감안하여]"],["promising","유망한"]],"quiz":[["과일 폐기물을 가치화(valorize)하면 얻는 이점 세 가지는?","환경 악화 감소, 에너지 안보 향상, 온실가스 배출 감소."],["기업이 지속가능한 처리보다 전통적 폐기를 택하는 이유는?","높은 비용과 규제 요건, 그리고 투자 유인(financial incentives)의 부족 때문이다."]],"en":"Utilizing trash or residues from the fruit processing sector has recently become a significant challenge for agro-processing businesses and has a negative influence on the environment. The fruit processing industry produces a lot of waste dumped in landfills or rivers, threatening the ecosystem. Therefore, there is a need for disposal techniques that recycle it, provide resources for livestock feed, or extract or create goods with added value. It is possible to lessen environmental degradation, increase energy security, and cut greenhouse gas emissions by turning wastes collected from the fruit processing industry into valuable products. It is believed that using fruit waste from processing can help the food industry recover value-added products and make operations commercially viable. Industries prioritize traditional waste disposal methods over sustainable solutions due to high costs and regulatory requirements and lack financial incentives to invest in food waste processing. In light of this, it is a promising field of research to use wastes from the processing of fruit to create goods with value added.","ko":"과일 가공 분야에서 발생하는 쓰레기나 잔여물을 활용하는 것은 최근 농산물 가공 업계에 중요한 과제가 되었으며, 환경에 부정적인 영향을 미친다. 과일 가공 산업은 쓰레기 매립지나 강에 버려지는 많은 폐기물을 생산하며, 이는 생태계를 위협한다. 그러므로 폐기물을 재활용하거나 가축 사료 자원으로 제공하거나 부가 가치가 있는 상품을 추출하거나 만드는 처리 기술이 필요하다. 과일 가공 산업에서 수거된 폐기물을 가치 있는 제품으로 전환함으로써 환경의 악화를 줄이고, 에너지 안보를 높이며, 온실가스 배출을 줄일 수 있다. 가공 과정에서 나온 과일 폐기물을 활용하면 식품 산업이 부가 가치 제품을 획득하고 운영을 상업적으로 실행 가능하게 만드는 데 도움이 될 수 있다고 믿어진다. (산업계는 높은 비용과 규제 요건 때문에 지속 가능한 해결책보다는 전통적인 폐기물 처리 방법을 우선시하며, 식품 폐기물 처리에 투자할 재정적 유인이 부족하다. ) 이것을 고려하여 과일 가공 과정에서 발생한 폐기물을 활용해 부가 가치가 있는 상품을 만드는 것은 유망한 연구 분야이다.","read":[{"en":"Utilizing trash or residues from the fruit processing sector has recently become a significant challenge for agro-processing businesses and has a negative influence on the environment.","ko":"과일 가공 분야에서 발생하는 쓰레기나 잔여물을 활용하는 것은 최근 농산물 가공 업계에 중요한 과제가 되었으며, 환경에 부정적인 영향을 미친다.","chunks":[["Utilizing trash or residues from the fruit processing sector has recently become a significant challenge for agro-processing businesses and has a negative influence on the environment.","과일 가공 분야에서 발생하는 쓰레기나 잔여물을 활용하는 것은 최근 농산물 가공 업계에 중요한 과제가 되었으며, 환경에 부정적인 영향을 미친다."]]},{"en":"The fruit processing industry produces a lot of waste dumped in landfills or rivers, threatening the ecosystem.","ko":"과일 가공 산업은 쓰레기 매립지나 강에 버려지는 많은 폐기물을 생산하며, 이는 생태계를 위협한다.","chunks":[["The fruit processing industry produces a lot of waste dumped in landfills or rivers, threatening the ecosystem.","과일 가공 산업은 쓰레기 매립지나 강에 버려지는 많은 폐기물을 생산하며, 이는 생태계를 위협한다."]]},{"en":"Therefore, there is a need for disposal techniques that recycle it, provide resources for livestock feed, or extract or create goods with added value.","ko":"그러므로 폐기물을 재활용하거나 가축 사료 자원으로 제공하거나 부가 가치가 있는 상품을 추출하거나 만드는 처리 기술이 필요하다.","chunks":[["Therefore, there is a need for disposal techniques that recycle it, provide resources for livestock feed, or extract or create goods with added value.","그러므로 폐기물을 재활용하거나 가축 사료 자원으로 제공하거나 부가 가치가 있는 상품을 추출하거나 만드는 처리 기술이 필요하다."]]},{"en":"It is possible to lessen environmental degradation, increase energy security, and cut greenhouse gas emissions by turning wastes collected from the fruit processing industry into valuable products.","ko":"과일 가공 산업에서 수거된 폐기물을 가치 있는 제품으로 전환함으로써 환경의 악화를 줄이고, 에너지 안보를 높이며, 온실가스 배출을 줄일 수 있다.","chunks":[["It is possible to lessen environmental degradation, increase energy security, and cut greenhouse gas emissions by turning wastes collected from the fruit processing industry into valuable products.","과일 가공 산업에서 수거된 폐기물을 가치 있는 제품으로 전환함으로써 환경의 악화를 줄이고, 에너지 안보를 높이며, 온실가스 배출을 줄일 수 있다."]]},{"en":"It is believed that using fruit waste from processing can help the food industry recover value-added products and make operations commercially viable.","ko":"가공 과정에서 나온 과일 폐기물을 활용하면 식품 산업이 부가 가치 제품을 획득하고 운영을 상업적으로 실행 가능하게 만드는 데 도움이 될 수 있다고 믿어진다.","chunks":[["It is believed that using fruit waste from processing can help the food industry recover value-added products and make operations commercially viable.","가공 과정에서 나온 과일 폐기물을 활용하면 식품 산업이 부가 가치 제품을 획득하고 운영을 상업적으로 실행 가능하게 만드는 데 도움이 될 수 있다고 믿어진다."]]},{"en":"Industries prioritize traditional waste disposal methods over sustainable solutions due to high costs and regulatory requirements and lack financial incentives to invest in food waste processing.","ko":"(산업계는 높은 비용과 규제 요건 때문에 지속 가능한 해결책보다는 전통적인 폐기물 처리 방법을 우선시하며, 식품 폐기물 처리에 투자할 재정적 유인이 부족하다.","chunks":[["Industries prioritize traditional waste disposal methods over sustainable solutions due to high costs and regulatory requirements and lack financial incentives to invest in food waste processing.","(산업계는 높은 비용과 규제 요건 때문에 지속 가능한 해결책보다는 전통적인 폐기물 처리 방법을 우선시하며, 식품 폐기물 처리에 투자할 재정적 유인이 부족하다."]]},{"en":"In light of this, it is a promising field of research to use wastes from the processing of fruit to create goods with value added.","ko":") 이것을 고려하여 과일 가공 과정에서 발생한 폐기물을 활용해 부가 가치가 있는 상품을 만드는 것은 유망한 연구 분야이다.","chunks":[["In light of this, it is a promising field of research to use wastes from the processing of fruit to create goods with value added.",") 이것을 고려하여 과일 가공 과정에서 발생한 폐기물을 활용해 부가 가치가 있는 상품을 만드는 것은 유망한 연구 분야이다."]]}]},{"no":"6","title":"Hard Skills, Soft Skills, and the Workforce","ktitle":"직무 수행에 필요한 하드 스킬과 소프트 스킬","field":"직업·역량","page":"수능특강 영어독해연습 08강 · 지문 6","oneline":"하드='what'(절차·학위) + 소프트='how'(대인) — 둘 다 동등히 중요","metaphor":"<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 'what' 박스에 학위·자격·절차 등 하드 스킬을, 오른쪽 'how' 박스에 대인 관계·소통 등 소프트 스킬을 두고, 가운데 더하기 기호를 거쳐 아래쪽으로 '균형 잡힌 인재'로 통합되는 대조·통합 그림\">\n  <g transform=\"translate(20, 30)\">\n    <text x=\"120\" y=\"-12\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Hard Skills — what</text>\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"135\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <g transform=\"translate(50, 50)\">\n      <polygon points=\"-18,-3 0,-12 18,-3 0,6\" fill=\"#1a1a1a\"/>\n      <rect x=\"-1.5\" y=\"-3\" width=\"3\" height=\"14\" fill=\"#1a1a1a\"/>\n      <line x1=\"-1.5\" y1=\"11\" x2=\"-7\" y2=\"14\" stroke=\"#1a1a1a\" stroke-widt ext x=\"120\" y=\"-12\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Soft Skills — how</text>\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"135\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <g transform=\"translate(45, 55)\">\n      <circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"-3\" cy=\"-1\" r=\"0.8\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-1\" r=\"0.8\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 4 Q 0 6 3 4\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"9\" x2=\"0\" y2=\"32\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"16\" x2=\"-8\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"16\" x2=\"8\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"48\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">communication</text>\n    </g>\n    <g transform=\"translate(75, 38)\">\n      <path d=\"M 0 0 Q -3 -10 8 -10 L 30 -10 Q 38 -10 38 -3 Q 38 5 30 5 L 14 5 L 8 12 L 9 5 Q 0 5 0 0 Z\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <line x1=\"8\" y1=\"-4\" x2=\"30\" y2=\"-4\" stroke=\"#1FA34A\" stroke-width=\"0.7\"/>\n      <line x1=\"8\" y1=\"0\" x2=\"22\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"0.7\"/>\n    </g>\n    <g transform=\"translate(125, 55)\">\n      <circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"-3\" cy=\"-1\" r=\"0.8\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-1\" r=\"0.8\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 4 Q 0 6 3 4\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"9\" x2=\"0\" y2=\"32\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"16\" x2=\"-8\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"16\" x2=\"8\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    </g>\n    <g transform=\"translate(180, 55)\">\n      <path d=\"M -8 0 Q -8 -10 -2 -10 Q 4 -10 4 -3 L 4 8 Q 4 14 -2 14 Q -8 14 -8 8 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"-5\" y1=\"-3\" x2=\"-5\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n      <line x1=\"-1\" y1=\"-7\" x2=\"-1\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n      <line x1=\"2\" y1=\"-3\" x2=\"2\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n      <text x=\"-2\" y=\"33\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">teamwork</text>\n    </g>\n    <text x=\"120\" y=\"115\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">\"how\"</text>\n    <text x=\"120\" y=\"128\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">소통 · 협력 · 태도</text>\n  </g>\n  <g transform=\"translate(285, 178)\">\n    <line x1=\"5\" y1=\"3\" x2=\"25\" y2=\"3\" stroke=\"#1FA34A\" stroke-width=\"2.5\"/>\n    <line x1=\"5\" y1=\"11\" x2=\"25\" y2=\"11\" stroke=\"#1FA34A\" stroke-width=\"2.5\"/>\n  </g>\n  <g transform=\"translate(80, 205)\">\n    <rect x=\"0\" y=\"0\" width=\"440\" height=\"58\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <g transform=\"translate(35, 29)\">\n      <circle cx=\"0\" cy=\"-5\" r=\"9\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <circle cx=\"-3\" cy=\"-6\" r=\"0.9\" fill=\"#1FA34A\"/>\n      <circle cx=\"3\" cy=\"-6\" r=\"0.9\" fill=\"#1FA34A\"/>\n      <path d=\"M -3 -1 Q 0 1 3 -1\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"4\" x2=\"0\" y2=\"22\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <line x1=\"0\" y1=\"10\" x2=\"-9\" y2=\"16\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"10\" x2=\"9\" y2=\"16\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n    </g>\n    <text x=\"220\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">balanced professional — both equally vital</text>\n    <text x=\"220\" y=\"46\" font-family=\"Noto Serif KR\" font-size=\"11\" text-anchor=\"middle\" fill=\"#5e5e5e\">현대 기업이 찾는 인재 — what과 how를 동등하게</text>\n  </g>\n</svg>","caption":"하드='what'(절차·학위) + 소프트='how'(대인) — 둘 다 동등히 중요","tldr":["하드 스킬 = 직무 수행에 필요한 절차적·기술적 전문성, 즉 '무엇(what)'.","소프트 스킬 = 그 일을 '어떻게(how)' 하는가 — 대인 서비스 경제에서 똑같이 중요.","그래서 현대 기업은 하드+소프트를 고루 갖춘 졸업생을 찾는다."],"analogy":"하드 스킬이 요리 레시피와 칼질 솜씨라면, 소프트 스킬은 손님을 대하는 태도예요. 맛만 좋고 서비스가 엉망인 식당이 오래 못 가듯, 둘 다 있어야 하죠.","bg":"취업·직무 역량을 하드 스킬(what)과 소프트 스킬(how)로 나누고, 둘의 균형을 강조하는 글. (문장 삽입 유형)","flow":[{"kind":"정의1","t":"하드 스킬 = 절차·기술 전문성 (what) · 학위·교육으로 습득"},{"kind":"정의2","t":"소프트 스킬 = 일하는 방식 (how) · 대인 역량"},{"kind":"결론","t":"둘 다 동등히 중요 → 기업은 균형 갖춘 인재 선호"}],"vocab":[["procedural","절차적인"],["expertise","전문성전문 지식"],["aptly put","적절히 표현하자면"],["attribute","속성자질"],["critical","대단히 중요한"],["thrive","성공하다번성하다"],["workforce","노동 시장"],["acquire","습득하다"],["accounting","회계학"],["degree","학위"]],"quiz":[["하드 스킬과 소프트 스킬을 'what/how'로 구분하면?","하드 = 해야 할 일 그 자체(what), 소프트 = 그것을 하는 방식(how)."],["현대 기업이 졸업생에게 바라는 것은?","하드 스킬과 소프트 스킬을 고루 갖춘(good mix) 인재."]],"en":"Hard skills are defined as the specific procedural skills and technical expertise that are required to perform a job, or more aptly put, the 'what' needs to be done. (A) We think not. In fact, these soft attributes, or 'how' something is done, are equally critical and allow professionals to thrive in the interpersonal service orientated economy faced daily. This is why modern businesses are looking for graduates with a good mix of hard and soft skills as they enter the workforce. (B) These skills are clearly listed in the job description and are acquired through more highly specific education and training programs. Hard skills are the skills we think of when considering a professional college degree. (C) Examples include accountants, who must have accounting degrees, lawyers, who must have law degrees, and doctors, who must have medical degrees. But does that mean that these professionals do not need soft skills?","ko":"하드 스킬은 어떤 일을 수행하는 데 요구되는 특정한 절차적 기술들과 기술적 전문성으로 정의되며, 더 적절히 표현하자면 해야 할 '무엇'을 의미한다. (A) 우리는 그렇지 않다고 생각한다. 사실, 이러한 소프트한 속성들, 즉, 어떤 일이 '어떻게' 수행되는지는 똑같이 대단히 중요하며, 전문가들이 매일 직면하는 대인 서비스 지향적 경제에서 성공할 수 있게 해 준다. 이것이 노동 시장에 진입할 때 현대의 기업들이 하드 스킬과 소프트 스킬을 적절히 갖춘 졸업생들을 찾는 이유이다. (B) 이러한 기술들은 직무 설명서에 명확히 명시되어 있으며, 보다 고도로 특화된 교육 및 훈련 과정을 통해 습득된다. 하드 스킬은 우리가 전문적인 대학 학위를 고려할 때 떠올리게 되는 그 기술이다. (C) 예시에는 회계학 학위가 반드시 있어야 하는 회계사, 법학 학위가 반드시 있어야 하는 변호사, 그리고 의학 학위가 반드시 있어야 하는 의사가 포함된다. 그러나 그것은 이러한 전문가들이 소프트 스킬을 필요로 하지 않는다는 의미일까?","read":[{"en":"Hard skills are defined as the specific procedural skills and technical expertise that are required to perform a job, or more aptly put, the 'what' needs to be done.","ko":"하드 스킬은 어떤 일을 수행하는 데 요구되는 특정한 절차적 기술들과 기술적 전문성으로 정의되며, 더 적절히 표현하자면 해야 할 '무엇'을 의미한다.","chunks":[["Hard skills are defined as the specific procedural skills and technical expertise that are required to perform a job, or more aptly put, the 'what' needs to be done.","하드 스킬은 어떤 일을 수행하는 데 요구되는 특정한 절차적 기술들과 기술적 전문성으로 정의되며, 더 적절히 표현하자면 해야 할 '무엇'을 의미한다."]]},{"en":"(A) We think not.","ko":"(A) 우리는 그렇지 않다고 생각한다.","chunks":[["(A) We think not.","(A) 우리는 그렇지 않다고 생각한다."]]},{"en":"In fact, these soft attributes, or 'how' something is done, are equally critical and allow professionals to thrive in the interpersonal service orientated economy faced daily.","ko":"사실, 이러한 소프트한 속성들, 즉, 어떤 일이 '어떻게' 수행되는지는 똑같이 대단히 중요하며, 전문가들이 매일 직면하는 대인 서비스 지향적 경제에서 성공할 수 있게 해 준다.","chunks":[["In fact, these soft attributes, or 'how' something is done, are equally critical and allow professionals to thrive in the interpersonal service orientated economy faced daily.","사실, 는 의미일까?"]]}]},{"no":"7","title":"Trade as the Foundation of Human Civilization","ktitle":"무역의 발전과 문명 형성","field":"역사·경제·인류","page":"수능특강 영어독해연습 08강 · 지문 7","oneline":"물물교환 → 구석기·신석기 → 해상·실크로드 → 현대 — 무역은 인간 생활의 필연","metaphor":"<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"아래쪽 가로로 긴 시간 화살표 위에 물물교환·구석기·신석기·해상 무역과 실크로드·현대의 네 단계 마커가 놓이고, 각 마커 위에 손·도구·배·낙타·지구 아이콘이 시간 순서대로 배치된 과정·연표 그림\">\n  <text x=\"300\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">무역 — 인간 생활의 필연</text>\n  <text x=\"300\" y=\"36\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">a necessity of human life — from barter to global system</text>\n  <g transform=\"translate(40, 180)\">\n    <line x1=\"0\" y1=\"0\" x2=\"510\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n    <polygon points=\"510,0 500,-6 500,6\" fill=\"#1a1a1a\"/>\n    <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">pre-coin</text>\n    <text x=\"510\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">now</text>\n    <text x=\"255\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">time — the necessity persists</text>\n  </g>\n  <!-- 단계 1 -->\n  <g transform=\"translate(80, 180)\">\n    <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#1FA34A\"/>\n    <line x1=\"0\" y1=\"-6\" x2=\"0\" y2=\"-50\" stroke=\"#1FA34A\" stroke-width=\"1.2\" stroke-dasharray=\"2 2\"/>\n    <g transform=\"translate(0, -85)\">\n      <path d=\"M -22 8 Q -22 -2 -16 -2 Q -10 -2 -8 4 L -8 10 L -22 10 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"-19\" y1=\"0\" x2=\"-19\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"0.6\"/>\n      <line x1= 무역을 단순 경제활동이 아니라 '문명을 형성한 동력'으로 보는 글. 시간 순(구석기→현대) 전개.","flow":[{"kind":"전제","t":"무역 = 인간 존재의 필연 (재화·서비스·아이디어 교환)"},{"kind":"기원","t":"화폐 이전 — 선물·공물·물물교환"},{"kind":"발전","t":"구석기·신석기 → 장거리 무역"},{"kind":"결과","t":"해상무역·실크로드 → 현대 상업 체계의 토대"}],"vocab":[["inevitable","피할 수 없는"],["existence","생활삶존재"],["engage in ~","에 참여하다"],["transaction","거래"],["adapt ~ to ... ~","을 ...에 맞추어 조정하다"],["predatory","약탈하는"],["prehistoric","선사 시대의"],["tribute","공물"],["barter economy","물물 교환 경제"],["hunter-gatherer community","수렵 채집 공동체"],["strive","노력하다애쓰다"],["self-sufficiency","자급자족"],["long-distance","장거리의"],["impulse","충동"],["fuel","(비유적으로) ~의 원동력이 되다연료를 공급하다"],["immense","거대한"],["civilisation","문명"],["maritime","해상의바다의해양의"],["the Mediterranean","지중해"],["establish","확립하다"],["foundation","토대기초"],["commercial","상업의"]],"quiz":[["화폐 발명 이전의 무역은 어떤 형태였나?","선물, 공물(tribute), 또는 물물교환 경제(barter economy)의 일부로 이루어졌다."],["현대 상업·무역 체계의 토대를 만든 것은?","지중해·인도양·남중국해를 잇는 해상 무역과 실크로드의 형성이다."]],"en":"Trade is an inevitable activity of human existence. In all periods, people have engaged in transactions that involve the exchange of goods, services, and ideas. Not only has trade helped societies adapt their responses to risk and uncertainty but it has also played a central role in intergroup relations be they cordial or predatory. Long before the invention of money for private exchange, elements of trade formed part of the earliest human interactions. Among prehistoric people, goods, services, and ideas were exchanged as gifts, tributes, or as part of a barter economy. Beyond early hunter-gatherer communities which strove to maintain self-sufficiency, long-distance trade could be found. Indeed, since its beginnings in the Palaeolithic and Neolithic periods, the impulse to trade has developed, eventually fueling immense civilisations and empires. It was the development of maritime trade connecting the Mediterranean, Indian Ocean, and South China Sea, along with the creation of the Silk Road, that established how we recognise today as the foundations of the world's modern commercial and trading systems.","ko":"무역은 인간 생활의 피할 수 없는 활동이다. 모든 시대에 걸쳐 사람들은 재화, 서비스, 아이디어의 교환을 포함하는 거래에 참여해 왔다. 무역은 사회가 위험과 불확실성에 맞추어 반응을 조정하는 데 도움을 주었을 뿐 아니라, 우호적이든 약탈적이든 집단 간 관계에서 중심적인 역할을 해왔다. 사적인 교환을 위한 화폐가 발명되기 훨씬 이전에 무역의 요소들은 가장 초기의 인간 상호 작용의 일부를 형성했다. 선사 시대 사람들 사이에서는 재화, 서비스, 아이디어가 선물, 공물 또는 물물 교환 경제의 일부로 교환되었다. 자급자족을 유지하기 위해 노력한 초기의 수렵 채집 공동체를 넘어서면 장거리 무역이 발견될 수 있었다. 실제로 구석기 시대와 신석기 시대의 시작 이래로 무역에 대한 충동이 발전하여 결국 거대한 문명과 제국의 원동력이 되었다. 오늘날 우리가 세계 현대 상업 및 무역 시스템의 토대로 인식하는 것을 확립한 것은 지중해, 인도양, 남중국해를 연결하는 해상 무역의 발전과 실크로드의 개척이었다.","read":[{"en":"Trade is an inevitable activity of human existence.","ko":"무역은 인간 생활의 피할 수 없는 활동이다.","chunks":[["Trade is an inevitable activity of human existence.","무역은 인간 생활의 피할 수 없는 활동이다."]]},{"en":"In all periods, people have engaged in transactions that involve the exchange of goods, services, and ideas.","ko":"모든 시대에 걸쳐 사람들은 재화, 서비스, 아이디어의 교환을 포함하는 거래에 참여해 왔다.","chunks":[["In all periods, people have engaged in transactions that involve the exchange of goods, services, and ideas.","모든 시대에 걸쳐 사람들은 재화, 서비스, 아이디어의 교환을 포함하는 거래에 참여해 왔다."]]},{"en":"Not only has trade helped societies adapt their responses to risk and uncertainty but it has also played a central role in intergroup relations be they cordial or predatory.","ko":"무역은 사회가 위험과 불확실성에 맞추어 반응을 조정하는 데 도움을 주었을 뿐 아니라, 우호적이든 약탈적이든 집단 간 관계에서 중심적인 역할을 해왔다.","chunks":[["Not only has trade helped societies adapt their responses to risk and uncertainty but it has also played a central role in intergroup relations be they cordial or predatory.","무역은 사회가 위험과 불확실성에 맞추어 반응을 조정하는 데 도움을 주었을 뿐 아니라, 우호적이든 약탈적이든 집단 간 관계에서 중심적인 역할을 해왔다."]]},{"en":"Long before the invention of money for private exchange, elements of trade formed part of the earliest human interactions.","ko":"사적인 교환을 위한 화폐가 발명되기 훨씬 이전에 무역의 요소들은 가장 초기의 인간 상호 작용의 일부를 형성했다.","chunks":[["Long before the invention of money for private exchange, elements of trade formed part of the 0\" stroke=\"#999\" stroke-width=\"1\"/>\n        <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"40\" stroke=\"#999\" stroke-width=\"1\"/>\n        <path d=\"M 0 8 Q 15 18 28 28 Q 38 35 48 38\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n        <polygon points=\"48,38 42,35 42,42\" fill=\"#c8102e\"/>\n      </g>\n      <text x=\"100\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#c8102e\">low employer</text>\n      <text x=\"100\" y=\"46\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#c8102e\">growth</text>\n      <text x=\"100\" y=\"63\" font-family=\"Noto Serif KR\" font-size=\"9.5\" fill=\"#5e5e5e\">고용주 성장률 ↓</text>\n      <text x=\"100\" y=\"80\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#5e5e5e\">→ 떠날 push</text>\n    </g>\n    <g transform=\"translate(0, 115)\">\n      <rect x=\"0\" y=\"0\" width=\"190\" height=\"95\" rx=\"5\" fill=\"#f0faf3\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <g transform=\"translate(30, 50)\">\n        <ellipse cx=\"0\" cy=\"10\" rx=\"14\" ry=\"4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <ellipse cx=\"0\" cy=\"5\" rx=\"14\" ry=\"4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <ellipse cx=\"0\" cy=\"0\" rx=\"14\" ry=\"4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <ellipse cx=\"0\" cy=\"-5\" rx=\"14\" ry=\"4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">$</text>\n        <text x=\"0\" y=\"2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">$</text>\n      </g>\n      <text x=\"100\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#1FA34A\">high pay</text>\n      <text x=\"100\" y=\"46\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#1FA34A\">+ savings</text>\n      <text x=\"100\" y=\"63\" font-family=\"Noto Serif KR\" font-size=\"9.5\" fill=\"#5e5e5e\">고연봉 + 저축</text>\n      <text x=\"100\" y=\"80\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#5e5e5e\">→ 비상금(buffer)</text>\n    </g>\n  </g>\n</svg>","caption":"U자 분포 — 중간은 안 떠남, 양 극단(게으름뱅이 + 스타)만 떠난다","tldr":["고용주의 성장률이 떨어지면 직원이 떠나 창업할 가능성이 커진다(머무를 매력·기회비용↓).","이직·창업 가능성은 본인 성과와도 연결 — 중간 성과자가 가장 안 떠난다.","양 극단이 떠난다: 잃을 게 적은 저성과자('slug')와 자영업으로 큰돈을 벌 수 있는 고성과자('star'). 저축이 많으면 더 잘 떠난다."],"analogy":"회사를 떠나 창업하는 건 다이빙대에서 뛰어내리는 것과 같아요. 잃을 게 없는 사람(저성과자)과 멋지게 입수할 자신이 있는 사람(고성과자)만 뛰고, 어중간한 중간은 망설이죠.","bg":"'어떤 직원이 회사를 떠나 창업하는가'를 분석한 글. 핵심은 성과 분포의 'U자' 패턴.","flow":[{"kind":"조건","t":"고용주 성장률↓ → 머무를 매력·기회비용↓ → 창업 ↑"},{"kind":"패턴","t":"성과 U자 분포 — 중간은 안 떠남"},{"kind":"양극단","t":"저성과자(slug, 잃을 것↓) + 고성과자(star, 벌 잠재력↑)"},{"kind":"변수","t":"저축(nest egg) 많으면 도약 가능성↑"}],"vocab":[["employee","직원"],["founder","창업자설립자"],["employer","고용주"],["growth rate","성장률"],["attractiveness","매력"],["opportunity cost","기회비용"],["likelihood","가능성"],["performance","성과실적"],["distribution","분포"],["potential","잠재력"],["wage","임금"],["self-employed","자영업을 하는"],["make the leap","과감한 결정을 내리다"]],"quiz":[["창업을 위해 회사를 가장 적게 떠나는 직원은?","성과가 분포의 중간(middle)에 있는 직원."],["고성과자가 저축을 많이 했을 때 어떤 영향이 있나?","그 종잣돈(nest egg) 덕분에 창업으로 도약할 가능성이 더 커진다."]],"en":"Employees tend to leave companies to become founders when their employers' growth rates begin to fall, reducing the attractiveness of staying there and the opportunity costs of becoming founders. The likelihood of an employee leaving to become a founder has also been linked to the employee's own performance. Employees whose performance was in the middle of the distribution were the least likely to leave; the most likely were the poor-performing employees (the \"slugs\" whose pay wasn't high and who had the least to lose by leaving to found a startup) and the high-performing employees (the \"stars\" who had the potential to earn high wages by becoming self-employed). Although high-paid employees may be less likely than lower-paid employees to walk away from their salaries, if they have saved a high percentage of their earnings over the years, that nest egg may make them more likely to make the leap than if they hadn't saved.","ko":"고용주의 성장률이 하락하기 시작하여 그곳에 계속 머무는 매력과 창업자가 되는 기회비용을 줄일 때, 직원들은 회사를 떠나 창업자가 되는 경향이 있다. 직원이 창업자가 되기 위해 떠날 가능성은 직원 자신의 성과와도 관련이 있었다. 성과 분포의 중간에 있는 직원들은 떠날 가능성이 가장 적었으며, 떠날 가능성이 가장 높은 사람들은 성과가 좋지 않은 직원들(급여가 높지 않고 스타트업을 창업하기 위해 떠남으로써 잃을 것이 가장 적었던 '게으름뱅이'들)과 성과가 높은 직원들(자영업자가 됨으로써 높은 임금을 벌 수 있는 잠재력을 가진 '스타'들)이었다. 비록 고액 연봉을 받는 직원들이 임금이 더 적은 직원들보다 자신의 급여를 포기할 가능성이 더 적을지라도, 만약 그들이 수년간 수입의 높은 비율을 저축했다면, 그 비상금은 그들이 저축하지 않았을 때보다 과감한 결정을 내릴 가능성을 높일 수도 있다.","read":[{"en":"Employees tend to leave companies to become founders when their employers' growth rates begin to fall, reducing the attractiveness of staying there and the opportunity costs of becoming founders.","ko":"고용주의 성장률이 하락하기 시작하여 그곳에 계속 머무는 매력과 창업자가 되는 기회비용을 줄일 때, 직원들은 회사를 떠나 창업자가 되는 경향이 있다.","chunks":[["Employees tend to leave companies to become founders when their employers' growth rates begin to fall, reducing the attractiveness of staying there and the opportunity costs of becoming founders.","고용주의 성장률이 하락하기 시작하여 그곳에 계속 머무는 매력과 창업자가 되는 기회비용을 줄일 때, 직원들은 회사를 떠나 창업자가 되는 경향이 있다."]]},{"en":"The likelihood of an employee leaving to become a founder has also been linked to the employee's own performance.","ko":"직원이 창업자가 되기 위해 떠날 가능성은 직원 자신의 성과와도 관련이 있었다.","chunks":[["The likelihood of an employee leaving to become a founder has also been linked to the employee's own performance.","직원이 창업자가 되기 위해 떠날 가능성은 직원 자신의 성과와도 관련이 있었다."]]},{"en":"Employees whose performance was in the middle of the distribution were the least likely to leave; the most likely were the poor-performing employees (the \"slugs\" whose pay wasn't high and who had the least to lose by leaving to found a startup) and the high-performing employees (the \"stars\" who had the potential to earn high wages by becoming self-employed).","ko":"성과 분포의 중간에 있는 직원들은 떠날 가능성이 가장 적었으며, 떠날 가능성이 가장 높은 사람들은 성과가 좋지 않은 직원들(급여가 높지 않고 스타트업을 창업하기 위해 떠남으로써 잃을 것이 가장 적었던 '게으름뱅이'들)과 성과가 높은 직원들(자영업자가 됨으로써 높은 임금을 벌 수 있는 잠재력을 가진 '스타'들)이었다.","chunks":[["Employees whose performance was in the middle of the distribution were the least likely to leave; the most likely were the poor-performing employees (the \"slugs\" whose pay wasn't high and who had the least to lose by leaving to found a startup) and the high-performing employees (the \"stars\" who had the potential to earn high wages by becoming self-employed).","성과 분포의 중간에 있는 직원들은 떠날 가능성이 가장 적었으며, 떠날 가능성이 가장 높은 사람들은 성과가 좋지 않은 직원들(급여가 높지 않고 스타트업을 창업하기 위해 떠남으로써 잃을 것이 가장 적었던 '게으름뱅이'들)과 성과가 높은 직원들(자영업자가 됨으로써 높은 임금을 벌 수 있는 잠재력을 가진 '스타'들)이었다."]]},{"en":"Although high-paid employees may be less likely than lower-paid employees to walk away from their salaries, if they have saved a high percentage of their earnings over the years, that nest egg may make them more likely to make the leap than if they hadn't saved.","ko":"비록 고액 연봉을 받는 직원들이 임금이 더 적은 직원들보다 자신의 급여를 포기할 가능성이 더 적을지라도, 만약 그들이 수년간 수입의 높은 비율을 저축했다면, 그 비상금은 그들이 저축하지 않았을 때보다 과감한 결정을 내릴 가능성을 높일 수도 있다.","chunks":[["Although high-paid employees may be less likely than lower-paid employees to walk away from their salaries, if they have saved a high percentage of their earnings over the years, that nest egg may make them more likely to make the leap than if they hadn't saved.","비록 고액 연봉을 받는 직원들이 임금이 더 적은 직원들보다 자신의 급여를 포기할 가능성이 더 적을지라도, 만약 그들이 수년간 수입의 높은 비율을 저축했다면, 그 비상금은 그들이 저축하지 않았을 때보다 과감한 결정을 내릴 가능성을 높일 수도 있다."]]}]},{"no":"9","title":"Body Temperature and Subjective Time","ktitle":"체온에 따른 상대적 시간 지각","field":"생리·심리·시간지각","page":"수능특강 영어독해연습 08강 · 지문 9","oneline":"체온 ↓ → 체내 시계 ↓ → 외부 사건 빨라 보임 · 그래도 주관적 템포는 거의 차이 rif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">\"딱 적당\"</text>\n  </g>\n\n  <!-- 우측: 따뜻한 체온 -->\n  <g transform=\"translate(290, 30)\">\n    <text x=\"120\" y=\"-13\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">따뜻한 체온 — warm</text>\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"215\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n    <!-- 온도계 (높음) -->\n    <g transform=\"translate(40, 40)\">\n      <rect x=\"-5\" y=\"0\" width=\"10\" height=\"60\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <rect x=\"-3\" y=\"8\" width=\"6\" height=\"50\" fill=\"#c8102e\"/>\n      <circle cx=\"0\" cy=\"63\" r=\"8\" fill=\"#c8102e\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"5\" y1=\"10\" x2=\"9\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n      <line x1=\"5\" y1=\"22\" x2=\"9\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n      <line x1=\"5\" y1=\"34\" x2=\"9\" y2=\"34\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n      <line x1=\"5\" y1=\"46\" x2=\"9\" y2=\"46\" stroke=\"#1a1a1a\" stroke-width=\"0.7\"/>\n      <text x=\"16\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\">high</text>\n    </g>\n    <!-- 시계 (체내 시계 — 빠름) -->\n    <g transform=\"translate(140, 75)\">\n      <circle cx=\"0\" cy=\"0\" r=\"28\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <line x1=\"0\" y1=\"-26\" x2=\"0\" y2=\"-21\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"26\" x2=\"0\" y2=\"21\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <line x1=\"-26\" y1=\"0\" x2=\"-21\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <line x1=\"26\" y1=\"0\" x2=\"21\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <!-- 시계 바늘 (빠른 — 큰 각도) -->\n      <line x1=\"0\" y1=\"0\" x2=\"14\" y2=\"-12\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"14\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <circle cx=\"0\" cy=\"0\" r=\"2\" fill=\"#c8102e\"/>\n      <!-- 빠름 표시 (큰 회전 화살표) -->\n      <g transform=\"translate(0, 36)\">\n        <path d=\"M -14 0 Q -7 -6 0 0 Q 7 -6 14 0\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n        <polygon points=\"14,0 11,-3 11,3\" fill=\"#c8102e\"/>\n      </g>\n      <text x=\"0\" y=\"58\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">internal clock — fast</text>\n    </g>\n    <!-- 외부 사건 (정상으로 보임) -->\n    <g transform=\"translate(60, 155)\">\n      <text x=\"60\" y=\"-5\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">→ 외부 사건은 정상 속도</text>\n      <line x1=\"0\" y1=\"14\" x2=\"120\" y2=\"14\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n      <polygon points=\"120,14 110,9 110,19\" fill=\"#1a1a1a\"/>\n      <text x=\"60\" y=\"44\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">events feel normal</text>\n    </g>\n  </g>\n</svg>","caption":"체온 ↓ → 체내 시계 ↓ → 외부 사건 빨라 보임 · 그래도 주관적 템포는 거의 차이 없음","tldr":["체온이 낮으면 체내 시계가 더 느리게 간다는 증거가 있다.","화씨 39도 물속 다이버는 60초를 10% 이상 빠르게 느꼈고, 고열 환자는 시간을 실제보다 느리게 느낀다(시간 과대평가).","더운 곳 사람은 체내 시계가 느려 사건이 빠르게 느껴질 수 있고 — 결국 주관적 템포는 더위·추위와 무관하게 '딱 적당'하게 느껴질 수 있다."],"analogy":"체내 시계는 배터리 같은 시계예요. 추우면(저온) 초침이 느려져, 바깥 세상이 상대적으로 빨라 보이죠. 그래도 각자에겐 그 속도가 '정상'으로 느껴집니다.","bg":"체온이 '시간을 얼마나 빠르게 느끼는가(주관적 시간)'에 영향을 준다는 실험 증거를 다룬 글.","flow":[{"kind":"증거","t":"저체온 → 체내 시계 느려짐 (다이버 실험·고열 환자)"},{"kind":"추론","t":"더운 곳 = 느린 체내 시계 → 외부 사건이 빠르게 느껴짐"},{"kind":"결론","t":"주관적 템포는 기후와 무관하게 ‘딱 적당’하게 느껴질 수 있음"}],"vocab":[["evidence","증거"],["internal","체내의내부의"],["immerse","(액체 속에) 잠그다"],["estimate","추정하다"],["interval","(시간의) 간격"],["perceive","인식하다인지하다"],["overestimate","과대평가하다"],["operate","활동하다작동하다"],["temporal","시간의"],["norm","기준규범"],["metronome","메트로놈박절기"],["subjective","주관적인"]],"quiz":[["화씨 39도 물에 들어간 다이버의 시간 지각은 어떻게 변했나?","60초 간격이 들어가기 전보다 10% 이상 더 빠르게 지나간다고 느꼈다."],["글의 결론(주관적 템포)은?","더운 곳·추운 곳 사람의 체내 시계 차이 때문에, 각자가 느끼는 주관적 시간 속도는 거의 차이가 없을 수 있다."]],"en":"There is some evidence that cooler body temperatures can cause people's internal clocks to click at a slower rate. One experiment found that divers immersed in 39-degree sea water estimated a 60-second interval to pass more than 10 percent faster than they did before entering the water. Other studies have found that people with high fevers perceive the clock to move more slowly than it actually does (they overestimate intervals of time). These findings raise the possibility that people in warmer places are operating on slower internal clocks. This would, in turn, cause the speed of events to seem faster to them, perhaps explaining why their actual temporal norms are kept slower. In other words, in terms of their own internal metronomes, there may be little or no difference in the subjective tempo experienced by people in hotter and colder climates. The tempo in both cases may seem just right.","ko":"더 낮은 체온이 사람들의 체내 시계를 더 느리게 째깍거리도록 할 수 있다는 몇 가지 증거가 있다. 한 실험에서 밝힌 바에 따르면, 화씨 39도의 해수에 잠수한 다이버들은 60초 간격이 물에 들어가기 전에 추정한 것보다 10% 넘게 더 빠르게 지나갔다고 추정했다. 다른 연구들은 고열이 있는 사람들이 시계가 실제보다 더 느리게 움직인다고 인식한다(즉 그들이 시간 간격을 과대평가한다)는 사실을 발견했다. 이러한 연구 결과들은 더 따뜻한 지역에 사는 사람들이 더 느린 체내 시계로 활동할 가능성을 제기한다. 이는 결국 사건의 속도가 그들에게 더 빠르게 보이도록 하여, 아마도 왜 그들의 실제 시간 기준이 더 느리게 유지되는지를 설명할 것이다. 다시 말해, 그들 자신의 내부 메트로놈 관점에서는 더 덥거나 더 추운 기후 지역에 사는 사람들이 경험하는 주관적인 템포에 차이가 거의 또는 전혀 없을 수도 있다. 두 경우 모두 템포가 딱 적당하게 느껴질 수도 있다.","read":[{"en":"There is some evidence that cooler body temperatures can cause people's internal clocks to click at a slower rate.","ko":"더 낮은 체온이 사람들의 체내 시계를 더 느리게 째깍거리도록 할 수 있다는 몇 가지 증거가 있다.","chunks":[["There is some evidence that cooler body temperatures can cause people's internal clocks to click at a slower rate.","더 낮은 체온이 사람들의 체내 시계를 더 느리게 째깍거리도록 할 수 있다는 몇 가지 증거가 있다."]]},{"en":"One experiment found that divers immersed in 39-degree sea water estimated a 60-second interval to pass more than 10 percent faster than they did before entering the water.","ko":"한 실험에서 밝힌 바에 따르면, 화씨 39도의 해수에 잠수한 다이버들은 60초 간격이 물에 들어가기 전에 추정한 것보다 10% 넘게 더 빠르게 지나갔다고 추정했다.","chunks":[["One experiment found that divers immersed in 39-degree sea water estimated a 60-second interval to pass more than 10 percent faster than they did before entering the water.","한 실험에서 밝힌 바에 따르면, 화씨 39도의 해수에 잠수한 다이버들은 60초 간격이 물에 들어가기 전에 추정한 것보다 10% 넘게 더 빠르게 지나갔다고 추정했다."]]},{"en":"Other studies have found that people with high fevers perceive the clock to move more slowly than it actually does (they overestimate intervals of time).","ko":"다른 연구들은 고열이 있는 사람들이 시계가 실제보다 더 느리게 움직인다고 인식한다(즉 그들이 시간 간격을 과대평가한다)는 사실을 발견했다.","chunks":[["Other studies have found that people with high fevers perceive the clock to move more slowly than it actually does (they overestimate intervals of time).","다른 연구들은 고열이 있는 사람들이 시계가 실제보다 더 느리게 움직인다고 인식한다(즉 그들이 시간 간격을 과대평가한다)는 사실을 발견했다."]]},{"en":"These findings raise the possibility that people in warmer places are operating on slower internal clocks.","ko":"이러한 연구 결과들은 더 따뜻한 지역에 사는 사람들이 더 느린 체내 시계로 활동할 가능성을 제기한다.","chunks":[["These findings raise the possibility that people in warmer places are operating on slower internal clocks.","이러한 연구 결과들은 더 따뜻한 지역에 사는 사람들이 더 느린 체내 시계로 활동할 가능성을 제기한다."]]},{"en":"This would, in turn, cause the speed of events to seem faster to them, perhaps explaining why their actual temporal norms are kept slower.","ko":"이는 결국 사건의 속도가 그들에게 더 빠르게 보이도록 하여, 아마도 왜 그들의 실제 시간 기준이 더 느리게 유지되는지를 설명할 것이다.","chunks":[["This would, in turn, cause the speed of events to seem faster to them, perhaps explaining why their actual temporal norms are kept slower.","이는 결국 사건의 속도가 그들에게 더 빠르게 보이도록 하여, 아마도 왜 그들의 실제 시간 기준이 더 느리게 유지되는지를 설명할 것이다."]]},{"en":"In other words, in terms of their own internal metronomes, there may be little or no difference in the subjective tempo experienced by people in hotter and colder climates.","ko":"다시 말해, 그들 자신의 내부 메트로놈 관점에서는 더 덥거나 더 추운 기후 지역에 사는 사람들이 경험하는 주관적인 템포에 차이가 거의 또는 전혀 없을 수도 있다.","chunks":[["In other words, in terms of their own internal metronomes, there may be little or no difference in the subjective tempo experienced by people in hotter and colder climates.","다시 말해, 그들 자신의 내부 메트로놈 관점에서는 더 덥거나 더 추운 기후 지역에 사는 사람들이 경험하는 주관적인 템포에 차이가 거의 또는 전혀 없을 수도 있다."]]},{"en":"The tempo in both cases may seem just right.","ko":"두 경우 모두 템포가 딱 적당하게 느껴질 수도 있다.","chunks":[["The tempo in both cases may seem just right.","두 경우 모두 템포가 딱 적당하게 느껴질 수도 있다."]]}]},{"no":"10","title":"Generation as a Social Consciousness","ktitle":"세대 의식의 형성 요인","field":"사회학·세대","page":"수능특강 영어독해연습 08강 · 지문 10","oneline":"같은 출생 시기만으론 불충분 → 공통 역사·사회 환경이 있어야 → 세대 의식","metaphor":"<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 같은 출생 연도라는 점선 박스에 X 표시로 불충분함을 표현하고, 오른쪽 공통 역사적 사건·사회 환경의 실선 박스가 추가되어 세대 의식이 형성되는 정의·반전 그림\">\n  <!-- 좌측: 같은 출생 시기 (불충분) -->\n  <g transform=\"translate(15, 30)\">\n    <text x=\"115\" y=\"-13\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">같은 출생 시기만으론 — 불충분</text>\n    <rect x=\"0\" y=\"0\" width=\"230\" height=\"220\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/>\n    \n    <!-- 출생연도 박스 -->\n    <g transform=\"translate(115, 50)\">\n      <rect x=\"-60\" y=\"-15\" width=\"120\" height=\"35\" rx=\"4\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">same birth year</text>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">같은 출생 연도</text>\n    </g>\n    \n    <!-- 사람들 (같

n        <line x1=\"0\" y1=\"14\" x2=\"-8\" y2=\"22\"/>\n        <line x1=\"0\" y1=\"14\" x2=\"8\" y2=\"22\"/>\n      </g>\n      <g transform=\"translate(115, 130)\">\n        <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#ffffff\"/>\n        <line x1=\"0\" y1=\"8\" x2=\"0\" y2=\"28\"/>\n        <line x1=\"0\" y1=\"14\" x2=\"-8\" y2=\"22\"/>\n        <line x1=\"0\" y1=\"14\" x2=\"8\" y2=\"22\"/>\n      </g>\n      <g transform=\"translate(170, 130)\">\n        <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#ffffff\"/>\n        <line x1=\"0\" y1=\"8\" x2=\"0\" y2=\"28\"/>\n        <line x1=\"0\" y1=\"14\" x2=\"-8\" y2=\"22\"/>\n        <line x1=\"0\" y1=\"14\" x2=\"8\" y2=\"22\"/>\n      </g>\n      <g transform=\"translate(225, 130)\">\n        <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#ffffff\"/>\n        <line x1=\"0\" y1=\"8\" x2=\"0\" y2=\"28\"/>\n        <line x1=\"0\" y1=\"14\" x2=\"-8\" y2=\"22\"/>\n        <line x1=\"0\" y1=\"14\" x2=\"8\" y2=\"22\"/>\n      </g>\n      <!-- 사람들 사이 연결선 -->\n      <line x1=\"68\" y1=\"160\" x2=\"107\" y2=\"160\" stroke-width=\"1.3\"/>\n      <line x1=\"123\" y1=\"160\" x2=\"162\" y2=\"160\" stroke-width=\"1.3\"/>\n      <line x1=\"178\" y1=\"160\" x2=\"217\" y2=\"160\" stroke-width=\"1.3\"/>\n    </g>\n    \n    <!-- generation consciousness 라벨 -->\n    <g transform=\"translate(140, 200)\">\n      <rect x=\"-105\" y=\"-12\" width=\"210\" height=\"28\" rx=\"5\" fill=\"#1FA34A\"/>\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">generation consciousness</text>\n      <text x=\"0\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#ffffff\">세대 의식 — Mannheim</text>\n    </g>\n  </g>\n</svg>","caption":"같은 출생 시기만으론 불충분 → 공통 역사·사회 환경이 있어야 → 세대 의식","tldr":["사회학자 Karl Mannheim이 1927년 '세대 문제'에서 세대를 학문적으로 처음 다뤘다.","세대 = 특정 역사적 시기에 태어난 사람들 + 다른 세대와 구별되는 공통 세계관.","단지 같은 시기 출생만으론 부족 — 공통의 경험·역사적 사건을 같은 사회·정치 환경에서 겪어야 '세대 의식'이 생긴다."],"analogy":"같은 해에 태어났다고 다 한 세대가 아니에요. 같은 콘서트장에 있었더라도, 같은 노래에 같이 울고 웃은 사람들이 '우리'가 되는 것처럼 — 공통의 경험이 세대를 만들죠.","bg":"'세대(generation)'란 무엇인가를 Mannheim의 고전적 정의로 설명하는 글. 핵심 반전 — 출생 시기만으론 부족하다.","flow":[{"kind":"배경","t":"Mannheim(1927) ‘세대 문제’ — 세대의 사회적 의미 최초 연구"},{"kind":"정의","t":"세대 = 같은 역사적 시기 출생 + 공통 세계관"},{"kind":"반전","t":"출생 시기만으론 ✗"},{"kind":"핵심","t":"공통 경험·역사적 사건(공통 사회·정치 환경) → 세대 의식"}],"vocab":[["theorist","이론가"],["aging","노화"],["generation","세대"],["relevant","관련 있는"],["sociologist","사회학자"],["publish","출판하다"],["era","시대"],["be characterized by ~","의 특징이 있다"],["common","공통된공동의"],["distinguish","구별하다"],["keenly","강하게날카롭게"],["automatically","자동적으로"],["psychological","심리적인"],["identity","정체성"],["consciousness","의식"],["suggest","시사하다넌지시 말하다"],["merely","단순히단지"],["expose","접하게 하다노출시키다"],["belong to ~","에 속하다"]],"quiz":[["Mannheim에 따르면 '세대 의식'은 어디서 생기는가?","단지 같은 시기에 태어나서가 아니라, 공통의 사회·정치 환경에서 같은 경험과 역사적 사건을 겪는 데서 생긴다."],["Mannheim은 세대를 무엇의 결합으로 보았나?","마음의 상태(state of mind)와 연령 집단(age grouping)의 결합."]],"en":"By the 1950s, social theorists began thinking and writing about age, aging, generations, and the life course. Their work remains relevant today. The first serious attempt to look at the social importance of age groups was made by the German sociologist Karl Mannheim in an essay titled \"The Problem of Generations,\" which was first published in 1927. Mannheim defined generation as a category of people born within a specific historical era or time period. For Mannheim, a generation was also characterized by common world views that distinguished it from other generations. Mannheim was keenly aware that accident of birth timing did not automatically create these common understandings and worldviews; he observed that social and social psychological processes led some members of a generation develop an identity and consciousness with their age peers. Mannheim suggested that generational consciousness arose not from merely being born at the same time but from being exposed to the same kinds of experiences and historical events in a common social and political environment. According to Mannheim, belonging to a generation is a combination of a state of mind and an age grouping.","ko":"1950년대에 이르러 사회 이론가들은 나이, 노화, 세대, 그리고 생애 과정에 대해 생각하고 저술하기 시작했다. 그들의 연구는 오늘날에도 여전히 관련이 있다. 연령 집단의 사회적 중요성을 살펴보려는 최초의 진지한 시도는 독일의 사회학자 Karl Mannheim에 의해 \"The Problem of Generations\"라는 제목의 평론에서 이루어졌는데, 그것은 1927년에 처음 출판되었다. Mannheim은 세대를 특정한 역사적 시대나 기간 내에 태어난 사람들의 범주로 정의했다. Mannheim에게 세대란 또한 다른 세대와 구별되게 하는 공통된 세계관이라는 특징이 있었다. Mannheim은 태어난 시점이라는 우연이 이러한 공통된 이해와 세계관을 자동으로 만들어 내지는 않는다는 것을 강하게 의식했고, 사회적, 사회 심리적 과정이 한 세대의 일부 구성원들로 하여금 그들의 동년배들과 함께 정체성과 의식을 형성하게 만든다고 말했다. Mannheim이 시사한 바에 따르면, 세대 의식은 단순히 같은 시기에 태어나는 것에서 발생하는 것이 아니라, 공통된 사회적, 정치적 환경에서 같은 종류의 경험과 역사적 사건을 접하는 것에서 비롯된다. Mannheim에 따르면, 세대에 속한다는 것은 '마음 상태'와 연령 집단의 조합이다.","read":[{"en":"By the 1950s, social theorists began thinking and writing about age, aging, generations, and the life course.","ko":"1950년대에 이르러 사회 이론가들은 나이, 노화, 세대, 그리고 생애 과정에 대해 생각하고 저술하기 시작했다.","chunks":[["By the 1950s, social theorists began thinking and writing about age, aging, generations, and the life course.","1950년대에 이르러 사회 이론가들은 나이, 노화, 세대, 그리고 생애 과정에 대해 생각하고 저술하기 시작했다."]]},{"en":"Their work remains relevant today.","ko":"그들의 연구는 오늘날에도 여전히 관련이 있다.","chunks":[["Their work remains relevant today.","그들의 연구는 오늘날에도 여전히 관련이 있다."]]},{"en":"The first serious attempt to look at the social importance of age groups was made by the German sociologist Karl Mannheim in an essay titled \"The Problem of Generations,\" which was first published in 1927.","ko":"연령 집단의 사회적 중요성을 살펴보려는 최초의 진지한 시도는 독일의 사회학자 Karl Mannheim에 의해 \"The Problem of Generations\"라는 제목의 평론에서 이루어졌는데, 그것은 1927년에 처음 출판되었다.","chunks":[["The first serious attempt to look at the social importance of age groups was made by the German sociologist Karl Mannheim in an essay titled \"The Problem of Generations,\" which was first published in 1927.","연령 집단의 사회적 중요성을 살펴보려는 최초의 진지한 시도는 독일의 사회학자 Karl Mannheim에 의해 \"The Problem of Generations\"라는 제목의 평론에서 이루어졌는데, 그것은 1927년에 처음 출판되었다."]]},{"en":"Mannheim defined generation as a category of people born within a specific historical era or time period.","ko":"Mannheim은 세대를 특정한 역사적 시대나 기간 내에 태어난 사람들의 범주로 정의했다.","chunks":[["Mannheim defined generation as a category of people born within a specific historical era or time period.","Mannheim은 세대를 특정한 역사적 시대나 기간 내에 태어난 사람들의 범주로 정의했다."]]},{"en":"For Mannheim, a generation was also characterized by common world views that distinguished it from other generations.","ko":"Mannheim에게 세대란 또한 다른 세대와 구별되게 하는 공통된 세계관이라는 특징이 있었다.","chunks":[["For Mannheim, a generation was also characterized by common world views that distinguished it from other generations.","Mannheim에게 세대란 또한 다른 세대와 구별되게 하는 공통된 세계관이라는 특징이 있었다."]]},{"en":"Mannheim was keenly aware that accident of birth timing did not automatically create these common understandings and worldviews; he observed that social and social psychological processes led some members of a generation develop an identity and consciousness with their age peers.","ko":"Mannheim은 태어난 시점이라는 우연이 이러한 공통된 이해와 세계관을 자동으로 만들어 내지는 않는다는 것을 강하게 의식했고, 사회적, 사회 심리적 과정이 한 세대의 일부 구성원들로 하여금 그들의 동년배들과 함께 정체성과 의식을 형성하게 만든다고 말했다.","chunks":[["Mannheim was keenly aware that accident of birth timing did not automatically create these common understandings and worldviews; he observed that social and social psychological processes led some members of a generation develop an identity and consciousness with their age peers.","Mannheim은 태어난 시점이라는 우연이 이러한 공통된 이해와 세계관을 자동으로 만들어 내지는 않는다는 것을 강하게 의식했고, 사회적, 사회 심리적 과정이 한 세대의 일부 구성원들로 하여금 그들의 동년배들과 함께 정체성과 의식을 형성하게 만든다고 말했다."]]},{"en":"Mannheim suggested that generational consciousness arose not from merely being born at the same time but from being exposed to the same kinds of experiences and historical events in a common social and political environment.","ko":"Mannheim이 시사한 바에 따르면, 세대 의식은 단순히 같은 시기에 태어나는 것에서 발생하는 것이 아니라, 공통된 사회적, 정치적 환경에서 같은 종류의 경험과 역사적 사건을 접하는 것에서 비롯된다.","chunks":[["Mannheim suggested that generational consciousness arose not from merely being born at the same time but from being exposed to the same kinds of experiences and historical events in a common social and political environment.","Mannheim이 시사한 바에 따르면, 세대 의식은 단순히 같은 시기에 태어나는 것에서 발생하는 것이 아니라, 공통된 사회적, 정치적 환경에서 같은 종류의 경험과 역사적 사건을 접하는 것에서 비롯된다."]]},{"en":"According to Mannheim, belonging to a generation is a combination of a state of mind and an age grouping.","ko":"Mannheim에 따르면, 세대에 속한다는 것은 '마음 상태'와 연령 집단의 조합이다.","chunks":[["According to Mannheim, belonging to a generation is a combination of a state of mind and an age grouping.","Mannheim에 따르면, 세대에 속한다는 것은 '마음 상태'와 연령 집단의 조합이다."]]}]},{"no":"11","title":"Human Consciousness as a Route to Animal Consciousness","ktitle":"인간 의식 규명을 통한 동물 의식 이해","field":"인지과학·의식","page":"수능특강 영어독해연습 08강 · 지문 11","oneline":"인간 의식(경험+언어)에서 '표시' 식별 → 동물 뇌에서 같은 표시 탐색","metaphor":"<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 인간 뇌에서 경험과 언어를 통해 의식의 표시를 식별하고, 가운데 확장 화살표를 거쳐 오른쪽 동물 뇌에서 같은 표시를 탐색하는 확장·유추 그림\">\n  <!-- 좌측: 인간 의식 -->\n  <g transform=\"translate(15, 30)\">\n    <text x=\"115\" y=\"-13\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">인간 의식 — 시작점</text>\n    <rect x=\"0\" y=\"0\" width=\"230\" height=\"220\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    \n    <!-- 인간 머리·뇌 -->\n    <g transform=\"translate(115, 90)\">\n      <!-- 머리 윤곽 -->\n      <ellipse cx=\"0\" cy=\"0\" rx=\"48\" ry=\"56\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <!-- 뇌 윤곽 -->\n      <path d=\"M -32 -25 Q -38 -10 -32 5 Q -38 20 -25 28 Q -10 36 0 32 Q 10 36 25 28 Q 38 20 32 5 Q 38 -10 32 -25 Q 25 -38 10 -36 Q 0 -42 -10 -36 Q -25 -38 -32 -25 Z\" \n            fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <!-- \" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">extend</text>\n    <text x=\"16\" y=\"-25\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">search same</text>\n    <text x=\"16\" y=\"23\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">확장·유추</text>\n  </g>\n\n  <!-- 우측: 동물 의식 -->\n  <g transform=\"translate(305, 30)\">\n    <text x=\"140\" y=\"-13\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">동물 의식 — 확장 적용</text>\n    <rect x=\"0\" y=\"0\" width=\"280\" height=\"220\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    \n    <!-- 동물 뇌 (작게, 동일 마커) -->\n    <g transform=\"translate(140, 100)\">\n      <!-- 동물 머리 (개) -->\n      <ellipse cx=\"0\" cy=\"0\" rx=\"48\" ry=\"42\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <!-- 귀 -->\n      <ellipse cx=\"-38\" cy=\"-25\" rx=\"10\" ry=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\" transform=\"rotate(-25 -38 -25)\"/>\n      <ellipse cx=\"38\" cy=\"-25\" rx=\"10\" ry=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\" transform=\"rotate(25 38 -25)\"/>\n      <!-- 코 -->\n      <ellipse cx=\"0\" cy=\"15\" rx=\"6\" ry=\"4\" fill=\"#1a1a1a\"/>\n      <!-- 동물 뇌 (작은 윤곽 위쪽) -->\n      <path d=\"M -25 -10 Q -30 0 -22 8 Q -10 14 0 12 Q 10 14 22 8 Q 30 0 25 -10 Q 18 -20 8 -19 Q 0 -23 -8 -19 Q -18 -20 -25 -10 Z\" \n            fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n      <!-- 같은 마커 패턴 (인간과 동일한 모양) -->\n      <polygon points=\"-12,-4 -10,1 -5,1 -9,4 -7,9 -12,6 -17,9 -15,4 -19,1 -14,1\" fill=\"#c8102e\"/>\n      <polygon points=\"12,-2 14,3 19,3 15,6 17,11 12,8 7,11 9,6 5,3 10,3\" fill=\"#c8102e\"/>\n      <!-- 검색 표시 (돋보기) -->\n      <g transform=\"translate(40, -40)\">\n        <circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n        <line x1=\"6\" y1=\"6\" x2=\"13\" y2=\"13\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      </g>\n      <text x=\"0\" y=\"65\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">animal brain</text>\n    </g>\n    \n    <text x=\"140\" y=\"195\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">→ same markers found?</text>\n    <text x=\"140\" y=\"208\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">같은 표시 탐색 → 동물 의식 이해</text>\n  </g>\n</svg>","caption":"인간 의식(경험+언어)에서 '표시' 식별 → 동물 뇌에서 같은 표시 탐색","tldr":["의식 이해의 출발점은 확실히 의식이 있는 종 — 인간 자신이다.","인간은 직접 경험으로 의식을 알고, 언어로 서로의 경험을 물어볼 수 있다.","우리 뇌에서 의식의 '특징(signature)'을 찾으면, 말 못 하는 동물 뇌에서 비슷한 특징을 탐색해 동물 의식에 접근할 수 있다."],"analogy":"내가 잘 아는 길(인간 의식)에서 이정표(뇌의 의식 신호)를 먼저 익히면, 낯선 길(동물 의식)에서도 같은 이정표를 찾아 따라갈 수 있는 거예요.","bg":"동물의 의식을 어떻게 연구할까? — 확실한 사례인 '인간 의식'을 통로(route)로 삼자는 접근을 제시하는 글.","flow":[{"kind":"출발점","t":"확실히 의식 있는 종 = 인간 (직접 경험 + 언어로 확인)"},{"kind":"방법","t":"인간 뇌에서 의식의 ‘특징(signature)’ 식별"},{"kind":"확장","t":"동물 뇌에서 유사 특징 탐색 → 동물 의식 이해"}],"vocab":[["promising","유망한"],["currently","현재"],["consciousness","의식"],["at least","적어도"],["identify","식별하다분간하다"],["characteristic","특유의"],["signature","표시기호"],["arise from ~","에서 발생하다"],["tissue","조직"],["indicate","보여 주다나타내다"],["be correlated with ~","과 상관관계가 있다"],["insight","통찰(력)"],["come to grips with ~","을 이해하게 되다"]],"quiz":[["인간을 의식 연구의 출발점으로 삼는 두 가지 이점은?","직접적인 개인 경험으로 의식을 알 수 있고, 언어로 서로의 의식 경험을 물어볼 수 있다는 점."],["인간 의식 연구가 동물 의식으로 이어지는 논리는?","인간 뇌에서 의식의 특징적 ‘신호’를 찾으면, 말 못 하는 동물의 뇌에서 비슷한 신호를 탐색할 수 있다."]],"en":"A promising starting point for seeing how well we currently understand consciousness is to look at the one species that we know for certain does have conscious experiences - our own. With human consciousness we at least know what it is from our own personal experience and we also have the advantage of being able to use language to ask other people what their conscious experiences are like. If we could identify the characteristic 'signature' of consciousness in our own brains, then it might be possible to look for similar signatures in the brains of animals that cannot tell us in words what they are feeling. Even a theory of consciousness that did not explain how conscious experiences arise from brain tissue might at least indicate what brain structures or types of brain activity were correlated with consciousness. Non-human species often exhibit sophisticated problem-solving abilities, indicating a level of cognitive complexity beyond simple instinct. We could then see whether similar brain structures or activities are also found in other species. Insights from human consciousness could therefore become our way of coming to grips with animal consciousness.","ko":"우리가 현재 의식을 얼마나 잘 이해하고 있는지를 파악하기 위한 유망한 출발점은 의식적인 경험을 정말로 가지고 있다고 우리가 확실히 아는 한 종, 즉 우리 자신을 살펴보는 것이다. 인간의 의식에 관해서는 우리는 적어도 우리 자신의 개인적인 경험을 통해 그것이 무엇인지 알고 있으며, 언어를 사용하여 다른 사람들에게 그들의 의식적인 경험이 어떤지 물어볼 수 있다는 유리한 점도 있다. 만약 우리가 우리 자신의 뇌에서 의식의 특유의 '표시'를 식별할 수 있다면, 말을 통해 자신들이 무엇을 느끼는지 우리에게 말할 수 없는 동물의 뇌에서도 유사한 표시를 찾는 것이 가능할지도 모른다. 뇌 조직에서 의식적인 경험이 어떻게 발생하는지 설명하지 않는 의식 이론이라 할지라도, 적어도 어떤 뇌 구조나 뇌 활동 유형이 의식과 상관관계가 있는지는 보여 줄 수도 있을 것이다. (인간이 아닌 종들도 흔히 정교한 문제 해결 능력을 보여 주는데, 이는 단순한 본능을 넘어서는 수준의 인지적 복잡성을 나타낸다. ) 그러면 우리는 유사한 뇌 구조나 활동이 다른 종에서도 발견되는지 확인할 수 있을 것이다. 따라서 인간 의식으로부터 얻은 통찰력은 동물 의식을 이해하게 되는 우리의 방식이 될 수 있다.","read":[{"en":"A promising starting point for seeing how well we currently understand consciousness is to look at the one species that we know for certain does have conscious experiences - our own.","ko":"우리가 현재 의식을 얼마나 잘 이해하고 있는지를 파악하기 위한 유망한 출발점은 의식적인 경험을 정말로 가지고 있다고 우리가 확실히 아는 한 종, 즉 우리 자신을 살펴보는 것이다.","chunks":[["A promising starting point for seeing how well we currently understand consciousness is to look at the on DNA·단백질)의 중심","tldr":["우리는 유기 화합물에 둘러싸여 있고, 몸 자체가 대부분 유기 화합물(DNA·RNA·단백질)이다.","약물에 대한 몸의 반응도 유기 화학 원리로 일어나며, 그 원리 이해가 신약 설계를 가능케 한다.","음식·옷·냄새·색·의약품·농약·플라스틱 등 — 유기 화학은 일상 전반의 중심에 있다."],"analogy":"유기 화학은 무대 뒤 스태프 같아요. 우리가 먹고 입고 약을 먹고 냄새를 맡는 모든 장면을 보이지 않게 떠받치고 있죠.","bg":"'유기 화학이 왜 중요한가'를 실생활(몸·약·음식·옷)로 풀어 보여주는 글. (문장 삽입 유형)","flow":[{"kind":"중심","t":"유기 화합물에 둘러싸인 우리 — 몸도 대부분 유기물(DNA·단백질)"},{"kind":"응용","t":"약물 반응 = 유기 화학 → 원리 이해가 신약 설계 가능케"},{"kind":"확장","t":"음식·옷·냄새·색·농약·플라스틱 — 일상 전반"}],"vocab":[["organic chemistry","유기 화학"],["organic compound","유기 화합물"],["construct","구성하다"],["principle","원리"],["molecular","분자의"],["bonding","결합"],["reactivity","반응성"],["longevity","수명/장수"],["accordingly","따라서/그러므로"],["profession","직업"],["be comprised of ~","로 구성되어 있다"],["odor","냄새"],["pesticide","살충제"]],"quiz":[["우리 몸이 유기 화합물로 이루어졌다는 예시는?","DNA, RNA, 단백질 등 — 그 구조·결합·반응성이 유기 화학 원리로 결정된다."],["유기 화학 원리의 이해가 의학에 주는 효용은?","질병과 싸우고 삶의 질·수명을 개선하는 신약(new drugs)을 설계할 수 있게 한다."]],"en":"Organic chemistry occupies a central role in the world around us, as we are surrounded by organic compounds. (A) In fact, our bodies are constructed mostly from organic compounds (DNA, RNA, proteins, etc.) whose behavior and function are determined by principles such as molecular structure, bonding, and reactivity - all central to organic chemistry. The responses of our bodies to pharmaceuticals are the results of reactions guided by the principles of organic chemistry. (B) A deep understanding of those principles enables the design of new drugs that fight disease and improve the overall quality of life and longevity. Accordingly, it is not surprising that organic chemistry is required knowledge for anyone entering the health professions. (C) The food that we eat and the clothes that we wear are comprised of organic compounds. Our ability to smell odors or see colors results from the behavior of organic compounds. Pharmaceuticals, pesticides, paints, adhesives, and plastics are all made from organic compounds."," /* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">배경지식 30초</span>
      <span class="thint">— 이 글이 어떤 글이냐</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout bg">${d.bg}</p></div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 작동 원리</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>

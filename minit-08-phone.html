h=\"16\" height=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n          <circle cx=\"-3\" cy=\"-3\" r=\"1.5\" fill=\"#1a1a1a\"/>\n          <path d=\"M -7 5 L -2 -1 L 3 4 L 7 0\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        </g>\n        <!-- 조각상 -->\n        <g transform=\"translate(22, 0)\">\n          <circle cx=\"0\" cy=\"-6\" r=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n          <path d=\"M -3 -3 L -4 8 L 4 8 L 3 -3 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        </g>\n        <text x=\"0\" y=\"20\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">cultural heritage</text>\n      </g>\n      \n      <!-- 혁신 전략 작은 라벨 -->\n      <g transform=\"translate(80, 145)\">\n        <rect x=\"-50\" y=\"-7\" width=\"100\" height=\"14\" fill=\"#1FA34A\" rx=\"2\"/>\n        <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">innovative strategies</text>\n      </g>\n    </g>\n\n    <!-- 가운데 2: 자금 게이트 -->\n    <g transform=\"translate(380, 30)\">\n      <text x=\"50\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">자금 게이트</text>\n      \n      <!-- 게이트 (자물쇠 박스) -->\n      <g transform=\"translate(50, 80)\">\n        <!-- 박스 -->\n        <rect x=\"-35\" y=\"-30\" width=\"70\" height=\"60\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.7\"/>\n        <!-- 자물쇠 -->\n        <g transform=\"translate(0, -3)\">\n          <!-- 자물쇠 윗부분 (U자) -->\n          <path d=\"M -8 -5 L -8 -12 Q -8 -18 0 -18 Q 8 -18 8 -12 L 8 -5\" \n                fill=\"none\" stroke=\"#c8102e\" stroke-width=\"2.2\"/>\n          <!-- 자물쇠 몸체 -->\n          <rect x=\"-11\" y=\"-5\" width=\"22\" height=\"18\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.7\"/>\n          <!-- 열쇠 구멍 -->\n          <circle cx=\"0\" cy=\"3\" r=\"2.5\" fill=\"#c8102e\"/>\n          <rect x=\"-0.8\" y=\"3\" width=\"1.6\" height=\"5\" fill=\"#c8102e\"/>\n        </g>\n        <!-- $ 표시 -->\n        <text x=\"0\" y=\"25\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c8102e\">$</text>\n      </g>\n      \n      <!-- 게이트 라벨 -->\n      <text x=\"50\" y=\"160\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">funding gate</text>\n    </g>\n\n    <!-- 우측: 성공 -->\n    <g transform=\"translate(485, 30)\">\n      <text x=\"50\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">보존 성공</text>\n      \n      <!-- 통과 화살표 (게이트 뒤에서) -->\n      <line x1=\"-25\" y1=\"80\" x2=\"-5\" y2=\"80\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <polygon points=\"-5,80 -13,76 -13,84\" fill=\"#1FA34A\"/>\n      \n      <!-- 보존된 박물관 + ✓ -->\n      <g transform=\"translate(50, 80)\">\n        <rect x=\"-30\" y=\"-30\" width=\"60\" height=\"60\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.7\" rx=\"3\"/>\n        <!-- 큰 체크 -->\n        <g transform=\"translate(0, 0)\">\n          <circle cx=\"0\" cy=\"0\" r=\"18\" fill=\"#1FA34A\"/>\n          <path d=\"M -8 0 L -2 7 L 9 -7\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"3\"/>\n        </g>\n      </g>\n      \n      <text x=\"50\" y=\"155\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">preservation success</text>\n      <text x=\"50\" y=\"167\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">소장품 보호</text>\n    </g>\n\n    <!-- 하단: 요약문 (A)·(B) 매핑 -->\n    <g transform=\"translate(0, 230)\">\n      <rect x=\"40\" y=\"0\" width=\"520\" height=\"50\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1\" rx=\"4\"/>\n      <text x=\"60\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#1a1a1a\" font-weight=\"700\">요약문 빈칸 매핑</text>\n      <text x=\"60\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" fill=\"#1a1a1a\">Climate change </text>\n      <g transform=\"translate(170, 28)\">\n        <rect x=\"0\" y=\"0\" width=\"80\" height=\"15\" fill=\"#c8102e\" rx=\"2\"/>\n        <text x=\"40\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">(A) threatens</text>\n      </g>\n      <text x=\"255\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" fill=\"#1a1a1a\">preservation… requiring increased </text>\n      <g transform=\"translate(450, 28)\">\n        <rect x=\"0\" y=\"0\" width=\"80\" height=\"15\" fill=\"#c8102e\" rx=\"2\"/>\n        <text x=\"40\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">(B) financial</text>\n      </g>\n    </g>\n  </svg>", "caption": "기후 변화 = 위협 → 혁신 전략 → 성공 (단, 자금 게이트가 조건)"}]};

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

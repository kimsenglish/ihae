<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 미닛15 8회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 영어독해연습 08강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-phone">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">미닛15 8회</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 미닛15 8회
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data": [{"no": "1", "title": "Balancing Remote and In-Person Work", "ktitle": "원격 (유연성·생산성) + 대면 (협업·혁신) → 균형 잡힌 업무 틀", "field": "사회·노동", "page": "8회 01번", "oneline": "팬데믹이 보여 준 장점·한계 모두 살려, 조직은 원격 유연성 + 대면 협업을 결합한 균형 잡힌 업무 틀(balanced framework)을 개발해야 한다.", "tldr": ["팬데믹이 보여 준 장점·한계 모두 살려, 조직은 원격 유연성 + 대면 협업을 결합한 균형 잡힌 업무 틀(balanced framework)을 개발해야 한다.", "원격 (유연성·생산성) + 대면 (협업·혁신) → 균형 잡힌 업무 틀"], "analogy": "화상으로만 회의하면 편하지만, 옆에서 툭 던지는 말로 아이디어가 터지는 순간은 사라지죠. 그래서 ‘집에서도 일하고, 필요할 땐 모이는’ 두 방식을 섞는 게 답이에요.", "bg": "분야는 사회·노동이에요. 팬데믹이 일하는 방식을 원격 근무(remote)로 바꾼 것이 배경. 완전 가상 환경의 한계도 드러났다는 단서가 나와요. → 원격과 대면 사이의 ‘균형’을 글이 어떻게 보는지에 주목하며 읽으세요.", "flow": [{"kind": "변화", "t": "팬데믹 → 하룻밤 새 원격 근무"}, {"kind": "장점", "t": "방해 줄어 생산성↑"}, {"kind": "한계", "t": "단절감·창의적 협업 어려움", "d": "기술도 ‘자발적 상호작용’은 복제 못 함."}, {"kind": "경고", "t": "팬데믹 이전으로 ‘그냥 복귀’는 교훈 낭비"}, {"kind": "결론", "t": "원격+대면 결합한 균형 틀이 답"}], "quiz": [["이 지문의 핵심 구조는?", "원격 (유연성·생산성) + 대면 (협업·혁신) → 균형 잡힌 업무 틀"], ["도식이 강조하는 결론은?", "팬데믹이 보여 준 장점·한계 모두 살려, 조직은 원격 유연성 + 대면 협업을 결합한 균형 잡힌 업무 틀(balanced framework)을 개발해야 한다."]], "vocab": [["remote operations", "원격 근무·원격 운영"], ["adaptability adapt", "적응력"], ["distraction distract", "(집중) 방해 요소"], ["spontaneous", "자발적인·즉흥적인"], ["squander", "낭비하다"], ["framework frame", "틀·체계"], ["foster", "조성하다·기르다"]], "en": "The pandemic fundamentally changed the way we work, pushing many organizations into remote operations virtually overnight. While this shift demonstrated remarkable adaptability, it also revealed the limitations of fully virtual environments. Employees report increased productivity from fewer distractions, but many struggle with feelings of disconnection and difficulties in creative collaboration. Technology provides impressive connectivity tools but cannot replicate the spontaneous interactions that drive innovation. As pandemic restrictions ease, a simple return to pre-pandemic norms would squander valuable lessons learned. It is essential that organizations develop balanced wo "1.3\"/>\n        </g>\n        <text x=\"10\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1FA34A\" font-weight=\"700\">innovation</text>\n      </g>\n      \n      <!-- 단점 ✗ -->\n      <g transform=\"translate(85, 145)\">\n        <g transform=\"translate(0, 0)\">\n          <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n          <line x1=\"-2\" y1=\"-2\" x2=\"2\" y2=\"2\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n          <line x1=\"2\" y1=\"-2\" x2=\"-2\" y2=\"2\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n        </g>\n        <text x=\"10\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\">less flexible</text>\n      </g>\n      <g transform=\"translate(85, 162)\">\n        <g transform=\"translate(0, 0)\">\n          <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n          <line x1=\"-2\" y1=\"-2\" x2=\"2\" y2=\"2\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n          <line x1=\"2\" y1=\"-2\" x2=\"-2\" y2=\"2\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n        </g>\n        <text x=\"10\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\">distraction</text>\n      </g>\n    </g>\n\n    <!-- 가운데: 결합 화살표 + 저울 -->\n    <g transform=\"translate(200, 100)\">\n      <!-- 좌측 → 가운데 화살표 -->\n      <line x1=\"0\" y1=\"20\" x2=\"40\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <polygon points=\"40,20 33,16 33,24\" fill=\"#1a1a1a\"/>\n      <!-- 우측 ← 가운데 화살표 -->\n      <line x1=\"210\" y1=\"20\" x2=\"170\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <polygon points=\"170,20 177,16 177,24\" fill=\"#1a1a1a\"/>\n      \n      <!-- 가운데 저울 -->\n      <g transform=\"translate(105, 25)\">\n        <!-- 기둥 -->\n        <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"35\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n        <!-- 가로 막대 -->\n        <line x1=\"-30\" y1=\"0\" x2=\"30\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n        <!-- 양쪽 접시 -->\n        <path d=\"M -36 0 Q -30 8 -24 0\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n        <path d=\"M 24 0 Q 30 8 36 0\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n        <!-- 기둥 매달림 끈 -->\n        <line x1=\"-30\" y1=\"0\" x2=\"-30\" y2=\"-2\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n        <line x1=\"30\" y1=\"0\" x2=\"30\" y2=\"-2\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n        <!-- 받침 -->\n        <ellipse cx=\"0\" cy=\"38\" rx=\"14\" ry=\"2.5\" fill=\"#1FA34A\"/>\n        <!-- 좌 접시 위 R 글자 -->\n        <text x=\"-30\" y=\"-5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">R</text>\n        <!-- 우 접시 위 P 글자 -->\n        <text x=\"30\" y=\"-5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">P</text>\n      </g>\n      \n      <!-- 가운데 라벨 -->\n      <text x=\"105\" y=\"-5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">integrate</text>\n      <text x=\"105\" y=\"80\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">균형 잡힌 업무 틀</text>\n      <text x=\"105\" y=\"92\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">balanced framework</text>\n    </g>\n\n    <!-- 하단 결론 -->\n    <text x=\"300\" y=\"270\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">remote flexibility + strategic face-to-face = employee well-being &amp; success</text>\n  </svg>", "caption": "원격 (유연성·생산성) + 대면 (협업·혁신) → 균형 잡힌 업무 틀"}, {"no": "2", "title": "Conviction Bias: Loud ≠ True", "ktitle": "큰 확신 → \"옳다\" 판단 / 주저함 → \"약함\" 판단 — 우리의 편향", "field": "심리·인지", "page": "8회 02번", "oneline": "우리는 의심을 덮으려 더 확신한다 — 이 자기 확신 편향이 단호한 지도자 = 옳음, 주저하는 사람 = 약함 이라는 잘못된 판단으로 이어진다.", "tldr": ["우리는 의심을 덮으려 더 확신한다 — 이 자기 확신 편향이 단호한 지도자 = 옳음, 주저하는 사람 = 약함 이라는 잘못된 판단으로 이어진다.", "큰 확신 → \"옳다\" 판단 / 주저함 → \"약함\" 판단 — 우리의 편향"], "analogy": "목소리 크고 단호하게 말하면 왠지 더 맞는 말 같죠? 사실은 ‘속으로 불안할수록 더 세게 우기는’ 건데, 우리는 그 확신을 ‘검증된 진실’로 착각해요.", "bg": "분야는 심리·인지예요. 핵심 개념은 ‘확신 편향(conviction bias)’ — 속으로 의심스러울수록 더 열정적으로 방어한다는 역설. → 강한 확신이 오히려 무엇을 숨기는 신호일 수 있는지에 주목하며 읽으세요.", "flow": [{"kind": "심리", "t": "속으로 의심 → 더 ‘열정적’ 방어"}, {"kind": "자기합리화", "t": "‘이만큼 지킬 에너지가 나오니 사실이겠지’"}, {"kind": "대인 적용", "t": "지도자가 확신에 차 말하면 = 신중히 검토했다 착각"}, {"kind": "역효과", "t": "주저·뉘앙스 = 약점·거짓으로 오해"}, {"kind": "결론", "t": "확신의 ‘세기’를 진실로 착각하는 편향"}], "quiz": [["이 지문의 핵심 구조는?", "큰 확신 → \"옳다\" 판단 / 주저함 → \"약함\" 판단 — 우리의 편향"], ["도식이 강조하는 결론은?", "우리는 의심을 덮으려 더 확신한다 — 이 자기 확신 편향이 단호한 지도자 = 옳음, 주저하는 사람 = 약함 이라는 잘못된 판단으로 이어진다."]], "vocab": [["hold on to", "~을 고수하다·붙들다"], ["go the extra mile", "한층 더 노력하다"], ["contradict contra-", "반박하다·모순되다"], ["bias", "편견·편향"], ["conviction con-", "확신·신념"], ["hesitant hesitate", "주저하는·망설이는"], ["self-doubt", "자기 회의"]], "en": "We hold on to an idea that is secretly pleasing to us, but deep inside we might have some doubts as to its truth, and so we go the extra mile to convince ourselves—to believe in it with great passion and to loudly contradict anyone who challenges us. We ask ourselves: How can our idea not be true if it brings out in us such energy to defend it? This bias is revealed even more clearly in our relationship to leaders—if they express an opinion with heated words and gestures, colorful metaphors and entertaining anecdotes, and a deep well of conviction, it must mean they have examined the idea carefully to express it with such certainty. Those, on the other hand, who express nuances, whose tone is more hesitant, reveal weakness and self-doubt. They are probably lying, or so we think.", "ko": "우리는 은밀히 우리에게 만족스러운 생각을 고수하지만, 마음 깊은 곳에 그것의 진위에 대해 약간의 의심을 가질 수도 있다, 그래서 우리는 스스로를 확신시키기 위해, 즉 매우 열정적으로 그것을 믿고, 우리에게 도전하는 모든 사람의 말을 크게 반박하려고 한층 더 노력한다. 우리는 스스로에게 묻는다. 만약 우리의 생각이 그것을 방어하기 위해 우리 안에 있던 그러한 에너지를 발휘한다면, 어떻게 그것이 사실이 아닐 수 있는가? 이런 편견은 지도자와 우리의 관계에서 더욱 분명하게 드러나는데, 만약 그들이 열띤 말과 몸짓, 화려한 은유와 재미있는 일화, 그리고 깊은 확신으로 의견을 표현한다면, 그것은 그들이 그러한 확신을 가지고 그것을 표현하기 위해 그 생각을 신중히 검토했다는 것을 의미하는 것임이 틀림없다. 반면 어조가 더 주저하는 뉘앙스를 표현하는 사람들은 약점과 자기 회의를 드러낸다. 그들은 아마 거짓말을 하고 있을 것이며, 적어도 우리는 그렇게 생각한다.", "read": [{"en": "We hold on to an idea that is secretly pleasing to us, but deep inside we might have some doubts as to its truth,", "ko": "우리는 은밀히 우리에게 만족스러운 생각을 고수하지만, 마음 깊은 곳에 그것의 진위에 대해 약간의 의심을 가질 수도 있다,", "chunks": [["We hold on to an idea", "우리는 어떤 생각을 고수한다"], ["that is secretly pleasing to us,", "은밀히 우리에게 만족스러운,"], ["but deep inside", "하지만 마음 깊은 곳에서는"], ["we might have some doubts", "약간의 의심을 가질 수도 있다"], ["as to its truth,", "그것의 진위에 관해,"]]}, {"en": "and so we go the extra mile to convince ourselves—to believe in it with great passion and to loudly contradict anyone who challenges us.", "ko": "그래서 우리는 스스로를 확신시키기 위해, 즉 매우 열정적으로 그것을 믿고, 우리에게 도전하는 모든 사람의 말을 크게 반박하려고 한층 더 노력한다.", "chunks": [["and so we go the extra mile", "그래서 우리는 한층 더 노력한다"], ["to convince ourselves—", "스스로를 확신시키기 위해—"], ["to believe in it with great passion", "매우 열정적으로 그것을 믿고"], ["and to loudly contradict", "그리고 크게 반박하기 위해"], ["anyone who challenges us.", "우리에게 도전하는 모든 사람을."]]}, {"en": "We ask ourselves: How can our idea not be true if it brings out in us such energy to defend it?", "ko": "우리는 스스로에게 묻는다. 만약 우리의 생각이 그것을 방어하기 위해 우리 안에 있던 그러한 에너지를 발휘한다면, 어떻게 그것이 사실이 아닐 수 있는가?", "chunks": [["We ask ourselves:", "우리는 스스로에게 묻는다:"], ["How can our idea not be true", "어떻게 우리의 생각이 사실이 아닐 수 있는가"], ["if it brings out in us", "만약 그것이 우리 안에 ~을 발휘한다면"], ["such energy to defend it?", "그것을 방어할 그러한 에너지를?"]]}, {"en": "This bias is revealed even more clearly in our relationship to leaders—if they express an opinion with heated words and gestures, colorful metaphors and entertaining anecdotes, and a deep well of conviction, it must mean they have examined the idea carefully to express it with such certainty.", "ko": "이런 편견은 지도자와 우리의 관계에서 더욱 분명하게 드러나는데, 만약 그들이 열띤 말과 몸짓, 화려한 은유와 재미있는 일화, 그리고 깊은 확신으로 의견을 표현한다면, 그것은 그들이 그러한 확신을 가지고 그것을 표현하기 위해 그 생각을 신중히 검토했다는 것을 의미하는 것임이 틀림없다.", "chunks": [["This bias is revealed", "이런 편향은 드러난다"], ["even more clearly", "훨씬 더 분명하게"], ["in our relationship to leaders—", "지도자와 우리의 관계에서—"], ["if they express an opinion with heated words and gestures,", "만약 그들이 열띤 말과 몸짓으로 의견을 표현한다면,"], ["colorful metaphors and entertaining anecdotes,", "화려한 은유와 재미있는 일화,"], ["and a deep well of conviction,", "그리고 깊은 확신의 우물(샘)으로,"], ["it must mean", "그것은 ~을 의미하는 것임이 틀림없다"], ["they have examined the idea carefully", "그들이 그 생각을 신중히 검토했다는 것을"], ["to express it with such certainty.", "그것을 그러한 확신으로 표현하기 위해."]]}, {"en": "Those, on the other hand, who express nuances, whose tone is more hesitant, reveal weakness and self-doubt.", "ko": "반면 어조가 더 주저하는 뉘앙스를 표현하는 사람들은 약점과 자기 회의를 드러낸다.", "chunks": [["Those, on the other hand,", "반면, ~한 사람들은"], ["who express nuances,", "뉘앙스를 표현하는,"], ["whose tone is more hesitant,", "어조가 더 주저하는,"], ["reveal weakness and self-doubt.", "약점과 자기 회의를 드러낸다."]]}, {"en": "They are probably lying, or so we think.", "ko": "그들은 아마 거짓말을 하고 있을 것이며, 적어도 우리는 그렇게 생각한다.", "chunks": [["They are probably lying,", "그들은 아마 거짓말을 하고 있을 것이다,"], ["or so we think.", "아니, 적어도 우리는 그렇게 생각한다."]]}], "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 큰 손짓과 확신에 찬 리더를 우리가 옳다고 잘못 판단하고, 오른쪽 주저하는 사람을 약함과 거짓이라고 잘못 판단하는 그림. 위쪽의 진짜 진실은 알 수 없는 상태로 회색 물음표로 표시.\">\n    <!-- 위: 진짜 진실 = 알 수 없음 -->\n    <g transform=\"translate(300, 32)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"55\" ry=\"18\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\" font-weight=\"700\">the truth</text>\n      <text x=\"0\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#999\">알 수 없음 ?</text>\n    </g>\n\n    <!-- 좌측 영역: 확신 리더 (외양 → \"옳다\" 판단) -->\n    <g transform=\"translate(20, 80)\">\n      <text x=\"135\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">큰 확신·단호함 — Loud Certainty</text>\n      <rect x=\"0\" y=\"0\" width=\"270\" height=\"170\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/>\n\n      <!-- 리더 stick figure (크게·과장된 손짓) -->\n      <g transform=\"translate(80, 90)\">\n        <!-- 머리 -->\n        <circle cx=\"0\" cy=\"-25\" r=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n        <!-- 눈 (강한) -->\n        <circle cx=\"-4\" cy=\"-26\" r=\"1.5\" fill=\"#1a1a1a\"/>\n        <circle cx=\"4\" cy=\"-26\" r=\"1.5\" fill=\"#1a1a1a\"/>\n        <!-- 강한 입 (벌림) -->\n        <ellipse cx=\"0\" cy=\"-18\" rx=\"4\" ry=\"3\" fill=\"#1a1a1a\"/>\n        <!-- 몸 -->\n        <line x1=\"0\" y1=\"-11\" x2=\"0\" y2=\"25\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n        <!-- 큰 손짓 팔 (위로) -->\n        <line x1=\"0\" y1=\"-5\" x2=\"-22\" y2=\"-20\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n        <line x1=\"0\" y1=\"-5\" x2=\"22\" y2=\"-20\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n        <!-- 주먹 -->\n        <circle cx=\"-22\" cy=\"-20\" r=\"3\" fill=\"#c8102e\"/>\n        <circle cx=\"22\" cy=\"-20\" r=\"3\" fill=\"#c8102e\"/>\n        <!-- 다리 (벌림) -->\n        <line x1=\"0\" y1=\"25\" x2=\"-8\" y2=\"45\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n        <line x1=\"0\" y1=\"25\" x2=\"8\" y2=\"45\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      </g>\n\n      <!-- 큰 외침 풍선 (빨강) -->\n      <g transform=\"translate(155, 60)\">\n        <path d=\"M -45 -15 L 45 -15 L 45 15 L 10 15 L 0 25 L 0 15 L -45 15 Z\" \n              fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">\"I'm RIGHT!\"</text>\n        <text x=\"0\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">heated · loud · certain</text>\n      </g>\n\n      <!-- 우리의 판단 라벨 -->\n      <g transform=\"translate(135, 155)\">\n        <rect x=\"-65\" y=\"-7\" width=\"130\" height=\"15\" fill=\"#c8102e\" rx=\"2\"/>\n        <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">we judge: \"must be right\" ✗</text>\n      </g>\n    </g>\n\n    <!-- 우측 영역: 주저하는 사람 → \"약함\" 판단 -->\n    <g transform=\"translate(310, 80)\">\n      <text x=\"135\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">주저함·뉘앙스 — Hesitant Tone</text>\n      <rect x=\"0\" y=\"0\" width=\"270\" height=\"170\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/>\n\n      <!-- 주저하는 사람 (작고 옅음) -->\n      <g transform=\"translate(80, 95)\" opacity=\"0.7\">\n        <!-- 머리 (작음) -->\n        <circle cx=\"0\" cy=\"-18\" r=\"10\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <!-- 눈 (옅음) -->\n        <circle cx=\"-3\" cy=\"-19\" r=\"1\" fill=\"#1a1a1a\"/>\n        <circle cx=\"3\" cy=\"-19\" r=\"1\" fill=\"#1a1a1a\"/>\n        <!-- 작은 입 (살짝) -->\n        <path d=\"M -2 -13 Q 0 -12 2 -13\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        <!-- 몸 -->\n        <line x1=\"0\" y1=\"-8\" x2=\"0\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <!-- 팔 (어깨 으쓱·작음) -->\n        <line x1=\"0\" y1=\"-2\" x2=\"-10\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <line x1=\"0\" y1=\"-2\" x2=\"10\" y2=\"6\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <!-- 다리 -->\n        <line x1=\"0\" y1=\"20\" x2=\"-6\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <line x1=\"0\" y1=\"20\" x2=\"6\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      </g>\n\n      <!-- 작은 풍선 (점선 — 망설임) -->\n      <g transform=\"translate(160, 75)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"55\" ry=\"16\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.2\" stroke-dasharray=\"3 2\"/>\n        <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">\"perhaps... maybe...\"</text>\n        <text x=\"0\" y=\"10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#999\">hesitant · nuanced</text>\n      </g>\n\n      <!-- 우리의 판단 라벨 -->\n      <g transform=\"translate(135, 155)\">\n        <rect x=\"-72\" y=\"-7\" width=\"144\" height=\"15\" fill=\"#c8102e\" rx=\"2\"/>\n        <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">we judge: \"weak · lying\" ✗</text>\n      </g>\n    </g>\n\n    <!-- 하단 결론 -->\n    <text x=\"300\" y=\"268\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">loud certainty ≠ truth · self-conviction bias misleads our judgment</text>\n  </svg>", "caption": "큰 확신 → \"옳다\" 판단 / 주저함 → \"약함\" 판단 — 우리의 편향"}, {"no": "3", "title": "Calhoun's 'Behavioral Sink'", "ktitle": "쥐 유토피아 → 임계치 초과 과밀 → 행동 붕괴 4가지", "field": "생물·행동", "page": "8회 03번", "oneline": "Calhoun의 '쥐 유토피아' 실험 — 임계치를 넘는 과밀은 모성 본능 상실 · 수컷의 동족 포식·과잉행동·위축 등 행동의 심각한 변화를 촉발한다.", "tldr": ["Calhoun의 '쥐 유토피아' 실험 — 임계치를 넘는 과밀은 모성 본능 상실 · 수컷의 동족 포식·과잉행동·위축 등 행동의 심각한 변화를 촉발한다.", "쥐 유토피아 → 임계치 초과 과밀 → 행동 붕괴 4가지"], "analogy": "먹을 것 걱정 없는 ‘천국’이라도 한 공간에 너무 많이 몰리면 다툼·방치·은둔이 터져요. 풍족함이 아니라 ‘과밀’이 무리를 무너뜨린다는 거예요.", "bg": "분야는 생물·행동이에요. John B. Calhoun의 ‘쥐 유토피아’ 실험과 ‘행동 침몰(behavioral sink)’ 개념이 핵심. 먹이·물을 무제한 준 환경이 배경이에요. → 풍요로운 환경이 왜 무너지는 결과로 이어지는지에 초점을 두고 읽으세요.", "flow": [{"kind": "실험", "t": "쥐에게 먹이·물 무제한 = ‘쥐 유토피아’", "d": "통제 안 된 번식·개체 수 폭증."}, {"kind": "전환", "t": "임계치 넘자 집단 ‘완전 붕괴’"}, {"kind": "암컷", "t": "임신 유지 실패·분만 중 사망·모성 본능 상실"}, {"kind": "수컷", "t": "동족 포식·과잉 행동·위축"}, {"kind": "결론", "t": "과도한 ‘과밀’이 행동을 붕괴시킨다"}], "quiz": [["이 지문의 핵심 구조는?", "쥐 유토피아 → 임계치 초과 과밀 → 행동 붕괴 4가지"], ["도식이 강조하는 결론은?", "Calhoun의 '쥐 유토피아' 실험 — 임계치를 넘는 과밀은 모성 본능 상실 · 수컷의 동족 포식·과잉행동·위축 등 행동의 심각한 변화를 촉발한다."]], "vocab": [["behavioral sink", "행동 침몰 (과밀에 의한 행동 붕괴)"], ["groundbreaking ground", "획기적인"], ["breeding", "번식"], ["critical level", "임계치·임계 수준"], ["maternal instinct", "모성 본능"], ["withdrawal withdraw", "위축·은둔"], ["trigger", "촉발하다·유발하다"]], "en": "In a 1962 piece published in Scientific American, Professor John B. Calhoun introduced the thought-provoking concept of behavioral sink, a phenomenon he observed during his groundbreaking population studies. Calhoun conducted a series of experiments in which he gave groups of rats all the food and water they needed. This \"rat utopia\" enabled uncontrolled breeding and population growth. However, Calhoun and his colleagues observed a complete breakdown of these groups once the population numbers got to a critical level. Many of the female rats were either unable to carry a pregnancy to full term or died during delivery of their litters. Those that were successful at childbirth failed to show normal maternal instincts to care for the pups. The male rats showed severe behavioral disturbances, including cannibalism, overactivity, and withdrawal. These findings indicated that excessive population concentration can trigger severe changes in typical behaviors, such as increased aggression, lack of maternal care, and withdrawal from social interaction.", "ko": "1962년 'Scientific American'에 실린 논문에서 John B. Calhoun 교수는 획기적인 개체군 연구 중에 관찰한 행동인 '행동 침몰'이라는 생각을 자극하는 개념을 소개했다. Calhoun은 쥐 집단에게 필요한 모든 음식과 물을 제공하는 일련의 실험을 수행했다. 이 '쥐 유토피아'는 통제되지 않은 번식과 개체 수 증가를 가능하게 했다. 그러나 Calhoun과 그의 동료들은 일단 개체 수가 임계치에 도달하자 이 집단이 완전히 붕괴되는 것을 관찰했다. 많은 암컷 쥐들이 임신을 만삭까지 유지하지 못하거나 새끼를 분만하는 과정에서 죽었다. 출산에 성공한 쥐들은 새끼를 돌보는 정상적인 모성 본능을 보여 주지 못했다. 수컷 쥐들은 동족 포식, 과잉 행동, (사회적) 위축을 포함하여 심각한 행동 장애를 보였다. 이러한 연구 결과는 과도한 개체 수 집중이 공격성 증가, 모성 보호 부족, 사회적 상호 작용의 위축과 같은 일반적인 행동의 심각한 변화를 촉발할 수 있다는 것을 나타냈다.", "read": [{"en": "In a 1962 piece published in Scientific American, Professor John B. Calhoun introduced the thought-provoking concept of behavioral sink, a phenomenon he observed during his groundbreaking population studies.", "ko": "1962년 'Scientific American'에 실린 논문에서 John B. Calhoun 교수는 획기적인 개체군 연구 중에 관찰한 행동인 '행동 침몰'이라는 생각을 자극하는 개념을 소개했다.", "chunks": [["In a 1962 piece", "1962년의 한 논문에서"], ["published in Scientific American,", "'Scientific American'에 실린,"], ["Professor John B. Calhoun introduced", "John B. Calhoun 교수는 소개했다"], ["the thought-provoking concept of behavioral sink,", "'행동 침몰'이라는 생각을 자극하는 개념을,"], ["a phenomenon he observed", "그가 관찰한 현상"], ["during his groundbreaking population studies.", "그의 획기적인 개체군 연구 중에."]]}, {"en": "Calhoun conducted a series of experiments in which he gave groups of rats all the food and water they needed.", "ko": "Calhoun은 쥐 집단에게 필요한 모든 음식과 물을 제공하는 일련의 실험을 수행했다.", "chunks": [["Calhoun conducted", "Calhoun은 수행했다"], ["a series of experiments", "일련의 실험을"], ["in which he gave groups of rats", "그 안에서 그가 쥐 집단에게 ~을 주는"], ["all the food and water they needed.", "그들이 필요한 모든 음식과 물을."]]}, {"en": "This \"rat utopia\" enabled uncontrolled breeding and population growth.", "ko": "이 '쥐 유토피아'는 통제되지 않은 번식과 개체 수 증가를 가능하게 했다.", "chunks": [["This \"rat utopia\"", "이 '쥐 유토피아'는"], ["enabled", "가능하게 했다"], ["uncontrolled breeding and population growth.", "통제되지 않은 번식과 개체 수 증가를."]]}, {"en": "However, Calhoun and his colleagues observed a complete breakdown of these groups once the population numbers got to a critical level.", "ko": "그러나 Calhoun과 그의 동료들은 일단 개체 수가 임계치에 도달하자 이 집단이 완전히 붕괴되는 것을 관찰했다.", "ch al interaction.", "사회적 상호 작용으로부터의 위축과 같은."]]}], "metaphor": "<svg viewBox=\"0 0 600 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 쥐 유토피아 우리에 임계치를 넘는 과밀이 발생하고 빨강 점선 임계선을 통과한 뒤 오른쪽 네 갈래로 분기되어 모성 본능 상실, 수컷 동족 포식, 과잉행동, 사회적 위축이라는 행동 붕괴가 나타나는 그림\">\n    <!-- 좌측: 쥐 유토피아 우리 -->\n    <g transform=\"translate(20, 35)\">\n      <text x=\"90\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">쥐 유토피아 — Rat Utopia</text>\n      <!-- 우리 (사각형 + 격자) -->\n      <rect x=\"0\" y=\"0\" width=\"180\" height=\"160\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 격자 (창살 느낌) -->\n      <g stroke=\"#999\" stroke-width=\"0.7\" opacity=\"0.5\">\n        <line x1=\"30\" y1=\"0\" x2=\"30\" y2=\"160\"/>\n        <line x1=\"60\" y1=\"0\" x2=\"60\" y2=\"160\"/>\n        <line x1=\"90\" y1=\"0\" x2=\"90\" y2=\"160\"/>\n        <line x1=\"120\" y1=\"0\" x2=\"120\" y2=\"160\"/>\n        <line x1=\"150\" y1=\"0\" x2=\"150\" y2=\"160\"/>\n        <line x1=\"0\" y1=\"35\" x2=\"180\" y2=\"35\"/>\n        <line x1=\"0\" y1=\"70\" x2=\"180\" y2=\"70\"/>\n        <line x1=\"0\" y1=\"105\" x2=\"180\" y2=\"105\"/>\n        <line x1=\"0\" y1=\"140\" x2=\"180\" y2=\"140\"/>\n      </g>\n      \n      <!-- 음식·물 라벨 (좌상단) -->\n      <g transform=\"translate(10, 14)\">\n        <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1FA34A\" font-weight=\"700\">food ✓ water ✓</text>\n      </g>\n      \n      <!-- 쥐 (많이) — 단순 타원 + 꼬리 -->\n      <!-- 위 줄 -->\n      <g fill=\"#1a1a1a\">\n        <g transform=\"translate(35, 50)\"><ellipse cx=\"0\" cy=\"0\" rx=\"6\" ry=\"3.5\"/><circle cx=\"-5\" cy=\"-1\" r=\"2\"/><path d=\"M 5 1 Q 9 2 11 4\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/></g>\n        <g transform=\"translate(70, 45)\"><ellipse cx=\"0\" cy=\"0\" rx=\"6\" ry=\"3.5\"/><circle cx=\"5\" cy=\"-1\" r=\"2\"/><path d=\"M -5 1 Q -9 2 -11 4\" fill=\"none\" stroke=\"#1 ext>\n        <text x=\"22\" y=\"14\" font-family=\"Noto Serif\" font-weight=\"700\" font-style=\"italic\" font-size=\"9.5\" fill=\"#c8102e\">hyperactivity</text>\n        <text x=\"9\" y=\"29\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#1a1a1a\">과잉 행동</text>\n        <text x=\"9\" y=\"42\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#1a1a1a\">비정상적 흥분</text>\n        <text x=\"9\" y=\"53\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#999\">overactivity</text>\n      </g>\n\n      <!-- 증상 4: 사회적 위축 -->\n      <g transform=\"translate(160, 78)\">\n        <rect x=\"0\" y=\"0\" width=\"146\" height=\"56\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\" rx=\"3\"/>\n        <text x=\"9\" y=\"14\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"9.5\" fill=\"#c8102e\">④</text>\n        <text x=\"22\" y=\"14\" font-family=\"Noto Serif\" font-weight=\"700\" font-style=\"italic\" font-size=\"9.5\" fill=\"#c8102e\">withdrawal</text>\n        <text x=\"9\" y=\"29\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#1a1a1a\">사회적 위축</text>\n        <text x=\"9\" y=\"42\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#1a1a1a\">상호작용 거부</text>\n        <text x=\"9\" y=\"53\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#999\">social withdrawal</text>\n      </g>\n    </g>\n\n    <!-- 하단: 결론 -->\n    <text x=\"300\" y=\"278\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">excessive population concentration → severe behavioral breakdown</text>\n  </svg>", "caption": "쥐 유토피아 → 임계치 초과 과밀 → 행동 붕괴 4가지"}, {"no": "4", "title": "Reading Fiction Builds the Mind", "ktitle": "책 + 독자 → 시뮬레이션 (동일 신경망) → 공감·사회 기술 ↑", "field": "인지·문학", "page": "8회 04번", "oneline": "소설 읽기는 등장인물의 시뮬레이션 → 동일 신경망 활성 → 공감·사회 기술 향상으로 이어진다 — 특히 문학 소설이 사실 학습으로는 불가능한 방식으로 마음을 훈련한다.", "tldr": ["소설 읽기는 등장인물의 시뮬레이션 → 동일 신경망 활성 → 공감·사회 기술 향상으로 이어진다 — 특히 문학 소설이 사실 학습으로는 불가능한 방식으로 마음을 훈련한다.", "책 + 독자 → 시뮬레이션 (동일 신경망) → 공감·사회 기술 ↑"], "analogy": "등장인물의 도전을 따라가다 보면 ‘만약 나라면?’을 계속 돌려보게 되죠. 사실을 외우는 것과 달리, 이 ‘허구 속 감정 체험’이 실제 사람 마음을 읽는 근육을 키워줘요 — 특히 인물이 복잡한 문학 소설일수록요.", "bg": "분야는 인지·문학이에요. 소설(fiction)이 독자를 다른 마음·세계로 데려가 ‘대리 경험’을 만든다는 것이 단서. → 허구를 읽는 일이 공감 능력과 어떻게 연결되는지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "소설 = 다른 세계·마음의 대리 경험"}, {"kind": "메커니즘", "t": "인물의 생각·감정을 ‘정신적 모의실험’", "d": "직접 경험 vs 묘사 읽기 = 같은 신경망."}, {"kind": "근거", "t": "소설 자주 읽는 사람 = 타인 이해 점수↑"}, {"kind": "비교", "t": "문학 소설 > 논픽션·오락물 (공감 향상)"}, {"kind": "결론", "t": "허구 체험이 실제 사회 이해를 훈련한다"}], "quiz": [["이 지문의 핵심 구조는?", "책 + 독자 → 시뮬레이션 (동일 신경망) → 공감·사회 기술 ↑"], ["도식이 강조하는 결론은?", "소설 읽기는 등장인물의 시뮬레이션 → 동일 신경망 활성 → 공감·사회 기술 향상으로 이어진다 — 특히 문학 소설이 사실 학습으로는 불가능한 방식으로 마음을 훈련한다."]], "vocab": [["transport trans-", "이동시키다·실어 나르다"], ["simulate", "모의실험하다·흉내 내다"], ["neural network", "신경망"], ["perspective", "관점·시각"], ["empathy", "공감·감정 이입"], ["social cue", "사회적 신호"], ["sensitivity sensitive", "민감성·감수성"]], "en": "Books transport readers into worlds and minds different from their own, creating experiences that are impossible in everyday life. As readers follow characters through their challenges, they mentally simulate what others think and feel in different situations. Brain scans show that the same neural networks are activated whether someone is experiencing an emotion directly or reading vivid descriptions of characters experiencing it. Regular readers of fiction perform better on tests that measure their ability to understand the perspectives and motivations of others. This mental exercise builds social skills that extend beyond the reading experience. Studies comparing different types of texts have found that literary fiction, with its complex characters and situations, produces stronger gains in empathy than nonfiction or entertainment reading. Even short stories can temporarily increase a person's sensitivity to social cues. The emotional journey through fictional lives seems to train the human mind for real-world social understanding in a way that simply learning facts cannot.", "ko": "책은 독자를 그들 자신과 다른 세계와 정신으로 이동시켜, 일상에서는 불가능한 경험을 만들어 낸다. 독자가 등장인물의 도전을 따라가면서, 그들은 다른 사람들이 서로 다른 상황에서 생각하고 느끼는 것을 정신적으로 모의실험한다. 뇌 스캔 결과, 누군가가 감정을 직접 경험하고 있든 감정을 경험하는 등장인물의 생생한 묘사를 읽고 있든 동일한 신경망이 활성화되는 것으로 나타났다. 소설을 정기적으로 읽는 사람들은 다른 사람의 관점과 동기를 이해하는 능력을 측정하는 테스트에서 더 나은 성적을 거둔다. 이러한 정신적 훈련은 독서 경험 너머로 확대되는 사회적 기술을 구축한다. 서로 다른 유형의 텍스트를 비교한 연구에 따르면, 복잡한 등장인물과 상황을 담은 문학 소설이 논픽션이나 오락물보다 공감 능력을 더 크게 향상시키는 것으로 나타났다. 단편 소설조차도 일시적으로 사회적 신호에 대한 한 사람의 민감성을 높일 수 있다. 허구의 삶을 통한 정서적 여정은 단순히 사실을 배우는 것만으로는 할 수 없는 방식으로 실제 사회 이해에 대한 인간의 마음을 훈련시키는 것으로 보인다.", "read": [{"en": "Books transport readers into worlds and minds different from their own, creating experiences that are impossible in everyday life.", "ko": "책은 독자를 그들 자신과 다른 세계와 정신으로 이동시켜, 일상에서는 불가능한 경험을 만들어 낸다.", "chunks": [["Books transport readers", "책은 독자를 이동시킨다"], ["into worlds and minds", "세계와 정신으로"], ["different from their own,", "그들 자신과 다른,"], ["creating experiences", "경험을 만들어 내면서"], ["that are impossible in everyday life.", "일상에서는 불가능한."]]}, {"en": "As readers follow characters through their challenges, they mentally simulate what others think and feel in different situations.", "ko": "독자가 등장인물의 도전을 따라가면서, 그들은 다른 사람들이 서로 다른 상황에서 생각하고 느끼는 것을 정신적으로 모의실험한다.", "chunks": [["As readers follow characters", "독자가 등장인물을 따라가면서"], ["through their challenges,", "그들의 도전을 통해,"], ["they mentally simulate", "그들은 정신적으로 모의실험한다"], ["what others think and feel", "다른 사람들이 생각하고 느끼는 것을"], ["in different situations.", "서로 다른 상황에서."]]}, {"en": "Brain scans show that the same neural networks are activated whether someone is experiencing an emotion directly or reading vivid descriptions of characters experiencing it.", "ko": "뇌 스캔 결과, 누군가가 감정을 직접 경험하고 있든 감정을 경험하는 등장인물의 생생한 묘사를 읽고 있든 동일한 신경망이 활성화되는 것으로 나타났다.", "chunks": [["Brain scans show that", "뇌 스캔은 ~을 보여 준다"], ["the same neural networks are activated", "동일한 신경망이 활성화된다는 것을"], [" ctional lives seems to train the human mind for real-world social understanding in a way that simply learning facts cannot.", "ko": "허구의 삶을 통한 정서적 여정은 단순히 사실을 배우는 것만으로는 할 수 없는 방식으로 실제 사회 이해에 대한 인간의 마음을 훈련시키는 것으로 보인다.", "chunks": [["The emotional journey through fictional lives", "허구의 삶을 통한 정서적 여정은"], ["seems to train the human mind", "인간의 마음을 훈련시키는 것으로 보인다"], ["for real-world social understanding", "실제 사회 이해를 위해"], ["in a way that simply learning facts cannot.", "단순히 사실을 배우는 것만으로는 할 수 없는 방식으로."]]}], "metaphor": "<svg viewBox=\"0 0 600 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 책을 읽는 독자, 가운데 직접 경험과 읽기가 같은 신경망을 활성화하는 뇌, 오른쪽 공감과 사회적 기술의 향상으로 이어지는 변환 흐름. 하단에 문학 소설이 사실 학습보다 더 효과적임을 비교.\">\n    <!-- 좌측: 책 + 독자 -->\n    <g transform=\"translate(20, 30)\">\n      <text x=\"75\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">책 + 독자</text>\n      <rect x=\"0\" y=\"0\" width=\"150\" height=\"160\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"1.2\"/>\n      \n      <!-- 독자 -->\n      <g transform=\"translate(45, 65)\">\n        <circle cx=\"0\" cy=\"-25\" r=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n        <circle cx=\"-4\" cy=\"-26\" r=\"1.2\" fill=\"#1a1a1a\"/>\n        <circle cx=\"4\" cy=\"-26\" r=\"1.2\" fill=\"#1a1a1a\"/>\n        <path d=\"M -3 -20 Q 0 -18 3 -20\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <line x1=\"0\" y1=\"-12\" x2=\"0\" y2=\"25\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n        <!-- 팔 (책을 잡음) -->\n        <line x1=\"0\" y1=\"-3\" x2=\"18\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <line x1=\"0\" y1=\"-3\" x2=\"-3\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <line x1=\"0\" y1=\"25\" x2=\"-7\" y2=\"42\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <line x1=\"0\" y1=\"25\" x2=\"7\" y2=\"42\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      </g>\n      \n      <!-- 책 (펼쳐진 형태) -->\n 0.9\"/>\n        </g>\n      </g>\n      \n      <text x=\"75\" y=\"140\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">follows characters</text>\n      <text x=\"75\" y=\"153\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">through challenges</text>\n    </g>\n\n    <!-- 가운데: 뇌 (동일 신경망) -->\n    <g transform=\"translate(180, 30)\">\n      <text x=\"120\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">시뮬레이션 → 동일 신경망</text>\n      <rect x=\"0\" y=\"0\" width=\"240\" height=\"160\" fill=\"#f0faf3\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      \n      <!-- 좌측 화살표 진입 -->\n      <line x1=\"-15\" y1=\"80\" x2=\"5\" y2=\"80\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <polygon points=\"5,80 -2,76 -2,84\" fill=\"#1a1a1a\"/>\n      \n      <!-- 뇌 (단순 윤곽) -->\n      <g transform=\"translate(120, 80)\">\n        <!-- 뇌 외곽 -->\n        <path d=\"M -42 -20 Q -50 -28 -42 -36 Q -32 -42 -22 -38 Q -10 -44 4 -40 Q 16 -44 28 -36 Q 42 -32 42 -20 Q 50 -10 42 4 Q 40 16 28 18 Q 14 22 0 20 Q -14 22 -28 18 Q -42 16 -44 4 Q -52 -10 -42 -20 Z\" \n              fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n        <!-- 뇌 주름 -->\n        <path d=\"M -32 -20 Q -22 -14 -12 -22 Q 0 -12 12 -22 Q 22 -14 32 -20\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        <path d=\"M -30 -8 Q -18 -2 -6 -10 Q 6 -2 18 -10 Q 30 -2 32 -6\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        <path d=\"M -28 4 Q -16 12 -4 4 Q 8 12 20 4\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        \n        <!-- 활성 신경망 (초록 빛 점들) -->\n        <circle cx=\"-22\" cy=\"-12\" r=\"3\" fill=\"#1FA34A\" opacity=\"0.7\"/>\n        <circle cx=\"-8\" cy=\"-2\" r=\"3.5\" fill=\"#1FA34A\" opacity=\"0.8\"/>\n        <circle cx=\"10\" cy=\"-8\" r=\"3\" fill=\"#1FA34A\" opacity=\"0.7\"/>    <!-- 하단 비교: literary fiction > nonfiction -->\n    <g transform=\"translate(0, 210)\">\n      <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">유형별 효과 비교</text>\n      \n      <!-- literary fiction (긴 막대 — 강함) -->\n      <g transform=\"translate(120, 28)\">\n        <text x=\"0\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1FA34A\" font-weight=\"700\">literary fiction</text>\n        <rect x=\"100\" y=\"0\" width=\"200\" height=\"12\" fill=\"#1FA34A\" rx=\"2\"/>\n        <text x=\"310\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1FA34A\" font-weight=\"700\">strongest ★</text>\n      </g>\n      \n      <!-- popular fiction (중간 막대) -->\n      <g transform=\"translate(120, 45)\">\n        <text x=\"0\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\">popular fiction</text>\n        <rect x=\"100\" y=\"0\" width=\"135\" height=\"12\" fill=\"#1a1a1a\" opacity=\"0.5\" rx=\"2\"/>\n      </g>\n      \n      <!-- nonfiction (짧은 막대 — 약함) -->\n      <g transform=\"translate(120, 62)\">\n        <text x=\"0\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\">nonfiction (facts)</text>\n        <rect x=\"100\" y=\"0\" width=\"55\" height=\"12\" fill=\"#c8102e\" opacity=\"0.5\" rx=\"2\"/>\n        <text x=\"165\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\">limited</text>\n      </g>\n    </g>\n  </svg>", "caption": "책 + 독자 → 시뮬레이션 (동일 신경망) → 공감·사회 기술 ↑"}, {"no": "5", "title": "Exploring Music as Navigating New Worlds", "ktitle": "익숙한 음악 (작은 섬) → 항해 (나침반·해도) → 확장된 horizon", "field": "예술·인지", "page": "8회 05번", "oneline": "음악 탐험은 새로운 항해 방법을 배우는 것 — 낯선 음악에 방향을 얻으면 시야가 확장(expanding horizons)되고, '참여 음악 문화'의 인식은 음악관 자체를 재설정한다.", "tldr": ["음악 탐험은 새로운 항해 방법을 배우는 것 — 낯선 음악에 방향을 얻으면 시야가 확장(expanding horizons)되고, '참여 음악 문화'의 인식은 음악관 자체를 재설정한다.", "익숙한 음악 (작은 섬) → 항해 (나침반·해도) → 확장된 horizon"], "analogy": "낯선 동네를 걸으며 새 길을 찾으면 지도가 넓어지죠. 낯선 음악을 더듬어 가는 것도 똑같이 ‘마음속 지도(시야)’를 넓히는 일이에요.", "bg": "분야는 예술·인지예요. ‘새 음악 탐구 = 새 항해법 익히기’라는 비유가 핵심(Charles Nussbaum 인용). → 음악을 듣는 것을 왜 ‘움직임·길 찾기’에 빗대는지에 초점을 두고 읽으세요.", "flow": [{"kind": "비유", "t": "새 음악 탐구 = 새 ‘항해·길 찾기’ 방법"}, {"kind": "원리", "t": "음악 속 길 찾기 = 공간 표현 능력 사용", "d": "Nussbaum: 방향 감각 얻기 = 시야 확장."}, {"kind": "효과", "t": "때론 음악의 의미에 대한 ‘새 관점’"}, {"kind": "사례", "t": "Venda 족 — 음악을 모두의 ‘참여’로 봄", "d": "전문가만의 기능 ✗ → 서구인 태도 재설정."}, {"kind": "결론", "t": "음악 탐구가 곧 시야·관점을 넓힌다"}], "quiz": [["이 지문의 핵심 구조는?", "익숙한 음악 (작은 섬) → 항해 (나침반·해도) → 확장된 horizon"], ["도식이 강조하는 결론은?", "음악 탐험은 새로운 항해 방법을 배우는 것 — 낯선 음악에 방향을 얻으면 시야가 확장(expanding horizons)되고, '참여 음악 문화'의 인식은 음악관 자체를 재설정한다."]], "vocab": [["amount to", "~와 같다·~에 해당하다"], ["navigate", "길을 찾다·항해하다"], ["chart a course", "진로를 정하다·항로를 그리다"], ["bearings", "방향 감각·위치"], ["horizon", "시야·지평"], ["participatory participate", "참여적인"], ["reorient re-", "방향을 재설정하다"]], "en": "In most cases, exploring new patterns in music amounts to investigating alternative ways to navigate. Learning new music is learning new ways to move as well as hitherto unexplored ways of charting a course. As Charles Nussbaum tells us, we engage our capacity to represent space when we are finding our way in music. Gaining our bearings in alien music amounts quite literally to expanding our horizons. Some of our discoveries might be merely enjoyable excursions. But at times the impact of our adventures may be a whole new perspective on what music can mean in our lives. The recognition, for Westerners, that there are whole cultures who see music as primarily participatory, who see serious music-making as a \"natural\" part of life, and who do not think of music-making as a special skill or the province of experts, can reorient their attitudes toward music and its place in their lives. John Blacking's How Musical Is Man? is testimony to such a revolution in his musical outlook as a consequence of spending time among the Venda people of Africa.", "ko": "대부분의 경우, 음악의 새로운 패턴을 탐구하는 것은 다른 항해 방법을 조사하는 것과 같다. 새로운 음악을 배우는 것은 지금까지 탐험되지 않은 진로를 정하는 방법뿐 아니라 움직이는 새로운 방법도 배우는 것이다. Charles Nussbaum이 우리에게 말해 주듯, 우리는 음악 안에서 길을 찾을 때 공간을 나타내는 우리의 능력을 끌어들인다. 낯선 음악에 대한 우리의 방향 감각을 얻는 것은 그야말로 우리의 시야를 확장하는 것 같다. 우리의 발견 중 일부는 단지 즐거운 여행일 수 있다. 그렇지만 간혹 우리 모험의 영향은 음악이 우리 생활에서 무엇을 의미할 수 있는지에 대한 완전히 새로운 관점이 될 수도 있다. 서구인들에게, 음악을 주로 참여적인 것으로 보고, 진지한 음악 연주를 생활의 '자연스러운' 부분으로 보며, 그리고 음악 연주를 특별한 기능이나 전문가들의 분야로 보지 않는 그러한 문화 전체가 있다는 인식은 음악과 음악이 그들의 생활에서 차지하는 자리에 대한 그들의 태도의 방향을 재설정해 준다. John Blacking의 '인간은 얼마나 음악적인가?'는 아프리카의 Venda 족 사이에서 시간을 보낸 결과로 그의 음악적인 전망에 일어난 그러한 혁명의 증언이다.", "read": [{"en": "In most cases, exploring new patterns in music amounts to investigating alternative ways to navigate.", "ko": "대부분의 경우, 음악의 새로운 패턴을 탐구하는 것은 다른 항해 방법을 조사하는 것과 같다.", "chunks": [["In most cases,", "대부분의 경우,"], ["exploring new patterns in music", "음악의 새로운 패턴을 탐구하는 것은"], ["amounts to investigating", "조사하는 것과 같다"], ["alternative ways to navigate.", "다른 항해 방법을."]]}, {"en": "Learning new music is learning new ways to move as well as hitherto unexplored ways of charting a course.", "ko": "새로운 음악을 배우는 것은 지금까지 탐험되지 않은 진로를 정하는 방법뿐 아니라 움직이는 새로운 방법도 배우는 것이다.", "chunks": [["Learning new music is", "새로운 음악을 배우는 것은"], ["learning new ways to move", "움직이는 새로운 방법을 배우는 것이다"], ["as well as hitherto unexplored ways", "지금까지 탐험되지 않은 방법뿐만 아니라"], ["of charting a course.", "진로를 정하는."]]}, {"en": "As Charles Nussbaum tells us, we engage our capacity to represent space when we are finding our way in music.", "ko": "Charles Nussbaum이 우리에게 말해 주듯, 우리는 음악 안에서 길을 찾을 때 공간을 나타내는 우리의 능력을 끌어들인다.", "chunks": [["As Charles Nussbaum tells us,", "Charles Nussbaum이 우리에게 말해 주듯,"], ["we engage our capacity", "우리는 우리의 능력을 끌어들인다"], ["to represent space", "공간을 나타내는"], ["when we are finding our way", "우리가 길을 찾을 때"], ["in music.", "음악 안에서."]]}, {"en": "Gaining our bearings in alien music amounts quite literally to expanding our horizons.", "ko": "낯선 음악에 대한 우리의 방향 감각을 얻는 것은 그야말로 우리의 시야를 확장하는 것 같다.", "chunks": [["Gaining our bearings in alien music", "낯선 음악에서 방향 감각을 얻는 것은"], ["amounts quite literally to", "그야말로 ~과 같다"], ["expanding our horizons.", "우리의 시야를 확장하는 것과."]]}, {"en": "Some of our discoveries might be merely enjoyable excursions.", "ko": "우리의 발견 중 일부는 단지 즐거운 여행일 수 있다.", "chunks": [["Some of our discoveries", "우리의 발견 중 일부는"], ["might be merely", "단지 ~일 수 있다"], ["enjoyable excursions.", "즐거운 여행."]]}, {"en": "But at times the impact of our adventures may be a whole new perspective on what music can mean in our lives.", "ko": "그렇지만 간혹 우리 모험의 영향은 음악이 우리 생활에서 무엇을 의미할 수 있는지에 대한 완전히 새로운 관점이 될 수도 있다.", "chunks": [["But at times", "하지만 간혹"], ["the impact of our adventures", "우리 모험의 영향은"], ["may be a whole new perspective", "완전히 새로운 관점일 수 있다"], ["on what music can mean", "음악이 무엇을 의미할 수 있는지에 대한"], ["in our lives.", "우리 생활에서."]]}, {"en": "The recognition, for Westerners, that there are whole cultures who see music as primarily participatory, who see serious music-making as a \"natural\" part of life, and who do not think of music-making as a special skill or the province of experts, can reorient their attitudes toward music and its place in their lives.", "ko": "서구인들에게, 음악을 주로 참여적인 것으로 보고, 진지한 음악 연주를 생활의 '자연스러운' 부분으로 보며, 그리고 음악 연주를 특별한 기능이나 전문가들의 분야로 보지 않는 그러한 문화 전체가 있다는 인식은 음악과 음악이 그들의 생활에서 차지하는 자리에 대한 그들의 태도의 방향을 재설정해 준다.", "chunks": [["The recognition, for Westerners, that", "서구인들에게, ~라는 인식은"], ["there are whole cultures", "그러한 문화 전체가 있다는"], ["who see music as primarily participatory,", "음악을 주로 참여적인 것으로 보는,"], ["who see serious music-making", "진지한 음악 연주를 ~으로 보는"], ["as a \"natural\" part of life,", "생활의 '자연스러운' 부분으로,"], ["and who do not think of music-making", "그리고 음악 연주를 ~으로 생각하지 않는"], ["as a special skill or the province of experts,", "특별한 기능이나 전문가의 분야로,"], ["can reorient their attitudes", "그들의 태도의 방향을 재설정해 줄 수 있다"], ["toward music and its place in their lives.", "음악과 그들의 생활에서 음악의 자리에 대한."]]}, {"en": "John Blacking's How Musical Is Man? is testimony to such a revolution in his musical outlook as a consequence of spending time among the Venda people of Africa.", "ko": "John Blacking의 '인간은 얼마나 음악적인가?'는 아프리카의 Venda 족 사이에서 시간을 보낸 결과로 그의 음악적인 전망에 일어난 그러한 혁명의 증언이다.", "chunks": [["John Blacking's How Musical Is Man?", "John Blacking의 '인간은 얼마나 음악적인가?'는"], ["is testimony to such a revolution", "그러한 혁명의 증언이다"], ["in his musical outlook", "그의 음악적 전망에 일어난"], ["as a consequence of", "~의 결과로"], ["spending time among the Venda people of Africa.", "아프리카 Venda 족 사이에서 시간을 보낸."]]}], "metaphor": "<svg viewBox=\"0 0 600 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 익숙한 음악의 작은 섬에서 가운데 나침반과 해도를 통한 항해를 거쳐 오른쪽 다른 대륙(아프리카 Venda 등)을 포함한 확장된 horizon에 도달하는 그림. 본문의 navigation·charting·expanding horizons 비유 직접 시각화.\">\n    <!-- 배경: 바다 (옅은 점선) -->\n    <g opacity=\"0.3\">\n      <line x1=\"20\" y1=\"155\" x2=\"580\" y2=\"155\" stroke=\"#999\" stroke-width=\"0.7\" stroke-dasharray=\"4 4\"/>\n      <line x1=\"20\" y1=\"180\" x2=\"580\" y2=\"180\" stroke=\"#999\" stroke-width=\"0.6\" stroke-dasharray=\"3 5\"/>\n      <line x1=\"20\" y1=\"205\" x2=\"580\" y2=\"205\" stroke=\"#999\" stroke-width=\"0.5\" stroke-dasharray=\"2 6\"/>\n    </g>\n\n    <!-- 좌측: 익숙한 음악 = 작은 섬 -->\n    <g transform=\"translate(20, 50)\">\n      <text x=\"80\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">익숙한 음악 — familiar</text>\n      <!-- 작은 섬 -->\n      <g transform=\"translate(80, 95)\">\n        <!-- 섬 윤곽 -->\n        <ellipse cx=\"0\" cy=\"20\" rx=\"50\" ry=\"14\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n        <!-- 작은 봉우리 -->\n        <path d=\"M -30 18 Q -20 -2 -10 18\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <path d=\"M 0 18 Q 15 -8 30 18\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <!-- 음표 (작게) -->\n        <g transform=\"tran =\"1.4\" stroke-dasharray=\"3 2\"/>\n        <circle cx=\"-30\" cy=\"-20\" r=\"2\" fill=\"#c8102e\"/>\n        <circle cx=\"30\" cy=\"5\" r=\"2\" fill=\"#c8102e\"/>\n        <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">charting a course</text>\n      </g>\n      \n      <!-- 나침반 -->\n      <g transform=\"translate(180, 90)\">\n        <!-- 원 -->\n        <circle cx=\"0\" cy=\"0\" r=\"35\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n        <circle cx=\"0\" cy=\"0\" r=\"29\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.6\"/>\n        <!-- 방위 -->\n        <text x=\"0\" y=\"-22\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">N</text>\n        <text x=\"0\" y=\"30\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">S</text>\n        <text x=\"-25\" y=\"4\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">W</text>\n        <text x=\"25\" y=\"4\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">E</text>\n        <!-- 바늘 -->\n        <polygon points=\"0,-18 -4,0 0,3 4,0\" fill=\"#c8102e\"/>\n        <polygon points=\"0,18 -4,0 0,-3 4,0\" fill=\"#1a1a1a\"/>\n        <!-- 중심점 -->\n        <circle cx=\"0\" cy=\"0\" r=\"2\" fill=\"#1a1a1a\"/>\n        <text x=\"0\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">gaining bearings</text>\n      </g>\n      \n      <!-- 진출 화살표 (우측으로) -->\n      <line x1=\"235\" y1=\"90\" x2=\"255\" y2=\"90\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/>\n      <polygon points=\"255,90 247,86 247,94\" fill=\"#1FA34A\"/>\n    </g>\n\n    <!-- 우측: 확장된 horizon -->\n    <g transform=\"translate(435, 50)\">\n      <text x=\"75\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">확장된 시야 — expanded</text>\n      \n      <!-- 큰 horizon / 여러 대륙 -->\n      <g transform=\"translate(75, 95)\">\n        <!-- 큰 섬 1 -->\n        <ellipse cx=\"-35\" cy=\"20\" rx=\"22\" ry=\"10\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n        <path d=\"M -45 18 Q -38 4 -28 18\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <!-- 큰 섬 2 (가운데 큰 대륙) -->\n        <ellipse cx=\"0\" cy=\"22\" rx=\"32\" ry=\"13\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n        <path d=\"M -18 20 Q -8 -3 4 20\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <path d=\"M 6 20 Q 18 -8 28 20\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <!-- 큰 섬 3 -->\n        <ellipse cx=\"40\" cy=\"20\" rx=\"22\" ry=\"10\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n        <path d=\"M 30 18 Q 42 0 52 18\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        \n        <!-- 음표들 (다양하게) -->\n        <g transform=\"translate(-35, 5)\">\n          <circle cx=\"0\" cy=\"0\" r=\"2\" fill=\"#1FA34A\"/>\n          <line x1=\"2\" y1=\"0\" x2=\"2\" y2=\"-8\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n        </g>\n        <g transform=\"translate(0, 0)\">\n          <circle cx=\"0\" cy=\"0\" r=\"2.5\" fill=\"#1FA34A\"/>\n          <line x1=\"2.5\" y1=\"0\" x2=\"2.5\" y2=\"-10\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n          <path d=\"M 2.5 -10 L 7 -8\" stroke=\"#1FA34A\" stroke-width=\"1.2\" fill=\"none\"/>\n        </g>\n        <g transform=\"translate(40, 5)\">\n          <circle cx=\"0\" cy=\"0\" r=\"2\" fill=\"#1FA34A\"/>\n          <line x1=\"2\" y1=\"0\" x2=\"2\" y2=\"-8\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n        </g>\n        \n        <!-- Venda 라벨 -->\n        <text x=\"0\" y=\"50\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">Venda (Africa) · etc.</text>\n      </g>\n      <text x=\"75\" y=\"180\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">음악관 재설정</text>\n    </g>\n\n    <!-- 하단 결론 -->\n    <text x=\"300\" y=\"265\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">exploring music = exploring new horizons · a revolution in one's musical outlook</text>\n  </svg>", "caption": "익숙한 음악 (작은 섬) → 항해 (나침반·해도) → 확장된 horizon"}, {"no": "6", "title": "Climate Change & Museum Collections", "ktitle": "기후 변화 = 위협 → 혁신 전략 → 성공 (단, 자금 게이트가 조건)", "field": "환경·문화유산", "page": "8회 06번", "oneline": "기후 변화는 박물관 소장품 보존을 (A) threatens 위협한다 — 혁신적 보존 전략이 필요하지만 성공을 위해서는 확대된 (B) financial 재정적 지원이 필수적이다.", "tldr": ["기후 변화는 박물관 소장품 보존을 (A) threatens 위협한다 — 혁신적 보존 전략이 필요하지만 성공을 위해서는 확대된 (B) financial 재정적 지원이 필수적이다.", "기후 변화 = 위협 → 혁신 전략 → 성공 (단, 자금 게이트가 조건)"], "analogy": "오래된 사진을 눅눅한 방에 두면 상하듯, 더워지고 습해진 환경에서 박물관 유물도 빠르게 망가져요. 그런데 낡은 건물엔 보호 장치가 없고, 무엇보다 고칠 ‘돈’이 없는 게 가장 큰 문제 — 그래서 추가 자금 지원이 보존의 핵심이에요.", "bg": "분야는 환경·문화유산이에요. 기온 상승·습도 변동이 박물관 유물(artifacts) 보존에 주는 위협이 배경. → 기후 변화가 유물 훼손·곰팡이를 어떻게 가속하는지에 주목하며 읽으세요.", "flow": [{"kind": "위협", "t": "기온↑·습도 변동 → 유물 훼손·곰팡이"}, {"kind": "취약", "t": "낡은 역사 건물 = 현대식 기후 제어 없음"}, {"kind": "가중", "t": "홍수·허리케인 등 극단 기상 빈번"}, {"kind": "대응", "t": "수장고·모니터링·디지털 저장소 등 혁신 전략"}, {"kind": "걸림돌", "t": "대부분 박물관은 ‘자금’ 부족"}, {"kind": "결론", "t": "보존 성공 = 추가 재정 지원이 필수"}], "quiz": [["이 지문의 핵심 구조는?", "기후 변화 = 위협 → 혁신 전략 → 성공 (단, 자금 게이트가 조건)"], ["도식이 강조하는 결론은?", "기후 변화는 박물관 소장품 보존을 (A) threatens 위협한다 — 혁신적 보존 전략이 필요하지만 성공을 위해서는 확대된 (B) financial 재정적 지원이 필수적이다."]], "vocab": [["deterioration deteriorate", "훼손·악화"], ["humidity humid", "습도"], ["vulnerable", "취약한·상처받기 쉬운"], ["irreplaceable replace", "대체 불가능한"], ["conservation conserve", "보존·보호"], ["archive", "저장소·기록 보관소"], ["heritage", "유산·문화유산"]], "en": "As global weather patterns become less predictable and environmental conditions change, museums face new challenges in caring for their collections. Rising temperatures and unpredictable humidity can accelerate the deterioration of artifacts and encourage mold growth, especially on organic materials. The historic buildings that house these collections often lack modern climate control systems, making them more vulnerable to changing environmental conditions. More frequent extreme weather events, such as floods and hurricanes, also pose a serious threat to irreplaceable cultural treasures. To address these risks, some museums are adopting innovative conservation strategies, such as upgrading storage facilities, installing advanced environmental monitoring systems, and creating digital archives. However, most museums require significant funding to implement these improvements, and lack the resources to adequately respond to climate challenges. As a result, experts stress that additional funding is critical to successfully protecting and preserving humanity's shared cultural heritage in the face of climate change. → Climate change threatens the preservation of museum collections through environmental instability and extreme weather events, requiring institutions to adopt innovative conservation strategies, with increased financial assistance being essential for success.", "ko": "전 세계의 기상 패턴이 덜 예측 가능해지고 환경 조건이 변화함에 따라, 박물관은 소장품을 관리하는 데 있어 새로운 문제에 직면해 있다. 기온 상승과 예측 불가능한 습도는 유물의 훼손을 가속화하고, 특히 유기물에서 곰팡이 성장을 촉진할 수 있다. 이러한 소장품을 소장하는 역사적인 건물에는 현대식 기후 제어 시스템이 부족한 경우가 많아, 소장품을 변화하는 환경 조건에 더욱 취약하게 한다. 홍수와 허리케인 같은 극단적인 기상 이변이 빈번하게 발생함에 따라 대체 불가능한 문화재에 심각한 위협을 제기하기도 한다. 이러한 위험에 대처하기 위해, 일부 박물관이 수장고 시설을 업그레이드하고, 첨단 환경 모니터링 시스템을 설치하며, 디지털 저장소를 구축하는 것과 같은, 혁신적인 보존 전략을 채택하고 있다. 그러나 대부분의 박물관은 이러한 개선 사항을 실행하기 위해 상당한 자금이 필요하며, 기후 문제에 적절히 대응하는 데 필요한 자원이 부족하다. 그 결과, 전문가들은 기후 변화에 맞서 인류가 공유하는 문화유산을 성공적으로 보호하고 보존하기 위해서는 추가적인 자금 지원이 필수적이라고 강조한다. → 기후 변화는 환경 불안정과 극단적인 기상 이변으로 박물관 소장품의 보존을 위협하여, 기관들로 하여금 혁신적인 보존 전략을 채택할 것을 요구하는데, 성공을 위해서는 확대된 재정적인 지원이 필수적이다.", "read": [{"en": "As global weather patterns become less predictable and environmental conditions change, museums face new challenges in caring for their collections.", "ko": "전 세계의 기상 패턴이 덜 예측 가능해지고 환경 조건이 변화함에 따라, 박물관은 소장품을 관리하는 데 있어 새로운 문제에 직면해 있다.", "chunks": [["As global weather patterns become", "전 세계 기상 패턴이 ~해짐에 따라"], ["less predictable", "덜 예측 가능하고"], ["and environmental conditions change,", "환경 조건이 변화함에 따라,"], ["museums face new challenges", "박물관은 새로운 문제에 직면한다"], ["in caring for their collections.", "소장품을 관리하는 데 있어."]]}, {"en": "Rising temperatures and unpredictable humidity can accelerate the deterioration of artifacts and encourage mold growth, especially on organic materials.", "ko": "기온 상승과 예측 불가능한 습도는 유물의 훼손을 가속화하고, 특히 유기물에서 곰팡이 성장을 촉진할 수 있다.", "chunks": [["Rising temperatures and unpredictable humidity", "기온 상승과 예측 불가능한 습도는"], ["can accelerate the deterioration of artifacts", "유물의 훼손을 가속화하고"], ["and encourage mold growth,", "곰팡이 성장을 촉진할 수 있다,"], ["especially on organic materials.", "특히 유기물에서."]]}, {"en": "The historic buildings that house these collections often lack modern climate control systems, making them more vulnerable to changing environmental conditions.", "ko": "이러한 소장품을 소장하는 역사적인 건물에는 현대식 기후 제어 시스템이 부족한 경우가 많아, 소장품을 변화하는 환경 조건에 더욱 취약하게 한다.", "chunks": [["The historic buildings", "역사적인 건물들은"], ["that house these collections", "이러한 소장품을 소장하는"], ["often lack", "종종 부족하다"], ["modern climate control systems,", "현대식 기후 제어 시스템이,"], ["making them more vulnerable", "그것들을 더욱 취약하게 만들면서"], ["to changing environmental conditions.", "변화하는 환경 조건에."]]}, {"en": "More frequent extreme weather events, such as floods and hurricanes, also pose a serious threat to irreplaceable cultural treasures.", "ko": "홍수와 허리케인 같은 극단적인 기상 이변이 빈번하게 발생함에 따라 대체 불가능한 문화재에 심각한 위협을 제기하기도 한다.", "chunks": [["More frequent extreme weather events,", "더 빈번한 극단적인 기상 이변은,"], ["such as floods and hurricanes,", "홍수와 허리케인 같은,"], ["also pose a serio mental instability and extreme weather events, requiring institutions to adopt innovative conservation strategies, with increased financial assistance being essential for success.", "ko": "→ 기후 변화는 환경 불안정과 극단적인 기상 이변으로 박물관 소장품의 보존을 위협하여, 기관들로 하여금 혁신적인 보존 전략을 채택할 것을 요구하는데, 성공을 위해서는 확대된 재정적인 지원이 필수적이다.", "chunks": [["→ Climate change threatens", "→ 기후 변화는 위협한다"], ["the preservation of museum collections", "박물관 소장품의 보존을"], ["through environmental instability and extreme weather events,", "환경 불안정과 극단적 기상 이변을 통해,"], ["requiring institutions to adopt", "기관들로 하여금 ~을 채택할 것을 요구하며"], ["innovative conservation strategies,", "혁신적인 보존 전략을,"], ["with increased financial assistance being essential for success.", "확대된 재정적 지원이 성공에 필수적인 채로."]]}], "metaphor": "<svg viewBox=\"0 0 600 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 기후 변화 위협(고온·습도·홍수·허리케인)이 가운데 박물관과 혁신적 보존 전략에 가해지고, 자금 게이트를 통과해야만 오른쪽 보존 성공에 이르는 그림. 하단에 요약문 (A) threatens / (B) financial 빈칸 매핑.\">\n    <!-- 좌측: 기후 변화 위협 -->\n    <g transform=\"translate(20, 30)\">\n      <text x=\"80\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">기후 위협 — Climate Threat</text>\n      <rect x=\"0\" y=\"0\" width=\"160\" height=\"160\" fill=\"#fdf2f4\" fill-opacity=\"0.4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      \n      <!-- 4가지 위협 아이콘 (2x2 grid) -->\n      <!-- 1. 온도 ↑ (온도계) -->\n      <g transform=\"translate(40, 35)\">\n        <rect x=\"-3\" y=\"-15\" width=\"6\" height=\"20\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.3\" rx=\"2\"/>\n        <circle cx=\"0\" cy=\"8\" r=\"6\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n        <rect x=\"-1.5\" y=\"-10\" width=\"3\" height=\"18\" fill=\"#c8102e\"/>\n        <!-- 화살표 위 -->\n        <line x1=\"10\" y1=\"-5\" x2=\"10\" y2=\"-15\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n        <polygon points=\"10,-15 7,-10 13,-10\" fill=\"#c8102e\"/>\n        <text x=\"0\" y=\"25\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">temp ↑</text>\n      </g>\n      \n      <!-- 2. 습도 (물방울) -->\n      <g transform=\"translate(115, 35)\">\n        <path d=\"M 0 -14 Q -10 -2 -10 6 Q -10 14 0 14 Q 10 14 10 6 Q 10 -2 0 -14 Z\" \n              fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n        <path d=\"M -4 4 Q -4 9 0 9\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n        <text x=\"0\" y=\"25\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">humidity</text>\n      </g>\n      \n      <!-- 3. 홍수 (물결) -->\n      <g transform=\"translate(40, 100)\">\n        <path d=\"M -15 0 Q -10 -5 -5 0 Q 0 5 5 0 Q 10 -5 15 0\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <path d=\"M -15 6 Q -10 1 -5 6 Q 0 11 5 6 Q 10 1 15 6\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <path d=\"M -15 12 Q -10 7 -5 12 Q 0 17 5 12 Q 10 7 15 12\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <text x=\"0\" y=\"29\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">floods</text>\n      </g>\n      \n      <!-- 4. 허리케인 (소용돌이) -->\n      <g transform=\"translate(115, 100)\">\n        <path d=\"M 0 -10 Q 10 -10 10 0 Q 10 10 0 10 Q -8 10 -8 2 Q -8 -4 -2 -4 Q 4 -4 4 0 Q 4 4 0 4\" \n              fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <text x=\"0\" y=\"29\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">hurricanes</text>\n      </g>\n      \n      <text x=\"80\" y=\"150\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">환경 불안정 + 극단 기상 이변</text>\n    </g>\n\n    <!-- 가운데 1: 박물관 + 혁신 전략 -->\n    <g transform=\"translate(200, 30

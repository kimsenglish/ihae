y=\"-3\" r=\"1.2\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"-3\" r=\"1.2\" fill=\"#1a1a1a\"/>\n      <path d=\"M -5 3 Q 0 8 5 3\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    </g>\n    <text x=\"20\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">laugh aloud</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 273)\">\n    <text x=\"300\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">happiness starts from yourself alone</text>\n  </g>\n</svg>", "caption": "상단 복잡한 미로 형태의 통념, Lincoln 인용으로 분기 후 하단 자기 중심에서 손잡기 노을 강아지 웃음 네 가지 일상 순간으로 뻗는 방사형 구조"}, {"no": "8", "title": "The Hidden Cost of Pro Tennis", "ktitle": "프로 테니스의 ‘숨은 적자’", "field": "스포츠·경제", "page": "p41 no.4", "oneline": "프로 테니스는 전임 코치·이동·훈련·숙식에 연 최대 20만 달러가 든다.", "tldr": ["프로 테니스는 전임 코치·이동·훈련·숙식에 연 최대 20만 달러가 든다.", "2014년 100위 선수 상금은 ATP 17만·WTA 13만 달러 — 비용에 못 미친다.", "세계 500위도 위업이지만, 적은 상금에 많은 선수가 재정 부담을 진다."], "analogy": "세계 100위 프로라도, 버는 상금보다 코치·이동·숙식 비용이 더 들어 ‘본전치기’거나 적자예요. 500위에 드는 것도 대단한데, 꿈을 좇기엔 돈이 너무 빠듯하죠.", "bg": "분야는 스포츠·경제예요. 프로 테니스(ATP·WTA)의 숨은 비용 — 코치·이동·훈련·숙식에 연 최대 20만 달러 — 이 소재. → 화려해 보이는 프로 무대의 ‘실제 비용’이 어느 정도인지에 주목하며 읽으세요.", "flow": [{"kind": "비용", "t": "전임 코치·이동·훈련·숙식 = 연 최대 20만 달러"}, {"kind": "수입", "t": "2014 100위: ATP 17만·WTA 13만 달러"}, {"kind": "현실", "t": "후원 더해도 대다수 ‘본전치기·적자’"}, {"kind": "결론", "t": "500위도 위업이나, 적은 상금에 재정 부담↑ → 꿈 좇기 어려움"}], "quiz": [["프로 테니스 선수의 연간 비용과 상금 차이는?", "코치·이동·숙식에 연 최대 20만 달러가 드는데, 2014년 100위 상금은 ATP 17만·WTA 13만 달러로 비용에 못 미쳤어요."], ["이 현실이 선수들에게 미치는 영향은?", "후원을 더해도 대다수가 본전치기·적자라, 많은 선수가 재정 부담에 꿈을 좇기 어려워요."], ["핵심 한 문장?", "프로 테니스는 비용이 상금을 웃돌아, 상위권 선수조차 재정 부담에 시달린다."]], "vocab": [["elite", "엘리트의·최고의"], ["estimate", "추산하다"], ["expense", "비용"], ["room and board", "숙식"], ["endorsement", "홍보·보증 광고"], ["break even", "본전치기하다"], ["financial burden", "재정적 부담"]], "en": "The culture of elite tennis is an interesting one. At the pro level on the men's Association for Tennis Professionals (ATP) tour and Women's Tennis Association (WTA) tour, it's estimated that it costs up to $200,000 a year in expenses to pay for a full-time coach and handle the travel, training, room, and board. In 2014, according to official ATP and WTA records, the 100th ranked player on the ATP tour made $170,000 in prize money and the 100th ranked player on the WTA tour made $130,000. Of course, endorsements and sponsorships add to that amount, but it doesn't take long to realize that the majority of players are at best breaking even and at worst losing money. Reaching a pro ranking of 500th in the world in itself is a remarkable feat; however, the relatively low amount of prize money forces many players to shoulder a heavy financial burden, making it hard to pursue their dreams.", "ko": "엘리트 테니스 문화는 흥미로운 것이다. 남자 프로 테니스 협회(ATP) 투어와 여자 테니스 협회(WTA) 투어의 프로 수준에서, 전임 코치 비용을 지불하고 이동, 훈련, 숙식 등을 처리하는 비용으로 연간 최대 20만 달러의 비용이 드는 것으로 추산된다. 2014년 공식 ATP와 WTA 기록에 따르면, ATP 투어 100위 선수는 상금 17만 달러, WTA 투어 100위 선수는 13만 달러를 벌었다. 물론, 홍보와 후원이 그 액수를 늘리지만, 대다수의 선수들이 기껏해야 본전치기를 하고 있고, 최악의 경우 손해를 보고 있다는 것을 깨닫는 데는 오랜 시간이 걸리지 않는다. 세계 프로 랭킹 500위에 들어가는 것은 그 자체로 뛰어난 위업이지만, 상대적으로 적은 액수의 상금은 많은 선수들이 심한 재정적 부담을 짊어지게 만들어, 그들의 꿈을 좇기 어렵게 한다.", "read": [{"en": "The culture of elite tennis is an interesting one.", "ko": "엘리트 테니스 문화는 흥미로운 것이다.", "chunks": [["The culture of elite tennis", "엘리트 테니스의 문화는"], ["is an interesting one.", "흥미로운 것이다."]]}, {"en": "At the pro level on the men's Association for Tennis Professionals (ATP) tour and Women's Tennis Association (WTA) tour, it's estimated that it costs up to $200,000 a year in expenses to pay for a full-time coach and handle the travel, training, room, and board.", "ko": "남자 프로 테니스 협회(ATP) 투어와 여자 테니스 협회(WTA) 투어의 프로 수준에서, 전임 코치 비용을 지불하고 이동, 훈련, 숙식 등을 처리하는 비용으로 연간 최대 20만 달러의 비용이 드는 것으로 추산된다.", "chunks": [["At the pro level", "프로 수준에서"], ["on the men's Association for Tennis Professionals (ATP) tour", "남자 프로 테니스 협회(ATP) 투어와"], ["and Women's Tennis Association (WTA) tour,", "여자 테니스 협회(WTA) 투어의,"], ["it's estimated that", "~로 추산된다"], ["it costs up to $200,000 a year in expenses", "연간 최대 20만 달러의 비용이 든다고"], ["to pay for a full-time coach", "전임 코치 비용을 지불하고"], ["and handle the travel, training, room, and board.", "이동, 훈련, 숙식을 처리하는 데."]]}, {"en": "In 2014, according to official ATP and WTA records, the 100th ranked player on the ATP tour made $170,000 in prize money and the 100th ranked player on the WTA tour made $130,000.", "ko": "2014년 공식 ATP와 WTA 기록에 따르면, ATP 투어 100위 선수는 상금 17만 달러, WTA 투어 100위 선수는 13만 달러를 벌었다.", "chunks": [["In 2014,", "2014년에,"], ["according to official ATP and WTA records,", "공식 ATP와 WTA 기록에 따르면,"], ["the 100th ranked player on the ATP tour", "ATP 투어 100위 선수는"], ["made $170,000 in prize money", "상금으로 17만 달러를 벌었다"], ["and the 100th ranked player on the WTA tour", "그리고 WTA 투어 100위 선수는"], ["made $130,000.", "13만 달러를 벌었다."]]}, {"en": "Of course, endorsements and sponsorships add to that amount, but it doesn't take long to realize that the majority of players are at best breaking even and at worst losing money.", "ko": "물론, 홍보와 후원이 그 액수를 늘리지만, 대다수의 선수들이 기껏해야 본전치기를 하고 있고, 최악의 경우 손해를 보고 있다는 것을 깨닫는 데는 오랜 시간이 걸리지 않는다.", "chunks": [["Of course,", "물론,"], ["endorsements and sponsorships", "홍보와 후원이"], ["add to that amount,", "그 액수에 추가된다,"], ["but it doesn't take long to realize", "하지만 깨닫는 데 오래 걸리지 않는다"], ["that the majority of players", "대다수의 선수들이"], ["are at best breaking even", "기껏해야 본전치기를 하고"], ["and at worst losing money.", "최악의 경우 손해를 보고 있다는 것을."]]}, {"en": "Reaching a pro ranking of 500th in the world in itself is a remarkable feat; however, the relatively low amount of prize money forces many players to shoulder a heavy financial burden, making it hard to pursue their dreams.", "ko": "세계 프로 랭킹 500위에 들어가는 것은 그 자체로 뛰어난 위업이지만, 상대적으로 적은 액수의 상금은 많은 선수들이 심한 재정적 부담을 짊어지게 만들어, 그들의 꿈을 좇기 어렵게 한다.", "chunks": [["Reaching a pro ranking of 500th in the world", "세계 프로 랭킹 500위에 도달하는 것"], ["in itself is a remarkable feat;", "그 자체로 뛰어난 위업이다;"], ["however, the relatively low amount of prize money", "하지만 상대적으로 적은 상금 액수가"], ["forces many players to shoulder", "많은 선수들이 짊어지게 만든다"], ["a heavy financial burden,", "심한 재정적 부담을,"], ["making it hard to pursue their dreams.", "그래서 꿈을 좇기 어렵게 만든다."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 200,000달러 지출과 오른쪽 ATP 170,000달러 WTA 130,000달러 수입이 시소로 비교되며 좌측으로 기울어 적자가 발생하고 500위 진입도 재정 부담임을 보여주는 그림\">\n  <!-- 헤더 -->\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">엘리트 테니스 선수의 수지 — 적자 구조</text>\n\n  <!-- 시소 받침점 -->\n  <g transform=\"translate(300, 175)\">\n    <!-- 받침대 (삼각형) -->\n    <polygon points=\"-30,40 30,40 0,0\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.8\"/>\n  </g>\n\n  <!-- 시소 막대 (좌측으로 기울어짐) -->\n  <line x1=\"80\" y1=\"180\" x2=\"520\" y2=\"160\" stroke=\"#1a1a1a\" stroke-width=\"3\"/>\n  \n  <!-- 좌측: 지출 (시소 막대와 평행하게 회전 -2.6°, 박스 하단이 막대에 닿음) -->\n  <g transform=\"translate(140, 119) rotate(-2.6 0 58)\">\n    <!-- 박스 -->\n    <rect x=\"-65\" y=\"0\" width=\"130\" height=\"58\" fill=\"#fdf2f4\" fill-opacity=\"0.7\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n    <text x=\"0\" y=\"-6\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">지출 (expenses)</text>\n    <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">$200,000</text>\n    <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">per year</text>\n    <text x=\"0\" y=\"51\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">coach · travel · room &amp; board</text>\n  </g>\n\n  <!-- 우측: 수입 (가벼운 쪽 = 위) -->\n  <g transform=\"translate(460, 100)\">\n    <rect x=\"-70\" y=\"0\" width=\"140\" height=\"60\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <text x=\"0\" y=\"-6\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">수입 (100위 상금)</text>\n    <text x=\"-32\" y=\"22\" font-family=\"Noto Serif\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">ATP</text>\n    <text x=\"-32\" y=\"38\" font-family=\"Noto Serif\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">$170K</text>\n    <line x1=\"0\" y1=\"10\" x2=\"0\" y2=\"48\" stroke=\"#1FA34A\" stroke-width=\"0.8\"/>\n    <text x=\"32\" y=\"22\" font-family=\"Noto Serif\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">WTA</text>\n    <text x=\"32\" y=\"38\" font-family=\"Noto Serif\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">$130K</text>\n    <text x=\"0\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">prize money (2014)</text>\n  </g>\n\n  <!-- 적자 표시 (좌측 박스 옆 화살표) -->\n  <g transform=\"translate(50, 90)\">\n    <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#c8102e\">deficit</text>\n    <line x1=\"20\" y1=\"5\" x2=\"40\" y2=\"20\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <polygon points=\"40,20 33,18 36,12\" fill=\"#c8102e\"/>\n  </g>\n\n  <!-- 가운데 vs 라벨 -->\n  <g transform=\"translate(300, 140)\">\n    <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">&gt;</text>\n  </g>\n\n  <!-- 하단 결론 박스 -->\n  <g transform=\"translate(60, 220)\">\n    <rect x=\"0\" y=\"0\" width=\"480\" height=\"38\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <text x=\"240\" y=\"16\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">even reaching 500th is remarkable — yet financial burden remains</text>\n    <text x=\"240\" y=\"30\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">500위 진입은 위업 — 그러나 재정 부담을 짊어진 채 꿈을 좇아야 한다</text>\n  </g>\n</svg>", "caption": "왼쪽 200,000달러 지출과 오른쪽 ATP 170,000달러 WTA 130,000달러 수입이 시소로 비교되며 좌측으로 기울어 적자가 발생하고 500위 진입도 재정 부담임을 보여주는 그림"}, {"no": "9", "title": "Comparative Appreciation", "ktitle": "비교 인식 — 틀린 답 없는 음미", "field": "미학·창의성", "page": "p42 no.5", "oneline": "아름다운 것(음악·예술·와인·음식)은 삶의 질과 창의성을 높인다.", "tldr": ["아름다운 것(음악·예술·와인·음식)은 삶의 질과 창의성을 높인다.", "‘비교 인식’(여러 버전 비교)으로 미묘함을 알아차리고 회상을 깊게 한다.", "핵심은 정확한 분석이 아니라 ‘틀린 답 없는’ 열린 질문을 음미하는 것."], "analogy": "같은 곡의 여러 버전을 나란히 들으면 ‘이 차이!’가 보이죠. ‘정답 맞히기’가 아니라 ‘난 이걸 어떻게 느끼지?’를 묻는 거라, 틀릴 걱정 없이 더 깊이 즐기게 돼요.", "bg": "분야는 미학·창의성이에요. 음악·예술·와인·음식 같은 아름다운 것이 삶의 질과 창의성을 높인다는 것이 출발점. → 그 효과를 더 오래 남기는 방법(비교 감상)에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "아름다운 것 음미 → 삶의 질·창의성↑"}, {"kind": "방법", "t": "‘비교 인식’: 여러 버전 비교 → 차이·유사 포착"}, {"kind": "효과", "t": "미묘함을 알아차리고 회상이 깊어짐"}, {"kind": "핵심", "t": "정확한 분석 ✗ → ‘틀린 답 없는’ 열린 질문 음미", "d": "‘난 이걸 어떻게 느끼지?’"}, {"kind": "결론", "t": "틀림의 두려움에서 자유로워질 때 더 깊이 즐긴다"}], "quiz": [["‘비교 인식(comparative appreciation)’이란?", "여러 버전의 음악·와인 등을 비교해 그 차이·유사·미묘함을 알아차리며 음미하는 거예요."], ["비교 인식을 최대로 활용하는 핵심은?", "정확한 분석이 아니라, ‘난 이걸 어떻게 느끼지?’ 같은 ‘틀린 답 없는’ 열린 질문을 깊이 생각하는 거예요."], ["핵심 한 문장?", "아름다운 것을 ‘틀린 답 없는’ 열린 질문으로 비교·음미하면, 감각과 창의적 인식을 기를 수 있다."]], "vocab": [["enrich", "풍부하게 하다"], ["comparative", "비교의"], ["attune to", "~에 맞추다·적응하다"], ["subtlety", "미묘함"], ["contemplate", "깊이 생각하다"], ["open-ended", "정해진 답이 없는"], ["evoke", "불러일으키다"]], "en": "We can enjoy beautiful music, art, wine, and food ─ and, in the process, enrich the quality of our lives and strengthen our creative mindset. And we can make the positive effects of these beautiful things more memorable by practicing comparative appreciation. When you listen to multiple versions of a musical composition or compare wines, your mind attunes to the differences and similarities among them. You begin to notice subtleties, and you deepen your recall for the pleasurable experience. The key to getting the most out of comparative appreciation is not to make an accurate analysis, but to instead contemplate open-ended questions such as: How do I experience this (music, art, wine, food)? What sensations and impressions does this experience evoke? The beauty of these questions is that they have no wrong answers. When we free ourselves from the fear of being wrong, we experience deeper appreciation and enjoyment. This allows us to refine our senses and nurture our creative awareness.", "ko": "우리는 아름다운 음악, 예술, 와인, 음식을 즐길 수 있고, 그 과정에서 삶의 질을 높이고 창의적인 사고방식을 강화할 수 있다. 그리고 우리는 비교 인식을 실행함으로써 이렇듯 아름다운 것들의 긍정적인 영향을 더 기억에 남도록 만들 수 있다. 여러 버전의 음악 작품을 듣거나 와인을 비교할 때, 여러분의 마음은 그것들 사이의 차이점과 유사점에 맞춘다. 여러분은 미묘함을 알아차리고, 즐거운 경험에 대한 회상을 깊게 하기 시작한다. 비교 인식을 최대한 활용하는 핵심은 정확한 분석을 하는 것이 아니라, 대신 다음과 같은 정해진 답이 없는 질문을 깊이 생각하는 것이다: 이 (음악, 예술, 와인, 음식)을 어떻게 경험해야 할까? 이 경험은 어떤 감각과 인상을 불러일으키는가? 이 질문들의 아름다운 점은 틀린 답이 없다는 것이다. 틀리는 두려움에서 스스로를 자유롭게 할 때, 우리는 더 깊은 이해와 즐거움을 경험한다. 이는 우리가 우리의 감각을 개선하고 창조적인 인식을 기르게 해 준다.", "read": [{"en": "We can enjoy beautiful music, art, wine, and food ─ and, in the process, enrich the quality of our lives and strengthen our creative mindset.", "ko": "우리는 아름다운 음악, 예술, 와인, 음식을 즐길 수 있고, 그 과정에서 삶의 질을 높이고 창의적인 사고방식을 강화할 수 있다.", "chunks": [["We can enjoy beautiful music, art, wine, and food", "우리는 아름다운 음악, 예술, 와인, 음식을 즐길 수 있다"], ["— and, in the process,", "— 그리고 그 과정에서,"], ["enrich the quality of our lives", "삶의 질을 풍요롭게 하고"], ["and strengthen our creative mindset.", "창의적 사고방식을 강화한다."]]}, {"en": "And we can make the positive effects of these beautiful things more memorable by practicing comparative appreciation.", "ko": "그리고 우리는 비교 인식을 실행함으로써 이렇듯 아름다운 것들의 긍정적인 영향을 더 기억에 남도록 \"#1FA34A\" stroke-width=\"1.5\"/>\n    <polygon points=\"25,0 18,-4 18,4\" fill=\"#1FA34A\"/>\n    <text x=\"13\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">deepen</text>\n  </g>\n\n  <!-- 3단계: 깊은 기억 -->\n  <g transform=\"translate(440, 60)\">\n    <rect x=\"0\" y=\"0\" width=\"120\" height=\"115\" fill=\"#f0faf3\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n    \n    <!-- 두뇌 아이콘 (단순 화) -->\n    <g transform=\"translate(60, 50)\">\n      <!-- 뇌 좌 -->\n      <path d=\"M -22 0 Q -22 -18 -8 -18 Q -2 -22 4 -18 Q 14 -18 16 -8 Q 22 -2 18 6 Q 20 18 8 18 Q -2 22 -10 16 Q -22 16 -22 0 Z\" \n            fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <!-- 주름 -->\n      <path d=\"M -12 -8 Q -8 -4 -10 0\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <path d=\"M 0 -10 Q 4 -4 0 2\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <path d=\"M 8 -8 Q 14 -2 10 6\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <path d=\"M -10 6 Q -4 12 4 10\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <!-- 중앙선 -->\n      <line x1=\"-1\" y1=\"-18\" x2=\"-1\" y2=\"18\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n    </g>\n    <text x=\"60\" y=\"100\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">memorable · recall</text>\n  </g>\n\n  <!-- 가운데 원리 박스 (하단) -->\n  <g transform=\"translate(80, 200)\">\n    <rect x=\"0\" y=\"0\" width=\"440\" height=\"40\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    <text x=\"220\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">key principle: not accurate analysis, but open-ended questions</text>\n    <text x=\"220\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">정확한 분석이 아니라 — 열린 질문으로 숙고</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 263)\">\n    <text x=\"300\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">comparative appreciation → richer recall · creative awareness</text>\n  </g>\n</svg>", "caption": "왼쪽 단순 감상의 음표 한 개와 듣는 사람, 가운데 두 음표를 나란히 두고 비교하는 화살표와 차이 유사점 미묘함 라벨, 오른쪽 깊은 기억의 두뇌 아이콘이 3단계로 진행되는 과정"}]};

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

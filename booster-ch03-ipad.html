<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · Booster 구문독해 CHAPTER 03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 영어독해연습 08강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>

<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">Booster 구문독해 CHAPTER 03</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — Booster 구문독해 CHAPTER 03

 consider carefully — 들이기 전·후 모두 신중히</text>\n  </g>\n</svg>", "caption": "왼쪽 그물에 갇힌 작은 새와 운송 상자가 있고 오른쪽 자라난 큰 야생동물과 작은 사람이 있으며 가운데 grown up 화살표로 이어진 그림"}, {"no": "2", "title": "How the 'Cell' Got Its Name", "ktitle": "‘세포(cell)’라는 이름의 탄생", "field": "과학사", "page": "p35 독해훈련", "oneline": "1500년대 후반 최초의 현미경이 벼룩보다 작은 것을 보여 줬다.", "tldr": ["1500년대 후반 최초의 현미경이 벼룩보다 작은 것을 보여 줬다.", "Hooke는 1665년 <Micrographia>에 관찰 그림을 출간했다.", "코르크의 ‘작은 방’ 모양 구조를 ‘cell(세포)’이라 불렀다 — 200년 뒤 의미가 밝혀짐."], "analogy": "Hooke가 현미경으로 코르크를 보니 ‘작은 방’들이 가득했어요. 그래서 ‘작은 방=cell’이라 이름 붙였는데, 그게 모든 생명체를 이루는 ‘세포’임은 200년 뒤에야 밝혀졌죠.", "bg": "분야는 과학사예요. 1500년대 후반 최초의 현미경과 그 발전이 배경(영국 과학자 등장). → 생물학 용어 ‘세포(cell)’가 어떻게 그 이름을 얻었는지를 따라가며 읽으세요.", "flow": [{"kind": "발명", "t": "1500s 후반 최초 현미경 → 벼룩보다 작은 것 관찰"}, {"kind": "인물", "t": "Robert Hooke: 자신의 현미경 + 상세 그림"}, {"kind": "출간", "t": "1665 <Micrographia>(‘작은 그림들’)"}, {"kind": "명명", "t": "코르크의 ‘작은 방’ → ‘cell(세포)’"}, {"kind": "후일", "t": "세포가 모든 생명체를 구성함은 200년 뒤 밝혀짐"}], "quiz": [["Hooke가 본 코르크 구조를 ‘cell’이라 부른 이유는?", "상자(작은 방) 모양 구조라서, ‘작은 방’을 뜻하는 ‘cell(세포)’이라 불렀어요."], ["세포의 의미는 언제 밝혀졌나?", "Hooke가 이름 붙인 뒤 다시 200년이 지나서야, 세포가 모든 생명체를 구성한다는 것이 밝혀졌어요."], ["핵심 한 문장?", "Hooke가 코르크의 ‘작은 방’을 ‘cell’이라 명명했고, 그것이 생명의 기본 단위임은 200년 뒤 밝혀졌다."]], "vocab": [["microscope", "현미경"], ["flea", "벼룩"], ["tinker with", "손보다·만지작거리다"], ["illustration", "삽화"], ["cork", "코르크"], ["structure", "구조(물)"], ["make up", "구성하다"]], "en": "The first microscope that clearly showed anything smaller than a flea was invented in the late 1500s. Later, people tinkered with microscopes and lenses to make them even more powerful. One of these people was the English scientist Robert Hooke. Hooke designed a microscope of his own and drew detailed pictures of what he saw. In 1665, he published his illustrations in a book called Micrographia, which means \"little pictures.\" One picture shows boxy spaces in a slice of cork from a tree. Hooke called these box-shaped structures \"cells\" meaning small rooms. It would be another 200 years before scientists realized that cells make up all living things.", "ko": "벼룩보다 더 작은 어떤 것을 분명하게 보여 준 최초의 현미경은 1500년대 후반에 발명되었다. 훗날, 사람들은 현미경과 렌즈를 손봐 훨씬 더 강력하게 만들었다. 이 사람들 중 한 명이 영국의 과학자인 Robert Hooke였다. Hooke는 자신만의 현미경을 고안했고 자신이 본 것의 상세한 그림을 그렸다. 1665년에, 그는 '작은 그림들'을 의미하는 <Micrographia>라고 불리는 책에 자신의 삽화들을 출간했다. 한 그림은 나무로 만든 코르크 조각 안의 상자 모양 공간을 보여 준다. Hooke는 이 상자 모양의 구조물을 '작은 방'을 의미하는 '세포'라고 불렀다. 다시 200년이 지나고 나서야 과학자들은 세포가 모든 생명체를 구성한다는 것을 깨달았다.", "read": [{"en": "The first microscope that clearly showed anything smaller than a flea was invented in the late 1500s.", "ko": "벼룩보다 더 작은 어떤 것을 분명하게 보여 준 최초의 현미경은 1500년대 후반에 발명되었다.", "chunks": [["The first microscope", "최초의 현미경은"], ["that clearly showed", "분명히 보여 준"], ["anything smaller than a flea", "벼룩보다 더 작은 어떤 것이라도"], ["was invented", "발명되었다"], ["in the late 1500s.", "1500년대 후반에."]]}, {"en": "Later, people tinkered with microscopes and lenses to make them even more powerful.", "ko": "훗날, 사람들은 현미경과 렌즈를 손봐 훨씬 더 강력하게 만들었다.", "chunks": [["Later,", "훗날,"], ["people tinkered with", "사람들은 ~을 손봤다"], ["microscopes and lenses", "현미경과 렌즈를"], ["to make them", "그것들을 ~하게 만들기 위해"], ["even more powerful.", "훨씬 더 강력하게."]]}, {"en": "One of these people was the English scientist Robert Hooke.", "ko": "이 사람들 중 한 명이 영국의 과학자인 Robert Hooke였다.", "chunks": [["One of these people", "이 사람들 중 한 명이"], ["was the English scientist Robert Hooke.", "영국의 과학자 Robert Hooke였다."]]}, {"en": "Hooke designed a microscope of his own and drew detailed pictures of what he saw.", "ko": "Hooke는 자신만의 현미경을 고안했고 자신이 본 것의 상세한 그림을 그렸다.", "chunks": [["Hooke designed", "Hooke는 고안했다"], ["a microscope of his own", "자신만의 현미경을"], ["and drew detailed pictures", "그리고 상세한 그림을 그렸다"], ["of what he saw.", "자신이 본 것의."]]}, {"en": "In 1665, he published his illustrations in a book called Micrographia, which means \"little pictures.\"", "ko": "1665년에, 그는 '작은 그림들'을 의미하는 라고 불리는 책에 자신의 삽화들을 출간했다.", "chunks": [["In 1665,", "1665년에,"], ["he published his illustrations", "그는 자신의 삽화들을 출간했다"], ["in a book called Micrographia,", "Micrographia라고 불리는 책에,"], ["which means \"little pictures.\"", "그것은 \"작은 그림들\"을 의미한다."]]}, {"en": "One picture shows boxy spaces in a slice of cork from a tree.", "ko": "한 그림은 나무로 만든 코르크 조각 안의 상자 모양 공간을 보여 준다.", "chunks": [["One picture", "한 그림은"], ["shows boxy spaces", "상자 모양 공간을 보여 준다"], ["in a slice of cork", "코르크 조각 안의"], ["from a tree.", "나무로 만든."]]}, {"en": "Hooke called these box-shaped structures \"cells\" meaning small rooms.", "ko": "Hooke는 이 상자 모양의 구조물을 '작은 방'을 의미하는 '세포'라고 불렀다.", "chunks": [["Hooke called", "Hooke는 이렇게 불렀다"], ["these box-shaped structures", "이 상자 모양 구조물들을"], ["\"cells\"", "\"세포\"라고"], ["meaning small rooms.", "\"작은 방\"을 의미하는."]]}, {"en": "It would be another 200 years before scientists realized that cells make up all living things.", "ko": "다시 200년이 지나고 나서야 과학자들은 세포가 모든 생명체를 구성한다는 것을 깨달았다.", "chunks": [["It would be", "~이 걸렸을 것이다"], ["another 200 years", "추가로 200년이"], ["before scientists realized", "과학자들이 깨닫기 전에"], ["that cells make up", "세포가 ~을 구성한다는 것을"], ["all living things.", "모든 생명체를."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 1500년대 초기 현미경, 가운데 1665년 Hooke의 Micrographia 책과 cork 슬라이스의 상자 격자, 오른쪽 200년 후 세포설 인식이 연표로 이어진 그림\">\n  <!-- 상단 연표 라인 -->\n  <line x1=\"40\" y1=\"40\" x2=\"560\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n  <polygon points=\"560,40 552,36 552,44\" fill=\"#1a1a1a\"/>\n  <!-- 연표 노드 -->\n  <circle cx=\"100\" cy=\"40\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n  <circle cx=\"300\" cy=\"40\" r=\"6\" fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n  <circle cx=\"500\" cy=\"40\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n  <!-- 연표 라벨 -->\n  <text x=\"100\" y=\"28\" font-family=\"Noto Serif\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">late 1500s</text>\n  <text x=\"300\" y=\"26\" font-family=\"Noto Serif\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">1665</text>\n  <text x=\"500\" y=\"28\" font-family=\"Noto Serif\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">~ 1865</text>\n\n  <!-- 좌측: 초기 현미경 -->\n  <g transform=\"translate(100, 130)\">\n    <!-- 현미경 몸체 (구식 튜브) -->\n    <rect x=\"-6\" y=\"-30\" width=\"12\" height=\"40\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <!-- 접안렌즈 -->\n    <ellipse cx=\"0\" cy=\"-32\" rx=\"8\" ry=\"3\" fill=\"#1a1a1a\"/>\n    <!-- 대물렌즈 -->\n    <ellipse cx=\"0\" cy=\"12\" rx=\"7\" ry=\"2.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <!-- 받침대 -->\n    <rect x=\"-20\" y=\"14\" width=\"40\" height=\"3\" fill=\"#1a1a1a\"/>\n    <!-- 받침 다리 -->\n    <line x1=\"-15\" y1=\"17\" x2=\"-22\" y2=\"32\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <line x1=\"15\" y1=\"17\" x2=\"22\" y2=\"32\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n    <!-- 작은 표본 -->\n    <ellipse cx=\"0\" cy=\"22\" rx=\"3\" ry=\"1.5\" fill=\"#999\"/>\n    <!-- 라벨 -->\n    <text x=\"0\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">first microscope</text>\n    <text x=\"0\" y=\"69\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">최초 현미경 발명</text>\n  </g>\n\n  <!-- 가운데: 1665 Hooke Micrographia + cork slice -->\n  <g transform=\"translate(300, 130)\">\n    <!-- Micrographia 책 (왼쪽) -->\n    <g transform=\"translate(-55, 0)\">\n      <!-- 책 표지 -->\n      <rect x=\"-22\" y=\"-32\" width=\"36\" height=\"48\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <!-- 책 등 (세로) -->\n      <rect x=\"-22\" y=\"-32\" width=\"4\" height=\"48\" fill=\"#1FA34A\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <!-- 제목 라벨 -->\n      <text x=\"-3\" y=\"-15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">Micro-</text>\n      <text x=\"-3\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">graphia</text>\n      <!-- 줄 -->\n      <line x1=\"-15\" y1=\"0\" x2=\"9\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"0.7\"/>\n      <line x1=\"-15\" y1=\"5\" x2=\"9\" y2=\"5\" stroke=\"#1FA34A\" stroke-width=\"0.7\"/>\n      <line x1=\"-15\" y1=\"10\" x2=\"9\" y2=\"10\" stroke=\"#1FA34A\" stroke-width=\"0.7\"/>\n    </g>\n\n    <!-- 화살표 (책 → cork slice 확대) -->\n    <line x1=\"-30\" y1=\"0\" x2=\"-15\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <polygon points=\"-15,0 -20,-3 -20,3\" fill=\"#1a1a1a\"/>\n\n    <!-- cork 슬라이스 (확대 표시) — 6각형 벌집 격자 (Hooke의 실제 관찰 구조) -->\n    <g transform=\"translate(20, -5)\">\n      <!-- 확대 원 표시 -->\n      <circle cx=\"0\" cy=\"5\" r=\"38\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <!-- 6각형 벌집 격자 -->\n      <g fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\">\n        <!-- Row 0 (y=-19) -->\n        <polygon points=\"-24,-19 -18,-22.5 -12,-19 -12,-12 -18,-8.5 -24,-12\"/>\n        <polygon points=\"-12,-19 -6,-22.5 0,-19 0,-12 -6,-8.5 -12,-12\"/>\n        <polygon points=\"0,-19 6,-22.5 12,-19 12,-12 6,-8.5 0,-12\"/>\n        <polygon points=\"12,-19 18,-22.5 24,-19 24,-12 18,-8.5 12,-12\"/>\n        <!-- Row 1 (y=-5, 오프셋) -->\n        <polygon points=\"-30,-5 -24,-8.5 -18,-5 -18,2 -24,5.5 -30,2\"/>\n        <polygon points=\"-18,-5 -12,-8.5 -6,-5 -6,2 -12,5.5 -18,2\"/>\n        <polygon points=\"-6,-5 0,-8.5 6,-5 6,2 0,5.5 -6,2\"/>\n        <polygon points=\"6,-5 12,-8.5 18,-5 18,2 12,5.5 6,2\"/>\n        <polygon points=\"18,-5 24,-8.5 30,-5 30,2 24,5.5 18,2\"/>\n        <!-- Row 2 (y=9) -->\n        <polygon points=\"-24,9 -18,5.5 -12,9 -12,16 -18,19.5 -24,16\"/>\n        <polygon points=\"-12,9 -6,5.5 0,9 0,16 -6,19.5 -12,16\"/>\n        <polygon points=\"0,9 6,5.5 12,9 12,16 6,19.5 0,16\"/>\n        <polygon points=\"12,9 18,5.5 24,9 24,16 18,19.5 12,16\"/>\n        <!-- Row 3 (y=23) -->\n        <polygon points=\"-30,23 -24,19.5 -18,23 -18,30 -24,33.5 -30,30\"/>\n        <polygon points=\"-18,23 -12,19.5 -6,23 -6,30 -12,33.5 -18,30\"/>\n        <polygon points=\"-6,23 0,19.5 6,23 6,30 0,33.5 -6,30\"/>\n        <polygon points=\"6,23 12,19.5 18,23 18,30 12,33.5 6,30\"/>\n        <polygon points=\"18,23 24,19.5 30,23 30,30 24,33.5 18,30\"/>\n      </g>\n    </g>\n\n    <!-- 명명 라벨 -->\n    <text x=\"0\" y=\"65\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">called them \"cells\"</text>\n    <text x=\"0\" y=\"79\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">= small rooms (작은 방)</text>\n  </g>\n\n  <!-- 우측: 200년 시간 격차 + 세포설 인식 -->\n  <g transform=\"translate(500, 130)\">\n    <!-- 200년 간격 표시 (점선 시간 흐름) -->\n    <text x=\"0\" y=\"-50\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#999\" font-weight=\"700\">another 200 yrs</text>\n    \n    <!-- 생명체 아이콘들 (세포로 구성됨을 표시) -->\n    <g transform=\"translate(0, -10)\">\n      <!-- 큰 원 (생명체) 안에 작은 세포들 -->\n      <circle cx=\"0\" cy=\"0\" r=\"28\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 안에 작은 세포 (들의 무리) -->\n      <g fill=\"#1FA34A\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"0.9\">\n        <circle cx=\"-12\" cy=\"-10\" r=\"4\"/>\n        <circle cx=\"-2\" cy=\"-12\" r=\"3.5\"/>\n        <circle cx=\"9\" cy=\"-8\" r=\"4\"/>\n        <circle cx=\"-14\" cy=\"1\" r=\"3.5\"/>\n        <circle cx=\"-3\" cy=\"0\" r=\"4\"/>\n        <circle cx=\"10\" cy=\"2\" r=\"3.5\"/>\n        <circle cx=\"-10\" cy=\"11\" r=\"3.8\"/>\n        <circle cx=\"2\" cy=\"13\" r=\"4\"/>\n        <circle cx=\"12\" cy=\"11\" r=\"3.5\"/>\n        <circle cx=\"-15\" cy=\"-2\" r=\"2.8\"/>\n      </g>\n    </g>\n\n    <!-- 라벨 -->\n    <text x=\"0\" y=\"42\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">cells make up living things</text>\n    <text x=\"0\" y=\"56\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">세포 = 모든 생명체 구성</text>\n    <text x=\"0\" y=\"69\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">시간 격차로 뒤늦은 인식</text>\n  </g>\n\n  <!-- 1500s -> 1665 시간 흐름 라벨 -->\n  <text x=\"200\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">tinker · improve</text>\n  <!-- 1665 -> 1865 시간 흐름 라벨 -->\n  <text x=\"400\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">naming → understanding</text>\n</svg>", "caption": "왼쪽 1500년대 초기 현미경, 가운데 1665년 Hooke의 Micrographia 책과 cork 슬라이스의 상자 격자, 오른쪽 200년 후 세포설 인식이 연표로 이어진 그림"}, {"no": "3", "title": "Why Tigers Keep Their Stripes", "ktitle": "호랑이가 줄무늬를 지키는 이유", "field": "생물·진화", "page": "p37 독해훈련", "oneline": "호랑이 줄무늬는 서식지에 ‘위장’해 먹이를 덮치게 해 준다.", "tldr": ["호랑이 줄무늬는 서식지에 ‘위장’해 먹이를 덮치게 해 준다.", "줄무늬가 없으면 눈에 띄어 먹이가 미리 도망 → 사냥이 어려워진다.", "그래서 호랑이는 줄무늬를 유지하며 ‘단독 매복’으로 사냥을 이어 간다."], "analogy": "호랑이 줄무늬는 풀숲에 녹아드는 ‘위장복’이에요. 이게 없으면 먹이가 멀리서 알아채고 달아나니, 줄무늬 덕에 몰래 다가가 덮칠 수 있는 거죠.", "bg": "분야는 생물·진화예요. 핵심 소재는 호랑이 줄무늬의 ‘위장(camouflage)’ 기능. → 줄무늬가 사냥에 어떤 이점을 주는지에 초점을 두고 읽으세요.", "flow": [{"kind": "기능", "t": "줄무늬 = 서식지 위장 → 매복·덮치기"}, {"kind": "가정", "t": "줄무늬 없으면 눈에 띔 → 먹이가 미리 도망"}, {"kind": "결과", "t": "사냥 어려워짐 → 무리 사냥 등 다른 기술 가능성"}, {"kind": "현실", "t": "줄무늬는 곧 사라지지 않음 → 단독 매복 지속"}], "quiz": [["호랑이 줄무늬는 어떤 역할을 하나?", "풀·숲 서식지에 위장시켜, 의심하지 않는 먹이에게 몰래 다가가 덮칠 수 있게 해 줘요."], ["줄무늬가 없다면 어떤 일이 생길까?", "눈에 잘 띄어 먹이가 미리 도망쳐, 사냥이 훨씬 어려워질 거예요."], ["핵심 한 문장?", "호랑이 줄무늬는 위장으로 매복 사냥을 가능케 하므로, 그 덕에 단독 사냥이 유지된다."]], "vocab": [["stripeless", "줄무늬가 없는"], ["blend in with", "~에 섞여 들다"], ["pounce on", "덮치다"], ["unsuspecting", "의심하지 않는"], ["spot", "발견하다·알아채다"], ["solitary", "홀로 지내는"], ["corner", "구석으로 몰다"]], "en": "Animals such as deer and antelope would love stripeless tigers. The big cats' patterns let them blend in with their grassy and forested habitats so that they can hide and pounce on unsuspecting prey. If it were not for stripes, a tiger would be much easier to spot. This could enable prey to detect the predator and flee before being attacked, making it harder for the big cats to secure the prey. Over time, tigers might be able to develop other hunting techniques. For instance, instead of being solitary and hunting alone, it is possible that they would begin to hunt in groups, as lions do, in order to corner runaway prey. Tigers, however, won't be losing their patterns anytime soon, so they will continue to capture prey during their solo hide-and-seek sessions.", "ko": "사슴과 영양 같은 동물들은 줄무늬가 없는 호랑이를 좋아할 것이다. 큰 고양잇과 동물들의 무늬는 그것들이 숨어서 의심하지 않는 먹이를 덮칠 수 있도록 풀이 무성하고 숲이 우거진 서식지에 섞이게 해 준다. 줄무늬가 없다면, 호랑이는 눈에 띄기 훨씬 더 쉬울 것이다. 이는 먹잇감이 포식자를 감지해 공격받기 전에 달아날 수 있게 하며, 결국 큰 고양잇과 동물들이 먹이를 확보하는 것을 더 어렵게 만든다. 시간이 흐르면, 호랑이들은 다른 사냥 기술을 발달시킬 수도 있을지 모른다. 예를 들면, 홀로 지내며 혼자 사냥하는 대신에, 그것들은 도망치는 먹잇감을 구석으로 몰기 위해 사자들이 하는 것처럼 무리를 지어 사냥하기 시작할 수도 있다. 하지만 호랑이들이 빠른 시일 내에 무늬를 잃지는 않을 것이고, 그래서 그것들은 계속해서 단독 숨바꼭질로 먹이를 잡을 것이다.", "read": [{"en": "Animals such as deer and antelope would love stripeless tigers.", "ko": "사슴과 영양 같은 동물들은 줄무늬가 없는 호랑이를 좋아할 것이다.", "chunks": [["Animals such as deer and antelope", "사슴과 영양 같은 동물들은"], ["would love", "좋아할 것이다"], ["stripeless tigers.", "줄무늬 없는 호랑이를."]]}, {"en": "The big cats' patterns let them blend in with their grassy and forested habitats so that they can hide and pounce on unsuspecting prey.", "ko": "큰 고양잇과 동물들의 무늬는 그것들이 숨어서 의심하지 않는 먹이를 덮칠 수 있도록 풀이 무성하고 숲이 우거진 서식지에 섞이게 해 준다.", "chunks": [["The big cats' patterns", "큰 고양잇과 동물들의 무늬는"], ["let them blend in with", "그것들이 ~에 섞이게 해 준다"], ["their grassy and forested habitats", "그들의 풀 무성하고 숲 우거진 서식지에"], ["so that they can hide", "그래서 그것들이 숨을 수 있도록"], ["and pounce on unsuspecting prey.", "그리고 의심하지 않는 먹이를 덮칠 수 있도록."]]}, {"en": "If it were not for stripes, a tiger would be much easier to spot.", "ko": "줄무늬가 없다면, 호랑이는 눈에 띄기 훨씬 더 쉬울 것이다.", "chunks": [["If it were not for stripes,", "줄무늬가 없다면,"], ["a tiger would be", "호랑이는 ~할 것이다"], ["much easier to spot.", "발견하기 훨씬 더 쉬울."]]}, {"en": "This could enable prey to detect the predator and flee before being attacked, making it harder for the big cats to secure the prey.", "ko": "이는 먹잇감이 포식자를 감지해 공격받기 전에 달아날 수 있게 하며, 결국 큰 고양잇과 동물들이 먹이를 확보하는 것을 더 어렵게 만든다.", "chunks": [["This could enable prey", "이는 먹잇감이 ~할 수 있게 한다"], ["to detect the predator", "포식자를 감지하고"], ["and flee", "도망치는 것을"], ["before being attacked,", "공격받기 전에,"], ["making it harder", "~을 더 어렵게 만든다"], ["for the big cats", "큰 고양잇과 동물들이"], ["to secure the prey.", "먹이를 확보하는 것을."]]}, {"en": "Over time, tigers might be able to develop other hunting techniques.", "ko": "시간이 흐르면, 호랑이들은 다른 사냥 기술을 발달시킬 수도 있을지 모른다.", "chunks": [["Over time,", "시간이 흐르면,"], ["tigers might be able to develop", "호랑이는 발달시킬 수 있을지도 모른다"], ["other hunting techniques.", "다른 사냥 기술을."]]}, {"en": "For instance, instead of being solitary and hunting alone, it is possible that they would begin to hunt in groups, as lions do, in order to corner runaway prey.", "ko": "예를 들면, 홀로 지내며 혼자 사냥하는 대신에, 그것들은 도망치는 먹잇감을 구석으로 몰기 위해 사자들이 하는 것처럼 무리를 지어 사냥하기 시작할 수도 있다.", "chunks": [["For instance,", "예를 들어,"], ["instead of being solitary", "홀로 지내는 것 대신에"], ["and hunting alone,", "그리고 혼자 사냥하는 대신에,"], ["it is possible that", "~할 가능성이 있다"], ["they would begin to hunt in groups,", "그들이 무리 지어 사냥하기 시작할"], ["as lions do,", "사자들이 그러는 것처럼,"], ["in order to corner runaway prey.", "도망가는 먹이를 구석으로 몰기 위해."]]}, {"en": "Tigers, however, won't be losing their patterns anytime soon, so they will continue to capture prey during their solo hide-and-seek sessions.", "ko": "하지만 호랑이들이 빠른 시일 내에 무늬를 잃지는 않을 것이고, 그래서 그것들은 계속해서 단독 숨바꼭질로 먹이를 잡을 것이다.", "chunks": [["Tigers, however,", "하지만 호랑이는"], ["won't be losing their patterns", "자신들의 무늬를 잃지 않을 것이다"], ["anytime soon,", "빠른 시일 내에,"], ["so they will continue to capture prey", "그래서 계속 먹이를 잡을 것이다"], ["during their solo hide-and-seek sessions.", "단독 숨바꼭질 동안."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 줄무늬 없는 호랑이가 풀숲에서 눈에 띄어 사슴이 도망가고 무리 사냥이 필요한 가상 장면, 오른쪽 줄무늬 있는 호랑이가 풀숲에 섞여 의심 없는 사슴을 단독으로 기습하는 현실 장면 대조\">\n  <!-- 좌측: 가정 — 줄무늬 없음 -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">If it were not for stripes — 가정</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.2\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 풀숲 배경 (옅음) -->\n    <g stroke=\"#1FA34A\" stroke-width=\"0.9\" opacity=\"0.4\">\n      <path d=\"M 10 130 Q 12 120 14 130\"/>\n      <path d=\"M 18 132 Q 20 122 22 132\"/>\n      <path d=\"M 28 128 Q 30 118 32 128\"/>\n      <path d=\"M 38 134 Q 40 124 42 134\"/>\n      <path d=\"M 48 130 Q 50 120 52 130\"/>\n      <path d=\"M 220 130 Q 222 120 224 130\"/>\n      <path d=\"M 230 132 Q 232 122 234 132\"/>\n      <path d=\"M 240 128 Q 242 118 244 128\"/>\n      <path d=\"M 250 134 Q 252 124 254 134\"/>\n      <path d=\"M 260 130 Q 262 120 264 130\"/>\n    </g>\n\n    <!-- 줄무늬 없는 호랑이 (눈에 띔, 빨강 외곽) -->\n    <g transform=\"translate(80, 110)\">\n      <!-- 몸통 -->\n      <ellipse cx=\"0\" cy=\"0\" rx=\"32\" ry=\"14\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n      <!-- 머리 -->\n      <circle cx=\"-28\" cy=\"-6\" r=\"11\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.7\"/>\n      <!-- 귀 -->\n      <polygon points=\"-34,-15 -32,-19 -29,-15\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <polygon points=\"-25,-16 -23,-20 -20,-15\" fill=\"#fdf2f4\" stroke=\"#c8102e\" s r": ["많은 스포츠의 궁극 목표는 득점·승리지만,", "즐거움의 일부는 ‘결과’가 아니라 ‘경기가 펼쳐지는 방식’에 있다.", "Jordan의 덩크처럼, 보여지는 ‘기술의 아름다움’이 사람을 매혹한다."], "analogy": "농구에서 ‘몇 점’보다 Jordan이 공중을 가르며 덩크하는 장면이 더 짜릿하죠. 스포츠의 매력은 결과뿐 아니라 ‘어떻게 해내느냐’의 아름다움에 있어요.", "bg": "분야는 스포츠·미학이에요. 핵심 물음은 ‘스포츠의 목표가 득점·승리뿐인가’. → 관중의 즐거움이 결과가 아니라 ‘경기 방식·기술의 아름다움’에서 오는지에 주목하며 읽으세요.", "flow": [{"kind": "목표", "t": "많은 스포츠의 궁극 목표 = 득점·승리"}, {"kind": "반전", "t": "즐거움의 일부는 ‘결과’ 아닌 ‘경기 방식’"}, {"kind": "기준", "t": "오락 가치 = 관중 ‘경험의 질’"}, {"kind": "예시", "t": "Jordan 덩크 = 점수보다 더 만족 → 기술의 아름다움이 매혹"}], "quiz": [["스포츠의 ‘오락적 가치’는 무엇에 달려 있나?", "대체로 관중이 얻는 ‘경험의 질’ — 결과보다 경기가 펼쳐지는 방식에 달려 있어요."], ["Jordan 덩크 예시가 말하는 것은?", "실제 득점보다 ‘기술의 아름다움(경기 방식)’이 관중을 더 만족시키고 매혹한다는 거예요."], ["핵심 한 문장?", "스포츠의 즐거움은 결과뿐 아니라, 경기 방식과 기술의 아름다움에서 나온다."]], "vocab": [["ultimate", "궁극의"], ["defeat", "물리치다"], ["spectator", "관중"], ["launch oneself", "날아오르다·돌진하다"], ["dunk", "덩크슛하다"], ["on display", "드러나 보이는"], ["fascinated", "매혹된"]], "en": "What role does the performance of athletes play in athletic competition? The ultimate aim of many athletic activities is to score points or defeat a competitor. However, part of the pleasure of a game is the way it is played rather than the end goal. The entertainment value of sports is largely a matter of the quality of the experience for spectators. For example, seeing a top athlete such as Michael Jordan launching himself through the air to dunk a basketball could be considered more satisfying to spectators than the actual points scored. That is, the beauty of the game ─ the quality of the skill on display ─ is part of what keeps people fascinated with sports.", "ko": "운동 경기에서 선수들의 경기력은 어떤 역할을 할까? 많은 스포츠 활동의 궁극적인 목표는 점수를 내거나 경쟁자를 물리치는 것이다. 하지만, 경기의 즐거움 중 일부는 최종 목표라기보다는 경기가 진행되는 방식에 있다. 스포츠의 오락적 가치는 대체로 관중들이 얻는 경험의 질의 문제이다. 예를 들어, Michael Jordan과 같은 최정상의 운동선수가 공중으로 날아올라 덩크 슛을 하는 것을 보는 것이 실제 득점한 점수보다 관중들에게 보다 만족스럽게 여겨질 수 있다. 다시 말해, 경기의 아름다움, 즉 (경기에서) 보여지는 기술의 질이 사람들을 스포츠에 매혹되게 하는 것의 일부분인 것이다.", "read": [{"en": "What role does the performance of athletes play in athletic competition?", "ko": "운동 경기에서 선수들의 경기력은 어떤 역할을 할까?", "chunks": [["What role", "어떤 역할을"], ["does the performance of athletes play", "선수들의 경기력이 하는가"], ["in athletic competition?", "운동 경기에서?"]]}, {"en": "The ultimate aim of many athletic activities is to score points or defeat a competitor.", "ko": "많은 스포츠 활동의 궁극적인 목표는 점수를 내거나 경쟁자를 물리치는 것이다.", "chunks": [["The ultimate aim", "궁극적인 목표는"], ["of many athletic activities", "많은 스포츠 활동의"], ["is to score points", "점수를 내거나"], ["or defeat a competitor.", "경쟁자를 물리치는 것이다."]]}, {"en": "However, part of the pleasure of a game is the way it is played rather than the end goal.", "ko": "하지만, 경기의 즐거움 중 일부는 최종 목표라기보다는 경기가 진행되는 방식에 있다.", "chunks": [["However,", "하지만,"], ["part of the pleasure of a game", "경기의 즐거움 중 일부는"], ["is the way it is played", "그것이 진행되는 방식이다"], ["rather than the end goal.", "최종 목표라기보다는."]]}, {"en": "The entertainment value of sports is largely a matter of the quality of the experience for spectators.", "ko": "스포츠의 오락적 가치는 대체로 관중들이 얻는 경험의 질의 문제이다.", "chunks": [["The entertainment value of sports", "스포츠의 오락적 가치는"], ["is largely", "대체로 ~이다"], ["a matter of the quality", "질의 문제"], ["of the experience for spectators.", "관중들이 얻는 경험의."]]}, {"en": "For example, seeing a top athlete such as Michael Jordan launching himself through the air to dunk a basketball could be considered more satisfying to spectators than the actual points scored.", "ko": "예를 들어, Michael Jordan과 같은 최정상의 운동선수가 공중으로 날아올라 덩크 슛을 하는 것을 보는 것이 실제 득점한 점수보다 관중들에게 보다 만족스럽게 여겨질 수 있다.", "chunks": [["For example,", "예를 들어,"], ["seeing a top athlete", "최정상 선수를 보는 것은"], ["such as Michael Jordan", "Michael Jordan과 같은"], ["launching himself through the air", "공중으로 자신을 던지며"], ["to dunk a basketball", "농구공을 덩크하는"], ["could be considered more satisfying", "더 만족스럽다고 여겨질 수 있다"], ["to spectators", "관중들에게"], ["than the actual points scored.", "실제로 득점한 점수보다."]]}, {"en": "That is, the beauty of the game ─ the quality of the skill on display ─ is part of what keeps people fascinated with sports.", "ko": "다시 말해, 경기의 아름다움, 즉 (경기에서) 보여지는 기술의 질이 사람들을 스포츠에 매혹되게 하는 것의 일부분인 것이다.", "chunks": [["That is,", "다시 말해,"], ["the beauty of the game", "경기의 아름다움이"], ["— the quality of the skill on display —", "즉 보여지는 기술의 질이"], ["is part of", "~의 일부이다"], ["what keeps people fascinated", "사람들을 매혹된 상태로 유지하는 것"], ["with sports.", "스포츠에."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 점수판으로 표면 목표를 나타내고 오른쪽 Jordan이 공중에 떠서 덩크하는 모습으로 경기의 아름다움을 나타내는 대조 그림\">\n  <!-- 좌측: 표면 목표 — 점수판 -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"125\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">표면 목표 — 득점·승리</text>\n    <rect x=\"0\" y=\"0\" width=\"250\" height=\"190\" fill=\"#fdf2f4\" fill-opacity=\"0.2\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 점수판 (전광판 형태) -->\n    <g transform=\"translate(125, 100)\">\n      <!-- 점수판 본체 -->\n      <rect x=\"-80\" y=\"-40\" width=\"160\" height=\"80\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.8\"/>\n      <!-- 윗 헤더 -->\n      <rect x=\"-80\" y=\"-40\" width=\"160\" height=\"14\" fill=\"#1a1a1a\"/>\n      <text x=\"0\" y=\"-30\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">SCOREBOARD</text>\n      \n      <!-- 좌 팀 -->\n      <text x=\"-50\" y=\"-12\" font-family=\"Noto Serif\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5e5e5e\">HOME</text>\n      <text x=\"-50\" y=\"22\" font-family=\"Noto Serif\" font-size=\"28\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">98</text>\n      \n      <!-- 구분 -->\n      <line x1=\"0\" y1=\"-22\" x2=\"0\" y2=\"36\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      \n      <!-- 우 팀 -->\n      <text x=\"50\" y=\"-12\" font-family=\"Noto Serif\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"mid th=\"0.9\"/>\n    </g>\n\n    <!-- 공중 라인 (도약 궤적, 점선) -->\n    <path d=\"M 50 145 Q 90 80 130 60\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1\" stroke-dasharray=\"2 3\" opacity=\"0.6\"/>\n    \n    <!-- 지면 -->\n    <line x1=\"20\" y1=\"155\" x2=\"230\" y2=\"155\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n\n    <!-- 캡션 -->\n    <text x=\"125\" y=\"175\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">Jordan's dunk — beauty of play</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 245)\">\n    <text x=\"300\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">quality of skill on display — keeps people fascinated</text>\n  </g>\n</svg>", "caption": "왼쪽 점수판으로 표면 목표를 나타내고 오른쪽 Jordan이 공중에 떠서 덩크하는 모습으로 경기의 아름다움을 나타내는 대조 그림"}, {"no": "5", "title": "The Roadside Nature Illusion", "ktitle": "도로변 자연은 ‘환상’이다", "field": "환경·인식", "page": "p40 no.1", "oneline": "우리는 주변에 보이는 것으로 세상을 판단한다(도로변 숲이 광활하다 착각).", "tldr": ["우리는 주변에 보이는 것으로 세상을 판단한다(도로변 숲이 광활하다 착각).", "사실 그 자연은 몇 야드 폭의 ‘가림막’ — 생태 보존이 아니라 시야 차단용이다.", "위성·드론으로 이제 인류 발자취의 실제 범위를 누구나 볼 수 있다."], "analogy": "고속도로 옆 ‘숲’은 사실 몇 야드 폭의 얇은 띠일 뿐, 그 뒤의 주택·공장 단지를 가리는 가림막이에요. 위성으로 보면 그 ‘환상’이 깨지죠.", "bg": "분야는 환경·인식이에요. ‘우리는 눈에 보이는 것으로 세상을 판단한다’가 출발점(도로변 숲을 광활하다 착각). → 이 착각이 자연을 보는 시각을 어떻게 왜곡하는지에 주목하며 읽으세요.", "flow": [{"kind": "인식", "t": "주변에 보이는 것으로 세상 판단 → 도로변 숲=광활 착각"}, {"kind": "실상", "t": "몇 야드 폭의 ‘환상’ — 생태 보존 ✗"}, {"kind": "기능", "t": "주택·산업 단지 시야를 ‘가리는’ 가림막"}, {"kind": "폭로", "t": "위성·드론 → 인류 발자취 실제 범위 노출"}, {"kind": "결론", "t": "환상은 끝 — 충격적 인간 영향이 보인다"}], "quiz": [["도로변 자연이 ‘환상’이라는 것은 무슨 뜻인가?", "광활해 보이지만 실은 몇 야드 폭의 얇은 띠로, 생태 보존이 아니라 주택·공장 단지를 가리는 가림막일 뿐이라는 거예요."], ["그 환상이 어떻게 깨졌나?", "인터넷·드론으로 접근 가능한 위성 이미지 덕에 인류 발자취의 실제 범위를 누구나 볼 수 있게 됐어요."], ["핵심 한 문장?", "도로변 자연은 시야를 가리는 얇은 환상이며, 위성·드론이 충격적인 인간의 실제 영향을 드러낸다."]], "vocab": [["perspective", "관점"], ["subconsciously", "무의식적으로"], ["illusion", "환상"], ["preserve", "보존하다"], ["plot of land", "한 구획의 토지"], ["advent", "등장·도래"], ["footprint", "발자취·영향"]], "en": "It is natural for us to view the world from the perspective of what we normally see around us. When driving along a highway, we see the woodlot down the street and subconsciously imagine it extending far and wide. All seems well with so much nature out there. What we cannot see, though, is that the strip of nature along the road is an illusion that's only several yards wide. Its function is not to preserve local ecosystems but to block our view of housing developments and industrial complexes. The woodlot may be a bit bigger, but it is merely a plot of land with no access. Now, however, with the advent of satellite imagery accessible via the Internet and drones, anyone who is interested can easily see the actual extent of the human footprint on the biosphere. There are no more illusions; the shocking human impact is right there for us to see.", "ko": "우리가 보통 우리 주변을 바라보는 것의 관점으로 세상을 보는 것은 당연하다. 고속도로를 운전할 때, 우리는 도로 아래쪽에서 식림지를 보고 무의식적으로 그것이 광활하게 펼쳐져 있을 것으로 상상한다. 바깥에 자연이 무척 많아서 모든 것이 좋아 보인다. 하지만 우리가 볼 수 없는 것은 도로를 따라 늘어선 그 길다란 자연이 단지 몇 야드 너비에 불과한 환상이라는 것이다. 그 자연의 기능은 지역 생태계를 보존하는 것이 아니라 주택 단지와 산업 단지가 보이는 우리의 시야를 가리는 것이다. 식림지가 조금 더 클 수는 있지만, 그것은 그저 접근하지 못하는 한 구획의 토지일 뿐이다. 하지만 이제, 인터넷과 드론을 통해 접근 가능한 위성 이미지의 등장으로 인해, 관심이 있는 사람은 누구나 생물권에 남긴 인류 발자취의 실제 범위를 쉽게 볼 수 있다. 더 이상의 환상은 없고, 충격적인 인간의 영향이 우리가 볼 수 있는 바로 그곳에 있다.", "read": [{"en": "It is natural for us to view the world from the perspective of what we normally see around us.", "ko": "우리가 보통 우리 주변을 바라보는 것의 관점으로 세상을 보는 것은 당연하다.", "chunks": [["It is natural", "~은 자연스럽다"], ["for us to view the world", "우리가 세상을 바라보는 것은"], ["from the perspective of", "~의 관점으로부터"], ["what we normally see around us.", "우리가 보통 주변에서 보는 것의."]]}, {"en": "When driving along a highway, we see the woodlot down the street and subconsciously imagine it extending far and wide.", "ko": "고속도로를 운전할 때, 우리는 도로 아래쪽에서 식림지를 보고 무의식적으로 그것이 광활하게 펼쳐져 있을 것으로 상상한다.", "chunks": [["When driving along a highway,", "고속도로를 따라 운전할 때,"], ["we see the woodlot", "우리는 식림지를 본다"], ["down the street", "도로 아래쪽에서"], ["and subconsciously imagine", "그리고 무의식적으로 상상한다"], ["it extending far and wide.", "그것이 광활하게 뻗어 있다고."]]}, {"en": "All seems well with so much nature out there.", "ko": "바깥에 자연이 무척 많아서 모든 것이 좋아 보인다.", "chunks": [["All seems well", "모든 것이 좋아 보인다"], ["with so much nature", "그렇게 많은 자연이 있어서"], ["out there.", "바깥에."]]}, {"en": "What we cannot see, though, is that the strip of nature along the road is an illusion that's only several yards wide.", "ko": "하지만 우리가 볼 수 없는 것은 도로를 따라 늘어선 그 길다란 자연이 단지 몇 야드 너비에 불과한 환상이라는 것이다.", "chunks": [["What we cannot see, though,", "하지만 우리가 볼 수 없는 것은"], ["is that the strip of nature", "~이다, 그 자연의 띠가"], ["along the road", "도로를 따라 늘어선"], ["is an illusion", "환상이라는 것이다"], ["that's only several yards wide.", "단지 몇 야드 너비에 불과한."]]}, {"en": "Its function is not to preserve local ecosystems but to block our view of housing developments and industrial complexes.", "ko": "그 자연의 기능은 지역 생태계를 보존하는 것이 아니라 주택 단지와 산업 단지가 보이는 우리의 시야를 가리는 것이다.", "chunks": [["Its function", "그 기능은"], ["is not to preserve local ecosystems", "지역 생태계를 보존하는 것이 아니라"], ["but to block our view of", "우리의 시야를 가리는 것이다"], ["housing developments and industrial complexes.", "주택 단지와 산업 단지의."]]}, {"en": "The woodlot may be a bit bigger, but it is merely a plot of land with no access.", "ko": "식림지가 조금 더 클 수는 있지만, 그것은 그저 접근하지 못하는 한 구획의 토지일 뿐이다.", "chunks": [["The woodlot may be a bit bigger,", "식림지가 조금 더 클 수도 있지만,"], ["but it is merely a plot of land", "그것은 그저 한 구획의 토지일 뿐이다"], ["with no access.", "접근할 수 없는."]]}, {"en": "Now, however, with the advent of satellite imagery accessible via the Internet and drones, anyone who is interested can easily see the actual extent of the human footprint on the biosphere.", "ko": "하지만 이제, 인터넷과 드론을 통해 접근 가능한 위성 이미지의 등장으로 인해, 관심이 있는 사람은 누구나 생물권에 남긴 인류 발자취의 실제 범위를 쉽게 볼 수 있다.", "chunks": [["N idth=\"32\" height=\"16\"/>\n      <rect x=\"361\" y=\"-9\" width=\"4\" height=\"9\"/>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 285)\">\n    <text x=\"300\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">shocking human impact — right there for us to see</text>\n  </g>\n</svg>", "caption": "위쪽 도로변 운전자 시점에서 광활해 보이는 숲의 환상, 아래쪽 위성·드론 항공 시점에서 좁은 띠와 뒤편 주택·산업 단지가 드러나는 실체 대조"}, {"no": "6", "title": "Coral and Algae: A Fragile Pact", "ktitle": "산호와 조류 — 깨지기 쉬운 동거", "field": "생태·환경", "page": "p40 no.2", "oneline": "산호초는 조류를 ‘룸메이트’로 들여 서로를 돕는다(조류가 색·먹이 공급).", "tldr": ["산호초는 조류를 ‘룸메이트’로 들여 서로를 돕는다(조류가 색·먹이 공급).", "이 정교한 관계는 수온 2도 상승·오염에도 무너진다(백화 현상).", "산호는 ‘조기 경보 체계’ — 산호가 위험하면 대양 전체가 위험하다."], "analogy": "산호와 조류는 ‘서로 먹여 주는 룸메이트’예요. 그런데 수온이 2도만 올라도 산호가 조류를 내쫓아 하얗게 변하죠 — 산호의 위기가 바다 전체의 경고등이에요.", "bg": "분야는 생태·환경이에요. 산호초와 조류(algae)의 ‘룸메이트’ 같은 공생 관계가 핵심. → 둘이 서로에게 무엇을 주고받는지, 그 관계가 왜 깨지기 쉬운지에 주목하며 읽으세요.", "flow": [{"kind": "공생", "t": "산호 ↔ 조류: 조류=색·먹이 / 산호=노폐물로 영양"}, {"kind": "취약", "t": "정교한 관계 = 기후·해양 변화에 취약"}, {"kind": "백화", "t": "수온 2도↑ → 조류 제거 → 색 바랜 막대 모양"}, {"kind": "피해", "t": "오염도 위협 / 30년간 카리브해 산호 80% 소실"}, {"kind": "경고", "t": "산호 = ‘조기 경보 체계’ → 산호 위기 = 대양 위기"}], "quiz": [["산호와 조류는 어떻게 서로 돕나?", "조류는 햇빛을 산호의 먹이로 바꿔 주고 산호초를 다채롭게 하며, 산호는 노폐물로 조류에게 영양분을 줘요."], ["산호가 ‘조기 경보 체계’라는 뜻은?", "산호가 잘못되면 나머지 대양도 위험할 수 있어, 산호의 상태가 해양 건강의 경고 신호가 된다는 거예요."], ["핵심 한 문장?", "산호와 조류의 정교한 동거는 수온·오염에 취약하며, 산호의 위기는 대양 전체의 경고가 된다."]], "vocab": [["coral reef", "산호초"], ["algae", "조류·해조"], ["convert A to B", "A를 B로 전환하다"], ["nourish", "영양분을 공급하다"], ["vulnerable", "취약한"], ["bleached", "색이 바랜·표백된"], ["early-warning system", "조기 경보 체계"]], "en": "Coral reefs invite algae roommates into their limestone homes to help them survive. And the algae are what make the reef bright and colorful. The algae convert sunlight to food for the corals, which in turn nourish the algae with their waste. But this delicate relationship is vulnerable to the slightest changes in global climate and ocean health. A jump of even two degrees in water temperature makes the coral rid itself of the algae, leaving the coral with a bleached stick-like look. Pollution is another threat; it can poison the sensitive corals. It is alarming: We've lost 80 percent of the living coral in the Caribbean in the last three decades. Reefs also act as an early-warning system: If something is wrong with the coral, the rest of the ocean could be in danger.", "ko": "산호초는 자신들이 생존하는 것을 돕도록 룸메이트인 조류를 자신들의 석회암 집으로 초대한다. 그리고 산호초를 밝고 다채롭게 만드는 것이 조류이다. 조류는 햇빛을 산호의 먹이로 전환하고, 산호는 교대로 자신들의 노폐물로 조류에게 영양분을 공급한다. 하지만 이러한 정교한 관계는 지구 기후와 해양 건강의 아주 작은 변화에도 취약하다. 심지어 해수 온도가 2도만 올라가도 산호는 자신에게서 조류를 제거하게 되고, 이는 산호를 색 바랜 막대 모양으로 남게 한다. 오염은 또 다른 위협인데, 그것은 예민한 산호에게 독이 될 수 있기 때문이다. 그것은 걱정스러운 일로, 우리는 지난 30년 동안 카리브해의 살아 있는 산호 중 80퍼센트를 잃었다. 산호초는 또한 조기 경보 체계의 역할을 해서, 만약 산호가 무언가 잘못되면, 나머지 대양이 위험해질 수 있다.", "read": [{"en": "Coral reefs invite algae roommates into their limestone homes to help them survive.", "ko": "산호초는 자신들이 생존하는 것을 돕도록 룸메이트인 조류를 자신들의 석회암 집으로 초대한다.", "chunks": [["Coral reefs invite", "산호초는 ~을 초대한다"], ["algae roommates", "룸메이트인 조류를"], ["into their limestone homes", "자신들의 석회암 집으로"], ["to help them survive.", "그들이 생존하도록 돕기 위해."]]}, {"en": "And the algae are what make the reef bright and colorful.", "ko": "그리고 산호초를 밝고 다채롭게 만드는 것이 조류이다.", "chunks": [["And the algae are", "그리고 조류가 ~이다"], ["what make the reef", "산호초를 ~하게 만드는 것"], ["bright and colorful.", "밝고 다채롭게."]]}, {"en": "The algae convert sunlight to food for the corals, which in turn nourish the algae with their waste.", "ko": "조류는 햇빛을 산호의 먹이로 전환하고, 산호는 교대로 자신들의 노폐물로 조류에게 영양분을 공급한다.", "chunks": [["The algae convert sunlight to food", "조류는 햇빛을 먹이로 전환한다"], ["for the corals,", "산호를 위한,"], ["which in turn nourish the algae", "그러면 산호는 교대로 조류에게 영양분을 공급한다"], ["with their waste.", "자신들의 노폐물로."]]}, {"en": "But this delicate relationship is vulnerable to the slightest changes in global climate and ocean health.", "ko": "하지만 이러한 정교한 관계는 지구 기후와 해양 건강의 아주 작은 변화에도 취약하다.", "chunks": [["But this delicate relationship", "하지만 이러한 정교한 관계는"], ["is vulnerable to the slightest changes", "아주 작은 변화에도 취약하다"], ["in global climate and ocean health.", "지구 기후와 해양 건강의."]]}, {"en": "A jump of even two degrees in water temperature makes the coral rid itself of the algae, leaving the coral with a bleached stick-like look.", "ko": "심지어 해수 온도가 2도만 올라가도 산호는 자신에게서 조류를 제거하게 되고, 이는 산호를 색 바랜 막대 모양으로 남게 한다.", "chunks": [["A jump of even two degrees", "심지어 2도의 상승도"], ["in water temperature", "해수 온도의"], ["makes the coral rid itself of the algae,", "산호가 스스로에게서 조류를 제거하게 만든다,"], ["leaving the coral", "그래서 산호는 ~한 채로 남게 된다"], ["with a bleached stick-like look.", "색 바랜 막대 모양 모습으로."]]}, {"en": "Pollution is another threat; it can poison the sensitive corals.", "ko": "오염은 또 다른 위협인데, 그것은 예민한 산호에게 독이 될 수 있기 때문이다.", "chunks": [["Pollution is another threat;", "오염은 또 다른 위협이다;"], ["it can poison", "그것은 ~에게 독이 될 수 있다"], ["the sensitive corals.", "예민한 산호에게."]]}, {"en": "It is alarming: We've lost 80 percent of the living coral in the Caribbean in the last three decades.", "ko": "그것은 걱정스러운 일로, 우리는 지난 30년 동안 카리브해의 살아 있는 산호 중 80퍼센트를 잃었다.", "chunks": [["It is alarming:", "걱정스러운 일이다:"], ["We've lost 80 percent", "우리는 80퍼센트를 잃었다"], ["of the living coral in the Caribbean", "카리브해의 살아 있는 산호 중"], ["in the last three decades.", "지난 30년 동안."]]}, {"en": "Reefs also act as an early-warning system: If something is wrong with the coral, the rest of the ocean could be in danger.", "ko": "산호초는 또한 조기 경보 체계의 역할을 해서, 만약 산호가 무언가 잘못되면, 나머지 대양이 위험해질 수 있다.", "chunks": [["Reefs also act as", "산호초는 또한 ~의 역할을 한다"], ["an early-warning system:", "조기 경보 체계의:"], ["If something is wrong with the coral,", "산호에 무언가 문제가 있다면,"], ["the rest of the ocean", "나머지 대양은"], ["could be in danger.", "위험에 처할 수 있다."]]}], "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 산호 l-opacity=\"0.7\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n      <circle cx=\"90\" cy=\"75\" r=\"3.5\" fill=\"#1FA34A\" fill-opacity=\"0.7\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n      <circle cx=\"65\" cy=\"105\" r=\"3\" fill=\"#1FA34A\" fill-opacity=\"0.7\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n      <circle cx=\"85\" cy=\"120\" r=\"3.5\" fill=\"#1FA34A\" fill-opacity=\"0.7\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n      <circle cx=\"100\" cy=\"95\" r=\"3\" fill=\"#1FA34A\" fill-opacity=\"0.7\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n      <circle cx=\"50\" cy=\"115\" r=\"3\" fill=\"#1FA34A\" fill-opacity=\"0.7\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n    </g>\n    <text x=\"150\" y=\"85\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1FA34A\" font-weight=\"700\">algae</text>\n    <text x=\"150\" y=\"98\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#5e5e5e\">조류 (roommates)</text>\n\n    <!-- 햇빛 → 조류 → 산호 양방향 -->\n    <!-- 햇빛 화살표 (위에서) -->\n    <g transform=\"translate(40, 35)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\" font-weight=\"700\">sunlight</text>\n      <line x1=\"5\" y1=\"3\" x2=\"20\" y2=\"35\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <polygon points=\"20,35 14,30 18,28\" fill=\"#1FA34A\"/>\n    </g>\n    \n    <!-- 양방향 라벨 -->\n    <g transform=\"translate(170, 130)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\" font-weight=\"700\">food</text>\n      <line x1=\"-5\" y1=\"3\" x2=\"-30\" y2=\"3\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <polygon points=\"-30,3 -22,-1 -22,7\" fill=\"#1FA34A\"/>\n      <text x=\"0\" y=\"18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\" font-weight=\"700\">waste</text>\n      <line x1=\"-5\" y1=\"21\" x2=\"-30\" y2=\"21\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <polygon points=\"-5,21 -13,17 -13,25\" fill=\"#1FA34A\"/>\n    </g>\n\n    <!-- 캡션 -->\n    <text x=\"115\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">bright &amp; colorful — delicate relationship</text>\n  </g>\n\n  <!-- 가운데 위협 (공생 → 백화로 향하는 인과 화살표) -->\n  <g transform=\"translate(255, 50)\">\n    <text x=\"45\" y=\"-3\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">위협</text>\n    \n    <!-- 좌측 박스에서 위협으로 향하는 화살표 -->\n    <line x1=\"-2\" y1=\"55\" x2=\"22\" y2=\"55\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <polygon points=\"22,55 14,51 14,59\" fill=\"#c8102e\"/>\n    \n    <!-- 온도계 -->\n    <g transform=\"translate(35, 50)\">\n      <rect x=\"-3\" y=\"-25\" width=\"6\" height=\"35\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <circle cx=\"0\" cy=\"12\" r=\"6\" fill=\"#c8102e\"/>\n      <rect x=\"-2\" y=\"0\" width=\"4\" height=\"12\" fill=\"#c8102e\"/>\n      <text x=\"15\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" fill=\"#c8102e\">+2°C</text>\n      <text x=\"15\" y=\"2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#c8102e\">warming</text>\n    </g>\n    \n    <!-- 오염 (방울) -->\n    <g transform=\"translate(70, 65)\">\n      <path d=\"M 0 -10 Q -7 -3 -7 3 Q -7 9 0 9 Q 7 9 7 3 Q 7 -3 0 -10 Z\" fill=\"#c8102e\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"20\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\">pollution</text>\n    </g>\n    \n    <!-- 위협 → 우측 박스로 향하는 화살표 -->\n    <line x1=\"105\" y1=\"55\" x2=\"130\" y2=\"55\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <polygon points=\"130,55 122,51 122,59\" fill=\"#c8102e\"/>\n  </g>\n\n  <!-- 우측: 백화·죽음 -->\n  <g transform=\"translate(370, 25)\">\n    <text x=\"105\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">백화 — stick-like</text>\n    <rect x=\"0\" y=\"0\" width=\"210\" height=\"195\" fill=\"#fdf2f4\" fill-opacity=\"0.2\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 백화된 산호 (회색·막대 모양) -->\n    <g transform=\"translate(80, 105)\">\n      <!-- 기둥들 (직선·표백) -->\n      <line x1=\"0\" y1=\"60\" x2=\"-22\" y2=\"-10\" stroke=\"#999\" stroke-width=\"2.5\"/>\n      <line x1=\"0\" y1=\"60\" x2=\"22\" y2=\"-10\" stroke=\"#999\" stroke-width=\"2.5\"/>\n      <line x1=\"0\" y1=\"60\" x2=\"-5\" y2=\"-10\" stroke=\"#999\" stroke-width=\"2.5\"/>\n      <line x1=\"0\" y1=\"60\" x2=\"10\" y2=\"-10\" stroke=\"#999\" stroke-width=\"2.5\"/>\n      <!-- 잔가지 -->\n      <line x1=\"-22\" y1=\"-10\" x2=\"-28\" y2=\"-5\" stroke=\"#999\" stroke-width=\"1.6\"/>\n      <line x1=\"22\" y1=\"-10\" x2=\"28\" y2=\"-5\" stroke=\"#999\" stroke-width=\"1.6\"/>\n      <!-- 베이스 -->\n      <ellipse cx=\"0\" cy=\"62\" rx=\"26\" ry=\"5\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.2\"/>\n    </g>\n    <!-- 폴립 없음 표시 -->\n    <text x=\"105\" y=\"80\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#999\" font-weight=\"700\">no algae</text>\n    <text x=\"105\" y=\"92\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#999\" font-weight=\"700\">no color</text>\n\n    <!-- 통계 박스: 80% lost -->\n    <g transform=\"translate(105, 175)\">\n      <rect x=\"-80\" y=\"-15\" width=\"160\" height=\"22\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">80% lost</text>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">Caribbean · last 3 decades</text>\n    </g>\n  </g>\n\n  <!-- 하단: early-warning system -->\n  <g transform=\"translate(0, 240)\">\n    <rect x=\"100\" y=\"0\" width=\"400\" height=\"34\" fill=\"#fdf2f4\" fill-opacity=\"0.7\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <text x=\"300\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">early-warning system for the ocean</text>\n    <text x=\"300\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">산호초 = 대양 전체의 조기 경보 체계</text>\n  </g>\n</svg>", "caption": "왼쪽 산호와 조류가 햇빛과 노폐물을 주고받는 건강한 공생 모습, 가운데 2도 상승과 오염의 위협, 오른쪽 백화된 막대 모양 산호와 80퍼센트 손실 통계, 하단 조기 경보 체계 라벨"}, {"no": "7", "title": "Happiness Starts With You", "ktitle": "행복은 ‘마음먹기’에서 시작된다", "field": "심리·행복", "page": "p41 no.3", "oneline": "많은 이가 행복을 복잡하고 도달 불가한 목표로 여긴다.", "tldr": ["많은 이가 행복을 복잡하고 도달 불가한 목표로 여긴다.", "그러나 링컨 말처럼, 사람은 ‘마음먹은 만큼’ 행복하다.", "행복은 부일 수도, 손잡기·노을 보기 같은 소소함일 수도 — 모두 ‘나’에서 시작된다."], "analogy": "행복을 거창하고 멀리 있는 것으로 여기기 쉽지만, 사실은 강아지와 놀기·친구와 웃기 같은 소소함이에요. 그리고 그 출발점은 남이 아니라 ‘나의 마음’이죠.", "bg": "분야는 심리·행복이에요. ‘사람은 마음먹은 만큼 행복하다’는 링컨의 말이 단서. 행복을 도달 불가한 목표로 여기는 통념이 배경. → 행복이 어디서 시작되는지에 주목하며 읽으세요.", "flow": [{"kind": "통념", "t": "행복 = 복잡·규정 어렵고 도달 불가한 목표?"}, {"kind": "반박", "t": "링컨: 사람은 ‘마음먹은 만큼’ 행복하다"}, {"kind": "본질", "t": "남의 생각·행동 무관 / 내 마음의 평화가 중요"}, {"kind": "다양", "t": "부일 수도, 손잡기·노을·강아지·웃음일 수도"}, {"kind": "결론", "t": "그 모든 것은 ‘나 자신’에서 시작된다"}], "quiz": [["행복에 대한 통념을 글은 어떻게 반박하나?", "행복이 도달 불가한 목표가 아니라, 링컨 말처럼 ‘마음먹은 만큼’ 행복하다고 해요."], ["글이 드는 행복의 예는?", "사랑하는 사람과 손잡기, 해변에서 노을 보기, 강아지와 놀기, 친구와 크게 웃기 같은 소소한 것들이에요."], ["핵심 한 문장?", "행복은 거창한 목표가 아니라 마음먹기와 소소한 순간에서, ‘나 자신’으로부터 시작된다."]], "vocab": [["elusive", "규정하기 힘든·붙잡기 어려운"], ["unreachable", "도달할 수 없는"], ["make up one's mind", "마음먹다·결심하다"], ["in harmony", "조화롭게"], ["peace of mind", "마음의 평화"], ["hold hands", "손을 잡다"], ["aloud", "크게·소리 내어"]], "en": "In our world today, most people consider happiness a complex, elusive, and unreachable goal. But as Abraham Lincoln said, people are about as happy as they make up their minds to be. It doesn't matter what anyone else thinks or does. What is important is that inside you your heart beats in harmony, your soul is bright, and you can feel the peace of mind that truly being happy brings. Happiness is many things. For some it may be wealth and money; but for others it is much more, or rather less. It can be holding hands with the one you love, watching the sun going down at the beach, playing with a puppy, or laughing aloud with good friends. But it all starts from you alone.", "ko": "오늘날의 세상에서, 대부분의 사람들은 행복을 복잡하고 규정하기 힘들며 도달할 수 없는 목표로 여긴다. 그러나 Abraham Lincoln이 말했다시피, 사람들은 자신들이 마음먹은 만큼만 행복하다. 다른 누군가가 무엇을 생각하고 무엇을 하는가는 중요하지 않다. 중요한 것은 바로 여러분 안에서 심장이 조화롭게 뛰고, 여러분의 정신이 생기 있으며, 여러분이 진정한 행복이 가져다 주는 마음의 평화를 느낄 수 있다는 것이다. 많은 행복이 있다. 어떤 사람들에게는 그것이 부와 돈일지도 모르지만, 다른 사람들에게 그것은 그 이상이거나 그 이하이다. 그것은 여러분이 사랑하는 사람과 손을 잡거나, 해변에서 해가 지는 것을 바라보거나, 강아지와 놀거나, 또는 좋은 친구들과 크게 웃는 것일 수 있다. 그러나 그것은 모두 여러분 자신에서부터 시작한다.", "read": [{"en": "In our world today, most people consider happiness a complex, elusive, and unreachable goal.", "ko": "오늘날의 세상에서, 대부분의 사람들은 행복을 복잡하고 규정하기 힘들며 도달할 수 없는 목표로 여긴다.", "chunks": [["In our world today,", "오늘날의 세상에서,"], ["most people consider happiness", "대부분의 사람들은 행복을 ~로 여긴다"], ["a complex, elusive, and unreachable goal.", "복잡하고, 규정하기 힘들며, 도달할 수 없는 목표로."]]}, {"en": "But as Abraham Lincoln said, people are about as happy as they make up their minds to be.", "ko": "그러나 Abraham Lincoln이 말했다시피, 사람들은 자신들이 마음먹은 만큼만 행복하다.", "chunks": [["But as Abraham Lincoln said,", "그러나 Abraham Lincoln이 말했듯이,"], ["people are about as happy", "사람들은 거의 ~만큼 행복하다"], ["as they make up their minds to be.", "그들이 그렇게 되기로 결심한 만큼."]]}, {"en": "It doesn't matter what anyone else thinks or does.", "ko": "다른 누군가가 무엇을 생각하고 무엇을 하는가는 중요하지 않다.", "chunks": [["It doesn't matter", "~은 중요하지 않다"], ["what anyone else thinks", "다른 누군가가 무엇을 생각하는가는"], ["or does.", "또는 무엇을 하는가는."]]}, {"en": "What is important is that inside you your heart beats in harmony, your soul is bright, and you can feel the peace of mind that truly being happy brings.", "ko": "중요한 것은 바로 여러분 안에서 심장이 조화롭게 뛰고, 여러분의 정신이 생기 있으며, 여러분이 진정한 행복이 가져다 주는 마음의 평화를 느낄 수 있다는 것이다.", "chunks": [["What is important is that", "중요한 것은 ~이다"], ["inside you", "여러분 안에서"], ["your heart beats in harmony,", "여러분의 심장이 조화롭게 뛰고,"], ["your soul is bright,", "여러분의 정신이 생기 있으며,"], ["and you can feel the peace of mind", "여러분이 마음의 평화를 느낄 수 있다"], ["that truly being happy brings.", "진정한 행복이 가져다 주는."]]}, {"en": "Happiness is many things.", "ko": "많은 행복이 있다.", "chunks": [["Happiness is many things.", "행복은 여러 가지이다."]]}, {"en": "For some it may be wealth and money; but for others it is much more, or rather less.", "ko": "어떤 사람들에게는 그것이 부와 돈일지도 모르지만, 다른 사람들에게 그것은 그 이상이거나 그 이하이다.", "chunks": [["For some", "어떤 사람들에게"], ["it may be wealth and money;", "그것은 부와 돈일지도 모른다;"], ["but for others", "하지만 다른 사람들에게"], ["it is much more, or rather less.", "그것은 그 이상이거나, 차라리 그 이하이다."]]}, {"en": "It can be holding hands with the one you love, watching the sun going down at the beach, playing with a puppy, or laughing aloud with good friends.", "ko": "그것은 여러분이 사랑하는 사람과 손을 잡거나, 해변에서 해가 지는 것을 바라보거나, 강아지와 놀거나, 또는 좋은 친구들과 크게 웃는 것일 수 있다.", "chunks": [["It can be", "그것은 ~일 수 있다"], ["holding hands with the one you love,", "여러분이 사랑하는 사람과 손을 잡거나,"], ["watching the sun going down at the beach,", "해변에서 해가 지는 것을 바라보거나,"], ["playing with a puppy,", "강아지와 노는 것이거나,"], ["or laughing aloud with good friends.", "혹은 좋은 친구들과 크게 웃는 것."]]}, {"en": "But it all starts from you alone.", "ko": "그러나 그것은 모두 여러분 자신에서부터 시작한다.", "chunks": [["But it all starts", "그러나 그것은 모두 시작된다"], ["from you alone.", "오직 여러분 자신에게서."]]}], "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단 복잡한 미로 형태의 통념, Lincoln 인용으로 분기 후 하단 자기 중심에서 손잡기 노을 강아지 웃음 네 가지 일상 순간으로 뻗는 방사형 구조\">\n  <!-- 상단: 통념 -->\n  <g transform=\"translate(30, 20)\">\n    <text x=\"135\" y=\"-3\" font-family=\"Noto Serif KR

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 고1 2026학년도 6월 학력평가 22지문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   고1 2026학년도 6월 학력평가 22지문 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body>
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">2026학년도 고1 6월 학력평가</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 고1 2026학년도 6월 학력평가 22개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {
 "data": [
  {
   "no": "no.18",

   "quiz": [
    [
     "운전·요리 배우기가 글에서 하는 역할은?",

   "en": "Remember how you learned to drive or cook? You practiced while someone coached you, reminding you what to do until you were able to coach yourself and then, eventually, do it automatically. Children learn values much the same way. They practice different kinds of behavior, while, you, as coach, help focus their attention on what is important and on fine-tuning important skills. You support them with your praise, encouragement and gentle reminders. If you don’t coach your child, she will find her coaches elsewhere and be guided by the values of the media, her peers and anyone else who captures her interest. So, step up to the plate, don’t be afraid and help your child learn how to be a good person, step by step.",
   "ko": "운전이나 요리를 어떻게 배웠는지 기억하는가? 당신이 자신을 지도할 수 있고 그러고 나서, 결국에는, 그것(운전이나 요리)을 자동으로 할 수 있을 때까지 누군가 당신에게 무엇을 해야 할지 상기시켜 주면서 지도하는 동안 당신은 연습했다. 아이들도 가치를 거의 같은 방식으로 배운다. 당신이, 지도자로서, 중요한 것에 그리고 중요한 기술을 세밀하게 다듬는 것에 아이들이 주의를 집중하도록 도와주는 동안, 아이들은 다양한 종류의 행동을 연습한다. 당신은 칭찬, 격려 그리고 상냥한 조언으로 그들을 지지한다. 만약 당신이 당신의 자녀를 지도하지 않는다면, 그녀(자녀)는 다른 곳에서 자신의 지도자를 찾고 미디어, 또래 친구들 그리고 자신의 관심을 끄는 다른 누군가의 가치에 지도받게 될 것이다. 그러므로, 판에 올라서서(행동에 나서서), 두려워하지 말고 자녀가 좋은 사람이 되는 법을 배우도록 차근차근 도와 주어라.",

   "en": "A classical ideal of truth and knowledge is the concept of a market for ideas: as thinking individuals, we encounter competing ideas, we evaluate them for their best fit to reality, and then let the best and brightest facts form the basis of our beliefs. That would be the scientist’s way, in theory at least. But in practice, most of the time we are in a market for justifications. We shop for words not because they contain ideas, but because they contain stories about ideas. Often we are not seeking statements as facts to help us figure out what we should believe. Usually we already know what we believe. What we seek are statements to justify those beliefs ― the lawyer’s way. Language might be good for this function but we can use it to do better. By treating language with greater respect, we can achieve more than simple self-defense.",
   "ko": "진리와 지식에 대한 고전적 이상은 아이디어를 위한 시장이라는 개념이다. 생각하는 개인으로서, 우리는 경쟁하는 아이디어들을 마주하고, 현실에 가장 잘 맞는지에 대해 그것들을 평가하며, 그러고 나서 가장 알맞고 뛰어난 사실들이 우리 신념의 기초를 형성하게 한다. 그것은, 적어도 이론상으로는, 과학자의 방식일 것이다. 그러나 실제로는, 대부분의 경우 우리는 ‘정당화를 위한 시장’에 있다. 우리는 그것들이 아이디어들을 포함하고 있어서가 아니라, 그것들이 아이디어들에 관한 이야기들을 담고 있기 때문에 단어들을 쇼핑한다. 종종 우리는 우리가 무엇을 믿어야 할지 알아내는 데 도움을 줄 사실로서의 진술들을 찾고 있는 것이 아니다. 대개 우리는 우리가 무엇을 믿는지 이미 알고 있다. 우리가 찾는 것은 그러한 신념들을 정당화할 진술들이며, (이것은) 변호사의 방식이다. 언어는 이러한 기능에 좋을지 모르지만 우리는 더 잘하기 위해 그것(언어)을 사용할 수 있다. 더 큰 존중으로 언어를 대함으로써, 우리는 단순한 자기방어 이상을 성취할 수 있다.",

   "en": "Suppose you have been working on the solution to a challenging technological problem for many years. Let’s also suppose that you have been paying attention to whatever else you have encountered that might be related to the problem. In that case, chances are that creative solutions to the problem could suddenly pop up in your mind when you are relaxed. Such “eureka moments” (when great insights lead to discovery or invention) often take place at unexpected times. To enhance spontaneous creativity, therefore, one must pay attention to the things that could potentially lead to valuable outcomes. This does not mean that you must narrow down your interest to one specific topic. On the contrary, breadth of experience is the key to creativity. If your experience is limited to a narrow range of topics, then the scope of your imagination will likewise be narrow, which would be harmful to creativity.",

   "en": "Shame is about who we are, and guilt is about our behaviors. We feel guilty when we hold up something we’ve done or failed to do against the kind of person we want to be. It’s an uncomfortable feeling, but one that’s helpful. When we apologize for something we’ve done, make amends to others, or change a behavior that we don’t feel good about, guilt is most often the motivator. Guilt is just as powerful as shame, but its effect is often positive while shame often is destructive. When we see people apologize, make amends, or replace negative behaviors with more positive ones, guilt is often the motivator, not shame. In fact, in my research, I found that shame corrodes the part of us that believes we can change and do better.",

   "en": "Let’s look at what is occurring in your brain when scrolling on social media, a quick dopamine activity. You open your social media apps and immediately you notice you feel really good, your dopamine levels increase incredibly fast and pleasure is experienced in your brain. The challenge this creates is as with everything in our universe: as the laws of physics explain, ‘what goes up, must come down’. Your brain and body are always seeking something called ‘homeostasis’, which simply means balance. With this in mind, when dopamine levels increase incredibly fast when scrolling social media, the brain then thinks, ‘Wow, how are my dopamine levels so high?’ In order to achieve homeostasis, or balance, the dopamine then has to quickly drop an equal amount below your baseline level in order to rebalance, making you feel even worse than before you started scrolling.",
   "ko": "소셜 미디어상에서 스크롤할 때 당신의 뇌에서 일어나고 있는 일, 즉 빠른 도파민 활동을 살펴보자. 당신은 소셜 미디어 앱을 열고 당신이 정말 기분이 좋다는 것을 즉시 알아차리게 되며, 당신의 도파민 수치는 믿을 수 없이 빠르게 증가하여 쾌락이 뇌에서 경험된다. 이것(도파민 급증)이 만들어 내는 난제는 우리 우주의 모든 것들과 마찬가지이다. 즉, 물리학 법칙이 설명하듯이, ‘올라가는 것은, 반드시 내려와야 한다.’ 당신의 뇌와 몸은 ‘항상성’이라고 불리는 어떤 것을 항상 추구하고 있는데, 그것은 단순히 균형을 의미한다. 이것을 염두에 두고, 소셜 미디어를 스크롤할 때 도파민 수치가 믿을 수 없이 빠르게 증가하면, 뇌는 그때 ‘와, 내 도파민 수치가 어떻게 이렇게 높지?’라고 생각한다. 항상성, 즉 균형을 이루기 위해서, 그때 도파민은 다시 균형을 맞추기 위해 당신의 기준선 수치 아래로 동일한 양만큼 빠르게 떨어져야 하고, 스크롤을 시작하기 전보다 당신을 훨씬 더 기분이 나쁘게 만든다.",

   "en": "George Bird Grinnell, one of the leading figures in early American conservation, was born in New York in 1849. Growing up near Audubon Park, he developed an early interest in birds. After graduating from Yale University, he joined his first scientific expedition, which led to his career in American conservation. From the late 1870s, he wrote many articles in Forest and Stream calling for wildlife conservation. Grinnell contributed to founding early conservation organizations, including the Audubon Society, and helped with the establishment of Glacier National Park in 1910. Through his writings and public campaigns, he had an influence on making early wildlife protection laws. Even after his death in 1938, his work in conservation continues to inspire conservationists.",

   "en": "Literature, in its essence, is a testament to the enduring power of human creativity and expression. It transcends time and space, connecting us with the thoughts and emotions of people from all walks of life, across centuries and cultures. Despite the rise of new technologies and the ever-changing landscape of media, literature has retained its relevance and significance as a timeless art form. One reason for literature’s enduring power is its ability to capture and convey the complexities of the human experience. Through the written word, authors have the unique ability to explore the depths of human emotion, the nuances of relationships, and the challenges and triumphs of the human spirit. Literature allows us to see ourselves reflected in the pages of a book, to empathize with characters different from ourselves, and to gain a deeper understanding of the human condition.",
   "ko": "문학은, 본질적으로, 인간의 창의성 및 표현의 지속적인 힘에 대한 증거이다. 그것은 시간과 공간을 초월하여, 수 세기 여러 문화에 걸쳐, 우리를 각계각층 사람들의 생각 및 감정과 연결해 준다. 새로운 기술의 부상과 끊임없이 변화하는 미디어 환경에도 불구하고, 문학은 시대를 초월한 예술 형식으로서 그 적절성과 중요성을 유지해 왔다. 문학의 지속적인 힘에 대한 한 가지 이유는 인간 경험의 복잡성을 포착하고 전달하는 그것(문학)의 능력이다. 글을 통해, 작가들은 인간 감정의 깊이, 관계의 미묘한 차이, 그리고 인간 정신의 도전과 승리를 탐구하는 독특한 능력을 갖춘다. 문학은 우리가 책의 페이지 속에 우리 자신이 투영되는 것을 보고, 우리 자신과는 다른 인물들에게 공감하며, 그리고 인간의 조건에 대한 더 깊은 이해를 얻도록 한다.",

   "caption": "어수선한 풍경 전체 위에 구멍 뚫린 카드를 대니 작은 영역 하나만 또렷해지고 나머지는 가려지는 그림.",

   "bg": "분야는 교육, 미술 관찰 지도예요. ‘viewfinder(뷰파인더)’는 카메라에서 장면을 들여다보는 창 — 여기선 종이로 만든 관찰 도구를 가리켜요. → 뷰파인더가 아이들을 ‘어떻게’ 돕는지 기능을 세어 가며 읽고, 후반에 화제가 ‘만들 때 유의점’으로 바뀌는 지점을 잡으세요.",

   "quiz": [
    [
     "뷰파인더가 아이들에게 주는 도움 두 가지는?",

   "en": "A viewfinder is a piece of card with a hole cut through it in the middle, which can be used to isolate a part of a picture or object. It allows us to concentrate on one small part or area without being distracted by the whole of what can be seen. It is a useful tool that can help children focus or organise their observation and drawing. It can support hesitant children by giving a boundary to what they are looking at and it can help children who find it hard to keep track of where and what they are looking at, by bringing them back to the same area each time they look and look back. When you are making viewfinders for use with the children you are supporting, take into consideration the size of the card. You need enough card around the hole to block out the rest of the visual information from the child’s field of vision, but it should not be too big and unwieldy.",
   "ko": "뷰파인더는 가운데에 구멍이 뚫린 한 장의 카드로, 그림이나 물체의 일부를 분리하는 데 사용될 수 있다. 그것은 우리가 보이는 것의 전체에 의해 주의가 산만해지지 않고 하나의 작은 부분이나 영역에 집중할 수 있게 해 준다. 그것은 아이들이 집중하거나 관찰하기와 그리기를 조직하는 것을 도울 수 있는 유용한 도구이다. 그것은 주저하는 아이들에게 그들이 보고 있는 것에 대한 경계를 제공함으로써 도움을 줄 수 있고, 자신이 어디를 그리고 무엇을 보고 있는지 따라가기 어려워하는 아이들을, 그들이 보고 다시 볼 때마다 같은 영역으로 되돌아가게 함으로써, 도움을 줄 수 있다. 당신이 돕는 아이들과 함께 사용할 뷰파인더를 만들 때, 카드의 크기를 고려하라. 구멍 주변에 나머지 시각 정보를 아이의 시야로부터 차단하기에 충분한 카드가 필요하지만, 그것이 너무 크고 다루기 힘들어서는 안 된다.",

   "en": "Our world is not just interconnected, but ever-changing, even if we can’t sense it. While you’re reading this, you’re changing. You’re aging (a minute amount, thankfully), but the neural networks in your brain are also imperceptibly changing as you perceive each word. Crucially, even when we’re seemingly not doing anything of note, events are taking place outside your immediate surroundings that will change your life in the future, though you won’t realize it yet. Heraclitus, the ancient Greek philosopher, rightly pointed out, “No man ever steps in the same river twice. For it’s not the same river and he’s not the same man.” To that, Cratylus, a student of Heraclitus, added that we are not mere passive observers. When you step in a river, you change it. Nothing is static. Even microscopic changes add up over time.",
   "ko": "우리의 세계는 단지 서로 연결되어 있을 뿐만 아니라, 우리가 감지할 수 없다고 할지라도, 끊임없이 변화하고 있다. 당신이 이것을 읽는 동안에도, 당신은 변하고 있다. (다행히도, 아주 미세한 양으로) 당신은 나이 들고 있지만, 당신이 각각의 단어를 인식하는 동안 뇌의 신경망 또한 감지할 수 없게 변화하고 있다. 결정적으로, 우리가 겉보기에 주목할 만한 어떤 것도 하지 않는 것처럼 보일 때조차도, 당신의 직접적인 주변 환경 밖에서는 미래에 당신의 삶을 변화시킬 사건들이 일어나고 있지만, 당신은 아직 그것을 깨닫지 못할 것이다. 고대 그리스 철학자 Heraclitus는 “어떤 사람도 같은 강물에 두 번 발을 담글 수 없다. 왜냐하면 그것은 같은 강물이 아니며 그는 같은 사람이 아니기 때문이다.”라고 정확히 지적했다. 이에 대해, Heraclitus의 제자인 Cratylus는 우리는 단순한 수동적인 관찰자가 아니라고 덧붙였다. 당신이 강물에 발을 담그면, ‘당신’이 그것을 변화시킨다. 정적인 것은 아무것도 없다. 극히 작은 변화들조차 시간이 지나면서 쌓인다.",

   "en": "Do you always study in the same spot? Don’t. If you study in different places, that helps create variety, and that rich experience can reinforce what you are learning. When several college students told us they did school work in different places rather than in some favorite nook, that habit reflected the research on learning. Numerous experiments have found that if learners simply study in at least two different places, they are more likely to recall the material. In one of the first such trials, two different groups studied a list of words. Some students returned to the same room twice while their counterparts spent the same amount of time divided between two locations. When asked to recall as many words on the list as possible, those who had moved around did far better. Variety creates rich association, even when those connections form in the background, totally outside of what we are consciously thinking.",
   "ko": "항상 같은 장소에서 공부하는가? 그러지 마라. 여러 장소에서 공부하면, 그것은 다양성을 만들도록 돕고, 그러한 풍부한 경험은 당신이 학습하고 있는 것을 강화할 수 있다. 몇몇 대학생들이 좋아하는 어떤 구석진 곳에서보다는 여러 장소에서 학교 과제를 한다고 우리에게 말했을 때, 그 습관은 학습에 관한 연구를 반영했다. 수많은 실험은 학습자가 최소 두 곳 이상의 다른 장소에서 단지 공부하기만 해도, 학습 자료를 기억할 가능성이 더 높다는 것을 발견했다. 그러한 초기 실험들 중 하나에서 두 개의 다른 집단이 하나의 단어 목록을 공부하였다. 일부 학생들은 같은 방으로 두 번 돌아왔지만, 상대 집단은 두 장소에서 동일하게 나뉜 시간을 보냈다. 목록에 있는 가능한 한 많은 단어를 기억해 보라고 요청받았을 때, 장소를 옮겨 다닌 학생들이 훨씬 더 잘했다. 다양성은 풍부한 연상을 만들어 내는데, 이러한 연결들이 배경에서, 즉 우리가 의식적으로 생각하고 있는 것의 완전히 바깥에서, 형성될 때조차도 (그러하다).",

   "en": "Talking about what something smells like is the most basic way of talking about our olfactory experience, and even this most basic way of talking about smells is challenging. There are no words in the English language to describe smells in the same way in which “blue” or “green” describe colors. Instead, to talk about how something smells, we talk about the source of the odor. Things smell “flowery,” “fruity,” or “fishy.” Furthermore, even the most familiar odors are difficult to identify when they are not experienced in their usual context. In one experiment the majority of participants was unable to name very common odors like beer, urine, roses, or motor oil. Obviously, even those who couldn’t name any of these odors would drink the beer but not the urine or the motor oil. This is how evolution has shaped our brain: We respond to odors correctly in many different ways, but we are not well-equipped to talk about them.",
   "ko": "어떤 것이 무슨 냄새가 나는지에 관해 이야기하는 것은 우리의 후각 경험에 관해 이야기하는 가장 기본적인 방식인데, 냄새에 관해 이야기하는 이 가장 기본적인 방식조차도 어렵다. 영어에는 ‘파랑’이나 ‘초록’이 색을 묘사하는 것과 같은 방식으로 냄새를 묘사하는 단어가 없다. 대신, 어떤 것의 냄새가 어떤지에 관해 이야기하기 위해서, 우리는 그 냄새의 근원에 관해 이야기한다. 사물들은 ‘꽃 같은’, ‘과일 같은’, 또는 ‘생선 같은’ 냄새가 난다. 게다가, 가장 익숙한 냄새조차도 일상의 맥락에서 경험되지 않을 때는 식별하기 어렵다. 한 실험에서 참가자 대다수는 맥주, 소변, 장미, 또는 모터 오일 같은 매우 흔한 냄새의 이름을 댈 수 없었다. 분명하게, 이 냄새들 중 어떤 것도 이름을 대지 못한 사람들조차도 맥주는 마셔도 소변이나 모터 오일은 마시지 않을 것이다. 이것이 진화가 우리 뇌를 형성해 온 방식이다. 우리는 여러 다른 방식으로 냄새에 정확하게 반응하지만, 그에 대해 이야기할 채비가 잘 되어 있지 않다.",

   "en": "A particularly powerful way in which human beings adapt and adjust to their circumstances is by changing behaviors in light of the consequences that they yield. For instance, a child who gets praised by her teacher for doing an exercise correctly is likely to continue doing the exercise in that way. A dancer who feels that a particular conditioning exercise is not giving any results is likely to give that exercise up in favor of another one that seems more promising. In general, we tend to do things that bring us some kind of benefit or act in ways that help us avoid some kind of problem, discomfort, or disadvantage. We also tend to do fewer things (or stop doing things) that lead to problems, discomfort, or disadvantages, and we tend to avoid acting in ways that do not bring any benefit or reward.",

   "en": "It is evident through various case studies that adopting digital minimalism can lead to improved mental health outcomes. For instance, a study conducted by researchers at Stanford University found that participants who limited their use of social media and digital devices reported lower levels of stress, anxiety, and depression. By reducing the constant stream of information and notifications, individuals were able to focus more on meaningful interactions and activities that promoted well-being. Additionally, participants reported relying on social media to get information for their purchasing decisions. In another case, a corporate professional struggling with burnout and insomnia implemented digital minimalism techniques, such as setting boundaries for phone usage and practicing mindfulness. As a result, he experienced improved sleep quality, reduced stress levels, and a newfound sense of calm and clarity.",

   "en": "During the Ice Age, not only was the planet much colder, with ice sheets covering much of what we call the northern hemisphere today, but, crucially, it was much drier. In Ireland, we often associate the cold with the wet but if it is really cold, there is far less evaporation, fewer clouds, and less rain. Our world in the Ice Age was cold and dry, meaning it was difficult for plants to grow. In this type of climate, farming isn’t an option: it’s too risky to depend on any one piece of land to produce the energy you need. As the temperature rose and the ice caps melted, we experienced a sudden explosion of life. The world got warmer and wetter, and people started to live around places where they could make food grow most intensively. This didn’t happen overnight; it probably took thousands of years, with hunter-gatherers foraging and hunting, while doing a little side hustle in farming.",
   "ko": "빙하기 동안, 지구는, 오늘날 우리가 북반구라고 부르는 지역의 대부분을 얼음층이 뒤덮은 채로, 훨씬 더 추웠을 뿐만 아니라, 결정적으로, 훨씬 더 건조했다. 아일랜드에서, 우리는 종종 추위를 습함과 연관 짓지만, 정말 춥다면, 증발 작용이 훨씬 더 적고, 구름도 더 적으며, 비도 더 적다. 빙하기의 우리 지구는 춥고 건조했는데, 이는 식물이 자라기 어렵다는 것을 의미했다. 이런 유형의 기후에서, 농사는 선택지가 아니다. 즉, 당신이 필요한 에너지를 생산하려고 어느 한 조각의 땅에 의존하는 것은 너무 위험하다. 온도가 상승하고 만년설이 녹으면서, 우리는 갑작스러운 생명의 폭발을 경험했다. 지구는 더 따뜻하고 습해졌고, 그리고 사람들은 식량이 가장 집약적으로 자라게 할 수 있는 장소 주변에 살기 시작했다. 이것은 하룻밤 사이에 일어나지 않았고, 수렵채집인들이, 농사로 부업을 조금씩 하는 동안, 채집과 사냥을 하면서, 그것은 아마도 수천 년이 걸렸을 것이다.",

   "en": "The big difference between working and long-term memory is that we are explicitly aware of the information in working memory, but we are not able to directly access the information in our long-term memory. We access long-term memory by bringing the information into working memory. For example, right now you are not aware of all the actors you have ever seen. They are stored in your long-term memory outside your consciousness. However, if I asked you to list all the actors, you would use your working memory to retrieve them one by one and reel them off. Your working memory can access your long-term memory and bring those memories to awareness. But remember it has a limit of seven items or chunks. Each actor would be an item. Try and hold all the actors you know in your explicit awareness. You might try to visualize a large group of them. But you still would only be aware of a few actors at any one time.",

   "caption": "말풍선 옆에서 움직이는 두 손이 기억 조각들을 붙잡아 머릿속 선반에 단단히 고정하는 그림.",

   "en": "If you gesture while describing an event, do you think you’ll be able to recall that event better than if you don’t gesture? We had adults watch videos of toy objects, animals, and people performing various, sometimes odd, actions: a chicken sliding to a policeman, a jogger bending down to touch his toes, a fence swinging shut on its own. We then tested the adults’ memories of these events immediately after the descriptions and three weeks later. Adults who were told to gesture while describing the events remembered more than adults who were told not to gesture, particularly several weeks later. To see if we’d get the same effects if people gestured on their own, we did the study again, but this time we gave the adults no instructions about gesture. We found the same patterns: people remembered items on which they had gestured spontaneously better than items on which they had not gestured. Producing gesture along with speech makes the information encoded in that speech memorable.",
   "ko": "만약 당신이 어떤 사건을 묘사하면서 제스처를 한다면, 제스처를 하지 않는 경우보다 그 사건을 더 잘 기억해낼 수 있을 거라고 생각하는가? 우리는 성인들에게 다양한, 때로는 기이한, 행동을 하는 장난감 물체, 동물, 그리고 사람들의 영상을 시청하게 했는데, (예를 들면) 경찰관에게로 미끄러지는 닭, 몸을 굽혀 발끝을 만지는 조깅하는 사람, 저절로 흔들리며 닫히는 울타리였다. 그 다음에 우리는 이 사건들에 대한 그 성인들의 기억을 묘사 직후와 3주 후에 테스트했다. 사건을 묘사하면서 제스처를 하라고 들은 성인들은 제스처를 하지 말라고 들은 성인들보다 더 많은 것을 기억했으며, 특히 몇 주 후에 더 그러했다. 사람들이 스스로 제스처를 하는 경우에도 동일한 결과를 얻을 수 있는지 확인하기 위해, 우리는 연구를 다시 수행했지만, 이번에는 성인들에게 제스처에 관해 아무런 지시도 하지 않았다. 우리는 동일한 양상을 발견했다. 즉, 사람들은 자발적으로 제스처를 했던 항목들을 제스처를 하지 않았던 항목들보다 더 잘 기억했다. 말과 함께 제스처를 하는 것은 그 말 속에 부호화된 정보를 기억할 만하게 만든다.",

   "en": "We go out in the world every day and make decisions about what is safe or not and what is appropriate or not. It is what psychologist Joseph LeDoux has suggested is an unconscious “danger detector” that determines whether or not something or someone is safe before we can even begin to consciously make a determination. When the object, animal, or person is assessed to be dangerous, a fear response, which has been called “fight or flight,” occurs. On a conscious level we may correct a mistake in this “danger detector” when we notice it, but often, of course, we simply begin to generate reasons for why it was accurate in the first place. We are generally convinced that our decisions are “rational,” but in reality, most human decisions are made emotionally, and then we collect or generate the facts to justify these decisions. When we see something or someone who “feels” dangerous, we have already launched into action internally before we have even started “thinking.”",
   "ko": "우리는 매일 세상으로 나가 무엇이 안전한지 아닌지 그리고 무엇이 적절한지 아닌지에 대한 결정을 내린다. 우리가 의식적으로 판단하기를 시작하기도 전에 어떤 것이나 사람이 안전한지 아닌지를 판단하는 것은 바로 심리학자 Joseph LeDoux가 제안한 무의식적인 ‘위험 감지기’라는 것이다. 사물, 동물, 또는 사람이 위험하다고 평가될 때, 공포 반응이 발생하는데, 그것은 ‘싸움 또는 도피’라고 불려 왔다. 의식적 수준에서는 우리가 이 ‘위험 감지기’의 오류를 발견했을 때 그것을 수정할 수 있을지 모르지만, 종종, 당연히, 우리는 그것이 애초에 왜 정확했는지에 대한 이유를 그저 만들어내기 시작한다. 우리는 일반적으로 자신의 결정이 ‘이성적’이라고 확신하지만, 실제로는, 대부분의 인간 결정은 감정적으로 이루어지고, 그 후에 이러한 결정을 정당화할 사실을 모으거나 만들어낸다. 위험하다고 ‘느껴지는’ 어떤 것이나 사람을 볼 때, 우리는 심지어 ‘생각’을 시작하기도 전에 이미 내면적으로 행동을 시작해 버린다.",

   "en": "Commercial businesses aim for predictability and certainty, especially when it comes to product quality. But predictability and certainty are not always valued in the sporting world, especially when it comes to the delivery of professional sport competitions. From a spectator’s perspective the sport experience is better experienced when unpredictable. Sport events actually depend on that unpredictability in order to attract people to the game. When the results of games cannot be predicted, attendances at sporting contests are likely to be higher, as are the profits of leagues. However, the absence of predictability also leads to significant variability in the quality of sporting performances. Many factors can contribute to the variability of the sport product, including the weather, player injuries, the venue, the quality of the opponents, the closeness of the scores and even the size of the crowd. A cricket match can be exhilarating, boring or even frustrating, but fans still have to pay the same price. Sport marketers may attempt to overcome this by ‘improving’ the product in systematic ways, such as including a star player, offering premium seating or providing other forms of entertainment and inviting facilities. The uncertain nature of sport contests is just one element of a total experience, although it is an important element for financial success.",
   "ko": "상업적 기업은, 특히 제품 품질에 있어, 예측 가능성과 확실성을 추구한다. 그러나 예측 가능성과 확실성이 스포츠계, 특히 프로 스포츠 경기 운영에서는 항상 가치 있게 여겨지지는 않는다. 관중의 관점에서 스포츠 경험은 예측 불가능할 때 더 잘 경험된다. 실제로 스포츠 경기는 사람들을 경기로 끌어들이기 위해 그 예측 불가능성에 의존한다. 경기 결과가 예측될 수 없을 때, 스포츠 경기의 관중은 더 늘어날 가능성이 있으며, 리그의 수익도 그렇다. 그러나, 예측 가능성의 결여는 또한 스포츠 수행(실적)의 질에 있어 상당한 변동성으로 이어진다. 날씨, 선수 부상, 경기장, 상대 팀의 실력, 점수의 근접성과 심지어 관중의 규모를 포함하여, 많은 요인들이 스포츠 상품의 변동성의 원인이 될 수 있다. 크리켓 경기는 짜릿할 수도, 지루할 수도, 심지어 좌절감을 줄 수도 있지만, 팬들은 여전히 동일한 가격을 지불해야 한다. 스포츠 마케팅 담당자들은 스타 선수 영입, 프리미엄 좌석 제공 또는 다른 형태의 오락거리와 편의 시설 제공과 같이, 체계적인 방식으로 (스포츠) 상품을 ‘개선’함으로써 이를 극복하려 시도할지 모른다. 스포츠 경기의 불확실한 속성은 전체 경험의 단지 한 요소일 뿐이지만, 재정적 성공을 위한 중요한 요소이다.",

   "en": "Emma was a talented vocalist but struggled to gain recognition. Lisa, who went to the same high school with her, had quickly become famous with powerful performances. Emma felt jealous watching Lisa’s success. One day, Emma decided to enter a major vocal competition in the capital city. She spent months preparing her masterpiece of a performance, hoping this would finally be her opportunity to shine. When the competition day arrived, Emma felt nervous. Walking into the concert hall, Emma saw a large audience cheering for Lisa. She couldn’t help but compare herself to Lisa. On her turn, Emma performed with all her heart, pouring her months of preparation into every note. The judges then evaluated each vocalist’s performance carefully. Finally, the results were announced. To her surprise, Emma got first place, not Lisa. Moments later, Lisa came over to congratulate Emma with a warm smile. She said, “Your hard work and dedication really paid off. I’m so happy for you.” She didn’t seem bothered by the results. “I’m proud that your singing brings joy to people,” said Lisa. Emma felt grateful for Lisa’s kindness. Lisa added, “I’ve always been moved by your effort and have been supporting you all along.” These words made Emma feel embarrassed at her jealousy. At the same time, she got inspired to find a better path forward. They hugged warmly, their bond strengthened. From that day on, they supported each other and even sang on the same stage together. Emma became more confident and, finally, got a chance to have her solo concert.",

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

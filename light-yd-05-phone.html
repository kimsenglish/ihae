<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 Light 영어독해연습 05강 (5지문)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 Light 영어독해연습 05강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-phone">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 Light 영어독해연습 05강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 Light 영어독해연습 05강 5개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data": [{"no": "25", "title": "Perception Turns Problems Into Growth", "ktitle": "인식이 문제를 성장으로", "field": "인식 · 심리", "page": "p32 no25", "oneline": "문제는 피할 수 없지만 <span class='r'>고통은 선택</span> — <span class='g'>인식(긍정적 렌즈)</span>이 문제를 <span class='g'>성장의 기회</span>로 바꾸고, 회복력·창의력·역량으로 이어진다.", "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"중앙에 같은 문제가 놓이고, 부정적 렌즈를 통해 보면 고통과 정체로 이어지고 긍정적 렌즈를 통해 보면 성장·회복력·창의력·역량으로 이어지는 두 갈래 분기 그림\">\n  <!-- 중앙: 같은 문제 박스 -->\n  <g transform=\"translate(300, 130)\">\n    <rect x=\"-45\" y=\"-25\" width=\"90\" height=\"50\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n    <text x=\"0\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">PROBLEM</text>\n    <text x=\"0\" y=\"8\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">같은 문제</text>\n    <text x=\"0\" y=\"21\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">(피할 수 없음)</text>\n  </g>\n\n  <!-- 두 갈래 분기 화살표 (위로) -->\n  <line x1=\"265\" y1=\"115\" x2=\"180\" y2=\"80\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n  <polygon points=\"180,80 188,82 184,75\" fill=\"#c8102e\"/>\n  <line x1=\"335\" y1=\"115\" x2=\"420\" y2=\"80\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n  <polygon points=\"420,80 412,82 416,75\" fill=\"#1FA34A\"/>\n\n  <!-- 좌측: 부정적 렌즈 -->\n  <g transform=\"translate(80, 65)\">\n    <text x=\"80\" y=\"-30\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">부정적 렌즈</text>\n    \n    <!-- 렌즈/돋보기 모양 -->\n    <g transform=\"translate(40, 0)\">\n      <circle cx=\"0\" cy=\"0\" r=\"18\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n      <line x1=\"13\" y1=\"13\" x2=\"22\" y2=\"22\" stroke=\"#c8102e\" stroke-width=\"2.5\"/>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">−</text>\n    </g>\n\n    <!-- 결과 -->\n    <g transform=\"translate(95, 0)\">\n      <rect x=\"0\" y=\"-15\" width=\"80\" height=\"30\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"40\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">suffering</text>\n      <text x=\"40\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">고통·정체</text>\n    </g>\n  </g>\n\n  <!-- 우측: 긍정적 렌즈 -->\n  <g transform=\"translate(360, 65)\">\n    <text x=\"80\" y=\"-30\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">긍정적 렌즈</text>\n    \n    <g transform=\"translate(40, 0)\">\n      <circle cx=\"0\" cy=\"0\" r=\"18\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <line x1=\"13\" y1=\"13\" x2=\"22\" y2=\"22\" stroke=\"#1FA34A\" stroke-width=\"2.5\"/>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">+</text>\n    </g>\n\n    <!-- 결과 -->\n    <g transform=\"translate(95, 0)\">\n      <rect x=\"0\" y=\"-15\" width=\"100\" height=\"30\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"50\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">growth</text>\n      <text x=\"50\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">성장의 기회</text>\n    </g>\n  </g>\n\n  <!-- 하단: 결과 단계 — 4가지 (resilience, creativity, capability) -->\n  <g transform=\"translate(300, 220)\">\n    <text x=\"0\" y=\"-5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">→ resilience · creativity · capability</text>\n    <text x=\"0\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">회복력 · 창의력 · 역량</text>\n  </g>\n</svg>", "caption": "같은 문제 박스 하나에 두 갈래 인식. 부정적 렌즈는 고통·정체로, 긍정적 렌즈는 성장·회복력·창의력·역량으로 이어진다.", "tldr": ["난제·문제는 피할 수 없지만, 그로 인한 ‘고통’은 선택이다.", "밀턴 ‘실낙원’·셰익스피어 ‘햄릿’ — 마음·생각이 천국과 지옥, 좋고 나쁨을 만든다.", "긍정적 ‘렌즈’로 보면 문제는 성장의 기회 → 회복력·창의력·세계적 탁월함으로 이어진다."], "analogy": "같은 장면도 어떤 ‘렌즈’를 끼우고 보느냐에 따라 다르게 찍히죠. 문제라는 똑같은 상황을 부정 렌즈로 보면 고통이지만, 긍정 렌즈로 보면 풀어 볼 만한 성장의 퍼즐이 돼요. 인식을 바꾸는 건 카메라 필터를 갈아 끼우는 일과 같은 셈이에요.", "bg": "분야는 인식·심리예요. 핵심 명제는 ‘문제는 불가피하지만 고통은 선택’. 밀턴의 『실낙원』 인용(‘마음은 그 자체로 하나의 장소’)이 단서로 나와요. → ‘인식(perception)’이라는 렌즈가 문제를 어떻게 바꿀 수 있는지에 주목하며 읽으세요.", "flow": [{"kind": "도입 명제", "t": "문제는 피할 수 없으나 고통은 선택 — 대비를 세운다", "cls": "pivot"}, {"kind": "인용 ①", "t": "밀턴 실낙원: 마음은 스스로 지옥을 천국으로, 천국을 지옥으로 만든다"}, {"kind": "인용 ②", "t": "셰익스피어 햄릿: 좋고 나쁨은 없고 생각이 그렇게 만든다"}, {"kind": "주제", "t": "두 명언이 ‘인식의 변화시키는 힘(transformative power)’을 강조"}, {"kind": "전개", "t": "긍정적 렌즈로 보면 문제=성장 기회 → 회복력·창의력·역량 있는 개인으로 발전"}, {"kind": "결론", "t": "여정에 전념하면 목적이 의미 있고 영향력 있는 삶으로 펼쳐진다", "cls": "close"}], "vocab": [["tapestry", "(여러 요소가 얽힌) 직물·복합체"], ["inevitable", "피할 수 없는"], ["optional", "선택적인"], ["grasp", "이해하다·파악하다"], ["observe", "말하다·논평하다 (← 관찰하다 아님)"], ["insight", "통찰(력)"], ["timeless", "시대를 초월한"], ["underscore", "강조하다"], ["transformative", "변화시키는·변혁적인"], ["perception", "인식·지각"], ["lens", "렌즈·(보는) 관점"], ["align", "조정하다·일치시키다"], ["resilience", "회복력"], ["unlock", "열다·발휘하게 하다"], ["empowered", "역량 있는·권한을 부여받은"], ["attain", "달성하다·이루다"], ["commit", "전념하다·헌신하다"], ["unfold", "펼쳐지다·전개되다"], ["impactful", "영향력 있는"]], "quiz": [["‘문제’와 ‘고통’의 차이는?", "문제·난제는 피할 수 없지만, 그로 인한 고통은 우리가 선택하는 것이에요."], ["밀턴·셰익스피어 인용이 공통으로 강조하는 것은?", "마음·생각(인식)이 같은 상황을 천국으로도 지옥으로도, 좋게도 나쁘게도 만든다는 점이에요."], ["핵심 한 문장?", "긍정적 렌즈(인식)로 보면 문제가 성장의 기회가 되어 회복력·창의력·탁월함으로 이어진다."]], "en": "In the complex tapestry of life, challenges and problems are inevitable; suffering due to them is, however, optional. It is crucial to grasp the wisdom in John Milton's Paradise Lost, where Satan observes, \"The mind is its own place, and in itself can make a Heaven of Hell, a Hell of Heaven.\" My father used to often quote William Shakespeare's insight in Hamlet: \"There is nothing either good or bad, but thinking makes it so.\" These timeless quotes underscore the transformative power of our perception. Problems become opportunities for growth when viewed through a positive lens. By aligning our thoughts with this perspective, we not only navigate challenges with resilience but also unlock our creative potential, evolving into empowered individuals both personally and professionally. By adopting this approach, you will not only progress towards your goals, but also attain a level of world-class excellence. Stay committed to the journey, solve the puzzles that come your way, and watch as your purpose unfolds into a meaningful, impactful life.", "ko": "삶이라는 복잡하게 얽힌 직물 속에서 난제와 문제는 피할 수 없지만, 그것들로 인한 고통은 선택적이다. 존 밀턴의 '실낙원'에서 사탄이 \"마음은 그 자체의 장소여서, 마음 스스로 지옥을 천국으로, 천국을 지옥으로 만들 수 있다.\"라고 말한 그 지혜를 이해하는 것은 매우 중요하다. 나의 아버지는 \"좋은 것도 나쁜 것도 없으며, 다만 생각이 그렇게 만들 뿐이다.\"라는 '햄릿'에 나오는 윌리엄 셰익스피어의 통찰을 자주 인용하시곤 했다. 시대를 초월한 이러한 인용구들은 우리 인식이 지닌, 변화시키는 힘을 강조한다. 긍정적인 렌즈를 통해 바라보면 문제는 성장의 기회가 된다. 이러한 관점에 우리의 생각을 맞춤으로써, 우리는 회복력을 가지고 난제를 헤쳐 나갈 뿐만 아니라 창의적 잠재력도 발휘하여, 개인적으로나 직업적으로나 역량 있는 개인으로 발전해 간다. 이러한 접근 방식을 채택함으로써, 여러분은 목표를 향해 나아갈 뿐만 아니라 세계적 수준의 탁월함도 달성할 것이다. 그 여정에 전념하고, 마주치는 문제들을 풀어 나가며, 여러분의 목적이 의미 있고 영향력 있는 삶으로 펼쳐지는 모습을 지켜보라.", "read": [{"en": "In the complex tapestry of life, challenges and problems are inevitable; suffering due to them is, however, optional.", "ko": "삶이라는 복잡하게 얽힌 직물 속에서 난제와 문제는 피할 수 없지만, 그것들로 인한 고통은 선택적이다.", "chunks": [["In the complex tapestry of life,", "삶이라는 복잡한 직물 속에서,"], ["challenges and problems are inevitable;", "난제와 문제는 피할 수 없지만,"], ["suffering due to them is, however, optional.", "그것들로 인한 고통은, 그러나, 선택적이다."]]}, {"en": "It is crucial to grasp the wisdom in John Milton's Paradise Lost, where Satan observes, \"The mind is its own place, and in itself can make a Heaven of Hell, a Hell of Heaven.\"", "ko": "존 밀턴의 '실낙원'에서 사탄이 \"마음은 그 자체의 장소여서, 마음 스스로 지옥을 천국으로, 천국을 지옥으로 만들 수 있다.\"라고 말한 그 지혜를 이해하는 것은 매우 중요하다.", "chunks": [["It is crucial to grasp the wisdom", "그 지혜를 이해하는 것은 매우 중요하다"], ["in John Milton's Paradise Lost,", "존 밀턴의 '실낙원'에 담긴,"], ["where Satan observes,", "그 작품에서 사탄이 말하길,"], ["\"The mind is its own place,", "\"마음은 그 자체의 장소여서,"], ["and in itself can make a Heaven of Hell, a Hell of Heaven.\"", "그 안에서 지옥을 천국으로, 천국을 지옥으로 만들 수 있다.\""]]}, {"en": "My father used to often quote William Shakespeare's insight in Hamlet: \"There is nothing either good or bad, but thinking makes it so.\"", "ko": "나의 아버지는 \"좋은 것도 나쁜 것도 없으며, 다만 생각이 그렇게 만들 뿐이다.\"라는 '햄릿'에 나오는 윌리엄 셰익스피어의 통찰을 자주 인용하시곤 했다.", "chunks": [["My father used to often quote", "나의 아버지는 ~을 자주 인용하시곤 했다"], ["William Shakespeare's insight in Hamlet:", "'햄릿'에 나오는 윌리엄 셰익스피어의 통찰을:"], ["\"There is nothing either good or bad,", "\"좋은 것도 나쁜 것도 없으며,"], ["but thinking makes it so.\"", "다만 생각이 그렇게 만들 뿐이다.\""]]}, {"en": "These timeless quotes underscore the transformative power of our perception.", "ko": "시대를 초월한 이러한 인용구들은 우리 인식이 지닌, 변화시키는 힘을 강조한다.", "chunks": [["These timeless quotes underscore", "이 시대를 초월한 인용구들은 강조한다"], ["the transformative power of our perception.", "우리 인식의 변화시키는 힘을."]]}, {"en": "Problems become opportunities for growth when viewed through a positive lens.", "ko": "긍정적인 렌즈를 통해 바라보면 문제는 성장의 기회가 된다.", "chunks": [["Problems become opportunities for growth", "문제는 성장의 기회가 된다"], ["when viewed through a positive lens.", "긍정적인 렌즈를 통해 바라볼 때."]]}, {"en": "By aligning our thoughts with this perspective, we not only navigate challenges with resilience but also unlock our creative potential, evolving into empowered individuals both personally and professionally.", "ko": "이러한 관점에 우리의 생각을 맞춤으로써, 우리는 회복력을 가지고 난제를 헤쳐 나갈 뿐만 아니라 창의적 잠재력도 발휘하여, 개인적으로나 직업적으로나 역량 있는 개인으로 발전해 간다.", "chunks": [["By aligning our thoughts with this perspective,", "이러한 관점에 우리의 생각을 맞춤으로써,"], ["we not only navigate challenges with resilience", "우리는 회복력을 가지고 난제를 헤쳐 나갈 뿐만 아니라"], ["but also unlock our creative potential,", "우리의 창의적 잠재력도 발휘하며,"], ["evolving into empowered individuals", "역량 있는 개인으로 발전해 간다"], ["both personally and professionally.", "개인적으로도 직업적으로도."]]}, {"en": "By adopting this approach, you will not only progress towards your goals, but also attain a level of world-class excellence.", "ko": "이러한 접근 방식을 채택함으로써, 여러분은 목표를 향해 나아갈 뿐만 아니라 세계적 수준의 탁월함도 달성할 것이다.", "chunks": [["By adopting this approach,", "이러한 접근 방식을 채택함으로써,"], ["you will not only progress towards your goals,", "여러분은 목표를 향해 나아갈 뿐만 아니라,"], ["but also attain a level of world-class excellence.", "세계적 수준의 탁월함도 달성할 것이다."]]}, {"en": "Stay committed to the journey, solve the puzzles that come your way, and watch as your purpose unfolds into a meaningful, impactful life.", "ko": "그 여정에 전념하고, 마주치는 문제들을 풀어 나가며, 여러분의 목적이 의미 있고 영향력 있는 삶으로 펼쳐지는 모습을 지켜보라.", "chunks": [["Stay committed to the journey,", "그 여정에 전념하고,"], ["solve the puzzles that come your way,", "마주치는 문제들을 풀어 나가며,"], ["and watch as your purpose unfolds", "그리고 여러분의 목적이 펼쳐지는 것을 지켜보라"], ["into a meaningful, impactful life.", "의미 있고 영향력 있는 삶으로."]]}]}, {"no": "26", "title": "Mindfulness in Couples", "ktitle": "부부의 마음챙김 = 자기+상대 인식", "field": "심리 · 관계", "page": "p33 no26", "oneline": "부부 상담의 마음챙김 = <span class='g'>말·몸짓·패턴·감정을 인식하고 다스리기</span> — <span class='g'>자기 인식을 넘어 상대 인식</span>까지.", "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 한 사람을 둘러싼 작은 자기 인식 영역과, 오른쪽 두 사람을 함께 둘러싸는 큰 영역에서 말·몸짓·패턴·감정 네 요소를 함께 인식하는 그림\">\n  <!-- 좌측: 자기 인식만 -->\n  <g transform=\"translate(20, 35)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">전통 마음챙김 — 자기 인식</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"180\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 한 사람 둘러싼 작은 원 -->\n    <g transform=\"translate(135, 90)\">\n      <!-- 자기 인식 영역 (작은 원) -->\n      <circle cx=\"0\" cy=\"0\" r=\"50\" fill=\"#fdf2f4\" fill-opacity=\"0.5\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      \n      <!-- 사람 -->\n      <g transform=\"translate(0, 0)\">\n        <circle cx=\"0\" cy=\"-15\" r=\"11\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n        <circle cx=\"-3\" cy=\"-16\" r=\"1\" fill=\"#1a1a1a\"/>\n        <circle cx=\"3\" cy=\"-16\" r=\"1\" fill=\"#1a1a1a\"/>\n        <path d=\"M -3 -10 Q 0 -8 3 -10\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <line x1=\"0\" y1=\"-4\" x2=\"0\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n        <line x1=\"0\" y1=\"5\" x2=\"-8\" y2=\"14\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <line x1=\"0\" y1=\"5\" x2=\"8\" y2=\"14\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <line x1=\"0\" y1=\"20\" x2=\"-7\" y2=\"35\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n        <line x1=\"0\" y1=\"20\" x2=\"7\" y2=\"35\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      </g>\n\n      <!-- 라벨 -->\n      <text x=\"0\" y=\"-44\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">self-awareness</text>\n    </g>\n\n    <text x=\"135\" y=\"155\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">narrow — within oneself</text>\n  </g>\n\n  <!-- 가운데: 확장 화살표 -->\n  <g transform=\"translate(295, 125)\">\n    <line x1=\"0\" y1=\"0\" x2=\"35\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"35,0 27,-5 27,5\" fill=\"#1FA34A\"/>\n    <text x=\"17\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">extend</text>\n    <text x=\"17\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">확장</text>\n  </g>\n\n  <!-- 우측: 자기+상대 인식 -->\n  <g transform=\"translate(335, 35)\">\n    <text x=\"125\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">부부 마음챙김 — 자기+상대</text>\n    <rect x=\"0\" y=\"0\" width=\"250\" height=\"180\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 두 사람 둘러싼 큰 원 -->\n    <g transform=\"translate(125, 90)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"115\" ry=\"55\" fill=\"#f0faf3\" fill-opacity=\"0.6\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      \n      <!-- 사람 1 (좌) -->\n      <g transform=\"translate(-50, 0)\">\n        <circle cx=\"0\" cy=\"-10\" r=\"9\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <circle cx=\"-2.5\" cy=\"-11\" r=\"0.9\" fill=\"#1a1a1a\"/>\n        <circle cx=\"2.5\" cy=\"-11\" r=\"0.9\" fill=\"#1a1a1a\"/>\n        <path d=\"M -2 -6 Q 0 -5 2 -6\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        <line x1=\"0\" y1=\"-1\" x2=\"0\" y2=\"18\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <line x1=\"0\" y1=\"6\" x2=\"-6\" y2=\"12\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <line x1=\"0\" y1=\"6\" x2=\"6\" y2=\"12\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <line x1=\"0\" y1=\"18\" x2=\"-5\" y2=\"28\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <line x1=\"0\" y1=\"18\" x2=\"5\" y2=\"28\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      </g>\n\n      <!-- 사람 2 (우) -->\n      <g transform=\"translate(50, 0)\">\n        <circle cx=\"0\" cy=\"-10\" r=\"9\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <circle cx=\"-2.5\" cy=\"-11\" r=\"0.9\" fill=\"#1a1a1a\"/>\n        <circle cx=\"2.5\" cy=\"-11\" r=\"0.9\" fill=\"#1a1a1a\"/>\n        <path d=\"M -2 -6 Q 0 -5 2 -6\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        <line x1=\"0\" y1=\"-1\" x2=\"0\" y2=\"18\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <line x1=\"0\" y1=\"6\" x2=\"-6\" y2=\"12\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <line x1=\"0\" y1=\"6\" x2=\"6\" y2=\"12\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <line x1=\"0\" y1=\"18\" x2=\"-5\" y2=\"28\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <line x1=\"0\" y1=\"18\" x2=\"5\" y2=\"28\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      </g>\n\n      <!-- 두 사람 사이 4가지 요소 (가운데) -->\n      <g transform=\"translate(0, -8)\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" font-weight=\"700\" fill=\"#1FA34A\" text-anchor=\"middle\">\n        <text x=\"0\" y=\"-12\">words</text>\n        <text x=\"0\" y=\"-2\">gestures</text>\n        <text x=\"0\" y=\"8\">patterns</text>\n        <text x=\"0\" y=\"18\">emotions</text>\n      </g>\n\n      <!-- 양방향 인식 화살표 -->\n      <g transform=\"translate(0, 0)\" stroke=\"#1FA34A\" stroke-width=\"1.3\" fill=\"none\">\n        <line x1=\"-44\" y1=\"-2\" x2=\"-24\" y2=\"-2\"/>\n        <polygon points=\"-24,-2 -30,-5 -30,1\" fill=\"#1FA34A\"/>\n        <line x1=\"24\" y1=\"2\" x2=\"44\" y2=\"2\"/>\n        <polygon points=\"44,2 38,-1 38,5\" fill=\"#1FA34A\"/>\n      </g>\n\n      <text x=\"0\" y=\"-50\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">self + other awareness</text>\n    </g>\n\n    <text x=\"125\" y=\"155\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">extended — beyond oneself</text>\n  </g>\n</svg>", "caption": "전통 마음챙김: 자기 인식만(나만의 좁은 영역). 부부 마음챙김: 자기+상대 인식으로 확장 — 말·몸짓·패턴·감정 4가지를 두 사람 사이에서 함께 본다.", "tldr": ["부부 상담의 마음챙김 = 서로에게 쓰는 말을 인식하고, 밀어내는 말 대신 친밀감을 회복하는 말 고르기.", "자신의 몸짓 언어(자세·목소리 톤·크기·표정)가 무엇을 드러내는지 유념하고, 반복되는 해로운 다툼 패턴을 해결로 이어지는 길로 바꾸기.", "스스로 진정하고(self-soothe) 배우자도 달랠 줄 알기 — 마음챙김은 자기 인식이자 상대 인식."], "analogy": "부부 사이에 ‘CCTV’를 켜 두는 것과 비슷해요. 내가 어떤 말투·표정·자세를 내보내는지, 둘이 늘 빠지는 싸움 패턴이 어디서 시작되는지 실시간으로 지켜보다가, 불이 커지기 전에 스스로(그리고 상대를) 가라앉히는 거죠.", "bg": "분야는 심리·관계 상담이에요. 핵심 개념은 ‘마음챙김(mindfulness)’을 부부 관계에 적용하는 것. 말·몸짓·감정 패턴을 알아차리는 연습이 등장합니다. → 마음챙김이 ‘자기 인식’을 넘어 어디까지 확장되는지에 초점을 두고 읽으세요.", "flow": [{"kind": "정의", "t": "마음챙김 = 서로에게 쓰는 말을 인식하고 친밀감 회복하는 말 고르기"}, {"kind": "몸짓 언어", "t": "자세·목소리 톤·크기·표정이 배우자에게 드러내는 것을 유념"}, {"kind": "패턴 인식", "t": "반복되는 해로운 다툼 패턴 → 실제 해결로 이어지는 길로 교체"}, {"kind": "자기 진정", "t": "언짢을 때 스스로 가라앉히고, 배우자가 격해지면 달래기"}, {"kind": "결론", "t": "마음챙김은 자기 인식(self-awareness)이자 상대 인식(other-awareness)", "cls": "close"}], "vocab": [["mindfulness", "마음챙김·유념"], ["restore", "회복시키다"], ["closeness", "친밀감"], ["project", "(감정·인상을) 드러내다·내보이다"], ["body language", "몸짓 언어"], ["predictable", "예측 가능한"], ["resolution", "해결"], ["self-soothe", "스스로 달래다·진정시키다"], ["escalate", "고조되다·심해지다"], ["self-awareness", "자기 인식"], ["other-awareness", "상대(타인) 인식"]], "quiz": [["부부 상담에서 마음챙김의 첫 번째 실천은?", "서로에게 쓰는 말을 더 잘 인식하고, 밀어내는 말 대신 친밀감을 회복하는 말을 고르는 거예요."], ["몸짓 언어에서 유념해야 할 것은?", "앉거나 선 자세, 목소리 톤·크기, 표정이 배우자에게 무엇을 드러내는지예요."], ["핵심 한 문장?", "마음챙김은 자기 인식일 뿐 아니라 상대 인식이기도 하다."]], "en": "In couple's work, practicing mindfulness includes helping each partner to become more aware of the words they are using with each other and choosing better ones that, rather than push the partner away, restore closeness. They learn to watch their own body language, being mindful of what they're projecting to their partner through how they're sitting or standing, the tone of their voice, the volume at which they're speaking, and the expressions on their face. It's being aware of the predictable unhealthy patterns that they continue to repeat in their arguments, and replacing them with the paths that actually lead to resolution. It's taking the time to self-soothe, calming themselves back down when they're getting upset, and also knowing how to soothe their partner when it's the partner's upset that is escalating too far. So, mindfulness is not just self-awareness but also other-awareness.", "ko": "부부 상담에서 마음챙김을 실천한다는 것은, 각 배우자가 서로에게 쓰는 말을 더 잘 인식하도록 돕고, 배우자를 밀어내기보다 친밀감을 회복시키는 더 나은 말을 선택하도록 돕는 것을 포함한다. 그들은 자신이 앉거나 서 있는 방식, 목소리의 톤, 말하는 크기, 얼굴 표정을 통해 배우자에게 무엇을 드러내고 있는지에 유념하며 자신의 몸짓 언어를 관찰하는 법을 배운다. 그것은 말다툼에서 계속 반복하는 예측 가능한 해로운 패턴을 인식하고, 그것을 실제 해결로 이어지는 경로로 바꾸는 것이다. 그것은 스스로를 달랠 시간을 갖고, 언짢아질 때 스스로를 다시 가라앉히며, 오히려 배우자의 언짢음이 지나치게 고조될 때는 배우자를 달래는 법을 아는 것이다. 따라서 마음챙김은 단지 자기 인식일 뿐만 아니라 상대 인식이기도 하다.", "read": [{"en": "In couple's work, practicing mindfulness includes helping each partner to become more aware of the words they are using with each other and choosing better ones that, rather than push the partner away, restore closeness.", "ko": "부부 상담에서 마음챙김을 실천한다는 것은, 각 배우자가 서로에게 쓰는 말을 더 잘 인식하도록 돕고, 배우자를 밀어내기보다 친밀감을 회복시키는 더 나은 말을 선택하도록 돕는 것을 포함한다.", "chunks": [["In couple's work,", "부부 상담에서,"], ["practicing mindfulness includes", "마음챙김을 실천한다는 것은 ~을 포함한다"], ["helping each partner to become more aware of the words", "각 배우자가 (서로 쓰는) 말을 더 잘 인식하도록 돕는 것"], ["they are using with each other", "서로에게 사용하는,"], ["and choosing better ones that,", "그리고 더 나은 말을 선택하는 것을,"], ["rather than push the partner away, restore closeness.", "배우자를 밀어내기보다 친밀감을 회복시키는."]]}, {"en": "They learn to watch their own body language, being mindful of what they're projecting to their partner through how they're sitting or standing, the tone of their voice, the volume at which they're speaking, and the expressions on their face.", "ko": "그들은 자신이 앉거나 서 있는 방식, 목소리의 톤, 말하는 크기, 얼굴 표정을 통해 배우자에게 무엇을 드러내고 있는지에 유념하며 자신의 몸짓 언어를 관찰하는 법을 배운다.", "chunks": [["They learn to watch their own body language,", "그들은 자신의 몸짓 언어를 관찰하는 법을 배운다,"], ["being mindful of what they're projecting to their partner", "배우자에게 무엇을 드러내고 있는지에 유념하면서"], ["through how they're sitting or standing,", "앉거나 서 있는 방식,"], ["the tone of their voice,", "목소리의 톤,"], ["the volume at which they're speaking,", "말하는 소리의 크기,"], ["and the expressions on their face.", "그리고 얼굴 표정을 통해."]]}, {"en": "It's being aware of the predictable unhealthy patterns that they continue to repeat in their arguments, and replacing them with the paths that actually lead to resolution.", "ko": "그것은 말다툼에서 계속 반복하는 예측 가능한 해로운 패턴을 인식하고, 그것을 실제 해결로 이어지는 경로로 바꾸는 것이다.", "chunks": [["It's being aware of the predictable unhealthy patterns", "그것은 예측 가능한 해로운 패턴을 인식하는 것이다"], ["that they continue to repeat in their arguments,", "말다툼에서 계속 반복하는,"], ["and replacing them with the paths", "그리고 그 패턴을 (행동) 경로로 바꾸는 것이다"], ["that actually lead to resolution.", "실제로 해결로 이어지는."]]}, {"en": "It's taking the time to self-soothe, calming themselves back down when they're getting upset, and also knowing how to soothe their partner when it's the partner's upset that is escalating too far.", "ko": "그것은 스스로를 달랠 시간을 갖고, 언짢아질 때 스스로를 다시 가라앉히며, 오히려 배우자의 언짢음이 지나치게 고조될 때는 배우자를 달래는 법을 아는 것이다.", "chunks": [["It's taking the time to self-soothe,", "그것은 스스로를 달랠 시간을 갖는 것이다,"], ["calming themselves back down when they're getting upset,", "언짢아질 때 스스로를 다시 가라앉히고,"], ["and also knowing how to soothe their partner", "그리고 배우자를 달래는 법을 아는 것이다"], ["when it's the partner's upset that is escalating too far.", "오히려 배우자의 언짢음이 지나치게 고조될 때."]]}, {"en": "So, mindfulness is not just self-awareness but also other-awareness.", "ko": "따라서 마음챙김은 단지 자기 인식일 뿐만 아니라 상대 인식이기도 하다.", "chunks": [["So, mindfulness is", "따라서 마음챙김은 ~이다"], ["not just self-awareness but also other-awareness.", "자기 인식일 뿐만 아니라 상대 인식이기도 한 것."]]}]}, {"no": "27", "title": "Foragers vs Domesticators", "ktitle": "수렵채집 vs 가축 사육", "field": "인류학 · 생태", "page": "p34 no27", "oneline": "수렵채집 = 인간·동물의 <span class='g'>깊은 상호 적응</span>. 가축 사육 = 포식 관계를 넘어 <span class='g'>신체·삶을 직접 재형성</span> → 통합·상호 의존.", "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 수렵채집인과 야생 동물이 거리를 유지하며 서로 적응하는 모습과, 오른쪽 가축 사육자와 가축이 통합되어 신체·삶이 재형성되는 모습의 대조\">\n  <!-- 좌측: 수렵채집 — 거리 유지·상호 적응 -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" tex y2=\"-22\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"20\" y1=\"-19\" x2=\"24\" y2=\"-22\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <!-- 눈 -->\n      <circle cx=\"17\" cy=\"-7\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <!-- 다리 -->\n      <line x1=\"-12\" y1=\"11\" x2=\"-13\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"-4\" y1=\"11\" x2=\"-5\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"7\" y1=\"11\" x2=\"8\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"13\" y1=\"11\" x2=\"14\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 꼬리 -->\n      <line x1=\"-17\" y1=\"-3\" x2=\"-22\" y2=\"-7\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <text x=\"0\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">wild animal</text>\n    </g>\n\n    <!-- 양방향 화살표 (상호 적응) -->\n    <g transform=\"translate(135, 100)\">\n      <line x1=\"-45\" y1=\"-3\" x2=\"45\" y2=\"-3\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <polygon points=\"45,-3 38,-6 38,0\" fill=\"#1FA34A\"/>\n      <line x1=\"45\" y1=\"6\" x2=\"-45\" y2=\"6\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <polygon points=\"-45,6 -38,3 -38,9\" fill=\"#1FA34A\"/>\n      <text x=\"0\" y=\"-12\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">mutual adaptation</text>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">거리 유지 · 적응</text>\n    </g>\n\n    <text x=\"135\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">two species, distinct lives</text>\n  </g>\n\n  <!-- 가운데 vs -->\n  <text x=\"300\" y=\"125\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 우측: 가축 사육 — 통합·재형성 -->\n  <g transform=\"translate(315, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">가축 사육 — 재형성·통합</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"190\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n\n    <!-- 통합된 영역 (두 윤곽이 겹쳐짐) -->\n    <ellipse cx=\"135\" cy=\"100\" rx=\"115\" ry=\"55\" fill=\"#fdf2f4\" fill-opacity=\"0.5\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 2\"/>\n\n    <!-- 사람 (좌측 내부) -->\n    <g transform=\"translate(95, 95)\">\n      <circle cx=\"0\" cy=\"-15\" r=\"11\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-3\" cy=\"-16\" r=\"1.1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-16\" r=\"1.1\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 -10 Q 0 -8 3 -10\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"-4\" x2=\"0\" y2=\"25\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"5\" x2=\"-9\" y2=\"15\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"5\" x2=\"9\" y2=\"15\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"25\" x2=\"-7\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"25\" x2=\"7\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"56\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">domesticator</text>\n    </g>\n\n    <!-- 가축 (우측 내부 — 변형된 모습) -->\n    <g transform=\"translate(175, 105)\">\n      <!-- 몸 (더 둥글고 큼 = 비육) -->\n      <ellipse cx=\"0\" cy=\"0\" rx=\"20\" ry=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 머리 (작음, 야성 ↓) -->\n      <circle cx=\"16\" cy=\"-5\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 뿔 없음 (개량) -->\n      <ellipse cx=\"14\" cy=\"-9\" rx=\"1.5\" ry=\"2\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <ellipse cx=\"18\" cy=\"-9\" rx=\"1.5\" ry=\"2\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <!-- 눈 -->\n      <circle cx=\"17\" cy=\"-5\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <!-- 다리 (짧음) -->\n      <line x1=\"-12\" y1=\"13\" x2=\"-12\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"-4\" y1=\"13\" x2=\"-4\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"6\" y1=\"13\" x2=\"6\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"12\" y1=\"13\" x2=\"12\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">livestock</text>\n      <text x=\"0\" y=\"50\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">(body reshaped)</text>\n    </g>\n\n    <!-- 재형성 화살표 (사람 → 가축, 단방향 + 굵음) -->\n    <g transform=\"translate(135, 80)\">\n      <line x1=\"-12\" y1=\"0\" x2=\"22\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"2.2\"/>\n      <polygon points=\"22,0 14,-4 14,4\" fill=\"#c8102e\"/>\n      <text x=\"5\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">reshapes</text>\n    </g>\n\n    <text x=\"135\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">integrated — body &amp; life remade</text>\n  </g>\n</svg>", "caption": "수렵채집(forager): 사람과 야생 동물이 서로 적응(양방향, 거리 유지). 가축 사육(domesticator): 사람이 가축의 신체·삶을 재형성(통합·상호 의존, 융합).", "tldr": ["사냥꾼(수렵채집)과 가축 사육자는 동물과의 관계가 다르다.", "수렵채집: 인간·동물이 서로의 행동을 맞추는 ‘깊은 상호작용’.", "가축 사육: 포식자-먹이를 넘어 ‘직접 재형성’ → 통합·상호 의존."], "analogy": "야생 동물을 ‘쫓는’ 사냥꾼과, 매일 먹이고 길들여 ‘키우는 사람’은 동물과의 관계가 다르죠. 키우면 서로가 서로를 바꿔 가며 떼려야 뗄 수 없게 돼요.", "bg": "분야는 인류학·생태예요. 핵심 대비 — 수렵채집인(forager)과 가축 사육자(domesticator)가 동물과 맺는 관계. → 사육이 단순한 ‘포식 관계’를 넘어 무엇을 바꾸는지에 주목하며 읽으세요.", "flow": [{"kind": "대비", "t": "사냥꾼(수렵채집) vs 가축 사육자 — 관계가 다르다", "cls": "pivot"}, {"kind": "수렵채집", "t": "깊은 상호작용", "d": "인간·동물이 서로 행동을 맞춤 (카리부·순록 이동 따라 삶 구축)."}, {"kind": "가축사육", "t": "포식자-먹이를 넘어선 ‘재형성’", "d": "직접·집중적으로 서로를 다시 빚는다."}, {"kind": "결론", "t": "통합·상호 의존으로 나아간다", "cls": "close"}], "vocab": [["forager", "수렵 채집인"], ["domesticator", "가축 사육자"], ["mutual", "상호의·서로의"], ["emanate from", "~에서 나오다·발산되다"], ["predation", "포식·포식 행위"], ["millennia", "수천 년 (millennium 복수)"], ["migration", "이동·이주"], ["domestication", "가축화·길들이기"], ["intensive", "집중적인"], ["reshaping", "재형성"], ["integrated", "통합된"], ["interreliant", "상호 의존적인"]], "quiz": [["수렵채집과 가축 사육에서 인간-동물 관계는 어떻게 다른가?", "수렵채집은 서로의 행동을 ‘맞추는’ 깊은 상호작용, 가축 사육은 포식자-먹이를 넘어 ‘직접 재형성’하는 통합·상호 의존 관계예요."], ["수렵채집의 ‘깊은 상호작용’ 예는?", "북부 인간 집단이 카리부·순록·물소 무리의 이동을 중심으로 삶을 꾸리고, 그 동물들도 인간 포식에 맞춰 이동·먹이 활동을 형성한 것이에요."], ["핵심 한 문장?", "가축 사육은 포식자-먹이를 넘어 인간·동물이 서로를 다시 빚는 상호 의존 관계다."]], "en": "A hunter/forager's relationship to animals differs from that of a domesticator. For the forager, there can be a deep mutual interaction with other species, with humans shaping much of their activity to those of the animals and the other species responding to the pressures emanating from human predation. For example, across millennia human groups in northern parts of the world structured their lives around the migrations of herds of caribou or reindeer or buffalo, who in turn shaped their ranging and feeding behaviors based on human predation. But with domestication, relationships move beyond predator-prey interactions to a much more direct and intensive mutual reshaping of bodies and lifeways. The investment in one another and the processes of relationships become more integrated and interreliant.", "ko": "동물에 대한 사냥꾼/수렵 채집인의 관계는 가축 사육자의 관계와 다르다. 수렵 채집인의 경우, 인간은 자신의 활동 중 많은 것을 동물의 활동에 맞춰 형성하고 다른 종은 인간의 포식에서 오는 압력에 반응하면서, 다른 종과 깊은 상호 작용이 있을 수 있다. 예를 들어, 수천 년에 걸쳐 세계 북부 지역의 인간 집단은 카리부·순록·물소 무리의 이동을 중심으로 삶을 구축했으며, 그 결과 이 동물들은 인간의 포식에 맞추어 이동·먹이 활동을 형성했다. 그러나 가축 사육과 더불어, 관계는 포식자-먹이의 상호 작용을 넘어 신체와 삶의 방식을 훨씬 더 직접적·집중적으로 상호 재형성하는 것으로 바뀐다. 서로에 대한 투자와 관계의 과정이 더욱 통합되고 상호 의존적이 된다.", "read": [{"en": "A hunter/forager's relationship to animals differs from that of a domesticator.", "ko": "동물에 대한 사냥꾼/수렵 채집인의 관계는 가축 사육자의 관계와 다르다.", "chunks": [["A hunter/forager's relationship to animals", "동물에 대한 사냥꾼/수렵 채집인의 관계는"], ["differs from that of a domesticator.", "가축 사육자의 관계와 다르다."]]}, {"en": "For the forager, there can be a deep mutual interaction with other species, with humans shaping much of their activity to those of the animals and the other species responding to the pressures emanating from human predation.", "ko": "수렵 채집인의 경우, 인간은 자신의 활동 중 많은 것을 동물의 활동에 맞춰 형성하고 다른 종은 인간의 포식에서 오는 압력에 반응하면서, 다른 종과 깊은 상호 작용이 있을 수 있다.", "chunks": [["For the forager,", "수렵 채집인의 경우,"], ["there can be a deep mutual interaction with other species,", "다른 종과 깊은 상호 작용이 있을 수 있다,"], ["with humans shaping much of their activity to those of the animals", "인간은 자신의 활동을 동물의 활동에 맞춰 형성하고"], ["and the other species responding to the pressures", "다른 종은 그 압력에 반응하면서"], ["emanating from human predation.", "인간의 포식에서 나오는."]]}, {"en": "For example, across millennia human groups in northern parts of the world structured their lives around the migrations of herds of caribou or reindeer or buffalo, who in turn shaped their ranging and feeding behaviors based on human predation.", "ko": "예를 들어, 수천 년에 걸쳐 세계 북부 지역의 인간 집단은 카리부·순록·물소 무리의 이동을 중심으로 삶을 구축했으며, 그 결과 이 동물들은 인간의 포식에 맞추어 이동·먹이 활동을 형성했다.", "chunks": [["For example, across millennia", "예를 들어, 수천 년에 걸쳐"], ["human groups in northern parts of the world", "세계 북부 지역의 인간 집단은"], ["structured their lives around the migrations of herds of caribou or reindeer or buffalo,", "카리부·순록·물소 무리의 이동을 중심으로 삶을 구축했고,"], ["who in turn shaped their ranging and feeding behaviors", "그 동물들은 결국 이동·먹이 활동을 형성했다"], ["based on human predation.", "인간의 포식에 맞추어."]]}, {"en": "But with domestication, relationships move beyond predator-prey interactions to a much more direct and intensive mutual reshaping of bodies and lifeways.", "ko": "그러나 가축 사육과 더불어, 관계는 포식자-먹이의 상호 작용을 넘어 신체와 삶의 방식을 훨씬 더 직접적·집중적으로 상호 재형성하는 것으로 바뀐다.", "chunks": [["But with domestication,", "그러나 가축 사육과 더불어,"], ["relationships move beyond predator-prey interactions", "관계는 포식자-먹이 상호 작용을 넘어선다"], ["to a much more direct and intensive mutual reshaping", "훨씬 더 직접적이고 집중적인 상호 재형성으로"], ["of bodies and lifeways.", "신체와 삶의 방식의."]]}, {"en": "The investment in one another and the processes of relationships become more integrated and interreliant.", "ko": "서로에 대한 투자와 관계의 과정이 더욱 통합되고 상호 의존적이 된다.", "chunks": [["The investment in one another", "서로에 대한 투자와"], ["and the processes of relationships", "관계의 과정이"], ["become more integrated and interreliant.", "더 통합되고 상호 의존적이 된다."]]}]}, {"no": "28", "title": "Why Dinosaurs Stood Upright", "ktitle": "공룡은 왜 직립했나", "field": "생물 · 진화", "page": "p35 no28", "oneline": "네발 동물은 <span class='r'>질량 중심이 가슴</span>에 → 직립에 에너지 과다. 공룡은 <span class='g'>엉덩이 위 질량 중심 + 긴 꼬리 받침</span> → 길고 가는 뒷다리 → <span class='g'>빠른 달리기·팔 자유</span>.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 네발 동물이 가슴에 질량 중심이 있어 직립이 어려운 모습과, 오른쪽 공룡이 엉덩이 위 질량 중심과 긴 꼬리 받침으로 안정적으로 직립하는 모습의 구조 대조\">\n  <!-- 좌측: 네발 동물 (질량 중심 = 가슴) -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">네발 동물 — 질량 중심 가슴</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n\n    <!-- 네발 동물 (말처럼) -->\n    <g transform=\"translate(135, 100)\">\n      <!-- 몸통 -->\n      <ellipse cx=\"0\" cy=\"0\" rx=\"40\" ry=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 머리 -->\n      <g transform=\"translate(38, -10)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"12\" ry=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n        <!-- 귀 -->\n        <ellipse cx=\"-5\" cy=\"-7\" rx=\"2\" ry=\"3.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <!-- 눈 -->\n        <circle cx=\"3\" cy=\"-2\" r=\"0.8\" fill=\"#1a1a1a\"/>\n      </g>\n      <!-- 다리 4개 -->\n      <line x1=\"-25\" y1=\"14\" x2=\"-25\" y2=\"34\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <line x1=\"-12\" y1=\"14\" x2=\"-12\" y2=\"34\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <line x1=\"12\" y1=\"14\" x2=\"12\" y2=\"34\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <line x1=\"25\" y1=\"14\" x2=\"25\" y2=\"34\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 꼬리 -->\n      <path d=\"M -38 -3 Q -50 0 -52 8\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n\n      <!-- 질량 중심 (가슴 위, 빨강 ⊕) -->\n      <g transform=\"translate(20, -3)\">\n        <circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n        <line x1=\"0\" y1=\"-7\" x2=\"0\" y2=\"7\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n        <line x1=\"-7\" y1=\"0\" x2=\"7\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      </g>\n      <text x=\"20\" y=\"-18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">CoM</text>\n      \n      <!-- 방향 화살표 (앞으로 기울어짐) -->\n      <line x1=\"20\" y1=\"-3\" x2=\"55\" y2=\"20\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n      <polygon points=\"55,20 47,18 50,25\" fill=\"#c8102e\"/>\n    </g>\n\n    <!-- 직립 시도 라벨 -->\n    <g transform=\"translate(135, 170)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">if upright →</text>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">tips forward · too much energy</text>\n    </g>\n  </g>\n\n  <!-- 가운데 vs -->\n  <text x=\"300\" y=\"135\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 우측: 공룡 (T-Rex) -->\n  <g transform=\"translate(315, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">공룡 — 질량 중심 엉덩이</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"200\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 공룡 (T-Rex 직립) -->\n    <g transform=\"translate(135, 110)\">\n      <!-- 몸 (수직) -->\n      <ellipse cx=\"0\" cy=\"-20\" rx=\"14\" ry=\"25\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 머리 -->\n      <g transform=\"translate(0, -52)\">\n        <ellipse cx=\"3\" cy=\"0\" rx=\"13\" ry=\"8\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n        <!-- 눈 -->\n        <circle cx=\"6\" cy=\"-2\" r=\"1\" fill=\"#1a1a1a\"/>\n        <!-- 이빨 -->\n        <line x1=\"-3\" y1=\"5\" x2=\"-3\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <line x1=\"0\" y1=\"5\" x2=\"0\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      </g>\n      <!-- 짧은 앞다리 (팔 자유) -->\n      <line x1=\"-10\" y1=\"-15\" x2=\"-18\" y2=\"-10\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"-10\" y1=\"-12\" x2=\"-18\" y2=\"-7\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 긴 뒷다리 -->\n      <line x1=\"-6\" y1=\"3\" x2=\"-12\" y2=\"30\" stroke=\"#1a1a1a\" stroke-width=\"1.7\"/>\n      <line x1=\"6\" y1=\"3\" x2=\"12\" y2=\"30\" stroke=\"#1a1a1a\" stroke-width=\"1.7\"/>\n      <!-- 발 -->\n      <line x1=\"-12\" y1=\"30\" x2=\"-18\" y2=\"30\" stroke=\"#1a1a1a\" stroke-width=\"1.7\"/>\n      <line x1=\"12\" y1=\"30\" x2=\"18\" y2=\"30\" stroke=\"#1a1a1a\" stroke-width=\"1.7\"/>\n      <!-- 긴 꼬리 (받침) -->\n      <path d=\"M 12 -10 Q 35 -5 55 5 Q 65 12 70 25\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.7\"/>\n\n      <!-- 질량 중심 (엉덩이 위, 초록 ⊕) -->\n      <g transform=\"translate(0, -3)\">\n        <circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n        <line x1=\"0\" y1=\"-7\" x2=\"0\" y2=\"7\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n        <line x1=\"-7\" y1=\"0\" x2=\"7\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      </g>\n      <text x=\"-22\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"end\" fill=\"#1FA34A\">CoM</text>\n\n      <!-- 꼬리 받침 표시 -->\n      <text x=\"55\" y=\"25\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#1FA34A\">tail · fulcrum</text>\n    </g>\n\n    <!-- 직립 결과 라벨 -->\n    <g transform=\"translate(135, 170)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">stable upright →</text>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">fast running · arms free</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"248\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">CoM position + tail support → bipedal locomotion</text>\n</svg>", "caption": "네발 동물(왼쪽): 질량 중심이 가슴 → 직립 시 앞이 무거워 곧 쓰러짐. 공룡(오른쪽): 엉덩이 위 질량 중심 + 긴 꼬리가 받침대 역할 → 안정적 직립 + 빠른 달리기·팔 자유.", "tldr": ["네발 동물은 질량 중심이 ‘가슴’에 있어 직립이 어렵다.", "공룡은 질량 중심이 ‘엉덩이 위’ + 긴 꼬리가 받쳐 쉽게 섰다.", "그 결과 뒷다리가 길고 가늘게 진화 → 빠른 달리기 + 팔이 자유로워졌다."], "analogy": "네발 짐승은 무게가 ‘가슴’에 쏠려 일어서기 힘들지만, 공룡은 무게중심이 ‘엉덩이’ 위에 놓이고 긴 꼬리가 앞몸과 균형을 이뤄, 엉덩이를 받침점 삼아 두 발로 가뿐히 섰어요.", "bg": "분야는 생물·진화예요. 핵심 개념은 ‘질량 중심(centre of mass)’의 위치. 네발 동물은 가슴에, 공룡은 엉덩이 위에 있다는 대비가 나옵니다. → 질량 중심의 차이가 공룡의 직립·달리기에 어떤 결과를 가져오는지 따라가며 읽으세요.", "flow": [{"kind": "네발 동물", "t": "질량 중심이 ‘가슴’에", "d": "뒷다리로 서려면 에너지 많이 듦 → 직립 어려움."}, {"kind": "공룡", "t": "질량 중심이 ‘엉덩이 위’", "d": "엉덩이 앞 짧은 몸 ↔ 뒤 긴 꼬리가 균형."}, {"kind": "원리", "t": "엉덩이 = 받침점(지렛대)", "d": "그래서 뒷다리로 쉽게 섬."}, {"kind": "진화", "t": "뒷다리 길고 가늘게", "d": "양막류의 짧고 두툼한 다리와 다름."}, {"kind": "결과", "t": "빠른 달리기 + 앞다리(팔) 자유", "cls": "close", "d": "먹잇감 잡기·기어오르기."}], "vocab": [["habitually", "습관적으로"], ["centre of mass", "질량 중심"], ["lever", "지렛대로 들어 올리다"], ["hindlimb", "뒷다리"], ["upright", "직립으로·똑바로"], ["by contrast", "그에 반해서"], ["counterbalance", "균형을 맞추다·상쇄하다"], ["stiff", "뻣뻣한·딱딱한"], ["fulcrum", "받침점·지렛목"], ["amniote", "양막류"], ["slender", "가느다란"], ["reduce", "축소되다·줄다"], ["grasp", "움켜잡다"]], "quiz": [["네발 동물이 직립하기 어려운 이유는?", "질량 중심이 ‘가슴’ 쪽에 있어, 뒷다리로 몸을 세우는 데 에너지가 많이 들기 때문이에요."], ["공룡이 두 발로 쉽게 설 수 있었던 이유는?", "질량 중심이 ‘엉덩이 위’에 있고, 긴 꼬리가 균형을 잡아 엉덩이가 ‘받침점’ 역할을 했기 때문이에요."], ["핵심 한 문장?", "공룡은 엉덩이 위 질량 중심과 긴 꼬리 덕에 두 발로 서서 빠르게 달리고 팔을 자유롭게 썼다."]], "en": "Most habitually four-footed creatures have a centre of mass in the chest region. It takes a lot of energy for them to lever themselves upwards onto their hindlimbs. This makes it hard for them to stand comfortably upright for any length of time. In dinosaurs, by contrast, the centre of mass was over the hips. A relatively short body forward of the hips was counterbalanced by a long, stiff tail behind. With the hips as a fulcrum, dinosaurs could stand on their hindlimbs without effort. Rather than the short, thick limbs of most amniotes, dinosaurs could grow their hindlimbs long and thin. Legs are easier to move if they are more slender towards the ends. The easier the legs are to move, the easier it is to run fast. The arms, no longer required for running, were reduced, the hands left free for other activities, such as grasping prey items or climbing.", "ko": "대부분의 습관적으로 네발로 걷는 동물은 가슴 부위에 질량 중심을 가지고 있다. 그들이 뒷다리로 몸을 일으켜 세우는 데는 많은 에너지가 필요하다. 이것은 그들이 오랫동안 편안하게 직립으로 서 있는 것을 어렵게 만든다. 그에 반해서 공룡의 경우, 질량 중심이 엉덩이 위에 있었다. 엉덩이 앞쪽의 상대적으로 짧은 몸체는 뒤쪽의 길고 딱딱한 꼬리에 의해 균형이 맞춰졌다. 엉덩이를 받침점으로 하여, 공룡들은 매우 쉽게 뒷다리로 설 수 있었다. 대부분 양막류의 짧고 두툼한 다리와는 달리, 공룡들은 뒷다리를 길고 가늘게 성장시킬 수 있었다. 다리가 끝부분으로 갈수록 더 가늘다면 그것은 움직이기가 더 쉽다. 다리를 움직이기가 더 쉬울수록, 빠르게 달리는 것이 더 쉽다. 더 이상 달리기에 필요하지 않은 팔은 축소되었고, 손은 먹잇감을 잡거나 기어오르는 것과 같은 다른 활동을 위해 자유로워졌다.", "read": [{"en": "Most habitually four-footed creatures have a centre of mass in the chest region.", "ko": "대부분의 습관적으로 네발로 걷는 동물은 가슴 부위에 질량 중심을 가지고 있다.", "chunks": [["Most habitually four-footed creatures", "대부분의 습관적으로 네발로 걷는 동물은"], ["have a centre of mass in the chest region.", "가슴 부위에 질량 중심을 가진다."]]}, {"en": "It takes a lot of energy for them to lever themselves upwards onto their hindlimbs.", "ko": "그들이 뒷다리로 몸을 일으켜 세우는 데는 많은 에너지가 필요하다.", "chunks": [["It takes a lot of energy", "많은 에너지가 든다"], ["for them to lever themselves upwards", "그들이 몸을 위로 들어 올리는 데"], ["onto their hindlimbs.", "뒷다리로."]]}, {"en": "This makes it hard for them to stand comfortably upright for any length of time.", "ko": "이것은 그들이 오랫동안 편안하게 직립으로 서 있는 것을 어렵게 만든다.", "chunks": [["This makes it hard", "이것은 ~을 어렵게 만든다"], ["for them to stand comfortably upright", "그들이 편안하게 직립으로 서 있는 것을"], ["for any length of time.", "오랫동안."]]}, {"en": "In dinosaurs, by contrast, the centre of mass was over the hips.", "ko": "그에 반해서 공룡의 경우, 질량 중심이 엉덩이 위에 있었다.", "chunks": [["In dinosaurs, by contrast,", "그에 반해서 공룡의 경우,"], ["the centre of mass was over the hips.", "질량 중심이 엉덩이 위에 있었다."]]}, {"en": "A relatively short body forward of the hips was counterbalanced by a long, stiff tail behind.", "ko": "엉덩이 앞쪽의 상대적으로 짧은 몸체는 뒤쪽의 길고 딱딱한 꼬리에 의해 균형이 맞춰졌다.", "chunks": [["A relatively short body forward of the hips", "엉덩이 앞쪽의 상대적으로 짧은 몸체는"], ["was counterbalanced", "균형이 맞춰졌다"], ["by a long, stiff tail behind.", "뒤쪽의 길고 딱딱한 꼬리에 의해."]]}, {"en": "With the hips as a fulcrum, dinosaurs could stand on their hindlimbs without effort.", "ko": "엉덩이를 받침점으로 하여, 공룡들은 매우 쉽게 뒷다리로 설 수 있었다.", "chunks": [["With the hips as a fulcrum,", "엉덩이를 받침점으로 하여,"], ["dinosaurs could stand on their hindlimbs", "공룡들은 뒷다리로 설 수 있었다"], ["without effort.", "힘들이지 않고."]]}, {"en": "Rather than the short, thick limbs of most amniotes, dinosaurs could grow their hindlimbs long and thin.", "ko": "대부분 양막류의 짧고 두툼한 다리와는 달리, 공룡들은 뒷다리를 길고 가늘게 성장시킬 수 있었다.", "chunks": [["Rather than the short, thick limbs of most amniotes,", "대부분 양막류의 짧고 두툼한 다리와는 달리,"], ["dinosaurs could grow their hindlimbs", "공룡들은 뒷다리를 성장시킬 수 있었다"], ["long and thin.", "길고 가늘게."]]}, {"en": "Legs are easier to move if they are more slender towards the ends.", "ko": "다리가 끝부분으로 갈수록 더 가늘다면 그것은 움직이기가 더 쉽다.", "chunks": [["Legs are easier to move", "다리는 움직이기가 더 쉽다"], ["if they are more slender towards the ends.", "끝부분으로 갈수록 더 가늘다면."]]}, {"en": "The easier the legs are to move, the easier it is to run fast.", "ko": "다리를 움직이기가 더 쉬울수록, 빠르게 달리는 것이 더 쉽다.", "chunks": [["The easier the legs are to move,", "다리를 움직이기가 더 쉬울수록,"], ["the easier it is to run fast.", "빠르게 달리기가 더 쉽다."]]}, {"en": "The arms, no longer required for running, were reduced, the hands left free for other activities, such as grasping prey items or climbing.", "ko": "더 이상 달리기에 필요하지 않은 팔은 축소되었고, 손은 먹잇감을 잡거나 기어오르는 것과 같은 다른 활동을 위해 자유로워졌다.", "chunks": [["The arms, no longer required for running, were reduced,", "더 이상 달리기에 필요 없는 팔은 축소되었고,"], ["the hands left free for other activities,", "손은 다른 활동을 위해 자유로워졌다,"], ["such as grasping prey items or climbing.", "먹잇감을 잡거나 기어오르는 것 같은."]]}]}, {"no": "29", "title": "Why Architects Leave", "ktitle": "사라지는 건축가들", "field": "사회 · 통계", "page": "p36 no29", "oneline": "건축학 졸업자 중 <span class='r'>등록 건축가로 가지 않는 비율이 큼</span> — 영국 절반↑(연 1,600명·14:1)·미국 37%(연 2,500명). <span class='r'>진로는 연구에 안 잡혀 불분명</span>.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"건축학 졸업자가 많이 들어가는 깔때기 입구와, 등록 건축가로 나오는 작은 출구 사이 hidden 손실 영역을 보여주는 그림과 영국·미국 통계\">\n  <!-- 중앙: 깔때기 -->\n  <g transform=\"translate(300, 110)\">\n    <!-- 깔때기 외곽 -->\n    <path d=\"M -90 -65 L 90 italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#5e5e5e\" font-weight=\"700\">where do they go? — not tracked in research</text>\n</svg>", "caption": "깔때기 비유 — 건축학 졸업자 다수가 위에서 내려오지만 등록 건축가가 되지 않음. 영국 14:1(절반↑), 미국 37%가 중간에서 사라진다 — 어디로 가는지 연구되지 않은 hidden 영역.", "tldr": ["건축학을 졸업해도 ‘등록 건축가’가 안 되는 사람이 놀랍게 많다.", "영국: Part I 마친 학생 절반 이상이 Part III에 안 감(연 ~1,600명 격차).", "미국: 졸업생의 37%가 미진입(연 ~2,500명) — 추적·연구 부족으로 진로 불분명."], "analogy": "의대를 나와도 의사 면허를 안 따는 사람이 많다면 ‘다 어디로 갔지?’ 싶죠. 건축도 그래요 — 졸업생 상당수가 ‘등록 건축가’가 안 되는데, 어디로 가는지조차 잘 추적되지 않아요.", "bg": "분야는 사회·직업 통계예요. 건축학을 전공하고도 등록 건축가(registered architect)가 되지 않는 비율을 영국·미국 데이터로 다룹니다. → 그 수치가 얼마나 큰지, 그리고 왜 진로가 불분명한지에 주목하며 읽으세요.", "flow": [{"kind": "현상", "t": "졸업해도 ‘등록 건축가’가 안 되는 사람이 많다"}, {"kind": "영국", "t": "Part I 마친 학생 절반↑가 Part III 안 감", "d": "연 약 1,600명 격차 · 14명 중 1명만 등록."}, {"kind": "미국", "t": "졸업생의 37%가 미진입", "d": "연 약 2,500명."}, {"kind": "문제", "t": "연구·추적이 부족하다"}, {"kind": "결론", "t": "떠난 이들의 진로가 불분명", "cls": "close"}], "vocab": [["redefine", "재정립하다"], ["undergraduate", "학부의"], ["requirement", "필수 요건"], ["registration", "등록"], ["represent", "나타내다·의미하다"], ["gap", "차이·격차"], ["ratio", "비율"], ["narrow", "(차이가) 더 작은·좁은"], ["ultimately", "최종적으로"], ["anecdotally", "개인적 진술로·일화적으로"], ["hesitant", "주저하는"], ["emphasis", "강조·중요시"], ["destination", "목적지·도달점"]], "quiz": [["건축학 졸업생에 관한 ‘숨은 통계’는?", "영국은 절반 이상(연 ~1,600명), 미국은 37%(연 ~2,500명)가 ‘등록 건축가’가 되지 않는다는 점이에요."], ["이 현상의 문제점은?", "그렇게 떠난 사람들이 어디로 가는지 연구·추적이 부족해 진로가 불분명하다는 거예요."], ["핵심 한 문장?", "건축학 졸업생 상당수가 등록 건축가가 안 되지만, 그 진로는 잘 추적되지 않는다."]], "en": "The number of architects who either leave or redefine what they do is surprisingly high. In the UK, data from the Royal Institute of British Architects (RIBA) show more than half of the students who have completed the undergraduate bachelor of architecture degree, known as Part I, do not go on to complete the post-graduate Part III, a requirement for registration as an architect, representing a gap of around 1,600 students per year, with some claiming the ratio of those who become registered architects versus those who take up the degree is as low as one in 14. In the US, the gap between graduates and those registered is narrower, with 37 percent not ultimately registering as an architect, or about 2,500 per year. This is perhaps due to the far greater total cost of a US education, at an average of ＄190,000 for a four-year professional degree. It's unclear where these students go or what they end up doing, as their pathways are not captured in the research. Anecdotally, we know that many graduates of architecture continue to work in architectural practice while never registering as architects. Many will go elsewhere. We are hesitant to place too much emphasis on the statistics, as few professional bodies or schools have set out to specifically capture the professional destination of those who have left.", "ko": "자신이 하는 일을 그만두거나 재정립하는 건축가의 수는 놀라울 만큼 많다. 영국에서는 RIBA 자료에 따르면, Part I이라 알려진 학부 건축학 학사를 마친 학생 중 절반 이상이 건축가 등록의 필수 요건인 대학원 과정 Part III에 진학하지 않으며, 이는 매년 약 1,600명의 차이를 의미하고, 일부는 학위 취득자 대비 등록 건축가의 비율이 14명 중 1명만큼 낮다고 주장한다. 미국에서는 졸업생과 등록 건축가 간 차이가 더 작은데, 최종적으로 등록하지 않는 이가 37%, 즉 매년 약 2,500명이다. 이는 어쩌면 미국 교육의 훨씬 더 큰 총비용 때문일 수 있는데, 4년짜리 전문 학위에 평균 19만 달러에 달한다. 이 학생들이 어디로 가는지 또는 결국 무엇을 하게 되는지는 불분명한데, 그들의 진로가 연구에 포착되지 않기 때문이다. 개인적인 진술을 통해, 많은 건축학 졸업생이 건축가로 결코 등록하지 않으면서도 건축 실무 분야에서 계속 일하고 있음을 우리는 안다. 많은 이들은 다른 길을 갈 것이다. 우리가 통계를 지나치게 중시하기를 주저하는 이유는, 이탈자의 직업상 목적지를 구체적으로 포착하려 착수한 전문 기관이나 학교가 거의 없기 때문이다.", "read": [{"en": "The number of architects who either leave or redefine what they do is surprisingly high.", "ko": "자신이 하는 일을 그만두거나 재정립하는 건축가의 수는 놀라울 만큼 많다.", "chunks": [["The number of architects", "건축가의 수는"], ["who either leave or redefine what they do", "자신이 하는 일을 그만두거나 재정립하는"], ["is surprisingly high.", "놀라울 만큼 많다."]]}, {"en": "In the UK, data from the Royal Institute of British Architects (RIBA) show more than half of the students who have completed the undergraduate bachelor of architecture degree, k function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

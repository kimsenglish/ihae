<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 미니특강(미닛15) 6회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   지문 이해 보조 자료 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-ipad">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 미니특강(미닛15) 6회</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 미니특강(미닛15) 6회
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data": [{"no": "1", "title": "Digital Technology and Youth: Toward Balance", "ktitle": "디지털 기술 — 금지가 아닌 균형", "field": "사회·교육", "page": "6회 01번 (주장)", "oneline": "디지털 기술이 젊은이의 소통 방식을 바꿨고, 부모들은 ‘대면 단절’을 걱정한다.", "tldr": ["디지털 기술이 젊은이의 소통 방식을 바꿨고, 부모들은 ‘대면 단절’을 걱정한다.", "하지만 ‘금지·제한’은 답이 아니다 — 디지털 문해력이 부족하면 미래에 불리하다.", "노출을 줄이는 게 아니라 ‘균형 잡힌 사용법’을 가르쳐야 한다."], "analogy": "수영이 위험하다고 물에 못 가게 막기보다, 안전하게 헤엄치는 법을 가르치는 게 낫죠. 디지털 기기도 ‘금지’가 아니라 ‘잘 쓰는 법’을 가르쳐야 해요.", "bg": "분야는 사회·교육이에요. 디지털 기술(스마트폰·SNS)이 젊은이의 소통을 바꿨고, 부모들은 ‘대면 단절’을 걱정합니다. → 금지냐 허용이냐를 넘어 글이 어떤 ‘균형’을 제안하는지에 주목하며 읽으세요.", "flow": [{"kind": "현상", "t": "디지털이 젊은이의 소통 방식을 바꿈"}, {"kind": "우려", "t": "부모 — ‘대면 단절’ 걱정"}, {"kind": "반론", "t": "금지·제한은 답이 아니다", "d": "디지털 문해력 부족하면 미래에 불리."}, {"kind": "주장", "t": "‘균형 잡힌 사용법’을 가르쳐야"}, {"kind": "결론", "t": "노출 제한이 아니라 균형이 핵심"}], "quiz": [["디지털 기기에 대한 ‘금지·제한’이 답이 아닌 이유는?", "디지털 문해력이 부족한 젊은이는 미래의 직장·사회에서 불리해지기 때문이에요."], ["글이 제시하는 ‘답’은?", "노출을 줄이는 게 아니라, 균형 잡힌 방식으로 기술을 ‘사용하는 법’을 가르치는 거예요."], ["핵심 한 문장?", "디지털 기술은 금지가 아니라 ‘균형 있게 쓰는 법’을 가르쳐야 한다."]], "vocab": [["proliferation pro-", "확산·급증"], ["interact with", "~와 상호작용하다·소통하다"], ["disconnected dis-", "단절된·연결되지 않은"], ["face-to-face", "대면의·얼굴을 마주하는"], ["valid", "타당한·유효한"], ["ban", "금지하다"]], "en": "The proliferation of digital technology has changed the way young people interact with the world. Many parents worry that smartphones and social media are creating a generation disconnected from face-to-face interaction. While these concerns are valid, banning or severely restricting access to technology isn't the answer. Young people who lack digital literacy will be at a disadvantage in tomorrow's workplace and society. Adolescents need to learn how to use technology in a balanced way, not just to limit their exposure. By setting healthy limits on screen time and encouraging critical thinking, parents can help their children become thoughtful participants in digital spaces, not just consumers. We need to teach them how to use technology in a balanced way, rather than trying to prevent them from engaging with the digital world that will inevitably shape their future.", "ko": "디지털 기술의 확산은 젊은이들이 세상과 소통하는 방식을 변화시켰다. 많은 부모들은 스마트폰과 소셜 미디어가 대면 상호작용과 단절된 세대를 만들고 있다고 걱정한다. 이러한 우려가 타당하긴 하지만, 기술에 대한 접근을 금지하거나 심하게 제한하는 것은 해답이 아니다. 디지털 문해력이 부족한 젊은이들은 미래의 직장과 사회에서 불리한 위치에 놓이게 될 것이다. 청소년은 단지 노출을 제한하는 것이 아니라, 균형 잡힌 방식으로 기술을 사용하는 방법을 배워야 한다. 스크린 사용 시간에 건전한 한계를 설정하고 비판적 사고를 장려함으로써, 부모들은 자녀가 단지 소비자가 아니라 디지털 공간에서 사려 깊은 참여자가 되도록 도울 수 있다. 우리는 그들을 필연적으로 그들의 미래를 형성할 디지털 세계에 참여하는 것을 막으려 하기보다는, 균형 잡힌 방식으로 기술을 사용하는 방법을 가르쳐야 한다.", "read": [{"en": "The proliferation of digital technology has changed the way young people interact with the world.", "ko": "디지털 기술의 확산은 젊은이들이 세상과 소통하는 방식을 변화시켰다.", "chunks": [["The proliferation of digital technology", "디지털 기술의 확산은"], ["has changed the way", "방식을 변화시켰다"], ["young people interact with the world.", "젊은이들이 세상과 소통하는."]]}, {"en": "Many parents worry that smartphones and social media are creating a generation disconnected from face-to-face interaction.", "ko": "많은 부모들은 스마트폰과 소셜 미디어가 대면 상호작용과 단절된 세대를 만들고 있다고 걱정한다.", "chunks": [["Many parents worry", "많은 부모들은 걱정한다"], ["that smartphones and social media", "스마트폰과 소셜 미디어가"], ["are creating a generation", "한 세대를 만들고 있다고"], ["disconnected from face-to-face interaction.", "대면 상호작용과 단절된."]]}, {"en": "While these concerns are valid, banning or severely restricting access to technology isn't the answer.", "ko": "이러한 우려가 타당하긴 하지만, 기술에 대한 접근을 금지하거나 심하게 제한하는 것은 해답이 아니다.", "chunks": [["While these concerns are valid,", "이러한 우려들이 타당하긴 하지만,"], ["banning or severely restricting", "금지하거나 심하게 제한하는 것은"], ["access to technology", "기술에 대한 접근을"], ["isn't the answer.", "해답이 아니다."]]}, {"en": "Young people who lack digital literacy will be at a disadvantage in tomorrow's workplace and society.", "ko": "디지털 문해력이 부족한 젊은이들은 미래의 직장과 사회에서 불리한 위치에 놓이게 될 것이다.", "chunks": [["Young people", "젊은이들은"], ["who lack digital literacy", "디지털 문해력이 부족한"], ["will be at a disadvantage  <!-- 우측 끈 -->\n      <line x1=\"68\" y1=\"-15\" x2=\"68\" y2=\"-5\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 우측 접시 -->\n      <ellipse cx=\"68\" cy=\"-3\" rx=\"26\" ry=\"4.5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"68\" y=\"-22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">critical thinking</text>\n      <text x=\"68\" y=\"3\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">비판적 사고</text>\n    </g>\n\n    <text x=\"135\" y=\"145\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"balanced way · parents' role: by V-ing\"</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 220)\">\n    <line x1=\"60\" y1=\"0\" x2=\"540\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"0.8\" opacity=\"0.3\"/>\n    <text x=\"300\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">→ 사려 깊은 <tspan fill=\"#1FA34A\">참여자 (thoughtful participant)</tspan> ✓ &#160;·&#160; 단순 <tspan fill=\"#999\">소비자 (consumer)</tspan> ✗</text>\n  </g>\n</svg>", "caption": "디지털 금지 ✗ — 균형 사용법 학습 ✓ · 부모는 한계 설정 + 비판적 사고 장려로 사려 깊은 참여자로 이끌어야 한다"}, {"no": "2", "title": "Behavioural Insights: Nudges", "ktitle": "넛지 — 작은 변화, 큰 효과", "field": "행동경제", "page": "6회 02번 (요지)", "oneline": "사람은 늘 완전히 이성적이지 않다(Thaler).", "tldr": ["사람은 늘 완전히 이성적이지 않다(Thaler).", "결정이 ‘사소해 보이는 요소’(음식 배치 등)에 크게 좌우된다.", "양식을 줄이거나 단순화하는 작은 넛지가 큰 변화를 만든다."], "analogy": "구내식당에서 과일을 눈높이에 두면 사람들이 더 집어 가죠. 강요 안 해도 ‘배치’만 살짝 바꿔 행동을 바꾸는 것 — 그게 넛지예요.", "bg": "분야는 행동경제예요. 핵심 인물은 Richard Thaler, 핵심 개념은 사람이 사소한 요인에 휘둘린다는 점과 ‘넛지(nudge)’. → 작은 환경 설계가 선택을 어떻게 바꾸는지에 초점을 두고 읽으세요.", "flow": [{"kind": "핵심", "t": "사람은 늘 이성적이지 않다 (Thaler)"}, {"kind": "원리", "t": "사소한 요소가 결정을 좌우", "d": "고칼로리 음식의 진열 위치 등."}, {"kind": "적용", "t": "양식 단순화 → 삶에 변화"}, {"kind": "사례", "t": "행동 통찰 팀의 성공담"}, {"kind": "결론", "t": "작은 넛지, 큰 효과"}], "quiz": [["Thaler가 보여준 것은?", "사람은 늘 완전히 이성적이지 않고, 결정이 ‘사소해 보이는 요소’에 크게 좌우된다는 거예요."], ["‘넛지’의 예로 글이 든 것은?", "고칼로리 음식의 ‘진열 위치’, 양식(서류) 요구를 줄이거나 단순화하는 것 같은 작은 변화예요."], ["핵심 한 문장?", "강요 없이 사소한 요소만 바꿔도(넛지) 사람의 선택과 삶이 크게 달라진다."]], "vocab": [["economist economy", "경제학자"], ["rational", "이성적인·합리적인"], ["apparently appear", "명백하게·겉보기에"], ["minor", "사소한·작은"], ["grocery store", "식료품점"], ["guided by", "~의 안내를 받아·~에 따라"]], "en": "Richard Thaler, an economist, showed that people don't always make fully rational choices, and that their decisions can be greatly affected by apparently minor factors (such as where high-calorie foods are placed in a grocery store). Guided by Thaler's work, companies and governments found that if you reduce or simplify form-filling requirements, you can make a difference in people's lives. With these findings in mind, the Behavioural Insights Team's new report offers a success story. Road accidents are a leading cause of deaths and injuries in the UK, and accidents are often caused by drivers who have previously been caught speeding. To address that problem, the team adopted a simple tactic, in the form of a letter, briefly explaining to those drivers that speed limits are a reasonable and important idea. Remarkably, the intervention cut repeat offenses by 20 percent over the next six-month period—which almost certainly saved lives.", "ko": "경제학자인 Richard Thaler는 사람들이 항상 완전히 이성적인 선택을 하지는 않으며, 그들의 결정이 명백하게 사소한 요소들(고칼로리 음식이 식료품점에서 어디에 놓이는가와 같은)에 의해 크게 영향받을 수 있다는 것을 보여 주었다. Thaler의 연구에 따라, 기업과 정부는 양식 작성 요구사항을 줄이거나 단순화하면 사람들의 삶에 변화를 일으킬 수 있다는 것을 알아냈다. 이러한 발견들을 염두에 두고, 행동 통찰 팀의 새로운 보고서는 성공담 한 편을 제시한다. 도로 사고는 영국에서 사망과 부상의 주요 원인이며, 사고는 종종 이전에 과속으로 적발된 운전자들에 의해 야기된다. 그 문제를 해결하기 위해, 팀은 그 운전자들에게 속도 제한이 합리적이고 중요한 생각이라는 것을 간단히 설명하는 편지 형태의 단순한 전략을 채택했다. 놀랍게도, 그 개입은 향후 6개월 동안 반복 위반을 20퍼센트 줄였고, 이는 거의 틀림없이 생명을 구했다.", "read": [{"en": "Richard Thaler, an economist, showed that people don't always make fully rational choices, and that their decisions can be greatly affected by apparently minor factors (such as where high-calorie foods are placed in a grocery store).", "ko": "경제학자인 Richard Thaler는 사람들이 항상 완전히 이성적인 선택을 하지는 않으며, 그들의 결정이 명백하게 사소한 요소들(고칼로리 음식이 식료품점에서 어디에 놓이는가와 같은)에 의해 크게 영향받을 수 있다는 것을 보여 주었다.", "chunks": [["Richard Thaler, an economist, showed", "경제학자인 Richard Thaler는 보여 주었다"], ["that people don't always make", "사람들이 항상 ~하는 것은 아니라는 것을"], ["fully rational choices,", "완전히 이성적인 선택을,"], ["and that their decisions", "그리고 그들의 결정이"], ["can be greatly affected", "크게 영향받을 수 있다는 것을"], ["by apparently minor factors", "명백하게 사소한 요소들에 의해"], ["(such as where high-calorie foods", "(고칼로리 음식이 어디에 놓이는가와 같은"], ["are placed in a grocery store).", "식료품점에서)."]]}, {"en": "Guided by Thaler's work, companies and governments found that if you reduce or simplify form-filling requirements, you can make a difference in people's lives.", "ko": "Thaler의 연구에 따라, 기업과 정부는 양식 작성 요구사항을 줄이거나 단순화하면 사람들의 삶에 변화를 일으킬 수 있다는 것을 알아냈다.", "chunks": [["Guided by Thaler's work,", "Thaler의 연구에 따라,"], ["companies and governments found", "기업과 정부는 알아냈다"], ["that if you reduce or simplify", "만약 줄이거나 단순화하면"], ["form-filling requirements,", "양식 작성 요구사항을,"], ["you can make a difference", "변화를 일으킬 수 있다는 것을"], ["in people's lives.", "사람들의 삶에."]]}, {"en": "With these findings in mind, the Behavioural Insights Team's new report offers a success story.", "ko": "이러한 발견들을 염두에 두고, 행동 통찰 팀의 새로운 보고서는 성공담 한 편을 제시한다.", "chunks": [["With these findings in mind,", "이러한 발견들을 염두에 두고,"], ["the Behavioural Insights Team's new report", "행동 통찰 팀의 새로운 보고서는"], ["offers a success story.", "성공담을 제공한다."]]}, {"en": "Road accidents are a leading cause of deaths and injuries in the UK, and accidents are often caused by drivers who have previously been caught speeding.", "ko": "도로 사고는 영국에서 사망과 부상의 주요 원인이며, 사고는 종종 이전에 과속으로 적발된 운전자들에 의해 야기된다.", "chunks": [["Road accidents are a leading cause", "도로 사고는 주요 원인이다"], ["of deaths and injuries in the UK,", "영국에서 사망과 부상의,"], ["and accidents are often caused", "그리고 사고는 종종 야기된다"], ["by drivers who have previously been caught", "이전에 적발된 운전자들에 의해"], ["speeding.", "과속으로."]]}, {"en": "To address that problem, the team adopted a simple tactic, in the form of a letter, briefly explaining to those drivers that speed limits are a reasonable and important idea.", "ko": "그 문제를 해결하기 위해, 팀은 그 운전자들에게 속도 제한이 합리적이고 중요한 생각이라는 것을 간단히 설명하는 편지 형태의 단순한 전략을 채택했다.", "chunks": [["To address that problem,", "그 문제를 해결하기 위해,"], ["the team adopted a simple tactic,", "팀은 단순한 전략을 채택했다,"], ["in the form of a letter,", "편지의 형태로,"], ["briefly explaining to those drivers", "그 운전자들에게 간단히 설명하면서"], ["that speed limits are", "속도 제한이 ~이라는 것을"], ["a reasonable and important idea.", "합리적이고 중요한 생각."]]}, {"en": "Remarkably, the intervention cut repeat offenses by 20 percent over the next six-month period—which almost certainly saved lives.", "ko": "놀랍게도, 그 개입은 향후 6개월 동안 반복 위반을 20퍼센트 줄였고, 이는 거의 틀림없이 생명을 구했다.", "chunks": [["Remarkably,", "놀랍게도,"], ["the intervention cut repeat offenses", "그 개입은 반복 위반을 줄였다"], ["by 20 percent", "20퍼센트만큼"], ["over the next six-month period—", "향후 6개월 기간 동안—"], ["which almost certainly saved lives.", "이것은 거의 틀림없이 생명을 구했다."]]}], "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"좌측 식료품 진열대에서 손이 빨강 점선 따라 고칼로리 칸을 잡는 비이성적 선택, 가운데 단순한 편지 한 통, 우측 6개월 후 재범 20퍼센트 감소를 보여주는 막대그래프\">\n  <!-- 좌측: Thaler 통찰 - 비이성적 선택 -->\n  <g transform=\"translate(15, 30)\">\n    <text x=\"80\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\">① Thaler 통찰 — 비이성적 선택</text>\n    <rect x=\"0\" y=\"0\" width=\"160\" height=\"190\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#999\" stroke-width=\"1.2\"/>\n\n    <!-- 진열대 (3단) -->\n    <g transform=\"translate(80, 50)\">\n      <!-- 1단 (고칼로리 - 눈높이, 빨강) -->\n      <rect x=\"-55\" y=\"0\" width=\"110\" height=\"22\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-w \"45\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"-55\" y1=\"45\" x2=\"60\" y2=\"45\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- Before bar -->\n      <rect x=\"-40\" y=\"-40\" width=\"22\" height=\"85\" fill=\"#ccc\" stroke=\"#999\" stroke-width=\"1\"/>\n      <text x=\"-29\" y=\"58\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">before</text>\n      <!-- After bar -->\n      <rect x=\"15\" y=\"-23\" width=\"22\" height=\"68\" fill=\"#1FA34A\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"26\" y=\"58\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\">after 6mo</text>\n\n      <!-- 20% 감소 화살표 -->\n      <g transform=\"translate(0, -48)\">\n        <line x1=\"-16\" y1=\"0\" x2=\"16\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n        <polygon points=\"16,0 9,-4 9,4\" fill=\"#c8102e\"/>\n        <text x=\"0\" y=\"-6\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c8102e\">−20%</text>\n      </g>\n    </g>\n\n    <text x=\"82\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">repeat offenses ↓ · lives saved</text>\n  </g>\n</svg>", "caption": "작고 단순한 개입도 큰 변화 — Thaler 통찰 → 행동 통찰 팀의 편지 한 통 → 6개월간 재범 20% 감소"}, {"no": "3", "title": "Songwriting as Therapy & Classroom Tool", "ktitle": "작곡 — 치료이자 교육 도구", "field": "음악·교육", "page": "6회 03번 (주제)", "oneline": "작곡은 음악 치료에서 기분 개선·정서 대처를 돕는 데 쓰인다.", "tldr": ["작곡은 음악 치료에서 기분 개선·정서 대처를 돕는 데 쓰인다.", "선택한 주제·스타일이 ‘작곡가의 영혼을 들여다보는 창’이 된다.", "음악 교사도 교실에서 이 치료 기법을 활용할 수 있다."], "analogy": "사진을 고를 때 내가 무심코 찍은 풍경을 보면 ‘아, 내가 이런 데 끌렸구나’ 하고 몰랐던 마음이 드러나듯, 곡의 주제·스타일이 평소 못 보던 내 속을 비춰 줘요.", "bg": "분야는 음악·교육이에요. 작곡(songwriting)이 음악 치료와 교실에서 어떻게 쓰이는지를 다룹니다. → 노래 만들기가 사람의 감정·내면에 어떻게 ‘창’이 되는지에 주목하며 읽으세요.", "flow": [{"kind": "활용", "t": "음악 치료 — 기분 개선·정서 대처"}, {"kind": "원리", "t": "주제·스타일 = ‘영혼의 창’", "d": "작곡가의 마음을 들여다본다."}, {"kind": "효과", "t": "눈에 안 띌 상황을 조명"}, {"kind": "확장", "t": "음악 교사도 교실에서 치료 기법 사용"}, {"kind": "결론", "t": "작곡 = 치료이자 교육 도구"}], "quiz": [["작곡이 ‘치료’가 되는 이유는?", "선택한 주제·스타일이 작곡가의 마음(영혼)을 들여다보는 창이 되어, 눈에 안 띌 상황까지 드러내기 때문이에요."], ["글이 말하는 작곡의 두 쓰임은?", "음악 치료(기분 개선·정서 대처)와 교실 교육 도구예요."], ["핵심 한 문장?", "작곡은 마음을 비추는 창이라, 치료이자 교육 도구가 된다."]], "vocab": [["songwriting song", "작곡·노래 짓기"], ["music therapist", "음악 치료사"], ["cope with", "~에 대처하다·~을 극복하다"], ["emotional emotion", "정서적인·감정의"], ["challenge", "어려움·도전"], ["serve as", "~의 역할을 하다"]], "en": "Songwriting is often used by music therapists to help people feel better about their daily lives and cope with stress or emotional challenges. The themes and styles chosen can serve as a window into the songwriter's soul. These themes can shed light on situations that might otherwise go unnoticed. Music teachers can use music therapy techniques when teaching songwriting approaches in their classrooms. Burton called musical compositions \"ubiquitous\" because of their extensive use in celebrations, holidays, and religious or political events. The songwriting process can be a translator of moods and feelings, a base of reference through its ubiquity. Creating original musical works can be an important tool for developing an understanding of ourselves, others, and the cultural context of the world. As an extension of learning in the music classroom, songwriting activities have been found to provide students with opportunities to reflect on, apply, and learn from their culture in meaningful ways. In addition, the practice of composing lyrics and melodies can provide a space for students to grow, process emotions, and share feelings in a positive way.", "ko": "작곡은 음악 치료사들에 의해 사람들이 일상생활에 대한 기분을 개선하고 스트레스나 정서적 어려움에 대처하도록 돕기 위해 흔히 사용된다. 선택한 주제와 스타일은 작곡가의 영혼을 들여다보는 창 역할을 할 수 있다. 이러한 주제는 그렇지 않으면 눈에 띄지 않을지 모를 상황을 조명할 수 있다. 음악 교사는 교실에서 작곡 접근법을 가르칠 때 음악 치료 기법을 사용할 수 있다. Burton은 기념행사, 명절, 그리고 종교적 또는 정치적 행사에서 음악 작곡이 광범위하게 사용되기 때문에 음악 작곡을 \"어디에나 있는\" 것이라고 불렀다. 작곡 과정은 기분과 감정을 전달하는 역할을 할 수 있으며, 그것의 편재성을 통해 참고의 토대가 되기도 한다. 독창적인 음악 작품을 만드는 것은 우리 자신, 타인, 그리고 세상의 문화적 맥락에 대한 이해를 발전시키는 중요한 도구가 될 수 있다. 음악 교실에서의 학습의 연장으로서, 작곡 활동은 학생들에게 의미 있는 방식으로 자신의 문화를 성찰하고, 적용하고, 그로부터 배울 기회를 제공하는 것으로 나타났다. 게다가, 가사와 멜로디를 작곡하는 연습은 학생들이 긍정적인 방식으로 성장하고, 감정을 처리하며, 감정을 공유할 수 있는 공간을 제공할 수 있다.", "read": [{"en": "Songwriting is often used by music therapists to help people feel better about their daily lives and cope with stress or emotional challenges.", "ko": "작곡은 음악 치료사들에 의해 사람들이 일상생활에 대한 기분을 개선하고 스트레스나 정서적 어려움에 대처하도록 돕기 위해 흔히 사용된다.", "chunks": [["Songwriting is often used", "작곡은 흔히 사용된다"], ["by music therapists", "음악 치료사들에 의해"], ["to help people feel better", "사람들이 더 나은 기분을 느끼도록 돕기 위해"], ["about their daily lives", "자신의 일상생활에 대해"], ["and cope with stress or emotional challenges.", "그리고 스트레스나 정서적 어려움에 대처하도록."]]}, {"en": "The themes and styles chosen can serve as a window into the songwriter's soul.", "ko": "선택한 주제와 스타일은 작곡가의 영혼을 들여다보는 창 역할을 할 수 있다.", "chunks": [["The themes and styles chosen", "선택된 주제와 스타일은"], ["can serve as a window", "창의 역할을 할 수 있다"], ["into the songwriter's soul.", "작곡가의 영혼으로 들어가는."]]}, {"en": "These themes can shed light on situations that might otherwise go unnoticed.", "ko": "이러한 주제는 그렇지 않으면 눈에 띄지 않을지 모를 상황을 조명할 수 있다.", "chunks": [["These themes can shed light on", "이러한 주제는 조명할 수 있다"], ["situations that might otherwise", "그렇지 않으면 ~할 수도 있는 상황을"], ["go unnoticed.", "눈에 띄지 않게 될."]]}, {"en": "Music teachers can use music therapy techniques when teaching songwriting approaches in their classrooms.", "ko": "음악 교사는 교실에서 작곡 접근법을 가르칠 때 음악 치료 기법을 사용할 수 있다.", "chunks": [["Music teachers can use", "음악 교사들은 사용할 수 있다"], ["music therapy techniques", "음악 치료 기법을"], ["when teaching songwriting approaches", "작곡 접근법을 가르칠 때"], ["in their classrooms.", "교실에서."]]}, {"en": "Burton called musical compositions \"ubiquitous\" because of their extensive use in celebrations, holidays, and religious or political events.", "ko": "Burton은 기념행사, 명절, 그리고 종교적 또는 정치적 행사에서 음악 작곡이 광범위하게 사용되기 때문에 음악 작곡을 \"어디에나 있는\" 것이라고 불렀다.", "chunks": [["Burton called musical compositions \"ubiquitous\"", "Burton은 음악 작곡을 \"어디에나 있는\" 것이라고 불렀다"], ["because of their extensive use", "그것의 광범위한 사용 때문에"], ["in celebrations, holidays,", "기념행사, 명절,"], ["and religious or political events.", "그리고 종교적 또는 정치적 행사에서."]]}, {"en": "The songwriting process can be a translator of moods and feelings, a base of reference through its ubiquity.", "ko": "작곡 과정은 기분과 감정을 전달하는 역할을 할 수 있으며, 그것의 편재성을 통해 참고의 토대가 되기도 한다.", "chunks": [["The songwriting process can be", "작곡 과정은 ~이 될 수 있다"], ["a translator of moods and feelings,", "기분과 감정의 전달자,"], ["a base of reference", "참고의 토대,"], ["through its ubiquity.", "그것의 편재성을 통해."]]}, {"en": "Creating original musical works can be an important tool for developing an understanding of ourselves, others, and the cultural context of the world.", "ko": "독창적인 음악 작품을 만드는 것은 우리 자신, 타인, 그리고 세상의 문화적 맥락에 대한 이해를 발전시키는 중요한 도구가 될 수 있다.", "chunks": [["Creating original musical works", "독창적인 음악 작품을 만드는 것은"], ["can be an important tool", "중요한 도구가 될 수 있다"], ["for developing an understanding", "이해를 발전시키는"], ["of ourselves, others,", "우리 자신, 타인,"], ["and the cultural context of the world.", "그리고 세상의 문화적 맥락의."]]}, {"en": "As an extension of learning in the music classroom, songwriting activities have been found to provide students with opportunities to reflect on, apply, and learn from their culture in meaningful ways.", "ko": "음악 교실에서의 학습의 연장으로서, 작곡 활동은 학생들에게 의미 있는 방식으로 자신의 문화를 성찰하고, 적용하고, 그로부터 배울 기회를 제공하는 것으로 나타났다.", "chunks": [["As an extension of learning", "학습의 연장으로서"], ["in the music classroom,", "음악 교실에서의,"], ["songwriting activities have been found", "작곡 활동은 ~인 것으로 나타났다"], ["to provide students with opportunities", "학생들에게 기회를 제공하는 것으로"], ["to reflect on, apply,", "성찰하고, 적용하고,"], ["and learn from their culture", "그리고 자신의 문화에서 배우는"], ["in meaningful ways.", "의미 있는 방식으로."]]}, {"en": "In addition, the practice of composing lyrics and melodies can provide a space for students to grow, process emotions, and share feelings in a positive way.", "ko": "게다가, 가사와 멜로디를 작곡하는 연습은 학생들이 긍정적인 방식으로 성장하고, 감정을 처리하며, 감정을 공유할 수 있는 공간을 제공할 수 있다.", "chunks": [["In addition,", "게다가,"], ["the practice of composing lyrics and melodies", "가사와 멜로디를 작곡하는 연습은"], ["can provide a space", "공간을 제공할 수 있다"], ["for students to grow,", "학생들이 성장하고,"], ["process emotions,", "감정을 처리하고,"], ["and share feelings", "그리고 감정을 공유할"], ["in a positive way.", "긍정적인 방식으로."]]}], "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"중심의 작곡 음표를 둘러싸고 감정 전달자, 편재하는 참고 토대, 자기·타인·문화 이해, 감정 처리 공간 네 가지 기능이 방사형 점선으로 연결된 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">작곡 = 음악 치료 ↔ 교실 학습의 단일 도구</text>\n\n  <!-- 중심: 작곡 -->\n  <g transform=\"translate(300, 145)\">\n    <circle cx=\"0\" cy=\"0\" r=\"42\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n\n    <!-- 음표 (8분음표) -->\n    <g transform=\"translate(-3, -3)\">\n      <!-- 머리 -->\n      <ellipse cx=\"-6\" cy=\"12\" rx=\"9\" ry=\"6.5\" fill=\"#1a1a1a\" transform=\"rotate(-18 -6 12)\"/>\n      <!-- 기둥 -->\n      <line x1=\"2\" y1=\"9\" x2=\"2\" y2=\"-22\" stroke=\"#1a1a1a\" stroke-width=\"2.2\"/>\n      <!-- 깃발 -->\n      <path d=\"M 2 -22 Q 16 -18 16 -7 Q 16 -3 12 -1\" fill=\"#1a1a1a\"/>\n    </g>\n\n    <text x=\"0\" y=\"58\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">songwriting</text>\n  </g>\n\n  <!-- 가지 1: 감정 전달자 (좌상단) -->\n  <line x1=\"173\" y1=\"80\" x2=\"262\" y2=\"125\" stroke=\"#1FA34A\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\" opacity=\"0.7\"/>\n  <g transform=\"translate(110, 62)\">\n    <rect x=\"-72\" y=\"-18\" width=\"144\" height=\"42\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-weight=\"700\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\">mood translator</text>\n    <text x=\"0\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">감정 전달자</text>\n    <text x=\"0\" y=\"35\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">notes → feelings</text>\n  </g>\n\n  <!-- 가지 2: 편재 참고 토대 (우상단) -->\n  <line x1=\"427\" y1=\"80\" x2=\"338\" y2=\"125\" stroke=\"#1FA34A\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\" opacity=\"0.7\"/>\n  <g transform=\"translate(490, 62)\">\n    <rect x=\"-72\" y=\"-18\" width=\"144\" height=\"42\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-weight=\"700\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\">ubiquitous reference</text>\n    <text x=\"0\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">편재하는 참고 토대</text>\n    <text x=\"0\" y=\"35\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">holidays · ceremonies</text>\n  </g>\n\n  <!-- 가지 3: 자기·타인·문화 이해 (좌하단) -->\n  <line x1=\"173\" y1=\"215\" x2=\"262\" y2=\"170\" stroke=\"#1FA34A\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\" opacity=\"0.7\"/>\n  <g transform=\"translate(110, 232)\">\n    <rect x=\"-72\" y=\"-18\" width=\"144\" height=\"42\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-weight=\"700\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\">cultural understanding</text>\n    <text x=\"0\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">자기·타인·문화 이해</text>\n    <text x=\"0\" y=\"35\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">self · others · culture</text>\n  </g>\n\n  <!-- 가지 4: 감정 처리 공간 (우하단) -->\n  <line x1=\"427\" y1=\"215\" x2=\"338\" y2=\"170\" stroke=\"#1FA34A\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\" opacity=\"0.7\"/>\n  <g transform=\"translate(490, 232)\">\n    <rect x=\"-72\" y=\"-18\" width=\"144\" height=\"42\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-weight=\"700\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\">a space to grow</text>\n    <text x=\"0\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">감정 처리 공간</text>\n    <text x=\"0\" y=\"35\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">process · share emotions</text>\n  </g>\n</svg>", "caption": "작곡은 음악 치료와 교실 학습을 잇는 도구 — 감정 전달자·편재 참고·자기/타인/문화 이해·감정 처리 공간 네 가지 역할"}, {"no": "4", "title": "Sleep Deprivation and Academic Performance", "ktitle": "수면 부족과 학업", "field": "건강·학습", "page": "6회 04번 (주제)", "oneline": "학생들은 과제 위해 잠을 희생하며 성적에 도움이 된다고 믿는다.", "tldr": ["학생들은 과제 위해 잠을 희생하며 성적에 도움이 된다고 믿는다.", "연구는 반대다 — 하룻밤만 줄여도 집중이 떨어져 핵심 정보를 놓친다.", "기억 형성·문제해결 능력도 약해져 시험에서 실수가 는다."], "analogy": "휴대폰을 충전 안 하고 계속 쓰면 결국 꺼지죠. 잠을 줄여 공부하면 다음 날 뇌가 ‘방전’돼 집중도 기억도 안 돼, 오히려 손해예요.", "bg": "분야는 건강·학습이에요. 학생들이 과제를 위해 잠을 희생하며 성적에 도움이 된다고 믿는 통념이 배경입니다. → 연구가 이 통념과 ‘다른 이야기’를 하는지에 주목하며 읽으세요.", "flow": [{"kind": "통념", "t": "과제 위해 잠 희생이 성적에 도움?"}, {"kind": "반전", "t": "연구는 다르게 말한다"}, {"kind": "근거 ①", "t": "하룻밤 부족 → 집중 저하", "d": "아침 강의 핵심 정보를 놓침."}, {"kind": "근거 ②", "t": "기억 형성·문제해결 능력 저하"}, {"kind": "결론", "t": "잠 희생은 오히려 손해"}], "quiz": [["‘과제 위해 잠을 줄이는’ 관행에 대해 연구는 뭐라 하나?", "오히려 역효과 — 단 하룻밤 부족도 집중·기억·문제해결을 떨어뜨린다고 해요."], ["수면 부족이 구체적으로 무엇을 약화시키나?", "아침 강의 집중력, 새 개념을 유지하는 기억 형성, 수학·과학에 필요한 문제해결 능력이에요."], ["핵심 한 문장?", "과제를 위해 잠을 줄이는 건 집중·기억·문제해결을 떨어뜨려 오히려 손해다."]], "vocab": [["sacrifice", "희생하다"], ["rest", "휴식"], ["assignment", "과제·임무"], ["trade-off", "절충·교환"], ["practice", "관행·관례"], ["struggle to", "~하려 애쓰다·~하기 힘들어하다"]], "en": "Students often sacrifice rest to complete assignments, believing this trade-off helps their grades. Research tells a different story about this common practice. After just one night of reduced sleep, the brain struggles to focus during morning lectures, missing key information that will appear on exams. Memory formation, essential for retaining new concepts, weakens significantly when sleep cycles are interrupted regularly. Problem-solving abilities, critical for subjects like math and science, decline when fatigue sets in, leading to simple mistakes on tests. This lack of rest directly results in lower test scores and reduced classroom participation. Many notice they need twice as long to complete tasks when operating on insufficient rest. As assignments pile up, the cycle worsens, with each late night making the next day's learning less effective. The connection between regular, quality sleep and classroom success becomes clear when comparing well-rested students to their exhausted classmates during exams.", "ko": "학생들은 이러한 절충이 그들의 성적에 도움이 된다고 믿으면서 과제를 완수하기 위해 흔히 휴식을 희생한다. 연구는 이 일반적인 관행에 대해 다른 이야기를 한다. 단 하룻밤만 수면을 줄여도, 뇌는 아침 강의 시간에 집중하기 어려워 시험에 나올 핵심 정보를 놓치게 된다. 새로운 개념을 유지하는 데 필수적인 기억 형성은 수면 주기가 규칙적으로 중단되면 상당히 약화된다. 수학과 과학 같은 과목에 중요한 문제 해결 능력은 피로가 자리 잡으면 저하되어, 시험에서 단순한 실수로 이어진다. 이러한 휴식 부족은 더 낮은 시험 점수와 줄어든 수업 참여를 직접적으로 초래한다. 많은 학생들이 불충분한 휴식 상태에서 활동할 때 과제를 완수하는 데 두 배의 시간이 필요하다는 것을 알아차린다. 과제가 쌓이면서 악순환이 심해지고, 늦은 밤마다 다음 날 학습을 덜 효과적으로 만든다. 규칙적이고 양질의 수면과 수업의 성공 사이의 연관성은 시험 기간 동안 충분히 휴식을 취한 학생을 기진맥진한 반 친구들과 비교할 때 분명해진다.", "read": [{"en": "Students often sacrifice rest to complete assignments, believing this trade-off helps their grades.", "ko": "학생들은 이러한 절충이 그들의 성적에 도움이 된다고 믿으면서 과제를 완수하기 위해 흔히 휴식을 희생한다.", "chunks": [["Students often sacrifice rest", "학생들은 종종 휴식을 희생한다"], ["to complete assignments,", "과제를 완수하기 위해,"], ["believing this trade-off", "이러한 절충이 ~한다고 믿으면서"], ["helps their grades.", "그들의 성적에 도움이 된다고."]]}, {"en": "Research tells a different story about this common practice.", "ko": "연구는 이 일반적인 관행에 대해 다른 이야기를 한다.", "chunks": [["Research tells a different story", "연구는 다른 이야기를 한다"], ["about this common practice.", "이 일반적인 관행에 대해."]]}, {"en": "After just one night of reduced sleep, the brain struggles to focus during morning lectures, missing key information that will appear on exams.", "ko": "단 하룻밤만 수면을 줄여도, 뇌는 아침 강의 시간에 집중하기 어려워 시험에 나올 핵심 정보를 놓치게 된다.", "chunks": [["After just one night", "단 하룻밤만 ~한 후에"], ["of reduced sleep,", "수면을 줄인,"], ["the brain struggles to focus", "뇌는 집중하는 데 어려움을 겪는다"], ["during morning lectures,", "아침 강의 시간 동안,"], ["missing key information", "핵심 정보를 놓치면서"], ["that will appear on exams.", "시험에 나올."]]}, {"en": "Memory formation, essential for retaining new concepts, weakens significantly when sleep cycles are interrupted regularly.", "ko": "새로운 개념을 유지하는 데 필수적인 기억 형성은 수면 주기가 규칙적으로 중단되면 상당히 약화된다.", "chunks": [["Memory formation,", "기억 형성은,"], ["essential for retaining new concepts,", "새로운 개념을 유지하는 데 필수적인,"], ["weakens significantly", "상당히 약화된다"], ["when sleep cycles are interrupted regularly.", "수면 주기가 규칙적으로 중단될 때."]]}, {"en": "Problem-solving abilities, critical for subjects like math and science, decline when fatigue sets in, leading to simple mistakes on tests.", "ko": "수학과 과학 같은 과목에 중요한 문제 해결 능력은 피로가 자리 잡으면 저하되어, 시험에서 단순한 실수로 이어진다.", "chunks": [["Problem-solving abilities,", "문제 해결 능력은,"], ["critical for subjects like math and science,", "수학과 과학 같은 과목에 중요한,"], ["decline when fatigue sets in,", "피로가 자리 잡으면 저하된다,"], ["leading to simple mistakes on tests.", "시험에서의 단순한 실수로 이어지면서."]]}, {"en": "This lack of rest directly results in lower test scores and reduced classroom participation.", "ko": "이러한 휴식 부족은 더 낮은 시험 점수와 줄어든 수업 참여를 직접적으로 초래한다.", "chunks": [["This lack of rest", "이러한 휴식 부족은"], ["directly results in", "직접적으로 ~을 초래한다"], ["lower test scores", "더 낮은 시험 점수"], ["and reduced classroom participation.", "그리고 줄어든 수업 참여를."]]}, {"en": "Many notice they need twice as long to complete tasks when operating on insufficient rest.", "ko": "많은 학생들이 불충분한 휴식 상태에서 활동할 때 과제를 완수하는 데 두 배의 시간이 필요하다는 것을 알아차린다.", "chunks": [["Many notice", "많은 사람들이 알아차린다"], ["they need twice as long", "두 배의 시간이 필요하다는 것을"], ["to complete tasks", "과제를 완수하는 데"], ["when operating on insufficient rest.", "불충분한 휴식 상태에서 활동할 때."]]}, {"en": "As assignments pile up, the cycle worsens, with each late night making the next day's learning less effective.", "ko": "과제가 쌓이면서 악순환이 심해지고, 늦은 밤마다 다음 날 학습을 덜 효과적으로 만든다.", "chunks": [["As assignments pile up,", "과제가 쌓이면서,"], ["the cycle worsens,", "악순환이 심해진다,"], ["with each late night making", "늦은 밤마다 ~하게 만들면서"], ["the next day's learning less effective.", "다음 날 학습을 덜 효과적으로."]]}, {"en": "The connection between regular, quality sleep and classroom success becomes clear when comparing well-rested students to their exhausted classmates during exams.", "ko": "규칙적이고 양질의 수면과 수업의 성공 사이의 연관성은 시험 기간 동안 충분히 휴식을 취한 학생을 기진맥진한 반 친구들과 비교할 때 분명해진다.", "chunks": [["The connection", "연관성은"], ["between regular, quality sleep", "규칙적이고 양질의 수면과"], ["and classroom success", "수업의 성공 사이의"], ["becomes clear when comparing", "비교할 때 분명해진다"], ["well-rested students", "충분히 휴식을 취한 학생을"], ["to their exhausted classmates", "기진맥진한 반 친구들과"], ["during exams.", "시험 기간 동안."]]}], "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"수면 부족, 뇌 기능 저하, 점수와 참여 저하, 과제 누적의 4단계가 시계 방향으로 빨강 점선 화살표를 통해 순환하며 가운데 vicious cycle 라벨이 있는 악순환 그림\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">\"수면 희생 = 성적 향상\"은 통념 — 실상은 악순환</text>\n\n  <!-- 중앙 라벨 -->\n  <g transform=\"translate(300, 148)\">\n    <circle cx=\"0\" cy=\"0\" r=\"36\" fill=\"#fdf2f4\" str dth=\"1.4\"/>\n    <!-- 뇌 (단순화) -->\n    <g transform=\"translate(-48, 0)\">\n      <path d=\"M -10 -5 Q -12 -12 -5 -14 Q 0 -16 6 -14 Q 13 -12 11 -5 Q 13 2 8 6 Q 0 10 -5 6 Q -12 2 -10 -5 Z\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"-13\" x2=\"0\" y2=\"8\" stroke=\"#c8102e\" stroke-width=\"0.8\"/>\n      <!-- 화살표 ↓ -->\n      <line x1=\"0\" y1=\"14\" x2=\"0\" y2=\"22\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <polygon points=\"0,22 -3,18 3,18\" fill=\"#c8102e\"/>\n    </g>\n    <text x=\"6\" y=\"-15\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#1a1a1a\">② 뇌 기능 ↓</text>\n    <text x=\"6\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">focus · memory</text>\n    <text x=\"6\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">problem-solving</text>\n    <text x=\"6\" y=\"21\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">↓ during AM lectures</text>\n  </g>\n\n  <!-- 단계 ③: 점수·참여 ↓ (하단) -->\n  <g transform=\"translate(300, 250)\">\n    <rect x=\"-65\" y=\"-18\" width=\"130\" height=\"40\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <!-- 성적표 -->\n    <g transform=\"translate(-50, 1)\">\n      <rect x=\"-8\" y=\"-10\" width=\"16\" height=\"20\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"-5\" y1=\"-6\" x2=\"5\" y2=\"-6\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n      <line x1=\"-5\" y1=\"-2\" x2=\"5\" y2=\"-2\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n      <line x1=\"-5\" y1=\"2\" x2=\"5\" y2=\"2\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n      <line x1=\"-5\" y1=\"6\" x2=\"5\" y2=\"6\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n      <!-- 화살표 ↓ 옆에 -->\n      <line x1=\"12\" y1=\"-6\" x2=\"12\" y2=\"6\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <polygon points=\"12,6 9,2 15,2\" fill=\"#c8102e\"/>\n    </g>\n    <text x=\"2\" y=\"-4\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#1a1a1a\">③ 점수·참여 ↓</text>\n    <text x=\"2\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">lower scores · less engagement</text>\n  </g>\n\n  <!-- 단계 ④: 과제 쌓임 (좌측) -->\n  <g transform=\"translate(100, 148)\">\n    <rect x=\"-65\" y=\"-35\" width=\"130\" height=\"64\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <!-- 책 더미 -->\n    <g transform=\"translate(45, 0)\">\n      <rect x=\"-11\" y=\"-15\" width=\"22\" height=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n      <rect x=\"-13\" y=\"-9\" width=\"26\" height=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n      <rect x=\"-9\" y=\"-3\" width=\"18\" height=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n      <rect x=\"-12\" y=\"3\" width=\"24\" height=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n      <rect x=\"-10\" y=\"9\" width=\"20\" height=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n      <!-- 화살표 위 -->\n      <line x1=\"0\" y1=\"-22\" x2=\"0\" y2=\"-15\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <polygon points=\"0,-22 -3,-18 3,-18\" fill=\"#c8102e\"/>\n    </g>\n    <text x=\"-16\" y=\"-14\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#1a1a1a\">④ 과제 쌓임</text>\n    <text x=\"-16\" y=\"-1\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">assignments</text>\n    <text x=\"-16\" y=\"10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">pile up</text>\n    <text x=\"-16\" y=\"21\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">→ later nights</text>\n  </g>\n</svg>", "caption": "수면 부족 → 집중·기억·문제해결 ↓ → 점수·참여 ↓ → 과제 쌓임 → 더 늦은 밤 — 악순환"}, {"no": "5", "title": "Fishing as a Multispecies Framework", "ktitle": "낚시 — 인간만의 일이 아니다", "field": "생태·인류", "page": "6회 05번", "oneline": "낚시는 문명 이전부터 인류에 필수였다.", "tldr": ["낚시는 문명 이전부터 인류에 필수였다.", "그러나 인간만의 활동이 아니다 — 수많은 동물도 낚시한다.", "인간과 동물이 최고의 어장을 두고 경쟁하는 ‘다종 관계’다."], "analogy": "곰·새·사람이 모두 같은 강의 가장 좋은 길목에서 연어를 노리죠. 낚시는 사람 전유물이 아니라, 최고의 자리를 두고 여러 동물과 치열하게 다투는 일이에요.", "bg": "분야는 생태·인류예요. 낚시(fishing)가 인류에게 오래된 활동일 뿐 아니라 인간만의 것이 아니라는 점이 단서. → 낚시를 ‘여러 종이 얽힌(multispecies)’ 틀로 볼 때 무엇이 보이는지에 초점을 두고 읽으세요.", "flow": [{"kind": "배경", "t": "낚시 = 문명 이전부터 인류 필수"}, {"kind": "반전", "t": "인간만의 활동이 아니다", "d": "수많은 동물도 낚시한다."}, {"kind": "경쟁", "t": "최고 어장 두고 인간과 치열히 경쟁"}, {"kind": "관점", "t": "낚시 = ‘다종 관계’ 속 활동"}, {"kind": "결론", "t": "더 다양한 ‘다종’ 이야기가 필요"}], "quiz": [["글이 낚시에 대해 뒤집는 통념은?", "낚시가 ‘인간만의 고유 활동’이라는 생각 — 수많은 동물도 낚시를 해요."], ["낚시를 ‘다종 관계’로 보는 이유는?", "인간과 동물이 최고의 어장(어획지)을 두고 치열하게 경쟁하기 때문이에요."], ["핵심 한 문장?", "낚시는 인간만의 일이 아니라 동물과 경쟁하는 다종 생태 관계다."]], "vocab": [["integral", "필수적인·없어서는 안 될"], ["recorded history", "기록된 역사"], ["organized organize", "조직화된"], ["civilization civil", "문명"], ["remarkably re-", "놀랍게도"], ["uniquely unique", "고유하게·유일하게"]], "en": "Fishing has been integral to human life long before recorded history or organized civilization began. Remarkably, it is not a uniquely human activity—numerous animals also engage in fishing, relying on aquatic creatures as a vital food source in their natural habitats. The animal world intensely competes with humans over access to the best fishing and, as such, fishing is an activity much contested within its various multispecies relationships. Within this space there is not room to explore a more diverse and multispecies account of \"fishing.\" However, this exploration does make clear that the relationships embodied in fishing, between humans, animals, and technologies of capture, have changed little in terms of their mechanics for many thousands of years. However, the scale and consequences of fishing have shifted drastically over time. Therefore, fishing can serve as a symbolic framework to understand larger ecological tensions between humans and fellow species.", "ko": "낚시는 기록된 역사나 조직화된 문명이 시작되기 훨씬 전부터 인류의 삶에 필수적이었다. 놀랍게도, 그것은 인간만의 고유한 활동이 아니다 — 수많은 동물도 자연 서식지에서 수생 생물을 필수적인 식량원으로 삼아 낚시에 참여한다. 동물 세계는 최고의 어획지에 대한 접근권을 놓고 인간과 치열하게 경쟁하며, 그런 점에서 낚시는 다양한 다종 관계 내에서 매우 경쟁이 심한 활동이다. 이 공간 안에서는 \"낚시\"에 대한 더 다양하고 다종의 이야기를 탐구할 여지가 없다. 하지만, 이 탐구는 낚시에 구현된 인간·동물·포획 기술 사이의 관계가 수천 년 동안 역학 면에서 거의 변하지 않았다는 것을 분명하게 보여 준다. 하지만, 낚시의 규모와 결과는 시간이 지남에 따라 극적으로 변화해 왔다. 그러므로, 낚시는 인간과 다른 종 사이의 더 큰 생태적 긴장을 이해하기 위한 상징적인 틀의 역할을 할 수 있다.", "read": [{"en": "Fishing has been integral to human life long before recorded history or organized civilization began.", "ko": "낚시는 기록된 역사나 조직화된 문명이 시작되기 훨씬 전부터 인류의 삶에 필수적이었다.", "chunks": [["Fishing has been integral", "낚시는 필수적이었다"], ["to human life", "인류의 삶에"], ["long before recorded history", "기록된 역사 훨씬 전부터"], ["or organized civilization began.", "또는 조직화된 문명이 시작되기."]]}, {"en": "Remarkably, it is not a uniquely human activity—numerous animals also engage in fishing, relying on aquatic creatures as a vital food source in their natural habitats.", "ko": "놀랍게도, 그것은 인간만의 고유한 활동이 아니다 — 수많은 동물도 자연 서식지에서 수생 생물을 필수적인 식량원으로 삼아 낚시에 참여한다.", "chunks": [["Remarkably,", "놀랍게도,"], ["it is not a uniquely human activity—", "그것은 인간만의 고유한 활동이 아니다—"], ["numerous animals also engage in fishing,", "수많은 동물도 낚시에 참여한다,"], ["relying on aquatic creatures", "수생 생물에 의존하면서"], ["as a vital food source", "필수적인 식량원으로"], ["in their natural habitats.", "자연 서식지에서."]]}, {"en": "The animal world intensely competes with humans over access to the best fishing and, as such, fishing is an activity much contested within its various multispecies relationships.", "ko": "동물 세계는 최고의 어획지에 대한 접근권을 놓고 인간과 치열하게 경쟁하며, 그런 점에서 낚시는 다양한 다종 관계 내에서 매우 경쟁이 심한 활동이다.", "chunks": [["The animal world intensely competes", "동물 세계는 치열하게 경쟁한다"], ["with humans over access", "인간과 접근권을 놓고"], ["to the best fishing", "최고의 어획지에 대한"], ["and, as such,", "그리고, 그런 점에서,"], ["fishing is an activity much contested", "낚시는 매우 경쟁이 심한 활동이다"], ["within its various multispecies relationships.", "다양한 다종 관계 내에서."]]}, {"en": "Within this space there is not room to explore a more diverse and multispecies account of \"fishing.\" However, this exploration does make clear that the relationships embodied in fishing, between humans, animals, and technologies of capture, have changed little in terms of their mechanics for many thousands of years.", "ko": "이 공간 안에서는 \"낚시\"에 대한 더 다양하고 다종의 이야기를 탐구할 여지가 없다. 하지만, 이 탐구는 낚시에 구현된 인간·동물·포획 기술 사이의 관계가 수천 년 동안 역학 면에서 거의 변하지 않았다는 것을 분명하게 보여 준다.", "chunks": [["Within this space", "이 공간(글) 안에서는"], ["there is not room to explore", "탐구할 여지가 없다"], ["a more diverse and multispecies account", "더 다양하고 다종의 이야기를"], ["of \"fishing.\"", "\"낚시\"에 대한."], ["However, this exploration does make clear", "하지만, 이 탐구는 분명하게 보여 준다"], ["that the relationships embodied in fishing,", "낚시에 구현된 관계들이,"], ["between humans, animals, and technologies of capture,", "인간, 동물, 그리고 포획 기술 사이의,"], ["have changed little in terms of their mechanics", "역학 면에서 거의 변하지 않았다는 것을"], ["for many thousands of years.", "수천 년 동안."]]}, {"en": "However, the scale and consequences of fishing have shifted drastically over time.", "ko": "하지만, 낚시의 규모와 결과는 시간이 지남에 따라 극적으로 변화해 왔다.", "chunks": [["However, the scale and consequences", "하지만, 규모와 결과는"], ["of fishing have shifted drastically", "낚시의 극적으로 변화해 왔다"], ["over time.", "시간이 지남에 따라."]]}, {"en": "Therefore, fishing can serve as a symbolic framework to understand larger ecological tensions between humans and fellow species.", "ko": "그러므로, 낚시는 인간과 다른 종 사이의 더 큰 생태적 긴장을 이해하기 위한 상징적인 틀의 역할을 할 수 있다.", "chunks": [["Therefore, fishing can serve as", "그러므로, 낚시는 ~의 역할을 할 수 있다"], ["a symbolic framework", "상징적인 틀"], ["to understand larger ecological tensions", "더 큰 생태적 긴장을 이해하기 위한"], ["between humans and fellow species.", "인간과 다른 종 사이의."]]}], "metaphor": "<svg viewBox=\"0 0 600 295\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"좌측 사람·곰·왜가리가 모두 물고기를 낚는 다종 활동( ind": "상황", "t": "‘고양이 소유의 이점’ 기사를 쓰고 싶다"}, {"kind": "방법", "t": "‘Cat Fancy’ 과월호를 죽 훑어봄"}, {"kind": "발견", "t": "틈새 기사 — ‘성직자들의 고양이’"}, {"kind": "확장", "t": "1년 뒤 또 다른 영감 기사"}, {"kind": "결론", "t": "과월호 = 글감의 보고"}], "quiz": [["글감을 찾는 글의 방법은?", "쓰고 싶은 주제의 잡지 ‘과월호(지난 호)’를 죽 훑어보는 거예요."], ["‘성직자들의 고양이’ 기사 예가 보여주는 것은?", "과월호에서 생각지 못한 ‘틈새 각도’의 글감을 얻을 수 있다는 점이에요."], ["핵심 한 문장?", "잡지 과월호를 훑으면 새로운 글감·각도를 얻을 수 있다."]], "vocab": [["Suppose", "~라고 가정하다"], ["be interested in", "~에 관심이 있다"], ["ownership owner", "소유·소유권"], ["benefit", "이점·혜택"], ["read through", "~을 죽 읽다·통독하다"], ["back issue", "과월호·이전 호"]], "en": "Suppose you're interested in writing an article about the benefits of cat ownership. So you read through some back issues of Cat Fancy to get some ideas. In one issue, you find \"Clergy Cats: An Exclusive Look into the Lives of Religious Leaders and Their Feline Companions.\" The writer interviewed a Catholic bishop, a rabbi and two Protestant ministers about their cats. About a year later, the same magazine ran an article titled \"The Writer's Muse: Cats Help Inspire Their Owners' Creativity.\" This writer interviewed two professional writers about their cats and how cats inspire their creativity. These two articles suggest that Cat Fancy likes to run articles about how and why people in particular kinds of work like cats. So why not propose a story about \"Firefighters and Their Cats\" or \"Police Officers and Their Cats\"? → By consulting a magazine that deals with a field you want to write about, such as the benefits of cat ownership, you're likely to derive ideas appropriate for the field.", "ko": "여러분이 고양이를 소유하는 것의 이점에 관한 기사를 쓰는 데 관심이 있다고 가정해 보자. 그래서 여러분은 몇 가지 아이디어를 얻기 위해 'Cat Fancy' 과월호 몇 권을 죽 읽는다. 한 호에서 여러분은 '성직자들의 고양이: 종교 지도자들의 삶과 그들의 고양이 동반자들의 독점적인 고찰'이라는 기사를 발견한다. 그 작가는 그들의 고양이에 대해 가톨릭 주교, 랍비, 그리고 두 명의 개신교 목사를 인터뷰했다. 약 1년 후, 같은 잡지는 '작가의 영감: 고양이는 주인의 창의성을 자극하는 것을 돕는다'라는 제목의 기사를 실었다. 이 작가는 그들의 고양이와 고양이가 어떻게 그들의 창의성을 자극하는지에 대해 두 명의 전문 작가를 인터뷰했다. 이 두 기사는 'Cat Fancy'가 특정한 종류의 일을 하는 사람들이 어떻게 그리고 왜 고양이를 좋아하는지에 대한 기사를 싣기를 좋아한다는 것을 시사한다. 그래서 '소방관과 그들의 고양이' 또는 '경찰관과 그들의 고양이'에 대한 기사를 제안하는 것은 어떨까? → 여러분이 글 쓰고 싶은 분야, 예를 들어 고양이 소유의 이점과 같은 분야를 다루는 잡지를 참고함으로써, 여러분은 그 분야에 적합한 아이디어를 얻을 가능성이 높다.", "read": [{"en": "Suppose you're interested in writing an article about the benefits of cat ownership.", "ko": "여러분이 고양이를 소유하는 것의 이점에 관한 기사를 쓰는 데 관심이 있다고 가정해 보자.", "chunks": [["Suppose", "가정해 보자"], ["you're interested in writing an article", "여러분이 기사 쓰는 데 관심이 있다고"], ["about the benefits of cat ownership.", "고양이 소유의 이점에 관한."]]}, {"en": "So you read through some back issues of Cat Fancy to get some ideas.", "ko": "그래서 여러분은 몇 가지 아이디어를 얻기 위해 'Cat Fancy' 과월호 몇 권을 죽 읽는다.", "chunks": [["So you read through", "그래서 여러분은 죽 읽는다"], ["some back issues of Cat Fancy", "'Cat Fancy' 과월호 몇 권을"], ["to get some ideas.", "몇 가지 아이디어를 얻기 위해."]]}, {"en": "In one issue, you find \"Clergy Cats: An Exclusive Look into the Lives of Religious Leaders and Their Feline Companions.\" The writer interviewed a Catholic bishop, a rabbi and two Protestant ministers about their cats.", "ko": "한 호에서 여러분은 '성직자들의 고양이: 종교 지도자들의 삶과 그들의 고양이 동반자들의 독점적인 고찰'이라는 기사를 발견한다. 그 작가는 그들의 고양이에 대해 가톨릭 주교, 랍비, 그리고 두 명의 개신교 목사를 인터뷰했다.", "chunks": [["In one issue, you find", "한 호에서 여러분은 발견한다"], ["\"Clergy Cats: An Exclusive Look", "\"성직자들의 고양이: 독점적인 고찰"], ["into the Lives of Religious Leaders", "종교 지도자들의 삶에 대한"], ["and Their Feline Companions.\"", "그리고 그들의 고양이 동반자들의.\""], ["The writer interviewed", "그 작가는 인터뷰했다"], ["a Catholic bishop, a rabbi", "가톨릭 주교, 랍비"], ["and two Protestant ministers", "그리고 두 명의 개신교 목사를"], ["about their cats.", "그들의 고양이에 대해."]]}, {"en": "About a year later, the same magazine ran an article titled \"The Writer's Muse: Cats Help Inspire Their Owners' Creativity.\" This writer interviewed two professional writers about their cats and how cats inspire their creativity.", "ko": "약 1년 후, 같은 잡지는 '작가의 영감: 고양이는 주인의 창의성을 자극하는 것을 돕는다'라는 제목의 기사를 실었다. 이 작가는 그들의 고양이와 고양이가 어떻게 그들의 창의성을 자극하는지에 대해 두 명의 전문 작가를 인터뷰했다.", "chunks": [["About a year later,", "약 1년 후,"], ["the same magazine ran an article", "같은 잡지는 기사를 실었다"], ["titled \"The Writer's Muse:", "\"작가의 영감:"], ["Cats Help Inspire Their Owners' Creativity.\"", "고양이는 주인의 창의성을 자극하는 것을 돕는다\"라는 제목의."], ["This writer interviewed", "이 작가는 인터뷰했다"], ["two professional writers", "두 명의 전문 작가를"], ["about their cats", "그들의 고양이에 대해"], ["and how cats inspire their creativity.", "그리고 고양이가 어떻게 그들의 창의성을 자극하는지에 대해."]]}, {"en": "These two articles suggest that Cat Fancy likes to run articles about how and why people in particular kinds of work like cats.", "ko": "이 두 기사는 'Cat Fancy'가 특정한 종류의 일을 하는 사람들이 어떻게 그리고 왜 고양이를 좋아하는지에 대한 기사를 싣기를 좋아한다는 것을 시사한다.", "chunks": [["These two articles suggest", "이 두 기사는 시사한다"], ["that Cat Fancy likes to run articles", "'Cat Fancy'가 기사를 싣는 것을 좋아한다는 것을"], ["about how and why", "어떻게 그리고 왜에 대한"], ["people in particular kinds of work", "특정한 종류의 일을 하는 사람들이"], ["like cats.", "고양이를 좋아하는지."]]}, {"en": "So why not propose a story about \"Firefighters and Their Cats\" or \"Police Officers and Their Cats\"?", "ko": "그래서 '소방관과 그들의 고양이' 또는 '경찰관과 그들의 고양이'에 대한 기사를 제안하는 것은 어떨까?", "chunks": [["So why not propose a story", "그래서 기사를 제안하는 것은 어떨까"], ["about \"Firefighters and Their Cats\"", "\"소방관과 그들의 고양이\"에 대한"], ["or \"Police Officers and Their Cats\"?", "또는 \"경찰관과 그들의 고양이\"?"]]}, {"en": "→ By consulting a magazine that deals with a field you want to write about, such as the benefits of cat ownership, you're likely to derive ideas appropriate for the field.", "ko": "→ 여러분이 글 쓰고 싶은 분야, 예를 들어 고양이 소유의 이점과 같은 분야를 다루는 잡지를 참고함으로써, 여러분은 그 분야에 적합한 아이디어를 얻을 가능성이 높다.", "chunks": [["→ By consulting a magazine", "→ 잡지를 참고함으로써"], ["that deals with a field", "한 분야를 다루는"], ["you want to write about,", "여러분이 글 쓰고 싶은,"], ["such as the benefits of cat ownership,", "고양이 소유의 이점과 같은,"], ["you're likely to derive ideas", "여러분은 아이디어를 얻을 가능성이 높다"], ["appropriate for the field.", "그 분야에 적합한."]]}], "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"좌측 Cat Fancy 두 호(성직자 고양이·작가 고양이)에서 [직업군 + 고양이] 패턴이 추출되고, 우측 빈 슬롯에 소방관 고양이·경찰관 고양이가 끼워지는 패턴 추출과 끼움 그림.\">\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">Cat Fancy 과월호 → 패턴 발견 → 새 아이디어</text>\n\n  <!-- 좌측: 두 호 (Cat Fancy back issues) -->\n  <g transform=\"translate(15, 35)\">\n    <text x=\"85\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\">① 과월호 참고</text>\n    <rect x=\"0\" y=\"0\" width=\"170\" height=\"195\" fill=\"#f6f6f6\" fill-opacity=\"0.5\" stroke=\"#999\" stroke-width=\"1.2\"/>\n\n    <!-- Issue 1: Clergy Cats -->\n    <g transform=\"translate(85, 50)\">\n      <!-- 책 표지 -->\n      <rect x=\"-55\" y=\"-32\" width=\"110\" height=\"55\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <rect x=\"-55\" y=\"-32\" width=\"110\" height=\"11\" fill=\"#1a1a1a\"/>\n      <text x=\"0\" y=\"-24\" font-family=\"Noto Serif\" font-style=\"italic\" font-weight=\"700\" font-size=\"7\" text-anchor=\"middle\" fill=\"#ffffff\">Cat Fancy</text>\n      <!-- 성직자 머리 (십자가 + 칼라) -->\n      <g transform=\"translate(-30, 0)\">\n        <circle cx=\"0\" cy=\"-4\" r=\"6.5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <circle cx=\"-2\" cy=\"-5\" r=\"0.7\" fill=\"#1a1a1a\"/>\n        <circle cx=\"2\" cy=\"-5\" r=\"0.7\" fill=\"#1a1a1a\"/>\n        <!-- 사제 칼라 (목) -->\n        <path d=\"M -5 3 L -5 8 L 5 8 L 5 3\" fill=\"#1a1a1a\"/>\n        <rect x=\"-2\" y=\"4\" width=\"4\" height=\"3\" fill=\"#ffffff\"/>\n        <!-- 십자가 (위) -->\n        <g transform=\"translate(0, -18)\">\n          <line x1=\"0\" y1=\"-3\" x2=\"0\" y2=\"3\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n          <line x1=\"-2\" y1=\"-1\" x2=\"2\" y2=\"-1\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        </g>\n      </g>\n      <!-- + -->\n      <text x=\"0\" y=\"3\" e\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/>\n    \n    <!-- 템플릿 표시 -->\n    <g transform=\"translate(75, 40)\">\n      <!-- [Occupation] 슬롯 -->\n      <rect x=\"-50\" y=\"-10\" width=\"50\" height=\"22\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n      <text x=\"-25\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">[occupation]</text>\n      <!-- + -->\n      <text x=\"8\" y=\"6\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c8102e\">+</text>\n      <!-- 고양이 슬롯 (고정) -->\n      <g transform=\"translate(30, 1)\">\n        <ellipse cx=\"0\" cy=\"3\" rx=\"9\" ry=\"5\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n        <circle cx=\"-9\" cy=\"-2\" r=\"5\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n        <polygon points=\"-12,-6 -10,-10 -8,-6\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n        <polygon points=\"-7,-6 -5,-10 -3,-6\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"0.9\"/>\n        <circle cx=\"-11\" cy=\"-2\" r=\"0.5\" fill=\"#c8102e\"/>\n        <circle cx=\"-7\" cy=\"-2\" r=\"0.5\" fill=\"#c8102e\"/>\n        <path d=\"M 8 3 Q 14 -2 12 -8\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      </g>\n    </g>\n    \n    <text x=\"75\" y=\"85\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">\"specific lines of work + cats\"</text>\n    <text x=\"75\" y=\"100\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">잡지가 좋아하는 패턴</text>\n  </g>\n\n  <!-- 화살표 2 -->\n  <g transform=\"translate(385, 125)\">\n    <line x1=\"0\" y1=\"0\" x2=\"25\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n    <polygon points=\"25,0 18,-5 18,5\" fill=\"#1a1a1a\"/>\n  </g>\n\n  <!-- 우측: 새 끼움 -->\n  <g transform=\"translate(420, 35)\">\n    <tex " fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <circle cx=\"-9\" cy=\"-2\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n        <polygon points=\"-12,-6 -10,-10 -8,-6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        <polygon points=\"-7,-6 -5,-10 -3,-6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n        <circle cx=\"-11\" cy=\"-2\" r=\"0.6\" fill=\"#1a1a1a\"/>\n        <circle cx=\"-7\" cy=\"-2\" r=\"0.6\" fill=\"#1a1a1a\"/>\n        <path d=\"M 8 3 Q 14 -2 12 -8\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      </g>\n      <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-weight=\"700\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">\"Police Cats?\"</text>\n    </g>\n  </g>\n\n  <!-- 하단 요약 (요약문 답안) -->\n  <text x=\"300\" y=\"252\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">→ (A) <tspan fill=\"#1FA34A\">consulting</tspan> a magazine → (B) ideas <tspan fill=\"#1FA34A\">appropriate</tspan> for the field</text>\n</svg>", "caption": "잡지 참고 → 직업군별 고양이 패턴(성직자·작가) 발견 → 같은 패턴에 새 직업군(소방관·경찰) 끼움 = 분야 적합 아이디어"}]};

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

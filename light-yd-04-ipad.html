<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 Light 영어독해연습 04강 (5지문)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 Light 영어독해연습 04강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-ipad">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 Light 영어독해연습 04강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 Light 영어독해연습 04강 5개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */

야 한다고 글이 말하려는지에 주목하며 읽으세요.", "flow": [{"kind": "단서", "t": "어른의 좋은 기억엔 공통 주제가 있다", "cls": "pivot"}, {"kind": "내용", "t": "야외·상상 놀이, 모험, 동생 돌봄"}, {"kind": "문제", "t": "영유아 프로그램은 그 환경을 책임 안 짐", "d": "무심함·규정의 엄격한 해석 때문."}, {"kind": "결론", "t": "‘우수=규정’을 넘어 — 환경이 곧 기억", "cls": "close"}], "vocab": [["listen closely to", "~을 유심히/주의 깊게 듣다"], ["thrive", "잘 자라다·번성하다"], ["common theme", "공통 주제"], ["cupboard", "찬장"], ["raid", "뒤지다·털다·급습하다"], ["take risks", "위험을 감수하다"], ["take care of", "~을 돌보다"], ["be responsible for", "~에 책임이 있다"]], "quiz": [["어른들의 ‘좋은 어린 시절 기억’의 공통 주제는?", "끝없는 야외 활동, 상상 놀이, 위험 감수(모험), 동생 돌봄 같은 것들이에요."], ["글이 영유아 교육에 요구하는 변화는?", "‘우수함 = 규정 준수’라는 생각을 넘어, 아이의 좋은 기억을 만드는 ‘환경’을 책임지라는 거예요."], ["핵심 한 문장?", "우리가 만드는 환경이 곧 아이의 어린 시절 기억이 된다."]], "en": "When you listen closely to the stories that adults tell of their favorite childhood memories, you get a picture of an environment in which children joyfully thrive. There are common themes in most of these memories: endless hours outdoors, fantasy play and inventions, raiding the refrigerator and cupboards when hungry, taking risks, and taking care of younger children. Sadly, too many early care and education programs don’t think of themselves as responsible for creating children’s favorite memories. In fact, many children today are denied some of the most pleasurable memories of childhood because of thoughtlessness or rigid interpretations of standards and regulations. The early childhood field must go beyond the idea of equating quality with being compliant with regulations. We must recognize that the environments we create are shaping children’s memories and their identities about who they are in the world and what they deserve.", "ko": "어른들이 자신이 가장 좋아하는 어린 시절의 기억에 관해 말하는 이야기를 유심히 들어 보면, 아이들이 즐겁게 잘 자라는 환경의 모습이 그려진다. 이런 기억의 대부분에는 공통된 주제, 즉 끝없는 야외 활동 시간, 상상 놀이와 발명, 배고플 때 냉장고와 찬장을 뒤지는 것, 위험을 감수하는 것, 그리고 동생을 돌보는 것이 있다. 안타깝게도, 너무 많은 영유아 보육 및 교육 프로그램들은 아이들이 가장 좋아할 기억을 만들어내는 데 스스로 책임이 있다는 생각을 하지 않는다. 사실 오늘날 많은 아이들에게는, 무심함이나 기준과 규정의 엄격한 해석 때문에 어린 시절의 가장 즐거운 기억 중 일부가 주어지지 않는다. 영유아 분야는 우수함을 규정을 따르는 것과 동일시하는 생각을 넘어서야 한다. 우리는 우리가 만들어 내는 환경이 아이들의 기억과, 그들이 세상 속에서 어떤 존재이고 (자신이) 무엇을 누릴 자격이 있는지에 관한 그들의 정체성을 형성한다는 사실을 인식해야 한다.", "read": [{"en": "When you listen closely to the stories that adults tell of their favorite childhood memories, you get a picture of an environment in which children joyfully thrive.", "ko": "어른들이 자신이 가장 좋아하는 어린 시절의 기억에 관해 말하는 이야기를 유심히 들어 보면, 아이들이 즐겁게 잘 자라는 환경의 모습이 그려진다.", "chunks": [["When you listen closely", "여러분이 유심히 들으면"], ["to the stories", "그 이야기들을"], ["that adults tell", "어른들이 말하는"], ["of their favorite childhood memories,", "자신이 가장 좋아하는 어린 시절 기억에 관해,"], ["you get a picture", "여러분은 그림을 얻게 된다"], ["of an environment", "어떤 환경의 (모습이 그려진다)"], ["in which children", "그 환경 안에서 아이들이"], ["joyfully thrive.", "즐겁게 잘 자라는"]]}, {"en": "There are common themes in most of these memories: endless hours outdoors, fantasy play and inventions, raiding the refrigerator and cupboards when hungry, taking risks, and taking care of younger children.", "ko": "이런 기억의 대부분에는 공통된 주제, 즉 끝없는 야외 활동 시간, 상상 놀이와 발명, 배고플 때 냉장고와 찬장을 뒤지는 것, 위험을 감수하는 것, 그리고 동생을 돌보는 것이 있다.", "chunks": [["There are common themes", "공통된 주제들이 있다"], ["in most of these memories:", "이런 기억의 대부분에는:"], ["endless hours outdoors,", "끝없는 야외 활동 시간,"], ["fantasy play and inventions,", "상상 놀이와 발명품,"], ["raiding the refrigerator and cupboards", "냉장고와 찬장을 뒤지기"], ["when hungry,", "배고플 때,"], ["taking risks,", "위험을 감수하기,"], ["and taking care of younger children.", "그리고 동생을 돌보기."]]}, {"en": "Sadly, too many early care and education programs don’t think of themselves as responsible for creating children’s favorite memories.", "ko": "안타깝게도, 너무 많은 영유아 보육 및 교육 프로그램들은 아이들이 가장 좋아할 기억을 만들어내는 데 스스로 책임이 있다는 생각을 하지 않는다.", "chunks": [["Sadly,", "안타깝게도,"], ["too many early care and education programs", "너무 많은 영유아 보육 및 교육 프로그램들은"], ["don’t think of themselves", "스스로를 생각하지 않는다"], ["as responsible", "책임이 있다고"], ["for creating", "만들어내는 것에 대한"], ["children’s favorite memories.", "아이들이 가장 좋아할 기억을."]]}, {"en": "In fact, many children today are denied some of the most pleasurable memories of childhood because of thoughtlessness or rigid interpretations of standards and regulations.", "ko": "사실 오늘날 많은 아이들에게는, 무심함이나 기준과 규정의 엄격한 해석 때문에 어린 시절의 가장 즐거운 기억 중 일부가 주어지지 않는다.", "chunks": [["In fact,", "사실,"], ["many children today", "오늘날 많은 아이들에게는"], ["are denied", "주어지지 않는다"], ["some of the most pleasurable memories of childhood", "어린 시절의 가장 즐거운 기억 중 일부가"], ["because of thoughtlessness", "무심함이나"], ["or rigid interpretations", "엄격한 해석 때문에"], ["of standards and regulations.", "기준과 규정에 대한."]]}, {"en": "The early childhood field must go beyond the idea of equating quality with being compliant with regulations.", "ko": "영유아 분야는 우수함을 규정을 따르는 것과 동일시하는 생각을 넘어서야 한다.", "chunks": [["The early childhood field", "영유아 분야는"], ["must go beyond", "넘어서야 한다"], ["the idea", "~이라는 생각을"], ["of equating quality", "우수함을 동일시하는"], ["with being compliant", "~인 것과"], ["with regulations.", "규정을 따르는"]]}, {"en": "We must recognize that the environments we create are shaping children’s memories and their identities about who they are in the world and what they deserve.", "ko": "우리는 우리가 만들어 내는 환경이 아이들의 기억과, 그들이 세상 속에서 어떤 존재이고 (자신이) 무엇을 누릴 자격이 있는지에 관한 그들의 정체성을 형성한다는 사실을 인식해야 한다.", "chunks": [["We must recognize", "우리는 인식해야 한다"], ["that the environments we create", "우리가 만들어 내는 그 환경이"], ["are shaping", "형성하고 있다는 것을"], ["children’s memories and their identities", "아이들의 기억과 그들의 정체성을"], ["about who they are", "그들이 누구인지에 관한"], ["in the world", "이 세상에서"], ["and what they deserve.", "그리고 그들이 누릴 자격이 있는 것이 무엇인지에 관한."]]}]}, {"no": "20", "title": "Social Media Formalizes Casual Speech Acts", "ktitle": "SNS가 일상 언어를 ‘기록’으로", "field": "사회·미디어", "page": "p27 no20", "oneline": "SNS는 <span class='r'>일상적·일회성 언어 행위</span>를 <span class='g'>공식화된 기록</span>으로 바꿔 — 공적 영역에서 <span class='g'>광범위·장기적 영향</span>을 갖게 만든다. 사적·공적 소통의 본질이 변모한다.", "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 일회성 잡담과 쪽지가 점선으로 휘발되는 모습과, SNS 변환 화살표를 거쳐 오른쪽 공식 기록물(post·tweet)로 영구화되는 그림\">\n  <!-- 좌측: 옛 일회성 발화 (휘발) -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"120\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">옛 — 일회성 · 휘발</text>\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"180\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n\n    <!-- 말풍선 1 (잡담) -->\n    <g transform=\"translate(60, 50)\" opacity=\"0.8\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"38\" ry=\"18\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\">\"hi, how are you?\"</text>\n      <circle cx=\"-28\" cy=\"14\" r=\"3\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1\" stroke-dasharray=\"2 1\"/>\n    </g>\n\n    <!-- 말풍선 2 (쪽지) -->\n    <g transform=\"translate(170, 60)\" opacity=\"0.6\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"32\" ry=\"16\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">\"see you\"</text>\n    </g>\n\n    <!-- 말풍선 3 (안부) -->\n    <g transform=\"translate(85, 110)\" opacity=\"0.4\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"40\" ry=\"16\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">\"vacation photo\"</text>\n    </g>\n\n    <!-- 말풍선 4 (인사) -->\n    <g transform=\"translate(180, 125)\" opacity=\"0.3\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"28\" ry=\"13\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"3 2\"/>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">\"chat\"</text>\n    </g>\n\n    <!-- 휘발 효과 (점들 위로 흩어짐) -->\n    <g fill=\"#c8102e\" opacity=\"0.3\">\n      <circle cx=\"50\" cy=\"20\" r=\"1.5\"/>\n      <circle cx=\"100\" cy=\"25\" r=\"1\"/>\n      <circle cx=\"150\" cy=\"30\" r=\"1.5\"/>\n      <circle cx=\"200\" cy=\"20\" r=\"1\"/>\n    </g>\n\n    <text x=\"120\" y=\"160\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">informal · short-lived · evaporates</text>\n  </g>\n\n  <!-- 가운데: SNS 변환 화살표 -->\n  <g transform=\"translate(265, 105)\">\n    <line x1=\"0\" y1=\"0\" x2=\"50\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"50,0 42,-5 42,5\" fill=\"#1FA34A\"/>\n    <text x=\"25\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">SNS</text>\n    <text x=\"25\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">변환</text>\n  </g>\n\n  <!-- 우측: 공식 영구 기록 -->\n  <g transform=\"translate(320, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">SNS — 공식화 · 영구</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"180\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 기록 박스 (직사각형 - 게시물) -->\n    <g transform=\"translate(135, 90)\">\n      <!-- post 1 -->\n      <rect x=\"-110\" y=\"-58\" width=\"220\" height=\"38\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"-100\" y=\"-43\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1FA34A\">@user · 2026.05.21</text>\n      <text x=\"-100\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" fill=\"#1a1a1a\">\"hi, how are you?\"</text>\n      <text x=\"100\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#5e5e5e\">♡ 124</text>\n\n      <!-- post 2 -->\n      <rect x=\"-110\" y=\"-15\" width=\"220\" height=\"38\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"-100\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1FA34A\">@user · 2026.05.21</text>\n      <text x=\"-100\" y=\"13\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" fill=\"#1a1a1a\">vacation photo posted</text>\n      <text x=\"100\" y=\"13\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#5e5e5e\">♡ 89</text>\n\n      <!-- post 3 -->\n      <rect x=\"-110\" y=\"28\" width=\"220\" height=\"38\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"-100\" y=\"43\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1FA34A\">@user · 2026.05.21</text>\n      <text x=\"-100\" y=\"56\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" fill=\"#1a1a1a\">\"see you\" — status</text>\n      <text x=\"100\" y=\"56\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#5e5e5e\">♡ 56</text>\n    </g>\n\n    <text x=\"135\" y=\"170\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">formal · long-lived · permanent record</text>\n  </g>\n\n  <!-- 하단 라벨 -->\n  <text x=\"300\" y=\"235\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">private speech acts now have wide · lasting public impact</text>\n</svg>", "caption": "옛 일회성 발화(잡담·쪽지·안부 — 점선·휘발)가 SNS를 거치면 공식화된 기록(post·tweet·sharing)으로 바뀌어 광범위·장기 영향을 갖는다.", "tldr": ["대화·잡담·안부 같은 건 원래 특정 개인과만 나누던 ‘순간적’ 행위였다.", "SNS는 이를 ‘공식화된 기록’으로 바꾼다.", "즉석 발언이 광범위·오래가는 공적 영향을 갖게 됐다 — 소통의 본질 변화."], "analogy": "예전엔 친구한테 ‘쪽지’로 하던 말을, 이제는 전광판에 띄워 모두가 오래 보는 셈이에요. 같은 말도 ‘기록·공개’되면 무게가 달라지죠.", "bg": "분야는 사회·미디어예요. 예전엔 비공식적·일회적이던 일상 언어 행위(대화·잡담·안부, speech acts)가 SNS로 어떻게 바뀌는지를 다룹니다. → 사적이고 덧없던 소통이 ‘공식 기록’이 될 때 무엇이 달라지는지 생각하며 읽으세요.", "flow": [{"kind": "과거", "t": "대화·잡담 = 일시적·사적", "d": "특정 개인과만 공유되던 순간적 행위."}, {"kind": "변화", "t": "SNS가 ‘공식 기록’으로 바꿈"}, {"kind": "효과", "t": "즉석 발언이 ‘공적 영역’으로 방출"}, {"kind": "결론", "t": "사적·공적 소통의 본질이 변모", "cls": "close"}], "vocab": [["permeate", "스며들다·침투하다"], ["social media platform", "일시적인·오래가지 않는"], ["manifestation", "순간적인·금세 사라지는"], ["speech act", "공식화된 기록·각인"], ["embedded", "(성격·가치 등을) 띠다·갖게 되다"], ["utterance", "공적 영역"]], "quiz": [["SNS가 일으킨 ‘가장 큰 변화’는?", "일상적·일시적이던 언어 행위를 ‘공식화된 기록’으로 바꾼 점이에요."], ["그래서 즉석 발언은 어떻게 되나?", "광범위하고 오래 지속되는 영향을 미칠 수 있는 ‘공적 영역’으로 방출돼요."], ["핵심 한 문장?", "SNS는 일시적·사적이던 말을 공개된 기록으로 바꿔 그 무게를 키운다."]], "en": "Many of the habits that have recently become permeated by social media platforms used to be informal and short-lived manifestations of social life. Talking to friends, exchanging gossip, showing holiday pictures, writing notes, checking on a friend’s well-being, or watching a neighbor’s home video used to be casual, evanescent (speech) acts, commonly shared only with selected individuals. A major change is that through social media, these casual speech acts have turned into formalized inscriptions, which, once embedded in the larger economy of wider publics, take on a different value. Utterances previously expressed offhandedly are now released into a public domain where they can have far-reaching and long-lasting effects. Social media platforms have unquestionably altered the nature of private and public communication.", "ko": "최근 소셜 미디어 플랫폼에 의해 스며들게 된 습관 중 많은 것이 예전에는 비공식적이고 일시적인 사회생활의 표현이었다. 친구와 대화하기, 잡담 주고받기, 휴가 사진 보여 주기, 쪽지 쓰기, 친구의 안부 확인하기, 또는 이웃의 홈 비디오 시청하기는 일상적인 순간적 (언어) 행위로, 주로 특정 개인과만 공유되었다. 가장 큰 변화는 소셜 미디어를 통해 이러한 일상적인 언어 행위가 공식화된 기록으로 바뀌었는데, 그것은 일단 더 폭넓은 대중의 더 큰 경제에 끼워 넣어지면 다른 가치를 띤다는 점이다. 과거에는 즉석에서 표현되던 발언이 이제는 광범위하고 오래 지속되는 영향을 미칠 수 있는 공적인 영역으로 방출된다. 소셜 미디어 플랫폼은 의심할 여지 없이 사적·공적 의사소통의 본질을 변화시켜 왔다.", "read": [{"en": "Many of the habits that have recently become permeated by social media platforms used to be informal and short-lived manifestations of social life.", "ko": "최근 소셜 미디어 플랫폼에 의해 스며들게 된 습관 중 많은 것이 예전에는 비공식적이고 일시적인 사회생활의 표현이었다.", "chunks": [["Many of the habits", "많은 습관 중"], ["that have recently become permeated", "최근 스며들게 된"], ["by social media platforms", "소셜 미디어 플랫폼에 의해"], ["used to be informal", "예전에는 비공식적이고"], ["and short-lived manifestations", "일시적인 표현이었다"], ["of social life.", "사회생활의."]]}, {"en": "Talking to friends, exchanging gossip, showing holiday pictures, writing notes, checking on a friend’s well-being, or watching a neighbor’s home video used to be casual, evanescent (speech) acts, commonly shared only with selected individuals.", "ko": "친구와 대화하기, 잡담 주고받기, 휴가 사진 보여 주기, 쪽지 쓰기, 친구의 안부 확인하기, 또는 이웃의 홈 비디오 시청하기는 일상적인 순간적 (언어) 행위로, 주로 특정 개인과만 공유되었다.", "chunks": [["Talking to friends,", "친구와 대화하기,"], ["exchanging gossip,", "잡담 주고받기,"], ["showing holiday pictures,", "휴가 사진 보여주기,"], ["writing notes,", "쪽지 쓰기,"], ["checking on a friend’s well-being,", "친구의 안부 확인하기,"], ["or watching a neighbor’s home video", "또는 이웃의 홈 비디오 시청하기는"], ["used to be casual, evanescent (speech) acts,", "일상적이고 순간적인 (언어) 행위였다,"], ["commonly shared", "주로 공유되는"], ["only with selected individuals.", "특정 개인과만."]]}, {"en": "A major change is that through social media, these casual speech acts have turned into formalized inscriptions, which, once embedded in the larger economy of wider publics, take on a different value.", "ko": "가장 큰 변화는 소셜 미디어를 통해 이러한 일상적인 언어 행위가 공식화된 기록으로 바뀌었는데, 그것은 일단 더 폭넓은 대중의 더 큰 경제에 끼워 넣어지면 다른 가치를 띤다는 점이다.", "chunks": [["A major change is", "가장 큰 변화는"], ["that through social media,", "소셜 미디어를 통해,"], ["these casual speech acts", "이러한 일상적인 언어 행위가"], ["have turned into formalized inscriptions,", "공식화된 기록으로 바뀌었다는 것이다,"], ["which, once embedded", "그것은 일단 끼워 넣어지면"], ["in the larger economy of wider publics,", "더 폭넓은 대중의 더 큰 경제에,"], ["take on a different value.", "다른 가치를 띤다."]]}, {"en": "Utterances previously expressed offhandedly are now released into a public domain where they can have far-reaching and long-lasting effects.", "ko": "과거에는 즉석에서 표현되던 발언이 이제는 광범위하고 오래 지속되는 영향을 미칠 수 있는 공적인 영역으로 방출된다.", "chunks": [["Utterances", "발언이"], ["previously expressed offhandedly", "과거에는 즉석에서 표현되던"], ["are now released", "이제는 방출된다"], ["into a public domain", "공적인 영역으로"], ["where they can have", "그 영역에서 그것들은 가질 수 있다"], ["far-reaching and long-lasting effects.", "광범위하고 오래 지속되는 영향을."]]}, {"en": "Social media platforms have unquestionably altered the nature of private and public communication.", "ko": "소셜 미디어 플랫폼은 의심할 여지 없이 사적·공적 의사소통의 본질을 변화시켜 왔다.", "chunks": [["Social media platforms", "소셜 미디어 플랫폼은"], ["have unquestionably altered", "의심할 여지 없이 변화시켜 왔다"], ["the nature of", "~의 본질을"], ["private and public communication.", "사적이고 공적인 의사소통의."]]}]}, {"no": "21", "title": "Why Earth's Core Is Hot — Impact Heating", "ktitle": "지구 핵이 뜨거운 이유", "field": "지구과학", "page": "p28 no21", "oneline": "지구는 <span class='g'>충돌 가열</span>로 뜨겁게 태어났고(중력 위치에너지 방출) — 충돌이 멎고 표면은 식었지만 <span class='g'>내부 열은 천천히 새기에</span> 지금도 뜨겁다.", "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"작은 천체들이 충돌해 결합하는 지구 형성 단계, 전체가 가열된 신생 지구, 그리고 현재 표면은 식고 내부 잔열은 여전한 단면도의 시간 흐름\">\n  <!-- 3단계 가로 배치 -->\n\n  <!-- 단계 ① 형성 (좌) -->\n  <g transform=\"translate(20, 40)\">\n    <text x=\"90\" y=\"-15\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">① 형성 — 충돌 결합</text>\n    <rect x=\"0\" y=\"0\" width=\"180\" height=\"170\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n\n    <!-- 가운데 결합 중인 지구 -->\n    <g transform=\"translate(90, 85)\">\n      <circle cx=\"0\" cy=\"0\" r=\"32\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    </g>\n\n    <!-- 작은 천체들 충돌하는 모습 -->\n    <g fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\">\n      <circle cx=\"35\" cy=\"40\" r=\"7\"/>\n      <circle cx=\"155\" cy=\"50\" r=\"6\"/>\n      <circle cx=\"40\" cy=\"130\" r=\"8\"/>\n      <circle cx=\"150\" cy=\"130\" r=\"7\"/>\n      <circle cx=\"90\" cy=\"20\" r=\"5\"/>\n      <circle cx=\"90\" cy=\"150\" r=\"6\"/>\n    </g>\n\n    <!-- 충돌 화살표 (천체 → 가운데) -->\n    <g stroke=\"#c8102e\" stroke-width=\"1.4\">\n      <line x1=\"42\" y1=\"46\" x2=\"65\" y2=\"68\"/>\n      <polygon points=\"65,68 58,68 62,72\" fill=\"#c8102e\"/>\n      <line x1=\"148\" y1=\"55\" x2=\"115\" y2=\"70\"/>\n      <polygon points=\"115,70 122,68 119,75\" fill=\"#c8102e\"/>\n      <line x1=\"48\" y1=\"125\" x2=\"68\" y2=\"105\"/>\n      <polygon points=\"68,105 65,112 73,109\" fill=\"#c8102e\"/>\n      <line x1=\"143\" y1=\"125\" x2=\"112\" y2=\"105\"/>\n      <polygon points=\"112,105 119,108 116,112\" fill=\"#c8102e\"/>\n      <line x1=\"90\" y1=\"27\" x2=\"90\" y2=\"50\"/>\n      <polygon points=\"90,50 87,44 93,44\" fill=\"#c8102e\"/>\n      <line x1=\"90\" y1=\"143\" x2=\"90\" y2=\"120\"/>\n      <polygon points=\"90,120 87,127 93,127\" fill=\"#c8102e\"/>\n    </g>\n\n    <text x=\"90\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">impact heating</text>\n  </g>\n\n  <!-- 화살표 1 -->\n  <g transform=\"translate(210, 120)\">\n    <line x1=\"0\" y1=\"0\" x2=\"20\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <polygon points=\"20,0 14,-3 14,3\" fill=\"#1a1a1a\"/>\n  </g>\n\n  <!-- 단계 ② 신생 지구 (가운데) -->\n  <g transform=\"translate(235, 40)\">\n    <text x=\"65\" y=\"-15\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">② 신생 — 전체 가열</text>\n    <rect x=\"0\" y=\"0\" width=\"130\" height=\"170\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n\n    <!-- 가열된 신생 지구 (전체 빨강) -->\n    <g transform=\"translate(65, 85)\">\n      <circle cx=\"0\" cy=\"0\" r=\"42\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <!-- 표면 명도 변화 (그라데이션 효과 없이 단계) -->\n      <circle cx=\"0\" cy=\"0\" r=\"42\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- HOT 라벨 -->\n      <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">HOT</text>\n    </g>\n\n    <text x=\"65\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">born hot — 4.6 Bya</text>\n  </g>\n\n  <!-- 화살표 2 + time -->\n  <g transform=\"translate(375, 120)\">\n    <line x1=\"0\" y1=\"0\" x2=\"20\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <polygon points=\"20,0 14,-3 14,3\" fill=\"#1a1a1a\"/>\n    <text x=\"10\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">time →</text>\n  </g>\n\n  <!-- 단계 ③ 현재 지구 단면도 (우) -->\n  <g transform=\"translate(400, 40)\">\n    <text x=\"90\" y=\"-15\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">③ 현재 — 표면 식음·내부 잔열</text>\n    <rect x=\"0\" y=\"0\" width=\"180\" height=\"170\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n\n    <!-- 단면도 — 지구 -->\n    <g transform=\"translate(90, 85)\">\n      <!-- 외곽 (표면 — 회색, 식음) -->\n      <circle cx=\"0\" cy=\"0\" r=\"50\" fill=\"#f6f6f6\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <!-- 맨틀 -->\n      <circle cx=\"0\" cy=\"0\" r=\"35\" fill=\"#fdf2f4\" stroke=\"#999\" stroke-width=\"1.2\"/>\n      <!-- 핵 (빨강, 뜨거움) -->\n      <circle cx=\"0\" cy=\"0\" r=\"18\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">core</text>\n\n      <!-- 라벨 화살표 -->\n      <line x1=\"-25\" y1=\"-30\" x2=\"-50\" y2=\"-50\" stroke=\"#5e5e5e\" stroke-width=\"0.8\"/>\n      <text x=\"-58\" y=\"-52\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"end\" fill=\"#1FA34A\">cool surface</text>\n\n      <line x1=\"0\" y1=\"-18\" x2=\"20\" y2=\"-50\" stroke=\"#5e5e5e\" stroke-width=\"0.8\"/>\n      <text x=\"50\" y=\"-52\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#c8102e\">still hot</text>\n    </g>\n\n    <text x=\"90\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">slow heat loss from inside</text>\n  </g>\n</svg>", "caption": "형성 단계 — 작은 천체들이 충돌해 결합·가열(impact heating). 현재 — 표면은 식었지만 내부 잔열은 여전히 뜨겁다.", "tldr": ["지구는 작은 천체들이 중력으로 모여 충돌하며 뜨겁게 탄생했다.", "충돌이 열을 낸다 — 금속을 망치로 치면 뜨거워지듯.", "엄밀히 이는 ‘중력 위치에너지의 방출’. 표면은 식었지만 내부는 뜨겁다."], "analogy": "금속을 망치로 계속 두드리면 뜨거워지죠. 지구도 작은 천체들이 ‘망치’처럼 충돌하며 달궈졌고, 오븐을 끈 뒤에도 속이 뜨겁듯 내부 열이 오래 남은 거예요.", "bg": "분야는 지구과학이에요. 핵심 물음은 ‘지구의 핵(core)은 왜 그렇게 뜨거운가’. ‘충돌 가열(impact heating)’과 중력 위치에너지 개념이 등장해요. → 지구가 처음에 어떻게 뜨거워졌고, 지금까지 왜 식지 않았는지 두 가지를 구분하며 읽으세요.", "flow": [{"kind": "질문 Q", "t": "지구 핵은 왜 그렇게 뜨거울까?"}, {"kind": "탄생", "t": "작은 천체가 중력으로 모여 충돌", "d": "뜨거운 상태로 형성."}, {"kind": "원리", "t": "충돌 → 열 (망치 비유)", "d": "천체=망치, 중력=미는 힘."}, {"kind": "정리", "t": "충돌 가열 = 중력 위치에너지의 방출"}, {"kind": "결론", "t": "표면은 식고, 내부는 뜨겁게 남음", "cls": "close"}], "vocab": [["core", "핵·중심부"], ["mutual gravity", "서로 끌려 모이다"], ["accumulating", "충돌·충격"], ["generate", "발생시키다·생성하다"], ["demonstrate", "A를 B 위로 몰아가다"], ["technically", "엄밀히 말하면"]], "quiz": [["지구 핵이 뜨거운 핵심 이유는?", "형성될 때 천체들의 ‘충돌 가열’로 뜨겁게 태어났고, 이는 중력 위치에너지의 방출이에요."], ["‘망치로 금속 치기’ 비유는 무엇을 보여주나?", "충돌(타격)이 열을 발생시킨다는 점 — 충돌하는 천체가 망치, 중력이 그 힘이에요."], ["핵심 한 문장?", "지구는 충돌 가열로 뜨겁게 태어났고, 표면은 식어도 내부 열은 오래 남는다."]], "en": "What makes our planet’s core so hot? For one thing, scientists think that Earth was born hot. Earth formed from many smaller bodies drawn together by their mutual gravity. As each body hit the accumulating young Earth, the impact generated heat. You can demonstrate that impact generates heat by hitting a small piece of metal repeatedly with a hammer and then feeling the metal. It will be warmer than it was before you began hitting it. For the forming Earth, the impacting objects act as the hammer, and gravity is the force that drives them onto the young Earth. Technically, therefore, impact heating is release of gravitational potential energy. When the impacts stopped, Earth’s surface cooled, but its interior has remained hot. That is, Earth has behaved much like a baked potato taken from the oven, cooling on the outside but remaining hot inside because heat leaks only slowly from its interior to its surface.", "ko": "지구의 핵을 그렇게 뜨겁게 만드는 것은 무엇인가? 한 가지 이유로, 과학자들은 지구가 뜨거운 상태로 탄생했다고 생각한다. 지구는 상호 중력에 의해 서로 끌려 모인 많은 작은 천체로부터 형성되었다. 각각의 천체가 축적되고 있는 어린 지구에 충돌할 때, 그 충돌은 열을 발생시켰다. 작은 금속 조각을 망치로 반복해서 치고 나서 그 금속을 만져 보면 충돌이 열을 발생시킨다는 것을 입증할 수 있다. 그것은 치기 시작하기 전보다 더 뜨거워질 것이다. 형성되고 있는 지구에, 충돌하는 천체들은 망치 역할을 하고, 중력은 그것들을 젊은 지구로 몰아가는 힘이다. 따라서 엄밀히 말하면 충돌 가열은 중력 위치 에너지의 방출이다. 충돌이 멈추었을 때, 지구의 표면은 식었지만, 그 내부는 뜨거운 상태로 남았다. 즉, 지구는 오븐에서 꺼낸 구운 감자와 매우 흡사하게 행동하여 외부는 식지만 내부는 뜨거운 상태를 유지하게 된 것인데, 이는 그 내부에서 열이 표면으로 천천히 새어 나갈 뿐이기 때문이다.", "read": [{"en": "What makes our planet’s core so hot?", "ko": "지구의 핵을 그렇게 뜨겁게 만드는 것은 무엇인가?", "chunks": [["What makes", "무엇이 만드는가"], ["our planet’s core", "우리 행성의 핵을"], ["so hot?", "그토록 뜨겁게?"]]}, {"en": "For one thing, scientists think that Earth was born hot.", "ko": "한 가지 이유로, 과학자들은 지구가 뜨거운 상태로 탄생했다고 생각한다.", "chunks": [["For one thing,", "한 가지 이유로,"], ["scientists think", "과학자들은 생각한다"], ["that Earth was born hot.", "지구가 뜨거운 상태로 태어났다고."]]}, {"en": "Earth formed from many smaller bodies drawn together by their mutual gravity.", "ko": "지구는 상호 중력에 의해 서로 끌려 모인 많은 작은 천체로부터 형성되었다.", "chunks": [["Earth formed", "지구는 형성되었다"], ["from many smaller bodies", "많은 작은 천체들로부터"], ["drawn together", "서로 끌려 모인"], ["by their mutual gravity.", "그들의 상호 중력에 의해."]]}, {"en": "As each body hit the accumulating young Earth, the impact generated heat.", "ko": "각각의 천체가 축적되고 있는 어린 지구에 충돌할 때, 그 충돌은 열을 발생시켰다.", "chunks": [["As each body hit", "각 천체가 부딪칠 때마다"], ["the accumulating young Earth,", "축적되고 있는 어린 지구에,"], ["the impact generated heat.", "그 충돌은 열을 발생시켰다."]]}, {"en": "You can demonstrate that impact generates heat by hitting a small piece of metal repeatedly with a hammer and then feeling the metal.", "ko": "작은 금속 조각을 망치로 반복해서 치고 나서 그 금속을 만져 보면 충돌이 열을 발생시킨다는 것을 입증할 수 있다.", "chunks": [["You can demonstrate", "여러분은 입증할 수 있다"], ["that impact generates heat", "충돌이 열을 발생시킨다는 것을"], ["by hitting a small piece of metal", "작은 금속 조각을 침으로써"], ["repeatedly with a hammer", "반복적으로 망치로"], ["and then feeling the metal.", "그러고 나서 그 금속을 만져 봄으로써."]]}, {"en": "It will be warmer than it was before you began hitting it.", "ko": "그것은 치기 시작하기 전보다 더 뜨거워질 것이다.", "chunks": [["It will be warmer", "그것은 더 따뜻해질 것이다"], ["than it was", "그것이 그러했던 것보다"], ["before you began hitting it.", "여러분이 그것을 치기 시작하기 전."]]}, {"en": "For the forming Earth, the impacting objects act as the hammer, and gravity is the force that drives them onto the young Earth.", "ko": "형성되고 있는 지구에, 충돌하는 천체들은 망치 역할을 하고, 중력은 그것들을 젊은 지구로 몰아가는 힘이다.", "chunks": [["For the forming Earth,", "형성되고 있는 지구에 있어서,"], ["the impacting objects act as the hammer,", "충돌하는 천체들은 망치 역할을 한다,"], ["and gravity is the force", "그리고 중력은 ~인 힘이다"], ["that drives them onto the young Earth.", "그것들을 어린 지구 위로 몰아가는."]]}, {"en": "Technically, therefore, impact heating is release of gravitational potential energy.", "ko": "따라서 엄밀히 말하면 충돌 가열은 중력 위치 에너지의 방출이다.", "chunks": [["Technically, therefore,", "엄밀히 말하면 따라서,"], ["impact heating is", "충돌 가열은 ~이다"], ["release of gravitational potential energy.", "중력 위치 에너지의 방출."]]}, {"en": "When the impacts stopped, Earth’s surface cooled, but its interior has remained hot.", "ko": "충돌이 멈추었을 때, 지구의 표면은 식었지만, 그 내부는 뜨거운 상태로 남았다.", "chunks": [["When the impacts stopped,", "충돌이 멈추었을 때,"], ["Earth’s surface cooled,", "지구의 표면은 식었다,"], ["but its interior has remained hot.", "그러나 그 내부는 뜨거운 상태로 남아 있다."]]}, {"en": "That is, Earth has behaved much like a baked potato taken from the oven, cooling on the outside but remaining hot inside because heat leaks only slowly from its interior to its surface.", "ko": "즉, 지구는 오븐에서 꺼낸 구운 감자와 매우 흡사하게 행동하여 외부는 식지만 내부는 뜨거운 상태를 유지하게 된 것인데, 이는 그 내부에서 열이 표면으로 천천히 새어 나갈 뿐이기 때문이다.", "chunks": [["That is,", "즉,"], ["Earth has behaved", "지구는 행동해 왔다"], ["much like a baked potato", "구운 감자와 매우 흡사하게"], ["taken from the oven,", "오븐에서 꺼낸,"], ["cooling on the outside", "바깥은 식고"], ["but remaining hot inside", "안은 뜨거운 상태로 남으면서"], ["because heat leaks only slowly", "왜냐하면 열이 천천히 새기 때문에"], ["from its interior to its surface.", "그 내부로부터 표면으로."]]}]}, {"no": "22", "title": "Evolutionary Hypotheses Must Be Falsifiable", "ktitle": "진화 가설도 검증 가능하다", "field": "과학철학", "page": "p29 no22", "oneline": "진화 가설은 <span class='g'>반박될 상황을 상상할 수 있어야</span> 과학적이며 — 그조차 <span class='r'>상상 못 하면 검증 불가 = 비과학적</span>이다.", "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 반박 시나리오를 상상할 수 있는 과학적 가설과, 오른쪽 반박 상황 자체를 상상할 수 없어 검증 불가능한 비과학적 가설의 대조\">\n  <!-- 좌측: 과학적 가설 (반박 가능) -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">과학적 — 반박 가능</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"195\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 가설 박스 (상단) -->\n    <g transform=\"translate(135, 30)\">\n      <rect x=\"-115\" y=\"-15\" width=\"230\" height=\"30\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"-105\" y=\"-1\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1FA34A\">hypothesis:</text>\n      <text x=\"-105\" y=\"11\" font-family=\"Noto Serif\" font-size=\"10\" fill=\"#1a1a1a\">\"humans evolved after dinosaurs\"</text>\n    </g>\n\n    <!-- 반박 시나리오 박스 (점선 — 상상 가능) -->\n    <g transform=\"translate(135, 90)\">\n      <rect x=\"-110\" y=\"-25\" width=\"220\" height=\"50\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\" stroke-dasharray=\"4 2\"/>\n      <text x=\"0\" y=\"-12\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">imaginable falsifier:</text>\n      <text x=\"0\" y=\"2\" font-family=\"Noto Serif\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">human fossil in dinosaur-era rock</text>\n      <text x=\"0\" y=\"15\" font-family=\"Noto Serif\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">→ would refute</text>\n    </g>\n\n    <!-- 체크 -->\n    <g transform=\"translate(135, 155)\">\n      <circle cx=\"0\" cy=\"0\" r=\"13\" fill=\"#1FA34A\"/>\n      <path d=\"M -5 0 L -1 4 L 6 -4\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.2\"/>\n    </g>\n\n    <text x=\"135\" y=\"185\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">testable · scientific</text>\n  </g>\n\n  <!-- 가운데 vs -->\n  <text x=\"300\" y=\"125\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 우측: 비과학적 가설 (반박 불가) -->\n  <g transform=\"translate(315, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">비과학적 — 반박 불가</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"195\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n\n    <!-- 가설 박스 -->\n    <g transform=\"translate(135, 30)\">\n      <rect x=\"-115\" y=\"-15\" width=\"230\" height=\"30\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"-105\" y=\"-1\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" fill=\"#c8102e\">hypothesis:</text>\n      <text x=\"-105\" y=\"11\" font-family=\"Noto Serif\" font-size=\"10\" fill=\"#1a1a1a\">untestable claim</text>\n    </g>\n\n    <!-- 반박 시나리오 박스 (빨강·차단) -->\n    <g transform=\"translate(135, 90)\">\n      <rect x=\"-110\" y=\"-25\" width=\"220\" height=\"50\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 3\"/>\n      <text x=\"0\" y=\"-12\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">falsifier?</text>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-size=\"10\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#999\">\"cannot even imagine\"</text>\n      <!-- 차단 X -->\n      <g transform=\"translate(0, 14)\">\n        <line x1=\"-7\" y1=\"-3\" x2=\"7\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <line x1=\"-7\" y1=\"3\" x2=\"7\" y2=\"-3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      </g>\n    </g>\n\n    <!-- X -->\n    <g transform=\"translate(135, 155)\">\n      <circle cx=\"0\" cy=\"0\" r=\"13\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      <line x1=\"-5\" y1=\"-5\" x2=\"5\" y2=\"5\" stroke=\"#c8102e\" stroke-width=\"2.2\"/>\n      <line x1=\"5\" y1=\"-5\" x2=\"-5\" y2=\"5\" stroke=\"#c8102e\" stroke-width=\"2.2\"/>\n    </g>\n\n    <text x=\"135\" y=\"185\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">untestable · unscientific</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">Popper's criterion — falsifiability defines science</text>\n</svg>", "caption": "과학적 가설: '인간은 공룡 멸종 이후 진화' — 반박 시나리오(공룡 시대 인간 화석)를 상상 가능 ✓. 비과학적 가설: 반박 시나리오 상상조차 못 함 ✗.", "tldr": ["많은 진화 가설은 검증 가능하다(예: 인간은 공룡 멸종 후 진화).", "‘반박될 수 있는 상황을 상상할 수 있어야’ 과학적 가설이다.", "상상조차 못 하는 주장(‘5분 전 기억까지 완비돼 창조’)은 검증 불가 = 비과학."], "analogy": "‘내일 해가 뜬다’는 ‘안 뜨면 틀린 것’이라 검증되죠. 반대로 ‘우주는 5분 전에 기억까지 통째로 생겼다’는 어떤 증거로도 못 깨니 과학이 아니에요.", "bg": "분야는 과학철학이에요. 핵심 개념은 ‘반증 가능성(falsifiability)’ — 가설이 과학적이려면 반박될 상황을 상상할 수 있어야 한다는 것. 진화 가설과 화석 기록 예가 나와요. → ‘검증 가능한 가설’과 ‘비과학적 주장’을 가르는 기준이 무엇인지에 주목하며 읽으세요.", "flow": [{"kind": "주장", "t": "많은 진화 가설은 검증 가능하다"}, {"kind": "예시", "t": "‘인간은 공룡 멸종 후 진화’", "d": "반박될 가능성이 존재 → 과학적."}, {"kind": "기준", "t": "반박될 상황을 ‘상상할 수 있어야’"}, {"kind": "반례", "t": "‘5분 전 창조설’ — 상상조차 불가", "cls": "pivot", "d": "어떤 증거도 그렇게 설명돼 버림."}, {"kind": "결론", "t": "상상 불가 = 검증 불가 = 비과학", "cls": "close"}], "vocab": [["evolutionary", "진화의·진화론적인"], ["hypothesis", "가설"], ["testable", "검증 가능한"], ["prediction", "진화하다·점진적으로 발달하다"], ["extinction", "가능성·잠재성"], ["reject", "반박하다·거부하다"]], "quiz": [["과학적 가설이 되려면 어떤 조건이 필요한가?", "‘반박될 수 있는 상황을 상상할 수 있어야’ 해요(반증 가능성)."], ["‘5분 전 창조설’이 비과학인 이유는?", "어떤 반대 증거도 ‘그것까지 그때 만들어졌다’로 설명돼, 반박될 상황을 상상조차 할 수 없기 때문이에요."], ["핵심 한 문장?", "반박될 상황을 상상할 수 있어야 과학이고, 그조차 못 하면 비과학이다."]], "en": "Many evolutionary hypotheses are testable. For example, specific predictions about the fossil record can be made based on our knowledge of evolution. One such prediction is that humans evolved after the extinction of the dinosaurs. The potential exists for this statement to be rejected; all we need is evidence that humans existed before, or at the same time as, the dinosaurs. Because we have found no such evidence, we cannot reject the hypothesis. We can, however, imagine a situation in which the hypothesis could be rejected. If we cannot imagine such a situation, then the hypothesis cannot be tested. For example, imagine that someone tells you that all the people on Earth were created 5 minutes ago, complete with memories! Any evidence you muster against this idea could be explained away. Therefore, this hypothesis is not scientific because there is no possible way to reject it.", "ko": "많은 진화 가설은 검증 가능하다. 예를 들어, 진화에 대한 우리의 지식을 바탕으로 화석 기록에 대한 구체적인 예측이 이루어질 수 있다. 그러한 한 가지 예측은 인간이 공룡 멸종 이후에 진화했다는 것이다. 이 진술은 반박될 가능성이 존재하는데, 인간이 공룡보다 먼저, 혹은 공룡과 동시에 존재했다는 증거만 있으면 된다. 우리가 그러한 증거를 찾지 못했기 때문에 우리는 그 가설을 반박할 수 없다. 하지만 우리는 그 가설이 반박될 수 있는 상황을 상상할 수는 있다. 만약 우리가 그러한 상황을 상상할 수 없다면, 그렇다면 그 가설은 검증될 수 없다. 예를 들어, 누군가가 여러분에게 지구상의 모든 사람이 5분 전에 기억까지 완비되어 창조되었다고 말한다고 상상해 보라! 여러분이 모으는 이 생각과 반대되는 어떤 증거든 해명될 수 있다. 따라서 이 가설은 반박할 수 있는 가능한 방법이 전혀 없기 때문에 과학적이지 않다.", "read": [{"en": "Many evolutionary hypotheses are testable.", "ko": "많은 진화 가설은 검증 가능하다.", "chunks": [["Many evolutionary hypotheses", "많은 진화 가설은"], ["are testable.", "검증 가능하다."]]}, {"en": "For example, specific predictions about the fossil record can be made based on our knowledge of evolution.", "ko": "예를 들어, 진화에 대한 우리의 지식을 바탕으로 화석 기록에 대한 구체적인 예측이 이루어질 수 있다.", "chunks": [["For example,", "예를 들어,"], ["specific predictions about the fossil record", "화석 기록에 대한 구체적인 예측은"], ["can be made", "이루어질 수 있다"], ["based on our knowledge of evolution.", "진화에 대한 우리의 지식을 바탕으로."]]}, {"en": "One such prediction is that humans evolved after the extinction of the dinosaurs.", "ko": "그러한 한 가지 예측은 인간이 공룡 멸종 이후에 진화했다는 것이다.", "chunks": [["One such prediction", "그러한 한 가지 예측은"], ["is that", "~라는 것이다"], ["humans evolved", "인간이 진화했다"], ["after the extinction of the dinosaurs.", "공룡의 멸종 이후에."]]}, {"en": "The potential exists for this statement to be rejected; all we need is evidence that humans existed before, or at the same time as, the dinosaurs.", "ko": "이 진술은 반박될 가능성이 존재하는데, 인간이 공룡보다 먼저, 혹은 공룡과 동시에 존재했다는 증거만 있으면 된다.", "chunks": [["The potential exists", "가능성이 존재한다"], ["for this statement to be rejected;", "이 진술이 반박될 (가능성);"], ["all we need is evidence", "우리에게 필요한 모든 것은 증거다"], ["that humans existed before,", "인간이 (공룡보다) 먼저 존재했다는,"], ["or at the same time as,", "혹은 동시에"], ["the dinosaurs.", "공룡과."]]}, {"en": "Because we have found no such evidence, we cannot reject the hypothesis.", "ko": "우리가 그러한 증거를 찾지 못했기 때문에 우리는 그 가설을 반박할 수 없다.", "chunks": [["Because we have found no such evidence,", "우리가 그러한 증거를 찾지 못했기 때문에,"], ["we cannot reject the hypothesis.", "우리는 그 가설을 반박할 수 없다."]]}, {"en": "We can, however, imagine a situation in which the hypothesis could be rejected.", "ko": "하지만 우리는 그 가설이 반박될 수 있는 상황을 상상할 수는 있다.", "chunks": [["We can, however, imagine", "그러나 우리는 상상할 수는 있다"], ["a situation", "어떤 상황을"], ["in which the hypothesis", "그 상황에서 그 가설이"], ["could be rejected.", "반박될 수 있는."]]}, {"en": "If we cannot imagine such a situation, then the hypothesis cannot be tested.", "ko": "만약 우리가 그러한 상황을 상상할 수 없다면, 그렇다면 그 가설은 검증될 수 없다.", "chunks": [["If we cannot imagine", "만약 우리가 상상할 수 없다면"], ["such a situation,", "그러한 상황을,"], ["then the hypothesis cannot be tested.", "그러면 그 가설은 검증될 수 없다."]]}, {"en": "For example, imagine that someone tells you that all the people on Earth were created 5 minutes ago, complete with memories!", "ko": "예를 들어, 누군가가 여러분에게 지구상의 모든 사람이 5분 전에 기억까지 완비되어 창조되었다고 말한다고 상상해 보라!", "chunks": [["For example,", "예를 들어,"], ["imagine that someone tells you", "누군가가 여러분에게 말한다고 상상하라"], ["that all the people on Earth", "지구상의 모든 사람이"], ["were created 5 minutes ago,", "5분 전에 창조되었다고,"], ["complete with memories!", "기억까지 완비된 채!"]]}, {"en": "Any evidence you muster against this idea could be explained away.", "ko": "여러분이 모으는 이 생각과 반대되는 어떤 증거든 해명될 수 있다.", "chunks": [["Any evidence", "어떤 증거든"], ["you muster against this idea", "여러분이 이 생각에 반대해 모으는"], ["could be explained away.", "해명될 수 있다."]]}, {"en": "Therefore, this hypothesis is not scientific because there is no possible way to reject it.", "ko": "따라서 이 가설은 반박할 수 있는 가능한 방법이 전혀 없기 때문에 과학적이지 않다.", "chunks": [["Therefore,", "따라서,"], ["this hypothesis is not scientific", "이 가설은 과학적이지 않다"], ["because there is no possible way", "왜냐하면 가능한 방법이 없기 때문에"], ["to reject it.", "그것을 반박할."]]}]}, {"no": "23", "title": "Color Vision vs Hearing — Why Mixtures Fool Us", "ktitle": "색각은 왜 이상한가", "field": "지각·과학", "page": "p30 no23~24", "oneline": "색각의 이상함 — <span class='r'>혼합색이 단일 자극과 구별 불가</span>해 물리 스펙트럼 역추론이 어렵다. <span class='g'>청각은 두세 음을 완벽 구별</span>하지만 시각만 평균으로 합쳐 본다.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 노란빛과 빨간빛이 합쳐져 주황 하나로 보이는 시각의 평균값 처리와, 오른쪽 도음과 미음이 각각 구별되는 청각의 개별 처리의 대조\">\n  <!-- 좌측: 시각 — 평균값 통합 -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">시각 — 혼합 = 평균</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n\n    <!-- 입력 1: 노란 빛 (좌상) -->\n    <g transform=\"translate(45, 50)\">\n      <!-- 파동 -->\n      <path d=\"M -15 0 Q -10 -8 -5 0 Q 0 8 5 0 Q 10 -8 15 0\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"-12\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">yellow</text>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">~580 nm</text>\n    </g>\n\n    <!-- 입력 2: 빨간 빛 (좌하) -->\n    <g transform=\"translate(45, 130)\">\n      <path d=\"M -15 0 Q -10 -10 -5 0 Q 0 10 5 0 Q 10 -10 15 0\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"-12\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">red</text>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">~700 nm</text>\n    </g>\n\n    <!-- 입력 → 통합 화살표 -->\n    <line x1=\"70\" y1=\"50\" x2=\"130\" y2=\"95\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    <polygon points=\"130,95 123,93 125,99\" fill=\"#c8102e\"/>\n    <line x1=\"70\" y1=\"130\" x2=\"130\" y2=\"105\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    <polygon points=\"130,105 123,103 125,109\" fill=\"#c8102e\"/>\n\n    <!-- 통합 (혼합 결과 — 주황 한 색) -->\n    <g transform=\"translate(180, 100)\">\n      <rect x=\"-40\" y=\"-20\" width=\"80\" height=\"40\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n      <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">orange</text>\n      <text x=\"0\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">(average)</text>\n    </g>\n\n    <!-- 원본 식별 불가 라벨 -->\n    <text x=\"135\" y=\"175\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">\"Y or R? — cannot tell from orange\"</text>\n    <text x=\"135\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">spectrum loss — averaged into single signal</text>\n  </g>\n\n  <!-- 가운데 vs -->\n  <text x=\"300\" y=\"125\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 우측: 청각 — 개별 식별 -->\n  <g transform=\"translate(315, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">청각 — 혼합 = 분리</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"200\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 입력 1: 도 음 (좌상) -->\n    <g transform=\"translate(45, 50)\">\n      <!-- 파동 (느린) -->\n      <path d=\"M -18 0 Q -12 -10 -6 0 Q 0 10 6 0 Q 12 -10 18 0\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"-12\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">C note</text>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">261 Hz</text>\n    </g>\n\n    <!-- 입력 2: 미 음 (좌하) -->\n    <g transform=\"translate(45, 130)\">\n      <!-- 파동 (빠른) -->\n      <path d=\"M -18 0 Q -15 -10 -12 0 Q -9 10 -6 0 Q -3 -10 0 0 Q 3 10 6 0 Q 9 -10 12 0 Q 15 10 18 0\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"-12\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">E note</text>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">330 Hz</text>\n    </g>\n\n    <!-- 입력 → 결과 화살표 -->\n    <line x1=\"70\" y1=\"50\" x2=\"130\" y2=\"80\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <polygon points=\"130,80 122,79 125,85\" fill=\"#1FA34A\"/>\n    <line x1=\"70\" y1=\"130\" x2=\"130\" y2=\"120\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <polygon points=\"130,120 122,118 125,124\" fill=\"#1FA34A\"/>\n\n    <!-- 결과: 두 음 그대로 (분리됨) -->\n    <g transform=\"translate(180, 100)\">\n      <!-- C 박스 -->\n      <rect x=\"-40\" y=\"-25\" width=\"80\" height=\"22\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"-9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">C — 261 Hz</text>\n      <!-- E 박스 -->\n      <rect x=\"-40\" y=\"3\" width=\"80\" height=\"22\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"19\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">E — 330 Hz</text>\n    </g>\n\n    <text x=\"135\" y=\"175\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"C and E — heard as two distinct notes\"</text>\n    <text x=\"135\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">spectrum preserved — each component identified</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"248\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">same \"mixture\" — but vision averages, hearing separates</text>\n</svg>", "caption": "시각: 노랑 + 빨강 빛 = 주황(평균값)으로 합쳐져 원본 식별 불가. 청각: 도 + 미 음 = 두 음 그대로 구별 — 같은 '혼합'인데 처리가 정반대.", "tldr": ["색을 본다고 빛의 물리적 성분을 알 수 있는 건 아니다.", "노랑+빨강을 섞은 주황은 ‘단일 파장 주황’과 구별이 안 된다.", "청각은 두세 음을 따로 구별하지만, 시각은 빛을 ‘평균’으로 합쳐 본다."], "analogy": "여러 악기 소리는 각각 구분해 듣지만(청각), 노랑+빨강을 섞은 주황과 순수 주황빛은 눈으로 똑같아 보이죠(색각). 시각은 빛을 평균내 한 색으로만 봐서, 어떤 빛이 섞였는지 되짚을 수 없어요.", "bg": "분야는 지각·감각 과학이에요. 색각(color vision)과 청각(hearing)이 대비됩니다. 노랑+빨강 빛을 섞으면 주황으로 보이는 ‘혼합색’ 현상이 핵심 예. → 시각이 왜 물리적 스펙트럼을 역추론하지 못하는지, 청각과 어떻게 다른지에 초점을 두고 읽으세요.", "flow": [{"kind": "핵심", "t": "색각은 좀 이상하다", "d": "색을 봐도 빛의 물리 성분을 알 수 없음."}, {"kind": "현상", "t": "혼합 주황 = 단일 파장 주황과 구별 불가"}, {"kind": "확장", "t": "흰색·자주색도 혼합으로 생성", "d": "보색 짝 또는 3원색 혼합."}, {"kind": "대조", "t": "청각은 음을 따로 구별한다"}, {"kind": "결론", "t": "시각만 빛을 ‘평균’으로 합쳐 본다", "cls": "close"}], "vocab": [["color vision", "색각·색 지각"], ["perception", "재구성하다·복원하다"], ["spectral property", "스펙트럼 특성·파장 특성"], ["mix", "구별하다"], ["monochromatic", "단색의·단일 파장의"], ["complementary color", "주요·원색"]], "quiz": [["색각이 ‘이상하다’는 건 무슨 뜻인가?", "색을 본다고 그 빛의 물리적 성분(스펙트럼)을 알 수 없다는 뜻 — 혼합 주황과 단일 파장 주황을 구별 못 해요."], ["시각과 청각은 어떻게 다른가?", "청각은 섞인 음을 따로 구별하지만, 시각은 섞인 빛을 ‘하나의 평균색’으로 합쳐 봐요."], ["핵심 한 문장?", "시각은 혼합색을 단일색과 구별 못 하고 빛을 평균으로 합쳐 본다."]], "en": "Color vision is a little strange even in humans, in that the perception of color does not easily allow us to reconstruct the physical spectral properties of an object. If we mix yellow with red light, we will see orange ─ and not only will we be unable to tell that the color has been produced by mixing two lights, we will also be unable to distinguish the mixture from monochromatic (single-wavelength) orange light. The perception of white can be generated by mixing any pair of complementary colors ─ blue and yellow, red and cyan, green and magenta ─ or the three colors of light that are \"primary\" in our visual system: green, red, and blue. By combining the short-wavelength and long-wavelength ends of the spectrum (violet and red), you generate a perceptual quality that does not exist in the spectrum at all: purple. We are so used to these mixture phenomena that most of us are unaware of how poorly they correspond to the physical world: the physical stimulus (or stimuli) simply cannot be deduced from any single color we see. In contrast, in hearing, you can perfectly well distinguish two tones, or indeed a chord of three tones. We would never perceive a mixture of 400 Hz and 800 Hz as an intermediate frequency (say, 600 Hz) ─ but that is exactly what happens in vision.", "ko": "색각은 인간에게도 약간 이상한데, 색을 지각한다고 해서 우리가 물체의 물리적인 스펙트럼 특성을 쉽게 재구성할 수 있는 것은 아니라는 점에서이다. 노란색 빛과 빨간색 빛을 혼합하면 우리는 주황색을 볼 것인데, 그 색이 두 빛을 혼합함으로써 만들어졌다는 것을 구별할 수 없게 될 뿐만 아니라, 이 혼합된 색을 단색의(단일 파장의) 주황색 빛과 구별할 수도 없게 될 것이다. 흰색의 지각은 어떤 짝을 이루는 보색, 즉 파랑과 노랑, 빨강과 청록, 녹색과 자홍색을 혼합하거나, 우리 시각 체계의 '주요한' 세 가지 빛의 색깔인 녹색, 빨강, 파랑을 혼합함으로써 생성될 수 있다. 스펙트럼의 짧은 파장의 끝단과 긴 파장의 끝단(보라색과 빨간색)을 결합함으로써, 스펙트럼에서 전혀 존재하지 않는 지각적 특성인 자주색을 생성한다. 우리는 이러한 혼합 현상에 너무 익숙해 있어서, 우리 대부분은 그것이 물리적 세계와 얼마나 형편없게 일치하는지를 인식하지 못하는데, 물리적 자극(혹은 자극들)은 단지 우리가 보는 어떤 한 가지 색상만으로는 추론될 수 없다. 대조적으로, 청각에서는 두 개의 음, 또는 심지어 세 개의 음의 한 화음을 완벽하게 잘 구별할 수 있다. 우리는 400Hz와 800Hz의 혼합을 중간 주파수(예를 들어, 600Hz)로 결코 지각하지 않을 것이지만, 그것은 정확히 시각에서 일어나는 것이다.", "read": [{"en": "Color vision is a little strange even in humans, in that the perception of color does not easily allow us to reconstruct the physical spectral properties of an object.", "ko": "색각은 인간에게도 약간 이상한데, 색을 지각한다고 해서 우리가 물체의 물리적인 스펙트럼 특성을 쉽게 재구성할 수 있는 것은 아니라는 점에서이다.", "chunks": [["Color vision is a little strange even in humans, in that the perception of col /* ============================================================

function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>

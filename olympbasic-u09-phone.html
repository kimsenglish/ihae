<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 올림포스 영어독해기본1 Unit 09 (5지문)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   올림포스 영어독해기본1 Unit 09 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>

<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">

    <div class="b-sub">올림포스 영어독해기본1 Unit 09</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 올림포스 영어독해기본1 Unit 09 5개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data":[{"no":"1","title":"Action Means Choosing Among Ends","ktitle":"행동 = 목적들 중 ‘선택’하는 것","field":"경제·행동","page":"p62 no.01","oneline":"행동은 <span class='g'>시간 부족</span>으로 인해 여러 목적 중 <span class='g'>하나를 선택</span>하는 것이며 — 선택한 것은 다른 것들보다 더 높게 <span class='g'>순위 매긴 결과</span>다.","metaphor":"<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Jones가 한 시간이라는 시간 자원으로 야구·브리지·드라이브 세 후보 중 야구(A)를 선택하는 그림과, 선택이 곧 순위 매김임을 보여주는 그림\">\n  <!-- 좌측: Jones + 시간 자원 -->\n  <g transform=\"translate(20, 40)\">\n    <text x=\"80\" y=\"-12\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">한 시간 (시간 부족)</text>\n\n    <!-- Jones stick figure -->\n    <g transform=\"translate(40, 60)\">\n      <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-2\" r=\"1.5\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"-2\" r=\"1.5\" fill=\"#1a1a1a\"/>\n      <path d=\"M -5 5 Q 0 7 5 5\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"14\" x2=\"0\" y2=\"50\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"28\" x2=\"-12\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"28\" x2=\"12\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"50\" x2=\"-9\" y2=\"70\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"50\" x2=\"9\" y2=\"70\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"92\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">Jones</text>\n    </g>\n\n    <!-- 시간 게이지 (모래시계 형태) -->\n    <g transform=\"translate(110, 30)\">\n      <!-- 모래시계 -->\n      <path d=\"M 0 0 L 32 0 L 18 18 L 18 32 L 32 50 L 0 50 L 14 32 L 14 18 Z\" \n            fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 윗부분 모래 (남아있는 시간) -->\n      <path d=\"M 4 4 L 28 4 L 17 16 L 15 16 Z\" fill=\"#1a1a1a\" opacity=\"0.6\"/>\n      <text x=\"16\" y=\"68\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">1 hour</text>\n      <text x=\"16\" y=\"80\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">scarce</text>\n    </g>\n  </g>\n\n  <!-- 가운데 화살표 -->\n  <g transform=\"translate(195, 115)\">\n    <line x1=\"0\" y1=\"0\" x2=\"30\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <polygon points=\"30,0 23,-4 23,4\" fill=\"#1a1a1a\"/>\n    <text x=\"15\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a1a1a\">choose</text>\n  </g>\n\n  <!-- 우측: 3개 후보 -->\n  <g transform=\"translate(240, 30)\">\n    <text x=\"170\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">세 후보 중 하나만 가능</text>\n\n    <!-- (a) 야구 — 선택됨 (초록) -->\n    <g transform=\"translate(0, 10)\">\n      <rect x=\"0\" y=\"0\" width=\"340\" height=\"40\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <text x=\"14\" y=\"25\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"12\" fill=\"#1FA34A\">(a)</text>\n      <text x=\"40\" y=\"25\" font-family=\"Noto Serif KR\" font-size=\"12\" fill=\"#1FA34A\" font-weight=\"700\">야구 경기 계속 시청 — baseball</text>\n      <!-- ✓ 표시 -->\n      <g transform=\"translate(310, 20)\">\n        <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#1FA34A\"/>\n        <path d=\"M -4 0 L -1 4 L 5 -3\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2\"/>\n      </g>\n    </g>\n    <text x=\"170\" y=\"68\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">A chosen — satisfied</text>\n\n    <!-- (b) 브리지 — 미선택 (회색 점선) -->\n    <g transform=\"translate(0, 78)\">\n      <rect x=\"0\" y=\"0\" width=\"340\" height=\"36\" rx=\"5\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\" opacity=\"0.7\"/>\n      <text x=\"14\" y=\"23\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"12\" fill=\"#999\">(b)</text>\n      <text x=\"40\" y=\"23\" font-family=\"Noto Serif KR\" font-size=\"12\" fill=\"#999\">브리지 게임 — bridge</text>\n      <!-- ✗ -->\n      <g transform=\"translate(310, 18)\">\n        <circle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n        <line x1=\"-4\" y1=\"-4\" x2=\"4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"1.7\"/>\n        <line x1=\"4\" y1=\"-4\" x2=\"-4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"1.7\"/>\n      </g>\n    </g>\n\n    <!-- (c) 드라이브 — 미선택 (회색 점선) -->\n    <g transform=\"translate(0, 125)\">\n      <rect x=\"0\" y=\"0\" width=\"340\" height=\"36\" rx=\"5\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\" opacity=\"0.7\"/>\n      <text x=\"14\" y=\"23\" font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"12\" fill=\"#999\">(c)</text>\n      <text x=\"40\" y=\"23\" font-family=\"Noto Serif KR\" font-size=\"12\" fill=\"#999\">드라이브 — driving</text>\n      <g transform=\"translate(310, 18)\">\n        <circle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n        <line x1=\"-4\" y1=\"-4\" x2=\"4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"1.7\"/>\n        <line x1=\"4\" y1=\"-4\" x2=\"-4\" y2=\"4\" stroke=\"#c8102e\" stroke-width=\"1.7\"/>\n      </g>\n    </g>\n    <text x=\"170\" y=\"178\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">B · C unsatisfied</text>\n\n    <!-- 순위 매김 라벨 -->\n    <text x=\"170\" y=\"200\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">ranking: A &gt; B, C</text>\n  </g>\n</svg>","caption":"한 시간이라는 자원으로 세 목적 모두 충족할 수 없다. A(야구)를 고른 것은 — A를 B(브리지)·C(드라이브)보다 더 높게 순위 매겼다는 뜻이다.","tldr":["행동은 ‘어떤 목적을 충족할지 선택’함으로써 일어난다.","시간이 부족한 건, 무엇을 고르든 나머지는 충족 못 되기 때문이다.","A를 고르면 = A의 충족을 B·C보다 ‘높게 매긴’ 것이다."],"analogy":"한 시간 동안 야구·보드게임·드라이브를 다 하고 싶어도 시간은 하나뿐이죠. 무엇을 ‘고른다’는 건 그것을 나머지보다 더 원한다는 ‘순위 매김’이에요.","bg":"인간의 ‘행동’이 곧 한정된 수단(시간)으로 ‘목적의 우선순위를 매겨 선택’하는 일임을, Jones의 예로 설명한 글이에요.","flow":[{"kind":"정의","t":"행동 = 어떤 목적을 충족할지 ‘선택’"},{"kind":"이유","t":"시간이 부족 → 무엇을 고르든 나머지는 미충족"},{"kind":"예시","t":"Jones: 야구 vs 브리지 vs 드라이브 (시간 부족)"},{"kind":"결론","t":"A 선택 = A를 B·C보다 ‘높게 순위 매김’","cls":"close"}],"vocab":[["end","목적·목표"],["means","수단"],["scarce","부족한"],["satisfy","충족시키다"],["insufficient","불충분한"],["rank","순위를 매기다"],["unfulfilled","충족되지 않은"]],"quiz":[["인간에게 ‘시간이 부족하다’는 것의 의미는?","어떤 목적을 고르든 나머지 목적은 충족되지 못한 채 남기 때문에 선택이 필요하다는 뜻이에요."],["Jones가 A를 선택한 것이 보여주는 것은?","A의 충족을 B나 C의 충족보다 더 ‘높게 순위 매겼다’는 점이에요."],["핵심 한 문장?","행동은 한정된 수단으로 목적의 우선순위를 매겨 하나를 ‘선택’하는 일이다."]],"en":"Action takes place by choosing which ends shall be satisfied by the employment of means. Time is scarce for man only because whichever ends he chooses to satisfy, there are others that must remain unsatisfied. When we must use a means so that some ends remain unsatisfied, the necessity for a choice among ends arises. For example, Jones is engaged in watching a baseball game on television. He is faced with the choice of spending the next hour in: (a) continuing to watch the baseball game, (b) playing bridge, or (c) going for a drive. He would like to do all three of these things, but his means (time) is insufficient. As a result, he must choose; one end can be satisfied, but the others must go unfulfilled. Suppose that he decides on course A. This is a clear indication that he has ranked the satisfaction of end A higher than the satisfaction of ends B or C.","ko":"행동은 수단을 사용하여 어떤 목적을 충족시킬 것인가를 '선택함'으로써 일어난다. 인간에게 시간이 '부족한' 이유는 어떤 목적을 충족시키기로 선택하든, 충족되지 않은 채로 남아야 하는 다른 것이 존재하기 마련이기 때문이다. 우리가 어떤 목적이 충족되지 않은 채로 남아있도록 수단을 사용해야 할 때, '목적 중에서 하나를 선택'해야 할 필요성이 생긴다. 예를 들어, Jones는 텔레비전으로 야구 경기를 시청하고 있다. 그는 앞으로 한 시간을 쓰는 데, (a) 야구 경기를 계속 시청할지, (b) 브리지 게임을 할지, 아니면 (c) 드라이브를 하러 갈지를 선택해야 하는 상황에 직면한다. 그는 이 세 가지를 모두 하고 싶지만, 그의 수단(시간)이 불충분하다. 결과적으로, 그는 '선택해야' 하는데, 하나의 목적은 충족될 수 있지만, 나머지 목적은 충족되지 않은 채로 있어야 한다. 그가 경로 A로 결정한다고 가정해 보자. 이것은 그가 목적 A의 충족 순위를 목적 B 혹은 C의 충족보다 더 높게 '매겼'음을 분명히 보여 준다.","read":[{"en":"Action takes place by choosing which ends shall be satisfied by the employment of means.","ko":"행동은 수단을 사용하여 어떤 목적을 충족시킬 것인가를 선택함으로써 일어난다.","chunks":[["Action takes place","행동은 일어난다"],["by choosing","선택함으로써"],["which ends shall be satisfied","어떤 목적이 충족될지를"],["by the employment of means.","수단의 사용을 통해."]]},{"en":"Time is scarce for man only because whichever ends he chooses to satisfy, there are others that must remain unsatisfied.","ko":"인간에게 시간이 '부족한' 이유는 어떤 목적을 충족시키기로 선택하든, 충족되지 않은 채로 남아야 하는 다른 것이 존재하기 마련이기 때문이다.","chunks":[["Time is scarce for man","인간에게 시간은 부족하다"],["only because","단지 ~ 때문에"],["whichever ends he chooses to satisfy,","어떤 목적을 충족시키기로 선택하든,"],["there are others","다른 것들이 있다"],["that must remain unsatisfied.","충족되지 않은 채로 남아야 하는."]]},{"en":"When we must use a means so that some ends remain unsatisfied, the necessity for a choice among ends arises.","ko":"우리가 어떤 목적이 충족되지 않은 채로 남아있도록 수단을 사용해야 할 때, '목적 중에서 하나를 선택'해야 할 필요성이 생긴다.","chunks":[["When we must use a means","우리가 수단을 사용해야 할 때"],["so that some ends remain unsatisfied,","어떤 목적이 충족되지 않은 채로 남도록,"],["the necessity for a choice among ends","목적 중에서 선택의 필요성이"],["arises.","생긴다."]]},{"en":"For example, Jones is engaged in watching a baseball game on television.","ko":"예를 들어, Jones는 텔레비전으로 야구 경기를 시청하고 있다.","chunks":[["For example,","예를 들어,"],["Jones is engaged in","Jones는 ~에 종사하고 있다"],["watching a baseball game on television.","텔레비전으로 야구 경기를 시청하는 것."]]},{"en":"He is faced with the choice of spending the next hour in: (a) continuing to watch the baseball game, (b) playing bridge, or (c) going for a drive.","ko":"그는 앞으로 한 시간을 쓰는 데, (a) 야구 경기를 계속 시청할지, (b) 브리지 게임을 할지, 아니면 (c) 드라이브를 하러 갈지를 선택해야 하는 상황에 직면한다.","chunks":[["He is faced with","그는 ~에 직면한다"],["the choice of spending the next hour","다음 한 시간을 쓰는 선택에"],["in: (a) continuing to watch the baseball game,","(a) 야구 경기를 계속 시청할지,"],["(b) playing bridge,","(b) 브리지 게임을 할지,"],["or (c) going for a drive.","아니면 (c) 드라이브를 하러 갈지."]]},{"en":"He would like to do all three of these things, but his means (time) is insufficient.","ko":"그는 이 세 가지를 모두 하고 싶지만, 그의 수단(시간)이 불충분하다.","chunks":[["He would like to do","그는 ~하고 싶다"],["all three of these things,","이 세 가지 모두를,"],["but his means (time)","하지만 그의 수단(시간)이"],["is insufficient.","불충분하다."]]},{"en":"As a result, he must choose; one end can be satisfied, but the others must go unfulfilled.","ko":"결과적으로, 그는 '선택해야' 하는데, 하나의 목적은 충족될 수 있지만, 나머지 목적은 충족되지 않은 채로 있어야 한다.","chunks":[["As a result,","결과적으로,"],["he must choose;","그는 선택해야 한다;"],["one end can be satisfied,","한 목적은 충족될 수 있지만,"],["but the others must go unfulfilled.","나머지 목적들은 충족되지 않은 채로 있어야 한다."]]},{"en":"Suppose that he decides on course A.","ko":"그가 경로 A로 결정한다고 가정해 보자.","chunks":[["Suppose that","~라고 가정하자"],["he decides on course A.","그가 경로 A로 결정한다고."]]},{"en":"This is a clear indication that he has ranked the satisfaction of end A higher than the satisfaction of ends B or C.","ko":"이것은 그가 목적 A의 충족 순위를 목적 B 혹은 C의 충족보다 더 높게 '매겼'음을 분명히 보여 준다.","chunks":[["This is a clear indication","이것은 명백한 표시이다"],["that he has ranked","그가 ~ 순위를 매겼다는"],["the satisfaction of end A","목적 A의 충족을"],["higher than the satisfaction of ends B or C.","목적 B 또는 C의 충족보다 더 높게."]]}]},{"no":"2","title":"Selection Pressure and Tolerance","ktitle":"환경 압력이 ‘내성’을 키운다 (살충제 역설)","field":"생물·환경","page":"p63 no.02","oneline":"선택 압력은 <span class='g'>빠른 적응</span>을 만들지만 — 살충제도 같은 원리로 <span class='r'>'내성 개체'를 선택</span>해, 결국 <span class='r'>다양성도 줄고 살충제 효력도 떨어지는 역설</span>을 낳는다.","metaphor":"<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 다양한 종의 해충 무리에 살충제가 작용해 대부분 죽고 내성 개체만 살아남아 번식한 결과 오른쪽에 한 종만 가득 차고 살충제 효력은 떨어지는 역설의 그림\">\n  <!-- 좌측: 사용 전 — 다양한 해충 -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"110\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">처음 — 다양한 해충</text>\n    <rect x=\"0\" y=\"0\" width=\"220\" height=\"150\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n\n    <!-- 다양한 해충 모양 5종 (다양성↑) -->\n    <!-- 원형 -->\n    <g transform=\"translate(40, 30)\">\n      <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"-2\" cy=\"-1\" r=\"1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"2\" cy=\"-1\" r=\"1\" fill=\"#1a1a1a\"/>\n    </g>\n    <g transform=\"translate(120, 35)\">\n      <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"-2\" cy=\"-1\" r=\"1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"2\" cy=\"-1\" r=\"1\" fill=\"#1a1a1a\"/>\n    </g>\n    <!-- 삼각형 -->\n    <g transform=\"translate(75, 40)\">\n      <polygon points=\"0,-7 -7,5 7,5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"-2\" cy=\"0\" r=\"0.9\" fill=\"#1a1a1a\"/>\n      <circle cx=\"2\" cy=\"0\" r=\"0.9\" fill=\"#1a1a1a\"/>\n    </g>\n    <g transform=\"translate(170, 50)\">\n      <polygon points=\"0,-7 -7,5 7,5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"-2\" cy=\"0\" r=\"0.9\" fill=\"#1a1a1a\"/>\n      <circle cx=\"2\" cy=\"0\" r=\"0.9\" fill=\"#1a1a1a\"/>\n    </g>\n    <!-- 사각형 (검정 채움) -->\n    <g transform=\"translate(50, 85)\">\n      <rect x=\"-7\" y=\"-7\" width=\"14\" height=\"14\" fill=\"#1a1a1a\"/>\n    </g>\n    <g transform=\"translate(150, 80)\">\n      <rect x=\"-7\" y=\"-7\" width=\"14\" height=\"14\" fill=\"#1a1a1a\"/>\n    </g>\n    <!-- 줄무늬 (직사각) -->\n    <g transform=\"translate(95, 95)\">\n      <rect x=\"-8\" y=\"-5\" width=\"16\" height=\"10\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"-8\" y1=\"-2\" x2=\"8\" y2=\"-2\"

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · Booster 구문독해 CHAPTER 02 (7지문)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   Booster 구문독해 CHAPTER 02 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>

<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">

    <div class="b-sub">Booster 구문독해 CHAPTER 02</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — Booster 구문독해 CHAPTER 02 7개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */

-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">문화 A — \"HOT\"</text>\n    <rect x=\"0\" y=\"8\" width=\"200\" height=\"80\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    \n    <!-- 음식 라벨 — 모두 hot -->\n    <g font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\">\n      <text x=\"50\" y=\"30\" fill=\"#c8102e\" font-weight=\"700\">milk</text>\n      <text x=\"50\" y=\"44\" font-size=\"9\" fill=\"#c8102e\">hot</text>\n      <text x=\"150\" y=\"30\" fill=\"#c8102e\" font-weight=\"700\">chicken</text>\n      <text x=\"150\" y=\"44\" font-size=\"9\" fill=\"#c8102e\">hot</text>\n      <text x=\"50\" y=\"68\" fill=\"#c8102e\" font-weight=\"700\">yogurt</text>\n      <text x=\"50\" y=\"80\" font-size=\"9\" fill=\"#c8102e\">hot</text>\n      <text x=\"150\" y=\"68\" fill=\"#c8102e\" font-weight=\"700\">beef</text>\n      <text x=\"150\" y=\"80\" font-size=\"9\" fill=\"#c8102e\">hot</text>\n    </g>\n  </g>\n\n  <!-- vs 표시 -->\n  <text x=\"300\" y=\"172\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 우측: 문화 B — \"cold\" -->\n  <g transform=\"translate(360, 130)\">\n    <text x=\"100\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">문화 B — \"COLD\"</text>\n    <rect x=\"0\" y=\"8\" width=\"200\" height=\"80\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    \n    <g font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\">\n      <text x=\"50\" y=\"30\" fill=\"#1FA34A\" font-weight=\"700\">milk</text>\n      <text x=\"50\" y=\"44\" font-size=\"9\" fill=\"#1FA34A\">cold</text>\n      <text x=\"150\" y=\"30\" fill=\"#1FA34A\" font-weight=\"700\">chicken</text>\n      <text x=\"150\" y=\"44\" font-size=\"9\" fill=\"#1FA34A\">cold</text>\n      <text x=\"50\" y=\"68\" fill=\"#1FA34A\" font-weight=\"700\">yogurt</text>\n      <text x=\"50\" y=\"80\" font-size=\"9\" fill=\"#1FA34A\">cold</text>\n      <text x=\"150\" y=\"68\" fill=\"#1FA34A\" font-weight=\"700\">beef</text>\n      <text x=\"150\" y=\"80\" font-size=\"9\" fill=\"#1FA34A\">cold</text>\n    </g>\n  </g>\n\n  <!-- 하단: 의료진 → 환자에게 직접 물음 -->\n  <g transform=\"translate(300, 250)\">\n    <!-- 의료진 -->\n    <g transform=\"translate(-90, 0)\">\n      <circle cx=\"0\" cy=\"-7\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"-1\" x2=\"0\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"-5\" y1=\"3\" x2=\"5\" y2=\"3\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">doctor</text>\n    </g>\n    <!-- 화살표 -->\n    <line x1=\"-78\" y1=\"0\" x2=\"-15\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <polygon points=\"-15,0 -22,-3 -22,3\" fill=\"#1a1a1a\"/>\n    <text x=\"-45\" y=\"-17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">\"What's your category?\"</text>\n    <!-- 환자 -->\n    <g transform=\"translate(15, 0)\">\n      <circle cx=\"0\" cy=\"-7\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"-1\" x2=\"0\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">patient</text>\n    </g>\n    <text x=\"60\" y=\"3\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#1a1a1a\">— 환자에게 직접 물어야</text>\n  </g>\n</svg>", "caption": "같은 음식이라도 한 문화는 \"hot\"으로, 다른 문화는 \"cold\"로 분류 — 실제 온도와 무관한 문화적 라벨링이므로 의료진은 환자에게 직접 물어야 한다.", "tldr": ["여러 문화권은 음식을 ‘뜨겁다/차갑다’로 분류하는데 실제 온도와 무관하다.", "집단마다 기준이 달라(아시아: 고기=뜨거움 / 라틴: 얼음=뜨거움) 일관된 원리가 없다.", "그래서 의료진은 환자에게 ‘어떤 음식이 도움될지’ 직접 물어보는 게 낫다."], "analogy": "같은 고기를 누구는 ‘뜨거운 음식’, 누구는 ‘차가운 음식’으로 봐요. 온도와 상관없는 문화적 분류라, 의료진이 짐작하지 말고 환자에게 직접 물어야 하죠.", "bg": "분야는 문화·의학이에요. 음식을 ‘hot/cold’로 나누는 분류가 핵심 소재 — 실제 온도가 아니라 문화적 라벨링이라는 점. → 같은 음식이 집단마다 정반대로 분류되는 현상이 의료에 왜 중요한지에 주목하며 읽으세요.", "flow": [{"kind": "현상", "t": "음식을 ‘뜨겁다/차갑다’로 분류 (실제 온도 무관)"}, {"kind": "차이", "t": "아시아: 고기·달걀=뜨거움 / 라틴: 얼음=뜨거움"}, {"kind": "문제", "t": "일관된 원리 없음 → 다문화 환자 돌보기 어려움"}, {"kind": "해법", "t": "환자에게 ‘어떤 음식이 도움될지’ 직접 물어라"}], "vocab": [["classify", "분류하다"], ["have nothing to do with", "~과 관련이 없다"], ["principle", "원리"], ["practitioner", "종사자·개업의"], ["look after", "돌보다"], ["take ~ for granted", "~을 당연하게 여기다"], ["routinely", "일상적으로"]], "quiz": [["음식의 ‘뜨겁다/차갑다’ 분류의 특징은?", "실제 온도와 무관한 문화적 분류라, 집단마다 기준이 달라 일관된 원리가 없어요."], ["의료진에게 권하는 방법은?", "환자가 식사를 거부하면 짐작하지 말고, 어떤 음식이 도움이 될지 직접 물어보는 거예요."], ["핵심 한 문장?", "음식의 ‘뜨겁다/차갑다’는 온도가 아닌 문화적 분류라, 의료진은 환자에게 직접 물어야 한다."]], "en": "In many parts of the world, people classify foods as either hot or cold. But whether a food is labeled hot or cold has nothing to do with actual temperature, and what may be considered hot to one group may be considered cold by another. For example, Asians classify meats and eggs as hot, and fresh fruits and vegetables as cold. Latinos classify ice as hot and meats as cold. Obviously, there is no easily observed principle in this classification scheme. This makes it difficult for health practitioners to look after patients from various cultures. After surgery, one group of people may take it for granted that they should avoid cold foods, while others may do the opposite. Therefore, if a patient routinely refuses meals, it would be better for the nurse or doctor to ask the patient just what foods would be helpful.", "ko": "세계의 여러 곳에서, 사람들은 음식을 뜨겁거나 차가운 것으로 분류한다. 그러나 음식이 뜨겁거나 혹은 차갑다고 분류되는 것의 여부는 실제 온도와 아무 관련이 없으며, 한 집단에게 뜨겁다고 여겨질 수 있는 것이 다른 집단에게는 차갑다고 여겨질 수 있다. 예를 들어, 아시아 사람들은 고기와 달걀을 뜨거운 것으로 분류하고, 신선한 과일과 채소를 차가운 것으로 분류한다. 라틴계 사람들은 얼음을 뜨거운 것으로, 고기를 차가운 것으로 분류한다. 명백히, 이런 분류 체계에서 쉽게 관찰되는 원리는 없다. 이는 의료 종사자들이 다양한 문화 출신의 환자들을 돌보는 것을 어렵게 한다. 수술 후에, 한 집단의 사람들은 그들이 차가운 음식을 피하는 것을 당연히 여길지도 모르는 반면, 다른 집단은 그 반대로 할지도 모른다. 그러므로, 어떤 환자가 일상적으로 식사를 거부한다면, 간호사나 의사는 그 환자에게 그냥 어떤 음식이 도움이 될지를 물어보는 것이 더 나을 것이다.", "read": [{"en": "In many parts of the world, people classify foods as either hot or cold.", "ko": "세계의 여러 곳에서, 사람들은 음식을 뜨겁거나 차가운 것으로 분류한다.", "chunks": [["In many parts of the world,", "세계의 여러 곳에서,"], ["people classify foods", "사람들은 음식을 분류한다"], ["as either hot or cold.", "뜨겁거나 차가운 것으로."]]}, {"en": "But whether a food is labeled hot or cold has nothing to do with actual temperature, and what may be considered hot to one group may be considered cold by another.", "ko": "그러나 음식이 뜨겁거나 혹은 차갑다고 분류되는 것의 여부는 실제 온도와 아무 관련이 없으며, 한 집단에게 뜨겁다고 여겨질 수 있는 것이 다른 집단에게는 차갑다고 여겨질 수 있다.", "chunks": [["But whether a food is labeled hot or cold", "그러나 음식이 뜨겁거나 차갑다고 분류되는지 여부는"], ["has nothing to do with actual temperature,", "실제 온도와 아무 관련이 없으며,"], ["and what may be considered hot to one group", "그리고 한 집단에게 뜨겁다고 여겨질 수 있는 것이"], ["may be considered cold by another.", "다른 집단에게는 차갑다고 여겨질 수 있다."]]}, {"en": "For example, Asians classify meats and eggs as hot, and fresh fruits and vegetables as cold.", "ko": "예를 들어, 아시아 사람들은 고기와 달걀을 뜨거운 것으로 분류하고, 신선한 과일과 채소를 차가운 것으로 분류한다.", "chunks": [["For example, Asians classify", "예를 들어, 아시아 사람들은 분류한다"], ["meats and eggs as hot,", "고기와 달걀을 뜨거운 것으로,"], ["and fresh fruits and vegetables as cold.", "그리고 신선한 과일과 채소를 차가운 것으로."]]}, {"en": "Latinos classify ice as hot and meats as cold.", "ko": "라틴계 사람들은 얼음을 뜨거운 것으로, 고기를 차가운 것으로 분류한다.", "chunks": [["Latinos classify ice as hot", "라틴계 사람들은 얼음을 뜨거운 것으로 분류하고"], ["and meats as cold.", "고기를 차가운 것으로 분류한다."]]}, {"en": "Obviously, there is no easily observed principle in this classification scheme.", "ko": "명백히, 이런 분류 체계에서 쉽게 관찰되는 원리는 없다.", "chunks": [["Obviously,", "명백히,"], ["there is no easily observed principle", "쉽게 관찰되는 원리는 없다"], ["in this classification scheme.", "이 분류 체계 안에서."]]}, {"en": "This makes it difficult for health practitioners to look after patients from various cultures.", "ko": "이는 의료 종사자들이 다양한 문화 출신의 환자들을 돌보는 것을 어렵게 한다.", "chunks": [["This makes it difficult", "이는 ~을 어렵게 만든다"], ["for health practitioners", "의료 종사자들이"], ["to look after patients from various cultures.", "다양한 문화 출신의 환자를 돌보는 것을."]]}, {"en": "After surgery, one group of people may take it for granted that they should avoid cold foods, while others may do the opposite.", "ko": "수술 후에, 한 집단의 사람들은 그들이 차가운 음식을 피하는 것을 당연히 여길지도 모르는 반면, 다른 집단은 그 반대로 할지도 모른다.", "chunks": [["After surgery,", "수술 후에,"], ["one group of people may take it for granted", "한 집단의 사람들은 ~을 당연히 여길지도 모른다"], ["that they should avoid cold foods,", "그들이 차가운 음식을 피해야 한다는 것을,"], ["while others may do the opposite.", "반면 다른 사람들은 그 반대로 할지도 모른다."]]}, {"en": "Therefore, if a patient routinely refuses meals, it would be better for the nurse or doctor to ask the patient just what foods would be helpful.", "ko": "그러므로, 어떤 환자가 일상적으로 식사를 거부한다면, 간호사나 의사는 그 환자에게 그냥 어떤 음식이 도움이 될지를 물어보는 것이 더 나을 것이다.", "chunks": [["Therefore,", "그러므로,"], ["if a patient routinely refuses meals,", "만약 환자가 일상적으로 식사를 거부한다면,"], ["it would be better for the nurse or doctor", "간호사나 의사가 ~하는 것이 더 나을 것이다"], ["to ask the patient just what foods would be helpful.", "그 환자에게 그저 어떤 음식이 도움이 될지를 물어보는 것이."]]}]}, {"no": "2", "title": "Sellers, Norms, and Market Dynamics", "ktitle": "같은 가격은 ‘규범’이 아니라 ‘시장’ 때문", "field": "경제", "page": "p27", "oneline": "같은 가격 매기기는 <span class='r'>사회 규범 순응이 아니라</span> <span class='g'>시장 역학의 결과</span> — 단 <span class='g'>가격이 평판 신호일 때만</span> 규범이 끼어든다.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 판매자들이 시장 역학에 따라 같은 가격을 매기는 모습과 오른쪽 가격이 평판 신호일 때 규범 압력이 끼어드는 예외 조건의 대조\">\n  <!-- 좌측: 기본 — 시장 역학 -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">기본 — 시장 역학</text>\n    <rect x=\"0\" y=\"0\" w ll=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"42\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">$10</text>\n      </g>\n    </g>\n\n    <!-- 시장 역학 톱니바퀴 (3개) -->\n    <g transform=\"translate(135, 135)\">\n      <!-- 톱니 1: 수요 -->\n      <g transform=\"translate(-55, 0)\">\n        <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n        <g stroke=\"#1FA34A\" stroke-width=\"1.4\">\n          <line x1=\"0\" y1=\"-18\" x2=\"0\" y2=\"-14\"/>\n          <line x1=\"13\" y1=\"-13\" x2=\"10\" y2=\"-10\"/>\n          <line x1=\"18\" y1=\"0\" x2=\"14\" y2=\"0\"/>\n          <line x1=\"13\" y1=\"13\" x2=\"10\" y2=\"10\"/>\n          <line x1=\"0\" y1=\"18\" x2=\"0\" y2=\"14\"/>\n          <line x1=\"-13\" y1=\"13\" x2=\"-10\" y2=\"10\"/>\n          <line x1=\"-18\" y1=\"0\" x2=\"-14\" y2=\"0\"/>\n          <line x1=\"-13\" y1=\"-13\" x2=\"-10\" y2=\"-10\"/>\n        </g>\n        <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\">demand</text>\n      </g>\n      <!-- 톱니 2: 공급 -->\n      <g transform=\"translate(0, 0)\">\n        <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n        <g stroke=\"#1FA34A\" stroke-width=\"1.4\">\n          <line x1=\"0\" y1=\"-18\" x2=\"0\" y2=\"-14\"/>\n          <line x1=\"13\" y1=\"-13\" x2=\"10\" y2=\"-10\"/>\n          <line x1=\"18\" y1=\"0\" x2=\"14\" y2=\"0\"/>\n          <line x1=\"13\" y1=\"13\" x2=\"10\" y2=\"10\"/>\n          <line x1=\"0\" y1=\"18\" x2=\"0\" y2=\"14\"/>\n          <line x1=\"-13\" y1=\"13\" x2=\"-10\" y2=\"10\"/>\n          <line x1=\"-18\" y1=\"0\" x2=\"-14\" y2=\"0\"/>\n          <line x1=\"-13\" y1=\"-13\" x2=\"-10\" y2=\"-10\"/>\n        </g>\n        <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\">supply</text>\n      </g>\n      <!-- 톱니 3: 경쟁 -->\n      <g transform=\"translate(55, 0)\">\n        <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n        <g stroke=\"#1FA34A\" stroke-width=\"1.4\">\n          <line x1=\"0\" y1=\"-18\" x2=\"0\" y2=\"-14\"/>\n          <line x1=\"13\" y1=\"-13\" x2=\"10\" y2=\"-10\"/>\n          <line x1=\"18\" y1=\"0\" x2=\"14\" y2=\"0\"/>\n          <line x1=\"13\" y1=\"13\" x2=\"10\" y2=\"10\"/>\n          <line x1=\"0\" y1=\"18\" x2=\"0\" y2=\"14\"/>\n          <line x1=\"-13\" y1=\"13\" x2=\"-10\" y2=\"10\"/>\n          <line x1=\"-18\" y1=\"0\" x2=\"-14\" y2=\"0\"/>\n          <line x1=\"-13\" y1=\"-13\" x2=\"-10\" y2=\"-10\"/>\n        </g>\n        <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\">competition</text>\n      </g>\n    </g>\n\n    <text x=\"135\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">market dynamics, NOT norms</text>\n  </g>\n\n  <!-- 가운데 vs -->\n  <text x=\"300\" y=\"125\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 우측: 예외 — 평판 신호 -->\n  <g transform=\"translate(315, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">예외 — 평판 신호 작용</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n\n    <!-- 가격표 + 평판 신호 -->\n    <g transform=\"translate(135, 50)\">\n      <rect x=\"-35\" y=\"-18\" width=\"70\" height=\"36\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">$10</text>\n      <text x=\"0\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">price</text>\n    </g>\n\n    <!-- 평판 신호 (별점·뱃지) — 가격에 부착 -->\n    <g transform=\"translate(135, 105)\">\n      <!-- 별점 -->\n      <g fill=\"#c8102e\">\n        <polygon points=\"-30,0 -27,-6 -24,0 -18,1 -22,5 -21,11 -27,8 -33,11 -32,5 -36,1\"/>\n        <polygon points=\"-15,0 -12,-6 -9,0 -3,1 -7,5 -6,11 -12,8 -18,11 -17,5 -21,1\"/>\n        <polygon points=\"0,0 3,-6 6,0 12,1 8,5 9,11 3,8 -3,11 -2,5 -6,1\"/>\n      </g>\n      <!-- 뱃지 -->\n      <g transform=\"translate(25, 3)\">\n        <circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">★</text>\n      </g>\n    </g>\n\n    <!-- 라벨 -->\n    <text x=\"135\" y=\"135\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">price = quality signal</text>\n\n    <!-- 규범 압력 화살표 -->\n    <g transform=\"translate(135, 160)\">\n      <line x1=\"-30\" y1=\"0\" x2=\"30\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"1.8\" stroke-dasharray=\"4 2\"/>\n      <polygon points=\"30,0 22,-4 22,4\" fill=\"#c8102e\"/>\n    </g>\n    \n    <text x=\"135\" y=\"183\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">norms kick in — pressure to conform</text>\n  </g>\n</svg>", "caption": "기본: 판매자들의 같은 가격 = 시장 역학(수요·공급·경쟁)의 자연스러운 결과. 예외: 가격이 평판 신호(품질·신뢰도 표시)가 될 때만 규범적 압력이 끼어든다.", "tldr": ["같은 상품에 같은 가격은 ‘사회 규범 순응’이 아니라 ‘시장 역학’의 결과다.", "비싸면 고객을 잃고, 너무 싸면 비용을 못 메워 — 둘 다 시장에서 사라진다.", "다만 때론 규범 반영도(허리케인 후 기름값 동결 — 기회주의자로 안 보이려)."], "analogy": "가게마다 값이 비슷한 건 ‘약속’이 아니라, 비싸면 손님이 떠나고 너무 싸면 망하기 때문이에요. 다만 재난 직후 값을 안 올리는 건 ‘악덕 상인’ 소리를 피하려는 거고요.", "bg": "분야는 경제예요. 핵심 물음은 ‘판매자들이 같은 가격을 매기는 것 = 사회 규범 순응인가’. → 그 규칙성이 규범 때문인지 시장 역학 때문인지, 글의 답을 따라가며 읽으세요.", "flow": [{"kind": "질문", "t": "같은 가격 = 사회 규범 순응인가? → ‘아니다’"}, {"kind": "이유", "t": "시장 역학: 비싸면 고객↓ / 너무 싸면 비용 못 메움 → 둘 다 퇴출"}, {"kind": "예외", "t": "때론 규범 반영 — 허리케인 후 기름값 동결", "cls": "pivot"}, {"kind": "동기", "t": "고객이 ‘신뢰 못 할 기회주의자’로 추론할까 두려움"}], "vocab": [["charge", "(값을) 매기다"], ["identical", "동일한"], ["conformity", "순응"], ["norm", "규범"], ["cover costs", "비용을 메우다"], ["shortage", "부족"], ["opportunist", "기회주의자"]], "quiz": [["같은 상품에 같은 가격이 매겨지는 진짜 이유는?", "사회 규범 순응이 아니라, 비싸면 고객을 잃고 너무 싸면 비용을 못 메우는 ‘시장 역학’ 때문이에요."], ["가격이 규범을 반영하는 예외는?", "허리케인 후 부족이 생겨도 기름값을 낮게 유지하는 것 — ‘신뢰 못 할 기회주의자’로 보일까 두렵기 때문이에요."], ["핵심 한 문장?", "같은 가격은 대개 시장 역학의 결과지만, 때로는 평판을 의식한 규범 순응을 반영하기도 한다."]], "en": "Different sellers usually charge the same price for identical goods: should this behavioral regularity be understood as conformity to a social norm? The answer is no. The behavioral regularity results not from concerns about reputation, but from the dynamics of the market. Sellers who charge high prices will lose their customers, and sellers who charge low prices will not cover costs [that went into making their products]; both will vanish from the market. However, sometimes prices do reflect conformity to social norms. A business might keep oil prices down after a hurricane, even though this would result in a shortage, because it fears that customers would infer from a high price that the business is an unreliable opportunist, even under ordinary circumstances where it makes promises about the quality of its products.", "ko": "여러 판매자들은 보통 동일한 상품에 대해 동일한 가격을 매기는데, 이러한 행동 규칙성이 사회적 규범에 대한 순응으로 이해되어야 하는가? 대답은 '아니다'이다. 행동 규칙성은 평판에 대한 우려에서가 아니라 시장의 역학 관계에서 비롯된다. 높은 가격을 매기는 판매자들은 고객을 잃을 것이고, 낮은 가격을 매기는 판매자들은 제품을 생산하는 데 들어가는 비용을 감당하지 못하고, 둘 다 시장에서 사라질 것이다. 그러나, 때때로 가격은 사회 규범에 대한 순응을 반영하기도 한다. 기업은 허리케인이 지나간 이후에 결국 부족을 야기하더라도 원유 가격을 낮게 유지한다. 왜냐하면 제품의 품질에 대해 보장하는 일반적인 상황에서조차, 고객들이 (허리케인 직후 어려운 시기의) 높은 가격으로부터 그 기업이 신뢰할 수 없는 기회주의자라고 추론할 것을 두려워하기 때문이다.", "read": [{"en": "Different sellers usually charge the same price for identical goods: should this behavioral regularity be understood as conformity to a social norm?", "ko": "여러 판매자들은 보통 동일한 상품에 대해 동일한 가격을 매기는데, 이러한 행동 규칙성이 사회적 규범에 대한 순응으로 이해되어야 하는가?", "chunks": [["Different sellers usually charge the same price", "여러 판매자들이 보통 동일한 가격을 매긴다"], ["for identical goods:", "동일한 상품에 대해:"], ["should this behavioral regularity", "이러한 행동 규칙성이"], ["be understood as conformity to a social norm?", "사회적 규범에 대한 순응으로 이해되어야 하는가?"]]}, {"en": "The answer is no.", "ko": "대답은 '아니다'이다.", "chunks": [["The answer is no.", "대답은 '아니다'이다."]]}, {"en": "The behavioral regularity results not from concerns about reputation, but from the dynamics of the market.", "ko": "행동 규칙성은 평판에 대한 우려에서가 아니라 시장의 역학 관계에서 비롯된다.", "chunks": [["The behavioral regularity results", "행동 규칙성은 비롯된다"], ["not from concerns about reputation,", "평판에 대한 우려에서가 아니라,"], ["but from the dynamics of the market.", "시장의 역학에서."]]}, {"en": "Sellers who charge high prices will lose their customers, and sellers who charge low prices will not cover costs [that went into making their products]; both will vanish from the market.", "ko": "높은 가격을 매기는 판매자들은 고객을 잃을 것이고, 낮은 가격을 매기는 판매자들은 제품을 생산하는 데 들어가는 비용을 감당하지 못하고, 둘 다 시장에서 사라질 것이다.", "chunks": [["Sellers who charge high prices", "높은 가격을 매기는 판매자들은"], ["will lose their customers,", "그들의 고객을 잃을 것이고,"], ["and sellers who charge low prices", "그리고 낮은 가격을 매기는 판매자들은"], ["will not cover costs", "비용을 감당하지 못할 것이다"], ["[that went into making their products];", "[그들의 제품을 만드는 데 들어간] 비용을;"], ["both will vanish from the market.", "둘 다 시장에서 사라질 것이다."]]}, {"en": "However, sometimes prices do reflect conformity to social norms.", "ko": "그러나, 때때로 가격은 사회 규범에 대한 순응을 반영하기도 한다.", "chunks": [["However, sometimes prices do reflect", "그러나, 때때로 가격은 정말로 반영한다"], ["conformity to social norms.", "사회 규범에 대한 순응을."]]}, {"en": "A business might keep oil prices down after a hurricane, even though this would result in a shortage, because it fears that customers would infer from a high price that the business is an unreliable opportunist, even under ordinary circumstances where it makes promises about the quality of its products.", "ko": "기업은 허리케인이 지나간 이후에 결국 부족을 야기하더라도 원유 가격을 낮게 유지할 수도 있는데, 일반적인 상황에서 제품 품질에 대해 보장하는 그런 기업조차도 고객이 높은 가격을 보고 신뢰할 수 없는 기회주의자라고 추론할 것을 두려워하기 때문이다.", "chunks": [["A business might keep oil prices down", "한 기업은 원유 가격을 낮게 유지할지 모른다"], ["after a hurricane,", "허리케인 이후에,"], ["even though this would result in a shortage,", "비록 이것이 부족을 야기하더라도,"], ["because it fears that customers would infer", "왜냐하면 고객들이 추론할 것을 두려워하기 때문이다"], ["from a high price", "높은 가격으로부터"], ["that the business is an unreliable opportunist,", "그 기업이 신뢰할 수 없는 기회주의자라고,"], ["even under ordinary circumstances", "심지어 일상적인 상황에서조차"], ["where it makes promises about the quality of its products.", "그 기업이 제품 품질을 보장하는."]]}]}, {"no": "3", "title": "Hunters Thinking Like Their Prey", "ktitle": "사냥감처럼 ‘생각’해야 잡는다", "field": "통찰·기술", "page": "p28", "oneline": "뛰어난 사냥꾼은 <span class='r'>환경 지식만으로는 부족</span>하고 <span class='g'>사냥감의 시각으로 생각</span>해야 한다 — MacLean 소설의 형(지식)·동생(동일시) 대비.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 형이 환경 지식 풍선만 가지고 낚시 실패하는 모습과, 오른쪽 동생이 물고기와 같은 시각을 가지고 성공하는 그림\">\n  <!-- 좌측: 형 — 환경 지식만 -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">형 — 환경 지식만</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n\n    <!-- 형 stick figure -->\n    <g transform=\"translate(70, 110)\">\n      <circle cx=\"0\" cy=\"-15\" r=\"11\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-3\" cy=\"-16\" r=\"1.1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-16\" r=

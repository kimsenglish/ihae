     <circle cx=\"-50\" cy=\"48\" r=\"1.8\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    </g>\n\n    <!-- 결과 (실패 — 빈 바구니) -->\n    <g transform=\"translate(220, 145)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"15\" ry=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"-12\" y1=\"-2\" x2=\"-12\" y2=\"-12\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"12\" y1=\"-2\" x2=\"12\" y2=\"-12\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <path d=\"M -12 -12 Q 0 -18 12 -12\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">empty</text>\n      <!-- X 표시 -->\n      <g transform=\"translate(20, -10)\">\n        <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <line x1=\"-3\" y1=\"-3\" x2=\"3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <line x1=\"3\" y1=\"-3\" x2=\"-3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      </g>\n    </g>\n  </g>\n\n  <!-- 가운데 vs -->\n  <text x=\"300\" y=\"125\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 우측: 동생 — prey 시각으로 -->\n  <g transform=\"translate(315, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">동생 — prey의 시각</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"200\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 동생 stick figure -->\n    <g transform=\"translate(70, 110)\">\n      <circle cx=\"0\" cy=\"-15\" r=\"11\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-3\" cy=\"-16\" r=\"1.1\" fill=\"#1a1a1a\"/>\n      <circle cx=\"3\" cy=\"-16\" r=\"1.1\" fill=\"#1a1a1a\"/>\n      <path d=\"M -3 -10 Q 0 -8 3 -10\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"-4\" x2=\"0\" y2=\"25\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"5\" x2=\"10\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"5\" x2=\"-9\" y2=\"15\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"25\" x2=\"-7\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"25\" x2=\"7\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 낚싯대 -->\n      <line x1=\"10\" y1=\"0\" x2=\"22\" y2=\"-15\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"22\" y1=\"-15\" x2=\"35\" y2=\"35\" stroke=\"#1a1a1a\" stroke-width=\"0.8\" stroke-dasharray=\"1 1\"/>\n      <text x=\"0\" y=\"60\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">brother (perspective)</text>\n    </g>\n\n    <!-- 물고기 + 동생의 시각 공유 -->\n    <g transform=\"translate(170, 60)\">\n      <rect x=\"-50\" y=\"-25\" width=\"100\" height=\"60\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"-12\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">\"I am the fish\"</text>\n      <!-- 물고기 작은 도형 -->\n      <g transform=\"translate(0, 5)\">\n        <ellipse cx=\"0\" cy=\"0\" rx=\"14\" ry=\"6\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <polygon points=\"14,0 22,-5 22,5\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <circle cx=\"-6\" cy=\"-1\" r=\"1.1\" fill=\"#1FA34A\"/>\n      </g>\n      <text x=\"0\" y=\"26\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\">prey's view</text>\n      <circle cx=\"-42\" cy=\"40\" r=\"2.5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n      <circle cx=\"-50\" cy=\"48\" r=\"1.8\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n    </g>\n\n    <!-- 결과 (성공 — 큰 물고기 바구니) -->\n    <g transform=\"translate(220, 145)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"15\" ry=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <line x1=\"-12\" y1=\"-2\" x2=\"-12\" y2=\"-12\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n      <line x1=\"12\" y1=\"-2\" x2=\"12\" y2=\"-12\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n      <path d=\"M -12 -12 Q 0 -18 12 -12\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n      <!-- 물고기 작은 -->\n      <ellipse cx=\"-3\" cy=\"-3\" rx=\"5\" ry=\"2\" fill=\"#1FA34A\"/>\n      <ellipse cx=\"5\" cy=\"-1\" rx=\"4\" ry=\"2\" fill=\"#1FA34A\"/>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\">full</text>\n      <!-- 체크 표시 -->\n      <g transform=\"translate(20, -10)\">\n        <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#1FA34A\"/>\n        <path d=\"M -3 0 L -0.5 2.5 L 3 -2.5\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.6\"/>\n      </g>\n    </g>\n  </g>\n\n  <!-- 하단 출처 -->\n  <text x=\"300\" y=\"250\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">— Norman MacLean, A River Runs Through It</text>\n</svg>", "caption": "형(빨강): 환경 지식만(강의 흐름·물고기 종류 등 객관적 정보) → 잡기 어려움. 동생(초록): prey의 시각으로 동일시(물고기 입장에서 사고) → 빠르게 잡음.", "tldr": ["성공하는 사냥꾼·낚시꾼은 ‘사냥감처럼 생각’하는 법을 배워야 한다.", "<흐르는 강물처럼>의 형은 강·환경 지식은 깊지만 완벽한 낚시꾼은 아니다.", "동생 Paul은 ‘물고기 입장’에서 미끼를 다뤄 최고가 된다."], "analogy": "강과 물살을 잘 안다고 물고기를 잘 잡는 건 아니에요. ‘물고기 눈엔 이 미끼가 어떻게 보일까?’ 상대 입장에서 생각하는 동생이 진짜 고수죠.", "bg": "분야는 통찰·기술이에요. ‘뛰어난 사냥꾼은 사냥감처럼 생각해야 한다’가 핵심. MacLean 소설 『흐르는 강물처럼』의 두 형제(지식 vs 동일시) 대비가 나와요. → 환경 지식만으로 부족한 이유에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "성공하려면 ‘사냥감처럼 생각’해야 함"}, {"kind": "형", "t": "강·물살·바위 등 ‘환경 지식’은 깊지만 완벽하진 않음"}, {"kind": "동생 Paul", "t": "‘물고기 입장’으로 미끼를 봄·움직임·유인"}, {"kind": "결론", "t": "환경 지식 < ‘상대 관점’이 진짜 실력", "cls": "close"}], "vocab": [["prey", "사냥감·먹이"], ["dedicated to", "~에 헌신하는·심취한"], ["identification with", "~와의 동일시"], ["current", "물살·흐름"], ["profound", "심오한·깊은"], ["lure", "유인하다"], ["instinct", "직감·본능"]], "quiz": [["형이 ‘완벽한 낚시꾼’이 아닌 이유는?", "강·물살·바위 같은 환경 지식은 깊지만, 물고기의 관점에서 생각하는 능력은 부족하기 때문이에요."], ["동생 Paul이 최고인 이유는?", "물고기가 미끼를 어떻게 보는지 알고, 미끼를 진짜 곤충처럼 움직여 물고기의 행동·직감을 이용해 유인하기 때문이에요."], ["핵심 한 문장?", "성공하려면 환경 지식만으론 부족하고, 대상(사냥감)의 입장에서 생각해야 한다."]], "en": "To be successful, even the most technologically advanced hunters and fishermen must learn to think like their prey. Those who have read Norman MacLean's novel A River Runs Through It, the story of two brothers dedicated to fly fishing, will recognize the hunter's identification with his prey. The older brother, the narrator, developed a strong knowledge of the river, the currents within which the fish move and the rocks behind which they hide. In spite of his profound knowledge about the fish's environment, he's not a perfect fisherman. But his younger brother, Paul, is a master fisherman due to his totally different approach. He knows how a fish sees his fly, knows how to make the fly move like a true insect and how to lure the fish with his understanding of its behavior and instincts.", "ko": "성공하려면, 기술이 가장 뛰어난 사냥꾼과 낚시꾼이라도 사냥감처럼 생각하는 것을 배워야 한다. 플라이 낚시에 심취한 두 형제의 이야기인 Norman MacLean의 소설 <흐르는 강물처럼>을 읽어 본 사람이라면 사냥감에 대한 사냥꾼의 동일시를 알 수 있을 것이다. (소설의) 화자인 형은 강과 물고기가 노니는 강물의 흐름, 그들이 몸을 숨기는 바위에 대한 탄탄한 지식을 발전시켰다. 물고기의 서식 환경에 대한 그의 심도 있는 지식에도 불구하고, 그는 완벽한 낚시꾼이 아니다. 하지만 동생 Paul은 완전히 다른 접근 방식 때문에 최고의 낚시꾼이다. 그는 물고기가 미끼를 어떻게 보는지 알고 있고, 어떻게 미끼를 진짜 곤충처럼 움직이게 하는지 그리고 물고기의 행동에 대한 이해와 직감으로 물고기를 어떻게 유인하는지 알고 있는 것이다.", "read": [{"en": "To be successful, even the most technologically advanced hunters and fishermen must learn to think like their prey.", "ko": "성공하려면, 기술이 가장 뛰어난 사냥꾼과 낚시꾼이라도 사냥감처럼 생각하는 것을 배워야 한다.", "chunks": [["To be successful,", "성공하려면,"], ["even the most technologically advanced hunters and fishermen", "심지어 기술적으로 가장 진보한 사냥꾼과 낚시꾼이라도"], ["must learn to think", "~처럼 생각하는 것을 배워야 한다"], ["like their prey.", "그들의 사냥감처럼."]]}, {"en": "Those who have read Norman MacLean's novel A River Runs Through It, the story of two brothers dedicated to fly fishing, will recognize the hunter's identification with his prey.", "ko": "플라이 낚시에 심취한 두 형제의 이야기인 Norman MacLean의 소설 을 읽어 본 사람이라면 사냥감에 대한 사냥꾼의 동일시를 알 수 있을 것이다.", "chunks": [["Those who have read", "~을 읽어 본 사람이라면"], ["Norman MacLean's novel A River Runs Through It,", "Norman MacLean의 소설 을,"], ["the story of two brothers dedicated to fly fishing,", "플라이 낚시에 심취한 두 형제의 이야기인,"], ["will recognize the hunter's identification with his prey.", "사냥감에 대한 사냥꾼의 동일시를 알아볼 것이다."]]}, {"en": "The older brother, the narrator, developed a strong knowledge of the river, the currents within which the fish move and the rocks behind which they hide.", "ko": "(소설의) 화자인 형은 강과 물고기가 노니는 강물의 흐름, 그들이 몸을 숨기는 바위에 대한 탄탄한 지식을 발전시켰다.", "chunks": [["The older brother, the narrator,", "(소설의) 화자인 형은,"], ["developed a strong knowledge of the river,", "강에 대한 탄탄한 지식을 발전시켰다,"], ["the currents within which the fish move", "물고기가 그 안에서 움직이는 흐름과"], ["and the rocks behind which they hide.", "그들이 그 뒤에 숨는 바위에 대한."]]}, {"en": "In spite of his profound knowledge about the fish's environment, he's not a perfect fisherman.", "ko": "물고기의 서식 환경에 대한 그의 심도 있는 지식에도 불구하고, 그는 완벽한 낚시꾼이 아니다.", "chunks": [["In spite of his profound knowledge about the fish's environment,", "물고기 서식 환경에 대한 그의 심도 있는 지식에도 불구하고,"], ["he's not a perfect fisherman.", "그는 완벽한 낚시꾼이 아니다."]]}, {"en": "But his younger brother, Paul, is a master fisherman due to his totally different approach.", "ko": "하지만 동생 Paul은 완전히 다른 접근 방식 때문에 최고의 낚시꾼이다.", "chunks": [["But his younger brother, Paul,", "하지만 그의 동생 Paul은,"], ["is a master fisherman", "최고의 낚시꾼이다"], ["due to his totally different approach.", "그의 완전히 다른 접근 방식 덕분에."]]}, {"en": "He knows how a fish sees his fly, knows how to make the fly move like a true insect and how to lure the fish with his understanding of its behavior and instincts.", "ko": "그는 물고기가 미끼를 어떻게 보는지 알고 있고, 어떻게 미끼를 진짜 곤충처럼 움직이게 하는지 그리고 물고기의 행동에 대한 이해와 직감으로 물고기를 어떻게 유인하는지 알고 있는 것이다.", "chunks": [["He knows how a fish sees his fly,", "그는 물고기가 그의 미끼를 어떻게 보는지 알고 있고,"], ["knows how to make the fly move like a true insect", "미끼를 진짜 곤충처럼 움직이게 하는 법을 알고 있다"], ["and how to lure the fish", "그리고 물고기를 유인하는 법을"], ["with his understanding of its behavior and instincts.", "물고기의 행동과 본능에 대한 그의 이해로."]]}]}, {"no": "4", "title": "Mount Rushmore Sculpture", "ktitle": "러시모어 산 — 산에 새긴 대통령들", "field": "역사·예술", "page": "p28", "oneline": "Mount Rushmore는 Robinson의 제안을 <span class='g'>Borglum이 14년에 걸쳐</span> 네 대통령의 머리·어깨를 산에 조각한 거대 기념물이다.", "metaphor": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Mount Rushmore 산에 새겨진 네 대통령 두상과 하단에 Robinson 제안·Borglum 14년 작업이라는 연표\">\n  <!-- 상단: Mount Rushmore — 산 + 네 대통령 두상 -->\n  <g transform=\"translate(20, 25)\">\n    <text x=\"280\" y=\"-7\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Mount Rushmore National Memorial</text>\n    \n    <!-- 산 윤곽 -->\n    <path d=\"M 0 130 L 60 60 L 110 70 L 180 40 L 260 50 L 330 35 L 410 55 L 480 45 L 560 65 L 560 130 Z\" \n          fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n\n    <!-- 4 대통령 두상 (옆모습 단순 실루엣) -->\n    <!-- Washington -->\n    <g transform=\"translate(95, 78)\">\n      <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 코·턱 옆모습 단순화 -->\n      <path d=\"M 10 -2 Q 14 0 11 4 Q 8 8 10 12\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 머리카락 -->\n      <path d=\"M -12 -8 Q -8 -14 0 -14\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">Washington</text>\n      <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">1789</text>\n    </g>\n\n    <!-- Jefferson -->\n    <g transform=\"translate(195, 65)\">\n      <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <path d=\"M 10 -2 Q 14 0 11 4 Q 8 8 10 12\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <path d=\"M -12 -8 Q -8 -13 0 -13\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">Jefferson</text>\n      <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">1801</text>\n    </g>\n\n    <!-- Roosevelt -->\n    <g transform=\"translate(305, 58)\">\n      <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <path d=\"M 10 -2 Q 14 0 11 4 Q 8 8 10 12\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 콧수염 -->\n      <line x1=\"6\" y1=\"4\" x2=\"12\" y2=\"3\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 안경 -->\n      <circle cx=\"3\" cy=\"-2\" r=\"2.5\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">Roosevelt</text>\n      <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">1901</text>\n    </g>\n\n    <!-- Lincoln -->\n    <g transform=\"translate(420, 75)\">\n      <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <path d=\"M 10 -2 Q 14 0 11 4 Q 8 8 10 12\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 수염 -->\n      <path d=\"M 5 8 Q 8 12 11 14\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 모자 -->\n      <rect x=\"-9\" y=\"-18\" width=\"18\" height=\"5\" fill=\"#1a1a1a\"/>\n      <rect x=\"-6\" y=\"-22\" width=\"12\" height=\"6\" fill=\"#1a1a1a\"/>\n      <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">Lincoln</text>\n      <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">1861</text>\n    </g>\n\n    <!-- 산 표면 라벨 -->\n    <text x=\"280\" y=\"155\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">South Dakota · Black Hills</text>\n  </g>\n\n  <!-- 하단: 연표 -->\n  <g transform=\"translate(40, 200)\">\n    <text x=\"260\" y=\"-5\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">제작 연표</text>\n    \n    <!-- 타임라인 -->\n    <line x1=\"0\" y1=\"20\" x2=\"520\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <polygon points=\"520,20 512,16 512,24\" fill=\"#1a1a1a\"/>\n    \n    <!-- 1923 Robinson 제안 -->\n    <g transform=\"translate(40, 20)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"-5\" x2=\"0\" y2=\"-15\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"-19\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">1923</text>\n      <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">Robinson</text>\n      <text x=\"0\" y=\"43\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">제안</text>\n    </g>\n\n    <!-- 1927 Borglum 시작 -->\n    <g transform=\"translate(180, 20)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"-5\" x2=\"0\" y2=\"-15\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"-19\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">1927</text>\n      <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">Borglum</text>\n      <text x=\"0\" y=\"43\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">착공</text>\n    </g>\n\n    <!-- 14 years 라벨 -->\n    <g transform=\"translate(330, 20)\">\n      <path d=\"M -150 0 L 0 0\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <text x=\"-75\" y=\"-5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">14 years</text>\n    </g>\n\n    <!-- 1941 완성 -->\n    <g transform=\"translate(330, 20)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"-5\" x2=\"0\" y2=\"-15\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"-19\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">1941</text>\n      <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">완공</text>\n    </g>\n\n    <!-- 통계 박스 -->\n    <g transform=\"translate(465, 5)\">\n      <rect x=\"-50\" y=\"0\" width=\"100\" height=\"36\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"13\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">4 presidents</text>\n      <text x=\"0\" y=\"25\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">60 ft heads</text>\n    </g>\n  </g>\n</svg>", "caption": "South Dakota Black Hills의 산 위에 네 대통령(Washington · Jefferson · Roosevelt · Lincoln)의 두상이 조각된 거대 기념물 — Robinson의 제안에서 시작해 Borglum이 14년에 걸쳐 완성.", "tldr": ["러시모어 산(사우스다코타)엔 세계 최대급 조각이 새겨져 있다.", "Robinson이 제안, 조각가 Borglum이 1927년부터 14년에 걸쳐 완성.", "대통령 4명의 머리·어깨만 — 머리만 18m, 100km 밖에서도 보인다."], "analogy": "산비탈을 통째로 ‘깎아’ 대통령 네 명 얼굴을 18m 크기로 새긴 거예요. 14년이 걸린 이 거대 조각은 100km 밖에서도 보일 만큼 크죠.", "bg": "분야는 역사·예술이에요. 사우스다코타 Mount Rushmore 조각의 탄생 과정이 소재(Robinson의 제안, Borglum의 작업). → 이 거대 기념물이 어떻게·왜 만들어졌는지를 따라가며 읽으세요.", "flow": [{"kind": "위치", "t": "러시모어 산(사우스다코타 Black Hills)"}, {"kind": "제안·제작", "t": "Robinson 제안 → 조각가 Borglum, 1927년부터 14년"}, {"kind": "대상", "t": "대통령 4명(워싱턴·링컨·제퍼슨·루스벨트) 머리·어깨"}, {"kind": "규모", "t": "머리만 18m, 약 100km 밖에서도 보임"}], "vocab": [["sculpture", "조각(품)"], ["carve", "조각하다"], ["feature", "형상·이목구비"], ["sculptor", "조각가"], ["complete", "완성하다"], ["memorial", "기념지·기념물"], ["initially", "처음에"]], "quiz": [["러시모어 산이 특별한 이유는?", "산비탈에 세계에서 가장 큰 조각 중 하나(대통령 4명의 얼굴)가 새겨져 있기 때문이에요."], ["조각의 제작 과정은?", "Robinson이 제안하고 조각가 Borglum이 1927년부터 14년에 걸쳐 완성했어요."], ["핵심 한 문장?", "러시모어 산엔 대통령 4명의 거대한 얼굴이 새겨져, 머리만 18m로 100km 밖에서도 보인다."]], "en": "Mount Rushmore stands in the Black Hills of South Dakota. What is so special about this mountain? One of the biggest sculptures in the world is carved into one of its sides! Initially, South Dakota historian Doane Robinson suggested the state carve the features of famous people into the mountain. Danish-American sculptor Gutzon Borglum developed this idea and started carving it in 1927. Fourteen years it took to complete the sculpture, now known as Mount Rushmore National Memorial. Borglum decided to carve only the head and shoulders of four American presidents ─ George Washington, Abraham Lincoln, Thomas Jefferson, and Theodore Roosevelt. The heads alone are 18 meters high and can be seen from almost 100 kilometers away.", "ko": "Rushmore 산은 South Dakota 주의 Black Hills에 있다. 이 산에 무엇이 그토록 특별할까? 바로 세계에서 가장 큰 조각 중 하나가 그 경사면에 조각되어 있다! 처음에, South Dakota 주의 역사가인 Doane Robinson이 산에 유명인의 형상을 조각할 것을 주 정부에 제안했다. 덴마크계 미국인 조각가인 Gutzon Borglum은 이 아이디어를 발전시켜 1927년에 그것을 조각하기 시작했다. 이제는 Mount Rushmore 국립 기념지로 알려진 그 조각은 완성하는 데 14년이 걸렸다. Borglum은 미국 대통령 네 명, 즉 George Washington, Abraham Lincoln, Thomas Jefferson 그리고 Theodore Roosevelt의 머리와 어깨만 조각하기로 결정했다. 머리만 18미터 높이로 거의 100킬로미터 밖에서도 보인다.", "read": [{"en": "Mount Rushmore stands in the Black Hills of South Dakota.", "ko": "Rushmore 산은 South Dakota 주의 Black Hills에 있다.", "chunks": [["Mount Rushmore stands", "Rushmore 산은 위치한다"], ["in the Black Hills of South Dakota.", "South Dakota 주의 Black Hills에."]]}, {"en": "What is so special about this mountain?", "ko": "이 산에 무엇이 그토록 특별할까?", "chunks": [["What is so special", "무엇이 그토록 특별한가"], ["about this mountain?", "이 산에 대해?"]]}, {"en": "One of the biggest sculptures in the world is carved into one of its sides!", "ko": "바로 세계에서 가장 큰 조각 중 하나가 그 경사면에 조각되어 있다!", "chunks": [["One of the biggest sculptures in the world", "세계에서 가장 큰 조각 중 하나가"], ["is carved into one of its sides!", "그 산의 한쪽 면에 조각되어 있다!"]]}, {"en": "Initially, South Dakota historian Doane Robinson suggested the state carve the features of famous people into the mountain.", "ko": "처음에, South Dakota 주의 역사가인 Doane Robinson이 산에 유명인의 형상을 조각할 것을 주 정부에 제안했다.", "chunks": [["Initially,", "처음에,"], ["South Dakota historian Doane Robinson suggested", "South Dakota 역사가 Doane Robinson은 제안했다"], ["the state carve the features of famous people", "주 정부가 유명인의 이목구비를 조각할 것을"], ["into the mountain.", "그 산에."]]}, {"en": "Danish-American sculptor Gutzon Borglum developed this idea and started carving it in 1927.", "ko": "덴마크계 미국인 조각가인 Gutzon Borglum은 이 아이디어를 발전시켜 1927년에 그것을 조각하기 시작했다.", "chunks": [["Danish-American sculptor Gutzon Borglum", "덴마크계 미국인 조각가 Gutzon Borglum은"], ["developed this idea", "이 아이디어를 발전시켰다"], ["and started carving it in 1927.", "그리고 1927년에 그것을 조각하기 시작했다."]]}, {"en": "Fourteen years it took to complete the sculpture, now known as Mount Rushmore National Memorial.", "ko": "이제는 Mount Rushmore 국립 기념지로 알려진 그 조각은 완성하는 데 14년이 걸렸다.", "chunks": [["Fourteen years it took", "14년이 걸렸다"], ["to complete the sculpture,", "그 조각상을 완성하는 데,"], ["now known as Mount Rushmore National Memorial.", "이제는 Mount Rushmore 국립 기념지로 알려진."]]}, {"en": "Borglum decided to carve only the head and shoulders of four American presidents ─ George Washington, Abraham Lincoln, Thomas Jefferson, and Theodore Roosevelt.", "ko": "Borglum은 미국 대통령 네 명, 즉 George Washington, Abraham Lincoln, Thomas Jefferson 그리고 Theodore Roosevelt의 머리와 어깨만 조각하기로 결정했다.", "chunks": [["Borglum decided to carve", "Borglum은 조각하기로 결정했다"], ["only the head and shoulders of four American presidents ─", "네 명의 미국 대통령의 머리와 어깨만을 ─"], ["George Washington, Abraham Lincoln, Thomas Jefferson, and Theodore Roosevelt.", "즉 Washington, Lincoln, Jefferson, Roosevelt."]]}, {"en": "The heads alone are 18 meters high and can be seen from almost 100 kilometers away.", "ko": "머리만 18미터 높이로 거의 100킬로미터 밖에서도 보인다.", "chunks": [["The heads alone are 18 meters high", "머리만 18미터 높이이고"], ["and can be seen from almost 100 kilometers away.", "거의 100킬로미터 밖에서도 보일 수 있다."]]}]}, {"no": "5", "title": "Authenticity in Museum Exhibits", "ktitle": "박물관에서 ‘진짜’가 중요한 이유", "field": "예술·박물관", "page": "p29", "oneline": "박물관 전시는 물건 모음을 <span class='g'>의미 파악 체험</span>으로 바꾸지만 — 방문객은 전시물의 <span class='g'>진정성(authenticity)을 신뢰할 때만</span> 그 의미를 믿는다.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 단순 물건들이 박물관에서 의미 체험으로 변환되되, 가운데 진정성 게이트를 통과해야만 방문객이 그 의미를 믿는다는 조건부 변환 그림\">\n  <!-- 좌측: 단순 물건 모음 -->\n  <g transform=\"translate(20, 50)\">\n    <text x=\"75\" y=\"-15\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">단순 물건 모음</text>\n    <rect x=\"0\" y=\"0\" width=\"150\" height=\"130\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.3\"/>\n    \n    <!-- 물건들 (단순 도형) -->\n    <g fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\">\n      <!-- 항아리 -->\n      <ellipse cx=\"35\" cy=\"40\" rx=\"15\" ry=\"20\"/>\n      <ellipse cx=\"35\" cy=\"22\" rx=\"8\" ry=\"3\"/>\n      <!-- 동상 -->\n      <rect x=\"80\" y=\"25\" width=\"20\" height=\"40\" rx=\"2\"/>\n      <circle cx=\"90\" cy=\"22\" r=\"6\"/>\n      <!-- 두루마리 -->\n      <rect x=\"115\" y=\"35\" width=\"22\" height=\"6\" rx=\"3\"/>\n      <!-- 화살촉 -->\n      <polygon points=\"35,80 30,100 40,100\"/>\n      <!-- 도자기 조각 -->\n      <path d=\"M 70 85 Q 85 80 100 90 L 95 105 Q 80 100 70 105 Z\"/>\n      <!-- 동전 -->\n      <circle cx=\"120\" cy=\"95\" r=\"8\"/>\n    </g>\n    \n    <text x=\"75\" y=\"120\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#999\">just things</text>\n  </g>\n\n  <!-- 박물관 변환 화살표 -->\n  <g transform=\"translate(180, 110)\">\n    <line x1=\"0\" y1=\"0\" x2=\"55\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n    <polygon points=\"55,0 47,-5 47,5\" fill=\"#1a1a1a\"/>\n    <text x=\"27\" y=\"-8\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">museum</text>\n    <text x=\"27\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">전시화</text>\n  </g>\n\n  <!-- 가운데: authenticity 게이트 -->\n  <g transform=\"translate(255, 50)\">\n    <text x=\"50\" y=\"-15\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">진정성 게이트</text>\n    <rect x=\"0\" y=\"0\" width=\"100\" height=\"130\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.8\" stroke-dasharray=\"5 3\"/>\n    \n    <!-- 게이트 모양 (gate icon) -->\n    <g transform=\"translate(50, 60)\">\n      <!-- 게이트 기둥 -->\n      <line x1=\"-20\" y1=\"-25\" x2=\"-20\" y2=\"25\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      <line x1=\"20\" y1=\"-25\" x2=\"20\" y2=\"25\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      <!-- 게이트 상단 -->\n      <line x1=\"-22\" y1=\"-25\" x2=\"22\" y2=\"-25\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      <!-- 자물쇠 -->\n      <rect x=\"-7\" y=\"-10\" width=\"14\" height=\"14\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <path d=\"M -4 -10 L -4 -15 Q -4 -19 0 -19 Q 4 -19 4 -15 L 4 -10\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <circle cx=\"0\" cy=\"-3\" r=\"1.5\" fill=\"#c8102e\"/>\n    </g>\n    \n    <text x=\"50\" y=\"103\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">authenticity</text>\n    <text x=\"50\" y=\"115\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">신뢰 조건</text>\n  </g>\n\n  <!-- 우측 위: 신뢰 → 의미 체험 -->\n  <g transform=\"translate(395, 30)\">\n    <!-- 화살표 from gate -->\n    <line x1=\"-30\" y1=\"35\" x2=\"0\" y2=\"20\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n    <polygon points=\"0,20 -8,21 -3,27\" fill=\"#1FA34A\"/>\n    \n    <rect x=\"3\" y=\"0\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"93\" y=\"18\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">trust → meaningful experience</text>\n    <text x=\"93\" y=\"34\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">의미 파악 체험</text>\n    <!-- 체크 -->\n    <g transform=\"translate(160, 45)\">\n      <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#1FA34A\"/>\n      <path d=\"M -3 0 L -0.5 2.5 L 3 -2.5\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.6\"/>\n    </g>\n  </g>\n\n  <!-- 우측 아래: 불신 → 단순 진열 -->\n  <g transform=\"translate(395, 130)\">\n    <line x1=\"-30\" y1=\"-10\" x2=\"0\" y2=\"20\" stroke=\"#c8102e\" stroke-width=\"1.8\" stroke-dasharray=\"3 2\"/>\n    <polygon points=\"0,20 -7,16 -2,12\" fill=\"#c8102e\"/>\n    \n    <rect x=\"3\" y=\"10\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/>\n    <text x=\"93\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">distrust → just display</text>\n    <text x=\"93\" y=\"44\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">의미 없는 진열</text>\n    <!-- X -->\n    <g transform=\"translate(160, 55)\">\n      <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <line x1=\"-3\" y1=\"-3\" x2=\"3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <line x1=\"3\" y1=\"-3\" x2=\"-3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    </g>\n  </g>\n</svg>", "caption": "좌측: 단순 물건 모음 → 박물관 전시 변환 → 의미 파악 체험. 가운데 authenticity 게이트(진정성 신뢰 조건): 통과 시 의미 ✓ / 불신 시 의미 ✗.", "tldr": ["성공적인 박물관 전시는 ‘변화시킬 힘이 있는’ 경험을 가능하게 한다.", "단순한 물건 더미에서 새로운 차원의 의미(미적·역사·과학)를 파악하게 한다.", "단, 그 의미는 물체·이미지의 ‘진실성’을 신뢰할 때만 믿어진다."], "analogy": "전시가 단순한 물건 더미를 ‘의미 있는 경험’으로 바꿔 주죠. 하지만 그게 ‘가짜’라고 의심되면 그 의미도 안 믿겨요 — 진짜라는 신뢰가 바탕이에요.", "bg": "분야는 예술·박물관이에요. 핵심 개념은 전시물의 ‘진정성(authenticity)’. 전시가 사물 모음을 의미 체험으로 바꾼다는 점이 배경. → 방문객이 전시의 의미를 믿게 되는 조건이 무엇인지에 주목하며 읽으세요.", "flow": [{"kind": "경험", "t": "성공적 전시 = ‘변화시킬 힘 있는’ 경험"}, {"kind": "의미", "t": "단순한 물건 더미 → ‘새 차원의 의미’ 파악", "d": "미적·역사·과학적."}, {"kind": "출처", "t": "의미는 전시물·이미지에서 생겨남"}, {"kind": "조건", "t": "‘진실성’을 신뢰할 때만 그 의미를 믿는다"}], "vocab": [["perceive", "인식하다"], ["authentic", "진짜의·진정한"], ["artifact", "공예품·인공물"], ["specimen", "표본"], ["transformative", "변화시키는"], ["grasp", "파악하다"], ["authenticity", "진실성·진짜임"]], "quiz": [["성공적인 박물관 전시가 만드는 경험은?", "단순한 물건 더미에서 미적·역사·과학적인 ‘새로운 차원의 의미’를 파악하게 하는, 변화시킬 힘이 있는 경험이에요."], ["방문객이 그 의미를 믿는 조건은?", "의미가 비롯된 물체·이미지의 ‘진실성(진짜임)’을 신뢰할 때예요."], ["핵심 한 문장?", "박물관 전시는 새로운 의미를 주지만, 전시물의 진실성에 대한 신뢰가 있을 때만 그 의미가 믿어진다."]], "en": "Why is what visitors perceive as authentic important for them? If we consider the fundamental visitor experience of encountering a successful museum exhibit ─ a work of art, an artifact or a specimen in a case, an interactive device or a multimedia screen in any of which the museum visitor may find meaning ─ we begin to appreciate the essentially transformative experience that a museum exhibition uniquely makes possible. Where there appears to be merely a group of objects, a successfully organized museum exhibit allows visitors to grasp some new level of meaning. That meaning may be aesthetic, historical or scientific in character, but it arises from the works of art, the artifacts or specimens on display, or from the images that the museum provides. Visitors will trust that meaning only if they have confidence in the authenticity of the objects or images from which it arises.", "ko": "방문객들이 진짜라고 인식하는 것이 그들에게 중요한 이유는 무엇인가? 만약 우리가 성공적인 박물관 전시, 즉 방문객이 의미를 찾을 수 있는 미술품, 공예품이나 케이스에 든 표본, 쌍방향 장치나 멀티미디어 스크린을 접하는 근본적인 방문객 체험을 고려한다면, 우리는 박물관 전시가 독특하게 가능하게 하는, 본질적으로 변화시킬 힘이 있는 경험을 인지하기 시작한다. 단순히 물건의 집합으로 보이는 곳에서, 성공적으로 계획된 박물관 전시는 방문객으로 하여금 어떤 새로운 차원의 의미를 파악하게 한다. 그 의미는 성격상 미적, 역사적 또는 과학적인 것일 수 있지만, 그것은 전시된 미술품, 공예품이나 표본에서 또는 박물관이 제공하는 이미지에서 생겨난다. 방문객들은 그것이 비롯된 물체나 이미지의 진실성에 대한 신뢰가 있을 때에만 그 의미를 믿을 것이다.", "read": [{"en": "Why is what visitors perceive as authentic important for them?", "ko": "방문객들이 진짜라고 인식하는 것이 그들에게 중요한 이유는 무엇인가?", "chunks": [["Why is", "왜 ~인가"], ["what visitors perceive as authentic", "방문객들이 진짜라고 인식하는 것이"], ["important for them?", "그들에게 중요한가?"]]}, {"en": "If we consider the fundamental visitor experience of encountering a successful museum exhibit ─ a work of art, an artifact or a specimen in a case, an interactive device or a multimedia screen in any of which the museum visitor may find meaning ─ we begin to appreciate the essentially transformative experience that a museum exhibition uniquely makes possible.", "ko": "만약 우리가 성공적인 박물관 전시, 즉 방문객이 의미를 찾을 수 있는 미술품, 공예품이나 케이스에 든 표본, 쌍방향 장치나 멀티미디어 스크린을 접하는 근본적인 방문객 체험을 고려한다면, 우리는 박물관 전시가 독특하게 가능하게 하는, 본질적으로 변화시킬 힘이 있는 경험을 인지하기 시작한다.", "chunks": [["If we consider the fundamental visitor experience", "만약 우리가 근본적인 방문객 체험을 고려한다면"], ["of encountering a successful museum exhibit ─", "성공적인 박물관 전시를 접하는 ─"], ["a work of art, an artifact or a specimen in a case,", "미술품, 공예품이나 케이스에 든 표본,"], ["an interactive device or a multimedia screen", "쌍방향 장치나 멀티미디어 스크린"], ["in any of which the museum visitor may find meaning ─", "그것들 중 어느 것에서든 방문객이 의미를 찾을 수 있는 ─"], ["we begin to appreciate", "우리는 인지하기 시작한다"], ["the essentially transformative experience", "본질적으로 변화시키는 경험을"], ["that a museum exhibition uniquely makes possible.", "박물관 전시가 독특하게 가능하게 하는."]]}, {"en": "Where there appears to be merely a group of objects, a successfully organized museum exhibit allows visitors to grasp some new level of meaning.", "ko": "단순히 물건의 집합으로 보이는 곳에서, 성공적으로 계획된 박물관 전시는 방문객으로 하여금 어떤 새로운 차원의 의미를 파악하게 한다.", "chunks": [["Where there appears to be", "~이 있는 것처럼 보이는 곳에서"], ["merely a group of objects,", "단지 한 무리의 물건들이,"], ["a successfully organized museum exhibit", "성공적으로 계획된 박물관 전시는"], ["allows visitors to grasp", "방문객들이 ~을 파악하게 한다"], ["some new level of meaning.", "어떤 새로운 차원의 의미를."]]}, {"en": "That meaning may be aesthetic, historical or scientific in character, but it arises from the works of art, the artifacts or specimens on display, or from the images that the museum provides.", "ko": "그 의미는 성격상 미적, 역사적 또는 과학적인 것일 수 있지만, 그것은 전시된 미술품, 공예품이나 표본에서 또는 박물관이 제공하는 이미지에서 생겨난다.", "chunks": [["That meaning may be aesthetic, historical or scientific in character,", "그 의미는 성격상 미적, 역사적 또는 과학적인 것일 수 있다,"], ["but it arises from the works of art, the artifacts or specimens on display,", "하지만 그것은 미술품, 전시된 공예품이나 표본에서 생겨난다,"], ["or from the images that the museum provides.", "혹은 박물관이 제공하는 이미지에서."]]}, {"en": "Visitors will trust that meaning only if they have confidence in the authenticity of the objects or images from which it arises.", "ko": "방문객들은 그것이 비롯된 물체나 이미지의 진실성에 대한 신뢰가 있을 때에만 그 의미를 믿을 것이다.", "chunks": [["Visitors will trust that meaning", "방문객들은 그 의미를 믿을 것이다"], ["only if they have confidence", "오직 그들이 신뢰가 있을 때에만"], ["in the authenticity of the objects or images", "물체나 이미지의 진실성에 대한"], ["from which it arises.", "그것이 비롯된."]]}]}, {"no": "6", "title": "Contextual vs Distinctive Languages", "ktitle": "영어는 단어를 ‘맥락에서’ 떼어 낸다", "field": "언어·교육", "page": "p29", "oneline": "아시아 언어는 <span class='r'>문맥 의존(contextual)</span>인 반면 영어는 <span class='g'>단어 자체로 통하는 탈맥락 언어</span> — 미국 부모도 양육에서 같은 방식을 추구한다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 아시아 언어가 문맥에 따라 한 단어의 의미가 여러 갈래로 나뉘는 모습과, 오른쪽 영어가 단어 자체로 의미가 결정되는 모습, 하단의 미국 부모 양육이 같은 방식을 평행 적용하는 그림\">\n  <!-- 상단 좌: 아시아 — contextual -->\n  <g transform=\"translate(20, 25)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">아시아 — contextual</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"135\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n\n    <!-- 가운데 단어 -->\n    <g transform=\"translate(40, 65)\">\n      <rect x=\"-25\" y=\"-15\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">WORD</text>\n    </g>\n\n    <!-- 3개의 의미 분기 -->\n    <line x1=\"63\" y1=\"60\" x2=\"135\" y2=\"35\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <polygon points=\"135,35 127,34 130,40\" fill=\"#c8102e\"/>\n    <line x1=\"63\" y1=\"65\" x2=\"135\" y2=\"65\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <polygon points=\"135,65 127,62 127,68\" fill=\"#c8102e\"/>\n    <line x1=\"63\" y1=\"70\" x2=\"135\" y2=\"95\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <polygon points=\"135,95 127,90 130,96\" fill=\"#c8102e\"/>\n\n    <!-- 3가지 의미 박스 (문맥 1, 2, 3) -->\n    <g transform=\"translate(150, 35)\">\n      <rect x=\"0\" y=\"-13\" width=\"105\" height=\"26\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <text x=\"5\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" fill=\"#c8102e\">context 1</text>\n      <text x=\"5\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\">meaning A</text>\n    </g>\n    <g transform=\"translate(150, 65)\">\n      <rect x=\"0\" y=\"-13\" width=\"105\" height=\"26\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <text x=\"5\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" fill=\"#c8102e\">context 2</text>\n      <text x=\"5\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\">meaning B</text>\n    </g>\n    <g transform=\"translate(150, 95)\">\n      <rect x=\"0\" y=\"-13\" width=\"105\" height=\"26\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <text x=\"5\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" fill=\"#c8102e\">context 3</text>\n      <text x=\"5\" y=\"9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\">meaning C</text>\n    </g>\n\n    <text x=\"135\" y=\"125\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">meaning depends on context</text>\n  </g>\n\n  <!-- vs -->\n  <text x=\"300\" y=\"92\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 상단 우: 영어 — decontextualized -->\n  <g transform=\"translate(315, 25)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">영어 — decontextualized</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"135\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 단어 + 단일 의미 -->\n    <g transform=\"translate(60, 65)\">\n      <rect x=\"-25\" y=\"-15\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">WORD</text>\n    </g>\n\n    <line x1=\"85\" y1=\"65\" x2=\"135\" y2=\"65\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"135,65 127,62 127,68\" fill=\"#1FA34A\"/>\n\n    <g transform=\"translate(155, 65)\">\n      <rect x=\"0\" y=\"-15\" width=\"100\" height=\"30\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"50\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">meaning</text>\n      <text x=\"50\" y=\"10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">(self-contained)</text>\n    </g>\n\n    <text x=\"135\" y=\"125\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">word itself = meaning</text>\n  </g>\n\n  <!-- 하단: 미국 부모 양육 평행 -->\n  <g transform=\"translate(20, 180)\">\n    <text x=\"290\" y=\"-5\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">미국 양육 — 같은 방식 평행 적용</text>\n    <rect x=\"0\" y=\"5\" width=\"580\" height=\"70\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n\n    <!-- 부모 -->\n    <g transform=\"translate(60, 40)\">\n      <circle cx=\"0\" cy=\"-9\" r=\"8\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"-1\" x2=\"0\" y2=\"12\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"3\" x2=\"-7\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"3\" x2=\"7\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">parent</text>\n    </g>\n\n    <!-- 화살표 + 메시지 -->\n    <line x1=\"90\" y1=\"40\" x2=\"180\" y2=\"40\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <polygon points=\"180,40 172,36 172,44\" fill=\"#1FA34A\"/>\n    <text x=\"135\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">\"speak so all understand\"</text>\n\n    <!-- 아이 -->\n    <g transform=\"translate(210, 40)\">\n      <circle cx=\"0\" cy=\"-7\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"-1\" x2=\"0\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">child</text>\n    </g>\n\n    <!-- 화살표 -->\n    <line x1=\"230\" y1=\"40\" x2=\"320\" y2=\"40\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <polygon points=\"320,40 312,36 312,44\" fill=\"#1FA34A\"/>\n\n    <!-- 결과 박스 -->\n    <g transform=\"translate(335, 24)\">\n      <rect x=\"0\" y=\"0\" width=\"225\" height=\"32\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"112\" y=\"13\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">independent · context-free expression</text>\n      <text x=\"112\" y=\"25\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">맥락 없이 통하는 언어 습관</text>\n    </g>\n  </g>\n</svg>", "caption": "아시아 언어(contextual): 한 단어가 문맥에 따라 여러 의미(다의어). 영어(decontextualized): 단어 자체로 이해 가능. 미국 부모도 양육에서 독립·맥락 없이 통하는 표현을 가르침.", "tldr": ["많은 아시아 언어는 ‘맥락적’이라 단어 이해에 문장 맥락이 필요하다.", "영어는 비교적 뚜렷이 구별돼 ‘맥락이 적게’ 필요하다.", "미국 부모는 단어를 ‘맥락에서 떼어’ 다른 맥락과 연결해 가르친다."], "analogy": "아시아어는 단어가 ‘문장 속에서’ 뜻이 정해지지만, 영어 부모는 ‘이게 강아지야, 누가 강아지를 키우지?’처럼 단어를 맥락에서 떼어 따로 익히게 해요.", "bg": "분야는 언어·교육이에요. 핵심 대비 — 문맥 의존적(contextual)인 아시아 언어와, 단어 자체로 통하는(distinctive) 영어. → 이 언어 차이가 양육 방식과 어떻게 연결되는지에 주목하며 읽으세요.", "flow": [{"kind": "아시아어", "t": "‘맥락적’ — 단어가 여러 뜻, 문장 맥락 필요"}, {"kind": "영어", "t": "비교적 뚜렷·구별 → 맥락이 ‘적게’ 필요"}, {"kind": "양육", "t": "미국 부모: 언어를 가능한 한 ‘탈맥락화’"}, {"kind": "방식", "t": "‘이게 뭐지? 누가 키우지?’ → 단어를 다른 맥락과 연결"}], "vocab": [["contextual", "맥락적인"], ["multiple", "여러·다수의"], ["distinctive", "뚜렷이 구별되는"], ["decontextualize", "맥락에서 떼어 내다"], ["independent of", "~와 별개로"], ["regardless of", "~에 상관없이"], ["separate from", "~에서 분리하다"]], "quiz": [["아시아 언어가 ‘맥락적’이라는 것은?", "단어가 여러 의미를 가져, 이해하려면 문장이라는 맥락이 필요하다는 거예요."], ["미국 부모의 ‘탈맥락화’ 언어 교육이란?", "책 내용과 상관없이 ‘이게 뭐지·누가 키우지?’를 물어, 단어를 원래 맥락에서 떼어 다른 맥락과 연결해 주는 거예요."], ["핵심 한 문장?", "영어는 단어를 맥락에서 떼어 내는 경향이 강하며, 미국 부모도 자녀에게 그렇게 가르친다."]], "en": "Many Asian languages are highly \"contextual.\" Words typically have multiple meanings, so to be understood they require the context of sentences. English words, however, are different and relatively distinctive. In addition, English speakers tend to make sure that words require as little context as possible. American parents also generally attempt to decontextualize language as much as possible for their children. They try to make words understandable independent of verbal context. When reading to a child about a dog, the parent might ask the child, regardless of the content, what the animal is (\"A doggie, that's right\") and who has a dog (\"Yes, Aunt Heather has a dog\"). The word is separated from its original context and linked to other contexts where the word has a similar meaning.", "ko": "많은 아시아 언어는 굉장히 '맥락적'이다. 단어들은 대개 여러 의미를 갖고 있어서, 이해가 되려면 그것들은 문장이라는 맥락을 필요로 한다. 그러나 영어는 다르고 비교적 뚜렷이 구별된다. 게다가, 영어로 말하는 사람들은 반드시 단어에 가능한 한 적은 맥락이 필요하게 하려는 경향이 있다. 또한, 미국 부모들은 대개 자녀들을 위해 언어를 가능한 한 많이 맥락에서 떼어 내려고 노력한다. 그들은 말의 문맥과는 별도로 단어들을 이해할 수 있게 만들려고 애쓴다. 아이에게 개에 대한 책을 읽어 줄 때, 부모는 아이에게 내용에 상관없이 그 동물이 무엇인지 (\"강아지야, 맞아.\") 그리고 누가 개를 기르는지 (\"그래, Heather 이모가 개를 길러.\") 물을지도 모른다. 그 단어는 원래의 맥락으로부터 분리되어 그 단어가 비슷한 의미를 가진 다른 맥락으로 연결된다.", "read": [{"en": "Many Asian languages are highly \"contextual.\" Words typically have multiple meanings, so to be understood they require the context of sentences.", "ko": "많은 아시아 언어는 굉장히 '맥락적'이다. 단어들은 대개 여러 의미를 갖고 있어서, 이해가 되려면 그것들은 문장이라는 맥락을 필요로 한다.", "chunks": [["Many Asian languages are highly \"contextual.\"", "많은 아시아 언어는 굉장히 '맥락적'이다."], ["Words typically have multiple meanings,", "단어들은 대개 여러 의미를 갖고 있어서,"], ["so to be understood", "그래서 이해되기 위해서는"], ["they require the context of sentences.", "그것들은 문장의 맥락을 필요로 한다."]]}, {"en": "English words, however, are different and relatively distinctive.", "ko": "그러나 영어는 다르고 비교적 뚜렷이 구별된다.", "chunks": [["English words, however,", "그러나 영어 단어들은,"], ["are different and relatively distinctive.", "다르고 비교적 뚜렷이 구별된다."]]}, {"en": "In addition, English speakers tend to make sure that words require as little context as possible.", "ko": "게다가, 영어로 말하는 사람들은 반드시 단어에 가능한 한 적은 맥락이 필요하게 하려는 경향이 있다.", "chunks": [["In addition, English speakers tend to", "게다가, 영어 사용자들은 ~하는 경향이 있다"], ["make sure that words require", "단어가 필요로 하도록 확실히 한다"], ["as little context as possible.", "가능한 한 적은 맥락을."]]}, {"en": "American parents also generally attempt to decontextualize language as much as possible for their children.", "ko": "또한, 미국 부모들은 대개 자녀들을 위해 언어를 가능한 한 많이 맥락에서 떼어 내려고 노력한다.", "chunks": [["American parents also generally attempt", "미국 부모들은 또한 대개 시도한다"], ["to decontextualize language", "언어를 맥락에서 떼어 내려고"], ["as much as possible for their children.", "자녀를 위해 가능한 한 많이."]]}, {"en": "They try to make words understandable independent of verbal context.", "ko": "그들은 말의 문맥과는 별도로 단어들을 이해할 수 있게 만들려고 애쓴다.", "chunks": [["They try to make words understandable", "그들은 단어를 이해 가능하게 만들려고 노력한다"], ["independent of verbal context.", "말의 문맥과 별개로."]]}, {"en": "When reading to a child about a dog, the parent might ask the child, regardless of the content, what the animal is (\"A doggie, that's right\") and who has a dog (\"Yes, Aunt Heather has a dog\").", "ko": "아이에게 개에 대한 책을 읽어 줄 때, 부모는 아이에게 내용에 상관없이 그 동물이 무엇인지 (\"강아지야, 맞아.\") 그리고 누가 개를 기르는지 (\"그래, Heather 이모가 개를 길러.\") 물을지도 모른다.", "chunks": [["When reading to a child about a dog,", "아이에게 개에 관해 읽어 줄 때,"], ["the parent might ask the child,", "부모는 아이에게 물을 수도 있다,"], ["regardless of the content,", "내용에 상관없이,"], ["what the animal is (\"A doggie, that's right\")", "그 동물이 무엇인지 (\"강아지야, 맞아.\")"], ["and who has a dog (\"Yes, Aunt Heather has a dog\").", "그리고 누가 개를 기르는지 (\"그래, Heather 이모가 개를 길러.\")"]]}, {"en": "The word is separated from its original context and linked to other contexts where the word has a similar meaning.", "ko": "그 단어는 원래의 맥락으로부터 분리되어 그 단어가 비슷한 의미를 가진 다른 맥락으로 연결된다.", "chunks": [["The word is separated", "그 단어는 분리되어"], ["from its original context", "원래의 맥락으로부터"], ["and linked to other contexts", "다른 맥락으로 연결된다"], ["where the word has a similar meaning.", "그 단어가 비슷한 의미를 가진."]]}]}, {"no": "7", "title": "Behaviors That Become Addictions", "ktitle": "좋은 습관도 ‘과하면’ 중독", "field": "건강·심리", "page": "p30", "oneline": "먹기·일·잠·운동 같은 일상 행동도 <span class='r'>과도·강박</span>으로 행해지면 <span class='r'>중독</span>이 되어 — 신체·인간관계 같은 <span class='g'>일상의 책임</span>을 장기적으로 방해한다.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 정상 일상 행동들이 균형을 이루는 모습과 오른쪽 과도·강박 화살표를 거쳐 중독으로 변하면서 신체·관계·책임이 무너지는 그림\">\n  <!-- 좌측: 정상 일상 행동 (균형) -->\n  <g transform=\"translate(20, 30)\">\n    <text x=\"120\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">정상 일상 — 균형</text>\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"200\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n\n    <!-- 4가지 행동 아이콘 + 균형 막대 -->\n    <!-- 균형 막대 (중심점 위에 4 행동 균형) -->\n    <g transform=\"translate(120, 85)\">\n      <!-- 받침 -->\n      <polygon points=\"0,40 -15,55 15,55\" fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <!-- 막대 -->\n      <line x1=\"-90\" y1=\"35\" x2=\"90\" y2=\"35\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      \n      <!-- 4 행동 -->\n      <!-- 먹기 -->\n      <g transform=\"translate(-70, 0)\">\n        <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <!-- 포크 + 나이프 -->\n        <line x1=\"-3\" y1=\"-5\" x2=\"-3\" y2=\"5\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <line x1=\"3\" y1=\"-5\" x2=\"3\" y2=\"5\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <line x1=\"-5\" y1=\"-5\" x2=\"-1\" y2=\"-5\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n        <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">eat</text>\n      </g>\n      <!-- 일 -->\n      <g transform=\"translate(-23, 0)\">\n        <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <!-- 가방 -->\n        <rect x=\"-6\" y=\"-4\" width=\"12\" height=\"8\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <path d=\"M -3 -4 Q -3 -7 0 -7 Q 3 -7 3 -4\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">work</text>\n      </g>\n      <!-- 잠 -->\n      <g transform=\"translate(23, 0)\">\n        <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <!-- z 글자 -->\n        <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">Z</text>\n        <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">sleep</text>\n      </g>\n      <!-- 운동 -->\n      <g transform=\"translate(70, 0)\">\n        <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n        <!-- 아령 -->\n        <rect x=\"-7\" y=\"-2\" width=\"3\" height=\"4\" fill=\"#1FA34A\"/>\n        <rect x=\"-4\" y=\"-1\" width=\"8\" height=\"2\" fill=\"#1FA34A\"/>\n        <rect x=\"4\" y=\"-2\" width=\"3\" height=\"4\" fill=\"#1FA34A\"/>\n        <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">exercise</text>\n      </g>\n    </g>\n\n    <text x=\"120\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">normal · balanced</text>\n  </g>\n\n  <!-- 가운데: 과도·강박 화살표 -->\n  <g transform=\"translate(265, 110)\">\n    <line x1=\"0\" y1=\"0\" x2=\"45\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"2.2\"/>\n    <polygon points=\"45,0 35,-5 35,5\" fill=\"#c8102e\"/>\n    <text x=\"22\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">excess</text>\n    <text x=\"22\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">과도·강박</text>\n  </g>\n\n  <!-- 우측: 중독 — 불균형 + 일상 붕괴 -->\n  <g transform=\"translate(320, 30)\">\n    <text x=\"135\" y=\"-10\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">중독 — 일상 붕괴</text>\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n\n    <!-- 비대해진 한 행동 (예: 일 — 강박) -->\n    <g transform=\"translate(70, 75)\">\n      <!-- 비대한 동그라미 -->\n      <circle cx=\"0\" cy=\"0\" r=\"35\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      <text x=\"0\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">addiction</text>\n      <text x=\"0\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">중독</text>\n      <!-- 위협 표시 (느낌표 또는 가시) -->\n      <g fill=\"#c8102e\">\n        <polygon points=\"-35,-15 -42,-22 -32,-20\"/>\n        <polygon points=\"35,-15 42,-22 32,-20\"/>\n        <polygon points=\"-35,15 -42,22 -32,20\"/>\n        <polygon points=\"35,15 42,22 32,20\"/>\n      </g>\n    </g>\n\n    <!-- 영향 받는 영역들 (붕괴) -->\n    <!-- 신체 -->\n    <g transform=\"translate(180, 35)\">\n      <rect x=\"-40\" y=\"-15\" width=\"80\" height=\"30\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">health</text>\n      <text x=\"0\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">신체</text>\n      <g transform=\"translate(40, 0)\">\n        <line x1=\"-3\" y1=\"-3\" x2=\"3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <line x1=\"3\" y1=\"-3\" x2=\"-3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      </g>\n    </g>\n    <!-- 인간관계 -->\n    <g transform=\"translate(180, 80)\">\n      <rect x=\"-40\" y=\"-15\" width=\"80\" height=\"30\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">relations</text>\n      <text x=\"0\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">인간관계</text>\n      <g transform=\"translate(40, 0)\">\n        <line x1=\"-3\" y1=\"-3\" x2=\"3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <line x1=\"3\" y1=\"-3\" x2=\"-3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      </g>\n    </g>\n    <!-- 책임 -->\n    <g transform=\"translate(180, 125)\">\n      <rect x=\"-40\" y=\"-15\" width=\"80\" height=\"30\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">duty</text>\n      <text x=\"0\" y=\"10\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">일상 책임</text>\n      <g transform=\"translate(40, 0)\">\n        <line x1=\"-3\" y1=\"-3\" x2=\"3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n        <line x1=\"3\" y1=\"-3\" x2=\"-3\" y2=\"3\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      </g>\n    </g>\n\n    <!-- 화살표: 중독 → 3 영역 -->\n    <line x1=\"105\" y1=\"55\" x2=\"140\" y2=\"35\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n    <polygon points=\"140,35 133,33 134,40\" fill=\"#c8102e\"/>\n    <line x1=\"105\" y1=\"75\" x2=\"140\" y2=\"80\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n    <polygon points=\"140,80 133,78 134,84\" fill=\"#c8102e\"/>\n    <line x1=\"105\" y1=\"95\" x2=\"140\" y2=\"125\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n    <polygon points=\"140,125 132,121 134,128\" fill=\"#c8102e\"/>\n\n    <text x=\"135\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">long-term damage to daily life</text>\n  </g>\n</svg>", "caption": "일상 행동(먹기·일·잠·운동)이 정상 범위에서는 건강하지만, 과도·강박으로 변하면 중독이 되어 신체·인간관계·책임에 장기적 손상을 준다.", "tldr": ["보통 중독으로 안 보는 행동(먹기·일·쇼핑·TV)도 과하면 중독이 된다.", "중독 = 습관적으로 해서 일·관계·건강 같은 일상 책임을 ‘방해’하는 것.", "운동조차 강박적이면 무릎을 망치거나 결혼 생활을 해친다."], "analogy": "‘건강하니까 괜찮겠지’ 싶은 운동도, 무릎이 상해도 5km를 고집하거나 설거지 대신 운동하러 가면 오히려 몸·관계를 해쳐요. 과하면 좋은 것도 중독이죠.", "bg": "분야는 건강·심리예요. 먹기·일·잠·쇼핑 같은 일상 행동도 중독이 될 수 있다는 것이 출발점. → 평범한 행동이 ‘중독’으로 바뀌는 기준이 무엇인지에 주목하며 읽으세요.", "flow": [{"kind": "전제", "t": "평범한 행동(먹기·일·쇼핑·TV)도 과하면 중독"}, {"kind": "정의", "t": "중독 = 습관적으로 해 일·관계·건강을 ‘방해’"}, {"kind": "예 ①", "t": "강박적 운동: 무릎 상해도 5마일 고집 → 관절 손상"}, {"kind": "예 ②", "t": "설거지 대신 운동 → 결혼 생활 해침"}, {"kind": "결론", "t": "좋은 것도 ‘과하면’ 중독이 된다", "cls": "close"}], "vocab": [["addictive", "중독성의"], ["in excess", "과도하게"], ["habitually", "습관적으로"], ["interfere with", "~을 방해하다"], ["compulsive", "강박적인"], ["worsen", "악화시키다"], ["harmonious", "조화로운"]], "quiz": [["글이 말하는 ‘중독’의 정의는?", "어떤 것을 너무 습관적으로 해서, 장기적으로 일·관계·건강 같은 일상 책임을 방해하는 거예요."], ["운동이 중독이 될 수 있다는 예는?", "무릎이 상해도 하루 5마일을 고집하거나, 설거지 대신 운동을 택해 관절·결혼 생활을 해치는 경우예요."], ["핵심 한 문장?", "먹기·운동 같은 평범하거나 좋은 행동도 과도해 일상을 방해하면 중독이 된다."]], "en": "Many behaviors not usually thought of as addictive can be addictions if they are done in excess. These include eating, working, sleeping, shopping, watching TV, and other behaviors you do in your daily life. Experts consider an addiction doing a certain thing so habitually that in the long run interferes with everyday life responsibilities, such as work, relationships, or health. Even exercise can be an addiction if it becomes compulsive. For example, if you insist on running five miles a day, even though this will worsen an old knee injury, you may strengthen your heart, but you may also permanently destroy your knee joints. Similarly, if every evening after dinner your spouse says, \"Your turn to do the dishes,\" and you respond, \"Sorry, I've got to go work out,\" you may build your muscles, but this will make it harder to maintain a harmonious marriage.", "ko": "보통 중독성이 있는 것으로 간주되지 않는 많은 행동도 그것이 과도하게 행해지면 중독이 될 수 있다. 여기에는 먹기, 일하기, 잠자기, 쇼핑하기, TV보기, 그리고 여러분이 일상생활에서 하는 다른 행동들이 포함된다. 전문가들은 어떤 것을 습관적으로 함으로써 장기적으로 일, 인간관계 또는 건강과 같은 일상생활의 책임을 방해하는 것을 중독으로 간주한다. 운동조차도 강박적이 되면 중독이 될 수 있다. 예를 들어, 여러분이 오래된 무릎 부상을 악화시킬지라도 하루에 5마일을 달리겠다고 고집한다면, 여러분은 아마도 심장은 튼튼하게 하겠지만 무릎 관절은 영구적으로 손상시킬 /* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 고3 2026 3월 모의고사 7지문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   고3 3월 모의 7지문 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body>
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">2027학년도 고3 6월 모의평가</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 고3 3월 모의고사 7개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {
 "data": [
  {
   "no": "no.18",
   "title": "Invitation to the Homerun Derby",

   "tldr": [

   "quiz": [
    [
     "필자가 지도자에게 요구하는 것은?",
     "지시를 맹목적으로 따르게 하지 말고, <b>활동이 수행을 어떻게 향상시키는지 원리를 설명해 참여자의 인식을 높이라</b>는 거예요."
    ],
    [
     "원리를 이해한 참여자가 얻는 것은?",
     "<b>자기 발달에 대한 더 완전한 소유권(주인의식)</b>이에요 — 스스로 발전을 이끌게 되죠."
    ]
   ],
   "en": "Instructors of physical activities often focus more on the activities themselves than on the participants who perform them. People may believe that training our bodies is unrelated to training our minds. However, participants’ minds determine their attitudes and level of effort toward physical development. In usual practice, instructors may just tell their participants to exercise regularly, warm up before exercising, or use a particular strategy. However, it is not sufficient for instructors to expect participants to blindly follow their directions in physical activities. Instructors must raise participants’ awareness of how these activities enhance their physical performance. For example, an instructor could explicitly explain how warming up before exercising improves their performances. If participants understand the principles of these activities, it enables them to gradually take fuller ownership of their own development.",
   "ko": "신체 활동 지도자들은 흔히 활동을 수행하는 참여자들보다 활동 자체에 더 집중한다. 사람들은 신체 훈련이 마음 훈련과 무관하다고 생각할지도 모른다. 그러나 참여자들의 마음은 신체 발달을 향한 그들의 태도와 노력 수준을 결정한다. 평소 연습에서 지도자들은 참여자들에게 규칙적으로 운동하거나, 운동 전에 몸을 풀거나, 특정 전략을 사용하라고만 말할지도 모른다. 하지만 지도자들은 참여자들이 신체 활동에서 자신의 지도를 맹목적으로 따르기를 기대하는 것만으로는 충분하지 않다. 지도자들은 이러한 활동이 그들의 신체적 수행을 어떻게 향상시키는지에 관한 참여자들의 인식을 높여야만 한다. 예를 들어, 지도자는 운동 전 몸풀기가 어떻게 그들의 수행을 향상시키는지를 명시적으로 설명할 수도 있다. 참여자들이 이러한 활동의 원리를 이해한다면 그것은 그들이 자신의 발달에 관한 더 완전한 소유권을 점진적으로 가질 수 있게 한다.",

   "en": "In fact, scientists attributing consciousness to any animal is so recent that the internet is older. In 1976 a zoologist named Donald Griffin published The Question of Animal Awareness, a book arguing that animal cognition ought to be taken seriously. He and a colleague had been responsible in 1944 for discovering that bats navigate by echolocation. Now, after a lifetime spent watching those creatures, he became convinced they had inner worlds. They had flexible behavior, he said, or the ability to change their behavior as external circumstances changed, a hallmark of true intelligence. He’d watched bats develop clever techniques for finding food; they could clearly make decisions on the fly, and exhibited many of the same problem-solving abilities as humans did. Animal thought and reason ought to be seriously studied, he argued. After all, despite the flourishing of neuroscience, no one had yet found any part of the brain unique to humans that might be responsible for this hallowed “consciousness.” Wasn’t it time to give up the ghost?",
   "ko": "사실 과학자들이 어떤 동물이든 의식이 있다고 생각한 일이 너무 최근이어서 인터넷이 더 오래되었다. 1976년에 Donald Griffin이라는 한 동물학자는 'The Question of Animal Awareness'라는 책을 출간했는데, 그 책은 동물의 인지를 진지하게 여겨야 한다고 주장했다. 그와 한 동료는 1944년에 박쥐가 반향 위치 측정으로 길을 찾는다는 사실을 발견한 주역이었다. 이제 평생 그 생물들을 지켜본 끝에 그는 박쥐들이 내면 세계를 가지고 있다고 확신하게 되었다. 박쥐들이 유연한 행동, 즉 외부 환경의 변화에 따라 행동을 바꿀 수 있는 능력을 가지고 있으며, 이는 진정한 지능의 특징이라고 그는 말했다. 그는 박쥐들이 먹이를 찾기 위해 영리한 기술을 개발하는 것을 관찰했는데, 박쥐들은 분명히 즉석에서 결정을 내릴 수 있었고, 인간이 보여주는 것과 동일한 문제 해결 능력을 다수 보여주었다. 동물의 사고력과 판단력을 진지하게 연구해야 한다고 그는 주장했다. 결국, 신경과학의 번영에도 불구하고, 이 신성한 '의식'을 담당할지도 모르는 인간에게만 유일무이한 뇌의 어떤 부위를 아직 아무도 발견하지 못했다. 그 환상을 포기할 때가 되지 않았는가?",

   "en": "A telescoping of time correlates with size. Small animals’ reflexes must be quicker in order to control much smaller limbs and respond to rapid locomotor feedback. Further, decision making must be streamlined in small species because their high metabolic rates and minimal energy reserves offer few choices in food-searching activities, defending against predators, or mating behaviors. And, perhaps most important, a short lifetime offers little time for learning from experience. As a result, being short-lived puts a premium on the effectiveness of preprogrammed behavior patterns that require little in the way of environmental fine-tuning. Large animals, in comparison, can get by with rather slower reflexes, can afford to vary their mating and food-searching behaviors in an effort to better optimize their behaviors, and may have a considerable opportunity to learn by observation and trial and error. Being longer-lived puts a greater premium on learning and memory, and less on automatic preprogrammed behaviors. In addition, living a long time or having the capacity to travel for long distances is more likely to expose an animal to significant changes in the environment.",
   "ko": "시간의 압축은 크기와 상관관계가 있다. 몸집이 작은 동물의 반사 작용은 훨씬 더 작은 수족을 조절하고 빠른 운동 기관의 피드백에 반응하기 위해 더 빨라야 한다. 또한 몸집이 작은 종에서는 의사 결정이 간소화되어야 하는데, 이들의 높은 신진대사율과 매우 적은 에너지 비축량은 먹이를 찾는 활동, 포식자로부터 자신을 방어하는 일, 또는 짝짓기 행동에서 선택의 여지를 거의 주지 않기 때문이다. 그리고 아마도 가장 중요한 것은, 짧은 수명이 경험을 통해 배우는 데 쓸 시간을 거의 주지 않는다는 점이다. 그 결과, 수명이 짧다는 것은 환경에 맞춘 세밀한 조정을 거의 필요로 하지 않는 미리 프로그램화된 행동 패턴의 효과성을 특히 중요하게 만든다. 이에 비해, 몸집이 큰 동물은 다소 더 느린 반사 작용으로도 그럭저럭 살아갈 수 있고, 자신의 행동을 더 잘 최적화하기 위한 노력의 일환으로 짝짓기와 먹이 찾기 행동을 변화시킬 여유가 있으며, 관찰과 시행착오를 통해 배울 상당한 기회를 가질 수도 있다. 수명이 더 길다는 것은 학습과 기억을 더 중요하게 만들고, 자동적인 미리 프로그램화된 행동을 덜 중요하게 만든다. 또한 오래 살거나 장거리를 이동할 능력을 지니는 것은 동물이 환경의 중대한 변화에 노출될 가능성을 더 크게 만든다.",

   "quiz": [
    [
     "1950년대 이전 관광업의 특징은?",
     "호텔·운송·여행사가 <b>서로 독립적으로 영업하는 파편화된 산업</b>이었어요 — 호텔은 숙박만, 항공은 좌석만 팔았죠."
    ],
    [
     "산업을 ‘통합’으로 바꾼 주역은?",
     "<b>여행 상품 운영업체(tour operator)의 성장</b>이에요 — 개별 사업들을 하나의 묶음 서비스로 엮었죠."
    ]
   ],
   "en": "Before the 1950s, tourism was very much an industry which was fragmented; hotels, transport operators, travel agents, and tour operators all tended to work independently of each other. Hotels were largely in the business of selling bed nights. Airlines and railways were in the business of selling seats. Travel agents, of course, were selling travel and holidays, but in each case they tended to operate very much as individual businesses. From the mid-1950s onwards, particularly in the UK, the growth of tour operators began to change the nature of the industry from essentially individual business activities to more integrated activities. Hotels, for example, were beginning to see customers as wanting a range of services rather than simply buying accommodation. So hotels began to develop shopping arcades and later to offer secretarial centres to try to increase the spend of guests within the hotel complex. Transport operators, particularly in the airline business, saw the sale of transport services as being integral to a much wider need. Airlines offered insurance and accommodation booking for travellers.",
   "ko": "1950년대 이전에 관광업은 파편화된 산업이었고, 호텔, 운송업체, 여행사, 여행 상품 운영업체 모두 서로 독립적으로 일하는 경향이 있었다. 호텔은 대체로 숙박을 판매하는 사업을 하고 있었다. 항공사와 철도 회사는 좌석을 판매하는 사업을 하고 있었다. 물론 여행사는 여행과 휴가 상품을 판매하고 있었지만, 각각의 경우에 이들은 매우 별개의 사업체로 운영되는 경향이 있었다. 1950년대 중반 이후부터, 특히 영국에서, 여행 상품 운영업체의 성장은 산업의 성격을 본질적으로 개별적인 사업 활동에서 보다 통합적인 활동으로 바꾸기 시작했다. 예를 들어, 호텔은 고객을 단순히 숙박만 구매하는 사람이라기보다 다양한 서비스를 원하는 사람으로 보기 시작했다. 그래서 호텔은 호텔 단지 안에서 투숙객의 지출액을 늘리기 위해 쇼핑 아케이드를 조성하고, 나중에는 사무 지원 센터를 제공하기 시작했다. 운송업체, 특히 항공업계의 운송업체는 운송 서비스의 판매를 훨씬 더 폭넓은 필요와 불가분의 관계가 있는 것으로 보았다. 항공사는 여행자에게 보험과 숙박 예약 서비스를 제공했다.",

   "en": "Paul Grice was a famous philosopher of language whose work was very influential in many areas of linguistics. Born in 1913 in Birmingham, England, he was the son of Herbert Grice, a businessman and musician. As an undergraduate, he earned high honors from Corpus Christi College. After finishing graduate school, he was appointed as a lecturer at Oxford in the field of philosophy. During World War II, however, he served in the British military for about five years. One of his greatest contributions was to the study of language and communication. His article “Meaning” was written in 1948, but he did not have it published until 1957. This article was foundational in the study of language and communication. In 1967, he left Oxford to take a job at UC Berkeley and retired from there in 1979. In addition to being a great scholar, he was excellent at cricket and chess.",

   "en": "Fashion is always deeply cultural, and an excellent example of this can be seen in the evolution of European clothing. At the beginning of the Middle Ages, clothing tended to be simple and was frequently made of rough wool or animal furs. With advances in cloth making, however, fashion began moving toward styles that were more elaborate and form-fitting. In the Renaissance and Elizabethan eras, styles became even more refined. The clothes that wealthy people were wearing became increasingly fancier, with a particular emphasis being placed on smaller waists. The connection between clothing and social status was so pronounced that laws were enacted to limit the wearing of certain luxury items. Allowed only for higher social classes, luxurious styles and decorations such as feathers, silk, or velvet were used as a means of demonstrating one’s standing in society. This was further reinforced as upperclass styles came to be explicitly incorporated into cultural ceremonies so that their wearers’ roles could be identified clearly.",

   "en": "Classical works by playwrights such as Shakespeare or Euripides or even American musical song lyrics contain unconventional and unrealistic methods of communicating characters’ thoughts and feelings, and take a bit more skill and patience to understand. The reader must be mindful not to let the poetic form or archaic word usage get in the way of getting meaningful information about the story, but instead see the form itself as a revealing stylistic technique. Scripts with complex language or unfamiliar styles may require several additional readings in order for the nuance to become clear. Musical theater pieces are particularly difficult to visualize when reading because of the diminished emphasis on dialogue and a significant emphasis on song and dance. For example, when the music and lyrics are removed from a musical theater script, what is left is the dialogue, known as the book or libretto, and it can be very thin. There is an emphasis on dance, movement, or action in musical theater that can be time-consuming when actually performed on stage, but can take very little space when typed into a play script.",
   "ko": "Shakespeare나 Euripides와 같은 극작가들의 고전 작품이나 심지어 미국 뮤지컬 노래 가사에는 등장인물의 생각과 감정을 전달하는 관습적이지 않고 비현실적인 방식이 포함되어 있으며, 그것들을 이해하기 위해서는 조금 더 많은 기술과 인내가 필요하다. 독자는 시적 형식이나 고어체 어휘 사용이 이야기에 관한 의미 있는 정보를 얻는 데 방해가 되지 않도록 주의해야 하며, 대신 그 형식 자체를 내용을 드러내는 문체적 기법으로 보아야 한다. 복잡한 언어나 낯선 문체를 가진 대본은 그 뉘앙스가 분명해지기 위해 몇 차례 더 읽을 필요가 있을 수도 있다. 뮤지컬 작품은 대화에 대한 강조가 줄어들고 노래와 춤에 대한 강조가 크기 때문에, 읽을 때 마음속에 그려 보기가 특히 어렵다. 예를 들어, 음악과 가사가 뮤지컬 대본에서 제거되면, 남는 것은 극본 또는 대본으로 알려진 대화이고, 그것은 매우 얇을 수 있다. 뮤지컬에서는 실제로 무대에서 공연될 때 시간이 많이 걸릴 수 있는 춤, 움직임, 또는 동작이 강조되지만, 희곡 대본에 인쇄되면 매우 적은 공간을 차지할 수 있다.",

    [
     "보전(conservation)이 변화를 대하는 방식은?",

    ],
    [
     "보존(preservation)주의자가 악기를 대하는 태도는?",
     "복원·수리보다 <b>‘발견된 그대로(as found)’ 손상된 상태로 유지</b>하는 걸 선호해요 — 최소 개입의 보호자죠."
    ]
   ],
   "en": "Ever since the early Enlightenment, preservation and conservation have been closely related. Taken as near synonyms, their meaning is to maintain an object or system insofar as possible in its present state, to protect it from change, usually for contemplation, research, display, and perhaps for use. Conservationists who distinguish their activities from preservation emphasize conservation’s restorative aspects ― restoring a historical musical instrument, for example, or a painting, or a dinosaur, or an ecosystem. Conservationists acknowledge change but try to manage it in order to prolong a desired state. Preservationists (who may nonetheless call themselves conservationists) think of themselves more as protectors. They sometimes criticize conservationists for setting an additional priority on yield or harvest or use, rather than interfering as minimally as possible in order to preserve the original object or system, as they would do. Preservationists would, for example, prefer to keep a historical musical instrument “as found” in a deteriorated state, for study, rather than to restore or repair it for display or use.",
   "ko": "초기 계몽주의 이후로 줄곧, 보존과 보전은 밀접하게 관련되어 왔다. 거의 동의어로 받아들여질 때, 그것들의 의미는 보통 주시, 연구, 전시, 그리고 아마도 사용을 위해 사물이나 체계를 가능한 한 그것의 현재 상태로 유지하고, 그것을 변화로부터 보호하는 것이다. 자신의 활동을 보존과 구별하는 보전주의자는 보전의 복원적인 측면을 강조하는데, 예를 들어 역사적인 악기나 그림, 공룡, 또는 생태계를 복원하는 것을 강조한다. 보전주의자는 변화를 인정하지만, 바람직한 상태를 연장하기 위해 그것을 관리하려고 한다. 보존주의자는, (그럼에도 불구하고 자신을 보전주의자라고 부를 수도 있지만), 자신을 보호자에 더 가깝다고 생각한다. 그들은 때때로 보전주의자가, 자신들처럼 원래의 사물이나 체계를 보존하기 위해 가능한 한 최소한으로 개입하기보다는 산출량이나 수확 또는 이용에 추가적인 우선순위를 둔다고 비판한다. 예를 들어, 보존주의자는 역사적인 악기를 전시나 이용을 위해 복원하거나 수리하기보다는, 연구를 위해 '발견된 그대로'의 손상된 상태로 유지하는 것을 선호할 것이다.",

   "en": "Speakers don’t always put everything that’s important to them into words. Very often you can understand a speaker’s meaning by observing their nonverbal behaviors such as a change in a vocal tone or volume, eye contact, facial expressions and gestures. As it is easy to misinterpret nonverbal behavior, effective listeners verbally confirm their interpretations of someone’s nonverbal communication. A question as simple as “Do your nods indicate a yes vote?” can make sure that everyone is on the same wavelength. If, as nonverbal research indicates, more than half of a speaker’s meaning is conveyed nonverbally, we are missing a lot of important information if we fail to “listen” to nonverbal behavior. Even Freud suggested that “he that has eyes to see and ears to hear may convince himself that no mortal can keep a secret. If his lips are silent, he chatters with his fingertips; betrayal oozes out of him at every pore.” No wonder it is difficult for most people to conceal what they mean and feel in a face-to-face group discussion.",
   "ko": "화자가 항상 자신에게 중요한 모든 것을 말로 표현하는 것은 아니다. 매우 흔하게, 목소리 어조나 크기의 변화, 시선 교환, 얼굴 표정, 몸짓과 같은 비언어적 행동을 관찰함으로써 화자가 전달하려는 의미를 이해할 수 있다. 비언어적 행동은 오해하기 쉽기 때문에, 효과적인 청자는 누군가의 비언어적 소통에 대한 자신의 해석을 말로 확인한다. “고개를 끄덕이신 것이 찬성을 의미하나요?”와 같은 간단한 질문으로 모두가 같은 이해를 공유하고 있다는 것을 분명히 할 수 있다. 비언어적 (소통에 대한) 연구가 가리키듯이, 화자가 의미하고자 하는 것의 절반 이상이 비언어적으로 전달된다면, 우리가 비언어적 행동을 '귀담아 듣지' 않을 때, 많은 중요한 정보를 놓치게 되는 것이다. 심지어 Freud는 “볼 눈과 들을 귀가 있는 사람은 어떤 인간도 비밀을 지킬 수 없다는 것을 스스로 확신하게 될 수 있다. 만약 입술이 침묵하더라도 그는 손가락 끝으로 재잘거리며, 누설(속마음)이 그의 모든 모공에서 스며 나온다.”라고 시사했다. 대면 집단 토론에서 대부분의 사람들이 자신이 의미하고 느끼는 것을 숨기는 것이 어려운 것은 당연하다.",

   "en": "Imagination continues to function when perception is not actively discerning objects, in cases of emotion, disease, and sleep. Emotions dispose one to see the world in a distorted way. A coward’s perceptual disposition is affected by his disposition to experience fear. A lover’s expectations are affected by desire. In such cases, a small similarity between a perceived object and the thing one expects to see can lead to the misidentification of the perceived object as that thing. The coward sees the enemy, while the lover sees the object of desire everywhere. The more affected one is, the less similarity is required for the thing to appear. While the central organ of sense normally functions by comparing similarities and differences, emotions dispose one to discern objects inaccurately. The greater the emotional investment, the more biased one’s perception.",
   "ko": "감정, 질병, 수면의 경우처럼 지각이 대상을 적극적으로 분별하지 않을 때에도 상상력은 계속 기능한다. 감정은 사람이 세상을 왜곡된 방식으로 바라보도록 이끈다. 겁쟁이의 지각적 성향은 두려움을 경험하는 자신의 성향에 영향을 받는다. 사랑에 빠진 사람의 기대는 욕망에 의해 영향을 받는다. 그러한 경우, 지각된 대상과 자신이 보기를 기대하는 것 사이의 약간의 유사성만으로도 지각된 대상을 바로 그것(볼 것을 기대한 것)으로 오인하게 만들 수 있다. 겁쟁이는 어디에서나 적을 보고, 사랑에 빠진 사람은 어디에서나 욕망의 대상을 바라본다. 감정의 영향을 더 많이 받을수록, 그 대상이 (볼 것을 기대한 것으로) 나타나는 데에 필요한 유사성은 더 적다. 감각의 중추 기관은 보통 유사점과 차이점을 비교함으로써 기능하지만, 감정은 사람이 대상을 부정확하게 분별하도록 이끈다. 감정적 몰입이 더 클수록, 지각은 더 편향된다.",

   "en": "The dependent and shifting nature of art values, not only on the market but inherently, is uppermost in the mind of today’s art collector, whether he buys for himself or as the representative of an institution. Acquiring a work is acquiring a piece of art history, or it is acquiring nothing (beyond, that is, an object of personal enjoyment in the same class as a cat or a souvenir). In signing his check the collector asserts his belief in the future presence of the work as a significant point attained by art as a whole. History, however, is open to anything and the merit of the chosen painting or sculpture has ― at best ― only the validation of a present-day consensus. This consensus is all but certain to be displaced, as others have been in the past. In the last analysis, committing himself to a painting is the collector’s own act. Through it he courageously affirms not only his aesthetic judgment, from whatever source it be derived, but the conviction that he can predict where art is going.",
   "ko": "미술 작품의 가치가 단지 시장에서뿐만 아니라 본질적으로 의존적이며 가변적이라는 속성은, 오늘날의 미술 수집가가 자신을 위해 구매하든 한 기관의 대표자로서 구매하든 스스로의 마음 속에 가장 우선적으로 자리하고 있다. 작품을 소장하는 것은 미술사의 한 부분을 소장하는 것이거나, (다시 말해, 고양이나 기념품과 같은 부류의 개인적 즐거움의 대상을 제외하면) 아무것도 소장하지 않는 것이다. 수표에 서명함으로써, 수집가는 미술 전체에 의해 달성된 하나의 중요한 지점으로서 그 작품이 미래에도 존재할 것이라는 자신의 믿음을 단언한다. 하지만 역사는 어느 것에나 열려 있고, 선택된 그림이나 조각의 가치는 기껏해야 현재의 합의에 의한 확인에 불과하다. 이러한 합의는, 과거에 다른 합의들이 그래왔듯이, 대체될 것이 거의 확실하다. 결국, 그림 한 작품에 헌신하는 것은 수집가 자신의 행위이다. 이러한 행위를 통해 그는, 그것(자신의 미학적 판단)이 어떤 근원으로부터 유래되었든, 자신의 미학적 판단뿐만 아니라 스스로 미술이 나아갈 방향을 예측할 수 있다는 확신 또한 용기 있게 확언한다.",

   "quiz": [
    [
     "공격받는 식물이 ‘이웃’을 위해 하는 일은?",
     "<b>화학 신호를 방출해 같은 종 이웃에게 공격을 경고</b>하고, 이웃이 방어 물질을 미리 축적하게 해요."

   "en": "Plants have evolved defenses almost as diverse as the number of genera. Some load their tissues with harsh compounds that either are unpleasant to insects or intoxicate them, encouraging the insects to go bother another plant or at least slowing down their eating. Structural defenses like thick coats of wax on leaves may prevent some insect species from damaging the plant tissues altogether. Nor are individual plants entirely on their own while under attack. Plants can release chemical compounds that let their same-species neighbors know that an attack is likely coming, pushing those nearby plants to start building up defensive compounds in their tissues. Some of these cues even attract insect predators, a call for an assist that benefits both the plant and its bug-eating collaborators. The back-and-forth is not a matter of natural balance, but more like a drawn-out evolutionary conversation. New plant defenses unintentionally select for insects with ways to get around them, which in turn help bring about more resilient and resistant plant species. New variations, shading into entire new forms and adaptations, maintain the stalemate.",

   "quiz": [
    [
     "구경거리를 문학 창작에 비유한 까닭은?",
     "둘 다 <b>전통(장르 규칙)에 기대면서도 충분한 독창성</b>을 보여야 깊은 인상을 남긴다는 점이 같기 때문이에요."
    ],
    [
     "구경거리가 집단 기억에 남으려면?",
     "기존 기법을 활용하되 <b>모방에 그치지 않고, 관객을 놀라게 하며 이전 시도를 능가</b>해야 해요."
    ]

   "en": "Although there may be elements that trigger instinctive response, spectacle works primarily within a cultural frame and is subject to prevailing modes of perception that observers bring to bear. In saying that, we stress that creation of spectacle is neither a universal nor even an inevitable expression of culture, but is a strategy commonly used by people from many different cultures to address specific needs. The task of creating spectacle has been likened to creating new works of literature, where writers normally feel bound by the rules and traditions of their genre yet need to show sufficient originality to impress their audiences. By extension, spectacle is produced by working with the grain of a particular culture, blending the innovative with the established. Thus anyone deploying spectacle may draw on a repertoire of techniques and conventions developed from previous festivals or related activities, but imitation is not enough. Spectacle must also be spectacular. A spectacle has to amaze spectators, outdoing previous efforts if it is to become part of the collective memory of those who witnessed and participated in it.",
   "ko": "비록 본능적인 반응을 유발하는 요소들이 있을 수 있지만, 구경거리는 주로 문화적인 틀 안에서 작용하며 관찰자들이 적용하는 주요한 지각 방식에 영향을 받는다. 그렇게 말함에 있어, 우리는 구경거리의 창조가 문화의 보편적이거나 심지어 필연적인 표현이 아니라, 오히려 특정한 요구를 해결하기 위해 여러 다양한 문화권의 사람들이 '흔히' 사용하는 전략임을 강조한다. 구경거리를 창조하는 과업은 새로운 문학 작품을 창작하는 것에 비유되어 왔는데, 문학에서 작가들은 보통 자신들 장르의 규칙과 전통에 얽매인다고 느끼면서도 독자들에게 깊은 인상을 주기 위해 충분한 독창성을 보여야 한다. 더 나아가, 구경거리는 특정 문화의 결에 맞추어 작업함으로써, 즉 혁신적인 요소와 기존의 요소를 혼합함으로써 만들어진다. 따라서 구경거리를 전개하는 누구든 이전의 축제나 관련 활동들로부터 발전된 기법과 관습의 레퍼토리를 활용할 수 있지만, 모방만으로는 충분하지 않다. 구경거리는 또한 장관이어야 한다. 구경거리가 그것을 목격하고 참여한 사람들의 집단 기억의 일부가 되려면, 관객을 놀라게 하고 이전의 시도들을 능가해야만 한다.",

   "quiz": [
    [
     "사각 마천루가 바람에 흔들리는 원리는?",
     "<b>와류 방출(vortex shedding)</b>이에요 — 전·후면 압력차로 회오리가 생겨 바람과 수직 방향으로 건물을 당기고 밀죠."

    ]
   ],
   "en": "To minimize building costs and maximize revenues, skyscrapers generally take the shape of squares or rectangles. These are not particularly aerodynamic shapes, and this results in a wind phenomenon called “vortex shedding.” As wind meets a rectangular skyscraper it pushes on the flat face of the building before flowing around its sides, where eventually it separates from the face of the structure. The difference in pressures on the front and back faces of the building gives rise to vortices, or spinning currents of wind, that flow downstream from the building. The vortices pull and push the building in a direction perpendicular to the wind at frequencies that can become dangerously self-sustaining. To minimize vortex shedding, skyscraper designers do everything in their powers to confuse the wind. Orienting the building so that the longer face of the structure is parallel with prevailing winds can help. Chopping or rounding off corners of a building can likewise make it more aerodynamic. Roughing up the corners of the building through the careful placement of balconies or stepped corners can help by disturbing or delaying the formation of strong vortices.",
   "ko": "건축 비용을 최소화하고 수익을 극대화하기 위해, 초고층 빌딩은 일반적으로 정사각형이나 직사각형 형태를 취한다. 이것들은 특별히 공기역학적인 형태는 아니며, 이는 '회오리바람 발생(와류 방출)'이라고 불리는 바람 현상을 초래한다. 바람이 직사각형 초고층 빌딩과 만나면, 건물 측면으로 흐르기 전에 건물의 평평한 표면을 밀어내고, 그곳에서 결국 건물 표면으로부터 분리된다. 건물 전면과 후면의 압력 차이는 회오리바람, 즉 건물에서 하류로 흐르는 회전하는 기류를 발생시킨다. 이 회오리바람들은 위험할 정도로 자립적인 상태가 될 수 있는 주파수로 바람과 수직인 방향으로 건물을 당기고 밀어낸다. 회오리바람 발생(와류 방출)을 최소화하기 위해, 초고층 빌딩 설계자들은 바람을 교란시키려 그들의 힘이 닿는 한 모든 것을 다한다. 건물의 더 긴 면이 지배적인(주로 부는) 바람 방향과 평행하도록 건물의 방향을 맞추는 것이 도움이 될 수 있다. 마찬가지로 건물의 모서리를 자르거나 둥글게 만드는 것 또한 건물을 더 공기역학적으로 만들 수 있다. 발코니나 계단식 모서리를 신중하게 배치하여 건물의 모서리를 거칠게 만드는 것은 강력한 회오리바람의 형성을 방해하거나 지연시킴으로써 도움이 될 수 있다.",

   "metaphor": "<svg aria-label=\"왼쪽 빨강이라는 핵심 색에서 시작해, 최초의 색채 실험, 색조와 명암을 다양화한 팔레트, 그리고 색채 어휘로 단계적으로 확장되는 과정을 보여주고, 다른 색들은 인정받기까지 오래 걸렸음을 표시한 그림\" role=\"img\" viewbox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\">\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"300\" y=\"26\">빨강 = 최초이자 으뜸 색 → 색채 어휘로 확장</text>\n<!-- 빨강 핵심 + 확장 링 -->\n<circle cx=\"92\" cy=\"118\" fill=\"#fdf2f4\" fill-opacity=\"0.4\" r=\"40\" stroke=\"#c8102e\" stroke-dasharray=\"3 2\" stroke-width=\"0.9\"></circle>\n<circle cx=\"92\" cy=\"118\" fill=\"#c8102e\" r=\"27\"></circle>\n<text fill=\"#ffffff\" font-family=\"Noto Serif\" font-size=\"11\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"92\" y=\"115\">RED</text>\n<text fill=\"#ffffff\" font-family=\"Noto Serif KR\" font-size=\"7.5\" text-anchor=\"middle\" x=\"92\" y=\"129\">유일한 진짜 색</text>\n<!-- 단계 화살표 + 박스 -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.6\" x1=\"138\" x2=\"174\" y1=\"118\" y2=\"118\"></line><polygon fill=\"#1a1a1a\" points=\"174,118 166,114 166,122\"></polygon>\n<rect fill=\"#ffffff\" height=\"44\" rx=\"5\" stroke=\"#c8102e\" stroke-width=\"1.4\" width=\"106\" x=\"176\" y=\"96\"></rect>\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" x=\"229\" y=\"113\">최초의 색채 실험</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"7.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"229\" y=\"128\">first experiments</text>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.6\" x1=\"282\" x2=\"316\" y1=\"118\" y2=\"118\"></line><polygon fill=\"#1a1a1a\" points=\"316,118 308,114 308,122\"></polygon>\n<rect fill=\"#ffffff\" height=\"44\" rx=\"5\" stroke=\"#c8102e\" stroke-width=\"1.4\" width=\"106\" x=\"318\" y=\"96\"></rect>\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" x=\"371\" y=\"111\">팔레트 다양화</text>\n<    "en": "In the pharmaceutical industry, algorithms are being employed to find treatments and drugs for rare diseases that to date haven’t received much attention. The hard truth has always been that pharma devotes more research and development resources to diseases that affect the rich. The definition of rare has too often been associated with poor ― that is, even if a disease is quite prevalent in a population that cannot afford to pay for it (for example, people living in the developing world), the disease has been neglected compared to First World illnesses. By lowering the cost of data collection, mining, and analysis in drug development and clinical trials, AI can help offset imbalances in the pharmaceutical industry that direct attention to diseases that “pay,” whether because the disease is more common or because it is prevalent among demographics that can pay more. We see the democratizing power of AI to broaden the attention of the medical and research communities to find cures to traditionally neglected health issues and among traditionally neglected populations.",

   "en": "The structure of glass is, frankly, a bit of a mess. Clear and perfect as it might appear to our eyes, down at the molecular level, glass looks more like a random ball-pit of atoms. The technical term for this mess depends on who you’re asking: for some scientists it is an “amorphous solid,” for others a “supercooled liquid.” In theory it’s both liquid and solid, though, given the way it behaves, in practice it’s really the latter. In fact, at room temperature glass never behaves as a liquid, even an imperceptibly viscous one, even over long periods of time (though it can “sweat” if you don’t add enough lime to the mix). Those misshapen sheets of glass you sometimes see in old stained-glass windows, thicker at the bottom than the top, are generally not that way because the glass is slowly sinking over time. Unless the church has endured temperatures of more than 400˚C, the chances are they are uneven because that’s the way they were blown and solidified in the first place. Flat glass was only developed in the nineteenth century and we had to wait until the middle of the twentieth century for truly flat, thin sheets of glass. The paradox is that, despite it being one of the very oldest human-made substances, scientists still struggle to comprehend why glass behaves the way it does. Glass seems to defy most molecular laws. As one glassmaker put it, glass is not a material; it’s a state.",
   "ko": "유리의 구조는, 솔직히 말해서, 다소 엉망진창이다. 우리 눈에는 투명하고 완벽해 보일지 몰라도, 분자 수준으로 내려가 보면, 유리는 원자들이 마구잡이로 있는 볼풀에 더 가까워 보인다. 이러한 엉망진창인 상태를 뜻하는 전문 용어는 여러분이 누구에게 묻고 있느냐에 따라 달라지는데, 어떤 과학자들에게는 그것이 '무정형의 고체'이고, 다른 이들에게는 '과냉각 액체'이다. 이론적으로 그것은 액체이면서 동시에 고체이지만, 그것이 작용하는 방식을 고려하면 실제로는 후자(고체)이다. 사실, 상온에서 유리는, 심지어 (알아차릴 수 없을 정도로) 미세하게 점성이 있는 것이라 해도, 심지어 오랜 시간이 지나더라도, 결코 액체처럼 행동하지 않는다(비록 혼합물에 석회를 충분히 넣지 않으면 유리가 '땀을 흘릴' 수는 있지만). 여러분이 오래된 스테인드글라스 창문에서 가끔 보는, 윗부분보다 아랫부분이 더 두꺼운 보기 흉한 유리판들은 대개 시간이 지나면서 유리가 천천히 아래로 가라앉고 있기 때문에 그렇게 된 것이 아니다. 교회가 400°C가 넘는 온도를 견뎌낸 것이 아니라면, 아마 그것들이 애초에 그런 방식으로 불어서 만들어지고 응고되었기 때문에 고르지 않은 것이다. 판유리는 19세기가 되어서야 겨우 개발되었고, 정말로 평평하고 얇은 유리판을 얻기 위해서는 20세기 중반까지 기다려야 했다. 역설은 유리가 인간이 만든 가장 오래된 물질 중 하나임에도 불구하고, 과학자들은 유리가 왜 그런 방식으로 작용하는지 이해하는 데 여전히 애를 먹고 있다는 점이다. 유리는 대부분의 분자 법칙을 거부하는 것처럼 보인다. 한 유리 제조업자가 말했듯이, 유리는 재료가 아니라 상태이다.",

    ],
    [
     "이야기 속 Sally의 변화를 한 줄로?",
     "‘<b>재능 없다</b>’는 상처로 음악을 듣기만 하던 Sally가, <b>직접 연주를 배우는 사람</b>으로 바뀌어요."
    ]
   ],
   "en": "Every day after school, Sally walked home through the park. She liked listening to music in her headphones and looking at the trees on her way home. One day, while she was changing songs, she heard strange, unpolished music. She took off her headphones and followed the music through the park. She saw a kind-looking old woman sitting on a small bench and playing the violin. While her music wasn’t perfect, there was something warm and welcoming about it. So, Sally walked closer. “Hello! Are you going to listen to my performance?” the old woman looked up and asked. Sally laughed and replied, “Oh sorry, I was just passing by.” She turned to continue walking home, but decided to stop for a bit and listen. After the woman’s music finished, Sally asked her when she had started playing the violin. “I just started last year, but I always wanted to learn,” the woman answered. Sally was impressed by her response. Even though she loved listening to music, she could not play any instruments well. The old woman asked Sally if she played any instruments. Suddenly, Sally remembered learning the recorder from her older sister Beatrice when she was a girl. Beatrice had said, “You just have no musical talent.” Sally looked back to the old woman sadly and told her the story. The old woman winked, handed the violin to Sally, and said, “You don’t need talent to enjoy playing.” Feeling brave, Sally accepted the instrument and tried playing. The sound was rough, and she felt embarrassed. But the old woman just smiled and said, “That’s how it begins. I hope to see you again tomorrow.” The following day, they met at the same bench. Sally was happy to hear the old woman’s music again, but when she sat, the woman stopped playing. “Today is your first full lesson,” she said as she handed the violin to Sally. She showed the young woman how to place her fingers on the strings. After an hour, she had learned some basics. Then, the old woman played the same music from the day before. Sally promised to meet her every day and started walking home. As she walked, simple, unpolished music was playing in her mind.",
   "ko": "방과 후 매일, Sally는 공원을 가로질러 집으로 걸어갔다. 그녀는 집으로 가는 길에 헤드폰으로 음악을 듣고 나무를 보는 것을 좋아했다. 어느 날 그녀가 노래를 바꾸고 있을 때, 그녀는 이상하고 다듬어지지 않은 음악을 들었다. 그녀는 헤드폰을 벗고 음악을 따라 공원을 가로질러 갔다. 그녀는 친절해 보이는 노부인이 작은 벤치에 앉아 바이올린을 연주하고 있는 것을 보았다. 그녀의 음악은 완벽하지는 않았지만, 그것에는 따뜻하고 마음을 끄는 무언가가 있었다. 그래서 Sally는 더 가까이 걸어갔다. “안녕! 내 연주를 들어볼 거니?”라고 그 노부인은 올려다보며 물었다. Sally는 웃으며 “아, 죄송해요, 저는 그저 지나가고 있었어요.”라고 대답했다. 그녀는 집으로 계속 걸어가기 위해 발길을 돌렸지만, 잠시 멈춰 들어보기로 했다. 그 여자의 음악이 끝난 후 Sally는 그녀에게 언제 바이올린을 연주하기 시작했는지를 물었다. “나는 바로 작년에 시작하긴 했지만, 항상 배우고 싶었어”라고 그 여자는 대답했다. Sally는 그녀의 대답에 깊은 감명을 받았다. 비록 그녀는 음악 듣는 것을 아주 좋아하긴 했지만, 그녀는 어떤 악기도 잘 연주하지 못했다. 그 노부인은 Sally에게 어떤 악기를 연주했는지를 물었다. 갑자기 Sally는 자신이 어린아이였을 때 그녀의 언니 Beatrice로부터 리코더를 배웠던 것을 기억했다. Beatrice는 “너는 정말 음악적 재능이 없구나”라고 말했었다. Sally는 그 노부인을 슬픈 듯이 돌아보고는 그녀에게 그 이야기를 해 주었다. 그 노부인은 윙크를 하며 Sally에게 바이올린을 건네고는 “연주하는 것을 즐기는 데에 재능은 필요하지 않단다.”라고 말했다. 용기가 생긴, Sally는 악기를 받아 들고 연주를 시도해 보았다. 소리는 거칠었고, 그녀는 창피했다. 하지만 그 노부인은 그저 미소를 지으며 “그렇게 시작하는 거지. 나는 내일 다시 너를 보기를 원해.”라고 말했다. 그 다음날, 그들은 같은 벤치에서 만났다. Sally는 노부인의 음악을 다시 듣게 되어 행복했지만, 그녀가 앉자 그 여자는 연주하는 것을 멈췄다. 그녀는 “오늘이 너의 첫 번째 정식 수업이란다.”라고 말하며 바이올린을 Sally에게 건네주었다. 그녀는 그 어린 여성에게 줄 위에 손가락을 놓는 법을 보여 주었다. 한 시간이 흐른 후, 그녀는 몇 가지 기본적인 것을 배웠다. 그런 다음 그 노부인은 전날과 같은 음악을 연주했다. Sally는 그녀를 매일 만나기로 약속하고 집으로 걸어가기 시작했다. 그녀가 걸어갈 때 단순하고 다듬어지지 않은 음악이 그녀의 마음속에서 연주되고 있었다.",

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>

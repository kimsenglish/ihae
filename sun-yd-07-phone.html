<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 영어독해연습 07강 12지문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 영어독해연습 07강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body>
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 영어독해연습 07강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 영어독해연습 07강 12개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data": [{"no": "1", "title": "Green Consumers and Sustainable Choices", "ktitle": "녹색 소비자 — 자율적 책임 + 개인 소비의 영향력 = 지속가능 구매력", "field": "환경·소비", "page": "07강 Ex.01", "oneline": "녹색 소비자는 내적 통제·열린 마음으로 환경 책임을 정부·기업·전문가에게 떠넘기지 않으며, 개인 소비가 차이를 만든다고 믿는다 → 이들의 수요가 기업의 친환경 경영을 이끌어 — 구매력으로 지속가능성을 추구하는 사람이 곧 녹색 소비자다.", "metaphor": "<svg aria-label=\"중심에 녹색 잎을 든 녹색 소비자 인물이 있고, 주변 4방향으로 내적 통제·열린 마음, 책임 떠넘기지 않음, 기업의 환경 보호 역할 인정, 개인 소비가 차이를 만든다는 네 가지 특성이 배치된 다음 하단으로 화살표가 지속가능 구매력 결과로 이어지는 방사형 그림\" role=\"img\" viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 제목 라벨 -->\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"11\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"300\" y=\"14\">Green Consumer · 4 Traits → Sustainability</text>\n<!-- 중심: 녹색 소비자 (stick figure + 잎) -->\n<g transform=\"translate(300, 115)\">\n<!-- 배경 원 -->\n<circle cx=\"0\" cy=\"0\" fill=\"#f0faf3\" r=\"40\" stroke=\"#1FA34A\" stroke-width=\"2\"></circle>\n<!-- stick figure -->\n<circle cx=\"0\" cy=\"-14\" fill=\"#ffffff\" r=\"9\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"></circle>\n<circle cx=\"-3\" cy=\"-15\" fill=\"#1a1a1a\" r=\"1\"></circle>\n<circle cx=\"3\" cy=\"-15\" fill=\"#1a1a1a\" r=\"1\"></circle>\n<path d=\"M -3 -11 Q 0 -9 3 -11\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"></path>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.4\" x1=\"0\" x2=\"0\" y1=\"-5\" y2=\"18\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"-10\" y1=\"3\" y2=\"9\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"13\" y1=\"3\" y2=\"0\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"-8\" y1=\"18\" y2=\"32\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"8\" y1=\"18\" y2=\"32\"></line>\n<!-- 손에 든 잎 -->\n<g transform=\"translate(15, -3)\">\n<path d=\"M 0 0 Q 4 -8 10 -6 Q 8 0 0 2 Z\" fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"0.8\"></path>\n<line stroke=\"#1FA34A\" strok 0\" y=\"13\">business has a vital role</text>\n</g>\n<line stroke=\"#1FA34A\" stroke-dasharray=\"3 2\" stroke-width=\"1.2\" x1=\"135\" x2=\"263\" y1=\"170\" y2=\"130\"></line>\n<!-- 우하: 특성 4 — 개인 소비가 차이를 -->\n<g transform=\"translate(525, 175)\">\n<rect fill=\"#ffffff\" height=\"40\" rx=\"5\" stroke=\"#1FA34A\" stroke-width=\"1.3\" width=\"130\" x=\"-65\" y=\"-18\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"-3\">개인 소비가 차이를</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"13\">my consumption matters</text>\n</g>\n<line stroke=\"#1FA34A\" stroke-dasharray=\"3 2\" stroke-width=\"1.2\" x1=\"465\" x2=\"337\" y1=\"170\" y2=\"130\"></line>\n<!-- 하단: 결과 화살표 + 지속가능 구매력 -->\n<line stroke=\"#1FA34A\" stroke-width=\"2\" x1=\"300\" x2=\"300\" y1=\"157\" y2=\"218\"></line>\n<polygon fill=\"#1FA34A\" points=\"300,218 295,210 305,210\"></polygon>\n<g transform=\"translate(300, 240)\">\n<rect fill=\"#f0faf3\" height=\"28\" rx=\"5\" stroke=\"#1FA34A\" stroke-width=\"1.6\" width=\"360\" x=\"-180\" y=\"-14\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"4\">지속가능성을 추구하는 구매력 — purchasing power for sustainability</text>\n</g>\n</svg>", "caption": "caption\n      녹색 소비자 = 네 가지 특성의 묶음 → 그 수요가 기업의 친환경 경영을 이끌고, 결국 구매력으로 지속가능성을 추구하는 사람으로 정의된다.", "tldr": ["녹색 소비자는 내적 통제·열린 마음으로 환경 책임을 정부·기업·전문가에게 떠넘기지 않으며, 개인 소비가 차이를 만든다고 믿는다 → 이들의 수요가 기업의 친환경 경영을 이끌어 — 구매력으로 지속가능성을 추구하는 사람이 곧 녹색 소비자다.", "caption\n      녹색 소비자 = 네 가지 특성의 묶음 → 그 수요가 기업의 친환경 경영을 이끌고, 결국 구매력으로 지속가능성을 추구하는 사람으로 정의된다."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["standard", "일반적인"], ["alternative", "대체품대안"], ["internal", "내적인"], ["ordinary", "보통의"], ["vital", "매우 중요한"], ["consumption", "소비"], ["demand", "요구하다"], ["management", "경영"], ["target", "목표로 삼다"], ["sustainability", "지속 가능성"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n      녹색 소비자 = 네 가지 특성의 묶음 → 그 수요가 기업의 친환경 경영을 이끌고, 결국 구매력으로 지속가능성을 추구하는 사람으로 정의된다."], ["도식이 강조하는 결론은?", "녹색 소비자는 내적 통제·열린 마음으로 환경 책임을 정부·기업·전문가에게 떠넘기지 않으며, 개인 소비가 차이를 만든다고 믿는다 → 이들의 수요가 기업의 친환경 경영을 이끌어 — 구매력으로 지속가능성을 추구하는 사람이 곧 녹색 소비자다."]], "en": "Green consumers, compared with non-green consumers, prefer purchasing environmentally-friendly products over the standard alternatives available. Green consumers believe that they are guided by their internal control and open-mindedness, so they would not leave the responsibilities of protecting the environment to governments, business communities, environmentalists or scientists. Green consumers are ordinary people think that business operations have a vital role in fighting to protect environment in general. Moreover, these consumers believe that an individual&#x27;s consumption makes a difference in environmental issues. When green consumers demand products and services, firms combine environmental and social costs of their production and consumption. They also provide green management and green marketing practices by creating job opportunities in green consumption. Therefore, it could be said that green consumers are individuals targeting sustainability by using their purchasing power.", "ko": "녹색 소비자는 비녹색 소비자에 비해, 환경 친화적인 제품을 구매하는 것을 구매할 수 있는 일반적인 대체품보다 선호한다. 녹색 소비자는 자신들이 내적 통제와 열린 마음에 의해 인도된다고 믿으며, 그래서 그들은 환경을 보호해야 할 책임을 정부, 기업 집단, 환경 운동가나 과학자에게 맡기려 하지 않는다. 녹색 소비자는 기업 운영이 전반적인 환경을 보호하기 위한 싸움에서 매우 중요한 역할을 한다고 생각하는 보통 사람들이다. 게다가 이러한 소비자는 개인의 소비가 환경 문제에 변화를 불러온다고 믿는다. 녹색 소비자가 제품과 서비스를 요구할 때, 기업은 그것의 생산과 소비에 대한 환경적 비용과 사회적 비용을 결합한다. 그들은 또한 녹색 소비 분야의 일자리 기회를 창출함으로써 녹색 경영과 녹색 마케팅 관행을 제공한다. 따라서 녹색 소비자는 자신의 구매력을 이용하여 지속 가능성을 목표로 삼는 사람이라고 할 수 있을 것이다.", "read": [{"en": "Green consumers, compared with non-green consumers, prefer purchasing environmentally-friendly products over the standard alternatives available.", "ko": "녹색 소비자는 비녹색 소비자에 비해, 환경 친화적인 제품을 구매하는 것을 구매할 수 있는 일반적인 대체품보다 선호한다."}, {"en": "Green consumers believe that they are guided by their internal control and open-mindedness, so they would not leave the responsibilities of protecting the environment to governments, business communities, environmentalists or scientists.", "ko": "녹색 소비자는 자신들이 내적 통제와 열린 마음에 의해 인도된다고 믿으며, 그래서 그들은 환경을 보호해야 할 책임을 정부, 기업 집단, 환경 운동가나 과학자에게 맡기려 하지 않는다."}, {"en": "Green consumers are ordinary people think that business operations have a vital role in fighting to protect environment in general.", "ko": "녹색 소비자는 기업 운영이 전반적인 환경을 보호하기 위한 싸움에서 매우 중요한 역할을 한다고 생각하는 보통 사람들이다."}, {"en": "Moreover, these consumers believe that an individual&#x27;s consumption makes a difference in environmental issues.", "ko": "게다가 이러한 소비자는 개인의 소비가 환경 문제에 변화를 불러온다고 믿는다."}, {"en": "When green consumers demand products and services, firms combine environmental and social costs of their production and consumption.", "ko": "녹색 소비자가 제품과 서비스를 요구할 때, 기업은 그것의 생산과 소비에 대한 환경적 비용과 사회적 비용을 결합한다."}, {"en": "They also provide green management and green marketing practices by creating job opportunities in green consumption.", "ko": "그들은 또한 녹색 소비 분야의 일자리 기회를 창출함으로써 녹색 경영과 녹색 마케팅 관행을 제공한다."}, {"en": "Therefore, it could be said that green consumers are individuals targeting sustainability by using their purchasing power.", "ko": "따라서 녹색 소비자는 자신의 구매력을 이용하여 지속 가능성을 목표로 삼는 사람이라고 할 수 있을 것이다."}]}, {"no": "2", "title": "Why Repetition Alone Fails", "ktitle": "반복 신화의 통념 ↔ 단기 OK · 지속학습 ✗ 진실", "field": "교육·학습", "page": "07강 Ex.02", "oneline": "여러 대학·언론(George Mason · Dartmouth · St. Louis Post-Dispatch)이 권하는 \"반복하면 학습된다\"는 조언은 잘못된 통념이다. 반복은 전화번호 같은 단기 기억에는 통하지만 — 지속적 학습(durable learning)에는 통하지 않는다.", "metaphor": "<svg aria-label=\"왼쪽에 George Mason과 Dartmouth, St. Louis Post-Dispatch 세 출처의 반복 신화 인용 박스가 쌓여 있고, 가운데 BUT을 거쳐 오른쪽에 단기 전화번호에는 통하지만 지속 학습에는 통하지 않음을 보여주는 분기 그림\" role=\"img\" viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 좌측: 통념 — 3개 인용 출처 -->\n<g transform=\"tr o Serif\" font-size=\"9\" font-style=\"italic\" x=\"10\" y=\"28\">\"concentrate · focus ·</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" x=\"10\" y=\"38\">repeat, repeat, repeat!\"</text>\n</g>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"10\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"125\" y=\"180\">\"pervasive belief\" — plain wrong</text>\n</g>\n<!-- 가운데: BUT -->\n<g transform=\"translate(285, 130)\">\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"12\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"15\" y=\"-10\">BUT</text>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.5\" x1=\"0\" x2=\"30\" y1=\"0\" y2=\"0\"></line>\n<polygon fill=\"#1a1a1a\" points=\"30,0 22,-5 22,5\"></polygon>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" x=\"15\" y=\"18\">진실은</text>\n</g>\n<!-- 우측: 진실 — 두 분기 -->\n<g transform=\"translate(335, 30)\">\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"120\" y=\"-12\">진실 — 두 갈래로 갈림</text>\n<rect fill=\"#ffffff\" height=\"200\" stroke=\"#1FA34A\" stroke-width=\"1.5\" width=\"245\" x=\"0\" y=\"0\"></rect>\n<!-- 분기 1: 전화번호 (단기) -->\n<g transform=\"translate(15, 14)\">\n<rect fill=\"#f0faf3\" height=\"80\" rx=\"4\" stroke=\"#1FA34A\" stroke-width=\"1.5\" width=\"215\" x=\"0\" y=\"0\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" x=\"10\" y=\"16\">단기 기억 · 전화번호</text>\n<!-- 전화번호 다이얼 그림 -->\n<g transform=\"translate(20, 30)\">\n<rect fill=\"#ffffff\" height=\"42\" rx=\"4\" stroke=\"#1a1a1a\" stroke-width=\"1.2\" width=\"32\" x=\"0\" y=\"0\"></rect>\n<rect fill=\"#ffffff\" height=\"9\" stroke=\"#1a1a1a\" stroke-width=\"0.8\" width=\"26\" x=\"3\" y=\"3\"></rect>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"7\" text-anchor=\"middle\" x=\"16\" y=\"10\">555-0123</text>\n<!-- 다이얼 -->\n<circle cx=\"9\" cy=\"20\" fill=\"#999\" r=\"2\"></circle>\n<circle cx=\"16\" cy=\"20\" fill=\"#999\" r=\"2\"></circle>\n<circle cx=\"23\" cy=\"20\" fill=\"#999\" r=\"2\"></circle>\n<circle cx=\"9\" cy=\"27\" fill=\"#999\" r=\"2\"></circle>\n<circle cx=\"16\" cy=\"27\" fill=\"#999\" r=\"2\"></circle>\n<circle cx=\"23\" cy=\"27\" fill=\"#999\" r=\"2\"></circle>\n<circle cx=\"9\" cy=\"34\" fill=\"#999\" r=\"2\"></circle>\n<circle cx=\"16\" cy=\"34\" fill=\"#999\" r=\"2\"></circle>\n<circle cx=\"23\" cy=\"34\" fill=\"#999\" r=\"2\"></circle>\n</g>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" x=\"65\" y=\"44\">repeat → punch in</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" x=\"65\" y=\"58\">holding briefly in mind</text>\n<!-- ✓ -->\n<g transform=\"translate(195, 40)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#1FA34A\" r=\"10\"></circle>\n<path d=\"M -4 0 L -1 4 L 5 -3\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2\"></path>\n</g>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"195\" y=\"60\">works</text>\n</g>\n<!-- 분기 2: 지속학습 -->\n<g transform=\"translate(15, 104)\">\n<rect fill=\"#fdf2f4\" height=\"80\" rx=\"4\" stroke=\"#c8102e\" stroke-width=\"1.5\" width=\"215\" x=\"0\" y=\"0\"></rect>\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" x=\"10\" y=\"16\">지속적 학습 · durable learning</text>\n<!-- 책 그림 -->\n<g transform=\"translate(20, 30)\">\n<!-- 펼쳐진 책 -->\n<path d=\"M 0 8 L 18 4 L 18 28 L 0 32 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"></path>\n<path d=\"M 18 4 L 36 8 L 36 32 L 18 28 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"></path>\n<line stroke=\"#1a1a1a\" stroke-width=\"1\" x1=\"18\" x2=\"18\" y1=\"4\" y2=\"28\"></line>\n<line stroke=\"#999\" stroke-width=\"0.7\" x1=\"4\" x2=\"14\" y1=\"13\" y2=\"11\"></line>\n<line stroke=\"#999\" stroke-width=\"0.7\" x1=\"4\" x2=\"14\" y1=\"18\" y2=\"16\"></line>\n<line stroke=\"#999\" stroke-width=\"0.7\" x1=\"4\" x2=\"14\" y1=\"23\" y2=\"21\"></line>\n<line stroke=\"#999\" stroke-width=\"0.7\" x1=\"22\" x2=\"32\" y1=\"11\" y2=\"13\"></line>\n<line stroke=\"#999\" stroke-width=\"0.7\" x1=\"22\" x2=\"32\" y1=\"16\" y2=\"18\"></line>\n<line stroke=\"#999\" stroke-width=\"0.7\" x1=\"22\" x2=\"32\" y1=\"21\" y2=\"23\"></line>\n</g>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" x=\"68\" y=\"44\">repeat · repeat · repeat</text>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" x=\"68\" y=\"58\">doesn't embed in memory</text>\n<!-- ✗ -->\n<g transform=\"translate(195, 40)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#ffffff\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"1.6\"></circle>\n<line stroke=\"#c8102e\" stroke-width=\"2\" x1=\"-4\" x2=\"4\" y1=\"-4\" y2=\"4\"></line>\n<line stroke=\"#c8102e\" stroke-width=\"2\" x1=\"4\" x2=\"-4\" y1=\"-4\" y2=\"4\"></line>\n</g>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"195\" y=\"60\">fails</text>\n</g>\n</g>\n</svg>", "caption": "caption\n반복 신화의 통념(3개 출처) ↔ 진실은 전화번호 단기 기억엔 OK·지속 학습엔 실패로 갈린다.", "tldr": ["여러 대학·언론(George Mason · Dartmouth · St. Louis Post-Dispatch)이 권하는 \"반복하면 학습된다\"는 조언은 잘못된 통념이다. 반복은 전화번호 같은 단기 기억에는 통하지만 — 지속적 학습(durable learning)에는 통하지 않는다.", "caption\n반복 신화의 통념(3개 출처) ↔ 진실은 전화번호 단기 기억엔 OK·지속 학습엔 실패로 갈린다."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["plain", "완전히분명히"], ["repetition", "반복"], ["permanently", "영구적으로"], ["caption", "캡션(사진·삽화 등에 붙인 설명)"], ["rereading", "다시 읽기"], ["intentionality", "의도성"], ["embed", "깊이 새기다삽입하다"], ["durable", "오래 지속되는영속적인"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n반복 신화의 통념(3개 출처) ↔ 진실은 전화번호 단기 기억엔 OK·지속 학습엔 실패로 갈린다."], ["도식이 강조하는 결론은?", "여러 대학·언론(George Mason · Dartmouth · St. Louis Post-Dispatch)이 권하는 \"반복하면 학습된다\"는 조언은 잘못된 통념이다. 반복은 전화번호 같은 단기 기억에는 통하지만 — 지속적 학습(durable learning)에는 통하지 않는다."]], "en": "What students are advised to do is often plain wrong. For instance, study tips published on a website at George Mason University include this advice: &quot;The key to learning something well is repetition; the more times you go over the material, the better chance you have of storing it permanently.&quot; Another, from a Dartmouth College website, suggests: &quot;If you intend to remember something, you probably will.&quot; A public service piece that runs occasionally in the St. Louis Post-Dispatch offering study advice shows a kid with his nose buried in a book. &quot;Concentrate,&quot; the caption reads. &quot;Focus on one thing and one thing only. Repeat, repeat, repeat! Repeating what you have to remember can help burn it into your memory.&quot; Belief in the power of rereading, intentionality, and repetition is pervasive, but the truth is you usually can&#x27;t embed something in memory simply by repeating it over and over. This tactic might work when looking up a phone number and holding it in your mind while punching it into your phone, but it doesn&#x27;t work for durable learning.", "ko": "학생들이 하도록 권고되는 것은 완전히 틀린 경우가 많다. 예를 들어, George Mason University 웹 사이트에 게시된 학습 조언 중에는 다음과 같은 조언이 있다. &#x27;어떤 것을 잘 암기하기 위한 비결은 반복이며, 자료를 더 여러 차례 반복해서 살펴볼수록, 그것을 영구적으로 기억할 가능성이 더 높아진다. &#x27; Dartmouth College 웹 사이트의 또 다른 조언은 &#x27;어떤 것을 기억하고자 한다면, 아마도 기억하게 될 것이다. &#x27;라고 말한다. 학습 조언을 제공하는 St. Louis Post-Dispatch 신문에 간혹 실리는 공익 기사에는 책에 코를 박고 있는 아이의 모습이 실려 있다. 캡션에는 &#x27;집중하라.&#x27;라고 쓰여 있다. &#x27;한 가지에, 그리고 한 가지에만 집중하라. 반복, 반복, 반복하라! 기억해야 할 것을 반복하는 것은 그것을 여러분의 기억에 각인시키는 데 도움이 될 수 있다. &#x27; 다시 읽기, 의도성, 그리고 반복의 힘에 대한 믿음은 널리 퍼져 있지만, 단순히 재차 반복하는 것만으로는 보통 어떤 것을 기억에 깊이 새길 수 없다는 것이 사실이다. 이 전략은 전화번호를 찾아보고 여러분의 휴대 전화에 그 번호를 누르는 동안 머릿속에 붙들어 둘 때는 효과가 있을 수도 있지만, 오래 지속되는 학습에는 효과적이지 않다.", "read": [{"en": "What students are advised to do is often plain wrong.", "ko": "학생들이 하도록 권고되는 것은 완전히 틀린 경우가 많다."}, {"en": "For instance, study tips published on a website at George Mason University include this advice: &quot;The key to learning something well is repetition; the more times you go over the material, the better chance you have of storing it permanently.&quot; Another, from a Dartmouth College website, suggests: &quot;If you intend to remember something, you probably will.&quot; A public service piece that runs occasionally in the St. Louis Post-Dispatch offering study advice shows a kid with his nose buried in a book.", "ko": "예를 들어, George Mason University 웹 사이트에 게시된 학습 조언 중에는 다음과 같은 조언이 있다. &#x27;어떤 것을 잘 암기하기 위한 비결은 반복이며, 자료를 더 여러 차례 반복해서 살펴볼수록, 그것을 영구적으로 기억할 가능성이 더 높아진다. &#x27; Dartmouth College 웹 사이트의 또 다른 조언은 &#x27;어떤 것을 기억하고자 한다면, 아마도 기억하게 될 것이다. &#x27;라고 말한다. 학습 조언을 제공하는 St. Louis Post-Dispatch 신문에 간혹 실리는 공익 기사에는 책에 코를 박고 있는 아이의 모습이 실려 있다."}, {"en": "&quot;Concentrate,&quot; the caption reads.", "ko": "캡션에는 &#x27;집중하라.&#x27;라고 쓰여 있다."}, {"en": "&quot;Focus on one thing and one thing only. Repeat, repeat, repeat! Repeating what you have to remember can help burn it into your memory.&quot; Belief in the power of rereading, intentionality, and repetition is pervasive, but the truth is you usually can&#x27;t embed something in memory simply by repeating it over and over.", "ko": "&#x27;한 가지에, 그리고 한 가지에만 집중하라. 반복, 반복, 반복하라! 기억해야 할 것을 반복하는 것은 그것을 여러분의 기억에 각인시키는 데 도움이 될 수 있다. &#x27; 다시 읽기, 의도성, 그리고 반복의 힘에 대한 믿음은 널리 퍼져 있지만, 단순히 재차 반복하는 것만으로는 보통 어떤 것을 기억에 깊이 새길 수 없다는 것이 사실이다."}, {"en": "This tactic might work when looking up a phone number and holding it in your mind while punching it into your phone, but it doesn&#x27;t work for durable learning.", "ko": "이 전략은 전화번호를 찾아보고 여러분의 휴대 전화에 그 번호를 누르는 동안 머릿속에 붙들어 둘 때는 효과가 있을 수도 있지만, 오래 지속되는 학습에는 효과적이지 않다."}]}, {"no": "3", "title": "White Supremacy in Educational Norms", "ktitle": "백인 = '정상' 표준(중심) — 같은 상황 다르게 해석되는 비대칭", "field": "교육·인종", "page": "07강 Ex.03", "oneline": "미국 교육자들이 백인 중산층의 관행을 '정상' 표준으로 당연시하면서, 동일 상황을 인종에 따라 다르게 해석한다 — 백인의 우수성은 당연시, 소수자의 부진은 병리화. 이 '숨겨진 교육과정'이 곧 교육에 박힌 백인 우월주의다.", "metaphor": "<svg aria-label=\"중심에 백인 중산층이 '정상' 표준으로 점선 박스 안에 놓이고, 위쪽에서는 백인 우수가 당연시되어 그냥 통과하는 화살표가, 아래쪽에서는 소수자 부진이 병리화되는 화살표가 비대칭으로 적용되는 그림\" role=\"img\" viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 제목 -->\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"11\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"300\" y=\"14\">\"white = normal\" → asymmetric interpretation</text>\n<!-- 중심: 백인 중산층 = 표준 박스 (당연시되는 가정 → 빨강 점선) -->\n<g transform=\"translate(300, 130)\">\n<rect fill=\"#fdf2f4\" fill-opacity=\"0.4\" height=\"80\" rx=\"6\" stroke=\"#c8102e\" stroke-dasharray=\"5 3\" stroke-width=\"1.8\" width=\"180\" x=\"-90\" y=\"-40\"></rect>\n<!-- 가족 stick figure 2명 -->\n<g transform=\"translate(-30, 0)\">\n<circle cx=\"0\" cy=\"-12\" fill=\"#ffffff\" r=\"7\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"></circle>\n<circle cx=\"-2\" cy=\"-13\" fill=\"#1a1a1a\" r=\"0.8\"></circle>\n<circle cx=\"2\" cy=\"-13\" fill=\"#1a1a1a\" r=\"0.8\"></circle>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"0\" y1=\"-5\" y2=\"15\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.1\" x1=\"0\" x2=\"-7\" y1=\"0\" y2=\"6\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.1\" x1=\"0\" x2=\"7\" y1=\"0\" y2=\"6\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"0\" x2=\"-5\" y1=\"15\" y2=\"26\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"0\" x2=\"5\" y1=\"15\" y2=\"26\"></line>\n</g>\n<g transform=\"translate(30, 0)\">\n<circle cx=\"0\" cy=\"-12\" fill=\"#ffffff\" r=\"7\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"></circle>\n<circle cx=\"-2\" cy=\"-13\" fill=\"#1a1a1a\" r=\"0.8\"></circle>\n<circle cx=\"2\" cy=\"-13\" fill=\"#1a1a1a\" r=\"0.8\"></circle>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"0\" y1=\"-5\" y2=\"15\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.1\" x1=\"0\" x2=\"-7\" y1=\"0\" y2=\"6\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.1\" x1=\"0\" x2=\"7\" y1=\"0\" y2=\"6\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"0\" x2=\"-5\" y1=\"15\" y2=\"26\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"0\" x2=\"5\" y1=\"15\" y2=\"26\"></line>\n</g>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"10\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"-25\">\"normal\" standard</text>\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"56\">백인 중산층 — 당연시되는 표준</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"69\">\"hidden curriculum\"</text>\n</g>\n<!-- 위쪽: 비대칭 1 — 백인 우수 → 당연 (해석 X) -->\n<g transform=\"translate(60, 60)\">\n<rect fill=\"#ffffff\" height=\"30\" rx=\"4\" stroke=\"#999\" stroke-width=\"1.2\" width=\"100\" x=\"0\" y=\"-15\"></rect>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" x=\"50\" y=\"-1\">백인이 우수할 때</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"50\" y=\"10\">whites outperform</text>\n</g>\n<!-- 화살표: 좌→중심으로 -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.4\" x1=\"160\" x2=\"208\" y1=\"60\" y2=\"105\"></line>\n<polygon fill=\"#1a1a1a\" points=\"208,105 199,103 203,111\"></polygon>\n<!-- 결과: 당연시 (그냥 통과) -->\n<g transform=\"translate(170, 50)\">\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" x=\"0\" y=\"0\">→ taken for granted</text>\n</g>\n<g transform=\"translate(440, 60)\">\n<rect fill=\"#ffffff\" height=\"30\" rx=\"4\" stroke=\"#999\" stroke-width=\"1.2\" width=\"100\" x=\"0\" y=\"-15\"></rect>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" x=\"50\" y=\"-1\">소수자가 우수할 때</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"50\" y=\"10\">Asian Am. outperform</text>\n</g>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.4\" x1=\"440\" x2=\"392\" y1=\"60\" y2=\"105\"></line>\n<polygon fill=\"#1a1a1a\" points=\"392,105 401,103 397,111\"></polygon>\n<g transform=\"translate(335, 50)\">\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" x=\"0\" y=\"0\">→ \"deviant\" parenting</text>\n</g>\n<!-- 아래쪽: 비대칭 2 — 백인 부진 → 그냥 / 소수자 부진 → 병리화 -->\n<g transform=\"translate(60, 220)\">\n<rect fill=\"#ffffff\" height=\"30\" rx=\"4\" stroke=\"#999\" stroke-width=\"1.2\" width=\"100\" x=\"0\" y=\"-15\"></rect>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" x=\"50\" y=\"-1\">백인이 부진할 때</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"50\" y=\"10\">whites underperform</text>\n</g>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.4\" x1=\"160\" x2=\"208\" y1=\"220\" y2=\"170\"></line>\n<polygon fill=\"#1a1a1a\" points=\"208,170 199,172 204,179\"></polygon>\n<g transform=\"translate(170, 232)\">\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" x=\"0\" y=\"0\">→ no pathological rationale</text>\n</g>\n<g transform=\"translate(440, 220)\">\n<rect fill=\"#ffffff\" height=\"30\" rx=\"4\" stroke=\"#999\" stroke-width=\"1.2\" width=\"100\" x=\"0\" y=\"-15\"></rect>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" x=\"50\" y=\"-1\">소수자가 부진할 때</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"50\" y=\"10\">minorities underperform</text>\n</g>\n<line stroke=\"#c8102e\" stroke-width=\"1.6\" x1=\"440\" x2=\"392\" y1=\"220\" y2=\"170\"></line>\n<polygon fill=\"#c8102e\" points=\"392,170 401,172 396,179\"></polygon>\n<g transform=\"translate(282, 245)\">\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" x=\"0\" y=\"0\">→ \"academic bullying\" · pathologized</text>\n</g>\n<!-- 하단 라벨 -->\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"10.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"300\" y=\"262\">same situations, asymmetric interpretation — white supremacy embedded</text>\n</svg>", "caption": "caption\n백인 = '정상' 표준이라는 당연시된 가정 위에서 — 동일 상황이 인종에 따라 비대칭 해석된다. 백인 우수·부진은 그냥 통과, 소수자 우수·부진은 일탈·병리로 라벨된다.", "tldr": ["미국 교육자들이 백인 중산층의 관행을 '정상' 표준으로 당연시하면서, 동일 상황을 인종에 따라 다르게 해석한다 — 백인의 우수성은 당연시, 소수자의 부진은 병리화. 이 '숨겨진 교육과정'이 곧 교육에 박힌 백인 우월주의다.", "caption\n백인 = '정상' 표준이라는 당연시된 가정 위에서 — 동일 상황이 인종에 따라 비대칭 해석된다. 백인 우수·부진은 그냥 통과, 소수자 우수·부진은 일탈·병리로 라벨된다."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["correspondingly", "그에 상응하여"], ["standard", "표준기준; 표준의"], ["conform to ~", "을 준수하다"], ["outperform", "더 뛰어나다능가하다"], ["bullying", "괴롭힘"], ["rationale", "설명이유근거"], ["predominantly", "대부분대개"], ["reinforce", "강화하다"], ["curriculum", "교육 과정"], ["informal", "비공식적인"], ["constitute", "구성하다"], ["integrated", "통합적인통합된"], ["reasonably", "상당히꽤"], ["resourced", "자원을 갖춘"], ["address", "(문제 등을) 다루다해결하다"], ["disrupt", "무너뜨리다붕괴시키다"], ["supremacy", "우월주의"], ["embed", "내포하다"], ["taken-for-granted", "당연시되는"], ["assumption", "전제가정"], ["contribute to ~", "의 한 원인이 되다"], ["frame", "표현하다"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n백인 = '정상' 표준이라는 당연시된 가정 위에서 — 동일 상황이 인종에 따라 비대칭 해석된다. 백인 우수·부진은 그냥 통과, 소수자 우수·부진은 일탈·병리로 라벨된다."], ["도식이 강조하는 결론은?", "미국 교육자들이 백인 중산층의 관행을 '정상' 표준으로 당연시하면서, 동일 상황을 인종에 따라 다르게 해석한다 — 백인의 우수성은 당연시, 소수자의 부진은 병리화. 이 '숨겨진 교육과정'이 곧 교육에 박힌 백인 우월주의다."]], "en": "American educators saw Asian American parenting as deviant and, correspondingly, felt white middle class parents and kids set an appropriate standard that others should conform to. For example, when white children outperform minority students, teachers rarely see it as &quot;academic bullying&quot; or express sympathy about minorities&#x27; &quot;emotional well-being.&quot; Similarly, educators do not create pathological rationales for whites&#x27; weaker performance relative to Asian Americans, as happens for minorities relative to whites. Whites are not expected to emulate those who achieve more (i.e., toward Asian Americans), whereas black and Latinx youths are (i.e., toward whites). Also, teachers, predominantly white, reinforce a &quot;hidden curriculum&quot; - that is, informal norms for what constitutes proper behavior, dress, attitudes, and discipline in schools. Racial inequalities arise even in integrated and reasonably resourced schools. Educators make significant efforts to address the learning gaps facing minority youths but do not disrupt the white supremacy embedded in standard practices. The taken-for-granted assumption that white students&#x27; practices are &quot;normal&quot; contributes to why Asian Americans are framed as &quot;deviant&quot; and &quot;a problem.&quot;", "ko": "미국 교육자들은 아시아계 미국인의 양육 방식이 규범에서 벗어난다고 여겼고, 그에 상응하여 백인 중산층 부모와 자녀가 다른 이들이 준수해야 할 적절한 표준을 설정한다고 생각했다. 예를 들어, 백인 아이가 소수 집단의 학생보다 더 뛰어날 때, 교사들이 이를 &#x27;학업적 괴롭힘&#x27;으로 여기거나 소수 집단 학생의 &#x27;정서적 행복&#x27;에 대해 동정심을 표현하는 경우는 드물다. 마찬가지로, 교육자들은 아시아계 미국인과 비교하여 백인들이 보이는 더 낮은 성취에 대해서는 병리적인 설명을 만들어 내지 않는데, 백인들과 비교하여 소수 집단 학생들에 대해서는 그렇게 한다. 백인은 더 많이 성취하는 사람들을 (즉, 아시아계 미국인 쪽으로) 본받도록 기대되지 않지만, 흑인과 라틴계 청소년들은 그렇게 하도록(즉, 백인들 쪽으로 본받도록) 기대된다. 또한, 대부분이 백인인 교사들은 &#x27;숨겨진 교육 과정&#x27;을 강화하는데, 이것은 다시 말해 학교에서의 올바른 행동, 복장, 태도, 규율을 구성하는 것에 대한 비공식적 규범이다. 인종 불평등은 심지어 통합 학교나 자원을 상당히 갖춘 학교에서도 발생한다. 교육자들은 소수 집단의 청소년들이 직면한 학습 격차를 다루기 위해 상당한 노력을 기울이지만, 표준 관행에 내포된 백인 우월주의를 무너뜨리지는 않는다. 백인 학생들의 관행이 &#x27;규범에 맞다&#x27;는 당연시되는 전제가, 아시아계 미국인이 &#x27;규범에서 벗어난&#x27; 그리고 &#x27;골칫거리&#x27;라고 표현되는 이유에 대한 한 원인이 된다.", "read": [{"en": "American educators saw Asian American parenting as deviant and, correspondingly, felt white middle class parents and kids set an appropriate standard that others should conform to.", "ko": "미국 교육자들은 아시아계 미국인의 양육 방식이 규범에서 벗어난다고 여겼고, 그에 상응하여 백인 중산층 부모와 자녀가 다른 이들이 준수해야 할 적절한 표준을 설정한다고 생각했다. 예를 들어, 백인 아이가 소수 집단의 학생보다 더 뛰어날 때, 교사들이 이를 &#x27;학업적 괴롭힘&#x27;으로 여기거나 소수 집단 학생의 &#x27;정서적 행복&#x27;에 대해 동정심을 표현하는 경우는 드물다."}, {"en": "For example, when white children outperform minority students, teachers rarely see it as &quot;academic bullying&quot; or express sympathy about minorities&#x27; &quot;emotional well-being.&quot; Similarly, educators do not create pathological rationales for whites&#x27; weaker performance relative to Asian Americans, as happens for minorities relative to whites.", "ko": "마찬가지로, 교육자들은 아시아계 미국인과 비교하여 백인들이 보이는 더 낮은 성취에 대해서는 병리적인 설명을 만들어 내지 않는데, 백인들과 비교하여 소수 집단 학생들에 대해서는 그렇게 한다."}, {"en": "Whites are not expected to emulate those who achieve more (i.e., toward Asian Americans), whereas black and Latinx youths are (i.e., toward whites).", "ko": "백인은 더 많이 성취하는 사람들을 (즉, 아시아계 미국인 쪽으로) 본받도록 기대되지 않지만, 흑인과 라틴계 청소년들은 그렇게 하도록(즉, 백인들 쪽으로 본받도록) 기대된다."}, {"en": "Also, teachers, predominantly white, reinforce a &quot;hidden curriculum&quot; - that is, informal norms for what constitutes proper behavior, dress, attitudes, and discipline in schools.", "ko": "또한, 대부분이 백인인 교사들은 &#x27;숨겨진 교육 과정&#x27;을 강화하는데, 이것은 다시 말해 학교에서의 올바른 행동, 복장, 태도, 규율을 구성하는 것에 대한 비공식적 규범이다."}, {"en": "Racial inequalities arise even in integrated and reasonably resourced schools.", "ko": "인종 불평등은 심지어 통합 학교나 자원을 상당히 갖춘 학교에서도 발생한다."}, {"en": "Educators make significant efforts to address the learning gaps facing minority youths but do not disrupt the white supremacy embedded in standard practices.", "ko": "교육자들은 소수 집단의 청소년들이 직면한 학습 격차를 다루기 위해 상당한 노력을 기울이지만, 표준 관행에 내포된 백인 우월주의를 무너뜨리지는 않는다."}, {"en": "The taken-for-granted assumption that white students&#x27; practices are &quot;normal&quot; contributes to why Asian Americans are framed as &quot;deviant&quot; and &quot;a problem.&quot;", "ko": "백인 학생들의 관행이 &#x27;규범에 맞다&#x27;는 당연시되는 전제가, 아시아계 미국인이 &#x27;규범에서 벗어난&#x27; 그리고 &#x27;골칫거리&#x27;라고 표현되는 이유에 대한 한 원인이 된다."}]}, {"no": "4", "title": "Marine Plastic Pollution and Data-Informed Action", "ktitle": "흩어진 데이터 zoo → 정량적 통합 → 포괄적 데이터 기반 행동", "field": "환경·생태", "page": "07강 Ex.04", "oneline": "해양 플라스틱 오염은 너무 복잡해 실험실의 단편적 데이터('zoo of data')만으로는 전체 그림을 그릴 수 없다 — 정량적 방법으로 데이터를 잇는 포괄적·데이터 기반 접근이 신속·대담·지식 기반의 행동을 가능케 한다.", "metaphor": "<svg aria-label=\"왼쪽에 실험실 비커와 관측 데이터 등 흩어진 부분 데이터 조각들이 zoo of data로 표시되고, 가운데 정량적 방법 화살표를 거쳐 오른쪽에 해양 생태계의 포괄적 통합 그림이 만들어진 다음 하단에 시기적절·대담·지식 기반 행동의 세 결과가 이어지는 그림\" role=\"img\" viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 좌측: zoo of data — 흩어진 데이터 조각 -->\n<g transform=\"translate(20, 30)\">\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"100\" y=\"-12\">부분 데이터 — zoo</text>\n<rect fill=\"#fdf2f4\" fill-opacity=\"0.35\" height=\"170\" stroke=\"#c8102e\" stroke-dasharray=\"4 3\" stroke-width=\"1.3\" width=\"200\" x=\"0\" y=\"0\"></rect>\n<!-- 비커 1 -->\n<g transform=\"translate(30, 30)\">\n<path d=\"M -10 0 L -10 22 Q -10 28 -4 28 L 4 28 Q 10 28 10 22 L 10 0\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.2\"></path>\n<line stroke=\"#c8102e\" stroke-width=\"1.2\" x1=\"-10\" x2=\"-13\" y1=\"0\" y2=\"-3\"></line>\n<line stroke=\"#c8102e\" stroke-width=\"1.2\" x1=\"10\" x2=\"13\" y1=\"0\" y2=\"-3\"></line>\n<rect fill=\"#c8102e\" fill-opacity=\"0.25\" height=\"12\" width=\"14\" x=\"-7\" y=\"14\"></rect>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"8\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"42\">lab</text>\n</g>\n<!-- 데이터 점들 -->\n<g transform=\"translate(80, 25)\">\n<rect fill=\"#ffffff\" height=\"32\" stroke=\"#c8102e\" stroke-width=\"1.1\" width=\"40\" x=\"0\" y=\"0\"></rect>\n<circle cx=\"6\" cy=\"22\" fill=\"#c810 e=\"10\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"300\" y=\"0\">data-informed action must be:</text>\n<g transform=\"translate(115, 18)\">\n<rect fill=\"#ffffff\" height=\"32\" rx=\"4\" stroke=\"#1FA34A\" stroke-width=\"1.3\" width=\"100\" x=\"0\" y=\"0\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" x=\"50\" y=\"14\">신속</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"50\" y=\"26\">timely</text>\n</g>\n<g transform=\"translate(250, 18)\">\n<rect fill=\"#ffffff\" height=\"32\" rx=\"4\" stroke=\"#1FA34A\" stroke-width=\"1.3\" width=\"100\" x=\"0\" y=\"0\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" x=\"50\" y=\"14\">대담</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"50\" y=\"26\">bold</text>\n</g>\n<g transform=\"translate(385, 18)\">\n<rect fill=\"#ffffff\" height=\"32\" rx=\"4\" stroke=\"#1FA34A\" stroke-width=\"1.3\" width=\"100\" x=\"0\" y=\"0\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" x=\"50\" y=\"14\">지식 기반</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"50\" y=\"26\">knowledge-based</text>\n</g>\n</g>\n</svg>", "caption": "caption\n      좌측 'zoo of data'(흩어진 부분 데이터)는 부족하다 → 정량적 통합으로 포괄적 그림이 만들어지고 → 신속·대담·지식 기반 행동이 가능해진다.", "tldr": ["해양 플라스틱 오염은 너무 복잡해 실험실의 단편적 데이터('zoo of data')만으로는 전체 그림을 그릴 수 없다 — 정량적 방법으로 데이터를 잇는 포괄적·데이터 기반 접근이 신속·대담·지식 기반의 행동을 가능케 한다.", "caption\n      좌측 'zoo of data'(흩어진 부분 데이터)는 부족하다 → 정량적 통합으로 포괄적 그림이 만들어지고 → 신속·대담·지식 기반 행동이 가능해진다."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["marine", "해양의"], ["implication", "영향"], ["geographic", "지리적인"], ["domain", "영역"], ["counteract", "대응하다"], ["planetary", "지구의이 세상의"], ["boundary", "한계(선)"], ["tailored", "맞춤형의"], ["accessible", "접근할 수 있는"], ["fundamental", "필수적인"], ["capture", "포착하다"], ["insufficient", "불충분한"], ["pervasive", "만연한"], ["exploit", "활용하다"], ["ultimately", "궁극적으로"], ["shed light on ~", "을 설명하다[해명하다]"], ["investigate", "조사하다"], ["timely", "시의적절한"], ["comprehensive", "종합적인"], ["disrupt", "교란하다방해하다"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n      좌측 'zoo of data'(흩어진 부분 데이터)는 부족하다 → 정량적 통합으로 포괄적 그림이 만들어지고 → 신속·대담·지식 기반 행동이 가능해진다."], ["도식이 강조하는 결론은?", "해양 플라스틱 오염은 너무 복잡해 실험실의 단편적 데이터('zoo of data')만으로는 전체 그림을 그릴 수 없다 — 정량적 방법으로 데이터를 잇는 포괄적·데이터 기반 접근이 신속·대담·지식 기반의 행동을 가능케 한다."]], "en": "Marine plastic pollution is a complex problem that occurs on many levels, as it presents physical, chemical, and biological implications for marine compartments at small scales while involving vast geographic domains. To counteract what can be regarded as a planetary boundary threat, we need tailored instruments to provide various layers of knowledge in an accessible manner. To this end, laboratory experiments and observations are indeed fundamental to capture specific aspects of plastic and plastic-related pollution; yet this zoo of data is still insufficient to provide a holistic description of this pervasive phenomenon. Quantitative methods can link and exploit our current understanding of the different processes and complex interaction characterizing marine plastic pollution to ultimately help to shed some light on aspects that are hard to investigate in the field. Actions against marine pollution have to be timely, bold, and knowledge-based. In this perspective, comprehensive, data-informed approaches can help not only to identify and protect the mechanisms that interconnect marine ecosystems but also to understand the processes and synergies that are disrupting it.", "ko": "해양 플라스틱 오염은 여러 수준에서 발생하는 복잡한 문제인데, 이는 그것이 광대한 지리적 영역을 포함하는 동시에 해양 구역에 소규모로 물리적, 화학적, 생물학적 영향을 미치기 때문이다. 지구 위험 한계선에 대한 위협으로 여겨질 수 있는 것에 대응하기 위해, 우리는 다양한 층위의 지식을 접근할 수 있는 방식으로 제공할 맞춤형 도구가 필요하다. 이 목적을 위해 실험실의 실험과 관찰은 플라스틱 및 플라스틱 관련 오염의 특정 측면을 포착하는 데 정말로 필수적이지만, 이러한 혼잡한 상태의 데이터는 이 만연한 현상에 대한 전체적인 설명을 제공하기에 여전히 불충분하다. 정량적 방법은 해양 플라스틱 오염을 특징짓는 다양한 과정과 복잡한 상호 작용에 대한 현재의 이해를 연결하고 활용할 수 있어서 궁극적으로 현장에서 조사하기 어려운 측면을 어느 정도 설명하는 데 도움이 될 수 있다. 해양 오염에 대한 조치는 시의적절하고, 대담하며, 지식에 기반해야 한다. 이러한 관점에서, 종합적이고 데이터에 입각한 접근 방식은 해양 생태계를 상호 연결하는 메커니즘을 발견하고 보호하는 데뿐만 아니라 그것을 교란하는 과정과 시너지 효과를 이해하는 데에도 도움이 될 수 있다.", "read": [{"en": "Marine plastic pollution is a complex problem that occurs on many levels, as it presents physical, chemical, and biological implications for marine compartments at small scales while involving vast geographic domains.", "ko": "해양 플라스틱 오염은 여러 수준에서 발생하는 복잡한 문제인데, 이는 그것이 광대한 지리적 영역을 포함하는 동시에 해양 구역에 소규모로 물리적, 화학적, 생물학적 영향을 미치기 때문이다."}, {"en": "To counteract what can be regarded as a planetary boundary threat, we need tailored instruments to provide various layers of knowledge in an accessible manner.", "ko": "지구 위험 한계선에 대한 위협으로 여겨질 수 있는 것에 대응하기 위해, 우리는 다양한 층위의 지식을 접근할 수 있는 방식으로 제공할 맞춤형 도구가 필요하다."}, {"en": "To this end, laboratory experiments and observations are indeed fundamental to capture specific aspects of plastic and plastic-related pollution; yet this zoo of data is still insufficient to provide a holistic description of this pervasive phenomenon.", "ko": "이 목적을 위해 실험실의 실험과 관찰은 플라스틱 및 플라스틱 관련 오염의 특정 측면을 포착하는 데 정말로 필수적이지만, 이러한 혼잡한 상태의 데이터는 이 만연한 현상에 대한 전체적인 설명을 제공하기에 여전히 불충분하다."}, {"en": "Quantitative methods can link and exploit our current understanding of the different processes and complex interaction characterizing marine plastic pollution to ultimately help to shed some light on aspects that are hard to investigate in the field.", "ko": "정량적 방법은 해양 플라스틱 오염을 특징짓는 다양한 과정과 복잡한 상호 작용에 대한 현재의 이해를 연결하고 활용할 수 있어서 궁극적으로 현장에서 조사하기 어려운 측면을 어느 정도 설명하는 데 도움이 될 수 있다."}, {"en": "Actions against marine pollution have to be timely, bold, and knowledge-based.", "ko": "해양 오염에 대한 조치는 시의적절하고, 대담하며, 지식에 기반해야 한다."}, {"en": "In this perspective, comprehensive, data-informed approaches can help not only to identify and protect the mechanisms that interconnect marine ecosystems but also to understand the processes and synergies that are disrupting it.", "ko": "이러한 관점에서, 종합적이고 데이터에 입각한 접근 방식은 해양 생태계를 상호 연결하는 메커니즘을 발견하고 보호하는 데뿐만 아니라 그것을 교란하는 과정과 시너지 효과를 이해하는 데에도 도움이 될 수 있다."}]}, {"no": "5", "title": "Piracy in the Digital Age", "ktitle": "종이책(어려움·도덕적 거부감) → 디지털(쉬운 복제·도덕적 무감각)", "field": "미디어·경제", "page": "07강 Ex.05", "oneline": "불법 복제(piracy)는 1709년부터 있던 일이지만 — 디지털 형식이 등장하며 복제가 한층 쉬워졌다. 종이책을 훔치는 데는 부끄러움을 느끼는 사람도 온라인 불법 복제본은 아무렇지 않게 본다. (무관 문장: 개도국의 접근 도움은 흐름과 무관)", "metaphor": "<svg aria-label=\"왼쪽 종이책 시대에는 가게 절도에 부끄러움을 느끼는 사람이, 오른쪽 디지털 시대에는 화면에서 쉽게 다운로드하면서도 무감각한 사람이 대비되고, 아래쪽에 개도국 접근성 관련 무관 문장이 빨간 X로 배제된 그림\" role=\"img\" viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 좌측: 종이책 시대 -->\n<g transform=\"translate(20, 30)\">\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"125\" y=\"-10\">종이책 시대 — 어렵고 부끄럽다</text>\n<rect fill=\"#ffffff\" height=\"170\" stroke=\"#c8102e\" stroke-width=\"1.4\" width=\"250\" x=\"0\" y=\"0\"></rect>\n<!-- 책 -->\n<g transform=\"translate(50, 75)\">\n<!-- 책 측면 -->\n<rect fill=\"#ffffff\" height=\"50\" stroke=\"#1a1a1a\" stroke-width=\"1.4\" width=\"44\" x=\"-22\" y=\"-30\"></rect>\n<rect fill=\"#c8102e\" fill-opacity=\"0.4\" height=\"50\" width=\"6\" x=\"-22\" y=\"-30\"></rect>\n<line stroke=\"#999\" stroke-width=\"0.8\" x1=\"-12\" x2=\"14\" y1=\"-22\" y2=\"-22\"></line>\n<line stroke=\"#999\" stroke-width=\"0.8\" x1=\"-12\" x2=\"14\" y1=\"-15\" y2=\"-15\"></line>\n<line stroke=\"#999\" stroke-width=\"0.8\" x1=\"-12\" x2=\"14\" y1=\"-8\" y2=\"-8\"></line>\n<line stroke=\"#999\" stroke-width=\"0.8\" x1=\"-12\" x2=\"14\" y1=\"-1\" y2=\"-1\"></line>\n<line stroke=\"#999\" stroke-width=\"0.8\" x1=\"-12\" x2=\"14\" y1=\"6\" y2=\"6\"></line>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"9.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"36\">bestseller</text>\n</g>\n<!-- 사람 + 책 들고 있음 + 부끄러운 표정 -->\n<g transform=\"translate(160, 95)\">\n<!-- 머리 -->\n<circle cx=\"0\" cy=\"-30\" fill=\"#ffffff\" r=\"11\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"></circle>\n<!-- 부끄러운 표정 (눈을 가린 듯한) -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"-5\" x2=\"-1\" y1=\"-32\" y2=\"-32\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"1\" x2=\"5\" y1=\"-32\" y2=\"-32\"></line>\n<path d=\"M -3 -25 Q 0 -27 3 -25\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"></path>\n<!-- 몸 (구부정) -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.4\" x1=\"0\" x2=\"-3\" y1=\"-19\" y2=\"5\"></line>\n<!-- 팔 (책을 숨기듯 가슴에) -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"-12\" y1=\"-12\" y2=\"-5\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"12\" y1=\"-12\" y2=\"-5\"></line>\n<!-- 다리 -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"-3\" x2=\"-9\" y1=\"5\" y2=\"20\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"-3\" x2=\"5\" y1=\"5\" y2=\"20\"></line>\n</g>\n<!-- 생각 풍선: mortified -->\n<g transform=\"translate(205, 50)\">\n<ellipse cx=\"0\" cy=\"0\" fill=\"#fdf2f4\" rx=\"30\" ry=\"14\" stroke=\"#c8102e\" stroke-width=\"1.2\"></ellipse>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"10\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"4\">mortified!</text>\n<circle cx=\"-22\" cy=\"10\" fill=\"#fdf2f4\" r=\"3\" stroke=\"#c8102e\" stroke-width=\"1\"></circle>\n<circle cx=\"-26\" cy=\"16\" fill=\"#fdf2f4\" r=\"1.8\" stroke=\"#c8102e\" stroke-width=\"0.9\"></circle>\n</g>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"125\" y=\"155\">shoplifting = moral barrier</text>\n</g>\n<!-- 가운데: 화살표 — digital makes easier -->\n<g transform=\"trans

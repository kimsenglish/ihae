\"Noto Serif\" font-size=\"6\" font-style=\"italic\" text-anchor=\"middle\" x=\"3\" y=\"-3\">free</text>\n<!-- 스탠드 -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"0\" y1=\"6\" y2=\"13\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"-8\" x2=\"8\" y1=\"13\" y2=\"13\"></line>\n</g>\n<!-- 사람 + 무감각 표정 (편안하게 클릭) -->\n<g transform=\"translate(160, 95)\">\n<circle cx=\"0\" cy=\"-30\" fill=\"#ffffff\" r=\"11\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"></circle>\n<!-- 평온한 표정 -->\n<circle cx=\"-3\" cy=\"-32\" fill=\"#1a1a1a\" r=\"1\"></circle>\n<circle cx=\"3\" cy=\"-32\" fill=\"#1a1a1a\" r=\"1\"></circle>\n<line stroke=\"#1a1a1a\" stroke-width=\"1\" x1=\"-3\" x2=\"3\" y1=\"-25\" y2=\"-25\"></line>\n<!-- 몸 (편안) -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.4\" x1=\"0\" x2=\"0\" y1=\"-19\" y2=\"5\"></line>\n<!-- 팔 (마우스 클릭하듯) -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"-15\" y1=\"-12\" y2=\"-15\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"14\" y1=\"-12\" y2=\"-8\"></line>\n<!-- 다리 -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"-6\" y1=\"5\" y2=\"20\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"6\" y1=\"5\" y2=\"20\"></line>\n</g>\n<!-- 생각 풍선: \"think nothing of it\" -->\n<g transform=\"translate(195, 50)\">\n<ellipse cx=\"0\" cy=\"0\" fill=\"#fdf2f4\" rx=\"38\" ry=\"14\" stroke=\"#c8102e\" stroke-width=\"1.2\"></ellipse>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"4\">\"no big deal\"</text>\n<circle cx=\"-30\" cy=\"10\" fill=\"#fdf2f4\" r=\"3\" stroke=\"#c8102e\" stroke-width=\"1\"></circle>\n<circle cx=\"-34\" cy=\"16\" fill=\"#fdf2f4\" r=\"1.8\" stroke=\"#c8102e\" stroke-width=\"0.9\"></circle>\n</g>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"120\" y=\"155\">click = no moral barrier</text>\n</g>\n<!-- 하단: 무관 문장 배제 -->\n<g transform=\"translate(0, 215)\">\n<rect fill=\"#ffffff\" height=\"42\" opacity=\"0.7\" rx=\"5\" stroke=\"#999\" stroke-dasharray=\"4 3\" stroke-width=\"1.2\" width=\"400\" x=\"100\" y=\"0\"></rect>\n<text fill=\"#999\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" x=\"300\" y=\"14\">무관한 문장 (글 흐름과 무관)</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"300\" y=\"29\">\"piracy provides access for people in developing countries\"</text>\n<!-- ✗ -->\n<g transform=\"translate(120, 21)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#ffffff\" r=\"11\" stroke=\"#c8102e\" stroke-width=\"1.6\"></circle>\n<line stroke=\"#c8102e\" stroke-width=\"2\" x1=\"-5\" x2=\"5\" y1=\"-5\" y2=\"5\"></line>\n<line stroke=\"#c8102e\" stroke-width=\"2\" x1=\"5\" x2=\"-5\" y1=\"-5\" y2=\"5\"></line>\n</g>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" x=\"480\" y=\"25\">excluded</text>\n</g>\n</svg>", "caption": "caption\n종이책 시대(절도에 부끄러움) → 디지털 시대(쉬운 복제 · 도덕적 무감각)으로 변했다. 무관 문장(개도국 접근성)은 흐름과 다르므로 배제.", "tldr": ["불법 복제(piracy)는 1709년부터 있던 일이지만 — 디지털 형식이 등장하며 복제가 한층 쉬워졌다. 종이책을 훔치는 데는 부끄러움을 느끼는 사람도 온라인 불법 복제본은 아무렇지 않게 본다. (무관 문장: 개도국의 접근 도움은 흐름과 무관)", "caption\n종이책 시대(절도에 부끄러움) → 디지털 시대(쉬운 복제 · 도덕적 무감각)으로 변했다. 무관 문장(개도국 접근성)은 흐름과 다르므로 배제."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["publisher", "출판사"], ["material", "자료"], ["piracy", "불법 복제저작권 침해"], ["unauthorized", "무단의허가받지 않은"], ["copyright", "저작권을 주다; 저작권"], ["phenomenon", "현상"], ["date back to (~", "의) 시기가 ...까지 거슬러 올라가다"], ["reign", "통치치세"], ["format", "형식"], ["appropriate", "도용하다"], ["a fraction of ~", "의 아주 작은 부분[일부]"], ["retail", "소매(의)"], ["shoplift", "상점에서 훔치다"], ["think nothing of ~", "을 아무렇지도 않게 생각하다"], ["pirate", "불법 복제하다"], ["legally", "합법적으로"], ["safeguard", "보호 장치"], ["estimate", "추정하다"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n종이책 시대(절도에 부끄러움) → 디지털 시대(쉬운 복제 · 도덕적 무감각)으로 변했다. 무관 문장(개도국 접근성)은 흐름과 다르므로 배제."], ["도식이 강조하는 결론은?", "불법 복제(piracy)는 1709년부터 있던 일이지만 — 디지털 형식이 등장하며 복제가 한층 쉬워졌다. 종이책을 훔치는 데는 부끄러움을 느끼는 사람도 온라인 불법 복제본은 아무렇지 않게 본다. (무관 문장: 개도국의 접근 도움은 흐름과 무관)"]], "en": "One factor that influences the publisher and the bookstore&#x27;s ability to sell materials is piracy, which refers to the unauthorized copying, distribution, or use of copyrighted content. This is hardly a recent phenomenon, as copyright law dates back to 1709 during the reign of Britain&#x27;s Queen Anne. But digital formats make piracy easier whether texts are appropriated for personal use or sold for a fraction of their retail cost. Individuals who would be mortified at the idea of shoplifting a print copy of a bestseller often think nothing of reading an online version that may have been pirated. Piracy can actually provide access to books, films, music, and educational content for people who cannot afford or legally obtain them, especially in developing countries. As with any retail business, book publishers will continue to fend off piracy with evolving digital safeguards and to estimate and write off losses where these fail.", "ko": "출판사와 서점의 자료 판매 능력에 영향을 미치는 한 가지 요인은 불법 복제인데, 이는 저작권이 있는 콘텐츠의 무단 복제, 배포, 또는 사용을 일컫는다. 이것은 최근의 현상이라고 할 수는 없는데, 왜냐하면 저작권법의 시기가 영국 Anne 여왕 통치 기간이었던 1709년까지 거슬러 올라가기 때문이다. 하지만 텍스트가 개인 용도로 도용되든 소매가의 아주 작은 부분에 해당하는 값에 판매되든 디지털 형식은 불법 복제를 더 쉽게 만든다. 베스트셀러의 인쇄본을 상점에서 훔친다는 생각에는 모멸감을 느낄 사람들이 불법 복제되었을 수도 있는 온라인 버전을 읽는 것에 대해서는 아무렇지도 않게 생각하는 경우가 많다. (불법 복제는 특히 개발 도상국에서 도서, 영화, 음악, 그리고 교육 콘텐츠를 사거나 합법적으로 구할 능력이 없는 사람들에게 실제로 그것에 대한 접근을 제공해 줄 수 있다. ) 여느 소매업의 경우처럼, 도서 출판사들은 진화하는 디지털 보호 장치를 통해 불법 복제를 막는 것과 이런 것들이 실패하는 경우에는 손실을 추정하여 결손으로 처리하는 것을 계속할 것이다.", "read": [{"en": "One factor that influences the publisher and the bookstore&#x27;s ability to sell materials is piracy, which refers to the unauthorized copying, distribution, or use of copyrighted content.", "ko": "출판사와 서점의 자료 판매 능력에 영향을 미치는 한 가지 요인은 불법 복제인데, 이는 저작권이 있는 콘텐츠의 무단 복제, 배포, 또는 사용을 일컫는다."}, {"en": "This is hardly a recent phenomenon, as copyright law dates back to 1709 during the reign of Britain&#x27;s Queen Anne.", "ko": "이것은 최근의 현상이라고 할 수는 없는데, 왜냐하면 저작권법의 시기가 영국 Anne 여왕 통치 기간이었던 1709년까지 거슬러 올라가기 때문이다."}, {"en": "But digital formats make piracy easier whether texts are appropriated for personal use or sold for a fraction of their retail cost.", "ko": "하지만 텍스트가 개인 용도로 도용되든 소매가의 아주 작은 부분에 해당하는 값에 판매되든 디지털 형식은 불법 복제를 더 쉽게 만든다."}, {"en": "Individuals who would be mortified at the idea of shoplifting a print copy of a bestseller often think nothing of reading an online version that may have been pirated.", "ko": "베스트셀러의 인쇄본을 상점에서 훔친다는 생각에는 모멸감을 느낄 사람들이 불법 복제되었을 수도 있는 온라인 버전을 읽는 것에 대해서는 아무렇지도 않게 생각하는 경우가 많다."}, {"en": "Piracy can actually provide access to books, films, music, and educational content for people who cannot afford or legally obtain them, especially in developing countries.", "ko": "(불법 복제는 특히 개발 도상국에서 도서, 영화, 음악, 그리고 교육 콘텐츠를 사거나 합법적으로 구할 능력이 없는 사람들에게 실제로 그것에 대한 접근을 제공해 줄 수 있다."}, {"en": "As with any retail business, book publishers will continue to fend off piracy with evolving digital safeguards and to estimate and write off losses where these fail.", "ko": ") 여느 소매업의 경우처럼, 도서 출판사들은 진화하는 디지털 보호 장치를 통해 불법 복제를 막는 것과 이런 것들이 실패하는 경우에는 손실을 추정하여 결손으로 처리하는 것을 계속할 것이다."}]}, {"no": "6", "title": "Photography and the Interpretation of Reality", "ktitle": "중립적 증거(환상) ↔ 해석(Sontag) — 디지털은 현실에서 한 단계 더 멀어짐", "field": "예술·매체", "page": "07강 Ex.06", "oneline": "사진은 '중립적 현실의 증거'라는 환상과 싸운다 — Sontag의 말처럼 사진도 회화·소묘처럼 '세계의 해석'이며, 디지털 사진은 비트로 변환되어 현실에서 한 단계 더 멀어진다.", "metaphor": "<svg aria-label=\"위쪽에 사진은 중립적 증거라는 환상이 빨간 점선으로, BUT을 거쳐 진실은 사진도 그림처럼 해석이라는 Sontag의 인용이 초록으로 표시되고, 아래쪽에 현실에서 필름 네거티브 인화 디지털 비트로 멀어지는 거리 축이 그려진 그림\" role=\"img\" viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 좌측: 통념 — 사진 = 중립적 증거 -->\n<g transform=\"translate(20, 30)\">\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"115\" y=\"-10\">환상 — 중립적 증거</text>\n<rect fill=\"#fdf2f4\" fill-opacity=\"0.4\" height=\"115\" stroke=\"#c8102e\" stroke-dasharray=\"4 3\" stroke-width=\"1.4\" width=\"230\" x=\"0\" y=\"0\"></rect>\n<!-- 카메라 -->\n<g transform=\"translate(50, 55)\">\n<rect fill=\"#ffffff\" height=\"26\" rx=\"3\" stroke=\"#1a1a1a\" stroke-width=\"1.3\" width=\"44\" x=\"-22\" y=\"-12\"></rect>\n<rect fill=\"#ffffff\" height=\"6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\" width=\"14\" x=\"-7\" y=\"-18\"></rect>\n<circle cx=\"0\" cy=\"0\" fill=\"#ffffff\" r=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"></circle>\n<circle cx=\"0\" cy=\"0\" fill=\"#1a1a1a\" r=\"4\"></circle>\n<circle cx=\"-15\" cy=\"-7\" fill=\"#c8102e\" r=\"1.5\"></circle>\n</g>\n<!-- = (등호) -->\n<g transform=\"translate(115, 50)\">\n<line stroke=\"#c8102e\" stroke-width=\"1.5\" x1=\"0\" x2=\"14\" y1=\"0\" y2=\"0\"></line>\n<line stroke=\"#c8102e\" stroke-width=\"1.5\" x1=\"0\" x2=\"14\" y1=\"8\" y2=\"8\"></line>\n</g>\n<!-- \"현실\" 박스 -->\n<g transform=\"translate(165, 55)\">\n<rect fill=\"#ffffff\" height=\"44\" stroke=\"#c8102e\" stroke-width=\"1.3\" width=\"50\" x=\"-25\" y=\"-22\"></rect>\n<!-- 풍경 미니 -->\n<path d=\"M -22 14 L -12 4 L -5 10 L 5 0 L 15 8 L 22 14 Z\" fill=\"#c8102e\" fill-opacity=\"0.2\" stroke=\"#c8102e\" stroke-width=\"0.8\"></path>\n<circle cx=\"10\" cy=\"-12\" fill=\"#ffffff\" r=\"4\" stroke=\"#c8102e\" stroke-width=\"0.8\"></circle>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"32\">reality</text>\n</g>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"115\" y=\"103\">\"unquestionable proof\"</text>\n</g>\n<!-- 가운데: BUT -->\n<g transform=\"translate(265, 85)\">\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"11\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"20\" y=\"-3\">BUT</text>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.5\" x1=\"0\" x2=\"40\" y1=\"6\" y2=\"6\"></line>\n<polygon fill=\"#1a1a1a\" points=\"40,6 32,1 32,11\"></polygon>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"20\" y=\"22\">Sontag</text>\n</g>\n<!-- 우측: 진실 — 사진 = 해석 -->\n<g transform=\"translate(320, 30)\">\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"125\" y=\"-10\">진실 — 해석</text>\n<rect fill=\"#ffffff\" height=\"115\" stroke=\"#1FA34A\" stroke-width=\"1.5\" width=\"250\" x=\"0\" y=\"0\"></rect>\n<!-- 카메라 -->\n<g transform=\"translate(40, 55)\">\n<rect fill=\"#ffffff\" height=\"22\" rx=\"3\" stroke=\"#1a1a1a\" stroke-width=\"1.3\" width=\"36\" x=\"-18\" y=\"-10\"></rect>\n<rect fill=\"#ffffff\" height=\"5\" stroke=\"#1a1a1a\" stroke-width=\"1.2\" width=\"12\" x=\"-6\" y=\"-15\"></rect>\n<circle cx=\"0\" cy=\"1\" fill=\"#ffffff\" r=\"7\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"></circle>\n<circle cx=\"0\" cy=\"1\" fill=\"#1a1a1a\" r=\"3.5\"></circle>\n</g>\n<!-- = (등호 초록) -->\n<g transform=\"translate(85, 50)\">\n<line stroke=\"#1FA34A\" stroke-width=\"1.5\" x1=\"0\" x2=\"14\" y1=\"0\" y2=\"0\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"1.5\" x1=\"0\" x2=\"14\" y1=\"8\" y2=\"8\"></line>\n</g>\n<!-- 그림(palette) -->\n<g transform=\"translate(130, 55)\">\n<ellipse cx=\"0\" cy=\"0\" fill=\"#f0faf3\" rx=\"20\" ry=\"14\" stroke=\"#1FA34A\" stroke-width=\"1.3\"></ellipse>\n<circle cx=\"-12\" cy=\"-5\" fill=\"#1FA34A\" fill-opacity=\"0.5\" r=\"3\"></circle>\n<circle cx=\"-4\" cy=\"-7\" fill=\"#c8102e\" fill-opacity=\"0.4\" r=\"3\"></circle>\n<circle cx=\"5\" cy=\"-6\" fill=\"#1a1a1a\" fill-opacity=\"0.4\" r=\"3\"></circle>\n<circle cx=\"11\" cy=\"0\" fill=\"#1FA34A\" fill-opacity=\"0.6\" r=\"3\"></circle>\n<circle cx=\"0\" cy=\"6\" fill=\"#ffffff\" r=\"3.5\" stroke=\"#1FA34A\" stroke-width=\"1\"></circle>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"26\">painting · drawing</text>\n</g>\n<!-- Sontag 인용 박스 -->\n<g transform=\"translate(190, 38)\">\n<rect fill=\"#f0faf3\" height=\"50\" rx=\"3\" stroke=\"#1FA34A\" stroke-width=\"1.2\" width=\"55\" x=\"0\" y=\"0\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"7.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"27.5\" y=\"14\">\"as much an</text>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"7.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"27.5\" y=\"25\">interpretation</text>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"7.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"27.5\" y=\"36\">of the world\"</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"6.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"27.5\" y=\"46\">— Sontag</text>\n</g>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"125\" y=\"105\">interpretation, like painting</text>\n</g>\n<!-- 아래쪽 절반: 거리 축 — 현실에서 멀어짐 -->\n<g transform=\"translate(0, 165)\">\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"10.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"300\" y=\"0\">distance from reality (each step further)</text>\n<!-- 가로 축 화살표 -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.4\" x1=\"50\" x2=\"540\" y1=\"35\" y2=\"35\"></line>\n<polygon fill=\"#1a1a1a\" points=\"540,35 532,30 532,40\"></polygon>\n<!-- 4단계 점 -->\n<!-- reality -->\n<g transform=\"translate(80, 35)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#1FA34A\" r=\"6\"></circle>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"-12\">현실</text>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"22\">reality</text>\n</g>\n<!-- film negative -->\n<g transform=\"translate(220, 35)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#999\" r=\"6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"></circle>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"-12\">필름 네거티브</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"22\">negative (image)</text>\n</g>\n<!-- print -->\n<g transform=\"translate(380, 35)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#999\" r=\"6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"></circle>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"-12\">인화 (+ dodging · burning)</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"22\">print — Ansel Adams</text>\n</g>\n<!-- digital bits -->\n<g transform=\"translate(520, 35)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#c8102e\" r=\"6\"></circle>\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"-12\">디지털 비트</text>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"22\">1's &amp; 0's (not image)</text>\n</g>\n<!-- \"한 단계 더 멀어짐\" 강조 -->\n<line stroke=\"#c8102e\" stroke-dasharray=\"3 2\" stroke-width=\"1.3\" x1=\"395\" x2=\"510\" y1=\"48\" y2=\"48\"></line>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"455\" y=\"64\">one more step removed</text>\n</g>\n</svg>", "caption": "caption\n      위: 사진 = 중립적 증거(환상) ↔ Sontag = 그림처럼 해석. 아래: 현실 → 네거티브 → 인화 → 디지털 비트로 갈수록 현실에서 멀어진다.", "tldr": ["사진은 '중립적 현실의 증거'라는 환상과 싸운다 — Sontag의 말처럼 사진도 회화·소묘처럼 '세계의 해석'이며, 디지털 사진은 비트로 변환되어 현실에서 한 단계 더 멀어진다.", "caption\n      위: 사진 = 중립적 증거(환상) ↔ Sontag = 그림처럼 해석. 아래: 현실 → 네거티브 → 인화 → 디지털 비트로 갈수록 현실에서 멀어진다."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["battle with ~", "과 싸우다"], ["capture", "포착하다"], ["neutral", "중립적인"], ["modify", "수정하다"], ["official", "공적인공식적인"], ["pass for ~", "로 통하다"], ["unquestionable", "의문의 여지가 없는"], ["negative", "(사진의) 원판네거티브"], ["comprised of ~", "로 구성된"], ["computerized", "전산화된"], ["interpret", "해석하다"], ["darkroom", "암실"], ["develop", "(필름을) 현상하다"], ["tonal", "색조의음영의"], ["removed", "동떨어진"], ["transfer", "전환"], ["established", "자리 잡힌확립된"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n      위: 사진 = 중립적 증거(환상) ↔ Sontag = 그림처럼 해석. 아래: 현실 → 네거티브 → 인화 → 디지털 비트로 갈수록 현실에서 멀어진다."], ["도식이 강조하는 결론은?", "사진은 '중립적 현실의 증거'라는 환상과 싸운다 — Sontag의 말처럼 사진도 회화·소묘처럼 '세계의 해석'이며, 디지털 사진은 비트로 변환되어 현실에서 한 단계 더 멀어진다."]], "en": "Photography battles with the fantasy that it captures a neutral view of reality without modifying it. Susan Sontag refers to an official use of the printed photograph that passes for unquestionable proof that a given thing happened. (A) While the negative in print photography is still an image, the file of a digital image is comprised of bits — computerized 1&#x27;s and 0&#x27;s that are not an image until interpreted and displayed by a combination of software and an electronic display device. (B) Ansel Adams is known for spending many hours in the darkroom developing a single print and he also said, &#x27;dodging and burning are steps to take care of mistakes God made in establishing tonal relationships&#x27;. However, digital images tend to be one more step removed from reality. (C) However, she states her opinion that &#x27;photographs are as much an interpretation of the world as paintings and drawings&#x27;. Additionally, the art of dodging and burning during the transfer from negative to print was well established before Photoshop and digital photography.", "ko": "사진술은 현실을 수정하지 않고 그것을 중립적인 시각으로 포착한다는 환상과 싸운다. Susan Sontag는 특정 사건이 일어났다는 의문의 여지가 없는 증거로 통하는 인화된 사진의 공적인 용도를 언급한다. (A) 인화 사진술에서 원판은 여전히 이미지이지만, 디지털 이미지 파일은 소프트웨어와 전자 디스플레이 장치의 결합을 통해 해석되어 화면에 표시되기 전까지는 이미지가 아닌, 전산화된 1과 0의 비트로 구성되어 있다. (B) Ansel Adams는 한 장의 인화본을 현상하면서 수많은 시간을 암실에서 보내는 것으로 알려져 있으며, 그도 또한 &#x27;다징과 버닝은 신이 색조의 관계를 설정하는 과정에서 저지른 실수를 보완하는 단계이다. &#x27;라고 말했다. 그러나 디지털 이미지는 현실로부터 한 걸음 더 동떨어진 경향이 있다. (C) 그러나 그녀는 &#x27;사진은 회화와 그림만큼이나 세상에 대한 해석이다. &#x27;라는 자신의 견해를 진술한다. 게다가, 원판을 인화본으로 전환하는 과정에서의 다징과 버닝 기법은 포토샵과 디지털 사진술 이전에 확실히 자리 잡혀 있었다.", "read": [{"en": "Photography battles with the fantasy that it captures a neutral view of reality without modifying it.", "ko": "사진술은 현실을 수정하지 않고 그것을 중립적인 시각으로 포착한다는 환상과 싸운다."}, {"en": "Susan Sontag refers to an official use of the printed photograph that passes for unquestionable proof that a given thing happened.", "ko": "Susan Sontag는 특정 사건이 일어났다는 의문의 여지가 없는 증거로 통하는 인화된 사진의 공적인 용도를 언급한다."}, {"en": "(A) While the negative in print photography is still an image, the file of a digital image is comprised of bits — computerized 1&#x27;s and 0&#x27;s that are not an image until interpreted and displayed by a combination of software and an electronic display device.", "ko": "(A) 인화 사진술에서 원판은 여전히 이미지이지만, 디지털 이미지 파일은 소프트웨어와 전자 디스플레이 장치의 결합을 통해 해석되어 화면에 표시되기 전까지는 이미지가 아닌, 전산화된 1과 0의 비트로 구성되어 있다."}, {"en": "(B) Ansel Adams is known for spending many hours in the darkroom developing a single print and he also said, &#x27;dodging and burning are steps to take care of mistakes God made in establishing tonal relationships&#x27;.", "ko": "(B) Ansel Adams는 한 장의 인화본을 현상하면서 수많은 시간을 암실에서 보내는 것으로 알려져 있으며, 그도 또한 &#x27;다징과 버닝은 신이 색조의 관계를 설정하는 과정에서 저지른 실수를 보완하는 단계이다. &#x27;라고 말했다."}, {"en": "However, digital images tend to be one more step removed from reality.", "ko": "그러나 디지털 이미지는 현실로부터 한 걸음 더 동떨어진 경향이 있다."}, {"en": "(C) However, she states her opinion that &#x27;photographs are as much an interpretation of the world as paintings and drawings&#x27;.", "ko": "(C) 그러나 그녀는 &#x27;사진은 회화와 그림만큼이나 세상에 대한 해석이다. &#x27;라는 자신의 견해를 진술한다."}, {"en": "Additionally, the art of dodging and burning during the transfer from negative to print was well established before Photoshop and digital photography.", "ko": "게다가, 원판을 인화본으로 전환하는 과정에서의 다징과 버닝 기법은 포토샵과 디지털 사진술 이전에 확실히 자리 잡혀 있었다."}]}, {"no": "7", "title": "Gatekeeping in Campus News", "ktitle": "3개 이벤트 → 편집자 게이트 → 1개만 통과 → 나머지는 독자에게 미도달", "field": "미디어·사회", "page": "07강 Ex.07", "oneline": "캠퍼스의 3개 이벤트(여자 축구·육상·헌혈) 중 신문이 축구만 선택하면 — 독자는 나머지 2개의 존재 자체를 모른다. 무엇이 중요한지 독자가 아닌 편집자가 결정하는 이 과정이 곧 '게이트키핑'이다.", "metaphor": "<svg aria-label=\"왼쪽에 여자 축구 육상 헌혈 세 개의 이벤트 입력 박스가 있고, 가운데 편집자 게이트를 통과해 오른쪽에 축구 기사만 신문에 인쇄되고 나머지 두 개는 점선 회색으로 차단되어 독자에게 도달하지 못함을 보여주는 그림\" role=\"img\" viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 좌측: 3개 이벤트 입력 -->\n<g transform=\"translate(20, 30)\">\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"80\" y=\"-10\">3개 이벤트 입력</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"80\" y=\"2\">press release</text>\n<!-- 이벤트 1: 여자 축구 -->\n<g transform=\"translate(0, 14)\">\n<rect fill=\"#ffffff\" height=\"36\" rx=\"4\" stroke=\"#1a1a1a\" stroke-width=\"1.3\" width=\"160\" x=\"0\" y=\"0\"></rect>\n<!-- 축구공 미니 -->\n<g transform=\"translate(20, 18)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#ffffff\" r=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"></circle>\n<polygon fill=\"#1a1a1a\" points=\"0,-4 3,0 0,4 -3,0\"></polygon>\n</g>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" x=\"38\" y=\"16\">여자 축구 경기</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" x=\"38\" y=\"28\">women's soccer game</text>\n</g>\n<!-- 이벤트 2: 육상 -->\n<g transform=\"translate(0, 58)\">\n<rect fill=\"#ffffff\" height=\"36\" rx=\"4\" stroke=\"#1a1a1a\" s "12\" x2=\"68\" y1=\"20\" y2=\"20\"></line>\n<!-- 편집자 stick figure (게이트 안에) -->\n<g transform=\"translate(40, -3)\">\n<circle cx=\"0\" cy=\"-12\" fill=\"#ffffff\" r=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"></circle>\n<circle cx=\"-2\" cy=\"-13\" fill=\"#1a1a1a\" r=\"0.9\"></circle>\n<circle cx=\"2\" cy=\"-13\" fill=\"#1a1a1a\" r=\"0.9\"></circle>\n<path d=\"M -3 -8 Q 0 -6 3 -8\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"></path>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"0\" x2=\"0\" y1=\"-4\" y2=\"12\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"0\" x2=\"-8\" y1=\"0\" y2=\"6\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"0\" x2=\"8\" y1=\"0\" y2=\"6\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"0\" x2=\"-6\" y1=\"12\" y2=\"22\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"0\" x2=\"6\" y1=\"12\" y2=\"22\"></line>\n</g>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"10\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"40\" y=\"-58\">GATE</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" x=\"40\" y=\"64\">편집자 = 결정자</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"40\" y=\"75\">editor</text>\n</g>\n<!-- 입력 화살표들 (3개 → 게이트) -->\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"180\" x2=\"218\" y1=\"62\" y2=\"88\"></line>\n<polygon fill=\"#1a1a1a\" points=\"218,88 211,84 213,92\"></polygon>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"180\" x2=\"218\" y1=\"106\" y2=\"108\"></line>\n<polygon fill=\"#1a1a1a\" points=\"218,108 211,104 211,112\"></polygon>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"180\" x2=\"218\" y1=\"150\" y2=\"128\"></line>\n<polygon fill=\"#1a1a1a\" points=\"218,128 211,124 213,132\"></polygon>\n<!-- 출력 화살표 (게이트 → 우측 통과) -->\n<line stroke=\"#1FA34A\" stroke-width=\"1.6\" x1=\"300\" x2=\"338\" y1=\"108\" y2=\"88\"></line>\n<polygon fill=\"#1FA34A\" points=\"338,88 332,87 333,95\"></polygon>\n<!-- 우측: 출력 (축구 신문 + 차단된 2개) -->\n<g transform=\"translate(335, 30)\">\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"125\" y=\"-10\">신문에 인쇄됨</text>\n<!-- 신문 (축구만) -->\n<g transform=\"translate(20, 30)\">\n<rect fill=\"#ffffff\" height=\"65\" stroke=\"#1FA34A\" stroke-width=\"1.6\" width=\"100\" x=\"0\" y=\"0\"></rect>\n<!-- 신문 헤더 -->\n<rect fill=\"#1FA34A\" height=\"10\" width=\"100\" x=\"0\" y=\"0\"></rect>\n<text fill=\"#ffffff\" font-family=\"Noto Serif\" font-size=\"6.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"50\" y=\"8\">CAMPUS NEWS</text>\n<!-- 기사 제목 -->\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"8\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"50\" y=\"22\">Soccer Preview</text>\n<!-- 본문 줄 -->\n<line stroke=\"#999\" stroke-width=\"0.5\" x1=\"5\" x2=\"95\" y1=\"28\" y2=\"28\"></line>\n<line stroke=\"#999\" stroke-width=\"0.5\" x1=\"5\" x2=\"95\" y1=\"33\" y2=\"33\"></line>\n<line stroke=\"#999\" stroke-width=\"0.5\" x1=\"5\" x2=\"80\" y1=\"38\" y2=\"38\"></line>\n<!-- 미니 축구공 -->\n<g transform=\"translate(80, 50)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#ffffff\" r=\"6\" stroke=\"#1FA34A\" stroke-width=\"1\"></circle>\n<polygon fill=\"#1FA34A\" points=\"0,-3 2,0 0,3 -2,0\"></polygon>\n</g>\n<line stroke=\"#999\" stroke-width=\"0.5\" x1=\"5\" x2=\"65\" y1=\"48\" y2=\"48\"></line>\n<line stroke=\"#999\" stroke-width=\"0.5\" x1=\"5\" x2=\"65\" y1=\"54\" y2=\"54\"></line>\n<line stroke=\"#999\" stroke-width=\"0.5\" x1=\"5\" x2=\"60\" y1=\"60\" y2=\"60\"></line>\n<!-- ✓ -->\n<g transform=\"translate(0, 95)\">\n<circle cx=\"50\" cy=\"0\" fill=\"#1FA34A\" r=\"8\"></circle>\n<path d=\"M 47 0 L 49 3 L 53 -3\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.6\"></path>\n</g>\n</g>\n<!-- 차단된 2개 (점선 회색) -->\n<g transform=\"translate(140, 30)\">\n<!-- 육상 -->\n<rect fill=\"#ffffff\" height=\"28\" opacity=\"0.7\" rx=\"3\" stroke=\"#999\" stroke-dasharray=\"3 2\" stroke-width=\"1.2\" width=\"100\" x=\"0\" y=\"0\"></rect>\n<text fill=\"#999\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" x=\"50\" y=\"13\">육상</text>\n<text fill=\"#999\" font-family=\"Noto Serif\" font-size=\"8\" font-style=\"italic\" text-anchor=\"middle\" x=\"50\" y=\"24\">track</text>\n<!-- ✗ -->\n<g transform=\"translate(85, 14)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#ffffff\" r=\"7\" stroke=\"#c8102e\" stroke-width=\"1.3\"></circle>\n<line stroke=\"#c8102e\" stroke-width=\"1.4\" x1=\"-3\" x2=\"3\" y1=\"-3\" y2=\"3\"></line>\n<line stroke=\"#c8102e\" stroke-width=\"1.4\" x1=\"3\" x2=\"-3\" y1=\"-3\" y2=\"3\"></line>\n</g>\n<!-- 헌혈 -->\n<rect fill=\"#ffffff\" height=\"28\" opacity=\"0.7\" rx=\"3\" stroke=\"#999\" stroke-dasharray=\"3 2\" stroke-width=\"1.2\" width=\"100\" x=\"0\" y=\"36\"></rect>\n<text fill=\"#999\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" x=\"50\" y=\"49\">헌혈</text>\n<text fill=\"#999\" font-family=\"Noto Serif\" font-size=\"8\" font-style=\"italic\" text-anchor=\"middle\" x=\"50\" y=\"60\">blood drive</text>\n<g transform=\"translate(85, 50)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#ffffff\" r=\"7\" stroke=\"#c8102e\" stroke-width=\"1.3\"></circle>\n<line stroke=\"#c8102e\" stroke-width=\"1.4\" x1=\"-3\" x2=\"3\" y1=\"-3\" y2=\"3\"></line>\n<line stroke=\"#c8102e\" stroke-width=\"1.4\" x1=\"3\" x2=\"-3\" y1=\"-3\" y2=\"3\"></line>\n</g>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"50\" y=\"80\">readers don't know</text>\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" x=\"50\" y=\"91\">독자에게 미도달</text>\n</g>\n</g>\n<!-- 하단 결론 -->\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"11\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"300\" y=\"248\">readers don't decide what matters — editors do = gatekeeping</text>\n</svg>", "caption": "caption\n      3개 이벤트가 편집자 게이트를 통과 → 축구만 신문에 인쇄(✓), 나머지 둘은 차단(✗) → 독자는 그 존재조차 모름. 이것이 '게이트키핑'.", "tldr": ["캠퍼스의 3개 이벤트(여자 축구·육상·헌혈) 중 신문이 축구만 선택하면 — 독자는 나머지 2개의 존재 자체를 모른다. 무엇이 중요한지 독자가 아닌 편집자가 결정하는 이 과정이 곧 '게이트키핑'이다.", "caption\n      3개 이벤트가 편집자 게이트를 통과 → 축구만 신문에 인쇄(✓), 나머지 둘은 차단(✗) → 독자는 그 존재조차 모름. 이것이 '게이트키핑'."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["hypothetical", "가상의"], ["local", "지역의"], ["track and field event", "육상 경기"], ["blood drive", "헌혈 행사"], ["sponsor", "주최하다후원하다"], ["elect", "결정하다선출하다"], ["preview", "미리 소개하다"], ["ignore", "무시하다"], ["source", "출처"], ["information", "정보"], ["editor", "편집자"], ["occur", "발생하다"], ["newsroom", "뉴스 편집실"], ["gatekeeping", "게이트 키핑(정보의 선택적 유통 행위)"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n      3개 이벤트가 편집자 게이트를 통과 → 축구만 신문에 인쇄(✓), 나머지 둘은 차단(✗) → 독자는 그 존재조차 모름. 이것이 '게이트키핑'."], ["도식이 강조하는 결론은?", "캠퍼스의 3개 이벤트(여자 축구·육상·헌혈) 중 신문이 축구만 선택하면 — 독자는 나머지 2개의 존재 자체를 모른다. 무엇이 중요한지 독자가 아닌 편집자가 결정하는 이 과정이 곧 '게이트키핑'이다."]], "en": "In a hypothetical situation, a local college&#x27;s athletic department might send a press release to the media informing them about three events happening on campus tomorrow: a women&#x27;s soccer game, a track and field event, and a blood drive sponsored by the men&#x27;s tennis team. The newspaper elects to print only a story previewing the women&#x27;s soccer game and ignores both the track and field event and the blood drive. Therefore, readers who use that newspaper as their only source of local information might have no idea which either the track and field event or the blood drive is happening. There are multiple events happening at the college, and it was not the readers who decided what was important — the newspaper&#x27;s editors decided for them. Situations like this one occur all the time in newsrooms across the world and perfectly demonstrate the concept of gatekeeping.", "ko": "가상의 상황에서, 한 지역 대학의 체육부가 언론에 내일 캠퍼스에서 열릴 세 가지 행사인 여자 축구 경기, 육상 대회, 그리고 남자 테니스 팀이 주최하는 헌혈 행사에 대해 그들에게 알릴 보도 자료를 보낼 수도 있을 것이다. 신문사는 여자 축구 경기만을 미리 소개하는 기사를 싣기로 결정하고, 육상 대회와 헌혈 행사는 모두 무시한다. 따라서 그 신문을 지역 정보의 유일한 출처로 사용하는 독자들은 육상 대회나 헌혈 행사가 열린다는 사실을 전혀 알지 못할 수도 있다. 대학에서는 여러 행사가 있지만, 어떤 것이 중요한지 결정한 것은 독자들이 아니라 신문의 편집자들이었다. 이와 같은 상황은 전 세계 뉴스 편집실에서 항상 발생하며, 게이트 키핑이라는 개념을 완벽하게 보여 준다.", "read": [{"en": "In a hypothetical situation, a local college&#x27;s athletic department might send a press release to the media informing them about three events happening on campus tomorrow: a women&#x27;s soccer game, a track and field event, and a blood drive sponsored by the men&#x27;s tennis team.", "ko": "가상의 상황에서, 한 지역 대학의 체육부가 언론에 내일 캠퍼스에서 열릴 세 가지 행사인 여자 축구 경기, 육상 대회, 그리고 남자 테니스 팀이 주최하는 헌혈 행사에 대해 그들에게 알릴 보도 자료를 보낼 수도 있을 것이다."}, {"en": "The newspaper elects to print only a story previewing the women&#x27;s soccer game and ignores both the track and field event and the blood drive.", "ko": "신문사는 여자 축구 경기만을 미리 소개하는 기사를 싣기로 결정하고, 육상 대회와 헌혈 행사는 모두 무시한다."}, {"en": "Therefore, readers who use that newspaper as their only source of local information might have no idea which either the track and field event or the blood drive is happening.", "ko": "따라서 그 신문을 지역 정보의 유일한 출처로 사용하는 독자들은 육상 대회나 헌혈 행사가 열린다는 사실을 전혀 알지 못할 수도 있다."}, {"en": "There are multiple events happening at the college, and it was not the readers who decided what was important — the newspaper&#x27;s editors decided for them.", "ko": "대학에서는 여러 행사가 있지만, 어떤 것이 중요한지 결정한 것은 독자들이 아니라 신문의 편집자들이었다."}, {"en": "Situations like this one occur all the time in newsrooms across the world and perfectly demonstrate the concept of gatekeeping.", "ko": "이와 같은 상황은 전 세계 뉴스 편집실에서 항상 발생하며, 게이트 키핑이라는 개념을 완벽하게 보여 준다."}]}, {"no": "8", "title": "Specialization and the Rise of Professions", "ktitle": "한 사람이 다 함 → 직업 분화 → 조합 형성 (로마 · 중국 · 중세 길드)", "field": "역사·사회", "page": "07강 Ex.08", "oneline": "문명이 발전하면서 한 사람이 다 하던 일이 분리·전문화됐다 (벽돌·배·도로·농사·집·도자기 — 각자의 직군) → 시간이 흐르며 직업 집단이 제도화되어 — 로마의 collegia, 중국의 유사 체계, 중세 유럽의 길드(guilds)로 발전했다.", "metaphor": "<svg aria-label=\"왼쪽 한 사람이 모든 일을 다 하는 초기 단계에서 가운데 여섯 가지 분화된 직업으로 갈리고, 오른쪽 로마 콜레기아 중국 중세 길드의 제도화된 조합으로 발전하는 시대 흐름 그림\" role=\"img\" viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 가로 시간축 -->\n<line stroke=\"#999\" stroke-width=\"1.2\" x1=\"30\" x2=\"570\" y1=\"220\" y2=\"220\"></line>\n<polygon fill=\"#999\" points=\"570,220 562,216 562,224\"></polygon>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" x=\"40\" y=\"237\">early civilization</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"300\" y=\"237\">specialization grows</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"end\" x=\"560\" y=\"237\">Middle Ages</text>\n<!-- 단계 1: 한 사람이 다 함 -->\n<g transform=\"translate(20, 30)\">\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"65\" y=\"-10\">단계 1 — 한 사람이 다 함</text>\n<rect fill=\"#ffffff\" height=\"170\" rx=\"5\" stroke=\"#999\" stroke-width=\"1.3\" width=\"130\" x=\"0\" y=\"0\"></rect>\n<!-- stick figure -->\n<g transform=\"translate(65, 65)\">\n<circle cx=\"0\" cy=\"-20\" fill=\"#ffffff\" r=\"11\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"></circle>\n<circle cx=\"-3\" cy=\"-21\" fill=\"#1a1a1a\" r=\"1.1\"></circle>\n<circle cx=\"3\" cy=\"-21\" fill=\"#1a1a1a\" r=\"1.1\"></circle>\n<path d=\"M -3 -16 Q 0 -14 3 -16\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"></path>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.5\" x1=\"0\" x2=\"0\" y1=\"-9\" y2=\"18\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.4\" x1=\"0\" x2=\"-13\" y1=\"-3\" y2=\"5\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.4\" x1=\"0\" x2=\"13\" y1=\"-3\" y2=\"5\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.4\ r=\"middle\" x=\"0\" y=\"20\">bricks</text>\n</g>\n<!-- 배 -->\n<g transform=\"translate(100, 30)\">\n<path d=\"M -14 0 L 14 0 L 11 6 L -11 6 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"></path>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.1\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"-10\"></line>\n<path d=\"M 0 -10 L 7 -3 L 0 -3 Z\" fill=\"#1a1a1a\" fill-opacity=\"0.3\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"></path>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"20\">ships</text>\n</g>\n<!-- 도로 -->\n<g transform=\"translate(165, 30)\">\n<rect fill=\"#ffffff\" height=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.1\" width=\"26\" x=\"-13\" y=\"-3\"></rect>\n<line stroke=\"#1a1a1a\" stroke-width=\"0.9\" x1=\"-9\" x2=\"-3\" y1=\"1\" y2=\"1\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"0.9\" x1=\"3\" x2=\"9\" y1=\"1\" y2=\"1\"></line>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"20\">roads</text>\n</g>\n<!-- 농사 -->\n<g transform=\"translate(35, 80)\">\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"0\" x2=\"0\" y1=\"6\" y2=\"-7\"></line>\n<path d=\"M 0 -7 Q -5 -10 -7 -5\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"></path>\n<path d=\"M 0 -7 Q 5 -10 7 -5\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"></path>\n<path d=\"M 0 -3 Q -4 -6 -6 -2\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"></path>\n<path d=\"M 0 -3 Q 4 -6 6 -2\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"></path>\n<line stroke=\"#1a1a1a\" stroke-width=\"1\" x1=\"-10\" x2=\"10\" y1=\"6\" y2=\"6\"></line>\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"20\">farming</text>\n</g>\n<!-- 집(주거) -->\n<g transform=\"translate(100, 80)\">\n<rect fill=\"#ffffff\" height=\"9\" stroke=\"#1a1a1a\" stroke-width=\"1.1\" width=\"18\" x=\"-9\" y=\"-2\"> \"></rect>\n<!-- 로마 -->\n<g transform=\"translate(10, 14)\">\n<rect fill=\"#ffffff\" height=\"40\" rx=\"3\" stroke=\"#1FA34A\" stroke-width=\"1.3\" width=\"130\" x=\"0\" y=\"0\"></rect>\n<!-- 기둥 미니 -->\n<g transform=\"translate(10, 14)\">\n<line stroke=\"#1FA34A\" stroke-width=\"1.3\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"14\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"1.3\" x1=\"6\" x2=\"6\" y1=\"0\" y2=\"14\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"1.5\" x1=\"-3\" x2=\"9\" y1=\"0\" y2=\"0\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"1.3\" x1=\"-2\" x2=\"8\" y1=\"-2\" y2=\"-2\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"1.5\" x1=\"-3\" x2=\"9\" y1=\"14\" y2=\"14\"></line>\n</g>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" x=\"32\" y=\"18\">Rome — collegia</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"8\" font-style=\"italic\" x=\"32\" y=\"32\">woodworkers · wine</text>\n</g>\n<!-- 중국 -->\n<g transform=\"translate(10, 60)\">\n<rect fill=\"#ffffff\" height=\"40\" rx=\"3\" stroke=\"#1FA34A\" stroke-width=\"1.3\" width=\"130\" x=\"0\" y=\"0\"></rect>\n<!-- 한자 미니 (가로 4선) -->\n<g transform=\"translate(12, 14)\">\n<line stroke=\"#1FA34A\" stroke-width=\"1.3\" x1=\"-5\" x2=\"5\" y1=\"-4\" y2=\"-4\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"1.3\" x1=\"-5\" x2=\"5\" y1=\"0\" y2=\"0\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"1.3\" x1=\"-5\" x2=\"5\" y1=\"4\" y2=\"4\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"1.3\" x1=\"0\" x2=\"0\" y1=\"-6\" y2=\"6\"></line>\n</g>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" x=\"32\" y=\"18\">Ancient China</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"8\" font-style=\"italic\" x=\"32\" y=\"32\">similar system</text>\n</g>\n<!-- 중세 길드 -->\n<g transform=\"translate(10, 106)\">\n<rect fill=\"#ffffff\" height=\"40\" rx=\"3\" stroke=\"#1FA34A\" stroke-width=\"1.3\" width=\"130\" x=\"0\" y=\"0\"></rect>\n<!-- 방패(길드 상징) -->\n<g transform=\"translate(12, 14)\">\n<path d=\"M -5 -6 L 5 -6 L 5 1 Q 5 6 0 6 Q -5 6 -5 1 Z\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"></path>\n<line stroke=\"#1FA34A\" stroke-width=\"1\" x1=\"-2\" x2=\"2\" y1=\"-2\" y2=\"-2\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"1\" x1=\"0\" x2=\"0\" y1=\"-2\" y2=\"3\"></line>\n</g>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" x=\"32\" y=\"18\">Medieval — guilds</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"8\" font-style=\"italic\" x=\"32\" y=\"32\">throughout Europe</text>\n</g>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"75\" y=\"162\">제도화 · 공동체</text>\n</g>\n</svg>", "caption": "caption\n      문명 발전 → 한 사람의 일이 6개 직군으로 분화 → 시간이 지나며 로마 collegia · 중국 · 중세 길드로 제도화된 직업 조합 형성.", "tldr": ["문명이 발전하면서 한 사람이 다 하던 일이 분리·전문화됐다 (벽돌·배·도로·농사·집·도자기 — 각자의 직군) → 시간이 흐르며 직업 집단이 제도화되어 — 로마의 collegia, 중국의 유사 체계, 중세 유럽의 길드(guilds)로 발전했다.", "caption\n      문명 발전 → 한 사람의 일이 6개 직군으로 분화 → 시간이 지나며 로마 collegia · 중국 · 중세 길드로 제도화된 직업 조합 형성."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["flourish", "번성하다"], ["accomplish", "성취하다"], ["specialize", "전문화하다"], ["designation", "(특정 목적을 위한) 직무명칭"], ["conduct", "수행하다"], ["distinct", "고유한뚜렷이 다른"], ["practitioner", "(특정 전문직의) 종사자실무자"], ["institution", "제도"], ["of sorts", "일종의보잘것없는"], ["differentiated", "분화된차별화된"], ["sophisticated", "정교한복잡한"], ["communal", "공동체적인"], ["formalize", "형식을 갖추게 하다공식화하다"], ["association", "조합협회단체"], ["college", "조합대학전문학교"], ["similar", "유사한"], ["take hold", "자리 잡다뿌리내리다"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n      문명 발전 → 한 사람의 일이 6개 직군으로 분화 → 시간이 지나며 로마 collegia · 중국 · 중세 길드로 제도화된 직업 조합 형성."], ["도식이 강조하는 결론은?", "문명이 발전하면서 한 사람이 다 하던 일이 분리·전문화됐다 (벽돌·배·도로·농사·집·도자기 — 각자의 직군) → 시간이 흐르며 직업 집단이 제도화되어 — 로마의 collegia, 중국의 유사 체계, 중세 유럽의 길드(guilds)로 발전했다."]], "en": "As civilizations started to grow and flourish, people found they could accomplish more with less effort if they specialized and divided their work into separate designations. So, for example, the work of brick-making was conducted separately from the work of ship-building - just as the work of laying roads was separate from the work of farming, which was separate from the work of building dwellings or making pots. Each line of work was its own distinct activity, carried out by distinct practitioners who developed their work into an institution of sorts. As civilization continued to develop, differentiated forms of work became more sophisticated, more specialized, and more communal. In ancient Rome, they became formalized with the creation of what were called collegia, or professional associations. There was, for example, a college of woodworkers, a college of merchant mariners, a college of wine dealers, and a college of planters. In ancient China, a similar system developed. By the Middle Ages, guilds, a similar type of organization, had taken hold throughout much of Europe. collegia (collegium의 복수형): 콜레기아, 로마 제정 후기의 직업 조합", "ko": "문명들이 성장하고 번성하기 시작하면서, 사람들은 자신들의 일을 전문화하고 분업하여 개별적인 직무들로 나눈다면 그들이 더 적은 노력으로 더 많은 것을 성취할 수 있다는 것을 알게 되었다. 그래서, 예를 들어, 벽돌을 만드는 일은 배를 만드는 일과는 별도로 수행되었는데, 마찬가지로 길을 놓는 일이 농사를 짓는 일과 분리되어 있었고, 그것은 집을 짓거나 항아리를 만드는 일과 분리되어 있었다. 각각의 작업 분야는 그 자체의 고유한 활동으로, 서로 다른 종사자들에 의해 수행되었는데, 그들은 자신의 일을 일종의 제도로 발전시켰다. 문명이 계속 발전함에 따라, 분화된 작업 형태는 더 정교해지고, 더 전문화되며, 더 공동체적인 성격을 띠게 되었다. 고대 로마에서 그것은 이른바 콜레기아, 즉 직업인 조합의 창설과 함께 형식이 갖추어졌다. 예를 들어, 목공인 조합, 상선 선원 조합, 포도주 상인 조합, 농장주 조합이 있었다. 고대 중국에서도 유사한 제도가 발전했다. 중세가 되었을 때 유럽의 많은 지역 도처에서 유사한 형태의 조직인 길드가 이미 자리 잡았다.", "read": [{"en": "As civilizations started to grow and flourish, people found they could accomplish more with less effort if they specialized and divided their work into separate designations.", "ko": "문명들이 성장하고 번성하기 시작하면서, 사람들은 자신들의 일을 전문화하고 분업하여 개별적인 직무들로 나눈다면 그들이 더 적은 노력으로 더 많은 것을 성취할 수 있다는 것을 알게 되었다."}, {"en": "So, for example, the work of brick-making was conducted separately from the work of ship-building - just as the work of laying roads was separate from the work of farming, which was separate from the work of building dwellings or making pots.", "ko": "그래서, 예를 들어, 벽돌을 만드는 일은 배를 만드는 일과는 별도로 수행되었는데, 마찬가지로 길을 놓는 일이 농사를 짓는 일과 분리되어 있었고, 그것은 집을 짓거나 항아리를 만드는 일과 분리되어 있었다."}, {"en": "Each line of work was its own distinct activity, carried out by distinct practitioners who developed their work into an institution of sorts.", "ko": "각각의 작업 분야는 그 자체의 고유한 활동으로, 서로 다른 종사자들에 의해 수행되었는데, 그들은 자신의 일을 일종의 제도로 발전시켰다."}, {"en": "As civilization continued to develop, differentiated forms of work became more sophisticated, more specialized, and more communal.", "ko": "문명이 계속 발전함에 따라, 분화된 작업 형태는 더 정교해지고, 더 전문화되며, 더 공동체적인 성격을 띠게 되었다."}, {"en": "In ancient Rome, they became formalized with the creation of what were called collegia, or professional associations.", "ko": "고대 로마에서 그것은 이른바 콜레기아, 즉 직업인 조합의 창설과 함께 형식이 갖추어졌다."}, {"en": "There was, for example, a college of woodworkers, a college of merchant mariners, a college of wine dealers, and a college of planters.", "ko": "예를 들어, 목공인 조합, 상선 선원 조합, 포도주 상인 조합, 농장주 조합이 있었다."}, {"en": "In ancient China, a similar system developed.", "ko": "고대 중국에서도 유사한 제도가 발전했다."}, {"en": "By the Middle Ages, guilds, a similar type of organization, had taken hold throughout much of Europe. collegia (collegium의 복수형): 콜레기아, 로마 제정 후기의 직업 조합", "ko": "중세가 되었을 때 유럽의 많은 지역 도처에서 유사한 형태의 조직인 길드가 이미 자리 잡았다."}]}, {"no": "9", "title": "Animal Psychology and the Turn to Behavior", "ktitle": "의식(접근 불가) ↔ 행동(관찰 가능) → 인간 심리학도 행동 연구로 재정의", "field": "심리·동물", "page": "07강 Ex.09", "oneline": "동물 심리학자들은 동물의 의식은 관찰할 수 없으나 행동은 관찰 가능하다는 사실을 바탕으로 본능·학습을 연구했고 — \"심리학을 의식의 과학으로 정의하라\"는 압력에 반발해 인간 심리학까지도 '행동의 연구'로 재정의했다.", "metaphor": "<svg aria-label=\"왼쪽 동물의 의식은 머리 속 물음표로 빨간 점선의 접근 불가 박스에, 오른쪽 동물의 행동은 움직임과 분비샘 활동으로 초록의 관찰 가능 22\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.3\" x1=\"10\" x2=\"14\" y1=\"13\" y2=\"22\"></line>\n<!-- 꼬리 흔드는 -->\n<path d=\"M 22 -3 Q 30 -8 33 -12\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"></path>\n<!-- 움직임 표시 (속도선) -->\n<line stroke=\"#1FA34A\" stroke-width=\"1.2\" x1=\"-32\" x2=\"-38\" y1=\"3\" y2=\"3\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"1.2\" x1=\"-30\" x2=\"-37\" y1=\"8\" y2=\"8\"></line>\n</g>\n<!-- 행동 라벨 박스 (motor + glandular) -->\n<g transform=\"translate(155, 50)\">\n<rect fill=\"#f0faf3\" height=\"20\" rx=\"3\" stroke=\"#1FA34A\" stroke-width=\"1.2\" width=\"100\" x=\"0\" y=\"0\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"50\" y=\"13\">motor activity</text>\n</g>\n<g transform=\"translate(155, 78)\">\n<rect fill=\"#f0faf3\" height=\"20\" rx=\"3\" stroke=\"#1FA34A\" stroke-width=\"1.2\" width=\"100\" x=\"0\" y=\"0\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"50\" y=\"13\">glandular</text>\n</g>\n<!-- ✓ 눈 -->\n<g transform=\"translate(240, 35)\">\n<!-- 눈 모양 -->\n<ellipse cx=\"0\" cy=\"0\" fill=\"#ffffff\" rx=\"10\" ry=\"6\" stroke=\"#1FA34A\" stroke-width=\"1.5\"></ellipse>\n<circle cx=\"0\" cy=\"0\" fill=\"#1FA34A\" r=\"4\"></circle>\n<circle cx=\"0\" cy=\"0\" fill=\"#ffffff\" r=\"1.5\"></circle>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"-12\">observable</text>\n</g>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"135\" y=\"120\">instinct &amp; learning discovered</text>\n</g>\n<!-- 하단: 인간 심리학으로 확장 -->\n<g transform=\"translate(0, 180)\">\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"10\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"300\" y=\"0\">animal psychologists rebelled → expanded to human</text>\n<!-- 좌측 동물 라벨 -->\n<g transform=\"translate(110, 20)\">\n<rect fill=\"#f0faf3\" height=\"32\" rx=\"4\" stroke=\"#1FA34A\" stroke-width=\"1.4\" width=\"100\" x=\"-50\" y=\"0\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"14\">동물 심리학</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"26\">= study of behavior</text>\n</g>\n<!-- 확장 화살표 -->\n<line stroke=\"#1FA34A\" stroke-width=\"2\" x1=\"170\" x2=\"380\" y1=\"36\" y2=\"36\"></line>\n<polygon fill=\"#1FA34A\" points=\"380,36 372,31 372,41\"></polygon>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"275\" y=\"30\">extend</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" x=\"275\" y=\"50\">\"인간 심리학도 마찬가지\"</text>\n<!-- 우측 인간 라벨 -->\n<g transform=\"translate(490, 20)\">\n<rect fill=\"#f0faf3\" height=\"32\" rx=\"4\" stroke=\"#1FA34A\" stroke-width=\"1.6\" width=\"100\" x=\"-50\" y=\"0\"></rect>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"14\">인간 심리학</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"26\">redefined as behavior</text>\n</g>\n</g>\n</svg>", "caption": "caption\n      동물의 의식은 관찰 불가(X) ↔ 행동은 관찰 가능(motor·glandular) → 동물 심리학자들이 반발해 인간 심리학까지 '행동의 연구'로 재정의.", "tldr": ["동물 심리학자들은 동물의 의식은 관찰할 수 없으나 행동은 관찰 가능하다는 사실을 바탕으로 본능·학습을 연구했고 — \"심리학을 의식의 과학으로 정의하라\"는 압력에 반발해 인간 심리학까지도 '행동의 연구'로 재정의했다.", "caption\n      동물의 의식은 관찰 불가(X) ↔ 행동은 관찰 가능(motor·glandular) → 동물 심리학자들이 반발해 인간 심리학까지 '행동의 연구'로 재정의."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["object to ~", "에 반대하다"], ["define", "정의하다"], ["limit", "제한하다"], ["energetic", "효과적인강력한"], ["instinct", "본능"], ["observe", "관찰하다"], ["motor", "운동의"], ["rebel", "반발하다반항하다"], ["offensive", "공세반격"], ["insist", "주장하다"], ["properly", "실은정확하게는"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n      동물의 의식은 관찰 불가(X) ↔ 행동은 관찰 가능(motor·glandular) → 동물 심리학자들이 반발해 인간 심리학까지 '행동의 연구'로 재정의."], ["도식이 강조하는 결론은?", "동물 심리학자들은 동물의 의식은 관찰할 수 없으나 행동은 관찰 가능하다는 사실을 바탕으로 본능·학습을 연구했고 — \"심리학을 의식의 과학으로 정의하라\"는 압력에 반발해 인간 심리학까지도 '행동의 연구'로 재정의했다."]], "en": "No one has objected so strenuously to defining psychology as the science of consciousness, and limiting it to consciousness, as the group of animal psychologists. By energetic work, they had proved that the animal was a very good subject for psychological study, and had discovered much that was important regarding instinct and learning in animals. But from the nature of the case, they could not observe the consciousness of animals; they could only observe their behavior, that is to say, the motor (and in some cases glandular) activities of the animals under known conditions. When then the animal psychologists were warned by the mighty ones in the science that they must interpret their results in terms of consciousness or not call themselves psychologists any longer, they rebelled; and some of the best fighters among them took the offensive, by insisting that human psychology, no less than animal, was properly a study of behavior, and that it had been a great mistake ever to define it as the science of consciousness.", "ko": "아무도 심리학을 의식의 과학으로 정의하고, 그것을 의식으로 제한하는 것에 대해, 동물 심리학자 집단만큼이나 격렬하게 반대하지는 않았다. 효과적인 연구를 통해, 그들은 동물이 심리학 연구에 매우 좋은 대상임을 증명했었고, 동물에서의 본능과 학습에 관해 중요한 많은 것을 발견했었다. 그러나 그러한 사례의 본질 때문에, 그들은 동물의 의식을 관찰할 수 없었다. 그들은 단지 그들의 행동, 다시 말해, 알려진 조건하에서 동물들의 운동 활동 (그리고 일부 경우에는 분비선 활동)을 관찰할 수 있을 뿐이었다. 그 후 동물 심리학자들이 그 학계의 힘 있는 사람들로부터 그들의 연구 결과를 반드시 의식의 관점에서 해석해야 하며, 그렇지 않으면 더는 스스로를 심리학자라고 불러서는 안 된다는 경고를 받았을 때, 그들은 반발했으며, 그들 가운데서 최고의 투사들 중 일부는, 인간 심리학도 동물 (심리학)과 마찬가지로 실은 행동에 대한 연구이며, 그것을 의식의 과학으로 정의한 것은 큰 실수였다고 주장함으로써 공세를 취했다.", "read": [{"en": "No one has objected so strenuously to defining psychology as the science of consciousness, and limiting it to consciousness, as the group of animal psychologists.", "ko": "아무도 심리학을 의식의 과학으로 정의하고, 그것을 의식으로 제한하는 것에 대해, 동물 심리학자 집단만큼이나 격렬하게 반대하지는 않았다."}, {"en": "By energetic work, they had proved that the animal was a very good subject for psychological study, and had discovered much that was important regarding instinct and learning in animals.", "ko": "효과적인 연구를 통해, 그들은 동물이 심리학 연구에 매우 좋은 대상임을 증명했었고, 동물에서의 본능과 학습에 관해 중요한 많은 것을 발견했었다."}, {"en": "But from the nature of the case, they could not observe the consciousness of animals; they could only observe their behavior, that is to say, the motor (and in some cases glandular) activities of the animals under known conditions.", "ko": "그러나 그러한 사례의 본질 때문에, 그들은 동물의 의식을 관찰할 수 없었다. 그들은 단지 그들의 행동, 다시 말해, 알려진 조건하에서 동물들의 운동 활동 (그리고 일부 경우에는 분비선 활동)을 관찰할 수 있을 뿐이었다."}, {"en": "When then the animal psychologists were warned by the mighty ones in the science that they must interpret their results in terms of consciousness or not call themselves psychologists any longer, they rebelled; and some of the best fighters among them took the offensive, by insisting that human psychology, no less than animal, was properly a study of behavior, and that it had been a great mistake ever to define it as the science of consciousness.", "ko": "그 후 동물 심리학자들이 그 학계의 힘 있는 사람들로부터 그들의 연구 결과를 반드시 의식의 관점에서 해석해야 하며, 그렇지 않으면 더는 스스로를 심리학자라고 불러서는 안 된다는 경고를 받았을 때, 그들은 반발했으며, 그들 가운데서 최고의 투사들 중 일부는, 인간 심리학도 동물 (심리학)과 마찬가지로 실은 행동에 대한 연구이며, 그것을 의식의 과학으로 정의한 것은 큰 실수였다고 주장함으로써 공세를 취했다."}]}, {"no": "10", "title": "Urban Agriculture and Botanical Gardens", "ktitle": "도시 농업의 잠재력 + 식물원의 3가지 기여 역할", "field": "도시·생태", "page": "07강 Ex.10", "oneline": "도시 농업의 잠재력(식품 접근·영양·소득·기후·생물다양성)을 실현하려면 더 많은 연구가 필요하다 — 식물원은 (1) 연구 활용·프로그램 설계, (2) 도시 농업인 교육, (3) 자원·노하우 공유라는 다중 역할로 이 과정에 기여한다.", "metaphor": "<svg aria-label=\"중심에 도시 빌딩과 농업 식물을 합친 도시 농업 박스가 있고 더 많은 연구 필요 라벨이 붙어 있으며, 그 주위로 식물원이 연구 활용 프로그램 설계 도시 농업인 교육 자원과 노하우 공유라는 세 가지 역할로 화살표가 뻗어 나가는 방사형 그림\" role=\"img\" viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 중심: 도시 농업 -->\n<g transform=\"translate(300, 130)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#f0faf3\" r=\"55\" stroke=\"#1FA34A\" stroke-width=\"2\"></circle>\n<!-- 도시 빌딩 (좌) -->\n<g transform=\"translate(-22, 0)\">\n<rect fill=\"#ffffff\" height=\"28\" stroke=\"#1a1a1a\" stroke-width=\"1.2\" width=\"10\" x=\"-12\" y=\"-22\"></rect>\n<rect fill=\"#ffffff\" height=\"21\" stroke=\"#1a1a1a\" stroke-width=\"1.2\" width=\"10\" x=\"-1\" y=\"-15\"></rect>\n<!-- 창문 -->\n<rect fill=\"#1a1a1a\" height=\"2\" width=\"2\" x=\"-10\" y=\"-19\"></rect>\n<rect fill=\"#1a1a1a\" height=\"2\" width=\"2\" x=\"-6\" y=\"-19\"></rect>\n<rect fill=\"#1a1a1a\" height=\"2\" width=\"2\" x=\"-10\" y=\"-14\"></rect>\n<rect fill=\"#1a1a1a\" height=\"2\" width=\"2\" x=\"-6\" y=\"-14\"></rect>\n<rect fill=\"#1a1a1a\" height=\"2\" width=\"2\" x=\"-10\" y=\"-9\"></rect>\n<rect fill=\"#1a1a1a\" height=\"2\" width=\"2\" x=\"-6\" y=\"-9\"></rect>\n<rect fill=\"#1a1a1a\" height=\"2\" width=\"2\" x=\"1\" y=\"-11\"></rect>\n<rect fill=\"#1a1a1a\" height=\"2\" width=\"2\" x=\"5\" y=\"-11\"></rect>\n<rect fill=\"#1a1a1a\" height=\"2\" width=\"2\" x=\"1\" y=\"-6\"></rect>\n<rect fill=\"#1a1a1a\" height=\"2\" width=\"2\" x=\"5\" y=\"-6\"></rect>\n</g>\n<!-- 식물 (우) -->\n<g transform=\"translate(20, 4)\">\n<!-- 잎 1 -->\n<path d=\"M 0 0 Q -3 -8 -1 -14 Q 3 -10 0 0 Z\" fill=\"#1FA34A\" stroke=\"#1FA34A\" stroke-width=\"0.8\"></path>\n<!-- 잎 2 -->\n<path d=\"M 0 0 Q 5 -6 9 -10 Q 5 -3 0 0 Z\" fill=\"#1FA34A\" fill-opacity=\"0.7\" stroke=\"#1FA34A\" stroke-width=\"0.8\"></path>\n<!-- 잎 3 -->\n<path d=\"M 0 0 Q -5 -3 -8 -8 Q -2 -3 0 0 Z\" fill=\"#1FA34A\" fill-opacity=\"0.7\" stroke=\"#1FA34A\" stroke-width=\"0.8\"></path>\n<!-- 줄기 -->\n<line stroke=\"#1FA34A\" stroke-w -size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"2\">use research →</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"14\">inform program design</text>\n</g>\n<line stroke=\"#1FA34A\" stroke-width=\"1.4\" x1=\"175\" x2=\"245\" y1=\"130\" y2=\"130\"></line>\n<polygon fill=\"#1FA34A\" points=\"245,130 238,126 238,134\"></polygon>\n<!-- 우상: 역할 2 — 도시 농업인 교육 -->\n<g transform=\"translate(500, 75)\">\n<rect fill=\"#ffffff\" height=\"55\" rx=\"6\" stroke=\"#1FA34A\" stroke-width=\"1.5\" width=\"180\" x=\"-90\" y=\"-26\"></rect>\n<!-- 강의 아이콘 -->\n<g transform=\"translate(-72, 0)\">\n<!-- 칠판 -->\n<rect fill=\"#ffffff\" height=\"10\" stroke=\"#1FA34A\" stroke-width=\"1.2\" width=\"14\" x=\"-7\" y=\"-9\"></rect>\n<line stroke=\"#1FA34A\" stroke-width=\"0.7\" x1=\"-5\" x2=\"2\" y1=\"-6\" y2=\"-6\"></line>\n<line stroke=\"#1FA34A\" stroke-width=\"0.7\" x1=\"-5\" x2=\"4\" y1=\"-3\" y2=\"-3\"></line>\n<!-- 화분 -->\n<path d=\"M -3 5 L 3 5 L 2 10 L -2 10 Z\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1\"></path>\n</g>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"-8\">도시 농업인 교육</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"4\">educate urban</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"15\">gardeners &amp; farmers</text>\n</g>\n<line stroke=\"#1FA34A\" stroke-width=\"1.4\" x1=\"410\" x2=\"350\" y1=\"80\" y2=\"105\"></line>\n<polygon fill=\"#1FA34A\" points=\"350,105 358,103 354,111\"></polygon>\n<!-- 우하: 역할 3 — 자원·노하우 공유 -->\n<g transform=\"translate(500, 195)\">\n<rect fill=\"#ffffff\" height=\"55\" rx=\"6\" stroke=\"#1FA34A\" stroke-width=\"1.5\" width=\"180\" x=\"-90\" y=\"-26\"></rect>\n<!-- 식물원 간 공유 (두 원 + 화살표) -->\n<g transform=\"translate(-72, 0)\">\n<circle cx=\"-5\" cy=\"0\" fill=\"#ffffff\" r=\"5\" stroke=\"#1FA34A\" stroke-width=\"1.2\"></circle>\n<circle cx=\"6\" cy=\"0\" fill=\"#ffffff\" r=\"5\" stroke=\"#1FA34A\" stroke-width=\"1.2\"></circle>\n<line stroke=\"#1FA34A\" stroke-width=\"0.9\" x1=\"-3\" x2=\"4\" y1=\"-3\" y2=\"-3\"></line>\n<polygon fill=\"#1FA34A\" points=\"4,-3 1,-4 1,-2\"></polygon>\n<line stroke=\"#1FA34A\" stroke-width=\"0.9\" x1=\"-3\" x2=\"4\" y1=\"3\" y2=\"3\"></line>\n<polygon fill=\"#1FA34A\" points=\"-3,3 0,2 0,4\"></polygon>\n</g>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"-8\">자원·노하우 공유</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"4\">share resources &amp;</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"15\">lessons across gardens</text>\n</g>\n<line stroke=\"#1FA34A\" stroke-width=\"1.4\" x1=\"410\" x2=\"350\" y1=\"190\" y2=\"160\"></line>\n<polygon fill=\"#1FA34A\" points=\"350,160 358,160 354,168\"></polygon>\n<!-- 좌측 라벨: 식물원 출처 표시 -->\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"175\" y=\"98\">botanical</text>\n<text fill=\"#1FA34A\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"175\" y=\"111\">gardens</text>\n<!-- 하단 -->\n<text fill=\"#1a1a1a\" font-family=\"Noto Serif\" font-size=\"10.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"300\" y=\"255\">botanical gardens · multi-role contribution to urban agriculture</text>\n</svg>", "caption": "caption\n      중심 도시 농업의 잠재력(더 많은 연구 필요) — 식물원이 (1) 연구 활용·프로그램, (2) 도시 농업인 교육, (3) 자원·노하우 공유의 다중 역할로 기여.", "tldr": ["도시 농업의 잠재력(식품 접근·영양·소득·기후·생물다양성)을 실현하려면 더 많은 연구가 필요하다 — 식물원은 (1) 연구 활용·프로그램 설계, (2) 도시 농업인 교육, (3) 자원·노하우 공유라는 다중 역할로 이 과정에 기여한다.", "caption\n      중심 도시 농업의 잠재력(더 많은 연구 필요) — 식물원이 (1) 연구 활용·프로그램, (2) 도시 농업인 교육, (3) 자원·노하우 공유의 다중 역할로 기여."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["potential", "잠재적인; 잠재력"], ["benefit", "이점; 이익을 얻다"], ["urban", "도시의"], ["measure", "측정하다"], ["impact", "영향"], ["access", "접근성"], ["nutrition", "영양"], ["income", "소득"], ["biodiversity", "생물 다양성"], ["maximize", "극대화하다"], ["inform", "영향을 미치다"], ["programmatic", "프로그램에 따른"], ["approach", "접근법"], ["contribute", "기여하다"], ["in the midst of ~", "속에서(한)가운데에"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n      중심 도시 농업의 잠재력(더 많은 연구 필요) — 식물원이 (1) 연구 활용·프로그램, (2) 도시 농업인 교육, (3) 자원·노하우 공유의 다중 역할로 기여."], ["도식이 강조하는 결론은?", "도시 농업의 잠재력(식품 접근·영양·소득·기후·생물다양성)을 실현하려면 더 많은 연구가 필요하다 — 식물원은 (1) 연구 활용·프로그램 설계, (2) 도시 농업인 교육, (3) 자원·노하우 공유라는 다중 역할로 이 과정에 기여한다."]], "en": "While many studies have described the potential benefits of urban agriculture, there is a need for more research that measures the impact of urban agriculture on food access, nutrition, and income generation; explores the potential of urban agriculture to alleviate global challenges such as climate change and biodiversity loss; and suggests ways to maximize the benefits of urban agriculture in relation to these issues. Botanical gardens can use emerging research in these areas to inform programmatic approaches. In addition, researchers are exploring growing practices what can maximize production in urban spaces. Botanical gardens may be able to contribute to this work as well as play a role in educating urban gardeners and farmers about recommended practices for their regions, particularly in the midst of a changing global climate. Finally, botanical gardens can benefit by sharing urban agriculture resources and approaches with one another, including lessons learned in program design, site design and operation, and partnership development to promote effective community engagement.", "ko": "많은 연구들이 도시 농업의 잠재적인 이점들을 기술해 왔지만, 식량 접근성, 영양, 그리고 소득 창출에 대한 도시 농업의 영향을 측정하고, 기후 변화와 생물 다양성 손실과 같은 전 지구적 문제들을 경감시킬 도시 농업의 잠재력을 탐구하며, 그리고 이러한 문제들과 관련하여 도시 농업의 이점들을 극대화할 방법들을 제시하는 더 많은 연구에 대한 필요성이 있다. 식물원은 이와 같은 분야에서 새롭게 등장하는 연구를 활용하여 프로그램에 따른 접근법에 영향을 줄 수 있다. 아울러, 연구자들은 도시 공간에서 생산을 극대화할 수 있는 재배 방식들을 탐구하고 있다. 식물원은 아마 이 작업에 기여할 수도 있을 것이며, 아울러 특히 변화하는 지구의 기후 속에서 도시의 원예업자와 농부들에게 그들의 지역에 권장되는 재배 방법에 관하여 교육하는 역할을 할 수도 있을 것이다. 마지막으로, 식물원은 프로그램 설계, 부지 설계 및 운영, 그리고 효과적인 지역 사회 참여를 촉진하기 위한 파트너십 개발에서 배운 교훈들을 포함하여, 도시 농업 자원과 접근법들을 서로 공유함으로써 이익을 얻을 수 있다.", "read": [{"en": "While many studies have described the potential benefits of urban agriculture, there is a need for more research that measures the impact of urban agriculture on food access, nutrition, and income generation; explores the potential of urban agriculture to alleviate global challenges such as climate change and biodiversity loss; and suggests ways to maximize the benefits of urban agriculture in relation to these issues.", "ko": "많은 연구들이 도시 농업의 잠재적인 이점들을 기술해 왔지만, 식량 접근성, 영양, 그리고 소득 창출에 대한 도시 농업의 영향을 측정하고, 기후 변화와 생물 다양성 손실과 같은 전 지구적 문제들을 경감시킬 도시 농업의 잠재력을 탐구하며, 그리고 이러한 문제들과 관련하여 도시 농업의 이점들을 극대화할 방법들을 제시하는 더 많은 연구에 대한 필요성이 있다."}, {"en": "Botanical gardens can use emerging research in these areas to inform programmatic approaches.", "ko": "식물원은 이와 같은 분야에서 새롭게 등장하는 연구를 활용하여 프로그램에 따른 접근법에 영향을 줄 수 있다."}, {"en": "In addition, researchers are exploring growing practices what can maximize production in urban spaces.", "ko": "아울러, 연구자들은 도시 공간에서 생산을 극대화할 수 있는 재배 방식들을 탐구하고 있다."}, {"en": "Botanical gardens may be able to contribute to this work as well as play a role in educating urban gardeners and farmers about recommended practices for their regions, particularly in the midst of a changing global climate.", "ko": "식물원은 아마 이 작업에 기여할 수도 있을 것이며, 아울러 특히 변화하는 지구의 기후 속에서 도시의 원예업자와 농부들에게 그들의 지역에 권장되는 재배 방법에 관하여 교육하는 역할을 할 수도 있을 것이다."}, {"en": "Finally, botanical gardens can benefit by sharing urban agriculture resources and approaches with one another, including lessons learned in program design, site design and operation, and partnership development to promote effective community engagement.", "ko": "마지막으로, 식물원은 프로그램 설계, 부지 설계 및 운영, 그리고 효과적인 지역 사회 참여를 촉진하기 위한 파트너십 개발에서 배운 교훈들을 포함하여, 도시 농업 자원과 접근법들을 서로 공유함으로써 이익을 얻을 수 있다."}]}, {"no": "11", "title": "Colonial Labor and Global Inequality", "ktitle": "두 경로 — (1) 저임금 → 본국 부 / (2) 노예 해방 보상 → 아이티·영국 납세자 부담", "field": "역사·경제", "page": "07강 Ex.11", "oneline": "식민지 노동 체제가 세계적 인간 불평등을 두 가지 방식으로 악화시켰다 — (1) 저임금이 값싸지만 수익성 높은 상품을 가능케 해 본국에 부를 축적시킴, (2) 노예 해방 시 노예주에게 보상이 지급되어 아이티는 재정 부채로, 영국은 일반 납세자 부담으로 이전됨. (무관: 외교적 이해 증진)", "metaphor": "<svg aria-label=\"위쪽 경로는 식민지 저임금에서 본국의 부 축적으로 이어지는 화살표, 아래쪽 경로는 노예 해방 시 노예주 보상이 아이티의 재정 부채와 영국 납세자 부담으로 두 갈래로 나뉘는 그림, 하단에 외교적 이해 증진 무관 문장이 X로 배제됨\" role=\"img\" viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 경로 1 (상단): 저임금 → 본국 부 -->\n<g transform=\"translate(0, 30)\">\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"10\" font-style=\"italic\" font-weight=\"700\" x=\"20\" y=\"0\">Path 1</text>\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" x=\"20\" y=\"13\">경로 1 — 저임금</text>\n<!-- 좌: 식민지 노동자 -->\n<g transform=\"translate(90, 30)\">\n<rect fill=\"#fdf2f4\" fill-opacity=\"0.4\" height=\"50\" rx=\"5\" stroke=\"#c8102e\" stroke-width=\"1.4\" width=\"100\" x=\"-50\" y=\"-12\"></rect>\n<!-- 노동자 stick (좌측 아래로 이동) -->\n<g transform=\"translate(-35, 18)\">\n<circle cx=\"0\" cy=\"-13\" fill=\"#ffffff\" r=\"5\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"></circle>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.2\" x1=\"0\" x2=\"0\" y1=\"-8\" y2=\"6\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1\" x1=\"0\" x2=\"-5\" y1=\"-4\" y2=\"1\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1\" x1=\"0\" x2=\"5\" y1=\"-4\" y2=\"1\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1.1\" x1=\"0\" x2=\"-3\" y1=\"6\" y2=\"14\"></line>\n<line stroke=\"#1a1a1a\" stroke-width=\"1 ill=\"#ffffff\" r=\"4\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"></circle>\n<circle cx=\"8\" cy=\"0\" fill=\"#ffffff\" r=\"4\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"></circle>\n<line stroke=\"#c8102e\" stroke-width=\"1.4\" x1=\"3\" x2=\"6\" y1=\"-3\" y2=\"-7\"></line>\n<line stroke=\"#c8102e\" stroke-width=\"1.4\" x1=\"3\" x2=\"6\" y1=\"3\" y2=\"7\"></line>\n</g>\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"-1\">노예 해방</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"0\" y=\"11\">enslaved → freed</text>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"0\" y=\"22\">→ enslavers compensated</text>\n</g>\n<!-- 두 갈래 화살표 -->\n<line stroke=\"#c8102e\" stroke-width=\"1.6\" x1=\"190\" x2=\"240\" y1=\"40\" y2=\"20\"></line>\n<polygon fill=\"#c8102e\" points=\"240,20 233,21 234,28\"></polygon>\n<line stroke=\"#c8102e\" stroke-width=\"1.6\" x1=\"190\" x2=\"240\" y1=\"55\" y2=\"70\"></line>\n<polygon fill=\"#c8102e\" points=\"240,70 234,66 233,73\"></polygon>\n<!-- 우상: 아이티 -->\n<g transform=\"translate(370, 20)\">\n<rect fill=\"#ffffff\" height=\"32\" rx=\"5\" stroke=\"#c8102e\" stroke-width=\"1.4\" width=\"250\" x=\"-125\" y=\"-12\"></rect>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"10\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"-100\" y=\"4\">Haiti</text>\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"-15\" y=\"-2\">신생국이 프랑스 엘리트에게 지급</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"-15\" y=\"11\">→ fiscal debt · underdevelopment</text>\n<!-- ↓ 빚 -->\n<g transform=\"translate(110, 4)\">\n<line stroke=\"#c8102e\" stroke-width=\"1.5\" x1=\"0\" x2=\"0\" y1=\"-6\" y2=\"4\"></line>\n<polygon fill=\"#c8102e\" points=\"0,6 -4,2 4,2\"></polygon>\n</g>\n</g>\n<!-- 우하: 영국 -->\n<g transform=\"translate(370, 70)\">\n<rect fill=\"#ffffff\" height=\"32\" rx=\"5\" stroke=\"#c8102e\" stroke-width=\"1.4\" width=\"250\" x=\"-125\" y=\"-12\"></rect>\n<text fill=\"#c8102e\" font-family=\"Noto Serif\" font-size=\"10\" font-style=\"italic\" font-weight=\"700\" text-anchor=\"middle\" x=\"-100\" y=\"4\">Britain</text>\n<text fill=\"#c8102e\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"-15\" y=\"-2\">중·하층 납세자가 분담</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" x=\"-15\" y=\"11\">→ to those already enriched</text>\n<!-- ↑ 이전 -->\n<g transform=\"translate(110, 4)\">\n<line stroke=\"#c8102e\" stroke-width=\"1.5\" x1=\"0\" x2=\"0\" y1=\"-6\" y2=\"4\"></line>\n<polygon fill=\"#c8102e\" points=\"0,-6 -4,-2 4,-2\"></polygon>\n</g>\n</g>\n</g>\n<!-- 하단: 무관 문장 배제 -->\n<g transform=\"translate(0, 240)\">\n<rect fill=\"#ffffff\" height=\"26\" opacity=\"0.7\" rx=\"4\" stroke=\"#999\" stroke-dasharray=\"4 3\" stroke-width=\"1.2\" width=\"440\" x=\"80\" y=\"0\"></rect>\n<text fill=\"#999\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" x=\"300\" y=\"11\">무관한 문장 (글 흐름과 무관)</text>\n<text fill=\"#5e5e5e\" font-family=\"Noto Serif\" font-size=\"9\" font-style=\"italic\" text-anchor=\"middle\" x=\"300\" y=\"22\">\"compensation discussions promoted better understanding between countries\"</text>\n<!-- ✗ -->\n<g transform=\"translate(100, 13)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#ffffff\" r=\"9\" stroke=\"#c8102e\" stroke-width=\"1.5\"></circle>\n<line stroke=\"#c8102e\" stroke-width=\"1.8\" x1=\"-4\" x2=\"4\" y1=\"-4\" y2=\"4\"></line>\n<line stroke=\"#c8102e\" stroke-width=\"1.8\" x1=\"4\" x2=\"-4\" y1=\"-4\" y2=\"4\"></line>\n</g>\n</g>\n</svg>", "caption": "caption\n두 경로가 세계 불평등을 악화 — (1) 저임금 → 본국 부 / (2) 노예 해방 보상 → 아이티 빚 + 영국 납세자 부담. 무관 문장(외교 이해 증진)은 배제.", "tldr": ["식민지 노동 체제가 세계적 인간 불평등을 두 가지 방식으로 악화시켰다 — (1) 저임금이 값싸지만 수익성 높은 상품을 가능케 해 본국에 부를 축적시킴, (2) 노예 해방 시 노예주에게 보상이 지급되어 아이티는 재정 부채로, 영국은 일반 납세자 부담으로 이전됨. (무관: 외교적 이해 증진)", "caption\n두 경로가 세계 불평등을 악화 — (1) 저임금 → 본국 부 / (2) 노예 해방 보상 → 아이티 빚 + 영국 납세자 부담. 무관 문장(외교 이해 증진)은 배제."], "bg": "수능특강 영어독해연습 07강 지문 이해 자료입니다.", "flow": [], "vocab": [["colonial", "식민지의"], ["regime", "체제"], ["inequality", "불평등"], ["depress", "하락시키다떨어트리다억제하다"], ["payment", "급여"], ["profitable", "수익성 있는"], ["colonizer", "본토에서 식민지로 이주한 사람"], ["commerce", "상업"], ["finance", "금융"], ["enslaved", "노예가 된노예화된"], ["compensate for ~", "에 대해 보상하다"], ["property", "재산"], ["diplomatic", "외교적인"], ["independent", "독립한"], ["elite", "엘리트지배층"], ["debt", "빚부채"], ["shape", "형성하다"], ["continuing", "지속적인"], ["benefit from ~", "로부터 이익을 얻다"]], "quiz": [["이 지문의 핵심 구조는?", "caption\n두 경로가 세계 불평등을 악화 — (1) 저임금 → 본국 부 / (2) 노예 해방 보상 → 아이티 빚 + 영국 납세자 부담. 무관 문장(외교 이해 증진)은 배제."], ["도식이 강조하는 결론은?", "식민지 노동 체제가 세계적 인간 불평등을 두 가지 방식으로 악화시켰다 — (1) 저임금이 값싸지만 수익성 높은 상품을 가능케 해 본국에 부를 축적시킴, (2) 노예 해방 시 노예주에게 보상이 지급되어 아이티는 재정 부채로, 영국은 일반 납세자 부담으로 이전됨. (무관: 외교적 이해 증진)"]], "en": "Colonial labour regimes worsened global human inequality in two ways. First, they depressed payments to workers in the colonies, enabling the production of comparatively and historically cheap products that nonetheless were highly profitable for the companies of the metropolitan colonizers. This sustained rising profits and the emergence of great fortunes in commerce, industry and finance in the metropole. Second, when enslaved peoples were freed, enslavers were fully compensated for their loss of &quot;property&quot; based upon the &quot;market value&quot; of the enslaved people at the time. Discussions about compensation for slavery occasionally contributed to diplomatic dialogue, promoting better understanding between countries. In the case of Haiti, this compensation was paid by the newly independent country to the French elite, lumbering Haiti with a fiscal debt that shaped the continuing underdevelopment of the country into the twentieth century. In the case of Britain, this compensation was paid by lower- and middle-class taxpayers in Britain over a very long period of time, transferring money to those who had already benefited from enslavement for decades.", "ko": "식민지 노동 체제는 두 가지 방식으로 전 세계적인 인간 불평등을 악화시켰다. 첫째, 그들은 식민지의 노동자들에게 주는 급여를 하락시켜, 비교적 그리고 역사적으로도 저렴하지만, 그럼에도 불구하고 본국 출신의 식민지 이주민들이 세운 회사에게 수익성이 매우 높은 제품의 생산을 가능하게 했다. 이것은 본국의 상업, 산업 및 금융 분야에서 이윤의 증가와 거대한 부의 출현을 지속시켰다. 둘째, 노예가 된 사람들이 해방되었을 때, 노예주들은 당시 노예가 된 사람들의 &#x27;시장 가치&#x27;에 기반하여 그들의 &#x27;재산&#x27; 손실에 대해 완전히 보상받았다. (노예제에 대한 보상과 관련된 논의는 가끔 외교적 대화에 기여하여 국가들 간의 더 나은 이해를 증진시켰다. ) 아이티의 경우, 이 보상은 새롭게 독립한 나라에 의해 프랑스 엘리트들에게 지불되었으며, 그리하여 아이티에 20세기까지 그 나라의 지속적인 저개발을 형성한 재정적인 빚을 떠맡겼다. 영국의 경우, 이 보상금은 오랜 기간에 걸쳐 영국의 하층 및 중산층 납세자들에 의해 지불되어, 수십 년간 노예제를 통해 이미 이익을 본 사람들에게 돈을 이전하게 되었다.", "read": [{"en": "Colonial labour regimes worsened global human inequality in two ways.", "ko": "식민지 노동 체제는 두 가지 방식으로 전 세계적인 인간 불평등을 악화시켰다."}, {"en": "First, they depressed payments to workers in the colonies, enabling the production of comparatively and historically cheap products that nonetheless were highly profitable for the companies of the metropolitan colonizers.", "ko": "첫째, 그들은 식민지의 노동자들에게 주는 급여를 하락시켜, 비교적 그리고 역사적으로도 저렴하지만, 그럼에도 불구하고 본국 출신의 식민지 이주민들이 세운 회사에게 수익성이 매우 높은 제품의 생산을 가능하게 했다."}, {"en": "This sustained rising profits and the emergence of great fortunes in commerce, industry and finance in the metropole.", "ko": "이것은 본국의 상업, 산업 및 금융 분야에서 이윤의 증가와 거대한 부의 출현을 지속시켰다."}, {"en": "Second, when enslaved peoples were freed, enslavers were fully compensated for their loss of &quot;property&quot; based upon the &quot;market value&quot; of the enslaved people at the time.", "ko": "둘째, 노예가 된 사람들이 해방되었을 때, 노예주들은 당시 노예가 된 사람들의 &#x27;시장 가치&#x27;에 기반하여 그들의 &#x27;재산&#x27; 손실에 대해 완전히 보상받았다."}, {"en": "Discussions about compensation for slavery occasionally contributed to diplomatic dialogue, promoting better understanding between countries.", "ko": "(노예제에 대한 보상과 관련된 논의는 가끔 외교적 대화에 기여하여 국가들 간의 더 나은 이해를 증진시켰다."}, {"en": "In the case of Haiti, this compensation was paid by the newly independent country to the French elite, lumbering Haiti with a fiscal debt that shaped the continuing underdevelopment of the country into the twentieth century.", "ko": ") 아이티의 경우, 이 보상은 새롭게 독립한 나라에 의해 프랑스 엘리트들에게 지불되었으며, 그리하여 아이티에 20세기까지 그 나라의 지속적인 저개발을 형성한 재정적인 빚을 떠맡겼다."}, {"en": "In the case of Britain, this compensation was paid by lower- and middle-class taxpayers in Britain over a very long period of time, transferring money to those who had already benefited from enslavement for decades.", "ko": "영국의 경우, 이 보상금은 오랜 기간에 걸쳐 영국의 하층 및 중산층 납세자들에 의해 지불되어, 수십 년간 노예제를 통해 이미 이익을 본 사람들에게 돈을 이전하게 되었다."}]}, {"no": "12", "title": "Morning People, Night Owls, and Chronotypes", "ktitle": "아침형(해 · leap out) ↔ 저녁형(달 · 베개 덮음) — Wilde는 극단 저녁형", "field": "생체·심리", "page": "07강 Ex.12", "oneline": "외부 제약이 없을 때 사람은 아침형(morning person)과 저녁형(night owl)의 두 유형으로 갈리며, 외부 제약이 없다면 차이가 극단까지 벌어진다 — Oscar Wilde가 \"다섯 시면 침대\"라며 자신의 저녁형 정체성을 자랑한 일화가 그 극단의 예.", "metaphor": "<svg aria-label=\"왼쪽 아침형은 해와 함께 침대에서 가뿐히 일어나는 사람, 오른쪽 저녁형은 달과 함께 베개를 덮고 누운 사람, 가운데 chronotypes 라벨, 하단에 Wilde 일화 다섯시에 잔다는 극단 저녁형 풍선이 표시된 그림\" role=\"img\" viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- 좌측: 아침형 -->\n<g transform=\"translate(20, 30)\">\n<text fill=\"#1FA34A\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"135\" y=\"-10\">아침형 — Morning Person</text>\n<rect fill=\"#f0faf3\" fill-opacity=\"0.4\" height=\"135\" stroke=\"#1FA34A\" stroke-width=\"1.6\" width=\"240\" x=\"0\" y=\"0\"></rect>\n<!-- 해 (좌상) -->\n<g transform=\"translate(35, 30)\">\n<circle cx=\"0\" cy=\"0\" fill=\"#ffffff\" r=\"11\" stroke=\"#1FA34A\" stroke-width=\"1.5\"></circle>\n<line stroke=\"#1FA34A\" stroke-width=\"1.4\" x1=\"0\" x2=\"0\" y1=\"-15\

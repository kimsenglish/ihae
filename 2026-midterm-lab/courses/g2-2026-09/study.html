 "ko": "여러분은 자신의 이야기에 대해 스스로 할 수 있는 최선을 다해서 만족할 때만 그것을 다른 사람에게 보여 주어야 한다."}, {"n": 2, "en": "You may well want to show it to your nearest and dearest, and that’s fine, but in most cases you shouldn’t look to their reading for any great benefit to your work.", "ko": "여러분이 가장 가깝고 소중한 사람들에게 그것을 보여 주고 싶은 것이 당연하고, 그것은 괜찮지만, 대부분의 경우 여러분은 작품에 있어 어떤 큰 이득을 얻고자 그들의 견해에 기대서는 안된다."}, {"n": 3, "en": "The most valuable feedback is likely to come from other sources: you should choose readers for their critical insight, not their closeness to you.", "ko": "가장 가치 있는 피드백은 다른 곳에서 나올 가능성이 있다. 즉, 여러분은 그들의 여러분과의 친밀함이 아니라 그들의 비판적 통찰력을 보고 독자를 선택해야 한다."}, {"n": 4, "en": "Fellow writers are ideal, but don’t imagine that any writer will do.", "ko": "동료 작가들이 이상적이긴 하지만, 어느 작가나 도움이 될 것이라고 생각하지 마라."}, {"n": 5, "en": "If you are part of a writers’ circle or class, you’ll know whose writing you admire, and if you’ve had feedback in the past you’ll know whose opinions have been helpful ― and whose have not.", "ko": "만약 여러분이 작가 모임이나 수업의 일원이라면, 여러분이 누구의 글을 동경하는지 알 것이며, 그리고 과거에 피드백을 받아본 적이 있다면 누구의 의견이 도움이 되었고 누구의 의견이 그렇지 않았는지 알 것이다."}], "core": "원고를 보여 줄 독자는 친밀함이 아니라 비판적 통찰력으로 고르라는 주장이다.", "flow": [{"label": "공유 전 조건", "sentences": "S1–2", "text": "스스로 최선을 다한 글을 가까운 이에게 보일 수는 있지만, 그 읽기에서 큰 도움을 기대해서는 안 된다.", "refs": [1, 2]}, {"label": "핵심 주장", "sentences": "S3", "text": "독자는 친밀함이 아니라 비판적 통찰력으로 고르라고 말한다.", "refs": [3]}, {"label": "독자 고르기", "sentences": "S4–5", "text": "동료 작가가 알맞을 수 있지만 모두가 그런 것은 아니며, 모임에서 실제로 도움이 된 사람을 떠올릴 수 있다.", "refs": [4, 5]}], "structure": [{"title": "버릴 기준 — 가까움", "text": "가까운 사람의 읽기에서는 큰 도움을 기대하기 어렵고, 아무 작가나 되는 것도 아니다"}, {"title": "세울 기준 — 비판적 통찰력", "text": "값진 피드백은 다른 데서 오며, 겪어 본 사람 가운데 누구의 의견이 도움이 되었는지로 고른다"}], "short_title": "20번 · 가까움보다 통찰력", "lead": "원고를 가장 가까운 사람에게 보여 주면 가장 좋은 피드백을 받을 수 있을까?", "image": "../../assets/g2-20-critical-reader.webp", "image_alt": "작가 모임에서 한 사람은 따뜻하게 격려하고 다른 동료 작가는 원고를 세심하게 검토하는 장면", "image_caption": "가까운 사람의 격려와 작품을 실제로 개선하는 비판적 통찰력은 서로 다를 수 있다.", "before_question": "글쓴이가 원고를 읽어 줄 사람을 고르는 기준은?", "prediction_choices": ["나와 얼마나 가까운가", "비판적으로 작품을 볼 통찰력이 있는가", "유명한 작가인가"], "prediction_actual": "친밀함이 아니라 작품에 도움이 되는 비판적 통찰력으로 독자를 고르라고 한다.", "blocking_vocab": [{"word": "nearest and dearest", "meaning": "가장 가깝고 소중한 사람들"}, {"word": "look to A for B", "meaning": "B를 얻으려고 A에 기대다"}, {"word": "critical insight", "meaning": "비판적 통찰력"}, {"word": "fellow writer", "meaning": "동료 작가"}, {"word": "writers’ circle", "meaning": "작가 모임"}], "visual_links": [{"label": "가까운 사람", "refs": [2]}, {"label": "비판적 통찰력", "refs": [3]}, {"label": "도움 된 의견의 경험", "refs": [4, 5]}], "core_check": {"q": "글쓴이의 주장으로 가장 적절한 것은?", "choices": ["원고는 완성 전에 가능한 한 많은 사람에게 보여 줘야 한다.", "원고를 읽어 줄 사람은 친밀함보다 비판적 통찰력으로 골라야 한다.", "가족과 친구의 피드백이 언제나 동료 작가의 피드백보다 낫다."], "answer": 1, "why": "S3이 글의 핵심 주장을 직접 제시한다.", "refs": [3]}, "precision": [{"type": "근거·지칭", "q": "S2의 their reading에서 their가 가리키는 대상은?", "choices": ["your nearest and dearest", "fellow writers", "valuable sources"], "answer": 0, "why": "같은 문장 앞부분의 가장 가깝고 소중한 사람들을 받는다.", "refs": [2]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Any fellow writer will provide useful feedback.", "Even among fellow writers, you should choose those whose opinions have proved helpful."], "answer": 1, "why": "S4~5는 아무 작가나 되는 것이 아니며 실제로 도움이 된 의견을 기준으로 고르라고 한다.", "refs": [4, 5]}], "supplement": [{"title": "nearest and dearest", "text": "가장 가까운 가족이나 친구를 가리키지만, 가까움과 작품을 보는 능력은 같지 않다는 대비를 만든다."}, {"title": "not A but B", "text": "S3의 ‘not their closeness … critical insight’는 버릴 기준과 세울 기준을 선명하게 맞세운다."}], "learning_visual": {"layout": "compare", "preview_title": "원고를 누구에게 보여 줄까?", "preview_caption": "두 독자 중 누구의 의견이 작품에 더 도움이 될지 원문에서 확인해 보자.", "preview_items": [{"label": "선택 A", "text": "나와 가까운 사람", "refs": [2]}, {"label": "선택 B", "text": "작품을 비판적으로 읽어 줄 사람", "refs": [3, 4, 5]}], "title": "독자를 고르는 기준은 친밀함이 아니다", "items": [{"label": "가까운 사람", "text": "보여 줄 수는 있지만, 작품에 큰 도움을 기대하기 어렵다", "refs": [2]}, {"label": "비판적 통찰력이 있는 독자", "text": "작품을 개선할 만한 피드백을 줄 수 있다", "refs": [3, 5]}], "takeaway": "먼저 원고에 최선을 다한 뒤(S1), 친밀함보다 실제로 도움이 된 의견을 기준으로 고른다. 동료 작가라고 아무나 적합한 것은 아니다(S4~5)."}}, {"id": "q21", "index_numbers": ["21"], "source_label": "2026년 9월 고2 · 21번", "sentences": [{"n": 1, "en": "A meeting in a flexible-time culture like those found in South America, parts of Europe, Africa, and the Middle East is more like an evergreen tree.", "ko": "남미, 유럽의 일부 지역, 아프리카, 그리고 중동에서 발견되는 것들과 같은 유연한 시간 문화에서의 회의는 상록수와 더 비슷하다."}, {"n": 2, "en": "An agenda with a meeting start time and a topic will probably be circulated before the meeting.", "ko": "회의 시작 시간과 주제가 있는 하나의 의제가 아마도 회의 전에 배부될 것이다."}, {"n": 3, "en": "This will serve as the trunk of the tree.", "ko": "이것은 나무의 줄기 역할을 하게 된다."}, {"n": 4, "en": "But there’s no expectation that the meeting will progress in a linear manner.", "ko": "하지만 회의가 선형적인 방식으로 진행될 것이라고 예상할 수 없다."}, {"n": 5, "en": "What seemed like a priority last week when the agenda was crafted is not necessarily the priority right now ― so discussion may branch off in a new direction.", "ko": "의제가 작성되었던 지난주에 우선순위처럼 보였던 것이 지금 당장 반드시 우선순위는 아니다. 그래서 논의는 새로운 방향으로 가지를 뻗어 나갈 수 있다."}, {"n": 6, "en": "Other branches may sprout as some members have urgent phone calls that take them in and out of the meeting.", "ko": "일부 구성원이 회의를 들락날락하게 만드는 긴급한 전화를 받음에 따라 또 다른 가지들이 싹틀 수도 있다."}, {"n": 7, "en": "Or sub-groups may form within the room to discuss timely subjects linked in some way to the main meeting trunk.", "ko": "또는 회의실 내에서 소그룹이 형성되어 주요한 회의 줄기와 어떤 방식으로든 연결된 시의적절한 주제를 논의할 수도 있다."}, {"n": 8, "en": "In flexible-time cultures, it seems clear that the most productive meetings grow in unpredictable ways, and the effective manager is flexible and professional enough to capitalize on priorities and changing needs as they arise.", "ko": "유연한 시간 문화에서, 가장 생산적인 회의는 예측 불가능한 방식으로 성장하며, 유능한 관리자는 우선순위와 변화하는 요구 사항이 발생할 때 이를 활용할 수 있을 만큼 충분히 유연하고 전문적이라는 것이 명확해 보인다."}, {"n": 9, "en": "Interruptions, agenda changes, and frequent shifts in direction are seen as natural and necessary.", "ko": "방해, 의제 변경과 빈번한 방향 전환은 자연스럽고 필수적인 것으로 간주된다."}], "core": "유연한 시간 문화의 회의는 의제를 줄기 삼아 예측할 수 없게 가지를 뻗으며 자란다.", "flow": [{"label": "비유", "sentences": "S1", "text": "그런 문화의 회의를 상록수에 견준다", "refs": [1]}, {"label": "줄기", "sentences": "S2-3", "text": "미리 돌린 의제가 나무의 줄기 노릇을 한다", "refs": [2, 3]}, {"label": "가지", "sentences": "S4-7", "text": "곧게 흐르리라는 기대가 없어 논의가 갈라지고 급한 전화·소모임으로 가지가 더 돋는다", "refs": [4, 5, 6, 7]}, {"label": "판단", "sentences": "S8", "text": "가장 생산적인 회의는 예측할 수 없게 자라며 유능한 관리자는 그 변화를 살려 쓴다", "refs": [8]}, {"label": "맺음", "sentences": "S9", "text": "방해와 의제 변경, 잦은 방향 전환은 자연스럽고 필요한 것으로 여겨진다", "refs": [9]}], "structure": [{"title": "줄기 — 미리 돌린 의제", "text": "시작 시각과 주제를 담은 의제가 회의의 뼈대가 된다"}, {"title": "가지 — 그때그때 갈라지는 논의", "text": "우선순위 변화·급한 전화·소모임이 새 가지를 만들고, 그 자람이 곧 좋은 회의다"}], "short_title": "21번 · 나무처럼 자라는 회의", "lead": "좋은 회의는 반드시 의제 순서대로 곧게 진행되어야 할까?", "image": "../../assets/g2-21-flexible-meeting.webp", "image_alt": "회의 테이블 중앙의 상록수를 중심으로 소그룹 토론과 긴급 전화가 동시에 이어지는 유연한 회의 장면", "image_caption": "의제가 줄기가 되고, 우선순위 변화·전화·소그룹 논의가 가지처럼 뻗는 회의다.", "before_question": "유연한 시간 문화에서 생산적인 회의는 어떻게 진행될까?", "prediction_choices": ["의제 순서를 한 치도 벗어나지 않는다.", "의제를 줄기로 삼되 필요에 따라 여러 방향으로 뻗는다.", "의제를 만들지 않고 모두 즉흥적으로 말한다."], "prediction_actual": "의제가 줄기 역할을 하지만 논의는 변화하는 우선순위에 따라 예측할 수 없이 가지를 뻗는다.", "blocking_vocab": [{"word": "flexible-time culture", "meaning": "시간 운용이 유연한 문화"}, {"word": "agenda", "meaning": "회의 의제"}, {"word": "linear manner", "meaning": "선형적인 방식"}, {"word": "branch off", "meaning": "새 방향으로 갈라지다"}, {"word": "capitalize on", "meaning": "~을 기회로 활용하다"}], "visual_links": [{"label": "의제는 줄기", "refs": [2, 3]}, {"label": "새 방향의 가지", "refs": [4, 5, 6, 7]}, {"label": "변화를 활용", "refs": [8, 9]}], "core_check": {"q": "유연한 시간 문화의 회의에 대한 설명으로 가장 적절한 것은?", "choices": ["예측할 수 없는 변화를 생산적으로 활용한다.", "의제에서 벗어난 모든 대화를 실패로 본다.", "회의 중 전화나 소그룹 논의를 절대 허용하지 않는다."], "answer": 0, "why": "S8~9는 예측 불가능한 성장과 방향 전환을 자연스럽고 필요한 것으로 본다.", "refs": [8, 9]}, "precision": [{"type": "근거·지칭", "q": "S3의 This가 가리키는 것은?", "choices": ["회의 전에 배부된 의제", "긴급한 전화", "회의실의 소그룹"], "answer": 0, "why": "S2의 시작 시각과 주제를 담은 agenda를 받아 나무의 줄기라고 한다.", "refs": [2, 3]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Productive meetings must always progress in a straight line.", "In flexible-time cultures, shifts in direction can be natural and necessary."], "answer": 1, "why": "S4와 S9는 선형 진행을 기대하지 않으며 방향 전환을 자연스럽고 필요하다고 본다.", "refs": [4, 9]}], "supplement": [{"title": "나무 비유의 대응", "text": "agenda는 trunk, 새 논의·전화·소그룹은 branches에 대응한다."}, {"title": "flexible의 의미", "text": "무계획이 아니라, 뼈대는 두되 새 우선순위와 요구를 전문적으로 활용하는 태도다."}], "learning_visual": {"layout": "fork-response", "preview_title": "회의가 나무처럼 자란다는 말은?", "preview_caption": "본문의 나무는 실제 회의실의 나무가 아니라 회의 진행을 설명하는 비유다.", "preview_items": [{"label": "줄기", "text": "미리 돌린 의제", "refs": [2, 3]}, {"label": "가지", "text": "무엇이 뜻밖에 뻗어 나갈까?", "refs": [4, 5, 6, 7]}], "title": "의제는 줄기, 예측 불가능한 논의는 가지", "items": [{"label": "줄기 · 의제", "text": "미리 공유한 의제가 회의의 기본 방향을 잡는다", "refs": [2, 3]}, {"label": "가지 · 논의", "text": "우선순위가 바뀌며 대화가 여러 방향으로 갈라진다", "refs": [4, 5]}, {"label": "새 가지 · 끼어듦", "text": "급한 전화와 소그룹 논의가 흐름을 더 바꾼다", "refs": [6, 7]}, {"label": "관리자의 역할", "text": "이 변화를 방해로만 보지 않고 생산적으로 활용한다", "refs": [8, 9]}], "takeaway": "이 문화에서는 의제 이탈과 방향 전환이 자연스럽고 때로 필요하다."}}, {"id": "q22", "index_numbers": ["22"], "source_label": "2026년 9월 고2 · 22번", "sentences": [{"n": 1, "en": "When we are ‘always on’ we are constantly ingesting content ― reading alerts and texts, liking, checking emails, downloading, uploading, upgrading, updating, deleting, submitting responses, and posting.", "ko": "우리가 ‘항상 접속되어’ 있을 때 우리는 알림과 문자 읽기, ‘좋아요’ 누르기, 이메일 확인하기, 다운로드하기, 업로드하기, 업그레이드하기, 업데이트하기, 삭제하기, 답변 제출하기, 그리고 게시물 올리기와 같이 끊임없이 콘텐츠를 섭취한다."}, {"n": 2, "en": "If we do it while we are eating, our multi-tasking is overloading us.", "ko": "만약 우리가 음식을 먹는 동안 그것을 한다면, 우리의 멀티태스킹은 우리에게 과부하를 주고 있다."}, {"n": 3, "en": "As our will attempts to digest the virtual content its forces are diverted from the physical content, our food.", "ko": "우리의 의지가 가상 콘텐츠를 소화하려고 시도함에 따라, 그것의 힘은 물리적 내용물인 우리의 음식으로부터 분산된다."}, {"n": 4, "en": "It’s easy to eat a sandwich in a minute while talking on the phone.", "ko": "전화 통화를 하는 동안 1분 내로 샌드위치를 먹는 것은 쉬운 일이다."}, {"n": 5, "en": "Some people are skilled at doing both at the same time.", "ko": "어떤 사람들은 동시에 두 가지를 하는 데 능숙하다."}, {"n": 6, "en": "Others write a half-hearted, shorthand text while they hurriedly eat their sandwich at the same time.", "ko": "다른 사람들은 샌드위치를 급하게 먹는 동시에 성의 없고 짧게 줄인 문자를 쓴다."}, {"n": 7, "en": "The result can be a misunderstood text with the need for further clarifying texts and the beginnings of nervous indigestion.", "ko": "그 결과는 더욱 명백히 설명하는 문자가 필요한 오해 섞인 메시지와 신경성 소화 불량의 시작일 수 있다."}, {"n": 8, "en": "Eat your sandwich.", "ko": "샌드위치를 먹어라."}, {"n": 9, "en": "Taste it.", "ko": "맛을 느껴라."}, {"n": 10, "en": "Let it go down.", "ko": "그것을 내려 가게 하라."}, {"n": 11, "en": "Then text.", "ko": "그러고 나서 문자를 보내라."}], "core": "먹으면서 하는 멀티태스킹은 의지의 힘을 갈라 놓아 오해와 소화 불량을 남긴다.", "flow": [{"label": "상황", "sentences": "S1", "text": "늘 접속된 채 알림·문자·이메일을 끊임없이 삼킨다", "refs": [1]}, {"label": "문제", "sentences": "S2-3", "text": "먹으면서 그러면 과부하가 되고 의지의 힘이 음식에서 분산된다", "refs": [2, 3]}, {"label": "양보", "sentences": "S4-5", "text": "쉬워 보이고 둘 다 잘하는 사람도 있다", "refs": [4, 5]}, {"label": "결과", "sentences": "S6-7", "text": "급히 먹으며 성의 없는 문자를 쓰면 오해와 신경성 소화 불량이 남는다", "refs": [6, 7]}, {"label": "요지", "sentences": "S8-11", "text": "먹고, 맛보고, 넘긴 다음에 문자를 보내라고 넉 줄로 잘라 말한다", "refs": [8, 9, 10, 11]}], "structure": [{"title": "문제 — 갈라지는 의지의 힘", "text": "가상 콘텐츠를 소화하려 애쓰는 사이 음식 쪽으로 갈 힘이 빠져나간다"}, {"title": "처방 — 순서를 되돌려라", "text": "먹고, 맛보고, 넘기고, 그다음에 문자 — 동시에 하지 말고 차례로 하라"}], "short_title": "22번 · 식탁과 휴대전화", "lead": "샌드위치를 먹으며 문자를 보내면 무엇이 달라질까?", "image": "../../assets/g2-22-sandwich-text.webp", "image_alt": "한 사람이 샌드위치를 급히 먹으면서 휴대전화와 노트북을 동시에 확인해 과부하를 느끼는 장면", "image_caption": "가상 콘텐츠와 음식에 주의가 갈라지면 메시지도 식사도 제대로 처리하기 어렵다.", "before_question": "글쓴이가 권하는 행동 순서는?", "prediction_choices": ["먹으면서 최대한 빨리 문자를 보낸다.", "문자를 먼저 모두 보낸 뒤 식사를 건너뛴다.", "먹고 맛보고 삼킨 다음 문자를 보낸다."], "prediction_actual": "샌드위치를 먹고 맛보고 넘긴 다음에 문자를 보내라고 한다.", "blocking_vocab": [{"word": "always on", "meaning": "항상 접속된"}, {"word": "ingest content", "meaning": "콘텐츠를 받아들이다"}, {"word": "divert", "meaning": "다른 데로 돌리다·분산시키다"}, {"word": "half-hearted", "meaning": "성의 없는"}, {"word": "indigestion", "meaning": "소화 불량"}], "visual_links": [{"label": "동시에 처리", "refs": [1, 2, 3]}, {"label": "오해와 소화 불량", "refs": [4, 5, 6, 7]}, {"label": "먹고 난 뒤 문자", "refs": [8, 9, 10, 11]}], "core_check": {"q": "글쓴이가 강조하는 내용으로 가장 적절한 것은?", "choices": ["먹기와 문자 보내기를 동시에 하면 두 일을 모두 망칠 수 있다.", "멀티태스킹 능력은 연습할수록 반드시 좋아진다.", "식사 중에는 긴 문자보다 짧은 문자를 보내야 한다."], "answer": 0, "why": "S2~7은 주의가 갈라져 오해와 소화 불량이 생긴다고 하고, S8~11은 순서대로 하라고 한다.", "refs": [2, 3, 6, 7, 8, 9, 10, 11]}, "precision": [{"type": "근거·지칭", "q": "S3의 its forces에서 its가 가리키는 것은?", "choices": ["our will", "virtual content", "our food"], "answer": 0, "why": "의지가 가상 콘텐츠를 소화하려 할 때 그 의지의 힘이 음식에서 분산된다는 문장이다.", "refs": [3]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Text first and eat only after every message is clear.", "Finish eating and tasting the sandwich before sending the text."], "answer": 1, "why": "S8~11이 ‘먹고, 맛보고, 넘기고, 그다음 문자’의 순서를 직접 제시한다.", "refs": [8, 9, 10, 11]}], "supplement": [{"title": "ingest와 digest의 반복", "text": "콘텐츠를 ‘섭취하고 소화한다’는 음식 비유를 사용해 가상 정보와 실제 음식을 맞세운다."}, {"title": "짧은 명령문의 효과", "text": "S8~11의 네 짧은 문장은 행동 순서를 단호하고 기억하기 쉽게 만든다."}], "learning_visual": {"layout": "chain-response", "preview_mode": "image", "preview_title": "먹는 동안 화면도 볼 때", "preview_caption": "음식과 화면에 주의를 동시에 쓰는 장면이다.", "preview_items": [{"label": "식사", "text": "먹는 일", "refs": [2, 3]}, {"label": "화면", "text": "문자와 알림", "refs": [1, 6, 7]}], "title": "한꺼번에 처리하려다 둘 다 어긋나는 과정", "items": [{"label": "동시 행동", "text": "먹는 중에 알림·문자·이메일까지 처리한다", "refs": [1, 2]}, {"label": "주의 분산", "text": "의지의 힘이 음식과 화면 사이에서 갈라진다", "refs": [2, 3]}, {"label": "두 결과", "text": "성의 없는 메시지는 오해를, 급한 식사는 소화 불량을 낳을 수 있다", "refs": [6, 7]}, {"label": "따로 제시한 권고", "text": "먼저 먹고 맛보고 삼킨 다음에 문자를 보낸다", "refs": [8, 9, 10, 11]}], "takeaway": "핵심은 식사와 문자를 동시에 잘하는 요령이 아니라, 두 행동을 순서대로 분리하는 것이다."}}, {"id": "q23", "index_numbers": ["23"], "source_label": "2026년 9월 고2 · 23번", "sentences": [{"n": 1, "en": "Music can bring us into a very comfortable rhythm, and it can be satisfying in and of itself.", "ko": "음악은 우리를 매우 편안한 리듬 속으로 이끌 수 있으며, 그 자체로 만족감을 줄 수 있다."}, {"n": 2, "en": "Most of the time, however, we want something more to happen.", "ko": "하지만 대부분의 경우, 우리는 그 이상의 무언가가 일어나기를 원한다."}, {"n": 3, "en": "There needs to be a process that creates tension and drives the movement towards something in particular.", "ko": "긴장감을 조성하고 특정한 무언가를 향해 악장을 몰아가는 과정이 필요하다."}, {"n": 4, "en": "The excitement that arises in this process creates satisfaction and pleasure.", "ko": "이 과정에서 발생하는 흥분은 만족감과 즐거움을 만들어 낸다."}, {"n": 5, "en": "This is seen in the measureless prelude as well.", "ko": "이것은 마디가 없는 전주곡에도 보인다."}, {"n": 6, "en": "But there the tension might be caused by the ambiguity of the rhythm.", "ko": "하지만 그곳에서 긴장감은 리듬의 모호함에 의해 발생할 수 있다."}, {"n": 7, "en": "Therefore, the fluid movement in the prelude usually creates a tension that can be released in the subsequent movement with a set rhythm.", "ko": "따라서 전주곡에서의 유동적인 움직임은 보통 정해진 리듬이 있는 후속 악장에서 해소될 수 있는 긴장감을 형성한다."}, {"n": 8, "en": "This, in turn, creates new and other types of tensions, where the rhythm is unambiguous and predictable, but where unexpected chords and modulations create drama and an experience of development in the piece.", "ko": "이것은 다음에는 새롭고 다른 종류의 긴장감을 만들어 내는데, 그곳에서는 리듬이 모호하지 않고 예측 가능하지만, 예상치 못한 화음과 전조가 드라마를 형성하고 곡의 전개라는 경험을 만들어 낸다."}], "core": "음악의 만족은 긴장을 만들고 그것을 다음 악장에서 푸는 과정에서 나온다.", "flow": [{"label": "인정", "sentences": "S1", "text": "편안한 리듬만으로도 그 자체로 만족이 될 수 있다", "refs": [1]}, {"label": "전환", "sentences": "S2", "text": "그러나 대개는 그 이상의 무언가가 일어나기를 바란다", "refs": [2]}, {"label": "주제", "sentences": "S3-4", "text": "긴장을 만들고 어딘가로 몰아가는 과정이 있어야 하고, 그 흥분이 만족을 낳는다", "refs": [3, 4]}, {"label": "적용", "sentences": "S5-6", "text": "마디 없는 전주곡에도 같은 것이 보이되 그곳의 긴장은 리듬의 모호함에서 온다", "refs": [5, 6]}, {"label": "되돌이", "sentences": "S7-8", "text": "그 긴장은 다음 악장에서 풀리고, 풀린 자리에서 화음과 전조가 또 새 긴장을 만든다", "refs": [7, 8]}], "structure": [{"title": "만들기 — 긴장", "text": "편안함만으로는 모자라고, 긴장을 만들어 어딘가로 몰아가는 과정이 있어야 흥분이 생긴다"}, {"title": "풀고 다시 만들기", "text": "전주곡의 모호함이 만든 긴장은 정해진 리듬의 다음 악장에서 풀리고, 그 자리에서 또 새 긴장이 돋는다"}], "short_title": "23번 · 긴장과 해소의 음악", "lead": "편안한 리듬만 계속되는 음악보다 긴장과 해소가 있는 음악이 왜 더 만족스러울까?", "image": "../../assets/g2-23-tension-release.webp", "image_alt": "피아니스트 위로 모호한 흐름이 긴장을 만들고 규칙적인 파동으로 풀렸다가 다시 색이 변하며 새 긴장을 만드는 장면", "image_caption": "전주곡의 모호한 리듬이 긴장을 만들고 다음 악장에서 풀리며, 화음과 전조가 다시 새로운 긴장을 만든다.", "before_question": "음악의 만족과 즐거움을 만드는 핵심 과정은?", "prediction_choices": ["처음부터 끝까지 같은 편안한 리듬을 유지하는 것", "긴장을 만들고 해소하며 다시 발전시키는 것", "모든 화음과 전조를 없애는 것"], "prediction_actual": "긴장을 만들어 특정 방향으로 움직이고, 다음 악장에서 풀며, 다시 새 긴장을 만드는 과정이 만족을 낳는다.", "blocking_vocab": [{"word": "in and of itself", "meaning": "그 자체로"}, {"word": "tension", "meaning": "긴장감"}, {"word": "measureless prelude", "meaning": "마디가 없는 전주곡"}, {"word": "ambiguity", "meaning": "모호함"}, {"word": "modulation", "meaning": "전조"}], "visual_links": [{"label": "긴장 만들기", "refs": [2, 3, 4]}, {"label": "모호한 리듬", "refs": [5, 6]}, {"label": "해소와 새 긴장", "refs": [7, 8]}], "core_check": {"q": "음악적 만족에 대한 글의 요지로 가장 적절한 것은?", "choices": ["음악은 긴장을 만들고 해소하는 전개를 통해 만족을 준다.", "모호한 리듬은 어떤 즐거움도 만들 수 없다.", "예측 가능한 화음만이 곡의 발전을 만든다."], "answer": 0, "why": "S3~4에서 긴장 과정이 만족을 만들고, S7~8에서 해소 뒤 새 긴장이 이어진다고 설명한다.", "refs": [3, 4, 7, 8]}, "precision": [{"type": "근거·지칭", "q": "S5의 This가 가리키는 내용은?", "choices": ["긴장을 만들고 움직임을 이끄는 과정", "편안한 리듬만으로 끝나는 상태", "악기를 연주하는 기술"], "answer": 0, "why": "S3~4에서 설명한 긴장과 만족의 과정을 마디 없는 전주곡에도 적용한다.", "refs": [3, 4, 5]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["The ambiguity of rhythm can create tension that is released in a later movement.", "A set rhythm in the prelude prevents all later tension."], "answer": 0, "why": "S6~7은 리듬의 모호함이 만든 긴장이 정해진 리듬의 후속 악장에서 풀린다고 한다.", "refs": [6, 7]}], "supplement": [{"title": "tension은 부정적 감정만이 아니다", "text": "여기서는 다음을 기대하게 만들고 음악을 앞으로 움직이는 예술적 긴장을 뜻한다."}, {"title": "해소가 끝이 아닌 이유", "text": "S8에서 예상치 못한 화음과 전조가 다시 드라마와 발전을 만드는 새 긴장으로 이어진다."}], "learning_visual": {"layout": "principle-timeline", "preview_title": "음악에서 기대와 해소는 어떻게 이어질까?", "preview_caption": "소리의 크기를 나타낸 그래프가 아니다. 음악 속 긴장과 해소의 관계를 읽기 위한 흐름이다.", "preview_items": [{"label": "처음", "text": "편안한 리듬", "refs": [1]}, {"label": "그다음", "text": "어떤 변화가 만족을 만들까?", "refs": [2, 3, 4]}], "title": "긴장 → 해소 → 새 긴장", "items": [{"label": "일반 원리", "text": "편안한 리듬 자체도 만족을 줄 수 있다", "refs": [1]}, {"label": "긴장 형성", "text": "리듬의 모호함이 기대와 흥분을 만든다", "refs": [2, 3, 4, 5, 6]}, {"label": "해소 가능성", "text": "다음 악장에서 그 긴장이 풀릴 수 있다", "refs": [7]}, {"label": "다시 긴장", "text": "화음과 전조가 새로운 긴장을 만든다", "refs": [8]}], "takeaway": "긴장과 해소는 한 번으로 끝나지 않는다. 풀린 뒤에도 새 긴장이 시작된다."}}, {"id": "q24", "index_numbers": ["24"], "source_label": "2026년 9월 고2 · 24번", "sentences": [{"n": 1, "en": "Progressive educators and librarians are developing curricula to teach what we might call attention literacy.", "ko": "진보적인 교육자들과 사서들은 우리가 주의력 문해력이라 부를 만한 것을 가르치기 위한 교육과정을 개발하고 있다."}, {"n": 2, "en": "This means helping students recognize, for example, how the architecture of a social media feed or a news site is deliberately designed to distract or provoke them.", "ko": "예를 들어, 이것은 소셜 미디어 피드나 뉴스 사이트의 구조가 학생들을 산만하게 하거나 자극하도록 어떻게 의도적으로 설계되었는지 그들이 인식하도록 돕는 것을 의미한다."}, {"n": 3, "en": "Classes in media literacy traditionally cover how to evaluate the credibility of sources ― now they also include recognizing clickbait, understanding the role of algorithms in what content is served up, and observing one’s own patterns of distraction.", "ko": "미디어 문해력 수업은 전통적으로 어떻게 정보원의 신뢰성을 평가하는지 다루었지만, 이제는 클릭베이트(특정 링크를 클릭하도록 유도하는 수법)를 인식하고, 어떤 콘텐츠가 제공되는 것에 있어 알고리즘의 역할을 이해하며, 자신만의 주의 산만 패턴을 관찰하는 것도 포함한다."}, {"n": 4, "en": "A student might be tasked with tracking how many times they switch tasks or check their phone in an hour of homework, to raise self-awareness about fragmentation.", "ko": "학생은 주의력이 분절되는 현상에 대한 자기 인식을 높이기 위해, 숙제하는 한 시간 동안 과제를 몇 번 바꾸거나 휴대전화를 몇 번 확인하는지 추적하는 과제를 받을 수도 있다."}, {"n": 5, "en": "Another lesson might involve unpacking the design of popular apps: Why does an app use infinite scrolling instead of pages?", "ko": "또 다른 수업은 인기 앱들의 설계를 분석하는 것을 포함할 수 있다. 왜 앱은 페이지 대신 무한 스크롤을 사용할까?"}, {"n": 6, "en": "Why do notifications appear with specific colors and sounds?", "ko": "왜 알림은 특정한 색상과 소리로 나타날까?"}, {"n": 7, "en": "By treating these as deliberate design choices (often rooted in psychology and profit motives), young people become more critical users rather than passive consumers.", "ko": "이러한 것들을 (흔히 심리학과 이윤 동기에 뿌리를 둔) 의도적인 디자인 선택으로 취급함으로써, 젊은이들은 수동적인 소비자가 아니라 더 비판적인 사용자가 된다."}], "core": "매체의 설계가 의도된 선택임을 알아보게 가르쳐 젊은이를 비판적 사용자로 기른다.", "flow": [{"label": "이름", "sentences": "S1", "text": "교육자와 사서들이 「주의력 문해력」 교육과정을 만들고 있다", "refs": [1]}, {"label": "풀이", "sentences": "S2", "text": "피드와 뉴스 사이트의 구조가 어떻게 산만하게 하도록 설계되었는지 알아보게 돕는 일이다", "refs": [2]}, {"label": "내용", "sentences": "S3", "text": "전통 수업에 클릭베이트·알고리즘·자기 산만 패턴 관찰이 더해진다", "refs": [3]}, {"label": "과제", "sentences": "S4-6", "text": "작업 전환 횟수를 추적하거나 인기 앱의 설계를 뜯어보는 과제가 주어진다", "refs": [4, 5, 6]}, {"label": "효과", "sentences": "S7", "text": "의도된 설계 선택으로 다룸으로써 수동적 소비자가 아니라 비판적 사용자가 된다", "refs": [7]}], "structure": [{"title": "무엇을 가르치나", "text": "주의력 문해력 — 화면의 구조가 나를 산만하게 하도록 설계되었음을 알아보는 힘"}, {"title": "어떻게 가르치나", "text": "클릭베이트·알고리즘·자기 관찰, 그리고 앱 설계를 직접 뜯어보는 과제로 가르친다"}], "short_title": "24번 · 주의력을 읽는 법", "lead": "무한 스크롤과 알림 색깔은 우연히 그렇게 만들어졌을까?", "image": "../../assets/g2-24-attention-literacy.webp", "image_alt": "미디어 문해력 수업에서 학생들이 소셜 미디어 피드의 무한 스크롤과 알림 설계를 분석하는 장면", "image_caption": "학생들은 앱의 구조를 뜯어보며 주의를 끄는 설계가 의도된 선택임을 알아본다.", "before_q r evaluation of past environmentally burdening behaviors and future environmentally friendly behaviors.", "ko": "사람들이 태도와 행동 사이의 불일치를 줄이기 위해 태도를 바꿀 수 있는 것과 같은 방식으로, 사람들은 과거의 환경에 부담을 주는 행동과 미래의 친환경적 행동에 대한 평가를 바꿀 수도 있다."}, {"n": 7, "en": "For instance, people are more likely to sign a petition addressing environmental damage after viewing evidence of human-caused environmental damage.", "ko": "예를 들어, 사람들은 인간이 유발한 환경 훼손의 증거를 본 후에 환경 훼손을 다루는 청원서에 서명할 가능성이 더 높다."}], "core": "착한 행위가 나쁜 행동의 자격이 되듯, 환경 죄책감은 사람들을 임시방편으로 이끈다.", "flow": [{"label": "현상", "sentences": "S1", "text": "일부 사람은 친환경 제품을 산 뒤 속이거나 훔칠 가능성이 더 높다", "refs": [1]}, {"label": "이름", "sentences": "S2", "text": "그 현상을 「도덕적 허가」로 부르고 환경 협조의 맥락으로 옮긴다", "refs": [2]}, {"label": "고리1", "sentences": "S3", "text": "해로운 행동을 떠올리면 환경에 대한 죄책감이 남는다", "refs": [3]}, {"label": "고리2", "sentences": "S4-5", "text": "그것을 갚아 균형을 되찾으려 하고, 빨리 벗어나려 임시방편을 믿을 수 있다", "refs": [4, 5]}, {"label": "넓힘", "sentences": "S6-7", "text": "태도뿐 아니라 과거·미래 행동의 평가까지 바꾸며, 증거를 본 뒤 청원에 서명한다", "refs": [6, 7]}], "structure": [{"title": "현상 — 착한 뒤에 오는 나쁜 행동", "text": "친환경 선택을 착한 행위로 셈하고 나면 그럴 자격이 생겼다고 느낀다"}, {"title": "작동 원리 — 죄책감을 덮는 빠른 길", "text": "환경 죄책감은 임시방편과 평가 바꾸기로 도덕적 균형을 되찾은 느낌만 만든다"}], "short_title": "30번 · 환경 죄책감의 임시방편", "lead": "한 번의 친환경 행동이 왜 다음 행동의 면허처럼 느껴질 수 있을까?", "image": "../../assets/g2-30-eco-guilt.webp", "image_alt": "친환경 물품과 환경 청원서를 저울에 올려 도덕적 균형을 빨리 되찾으려는 사람", "image_caption": "환경 죄책감은 깊은 변화를 만들기보다 빠른 행동 하나로 도덕적 균형을 회복했다고 느끼게 할 수 있다.", "before_question": "eco-guilt를 느낀 사람이 quick-fix를 찾는 까닭은?", "prediction_choices": ["죄책감에서 쉽고 빨리 벗어나 도덕적 균형을 회복하려고", "환경 문제를 더 복잡하게 만들려고", "친환경 행동을 모두 포기하려고"], "prediction_actual": "죄책감을 쉽고 빠르게 벗고 도덕적 균형을 되찾고 싶어서 임시방편을 믿게 된다.", "blocking_vocab": [{"word": "feel licensed to", "meaning": "~해도 된다는 자격을 느끼다"}, {"word": "moral licensing", "meaning": "도덕적 면허 효과"}, {"word": "eco-guilt", "meaning": "환경 문제에 대한 죄책감"}, {"word": "compensate for", "meaning": "~을 보상하다"}, {"word": "quick-fix", "meaning": "임시방편·빠른 해결책"}], " geography is becoming unclear.", "ko": "인문 지리학은 모호해지고 있다."}, {"n": 2, "en": "As people find themselves regularly on the move, we are experiencing a phase shift like when matter transitions from solid to liquid to gas: molecules heat up and loosen from one another, vibrating more rapidly.", "ko": "사람들이 정기적으로 이동하는 상황에 놓이게 됨에 따라, 우리는 물질이 고체에서 액체로, 액체에서 기체로 변할 때와 같은 상태 변화를 경험하고 있다. 즉, 분자들이 가열되어 서로에게서 느슨해져, 더 빠르게 진동하는 것이다."}, {"n": 3, "en": "One might even say that humans are becoming like particles in quantum physics, their velocity and location always in flux.", "ko": "혹자는 심지어 인간이 양자 물리학의 입자처럼 되고 있다고 말하는데, 즉 그들의 속도와 위치가 늘 끊임없는 변화 속에 있다는 것이다."}, {"n": 4, "en": "It would be nice to return to some form of stability, but that’s not how things work in a quantum world.", "ko": "어느 정도 안정된 모습으로 돌아가는 것이 좋겠지만, 양자 세계에서 상황은 그렇게 돌아가지 않는다."}, {"n": 5, "en": "Instead, the complexity of today’s world makes it increasingly difficult to settle permanently anywhere.", "ko": "대신에, 오늘날 세계의 복잡성은 어느 곳에든 영구적으로 정착하는 것을 점점 어렵게 만든다."}, {"n": 6, "en": "Highly paid digital nomads and billionaires with multiple passports as well as migratory workers are all part of the diverse and growing global demographic of quantum people.", "ko": "이주 노동자뿐만 아니라 고액 연봉의 디지털 유목민들과 여러 개의 여권을 가진 억만장자들도 모두 다양하고 증가하는 양자 인류라는 글로벌 인구 집단의 일부이다."}], "core": "늘 이동하는 사람들 때문에 인문 지리학의 경계가 흐려지고 「양자 인류」가 늘어난다.", "flow": [{"label": "이동의 비유", "sentences": "S1–2", "text": "인문 지리학이 모호해지는 현상을, 끊임없이 움직이며 고체에서 액체·기체로 변하는 것에 비유한다.", "refs": [1, 2]}, {"label": "변하는 사람", "sentences": "S3", "text": "사람도 양자 입자처럼 위치와 속도가 계속 달라진다고 확장한다.", "refs": [3]}, {"label": "정착의 어려움", "sentences": "S4–5", "text": "안정으로 되돌아갈 수 없고 복잡성이 커지며 한곳에 정착하기가 어려워진다.", "refs": [4, 5]}, {"label": "양자 인류", "sentences": "S6", "text": "이주 노동자부터 억만장자까지 여러 처지의 사람을 예로 들어 이 커지는 집단을 설명한다.", "refs": [6]}], "structure": [{"title": "상태가 바뀐다", "text": "고체에서 기체로 풀리듯 사람도 한자리에 묶여 있지 않게 되었다"}, {"title": "그래서 새 이름", "text": "속도와 위치가 늘 변하는 사람들을 「양자 인류」로 묶어 부른다"}], "short_title": "31번 · 이동하는 양자 인류", "lead": "사람이 한곳에 정착하지 않고 계속 이동하면 지리적 경계는 어떻게 보일까?", "image": "../../assets/g2-31-quantum-people.webp", "image_alt": "디지털 노마드·이주 노동자·여러 지역을 오가는 사람이 흐르는 입자 같은 경계를 지나 이동하는 장면", "image_caption": "서로 다른 이유로 이동하는 사람들의 위치와 속도가 계속 바뀌며 고정된 인간 지리의 경계를 흐린다.", "before_question": "글쓴이가 quantum people이라고 부르는 사람들의 공통점은?", "prediction_choices": ["한 장소에 영구히 정착해 움직이지 않는다.", "위치와 이동 속도가 계속 달라진다.", "모두 같은 직업과 소득을 갖는다."], "prediction_actual": "직업과 계층은 달라도 계속 이동하며 위치와 속도가 늘 변하는 사람들이다.", "blocking_vocab": [{"word": "human geography", "meaning": "인문 지리"}, {"word": "phase shift", "meaning": "상태 변화"}, {"word": "in flux", "meaning": "끊임없이 변하는"}, {"word": "settle permanently", "meaning": "영구히 정착하다"}, {"word": "demographic", "meaning": "인구 집단"}], "visual_links": [{"label": "상태 변화 비유", "refs": [1, 2]}, {"label": "위치와 속도의 변화", "refs": [3, 4, 5]}, {"label": "다양한 이동 인구", "refs": [6]}], "core_check": {"q": "quantum people에 대한 설명으로 가장 적절한 것은?", "choices": ["고정된 장소와 정체성을 유지하는 사람들", "세계의 복잡성 속에서 위치가 계속 변하는 이동 인구", "물리학을 직업으로 삼는 사람들"], "answer": 1, "why": "S3~6은 위치와 속도가 늘 변하며 영구 정착이 어려운 다양한 이동 인구를 설명한다.", "refs": [3, 4, 5, 6]}, "precision": [{"type": "근거·세부", "q": "S6에서 quantum people의 예로 제시되지 않은 것은?", "choices": ["digital nomads", "migratory workers", "permanently settled farmers"], "answer": 2, "why": "S6은 디지털 노마드·복수 여권의 억만장자·이주 노동자를 든다.", "refs": [6]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["The complexity of today's world makes permanent settlement increasingly difficult.", "Human geography is becoming clearer as movement decreases."], "answer": 0, "why": "S1과 S5는 인문 지리가 흐려지고 영구 정착이 더 어려워진다고 한다.", "refs": [1, 5]}], "supplement": [{"title": "고체→액체→기체 비유", "text": "분자가 풀리고 더 빠르게 움직이는 상태 변화를 사람들의 잦은 이동에 빗댄다."}, {"title": "quantum은 과학 설명이 아니다", "text": "위치와 속도가 계속 바뀌는 현대인의 상태를 강조하는 비유적 이름이다."}], "learning_visual": {"layout": "compare-conclusion", "preview_title": "'양자 인류'는 실제 물리학 이야기가 아니다", "preview_caption": "고체·액체·기체와 양자 입자는 끊임없이 이동하는 현대인을 설명하는 비유다.", "preview_items": [{"label": "고정된 삶", "text": "한곳에 머무는 상태", "refs": [2]}, {"label": "움직이는 삶", "text": "위치와 속도가 계속 변함", "refs": [2, 3]}], "title": "고정에서 이동으로 바뀌는 인간의 상태", "items": [{"label": "고정된 상태", "text": "한곳에 머무는 삶의 경계가 흐려진다", "refs": [1, 2]}, {"label": "계속 움직이는 상태", "text": "사람의 위치와 이동 속도가 달라지고 복잡한 현실은 안정된 정착을 어렵게 한다", "refs": [2, 3, 4, 5]}, {"label": "글쓴이의 비유", "text": "서로 다른 처지의 이동하는 사람들을 '양자 인류'라는 말로 묶는다", "refs": [6]}], "takeaway": "상태 변화와 양자 입자는 실제 과학 설명이 아니라 이동성과 불안정을 드러내는 비유다."}}, {"id": "q32", "index_numbers": ["32"], "source_label": "2026년 9월 고2 · 32번", "sentences": [{"n": 1, "en": "Of the cognitive motivations, the most fundamental one encourages people to understand their environment to predict what is going to happen in case of uncertainties.", "ko": "인지적 동기 중에서, 가장 근본적인 것은 사람들이 불확실성의 경우에서 무엇이 일어날지 예측하기 위해 자신의 환경을 이해하게 한다."}, {"n": 2, "en": "Most important, people prefer to develop meanings that are shared with other people.", "ko": "가장 중요한 점은, 사람들이 다른 사람들과 공유되는 의미를 발전시키는 것을 선호한다는 것이다."}, {"n": 3, "en": "For example, if in a given year more people accept offers of admission than a college expects, quite a few students end up living in dorm lounges or campus hotels.", "ko": "예를 들어, 어떤 해에 대학이 예상한 것보다 더 많은 사람이 입학 허가를 받아들이면, 꽤 다수의 학생이 결국 기숙사 라운지나 캠퍼스 호텔에서 살게 된다."}, {"n": 4, "en": "It is easy to understand why living in the lounge is problematic (no closet, for one thing).", "ko": "라운지에서 사는 것이 왜 문제가 되는지 이해하기는 쉽다(우선 옷장이 없다)."}, {"n": 5, "en": "But what is wrong with a room at campus hotels?", "ko": "하지만 캠퍼스 호텔의 방은 무엇이 문제일까?"}, {"n": 6, "en": "After all, students in a hotel get private bathrooms, their own TV, and larger rooms.", "ko": "결국, 호텔에 있는 학생들은 개인 욕실, 전용 TV, 그리고 더 넓은 방을 갖게 된다."}, {"n": 7, "en": "In fact, living in those hotels is problematic because the student residents are not a part of a stable group with people who will be their neighbors for the year; they must wait in uncertainty before finding their social niche.", "ko": "사실, 이런 호텔에서 사는 것이 문제가 되는데 왜냐하면 그 학생 거주자들이 그해 동안 이웃이 될 사람들과 함께하는 안정적인 집단의 일원이 아니기 때문이다. 그래서 그들은 자신의 사회적 적소를 찾기 전까지 불확실한 상태에서 기다려야만 한다."}, {"n": 8, "en": "The uncertainty itself is the problem.", "ko": "불확실성 그 자체가 문제인 것이다."}, {"n": 9, "en": "People lack a shared social understanding, normally developed from membership in a stable group.", "ko": "사람들은 안정적인 집단의 구성원 자격으로부터 보통 발전되는 공유된 사회적 이해가 결여되어 있다."}], "core": "좋은 방이 있어도 안정된 집단에 들지 못하면 공유된 사회적 이해가 없어 불확실성이 남는다.", "flow": [{"label": "전제", "sentences": "S1-2", "text": "환경을 이해해 앞일을 내다보려는 것이 가장 근본적인 동기이며, 그 의미는 남과 공유되기를 바란다", "refs": [1, 2]}, {"label": "보기", "sentences": "S3", "text": "정원이 넘치면 학생들이 라운지나 캠퍼스 호텔에 살게 된다", "refs": [3]}, {"label": "쉬운 답", "sentences": "S4", "text": "라운지가 왜 문제인지는 쉽다 — 우선 옷장이 없다", "refs": [4]}, {"label": "물음", "sentences": "S5-6", "text": "호텔은 욕실·TV·넓은 방까지 있는데 무엇이 문제냐고 되묻는다", "refs": [5, 6]}, {"label": "답", "sentences": "S7-9", "text": "안정된 집단에 들지 못해 적소를 찾기까지 불확실 속에 있고, 공유된 사회적 이해가 없다", "refs": [7, 8, 9]}], "structure": [{"title": "겉으로 보이는 것", "text": "개인 욕실·전용 TV·넓은 방 — 호텔이 라운지보다 낫다"}, {"title": "실제 문제", "text": "그해 이웃이 될 사람들과 안정된 집단을 이루지 못해 공유된 사회적 이해가 생기지 않는다"}], "short_title": "32번 · 좋은 방인데 불편한 이유", "lead": "개인 욕실과 TV가 있는 큰 방인데도 학생이 불안한 까닭은 무엇일까?", "image": "../../assets/g2-32-campus-hotel.webp", "image_alt": "편안한 캠퍼스 호텔 방에 혼자 있는 학생이 옆 공간에서 안정된 이웃 집단이 어울리는 모습을 바라보는 장면", "image_caption": "문제는 방의 시설이 아니라, 한 해를 함께할 안정된 집단과 공유된 사회적 이해가 없다는 데 있다.", "before_question": "캠퍼스 호텔 생활의 실제 문제는?", "prediction_choices": ["방이 너무 작고 욕실이 없다는 것", "안정된 이웃 집단에 속하지 못해 사회적 불확실성이 남는 것", "텔레비전이 너무 많다는 것"], "prediction_actual": "좋은 시설이 있어도 안정된 집단에 속하지 못해 공유된 사회적 이해와 사회적 자리를 찾지 못한다.", "blocking_vocab": [{"word": "cognitive motivation", "meaning": "인지적 동기"}, {"word": "uncertainty", "meaning": "불확실성"}, {"word": "shared meaning", "meaning": "공유된 의미"}, {"word": "stable group", "meaning": "안정된 집단"}, {"word": "social niche", "meaning": "사회적 자리"}], "visual_links": [{"label": "좋아 보이는 호텔 방", "refs": [3, 5, 6]}, {"label": "안정된 집단의 부재", "refs": [7]}, {"label": "공유된 이해 부족", "refs": [8, 9]}], "core_check": {"q": "캠퍼스 호텔 생활이 문제인 핵심 이유는?", "choices": ["시설이 부족해서", "안정된 집단과 공유된 사회적 이해가 없어서", "호텔이 캠퍼스와 너무 가까워서"], "answer": 1, "why": "S7~9는 방의 시설이 아니라 집단 소속과 공유된 이해의 부재를 문제로 제시한다.", "refs": [7, 8, 9]}, "precision": [{"type": "근거·세부", "q": "호텔 방의 장점으로 제시되지 않은 것은?", "choices": ["private bathrooms", "their own TV", "a stable group of neighbors"], "answer": 2, "why": "S6은 욕실·TV·큰 방을 장점으로 들지만 안정된 이웃 집단은 없다고 S7이 말한다.", "refs": [6, 7]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["The uncertainty comes from lacking membership in a stable social group.", "The main problem is that hotel rooms have no private facilities."], "answer": 0, "why": "S7~9가 집단 소속과 공유된 사회적 이해의 부재를 불확실성의 원인으로 설명한다.", "refs": [7, 8, 9]}], "supplement": [{"title": "겉보기의 역설", "text": "호텔은 라운지보다 시설이 좋지만 사회적 소속을 주지 못해 더 근본적인 불확실성이 남는다."}, {"title": "shared social understanding", "text": "안정된 집단 안에서 이웃과 함께 형성하는 공통 규칙·기대·의미를 가리킨다."}], "learning_visual": {"layout": "compare", "preview_mode": "image", "preview_title": "방이 좋아도 왜 불안할까?", "preview_caption": "호텔방의 편의와 집단에 속한다는 느낌은 서로 다른 문제다.", "preview_items": [{"label": "겉으로 보이는 것", "text": "욕실·TV·넓은 방", "refs": [5, 6]}, {"label": "아직 모르는 것", "text": "안정된 집단에 속했는가?", "refs": [7, 8, 9]}], "title": "물리적 편안함과 사회적 안정감", "items": [{"label": "호텔방이 주는 것", "text": "욕실·TV·넓은 공간 같은 물리적 편의", "refs": [5, 6]}, {"label": "호텔방이 못 주는 것", "text": "안정된 집단과 공유된 사회적 이해", "refs": [7, 8, 9]}], "takeaway": "사람은 단지 좋은 방이 아니라, 환경을 함께 이해할 사람들과 예측 가능한 소속을 원한다(S1~2)."}}, {"id": "q33", "index_numbers": ["33"], "source_label": "2026년 9월 고2 · 33번", "sentences": [{"n": 1, "en": "Psychological theories across the field agree on the importance of grieving our losses, from the highly personal through to the broadly collective.", "ko": "심리학 분야 전반에서 심리학 이론들은 매우 개인적인 것부터 광범위한 집단적 상실에 이르기까지, 우리의 상실을 애도하는 것의 중요성에 동의한다."}, {"n": 2, "en": "Grief is a dynamic emotional process essential to consciousness.", "ko": "애도는 의식에 필수적인 역동적인 정서적 과정이다."}, {"n": 3, "en": "At a psychological level, it supports us to both face into our own and others’ vulnerability, transience and mortality, and to repair life energy after significant loss.", "ko": "심리적 수준에서, 그것은 우리 자신과 타인의 연약함, 덧없음, 그리고 죽음을 직시하는 것도, 중대한 상실 이후의 삶의 에너지를 회복하는 것도 지원한다."}, {"n": 4, "en": "Grief work honours the loss, the sadness and the experience of diminishment or absence, while also setting up the ground for self-transformation and the continuation of life.", "ko": "애도 작업(Grief work)은 상실, 슬픔, 그리고 위축이나 부재의 경험을 존중하고, 한편으로는 자기 변신과 삶의 지속을 위한 기반을 마련하기도 한다."}, {"n": 5, "en": "Psychotherapist Fran Weller describes grief work is “an act of devotion, rooted in love and compassion” that requires “an ongoing practice of deepening, attending and listening.”", "ko": "심리치료사 Fran Weller는 애도 작업을 ‘심화, 주의 기울이기와 경청의 지속적인 실천’을 요구하는 ‘사랑과 연민에 뿌리를 둔 헌신적인 행위’라고 묘사한다."}, {"n": 6, "en": "When we grieve for what is lost, it clears the way towards a strengthening of love and commitment for what remains.", "ko": "우리가 잃어버린 것에 대해 애도할 때, 그것은 남아 있는 것에 대한 사랑과 헌신을 강화하는 길을 열어 준다."}, {"n": 7, "en": "In time this may build a desire to make good from the loss by repairing as many damages as we can and/or compensating for them.", "ko": "시간이 지나면 이것은 우리가 할 수 있는 한 많은 피해들을 고치고/고치거나 그것들을 보상함으로써 상실로부터 이로움을 만들어내려는 욕구를 형성할 수도 있다."}, {"n": 8, "en": "Grief can make us both very sad and very motivated to act.", "ko": "애도는 우리를 매우 슬프게 만드는 동시에 행동하도록 강하게 동기를 부여할 수 있다."}], "core": "애도는 상실을 기리면서 동시에 새 삶의 바탕을 놓아, 슬픔과 행동을 함께 낳는다.", "flow": [{"label": "동의", "sentences": "S1", "text": "개인적인 것부터 집단적인 것까지 애도의 중요성에 이론들이 모두 동의한다", "refs": [1]}, {"label": "정의", "sentences": "S2", "text": "애도는 의식에 꼭 필요한 역동적인 정서 과정이다", "refs": [2]}, {"label": "구실", "sentences": "S3", "text": "연약함과 죽음을 직시하게 하고 큰 상실 뒤의 에너지를 되찾게 한다", "refs": [3]}, {"label": "두 얼굴", "sentences": "S4-5", "text": "상실을 기리면서 자기 변신과 삶의 지속을 위한 바탕도 마련한다", "refs": [4, 5]}, {"label": "결론", "sentences": "S6-8", "text": "남은 것에 대한 사랑이 커지고, 고치고 갚으려는 욕구까지 생겨 슬픔과 행동이 함께 온다", "refs": [6, 7, 8]}], "structure": [{"title": "기린다", "text": "상실·슬픔·부재의 경험을 존중하고 그 앞에 선다"}, {"title": "새로 짓는다", "text": "자기 변신과 삶의 지속을 위한 바탕을 놓아 남은 것에 대한 사랑과 행동을 낳는다"}], "short_title": "33번 · 슬픔과 행동을 함께 낳는 애도", "lead": "상실을 깊이 애도하는 일은 삶을 멈추게 할까, 다시 움직이게 할까?", "image": "../../assets/g2-33-grief-action.webp", "image_alt": "이름 없는 추모석 곁에서 슬픔을 기리는 사람과 가까운 곳에서 함께 손상된 정원을 고치고 새 식물을 심는 사람들", "image_caption": "애도는 상실과 부재를 존중하면서도, 남은 것을 사랑하고 손상을 고치는 행동의 바탕을 놓는다.", "before_question": "글쓴이가 말하는 grief의 두 가지 힘은?", "prediction_choices": ["슬픔만 남기고 모든 행동을 멈추게 한다.", "상실을 기리면서 삶을 이어 갈 변화와 행동을 만든다.", "상실을 빨리 잊게 한다."], "prediction_actual": "상실과 슬픔을 기리는 동시에 자기 변화와 삶의 지속을 위한 바탕을 놓아 행동의 동기도 만든다.", "blocking_vocab": [{"word": "grieve", "meaning": "애도하다"}, {"word": "transience", "meaning": "덧없음"}, {"word": "diminishment", "meaning": "줄어듦·상실감"}, {"word": "self-transformation", "meaning": "자기 변화"}, {"word": "compensate for", "meaning": "~을 보완·보상하다"}], "visual_links": [{"label": "상실을 기림", "refs": [1, 2, 3, 4]}, {"label": "사랑과 삶의 지속", "refs": [4, 5, 6]}, {"label": "손상을 고치는 행동", "refs": [7, 8]}], "core_check": {"q": "애도에 대한 글의 요지로 가장 적절한 것은?", "choices": ["애도는 슬픔과 함께 삶을 회복하고 행동할 힘도 만든다.", "애도는 상실을 즉시 잊기 위한 기술이다.", "애도는 개인적 상실에만 필요하고 집단적 상실에는 필요 없다."], "answer": 0, "why": "S3~8은 애도가 상실을 마주하고 삶의 에너지를 회복하며 사랑과 행동을 강화한다고 한다.", "refs": [3, 4, 6, 7, 8]}, "precision": [{"type": "근거·세부", "q": "S4에서 grief work가 동시에 하는 두 일은?", "choices": ["상실을 기리고 삶의 지속을 위한 바탕을 놓기", "상실을 부정하고 과거로 돌아가기", "슬픔을 숨기고 타인의 취약성을 피하기"], "answer": 0, "why": "S4의 while also가 상실 존중과 자기 변화·삶의 지속을 함께 연결한다.", "refs": [4]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Grief can strengthen love for what remains and motivate repair.", "Grief necessarily removes every desire to act."], "answer": 0, "why": "S6~8은 남은 것에 대한 사랑과 손상을 고치려는 동기를 강조한다.", "refs": [6, 7, 8]}], "supplement": [{"title": "while also의 중심", "text": "애도는 슬픔에 머무는 일과 새 삶을 준비하는 일을 서로 반대가 아니라 동시에 가능한 것으로 묶는다."}, {"title": "grief work", "text": "상실을 외면하지 않고 계속 주의를 기울이며 삶의 에너지를 회복하는 능동적 과정이다."}], "learning_visual": {"layout": "fork-synthesis", "preview_title": "애도는 슬픔에서 멈출까?", "preview_caption": "한 가지 감정에서 두 방향이 함께 나온다는 글의 논리를 따라간다.", "preview_items": [{"label": "출발", "text": "큰 상실", "refs": [1, 2, 3]}, {"label": "질문", "text": "그다음에는 무엇이 남을까?", "refs": [4, 5, 6, 7, 8]}], "title": "애도에서 함께 나오는 두 방향", "items": [{"label": "출발 · 애도", "text": "상실과 연약함을 직시하며 감정의 에너지를 되찾는다", "refs": [1, 2, 3]}, {"label": "상실을 향한 마음", "text": "잃은 대상을 기리고 상실을 직시한다", "refs": [3, 4]}, {"label": "남은 것을 향한 마음", "text": "남아 있는 것에 대한 사랑과 고치려는 마음이 커진다", "refs": [6, 7, 8]}, {"label": "삶으로 이어짐", "text": "그 과정이 자기 변신과 삶의 지속을 위한 바탕을 놓는다", "refs": [4]}], "takeaway": "애도는 슬픔과 행동 중 하나를 고르는 과정이 아니라 둘을 함께 낳는다."}}, {"id": "q34", "index_numbers": ["34"], "source_label": "2026년 9월 고2 · 34번", "sentences": [{"n": 1, "en": "When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day.", "ko": "우리가 매체의 분명한 측면에 집중할 때, 우리는 시간이 흐름에 따라 축적되지만 하루 하루 뚜렷하게 보이지 않는 변화를 놓친다."}, {"n": 2, "en": "Most of us notice the obvious aspects of a new medium or technology while missing the more subtle aspects.", "ko": "우리들 대부분은 더 미묘한 측면들을 놓치는 동안 새로운 매체나 기술의 분명한 측면은 알아차린다."}, {"n": 3, "en": "Take, for example, the microwave oven.", "ko": "예를 들어, 전자레인지를 보라."}, {"n": 4, "en": "It was introduced in the early 1980s and revolutionized food preparation.", "ko": "그것은 1980년대 초반에 도입되었고 음식 준비 과정에 혁명을 일으켰다."}, {"n": 5, "en": "Traditionally, one person spent the better part of an afternoon fixing an evening meal for a family.", "ko": "전통적으로, 한 사람이 가족을 위한 저녁 식사를 준비하느라 오후의 대부분을 보냈다."}, {"n": 6, "en": "Now, it was possible to prepare foods very quickly, and this shortening of preparation time was liberating for the cooks in the family, most of whom tended to be women.", "ko": "이제 음식을 매우 빠르게 준비하는 것이 가능해졌고, 이러한 준비 시간의 단축은 대부분 여성인 경향이 있었던 가족 내 요리사들을 해방시켰다."}, {"n": 7, "en": "But the short-term, obvious implications of greater convenience made it easy to overlook the long-term implications of no longer having one person fix food for the family to eat together at an evening meal.", "ko": "하지만 더 큰 편리함이라는 단기적이고 분명한 영향은 더 이상 한 사람이 가족이 저녁 식사에서 함께 먹기 위해 음식을 준비하지 않게 되는 것의 장기적인 영향을 간과하기 쉽게 만들었다."}, {"n": 8, "en": "As time went on, fewer and fewer families sat down together to eat dinner.", "ko": "시간이 흐르면서, 점점 더 적은 수의 가족들이 저녁을 먹기 위해 함께 둘러앉았다."}, {"n": 9, "en": "Meals that took a long time to prepare became a luxury of the past, except perhaps for special occasions.", "ko": "아마도 특별한 경우를 제외하고는, 준비하는 데 오랜 시간이 걸리는 식사는 과거의 사치품이 되었다."}, {"n": 10, "en": "The effects of the microwave oven on family life were not anticipated and would have been difficult to foresee.", "ko": "전자레인지가 가정 생활에 미친 영향은 예상되지 못했으며, 예견하기도 어려웠을 것이다."}], "core": "전자레인지의 뚜렷한 편리함이 함께 먹는 저녁이 사라지는 느린 변화를 가렸다.", "flow": [{"label": "주제", "sentences": "S1-2", "text": "분명한 측면만 보면 쌓이지만 눈에 안 띄는 변화를 놓친다", "refs": [1, 2]}, {"label": "보기", "sentences": "S3-4", "text": "전자레인지가 1980년대 초에 나와 음식 준비를 뒤집었다", "refs": [3, 4]}, {"label": "전후", "sentences": "S5-6", "text": "오후의 상당 시간을 쓰던 일이 빠르게 끝나 대부분 여성이던 요리사들이 풀려났다", "refs": [5, 6]}, {"label": "가려진 것", "sentences": "S7", "text": "눈앞의 편리함이 한 사람이 저녁상을 차리지 않게 되는 것의 긴 영향을 가렸다", "refs": [7]}, {"label": "결과", "sentences": "S8-10", "text": "함께 먹는 가족이 줄고 오래 걸리는 식사가 사치가 되었으며 미리 예측하기 어려웠다", "refs": [8, 9, 10]}], "structure": [{"title": "보이는 것 — 편리함", "text": "준비 시간이 줄어 요리하던 사람이 자유로워졌다"}, {"title": "안 보이는 것 — 사라진 저녁상", "text": "함께 둘러앉는 저녁이 줄고 오래 걸리는 식사가 과거의 사치가 되었다"}], "short_title": "34번 · 편리함 뒤에서 사라진 저녁상", "lead": "전자레인지가 줄인 것은 조리 시간뿐이었을까?", "image": "../../assets/g2-34-microwave-dinner.webp", "image_alt": "가족 구성원들이 전자레인지 음식을 각자 먹고 중앙의 큰 저녁 식탁은 비어 있는 장면", "image_caption": "빠른 조리는 가족의 요리 부담을 줄였지만, 함께 둘러앉는 저녁 식사는 서서히 줄어들었다.", "before_question": "전자레인지의 편리함 때문에 놓치기 쉬웠던 장기 변화는?", "prediction_choices": ["가족이 함께 저녁을 먹는 일이 줄어든 것", "조리 시간이 더 길어진 것", "특별한 날의 음식이 모두 사라진 것"], "prediction_actual": "조리 시간 단축의 편리함이 가족이 함께 먹는 저녁의 점진적 소멸을 가렸다.", "blocking_vocab": [  35번", "sentences": [{"n": 1, "en": "Digital twins are digital replicas of assets or activities using modeling and sensors to create digital representations.", "ko": "디지털 트윈은 디지털 표현을 만들기 위해 모델링과 센서를 사용하는 자산이나 활동의 디지털 복제본이다."}, {"n": 2, "en": "Digital twins are not new; engineering teams in various industries have used 3D renderings of computer-aided design models, asset models, and process simulations for years.", "ko": "디지털 트윈은 새로운 것이 아니다. 가령 다양한 산업의 엔지니어링 팀은 수년 동안 컴퓨터 지원 설계(CAD) 모델의 3D 렌더링, 자산 모델 및 공정 시뮬레이션을 사용해 왔다."}, {"n": 3, "en": "However, faster wireless networks and the resulting availability of real-time data enable much more detailed and dynamic digital representations.", "ko": "그러나 더 빠른 무선 네트워크와 그로 인한 실시간 데이터의 가용성은 훨씬 더 상세하고 역동적인 디지털 표현을 가능하게 한다."}, {"n": 4, "en": "When sensors collect data from a connected device, the sensor data can be used to continuously update the digital twin.", "ko": "연결된 기기로부터 센서가 데이터를 수집할 때, 그 센서 데이터는 디지털 트윈을 지속적으로 업데이트하는 데 사용될 수 있다."}, {"n": 5, "en": "The digital twin becomes a real-time accurate copy of a physical object’s properties and states.", "ko": "디지털 트윈은 물리적 객체의 속성과 상태에 대한 정확한 실시간 복사본이 된다."}, {"n": 6, "en": "For instance, digital twins of physical assets such as power-generation turbines, jet engines, and train engines are becoming common when the assets are very valuable and when downtime would be very costly.", "ko": "예를 들어, 발전 터빈, 제트 엔진, 기차 엔진과 같은 물리적 자산의 디지털 트윈은 자산이 매우 가치 있고 가동 중단 비용이 매우 클 때 일반화되고 있다."}], "core": "실시간 데이터가 더해지며 디지털 트윈이 물리적 자산의 정확한 실시간 복사본이 되었다.", "flow": [{"label": "정의와 기존 기술", "sentences": "S1–2", "text": "디지털 트윈은 자산·활동의 복제본이며, 3D 렌더링과 시뮬레이션 자체는 오래전부터 있었다.", "refs": [1, 2]}, {"label": "새로운 조건", "sentences": "S3", "text": "빠른 무선망과 실시간 데이터가 더 자세하고 역동적인 표현을 가능하게 한다.", "refs": [3]}, {"label": "작동 방식", "sentences": "S4–5", "text": "센서 값이 디지털 트윈을 계속 갱신해 정확한 실시간 복사본을 유지한다.", "refs": [4, 5]}, {"label": "활용 대상", "sentences": "S6", "text": "고장이나 중단 비용이 큰 설비에서 특히 쓰인다.", "refs": [6]}], "structure": [{"title": : "chain", "preview_mode": "image", "preview_title": "디지털 복제본은 어떻게 실제 물체를 따라갈까?", "preview_caption": "3D 모형에 무엇이 더해져 실시간 복제본이 되는지 확인해보자.", "preview_items": [{"label": "실제 물체", "text": "터빈·엔진의 현재 상태", "refs": [5, 6]}, {"label": "질문", "text": "디지털 모형은 어떻게 이를 알까?", "refs": [3, 4]}], "title": "정적 모형에서 실시간 디지털 트윈으로", "items": [{"label": "기존", "text": "3D 모형과 공정 시뮬레이션은 이미 있었다", "refs": [1, 2]}, {"label": "새 조건", "text": "빠른 무선망과 센서가 실시간 데이터를 보낸다", "refs": [3, 4]}, {"label": "갱신", "text": "데이터가 디지털 복제본을 계속 업데이트한다", "refs": [4]}, {"label": "결과", "text": "실제 자산의 성질과 상태를 실시간으로 닮는다", "refs": [5, 6]}], "takeaway": "그냥 닮은 3D 그림이 아니라, 센서 데이터로 계속 바뀌는 복제본이라는 점이 핵심이다."}}, {"id": "q36", "index_numbers": ["36"], "source_label": "2026년 9월 고2 · 36번", "sentences": [{"n": 1, "en": "The ability to select a set of surroundings suitable for foraging, shelter from predators, and the availability of mates is one of the most important determinants of biological success ― measured as survival to reproductive age and the production of offspring.", "ko": "먹이 찾아다니기, 천적으로부터의 은신처 그리고 짝을 만날 가능성에 적합한 일련의 환경을 선택하는 능력은 번식 연령까지의 생존과 새끼를 낳는 것으로 측정되는 생물학적 성공의 가장 중요한 결정 요소 중 하나이다."}, {"n": 2, "en": "Many studies have shown that not only do animals have a remarkable ability to seek out the best available locations for the necessities of life, but that they are able to anticipate how a setting will serve their future needs.", "ko": "많은 연구는 동물이 삶의 필수 요소들을 찾기 위해 이용 가능한 최적의 장소를 찾아내는 놀라운 능력을 갖추고 있을 뿐만 아니라, 환경이 자신들의 미래의 필요를 어떻게 충족시킬지 예측할 수 있다는 것을 보여 주어 왔다."}, {"n": 3, "en": "For example, the black-throated green warbler, a small songbird that nests in spruce forests of eastern North America, establishes territories preferentially among the red spruce trees early in the summer months, even though these trees offer less food than the neighboring white spruce trees.", "ko": "예를 들어, 북미 동부의 가문비나무 숲에 둥지를 트는 작은 명금류인 검은가슴푸른솔새는 붉은 가문비나무들이 인접한 흰 가문비나무보다 먹이를 적게 제공함에도, 이른 여름 몇 달 동안에 우선적으로 붉은 가문비나무 사이에 활동 영역을 형성한다."}, {"n": 4, "en": "Later, though, when nests are built and hungry baby birds need nourishment, it is the red spruce forest that offers the easier pickings.", "ko": "그러나 나중에 둥지가 지어지고 배고픈 어린 새들이 먹이가 필요할 때, 더 쉽게 채집물을 제공하는 곳은 바로 붉은 가문비나무 숲이다."}, {"n": 5, "en": "Somehow, the warbler has been guided to settle in locations that will suit its future parenting needs better than its present ones.", "ko": "어떻게든, 그 솔새는 현재의 필요보다 미래의 양육 필요에 더 적합할 장소에 자리를 잡도록 유도되었다."}], "core": "솔새는 지금 먹이가 많은 곳이 아니라 나중에 필요할 자리를 먼저 고른다.", "flow": [{"label": "선택의 원리", "sentences": "S1–2", "text": "살 곳을 고르는 능력은 생존에 중요하고 동물은 현재뿐 아니라 미래의 필요도 내다본다.", "refs": [1, 2]}, {"label": "솔새의 선택", "sentences": "S3–4", "text": "솔새는 지금 먹이가 적은 숲을 택하지만 새끼가 먹을 때에는 그곳의 먹이를 구하기 쉬워진다.", "refs": [3, 4]}, {"label": "결론", "sentences": "S5", "text": "현재 먹이보다 미래의 양육 필요에 맞는 서식지를 고른다는 것이다.", "refs": [5]}], "structure": [{"title": "지금 기준으로 보면 손해", "text": "붉은 가문비나무는 이웃한 흰 가문비나무보다 먹이가 적다"}, {"title": "나중 기준으로 보면 이득", "text": "새끼가 먹이를 필요로 하는 때가 오면 바로 그 숲이 더 쉬운 채집물을 준다"}], "short_title": "36번 · 미래의 새끼를 위한 자리", "lead": "지금 먹이가 적은 나무를 고르는 새의 선택은 정말 불리할까?", "image": "../../assets/g2-36-warbler-future.webp", "image_alt": "먹이가 더 많아 보이는 흰 가문비나무 옆에서 붉은 가문비나무의 둥지와 새끼에게 먹이를 나르는 검은목녹색솔새", "image_caption": "솔새는 현재 먹이보다 나중에 새끼가 먹기 쉬운 환경을 먼저 내다보고 둥지 영역을 고른다.", "before_question": "솔새가 초여름에 붉은 가문비나무를 고르는 까닭은?", "prediction_choices": ["지금 당장 먹이가 가장 많아서", "나중에 새끼를 먹일 때 더 쉬운 먹이를 주어서", "포식자가 전혀 없어서"], "prediction_actual": "현재 먹이는 적어도 새끼가 배고플 때 붉은 가문비나무 숲이 더 쉬운 먹이를 제공한다.", "blocking_vocab": [{"word": "foraging", "meaning": "먹이 찾기"}, {"word": "determinant", "meaning": "결정 요인"}, {"word": "anticipate", "meaning": "미리 내다보다"}, {"word": "preferentially", "meaning": "우선적으로"}, {"word": "easy pickings", "meaning": "쉽게 얻을 수 있는 먹이"}], "visual_links": [{"label": "환경 선택 능력", "refs": [1, 2]}, {"label": "현재 먹이는 적음", "refs": [3]}, {"label": "미래 양육에는 유리", "refs": [4, 5]}], "core_check": {"q": "솔새의 환경 선택이 보여 주는 것은?", "choices": ["동물은 현재뿐 아니라 미래의 필요에 맞는 장소도 고를 수 있다.", "동물은 언제나 현재 먹이  해주는 언어적 상호작용의 다양한 패턴과 양식을 배운다."}, {"n": 3, "en": "They develop a culture-specific communication style that is, for example, direct and explicit in individualistic cultures or indirect and implicit in collectivistic cultures.", "ko": "그들은 문화 특유의 의사소통 양식을 발달시키는데, 예를 들어 개인주의 문화에서는 직접적이고 명시적이나, 집단주의 문화에서는 간접적이고 암시적이다."}, {"n": 4, "en": "Examples of words linked with the direct style are categorical words like absolutely, certainly, or positively.", "ko": "직접적인 양식과 연결된 단어의 사례로는 ‘전적으로(absolutely)’, ‘확실히(certainly)’, 또는 ‘분명히(positively)’와 같은 단정적인 단어들이 있다."}, {"n": 5, "en": "By contrast, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably.", "ko": "대조적으로, 상호 의존과 화합이라는 문화적 전제는 집단주의자들이 ‘어쩌면(maybe)’, ‘아마도(perhaps)’, 혹은 ‘그럴지도(probably)’와 같은 표현을 쓰면서 암시적이고 심지어 모호한 어휘 사용으로 스스로를 제한하도록 요구한다."}, {"n": 6, "en": "The English language is the only language in the world that spells I with a capital letter.", "ko": "영어는 전 세계에서 ‘I’를 대문자로 표기하는 유일한 언어이다."}, {"n": 7, "en": "This phenomenon may reflect the fact that the roots of individualism are in England.", "ko": "이러한 현상은 개인주의의 뿌리가 잉글랜드에 있다는 사실을 반영하는 것일 수도 있다."}, {"n": 8, "en": "There is no Japanese equivalent for the English I.", "ko": "영어의 ‘I’에 상응하는 일본어 표현은 존재하지 않는다."}, {"n": 9, "en": "Different words are used to refer to the self, depending on the social situation, the speaker’s gender, age, and the other social attributes relative to the listener.", "ko": "사회적 상황, 화자의 성별과 나이, 그리고 청자에 대한 여타의 사회적 속성들에 따라 각기 다른 단어들이 자신을 지칭하는 데 사용된다."}], "core": "아이들은 문화 특유의 의사소통 양식을 배우고, 대문자 I 조차 그 문화를 비춘다.", "flow": [{"label": "주장", "sentences": "S1-2", "text": "언어는 문화의 발현이며 아이들은 언어가 아니라 상호작용의 양식을 배운다", "refs": [1, 2]}, {"label": "가름", "sentences": "S3", "text": "글은 개인주의 문화의 직접·명시적 표현과 집단주의 문화의 간접·암시적 표현 경향을 비교한다", "refs": [3]}, {"label": "보기1", "sentences": "S4", "text": "직접적인 쪽은 「전적으로·확실히」 같은 단정적인 낱말을 쓴다", "refs": [4] , "refs": [8, 9]}], "supplement": [{"title": "language per se", "text": "‘언어 그 자체’라는 뜻이다. 글은 아이들이 고립된 언어보다 실제 상호작용 양식을 배운다고 강조한다."}, {"title": "I의 사례", "text": "자기를 가리키는 가장 기본적인 말에도 개인주의·관계 중심 문화의 차이가 비칠 수 있음을 보여 준다."}], "learning_visual": {"layout": "compare-examples", "preview_title": "같은 뜻도 문화에 따라 어떻게 말할까?", "preview_caption": "표현 방식의 대비를 보되, 모든 개인이 한쪽 방식만 쓴다는 뜻으로 읽지 않는다.", "preview_items": [{"label": "직접 말하기", "text": "분명하게 확신을 드러낸다", "refs": [3, 4]}, {"label": "간접 말하기", "text": "상황과 관계를 고려해 여지를 둔다", "refs": [3, 5]}], "title": "아이들이 배우는 것은 단어만이 아니라 말하는 방식", "items": [{"label": "개인주의 문화의 예", "text": "직접·명시적 표현: absolutely, certainly", "refs": [3, 4]}, {"label": "집단주의 문화의 예", "text": "간접·암시적 표현: maybe, perhaps", "refs": [3, 5]}, {"label": "영어의 예", "text": "글은 대문자 I를 개인주의와 연결해 해석한다", "refs": [6, 7]}, {"label": "일본어의 예", "text": "자기 지칭이 상대와 상황에 따라 달라진다", "refs": [8, 9]}], "takeaway": "언어 습득은 상황에 맞게 소통하는 문화적 양식을 배우는 과정이라는 주장이다(S1~2)."}}, {"id": "q38", "index_numbers": ["38"], "source_label": "2026년 9월 고2 · 38번", "sentences": [{"n": 1, "en": "Environmental psychologists make a distinction between the physical measurement of density (how many people are in a particular space) and crowding (the psychological feeling of not having enough space).", "ko": "환경심리학자들은 밀도(특정 장소에 얼마나 많은 사람들이 있는가)의 물리적 측정과 혼잡성(공간이 충분치 않다는 심리적 감정)을 구분한다."}, {"n": 2, "en": "Usually, high density is needed for the phenomenon of crowding, which makes people experience sensory overload, a lack of control, and rising stress and anxiety.", "ko": "대개 혼잡 현상이 나타나려면 높은 밀도가 필요하며, 혼잡 현상은 사람들이 감각적 과부하, 통제력의 결여, 증가하는 스트레스와 불안을 경험하게 한다."}, {"n": 3, "en": "However, some psychologists see crowding as neutral rather than invariably negative, and believe that people’s moods and behaviors intensify as density increases.", "ko": "하지만 몇몇 심리학자들은 혼잡성을 변함없이 부정적인 것으로 보기보다 중립적으로 보고, 밀도가 올라감에 따라 사람들의 기분과 행동도 강화된다는 것을 믿는다."}, {"n": 4, "en": "So if an individual is looking forward to a concert, say, the feeling of crowding enhances their enjoyment of the performance.", "ko": "그래서, 예를 들어, 한 개인이 콘서트를 기대하고 있다면, 혼잡성의 느낌은 공연의 즐거움을 높인다."}, {"n": 5, "en": "But if they are dreading an event, crowding will make the person’s experience of it even worse.", "ko": "그러나 만약 그들이 행사를 두려워하고 있다면, 혼잡성은 개인의 그것을 겪는 경험을 훨씬 더 나쁘게 만들 것이다."}, {"n": 6, "en": "Put into a community setting, crowding may accentuate the dominant behavior ― an aggressive group may turn violent as density rises.", "ko": "공동체 환경에 넣어보면, 혼잡성은 지배적 행동을 두드러지게 하는데, 공격적인 집단이 밀도가 올라감에 따라 폭력적으로 될 수 있다."}, {"n": 7, "en": "Conversely, creating positive social spaces such as parks and pedestrian areas in high-density urban environments may help to lift the general mood and defuse tension.", "ko": "반대로 인구 밀도가 높은 도시 환경에 공원이나 보행 구역과 같은 긍정적인 사회적 공간을 조성하는 것은 전반적인 기분을 좋게 하고 긴장감을 완화하는 데 도움이 될 수 있다."}], "core": "혼잡성은 그 자체로 나쁜 것이 아니라 그 자리에 있던 기분을 키우는 증폭기다.", "flow": [{"label": "구분", "sentences": "S1", "text": "물리적 밀도와 심리적 혼잡성은 다른 것이다", "refs": [1]}, {"label": "통설", "sentences": "S2", "text": "대개 높은 밀도에서 혼잡이 일어나 과부하와 스트레스를 낳는다", "refs": [2]}, {"label": "뒤집기", "sentences": "S3", "text": "몇몇은 혼잡성을 중립으로 보고 기분과 행동이 강화될 뿐이라고 믿는다", "refs": [3]}, {"label": "보기", "sentences": "S4-5", "text": "기대하던 공연에서는 즐거움이 커지고, 두려운 행사에서는 더 나빠진다", "refs": [4, 5]}, {"label": "적용", "sentences": "S6-7", "text": "집단에서는 지배적 행동이 도드라지고, 좋은 공간은 기분을 올리고 긴장을 푼다", "refs": [6, 7]}], "structure": [{"title": "통설 — 혼잡은 나쁘다", "text": "과부하·통제 결여·스트레스와 불안을 낳는다"}, {"title": "반론 — 혼잡은 증폭기다", "text": "이미 있던 기분을 키울 뿐이므로 좋은 공간을 만들면 오히려 기분이 올라간다"}], "short_title": "38번 · 혼잡은 감정의 증폭기", "lead": "사람이 많은 곳은 언제나 불쾌할까?", "image": "../../assets/g2-38-crowding-amplifier.webp", "image_alt": "같은 붐비는 콘서트 군중 속에서 한 사람은 더 즐거워하고 다른 사람은 더 불안해하는 장면", "image_caption": "같은 높은 밀도도 이미 기대하던 사람의 즐거움은 키우고, 두려워하던 사람의 불편은 더 크게 만든다.", "before_question": "일부 심리학자가 crowding을 중립적이라고 보는 이유는?", "prediction_choices": ["사람 수와 무관하기 때문에", "이미 있던 기분과 행동을 더 강하게 만들기 때문에", "언제나 긍정적 감정만 만들기 때문에"], "prediction_actual": "혼잡은 그 자체로 선악이 아니라 이미 있던 기분과 행동을 강화한다.", "blocking_vocab": [{"word": "density", "meaning": "물리적 밀도"}, {"word": "crowding", "meaning": "공간 부족을 느끼는 심리적 혼잡"}, {"word": "sensory overload", "meaning": "감각 과부하"}, {"word": "intensify", "meaning": "강화하다"}, {"word": "defuse tension", "meaning": "긴장을 완화하다"}], "visual_links": [{"label": "밀도와 혼잡의 구분", "refs": [1, 2]}, {"label": "좋은 기분도 나쁜 기분도 강화", "refs": [3, 4, 5, 6]}, {"label": "긍정 공간의 완충", "refs": [7]}], "core_check": {"q": "crowding에 대한 글의 핵심 관점은?", "choices": ["기존 감정과 행동을 강화하는 중립적 증폭기로 볼 수 있다.", "높은 밀도는 언제나 같은 부정적 반응만 만든다.", "공원과 보행 공간은 도시의 긴장을 반드시 키운다."], "answer": 0, "why": "S3~7이 혼잡의 중립성과 긍정·부정 감정의 증폭 사례를 제시한다.", "refs": [3, 4, 5, 6, 7]}, "precision": [{"type": "근거·구분", "q": "density와 crowding의 차이는?", "choices": ["density는 사람 수의 물리적 측정, crowding은 공간 부족의 심리적 느낌", "둘은 완전히 같은 말", "crowding만 물리적 측정"], "answer": 0, "why": "S1이 두 개념을 직접 구분한다.", "refs": [1]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Crowding can increase enjoyment when a person already anticipates a concert positively.", "Crowding always reduces enjoyment regardless of prior mood."], "answer": 0, "why": "S4가 콘서트를 기대하는 사람의 즐거움이 혼잡으로 커지는 예를 든다.", "refs": [4]}], "supplement": [{"title": "density ≠ crowding", "text": "사람이 많다는 객관적 상태와 공간이 부족하다고 느끼는 주관적 상태를 구분해야 한다."}, {"title": "neutral의 의미", "text": "아무 효과가 없다는 뜻이 아니라, 방향은 기존 기분에 달리고 강도만 키운다는 뜻이다."}], "learning_visual": {"layout": "fork-response", "preview_mode": "image", "preview_title": "사람이 많으면 반드시 불쾌할까?", "preview_caption": "사람 수와 공간에 대한 느낌을 구분해서 읽어보자.", "preview_items": [{"label": "밀도", "text": "일정 공간 안의 사람 수", "refs": [1]}, {"label": "혼잡감", "text": "공간이 부족하다고 느끼는 마음", "refs": [1]}], "title": "같은 혼잡도, 기존 기분에 따라 다른 결과", "items": [{"label": "공통 조건", "text": "밀도가 높아지면 기분과 행동이 강해질 수 있다", "refs": [2, 3]}, {"label": "기대하는 공연", "text": "혼잡함이 즐거움을 더 크게 만든다", "refs": [4]}, {"label": "꺼리는 사건", "text": "혼잡함이 불쾌한 경험을 더 악화시킨다", "refs": [5, 6]}, {"label": "공간 설계", "text": "긍정적 공공 공간은 분위기를 높이고 긴장을 낮출 수 있다", "refs": [7]}], "takeaway": "혼잡을 언제나 나쁜 원인으로 외우지 말자. 글은 사람의 원래 기분을 증폭할 수 있다고 설명한다."}}, {"id": "q39", "index_numbers": ["39"], "source_label": "2026년 9월 고2 · 39번", "sentences": [{"n": 1, "en": "Exclusion is a state that is ignored by the organization psychologists.", "ko": "배제는 조직 심리학자들에 의해 간과되는 상태이다."}, {"n": 2, "en": "Therefore, it is possible that precautions regarding organizational exclusion are not taken.", "ko": "따라서 조직 배제에 관한 예방 조치가 취해지지 않을 가능성이 있다."}, {"n": 3, "en": "Individuals react to organizational exclusion by trying to strengthen their basic needs, which are threatened.", "ko": "개인들은 위협 받는 그들의 기본적인 욕구를 강화하려고 노력함으로써 조직 배제에 반응한다."}, {"n": 4, "en": "Positive social behaviors develop belonging and self-respect.", "ko": "긍정적인 사회적 행동은 소속감과 자기 존중을 발달시킨다."}, {"n": 5, "en": "The likelihood that individuals who try to adapt to positive social behaviors will experience organizational exclusion decreases.", "ko": "긍정적인 사회적 행동에 적응하려고 노력하는 개인들이 조직 배제를 경험할 가능성은 낮아진다."}, {"n": 6, "en": "However, individuals may be faced with more exclusion when they cannot adapt to a group.", "ko": "그러나, 개인들이 집단에 적응하지 못할 때 그들은 더 많은 배제를 직면하게 될 수도 있다."}, {"n": 7, "en": "When excluded individuals grow away from communication and social activities, their contribution to the organization they are in may decrease.", "ko": "배제된 개인들이 의사소통 및 사회 활동과 멀어질 때, 그들이 속한 조직에 대한 기여도는 감소할 수도 있다."}, {"n": 8, "en": "When this situation is not avoided, exclusion increases even more and strongly affects the performance of the employee in a negative way.", "ko": "이러한 상황을 피하지 못할 경우, 배제는 훨씬 더 늘어나고 직원 성과에 부정적인 방식으로 강하게 영향을 미친다."}, {"n": 9, "en": "Precautions need to be taken regarding organizational exclusion, which is very important for business.", "ko": "조직 배제에 관한 예방 조치는 취해져야 할 필요가 있는데, 이는 업무에서 매우 중요하다."}], "core": "간과되어 온 조직 배제는 스스로를 키워 기여와 성과를 떨어뜨린다.", "flow": [{"label": "간과", "sentences": "S1-2", "text": "배제는 조직 심리학자들이 간과해 온 상태여서 예방 조치가 없을 수 있다", "refs": [1, 2]}, {"label": "반응", "sentences": "S3", "text": "개인은 위협받는 기본 욕구를 되세우려 애쓰며

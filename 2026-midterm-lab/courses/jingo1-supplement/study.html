.diagram{overflow:hidden}
.diagram-items{counter-reset:visual-step}
.diagram-card{box-shadow:0 2px 0 rgba(13,76,57,.04)}
.diagram-card b{line-height:1.35}

/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;
  border-left:3px solid #68aa91;margin-left:14px;padding-left:25px}
.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card{position:relative;counter-increment:visual-step}
.diagram.diagram-steps .diagram-card:before,.diagram.diagram-timeline .diagram-card:before,
.diagram.diagram-cycle .diagram-card:before{content:counter(visual-step);position:absolute;left:-47px;top:10px;
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:#176b52;color:#fff;font-size:12px;font-weight:800;border:3px solid #f0f6ef}
.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after{
  content:'↓';position:absolute;left:-39px;bottom:-26px;margin:0;padding:0 2px;
  color:#176b52;background:#f0f6ef;line-height:1.2;font-size:17px;font-weight:800}
.diagram.diagram-cycle .diagram-items:after{content:'↶ 반복되는 해석';font-size:12px;color:#176b52;
  font-weight:750;margin:-13px 0 0 4px}
/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.diagram.diagram-condition .diagram-card:first-child,.diagram.diagram-branches .diagram-card:first-child{
  grid-column:1/-1;background:#dceee5;border-color:#82baa2;position:relative}
.diagram.diagram-condition .diagram-card:first-child:after,.diagram.diagram-branches .diagram-card:first-child:after{
  content:'↙                 ↘';position:absolute;bottom:-25px;left:0;right:0;text-align:center;
  color:#176b52;font-size:18px;font-weight:900;white-space:pre}
.diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.diagram.diagram-compare .diagram-card,.diagram.diagram-cases .diagram-card{
  border-top:5px solid #1b795c;background:linear-gradient(180deg,#f9fffb,#fff 48%)}
.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}
.diagram.diagram-web .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-web .diagram-card{border-radius:20px;border:2px solid #a4cab4;text-align:center}
.diagram.diagram-web .diagram-card:first-child{grid-column:1/-1;justify-self:center;width:min(100%,360px);
  background:#dceee5;border-color:#498f6e;border-radius:100px;position:relative}
.diagram.diagram-web .diagram-card:first-child:after{content:'↙                         ↘';
  position:absolute;left:0;right:0;bottom:-28px;color:#176b52;font-weight:900;white-space:pre}
.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;padding-top:23px}
.diagram.diagram-dose .diagram-items:before{content:'';position:absolute;top:10px;left:10%;right:10%;height:5px;
  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}
.diagram.diagram-dose .diagram-card:before{content:'';position:absolute;top:-23px;left:calc(50% - 7px);
  width:14px;height:14px;border-radius:50%;background:#176b52;border:3px solid #f0f6ef}
.diagram.diagram-dose .diagram-card:nth-child(2){background:#dceee5;border-color:#82baa2}

<script id="course-data" type="application/json">{"course":"진주고1","units":[{"id":"light09-10","label":"9강 게이트웨이·4번 / 10강 게이트웨이·3번","scope":"","passages":[{"id":"light09-10-01","unit":"light09-10","number":1,"title":"9강 Gateway · p56","sentences":[{"n":1,"en":"We all like to think of ourselves as rational actors, careful and considered in our thinking, capable of sound and reliable judgments.","ko":"우리는 모두 자신을 신중하고 사려 깊이 생각하며 타당하고 신뢰할 수 있는 판단을 내릴 수 있는 합리적인 행위자라고 여기기를 좋아한다.","role":"자화상 놓기 — 우리가 스스로를 합리적이라 여긴다고 먼저 깐다."},{"n":2,"en":"We might believe that we generally consider different points of view and make informed decisions.","ko":"우리는 우리가 일반적으로 다양한 관점을 고려하고 정보에 입각한 결정을 내린다고 믿을지도 모른다.","role":"부연 — 여러 관점을 살펴 결정한다고 믿는다며 덧붙인다."},{"n":3,"en":"We are, in fact, \"predictably irrational,\" as psychologist Dan Ariely titled his book on the topic.","ko":"사실, 우리는 심리학자 Dan Ariely가 이 주제에 관해 자신의 책에 제목을 붙였듯이 '예측할 수 있게 비합리적'이다.","role":"뒤집기 — 실은 예측 가능하게 비합리적이라고 책을 들어 꺾는다."},{"n":4,"en":"All of us engage in automatic, reflexive thinking, typically taking the easier path and conserving mental effort.","ko":"우리는 모두 자동적이고 반사적인 사고를 하며, 일반적으로 더 쉬운 길을 택하고 정신적 노력을 아낀다.","role":"까닭 대기 — 쉬운 길을 골라 정신의 힘을 아낀다고 푼다."},{"n":5,"en":"Although we each may have the subjective impression that we are careful thinkers, we often make snap judgments or no real judgments at all.","ko":"우리는 각자 자신이 신중하게 생각한다는 주관적인 인상을 가질 수도 있지만, 흔히 성급한 판단을 내리거나 실질적인 판단을 전혀 하지 않는다.","role":"대비 — 신중하다는 느낌과 달리 성급히 판단한다고 맞세운다."},{"n":6,"en":"In addition, numerous biases inhibit or override reflective, deliberative thought; intuitive theories can also interfere with acceptance of accurate scientific explanations.","ko":"게다가, 수많은 편향이 사려 깊고 신중한 사고를 억제하거나 무시하는데, 직관적인 이론도 정확한 과학적 설명의 수용을 방해할 수 있다.","role":"보태기 — 편향과 직관 이론이 신중한 사고를 막는다고 잇는다."},{"n":7,"en":"Understanding more about how our minds work and how biases may operate can make us each less subject to fallacious reasoning, more rational, and more aware of the problems in others' thinking.","ko":"우리의 마음이 어떻게 작용하고 편향이 어떻게 작동할 수도 있는지 더 많이 이해하는 것은 우리 각자가 잘못된 추론에 덜 빠지고, 더 합리적이며, 다른 사람의 사고의 문제점을 더 잘 인식하게 할 수 있다.","role":"이득 ① — 마음의 작동을 알면 덜 그르치게 된다고 돌린다."},{"n":8,"en":"Learning to understand the built-in limitations of our mental processes can also help us improve our ability to inform others more effectively.","ko":"우리의 정신 과정에 내재한 한계을 이해하는 법을 배우는 것은 우리가 다른 사람들에게 더 효과적으로 정보를 전달하는 능력을 향상하는 데 또한 도움이 될 수 있다.","role":"이득 ② — 남에게 잘 전달하는 힘도 는다며 맺는다."}],"core":"우리는 스스로 합리적이라 여기지만 실은 예측 가능하게 비합리적이며, 그 작동을 알수록 나아진다.","flow":[{"label":"통념","sentences":"S1-2","text":"우리는 자신을 신중하고 정보에 밝은 합리적 행위자라 여긴다","refs":[1,2]},{"label":"반박","sentences":"S3","text":"사실 우리는 「예측할 수 있게 비합리적」이다","refs":[3]},{"label":"근거","sentences":"S4-5","text":"자동적·반사적 사고로 쉬운 길을 택하고 성급한 판단을 내린다","refs":[4,5]},{"label":"전개","sentences":"S6","text":"수많은 편향이 신중한 사고를 억누르고 직관적 이론이 과학을 가로막는다","refs":[6]},{"label":"결론","sentences":"S7-8","text":"마음의 작동과 한계를 이해하면 더 합리적이 되고 전달도 잘하게 된다","refs":[7,8]}],"structure":[{"title":"믿는 나 — 합리적 행위자","text":"다양한 관점을 살피고 정보에 입각한 결정을 내린다고 여긴다"},{"title":"실제의 나 — 예측 가능한 비합리","text":"자동적 사고로 노력을 아끼고 성급하게 판단하며 편향에 눌린다"}],"key_sentence_en":"Understanding cognitive biases helps people reason and communicate more rationally.","diagram":{"kind":"compare","title":"스스로 믿는 사고와 실제 사고","items":[{"head":"나는 신중하고 합리적","body":"여러 관점을 살펴 신중하게 결정한다고 믿음","refs":[1,2]},{"head":"자동 사고·편향이 개입","body":"자동 사고와 편향 때문에 성급히 판단하기 쉬움","refs":[3,4,5,6]}],"takeaway":"우리는 스스로 합리적이라 여기지만 실은 예측 가능하게 비합리적이며, 그 작동을 알수록 나아진다."},"easy_story":"우리는 여러 면을 따져 합리적으로 결정한다고 생각합니다. 그런데 실제 생각에는 습관처럼 작동하는 편향이 끼어들 수 있어요. 이 비합리성이 일정한 방식으로 나타난다는 걸 알면, 자기 판단을 더 잘 점검할 수 있다는 글입니다.","blocking_vocab":[{"word":"predictably","meaning":"예측 가능하게"},{"word":"irrational","meaning":"비합리적인"},{"word":"biases","meaning":"편향들"}],"checks":[{"type":"핵심","q":"두 주장 중 글의 핵심과 일치하는 것은?","choices":["사람은 늘 완전히 합리적으로 판단하므로 자신의 편향을 살필 필요가 없다.","우리는 스스로 합리적이라 여기지만 실은 예측 가능하게 비합리적이며, 그 작동을 알수록 나아진다."],"answer":1,"why":"우리는 스스로 합리적이라 여기지만 실은 예측 가능하게 비합리적이며, 그 작동을 알수록 나아진다. 원문 근거를 아래 S번호에서 다시 확인하세요.","refs":[1,2,3,4,5,6,7,8]},{"type":"근거 확인","q":"사람의 실제 사고에는 무엇이 개입할 수 있는가?","choices":["자동 사고와 편향이다.","언제나 완벽한 논리만이다."],"answer":0,"why":"자동 사고와 편향 때문에 성급히 판단하기 쉬움","refs":[3,4,5,6]},{"type":"원문 변형 탐지","q":"이 지문에 실제로 나오는 영어 문장은?","choices":["We might believe that we generally consider only one point of view and make informed decisions.","We might believe that we generally consider different points of view and make informed decisions."],"answer":1,"why":"단어와 논리의 방향을 영어 원문과 직접 대조하세요.","refs":[2]}]},{"id":"light09-10-02","unit":"light09-10","number":2,"title":"9강 4번 · p61","sentences":[{"n":1,"en":"'Free play' teaches an awareness of space and the confidence to move about in it, important skills that are fundamental to navigation and wayfinding.","ko":"'자유 놀이'는 공간 인식과 그 안에서 움직일 수 있는 자신감을 가르치는데, 위치 탐색과 길 찾기의 기본적인 중요한 기술이다.","role":"주장 세우기 — 자유 놀이가 공간 감각과 자신감을 준다고 연다."},{"n":2,"en":"Research shows that children who are allowed to roam free have a better sense of their surroundings, and a better sense of direction.","ko":"연구는 자유롭게 돌아다니는 것이 허용되는 아이들은 주변 환경에 대한 더 좋은 감각과 더 나은 방향 감각을 가진다는 것을 보여준다.","role":"근거 — 마음껏 다닌 아이가 방향 감각이 낫다는 연구를 든다."},{"n":3,"en":"This may explain why people who grow up in rural areas tend to be better navigators than those who grow up in cities.","ko":"이는 시골에서 자란 사람들이 도시에서 자란 사람들보다 길을 더 잘 찾는 경향이 있는 이유를 설명할 수도 있다.","role":"적용 — 시골에서 자란 이가 길을 잘 찾는 까닭이라 잇는다."},{"n":4,"en":"One study found that nine-year-olds who regularly cycle around their home towns are able to sketch them in greater detail than those who don't.","ko":"한 연구는 자주 자전거를 타고 자신이 사는 시내를 돌아다니는 9세 어린이가 그러지 않는 어린이들보다 그곳을 더 자세하게 그릴 수 있다는 것을 알아냈다.","role":"연구 ① — 자전거로 도는 아홉 살이 동네를 더 자세히 그린다고 든다."},{"n":5,"en":"This suggests an advanced level of spatial cognition for their age.","ko":"이는 그들의 나이에 비해 뛰어난 공간 인지 능력을 시사한다.","role":"해석 — 나이에 견줘 뛰어난 공간 인지라고 뜻을 풀어 준다."},{"n":6,"en":"Others have shown that eleven-year-olds who make their own way to school can draw more accurate maps of their local area than their peers who are accompanied by an adult or travel by car.","ko":"또 다른 연구는 스스로 통학하는 11세 어린이가 성인이 동행하거나 자동차로 이동하는 또래보다 자신이 사는 지역의 지도를 더 정확하게 그릴 수 있음을 보여주었다.","role":"연구 ② — 혼자 통학하는 열한 살이 더 정확한 지도를 그린다고 잇는다."},{"n":7,"en":"This is the difference between active and passive learning: children who are driven everywhere never get the opportunity to make their own decisions or draw their own maps.","ko":"이것이 능동적 학습과 수동적 학습의 차이인데, 어디든 차로 이동하는 아이들은 그들 스스로 결정을 내리거나 그들 자신의 지도를 그릴 기회를 한 번도 갖지 못한다.","role":"갈래 짓기 — 이것이 능동과 수동 학습의 차이라고 이름을 붙인다."},{"n":8,"en":"They cease being explorers.","ko":"그들은 탐험가가 되기를 멈춘다.","role":"한마디로 맺기 — 그 아이들은 탐험가이기를 그만둔다고 못 박는다."}],"core":"스스로 돌아다녀 본 아이일수록 공간을 더 잘 알고 길을 더 잘 찾는다.","flow":[{"label":"주제","sentences":"S1-2","text":"자유 놀이는 공간 인식과 자신감을 길러 길 찾기의 바탕이 된다","refs":[1,2]},{"label":"부연","sentences":"S3","text":"시골에서 자란 사람이 길을 더 잘 찾는 까닭도 여기 있을 수 있다","refs":[3]},{"label":"근거","sentences":"S4-5","text":"자전거로 동네를 도는 아홉 살은 시내를 더 자세히 그려 낸다","refs":[4,5]},{"label":"근거","sentences":"S6","text":"혼자 등교하는 열한 살은 동네 지도를 또래보다 정확히 그린다","refs":[6]},{"label":"결론","sentences":"S7-8","text":"이것이 능동과 수동의 차이이고 차로만 다니면 탐험가이기를 그만둔다","refs":[7,8]}],"structure":[{"title":"능동 — 스스로 다닌 아이","text":"자전거로 돌고 혼자 등교하며 스스로 결정하고 지도를 그린다"},{"title":"수동 — 태워 다닌 아이","text":"어른이 동행하거나 차로만 다녀 결정할 기회도 지도도 갖지 못한다"}],"key_sentence_en":"Independent movement helps children develop spatial awareness and wayfinding skills.","diagram":{"kind":"compare","title":"공간을 아는 두 방식","items":[{"head":"직접 걷고 탐색함","body":"걷고 자전거를 타며 길을 스스로 결정함","refs":[1,2,4,5,6]},{"head":"차 안에서 수동 이동","body":"차에 실려 다니면 길을 스스로 익힐 기회가 줄어듦","refs":[7,8]}],"takeaway":"스스로 돌아다녀 본 아이일수록 공간을 더 잘 알고 길을 더 잘 찾는다."},"easy_story":"동네를 직접 다니는 아이는 갈림길마다 방향을 고르고 주변을 살핍니다. 그러면서 머릿속에 동네 지도가 만들어져요. 늘 차에 타고 이동하는 아이는 그런 결정을 할 기회가 적습니다. 그래서 직접 이동한 아이가 동네 지도를 더 자세하고 정확하게 그릴 수 있다는 연구를 소개합니다.","image":"../../assets/jingo1-light09-10-02-active-wayfinding.webp","image_alt":"같은 아이가 왼쪽에서는 동네를 스스로 걸으며 주변을 살피고, 오른쪽에서는 자동차 뒷좌석에 앉아 이동한다.","image_caption":"S1~2·4·6~8: 스스로 길을 찾으며 이동하는 경험과 차를 타고 수동적으로 이동하는 경험을 대비한 개념 삽화입니다. 연구의 정확한 측정 결과를 그림으로 나타낸 것은 아닙니다.","blocking_vocab":[{"word":"wayfinding","meaning":"길 찾기"},{"word":"navigation","meaning":"길 찾기·항법"},{"word":"surroundings","meaning":"주변 환경"}],"checks":[{"type":"핵심","q":"두 주장 중 글의 핵심과 일치하는 것은?","choices":["동네를 직접 돌아다니는 것보다 차에만 타고 다니는 편이 길을 더 잘 배우게 한다.","스스로 돌아다녀 본 아이일수록 공간을 더 잘 알고 길을 더 잘 찾는다."],"answer":1,"why":"스스로 돌아다녀 본 아이일수록 공간을 더 잘 알고 길을 더 잘 찾는다. 원문 근거를 아래 S번호에서 다시 확인하세요.","refs":[1,2,3,4,5,6,7,8]},{"type":"근거 확인","q":"차에만 타고 다니면 놓치기 쉬운 것은?","choices":["수동 이동만으로 얻는 모든 공간 경험이다.","스스로 길을 정하고 지도를 그릴 기회다."],"answer":1,"why":"차에 실려 다니면 길을 스스로 익힐 기회가 줄어듦","refs":[7,8]},{"type":"원문 변형 탐지","q":"이 지문에 실제로 나오는 영어 문장은?","choices":["Others have shown that eleven-year-olds who make their own way to school cannot draw more accurate maps of their local area than their peers who are accompanied by an adult or travel by car.","Others have shown that eleven-year-olds who make their own way to school can draw more accurate maps of their local area than their peers who are accompanied by an adult or travel by car."],"answer":1,"why":"단어와 논리의 방향을 영어 원문과 직접 대조하세요.","refs":[6]}]},{"id":"light09-10-03","unit":"light09-10","number":3,"title":"10강 Gateway · p62","sentences":[{"n":1,"en":"There has been a lot of discussion on why moths are attracted to light.","ko":"나방이 왜 빛에 끌리는지에 관한 많은 논의가 있어 왔다.","role":"화제 열기 — 나방이 왜 빛에 끌리는지 논의가 많았다고 연다."},{"n":2,"en":"The consensus seems to hold that moths are not so much attracted to lights as they are trapped by them.","ko":"나방이 빛에 끌리는 것이 아니라 빛에 의해 갇힌다는 것이 합의인 것처럼 보인다.","role":"통설 세우기 — 끌리는 게 아니라 갇히는 것이라 방향을 잡는다."},{"n":3,"en":"The light becomes a sensory overload that disorients the insects and sends them into a holding pattern.","ko":"빛은 감각 과부하를 일으켜 곤충이 방향을 잃게 하고 그것이 제자리를 맴돌게 한다.","role":"작동 설명 — 빛이 감각을 넘치게 해 맴돌게 한다고 푼다."},{"n":4,"en":"A hypothesis called the Mach band theory suggests that moths see a dark area around a light source and head for it to escape the light.","ko":"마하 밴드 이론이라는 가설에 따르면, 나방은 광원 주변의 어두운 영역을 보고 빛을 피하고자 그쪽으로 향한다.","role":"가설 ① — 광원 옆 어두운 자리로 달아난다는 설을 든다."},{"n":5,"en":"Another theory suggests that moths perceive the light coming from a source as a diffuse halo with a dark spot in the center.","ko":"또 다른 이론은 나방이 광원에서 나오는 빛을 중앙에 어두운 점이 있는, 널리 퍼진 광륜(光輪)으로 인식한다는 것을 보여준다.","role":"가설 ② — 빛을 가운데가 어두운 광륜으로 본다는 설을 잇는다."},{"n":6,"en":"The moths, attempting to escape the light, fly toward that imagined \"portal,\" bringing them closer to the source.","ko":"나방은 빛을 피하려고 애쓰면서, 상상 속의 '입구'를 향해 날아가 광원에 더 가까이 다가가게 된다.","role":"결과 — 그 상상 속 입구로 날다 도리어 가까워진다고 푼다."},{"n":7,"en":"As they approach the light, their reference point changes and they circle the light hopelessly trying to reach the portal.","ko":"빛에 가까워지면서 나방의 기준점이 바뀌고 나방은 입구에 도달하기 위해 어쩔 도리 없이 빛 주위를 맴돈다.","role":"고리 닫기 — 기준점이 바뀌어 하염없이 돈다고 매듭짓는다."},{"n":8,"en":"Everyone is familiar with moths circling their porch lights.","ko":"누구나 현관 불빛을 맴도는 나방에 익숙하다.","role":"일상 잇기 — 현관 불빛을 도는 나방은 누구나 안다고 끌어온다."},{"n":9,"en":"Their flight appears to have no purpose, but they are, it is believed, trying to escape the pull of the light.","ko":"나방의 비행은 아무런 목적이 없는 것처럼 보이지만, 그것들은 빛의 끌어당김에서 벗어나려고 애쓰고 있는 것으로 여겨진다.","role":"맺음 — 목적 없어 보여도 빛에서 벗어나려는 몸짓이라 닫는다."}],"core":"나방은 빛에 끌리는 것이 아니라 빛에서 벗어나려다 그 주위를 맴돌게 된다.","flow":[{"label":"물음","sentences":"S1","text":"나방이 왜 빛에 끌리는지에 관한 논의가 오래 이어져 왔다","refs":[1]},{"label":"주제","sentences":"S2-3","text":"끌리는 게 아니라 갇히는 것이며 빛이 감각 과부하로 방향을 잃게 한다","refs":[2,3]},{"label":"가설","sentences":"S4","text":"마하 밴드 이론은 광원 둘레의 어두운 영역으로 향한다고 본다","refs":[4]},{"label":"가설","sentences":"S5-6","text":"또 다른 이론은 광륜 중앙의 어두운 점을 출구로 여겨 더 가까워진다고 본다","refs":[5,6]},{"label":"결론","sentences":"S7-9","text":"다가갈수록 기준점이 바뀌어 맴돌며, 그 비행은 벗어나려는 몸부림이다","refs":[7,8,9]}],"structure":[{"title":"겉으로 보이는 것","text":"나방이 불빛에 이끌려 목적 없이 그 주위를 맴돈다"},{"title":"실제로 일어나는 일","text":"감각 과부하로 갇혀, 상상 속 출구를 찾아 나가려다 기준점이 바뀌어 계속 돈다"}],"key_sentence_en":"Moths circle lights because changing visual reference points trap their flight.","diagram":{"kind":"branches","title":"나방이 빛 주변을 맴도는 두 가설","items":[{"head":"빛이 방향 감각을 흐림","body":"빛의 감각 과부하로 방향을 잃고 맴돎","refs":[1,2,3]},{"head":"어두운 주변부를 향함 · 가설","body":"광원 주변의 어두운 영역을 향함","refs":[4]},{"head":"중앙의 어두운 점을 향함 · 가설","body":"중앙의 가상 어두운 점을 향하다 빛에 가까워짐","refs":[5,6]}],"takeaway":"글은 나방이 빛에 이끌리기보다 갇혀 맴돈다는 설명과 두 가설을 소개한다."},"easy_story":"나방이 불빛 주위를 도는 모습을 보면 빛을 좋아한다고 생각하기 쉬워요. 그런데 글은 그 움직임을 다른 방식으로 설명하는 가설들을 소개합니다. 어두운 곳을 찾으려다가 빛 주변에 머문다는 설명들입니다. 두 가설을 하나의 확정된 과정으로 이어 읽으면 안 됩니다.","blocking_vocab":[{"word":"disorients","meaning":"방향 감각을 잃게 한다"},{"word":"hypothesis","meaning":"가설"},{"word":"circling","meaning":"맴도는"}],"checks":[{"type":"핵심","q":"두 주장 중 글의 핵심과 일치하는 것은?","choices":["나방은 빛에 끌리는 것이 아니라 빛에서 벗어나려다 그 주위를 맴돌게 된다.","글은 나방이 빛 자체를 좋아해서 그 주변에 머문다는 한 가지 설명만 확정한다."],"answer":0,"why":"나방은 빛에 끌리는 것이 아니라 빛에서 벗어나려다 그 주위를 맴돌게 된다. 원문 근거를 아래 S번호에서 다시 확인하세요.","refs":[1,2,3,4,5,6,7,8,9]},{"type":"근거 확인","q":"나방의 움직임을 설명하는 두 설명은 어떤 지위인가?","choices":["서로 다른 가설이다.","모두 확인된 한 과정의 순서다."],"answer":0,"why":"광원 주변의 어두운 영역을 향함 중앙의 가상 어두운 점을 향하다 빛에 가까워짐","refs":[4,5,6]},{"type":"원문 변형 탐지","q":"이 지문에 실제로 나오는 영어 문장은?","choices":["No one is familiar with moths circling their porch lights.","Everyone is familiar with moths circling their porch lights."],"answer":1,"why":"단어와 논리의 방향을 영어 원문과 직접 대조하세요.","refs":[8]}]},{"id":"light09-10-04","unit":"light09-10","number":4,"title":"10강 3번 · p66","sentences":[{"n":1,"en":"Mirror neuron systems help explain a wide range of phenomena, including the human tendency to respond emotionally to other people's expressions of emotions.","ko":"거울 뉴런 체계는 다른 사람의 감정 표현에 감정적으로 반응하는 인간의 경향을 포함하여 다양한 현상을 설명하는 데 도움이 된다.","role":"구실 밝히기 — 거울 뉴런이 감정 전염을 설명해 준다고 연다."},{"n":2,"en":"For example, it is often the case that 'anger is contagious', or that a person's smile can 'light up a room', or that audiences at large pop concerts 'move as one to the music'.","ko":"예를 들어, '분노가 전염된다'거나 사람의 미소가 '방을 환하게 밝힌다'거나 대규모 팝 콘서트의 관객이 '음악에 맞춰 하나가 되어 움직이는' 것은 흔히 일어나는 일이다.","role":"보기 나열 — 분노 전염·미소·콘서트의 하나 됨을 늘어놓는다."},{"n":3,"en":"Mirror neurons are cells within certain high-level body maps that represent actions performed both by oneself and others.","ko":"거울 뉴런은 자신과 타인 둘 다에 의해 수행되는 행동을 나타내는 특정 고차원 신체 지도 내의 세포이다.","role":"뜻풀이 — 나와 남의 행동을 함께 나타내는 세포라 밝힌다."},{"n":4,"en":"We simulate others' movements and emotional expressions 'automatically, without logic, thinking, analyzing'.","ko":"우리는 다른 사람의 움직임과 감정 표현을 '논리, 사고, 분석 없이 무의식적으로' 흉내 낸다.","role":"작동 설명 — 따지지 않고 저절로 흉내 낸다고 푼다."},{"n":5,"en":"Mirror neurons might also explain anthropologist Ruth Finnegan's observation that 'we learn how to feel, and how to deploy particular emotions in ways and contexts appropriate to your situation'.","ko":"거울 뉴런은 또한 '우리는 느끼는 방법, 그리고 상황에 적합한 방식과 맥락으로 특정 감정을 전개하는 방법을 배운다.'라는 인류학자인 Ruth Finnegan의 의견을 설명할 수도 있을 것이다.","role":"넓히기 — 감정을 배워 상황에 맞게 쓴다는 견해까지 잇는다."},{"n":6,"en":"The same holds for musical expressions and experience of happiness, anger and distress.","ko":"음악적 표현과 행복, 분노, 그리고 고통의 경험에도 같은 것이 적용된다.","role":"맺음 — 음악과 감정 경험에도 같다며 범위를 넓혀 닫는다."}],"core":"거울 뉴런은 남의 행동과 감정을 무의식적으로 따라 하게 만들어 감정의 공유를 설명한다.","flow":[{"label":"주제","sentences":"S1","text":"거울 뉴런 체계는 남의 감정 표현에 감정으로 반응하는 경향을 설명한다","refs":[1]},{"label":"예시","sentences":"S2","text":"분노가 전염되고 미소가 방을 밝히며 관객이 하나로 움직인다","refs":[2]},{"label":"정의","sentences":"S3","text":"자신과 타인의 행동을 모두 나타내는 신체 지도 속 세포다","refs":[3]},{"label":"작동","sentences":"S4","text":"우리는 논리나 분석 없이 남의 움직임과 표현을 흉내 낸다","refs":[4]},{"label":"확장","sentences":"S5-6","text":"감정을 상황에 맞게 쓰는 법을 배운다는 관찰과 음악 경험에도 적용된다","refs":[5,6]}],"structure":[{"title":"원인 — 거울 뉴런","text":"자신과 타인의 행동을 함께 나타내는 세포가 남의 움직임을 그대로 켠다"},{"title":"결과 — 감정의 전염","text":"논리 없이 흉내 내어 분노가 옮고 관객이 하나로 움직이며 감정을 배워 쓴다"}],"key_sentence_en":"Mirror neurons help explain unconscious imitation and shared emotional expression.","diagram":{"kind":"web","title":"거울 뉴런이 설명할 수 있는 반응","items":[{"head":"나와 타인의 행동을 함께 나타냄","body":"거울 뉴런은 두 행동을 나타내며 타인의 움직임·표현을 자동으로 모방한다.","refs":[3,4]},{"head":"감정 표현에 반응","body":"분노의 전염, 미소와 관객의 동시 움직임을 설명하는 예다.","refs":[1,2]},{"head":"감정 학습·음악 경험","body":"이 체계가 그런 경험도 설명할 수 있다고 제안한다.","refs":[5,6]}],"takeaway":"세 설명은 차례로 거치는 단계가 아니다. 글은 거울 뉴런의 가능한 적용을 보여 준다."},"easy_story":"다른 사람이 웃거나 화낼 때 나도 비슷한 감정 반응을 보일 수 있어요. 거울 뉴런은 내가 하는 행동과 남이 하는 행동을 함께 나타내는 세포입니다. 글은 우리가 남의 움직임과 감정 표현을 의식적으로 분석하기 전에 따라 할 수 있다고 설명해요. 감정을 배우거나 음악을 경험하는 일도 이 체계로 설명할 수 있다고 봅니다.","blocking_vocab":[{"word":"contagious","meaning":"전염되는"},{"word":"expressions","meaning":"표현들"},{"word":"automatically","meaning":"자동적으로"}],"checks":[{"type":"핵심","q":"두 주장 중 글의 핵심과 일치하는 것은?","choices":["타인의 표정과 행동을 보아도 우리의 행동과 감정에는 아무 변화가 없다.","거울 뉴런은 남의 행동과 감정을 무의식적으로 따라 하게 만들어 감정의 공유를 설명한다."],"answer":1,"why":"거울 뉴런은 남의 행동과 감정을 무의식적으로 따라 하게 만들어 감정의 공유를 설명한다. 원문 근거를 아래 S번호에서 다시 확인하세요.","refs":[1,2,3,4,5,6]},{"type":"근거 확인","q":"타인의 표현을 본 뒤 무의식적으로 일어날 수 있는 것은?","choices":["타인의 행동을 전혀 지각하지 못하는 일이다.","행동을 흉내 내는 일이다."],"answer":1,"why":"거울 뉴런은 두 행동을 나타내며 타인의 움직임·표현을 자동으로 모방한다.","refs":[3,4]},{"type":"원문 변형 탐지","q":"이 지문에 실제로 나오는 영어 문장은?","choices":["For example, it is often the case that 'anger is contagious', or that a person's smile can 'light up a room', or that audiences at large pop concerts 'move as one to the music'.","For example, it is often the case that 'anger is contagious', or that a person's smile cannot 'light up a room', or that audiences at large pop concerts 'move as one to the music'."],"answer":0,"why":"단어와 논리의 방향을 영어 원문과 직접 대조하세요.","refs":[2]}]}]},{"id":"light10-extra","label":"10강 5·7번","scope":"","passages":[{"id":"light10-extra-01","unit":"light10-extra","number":1,"title":"10강 05번","sentences":[{"n":1,"en":"Native American Indians would put on the skins of animals such as deer or buffalo and become one with them, taking on their characteristics as they prepared for the hunt.","ko":"아메리카 원주민들은 사슴이나 들소 같은 동물의 가죽을 몸에 걸치고 사냥을 준비할 때 그 동물의 특성을 취해 그것들과 하나가 되곤 했다.","role":"옛 사례 — 사냥을 앞두고 짐승 가죽을 걸쳐 그 짐승과 하나가 되었다."},{"n":2,"en":"The practice, in a way, exists today in sports with teams such as the Atlanta Falcons, Buffalo Bills, Chicago Bears, Cincinnati Bengals, Detroit Lions, Los Angeles Rams, Miami Dolphins, Philadelphia Eagles, and so on.","ko":"그 관행은 어떤 면에서는 오늘날 스포츠에 존재하는데, 예를 들어 Atlanta Falcons, Buffalo Bills, Chicago Bears, Cincinnati Bengals, Detroit Lions, Los Angeles Rams, Miami Dolphins, Philadelphia Eagles 등과 같은 팀들에서 그러하다.","role":"오늘 사례 ① — 그 관행이 스포츠 팀 이름에 남아 있다."},{"n":3,"en":"The same can be said of the names given to perfumes that women put on: Tabu, Passion, Beautiful, Temptation.","ko":"여성이 사용하는 향수에 붙여진 이름에 대해서도 같은 말을 할 수 있는데, 예를 들면 Tabu, Passion, Beautiful, Temptation 같은 것들이다.","role":"오늘 사례 ② — 향수 이름에도 같은 원리가 있다."},{"n":4,"en":"If a person becomes one with what they \"put on,\" they can assume the characteristics of what is put on — glamour, beauty, risk, danger, strength, power, or whatever.","ko":"사람이 자신이 '걸친'것과 하나가 된다면, 걸쳐진 것의 특성, 즉 화려함, 아름다움, 위험, 강인함, 힘 또는 그 밖의 어떤 것이든 취할 수 있다.","role":"원리 — 걸친 것과 하나가 되면 그것의 특성을 취한다."},{"n":5,"en":"Music is also a \"put on,\" and our body and mind respond to its tempo and rhythm.","ko":"음악 또한 '걸치는' 것이며, 우리의 몸과 마음은 그것의 박자와 리듬에 반응한다.","role":"넓힘 — 음악도 「걸치는」 것이라 몸과 마음이 그 박자에 반응한다."},{"n":6,"en":"In some way, when we put something on, depending on what our needs are, we can try to connect with someone or something else.","ko":"어떤 면에서 우리가 무언가를 걸칠 때, 우리의 필요가 무엇인지에 따라 우리는 누군가 또는 어떤 것과 연결되고자 할 수 있다.","role":"맺음 — 걸치는 일은 필요에 따라 누군가·무언가와 이어지려는 몸짓이다."}],"core":"무언가를 「걸치는」 일은 그 대상의 특성을 빌려 자신을 그것과 잇는 행위다.","flow":[{"label":"옛 사례","sentences":"S1","text":"원주민은 짐승 가죽을 걸쳐 그 짐승과 하나가 되었다","refs":[1]},{"label":"오늘 ①","sentences":"S2","text":"스포츠 팀 이름에 그 관행이 남아 있다","refs":[2]},{"label":"오늘 ②","sentences":"S3","text":"향수 이름도 같은 말을 할 수 있다","refs":[3]},{"label":"원리","sentences":"S4","text":"걸친 것과 하나가 되면 그것의 특성을 취한다","refs":[4]},{"label":"넓힘","sentences":"S5","text":"음악도 「걸치는」 것이라 몸과 마음이 반응한다","refs":[5]},{"label":"맺음","sentences":"S6","text":"필요에 따라 누군가·무언가와 이어지려는 것이다","refs":[6]}],"structure":[{"title":"사례 — 가죽·팀 이름·향수·음악","text":"원주민의 가죽부터 오늘의 팀 이름과 향수, 음악까지 사람은 늘 무언가를 걸친다"},{"title":"원리 — 걸친 것의 특성을 취한다","text":"걸친 것과 하나가 되면 화려함·아름다움·위험·힘 같은 그 특성을 자기 것으로 삼는다"}],"key_sentence_en":"If a person becomes one with what they \"put on,\" they can assume the characteristics of what is put on — glamour, beauty, risk, danger, strength, power, or whatever.","diagram":{"kind":"web","title":"무언가를 ‘걸친다’는 비유","items":[{"head":"대상의 특성을 빌림","body":"걸친 대상과 하나가 되어 그 특징을 얻음","refs":[1,4]},{"head":"동물 가죽·팀 이름·향수","body":"동물 가죽·팀 이름·향수에도 같은 비유 적용","refs":[1,2,3]},{"head":"음악도 몸과 마음에 작용","body":"음악의 템포·리듬에도 몸과 마음이 반응","refs":[5,6]}],"takeaway":"무언가를 「걸치는」 일은 그 대상의 특성을 빌려 자신을 그것과 잇는 행위다."},"easy_story":"무언가를 몸에 걸치는 것은 단지 물건을 얹는 일이 아닐 수 있어요. 동물 가죽, 팀 이름, 향수 같은 예는 그 대상의 성격을 빌려 자신과 잇는 모습을 보여 줍니다. 글은 음악을 접하는 일도 비슷하게 몸과 마음에 작용한다고 넓혀 갑니다.","blocking_vocab":[{"word":"characteristics","meaning":"특성들"},{"word":"perfumes","meaning":"향수들"},{"word":"temptation","meaning":"유혹"}],"checks":[{"type":"핵심","q":"두 주장 중 글의 핵심과 일치하는 것은?","choices":["무언가를 「걸치는」 일은 그 대상의 특성을 빌려 자신을 그것과 잇는 행위다.","무언가를 걸치는 행위는 그 대상의 특성이나 정체성과는 전혀 관련이 없다."],"answer":0,"why":"무언가를 「걸치는」 일은 그 대상의 특성을 빌려 자신을 그것과 잇는 행위다. 원문 근거를 아래 S번호에서 다시 확인하세요.","refs":[1,2,3,4,5,6]},{"type":"근거 확인","q":"‘걸친다’는 비유의 예시로 나오는 것은?","choices":["동물 가죽·팀 이름·향수다.","원문에 없는 항공기 엔진만이다."],"answer":0,"why":"동물 가죽·팀 이름·향수에도 같은 비유 적용","refs":[1,2,3]},{"type":"원문 변형 탐지","q":"이 지문에 실제로 나오는 영어 문장은?","choices":["The same can be said of the names given to perfumes that women put on: Tabu, Passion, Beautiful, Temptation.","The same cannot be said of the names given to perfumes that women put on: Tabu, Passion, Beautiful, Temptation."],"answer":0,"why":"단어와 논리의 방향을 영어 원문과 직접 대조하세요.","refs":[3]}]},{"id":"light10-extra-02","unit":"light10-extra","number":2,"title":"10강 07번","sentences":[{"n":1,"en":"It's possible that myths from diverse cultures share common features because ultimately we all share the same social relationships.","ko":"다양한 문화의 신화가 공통된 특징을 공유하는 것이 가능한 것은 궁극적으로 우리는 모두 같은 사회적 관계를 공유하기 때문이다.","role":"주장 — 문화가 달라도 신화가 닮은 까닭은 같은 사회적 관계다."},{"n":2,"en":"No matter what your background is, it's a sure bet that you have friends and relations you like and acquaintances and enemies you don't.","ko":"여러분의 배경이 무엇이든, 좋아하는 친구와 인연이 있고 그렇지 않은 지인과 적이 있다는 것은 분명한 사실이다.","role":"근거 ① — 배경이 무엇이든 좋아하는 사람과 그렇지 않은 사람이 있다."},{"n":3,"en":"There are top cats and underdogs, 'haves' and 'have-nots', heroes and scoundrels.","ko":"사회적 강자와 약자, '가진 자'와 '못 가진 자', 영웅과 악당이 존재한다.","role":"근거 ② — 어디에나 강자와 약자, 가진 자와 못 가진 자가 있다."},{"n":4,"en":"You fall in love, have babies and mourn one another's death.","ko":"사랑에 빠지고, 아기를 낳고, 서로의 죽음을 슬퍼한다.","role":"근거 ③ — 사랑하고 아이를 낳고 서로의 죽음을 슬퍼한다."},{"n":5,"en":"It doesn't matter if you live in the desert, in the Arctic chill, in a massive city, on the edge of a vast savannah or on a tropical island — fundamentally, you'll have a great deal in common with every other person on the planet.","ko":"여러분이 사막에 살든, 북극의 추위 속에 살든, 대도시에 살든, 광활한 사바나 끝에 살든, 열대 섬에 살든 상관없이 기본적으로 지구상의 다른 모든 사람과 많은 공통점을 가질 것이다.","role":"넓힘 — 사는 곳이 달라도 지구의 모든 사람과 공통점이 많다."},{"n":6,"en":"Naturally, the stories we all tell would reflect these same social forces of love, death, anxiety and competition for resources.","ko":"당연히 우리 모두가 하는 이야기에는 사랑, 죽음, 불안, 자원에 대한 경쟁이라는 이러한 같은 사회적 동력이 반영되어 있을 것이다.","role":"맺음 — 그래서 우리가 하는 이야기에 같은 사회적 동력이 비친다."}],"core":"문화가 달라도 신화가 닮은 것은 사람이 사는 사회적 관계가 어디서나 같기 때문이다.","flow":[{"label":"주장","sentences":"S1","text":"신화가 공통 특징을 갖는 까닭은 같은 사회적 관계다","refs":[1]},{"label":"근거 ①","sentences":"S2","text":"배경이 무엇이든 좋아하는 사람과 아닌 사람이 있다","refs":[2]},{"label":"근거 ②","sentences":"S3","text":"강자와 약자, 가진 자와 못 가진 자가 있다","refs":[3]},{"label":"근거 ③","sentences":"S4","text":"사랑하고, 아이를 낳고, 죽음을 슬퍼한다","refs":[4]},{"label":"넓힘","sentences":"S5","text":"사는 곳이 달라도 공통점이 아주 많다","refs":[5]},{"label":"맺음","sentences":"S6","text":"그래서 우리 이야기에 같은 사회적 동력이 비친다","refs":[6]}],"structure":[{"title":"까닭 — 같은 사회적 관계를 산다","text":"배경과 사는 곳이 달라도 친구와 적, 강자와 약자, 사랑과 죽음을 똑같이 겪는다"},{"title":"결과 — 신화가 닮는다","text":"그래서 문화가 달라도 이야기에는 사랑·죽음·불안·자원 경쟁이라는 같은 동력이 비친다"}],"key_sentence_en":"It's possible that myths from diverse cultures share common features because ultimately we all share the same social relationships.","diagram":{"kind":"web","title":"서로 다른 문화의 신화가 닮는 이유","items":[{"head":"공통된 사회적 관계","body":"문화가 달라도 인간관계에는 공통점이 있음","refs":[1]},{"head":"친구·적 / 강자·약자","body":"친구와 적, 강자와 약자 등의 관계가 공통","refs":[2,3]},{"head":"사랑·출생·죽음","body":"사랑·탄생·죽음의 경험이 이야기에 반영됨","refs":[4,5,6]}],"takeaway":"글은 공통된 사회적 관계가 신화의 유사성을 설명할 수 있다고 본다."},"easy_story":"멀리 떨어진 문화의 신화인데도 비슷한 이야기가 나오는 이유는 뭘까요? 사는 곳은 달라도 사람들은 친구와 적, 강자와 약자, 사랑과 죽음 같은 관계를 겪습니다. 글은 이런 공통된 삶의 관계가 신화의 닮은 모습을 만든다고 설명합니다.","blocking_vocab":[{"word":"acquaintances","meaning":"아는 사람들"},{"word":"underdogs","meaning":"약자들"},{"word":"fundamentally","meaning":"근본적으로"}],"checks":[{"type":"핵심","q":"두 주장 중 글의 핵심과 일치하는 것은?","choices":["문화가 달라도 신화가 닮은 것은 사람이 사는 사회적 관계가 어디서나 같기 때문이다.","문화가 다른 곳의 신화는 인간관계의 공통점이 없으므로 비슷해질 수 없다."],"answer":0,"why":"문화가 달라도 신화가 닮은 것은 사람이 사는 사회적 관계가 어디서나 같기 때문이다. 원문 근거를 아래 S번호에서 다시 확인하세요.","refs":[1,2,3,4,5,6]},{"type":"근거 확인","q":"여러 문화의 신화에서 되풀이되는 관계는?","choices":["친구와 적, 강자와 약자 같은 관계다.","어느 문화에도 없는 단 하나의 관계다."],"answer":0,"why":"친구와 적, 강자와 약자 등의 관계가 공통","refs":[2,3]},{"type":"원문 변형 탐지","q":"이 지문에 실제로 나오는 영어 문장은?","choices":["It's possible that myths from diverse cultures share common features because ultimately we all share no social relationships.","It's possible that myths from diverse cultures share common features because ultimately we all share the same social relationships."],"answer":1,"why":"단어와 논리의 방향을 영어 원문과 직접 대조하세요.","refs":[1]}]}]},{"id":"light11","label":"11강 게이트웨이·1번","scope":"","passages":[{"id":"light11-01","unit":"light11","number":1,"title":"no.01","sentences":[{"n":1,"en":"The writer and zoologist Desmond Morris observed that our feet communicate exactly what we think and feel more honestly than any other part of our bodies.","ko":"작가이자 동물학자인 Desmond Morris는 우리의 발이 우리 몸의 다른 어떤 부분보다도 우리가 생각하고 느끼는 것을 더 정직하게 그대로 전달한다고 말했다.","role":"관찰 제시 — 발이 생각과 감정을 다른 신체 부위보다 정직하게 드러낸다는 관찰을 소개한다."},{"n":2,"en":"Why are the feet and legs such accurate reflectors of our sentiments?","ko":"왜 발과 다리는 우리 감정의 그토록 정확한 반사경인 걸까?","role":"질문 제시 — 발과 다리가 감정을 정확하게 드러내는 이유를 묻는다."},{"n":3,"en":"For millions of years, long before humans spoke, our legs and feet reacted to environmental threats (e.g., hot sand, ill-tempered lions) instantaneously, without the need for conscious thought.","ko":"수백만 년 동안, 인간이 말을 사용하기 오래전에, 우리의 다리와 발은 환경적인 위협(예를 들면, 뜨거운 모래, 성질이 나쁜 사자)에 대해, 의식적 사고에 대한 필요 없이, 즉시 반응했다.","role":"이유 설명 — 발과 다리는 언어가 생기기 전부터 위협에 즉시 반응했다."},{"n":4,"en":"Our limbic brains made sure that our feet and legs reacted as needed by either ceasing motion, running away, or kicking at a potential threat.","ko":"우리의 변연계 뇌는 움직임을 멈추거나, 도망가거나, 혹은 잠재적인 위협을 걷어참으로써 필요에 따라 우리의 발과 다리가 반응하도록 확실히 했다.","role":"작동 원리 — 변연계 뇌는 발과 다리가 위협에 필요한 방식으로 반응하도록 했다."},{"n":5,"en":"This survival regimen, retained from our ancestral heritage, has served us well and continues to do so today.","ko":"이러한 생존 양생법은, 우리 조상의 유산으로부터 유지되었으며, 우리에게 도움이 되어 왔고 오늘날에도 계속 그러하다.","role":"현재와 연결 — 이러한 생존 방식은 지금도 우리에게 도움이 된다."},{"n":6,"en":"In fact, these age-old reactions are still so hardwired in us that when we are presented with something dangerous or even disagreeable, our feet and legs still react as they did in prehistoric times.","ko":"사실, 이러한 오래된 반응은 여전히 우리에게 깊이 내재되어 있어서, 우리가 위험하거나 심지어 불쾌한 어떤 것에 직면할 때, 우리의 발과 다리는 여전히 선사 시대에 그랬던 것처럼 반응한다.","role":"결론 — 오래된 반응이 내재되어 있어 오늘날에도 위협 앞에서 비슷하게 반응한다."}],"core":"발과 다리는 말보다 오래된 생존 반응을 간직해 오늘도 속마음을 가장 정직하게 드러낸다.","flow":[{"label":"관찰","sentences":"S1","text":"발은 몸의 어느 곳보다 정직하게 생각과 감정을 전달한다","refs":[1]},{"label":"질문","sentences":"S2","text":"왜 하필 발과 다리가 그토록 정확한 반사경인가","refs":[2]},{"label":"까닭 ①","sentences":"S3","text":"말이 생기기 훨씬 전부터 위협에 즉시 반응해 왔다","refs":[3]},{"label":"까닭 ②","sentences":"S4","text":"변연계 뇌가 멈추기·달아나기·걷어차기를 시켰다","refs":[4]},{"label":"이음","sentences":"S5","text":"그 생존 방식은 지금까지 도움이 되어 왔다","refs":[5]},{"label":"맺음","sentences":"S6","text":"지금도 위험 앞에서 선사 시대처럼 반응한다","refs":[6]}],"structure":[{"title":"까닭 — 선사 시대의 생존 반응","text":"말이 생기기 전부터 다리와 발이 위협에 즉시 반응하도록 변연계 뇌가 시켰다"},{"title":"결과 — 오늘의 정직한 발","text":"그 반응이 깊이 내재되어 지금도 위험 앞에서 발과 다리가 먼저 움직인다"}],"key_sentence_en":"Our feet and legs keep prehistoric survival reactions, so they reveal feelings most honestly.","diagram":{"kind":"steps","title":"발과 다리에 남은 생존 반응","items":[{"head":"오래된 위협 감지","body":"말이 생기기 전부터 발·다리가 위협에 즉시 반응","refs":[2,3]},{"head":"멈춤·도주·걷어차기","body":"멈추거나 달아나거나 차서 몸을 보호","refs":[4]},{"head":"현재도 감정이 드러남","body":"이 반응이 남아 지금도 감정이 발·다리에 드러남","refs":[1,5,6]}],"takeaway":"발과 다리는 말보다 오래된 생존 반응을 간직해 오늘도 속마음을 가장 정직하게 드러낸다."},"easy_story":"위험을 만나면 몸은 먼저 멈추거나 달아나거나 막으려 합니다. 발과 다리에는 이런 오래된 생존 반응이 남아 있어요. 그래서 말로는 감정을 숨겨도 다리와 발의 움직임에는 마음이 드러날 수 있다는 글입니다.","blocking_vocab":[{"word":"instantaneously","meaning":"즉각적으로"},{"word":"prehistoric","meaning":"선사 시대의"},{"word":"hardwired","meaning":"타고나도록 각인된"}],"checks":[{"type":"핵심","q":"두 주장 중 글의 핵심과 일치하는 것은?","choices":["발과 다리는 말보다 오래된 생존 반응을 간직해 오늘도 속마음을 가장 정직하게 드러낸다.","발과 다리는 생존 반응이나 감정을 드러내지 않는 완전히 무의미한 부위다."],"answer":0,"why":"발과 다리는 말보다 오래된 생존 반응을 간직해 오늘도 속마음을 가장 정직하게 드러낸다. 원문 근거를 아래 S번호에서 다시 확인하세요.","refs":[1,2,3,4,5,6]},{"type":"근거 확인","q":"발과 다리에 남은 오래된 반응은?","choices":["언어로만 나타나는 문법 반응이다.","멈춤·도주·걷어차기 같은 생존 반응이다."],"answer":1,"why":"멈추거나 달아나거나 차서 몸을 보호","refs":[4]},{"type":"원문 변형 탐지","q":"이 지문에 실제로 나오는 영어 문장은?","choices":["The writer and zoologist Desmond Morris observed that our feet communicate exactly what we think and feel less honestly than any other part of our bodies.","The writer and zoologist Desmond Morris observed that our feet communicate exactly what we think and feel more honestly than any other part of our bodies."],"answer":1,"why":"단어와 논리의 방향을 영어 원문과 직접 대조하세요.","refs":[1]}]},{"id":"light11-02","unit":"light11","number":2,"title":"no.02","sentences":[{"n":1,"en":"Identity development occurs within the context of the adolescent's larger sociohistorical context, which is replete with factors that can facilitate or impede identity development.","ko":"정체성 발달은 청소년의 더 광범위한 사회.역사적 맥락 속에서 이루어지며, 그 맥락은 정체성 발달을 촉진하거나 방해할 수 있는 요인들로 가득 차 있다.","role":"배경 제시 — 사회·역사적 맥락에는 정체성 발달을 돕거나 방해하는 요인들이 있다."},{"n":2,"en":"Certain conditions usually associated with high-status individuals in industrialized nations foster identity exploration.","ko":"대개 산업화한 국가에서 높은 지위를 가진 사람들과 연관된 특정 조건들은 정체성 탐색을 촉진한다.","role":"촉진 요인 — 높은 사회적 지위와 관련된 조건들이 정체성 탐색을 돕는다."},{"n":3,"en":"However, there are also potential barriers, or external limitations, that constrain identity exploration and commitment.","ko":"그러나 정체성 탐색과 전념을 제한하는 잠재적 장벽, 즉 외부적 제약 역시 존재한다.","role":"제약 요인 — 정체성 탐색과 전념을 제한하는 외부적 장벽도 있다."},{"n":4,"en":"These barriers may result from factors such as geographic isolation, socioeconomic status, lack of educational opportunities, overbearing parents, and political zeitgeist.","ko":"이러한 장벽은 지리적 고립, 사회 경제적 지위, 교육 기회의 부족, 고압적인 부모, 정치적 시대정신과 같은 요인들에서 비롯될 수도 있다.","role":"원인 열거 — 정체성 탐색을 제한하는 장벽의 원인을 다섯 가지 제시한다."},{"n":5,"en":"For instance, some parents may prohibit their adolescent daughters from working and expect them to commit to arranged marriages according to cultural beliefs.","ko":"예를 들어, 일부 부모는 자신의 청소년기 딸이 일하는 것을 금지하고 문화적 신념에 따라 중매결혼에 헌신하기를 기대할 수도 있다.","role":"구체적 사례 — 딸의 취업을 막고 중매결혼을 기대하는 부모의 사례를 든다."}],"core":"정체성 발달은 그것을 밀어 주는 조건과 막아서는 바깥 장벽이 함께 놓인 맥락에서 이루어진다.","flow":[{"label":"틀","sentences":"S1","text":"정체성 발달은 촉진·방해 요인으로 가득한 맥락 안에서 일어난다","refs":[1]},{"label":"한쪽","sentences":"S2","text":"높은 지위와 얽힌 조건은 정체성 탐색을 밀어 준다","refs":[2]},{"label":"뒤집기","sentences":"S3","text":"그러나 탐색과 전념을 묶는 잠재적 장벽도 있다","refs":[3]},{"label":"벌리기","sentences":"S4","text":"고립·사회 경제적 지위·교육 기회 부족·고압적 부모·정치적 시대정신이 장벽의 요인이 될 수 있다","refs":[4]},{"label":"보기","sentences":"S5","text":"딸의 일을 막고 중매결혼을 바라는 부모를 든다","refs":[5]}],"structure":[{"title":"미는 힘 — 높은 지위와 얽힌 조건","text":"산업화한 국가의 높은 지위와 연관된 조건들이 정체성 탐색을 촉진한다"},{"title":"막는 힘 — 바깥의 제약","text":"고립·사회 경제적 지위·교육 기회 부족·고압적 부모·정치적 시대정신 등이 탐색과 전념을 제한하는 장벽의 요인이 될 수 있다"}],"key_sentence_en":"Identity development is shaped by social conditions that can facilitate or impede exploration.","diagram":{"kind":"compare","title":"정체성 탐색을 둘러싼 조건","items":[{"head":"탐색을 돕는 조건","body":"일부 사회·경제적 조건은 탐색을 도와줌","refs":[1,2]},{"head":"탐색을 막는 장벽","body":"고립·교육 부족·부모 등은 탐색을 막을 수 있음","refs":[3,4,5]}],"takeaway":"정체성 발달은 그것을 밀어 주는 조건과 막아서는 바깥 장벽이 함께 놓인 맥락에서 이루어진다."},"easy_story":"청소년이 ‘나는 누구인가’를 찾는 일을 혼자 마음먹는 문제로만 보면 부족합니다. 어떤 사람과 환경은 탐색을 돕고, 어떤 장벽은 길을 막아요. 글은 정체성 발달을 이런 더 큰 사회·역사적 맥락 속에서 보라고 합니다.","blocking_vocab":[{"word":"socioeconomic","meaning":"사회 경제적인"},{"word":"exploration","meaning":"탐색"},{"word":"commitment","meaning":"전념"}],"checks":[{"type":"핵심","q":"두 주장 중 글의 핵심과 일치하는 것은?","choices":["정체성 발달은 그것을 밀어 주는 조건과 막아서는 바깥 장벽이 함께 놓인 맥락에서 이루어진다.","정체성 발달은 주변의 도움이나 외부 장벽과 무관하게 혼자서만 이루어진다."],"answer":0,"why":"정체성 발달은 그것을 밀어 주는 조건과 막아서는 바깥 장벽이 함께 놓인 맥락에서 이루어진다. 원문 근거를 아래 S번호에서 다시 확인하세요.","refs":[1,2,3,4,5]},{"type":"근거 확인","q":"정체성 탐색을 볼 때 함께 봐야 할 것은?","choices":["개인에게만 있는 재능의 양이다.","탐색을 막는 바깥 장벽이다."],"answer":1,"why":"고립·교육 부족·부모 등은 탐색을 막을 수 있음","refs":[3,4,5]},{"type":"원문 변형 탐지","q":"이 지문에 실제로 나오는 영어 문장은?","choices":["Identity development occurs within the context of the adolescent's larger sociohistorical context, which is replete with factors that can facilitate or impede identity development.","Identity development occurs within the context of the adolescent's larger sociohistorical context, which is replete with factors that cannot facilitate or impede identity development."],"answer":0,"why":"단어와 논리의 방향을 영어 원문과 직접 대조하세요.","refs":[1]}]}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function storyPreview(t){return String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean)[0]||''}function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 진주고1 부교재 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button><p class="translation">${esc(s.ko)}</p></div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`${p.easy_story?`<p class="context-hint"><b>읽기 단서</b> ${esc(storyPreview(p.easy_story))}</p>`:''}<div class="read-handoff"><button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div><div class="source-visual"><p class="source-visual-label">원문으로 확인한 한눈 지도</p>${renderDiagram(p.learning_map||p.diagram)}</div><details class="easy-story story-after-reading"><summary>막혔다면 · 이야기처럼 다시 읽기</summary>${storySteps(p.easy_story)}</details>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

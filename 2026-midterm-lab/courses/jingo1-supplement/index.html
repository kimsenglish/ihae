</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">JINJU HIGH SCHOOL · GRADE 1</p><h1>진주고1 · 수특 Light 영어</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">확정 범위: 9강 Gateway·4번 / 10강 Gateway·3·5·7번 / 11강 Gateway·1번 · 8지문<br>원문·해석·한눈 지도와 클릭 문제를 제공합니다.</div><div class="units" id="units"></div><p class="subnote">모든 지문에 영어 원문·해석·원문 근거 도식과 클릭형 확인 문제가 연결되어 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":"진주고1","units":[{"id":"light09-10","label":"9강 게이트웨이·4번 / 10강 게이트웨이·3번","scope":"","passages":[{"id":"light09-10-01","title":"9강 Gateway · p56","core":"우리는 스스로 합리적이라 여기지만 실은 예측 가능하게 비합리적이며, 그 작동을 알수록 나아진다."},{"id":"light09-10-02","title":"9강 4번 · p61","core":"스스로 돌아다녀 본 아이일수록 공간을 더 잘 알고 길을 더 잘 찾는다."},{"id":"light09-10-03","title":"10강 Gateway · p62","core":"나방은 빛에 끌리는 것이 아니라 빛에서 벗어나려다 그 주위를 맴돌게 된다."},{"id":"light09-10-04","title":"10강 3번 · p66","core":"거울 뉴런은 남의 행동과 감정을 무의식적으로 따라 하게 만들어 감정의 공유를 설명한다."}]},{"id":"light10-extra","label":"10강 5·7번","scope":"","passages":[{"id":"light10-extra-01","title":"10강 05번","core":"무언가를 「걸치는」 일은 그 대상의 특성을 빌려 자신을 그것과 잇는 행위다."},{"id":"light10-extra-02","title":"10강 07번","core":"문화가 달라도 신화가 닮을 수 있는 까닭은 사람들이 같은 사회적 관계를 겪기 때문이다."}]},{"id":"light11","label":"11강 게이트웨이·1번","scope":"","passages":[{"id":"light11-01","title":"11강 Gateway · p72","core":"발과 다리는 말보다 오래된 생존 반응을 간직해 오늘도 속마음을 가장 정직하게 드러낸다."},{"id":"light11-02","title":"11강 1번 · p74","core":"정체성 발달은 그것을 밀어 주는 조건과 막아서는 바깥 장벽이 함께 놓인 맥락에서 이루어진다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('units').innerHTML=data.units.map((u,i)=>`<details class="unit" ${i===0?'open':''}><summary><div><h2>${esc(u.label)}</h2><span class="scope">${esc(u.scope)}</span></div><span class="count">${u.passages.length}지문</span></summary><div class="passages">${u.passages.map((p,j)=>`${u.passages.length>6&&j%5===0?`<h3 class="chunk-label">${j+1}–${Math.min(j+5,u.passages.length)}번</h3>`:''}<a class="passage" href="study.html#${esc(p.id)}"><b>${esc(p.title)}</b><span>원문과 한눈 지도 보기 →</span></a>`).join('')}</div></details>`).join('');

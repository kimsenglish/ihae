 감정을 함께 표현할 수 있다고 한다.","refs":[6,7,8,9]},{"type":"사례 근거","q":"S8의 음악 구절은 어떤 감정을 담을 수 있는가?","choices":["기쁨 하나만","기쁨·슬픔·생각에 잠김·간절함을 동시에"],"answer":1,"why":"S8은 happy, sad, thoughtful and eager가 동시에 들릴 수 있다고 한다.","refs":[8]},{"type":"변형 탐지","q":"S6~7과 일치하는 것은?","choices":["Musical sounds are not tied to specific words such as 'sausage.'","Every musical sound has one fixed meaning such as 'sausage.'"],"answer":0,"why":"S6은 특정 의미에 묶이지 않는다고 하고 S7은 sausage 같은 단어를 뜻하는 소리가 없다고 한다.","refs":[6,7]}],"sentences":[{"n":1,"en":"Composers compose music.","ko":"작곡가 들은 음악을 작곡한다."},{"n":2,"en":"They write down a series of dots and lines on a page; then performers come along with their instruments and voices, look at the dots and lines on the page, and make sounds from them.","ko":"그들은 종이 위에 일련의 점들과 선들을 적는데, 그러면 공연자 들이 자신들의 악기와 목소리 를 갖고 와서 종이 위에 적힌 점들과 선들을 보고, 그것들로부터 소리를 만들어 낸다."},{"n":3,"en":"It's all very mysterious.","ko":"그것은 모두 매우 신비롭다 ."},{"n":4,"en":"After all, these words you're reading are just another series of dots and lines; you know what they mean, so you can look at them and make sounds (and sense) from them.","ko":"결국, 여러분이 읽고 있는 이 단어들도 또 다른 일련의 점들과 선들 일 뿐이며, 여러분은 그것들이 무엇을 의미하는지 알고 있으므로 그것들을 보고 그것들로부터 소리(와 의미)를 만들어 낼 수 있다."},{"n":5,"en":"So maybe music is really just another language, with its own meaning; but there IS something more magical about music than about any other language.","ko":"따라서 아마도 음악은 실제로 그 자체의 의미를 가진 또 하나의 언어 일 뿐이겠지만, 음악에는 다른 어떤 언어보다도 더 마법과 같은 무언가가 '있다'."},{"n":6,"en":"The range of sounds is far, far huger than that of any spoken language; and because they aren't tied to any specific meaning, the sounds can express much more.","ko":"음들의 범위 는 어떤 음성 언어 의 범위보다 월등히 훨씬 더 크며, 그 음들은 어떤 특정한 의미와도 관련되지 않으므로 훨씬 더 많은 것을 표현할 수 있다."},{"n":7,"en":"There's no musical sound meaning 'sausage' or 'dirty laundry', for instance.","ko":"예를 들어, '소시지'나 '더러운 세탁물'을 의미하는 음악적 소리는 존재하지 않는다 ."},{"n":8,"en":"On the other hand, a musical sentence, or phrase, can sound happy, sad, thoughtful and eager ─ all at the same time!","ko":"반면에, 음악적 문장 혹은 어구는 행복하게, 슬프게, 사려 깊게, 열렬하게 들릴 수 있는데, 그것도 이 모든 것을 한꺼번에 말이다!"},{"n":9,"en":"Words would get exhausted if they tried to express as many meanings as that.","ko":"말로 그만큼 많은 의미를 표현하려고 한다면 말은 바닥날 것이다 ."}]},{"id":"nje03-11","unit":"nje03","number":11,"title":"no.11","core":"학생들은 좋은 학점일수록 정확히 기억하고 나쁜 학점일수록 많이 잊었다.","flow":[{"label":"설계","sentences":"S1","text":"대학생 99명에게 몇 해 전 고교 학점을 떠올려 보라고 했다","refs":[1]},{"label":"전제","sentences":"S2","text":"기록과 대조된다고 알렸으므로 거짓말할 동기가 없었다","refs":[2]},{"label":"규모","sentences":"S3","text":"학점 3,220개를 기록과 하나씩 맞춰 보았다","refs":[3]},{"label":"결과","sentences":"S4-5","text":"학년과 상관없이 기억 정확도는 약 70퍼센트로 같았다","refs":[4,5]},{"label":"물음","sentences":"S6-7","text":"그런데 기억의 구멍이 있었으니 무엇이 잊게 했을까","refs":[6,7]},{"label":"답하기","sentences":"S8-10","text":"A는 89퍼센트, D는 29퍼센트로 학점이 낮을수록 정확도가 떨어졌다","refs":[8,9,10]}],"structure":[{"title":"원인 — 평가의 좋고 나쁨","text":"같은 시기의 기억인데도 받은 점수가 높은지 낮은지가 갈린다"},{"title":"결과 — 기억의 기울기","text":"A 89퍼센트에서 D 29퍼센트까지 정확도가 꾸준히 떨어진다"}],"key_sentence_en":"Students remembered high grades far more accurately than low grades.","diagram":{"kind":"bars","title":"성적별 기억 정확도 · 3,220개 성적 기록 대조","max":100,"unit":"%","items":[{"head":"A","value":89,"body":"A 성적을 정확히 기억한 비율","refs":[8]},{"head":"B","value":64,"body":"B 성적을 정확히 기억한 비율","refs":[8]},{"head":"C","value":51,"body":"C 성적을 정확히 기억한 비율","refs":[8]},{"head":"D","value":29,"body":"D 성적을 정확히 기억한 비율","refs":[8]}],"takeaway":"학년별 기억 정확도는 약 70%로 비슷했지만(S5), 성적별 정확도는 A에서 D로 낮아졌다(S8)."},"blocking_vocab":[{"word":"recollection","meaning":"기억·회상"},{"word":"registrar","meaning":"학적 담당자"},{"word":"accuracy of recall","meaning":"회상 정확도"}],"checks":[{"type":"핵심","q":"학생들이 과거 성적을 기억하는 정확도는 무엇에 따라 달랐는가?","choices":["학년보다는 성적의 좋고 나쁨에 따라 달랐다.","A와 D를 똑같이 정확히 기억했다."],"answer":0,"why":"S5는 학년별 정확도는 비슷했지만 S8은 좋은 성적일수록 더 정확히 기억했다고 한다.","refs":[5,6,7,8]},{"type":"수치 근거","q":"A와 D에 대한 기억 정확도로 맞는 조합은?","choices":["A 89퍼센트 · D 29퍼센트","A 29퍼센트 · D 89퍼센트"],"answer":0,"why":"S8에 A는 89퍼센트, D는 29퍼센트라고 명시되어 있다.","refs":[8]},{"type":"변형 탐지","q":"S2~3의 연구 절차와 일치하는 것은?","choices":["Students knew their memories would be checked against school records.","Students were told their memories would never be checked against school records."],"answer":0,"why":"S2는 학교 기록과 대조할 것을 알았고 동의서도 서명했다고 한다.","refs":[2,3]}],"sentences":[{"n":1,"en":"A group of researchers asked ninety-nine college freshmen and sophomores to think back a few years and recall the grades they had received for high school classes in math, science, history, foreign language study, and English.","ko":"일단의 연구자들이 99명의 대학 신입생과 2학년 학생 들에게 몇 년 전을 돌이켜 생각해 보고 그들이 고교 수업 에서 받았던 수학, 과학, 역사, 외국어 공부와 영어 학점을 기억해 보라고 요청했다."},{"n":2,"en":"The students had no incentive to lie because they were told that their recollections would be checked against their high school registrars' records, and indeed all signed forms giving their permission.","ko":"학생들은 그들의 기억 이 그들의 고교 교무처장의 기록 과 대조되어 검토될 것이라고 들었기 때문에 거짓말할 동기가 없었으며, 실제로 모두가 자신의 허가를 표하는 양식에 서명했다."},{"n":3,"en":"Altogether, the researchers checked on the students' memories of 3,220 grades.","ko":"모두 합해서 연구자들은 3,220개의 학점 에 대한 학생들의 기억 을 검토했다."},{"n":4,"en":"A funny thing happened.","ko":"재미있는 일 이 일어났다."},{"n":5,"en":"They remembered their grades from their freshman, sophomore, junior, and senior years all with the same accuracy, about 70 percent.","ko":"그들은 자신의 1학년, 2학년, 3학년 그리고 4학년 학점 을 전부 동일한 정확도로 기억했는데, 약 70퍼센트 였다."},{"n":6,"en":"And yet there were memory holes.","ko":"그러나 기억의 구멍 이 있었다."},{"n":7,"en":"What made the students forget?","ko":"무엇으로 인해 학생들은 잊어버렸는가 ?"},{"n":8,"en":"Their accuracy of recall declined steadily from 89 percent for A's to 64 percent for B's, 51 percent for C's, and 29 percent for D's.","ko":"그들의 기억 정확도 는 A 학점 에 대한 89퍼센트에서 B 학점 에 대한 64퍼센트, C 학점 에 대한 51퍼센트, D 학점 에 대한 29퍼센트까지 점차 감소했다."},{"n":9,"en":"So if you are ever depressed over being given a bad evaluation, cheer up.","ko":"그러므로 언제든 여러분이 나쁜 평가 를 받아서 우울하다면, 힘내라."},{"n":10,"en":"Chances are, if you just wait long enough, it'll improve.","ko":"아마도 여러분이 충분히 오래 기다리기만 하면 그것은 나아질 것 이다."}]}]},{"id":"nje04","label":"N제 4강","scope":"N제 p6~42 시험 범위","passages":[{"id":"nje04-01","unit":"nje04","number":1,"title":"p30 대표 기출 1","core":"창조력은 상상력을 실제 행동과 성과로 옮기는 것이다.","flow":[{"label":"차이 제시","sentences":"S1–5","text":"개인적 상상은 외부 성과 없이도 가능하지만 창조력은 성과를 낸다.","refs":[1,5]},{"label":"행동의 필요","sentences":"S6–9","text":"창조적이라는 말에는 구체적인 분야에서 무언가 만드는 행동이 포함된다.","refs":[6,9]},{"label":"결론","sentences":"S10–11","text":"창조력은 실제로 적용된 상상력이다.","refs":[10,11]}],"structure":[{"title":"상상력","text":"의식 안에서만 이루어질 수 있음"},{"title":"창조력","text":"상상력을 행동과 성과로 옮김"}],"key_sentence_en":"Creativity puts imagination to work through action and production.","blocking_vocab":[{"word":"imagination","meaning":"상상력"},{"word":"deliberate","meaning":"의도적인"},{"word":"applied imagination","meaning":"실제로 적용된 상상력"}],"checks":[{"type":"핵심","q":"글에서 창조력은 상상력과 어떻게 다른가?","choices":["머릿속에만 있어도 언제나 창조력으로 인정된다.","머릿속 상상을 실제 행동과 결과로 옮긴다."],"answer":1,"why":"S2~4는 상상은 사적인 과정에 머물 수 있고 S5~11은 창조력에는 행동과 산출이 있다고 한다.","refs":[2,3,4,5,6,8,10,11]},{"type":"구분 근거","q":"S8에서 ‘창조적인 사람’이라고 부를 때 암시되는 것은?","choices":["의도적으로 무언가를 활발히 만들어 낸다는 것","아무 결과 없이 상상만 한다는 것"],"answer":0,"why":"S8의 actively producing something in a deliberate way가 근거다.","refs":[8]},{"type":"변형 탐지","q":"S10~11과 일치하는 것은?","choices":["Creativity keeps imagination private and never puts it to work.","Creativity puts imagination to work; it is applied imagination."],"answer":1,"why":"S10은 상상력을 일하게 하는 것, S11은 적용된 상상력이라고 정리한다.","refs":[10,11]}],"sentences":[{"n":1,"en":"Creativity is a step further on from imagination.","ko":"창조력은 상상력으로부터 한 단계 더 나아간 것이다."},{"n":2,"en":"Imagination can be an entirely private process of internal consciousness.","ko":"상상력은 내적 의식의 완전히 사적인 과정일 수 있다."},{"n":3,"en":"You might be lying motionless on your bed in a fever of imagination and no one would ever know.","ko":"당신은 상상력의 흥분 속에서 당신의 침대 위에서 움직임 없이 누워 있을지도 모르며, 어느 누구도 그런 사실을 알지 못할 것이다."},{"n":4,"en":"Private imaginings may have no outcomes in the world at all.","ko":"사적인 상상들은 전혀 이 세상에서 어떤 성과도 내지 못할지도 모른다."},{"n":5,"en":"Creativity does.","ko":"창조력은 그렇다(성과를 낸다)."},{"n":6,"en":"Being creative involves doing something.","ko":"창조적인 것은 무언가 하는 것을 수반한다."},{"n":7,"en":"It would be odd to describe as creative someone who never did anything.","ko":"어떤 것도 전혀 하지 않는 사람을 창조적이라고 묘사하는 것은 이상할 것이다."},{"n":8,"en":"To call somebody creative suggests they are actively producing something in a deliberate way.","ko":"누군가를 창조적이라고 부르는 것은 그들이 의도적인 방식으로 어떤 것을 적극적으로 만들어 내고 있다는 것을 암시한다."},{"n":9,"en":"People are not creative in the abstract; they are creative in something: in mathematics, in engineering, in writing, in music, in business, in whatever.","ko":"사람들은 추상적인 의미에서 창조적인 것이 아니라, 그들은 어떤 것에서, 즉 수학에서, 공학에서, 글쓰기에서, 음악에서, 사업에서, 무엇에서든지 창조적이다."},{"n":10,"en":"Creativity involves putting your imagination to work.","ko":"창조력은 당신의 상상력을 작동시키는 것을 수반한다."},{"n":11,"en":"In a sense, creativity is applied imagination.","ko":"어떤 면에서, 창조력은 적용된 상상력이다."}]},{"id":"nje04-02","unit":"nje04","number":2,"title":"p31 대표 기출 2","core":"뉴스의 역피라미드 구조는 독자가 얻는 핵심 정보를 극대화한다.","flow":[{"label":"구조 소개","sentences":"S1–5","text":"가장 중요한 정보를 먼저 주고 중요도가 낮아지는 순서로 배열한다.","refs":[1,5]},{"label":"독자의 이점","sentences":"S6–7","text":"어디까지 읽든 중요한 정보를 먼저 얻는다.","refs":[6,7]},{"label":"반대 방식과 대조","sentences":"S8–9","text":"핵심을 끝에 두면 중간에 멈춘 독자가 요점을 놓친다.","refs":[8,9]}],"structure":[{"title":"배열 원리","text":"중요한 정보를 앞에 배치"},{"title":"효과","text":"읽는 분량이 달라도 핵심을 먼저 파악"}],"key_sentence_en":"The inverted pyramid gives readers the most important news first.","diagram":{"kind":"steps","title":"뉴스의 역피라미드 구조","items":[{"head":"맨 위 · 핵심 정보","body":"첫 문장인 리드에 가장 중요한 요소를 둔다.","refs":[1,2,3,5]},{"head":"그다음 · 중요도 순","body":"뒤로 갈수록 덜 중요한 정보를 배열한다.","refs":[4,5]},{"head":"읽기 효과","body":"리드만 읽고 멈춰도 핵심을 얻을 수 있다.","refs":[6,7,8]}],"takeaway":"역피라미드는 도형 모양보다 정보의 중요도 순서가 핵심 · S4~7"},"blocking_vocab":[{"word":"lead","meaning":"기사 첫 문장"},{"word":"inverted pyramid","meaning":"역피라미드 구조"},{"word":"attention span","meaning":"집중 지속 시간"}],"checks":[{"type":"핵심","q":"역피라미드형 기사가 독자에게 유리한 이유는?","choices":["첫 문장만 읽어도 가장 중요한 정보를 얻을 수 있어서","결말까지 읽어야 핵심을 알 수 있어서"],"answer":0,"why":"S1~7은 핵심 정보를 앞에 두어 독자가 어디서 멈춰도 정보를 많이 얻는다고 설명한다.","refs":[1,2,4,5,6,7]},{"type":"구조 근거","q":"lead 다음의 정보는 어떤 순서로 제시되는가?","choices":["점점 더 중요한 순서","점점 덜 중요한 순서"],"answer":1,"why":"S4의 decreasing order of importance가 직접 근거다.","refs":[4]},{"type":"변형 탐지","q":"S8의 대안적 기사 구조에 관한 설명과 맞는 것은?","choices":["A mystery-like story can make early leavers miss its point.","A mystery-like story guarantees early leavers get the main point."],"answer":0,"why":"S8은 극적인 결말을 끝에 두면 중간에 멈춘 독자가 요점을 놓친다고 한다.","refs":[8]}],"sentences":[{"n":1,"en":"News reporters are taught to start their stories with the most important information.","ko":"뉴스 기자들은 그들의 기사를 가장 중요한 정보로 시작하도록 배운다."},{"n":2,"en":"The first sentence, called the lead, contains the most essential elements of the story.","ko":"리드라고 불리는 첫 번째 문장은 기사의 가장 본질적인 요소들을 담고 있다."},{"n":3,"en":"A good lead can convey a lot of information.","ko":"좋은 리드는 많은 정보를 전달할 수 있다."},{"n":4,"en":"After the lead, information is presented in decreasing order of importance.","ko":"리드 다음에, 정보는 중요도가 감소하는 순서로 제시된다."},{"n":5,"en":"Journalists call this the \"inverted pyramid\" structure ─ the most important information (the widest part of the pyramid) is at the top.","ko":"기자들은 이것을 '역 피라미드' 구조라고 부르는데, 가장 중요한 정보(피라미드의 가장 넓은 부분)가 맨 위에 있다."},{"n":6,"en":"The inverted pyramid is great for readers.","ko":"역 피라미드는 독자들에게 아주 좋다."},{"n":7,"en":"No matter what the reader's attention span ─ whether she reads only the lead or the entire story ─ the inverted pyramid maximizes the information she gets.","ko":"독자의 주의 지속 시간이 어떻든 간에, 즉 리드만 읽든 전체 기사를 읽든, 역 피라미드는 독자가 얻는 정보를 극대화한다."},{"n":8,"en":"Think of the alternative: If news stories were written like mysteries with a dramatic payoff at the end, then readers who broke off in mid‑story would miss the point.","ko":"다른 방법을 생각해 보라. 만약 뉴스 기사들이 마지막에 극적인 결말이 있는 미스터리처럼 쓰여진다면, 기사 중반부에서 중단한 독자들은 요점을 놓칠 것이다."},{"n":9,"en":"Imagine waiting until the last sentence of a story to find out who won the presidential election or the Super Bowl.","ko":"누가 대통령 선거 혹은 슈퍼볼에서 이겼는지 알아내기 위해 기사의 마지막 문장까지 기다린다고 상상해 보라."}]},{"id":"nje04-03","unit":"nje04","number":3,"title":"p32 no.035","core":"기업에서 말하는 공감은 관점 이해·배려·시장 조사·다양한 사용자 고려 등 여러 의미로 쓰인다.","flow":[{"label":"개념의 불명확성","sentences":"S1","text":"공감은 자주 요구되지만 정확한 의미가 항상 밝혀지지는 않는다.","refs":[1]},{"label":"기업별 강조","sentences":"S2–3","text":"관점 이해와 신뢰를 얻는 배려를 각각 강조한다.","refs":[2,3]},{"label":"업무에서의 의미","sentences":"S4–6","text":"시장 조사와 고객 요구 충족, 다양한 사용자를 고려하는 디자인으로 구체화한다.","refs":[4,6]}],"structure":[{"title":"공감의 여러 의미","text":"이해와 배려"},{"title":"실무적 적용","text":"고객 요구 조사와 다양한 사용자 고려"}],"key_sentence_en":"Empathy in business has several meanings, from understanding perspectives to meeting diverse customer needs.","blocking_vocab":[{"word":"cognitive empathy","meaning":"상대 관점을 이해하는 인지적 공감"},{"word":"affective empathy","meaning":"감정에 공감하는 정서적 공감"},{"word":"compassion","meaning":"연민·배려"}],"checks":[{"type":"핵심","q":"기업에서 ‘공감’이라는 말을 쓰는 방식에 관한 글의 요지는?","choices":["관점 이해, 배려, 시장 조사, 다양한 사용자 고려 등 여러 뜻으로 쓰인다.","모든 기업이 정확히 하나의 뜻으로만 쓴다."],"answer":0,"why":"S1의 의미가 불명확하다는 말 뒤 S2~6에서 다양한 용법을 제시한다.","refs":[1,2,3,4,5,6]},{"type":"구분 근거","q":"‘인지적 공감’을 강조하는 기업의 초점은?","choices":["직원과 고객의 관점을 이해하는 것","고객을 배려하는 감정만 표현하는 것"],"answer":0,"why":"S2는 cognitive empathy를 관점 이해와 연결한다. S3은 정서적 공감과 배려다.","refs":[2,3]},{"type":"변형 탐지","q":"S6의 공감적 설계와 일치하는 것은?","choices":["Designers should ignore the distinct needs of different user groups.","Designers should consider the distinct needs of blind, deaf, elderly and other users."],"answer":1,"why":"S6은 여러 사용자 집단의 구체적인 필요를 고려하라고 한다.","refs":[6]}],"sentences":[{"n":1,"en":"Empathy is frequently listed as one of the most desired skills in an employer or employee, although without specifying exactly what is meant by empathy.","ko":"'공감'이 무엇을 의미하는지 정확히 명시하지는 않지만, 공감은 고용주나 직원에게서 가장 바라는 기술 중 하나로 종종 열거된다."},{"n":2,"en":"Some businesses stress cognitive empathy, emphasizing the need for leaders to understand the perspective of employees and customers when negotiating deals and making decisions.","ko":"일부 기업은 인지적 공감을 중시하여 리더가 거래를 협상하고 결정을 내릴 때 직원과 고객의 관점을 이해할 필요성을 강조한다."},{"n":3,"en":"Others stress affective empathy and empathic concern, emphasizing the ability of leaders to gain trust from employees and customers by treating them with real concern and compassion.","ko":"다른 기업은 정서적 공감과 공감적 관심을 중시하여 진정한 관심과 동정심으로 직원과 고객을 대함으로써 그들로부터 신뢰를 얻는 리더의 능력을 강조한다."},{"n":4,"en":"When some consultants argue that successful companies foster empathy, what that translates to is that companies should conduct good market research.","ko":"일부 자문 위원이 성공적인 기업은 공감 능력을 기른다고 주장할 때, 그것이 의미하는 바는 기업이 시장 조사를 잘 수행해야 한다는 것이다."},{"n":5,"en":"In other words, an \"empathic\" company understands the needs and wants of its customers and seeks to fulfill those needs and wants.","ko":"다시 말해, '공감적인' 기업은 고객의 필요와 욕구를 이해하고, 그 필요와 욕구를 충족시키기 위해 노력한다."},{"n":6,"en":"When some people speak of design with empathy, what that translates to is that companies should take into account the specific needs of different populations ─ the blind, the deaf, the elderly, non-English speakers, the color-blind, and so on ─ when designing products.","ko":"일부 사람들이 공감을 담은 디자인을 말할 때, 그것이 의미하는 바는 기업이 제품을 디자인할 때 시각 장애인, 청각 장애인, 노인, 비영어권 화자, 색맹 등 다양한 사람들의 구체적인 필요를 고려해야 한다는 것이다."}]},{"id":"nje04-04","unit":"nje04","number":4,"title":"p32 no.036","core":"요리의 기업 위탁은 가사 부담을 줄이고 시간과 음식 선택의 폭을 늘리는 이점도 가져왔다.","flow":[{"label":"문제와 전환","sentences":"S1–3","text":"요리 감소의 결과가 모두 나쁜지 묻고 그렇지 않다고 답한다.","refs":[1,3]},{"label":"생활 부담의 감소","sentences":"S4–6","text":"여성의 경력 활동을 돕고 가정의 갈등·압박·시간 부담을 줄인다.","refs":[4,6]},{"label":"식단의 다양화","sentences":"S7–8","text":"적은 기술과 비용으로 다른 요리를 즐길 수 있다.","refs":[7,8]}],"structure":[{"title":"변화","text":"요리의 기업 위탁"},{"title":"이점","text":"가사 부담 감소와 다양한 식단"}],"key_sentence_en":"Outsourcing cooking can reduce household burdens and widen food choices.","blocking_vocab":[{"word":"outsourcing","meaning":"외부 기업에 맡김"},{"word":"domestic conflict","meaning":"가정 내 갈등"},{"word":"diversify diets","meaning":"식단을 다양하게 하다"}],"checks":[{"type":"핵심","q":"요리의 기업 위탁에 대한 글의 태도는?","choices":["문제가 있더라도 가사 부담·시간·음식 선택에서 이점이 있음을 인정한다.","부정적 결과만 있으므로 모든 장점을 부정한다."],"answer":0,"why":"S1은 심각한 결과를 언급하지만 S2~8은 모두 나쁜 것만은 아니며 여러 이점을 제시한다.","refs":[1,2,3,4,5,6,7,8]},{"type":"구체적 근거","q":"요리 부담이 줄면서 S4가 말하는 변화는?","choices":["여성이 집 밖에서 일하고 경력을 쌓기 쉬워진다.","가족의 식사를 책임질 사람이 반드시 더 많아진다."],"answer":0,"why":"S4는 전통적으로 여성에게 집중된 요리 책임이 줄어 직업 활동이 쉬워졌다고 한다.","refs":[4]},{"type":"변형 탐지","q":"S7~8과 일치하는 것은?","choices":["Outsourced cooking can widen food choices, even for people with little cooking skill.","Outsourced cooking narrows food choices to those with advanced cooking skill."],"answer":0,"why":"S7은 요리 기술이 없고 돈이 적은 사람도 다양한 음식을 즐길 수 있다고 한다.","refs":[7,8]}],"sentences":[{"n":1,"en":"If cooking is as central to human identity, biology, and culture as the biological anthropologist Richard Wrangham suggests, it stands to reason that the decline of cooking in our time would have serious consequences for modern life, and so it has.","ko":"요리가 생물인류학자인 Richard Wrangham이 말하는 것만큼 인간의 정체성, 생명 작용 그리고 문화에 핵심적이라면, 우리 시대의 요리 감소가 현대 생활에 심각한 결과를 가져올 것이라고 추론하는 것은 당연하며, 실제로 그래 왔다."},{"n":2,"en":"Are they all bad?","ko":"그것 모두가 나쁜가?"},{"n":3,"en":"Not at all.","ko":"전혀 그렇지 않다."},{"n":4,"en":"The outsourcing of much of the work of cooking to corporations has relieved women of what has traditionally been their exclusive responsibility for feeding the family, making it easier for them to work outside the home and have careers.","ko":"요리 작업의 많은 부분을 기업에 위탁하는 것은 전통적으로 여성들에게 한정된, 가족을 먹여야 하는 책임이었던 것에서 그들을 벗어나게 했고, 이는 그들이 집 밖에서 일하고 직업을 갖는 것을 더 쉽게 만들었다."},{"n":5,"en":"It has headed off many of the domestic conflicts that such a large shift in gender roles and family dynamics was bound to spark.","ko":"그것은 성 역할과 가족 역학의 매우 큰 변화가 촉발할 많은 가정 내 갈등을 막아 냈다."},{"n":6,"en":"It has relieved other pressures in the household, including longer workdays and overscheduled children, and saved us time that we can now invest in other pursuits.","ko":"그것은 더 긴 근무일과 과도한 일정에 시달리는 자녀를 포함하여 가정의 다른 압박을 덜어 주었고, 이제 우리가 다른 일에 투자할 수 있는 시간을 절약해 주었다."},{"n":7,"en":"It has also allowed us to diversify our diets substantially, making it possible even for people with no cooking skills and little money to enjoy a whole different cuisine.","ko":"그것은 또한 우리의 식단을 상당히 다양하게 해 주었고, 이는 요리 기술이 없고 돈이 거의 없는 사람들도 완전히 색다른 요리를 즐길 수 있게 해 주었다."},{"n":8,"en":"All that's required is a microwave.","ko":"필요한 것이라고는 전자레인지뿐이다."}]},{"id":"nje04-05","unit":"nje04","number":5,"title":"p33 no.037","core":"마감일을 가까운 시간 틀의 도전으로 생각하면 제때 행동하기 쉽다.","flow":[{"label":"시간 구분의 영향","sentences":"S1","text":"시간의 경계 너머에 있는 마감일은 더 멀게 느껴진다.","refs":[1]},{"label":"시간 틀 변경","sentences":"S2–4","text":"내년보다 이번 겨울처럼 가깝게 느껴지는 틀로 마감일을 본다.","refs":[2,4]},{"label":"효과","sentences":"S5","text":"스트레스를 관리하고 제때 시작·완료하기 쉬워진다.","refs":[5]}],"structure":[{"title":"멀게 보는 마감일","text":"행동 준비가 늦어짐"},{"title":"가깝게 보는 마감일","text":"스트레스 관리와 적시 행동에 도움"}],"key_sentence_en":"Viewing deadlines within an imminent timeframe can help people act in good time.","diagram":{"kind":"compare","title":"같은 마감: 11월 현재 → 1월 완료","items":[{"head":"‘내년’이라는 표현","body":"새해라는 시간의 경계 너머에 있는 일로 느껴져 멀게 볼 가능성이 있다.","refs":[1,3]},{"head":"‘이번 겨울’이라는 표현","body":"같은 1월 마감을 가까운 기간의 도전으로 보아 제때 시작할 가능성을 높인다.","refs":[3,4,5]}],"takeaway":"표현을 바꿔도 실제 마감일은 1월로 같다. 거리감과 행동 준비가 달라질 수 있다는 글이다 · S1~5"},"blocking_vocab":[{"word":"timeframe","meaning":"시간의 틀"},{"word":"imminent","meaning":"임박한"},{"word":"jump into action","meaning":"바로 행동에 나서다"}],"checks":[{"type":"핵심","q":"마감일을 제때 맞추기 위한 생각법은?","choices":["먼 미래의 일처럼 보지 말고 가까운 기간의 과제로 본다.","새해를 넘는 마감일은 무조건 다음 해 일로만 본다."],"answer":0,"why":"S1은 시간 단절 뒤의 마감이 멀게 느껴진다고 하고 S2~5는 가까운 기간으로 다시 보라고 한다.","refs":[1,2,3,4,5]},{"type":"사례 근거","q":"11월에 1월 마감일을 앞뒀다면 글이 권하는 표현은?","choices":["‘내년’까지 하면 된다.","‘이번 겨울’ 안에 끝낸다."],"answer":1,"why":"S3은 next year 대신 this winter로 생각하라고 한다.","refs":[3]},{"type":"변형 탐지","q":"S4~5의 효과와 일치하는 것은?","choices":["Seeing a deadline as imminent can help you start and finish in good time.","Seeing a deadline as remote always helps you start immediately."],"answer":0,"why":"S4~5는 가까운 도전으로 보면 스트레스를 관리하고 제때 시작·마칠 가능성이 커진다고 한다.","refs":[4,5]}],"sentences":[{"n":1,"en":"We tend to break up time into units, such as weeks, months, and seasons; in a series of studies among farmers in India and students in North America, psychologists found that if a deadline is on the other side of a \"break\" ─ such as in the New Year ─ we're more likely to see it as remote, and, as a result, be less ready to jump into action.","ko":"우리는 시간을 주, 월, 계절과 같은 단위로 나누는 경향이 있다. 인도의 농부들과 북미의 학생들을 대상으로 한 일련의 연구에서 심리학자들은, 마감일이 새해와 같은 '나뉨'의 반대편에 있다면 우리는 그것을 멀리 있는 것으로 여기고, 그 결과 실행에 돌입할 준비를 덜 할 가능성이 더 많다는 사실을 발견했다."},{"n":2,"en":"What you need to do in that situation is find another way to think about the timeframe.","ko":"그러한 상황에서 여러분이 해야 할 일은 그 시간 틀에 대해 생각하는 또 다른 방식을 찾는 것이다."},{"n":3,"en":"For example, if it's November and the deadline is in January, it's better to tell yourself you have to get it done \"this winter\" rather than \"next year.\"","ko":"예를 들어, 지금이 11월이고 마감일이 1월이라면, 여러분은 '내년'보다는 '이번 겨울'에 일을 끝내야 한다고 자신에게 말하는 것이 낫다."},{"n":4,"en":"The best approach is to view deadlines as a challenge that you have to meet within a period that's imminent.","ko":"가장 좋은 접근법은 마감일을 임박한 기간 내에 맞춰야 하는 도전으로 여기는 것이다."},{"n":5,"en":"That way the stress is more manageable, and you have a better chance of starting ─ and therefore finishing ─ in good time.","ko":"그런 식으로 스트레스는 더 관리하기 쉬울 수 있으며, 적시에 시작하고, 따라서 마무리할 가능성이 더 높아진다."}]},{"id":"nje04-06","unit":"nje04","number":6,"title":"p33 no.038","core":"돌봄 로봇을 진짜 친구처럼 보이게 하는 속임수에는 윤리적 문제가 있다는 비판이 있다.","flow":[{"label":"위험 제기","sentences":"S1–3","text":"취약한 사용자가 로봇을 친구로 믿게 하는 문제를 제기한다.","refs":[1,3]},{"label":"인공성 명시","sentences":"S4–7","text":"로봇이 가짜임을 드러내어 속임수와 불쾌한 골짜기를 줄이자고 한다.","refs":[4,7]},{"label":"존엄성 비판","sentences":"S8","text":"로봇이 진심으로 돌본다고 믿게 하는 것이 인간 존엄성을 침해한다는 주장을 든다.","refs":[8]}],"structure":[{"title":"문제","text":"취약한 사용자를 속이는 인간 같은 로봇"},{"title":"대안","text":"인공물이라는 점을 분명히 드러내기"}],"key_sentence_en":"Critics argue that deceptive care robots can threaten vulnerable users’ dignity.","diagram":{"kind":"compare","title":"돌봄 로봇에 대한 우려와 설계 제안","items":[{"head":"비판자들의 윤리적 우려","body":"인지적으로 취약한 이용자가 로봇을 진짜 친구나 돌보는 존재로 오인하면 속임수와 존엄성 문제가 생길 수 있다는 주장이다.","refs":[1,2,3,4,8]},{"head":"설린스의 설계 제안","body":"로봇을 인공물로 쉽게 구별할 수 있도록 상징적이거나 만화 같은 외형을 유지하자고 한다.","refs":[5,6,7]}],"takeaway":"본문의 비판과 제안이지 모든 돌봄 로봇의 효과가 입증되었다는 뜻은 아니다 · S1~8"},"blocking_vocab":[{"word":"deception","meaning":"속임수"},{"word":"synthetic","meaning":"인공적인"},{"word":"uncanny valley","meaning":"불쾌한 골짜기"}],"checks":[{"type":"핵심","q":"사람 같은 돌봄 로봇에 대한 비판의 중심은?","choices":["로봇은 사람을 너무 닮지 않으면 항상 이용자를 속인다.","취약한 이용자가 로봇을 진짜 친구나 돌보는 존재로 오인할 위험이 있다."],"answer":1,"why":"S1~4와 S8은 인지적으로 취약한 사람이 로봇의 관계를 실제처럼 믿는 윤리적 문제를 제기한다.","refs":[1,2,3,4,8]},{"type":"해결 근거","q":"설린스가 로봇의 모습에 관해 권한 것은?","choices":["사람과 구별하기 어렵도록 최대한 똑같이 만들기","합성물임을 쉽게 알 수 있게 상징적·만화처럼 유지하기"],"answer":1,"why":"S5는 쉽게 인공물로 구별되도록 iconic or cartoonish하게 남겨야 한다고 한다.","refs":[5]},{"type":"변형 탐지","q":"S7의 불쾌한 골짜기 설명과 일치하는 것은?","choices":["Robots seem scary only when they look nothing like humans.","Robots that nearly, but not quite, resemble humans can seem scary."],"answer":1,"why":"S7은 사람과 아주 닮았지만 완전히 같지는 않을 때 무섭게 느껴질 수 있다고 한다.","refs":[7]}],"sentences":[{"n":1,"en":"In response to human-like care robots, critics might charge that human-robot interactions create moral hazards for dementia patients.","ko":"인간을 닮은 돌봄 로봇에 대한 반응으로, 비평가들은 인간과 로봇의 상호 작용이 치매 환자들에게 도덕적 위험을 만들어 낸다고 비난할지도 모른다."},{"n":2,"en":"Even if deception is sometimes allowed when it serves worthy goals, should it be allowed for vulnerable users?","ko":"속임수가 가치 있는 목표에 도움이 될 때 그것이 때때로 허용된다고 할지라도, 그것이 취약한 사용자들에게 허용되어야 하는가?"},{"n":3,"en":"Just as children on the autism spectrum with robot companions might be easily fooled into thinking of robots as friends, older adults with cognitive deficits might be.","ko":"로봇 친구가 있는 자폐성 스펙트럼을 가진 아이들이 로봇을 친구로 생각하도록 쉽게 속을 수 있는 것처럼 인지 결함을 가진 노인들도 그럴 수 있다."},{"n":4,"en":"According to Alexis Elder, a professor at UMD, robots are false friends, inferior to true friendship.","ko":"UMD의 교수인 Alexis Elder에 따르면, 로봇은 진정한 우정보다 열등한 '가짜' 친구이다."},{"n":5,"en":"Reasoning along similar lines, John Sullins, a professor at Sonoma State University, holds that robots should \"remain iconic or cartoonish so that they are easily distinguished as synthetic even by unsophisticated users.\"","ko":"유사한 방식으로 추론하면, Sonoma 주립 대학교 교수인 John Sullins는 로봇이 '심지어 경험이나 지식이 부족한 사용자들에 의해서도 그것이 진짜가 아닌 것으로 쉽게 구별되도록 상징적이거나 만화같이 남아' 있어야 한다고 주장한다."},{"n":6,"en":"At least then no one is fooled.","ko":"적어도 그러면 아무도 속지 않는다."},{"n":7,"en":"Making robots clearly fake also avoids the so-called \"uncanny valley,\" where robots are perceived as scary because they so closely resemble us, but not quite.","ko":"로봇을 명백히 가짜로 만들면 또한 로봇이 우리를 완전히는 아니지만 너무나도 닮았기 때문에 무섭다고 인지되는 소위 '불쾌한 골짜기'를 피할 수 있다."},{"n":8,"en":"Other critics of robot deception argue that when care recipients are deceived into thinking that robots care, this crosses a line and violates human dignity.","ko":"로봇 속임수에 대한 다른 비평가들은 돌봄을 받는 사람들이 로봇이 돌봐 준다고 생각하도록 속을 때 이것은 선을 넘어 인간의 '존엄성'을 침해한다고 주장한다."}]},{"id":"nje04-07","unit":"nje04","number":7,"title":"p34 no.039","core":"일탈에 대한 공동 대응은 사회 집단의 결속과 규범에 대한 헌신을 강화할 수 있다.","flow":[{"label":"역설적 기능","sentences":"S1–3","text":"일탈에 반대하는 과정에서 집단이 협력한다.","refs":[1,3]},{"label":"가치의 재인식","sentences":"S4–6","text":"위협이 평소 당연시하던 애착과 집단 가치를 일깨운다.","refs":[4,6]},{"label":"결속의 강화","sentences":"S7–8","text":"집단이 존속을 위해 힘을 모으고 구성원이 규범에 다시 헌신한다.","refs":[7,8]}],"structure":[{"title":"계기","text":"일탈이 도덕 질서를 위협"},{"title":"반응","text":"협력·결속·규범에 대한 재헌신"}],"key_sentence_en":"Opposition to deviance can strengthen cooperation and commitment within a group.","diagram":{"kind":"steps","title":"일탈에 대한 공동 대응이 집단에 미치는 영향","items":[{"head":"규범의 위협을 느낌","body":"일탈이 집단의 도덕적 질서를 위협하는 것으로 인식된다.","refs":[5]},{"head":"함께 대응함","body":"반대와 대응 과정이 협력의 기회를 만든다.","refs":[2,3]},{"head":"유대를 재확인함","body":"집단에 대한 애착·충성심과 사회적 규범에 대한 헌신을 다시 일깨운다.","refs":[5,6,7,8]}],"takeaway":"일탈이 바람직하다는 뜻이 아니라, 이에 대한 집단의 대응 효과를 설명한다 · S1~8"},"blocking_vocab":[{"word":"deviant behavior","meaning":"규범에서 벗어난 행동"},{"word":"moral order","meaning":"도덕적 질서"},{"word":"rededicate","meaning":"다시 헌신하다"}],"checks":[{"type":"핵심","q":"일탈 행동에 대한 공동 대응이 집단에 줄 수 있는 효과는?","choices":["집단 구성원의 유대를 반드시 모두 끊는다.","집단의 유대와 규범을 지키려는 협력을 강화한다."],"answer":1,"why":"S2~3, S5~8은 위협에 대한 반응이 협력과 충성, 사회적 통제에 대한 재헌신을 이끌 수 있다고 한다.","refs":[2,3,5,6,7,8]},{"type":"인과 근거","q":"일탈 행동이 집단의 애착을 다시 깨우는 이유는?","choices":["집단의 도덕적 질서에 대한 위협으로 느껴져서","평소 모든 사람에게 아무 의미가 없어서"],"answer":0,"why":"S5는 도덕적 질서에 대한 위협이 집단 애착과 충성심을 다시 깨운다고 한다.","refs":[5]},{"type":"변형 탐지","q":"S3의 집단 반응과 일치하는 것은?","choices":["Opposition to deviance can create opportunities for cooperation.","Opposition to deviance necessarily prevents all cooperation."],"answer":0,"why":"S3은 일탈에 대한 반대가 협력의 기회를 만든다고 한다.","refs":[3]}],"sentences":[{"n":1,"en":"Deviant behavior is an integral part of all healthy societies.","ko":"일탈 행위는 모든 건전한 사회의 필수적인 부분이다."},{"n":2,"en":"In the presence of deviant behavior, a social group becomes united in its response.","ko":"일탈 행위가 있을 경우에 사회 집단은 합심하여 대응하게 된다."},{"n":3,"en":"In other words, opposition to deviant behavior creates opportunities for cooperation essential to the survival of any group.","ko":"바꿔 말해서, 일탈 행위에 대한 반대가 어떤 집단이든 그 생존에 없어서는 안 될 협동의 기회를 만들어 낸다."},{"n":4,"en":"When social life moves along normally, people take one another and the meaning of their social interdependence for granted.","ko":"사회생활이 정상적으로 흘러갈 때 사람들은 서로와, 서로 간의 사회적 상호 의존성의 의미를 당연시한다."},{"n":5,"en":"A deviant act, however, reawakens their group attachments and loyalties because it represents a threat to the moral order of the group.","ko":"하지만 일탈 행위는 집단의 도덕 질서에 대한 위협을 보여 주기 때문에 사람들의 집단 애착과 충성심을 다시 일깨운다."},{"n":6,"en":"The deviant act focuses people's attention on the value of the group.","ko":"일탈 행위는 사람들의 주의를 집단의 가치에 집중시킨다."},{"n":7,"en":"Perceiving itself under pressure, the group marshals its forces to protect itself and preserve its existence.","ko":"압박을 받고 있다는 점을 인지한 집단은 스스로를 보호하고 그것의 존재를 지키기 위해서 집단의 힘을 모은다."},{"n":8,"en":"Deviance also offers society's members an opportunity to rededicate themselves to their society's forms of social controls.","ko":"일탈 행위는 또한 사회 구성원들에게 그들 사회의 사회 통제의 형태에 다시 헌신할 기회를 제공한다."}]},{"id":"nje04-08","unit":"nje04","number":8,"title":"p34 no.040","core":"안전하다는 이성적 판단만으로 두려움에 대한 신체 반응을 억제하기는 어렵다.","flow":[{"label":"두려움의 성격","sentences":"S1–3","text":"현대의 두려움은 심리적이어도 몸이 반응한다.","refs":[1,3]},{"label":"Darwin의 실험","sentences":"S4–11","text":"유리 뒤의 뱀이 안전하다고 알아도 공격 순간 몸이 물러났다.","refs":[4,11]},{"label":"반사 행동의 비유","sentences":"S12","text":"두려움 억제의 어려움을 재채기 중 눈 깜빡임에 비유한다.","refs":[12]}],"structure":[{"title":"이성","text":"안전하다는 사실을 앎"},{"title":"신체","text":"의지와 무관하게 공포 반응을 보임"}],"key_sentence_en":"Knowing that we are safe does not necessarily stop the body’s fear response.","image":"../../assets/daea2-nje04-08-darwin-adder.webp","image_alt":"유리벽 너머 독사가 입을 벌리자, 다윈을 나타낸 인물이 안전함을 알면서도 반사적으로 몸을 움츠리는 개념 삽화","image_caption":"S4~11: 다윈은 유리 뒤의 뱀을 보고도 공격 순간 뒤로 물러났다. 이는 실제 당시 장면의 기록 사진이 아닌 개념 삽화다.","blocking_vocab":[{"word":"intellectually","meaning":"이성적으로"},{"word":"flinch","meaning":"움찔하다"},{"word":"powerless","meaning":"무력한"}],"checks":[{"type":"핵심","q":"다윈의 뱀 우리 경험이 보여 주는 것은?","choices":["안전하다고 생각하면 몸은 어떤 두려움도 느끼지 않는다.","안전하다고 알아도 몸의 두려움 반응은 이성만으로 막기 어렵다."],"answer":1,"why":"S3의 일반 진술 뒤 S5~11은 유리 뒤 뱀을 보고도 몸이 반응한 사례다.","refs":[3,5,6,7,8,9,10,11]},{"type":"사례 근거","q":"다윈이 이성적으로 안전하다고 알았던 이유는?","choices":["뱀이 유리 뒤에 있었기 때문에","뱀이 실제로 없는 그림이었기 때문에"],"answer":0,"why":"S7에 The snake was behind glass라고 나온다.","refs":[7]},{"type":"변형 탐지","q":"S10~11의 반응과 일치하는 것은?","choices":["He repeatedly jumped back; will and reason were powerless.","He never jumped back because reason completely controlled fear."],"answer":0,"why":"S9~11은 여러 번 실패하고 뱀이 치자 뒤로 뛰어 물러났다고 한다.","refs":[9,10,11]}],"sentences":[{"n":1,"en":"The fear we face is not physical, such as a fear of dying of exposure or a fear of wild animals, as it was for our ancestors.","ko":"우리가 직면하는 두려움은 우리의 선조들에게 그랬던 것처럼 노출되어 죽는 것에 대한 두려움이나 야생동물에 대한 두려움과 같이 물리적인 것이 아니다."},{"n":2,"en":"Our fears are often of a psychological nature.","ko":"우리의 두려움은 흔히 심리적인 본질을 갖고 있다."},{"n":3,"en":"But even when we know intellectually we are safe, our bodies will react.","ko":"그러나 우리가 안전하다는 것을 머리로 알고 있을 때조차 우리의 몸은 반응한다."},{"n":4,"en":"Back in 1872, Charles Darwin wrote about trying not to feel fear.","ko":"1872년으로 거슬러 올라가 Charles Darwin은 두려움을 느끼지 않으려고 노력하는 것에 관해 글을 썼다."},{"n":5,"en":"Visiting London's Zoological Gardens, he repeatedly put his face close to the glass of an adder cage.","ko":"런던 동물원을 방문했을 때 그는 반복적으로 그의 얼굴을 애더 우리의 유리창에 가까이 댔다."},{"n":6,"en":"He told himself not to flinch if the snake tried to strike.","ko":"그는 뱀이 공격하려고 해도 겁내어 피하지 말라고 자신에게 말했다."},{"n":7,"en":"After all, the snake was behind glass!","ko":"뱀은 어차피 유리 뒤에 있었으니까!"},{"n":8,"en":"His fear was purely psychological.","ko":"그의 두려움은 순전히 심리적인 것이었다."},{"n":9,"en":"But he failed again and again.","ko":"그렇지만 그는 반복해서 실패했다."},{"n":10,"en":"\"As soon as the blow was struck, my resolution went to nothing and I jumped a yard or two backwards with astonishing rapidity,\" he wrote in his book.","ko":"“공격이 있자마자, 나의 결심은 수포로 돌아갔고 나는 놀라울 정도의 빠른 속도로 1~2야드를 점프하듯 뒷걸음질쳤다.”라고 그는 자신의 책에 썼다."},{"n":11,"en":"\"Will and reason were powerless.\"","ko":"“의지와 이성은 무기력했다.”"},{"n":12,"en":"Telling ourselves not to feel fear is like telling ourselves not to blink when we sneeze.","ko":"우리 자신에게 두려움을 갖지 말라고 말하는 것은 우리 자신에게 재채기할 때 눈을 깜빡이지 말라고 말하는 것과 같다."}]},{"id":"nje04-09","unit":"nje04","number":9,"title":"p35 no.041","core":"정보 통신 기술은 신체적 이동을 대신하는 가상 이동성을 제공한다.","flow":[{"label":"이동성의 확장","sentences":"S1–2","text":"몸을 움직이지 않는 의사소통도 이동성으로 볼 수 있다.","refs":[1,2]},{"label":"기술의 활용","sentences":"S3–5","text":"장소와 국경을 넘어 업무·소통·문서 전송이 가능하다.","refs":[3,5]},{"label":"효과와 전망","sentences":"S6–7","text":"실제 이동을 줄이며 탄소 저감의 중요성과 함께 활용이 늘 전망이다.","refs":[6,7]}],"structure":[{"title":"가상 이동성","text":"통신 기술로 원격 업무와 교류"},{"title":"효과","text":"이동의 필요와 횟수 감소"}],"key_sentence_en":"Information and communication technology enables virtual mobility and reduces the need to travel.","blocking_vocab":[{"word":"virtual mobility","meaning":"가상 이동성"},{"word":"redundant","meaning":"불필요한"},{"word":"carbon reduction","meaning":"탄소 배출 감소"}],"checks":[{"type":"핵심","q":"정보 통신 기술이 제공하는 ‘가상 이동성’은 무엇인가?","choices":["몸을 이동하지 않고도 멀리 있는 사람과 일하고 소통할 수 있는 것","모든 사람이 물리적 이동 능력을 잃는 것"],"answer":0,"why":"S2~6은 전화·컴퓨터·인터넷을 통해 일부 이동 없이 일하고 소통하는 가능성을 설명한다.","refs":[2,3,4,5,6]},{"type":"사례 근거","q":"S3에서 사무실 밖에서 일하는 장소로 든 것은?","choices":["기차·호텔·집","오직 사무실 책상"],"answer":0,"why":"S3은 travelling on a train, staying at a hotel, working from home을 든다.","refs":[3]},{"type":"변형 탐지","q":"S6~7의 전망과 일치하는 것은?","choices":["ICT may reduce journeys and see wider use as carbon reduction gains importance.","ICT must increase journeys and become less useful as carbon reduction gains importance."],"answer":0,"why":"S6은 이동을 줄일 가능성을, S7은 탄소 감소가 중요해질수록 더 널리 쓰일 전망을 말한다.","refs":[6,7]}],"sentences":[{"n":1,"en":"In old age the inability to walk or to get out of one's chair unaided is signs of physical decline.","ko":"노년에는 걸을 수 없거나 도움 없이는 의자에서 나올 수 없는 것이 신체적인 쇠약의 징후들이다."},{"n":2,"en":"But we can also be mobile without moving our bodies ─ the telephone and the computer enable communication across the globe.","ko":"그러나 우리는 또한 우리의 몸을 움직이지 않고 이동성이 있을 수 있는데, 전화와 컴퓨터는 전 세계적으로 의사소통을 가능하게 한다."},{"n":3,"en":"Technological advances mean that mobile phones together with other aspects of information and communication technology (ICT) give certain office workers the ability to work away from the office ─ whether they are travelling on a train or staying at a hotel or working from home.","ko":"기술의 발전은 휴대 전화가 정보 통신 기술(ICT)의 다른 측면들과 함께 특정 사무직 근로자들에게 그들이 기차로 이동하든, 호텔에 머물든, 집에서 일하든, 사무실을 떠나서 일할 수 있는 능력을 제공한다는 것을 의미한다."},{"n":4,"en":"We live in an era in which ICT has transformed daily life: 'virtual mobility' has arrived, as many journeys are now redundant because of the use of computers linked to the Internet.","ko":"우리는 ICT가 일상을 변화시킨 시대에 살고 있는데, 인터넷에 연결된 컴퓨터의 사용으로 인해 현재 많은 여행이 불필요하기에 '가상 이동성'이 도래했다."},{"n":5,"en":"It is now possible for people in different countries to communicate and send documents easily using the World Wide Web.","ko":"이제 서로 다른 나라의 사람들이 월드 와이드 웹을 이용하여 쉽게 소통하고 문서를 보내는 것이 가능하다."},{"n":6,"en":"This has the potential to reduce travelling and to reduce the number of journeys, which are thought necessary.","ko":"이것은 이동하는 것을 줄이고 필요하다고 생각되는 여행의 수를 줄일 수 있는 잠재력을 가지고 있다."},{"n":7,"en":"As the world takes carbon reduction more seriously then we can expect that much more extensive use will be made of this technology.","ko":"세계가 탄소 저감을 더 심각하게 받아들일 때 우리는 이 기술을 훨씬 더 광범위하게 사용하게 될 것이라고 기대할 수 있다."}]},{"id":"nje04-10","unit":"nje04","number":10,"title":"p35 no.042","core":"글쓰기·연필·컴퓨터의 용도는 처음 의도한 목적에서 달라졌다.","flow":[{"label":"쓰기","sentences":"S1–4","text":"쓰기의 초기 기능은 전달보다 물품 정보의 저장에 가까웠다.","refs":[1,4]},{"label":"연필","sentences":"S5–8","text":"표시 도구가 글쓰기와 예술의 도구로 쓰였다.","refs":[5,8]},{"label":"컴퓨터","sentences":"S9–11","text":"계산기를 대체하려던 컴퓨터가 타자기를 대신하게 되었다.","refs":[9,11]}],"structure":[{"title":"최초 목적","text":"저장·표시·계산"},{"title":"후대의 활용","text":"의사소통·글쓰기·예술"}],"key_sentence_en":"Writing technologies often acquire uses different from their original purposes.","diagram":{"kind":"cases","title":"도구마다 달라진 쓰임 · 서로 독립된 세 사례","items":[{"head":"쓰기","body":"처음에는 기억·재고 기록을 위한 수단으로 여겨졌고, 이후 의사소통의 매체가 되었다. 고고학적 증거가 초기 용도를 시사한다.","refs":[2,3]},{"head":"연필","body":"흑연은 처음 양을 표시하는 데 쓰였을 수 있고, 목수의 표시 도구를 거쳐 문장가·예술가에게 쓰였다.","refs":[5,6,7,8]},{"head":"컴퓨터","body":"처음에는 계산을 간소화하려 만들어졌고, 지금은 책상에서 타자기를 대체하는 쓰기 환경이 되었다.","refs":[9,10,11]}],"takeaway":"쓰기→연필→컴퓨터가 한 발명의 직선 계보라는 뜻이 아니다. 각 도구의 초기 목적과 후속 쓰임을 따로 비교한다 · S1~11"},"blocking_vocab":[{"word":"repurpose","meaning":"용도를 바꾸어 쓰다"},{"word":"inventory","meaning":"재고"},{"word":"arithmetic","meaning":"산술"}],"checks":[{"type":"핵심","q":"글쓰기·연필·컴퓨터의 공통점은?","choices":["초기의 목적과 달리 새로운 용도로 널리 쓰이게 되었다.","처음부터 오늘날의 글쓰기만을 위해 만들어졌다."],"answer":0,"why":"S2~3의 기록, S5~8의 연필, S9~11의 컴퓨터가 초기 목적과 이후 용도를 대비한다.","refs":[2,3,5,6,7,8,9,10,11]},{"type":"초기 목적 근거","q":"S3에서 글쓰기가 처음 사용된 목적으로 든 것은?","choices":["고대 지중해 지역의 재고를 추적하는 것","모든 나라에 연설을 전송하는 것"],"answer":0,"why":"S3은 track inventory, not to record speech라고 한다.","refs":[3]},{"type":"변형 탐지","q":"컴퓨터의 초기 목적에 관해 S9~10과 맞는 것은?","choices":["It was invented to simplify arithmetic calculations, not to replace the typewriter.","It was invented to replace the typewriter, not to simplify arithmetic calculations."],"answer":0,"why":"S9~10은 컴퓨터가 처음에는 글쓰기보다 계산을 위해 발명되었다고 한다.","refs":[9,10]}],"sentences":[{"n":1,"en":"Not all writing technologies begin with communication in mind.","ko":"모든 글쓰기 기술이 의사소통을 염두에 두고 시작되는 것은 아니다."},{"n":2,"en":"Writing, the first and most basic communication technology, was conceived initially as more of a memory device than a medium for transmitting words across time and space.","ko":"최초이자 가장 기본적인 의사소통 기술인 글쓰기는 처음에는 시공간을 넘나들며 말을 전달하는 매체라기보다는 기억 장치에 더 가깝다고 생각되었다."},{"n":3,"en":"Archaeological evidence suggests that it arose in the ancient Mediterranean to track inventory, not to record speech.","ko":"고고학적 증거는 그것(쓰기)이 고대 지중해에서 말을 기록하기 위해서가 아니라 물품 목록을 추적하기 위해 생겨났음을 시사한다."},{"n":4,"en":"Had writing remained just a storage device, we probably wouldn't be considering how computers shape reading and writing today.","ko":"쓰기가 단지 저장 장치에 머물렀다면, 우리는 아마도 오늘날 컴퓨터가 읽기와 쓰기를 어떻게 형성하는지를 고려하지 않을 것이다."},{"n":5,"en":"Like writing, the pencil is a repurposed technology.","ko":"연필은 글쓰기와 마찬가지로 용도가 변경된 기술이다."},{"n":6,"en":"Graphite chunks may have initially been used to mark sheep.","ko":"흑연 덩어리는 처음에 양에 표시하는 데 사용되었을 수 있다."},{"n":7,"en":"Carpenters later attached handles to the graphite and used their new \"pencils\" to mark where to cut their wood.","ko":"목수들은 나중에 흑연에 손잡이를 부착하고 나무를 자를 곳을 표시하기 위해 새로운 '연필'을 사용했다."},{"n":8,"en":"But when wordsmiths and artists got hold of the invention, its success was assured.","ko":"그러나 문장가와 예술가들이 그 발명품을 손에 넣었을 때 그것의 성공이 보장되었다."},{"n":9,"en":"At first the computer, as its name suggests, had nothing to do with writing.","ko":"처음에 컴퓨터는 그 이름에서 알 수 있듯이 쓰기와 아무런 관련이 없었다."},{"n":10,"en":"It was invented to simplify long, tedious arithmetic calculations and was meant to replace the adding machine, not the typewriter.","ko":"그것은 길고 지루한 산술 계산을 단순화하기 위해 발명되었으며, 타자기가 아닌 계산기를 대체하기 위한 것이었다."},{"n":11,"en":"But while we still use calculators ─ pocket-sized digital adding machines ─ typewriters are long gone from our desks.","ko":"그러나 우리는 여전히 계산기(소형의 디지털 계산기)를 사용하고 있지만, 타자기는 책상에서 사라진 지 오래되었다."}]},{"id":"nje04-11","unit":"nje04","number":11,"title":"p36 no.043","core":"건강 정보와 지원이 늘면서 사람들은 건강 관리에서 더 적극적인 역할을 맡고 있다.","flow":[{"label":"정보와 지원","sentences":"S1–3","text":"대중의 지식과 보험사·지역 사회의 지원이 늘어난다.","refs":[1,3]},{"label":"환자의 행동","sentences":"S4","text":"환자들이 약물 정보를 배우고 의사에게 질문한다.","refs":[4]},{"label":"태도의 대조","sentences":"S5","text":"의사에게 맡기는 사람과 자신의 역할·책임을 늘리는 사람을 대조한다.","refs":[5]}],"structure":[{"title":"환경 변화","text":"건강 정보와 예방 지원 증가"},{"title":"참여 변화","text":"개인의 적극적 역할과 책임 증가"}],"key_sentence_en":"People are taking a more informed and active role in their own health care.","blocking_vocab":[{"word":"preventive medicine","meaning":"예방 의학"},{"word":"remediation","meaning":"치료·개선"},{"word":"prescription drug","meaning":"처방약"}],"checks":[{"type":"핵심","q":"건강 관리에서 나타나는 변화로 글이 강조하는 것은?","choices":["일부 사람이 정보와 지원을 바탕으로 더 적극적인 역할을 맡는다.","모든 사람이 자신의 건강 관리를 전적으로 의사에게 맡긴다."],"answer":0,"why":"S1~4는 정보·지원의 증가를, S5는 적극적으로 책임지는 사람들의 증가를 말한다.","refs":[1,2,3,4,5]},{"type":"사례 근거","q":"처방약에 관해 환자들이 더 적극적으로 하는 행동은?","choices":["약의 부작용에 관한 질문을 전혀 하지 않는다.","약을 스스로 알아보고 의사에게 질문한다."],"answer":1,"why":"S4는 처방약에 대해 공부하고 의사에게 묻는다고 한다.","refs":[4]},{"type":"변형 탐지","q":"S5의 태도 차이와 일치하는 것은?","choices":["Everyone now rejects all medical authority and treats themselves alone.","Some still defer to physicians, while others take more responsibility for their care."],"answer":1,"why":"S5는 모두가 같은 선택을 하는 것이 아니라 두 태도가 공존한다고 한다.","refs":[5]}],"sentences":[{"n":1,"en":"The public is becoming increasingly informed about exercise programs, dietary habits, and ways to manage stress.","ko":"대중은 운동 프로그램, 식습관 그리고 스트레스를 관리하는 방법에 대해 점점 더 유식해지고 있다."},{"n":2,"en":"More health insurance companies are paying for preventive medicine as well as remediation, and some are asking clients to complete lifestyle surveys to identify positive and negative habits that affect their overall health.","ko":"더 많은 건강보험사들이 치료뿐만 아니라 예방 의학에 돈을 지불하고 있고, 몇몇 회사는 고객들에게 그들의 전반적인 건강에 영향을 끼치는 긍정적인 그리고 부정적인 습관을 확인하기 위해서 생활 방식 설문 조사를 마치도록 요청하고 있다."},{"n":3,"en":"Many communities also provide a wide variety of programs aimed at helping people improve the quality of their lives by finding a form of exercise that suits them.","ko":"많은 지역 사회들은 또한 사람들이 자신에게 잘 맞는 운동 형태를 찾아 삶의 질을 개선하도록 돕는 것을 목표로 하는 다양한 프로그램을 제공한다."},{"n":4,"en":"With increased attention being paid to the possible side effects of drugs and medications, many patients are taking steps to educate themselves about prescription drugs and to question their physicians about the medications they prescribe.","ko":"의약품의 있을 수 있는 부작용에 더 많은 관심을 기울이면서 많은 환자가 처방약에 대해 스스로 공부하고, 의사들이 처방하는 약물에 관해 그들에게 물어보는 조치를 취하고 있다."},{"n":5,"en":"Some people still prefer to give authority for health care to their physicians, but others are taking a more active role and assuming more responsibility in their health care.","ko":"어떤 사람들은 건강 관리에 관한 권한을 자신의 의사에게 일임하는 것을 여전히 선호하지만, 다른 사람들은 더 적극적인 역할을 취하고 있고 자신의 건강 관리에 있어 더 많은 책임을 맡고 있다."}]},{"id":"nje04-12","unit":"nje04","number":12,"title":"p36 no.044","core":"아이들의 스트레스에는 개인적 경험뿐 아니라 부모의 불안과 뉴스 등 주변 요인도 영향을 준다.","flow":[{"label":"개인적 요인","sentences":"S1–3","text":"부모와의 분리, 학업, 대인 관계가 스트레스를 만든다.","refs":[1,3]},{"label":"부모의 영향","sentences":"S4–6","text":"부모의 걱정을 듣고 아이도 불안을 느낄 수 있다.","refs":[4,6]},{"label":"외부 사건","sentences":"S7–9","text":"뉴스와 질병·죽음·이혼 같은 사건도 스트레스를 유발한다.","refs":[7,9]}],"structure":[{"title":"직접적 경험","text":"분리·학업·교우 관계"},{"title":"주변 환경","text":"부모의 걱정·뉴스·가족 사건"}],"key_sentence_en":"Children’s stress can come from both their own experiences and events around them.","blocking_vocab":[{"word":"overwhelmed","meaning":"감당하기 어려운"},{"word":"intensify","meaning":"심해지다"},{"word":"complicating factor","meaning":"상황을 더 어렵게 하는 요인"}],"checks":[{"type":"핵심","q":"아이들의 스트레스에 영향을 주는 요인으로 글이 설명하는 것은?","choices":["학교 성적 하나뿐","아이 자신의 경험뿐 아니라 부모의 불안과 뉴스 등 주변 환경"],"answer":1,"why":"S2~3은 개인 경험, S4~9는 부모의 대화·세계 뉴스·상실 등 다른 요인을 제시한다.","refs":[2,3,4,5,6,7,8,9]},{"type":"인과 근거","q":"부모가 아이 근처에서 걱정을 이야기할 때 주의해야 하는 이유는?","choices":["아이가 부모의 불안을 받아들여 스스로 걱정할 수 있어서","아이는 부모의 대화를 절대 듣지 않아서"],"answer":0,"why":"S5~6은 아이들이 부모의 불안을 알아차리고 자신도 걱정하기 시작한다고 한다.","refs":[5,6]},{"type":"변형 탐지","q":"S7~8의 세계 뉴스 효과와 일치하는 것은?","choices":["Disturbing news can make children worry about their own and loved ones' safety.","Disturbing news cannot affect children's sense of safety."],"answer":0,"why":"S7~8은 재난·전쟁·테러 보도가 안전에 대한 걱정을 일으킬 수 있다고 한다.","refs":[7,8]}],"sentences":[{"n":1,"en":"Stress can affect anyone who feels overwhelmed ─ even kids.","ko":"스트레스는 심적인 부담감을 느끼는 누구에게나, 심지어 아이들에게도 영향을 끼칠 수 있다."},{"n":2,"en":"In preschoolers, separation from parents can cause anxiety.","ko":"취학 전 아동들에게 있어 부모와의 분리는 불안감을 유발할 수 있다."},{"n":3,"en":"As kids get older, academic and social pressures (especially from trying to fit in) create stress.","ko":"아이들이 나이가 들어감에 따라, 학업 부담감과 (특히 어울리려고 노력하는 것으로부터의) 사교적 압박이 스트레스를 유발한다."},{"n":4,"en":"Kids' stress may be intensified by more than just what's happening in their own lives.","ko":"아이들의 스트레스는 단지 그들의 삶 속에서 일어나고 있는 일들 이상의 것들에 의해서 증폭될 수 있다."},{"n":5,"en":"Do your kids hear you talking about troubles at work, worrying about a relative's illness, or arguing with your spouse about financial matters?","ko":"당신의 자녀가 당신이 직장에서의 문제에 대해서 얘기하는 것이나 친척의 질병에 대해서 걱정하는 것 혹은 재정적인 문제에 대해서 배우자와 언쟁하는 것을 듣는가?"},{"n":6,"en":"Parents should watch how they discuss such issues when their kids are near because children will pick up on their parents' anxieties and start to worry themselves.","ko":"부모는 아이들이 가까이 있을 때 그런 문제들에 대해서 자신들이 의논하는 방식에 주의해야 하는데, 왜냐하면 아이들은 부모의 걱정을 알아채고 그들 스스로 걱정하기 시작할 것이기 때문이다."},{"n":7,"en":"World news can cause stress.","ko":"세계 뉴스가 스트레스를 유발할 수 있다."},{"n":8,"en":"Kids who see disturbing images on TV or hear talk of natural disasters, war, and terrorism may worry about their own safety and that of the people they love.","ko":"TV에서 충격적인 이미지를 보거나 자연재해, 전쟁 그리고 테러에 대한 얘기를 듣는 아이들은 자신의 안전과 자신이 사랑하는 사람들의 안전에 대해서 걱정할 수도 있다."},{"n":9,"en":"Also, be aware of complicating factors, such as an illness, death of a loved one, or a divorce.","ko":"또한 질병, 가까운 사람의 죽음 또는 이혼과 같이 문제를 악화시키는 요인들을 알아야 한다."}]},{"id":"nje04-13","unit":"nje04","number":13,"title":"p37 no.045","core":"온라인 공동체는 시공간과 대면 만남의 어려움을 넘어 사회적 교류 기회를 넓힌다.","flow":[{"label":"폭넓은 만남","sentences":"S1–3","text":"유사점과 이해를 나눌 사람을 시간·거리 제약 없이 만날 수 있다.","refs":[1,3]},{"label":"이동의 제약","sentences":"S4","text":"고립된 지역이나 장애로 대면 만남이 어려운 사람에게 유용하다.","refs":[4]},{"label":"정서적 어려움","sentences":"S5","text":"외로움이나 오해를 느끼는 사람도 다른 교류 기회를 얻는다.","refs":[5]}],"structure":[{"title":"대면 만남의 제약","text":"거리·시간·이동·정서적 어려움"},{"title":"온라인의 기회","text":"더 폭넓고 유연한 사회적 교류"}],"key_sentence_en":"Online communities expand opportunities for social interaction beyond offline limitations.","blocking_vocab":[{"word":"time constraint","meaning":"시간 제약"},{"word":"homebound","meaning":"집에만 머무는"},{"word":"virtual community","meaning":"온라인 공동체"}],"checks":[{"type":"핵심","q":"온라인 공동체의 장점으로 글이 강조하는 것은?","choices":["같은 지역에 사는 사람만 만날 수 있게 제한한다.","거리·시간·이동의 제약을 넘어 교류 기회를 넓힌다."],"answer":1,"why":"S1~5는 전 세계 연결, 유연한 시간, 고립·이동 제약이 있는 사람의 교류를 제시한다.","refs":[1,2,3,4,5]},{"type":"대상 근거","q":"S4에서 온라인 교류가 특히 도움이 될 수 있는 사람은?","choices":["지리적으로 고립됐거나 장애로 집에 머무는 사람","이미 매일 모든 사람을 직접 만나는 사람만"],"answer":0,"why":"S4는 지리적으로 고립되거나 이동 제한으로 집에 머무는 사람을 명시한다.","refs":[4]},{"type":"변형 탐지","q":"S2의 온라인 소통 특성과 일치하는 것은?","choices":["People can post and read messages at times that suit them across long distances.","People must be in the same place and online at exactly the same time."],"answer":0,"why":"S2는 거리와 시간 제약이 적고 자신에게 맞는 시간에 읽고 쓸 수 있다고 한다.","refs":[2]}],"sentences":[{"n":1,"en":"Sitting in front of the computer, individuals can meet people all over the world who they may share some similarities with, or who potentially have an understanding of their specific situation.","ko":"컴퓨터 앞에 앉아 사람들은 유사점을 함께 공유하거나 자신의 특정한 상황을 이해할 가능성이 있는 전 세계 사람들과 만날 수 있다."},{"n":2,"en":"Unrestricted by geographical distance or time constraints, individuals are provided with the flexibility to post and read messages at times that suit them best and interact with others who live in other neighborhoods, regions or even countries.","ko":"지리적 거리나 시간적 제약에 제한받지 않고, 사람들은 자신들에게 가장 편한 시간에 메시지를 게재하고 읽으며, 다른 동네, 다른 지역 또는 심지어 다른 나라에 사는 다른 이들과 상호 작용할 유연성을 제공받는다."},{"n":3,"en":"In this way, online communities technically allow people to meet others who they would not be able to without the Internet.","ko":"이런 식으로, 온라인 커뮤니티는 기술적으로 사람들이 인터넷이 없으면 만날 수 없을 다른 이들과 만나도록 해 준다."},{"n":4,"en":"This might be especially helpful for people who have difficulties meeting others in real life because they live in geographically isolated parts of the world, or are homebound because of disabilities that restrict their mobility.","ko":"이것은 세계의 지리적으로 고립된 지역에 살고 있어서 '실생활'에서는 다른 이들을 만나는 데 어려움이 있는 또는 그들의 이동성을 제약하는 장애 때문에 집에만 머무는 사람들에게 특히 도움이 될 것이다."},{"n":5,"en":"Also for people who feel ashamed, lonely or misunderstood in the situation they are facing, participating in a virtual community can provide them with the opportunity to engage in social interaction in a manner less easily found offline.","ko":"또한 부끄러워하거나, 외롭거나, 직면하고 있는 상황에서 오해를 받고 있다고 느끼는 사람들의 경우, 가상 커뮤니티에 참여하는 것은 오프라인에서는 덜 쉽게 발견되는 방식으로 사회적 상호 작용에 참여할 기회를 그들에게 제공할 수 있다."}]},{"id":"nje04-14","unit":"nje04","number":14,"title":"p37 no.046","core":"기술은 식량 확보·접근·조리 방식을 바꾸어 인간의 음식 선택을 넓혀 왔다.","flow":[{"label":"식량 확보의 변화","sentences":"S1","text":"채집에서 기술적 재배로 환경 적응 방식이 바뀌었다.","refs":[1]},{"label":"현대 기술의 영향","sentences":"S2–4","text":"음식의 다양성·교류·접근성과 선택 조건이 달라졌다.","refs":[2,4]},{"label":"불과 조리의 사례","sentences":"S5–8","text":"불은 식량 환경 통제와 안전하고 먹기 좋은 음식에 기여했다.","refs":[5,8]}],"structure":[{"title":"기술의 작용","text":"재배·접근·조리 방식 변화"},{"title":"음식 선택","text":"종류와 이용 가능성의 확대"}],"key_sentence_en":"Technology has shaped human food choices by changing food production, access, and preparation.","blocking_vocab":[{"word":"cultivation","meaning":"재배"},{"word":"microorganism","meaning":"미생물"},{"word":"digestible","meaning":"소화하기 쉬운"}],"checks":[{"type":"핵심","q":"기술이 인간의 음식 선택에 미친 영향은?","choices":["재배·접근·조리 방식을 바꾸어 선택의 폭을 넓혔다.","음식 선택을 오직 채집 한 가지 방식으로 제한했다."],"answer":0,"why":"S1~5는 재배와 접근, 다양한 식단을, S6~8은 불을 이용한 조리를 설명한다.","refs":[1,2,3,4,5,6,7,8]},{"type":"조리 근거","q":"오늘날 불로 음식을 조리하는 효과로 S8이 든 것은?","choices":["해로운 미생물의 수를 늘린다.","해로운 미생물을 없애 안전성과 소화 가능성을 높인다."],"answer":1,"why":"S8은 미생물 파괴를 통해 더 안전하고 먹기 쉽고 소화하기 쉬워진다고 한다.","refs":[8]},{"type":"변형 탐지","q":"S6~7의 초기 불 사용과 일치하는 것은?","choices":["Fire removed all human control over food and attracted predators.","Fire helped control the food environment and may have deterred predators."],"answer":1,"why":"S6은 음식 환경에 대한 통제를, S7은 포식자를 겁주었을 가능성을 제시한다.","refs":[6,7]}],"sentences":[{"n":1,"en":"Evolution and culture have allowed humans to adapt to the environment by exchanging primitive methods of foraging for more reliable technological methods of food cultivation.","ko":"진화와 문화는 먹을 것을 찾아다니는 원시적인 방식을 식량 재배라는 보다 더 믿음직한 기술적인 방식으로 교체함으로써 인간이 환경에 적응할 수 있게 해 주었다."},{"n":2,"en":"Modern food technology has increased the variety of food choices and the interaction between culturally different societies and has encouraged the sampling of different cuisines.","ko":"현대의 식품 기술은 음식 선택의 다양성과 문화적으로 서로 다른 사회 간의 상호 작용을 증가시켰으며 다양한 요리들을 맛보도록 촉진했다."},{"n":3,"en":"Technology has changed human eating behaviors by allowing food to be easily accessed in industrialized societies.","ko":"기술은 산업화된 사회에서 음식을 쉽게 얻을 수 있게 함으로써 인간의 섭식 행동을 변화시켰다."},{"n":4,"en":"Globally, technology influences food choices by determining what, how much, and where food is available.","ko":"전 세계적으로, 기술은 어떤 음식을, 얼마나, 어디에서 구할 수 있는지를 결정함으로써 음식의 선택에 영향을 준다."},{"n":5,"en":"Cooking is one technology that has helped to expand human food choices.","ko":"조리는 인간의 음식 선택을 확장시키는 데 도움을 준 하나의 기술이다."},{"n":6,"en":"Early humans used fire to obtain more control over their food environment.","ko":"초기 인간들은 불을 사용하여 자신들의 음식 환경에 대한 더 많은 통제력을 확보했다."},{"n":7,"en":"The fire itself may have also protected humans by frightening away predators and decreasing the competition for food.","ko":"불 그 자체는 또한 포식자들을 겁줘서 몰아내고 음식에 대한 경쟁을 줄임으로써 인간들을 보호했을 수도 있다."},{"n":8,"en":"Modern humans continue to use fire as a means of destroying potential harmful microorganisms, making foods safer, more edible, and more digestible.","ko":"현대인은 잠재적으로 해로운 미생물을 없애는 수단으로 계속해서 불을 사용하여 음식을 더 안전하게, 더 먹을 수 있게 그리고 더 소화가 잘 되게 한다."}]}]},{"id":"nje05","label":"N제 5강","scope":"N제 p6~42 시험 범위","passages":[{"id":"nje05-01","unit":"nje05","number":1,"title":"p40 대표 기출 1","core":"인간은 불과 자연의 흐름, 생물 자원, 화석 연료의 외부 에너지를 활용하며 인공적인 복잡성을 확대했다.","flow":[{"label":"인간의 특성","sentences":"S1–2","text":"도구 사용을 확장하고 외부 에너지로 복잡한 형태를 만든 일은 새로운 발전이었다.","refs":[1,2]},{"label":"초기 활용","sentences":"S3–6","text":"불·기류·수류·농경·가축과 동물 근력으로 활용 범위를 넓혔다.","refs":[3,6]},{"label":"규모 확대","sentences":"S7","text":"화석 연료의 대규모 사용은 오늘날의 인공적인 복잡성을 확대했다.","refs":[7]}],"structure":[{"title":"초기 에너지 활용","text":"불의 통제와 바람·물의 이용"},{"title":"생물 자원 활용","text":"식물 경작과 가축·근력 이용"},{"title":"화석 연료","text":"다양한 기계와 대규모 인공 복잡성"}],"key_sentence_en":"Humans expanded artificial complexity by learning to control and use increasingly diverse external energy sources.","diagram":{"kind":"timeline","title":"외부 에너지 활용의 확대 · 간격은 축척 아님","items":[{"head":"약 150만~50만 년 전 · 가능성","body":"인간이 불을 통제하기 시작하며 외부 에너지 활용 능력이 생겼을 수 있다.","refs":[3]},{"head":"적어도 5만 년 전부터","body":"바람·물의 흐름을 항해에 이용했고, 기계 동력에는 훨씬 후대에 이용했다.","refs":[4]},{"head":"약 1만 년 전","body":"식물 재배와 동물 길들이기로 물질·에너지 흐름을 통제하고 동물의 근력도 이용했다.","refs":[5,6]},{"head":"약 250년 전","body":"화석 연료를 여러 기계에 대규모로 사용하기 시작했다.","refs":[7]}],"takeaway":"본문의 ‘may’, ‘at least’, ‘around’, ‘about’을 유지한 정성적 순서다 · S3~7"},"blocking_vocab":[{"word":"external energy source","meaning":"외부 에너지원"},{"word":"fossil fuel","meaning":"화석 연료"},{"word":"artificial complexity","meaning":"인공적 복잡성"}],"checks":[{"type":"핵심","q":"인간이 만든 복잡성의 발달을 글은 무엇과 연결하는가?","choices":["도구와 외부 에너지를 전혀 쓰지 않는 생활","불·자연의 흐름·동물의 힘·화석 연료 같은 외부 에너지 이용"],"answer":1,"why":"S1~7은 외부 에너지 활용이 확대되는 과정을 시간순으로 설명한다.","refs":[1,3,4,5,6,7]},{"type":"순서 근거","q":"본문에서 가장 이른 외부 에너지 이용 사례는?","choices":["약 250년 전의 화석 연료","약 150만~50만 년 전의 불 통제"],"answer":1,"why":"S3은 최초의 사례로 150만~50만 년 전 불 통제를 제시한다.","refs":[3,7]},{"type":"변형 탐지","q":"화석 연료 사용에 관한 S7과 맞는 것은?","choices":["Fossil fuels began powering many machines on a large scale about 250 years ago.","Fossil fuels began powering many machines on a large scale 50,000 years ago."],"answer":0,"why":"S7은 대규모 기계 동력으로 화석 연료를 쓰기 시작한 시기를 약 250년 전으로 둔다.","refs":[7]}],"sentences":[{"n":1,"en":"Not only are humans unique in the sense that they began to use an ever-widening tool set, we are also the only species on this planet that has constructed forms of complexity that use external energy sources.","ko":"인간은 점점 확장되는 도구 세트를 이용하기 시작했다는 점에서 유일무이할 뿐만 아니라 외부 에너지원을 이용하는 복잡한 형태를 만들어 낸 지구상의 유일한 종이기도 하다."},{"n":2,"en":"This was a fundamental new development, for which there were no precedents in big history.","ko":"이것은 근본적인 새로운 발전이었는데, 거대한 역사에서 그와 같은 전례는 없었다."},{"n":3,"en":"This capacity may first have emerged between 1.5 and 0.5 million years ago, when humans began to control fire.","ko":"이러한 능력은 인간이 불을 통제하기 시작한 150만 년 전에서 50만 년 전 사이에 처음으로 생겨났을지도 모른다."},{"n":4,"en":"From at least 50,000 years ago, some of the energy stored in air and water flows was used for navigation and, much later, also for powering the first machines.","ko":"적어도 5만 년 전부터 기류와 수류에 저장된 에너지의 일부가 운항에, 그리고 훨씬 후에는 최초의 기계에 동력을 제공하는 데에도 사용되었다."},{"n":5,"en":"Around 10,000 years ago, humans learned to cultivate plants and tame animals and thus control these important matter and energy flows.","ko":"1만 년 전 즈음에 인간은 식물을 경작하고 동물을 길들여서 이러한 중요한 물질과 에너지 흐름을 통제하는 법을 배웠다."},{"n":6,"en":"Very soon, they also learned to use animal muscle power.","ko":"곧 인간은 동물의 근력을 이용하는 법도 배웠다."},{"n":7,"en":"About 250 years ago, fossil fuels began to be used on a large scale for powering machines of many different kinds, thereby creating the virtually unlimited amounts of artificial complexity that we are familiar with today.","ko":"약 250년 전에는 많은 다양한 종류의 기계에 동력을 공급하는 데 화석 연료가 대규모로 사용되기 시작했고, 그렇게 함으로써 오늘날 우리에게 익숙한 사실상 무한한 양의 인공적인 복잡성을 만들어 냈다."}]},{"id":"nje05-02","unit":"nje05","number":2,"title":"p41 no.047","core":"성공한 개인의 공로뿐 아니라 성공을 가능하게 하는 공동체의 토대와 협력을 인정해야 한다.","flow":[{"label":"농사의 비유","sentences":"S1–2","text":"어려운 일은 씨앗을 심는 것보다 밭을 준비하는 것이다.","refs":[1,2]},{"label":"공동체의 가치","sentences":"S3–5","text":"공동체가 성취의 기반을 마련하므로 더 많은 공로를 인정해야 한다.","refs":[3,5]},{"label":"인물의 사례","sentences":"S6–9","text":"King의 위대함을 사람들의 공동 행동과 공동체의 역량을 이끈 역할에서 본다.","refs":[6,9]}],"structure":[{"title":"개인의 성취","text":"성공적인 씨앗을 심는 행동"},{"title":"공동체의 토대","text":"씨앗이 자라도록 밭과 환경을 마련하는 기여"}],"key_sentence_en":"Individual achievement depends on a community that creates the conditions for success and works together toward change.","blocking_vocab":[{"word":"give credit to","meaning":"공로를 인정하다"},{"word":"prosper","meaning":"번성하다"},{"word":"manifestation","meaning":"구현·화신"}],"checks":[{"type":"핵심","q":"성공의 공로를 평가할 때 글이 강조하는 것은?","choices":["성공한 개인뿐 아니라 가능하게 한 공동체와 협력도 인정해야 한다.","모든 성과는 오직 마지막에 눈에 띈 한 개인의 몫이다."],"answer":0,"why":"S3~5가 공동체의 토대 조성을 강조하고 S6~9가 이를 킹 목사의 사례로 풀어 낸다.","refs":[3,4,5,6,7,8,9]},{"type":"비유 근거","q":"씨앗 비유에서 공동체가 하는 일은?","choices":["씨앗이 자랄 밭과 환경을 준비한다.","자란 씨앗에만 이름을 붙인다."],"answer":0,"why":"S1~4는 밭 준비와 성공을 가능하게 하는 환경을 공동체의 역할로 설명한다.","refs":[1,2,3,4]},{"type":"변형 탐지","q":"마틴 루서 킹 목사의 역할에 관한 S7과 맞는 것은?","choices":["He inspired people to work together for social change.","He achieved social change without inspiring anyone to work together."],"answer":0,"why":"S7은 사람들을 함께 일하도록 고무한 능력을 중요한 강점으로 든다.","refs":[7]}],"sentences":[{"n":1,"en":"Every farmer knows that the hard part is getting the field prepared.","ko":"모든 농부는 밭이 준비되도록 하는 것이 어려운 부분임을 안다."},{"n":2,"en":"Inserting seeds and watching them grow is easy.","ko":"씨앗을 심고 그것들이 자라는 것을 지켜보는 것은 쉽다."},{"n":3,"en":"In the case of science and industry, the community prepares the field, yet society tends to give all the credit to the individual who happens to plant a successful seed.","ko":"과학과 산업의 경우에 공동체가 밭을 준비하지만, 사회는 우연히 성공적인 씨앗을 심는 개인에게 모든 공로를 돌리는 경향이 있다."},{"n":4,"en":"Planting a seed does not necessarily require overwhelming intelligence; creating an environment that allows seeds to prosper does.","ko":"씨앗을 심는 것은 반드시 엄청난 지능을 필요로 하지는 않는데, 씨앗이 번성하게 해 주는 환경을 만드는 것은 그러하다."},{"n":5,"en":"We need to give more credit to the community in science, politics, business, and daily life.","ko":"우리는 과학, 정치, 사업 그리고 일상에서 공동체에 좀 더 많은 공을 돌릴 필요가 있다."},{"n":6,"en":"Martin Luther King Jr. was a great man.","ko":"Martin Luther King Jr.는 위대한 사람이었다."},{"n":7,"en":"Perhaps his greatest strength was his ability to inspire people to work together to achieve, against all odds, revolutionary changes in society's perception of race and in the fairness of the law.","ko":"아마도 그의 가장 큰 강점은 모든 역경에 맞서 인종에 대한 사회의 인식과 법의 공정성에 있어 혁명적인 변화들을 성취하기 위해서 사람들이 함께 노력하도록 고무시키는 그의 능력이었다."},{"n":8,"en":"But to really understand what he accomplished requires looking beyond the man.","ko":"그러나 그가 성취한 것을 진정으로 이해하는 것은 그 사람을 넘어서 보는 것을 요구한다."},{"n":9,"en":"Instead of treating him as the manifestation of everything great, we should appreciate his role in allowing America to show that it can be great.","ko":"그를 위대한 모든 것의 표명으로 여기는 대신에 우리는 미국이 위대해질 수 있음을 보여 주게 하는 데 있어서 그의 역할을 인정해야 한다."}]},{"id":"nje05-03","unit":"nje05","number":3,"title":"p41 no.048","core":"Skinner의 실험에서 행동 뒤의 먹이 보상은 쥐가 이후에 막대를 누르는 행동에 영향을 주었다.","flow":[{"label":"실험 장치","sentences":"S1–4","text":"막대를 누르면 먹이를 주는 상자에서 행동의 발생 비율을 기록했다.","refs":[1,4]},{"label":"학습 과정","sentences":"S5–6","text":"처음의 우연한 행동이 먹이와 연결되면서 의도적 행동으로 바뀌었다.","refs":[5,6]},{"label":"결론","sentences":"S7","text":"행동 뒤에 주어진 보상이 이후의 행동에 영향을 미쳤다.","refs":[7]}],"structure":[{"title":"처음 행동","text":"우연히 또는 호기심으로 막대를 누름"},{"title":"먹이 제공","text":"막대를 누른 결과로 먹이를 받음"},{"title":"학습된 행동","text":"먹이를 받기 위해 의도적으로 막대를 누름"}],"key_sentence_en":"Food received after bar-pressing taught rats to repeat the action purposefully, showing the influence of reinforcement on future behavior.","lead":"막대를 누르면 먹이가 나오는 상자에서, 쥐의 행동은 어떻게 달라질까?","image":"../../assets/daea2-nje05-03-skinner-box.webp","image_alt":"투명한 실험 상자 안의 쥐가 막대를 누르고, 먹이 접시에 먹이 알갱이가 나오는 장면","image_caption":"본문 S2~6: 처음에는 우연히 누를 수 있지만, 먹이가 나온 뒤에는 목적을 갖고 누르게 된다.","prediction":{"q":"먹이가 막대 누르기 뒤에 나온다면 이후 행동은?","choices":["먹이를 얻으려고 막대를 누르게 된다.","먹이와 관계없이 누르기를 멈춘다."],"answer":0,"actual":"S5~7은 처음에는 우연히 누를 수 있지만 먹이가 나온 뒤에는 목적을 갖고 누르며, 그 결과가 이후 행동에 영향을 준다고 설명한다."},"blocking_vocab":[{"word":"bar-pressing","meaning":"막대를 누르는 행동"},{"word":"consequence","meaning":"결과"},{"word":"positive reinforcement","meaning":"긍정적 강화"}],"checks":[{"type":"핵심","q":"스키너 상자 실험에서 먹이 보상이 보여 준 것은?","choices":["먹이 제공은 이후 행동과 전혀 관계가 없다.","행동 뒤에 먹이가 나오면 이후 막대 누르기 행동에 영향을 준다."],"answer":1,"why":"S3과 S5~7은 누르기 뒤 먹이가 나오며 행동이 목적성을 띠게 되는 과정을 보여 준다.","refs":[3,5,6,7]},{"type":"순서 근거","q":"쥐가 처음 막대를 누를 때와 나중에 누를 때의 차이는?","choices":["처음부터 끝까지 먹이와 관계없이 우연히","처음에는 우연히, 나중에는 먹이를 얻으려고 의도적으로"],"answer":1,"why":"S5는 처음에는 우연이나 호기심일 수 있고 S6은 학습 뒤 의도적으로 누른다고 한다.","refs":[5,6]},{"type":"변형 탐지","q":"S7의 실험 결론과 맞는 것은?","choices":["Food appearing after a rat's action influenced its future behavior.","Food appearing after a rat's action never influenced its future behavior."],"answer":0,"why":"S7은 행동의 결과로 먹이가 나올 때 미래 행동에 영향을 주었다고 정리한다.","refs":[7]}],"sentences":[{"n":1,"en":"While working as a research fellow at Harvard, B. F. Skinner carried out a series of experiments on rats, using an invention that later became known as a \"Skinner box.\"","ko":"Harvard 대학에서 연구원으로 일하면서 B. F. Skinner는 후에 'Skinner 상자'로 알려지게 된 발명품을 사용하여 쥐를 대상으로 일련의 실험을 수행했다."},{"n":2,"en":"A rat was placed in one of these boxes, which had a special bar fitted on the inside.","ko":"이 상자들 중 하나에 쥐 한 마리가 넣어졌는데, 거기에는 내부에 부착된 특별한 막대가 있었다."},{"n":3,"en":"Every time the rat pressed this bar, it was presented with food.","ko":"쥐가 이 막대를 누를 때마다 그것은 먹이를 받았다."},{"n":4,"en":"The rate of bar-pressing was automatically recorded.","ko":"막대를 누르는 비율이 자동으로 기록되었다."},{"n":5,"en":"Initially, the rat might press the bar accidentally, or simply out of curiosity, and as a consequence receive some food.","ko":"처음에 쥐는 우연히 또는 단순히 호기심으로 막대를 눌렀을 것이고, 그 결과로 약간의 먹이를 받았을 것이다."},{"n":6,"en":"Over time, the rat learned that food appeared whenever the bar was pressed, and began to press it purposefully in order to be fed.","ko":"시간이 지나면서, 쥐는 막대가 눌러질 때마다 먹이가 나타난다는 것을 알게 되었고, 먹이를 받기 위해 일부러 그것을 누르기 시작했다."},{"n":7,"en":"Comparing results from rats given the \"positive reinforcement\" of food for their bar-pressing behavior with those that were not, or were presented with food at different rates, it became clear that when food appeared as a consequence of the rat's actions, this influenced its future behavior.","ko":"막대를 누르는 그것들의 행동에 대해 먹이라는 '긍정적인 강화'가 주어진 쥐들로부터 나온 결과와 그렇지 않았거나 다른 비율로 먹이를 받은 쥐들로부터 나온 결과를 비교해 보니, 쥐의 행동 결과로 먹이가 나타났을 때 이것이 그것의 향후 행동에 영향을 미쳤다는 것이 분명해졌다."}]},{"id":"nje05-04","unit":"nje05","number":4,"title":"p42 no.049","core":"글쓴이는 판매 유효 기한에 따른 폐기의 탄소 부담과 기한 산정 방식을 설명하고 상품 유형에 따른 구매 판단을 제시한다.","flow":[{"label":"기한과 폐기","sentences":"S1–3","text":"기한을 넘긴 상품의 폐기는 추가 운송과 탄소 부담으로 이어진다.","refs":[1,3]},{"label":"판단과 산정","sentences":"S4–7","text":"세대별 판단 차이와 제조자의 기한 산정 예를 설명한다.","refs":[4,7]},{"label":"상품 구별","sentences":"S8","text":"부패 가능성에 따라 대량 구매의 경제성을 구별한다.","refs":[8]}],"structure":[{"title":"판매 기한의 영향","text":"기한 초과가 폐기로 이어짐"},{"title":"글쓴이의 구별","text":"이동 기간·개별 판단·상품의 부패 가능성에 주목"}],"key_sentence_en":"The passage examines the environmental costs of discarding food by sell-by dates and distinguishes bulk buying according to perishability.","blocking_vocab":[{"word":"sell-by date","meaning":"판매 유효 기한"},{"word":"carbon footprint","meaning":"탄소 발자국"},{"word":"perishable","meaning":"상하기 쉬운"}],"checks":[{"type":"핵심","q":"판매 유효 기한을 둘러싼 글의 논의로 알맞은 것은?","choices":["기한 뒤 폐기는 탄소 부담을 늘리고, 제조사는 유통 기간을 고려해 기한을 정한다.","기한 뒤 폐기에는 운송이나 탄소 부담이 전혀 없다."],"answer":0,"why":"S1~3은 폐기의 탄소 부담, S5~6은 생산·운송 기간을 감안한 기한 산정을 설명한다.","refs":[1,2,3,5,6]},{"type":"계산 근거","q":"제조사가 90일을 소비 가능 기간으로 본다면 판매 기한을 정할 때 무엇을 빼는가?","choices":["이미 구매자가 먹은 기간","유통 중 이동에 걸린 기간"],"answer":1,"why":"S6은 90 days minus so many days for travelling로 정한다고 한다.","refs":[6]},{"type":"변형 탐지","q":"상품 유형별 구매에 관한 S8과 맞는 것은?","choices":["Large packs of perishable goods may be less sensible than cost-effective nonperishable items.","Large packs of perishable goods are always more sensible than nonperishable items."],"answer":0,"why":"S8은 상하기 쉬운 상품의 대용량 구매를 피하고 비부패성 상품의 경제성을 고려할 수 있다고 한다.","refs":[8]}],"sentences":[{"n":1,"en":"There is little doubt that we are driven by the sell-by date.","ko":"우리가 판매 유효 기한에 의해 움직인다는 것은 의심할 여지가 거의 없다."},{"n":2,"en":"Once an item is past that date it goes into the waste stream, further increasing its carbon footprint.","ko":"일단 어떤 품목이 그 기한을 지나면 폐기물 흐름으로 들어가고, 이는 그것의 탄소발자국을 더욱 증가시킨다."},{"n":3,"en":"Remember those items have already travelled hundreds of miles to reach the shelves and once they go into waste they start a new carbon mile journey.","ko":"그러한 품목들이 선반에 도달하기 위해 이미 수백 마일을 이동했고 일단 그것들이 버려지게 되면 그것들은 새로운 탄소 마일 여정을 시작한다는 것을 기억하라."},{"n":4,"en":"But we all make our own judgement about sell-by dates; those brought up during the Second World War are often scornful of the terrible waste they believe such caution encourages.","ko":"그러나 우리는 모두 판매 유효 기한에 대해 자신만의 판단을 내리는데, 제2차 세계 대전 중에 자란 사람들은 그들이 생각하기에 그런 조심스러운 태도가 조장하는 끔찍한 낭비를 흔히 경멸한다."},{"n":5,"en":"The manufacturer of the food has a view when making or growing something that by the time the product reaches the shelves it has already been travelling for so many days and possibly many miles.","ko":"식품 제조업자는 무엇인가를 만들거나 재배할 때 제품이 선반에 도달할 때면 그것은 이미 매우 오랫동안 그리고 아마도 상당한 거리를 이동해 왔다는 관점을 가지고 있다."},{"n":6,"en":"The manufacturer then decides that a product can reasonably be consumed within say 90 days and 90 days minus so many days for travelling gives the sell-by date.","ko":"그래서 제조업자는 제품이 약 90일 이내에는 무리 없이 소비될 수 있다고 결정하고 90일에서 이동에 필요한 많은 날을 뺀 것이 판매 유효 기한이 된다."},{"n":7,"en":"But whether it becomes toxic is something each individual can decide.","ko":"그러나 그것이 유독해지는지는 각 개인이 결정할 수 있는 것이다."},{"n":8,"en":"It would seem to make sense not to buy large packs of perishable goods but nonperishable items may become cost-effective.","ko":"큰 묶음의 상하기 쉬운 제품을 사지 않는 것이 이치에 맞는 것으로 보이겠지만, 상하지 않는 품목들의 경우에는 비용 효율이 높아질 수도 있다."}]},{"id":"nje05-05","unit":"nje05","number":5,"title":"p42 no.050","core":"이 글은 렉틴의 결합 특성을 설명하고 Gundry와 Saladino가 제시한 건강 영향의 주장과 가설을 소개한다.","flow":[{"label":"물질의 특성","sentences":"S1–3","text":"식물의 방어 단백질인 렉틴과 체내 당 분자의 결합을 설명한다.","refs":[1,3]},{"label":"Gundry의 주장","sentences":"S4–7","text":"세포 간 전달 방해와 여러 증상 및 환자 사례를 제시한다.","refs":[4,7]},{"label":"가설의 소개","sentences":"S8","text":"Saladino가 소개한 파킨슨병 관련 가설과 동물 연구의 추정 결과를 덧붙인다.","refs":[8]}],"structure":[{"title":"렉틴의 특성","text":"식물의 방어 기능과 결합 특성"},{"title":"소개된 견해","text":"Gundry의 건강 영향 주장과 Saladino의 관련 가설"}],"key_sentence_en":"The passage describes lectins and presents Gundry’s claims and Saladino’s discussion of possible links to health problems.","blocking_vocab":[{"word":"lectin","meaning":"렉틴 단백질"},{"word":"bind to","meaning":"~에 결합하다"},{"word":"hypothesis","meaning":"가설"}],"checks":[{"type":"핵심","q":"이 글은 렉틴에 관해 무엇을 소개하는가?","choices":["모든 건강 영향이 사람 대상 연구로 확정되었다는 결론","식물의 방어 단백질이라는 설명과 두 연구자의 건강 영향 주장·가설"],"answer":1,"why":"S1~3은 렉틴의 결합 특성을, S4~8은 Gundry의 주장과 Saladino가 소개한 가설·동물 연구를 전한다.","refs":[1,2,3,4,5,6,7,8]},{"type":"결합 근거","q":"S2에서 대부분 식물의 렉틴이 결합한다고 한 대상은?","choices":["화석 연료","식물을 먹을 때의 탄수화물"],"answer":1,"why":"S2에 bind to carbohydrates라고 직접 나온다.","refs":[2]},{"type":"변형 탐지","q":"파킨슨병 관련 내용의 제시 방식으로 S8과 맞는 것은?","choices":["Saladino introduces it as a hypothesis gaining support from animal studies.","Saladino states it as a conclusively proven result in humans."],"answer":0,"why":"S8은 hypothesis와 animal studies라고 명시한다. 사람에게 확정된 결론으로 바꾸면 안 된다.","refs":[8]}],"sentences":[{"n":1,"en":"Lectins are large proteins that serve as a crucial weapon that plants use to defend themselves.","ko":"렉틴은 식물들이 스스로를 방어하기 위해 사용하는 중요한 무기의 역할을 하는 커다란 단백질이다."},{"n":2,"en":"The lectins in most plants bind to carbohydrates as we consume the plant.","ko":"대부분의 식물에 있는 렉틴은 우리가 식물을 섭취할 때 탄수화물과 결합한다."},{"n":3,"en":"They also bind to sugar molecules found in the gut, in the brain, between nerve endings, in joints and in all bodily fluids.","ko":"그것들은 또한 장, 뇌, 신경 말단 사이, 관절 및 모든 체액에서 발견되는 당 분자들과 결합한다."},{"n":4,"en":"According to Dr. Steven Gundry, these sticky proteins can interrupt messaging between cells and cause toxic and inflammatory reactions.","ko":"Steven Gundry 박사에 따르면, 이 끈적끈적한 단백질은 세포들 간의 메시지 전달을 방해하고 독성 및 염증성 반응을 일으킬 수 있다."},{"n":5,"en":"Brain fog is just one result of lectins interrupting communication between nerves.","ko":"뇌 피로 현상은 렉틴이 신경들 간의 소통을 방해하는 하나의 결과일 뿐이다."},{"n":6,"en":"An upset stomach is another common symptom of lectin overload.","ko":"위장 장애는 렉틴 과다의 또 다른 흔한 증상이다."},{"n":7,"en":"Dr. Gundry lists a wide range of other health problems including aching joints, dementia, headaches and infertility that have been resolved in his patients once they eliminated lectins from their diets.","ko":"Gundry 박사는 그의 환자들이 식단에서 렉틴을 제거하자 해결되었던 관절통, 치매, 두통 그리고 불임을 포함한 다양한 다른 건강 문제들을 열거한다."},{"n":8,"en":"Dr. Paul Saladino writes that the hypothesis that lectins are involved in Parkinson's disease is also gaining support, with animal studies showing that 'lectins, once eaten, may be damaging the gut and travelling to the brain, where they appear to be toxic to dopaminergic neurons'.","ko":"Paul Saladino 박사는 동물 연구들이 '렉틴이 일단 섭취되면 장에 손상을 입히고 뇌로 이동할 수 있는데, 그곳에서 그것들은 도파민 작용성 신경 세포에 유독한 것처럼 보인다'는 것을 보여 주는 가운데 렉틴이 파킨슨병과 관련이 있다는 가설 또한 지지를 얻고 있다고 기록한다."}]}]},{"id":"minute13","label":"미닛15 13회","scope":"1~6번 · 7·8번 제외","passages":[{"id":"minute13-01","unit":"minute13","number":1,"title":"13회 01번","core":"경고성 발언은 자기 힘의 과시가 아니라 상사와의 권력 다툼에 돌입하는 것이고 결국 문제 직원으로 낙인찍히므로, 상사에게 경고성 발언을 해서는 안 된다.","flow":[{"label":"반문과 결과","sentences":"S1–2","text":"상사들이 겁을 먹을 수 있어서 지금의 자리에 올랐겠는가 — ‘인상해 주지 않으면 그만두겠다’ 같은 경고성 어구는 결국 해고·전출을 부른다.","refs":[1,2]},{"label":"상사의 대응","sentences":"S3","text":"상사들은 시간을 자기편에 두고 있어서, 우리가 그들을 궁지에 몰았다고 생각할 바로 그때 행동을 취하려 기다릴 수 있다.","refs":[3]},{"label":"오해와 반박","sentences":"S4–5","text":"여러분은 권력을 행사하고 힘을 보여 준다고 생각할 수도 있으나, 이는 자기 힘에 대한 매우 심각한 오해이다.","refs":[4,5]},{"label":"경고","sentences":"S6","text":"경고 발언은 상사와의 권력 다툼을 부르고, 이길 가능성도 희박한 데다 다른 상사들에게 문제 직원으로 낙인찍히게 만든다.","refs":[6]}],"structure":[{"title":"자신의 기대","text":"경고로 자신의 힘을 보여 준다고 생각한다."},{"title":"실제 결과","text":"상사와 다투고 다른 상사에게 문제 직원으로 보일 수 있다."}],"key_sentence_en":"Threatening your boss can backfire and make you seem like a problem employee.","blocking_vocab":[{"word":"intimidated","meaning":"위협받은"},{"word":"cornered","meaning":"궁지에 몰린"},{"word":"power struggle","meaning":"권력 다툼"}],"checks":[{"type":"핵심","q":"상사에게 경고성 발언을 하는 것에 대한 글의 태도는?","choices":["상사를 겁주면 대개 원하는 결과를 얻는다.","권력 다툼을 불러 불리해지므로 피해야 한다."],"answer":1,"why":"S2는 해고·전출 가능성을, S6은 권력 다툼과 문제 직원이라는 낙인을 경고한다.","refs":[2,6]},{"type":"인과 근거","q":"상사가 당장 반응하지 않더라도 경고성 발언이 위험한 이유는?","choices":["상사는 시간을 전혀 활용하지 못해서","상사는 기다렸다가 뒤늦게 조처할 수 있어서"],"answer":1,"why":"S3은 상사가 시간을 자기편에 두고 움직일 때를 기다릴 수 있다고 한다.","refs":[3]},{"type":"변형 탐지","q":"S6의 결과와 맞는 것은?","choices":["Other bosses may see the speaker as a problem employee.","Other bosses will always reward the speaker's warning."],"answer":0,"why":"S6의 brand you as a problem employee를 확인한다.","refs":[6]}],"sentences":[{"n":1,"en":"Do we really think that bosses got where they did because they could be intimidated?","ko":"우리는 정말로 상사들이 겁을 먹을 수 있어서 그들이 지금의 자리에 올랐다고 생각하는가 ?"},{"n":2,"en":"So phrases such as \"If I don't get this raise, I am going to walk\" or \"this budget has to increase or I am finding another position\" will likely get you on the street or transferred elsewhere—if not immediately then not long after.","ko":"그렇기 때문에 “만약 내가 이번에 봉급 인상을 받지 못한다면, 나는 그만둘 겁니다” 또는 “이 예산은 인상되어야 합니다, 그렇지 않으면 나는 다른 자리를 찾을 겁니다”와 같은 어구들은 바로는 아니더라도 얼마 지나지 않아 아마도 여러분을 길거리에 있게 하거나 다른 곳으로 전출되게 할 것이다."},{"n":3,"en":"Remember bosses have time on their side and can wait to make a move just when we think we might have them cornered.","ko":"우리가 그들을 궁지에 몰아넣었을지도 모른다고 생각하는 바로 그때, 상사들은 시간을 자기편에 두고 행동을 취하기를 기다릴 수 있다는 것을 기억하라 ."},{"n":4,"en":"You might think that you are exercising power and showing them your power.","ko":"여러분은 자신이 권력을 행사하고 있으며 그들에게 여러분의 힘을 보여 주고 있다고 생각할 수도 있다."},{"n":5,"en":"But you should realize that this is a very serious misunderstanding of your own power.","ko":"그러나 여러분은 이것이 여러분 자신의 힘에 대한 매우 심각한 오해라는 것을 깨달아야 한다."},{"n":6,"en":"When you give a warning statement, you enter into a power struggle with your boss—and even if you could win—which is a remote chance—you look bad in front of everyone else, especially other bosses who now brand you as a problem employee.","ko":"여러분이 경고 발언을 할 때, 여러분은 상사와 권력 다툼에 돌입하는 것이며, 가능성은 희박하지만 설령 이길 수 있다 하더라도 다른 모든 사람 앞에서, 특히 이제 여러분을 문제 직원으로 낙인찍는 다른 상사들 앞에서 나쁘게 보인다."}]},{"id":"minute13-02","unit":"minute13","number":2,"title":"13회 02번","core":"행복은 사람에게서 사람으로 전염되므로, 가장 행복한 사람들을 관찰해 그들의 태도·습관에서 얻은 교훈을 자신의 삶에 적용하라.","flow":[{"label":"관찰 대상","sentences":"S1–3","text":"여러분이 아는 가장 행복한 네 사람을 꼽아, 무엇이 그들을 그토록 행복하게 만드는지, 어떤 태도·습관·관점이 그들을 남다르게 하는지 생각해 보라.","refs":[1,3]},{"label":"관찰과 실천","sentences":"S4–6","text":"그들이 어떻게 살고 무엇에 집중하며 어려움에 어떻게 대응하는지 관찰해, 각자에게서 행복에 관한 교훈을 하나씩 얻어 자신의 삶에 적용해 보라.","refs":[4,6]},{"label":"인용과 근거","sentences":"S7–8","text":"Eric Hoffer의 말처럼 사람들은 자유로울 때 보통 서로를 모방하며, 행복 또한 전염성이 있는 것으로 입증되었다.","refs":[7,8]},{"label":"전염성 확인","sentences":"S9–11","text":"친구의 친구가 5천 달러보다 내 행복에 더 큰 영향을 미치고, 친구가 행복하면 내가 행복할 가능성이 15퍼센트 더 높으며, 하품·킥킥 웃음처럼 행복도 전염된다.","refs":[9,11]}],"structure":[{"title":"실천 제안","text":"행복한 사람을 관찰하고 교훈을 생활에 적용한다."},{"title":"근거","text":"행복은 사람 사이에서 전염될 수 있다."}],"key_sentence_en":"Happiness can spread through social connections, so learning from happy people may increase your own happiness.","diagram":{"kind":"cases","title":"행복을 배우고 나누는 세 측면","items":[{"head":"행복한 네 사람 떠올리기","body":"자신이 아는 사람 중 행복해 보이는 네 사람을 생각한다.","refs":[1]},{"head":"태도와 습관에서 배우기","body":"삶의 방식·초점·대응을 관찰하고 배운 점을 자기 삶에 적용해 본다.","refs":[2,3,4,5,6]},{"head":"관계를 통한 영향","body":"본문은 친구와 친구의 친구를 통한 행복의 영향을 설명한다.","refs":[8,9,10,11]}],"takeaway":"S10의 수치는 친구가 행복할 때 행복할 가능성이 ‘15% 더 높다’는 표현이지 15%p나 개인별 확정 효과가 아니다."},"blocking_vocab":[{"word":"contagious","meaning":"전염되는"},{"word":"imitate","meaning":"모방하다"},{"word":"perspective","meaning":"관점"}],"checks":[{"type":"핵심","q":"글에서 권하는 행복을 위한 실천은?","choices":["행복한 사람과의 관계를 모두 피한다.","행복한 사람들의 태도와 습관을 관찰해 삶에 적용한다."],"answer":1,"why":"S1~6은 행복한 네 사람을 관찰하고 얻은 교훈을 적용하라고 권한다.","refs":[1,2,3,4,5,6]},{"type":"수치 근거","q":"S10은 친구가 행복할 때 나의 행복 가능성이 어떻게 달라진다고 하는가?","choices":["15퍼센트 더 낮아진다.","15퍼센트 더 높아진다."],"answer":1,"why":"S10의 15 percent greater likelihood를 확인한다.","refs":[10]},{"type":"변형 탐지","q":"S9의 비교와 맞는 것은?","choices":["A friend's friend may affect happiness more than an extra $5,000.","An extra $5,000 always affects happiness more than a friend's friend."],"answer":0,"why":"S9은 친구의 친구가 추가 5천 달러보다 영향이 크다고 표현한다.","refs":[9]}],"sentences":[{"n":1,"en":"Can you possibly imagine listing four individuals—friends, business associates, or family members—who strike you as the happiest people you know?","ko":"혹시 여러분은 여러분이 아는 가장 행복한 사람으로 여겨지는 네 사람—친구, 직장 동료 , 또는 가족—을 꼽는 것을 상상할 수 있는가?"},{"n":2,"en":"If you can, take a moment to reflect on what makes them so joyful.","ko":"가능하다면, 잠시 시간을 내어 무엇이 그들을 그렇게 행복하게 만드는지 곰곰이 생각해 보라."},{"n":3,"en":"What attitudes, habits, or perspectives set them apart?","ko":"어떤 태도, 습관 또는 관점이 그들을 남다르게 만드는가?"},{"n":4,"en":"Try to observe how they live, what they focus on, and how they respond to challenges.","ko":"그들이 어떻게 생활하는지 , 그들이 무엇에 집중하는지 , 그리고 그들이 어려움에 어떻게 대응하는지 관찰해 보라."},{"n":5,"en":"From each of these four individuals, identify one meaningful lesson about happiness.","ko":"이 네 사람 각각으로부터 행복에 대한 의미 있는 교훈을 한 가지 확인해 보라."},{"n":6,"en":"Then, try to apply those lessons in your own life and see what changes follow.","ko":"그런 다음, 그 교훈을 자신의 삶에 적용해 보고 어떤 변화가 따르는지 살펴보라 ."},{"n":7,"en":"Eric Hoffer has written, \"When people are free to do as they please, they usually imitate each other.\"","ko":"Eric Hoffer는 “사람들은 자신이 원하는 대로 할 자유가 있을 때, 그들은 보통 서로를 모방한다 ”라고 썼다."},{"n":8,"en":"Happiness has also been proven to be contagious.","ko":"행복도 또한 전염성이 있는 것으로 입증되었다."},{"n":9,"en":"Your friend's friend has more effect on your happiness than an extra $5,000 in your pocket.","ko":"여러분 친구의 친구는 여러분의 주머니에 5천 달러가 더 생기는 것보다 여러분의 행복에 더 큰 영향을 미친다."},{"n":10,"en":"In fact, if your friend is happy, there's a 15 percent greater likelihood that you're going to be happy.","ko":"실제로 여러분의 친구가 행복하면, 여러분도 행복해질 가능성이 15퍼센트 더 높다."},{"n":11,"en":"We know that yawning and giggling can be contagious, but now you know that happiness is infectious as well.","ko":"우리는 하품과 킥킥 웃음이 전염될 수 있다는 것을 알지만, 이제 여러분은 행복도 또한 전염성이 있다는 것을 안다."}]},{"id":"minute13-03","unit":"minute13","number":3,"title":"13회 03번","core":"발전의 뿌리는 과학·기술 지식이지만 궁극적으로 과학과 번영에 동력을 제공하는 것은 인구수의 증가이며, 더 많은 인간의 지성이 곧 더 많은 발전이다.","flow":[{"label":"토대와 조건","sentences":"S1–2","text":"발전의 뿌리는 과학과 기술의 구축된 지식에 있지만, 그 발전적 성장이 꽃을 피우려면 대규모 인구의 증가도 필요해 보인다.","refs":[1,2]},{"label":"인과 관계","sentences":"S3–4","text":"Ferguson은 세계적 규모에서 발전의 근원이 팽창하는 인구라고 보며, 한계를 넘으려면 과학이 필요하지만 궁극적으로 과학과 번영에 동력을 제공하는 것은 인구수의 증가이다.","refs":[3,4]},{"label":"선순환","sentences":"S5–6","text":"이 선순환 속에서 더 많은 지성이 더 많이 발명하고 더 많은 인간을 부양할 발명품을 사들이므로, 더 많은 인간의 지성은 곧 더 많은 발전이다.","refs":[5,6]},{"label":"학자의 견해","sentences":"S7–8","text":"경제학자 Julian Simon은 인간의 지성을 ‘궁극의 자원’이라 부르며, 더 많은 지성이 심오한 발전의 가장 중요한 원천이라고 보았다.","refs":[7,8]}],"structure":[{"title":"인구 증가","text":"더 많은 지성이 발명하고 발명품을 구매한다."},{"title":"발전","text":"과학과 기술이 더 많은 인구를 부양한다."}],"key_sentence_en":"Population growth can drive progress by increasing the number of minds that invent and support new ideas.","diagram":{"kind":"cycle","title":"인구와 과학·기술의 선순환","items":[{"head":"더 많은 인간의 지성","body":"인구가 늘면서 생각하고 발명할 사람이 많아진다.","refs":[2,3,4,5]},{"head":"발명과 수요 증가","body":"더 많이 발명하고, 다시 더 많은 발명품을 구매한다.","refs":[5]},{"head":"기술과 번영","body":"도구·기술·방법이 더 많은 사람을 뒷받침하며 발전을 이끈다.","refs":[4,5,6]}],"takeaway":"이 글에서 과학도 인구를 한계 너머로 지탱하고, 늘어난 사람들의 지성이 다시 과학을 밀어준다 · S4~8"},"blocking_vocab":[{"word":"prosperity","meaning":"번영"},{"word":"virtuous circle","meaning":"선순환"},{"word":"ultimate resource","meaning":"궁극의 자원"}],"checks":[{"type":"핵심","q":"이 글이 설명하는 발전의 동력은?","choices":["인구와 무관하게 저절로 발전하는 기술","과학 지식과 더불어 늘어나는 인구와 인간의 지성"],"answer":1,"why":"S1~4는 과학 지식과 인구 증가의 관계를, S5~8은 더 많은 지성의 역할을 설명한다.","refs":[1,2,3,4,5,6,7,8]},{"type":"인과 근거","q":"S5의 선순환에서 사람이 많아지면 무엇이 일어나는가?","choices":["발명품을 만들거나 구매하는 일이 모두 사라진다.","더 많은 발명과 그것을 활용하는 수요가 생긴다."],"answer":1,"why":"S5는 more human minds invent more things and in turn buy more inventions라고 한다.","refs":[5]},{"type":"변형 탐지","q":"Julian Simon의 표현으로 S7과 맞는 것은?","choices":["He called human minds the ultimate resource.","He called human minds an obstacle to progress."],"answer":0,"why":"S7의 the ultimate resource를 확인한다.","refs":[7]}],"sentences":[{"n":1,"en":"Clearly, the roots of progress lie deep in the structured knowledge of science and technology.","ko":"분명히, 발전의 뿌리는 과학과 기술의 구축된 지식 깊은 곳에 존재한다."},{"n":2,"en":"But the flowering of this progressive growth seems to also need the growth of large human populations.","ko":"그러나 이런 발전적 성장이 꽃을 피우는 것은 또한 대규모 인구의 증가를 필요로 하는 것처럼 보인다."},{"n":3,"en":"Historian Niall Ferguson believes that on the global scale, the origins of progress lie only in expanding population.","ko":"사학자 Niall Ferguson은 세계적인 규모 에서 볼 때 발전의 근원 은 오직 팽창하는 인구 에 놓여 있다고 믿는다."},{"n":4,"en":"According to this theory, in order to elevate populations beyond Malthusian limits you need science, yet it is the increase in the number of humans that ultimately drives science, and then prosperity.","ko":"이런 이론에 따르면, 인구를 맬서스 이론의 한계를 넘어 증가시키기 위해서는 과학이 필요하지만, 궁극적으로 과학에, 그리고 다음으로 번영에 동력을 제공하는 것은 인구수의 증가 이다."},{"n":5,"en":"In this virtuous circle, more human minds invent more things and in turn buy more inventions, including tools, techniques, and methods that will support more humans.","ko":"이런 선순환 속에서 더 많은 인간 지성이 더 많은 것을 발명하고, 결과적으로 더 많은 인간을 부양할 도구 , 기술, 그리고 방식을 포함하여 더 많은 발명품을 사게 된다."},{"n":6,"en":"Therefore, more human minds equal more progress.","ko":"그러므로, 더 많은 인간의 지성은 더 많은 발전과 동등하다."},{"n":7,"en":"The economist Julian Simon called human minds \"the ultimate resource.\"","ko":"경제학자인 Julian Simon은 인간의 지성을 ‘ 궁극의 자원 ’이라고 불렀다."},{"n":8,"en":"In his calculation, more minds were the prime source of deep progress.","ko":"그의 추정으로는, 더 많은 지성이 심오한 발전의 가장 중요한 원천이었다 ."}]},{"id":"minute13-04","unit":"minute13","number":4,"title":"13회 04번","core":"말소리의 미묘한 차이는 먼 거리에서 대부분 사라져 의미도 정체성도 전하지 못하지만, 단순하고 집중된 음조는 그 거리를 넘어 확실하게 전달된다.","flow":[{"label":"말소리의 특성","sentences":"S1–2","text":"우리의 말은 매우 다양하지만 그 차이는 미묘하며, 우리는 목소리의 소리로부터 서로를 개개인으로 쉽게 알아본다.","refs":[1,2]},{"label":"거리의 한계","sentences":"S3–4","text":"그 미묘한 차이에 기댄 구별은 멀리서는 무너져 단어 의미와 개인 정체성의 단서가 대부분 사라지고, 계곡 건너 친구의 외침은 들려도 내용도 사람도 알 수 없다.","ref

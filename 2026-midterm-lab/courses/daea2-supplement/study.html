<script id="course-data" type="application/json">{"course":"대아고2 부교재","units":[{"id":"nje02","label":"N제 2강","scope":"N제 p6~42 시험 범위","passages":[{"id":"nje02-01","unit":"nje02","number":1,"title":"no.01","core":"큰 다짐은 며칠 못 가니 작게 시작해야 하며 작은 습관이 장기적인 성공을 만든다.","flow":[{"label":"비유","sentences":"S1","text":"운동을 늘리겠다는 결정은 훈련 없이 하프 마라톤을 뛰겠다는 것과 같다","refs":[1]},{"label":"전개","sentences":"S2-3","text":"회원권을 끊고 매일 한 시간을 다짐하지만 하루 이틀이면 끝난다","refs":[2,3]},{"label":"전환","sentences":"S4","text":"하루 몇 분 조깅이나 윗몸 일으키기라면 지킬 가능성이 훨씬 높다","refs":[4]},{"label":"결론","sentences":"S5-6","text":"핵심은 작게 시작하는 것이고 작은 습관이 장기적 성공으로 이어진다","refs":[5,6]}],"structure":[{"title":"큰 다짐","text":"매일 한 시간 헬스장 — 하루 이틀만 지켜지고 오래가지 못한다"},{"title":"작은 다짐","text":"하루 몇 분 조깅 — 지킬 가능성이 높고 습관이 되어 오래 남는다"}],"key_sentence_en":"Because big commitments are hard to keep, the key is to start small, since small habits lead to long-term success.","lead":"운동을 오래 이어 가는 데에는 큰 결심과 작은 시작 중 무엇이 더 도움이 될까?","image":"../../assets/daea2-nje02-01-small-habits.webp","image_alt":"새 헬스장 회원권을 들고 큰 운동 결심 앞에서 망설이는 사람과, 짧은 조깅을 시작하는 같은 사람을 대비한 그림","image_caption":"본문 S2~4의 ‘매일 한 시간 헬스장’과 ‘하루 몇 분 조깅’을 나란히 나타냈습니다.","prediction":{"question":"어떤 결심이 오래 지킬 가능성이 더 높을까?","choices":["매일 한 시간 헬스장에서 운동하기","하루 몇 분 조깅이나 윗몸 일으키기부터 하기"],"answer":1,"actual":"S3~6은 큰 운동 결심보다 작게 시작한 습관이 오래 이어질 가능성이 높다고 한다."},"blocking_vocab":[{"word":"gym membership","meaning":"헬스장 회원권"},{"word":"commitment","meaning":"다짐·약속"},{"word":"stick to","meaning":"~을 계속 지키다"}],"checks":[{"type":"핵심","q":"운동 습관을 오래 유지하기 위한 글의 조언은?","choices":["몇 분씩 할 수 있는 작은 활동으로 시작한다.","매일 한 시간씩 운동하겠다는 큰 목표부터 세운다."],"answer":0,"why":"S3은 큰 결심이 오래가지 못한다고 하고 S4~6은 작게 시작하는 습관을 권한다.","refs":[3,4,5,6]},{"type":"인과 근거","q":"하루 몇 분 조깅이나 윗몸 일으키기를 권하는 이유는?","choices":["헬스장 회원권을 반드시 사야 하기 때문에","지킬 가능성이 높고 장기적인 습관이 될 수 있어서"],"answer":1,"why":"S4의 far more likely to stick to your decision과 long-term results가 근거다.","refs":[4]},{"type":"변형 탐지","q":"S5~6과 일치하는 문장은?","choices":["Starting small can build habits that lead to long-term success.","Long-term success requires starting with the biggest possible commitment."],"answer":0,"why":"S5의 start small과 S6의 small habits lead to long-term success를 확인한다.","refs":[5,6]}],"sentences":[{"n":1,"en":"When it comes to the decision to get more exercise, you are setting goals that are similar to running a half marathon with very little training!","ko":"더 많은 운동을 하겠다는 결정에 관해 말하자면, 당신은 거의 훈련을 하지 않고 하프 마라톤 을 뛰는 것과 비슷한 목표들을 세우고 있다!"},{"n":2,"en":"You make a decision to buy a gym membership and decide to spend an hour at the gym every day.","ko":"당신은 헬스 회원권 을 사기로 결정하고 매일 헬스장에서 한 시간 을 보내기로 결심한다."},{"n":3,"en":"Well, you might stick to that for a day or two, but chances are you won't be able to continue to meet that commitment in the long term.","ko":"글쎄, 당신은 하루나 이틀 은 그것을 지킬 수 있겠지만, 아마 장기적으로는 그 다짐을 계속해서 이행할 수 없을 것이다."},{"n":4,"en":"If, however, you make a commitment to go jogging for a few minutes a day or add a few sit-ups to your daily routine before bed, then you are far more likely to stick to your decision and to create a habit that offers you long-term results.","ko":"하지만 만약 당신이 하루에 몇 분씩 조깅을 하거나 잠자리에 들기 전에 당신의 일과에 몇 번의 윗몸 일으키기 를 더하기로 다짐한다면, 당신은 당신의 결정을 지키고 당신에게 장기적인 성과 를 제공하는 습관을 만들어 낼 가능성이 훨씬 더 높다."},{"n":5,"en":"The key is to start small.","ko":"핵심은 작게 시작하는 것이다."},{"n":6,"en":"Small habits lead to long-term success.","ko":"작은 습관 들이 장기적인 성공으로 이어진다."}]},{"id":"nje02-02","unit":"nje02","number":2,"title":"no.02","core":"또래와 어울려 자라고 있기만 하면 가상의 친구는 유익하므로 부모는 존중하고 안심해야 한다.","flow":[{"label":"도입","sentences":"S1","text":"어린이는 서너 살 즈음 가상의 친구를 만들어 내기도 한다","refs":[1]},{"label":"조건","sentences":"S2-3","text":"모든 사회적 상호 작용을 대체할 때만 걱정거리이고 아니면 유익하다","refs":[2,3]},{"label":"지시","sentences":"S4-5","text":"부모는 아이와 그 친구를 존중해야 하고 놀리거나 창피 주면 안 된다","refs":[4,5]},{"label":"안심","sentences":"S6","text":"일상에 끼워 주는 일이 지치더라도 그 시기는 지나간다","refs":[6]},{"label":"결론","sentences":"S7","text":"그때까지는 발달하는 상상력의 표시이므로 환영받아야 한다","refs":[7]}],"structure":[{"title":"문제 — 부모의 걱정","text":"가상의 친구가 사회성을 해치지 않을까, 언제까지 갈까 불안해한다"},{"title":"해결 — 조건과 태도","text":"또래 관계가 있으면 유익하고, 존중하며 지나갈 시기임을 알면 된다"}],"key_sentence_en":"As long as children keep developing socially with other children, imaginary friends are beneficial, so parents should respect them and be reassured that the stage will pass.","diagram":{"kind":"condition","title":"상상 친구: 걱정해야 하는 조건은?","items":[{"head":"판단 기준 · 실제 교류를 모두 대체하는가","body":"상상 친구가 모든 사회적 상호작용을 대신할 때에만 우려할 조건이 된다.","refs":[2]},{"head":"또래와도 어울린다","body":"다른 아이들과 사회적으로 자라고 있다면 상상 친구는 유익할 수 있다.","refs":[3]},{"head":"모든 실제 교류를 대체한다","body":"본문이 상상 친구를 걱정거리로 보는 한정된 경우다.","refs":[2]}],"takeaway":"부모는 아이와 상상 친구를 존중하고 놀리지 않는다. 이 시기는 지나갈 수 있다 · S4~7"},"blocking_vocab":[{"word":"imaginary friend","meaning":"상상의 친구"},{"word":"reassurance","meaning":"안심시키는 말"},{"word":"ridicule","meaning":"비웃다"}],"checks":[{"type":"핵심","q":"상상의 친구에 대한 글의 태도는?","choices":["또래와 정상적으로 어울린다면 유익하므로 존중해야 한다.","어떤 경우에도 즉시 금지해야 한다."],"answer":0,"why":"S2~3은 사회적 상호작용을 모두 대체할 때만 우려하고 S4~7은 존중을 권한다.","refs":[2,3,4,7]},{"type":"조건 근거","q":"상상의 친구가 걱정거리가 되는 조건은?","choices":["아이가 또래와의 모든 사회적 상호작용을 상상의 친구로 대체할 때","아이가 저녁 식탁에 접시 하나를 더 놓아 달라고 할 때"],"answer":0,"why":"S2의 replace all social interactions with pretend friends가 조건이다.","refs":[2]},{"type":"변형 탐지","q":"부모의 반응에 관해 S5~7과 일치하는 것은?","choices":["Parents should respect imaginary friends, knowing this stage will pass.","Parents should ridicule imaginary friends to end the stage faster."],"answer":0,"why":"S5는 비웃지 말라고 하고 S6~7은 이 단계가 지나갈 동안 존중하라고 한다.","refs":[5,6,7]}],"sentences":[{"n":1,"en":"Children may develop imaginary friends around three or four years of age.","ko":"어린이는 서너 살 즈음에 가상의 친구 를 만들어 낼지도 모른다."},{"n":2,"en":"Imaginary friends are only a concern if children replace all social interactions with pretend friends.","ko":"어린이가 모든 사회적 상호 작용 을 가상의 친구로 대체할 경우에만 가상의 친구는 걱정거리 이다."},{"n":3,"en":"As long as children are developing socially with other children, then imaginary friends are beneficial.","ko":"어린이가 다른 어린이들과 함께 사회적으로 성장하고 있기만 하면, 가상의 친구는 유익하다 ."},{"n":4,"en":"Parents often will need reassurance about imaginary friends; they should be respectful of the pretend friends, as well as of their child.","ko":"부모는 종종 가상의 친구에 대해 안심할 필요가 있을 것이며, 그들은 자신의 자녀 뿐만 아니라 가상의 친구도 존중해야 한다."},{"n":5,"en":"Children who create imaginary friends should never be teased, humiliated, or ridiculed in any way.","ko":"가상의 친구를 만들어 내는 어린이가 어떤 식으로든 놀림을 받거나 창피를 당하거나 조롱을 당해서는 절대 안 된다."},{"n":6,"en":"Parents may tire of including the friends in daily activities, such as setting an extra plate at dinner, but they should be reassured that the imaginary friends stage will pass.","ko":"부모는 저녁 식사 시간에 여분의 접시 를 놓는 일과 같은 일상 활동에 그 친구를 포함시키는 일에 지칠 수 있지만, 가상의 친구 시기는 지나갈 것 이라고 안심해야 한다."},{"n":7,"en":"Until then, imaginary friends should be respected and welcomed by parents because they signify a child's developing imagination.","ko":"그때까지 가상의 친구는 아이의 발달하는 상상력 을 보여 주는 존재이므로, 부모에게 존중받고 환영받아야 한다."}]},{"id":"nje02-03","unit":"nje02","number":3,"title":"no.03","core":"정부가 구해 줄 것을 알면 기업은 개선 대신 위험을 택하니 이것이 도덕적 해이다.","flow":[{"label":"구제의 유인","sentences":"S1–2","text":"정부가 기업을 구할 것이라면 구조 조정보다 추가 지원을 요구하기 쉬워지고, 이를 도덕적 해이라 한다.","refs":[1,2]},{"label":"사례와 평가","sentences":"S3–4","text":"은행 구제는 이후 더 큰 위험을 감수하도록 유도할 수 있으며, 좋은 의도라도 잘못된 결정을 부추길 수 있다.","refs":[3,4]}],"structure":[{"title":"원인 — 구제의 예고","text":"손실이 나면 정부가 개입하리라는 기대가 생긴다"},{"title":"결과 — 더 큰 위험 감수","text":"구조 조정 대신 로비를 택하고 앞으로 더 위험한 결정을 내린다"}],"key_sentence_en":"Because government support alters the decisions firms take, rescuing banks can encourage them to take greater risks, so a well-intended rescue may negatively affect their behavior.","diagram":{"kind":"steps","title":"구제 가능성이 바꾸는 기업의 선택","items":[{"head":"정부 지원을 기대함","body":"어려워지면 구제받을 가능성을 안다.","refs":[2,3]},{"head":"결정이 달라짐","body":"은행은 이후 더 큰 위험을 택할 수 있다.","refs":[3]},{"head":"의도와 다른 결과","body":"선의의 구제도 위험한 의사결정을 부추길 수 있다.","refs":[4]}],"takeaway":"반드시 그렇게 된다는 뜻이 아니라 가능성과 위험을 설명한다 · S3~4"},"blocking_vocab":[{"word":"lobby","meaning":"로비하다"},{"word":"restructure","meaning":"구조를 개편하다"},{"word":"moral hazard","meaning":"도덕적 해이"}],"checks":[{"type":"핵심","q":"글에서 말하는 도덕적 해이는 무엇인가?","choices":["구제받을 가능성 때문에 기업이 위험을 완전히 피하는 것","구제받을 가능성을 알고 기업이나 은행이 더 큰 위험을 택하는 것"],"answer":1,"why":"S2가 정부 지원이 기업 결정에 영향을 주는 현상을 정의하고 S3~4가 은행의 위험 선택을 예로 든다.","refs":[2,3,4]},{"type":"인과 근거","q":"은행이 미래에 더 큰 위험을 택할 수 있는 이유는?","choices":["정부가 모든 은행을 사전에 폐쇄하기 때문에","실패하면 정부가 개입할 수도 있다고 알기 때문에"],"answer":1,"why":"S3의 because they know there is a possibility that governments will intervene가 근거다.","refs":[3]},{"type":"변형 탐지","q":"정부 구제의 효과에 관해 S4와 일치하는 것은?","choices":["A well-intended rescue can still encourage risky decisions.","A well-intended rescue can never affect banks' behavior."],"answer":0,"why":"S4는 의도가 좋아도 은행 행동에 부정적인 영향을 줄 수 있다고 한다.","refs":[4]}],"sentences":[{"n":1,"en":"If a firm is going to be saved by the government, it might be easier to concentrate on lobbying the government for more money rather than taking the harder decision of restructuring the company to be able to be profitable and viable in the long term.","ko":"정부가 기업을 구제 해 줄 것이라면, 장기적으로 수익성과 존속 가능성을 확보하도록 회사를 구조 조정 하는 더 어려운 결정을 내리기보다 더 많은 지원금을 얻기 위해 정부에 로비하는 데 집중하기가 더 쉬울 수 있다."},{"n":2,"en":"This is an example of something known as moral hazard ─ when government support alters the decisions firms take.","ko":"이는 이른바 도덕적 해이 의 한 사례, 즉 정부의 지원 이 기업의 의사 결정을 바꾸는 경우다."},{"n":3,"en":"For example, if governments rescue banks who get into difficulty, as they did during the credit crisis of 2007-08, this could encourage banks to take greater risks in the future because they know there is a possibility that governments will intervene if they lose money.","ko":"예를 들어 정부가 2007~2008년 신용 위기 때처럼 어려움에 빠진 은행을 구제하면, 은행은 손실을 보면 정부가 개입할 가능성이 있다는 것을 알기 때문에 앞으로 더 큰 위험 을 감수하게 될 수 있다."},{"n":4,"en":"Although the government rescue may be well intended, it can negatively affect the behavior of banks, encouraging risky and poor decision making.","ko":"정부의 구제는 좋은 의도 일지라도, 그것은 은행의 행위에 부정적으로 영향을 미쳐서 위험하고 형편없는 의사 결정을 조장할 수 있다."}]},{"id":"nje02-04","unit":"nje02","number":4,"title":"no.04","core":"공공 기계식 시계가 모두 아는 시간 개념을 주어 시장 시간을 정하고 거래를 규칙적으로 만들었다.","flow":[{"label":"주장","sentences":"S1-2","text":"정확한 시간 측정이 서구 경제 발전에 중요했고 공공 시계가 전환점이었다","refs":[1,2]},{"label":"이전","sentences":"S3-4","text":"중세 말까지 해시계·물시계뿐이라 시장은 해에 맞춰 열고 닫았다","refs":[3,4]},{"label":"전환","sentences":"S5","text":"공공 기계식 시계가 퍼지자 시장 시간이 종소리로 정해졌다","refs":[5]},{"label":"까닭","sentences":"S6","text":"누구나 이해하기 쉬운 새 시간 개념을 준 것이 크게 기여했다","refs":[6]},{"label":"결과","sentences":"S7-9","text":"무역과 상업이 촉진되고 거래가 덜 불규칙해졌다","refs":[7,8,9]}],"structure":[{"title":"원인 — 공유되는 시간","text":"공공 기계식 시계가 누구나 아는 시간 개념을 만들어 냈다"},{"title":"결과 — 규칙적인 거래","text":"시장 시간이 정해지고 무역과 상업이 촉진되며 거래가 덜 불규칙해졌다"}],"key_sentence_en":"The public mechanical clock gave everyone a shared concept of time, which set market hours and thereby made trade, transactions and the use of resources more regular and efficient.","image":"../../assets/daea2-nje02-04-public-clock.webp","image_alt":"유럽 도시의 시장 위 공공 기계식 시계를 함께 바라보는 상인과 시민을 그린 개념 삽화","image_caption":"S5~9: 공공 시계가 널리 퍼지면서 시장 시간을 정시 타종에 맞추고 거래·일정을 더 규칙적으로 계획할 수 있게 됩니다. 특정 도시의 실제 기록 장면은 아닙니다.","blocking_vocab":[{"word":"mechanical clock","meaning":"기계식 시계"},{"word":"commerce","meaning":"상업"},{"word":"allocate resources","meaning":"자원을 배분하다"}],"checks":[{"type":"핵심","q":"공공 기계식 시계가 시장에 준 변화는?","choices":["시장 시간을 일정하게 하고 거래·일정 계획을 더 규칙적으로 만들었다.","해가 뜰 때만 시장을 열도록 강제했다."],"answer":0,"why":"S5~9가 시각에 맞춘 시장 운영, 거래와 일정 계획의 변화를 설명한다.","refs":[5,6,7,8,9]},{"type":"이전·이후 근거","q":"기계식 공공 시계가 퍼지기 전 시장은 주로 언제 시작했는가?","choices":["정오의 종소리에 맞춰","해가 뜰 때"],"answer":1,"why":"S4는 sunrise에 시작하고 보통 정오에 끝났다고 한다.","refs":[4]},{"type":"변형 탐지","q":"시계 보급 이후를 설명한 S5와 맞는 것은?","choices":["Market times became entirely unrelated to measured time.","Market times came to be set by the stroke of the hour."],"answer":1,"why":"S5는 시장 시간이 정시 타종에 맞추어졌다고 한다.","refs":[5]}],"sentences":[{"n":1,"en":"Many historians have pointed to the significance of accurate time measurement to Western economic progress.","ko":"많은 역사가는 정확한 시간 측정 이 서구의 경제 발전 에 중요했다는 점을 지적해 왔다."},{"n":2,"en":"The French historian Jacques Le Goff called the birth of the public mechanical clock a turning point in Western society.","ko":"프랑스 역사가 Jacques Le Goff는 공공 기계식 시계 의 탄생을 서구 사회의 전환점 으로 규정했다."},{"n":3,"en":"Until the late Middle Ages, people had sun or water clocks, which did not play any meaningful role in business activities.","ko":"중세 말까지 사람들에게는 해시계나 물시계 가 있었는데, 그것들은 경제 활동에 있어서 아무런 의미 있는 역할 을 하지 못했다."},{"n":4,"en":"Market openings and activities started with the sunrise and typically ended at noon when the sun was at its peak.","ko":"시장 개장과 시장 활동은 일출과 함께 시작했고 태양이 최고점 에 이르는 정오에 일반적으로 끝났다."},{"n":5,"en":"But when the first public mechanical clocks were introduced and spread across European cities, market times were set by the stroke of the hour.","ko":"그러나 최초의 공공 기계식 시계가 도입되고 유럽 도시들 전역으로 확산되었을 때, 시장 시간 은 시간을 알리는 소리에 의해 정해졌다."},{"n":6,"en":"Public clocks thus greatly contributed to public life and work by providing a new concept of time that was easy for everyone to understand.","ko":"따라서 공공 시계는 모든 사람이 이해하기 쉬운 시간의 새로운 개념 을 제공함으로써 공공 생활과 공공 업무에 크게 기여 했다."},{"n":7,"en":"This, in turn, helped facilitate trade and commerce.","ko":"결과적으로 , 이것은 무역과 상업 을 촉진하는 데 도움을 주었다."},{"n":8,"en":"Interactions and transactions between consumers, retailers, and wholesalers became less irregular.","ko":"소비자, 소매업자 그리고 도매업자 간의 상호 작용과 거래는 덜 불규칙 해졌다."},{"n":9,"en":"Important town meetings began to follow the pace of the clock, allowing people to better plan their time and allocate resources in a more efficient manner.","ko":"중요한 마을 회의 도 시계가 정한 시간 흐름을 따르기 시작했고, 그 결과 사람들은 시간을 더 잘 계획하고 자원을 더 효율적으로 배분 할 수 있게 되었다."}]},{"id":"nje02-05","unit":"nje02","number":5,"title":"no.05","core":"자신을 과대평가하는 것만큼 과소평가하는 것도 해로우니 정확하고 정직하게 판단하는 힘을 길러야 한다.","flow":[{"label":"통념","sentences":"S1","text":"사람들은 믿음이 깎일까 두려워 진정한 자기 평가를 꺼린다","refs":[1]},{"label":"인용","sentences":"S2-3","text":"괴테는 자신을 실제 이상으로 보는 것을 큰 실수라 했다","refs":[2,3]},{"label":"지시","sentences":"S4","text":"인정해야 할까 봐 두려워 자기 평가를 피하지 마라","refs":[4]},{"label":"뒤집기","sentences":"S5-7","text":"격언 후반부처럼 자신을 낮게 보는 것도 똑같이 해롭다","refs":[5,6,7]},{"label":"당부","sentences":"S8-9","text":"정확·정직하게 판단하는 힘을 기르고 내면을 들여다보라","refs":[8,9]}],"structure":[{"title":"과대평가","text":"자신을 실제 모습 이상으로 보는 큰 실수"},{"title":"과소평가","text":"진정한 가치보다 낮게 보는 것도 똑같이 위험한 실수"}],"key_sentence_en":"Since we damage ourselves as much by underrating our worth as by overrating it, we should stop fearing self-assessment and build the habit of judging ourselves accurately and honestly.","blocking_vocab":[{"word":"self-estimate","meaning":"자기 평가"},{"word":"underestimate","meaning":"과소평가하다"},{"word":"discern","meaning":"분별하다"}],"checks":[{"type":"핵심","q":"자기 평가에 관한 글의 결론은?","choices":["과대평가와 과소평가를 모두 경계하며 정확하고 정직하게 판단하라.","약점은 보지 말고 장점만 크게 평가하라."],"answer":0,"why":"S2와 S6~8이 양쪽 오류를 경계하고 정확한 판단을 권한다.","refs":[2,6,7,8]},{"type":"근거","q":"글이 과소평가도 위험하다고 보는 이유는?","choices":["약점을 알면 반드시 능력이 사라지기 때문에","자신의 실제 가치와 능력을 낮게 볼 수 있기 때문에"],"answer":1,"why":"S6~7은 진짜 가치보다 낮게 보는 것도 과대평가만큼 해롭다고 한다.","refs":[6,7]},{"type":"변형 탐지","q":"S7과 일치하는 것은?","choices":["Only overestimation is dangerous; underestimation is always helpful.","We underestimate our capabilities as dangerously as we overestimate other abilities."],"answer":1,"why":"S7은 과소평가와 과대평가가 모두 위험하다고 한다.","refs":[7]}],"sentences":[{"n":1,"en":"Most people resist the idea of a true self-estimate, probably because they fear it might mean downgrading some of their beliefs about who they are and what they're capable of.","ko":"대부분의 사람은 진정한 자기 평가 라는 생각을 꺼린다. 자신이 누구이며 무엇을 할 수 있는지에 관한 자기 믿음 일부 를 낮추게 될까 두려워하기 때문일 것이다."},{"n":2,"en":"As Goethe's maxim goes, it is a great failing \"to see yourself as more than you are.\"","ko":"Goethe의 격언 처럼, '자신을 현재의 모습 이상으로 보는 것'은 큰 실수 이다."},{"n":3,"en":"How could you really be considered self-aware if you refuse to consider your weaknesses?","ko":"자신의 약점 을 생각해 보기를 거부한다면 어떻게 정말로 자신을 인식 하고 있다고 여겨질 수 있을까?"},{"n":4,"en":"Don't fear self-assessment because you're worried you might have to admit some things about yourself.","ko":"자신에 대해 몇 가지를 인정 해야 할까 봐 걱정하여 자기 평가를 두려워하지 마라 ."},{"n":5,"en":"The second half of Goethe's maxim is important too.","ko":"Goethe의 격언 후반부 도 역시 중요하다."},{"n":6,"en":"He states that it is equally damaging to \"value yourself at less than your true worth.\"","ko":"그는 '자신의 진정한 가치 보다 자신을 낮게 평가하는 것'도 똑같이 해롭다 고 말한다."},{"n":7,"en":"We underestimate our capabilities just as much and just as dangerously as we overestimate other abilities.","ko":"우리는 다른 능력을 과대평가 하는 것만큼이나 크게, 그리고 그만큼 위험하게 자신의 능력을 과소평가 한다."},{"n":8,"en":"Cultivate the ability to judge yourself accurately and honestly.","ko":"자신을 정확하게 그리고 정직하게 판단하는 능력을 길러라 ."},{"n":9,"en":"Look inward to discern what you're capable of and what it will take to unlock that potential.","ko":"자신이 할 수 있는 것이 무엇인지와 그 잠재력 을 끌어내기 위해 필요한 것이 무엇인지 파악하기 위해 내면 을 들여다보라."}]},{"id":"nje02-06","unit":"nje02","number":6,"title":"no.06","core":"관리자는 사람됨이 아니라 행동을 짚어야 하는데, 사람은 자기 자신보다 행동을 바꾸기가 훨씬 쉽다.","flow":[{"label":"사람보다 행동","sentences":"S1–3","text":"관리자는 동기를 이해하려 하지만 문제를 짚을 때는 인격이 아닌 근무 중 행동에 초점을 둔다.","refs":[1,2,3]},{"label":"구체적으로 말하기","sentences":"S4–5","text":"성격을 바꾸라고 하지 말고 지각 횟수처럼 관찰 가능한 행동과 개선 방식을 말한다.","refs":[4,5]},{"label":"변화 가능성","sentences":"S6","text":"사람 자체보다 행동을 바꾸기가 훨씬 쉽기 때문이다.","refs":[6]}],"structure":[{"title":"사람됨을 짚기","text":"「신뢰성이 부족하다」처럼 인격을 겨냥해 바꾸기 어렵다"},{"title":"행동을 짚기","text":"「일곱 번 지각」처럼 사실을 겨냥해 바꾸기 쉽다"}],"key_sentence_en":"When managers deal with a problem, they should point not at what an employee is but at what the employee does, since people find it far easier to change how they act than to change who they are.","diagram":{"kind":"compare","title":"사람의 특성 평가 vs 바꿀 수 있는 행동","items":[{"head":"피할 표현 · 사람 평가","body":"‘신뢰성이 부족하다’처럼 사람됨을 단정하는 말은 행동 개선의 초점을 흐린다.","refs":[3,4,5]},{"head":"권할 표현 · 관찰한 행동","body":"‘이번 달에 일곱 번 지각했다’는 본문 사례처럼 구체적 행동을 짚고 더 나은 수행 방식을 제안한다.","refs":[4,5,6]}],"takeaway":"일곱 번은 이 사례의 수치이지 일반적인 인사 평가 기준이 아니다 · S5"},"blocking_vocab":[{"word":"empathize","meaning":"공감하다"},{"word":"personal trait","meaning":"개인적 특성"},{"word":"unreliability","meaning":"신뢰할 수 없음"}],"checks":[{"type":"핵심","q":"직원 문제를 다룰 때 관리자가 초점을 맞출 것은?","choices":["직장에서 나타난 구체적인 행동","직원의 사람됨 전체"],"answer":0,"why":"S3~6은 사람 자체나 성격보다 바꿀 수 있는 행동에 초점을 두라고 한다.","refs":[3,4,5,6]},{"type":"사례 근거","q":"S5에서 권하는 피드백 표현은?","choices":["이번 달 일곱 번 지각했다.","당신은 원래 믿을 수 없는 사람이다."],"answer":0,"why":"S5는 사람을 unreliability라고 규정하는 대신 지각 횟수를 짚는다.","refs":[5]},{"type":"변형 탐지","q":"S6과 일치하는 문장은?","choices":["It is usually easier for employees to change who they are than how they act.","It is usually easier for employees to change how they act than who they are."],"answer":1,"why":"S6의 어려운 대상은 정체성이고 더 바꾸기 쉬운 대상은 행동이다.","refs":[6]}],"sentences":[{"n":1,"en":"Managers frequently try to play psychologist, to \"figure out\" why an employee has acted in a certain way.","ko":"관리자들은 직원이 왜 특정한 방식 으로 행동했는지를 '파악하기' 위해 종종 심리학자 역할을 하려고 한다."},{"n":2,"en":"Empathizing with employees in order to understand their point of view can be very helpful.","ko":"직원들의 관점 을 이해하기 위해서 그들과 공감하는 것은 매우 도움 이 될 수 있다."},{"n":3,"en":"However, when dealing with a problem area, in particular, remember that it is not the person who is bad, but the actions exhibited on the job.","ko":"하지만 특히 문제 영역을 다룰 때, 나쁜 것은 그 사람이 아니라 근무 중에 보이는 행동 이라는 점을 기억하라."},{"n":4,"en":"Avoid making suggestions to employees about personal traits they should change; instead suggest more acceptable ways of performing.","ko":"직원들에게 그들이 바꿔야 할 인격적 특성 에 관해 제안하지 마라. 대신 더 바람직한 행동 방식 을 제안하라."},{"n":5,"en":"For example, instead of focusing on a person's \"unreliability,\" a manager might focus on the fact that the employee \"has been late to work seven times this month.\"","ko":"예를 들어, 관리자는 어떤 사람의 ' 신뢰성이 부족하다 '는 성격 판단보다 그 직원이 '이번 달에 회사에 일곱 번 지각했다 '는 구체적 사실에 초점을 맞출 수 있다."},{"n":6,"en":"It is difficult for employees to change who they are; it is usually much easier for them to change how they act.","ko":"직원들이 자신이 어떤 사람인지 를 바꾸는 것은 어렵다. 대개 자신이 행동하는 방식을 바꾸는 것이 훨씬 더 쉽다 ."}]},{"id":"nje02-07","unit":"nje02","number":7,"title":"no.07","core":"지도자와 개발자는 편견 없는 인공지능을 만들어야 하고, 사람이 다듬어 줄 때 그 포용이 넓어진다.","flow":[{"label":"현실","sentences":"S1-2","text":"기계 없이 살 수 없는 사회에서 기관은 인공지능과 함께 일한다","refs":[1,2]},{"label":"주장","sentences":"S3","text":"편견과 차별의 가능성이 커지는 만큼 지도자는 편견을 막는 도구로 써야 한다","refs":[3]},{"label":"지시","sentences":"S4","text":"개발자는 포용성 기준을 반영하고 개인적 편견이 없는 시스템을 만들어야 한다","refs":[4]},{"label":"부연","sentences":"S5","text":"피부색·종교·인종 등 무관한 특성으로 편견을 만들지 않게 훈련해야 한다","refs":[5]},{"label":"조건","sentences":"S6-7","text":"직장 밖에서도 쓸 수 있지만 사람이 다시 만들고 다듬어야 가능하다","refs":[6,7]}],"structure":[{"title":"문제 — 커지는 편견","text":"기계에 기대는 사회에서 편견과 차별의 가능성이 갈수록 높아진다"},{"title":"해결 — 설계와 사람의 손질","text":"포용 기준을 넣어 만들고, 사람이 계속 다시 만들고 다듬어 준다"}],"key_sentence_en":"Because bias and discrimination are growing, leaders and developers should build AI systems that carry no personal bias, and AI can widen inclusion beyond the workplace only if human experts keep recreating and refining it.","diagram":{"kind":"steps","title":"AI의 포용 가능성에는 사람의 설계 조건이 필요","items":[{"head":"조건 · 사람이 기준을 설계","body":"개발자와 기술자가 포용성 기준을 반영하고 시스템을 계속 정교화해야 한다.","refs":[4,5,7]},{"head":"관련 없는 특성에 따른 편견을 줄임","body":"직무와 관련 없는 개인 특성 때문에 편향된 판단이 생기지 않도록 학습·설계한다는 주장이다.","refs":[4,5]},{"head":"포용을 도울 가능성","body":"그 조건 아래 AI가 직장 밖에서도 포용에 도움이 될 수 있다.","refs":[6,7]}],"takeaway":"AI라는 이름만으로 자동으로 편견이 없어지는 것은 아니다 · S3~7"},"blocking_vocab":[{"word":"bias","meaning":"편견"},{"word":"inclusion criteria","meaning":"포용 기준"},{"word":"refine","meaning":"다듬다"}],"checks":[{"type":"핵심","q":"글에서 AI의 포용성을 높이기 위해 필요한 것은?","choices":["사람의 검토 없이 AI가 스스로 모든 편견을 없애도록 두는 것","개발자가 편견을 줄이는 기준을 넣고 전문가가 시스템을 계속 다듬는 것"],"answer":1,"why":"S3~7은 지도자·개발자의 기준 설정과 인간 전문가의 개선을 강조한다.","refs":[3,4,5,6,7]},{"type":"근거","q":"S5에서 AI가 편견을 만들지 않아야 할 특성의 예는?","choices":["직원의 피부색·종교·인종 등","직원의 업무 수행만"],"answer":0,"why":"S5는 color, religion, race 등을 나열한다.","refs":[5]},{"type":"변형 탐지","q":"S7의 조건과 일치하는 것은?","choices":["AI can improve inclusion only if human experts never refine it.","AI can improve inclusion if refined by human experts and engineers."],"answer":1,"why":"S7은 인간 전문가와 기술자의 재설계·개선을 조건으로 제시한다.","refs":[7]}],"sentences":[{"n":1,"en":"The post-modern society cannot imagine their life without the support of machines.","ko":"포스트모던 사회는 기계의 도움 없는 삶을 상상할 수 없다."},{"n":2,"en":"Organizations are living with this reality and working with artificial intelligence (AI).","ko":"기관은 이러한 현실 을 받아들이고 인공지능(AI)과 협업 하고 있다."},{"n":3,"en":"In this whole situation where the possibility of biases and discriminations becomes higher and higher, leaders must think about using AI as a tool to prevent bias.","ko":"편견과 차별 의 가능성이 갈수록 커지는 이런 상황에서 지도자 는 인공지능을 편견을 막는 도구로 활용할 방안을 생각해야 한다."},{"n":4,"en":"Also, experts and engineers who develop an algorithm must include all inclusion criteria and must generate a system free from personal bias.","ko":"또한 알고리즘을 개발하는 전문가와 기술자는 모든 포용성 기준 을 반영하고, 개인적 편견 이 없는 시스템을 만들어야 한다."},{"n":5,"en":"It is also argued that our systems must be trained and generated in such a manner that cannot create bias based on diversity of employees, e.g., color, religion, race, education, marital status, family background, political belief, and other characteristics that are not completely relevant in tenure of the employee at workplace.","ko":"또한 피부색, 종교, 인종, 학력, 결혼 여부, 가정 배경, 정치적 신념, 직장에서 직원의 재직 연한 에 있어 완전히 관련되지는 않는 다른 특징 등 직원의 다양성 에 기반하여 편견을 만들 수 없는 그러한 방식으로 우리의 시스템이 학습되고 생성되어야 한다는 주장도 제기되고 있다."},{"n":6,"en":"Not just at the workplace, AI can be helpful in other fields also for more inclusion.","ko":"직장에서뿐만 아니라 다른 분야 에서도 인공지능은 포용성 을 높이는 데 도움이 될 수 있다."},{"n":7,"en":"AI is able to do this if it is recreated and refined by human experts and engineers.","ko":"인공지능은 인간 전문가 와 기술자에 의해 다시 설계되고 다듬어진다면 이를 수행할 수 있다."}]},{"id":"nje02-08","unit":"nje02","number":8,"title":"no.08","core":"흘려보내는 시간도 이미 쓰인 시간이므로 그 시간을 좋은 생각을 하는 연습에 써야 한다.","flow":[{"label":"이미 쓴 시간","sentences":"S1–4","text":"누구나 계획 실패나 걱정·후회로 시간을 흘려보내지만 그 시간도 이미 쓰인 시간이다.","refs":[1,2,3,4]},{"label":"다른 사용법","sentences":"S5","text":"그 시간을 좋은 생각을 연습하는 데 쓰자고 권한다.","refs":[5]},{"label":"실천 예","sentences":"S6","text":"무작정 채널을 넘기기보다 하루와 자신의 강점·약점을 돌아본다.","refs":[6]}],"structure":[{"title":"문제 — 새는 시간","text":"걱정·후회·멍한 응시로 시간이 이미 쓰이고 있다"},{"title":"해결 — 그 시간을 돌려쓰기","text":"같은 시간에 좋은 생각을 연습하고 하루를 돌아본다"}],"key_sentence_en":"Since the time we let slip is time already spent, we should take the intervals we normally waste and use them to practice good thinking, such as reviewing our day instead of drifting through TV channels.","blocking_vocab":[{"word":"productively","meaning":"생산적으로"},{"word":"deliberately","meaning":"의도적으로"},{"word":"vain search","meaning":"헛된 탐색"}],"checks":[{"type":"핵심","q":"이미 흘려보내는 시간을 어떻게 쓰라고 하는가?","choices":["그 시간에 좋은 생각을 연습하라.","이미 쓴 시간은 되돌릴 수 있으니 계획할 필요가 없다."],"answer":0,"why":"S4는 시간은 이미 쓰였다고 하고 S5~6은 그 시간을 생각의 연습에 쓰라고 한다.","refs":[4,5,6]},{"type":"사례 근거","q":"S6에서 TV 채널을 무작정 돌리는 대신 제안한 것은?","choices":["그날을 돌아보며 강점과 약점을 평가하기","더 늦은 시간까지 프로그램을 찾아보기"],"answer":0,"why":"S6의 thinking back over your day and evaluating your strengths and weaknesses가 답이다.","refs":[6]},{"type":"변형 탐지","q":"S4~5의 시간 사용에 관한 설명과 일치하는 것은?","choices":["Wasted time is not spent, so it can be recovered without changing habits.","Wasted time is still spent time, so use such intervals to practice good thinking."],"answer":1,"why":"S4의 time is spent와 S5의 practice good thinking을 연결한다.","refs":[4,5]}],"sentences":[{"n":1,"en":"No one uses all of his or her time productively or even pleasurably.","ko":"자신의 모든 시간을 생산적으로 또는 심지어 즐겁게 사용하는 사람은 아무도 없다 ."},{"n":2,"en":"Sometimes we fail to plan well, causing negative consequences that we easily could have avoided such as spending time unnecessarily trapped in traffic although we could have left a half hour earlier and avoided the rush.","ko":"때로 우리는 계획을 제대로 세우지 않아 쉽게 피할 수 있었던 부정적 결과를 낳는다. 예를 들어 30분 일찍 출발해 혼잡을 피할 수 있었는데도 교통 체증 에 갇혀 불필요하게 시간을 보내는 경우다."},{"n":3,"en":"Sometimes we worry unproductively, spend time regretting what is past, or just stare blankly into space.","ko":"때때로 우리는 비생산적으로 걱정하거나, 지나간 일을 후회하며 시간을 보내거나, 그저 멍하니 허공 을 응시한다."},{"n":4,"en":"The key is that the time is \"spent,\" and if we had thought about it and considered our options, we would not have deliberately spent our time in that way.","ko":"요점은 시간이 ' 쓰였다 '는 것이고, 우리가 그것에 대해 생각하고 우리의 선택 사항 을 고려했다면, 의도적으로 그런 식으로 우리의 시간을 보내지는 않았을 것이라는 점이다."},{"n":5,"en":"So our idea is this: Take advantage of the time you normally waste by practicing good thinking during that interval.","ko":"그래서 우리의 생각은 다음과 같다. 그런 시간 동안 좋은 생각을 하는 연습을 하면서 여러분이 보통 낭비하는 그 시간을 잘 활용하라 ."},{"n":6,"en":"For example, instead of sitting in front of the TV at the end of the day, flicking from channel to channel in a vain search for a program worth watching, spend that time, or at least part of it, thinking back over your day and evaluating your strengths and weaknesses.","ko":"예를 들어, 하루가 끝날 즈음에 TV 앞에 앉아서 볼 만한 가치가 있는 프로그램을 헛되이 검색하며 채널을 이리저리 휙휙 넘기는 대신, 그 시간 또는 적어도 그 시간의 일부를 여러분의 하루를 돌아보고 여러분의 강점과 약점 을 평가하면서 보내라."}]},{"id":"nje02-09","unit":"nje02","number":9,"title":"no.09","core":"이사는 아이에게 상처가 되므로 까닭을 설명하고 연결을 지키며 참여시키고 안심시켜야 한다.","flow":[{"label":"전제","sentences":"S1-2","text":"아이는 안정감을 원해 친구와 학교를 떠나기 싫어하니 상처를 각오하라","refs":[1,2]},{"label":"지시","sentences":"S3","text":"먼저 왜 온 가족이 이사해야 하는지 설명하라","refs":[3]},{"label":"지시","sentences":"S4-5","text":"친구에게 알리게 하고 새 번호를 주어 연락이 이어지게 하라","refs":[4,5]},{"label":"지시","sentences":"S6-7","text":"새 도시를 찾아보게 하고 짐을 싸게 해 기여한다고 느끼게 하라","refs":[6,7]},{"label":"결론","sentences":"S8","text":"마지막으로 새 친구를 만나고 새집도 곧 편안해질 것이라 안심시켜라","refs":[8]}],"structure":[{"title":"문제 — 친숙함의 상실","text":"친구·학교 같은 익숙한 것을 잃어 아이가 마음의 상처를 겪는다"},{"title":"해결 — 네 가지 조치","text":"설명하기 · 연락 잇기 · 참여시키기 · 안심시키기를 차례로 한다"}],"key_sentence_en":"Because children are hurt by losing what is familiar, parents who move should explain the reason, keep their children in touch with old friends, let them take part in the move, and assure them the new place will soon feel like home.","image":"../../assets/daea2-nje02-09-moving-child.webp","image_alt":"이사를 앞두고 아이가 자기 물건을 상자에 담으며 부모와 이야기하는 개념 삽화","image_caption":"S3·7: 이사 이유를 설명하고 아이가 자기 물건을 싸며 준비에 참여하게 합니다. 옛 친구와 연락을 이어 가는 방법은 원문 S4~5에서 따로 확인하세요.","blocking_vocab":[{"word":"trauma","meaning":"정신적 상처"},{"word":"stay connected","meaning":"연락을 이어 가다"},{"word":"assure","meaning":"안심시키다"}],"checks":[{"type":"핵심","q":"이사를 앞둔 아이를 돕는 방법으로 글이 권하는 것은?","choices":["이사 이유를 숨기고 새 도시 정보도 주지 않기","이유를 설명하고 옛 친구와 연락을 돕고 준비에 참여시키기"],"answer":1,"why":"S3~8은 이유 설명, 연락 유지, 새 도시 탐색, 짐 싸기 참여와 안심을 제안한다.","refs":[3,4,5,6,7,8]},{"type":"근거","q":"아이에게 짐을 직접 조금 싸게 하는 이유는?","choices":["이사에 기여한다고 느끼게 하려고","이사 이유를 알지 못하게 하려고"],"answer":0,"why":"S7의 so they feel they're contributing이 직접 근거다.","refs":[7]},{"type":"변형 탐지","q":"옛 친구와의 관계를 다루는 S4~5와 맞는 것은?","choices":["Children should be given ways to stay in contact with old friends.","Children should avoid giving old friends any way to contact them."],"answer":0,"why":"S4는 새 전화번호를 알려 주고 S5는 이메일로 연락을 이어 가라고 한다.","refs":[4,5]}],"sentences":[{"n":1,"en":"Children always love security, and they don't want to leave their friends, school and many other familiar things.","ko":"아이들은 늘 안정감 을 원하며, 친구와 학교를 비롯한 여러 익숙한 것을 떠나고 싶어 하지 않는다."},{"n":2,"en":"If you're going to move to a different city, be prepared that your kids will probably experience trauma.","ko":"만약 다른 도시 로 이주하려거든, 당신의 자녀들이 마음의 상처 를 겪게 될 것에 대비하라."},{"n":3,"en":"So first, explain to them why you all need to move.","ko":"그러니 먼저 가족 모두가 왜 이사해야 하는지를 자녀들에게 설명하라."},{"n":4,"en":"Have them let their friends know that you all are leaving and give your children your new telephone number so that their old friends can contact them.","ko":"자녀들이 친구들에게 가족 모두 이사 간다는 사실을 알리게 하고, 옛 친구들 이 자녀들에게 연락할 수 있도록 새 전화번호 를 알려 주어라."},{"n":5,"en":"E-mail is also a great way to stay connected.","ko":"이메일 은 또한 연락을 유지하는 좋은 방법 이다."},{"n":6,"en":"Next, have your children look up on the Internet the new city which you're moving to.","ko":"다음으로, 자녀들에게 이사 가게 될 새 도시 를 인터넷 에서 찾아보게 하라."},{"n":7,"en":"Also, have your kids start packing some of their own things so they feel they're contributing.","ko":"또한, 자녀들에게 자신의 짐 일부 를 꾸리도록 하여 그들이 기여하고 있다고 느끼게 하라."},{"n":8,"en":"Lastly, assure them they'll meet new friends and soon their new place will feel like home.","ko":"마지막으로 , 새 친구 를 만나고 새집도 곧 집처럼 편안하게 느껴질 것이라고 자녀들을 안심시켜라."}]},{"id":"nje02-10","unit":"nje02","number":10,"title":"no.10","core":"기운을 빼는 동료와는 줄이고 힘을 주는 동료와는 늘려 회복을 주는 직장 관계를 가꿔야 한다.","flow":[{"label":"관계 돌아보기","sentences":"S1–2","text":"동료와 만나는 빈도와 그 뒤의 기분을 살피면 누가 에너지를 주고 빼는지 알 수 있다.","refs":[1,2]},{"label":"관계 조절","sentences":"S3–4","text":"기운을 빼는 만남은 줄이고 활력을 주는 동료와의 교류는 늘린다.","refs":[3,4]},{"label":"회복의 이유","sentences":"S5–6","text":"그 동료들이 어려울 때 추가 에너지를 주므로 회복을 돕는 관계를 가꾸어야 한다.","refs":[5,6]}],"structure":[{"title":"기운을 빼는 동료","text":"만남과 그 시간을 가능한 한 줄여야 할 상대"},{"title":"기운을 주는 동료","text":"더 자주 만나야 하고 어려운 상황에서 추가 에너지를 주는 상대"}],"key_sentence_en":"Since supportive coworkers supply the extra energy we need to perform well in hard conditions, we should limit contact with the people who drain us and cultivate the work relationships that restore energy.","blocking_vocab":[{"word":"detract from","meaning":"~을 줄이다"},{"word":"re-energize","meaning":"다시 기운을 주다"},{"word":"cultivate","meaning":"가꾸다"}],"checks":[{"type":"핵심","q":"직장 동료와의 관계에서 글이 권하는 것은?","choices":["기운을 빼는 상호작용은 줄이고 힘을 주는 관계를 가꾼다.","모든 동료와 똑같은 시간을 보내야 한다."],"answer":0,"why":"S2~6이 에너지를 떨어뜨리는 관계와 회복시키는 관계를 구분한다.","refs":[2,3,4,5,6]},{"type":"근거","q":"힘을 주는 동료와의 교류가 어려운 조건에서 도움 되는 이유는?","choices":["동료 대신 일을 모두 끝내 주기 때문에","잘 수행할 추가적인 에너지를 주기 때문에"],"answer":1,"why":"S5가 additional energy needed to perform well이라고 말한다.","refs":[5]},{"type":"변형 탐지","q":"S3의 관계 조정과 일치하는 것은?","choices":["Increase de-energizing interactions and limit re-energizing ones.","Limit de-energizing interactions and increase re-energizing ones."],"answer":1,"why":"S3의 두 관계에 대한 동사를 바꾸면 뜻이 반대가 된다.","refs":[3]}],"sentences":[{"n":1,"en":"Take a minute and consider how often you interact with fellow employees in your workplace, and the typical outcomes of those interactions.","ko":"시간을 내어 직장에서 여러분이 동료 직원들 과 얼마나 자주 상호 작용하는지 그리고 그 상호 작용의 전형적인 결과 를 생각해 보라."},{"n":2,"en":"After thinking about it, you can probably identify other employees who contribute to or detract from your overall energy level.","ko":"이를 생각해 보면 자신의 전반적인 에너지 수준을 높이거나 떨어뜨리는 동료가 누구인지 찾을 수 있을 것이다."},{"n":3,"en":"To the extent possible, try to limit interactions (or the duration of those interactions) with the de-energizing coworkers, and increase the frequency of interactions with fellow employees who re-energize you.","ko":"가능한 한 기운을 빼는 동료와의 상호 작용이나 그 지속 시간 을 줄이고, 다시 활력을 주는 동료와는 더 자주 교류하려고 노력하라."},{"n":4,"en":"We often fail to appreciate the beneficial impact of coworkers on having the energy necessary to excel in difficult conditions.","ko":"우리는 어려운 상황 에서도 뛰어난 성과를 내는 데 필요한 에너지를 동료들이 북돋워 준다는 사실을 흔히 제대로 인식하지 못한다."},{"n":5,"en":"It is important to remember that interacting with supportive coworkers can provide us with the additional energy needed to perform well under difficult conditions.","ko":"힘을 주는 동료와의 상호 작용은 어려운 상황에서 좋은 성과를 내기 위해 필요한 추가적인 에너지 를 우리에게 제공할 수 있다는 것을 기억하는 것이 중요하다."},{"n":6,"en":"Thus we should try to cultivate relationships at work that can restore energy.","ko":"따라서 우리는 에너지를 회복 시켜 주는 직장 관계 를 가꾸려고 노력해야 한다."}]},{"id":"nje02-11","unit":"nje02","number":11,"title":"no.11","core":"음악은 같은 문화를 나눈 사람들에게만 공통 언어이므로 국제 언어는 춤과 나머지 예술이다.","flow":[{"label":"근거","sentences":"S1","text":"먼 지역의 음악은 다른 문화 사람에게 낯설고 가치를 못 느끼게 한다","refs":[1]},{"label":"주제","sentences":"S2","text":"그래서 음악이 국제 언어라는 말은 널리 퍼진 의미 없는 상투어다","refs":[2]},{"label":"양보","sentences":"S3-4","text":"그럼에도 쇼펜하우어 같은 철학자조차 음악이 보편 언어라고 말한다","refs":[3,4]},{"label":"반론","sentences":"S5","text":"필자는 음악이 아니라 춤과 나머지 예술이 국제 언어라고 주장한다","refs":[5]},{"label":"정리","sentences":"S6-7","text":"음악은 같은 말을 쓰는 이들에게만 공통 언어이며 구어에 더해진 또 하나의 언어다","refs":[6,7]}],"structure":[{"title":"음악","text":"같은 문화를 나눈 사람들 안에서만 통하는 또 하나의 공통 언어"},{"title":"춤과 나머지 예술","text":"문화를 넘어 통하므로 국제 언어의 자격을 갖춘다"}],"key_sentence_en":"Music that comes from one community works as a common language only for those who share that culture, so the writer holds that dancing and the other arts, not music, are what truly qualify as an international language.","blocking_vocab":[{"word":"devoid of","meaning":"~이 없는"},{"word":"cliche","meaning":"진부한 말"},{"word":"qualify as","meaning":"~에 해당하다"}],"checks":[{"type":"핵심","q":"글쓴이가 ‘음악은 국제 언어’라는 주장에 반대하는 이유는?","choices":["음악은 같은 문화를 나눈 사람에게 공통 언어일 뿐이라고 보기 때문에","어느 문화에서도 음악의 의미가 완전히 같다고 보기 때문에"],"answer":0,"why":"S1~2에서 문화 간 반응 차이를 들고 S5~7에서 음악의 공통성은 같은 문화 안에 한정된다고 주장한다.","refs":[1,2,5,6,7]},{"type":"대조 근거","q":"글쓴이가 국제 언어에 해당한다고 주장한 것은?","choices":["음악만","춤과 나머지 예술"],"answer":1,"why":"S5에서 not music, but dancing and all the rest of the arts라고 한다.","refs":[5]},{"type":"변형 탐지","q":"S6의 음악에 대한 주장과 맞는 것은?","choices":["Music is a common language only for people who share the same tongue.","Music is a common language equally for every culture without any shared tongue."],"answer":0,"why":"S6의 only for those who share the same tongue를 확인한다.","refs":[6]}],"sentences":[{"n":1,"en":"A piece of music from a remote part of China or Korea would be unusual and maybe even devoid of any artistic value to the people in France or America and vice versa.","ko":"중국이나 한국의 외딴 지역 에서 나온 음악은 프랑스나 미국 사람들에게 낯설고, 어쩌면 예술적 가치 가 전혀 없다고 느껴질 수도 있다. 반대의 경우도 마찬가지다."},{"n":2,"en":"This being the case, claiming that music is an international language becomes a widely accepted but meaningless cliche.","ko":"이런 상황이라서 음악이 국제 언어 라는 주장은 널리 받아들여지지만 의미 없는 상투어 가 된다."},{"n":3,"en":"Despite that, however, even a renowned German philosopher such as Arthur Schopenhauer makes this claim in the first volume of his book, The World as Will and Presentation.","ko":"그럼에도 Arthur Schopenhauer 같은 저명한 독일 철학자조차 자신의 저서 〈The World as Will and Presentation〉 제1권 에서 이 주장을 한다."},{"n":4,"en":"He says \"music is an entirely universal language.\"","ko":"그는 '음악은 전적으로 보편적인 언어'라고 말한다."},{"n":5,"en":"However, I argue that not music, but dancing and all the rest of the arts, qualify as an international language.","ko":"하지만 나는 음악이 아니라 춤과 나머지 모든 예술 분야가 국제 언어로서의 자격 을 갖추고 있다고 주장한다."},{"n":6,"en":"Yes, music is a common language, but only for those who share the same tongue.","ko":"그렇다. 음악은 공통 언어 이지만, 같은 언어 를 쓰는 사람들에게만 그렇다."},{"n":7,"en":"In fact, the music that rises from any community becomes another common language over and above any spoken languages of that culture.","ko":"사실 어떤 공동체 에서 생겨난 음악은 그 문화에서 쓰이는 여러 구어에 더해 또 하나의 공통 언어가 된다."}]},{"id":"nje02-12","unit":"nje02","number":12,"title":"no.12","core":"익명일 때 사람은 평소 안 할 일을 하므로 인터넷 댓글은 실명으로 써야 한다.","flow":[{"label":"도입","sentences":"S1-3","text":"트롤이 남기는 비열한 댓글로 아무 잘못 없는 이들이 고통을 겪는다","refs":[1,2,3]},{"label":"물음","sentences":"S4","text":"이들이 피해자가 되지 않게 하려면 무엇을 해야 할까","refs":[4]},{"label":"답하기","sentences":"S5-6","text":"익명성이 답이며 익명일 때 평소라면 안 할 일을 한다","refs":[5,6]},{"label":"적용","sentences":"S7-8","text":"댓글도 마찬가지여서 정체를 숨기면 자랑스럽지 않을 일을 한다","refs":[7,8]},{"label":"주장","sentences":"S9-10","text":"그러므로 실명으로 써야 하며 그러지 않으면 폭력은 끝나지 않는다","refs":[9,10]}],"structure":[{"title":"문제 — 익명의 트롤","text":"이름을 숨긴 채 비열한 댓글을 남겨 많은 사람이 정신적 고통을 겪는다"},{"title":"해결 — 실명 작성","text":"댓글을 쓴 사람의 실명으로 쓰게 하지 않으면 그 폭력은 끝나지 않는다"}],"key_sentence_en":"Since research shows that people do what they would not ordinarily do once they know they are anonymous, every comment on the Internet should be written under the writer's real name, or the trolls' violence will never stop.","diagram":{"kind":"compare","title":"익명성에 관한 본문 설명과 필자의 제안","items":[{"head":"본문의 설명","body":"익명일 때 평소와 다르게 행동하거나 온라인에서 부끄러울 수 있는 일을 할 수 있다고 말한다.","refs":[6,7,8]},{"head":"필자의 규범적 제안","body":"그 때문에 댓글을 실명으로 써야 한다고 주장한다.","refs":[9,10]}],"takeaway":"실명 사용 제안은 필자의 주장이다. 실명제 효과가 실험으로 확정되었다는 뜻은 아니다 · S9~10"},"blocking_vocab":[{"word":"troll","meaning":"악성 댓글 작성자"},{"word":"anonymity","meaning":"익명성"},{"word":"imperative","meaning":"반드시 필요한"}],"checks":[{"type":"핵심","q":"글쓴이가 악성 댓글을 줄이기 위해 제안한 것은?","choices":["인터넷 댓글에 익명성을 더 강화하는 것","인터넷 댓글을 실명으로 쓰게 하는 것"],"answer":1,"why":"S5~10은 익명성이 평소 하지 않을 행동을 부르므로 실명 작성이 필요하다고 주장한다.","refs":[5,6,7,8,9,10]},{"type":"인과 근거","q":"익명성이 문제라고 보는 직접적인 이유는?","choices":["익명일 때는 댓글을 쓸 수 없어서","익명일 때 평소에는 하지 않을 일을 할 수 있어서"],"answer":1,"why":"S6과 S8은 신원이 드러나지 않을 때 평소와 다른 행동을 할 수 있다고 한다.","refs":[6,8]},{"type":"변형 탐지","q":"S9의 결론과 일치하는 것은?","choices":["Comments should never reveal the writer's real name.","Comments should be written under the writer's real name."],"answer":1,"why":"S9는 댓글을 작성자 실명으로 써야 한다고 말한다.","refs":[9]}],"sentences":[{"n":1,"en":"If you have spent any time at all on the Internet, you've seen comments from people who are often referred to as \"trolls.\"","ko":"인터넷을 조금이라도 해 본 적이 있다면, 흔히 ' 트롤 '이라고 불리는 사람들이 쓴 댓글을 보았을 것이다."},{"n":2,"en":"These are people who like to leave mean comments on YouTube videos or Instagram images.","ko":"이들은 유튜브 영상 또는 인스타그램 이미지에 비열한 댓글 을 남기기를 좋아하는 사람들이다."},{"n":3,"en":"Lots of people suffer mentally from their despicable act even though they don't do any harm to anyone.","ko":"아무에게도 해를 끼치지 않은 많은 사람이 트롤의 비열한 행동 때문에 정신적 고통 을 겪는다."},{"n":4,"en":"Then what should be done to prevent these people from being victimized on the Internet?","ko":"그렇다면 이러한 사람들이 인터넷에서 피해자가 되는 것을 막으려면 무엇을 해야 하는가 ?"},{"n":5,"en":"One answer involves the anonymity that the Internet gives us.","ko":"한 가지 답 은 인터넷이 우리에게 주는 익명성 과 관계가 있다."},{"n":6,"en":"It turned out, according to tons of research, that when we know we are anonymous we do things we wouldn't ordinarily do.","ko":"수많은 연구 에 따르면, 자신이 익명이라고 알 때 사람들은 평소라면 하지 않을 일을 한다는 사실이 밝혀졌다."},{"n":7,"en":"It's true of the case where people write a comment on the Internet.","ko":"그것은 사람들이 인터넷에서 댓글을 작성 하는 경우에도 마찬가지 이다."},{"n":8,"en":"When we don't reveal our identity online, we can do things we may not be proud of.","ko":"우리가 온라인상에서 우리의 정체 를 드러내지 않으면, 우리는 자랑스러워하지 않을지도 모르는 일을 할 수 있다."},{"n":9,"en":"It's imperative, therefore, that any comment on the Internet should be written under the real name of a writer.","ko":"따라서 인터넷에서의 그 어떤 댓글 이라도 댓글을 쓰는 사람의 실명 으로 반드시 작성되어야 한다."},{"n":10,"en":"Otherwise the trolls' violent act will never end.","ko":"그렇지 않으면 트롤의 폭력적인 행위 는 결코 끝나지 않을 것이다."}]},{"id":"nje02-13","unit":"nje02","number":13,"title":"no.13","core":"남이 그렇게 믿게 된 인생 이야기를 들으면 신념은 그대로여도 상대 입장을 훨씬 더 존중하게 된다.","flow":[{"label":"주제","sentences":"S1","text":"이야기는 남의 관점에서 세상을 보게 해 공감을 기르도록 돕는다","refs":[1]},{"label":"방법","sentences":"S2-3","text":"어떻게 그리 믿게 됐는지 알고 싶으면 이야기를 청하고 충분히 듣는다","refs":[2,3]},{"label":"실험","sentences":"S4-5","text":"의견이 다른 두 집단을 한방에 모았으나 신념을 주장하게 하지 않았다","refs":[4,5]},{"label":"조작","sentences":"S6","text":"대신 그 신념에 이르게 한 인생 경험을 차례로 이야기하게 했다","refs":[6]},{"label":"결과","sentences":"S7","text":"아무도 신념을 바꾸지 않았지만 상대 입장을 훨씬 더 존중하게 되었다","refs":[7]}],"structure":[{"title":"원인 — 인생 이야기 듣기","text":"논쟁 대신 그 믿음에 이르게 한 경험을 차례로 듣는다"},{"title":"결과 — 존중의 증가","text":"신념은 그대로지만 다르게 생각할 이유가 있음을 인정하게 된다"}],"key_sentence_en":"Hearing the life stories behind what other people believe does not change our own beliefs, but it lets us see the world from their side and leaves us with a far greater respect for their position.","diagram":{"kind":"branches","title":"이야기를 나눈 뒤 나타난 서로 다른 두 결과","items":[{"head":"공통 경험 · 다른 의견을 가진 두 집단","body":"논쟁 대신 원탁에서 각자의 신념으로 이어진 삶의 이야기를 나누었다.","refs":[4,5,6]},{"head":"신념은 그대로","body":"아무도 자신의 믿음을 바꾸지 않았다.","refs":[7]},{"head":"상대에 대한 존중은 커짐","body":"상대가 다르게 생각할 이유를 인정하며 그 입장을 더 존중하게 되었다.","refs":[7]}],"takeaway":"상대에 대한 존중이 커진 것이 의견의 합의를 뜻하지 않는다 · S7"},"blocking_vocab":[{"word":"empathy","meaning":"공감"},{"word":"perspective","meaning":"관점"},{"word":"profoundly","meaning":"깊이"}],"checks":[{"type":"핵심","q":"다른 의견을 가진 사람의 이야기를 들었을 때 생긴 변화는?","choices":["모두 즉시 같은 신념으로 바뀌었다.","신념은 그대로였지만 상대 입장에 대한 존중이 깊어졌다."],"answer":1,"why":"S7은 No one changed their beliefs, but... greater respect라고 한다.","refs":[7]},{"type":"방법 근거","q":"연구자는 두 집단에게 무엇을 요청했는가?","choices":["상대의 주장을 반박할 증거만 발표하게 했다.","신념을 두고 논쟁하지 말고, 그렇게 믿게 된 삶의 경험을 이야기하게 했다."],"answer":1,"why":"S5~6은 논쟁 대신 신념에 이른 삶의 경험 이야기를 하게 했다고 한다.","refs":[5,6]},{"type":"변형 탐지","q":"S7의 결과와 일치하는 것은?","choices":["Their beliefs changed completely, but respect for the other side declined.","Their beliefs did not change, but respect for the other side increased."],"answer":1,"why":"S7은 신념 변화 없이 상대 입장에 대한 존중이 더 커졌다고 한다.","refs":[7]}],"sentences":[{"n":1,"en":"Stories assist us in developing empathy by helping us see the world from others' perspectives.","ko":"이야기는 다른 사람의 관점 에서 세상을 보도록 해 주어 우리가 공감 능력 을 기르는 데 도움을 준다."},{"n":2,"en":"When I want to know how someone came to believe what she believes, I ask her to tell me a story to illustrate her point.","ko":"어떤 사람이 어떻게 그런 믿음을 갖게 되었는지 알고 싶을 때, 나는 그 사람에게 자신의 관점을 설명하기 위해 이야기를 들려 달라고 한다."},{"n":3,"en":"When I hear enough stories, I come to realize the experiences that led her to draw a particular conclusion.","ko":"충분한 이야기 를 들으면, 그 사람이 특정한 결론 을 내리게 한 경험들을 깨닫게 된다."},{"n":4,"en":"When I was in graduate school, a researcher put two groups of people who had different opinions together in the same room.","ko":"내가 대학원생 일 때 한 연구자가 서로 다른 의견 을 가진 두 집단의 사람들을 같은 방에 함께 모았다."},{"n":5,"en":"He didn't ask them to argue their beliefs.","ko":"그는 그들에게 그들의 신념 을 주장하도록 요청하지 않았다 ."},{"n":6,"en":"He asked them to go around the circular table and tell stories about the life experiences that led them to come to the beliefs they had.","ko":"그는 그들에게 원탁 을 돌며 차례로, 자신들이 현재의 신념을 갖게 된 인생 경험 을 이야기해 달라고 했다."},{"n":7,"en":"No one changed their beliefs, but they left the room with a profoundly greater respect for the other side's position ─ that there might be reasons to think differently than we do.","ko":"아무도 자신의 신념을 바꾸지는 않았지만, 상대편의 입장 을 훨씬 더 존중하게 된 채 방을 나왔다. 즉 상대에게는 우리와 다르게 생각할 이유가 있을지도 모른다는 점을 인정하게 된 것이다."}]},{"id":"nje02-14","unit":"nje02","number":14,"title":"no.14","core":"부정적 신체 이미지는 초등학교 시절에 자리 잡으므로 교육도 그때 시작해야 한다.","flow":[{"label":"통념","sentences":"S1","text":"신체 이미지 연구와 문헌은 대부분 청소년에게 초점을 맞춰 왔다","refs":[1]},{"label":"전환","sentences":"S2-3","text":"그러나 더 어린 나이에 나타나며 뿌리는 아동기로 거슬러 간다","refs":[2,3]},{"label":"근거","sentences":"S4-5","text":"초등학교에 다니는 십 대 이전 나이에 나타나고 점점 더 어려진다","refs":[4,5]},{"label":"주장","sentences":"S6","text":"이 문제를 다루는 교육은 초등학교에서 시작되어야 한다","refs":[6]},{"label":"경고","sentences":"S7","text":"청소년 대상 개입은 너무 늦어 여러 문제를 막지 못할 수 있다","refs":[7]}],"structure":[{"title":"문제 — 잘못 맞춘 시점","text":"연구도 프로그램도 청소년에 맞춰져 있어 이미 늦다"},{"title":"해결 — 초등학교에서 시작","text":"부정적 신체 이미지가 자리 잡는 그 시기에 교육을 시작한다"}],"key_sentence_en":"Because a negative body image now takes root during the primary school years rather than in adolescence, education about it has to begin in primary school, since programmes aimed at teenagers may come too late.","diagram":{"kind":"timeline","title":"신체 이미지 문제의 시작과 교육 시점","items":[{"head":"어린 시절·초등 시기","body":"부정적 신체 이미지의 뿌리가 청소년기보다 앞서 나타날 수 있다.","refs":[2,3,4,5]},{"head":"교육을 시작할 시점","body":"본문은 문제를 다루는 교육을 초등학교에서 시작해야 한다고 주장한다.","refs":[6]},{"head":"청소년기만 겨냥한 개입","body":"이미 문제를 겪기 시작한 많은 학생에게는 예방 시점이 늦을 수 있다.","refs":[1,7]}],"takeaway":"이는 발달 순서의 개념도이며 칸 간격은 실제 나이·발생률의 비율이 아니다 · S1~7"},"blocking_vocab":[{"word":"body image","meaning":"신체 이미지"},{"word":"preteen years","meaning":"십 대 이전 시기"},{"word":"intervention programme","meaning":"개입 프로그램"}],"checks":[{"type":"핵심","q":"신체 이미지 교육을 초등학교에서 시작해야 한다는 이유는?","choices":["청소년기 이전에는 외모를 걱정하는 아이가 전혀 없어서","부정적 신체 이미지가 초등학교 시절부터 생길 수 있어서"],"answer":1,"why":"S2~6은 문제의 시작이 청소년기보다 이르고 초등학교 시절에도 나타난다고 한다.","refs":[2,3,4,5,6]},{"type":"근거","q":"청소년 대상 프로그램이 늦을 수 있다고 보는 까닭은?","choices":["초등학생은 신체 이미지를 전혀 갖지 않아서","문제가 그보다 어린 시기에 이미 자리 잡을 수 있어서"],"answer":1,"why":"S4와 S7은 문제 발생 시기와 청소년 대상 개입의 시간차를 연결한다.","refs":[4,7]},{"type":"변형 탐지","q":"S4의 연구 결과와 일치하는 것은?","choices":["Negative body image often develops while children are still at primary school.","Negative body image begins only after children leave primary school."],"answer":0,"why":"S4는 초등학교 재학 중인 십 대 이전 시기에 흔히 발달한다고 한다.","refs":[4]}],"sentences":[{"n":1,"en":"Most of the research and literature on young people and body image has focused on adolescents.","ko":"젊은이와 신체 이미지에 관한 대부분의 연구와 문헌 은 청소년 에게 초점을 맞춰 왔다."},{"n":2,"en":"We now know that a negative body image frequently develops at a younger age than this.","ko":"이제 우리는 부정적인 신체 이미지가 이보다 더 어린 연령대에 빈번히 나타난다는 것을 알고 있다."},{"n":3,"en":"We often associate body dissatisfaction and eating problems with teenagers, but the roots of these difficulties can be traced back to an earlier time in childhood.","ko":"우리는 흔히 신체 불만족 과 섭식 문제를 십 대와 연관 짓지만, 이러한 어려움의 뿌리 는 아동기의 더 이른 시점까지 거슬러 올라갈 수 있다."},{"n":4,"en":"Recent studies show that a negative body image often develops during the preteen years while children are still at primary school.","ko":"최근의 연구 는 부정적인 신체 이미지가 흔히 아이들이 아직 초등학교 에 다니는 13세가 되기 전의 아동기에 나타난다는 것을 보여 준다."},{"n":5,"en":"Children are showing concerns over their physical appearance and body image at an increasingly young age.","ko":"아이들은 갈수록 더 어린 나이 에 자신의 외모 와 신체 이미지를 걱정하고 있다."},{"n":6,"en":"Education to tackle this problem has to begin in the primary school.","ko":"이 문제 를 다루는 교육은 초등학교 단계에서 시작되어야 한다."},{"n":7,"en":"Intervention programmes aimed at adolescents may be too late to prevent many young people from developing a negative body image with its associated eating problems, depression, low self-esteem and anxiety.","ko":"청소년 대상 개입 프로그램 은 많은 젊은이가 부정적 신체 이미지와 그에 따른 섭식 문제, 우울증, 낮은 자존감 , 불안을 갖게 되는 것을 막기에는 너무 늦을 수 있다."}]}]},{"id":"nje03","label":"N제 3강","scope":"N제 p6~42 시험 범위","passages":[{"id":"nje03-01","unit":"nje03","number":1,"title":"no.01","core":"재난 대비는 하나의 재난을 그대로 예행하는 것이 아니라 적응할 수 있는 지구력을 기르는 일이다.","flow":[{"label":"주제","sentences":"S1","text":"비상사태가 있다는 것은 알아도 무엇일지는 모르므로 대비는 예행연습과 다르다","refs":[1]},{"label":"근거","sentences":"S2","text":"계획대로 모의 재난을 아무리 많이 해도 실제 재난은 그중 어느 것도 그대로 되풀이하지 않는다","refs":[2]},{"label":"비유","sentences":"S3-4","text":"높이뛰기가 아니라 마라톤 훈련에 가까워 짧은 거리와 교차 훈련으로 지구력을 쌓는다","refs":[3,4]},{"label":"결론","sentences":"S5-6","text":"제대로 준비하면 예측하든 못 하든 다양한 조건에서 달릴 최적 상태가 된다","refs":[5,6]}],"structure":[{"title":"예행연습 — 높이뛰기·단거리","text":"정해진 한 상황을 그대로 되풀이해 연습한다"},{"title":"대비 — 마라톤 훈련","text":"짧은 거리와 교차 훈련으로 어떤 조건에도 견딜 지구력을 쌓는다"}],"key_sentence_en":"Disaster preparation should build adaptable endurance rather than rehearse one exact disaster.","diagram":{"kind":"compare","title":"재난 대비를 설명하는 마라톤 훈련 비유","items":[{"head":"마라톤 준비","body":"실제 26마일 전 구간을 반복 달리기보다 짧은 거리와 교차 훈련으로 지구력·적응력을 기른다.","refs":[3,4,5,6]},{"head":"재난 대비","body":"계획대로 꾸민 한 재난을 그대로 재현하기보다 실제 상황의 변동에 대응할 능력을 준비한다.","refs":[1,2,3]}],"takeaway":"두 칸은 동일한 사건이 아니라 준비 방식의 유추다 · S1~6"},"blocking_vocab":[{"word":"contingency","meaning":"뜻밖의 사태"},{"word":"rehearsal","meaning":"예행연습"},{"word":"endurance","meaning":"지구력"}],"checks":[{"type":"핵심","q":"재난 대비를 글은 무엇에 비유하는가?","choices":["정해진 재난 장면을 그대로 되풀이하는 연습","여러 조건에 적응할 지구력을 기르는 마라톤 준비"],"answer":1,"why":"S1~3은 재난 대비가 재난 예행연습과 다르며 마라톤 훈련과 비슷하다고 한다.","refs":[1,2,3]},{"type":"비유 근거","q":"마라톤 선수는 본문에서 어떻게 대회를 준비하는가?","choices":["짧은 거리를 뛰고 교차 훈련으로 지구력을 기른다.","매번 26마일 전 코스를 그대로 뛴다."],"answer":0,"why":"S4는 전체 코스를 그대로 뛰지 않고 짧은 거리와 cross-training으로 지구력을 기른다고 한다.","refs":[4]},{"type":"변형 탐지","q":"실제 재난에 관한 S2와 일치하는 것은?","choices":["A real disaster will never exactly mirror one staged mock disaster.","A real disaster will always exactly mirror one staged mock disaster."],"answer":0,"why":"S2의 never mirror any one of them을 확인한다.","refs":[2]}],"sentences":[{"n":1,"en":"The known fact of contingencies, without knowing precisely what those contingencies will be, shows that disaster preparation is not the same thing as disaster rehearsal.","ko":"비상사태에 관해 알려진 사실은, 그 비상사태가 어떤 것이 될지 정확히 모르고, 재난 대비 가 재난 예행연습 과 똑같은 것이 아니라는 것을 보여 준다."},{"n":2,"en":"No matter how many mock disasters are staged according to prior plans, the real disaster will never mirror any one of them.","ko":"아무리 많은 모의 재난 이 사전 계획에 따라 조직되더라도 실제 재난 은 그런 것들 중 어느 하나라도 절대 그대로 반영하지 않을 것이다."},{"n":3,"en":"Disaster-preparation planning is more like training for a marathon than training for a high-jump competition or a sprinting event.","ko":"재난 대비 계획 세우기는 높이뛰기 시합이나 단거리 달리기 경주를 위해 훈련하는 것이라기보다는 마라톤 을 위해 훈련하는 것과 더 비슷하다."},{"n":4,"en":"Marathon runners do not practice by running the full course of twenty-six miles; rather, they get into shape by running shorter distances and building up their endurance with cross-training.","ko":"마라톤 선수들은 26마일 전체 코스를 달리는 것으로 연습하는 것이 아니라 오히려 더 짧은 거리를 달리고 여러 가지 운동을 조합하여 행하는 훈련법으로 자신의 지구력 을 강화함으로써 몸 상태를 좋게 만든다."},{"n":5,"en":"If they have prepared successfully, then they are in optimal condition to run the marathon over its predetermined course and length, assuming a range of weather conditions, predicted or not.","ko":"만약 그들이 성공적으로 준비했다면, 그들은 예상되든 아니든 다양한 기상 조건 을 가정하면서 마라톤의 미리 정해진 코스와 길이에 걸쳐 마라톤을 달릴 수 있는 최적의 상태 에 있게 된다."},{"n":6,"en":"This is normal marathon preparation.","ko":"이것이 보통의 마라톤 준비이다."}]},{"id":"nje03-02","unit":"nje03","number":2,"title":"no.02","core":"앞차와의 여유 공간처럼 완충 지대는 반응할 시간을 만들어 일과 삶의 마찰을 줄여 준다.","flow":[{"label":"도입","sentences":"S1-2","text":"차 안에서 아이들에게 완충 지대의 개념을 게임으로 설명하려 했다","refs":[1,2]},{"label":"설정","sentences":"S3-5","text":"멈추지 않고 3마일을 가야 하는데 앞뒤 상황은 예측할 수 없다","refs":[3,4,5]},{"label":"핵심","sentences":"S6-7","text":"추돌을 막는 유일한 방법은 앞차와 여분의 공간을 두는 것이고 그것이 완충 지대다","refs":[6,7]},{"label":"까닭","sentences":"S8","text":"그 공간이 갑작스러운 움직임에 반응하고 적응할 시간을 준다","refs":[8]},{"label":"적용","sentences":"S9","text":"마찬가지로 완충 지대를 만들면 일과 삶의 마찰이 줄어든다","refs":[9]}],"structure":[{"title":"문제 — 예측할 수 없는 앞길","text":"신호가 언제 바뀔지, 앞차가 언제 설지 알 수 없다"},{"title":"해결 — 여유 공간","text":"앞차와 거리를 두면 반응할 시간이 생기고, 일과 삶에서도 마찰이 준다"}],"key_sentence_en":"Buffers create room to respond and reduce friction in work and life.","lead":"앞차가 갑자기 브레이크를 밟을 때, 두 차 사이의 여유 공간은 무엇을 해 줄까?","image":"../../assets/daea2-nje03-02-buffer.webp","image_alt":"앞차의 브레이크등이 켜졌고 뒤차는 충분한 거리를 둔 도로 장면","image_caption":"본문 S5~8에서 앞차와의 여유 공간은 갑작스러운 움직임에 반응할 시간을 주는 완충 지대다.","prediction":{"question":"두 차 사이 공간을 두는 가장 중요한 이유는?","choices":["앞차의 갑작스러운 움직임에 반응할 시간을 얻기 위해","신호등이 언제나 초록불일 것을 보장하기 위해"],"answer":0,"actual":"S6~9는 여유 공간이 돌발 상황에 반응하고 적응할 시간을 주며, 같은 원리가 일과 삶에도 적용된다고 한다."},"blocking_vocab":[{"word":"buffer","meaning":"완충 공간"},{"word":"put on the brakes","meaning":"브레이크를 밟다"},{"word":"friction","meaning":"마찰"}],"checks":[{"type":"핵심","q":"차 앞의 여유 공간으로 설명한 삶의 원칙은?","choices":["여유 공간을 없애야 더 빨리 반응할 수 있다.","완충 여지를 두면 돌발 상황에 반응하고 적응할 수 있다."],"answer":1,"why":"S6~8의 차간 거리 비유가 S9의 일과 삶의 완충 지대로 연결된다.","refs":[6,7,8,9]},{"type":"인과 근거","q":"앞차와 거리를 두어야 하는 직접적인 이유는?","choices":["신호등의 색을 미리 확정할 수 있기 때문에","돌발 제동에도 반응할 시간을 확보하기 위해"],"answer":1,"why":"S5의 예상 못 하는 제동과 S6~8의 거리·반응 시간을 연결한다.","refs":[5,6,7,8]},{"type":"변형 탐지","q":"S9의 적용과 일치하는 것은?","choices":["Creating a buffer can reduce friction in work and life.","Creating a buffer necessarily increases friction in work and life."],"answer":0,"why":"S9의 reduce the friction을 확인한다.","refs":[9]}],"sentences":[{"n":1,"en":"On one occasion I was trying to explain the concept of buffers to my children.","ko":"한번은 내가 아이들에게 완충 지대 의 개념을 설명하려고 했다."},{"n":2,"en":"We were in the car together at the time and I tried to explain the idea using a game.","ko":"우리는 그때 차에 함께 있었고 나는 게임을 이용하여 그 개념을 설명하려고 했다."},{"n":3,"en":"Imagine, I said, that we had to get to our destination three miles away without stopping.","ko":"나는 우리가 멈추지 않고 3마일 떨어진 목적지 까지 도착해야 한다고 상상해 보자고 말했다."},{"n":4,"en":"We couldn't predict what was going to happen in front of us and around us.","ko":"우리는 우리 앞과 주위에서 무슨 일이 일어날지 예측 할 수 없다."},{"n":5,"en":"We didn't know how long the light would stay on green or if the car in front would suddenly put on its brakes.","ko":"우리는 신호등 이 얼마나 오랫동안 녹색으로 켜 있을지 혹은 앞차의 운전자가 갑자기 브레이크 를 밟을지 모른다."},{"n":6,"en":"The only way to keep from crashing was to put extra space between our car and the car in front of us.","ko":"추돌을 막는 유일한 방법은 우리 차와 우리 앞에 있는 차 사이에 여분의 공간 을 두는 것이다."},{"n":7,"en":"This space acts as a buffer.","ko":"이 공간은 완충 지대 로 작용한다."},{"n":8,"en":"It gives us time to respond and adapt to any sudden moves by other cars.","ko":"그것은 우리에게 다른 차들의 갑작스러운 움직임에 반응하고 적응 할 시간을 준다."},{"n":9,"en":"Similarly, we can reduce the friction of doing the essential in our work and lives simply by creating a buffer.","ko":"마찬가지로, 우리는 단지 완충 지대 를 만듦으로써 우리의 일과 삶에서 필수적인 일 을 할 때의 마찰을 줄일 수 있다."}]},{"id":"nje03-03","unit":"nje03","number":3,"title":"no.03","core":"사회적 삶은 연극과 같아서 연기력이 뛰어난 사람일수록 복잡한 환경을 더 잘 헤쳐 나간다.","flow":[{"label":"도입","sentences":"S1","text":"여러 작가와 사상가가 사회적 삶의 연극적 속성에 놀라 왔다","refs":[1]},{"label":"인용","sentences":"S2","text":"셰익스피어의 「모든 세상은 무대」가 그 가장 유명한 표현이다","refs":[2]},{"label":"해석","sentences":"S3","text":"가면의 이미지처럼 우리 모두가 늘 가면을 쓰고 있다는 뜻이다","refs":[3]},{"label":"대비","sentences":"S4-6","text":"연기 실력은 사람마다 달라 적의를 미소 뒤에 감추거나 허세로 리더가 된다","refs":[4,5,6]},{"label":"결론","sentences":"S7","text":"연기력이 뛰어난 사람이 복잡한 사회를 더 잘 헤쳐 나가 성공한다","refs":[7]}],"structure":[{"title":"서툰 연기자","text":"속을 감추지 못해 복잡한 사회 환경에서 불리하다"},{"title":"뛰어난 연기자","text":"적의를 미소 뒤에 감추거나 자신감과 허세로 리더가 되어 앞서 나간다"}],"key_sentence_en":"Social life is theatrical, and skilled performers can navigate it more successfully.","blocking_vocab":[{"word":"theatrical","meaning":"연극 같은"},{"word":"conceal","meaning":"감추다"},{"word":"bravado","meaning":"허세·대담한 태도"}],"checks":[{"type":"핵심","q":"사회적 삶을 연극에 비유한 뒤 글이 내리는 결론은?","choices":["연기력이 좋은 사람은 복잡한 사회 환경을 더 잘 헤쳐 나갈 수 있다.","사회에서는 누구도 역할을 바꾸거나 감정을 감추지 않는다."],"answer":0,"why":"S1~3의 연극 비유 뒤 S4~7이 연기 능력에 따른 사회적 결과를 설명한다.","refs":[1,3,4,7]},{"type":"사례 근거","q":"이아고의 예에서 숨기는 것은 무엇인가?","choices":["친근한 미소","적대적인 의도"],"answer":1,"why":"S5는 적대적인 의도를 친근한 미소 뒤에 감춘다고 한다.","refs":[5]},{"type":"변형 탐지","q":"S6~7과 일치하는 것은?","choices":["Confident acting may help some people lead and navigate social settings.","Acting skills always prevent people from navigating social settings."],"answer":0,"why":"S6은 더 자신 있게 행동하는 사람이 지도자가 되기도 하고 S7은 뛰어난 연기력이 사회적 상황을 헤쳐 나가는 데 도움이 된다고 한다.","refs":[6,7]}],"sentences":[{"n":1,"en":"Over the centuries various writers and thinkers, looking at humans from an outside perspective, have been struck by the theatrical quality of social life.","ko":"수 세기에 걸쳐 다양한 작가와 사상가 들은 외부의 관점에서 인간들을 바라보며 사회적 삶의 연극적인 속성 에 깊은 인상을 받아 왔다."},{"n":2,"en":"The most famous quote expressing this comes from Shakespeare: \"All the world's a stage, / And all the men and women merely players; / They have their exits and their entrances, / And one man in his time plays many parts.\"","ko":"이것을 표현한 가장 유명한 명언은 셰익스피어에게서 비롯된다. \"모든 세상은 연극무대 이다. 그리고 모든 인간은 단지 배우일 뿐이다. 그들은 퇴장하고 등장한다. 그리고 일생 동안 한 인간은 다양한 역할을 연기한다.\""},{"n":3,"en":"If the theater and actors were traditionally represented by the image of masks, writers such as Shakespeare are implying that all of us are constantly wearing masks.","ko":"만약 연극과 배우들이 전통적으로 가면 의 이미지에 의해 표현된다면, 셰익스피어와 같은 작가들은 우리 모두가 끊임없이 가면 을 쓰고 있다는 것을 암시하고 있는 것이다."},{"n":4,"en":"Some people are better actors than others.","ko":"어떤 사람들은 다른 사람들보다 더 나은 배우 이다."},{"n":5,"en":"Evil types such as Iago in the play Othello are able to conceal their hostile intentions behind a friendly smile.","ko":"연극 〈Othello〉 속 Iago와 같은 악역들은 그들의 적대적 의도 를 친근한 미소 뒤에 숨길 수 있다."},{"n":6,"en":"Others are able to act with more confidence and bravado ─ they often become leaders.","ko":"다른 사람들은 더 큰 자신감과 허세 를 가지고 연기할 수 있는데, 그들은 흔히 리더 가 된다."},{"n":7,"en":"People with excellent acting skills can better navigate our complex social environments and get ahead.","ko":"훌륭한 연기력 을 가지고 있는 사람들은 우리의 복잡한 사회적 환경 을 더 잘 헤쳐 나갈 수 있고 성공할 수 있다."}]},{"id":"nje03-04","unit":"nje03","number":4,"title":"no.04","core":"한때 쓸모 있던 해결책도 필요를 잃은 뒤까지 굳어지면 변화를 막는 보이지 않는 규칙이 된다.","flow":[{"label":"발단","sentences":"S1-2","text":"명상 때마다 고양이가 돌아다니며 신도들을 방해했다","refs":[1,2]},{"label":"해결","sentences":"S3","text":"성자는 명상 시간에 고양이를 기둥에 묶는 간단한 해결책을 냈다","refs":[3]},{"label":"굳어짐","sentences":"S4-5","text":"그 해결이 의식으로 굳었고 고양이가 죽자 종교적 위기가 왔다","refs":[4,5]},{"label":"명명","sentences":"S6-9","text":"필요를 잃고도 규칙으로 굳어진 습관을 보이지 않는 규칙이라 부른다","refs":[6,7,8,9]},{"label":"결론","sentences":"S10-11","text":"쓰인 규칙보다 더 완고해 침묵의 살인자라 할 만하다","refs":[10,11]}],"structure":[{"title":"원인 — 한때의 해결책","text":"실제 문제를 풀어 준 방편이 절차로 자리 잡는다"},{"title":"결과 — 보이지 않는 규칙","text":"쓸모가 사라진 뒤에도 남아 쓰인 규칙보다 완고하게 변화를 막는다"}],"key_sentence_en":"A useful solution can harden into an invisible rule that resists change.","image":"../../assets/daea2-nje03-04-cat-ritual.webp","image_alt":"명상을 방해하며 걸어 다니는 고양이, 느슨하게 기둥에 묶여 조용히 앉은 고양이, 고양이가 없어진 뒤 빈 기둥 앞에서 망설이는 제자들의 세 장면 개념 삽화","image_caption":"S2~10: 방해를 막으려던 해결책이 의식처럼 굳어져, 고양이가 없어진 뒤에도 제자들은 명상을 시작할 방법을 고민합니다. 실제 종교·시대의 기록 장면이 아닌 우화 삽화입니다.","prediction":{"question":"고양이가 사라졌는데도 제자들이 기둥 앞에서 망설인 까닭은?","choices":["예전 해결책을 반드시 지켜야 할 규칙으로 여기게 되어","명상에 고양이가 실제로 꼭 필요해서"],"answer":0,"actual":"S3~10에서 고양이를 묶던 임시 해결책이 목적을 잊은 의식·보이지 않는 규칙으로 굳어졌다고 설명한다."},"blocking_vocab":[{"word":"ritual","meaning":"의식처럼 굳어진 절차"},{"word":"rigidify","meaning":"경직되다"},{"word":"invisible rule","meaning":"보이지 않는 규칙"}],"checks":[{"type":"핵심","q":"고양이를 묶던 습관이 보여 주는 문제는?","choices":["고양이를 묶지 않으면 어떤 명상도 불가능하다.","필요했던 해결책이 이유를 잃은 뒤에도 굳은 규칙으로 남을 수 있다."],"answer":1,"why":"S3~7의 고양이 일화가 S8~10의 보이지 않는 규칙으로 설명된다.","refs":[3,4,5,6,7,8,9,10]},{"type":"사례 근거","q":"처음에 고양이를 기둥에 묶은 이유는?","choices":["명상 중 울며 방해하는 일을 막으려고","고양이가 명상의 필수 요소였기 때문에"],"answer":0,"why":"S2~3의 방해와 해결책을 확인한다.","refs":[2,3]},{"type":"변형 탐지","q":"보이지 않는 규칙에 관한 S9~10과 맞는 것은?","choices":["They are written rules that never resist change.","They are habits unnecessarily hardened into rules and can resist change."],"answer":1,"why":"S9는 불필요하게 경직된 습관이고 S10은 특히 바꾸기 어렵다고 한다.","refs":[9,10]}],"sentences":[{"n":1,"en":"Author Elizabeth Gilbert tells the fable of a great saint who would lead his followers in meditation.","ko":"작가 Elizabeth Gilbert는 명상할 때 그의 신도들을 이끌었던 위대한 성자 의 우화 를 들려준다."},{"n":2,"en":"Just as the followers were dropping into their zen moment, they would be disrupted by a cat that would walk through the temple meowing and bothering everyone.","ko":"신도들이 그들의 선의 순간에 막 빠질 때, 그들은 야옹 하고 울고 모든 사람을 귀찮게 하며 사원을 돌아다니는 고양이 에 의해 방해를 받곤 했다."},{"n":3,"en":"The saint came up with a simple solution: He began to tie the cat to a pole during meditation sessions.","ko":"성자는 간단한 해결책 을 생각해 냈고, 그는 명상 시간 동안 고양이 를 기둥에 묶기 시작했다."},{"n":4,"en":"This solution quickly developed into a ritual: Tie the cat to the pole first, meditate second.","ko":"이 해결책 은 빠르게 하나의 의식으로 발전했는데, 먼저 고양이 를 기둥에 묶고, 그다음에 명상을 하라는 것이다."},{"n":5,"en":"When the cat eventually died of natural causes, a religious crisis followed.","ko":"고양이 가 결국 자연사 했을 때, 종교적 위기가 뒤따랐다."},{"n":6,"en":"What were the followers supposed to do?","ko":"신도들은 어떻게 해야 하는가 ?"},{"n":7,"en":"How could they possibly meditate without tying the cat to the pole?","ko":"고양이 를 기둥에 묶지 않고 그들이 과연 어떻게 명상 할 수 있을 것인가?"},{"n":8,"en":"This story illustrates what I call invisible rules.","ko":"이 이야기는 내가 보이지 않는 규칙 이라고 부르는 것을 보여 준다."},{"n":9,"en":"These are habits and behaviors that have unnecessarily rigidified into rules.","ko":"이것들은 불필요하게 규칙으로 굳어진 습관과 행동들이다."},{"n":10,"en":"Although written rules can be resistant to change, invisible ones are more stubborn.","ko":"쓰인 규칙들은 변화에 저항 할 수 있지만, 보이지 않는 규칙 들은 더 완고하다."},{"n":11,"en":"They're the silent killers.","ko":"그것들은 침묵의 살인자 들이다."}]},{"id":"nje03-05","unit":"nje03","number":5,"title":"no.05","core":"다양성이 숲을 붕괴에서 지켜 주기에 균류는 한 종의 독점을 막고 여러 종을 함께 살린다.","flow":[{"label":"도입","sentences":"S1-2","text":"균류가 나무보다 앞날을 더 생각하는 듯하며 나무끼리는 서로 다툰다","refs":[1,2]},{"label":"물음","sentences":"S3-4","text":"너도밤나무가 대부분의 숲에서 이긴다면 그것이 정말 이점일까","refs":[3,4]},{"label":"위험","sentences":"S5","text":"새 병원균이 나타나 너도밤나무를 다 죽이면 어떻게 될까","refs":[5]},{"label":"근거","sentences":"S6","text":"참나무·단풍·전나무가 남아 그늘을 주면 어린나무가 다시 자랄 수 있다","refs":[6]},{"label":"결론","sentences":"S7-8","text":"다양성이 안전을 주므로 균류는 한 종의 독점을 막고 여러 종을 받쳐 준다","refs":[7,8]}],"structure":[{"title":"문제 — 한 종의 독점","text":"한 종이 이기면 새 병원균 하나로 숲 전체가 무너질 수 있다"},{"title":"해결 — 다양성 유지","text":"다른 종이 남아 그늘을 주고, 균류가 땅속에서 여러 종을 받쳐 독점을 막는다"}],"key_sentence_en":"Fungi protect forest diversity because diversity helps the forest survive collapse.","blocking_vocab":[{"word":"pathogen","meaning":"병원체"},{"word":"sprout","meaning":"싹트다"},{"word":"dominate","meaning":"독점하다"}],"checks":[{"type":"핵심","q":"균류가 한 나무 종의 독점을 막는 까닭은?","choices":["한 종만 남아야 모든 병원체를 피할 수 있기 때문에","다양한 종이 있어야 숲의 안정성이 유지되기 때문에"],"answer":1,"why":"S5~8은 한 종이 병원체에 취약할 수 있고 다양성이 숲의 안전을 높인다고 한다.","refs":[5,6,7,8]},{"type":"가정 근거","q":"너도밤나무 대부분이 병에 걸리면 다른 나무들이 할 수 있는 역할은?","choices":["어린 너도밤나무의 싹을 모두 막는다.","어린 너도밤나무가 자랄 그늘을 제공한다."],"answer":1,"why":"S6은 다른 종이 계속 자라며 어린 너도밤나무에 필요한 그늘을 제공한다고 한다.","refs":[6]},{"type":"변형 탐지","q":"S7~8과 일치하는 것은?","choices":["Diversity weakens forests, and fungi promote one tree species to dominate.","Diversity secures forests, and fungi help prevent a single tree species from dominating."],"answer":1,"why":"S7의 security와 S8의 protect from complete collapse, doesn't dominate를 확인한다.","refs":[7,8]}],"sentences":[{"n":1,"en":"I suspect fungi are a little more forward \"thinking\" than their larger partners.","ko":"나는 균류 가 자신의 더 큰 상대들보다 조금 더 앞날을 '생각하는' 것이 아닌가 하고 생각한다."},{"n":2,"en":"Among trees, each species fights other species.","ko":"나무들 사이에서 각각의 종은 다른 종 과 싸운다."},{"n":3,"en":"Let's assume the beeches native to Central Europe could emerge victorious in most forests there.","ko":"중부 유럽이 원산지인 너도밤나무 가 그곳의 숲 대부분에서 승리 를 거둘 수 있다고 가정해 보자."},{"n":4,"en":"Would this really be an advantage?","ko":"이것은 정말 이점 일까?"},{"n":5,"en":"What would happen if a new pathogen came along that infected most of the beeches and killed them?","ko":"만약 대부분의 너도밤나무 를 감염시켜 죽게 하는 새로운 병원균 이 나타나면 어떻게 될까?"},{"n":6,"en":"In that case, wouldn't it be more advantageous if there were a certain number of other species around ─ oaks, maples, or firs ─ that would continue to grow and provide the shade needed for a new generation of young beeches to sprout and grow up?","ko":"그런 경우, 계속 자라서 새로운 세대의 어린 너도밤나무 가 싹을 틔우고 자라는 데 필요한 그늘을 제공하는 참나무, 단풍나무 또는 전나무와 같은 일정한 수의 다른 종 이 주위에 있다면 더 유리하지 않을까?"},{"n":7,"en":"Diversity provides security for ancient forests.","ko":"다양성 은 오래된 숲에 안전을 제공한다."},{"n":8,"en":"Because fungi are also very dependent on stable conditions, they support other species underground and protect them from complete collapse to ensure that one species of tree doesn't manage to dominate.","ko":"균류 또한 안정적인 조건 에 매우 의존하기 때문에, 그것들은 한 종의 나무가 우세해지지 않도록 확실히 하기 위해 땅속에서 다른 종 들을 지원하고 그것들을 완전한 붕괴로부터 보호한다."}]},{"id":"nje03-06","unit":"nje03","number":6,"title":"no.06","core":"과학 이론은 증명되는 것이 아니라 반증될 수 있어야 하며 관찰에 종속되어야 한다.","flow":[{"label":"전제","sentences":"S1-3","text":"과학의 목표는 자연 이해이고 두 기둥은 이론과 관찰이다","refs":[1,2,3]},{"label":"전개","sentences":"S4-5","text":"관찰은 이론이 옳은지, 더 정확히는 옳지 않은지를 알려 준다","refs":[4,5]},{"label":"핵심","sentences":"S6-7","text":"수학처럼 증명될 수는 없고 반증될 수 있어야 한다","refs":[6,7]},{"label":"예시","sentences":"S8","text":"천동설과 평평한 지구가 반증된 것이 잘 알려진 예다","refs":[8]},{"label":"결론","sentences":"S9-10","text":"이론은 관찰에 종속되며 아무리 훌륭해도 자연을 속일 수 없다","refs":[9,10]}],"structure":[{"title":"증명 — 수학적 정리","text":"엄격한 의미로 참임을 확정할 수 있다"},{"title":"반증 — 과학 이론","text":"틀렸음을 보일 연구를 생각해 낼 수 있어야 하고 관찰에 종속된다"}],"key_sentence_en":"Scientific theories must remain falsifiable and subordinate to observation.","diagram":{"kind":"condition","title":"이론의 예측을 관찰과 대조하면","items":[{"head":"공통 기준 · 이론의 예측과 관찰","body":"과학 이론은 자연 과정의 행동을 예측하고, 관찰은 그 예측과 대조된다.","refs":[2,3,4,5]},{"head":"예측과 일치","body":"이론을 지지할 수 있지만 수학 정리처럼 최종 증명한 것은 아니다.","refs":[4,6]},{"head":"예측과 모순","body":"반증할 수 있는 관찰·실험의 근거가 될 수 있다.","refs":[5,7]}],"takeaway":"이론은 아무리 우아해도 관찰에 종속된다 · S9~10"},"blocking_vocab":[{"word":"falsify","meaning":"반증하다"},{"word":"rigorous","meaning":"엄밀한"},{"word":"subservience","meaning":"종속됨"}],"checks":[{"type":"핵심","q":"과학 이론과 관찰의 관계에 관한 글의 주장은?","choices":["이론은 반증 가능해야 하고 관찰 결과에 종속되어야 한다.","이론은 관찰보다 우위이며 언제나 엄밀하게 증명된다."],"answer":0,"why":"S4~7은 반증 가능성을 설명하고 S9~10은 관찰에 대한 이론의 종속을 강조한다.","refs":[4,5,6,7,9,10]},{"type":"구분 근거","q":"수학 정리와 달리 과학 이론에 대해 가능한 것은?","choices":["엄밀한 의미에서의 최종 증명","관찰이나 실험에 의한 반증"],"answer":1,"why":"S6은 수학 정리처럼 증명할 수 없고 S7은 반증할 수 있다고 한다.","refs":[6,7]},{"type":"변형 탐지","q":"S10의 결론과 일치하는 것은?","choices":["However elegant a theory is, nature cannot be fooled.","If a theory is elegant, nature must behave as it predicts."],"answer":0,"why":"S10은 이론이 아무리 우아해도 자연을 속일 수 없다고 한다.","refs":[10]}],"sentences":[{"n":1,"en":"The goal of science is to understand nature.","ko":"과학의 목표 는 자연을 이해하는 것이다."},{"n":2,"en":"The two pillars of the scientific method are theory and observation.","ko":"과학적 방법 의 중심이 되는 두 가지는 이론과 관찰이다."},{"n":3,"en":"A scientific theory predicts how a natural process should behave.","ko":"과학 이론 은 자연적인 과정 이 어떻게 작용하는지를 예측한다."},{"n":4,"en":"Observation, whether through a controlled experiment or direct observation of the natural world, can tell us whether the theory is correct.","ko":"통제된 실험 을 통해서든 자연 세계에 대한 직접적인 관찰을 통해서든, 관찰은 그 이론이 옳은지 여부를 우리에게 알려 줄 수 있다."},{"n":5,"en":"Or, more accurately, it can tell us whether the theory is not correct.","ko":"또는 보다 정확하게는 그것(관찰)은 그 이론이 옳지 않은지 여부를 우리에게 알려 줄 수 있다."},{"n":6,"en":"A scientific theory cannot be proved in the rigorous sense of a mathematical theorem.","ko":"과학 이론 은 수학적 정리라는 엄격한 의미로 증명 될 수 없다."},{"n":7,"en":"But it can be falsified, meaning that we can conceive of an experimental or observational study that would show the theory to be false.","ko":"그러나 그것은 반증 될 수 있는데, 이는 우리가 그 이론이 틀렸음을 보여 줄 실험적 또는 관찰적 연구를 생각해 낼 수 있음을 의미한다."},{"n":8,"en":"Well-known examples from the early history of science include the falsification of the pre-Copernican theory that the Sun rotated around a stationary planet Earth, or that the Earth itself was flat.","ko":"초기 과학사에서 잘 알려진 예는 태양이 정지된 행성인 지구 주위를 돈다거나 지구 자체가 평평하다는 코페르니쿠스 이전 이론의 반증 을 포함한다."},{"n":9,"en":"Similarly, the subservience of theory to observation is important.","ko":"마찬가지로, 이론이 관찰에 종속 되는 것도 중요하다."},{"n":10,"en":"However elegant a theory may be, nature cannot be fooled.","ko":"어떤 이론이 아무리 훌륭할지라도, 자연을 속일 수는 없다 ."}]},{"id":"nje03-07","unit":"nje03","number":7,"title":"no.07","core":"좁은 초점이 창의성을 가두므로 다른 분야로 눈을 돌리면 그 자물쇠가 풀린다.","flow":[{"label":"전제","sentences":"S1-2","text":"정보의 공세 속에 살아남는 길은 사고의 대상을 좁히는 것이다","refs":[1,2]},{"label":"문제","sentences":"S3-4","text":"그 좁은 초점이 사물을 한 가지로만 보게 하고 창의력을 잠근다","refs":[3,4]},{"label":"근거","sentences":"S5","text":"역사에는 다른 분야에서 배워 자기 분야를 혁신한 사람이 가득하다","refs":[5]},{"label":"예시","sentences":"S6-7","text":"Drake 는 소금 시추를 보고 유정 개념을 떠올려 석유 산업을 낳았다","refs":[6,7]},{"label":"처방","sentences":"S8-9","text":"틀에 박히면 다른 분야 사람과 이야기하고 탐색할 시간을 잡고 밖의 것을 읽는다","refs":[8,9]}],"structure":[{"title":"문제 — 좁은 초점","text":"살아남으려 범위를 좁혔더니 한 가지 시각에 갇혀 창의력이 잠긴다"},{"title":"해결 — 바깥으로","text":"다른 분야 사람과 말하고 탐색 시간을 잡고 관심 밖의 것을 읽는다"}],"key_sentence_en":"Looking outside one&#x27;s own field can release creativity from a narrow rut.","blocking_vocab":[{"word":"rut","meaning":"틀에 박힌 상태"},{"word":"adapt","meaning":"응용하다"},{"word":"set loose","meaning":"풀어 주다"}],"checks":[{"type":"핵심","q":"좁은 사고의 틀에서 벗어나 창의성을 높이는 방법은?","choices":["오직 익숙한 분야만 더 좁게 본다.","자기 분야 밖의 사람·지식·활동을 탐색한다."],"answer":1,"why":"S3의 좁은 초점 문제에 S5~9가 다른 분야 탐색을 해결책으로 제시한다.","refs":[3,5,8,9]},{"type":"사례 근거","q":"에드윈 드레이크가 유정 개념을 얻은 계기는?","choices":["유정이 이미 완성된 뒤 그 절차를 복사한 것","소금 채굴을 위한 굴착을 보고 응용한 것"],"answer":1,"why":"S6~7은 소금 시추를 보고 석유에 적용했다고 한다.","refs":[6,7]},{"type":"변형 탐지","q":"S8의 조언과 일치하는 것은?","choices":["Avoid reading or talking about fields outside your expertise.","Explore fields unrelated to your own when you feel stuck."],"answer":1,"why":"S8은 다른 분야 사람과 대화하고 관심 영역 밖을 읽으라고 한다.","refs":[8]}],"sentences":[{"n":1,"en":"Our minds are bombarded by thousands of bits of information every day.","ko":"우리 마음은 매일 수천 개의 작은 정보 들의 공세를 받는다."},{"n":2,"en":"The only way to survive in this kind of world is to focus our mind on specific areas, to narrow the target of our thinking.","ko":"이런 세상에서 살아남는 유일한 방법은 특정한 분야에 우리 마음을 집중시키는 것, 즉 우리 사고의 대상 을 좁히는 것이다."},{"n":3,"en":"However, at times our narrow focus of thinking forces us to see things in just one way and locks up our creative machinery.","ko":"그러나 때때로 우리 사고의 좁은 초점 은 우리에게 사물을 단 한 가지 방식으로 보게 하고 우리의 창의적인 기계[사고 장치] 를 틀에 가둔다."},{"n":4,"en":"Then what shall we do to cope with this situation?","ko":"그렇다면 우리는 이러한 상황에 대처 하기 위해 어떻게 해야 할까?"},{"n":5,"en":"History is filled with examples of people who have developed innovations in their field from something they learned in other fields.","ko":"역사는 다른 분야에서 배운 것으로부터 자기 분야에서 획기적인 것 을 개발한 사람들의 예로 가득 차 있다."},{"n":6,"en":"For one thing, Edwin Drake developed the oil well concept after watching workers drill for salt.","ko":"한 가지 예를 들자면, Edwin Drake는 일꾼들이 소금 을 얻기 위해 구멍을 뚫는 것을 본 후 유정(油井) 개념을 발전시켰다."},{"n":7,"en":"He adapted the procedure for getting salt out of the ground to oil, and the modern petroleum industry was born.","ko":"그는 땅에서 소금 을 얻는 절차를 석유에 적용했고, 현대 석유 산업이 탄생했다."},{"n":8,"en":"Upon finding ourselves in a rut, the right response is to talk to others about what they do in a field totally unrelated to ours, schedule time into our daily schedule for exploring, or read outside our area of interest or expertise.","ko":"우리 자신이 틀에 박혀 있는 것을 알았을 때, 올바른 대응은 다른 사람들이 우리와 전혀 무관한 분야에서 무엇을 하는지에 대해 그들과 이야기하거나, 우리의 일과표에 탐구 할 시간을 배정하거나, 우리의 관심 분야나 전문 지식 에서 벗어나서 독서를 하는 것이다."},{"n":9,"en":"Getting outside the lines will at times set loose our creativity.","ko":"선을 벗어나는 것은 때때로 우리의 창의성을 느슨하게 풀어 줄 것이다."}]},{"id":"nje03-08","unit":"nje03","number":8,"title":"no.08","core":"사람은 핵심 조건을 놓친 채 자동으로 반응하고, 권위가 요청하면 더 쉽게 따른다.","flow":[{"label":"도입","sentences":"S1-2","text":"「사이먼 가라사대」에서 핵심 어구가 빠져도 일부는 팔을 든다","refs":[1,2]},{"label":"확장","sentences":"S3","text":"이런 자동 조종 같은 삶은 어른에게도 일어난다","refs":[3]},{"label":"실험","sentences":"S4-5","text":"메모를 즉시 반송하라는 지시는 잠깐만 생각해도 터무니없다","refs":[4,5]},{"label":"결과","sentences":"S6","text":"그런데도 비서의 90퍼센트가 메모를 반송했다","refs":[6]},{"label":"까닭","sentences":"S7-9","text":"권위를 존중하도록 사회화되어 친구의 말은 의심해도 의사의 말은 따른다","refs":[7,8,9]}],"structure":[{"title":"원인 — 자동 반응과 권위","text":"조건을 확인하지 않는 습관에 더해 권위를 존중하도록 사회화되었다"},{"title":"결과 — 생각 없는 복종","text":"터무니없는 지시에도 90퍼센트가 따르고 같은 말도 의사가 하면 따른다"}],"key_sentence_en":"People often obey automatically because authority shapes their responses.","diagram":{"kind":"cases","title":"내용보다 단서에 끌리는 자동 반응 · 독립 사례","items":[{"head":"Simon Says 놀이","body":"핵심 문구가 빠졌는데도 일부 참가자가 동작을 따라 한다.","refs":[1,2]},{"head":"40명에게 보낸 메모","body":"비서 40명을 대상으로 한 연구에서 불합리한 반환 요청에 90%가 따랐다.","refs":[4,5,6]},{"head":"친구와 의사의 같은 요청","body":"친구의 요청에는 의심할 수 있지만 의사의 같은 요청은 권위 때문에 따르기 쉽다.","refs":[7,8,9]}],"takeaway":"90%는 메모 연구의 결과이며 다른 두 사례의 비율이 아니다 · S4~6"},"blocking_vocab":[{"word":"automatic pilot","meaning":"무심코 하는 자동 반응"},{"word":"absurdity","meaning":"터무니없음"},{"word":"comply","meaning":"따르다"}],"checks":[{"type":"핵심","q":"두 사례가 함께 보여 주는 사람의 반응은?","choices":["사람은 모든 요청을 한 번도 자동으로 따르지 않는다.","요청의 조건이나 타당성을 놓친 채 자동으로, 특히 권위자에게 쉽게 따른다."],"answer":1,"why":"S1~6은 자동 반응, S7~9는 권위에 대한 복종을 보여 준다.","refs":[1,2,3,4,5,6,7,8,9]},{"type":"수치 근거","q":"교수의 우스꽝스러운 메모를 돌려보낸 비율은?","choices":["10퍼센트","40퍼센트","90퍼센트"],"answer":2,"why":"S6에 90 percent라고 명시되어 있다. S4의 forty는 참여한 비서의 수다.","refs":[4,6]},{"type":"변형 탐지","q":"친구와 의사를 비교한 S8~9와 맞는 것은?","choices":["The same odd request is more likely to be obeyed when made by a doctor than by a friend.","The same odd request is more likely to be obeyed when made by a friend than by a doctor."],"answer":0,"why":"S8은 친구라면 의심할 수 있지만 S9는 의사라면 주저 없이 따를 가능성이 높다고 한다.","refs":[8,9]}],"sentences":[{"n":1,"en":"In the children's game Simon Says, the leader of the game tells the others, \"Simon says 'jump up and down,'\" and all the players must jump up and down.","ko":"어린이 게임 ' 사이먼 가라사대 '('Simon says'로 시작하는 지시문에만 그에 맞는 행동을 해야 함)에서, 게임 리더가 다른 이들에게 \" 사이먼 가라사대 '깡충깡충 뛰어라.'\"라고 말하면, 모든 게임 참가자가 깡충깡충 뛰어야 한다."},{"n":2,"en":"\"Raise your arms,\" the leader says, dropping the key phrase \"Simon says,\" and some of the players will raise their arms even though they are not supposed to.","ko":"\"두 팔을 올려라.\"라고 리더가 핵심 어구인 \" 사이먼 가라사대 \"를 빼고 말하면, 게임 참가자 중 일부는 그러지 말아야 하는데도 자신의 팔을 올릴 것이다."},{"n":3,"en":"This type of living on automatic pilot happens to adults also.","ko":"자동 조종 장치 로 사는 이런 유형의 삶은 어른들에게도 일어난다."},{"n":4,"en":"In a psychological study, a professor sent a memo to forty university secretaries that instructed them to use interoffice mail to return the memo immediately to the sender.","ko":"한 심리학 연구 에서 한 교수가 40명의 대학 비서 에게 내부 메일을 사용하여 (받은) 메모를 즉시 발신자에게 반송하라고 지시하는 메모를 보냈다."},{"n":5,"en":"It is a nonsensical task if you take a moment to think about it.","ko":"그것은 여러분이 잠시 그것에 대해 생각해 본다면 터무니없는 과제 이다."},{"n":6,"en":"Despite the seemingly obvious absurdity of the request, 90 percent of the secretaries returned the memo.","ko":"그 요청의 겉보기에 명백한 불합리 에도 불구하고, 비서들의 90%가 그 메모를 반송했다."},{"n":7,"en":"Another reason people obey is that we are socialized to respect authority.","ko":"사람들이 복종 하는 또 다른 이유는 우리가 권위 를 존중하도록 사회화되었다는 것이다."},{"n":8,"en":"If your friend asked you to \"open your mouth and close your eyes,\" you might suspect him or her of wanting to play a trick on you.","ko":"만약 여러분의 친구가 여러분에게 '입을 벌리고 눈을 감으라'고 요청하면, 여러분은 친구가 여러분에게 장난 을 치고 싶어 한다고 의심할 것이다."},{"n":9,"en":"But chances are that if your doctor made the exact same request you would comply without hesitation, even though it sounds a little odd.","ko":"하지만 만약 여러분의 의사가 정확히 똑같은 요청을 하면 여러분은 그것이 조금 묘하게 들리더라도 주저 없이 따를 가능성이 크다."}]},{"id":"nje03-09","unit":"nje03","number":9,"title":"no.09","core":"동화 인물의 뚜렷한 양극화는 아이가 차이를 쉽게 이해하고 자기 정체성을 세우도록 돕는다.","flow":[{"label":"주제","sentences":"S1-2","text":"동화 인물은 현실의 우리와 달리 선하거나 악하며 중간이 없다","refs":[1,2]},{"label":"예시","sentences":"S3-6","text":"멍청함과 영리함, 부지런함과 게으름, 아름다움과 추함이 짝을 이룬다","refs":[3,4,5,6]},{"label":"까닭","sentences":"S7","text":"대조가 뚜렷해야 아이가 둘의 차이를 쉽게 이해할 수 있다","refs":[7]},{"label":"조건","sentences":"S8","text":"모호함은 확고한 성격이 자리 잡을 때까지 기다려야 한다","refs":[8]},{"label":"결론","sentences":"S9-10","text":"그때 아이는 사람들의 차이를 알고 어떤 사람이 될지 고를 바탕을 얻는다","refs":[9,10]}],"structure":[{"title":"원인 — 양극화된 인물","text":"선악이 뚜렷이 갈려 중간이 없는 단순한 대조로 제시된다"},{"title":"결과 — 정체성의 바탕","text":"차이를 쉽게 이해하고, 확고한 성격 위에서 어떤 사람이 될지 고를 수 있게 된다"}],"key_sentence_en":"Polarized fairy-tale characters help children form identity and choose who to become.","blocking_vocab":[{"word":"ambivalent","meaning":"양면적인"},{"word":"ambiguity","meaning":"모호함"},{"word":"polarization","meaning":"양극화"}],"checks":[{"type":"핵심","q":"동화 속 인물을 선악으로 뚜렷이 나누는 효과는?","choices":["현실 인물의 복잡성을 처음부터 모두 이해하도록 강요한다.","아이들이 차이를 이해하고 어떤 사람이 될지 선택하는 데 도움을 준다."],"answer":1,"why":"S7~10은 단순한 대비가 이해와 정체성 형성에 도움 된다고 한다.","refs":[7,8,9,10]},{"type":"근거","q":"동화 속 인물이 현실 인물과 다른 점은?","choices":["한 인물에게 좋은 면과 나쁜 면이 복잡하게 섞여 있다.","좋거나 나쁜 특성이 뚜렷하게 갈린다."],"answer":1,"why":"S1~2는 현실과 달리 동화 인물은 good 또는 bad로 제시된다고 한다.","refs":[1,2]},{"type":"변형 탐지","q":"S8~10과 일치하는 것은?","choices":["The fairy tale's clear contrasts help children form a basis for later choices.","Fairy tales require children to resolve every ambiguity before developing any personality."],"answer":0,"why":"S8은 모호함이 비교적 확고한 인격 형성 뒤로 미뤄져야 한다고 말한다.","refs":[8,9,10]}],"sentences":[{"n":1,"en":"The figures in fairy tales are not ambivalent ─ not good and bad at the same time, as we all are in reality.","ko":"동화 속 인물은 양면성 이 없는데, 현실에서의 우리 모두처럼 선하면서 동시에 악하지는 않다."},{"n":2,"en":"A figure in a fairy tale is either good or bad, nothing in between.","ko":"동화 속 인물은 선하거나 악하며 , 그 사이에는 아무것도 없다."},{"n":3,"en":"One brother is stupid, the other is clever.","ko":"한 형제는 멍청하고 다른 형제는 영리하다 ."},{"n":4,"en":"One sister is industrious, the others are lazy.","ko":"한 자매는 부지런하고 , 다른 자매들은 게으르다 ."},{"n":5,"en":"One is beautiful, the others are ugly.","ko":"한 사람은 아름답고 , 나머지 사람들은 못생겼다 ."},{"n":6,"en":"One parent is all good, the other is evil.","ko":"부모 중 한 사람은 완전히 선하고 , 나머지는 악하다 ."},{"n":7,"en":"Presenting the contrasting characters permits the child to comprehend easily the difference between the two, which he could not do as readily were the figures drawn more true to life, with all the complexities that characterize real people.","ko":"대조적인 등장인물 을 제시하는 것은 아이가 둘 사이의 차이 를 쉽게 이해하도록 하는데, 실제 사람들의 특징을 묘사하는 모든 복잡성으로 그 인물들이 더 현실에 가깝게 묘사된다면 아이는 그만큼 쉽게 둘 사이의 차이 를 이해할 수 없을 것이다."},{"n":8,"en":"Ambiguities must wait until a relatively firm personality has been established on the basis of positive identification.","ko":"긍정적인 동일시 를 바탕으로 비교적 확고한 성격이 자리 잡을 때까지 모호함 은 기다려야 한다."},{"n":9,"en":"Then the child has a basis for understanding that there are great differences between people, and that therefore one has to make choices about who one wants to be.","ko":"그러고 나면 아이는 사람들 사이에 커다란 차이 가 있고, 따라서 사람은 자신이 어떤 사람이 되고 싶은가에 대한 선택을 해야만 한다는 것을 이해할 기반을 갖게 된다."},{"n":10,"en":"This basic decision is facilitated by the polarizations of the fairy tale.","ko":"이 기본적인 결정은 동화의 양극화 에 의해 용이해진다."}]},{"id":"nje03-10","unit":"nje03","number":10,"title":"no.10","core":"음악은 특정 의미에 묶이지 않아 말보다 훨씬 넓은 뜻을 한꺼번에 담아낸다.","flow":[{"label":"도입","sentences":"S1-3","text":"작곡가는 점과 선을 적고 연주자가 그것을 소리로 바꾸니 신비롭다","refs":[1,2,3]},{"label":"비교","sentences":"S4-5","text":"글자도 점과 선일 뿐이니 음악도 하나의 언어겠지만 더 마법 같다","refs":[4,5]},{"label":"근거","sentences":"S6","text":"소리의 범위가 훨씬 넓고 특정 의미에 묶이지 않아 더 많이 표현한다","refs":[6]},{"label":"예시","sentences":"S7-8","text":"「소시지」를 뜻하는 음은 없지만 한 악구가 여러 감정을 동시에 낸다","refs":[7,8]},{"label":"결론","sentences":"S9","text":"말로 그만큼 많은 뜻을 담으려 하면 말이 바닥나고 만다","refs":[9]}],"structure":[{"title":"말 — 뜻이 정해진 기호","text":"낱말마다 뜻이 묶여 있어 여러 뜻을 한꺼번에 담기 어렵다"},{"title":"음악 — 열린 소리","text":"특정 의미에 묶이지 않아 행복·슬픔·사려·열의를 동시에 낼 수 있다"}],"key_sentence_en":"Music can express more simultaneous meanings than ordinary spoken language.","blocking_vocab":[{"word":"be tied to","meaning":"~에 묶이다"},{"word":"phrase","meaning":"악구·구절"},{"word":"exhausted","meaning":"한계에 이른"}],"checks":[{"type":"핵심","q":"음악이 말보다 많은 뜻을 담을 수 있다는 이유는?","choices":["모든 음악 소리에 사전적 뜻이 하나씩 정해져 있어서","소리가 특정 의미에 묶여 있지 않고 표현 범위가 넓어서"],"answer":1,"why":"S6~9는 소리가 특정 의미에 묶이지 않아 여러

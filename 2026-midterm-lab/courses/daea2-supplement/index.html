</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">DAEA HIGH SCHOOL · GRADE 2</p><h1>대아고2 부교재</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: N제 2~5강 p6~42 / 미닛15 13~15회(7·8번 제외)<br>현재 원문·해석·흐름 62지문을 연결했습니다. 확인 문제는 검수하며 추가합니다.</div><div class="units" id="units"></div><p class="subnote">각 지문에서 영어 원문을 읽고 해석·논리 흐름·영어 핵심을 클릭해 확인할 수 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":"대아고2 부교재","units":[{"id":"nje02","label":"N제 2강","scope":"N제 p6~42 시험 범위","passages":[{"id":"nje02-01","title":"no.01","core":"큰 다짐은 며칠 못 가니 작게 시작해야 하며 작은 습관이 장기적인 성공을 만든다."},{"id":"nje02-02","title":"no.02","core":"또래와 어울려 자라고 있기만 하면 가상의 친구는 유익하므로 부모는 존중하고 안심해야 한다."},{"id":"nje02-03","title":"no.03","core":"정부가 구해 줄 것을 알면 기업은 개선 대신 위험을 택하니 이것이 도덕적 해이다."},{"id":"nje02-04","title":"no.04","core":"공공 기계식 시계가 모두 아는 시간 개념을 주어 시장 시간을 정하고 거래를 규칙적으로 만들었다."},{"id":"nje02-05","title":"no.05","core":"자신을 과대평가하는 것만큼 과소평가하는 것도 해로우니 정확하고 정직하게 판단하는 힘을 길러야 한다."},{"id":"nje02-06","title":"no.06","core":"관리자는 사람됨이 아니라 행동을 짚어야 하는데, 사람은 자기 자신보다 행동을 바꾸기가 훨씬 쉽다."},{"id":"nje02-07","title":"no.07","core":"지도자와 개발자는 편견 없는 인공지능을 만들어야 하고, 사람이 다듬어 줄 때 그 포용이 넓어진다."},{"id":"nje02-08","title":"no.08","core":"흘려보내는 시간도 이미 쓰인 시간이므로 그 시간을 좋은 생각을 하는 연습에 써야 한다."},{"id":"nje02-09","title":"no.09","core":"이사는 아이에게 상처가 되므로 까닭을 설명하고 연결을 지키며 참여시키고 안심시켜야 한다."},{"id":"nje02-10","title":"no.10","core":"기운을 빼는 동료와는 줄이고 힘을 주는 동료와는 늘려 회복을 주는 직장 관계를 가꿔야 한다."},{"id":"nje02-11","title":"no.11","core":"음악은 같은 문화를 나눈 사람들에게만 공통 언어이므로 국제 언어는 춤과 나머지 예술이다."},{"id":"nje02-12","title":"no.12","core":"익명일 때 사람은 평소 안 할 일을 하므로 인터넷 댓글은 실명으로 써야 한다."},{"id":"nje02-13","title":"no.13","core":"남이 그렇게 믿게 된 인생 이야기를 들으면 신념은 그대로여도 상대 입장을 훨씬 더 존중하게 된다."},{"id":"nje02-14","title":"no.14","core":"부정적 신체 이미지는 초등학교 시절에 자리 잡으므로 교육도 그때 시작해야 한다."}]},{"id":"nje03","label":"N제 3강","scope":"N제 p6~42 시험 범위","passages":[{"id":"nje03-01","title":"no.01","core":"재난 대비는 하나의 재난을 그대로 예행하는 것이 아니라 적응할 수 있는 지구력을 기르는 일이다."},{"id":"nje03-02","title":"no.02","core":"앞차와의 여유 공간처럼 완충 지대는 반응할 시간을 만들어 일과 삶의 마찰을 줄여 준다."},{"id":"nje03-03","title":"no.03","core":"사회적 삶은 연극과 같아서 연기력이 뛰어난 사람일수록 복잡한 환경을 더 잘 헤쳐 나간다."},{"id":"nje03-04","title":"no.04","core":"한때 쓸모 있던 해결책도 필요를 잃은 뒤까지 굳어지면 변화를 막는 보이지 않는 규칙이 된다."},{"id":"nje03-05","title":"no.05","core":"다양성이 숲을 붕괴에서 지켜 주기에 균류는 한 종의 독점을 막고 여러 종을 함께 살린다."},{"id":"nje03-06","title":"no.06","core":"과학 이론은 증명되는 것이 아니라 반증될 수 있어야 하며 관찰에 종속되어야 한다."},{"id":"nje03-07","title":"no.07","core":"좁은 초점이 창의성을 가두므로 다른 분야로 눈을 돌리면 그 자물쇠가 풀린다."},{"id":"nje03-08","title":"no.08","core":"사람은 핵심 조건을 놓친 채 자동으로 반응하고, 권위가 요청하면 더 쉽게 따른다."},{"id":"nje03-09","title":"no.09","core":"동화 인물의 뚜렷한 양극화는 아이가 차이를 쉽게 이해하고 자기 정체성을 세우도록 돕는다."},{"id":"nje03-10","title":"no.10","core":"음악은 특정 의미에 묶이지 않아 말보다 훨씬 넓은 뜻을 한꺼번에 담아낸다."},{"id":"nje03-11","title":"no.11","core":"학생들은 좋은 학점일수록 정확히 기억하고 나쁜 학점일수록 많이 잊었다."}]},{"id":"nje04","label":"N제 4강","scope":"N제 p6~42 시험 범위","passages":[{"id":"nje04-01","title":"p30 대표 기출 1","core":"창조력은 상상력을 실제 행동과 성과로 옮기는 것이다."},{"id":"nje04-02","title":"p31 대표 기출 2","core":"뉴스의 역피라미드 구조는 독자가 얻는 핵심 정보를 극대화한다."},{"id":"nje04-03","title":"p32 no.035","core":"기업에서 말하는 공감은 관점 이해·배려·시장 조사·다양한 사용자 고려 등 여러 의미로 쓰인다."},{"id":"nje04-04","title":"p32 no.036","core":"요리의 기업 위탁은 가사 부담을 줄이고 시간과 음식 선택의 폭을 늘리는 이점도 가져왔다."},{"id":"nje04-05","title":"p33 no.037","core":"마감일을 가까운 시간 틀의 도전으로 생각하면 제때 행동하기 쉽다."},{"id":"nje04-06","title":"p33 no.038","core":"돌봄 로봇을 진짜 친구처럼 보이게 하는 속임수에는 윤리적 문제가 있다는 비판이 있다."},{"id":"nje04-07","title":"p34 no.039","core":"일탈에 대한 공동 대응은 사회 집단의 결속과 규범에 대한 헌신을 강화할 수 있다."},{"id":"nje04-08","title":"p34 no.040","core":"안전하다는 이성적 판단만으로 두려움에 대한 신체 반응을 억제하기는 어렵다."},{"id":"nje04-09","title":"p35 no.041","core":"정보 통신 기술은 신체적 이동을 대신하는 가상 이동성을 제공한다."},{"id":"nje04-10","title":"p35 no.042","core":"글쓰기·연필·컴퓨터의 용도는 처음 의도한 목적에서 달라졌다."},{"id":"nje04-11","title":"p36 no.043","core":"건강 정보와 지원이 늘면서 사람들은 건강 관리에서 더 적극적인 역할을 맡고 있다."},{"id":"nje04-12","title":"p36 no.044","core":"아이들의 스트레스에는 개인적 경험뿐 아니라 부모의 불안과 뉴스 등 주변 요인도 영향을 준다."},{"id":"nje04-13","title":"p37 no.045","core":"온라인 공동체는 시공간과 대면 만남의 어려움을 넘어 사회적 교류 기회를 넓힌다."},{"id":"nje04-14","title":"p37 no.046","core":"기술은 식량 확보·접근·조리 방식을 바꾸어 인간의 음식 선택을 넓혀 왔다."}]},{"id":"nje05","label":"N제 5강","scope":"N제 p6~42 시험 범위","passages":[{"id":"nje05-01","title":"p40 대표 기출 1","core":"인간은 불과 자연의 흐름, 생물 자원, 화석 연료의 외부 에너지를 활용하며 인공적인 복잡성을 확대했다."},{"id":"nje05-02","title":"p41 no.047","core":"성공한 개인의 공로뿐 아니라 성공을 가능하게 하는 공동체의 토대와 협력을 인정해야 한다."},{"id":"nje05-03","title":"p41 no.048","core":"Skinner의 실험에서 행동 뒤의 먹이 보상은 쥐가 이후에 막대를 누르는 행동에 영향을 주었다."},{"id":"nje05-04","title":"p42 no.049","core":"글쓴이는 판매 유효 기한에 따른 폐기의 탄소 부담과 기한 산정 방식을 설명하고 상품 유형에 따른 구매 판단을 제시한다."},{"id":"nje05-05","title":"p42 no.050","core":"이 글은 렉틴의 결합 특성을 설명하고 Gundry와 Saladino가 제시한 건강 영향의 주장과 가설을 소개한다."}]},{"id":"minute13","label":"미닛15 13회","scope":"1~6번 · 7·8번 제외","passages":[{"id":"minute13-01","title":"13회 01번","core":"경고성 발언은 자기 힘의 과시가 아니라 상사와의 권력 다툼에 돌입하는 것이고 결국 문제 직원으로 낙인찍히므로, 상사에게 경고성 발언을 해서는 안 된다."},{"id":"minute13-02","title":"13회 02번","core":"행복은 사람에게서 사람으로 전염되므로, 가장 행복한 사람들을 관찰해 그들의 태도·습관에서 얻은 교훈을 자신의 삶에 적용하라."},{"id":"minute13-03","title":"13회 03번","core":"발전의 뿌리는 과학·기술 지식이지만 궁극적으로 과학과 번영에 동력을 제공하는 것은 인구수의 증가이며, 더 많은 인간의 지성이 곧 더 많은 발전이다."},{"id":"minute13-04","title":"13회 04번","core":"말소리의 미묘한 차이는 먼 거리에서 대부분 사라져 의미도 정체성도 전하지 못하지만, 단순하고 집중된 음조는 그 거리를 넘어 확실하게 전달된다."},{"id":"minute13-05","title":"13회 05번","core":"약점을 자랑으로 포장하는 면접 전략은 면접관에게 간파되어 자만하고 정직하지 못하다는 인상만 남기므로, 자신의 장점과 약점에 진솔한 것이 낫다."},{"id":"minute13-06","title":"13회 06번","core":"환자들은 약사에게 묻는 것이 더 편안하고 서비스 비용을 직접 지불해 물을 권한이 있다고 느끼기 때문에, 의사보다 약사에게 더 많이 질문한다."}]},{"id":"minute14","label":"미닛15 14회","scope":"1~6번 · 7·8번 제외","passages":[{"id":"minute14-01","title":"14회 01번","core":"집안일은 방마다 하기보다 같은 종류의 작업을 집 전체에서 연속해서 처리하면 효율적이다."},{"id":"minute14-02","title":"14회 02번","core":"새로움에 대한 호기심과 달리 권태는 모든 문화에서 보편적으로 경험되는 상태가 아니다."},{"id":"minute14-03","title":"14회 03번","core":"아름다움에 대한 투자는 직접적 실용성을 넘어 공동체의 결속과 협력을 돕는 생존 역할을 한다."},{"id":"minute14-04","title":"14회 04번","core":"직접 경험은 중요한 통찰을 주지만 지식과 이해의 유일한 원천으로 볼 수는 없다."},{"id":"minute14-05","title":"14회 05번","core":"확대된 정의는 사전의 기본 뜻을 넘어 역사와 문화 등 여러 방법으로 개념을 분석한다."},{"id":"minute14-06","title":"14회 06번","core":"상시 접속의 부담을 줄이기 위해 정기적인 기술 휴식과 건강한 사용 한계가 필요하다."}]},{"id":"minute15","label":"미닛15 15회","scope":"1~6번 · 7·8번 제외","passages":[{"id":"minute15-01","title":"15회 01번","core":"전달자에 대한 감정과 편견 때문에 유용한 메시지까지 무시해서는 안 된다."},{"id":"minute15-02","title":"15회 02번","core":"과거로 돌아갈 수 있어도 사람들은 더 많은 선택지가 있는 미래를 향해 움직여 왔다."},{"id":"minute15-03","title":"15회 03번","core":"프로필과 보상에 기반한 인터넷 구조는 의사소통을 멋진 자아를 연출하는 수단으로 만든다."},{"id":"minute15-04","title":"15회 04번","core":"청소년의 다양한 발달을 반영하는 중학교 재설계가 지속적으로 필요하다."},{"id":"minute15-05","title":"15회 05번","core":"미국 남부의 이주 노동자는 열악한 처우를 받았고 고용주는 그들의 노동으로 부를 축적했다."},{"id":"minute15-06","title":"15회 06번","core":"자동 번역이 보급되는 동안 영어의 지위도 굳어져 장차 두 수단의 경쟁이 예상된다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('units').innerHTML=data.units.map((u,i)=>`<details class="unit" ${i===0?'open':''}><summary><div><h2>${esc(u.label)}</h2><span class="scope">${esc(u.scope)}</span></div><span class="count">${u.passages.length}지문</span></summary><div class="passages">${u.passages.map((p,j)=>`${u.passages.length>6&&j%5===0?`<h3 class="chunk-label">${j+1}–${Math.min(j+5,u.passages.length)}번</h3>`:''}<a class="passage" href="study.html#${esc(p.id)}"><b>${esc(p.title)}</b><span>${esc(p.core)}</span></a>`).join('')}</div></details>`).join('');
</script></body></html>

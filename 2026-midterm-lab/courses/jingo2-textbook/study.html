.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items,.diagram.diagram-argument .diagram-items,

.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card,.diagram.diagram-argument .diagram-card,
.diagram.diagram-steps-possible .diagram-card,.diagram.diagram-case-advice .diagram-card,
.diagram.diagram-steps-response .diagram-card,.diagram.diagram-cause-response .diagram-card,

.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-possible .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-case-advice .diagram-items .diagram-card:not(:last-child):after,

/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{

.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}

.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));

  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}

/* Cooking: familiar side benefits are distinct from the source's energy-to-adaptation claim. */

.diagram.diagram-energy-route .diagram-card{position:relative;min-width:0;border-top:5px solid #237c5c;padding-top:35px;background:#fffdf8}

.diagram.diagram-energy-route .diagram-card:first-child:before{content:'먼저 떠오르는 장점';display:block;color:#65766b;font-size:11px;font-weight:800;margin-bottom:3px}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}
.diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'→';position:absolute;right:-19px;top:calc(50% - 16px);color:#176b52;font-size:26px;font-weight:900;z-index:1}
.diagram.diagram-energy-route .diagram-card:nth-child(2){background:#e5f4e9}.diagram.diagram-energy-route .diagram-card:nth-child(4){background:#fff2d9;border-top-color:#b78539}
/* Three alternative survival responses, not three consecutive steps. */
.diagram.diagram-reaction-options .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 10px}
.diagram.diagram-reaction-options .diagram-card:first-child{grid-column:1/-1;text-align:center;background:#dceee5;border:2px solid #82baa2;position:relative}
.diagram.diagram-reaction-options .diagram-card:first-child:after{content:'↙    ↓    ↘';position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:#176b52;font-weight:900;font-size:21px;white-space:pre}
.diagram.diagram-reaction-options .diagram-card:not(:first-child){text-align:center;border-top:5px solid #247b5b}
.diagram.diagram-reaction-options .diagram-card:not(:first-child) b{font-size:20px}
.diagram.diagram-reaction-options .diagram-card:not(:first-child):before{display:block;font-size:27px;line-height:1;margin-bottom:8px;color:#176b52}
.diagram.diagram-reaction-options .diagram-card:nth-child(2):before{content:'⏸'}.diagram.diagram-reaction-options .diagram-card:nth-child(3):before{content:'➜'}.diagram.diagram-reaction-options .diagram-card:nth-child(4):before{content:'↗'}

.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}

  margin-top:14px;padding:10px 12px;text-align:center;color:#14543f}
/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}

  color:#176b52;font-size:24px;line-height:1}

  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}

.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}

.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}

.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}

.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Three roles are simultaneous parts of one contrast, not a causal sequence. */
.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

<script id="course-data" type="application/json">{"course":{"id":"jingo2-textbook","title":"진주고2 영어II 교과서","grade":"고2"},"units":[{"id":"l1-body","label":"1과 · Connecting Through Pop Culture","scope":"본문 17–23쪽 · 7부분","passages":[{"id":"l1-hiphop-01","title":"17쪽 · 폭력에서 평화 협정으로","lead":"도시의 문제와 그 문제를 바꾼 행동을 구분해 보세요.","core":"경제 불황과 갱단 폭력이 심한 브롱스에서 Ghetto Brothers의 평화 협정이 새로운 평화 문화의 출발점이 된다.","diagram":{"kind":"steps","title":"브롱스의 변화","items":[{"head":"경제 불황","body":"문 닫은 기업·버려진 건물·이주할 수 없는 주민","refs":[1,2,3,4,5]},{"head":"갱단 폭력","body":"실업과 갱단의 등장, 젊은이들 사이의 일상적 폭력","refs":[6,7]},{"head":"평화 제안","body":"Ghetto Brothers가 싸움을 멈추고 평화 협정을 제안","refs":[8,9,10,11,12,13]},{"head":"협정과 새 문화","body":"갱단 대표들이 서명하고, 평화 문화 속에서 힙합이 탄생","refs":[14,15,16]}],"takeaway":"핵심 전환: 폭력을 해결하는 방식이 싸움에서 평화 협정으로 바뀐다."},"blocking_vocab":[{"word":"recession","meaning":"경기 침체"},{"word":"afford","meaning":"~할 여유가 있다"},{"word":"treaty","meaning":"협정"},{"word":"dispute","meaning":"분쟁"}],"sentences":[{"n":1,"en":"<The Story of Hip-Hop Music> Imagine an urban area that is fast becoming a slum after an economic recession.","ko":"<힙합 음악 이야기> 경기 침체 후 빠르게 슬럼가로 변해가는 어느 도시 지역을 상상해 보라.","grammar":[]},{"n":2,"en":"Businesses close their doors and building owners have left.","ko":"기업들은 문을 닫고 건물 주인들은 떠나 버렸다.","grammar":[]},{"n":3,"en":"The area is full of abandoned buildings.","ko":"이 지역은 버려진 건물들로 가득 차 있다.","grammar":[]},{"n":4,"en":"There is no heating even in winter.","ko":"겨울에도 난방이 되지 않는다.","grammar":[]},{"n":5,"en":"Only those who can't afford to move out remain.","ko":"이사 갈 여력이 없는 사람들만 남는다.","grammar":[]},{"n":6,"en":"Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing.","ko":"실업률은 높고, 갱단이 많이 생겨나고, 젊은이들 사이의 갱단 폭력은 일상이 된다.","grammar":[]},{"n":7,"en":"Despair is on every street corner.","ko":"거리 구석구석마다 절망이 있다.","grammar":[]},{"n":8,"en":"One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to unite and create a better community.","ko":"그러나 어느 날, 무료 급식과 의료 프로그램으로 존경받는 Ghetto Brothers라는 한 갱단이 싸움을 멈추고 대신 젊은이들이 단결하여 더 나은 공동체를 만들자고 설득하기로 결정한다.","grammar":[{"label":"stop -ing / persuade A to V","explanation":"stop fighting은 하던 싸움을 멈추는 것, persuade young people to unite는 젊은이들이 단결하도록 설득하는 것이다."}]},{"n":9,"en":"They suggest a peace treaty.","ko":"그들은 평화 협정을 제안한다.","grammar":[]},{"n":10,"en":"\"This is for peace, men.","ko":"\"이건 평화를 위한 겁니다, 여러분.","grammar":[]},{"n":11,"en":"The violence took away our brothers.","ko":"폭력이 우리 형제들을 앗아갔죠.","grammar":[]},{"n":12,"en":"We're not gangsters anymore.","ko":"더 이상 우린 갱단의 일원이 아닙니다.","grammar":[]},{"n":13,"en":"We've got to make this town a better place to live.\"","ko":"우린 이 마을을 더 살기 좋은 곳으로 만들어야 해요.\"","grammar":[]},{"n":14,"en":"Thanks to these new voices, gang leaders from all over the area sign the treaty.","ko":"이 새로운 목소리에 힘입어 지역 전역의 갱단 대표들이 협정에 서명한다.","grammar":[]},{"n":15,"en":"Never again will they use violence to solve their disputes.","ko":"그들은 결코 다시는 분쟁 해결에 폭력을 사용하지 않을 것이다.","grammar":[{"label":"부정어 도치","explanation":"Never again이 문장 맨 앞에 와서 will they use처럼 조동사와 주어의 순서가 바뀐다. 폭력을 다시 사용하지 않겠다는 다짐이다."}]},{"n":16,"en":"This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants.","ko":"이것이 1970년대 초 뉴욕의 브롱스인데, 이곳에서 힙합 음악은 아프리카계 미국인들과 이민자들이 창조한 새로운 평화 문화의 한 주축으로서 탄생하였다.","grammar":[]},{"n":17,"en":"The story of hip-hop, now one of the world's most dominant music genres, is a fascinating one.","ko":"현재 세계에서 가장 지배적인 음악 장르의 하나인 힙합의 이야기는 매혹적이다.","grammar":[]},{"n":18,"en":"Let's explore it.","ko":"그 이야기를 탐구해 보자.","grammar":[]}],"structure":[],"flow":[{"label":"배경","text":"불황 이후 브롱스는 버려진 건물, 난방 부족, 실업과 갱단 폭력으로 황폐하다.","refs":[1,2,3,4,5,6,7],"sentences":"S1 · S2 · S3 · S4 · S5 · S6 · S7"},{"label":"전환","text":"Ghetto Brothers는 싸움을 멈추고 젊은이들을 설득해 평화 협정을 제안한다.","refs":[8,9],"sentences":"S8 · S9"},{"label":"합의","text":"폭력으로 형제를 잃었다는 호소 뒤 여러 갱단 대표가 협정에 서명한다.","refs":[10,11,12,13,14,15],"sentences":"S10 · S11 · S12 · S13 · S14 · S15"},{"label":"도착","text":"1970년대 초 브롱스에서 평화 문화의 일부로 힙합 음악이 탄생한다.","refs":[16,17,18],"sentences":"S16 · S17 · S18"}],"checks":[{"type":"핵심","q":"이 글에서 변화의 결정적 계기는?","choices":["Ghetto Brothers가 평화 협정을 제안한 일","갱단이 각자 다른 지역으로 이주한 일","건물주들이 빈 건물에서 공연을 연 일"],"answer":0,"why":"Ghetto Brothers가 평화 협정을 제안한 일","refs":[8,9,14]},{"type":"근거","q":"협정 뒤 갱단 대표들이 약속한 것은?","choices":["폭력은 줄이되 분쟁 해결 수단으로 남기겠다","분쟁 해결에 다시는 폭력을 쓰지 않겠다","서로 만나지 않고 따로 파티를 열겠다"],"answer":1,"why":"분쟁 해결에 다시는 폭력을 쓰지 않겠다","refs":[14,15]},{"type":"변형 탐지","q":"원문과 일치하는 문장은?","choices":["They suggest a peace treaty.","They reject a peace treaty."],"answer":0,"why":"They suggest a peace treaty.","refs":[9]}],"key_sentence_en":"This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants.","key_sentence_ko":"이것이 1970년대 초 뉴욕의 브롱스인데, 이곳에서 힙합 음악은 아프리카계 미국인들과 이민자들이 창조한 새로운 평화 문화의 한 주축으로서 탄생하였다."},{"id":"l1-hiphop-02","title":"18쪽 · 블록 파티와 DJ의 기술","lead":"파티에서 무엇이 생겼고 DJ의 기술이 무엇을 바꿨는지 따라가 보세요.","core":"평화 협정 뒤 블록 파티가 열렸고, Kool Herc가 두 턴테이블로 브레이크 구간을 늘려 힙합 음악과 춤에 영향을 주었다.","diagram":{"kind":"steps","title":"두 턴테이블의 효과","items":[{"head":"블록 파티","body":"평화 협정 뒤 갱단들이 함께 파티에 참여","refs":[1,2]},{"head":"같은 음반 두 장","body":"Kool Herc가 두 턴테이블에서 번갈아 재생","refs":[6,7,8]},{"head":"브레이크 연장","body":"드럼 구간이 길어져 음반 교체 때 춤을 멈출 필요가 없어짐","refs":[8,9]},{"head":"영향","body":"그 DJ 방식이 힙합 음악과 브레이크댄스의 성장에 영향","refs":[10]}],"takeaway":"기술의 목적: 음악의 드럼 구간을 이어 춤출 시간을 늘리는 것."},"blocking_vocab":[{"word":"block party","meaning":"동네 파티"},{"word":"turntable","meaning":"턴테이블"},{"word":"break","meaning":"드럼 연주 구간"},{"word":"extend","meaning":"늘리다"}],"sentences":[{"n":1,"en":"<DJing, Breakdancing, and MCing> After the peace treaty, the gangs that had fought one another started partying together.","ko":"<디제잉, 브레이크댄스, 엠씨잉> 평화 협정 후, 서로 싸웠었던 갱들이 함께 파티를 벌이기 시작했다.","grammar":[]},{"n":2,"en":"Abandoned buildings and parking lots were used for events called block parties.","ko":"버려진 건물과 주차장들이 블록 파티라는 행사에 사용되었다.","grammar":[]},{"n":3,"en":"What eventually emerged from these parties?","ko":"이 파티들에서 결국 무엇이 출현했는가?","grammar":[]},{"n":4,"en":"A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti.","ko":"디제잉, 브레이크댄스, 엠씨잉, 그래피티를 기반으로 한, 힙합 문화라고 불리는 활기찬 청년 운동이다.","grammar":[]},{"n":5,"en":"It replaced gang violence with music, dance, art, and style.","ko":"이 운동은 갱단 폭력을 음악, 춤, 예술, 스타일로 대체했다.","grammar":[]},{"n":6,"en":"The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop.","ko":"가장 인기있는 블록 파티는 디제이 Kool Herc가 주최한 파티였고, 그는 힙합의 창시자로 간주된다.","grammar":[]},{"n":7,"en":"Herc's party for his sister's birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique.","ko":"1973년 8월 Herc의 여동생 생일 파티는 Herc가 사용한 새로운 디제이 테크닉 때문에 지금은 힙합 음악의 발생지로 알려져 있다.","grammar":[]},{"n":8,"en":"At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break.","ko":"Herc는 이 파티에서 두 개의 턴테이블을 동시에 사용하여 동일한 레코드판 두 개를 재생한 다음, 브레이크라는 드럼 연주 구간을 연장시키기 위해 두 레코드판을 번갈아 다루었다.","grammar":[{"label":"분사구문과 병렬","explanation":"using two turntables는 Herc가 두 턴테이블을 사용한 방식이다. played ... and then switched는 Herc의 두 행동을 잇는다."}]},{"n":9,"en":"No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc.","ko":"사람들은 더 이상 레코드판이 다 돌아간 후 디제이가 LP 디스크를 교체하는 동안 춤을 멈출 필요가 없어졌다.","grammar":[{"label":"No longer 도치","explanation":"No longer가 앞에 와 did people have to ... 순서가 된다. 이제 더 이상 춤을 멈출 필요가 없었다는 뜻이다."}]},{"n":10,"en":"Kool Herc's style of DJing quickly became influential in the rise of hip-hop music and breakdancing.","ko":"Kool Herc의 디제잉 스타일은 힙합 음악과 브레이크 댄스의 부상에 빠르게 영향을 미쳤다.","grammar":[]}],"structure":[],"flow":[{"label":"출발","text":"평화 협정 후 서로 싸우던 갱단이 함께 블록 파티를 연다.","refs":[1,2],"sentences":"S1 · S2"},{"label":"문화 등장","text":"파티에서 DJing·breakdancing·MCing·graffiti를 바탕으로 한 힙합 문화가 등장한다.","refs":[3,4,5],"sentences":"S3 · S4 · S5"},{"label":"기술","text":"Kool Herc가 동일 음반 두 장과 두 턴테이블로 브레이크 구간을 연장한다.","refs":[6,7,8],"sentences":"S6 · S7 · S8"},{"label":"결과","text":"춤을 멈출 필요가 줄고 그의 DJ 방식이 음악과 춤의 성장에 영향을 준다.","refs":[9,10],"sentences":"S9 · S10"}],"checks":[{"type":"핵심","q":"Kool Herc의 새 DJ 기술은 무엇인가?","choices":["음반을 교체할 때마다 춤을 멈추게 했다","같은 음반 두 장을 번갈아 재생해 브레이크 구간을 연장했다","서로 다른 음반 두 장을 한 번씩 재생해 브레이크를 줄였다"],"answer":1,"why":"같은 음반 두 장을 번갈아 재생해 브레이크 구간을 연장했다","refs":[7,8]},{"type":"근거","q":"그 기술 뒤 춤추는 사람들에게 생긴 변화는?","choices":["파티에서 춤이 금지되었다","브레이크 구간이 짧아졌다","음반 교체 때 춤을 멈출 필요가 없어졌다"],"answer":2,"why":"음반 교체 때 춤을 멈출 필요가 없어졌다","refs":[8,9]},{"type":"변형 탐지","q":"원문과 일치하는 문장은?","choices":["People still had to stop dancing at the end of the record while the DJ changed the LP disc.","No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc."],"answer":1,"why":"No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc.","refs":[9]}],"key_sentence_en":"At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break.","key_sentence_ko":"Herc는 이 파티에서 두 개의 턴테이블을 동시에 사용하여 동일한 레코드판 두 개를 재생한 다음, 브레이크라는 드럼 연주 구간을 연장시키기 위해 두 레코드판을 번갈아 다루었다."},{"id":"l1-hiphop-03","title":"19쪽 · 춤과 MC의 역할","lead":"같은 파티에서 갈라져 나온 춤과 말의 역할을 나눠 보세요.","core":"브레이크 구간은 B-Boys·B-Girls의 춤으로, DJ의 리듬감 있는 외침은 별도 역할인 MCing으로 발전했다.","diagram":{"kind":"compare","title":"한 파티에서 나온 두 표현","items":[{"head":"춤 · B-Boys / B-Girls","body":"브레이크 구간에 춤을 추고 거리의 댄스 배틀 문화를 만든다.","refs":[1,2,3,4]},{"head":"말 · MCing","body":"DJ의 리듬감 있는 외침을 친구가 맡으며 청중에게 말하는 별도 역할이 된다.","refs":[5,6,7,8,9]}],"takeaway":"두 갈래는 순서가 아니라 파티에서 함께 발달한 서로 다른 표현이다."},"blocking_vocab":[{"word":"anticipated","meaning":"기대되는"},{"word":"show off","meaning":"뽐내다"},{"word":"instrumental","meaning":"악기로 연주된"},{"word":"address","meaning":"~에게 말하다"}],"sentences":[{"n":1,"en":"The break section became the most anticipated part of a song.","ko":"브레이크 구간은 노래에서 가장 기대되는 부분이 되었다.","grammar":[]},{"n":2,"en":"People would form dancer circles and use the break to show off their individual dancing skills.","ko":"사람들은 춤꾼들의 원을 만들어 브레이크 구간 동안 각자의 춤 실력을 뽐내곤 했다.","grammar":[]},{"n":3,"en":"Kool Herc named the people dancing to his music B-Boys and B-Girls, short for Break-Boys and Break-Girls.","ko":"Kool Herc는 자신의 음악에 맞추어 춤추는 사람들을 브레이크 보이와 브레이크 걸의 줄임말로 비보이와 비걸이라고 불렀다.","grammar":[{"label":"name A B","explanation":"Kool Herc named the people ... B-Boys and B-Girls에서 사람들을 B-Boys·B-Girls라고 불렀다."}]},{"n":4,"en":"These people began to dance in groups in the streets and build a street dance battle culture.","ko":"이들은 거리에서 무리 지어 춤을 추면서 거리의 댄스 경연 문화를 구축하기 시작했다.","grammar":[]},{"n":5,"en":"DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd.","ko":"Kool Herc와 같은 디제이들은 관중의 흥을 돋우기 위해 노래의 악기 연주 구간 동안 박자와 라임을 넣은 말을 했다.","grammar":[]},{"n":6,"en":"They would shout phrases like \"To the beat\" and \"You don't stop!\"","ko":"그들은 \"리듬에 맞춰\"와 \"멈추지마!\"와 같은 문구들을 소리치곤 했다.","grammar":[]},{"n":7,"en":"This was the beginning of rapping or MCing.","ko":"이것이 랩, 즉 엠씨잉의 시작이었다.","grammar":[]},{"n":8,"en":"When DJs couldn't do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties.","ko":"디제이들은 자신이 디제잉과 리듬감 있는 외침을 동시에 할 수가 없을 때, 친구에게 파티에서 청중에게 말하는 역할 즉 사회자 곧 엠씨의 역할을 부탁했다.","grammar":[{"label":"ask A to V","explanation":"asked a friend to take the role은 친구에게 그 역할을 맡아 달라고 부탁했다는 뜻이다."}]},{"n":9,"en":"This separate role became MCing.","ko":"이 별도의 역할이 엠씨잉이 된 것이다.","grammar":[]}],"structure":[],"flow":[{"label":"춤의 출발","text":"브레이크 구간이 인기 있게 되고 사람들은 그 구간에 각자의 춤을 보여 준다.","refs":[1,2],"sentences":"S1 · S2"},{"label":"춤의 성장","text":"Kool Herc가 B-Boys·B-Girls라는 이름을 붙이고 거리 댄스 배틀 문화가 형성된다.","refs":[3,4],"sentences":"S3 · S4"},{"label":"말의 출발","text":"DJ가 연주 구간에 리듬과 운율에 맞춰 외치는 말이 랩·MCing의 시작이다.","refs":[5,6,7],"sentences":"S5 · S6 · S7"},{"label":"역할 분리","text":"DJ가 두 일을 동시에 하기 어려워 청중에게 말하는 친구의 역할이 MCing으로 독립한다.","refs":[8,9],"sentences":"S8 · S9"}],"checks":[{"type":"핵심","q":"브레이크 구간에서 발전한 것은?","choices":["DJ의 외침만 남고 춤 문화는 사라졌다","춤 문화와 DJ의 외침에서 나온 MCing","춤 문화만 발전하고 DJ의 외침은 사라졌다"],"answer":1,"why":"춤 문화와 DJ의 외침에서 나온 MCing","refs":[1,2,5,7,9]},{"type":"근거","q":"MC가 별도 역할이 된 이유는?","choices":["춤꾼들이 DJ의 음악 대신 무반주 춤만 원해서","DJ가 관객에게 직접 말하는 것을 법으로 금지해서","DJ가 디제잉과 리듬감 있는 외침을 동시에 하기 어려워서"],"answer":2,"why":"DJ가 디제잉과 리듬감 있는 외침을 동시에 하기 어려워서","refs":[8,9]},{"type":"변형 탐지","q":"원문과 일치하는 문장은?","choices":["This separate role became MCing.","This separate role became breakdancing."],"answer":0,"why":"This separate role became MCing.","refs":[9]}],"key_sentence_en":"When DJs couldn't do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties.","key_sentence_ko":"디제이들은 자신이 디제잉과 리듬감 있는 외침을 동시에 할 수가 없을 때, 친구에게 파티에서 청중에게 말하는 역할 즉 사회자 곧 엠씨의 역할을 부탁했다."},{"id":"l1-hiphop-04","title":"20쪽 · hip-hop이라는 말","lead":"확정된 사실, 전해지는 일화, 소년의 해석을 구분하며 읽어 보세요.","core":"hip-hop이라는 말의 정확한 기원은 알 수 없지만 파티의 구호에서 나왔다고 전해지며, 그 표현과 음악이 퍼졌다.","diagram":{"kind":"steps","title":"말의 확산과 마지막 관찰","items":[{"head":"기원은 불확실","body":"정확한 유래는 모르지만 블록 파티에서 쓰였다고 전해짐","refs":[1,2]},{"head":"파티의 구호","body":"MC가 입대할 친구를 놀리며 hip-hop을 외침","refs":[3,4,5]},{"head":"랩과 음반","body":"새 대사가 랩에 들어가고 1979년 첫 음반 가사에도 포함","refs":[6,7,8]},{"head":"폭력 감소 관찰","body":"1980년대 뉴욕의 폭력 감소 이유는 설명되지 않았고, 한 소년은 춤 때문이라고 말함","refs":[9,10,11]}],"takeaway":"마지막 소년의 말은 설명되지 않은 감소에 대한 그의 답이지, 입증된 원인이라고 쓰지 않는다."},"blocking_vocab":[{"word":"origin","meaning":"기원"},{"word":"chant","meaning":"구호를 외치다"},{"word":"lyrics","meaning":"가사"},{"word":"decline","meaning":"감소"}],"sentences":[{"n":1,"en":"<The Origin of the Word Hip-Hop> Then where did the word hip-hop originate from?","ko":"<힙합이라는 말의 기원> 그러면 힙합이라는 말은 어디에서 유래한 걸까?","grammar":[]},{"n":2,"en":"Nobody knows the exact origin, but it is said that the word hip-hop was first used at a block party.","ko":"정확한 유래는 아무도 모르지만, 힙합이라는 단어는 어느 블록 파티에서 처음 사용되었다고 한다.","grammar":[{"label":"it is said that","explanation":"it is said that은 ‘~라고 전해진다’는 뜻이다. 정확한 기원이 확인되었다는 말이 아니다."}]},{"n":3,"en":"A young man at the party was about to join the army.","ko":"파티에 참석한 한 청년이 곧 군대에 입대할 예정이었다.","grammar":[]},{"n":4,"en":"His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, \"Hip-hop-hip-hop-hip-hop.\"","ko":"그의 좋은 친구이자 그 파티의 엠씨가 군 교관처럼 박자에 맞춰 무대를 가로질러 움직이면서 \"힙합 힙합 힙합\"을 외침으로써 그 청년에게 자유의 시절이 끝났음을 장난스레 상기시켰다.","grammar":[]},{"n":5,"en":"The crowd loved it.","ko":"청중들은 그것을 좋아했다.","grammar":[]},{"n":6,"en":"After that, MCs tried out new lines at parties like \"Hip, hop, hippy to the hippy hop-bop,\" \"I said a hip-hop, a hibbit, hibby-dibby, hip-hip-hop and you don't stop.\"","ko":"그 후 엠씨들은 파티에서 \"힙, 합, 히피 투 더 히피 합밥\", \"내가 말했지 힙합이라고, 힙빗, 힙비딥비, 힙합합이라고, 그럼 너도 멈추지 마\"와 같은 새로운 대사를 시도했다.","grammar":[]},{"n":7,"en":"Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper's Delight (1979), which was an immediate success.","ko":"그러한 대사들은 랩의 표준적인 부분이 되었으며, 최초의 힙합 앨범 <Rapper's Delight(래퍼의 기쁨)>(1979)에서 가사의 일부로 들어갔고, 이 앨범은 즉각적인 성공을 거두었다.","grammar":[]},{"n":8,"en":"The new music and dancing spread very fast.","ko":"새로운 음악과 춤은 매우 빠르게 퍼져 나갔다.","grammar":[]},{"n":9,"en":"There was a sharp unexplained decline in violence during the 1980s in New York.","ko":"1980년대 뉴욕에서는 설명할 수 없는 급격한 폭력 사건 감소가 있었다.","grammar":[]},{"n":10,"en":"One police officer asked a boy on the street if he knew why.","ko":"한 경찰관은 거리에 있는 한 소년에게 이유를 아냐고 물었다.","grammar":[{"label":"간접의문문","explanation":"asked ... if he knew why에서 if 뒤는 평서문 어순이고, why는 ‘왜 그런지’를 대신한다."}]},{"n":11,"en":"The boy said, \"It's because they're dancing.\"","ko":"그 소년은 \"그건 그들이 춤추고 있기 때문이죠\"라고 말했다.","grammar":[]}],"structure":[],"flow":[{"label":"질문","text":"hip-hop이라는 말의 정확한 기원은 알려지지 않았다고 전제한다.","refs":[1,2],"sentences":"S1 · S2"},{"label":"일화","text":"입대할 친구를 놀리던 MC의 구호를 청중이 좋아한다.","refs":[3,4,5],"sentences":"S3 · S4 · S5"},{"label":"확산","text":"MC의 새 구호가 랩의 표준이 되고 첫 음반에 들어가 음악과 춤이 퍼진다.","refs":[6,7,8],"sentences":"S6 · S7 · S8"},{"label":"관찰과 말","text":"뉴욕의 폭력 감소는 설명되지 않았고, 한 소년이 춤 때문이라고 답한다.","refs":[9,10,11],"sentences":"S9 · S10 · S11"}],"checks":[{"type":"핵심","q":"hip-hop이라는 말의 정확한 기원에 대한 원문 입장은?","choices":["한 경찰관이 만들어 냈다고 확정되었다","첫 음반에서 처음 발명되었다","정확한 기원은 알려지지 않았다"],"answer":2,"why":"정확한 기원은 알려지지 않았다","refs":[1,2]},{"type":"근거","q":"1980년대 뉴욕의 폭력 감소 이유에 대해 글이 실제로 말하는 것은?","choices":["감소는 설명되지 않았고 소년은 춤 때문이라고 답했다","과학자들이 춤을 원인으로 입증했다","폭력은 오히려 급증했다"],"answer":0,"why":"감소는 설명되지 않았고 소년은 춤 때문이라고 답했다","refs":[9,10,11]},{"type":"변형 탐지","q":"원문과 일치하는 문장은?","choices":["There was a sharp unexplained decline in violence during the 1980s in New York.","There was a sharp unexplained increase in violence during the 1980s in New York."],"answer":0,"why":"There was a sharp unexplained decline in violence during the 1980s in New York.","refs":[9]}],"key_sentence_en":"Nobody knows the exact origin, but it is said that the word hip-hop was first used at a block party.","key_sentence_ko":"정확한 유래는 아무도 모르지만, 힙합이라는 단어는 어느 블록 파티에서 처음 사용되었다고 한다."},{"id":"l1-hiphop-05","title":"21쪽 · 파티 가사에서 사회 비판으로","lead":"가사의 주제가 어떻게 달라졌는지, 음악의 비트는 계속 남았는지 살펴보세요.","core":"〈The Message〉를 계기로 힙합 가사는 즐거운 파티의 표현을 넘어 게토의 현실과 불의·인종 차별에 맞서는 사회적 메시지를 담는다.","diagram":{"kind":"compare","title":"가사의 초점이 바뀐다","items":[{"head":"초기 · 파티","body":"함께 즐기기와 DJ·래퍼의 능력을 뽐내는 가사","refs":[1]},{"head":"1982년 이후 · 사회 비판","body":"〈The Message〉가 게토의 가혹한 현실을 묘사하고 차별에 맞서는 노래가 이어짐","refs":[2,3,4,5,6]}],"takeaway":"사회적 메시지가 더해져도 리듬과 춤은 사라지지 않았다(S7–S8)."},"blocking_vocab":[{"word":"lyrics","meaning":"가사"},{"word":"groundbreaking","meaning":"획기적인"},{"word":"injustice","meaning":"불의"},{"word":"confront","meaning":"맞서다"}],"sentences":[{"n":1,"en":"<The Messages of Hip-Hop> Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper.","ko":"<힙합의 메시지> 초기 힙합의 파티 구호로 출발한 랩 가사는 일반적으로 다 함께 즐거운 시간을 갖자는 내용과 디제이나 래퍼의 능력을 뽐내는 내용에 초점을 두었다.","grammar":[]},{"n":2,"en":"However, a significant shift occurred during the rise of hip-hop music in the 1980s.","ko":"그러나 1980년대 힙합 음악의 부상 시기에 중요한 변화가 일어났다.","grammar":[]},{"n":3,"en":"Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking.","ko":"가장 중요한 것은, 1982년 그룹 Grandmaster Flash and Furious Five의 노래 <The Message(메시지)>의 등장이 획기적이었다는 점이다.","grammar":[]},{"n":4,"en":"This song's powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen.","ko":"이 노래의 강력한 가사는 게토에서 태어나 이등 시민으로 살다가 죽어야 했던 소년의 슬픈 이야기를 포함하여 게토에서의 삶의 가혹한 현실을 자세히 묘사했다.","grammar":[]},{"n":5,"en":"With this song, hip-hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice.","ko":"파티를 통해 평화를 창조하는 것이 본래 목표였던 힙합은 이 노래를 통해 불의에 저항하는 새로운 사회 비판의 전통을 시작했다.","grammar":[{"label":"whose","explanation":"whose original aim은 hip-hop의 원래 목표를 덧붙여 설명한다. who’s(=who is)와 구별한다."}]},{"n":6,"en":"The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s.","ko":"<The Message>는 역사상 가장 영향력 있는 랩 싱글 중 하나가 되었고, 1980년대와 1990년대에 인종 차별에 맞서는 많은 힙합 노래가 뒤를 이었다.","grammar":[]},{"n":7,"en":"At the same time, their music with its rhythmic beat and rapping made people move or dance.","ko":"그와 동시에, 리듬감 있는 박자와 랩이 어우러진 그들의 음악은 사람들을 움직이게 하고 춤추게 만들었다.","grammar":[{"label":"make A 동사원형","explanation":"made people move or dance에서 made 다음에 목적어 people과 동사원형 move·dance가 온다."}]},{"n":8,"en":"People heard the social message while moving to the beat.","ko":"사람들은 비트에 맞춰 몸을 움직이면서 사회적 메시지를 들었다.","grammar":[]}],"structure":[],"flow":[{"label":"이전","text":"초기 랩 가사는 함께 노는 즐거움과 DJ·래퍼의 능력에 집중한다.","refs":[1],"sentences":"S1"},{"label":"전환","text":"1982년 〈The Message〉가 게토의 가혹한 현실을 노래한다.","refs":[2,3,4],"sentences":"S2 · S3 · S4"},{"label":"확장","text":"힙합이 사회 비판의 전통을 시작하고 차별에 맞서는 노래가 이어진다.","refs":[5,6],"sentences":"S5 · S6"},{"label":"동시성","text":"사람들은 여전히 리듬에 맞춰 움직이며 사회적 메시지를 듣는다.","refs":[7,8],"sentences":"S7 · S8"}],"checks":[{"type":"핵심","q":"〈The Message〉 뒤 힙합 가사에 생긴 변화는?","choices":["파티 구호만 더 길어졌다","게토의 현실과 불의를 다루는 사회 비판이 시작되었다","모든 노래에서 리듬이 사라졌다"],"answer":1,"why":"게토의 현실과 불의를 다루는 사회 비판이 시작되었다","refs":[3,4,5,6]},{"type":"근거","q":"사람들은 사회적 메시지를 어떻게 접했는가?","choices":["비트에 맞춰 움직이면서 들었다","춤을 완전히 멈춘 뒤에만 들었다","가사를 읽지 못해 접하지 못했다"],"answer":0,"why":"비트에 맞춰 움직이면서 들었다","refs":[7,8]},{"type":"변형 탐지","q":"원문과 일치하는 문장은?","choices":["People heard the social message only after they stopped moving to the beat.","People heard the social message while moving to the beat."],"answer":1,"why":"People heard the social message while moving to the beat.","refs":[8]}],"key_sentence_en":"With this song, hip-hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice.","key_sentence_ko":"파티를 통해 평화를 창조하는 것이 본래 목표였던 힙합은 이 노래를 통해 불의에 저항하는 새로운 사회 비판의 전통을 시작했다."},{"id":"l1-hiphop-06","title":"22쪽 · 존경과 자기 가치","lead":"누구를 향한 존경인지, 마지막에 의미가 어떻게 넓어지는지 보세요.","core":"힙합의 존경은 어려움을 딛고 문화를 만든 선구자에게 향하면서, 자신과 타인의 가치를 인정하는 메시지로 확장된다.","diagram":{"kind":"steps","title":"존경의 범위가 넓어진다","items":[{"head":"선구자","body":"어려움과 불의를 딛고 새 음악·문화를 만든 영웅","refs":[2,3,4]},{"head":"무에서 유","body":"제한된 자원 속에서 만든 문화를 기리는 표현","refs":[5]},{"head":"자신과 타인","body":"래퍼 자신의 생존 경험을 연결하고 자기 가치와 타인 존중으로 넓힘","refs":[6,7,8]}],"takeaway":"존경의 대상은 선구자만으로 끝나지 않는다."},"blocking_vocab":[{"word":"pioneer","meaning":"선구자"},{"word":"hardship","meaning":"고난"},{"word":"admiration","meaning":"존경"},{"word":"self-worth","meaning":"자기 가치"}],"sentences":[{"n":1,"en":"Also, a new attitude gradually emerged in hip-hop lyrics, which can be summarized as \"respect.\"","ko":"또한 힙합 가사에 점차 새로운 태도가 나타났는데 그것은 '존경'으로 요약될 수 있다.","grammar":[]},{"n":2,"en":"Hip-hop music began to be a way to express respect for one another, and particularly for hip-hop pioneers.","ko":"힙합 음악은 서로에 대한 존경, 특히 힙합의 선구자들에 대한 존경을 표현하는 한 방법이 되기 시작했다.","grammar":[]},{"n":3,"en":"For rappers, the pioneers are heroes who overcame hardship and injustice and went on to create new music and culture.","ko":"래퍼들에게 그 선구자들은 고난과 불의를 딛고 계속 나아가 새로운 음악과 문화를 창조해낸 영웅들이다.","grammar":[]},{"n":4,"en":"Therefore, many hip-hoppers agree that they cannot have too much respect for these heroes.","ko":"그러므로 많은 힙합인들은 자신들이 이 영웅들에게 아무리 큰 존경심을 가져도 지나치지 않다는 데 동의한다.","grammar":[{"label":"cannot ... too much","explanation":"cannot have too much respect는 ‘아무리 큰 존경을 해도 지나치지 않다’는 강한 긍정이다. 존경이 불가능하다는 뜻이 아니다."}]},{"n":5,"en":"The phrase \"something from nothing,\" often used to summarize the genre's history, is also an expression of admiration for early hip-hoppers, who developed a new culture in the ghetto despite very limited resources.","ko":"힙합 장르의 역사를 요약할 때 자주 사용되는 '무에서 유를'이라는 어구 또한, 매우 제한된 자원에도 불구하고 게토에서 새로운 문화를 일구어낸 초기 힙합인들에 대한 존경의 표현이기도 하다.","grammar":[]},{"n":6,"en":"Rappers also proudly expressed their feeling that they, too, and perhaps the audience, had suffered and survived in a similar way to the pioneers.","ko":"래퍼들은 또한 그들 자신도, 어쩌면 청중들도, 그 선구자들과 비슷하게 고통을 겪고 살아남았다는 느낌을 자랑스럽게 표현했다.","grammar":[]},{"n":7,"en":"This is why the message of respect is about both self-worth and respect for others.","ko":"그렇기 때문에 존경의 메시지는 자기 자신의 가치 그리고 타인에 대한 존경 둘 다에 관한 것이다.","grammar":[]},{"n":8,"en":"The importance of the idea of respect in hip-hop cannot be emphasized strongly enough.","ko":"힙합에서 존경이라는 개념의 중요성은 아무리 강하게 강조해도 지나치지 않다.","grammar":[{"label":"cannot ... enough","explanation":"cannot be emphasized strongly enough도 ‘아무리 강조해도 지나치지 않다’는 뜻이다. 수동태 be emphasized를 함께 읽는다."}]}],"structure":[],"flow":[{"label":"새 태도","text":"힙합 가사에 존경이라는 태도가 나타난다.","refs":[1,2],"sentences":"S1 · S2"},{"label":"존경의 이유","text":"선구자는 불의를 이겨 새 문화를 만든 영웅이며 ‘무에서 유’라는 말이 이를 기린다.","refs":[3,4,5],"sentences":"S3 · S4 · S5"},{"label":"확장","text":"래퍼는 자기 경험을 선구자와 연결하고 존경을 자기 가치와 타인 존중으로 넓힌다.","refs":[6,7,8],"sentences":"S6 · S7 · S8"}],"checks":[{"type":"핵심","q":"이 부분에서 존경의 의미는 어디까지 확장되는가?","choices":["오직 음반 판매량만","오직 DJ 한 사람에 대한 존경만","선구자에 대한 존경에서 자기 가치와 타인 존중까지"],"answer":2,"why":"선구자에 대한 존경에서 자기 가치와 타인 존중까지","refs":[2,5,6,7]},{"type":"근거","q":"‘something from nothing’이 가리키는 것은?","choices":["제한된 자원 속에서 새 문화를 만든 초기 힙합인들","아무도 아무 일도 하지 않았다는 주장","음악이 역사 없이 갑자기 생겼다는 주장"],"answer":0,"why":"제한된 자원 속에서 새 문화를 만든 초기 힙합인들","refs":[5]},{"type":"변형 탐지","q":"원문과 일치하는 문장은?","choices":["This is why the message of respect is only about admiration for famous performers.","This is why the message of respect is about both self-worth and respect for others."],"answer":1,"why":"This is why the message of respect is about both self-worth and respect for others.","refs":[7]}],"key_sentence_en":"This is why the message of respect is about both self-worth and respect for others.","key_sentence_ko":"그렇기 때문에 존경의 메시지는 자기 자신의 가치 그리고 타인에 대한 존경 둘 다에 관한 것이다."},{"id":"l1-hiphop-07","title":"23쪽 · 세계적 문화가 된 힙합","lead":"2001년, 2018년, 오늘날의 의미를 원문 순서대로 따라가 보세요.","core":"평화 문화에서 출발한 힙합은 세계적 인정을 받으며 자기표현·불의에 대한 저항·사람 간 연결의 수단이 되었다.","diagram":{"kind":"steps","title":"본문 속 세 시점","items":[{"head":"2001 · 평화 선언","body":"유엔에 제시된 선언이 힙합의 평화 문화적 의미를 보여 줌","refs":[1,2]},{"head":"2018 · 음악상","body":"Kendrick Lamar의 퓰리처 음악상 수상으로 주요 예술 형식의 위상을 설명","refs":[3,4]},{"head":"오늘 · 세계적 현상","body":"자기표현·불의에 대한 저항·변화와 사람 간 연결의 수단","refs":[5,6]}],"takeaway":"세 시점이 한데 모여 힙합의 문화적 의미가 넓어졌음을 보여 준다."},"blocking_vocab":[{"word":"declaration","meaning":"선언"},{"word":"recognize","meaning":"인정하다"},{"word":"underground","meaning":"비주류의"},{"word":"phenomenon","meaning":"현상"}],"sentences":[{"n":1,"en":"<Hip-Hop in the 21st Century> \"The HipHop Declaration of Peace,\" presented to the UN on May 16th, 2001, officially recognized hip-hop as an international culture of peace.","ko":"<21세기 힙합> 2001년 5월 16일 유엔에 제출된 '힙합 평화 선언문'은 힙합을 국제적인 평화 문화로 공식 인정했다.","grammar":[]},{"n":2,"en":"This document reminds us of hip-hop's original mission to bring peace to the Bronx, implying global respect for hip-hop history.","ko":"이 문서는 브롱스에 평화를 가져오려 한 힙합 원래의 사명을 우리에게 상기시키고 힙합 역사에 대한 전세계적인 존중을 암시한다.","grammar":[]},{"n":3,"en":"When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018, it was another important event.","ko":"힙합 아티스트 Kendrick Lamar가 2018년 퓰리처 음악상을 수상했을 때, 그것은 또 하나의 중요한 사건이었다.","grammar":[]},{"n":4,"en":"It meant that hip-hop, which started as underground music, had become a major art form like classical music","ko":"그것은 언더그라운드 음악으로 시작된 힙합이 클래식 음악 같은 주요 예술 형식으로 자리 잡았다는 것을 의미했다.","grammar":[{"label":"과거완료","explanation":"had become은 2018년 수상 시점에 이미 주요 예술 형식이 되어 있었음을 나타낸다."}]},{"n":5,"en":"If hip-hop music was born as part of a cultural movement for peace in the 1970s, today more and more people regard it as a powerful means to express oneself, fight against injustice, bring about change through social messages, and still be engaged with music and connected to others.","ko":"힙합 음악이 1970년대에 평화를 위한 문화 운동의 일환으로 탄생했다면, 오늘날 점점 더 많은 사람들이 힙합을 자신을 표현하고 불의에 맞서 싸우고 사회적 메시지를 통해 변화를 가져오고, 그러면서도 여전히 음악에 몰두하면서 타인과 연결되는 하나의 강력한 수단으로 여긴다.","grammar":[{"label":"regard A as B","explanation":"regard it as a powerful means에서 it은 힙합을 가리키며, A를 B로 여긴다는 구조다."}]},{"n":6,"en":"With its unique and growing appeal, hip-hop continues to be a global phenomenon.","ko":"그 독특함과 커지는 매력으로 인해 힙합은 계속해서 세계적인 현상이 되고 있다.","grammar":[]}],"structure":[],"flow":[{"label":"평화의 출발","text":"2001년 선언은 브롱스에서 시작한 평화의 사명을 다시 떠올리게 한다.","refs":[1,2],"sentences":"S1 · S2"},{"label":"예술적 인정","text":"2018년 수상을 통해 언더그라운드 음악이 주요 예술 형식이 되었음을 설명한다.","refs":[3,4],"sentences":"S3 · S4"},{"label":"현재의 역할","text":"힙합은 자기표현과 변화, 사람과의 연결을 이루는 세계적 문화로 남는다.","refs":[5,6],"sentences":"S5 · S6"}],"checks":[{"type":"핵심","q":"마지막 부분이 말하는 오늘날 힙합의 역할은?","choices":["사회적 메시지와 관계없는 춤만의 문화","자기표현·불의에 대한 저항·변화와 사람 간 연결의 수단","오직 1970년대의 지역 행사"],"answer":1,"why":"자기표현·불의에 대한 저항·변화와 사람 간 연결의 수단","refs":[5,6]},{"type":"근거","q":"2018년 수상이 본문에서 뜻하는 것은?","choices":["힙합이 처음 탄생했다는 것","모든 힙합 가사가 사라졌다는 것","지하 음악에서 주요 예술 형식으로 자리 잡았다는 것"],"answer":2,"why":"지하 음악에서 주요 예술 형식으로 자리 잡았다는 것","refs":[3,4]},{"type":"변형 탐지","q":"원문과 일치하는 문장은?","choices":["With its unique and growing appeal, hip-hop continues to be a global phenomenon.","With its declining appeal, hip-hop continues to be only a local phenomenon."],"answer":0,"why":"With its unique and growing appeal, hip-hop continues to be a global phenomenon.","refs":[6]}],"key_sentence_en":"If hip-hop music was born as part of a cultural movement for peace in the 1970s, today more and more people regard it as a powerful means to express oneself, fight against injustice, bring about change through social messages, and still be engaged with music and connected to others.","key_sentence_ko":"힙합 음악이 1970년대에 평화를 위한 문화 운동의 일환으로 탄생했다면, 오늘날 점점 더 많은 사람들이 힙합을 자신을 표현하고 불의에 맞서 싸우고 사회적 메시지를 통해 변화를 가져오고, 그러면서도 여전히 음악에 몰두하면서 타인과 연결되는 하나의 강력한 수단으로 여긴다."}]},{"id":"l3-body","label":"3과 · Living With Viruses","scope":"본문 73–79쪽 · 7부분","passages":[{"id":"l3-viruses-73","title":"73쪽 · 바이러스가 해롭기만 할까?","lead":"첫 장면은 바이러스의 피해다. 이것을 글 전체의 결론으로 단정하지 말고 읽어 보세요.","core":"글은 대유행의 막대한 피해를 먼저 보여 주며 ‘바이러스는 오직 해롭다’는 인상에서 출발한다.","diagram":{"kind":"cases","title":"글의 출발점 · 서로 다른 피해 사례","items":[{"head":"1918년 독감","body":"추정 사망자 5천만~1억 명","refs":[2]},{"head":"20세기 천연두","body":"추정 사망자 추가 2억 명","refs":[3]},{"head":"최근 코로나19","body":"수백만 명의 생명과 일상 전반에 영향","refs":[4]}],"takeaway":"피해는 사실로 제시되지만 ‘오직 해롭다’는 판단은 다음 부분에서 다시 묻는다."},"blocking_vocab":[{"word":"solely","meaning":"오로지"},{"word":"pandemic","meaning":"대유행"},{"word":"estimate","meaning":"추정하다"},{"word":"claim lives","meaning":"목숨을 앗아가다"}],"sentences":[{"n":1,"en":"<The Varied World of Viruses> It appears that viruses exist solely to bring suffering to humanity.","ko":"<바이러스의 다양한 세계> 바이러스는 오로지 인류에게 고통을 주기 위해 존재하는 것으로 보인다.","grammar":[]},{"n":2,"en":"The 1918 influenza pandemic is estimated to have killed 50 to 100 million people.","ko":"1918년 인플루엔자 대유행은 5천만 명에서 1억 명의 목숨을 빼앗아간 것으로 추정된다.","grammar":[{"label":"완료부정사","explanation":"is estimated to have killed는 과거의 사망을 현재 추정하는 구조다. 추정치이지 확정된 단일 수치가 아니다."}]},{"n":3,"en":"Smallpox claimed the lives of a further 200 million people in the 20th century alone, according to estimates.","ko":"추정에 따르면, 천연두는 20세기에만 2억 명 이상의 목숨을 앗아갔다.","grammar":[]},{"n":4,"en":"And of course, the recent COVID-19 pandemic has taken several million lives, affecting almost every aspect of human life worldwide.","ko":"그리고 물론 최근의 코로나19 팬데믹은 수백만 명의 목숨을 앗아갔으며, 전 세계적으로 인간 삶의 거의 모든 측면에 영향을 미치고 있다.","grammar":[{"label":"분사구문","explanation":"affecting은 코로나19 대유행이 삶의 여러 측면에 끼친 영향을 덧붙인다."}]}],"structure":[],"flow":[{"label":"첫인상","text":"바이러스는 인류에게 고통만 주는 것처럼 보인다.","refs":[1],"sentences":"S1"},{"label":"역사적 사례","text":"독감과 천연두의 인명 피해를 수치로 제시한다.","refs":[2,3],"sentences":"S2 · S3"},{"label":"최근 사례","text":"코로나19의 피해가 삶의 거의 모든 측면에 미쳤다.","refs":[4],"sentences":"S4"}],"checks":[{"type":"핵심","q":"이 부분의 역할은?","choices":["독감의 최초 발원지를 확정한다","바이러스가 준 큰 피해를 보여 주며 글을 시작한다","바이러스의 모든 이점을 이미 증명한다"],"answer":1,"why":"바이러스가 준 큰 피해를 보여 주며 글을 시작한다","refs":[1,2,3,4]},{"type":"근거","q":"본문의 사망자 수를 읽는 방식으로 맞는 것은?","choices":["모두 정확한 확정값이다","코로나19의 수치만 계산에서 제외한다","추정치로 제시된다"],"answer":2,"why":"추정치로 제시된다","refs":[2,3]},{"type":"변형 탐지","q":"원문과 일치하는 내용은?","choices":["Smallpox claimed the lives of a further 200 million people in the 20th century alone.","Smallpox saved the lives of a further 200 million people in the 20th century alone."],"answer":0,"why":"Smallpox claimed the lives of a further 200 million people in the 20th century alone.","refs":[3]}],"key_sentence_en":"<The Varied World of Viruses> It appears that viruses exist solely to bring suffering to humanity.","key_sentence_ko":"<바이러스의 다양한 세계> 바이러스는 오로지 인류에게 고통을 주기 위해 존재하는 것으로 보인다."},{"id":"l3-viruses-74","title":"74쪽 · 야생동물과의 접촉이 늘어난 이유","lead":"원인들이 한 줄로 이어지는지 확인하고, 마지막 질문의 답을 기억하세요.","core":"자연 장벽 파괴와 서식지 변화로 사람·야생동물의 접촉이 늘어 새 바이러스의 전파 기회가 커졌다. 하지만 바이러스가 꼭 해롭기만 한 것은 아니다.","diagram":{"kind":"steps","title":"장벽에서 접촉까지","items":[{"head":"이전 · 자연 장벽","body":"산과 숲이 동물 바이러스와 사람 사이를 가로막았다.","refs":[3]},{"head":"환경 변화","body":"산업화가 장벽을 허물고 기후 변화가 동물의 서식지를 바꿨다.","refs":[4]},{"head":"접촉·전파 기회","body":"사람과 야생동물의 상호작용이 늘어 전파 기회도 늘었다.","refs":[1,2,5,6]},{"head":"질문 전환","body":"그래도 바이러스가 반드시 해로운 존재인 것은 아니다.","refs":[7,8]}],"takeaway":"‘접촉 증가 → 전파 기회 증가’는 글의 설명이고, 미래 대유행 증가는 우려다."},"blocking_vocab":[{"word":"outbreak","meaning":"발생·유행"},{"word":"prior immunity","meaning":"기존 면역력"},{"word":"barrier","meaning":"장벽"},{"word":"interaction","meaning":"상호작용"}],"sentences":[{"n":1,"en":"Outbreaks of viral diseases are frequently linked to contact with wild animals such as bats.","ko":"바이러스성 질병의 발생은 박쥐와 같은 야생동물과의 접촉과 관련이 있는 경우가 많다.","grammar":[]},{"n":2,"en":"Such contacts allow new viruses to enter human bodies that have no prior immunity to such viruses.","ko":"이러한 접촉을 통해 새로운 바이러스가 그 바이러스에 대한 기존 면역력이 없는 사람의 몸에 침투할 수 있다.","grammar":[]},{"n":3,"en":"Historically, natural barriers such as mountains and forests prevented animal viruses from infecting humans.","ko":"역사적으로 산과 숲과 같은 자연 장벽은 동물 바이러스가 인간을 감염시키는 것을 막았다.","grammar":[{"label":"prevent A from -ing","explanation":"prevented animal viruses from infecting humans는 동물 바이러스가 사람을 감염시키는 것을 막았다는 뜻이다."}]},{"n":4,"en":"Industrialization has destroyed these barriers, and climate change has pushed some wild animals out of their original habitats.","ko":"산업화는 이러한 장벽을 파괴시켜왔고 기후 변화로 인해 일부 야생동물들이 원래 서식지에서 밀려났다.","grammar":[]},{"n":5,"en":"These changes have resulted in an increase in interactions between human and wild animals, meaning more opportunities for the viruses present in wild animals to spread to humans.","ko":"이러한 변화로 인해 인간과 야생동물 간의 상호작용이 증가했고, 이는 야생동물에 존재하는 바이러스가 인간에게 전파될 기회가 더 많아졌다는 것을 의미한다.","grammar":[{"label":"분사구문","explanation":"meaning은 앞의 접촉 증가가 바이러스의 전파 기회 증가를 뜻한다고 풀이한다."}]},{"n":6,"en":"This is the primary reason for scientists' concern that pandemics may increase in the future.","ko":"이것이 과학자들이 앞으로 팬데믹이 증가할 수 있다고 우려하는 주된 이유이다.","grammar":[]},{"n":7,"en":"Then, is the virus truly a harmful presence to humans?","ko":"그렇다면 바이러스는 정말 인간에게 해로운 존재일까?","grammar":[]},{"n":8,"en":"Not necessarily.","ko":"반드시 그렇지는 않다.","grammar":[]}],"structure":[],"flow":[{"label":"접촉","text":"야생동물과의 접촉이 새 바이러스의 인체 유입과 연결된다.","refs":[1,2],"sentences":"S1 · S2"},{"label":"장벽 변화","text":"과거의 자연 장벽은 산업화·기후 변화로 약해졌다.","refs":[3,4],"sentences":"S3 · S4"},{"label":"결과와 우려","text":"접촉과 전파 기회가 늘어 과학자들이 미래의 대유행을 우려한다.","refs":[5,6],"sentences":"S5 · S6"},{"label":"반전 질문","text":"바이러스가 정말 항상 해로운지 묻고 ‘반드시 그렇지는 않다’고 답한다.","refs":[7,8],"sentences":"S7 · S8"}],"checks":[{"type":"핵심","q":"전파 기회가 늘어난 원인 흐름은?","choices":["접촉 감소 → 새 바이러스 유입 증가","자연 장벽 강화 → 접촉 증가","장벽 약화·서식지 변화 → 접촉 증가 → 전파 기회 증가"],"answer":2,"why":"장벽 약화·서식지 변화 → 접촉 증가 → 전파 기회 증가","refs":[3,4,5]},{"type":"근거","q":"과학자들이 우려하는 것은?","choices":["모든 바이러스의 즉각적 소멸","야생동물과 사람의 접촉이 완전히 사라짐","미래의 대유행이 증가할 가능성"],"answer":2,"why":"미래의 대유행이 증가할 가능성","refs":[6]},{"type":"변형 탐지","q":"마지막 질문에 대한 원문의 답은?","choices":["Not necessarily.","Absolutely, without exception."],"answer":0,"why":"Not necessarily.","refs":[7,8]}],"key_sentence_en":"These changes have resulted in an increase in interactions between human and wild animals, meaning more opportunities for the viruses present in wild animals to spread to humans.","key_sentence_ko":"이러한 변화로 인해 인간과 야생동물 간의 상호작용이 증가했고, 이는 야생동물에 존재하는 바이러스가 인간에게 전파될 기회가 더 많아졌다는 것을 의미한다."},{"id":"l3-viruses-75","title":"75쪽 · 박테리아 수를 조절하는 바이러스","lead":"‘바이러스가 박테리아를 죽인다’에서 멈추지 말고 개체 수 조절까지 이어 보세요.","core":"일부 바이러스는 박테리아 안에서 증식하고 다른 박테리아로 퍼져 특정 박테리아의 과도한 증가를 억제한다.","diagram":{"kind":"steps","title":"박테리아 조절 과정","items":[{"head":"침투","body":"일부 바이러스가 박테리아의 생식 기능을 이용한다.","refs":[5,6]},{"head":"증식","body":"박테리아 안에서 바이러스가 늘어나고 박테리아는 죽는다.","refs":[7]},{"head":"다음 감염","body":"새 바이러스가 다른 박테리아로 옮겨 간다.","refs":[7]},{"head":"개체 수 조절","body":"특정 박테리아가 지나치게 늘어나는 것을 억제한다.","refs":[4,8]}],"takeaway":"이 과정은 모든 박테리아를 없앤다는 말이 아니다."},"blocking_vocab":[{"word":"sustain","meaning":"지탱하다"},{"word":"regulator","meaning":"조절자"},{"word":"reproductive","meaning":"생식의"},{"word":"excessive","meaning":"과도한"}],"sentences":[{"n":1,"en":"<Keepers of the Earth> What is less commonly known is that viruses play crucial roles in supporting much of life on Earth.","ko":"<지구의 수호자> 덜 일반적으로 알려진 것은 바이러스가 지구상의 많은 생명체를 지탱하는데 중요한 역할을 한다는 것이다.","grammar":[{"label":"What 주어절","explanation":"What is less commonly known 전체가 주어이고 뒤의 is that절이 그 내용을 밝힌다."}]},{"n":2,"en":"This is because researchers have only recently begun investigating the viruses that sustain us and the planet, instead of just those that harm us.","ko":"이는 연구자들이 인간에게 해를 끼치는 바이러스 대신에 인간과 지구를 지탱하는 바이러스에 대한 연구를 최근에야 시작했기 때문이다.","grammar":[]},{"n":3,"en":"Therefore, scientists have much more to learn about viruses than they currently know.","ko":"따라서 과학자들은 바이러스에 대해 현재 알고 있는 것보다 훨씬 더 많은 것을 알아야 한다.","grammar":[]},{"n":4,"en":"What they do know is that viruses act as the primary regulators of bacterial and insect populations.","ko":"그들이 알고 있는 것은 바이러스가 박테리아와 곤충 개체군의 주요 조절자 역할을 한다는 것이다.","grammar":[]},{"n":5,"en":"Since viruses do not have reproductive functions on their own, they steal the reproductive functions of other organisms to multiply.","ko":"바이러스는 자체의 생식 기능이 없기 때문에 증식하기 위해 다른 유기체의 생식 기능을 훔친다.","grammar":[]},{"n":6,"en":"Some types of viruses use bacteria.","ko":"일부 유형의 바이러스는 박테리아를 사용한다.","grammar":[]},{"n":7,"en":"When the virus continues to multiply inside the bacteria, the bacteria eventually die, and the newly produced viruses go on to infect other bacteria.","ko":"바이러스가 박테리아 내에서 계속 증식하면 박테리아는 결국 죽고 새로 생성된 바이러스가 다른 박테리아를 감염시킨다.","grammar":[{"label":"When 시간·조건절","explanation":"When the virus continues to multiply는 박테리아가 죽기까지의 조건과 순서를 나타낸다."}]},{"n":8,"en":"This whole process helps viruses control the excessive growth of certain bacteria.","ko":"이 전체 과정은 바이러스가 특정 박테리아의 과도한 성장을 제어하는 데 도움이 된다.","grammar":[]}],"structure":[],"flow":[{"label":"시선 전환","text":"해로운 바이러스만 연구한 탓에 생명을 지탱하는 역할은 덜 알려졌다.","refs":[1,2,3],"sentences":"S1 · S2 · S3"},{"label":"알려진 역할","text":"바이러스는 박테리아·곤충 개체 수의 주요 조절자다.","refs":[4],"sentences":"S4"},{"label":"증식 방식","text":"스스로 생식하지 못해 다른 생물의 생식 기능을 이용한다.","refs":[5,6],"sentences":"S5 · S6"},{"label":"조절 결과","text":"박테리아 안에서 증식·전파하며 과도한 성장을 막는다.","refs":[7,8],"sentences":"S7 · S8"}],"checks":[{"type":"핵심","q":"이 부분이 보여 주는 바이러스의 이로운 역할은?","choices":["모든 박테리아를 영구히 없앤다","박테리아 없이 스스로 증식한다","특정 박테리아의 과도한 성장을 조절한다"],"answer":2,"why":"특정 박테리아의 과도한 성장을 조절한다","refs":[4,5,7,8]},{"type":"근거","q":"바이러스가 증식할 때 이용하는 것은?","choices":["바이러스 자체의 독립적인 생식 기관","오직 인간의 면역 세포","다른 생물의 생식 기능"],"answer":2,"why":"다른 생물의 생식 기능","refs":[5]},{"type":"변형 탐지","q":"원문과 일치하는 내용은?","choices":["All types of viruses use only humans.","Some types of viruses use bacteria."],"answer":1,"why":"Some types of viruses use bacteria.","refs":[6]}],"key_sentence_en":"This whole process helps viruses control the excessive growth of certain bacteria.","key_sentence_ko":"이 전체 과정은 바이러스가 특정 박테리아의 과도한 성장을 제어하는 데 도움이 된다."},{"id":"l3-viruses-76","title":"76쪽 · 산소와 곤충의 두 갈래","lead":"박테리아를 죽이는 일이 산소 생산에 어떻게 이어지는지, 곤충 조절과는 구분해 보세요.","core":"바이러스는 박테리아에서 나온 영양분을 통해 플랑크톤의 산소 생산을 뒷받침하고, 곤충 개체 수도 조절한다.","diagram":{"kind":"compare","title":"바이러스의 두 생태계 경로","items":[{"head":"산소 경로","body":"바이러스 → 박테리아 사멸 → 방출된 영양분 → 플랑크톤 → 산소 생산","refs":[1,2,3,4,5]},{"head":"곤충 경로","body":"특정 곤충 과잉 → 감염 바이러스 증가 → 그 곤충 감소 → 다른 곤충의 공간","refs":[6,7,8]}],"takeaway":"두 경로는 별개 사례다. 플랑크톤이 바이러스 자체를 먹는다는 뜻이 아니다."},"blocking_vocab":[{"word":"plankton","meaning":"플랑크톤"},{"word":"nutrient","meaning":"영양분"},{"word":"remains","meaning":"사체·잔해"},{"word":"flourish","meaning":"번성하다"}],"sentences":[{"n":1,"en":"The greater significance of viruses infecting bacteria is that they play a vital role in supplying oxygen to our planet.","ko":"박테리아를 감염시키는 바이러스가 갖는 더 중요한 의미는 그들이 지구에 산소를 공급하는 데 필수적인 역할을 한다는 것이다.","grammar":[]},{"n":2,"en":"About half of the oxygen on Earth is produced by plankton in the oceans, and the primary food source for these plankton is nutrients released from bacteria killed by viral infections.","ko":"지구에 있는 산소의 약 절반은 바다의 플랑크톤이 생산하며, 이 플랑크톤의 주요 먹이는 바이러스 감염으로 죽은 박테리아에서 방출되는 영양소이다.","grammar":[]},{"n":3,"en":"If viruses did not infect and kill bacteria, there would be no bacterial remains, leading to a lack of plankton.","ko":"바이러스가 박테리아를 감염시켜 죽이지 않는다면 박테리아의 사체도 없을 것이고, 그 결과 플랑크톤이 부족해질 것이다.","grammar":[{"label":"가정법 과거","explanation":"If viruses did not ... there would be ...는 바이러스가 박테리아를 감염시키지 않는다고 가정한 결과다."}]},{"n":4,"en":"Without plankton, half of Earth's oxygen would disappear.","ko":"플랑크톤이 없다면 지구 산소의 절반이 사라질 것이다.","grammar":[]},{"n":5,"en":"In short, without viruses, the lack of oxygen would make it impossible for humans to survive.","ko":"요약하자면, 바이러스가 없다면 산소가 부족해져 인류의 생존이 불가능할 것이다.","grammar":[]},{"n":6,"en":"Insect species populations are also regulated by viruses.","ko":"곤충 종의 개체 수 역시 바이러스에 의해 조절된다.","grammar":[]},{"n":7,"en":"When a specific type of insect increases excessively, the viruses that infect those insects also increase, reducing their numbers.","ko":"특정 유형의 곤충이 과도하게 증가하면 해당 곤충을 감염시키는 바이러스도 증가하여 그 곤충의 수가 감소한다.","grammar":[]},{"n":8,"en":"This, in turn, creates room for other types of insects to flourish.","ko":"이는 결국 다른 종류의 곤충이 번성할 수 있는 여지를 만들어 준다.","grammar":[{"label":"This, in turn","explanation":"This는 앞의 특정 곤충 수 감소를 받고, 그 결과 다른 곤충이 늘 공간이 생긴다는 뜻이다."}]},{"n":9,"en":"Considering the chain of food in nature, it would not be difficult to assume that viruses fulfill important functions in regulating other species.","ko":"자연의 먹이사슬을 고려할 때, 바이러스가 다른 종을 조절하는 중요한 기능을 수행한다고 가정하는 것은 어렵지 않을 것이다.","grammar":[]},{"n":10,"en":"We have just started to understand their various roles in the ecosystem.","ko":"우리는 생태계에서 바이러스가 수행하는 다양한 역할을 이제 막 이해하기 시작했다.","grammar":[]}],"structure":[],"flow":[{"label":"산소 공급","text":"박테리아에서 나온 영양분이 플랑크톤의 먹이가 되고 플랑크톤이 산소를 만든다.","refs":[1,2],"sentences":"S1 · S2"},{"label":"없다면","text":"바이러스가 박테리아를 죽이지 않는다면 플랑크톤과 산소가 부족해진다는 가정이다.","refs":[3,4,5],"sentences":"S3 · S4 · S5"},{"label":"곤충 조절","text":"특정 곤충이 과도하게 늘면 관련 바이러스도 늘어 그 수를 낮춘다.","refs":[6,7,8],"sentences":"S6 · S7 · S8"},{"label":"조심스러운 결론","text":"다른 종 조절도 추정하며, 생태계 속 역할은 아직 이해하기 시작한 단계다.","refs":[9,10],"sentences":"S9 · S10"}],"checks":[{"type":"핵심","q":"본문의 산소 공급 연결이 맞는 것은?","choices":["죽은 박테리아의 영양분 → 플랑크톤 → 산소","플랑크톤이 바이러스를 직접 먹음 → 산소","바이러스가 산소를 직접 생산함"],"answer":0,"why":"죽은 박테리아의 영양분 → 플랑크톤 → 산소","refs":[1,2]},{"type":"근거","q":"특정 곤충이 과도하게 많아지면?","choices":["그 곤충이 모든 다른 종을 없애도록 돕는다","바이러스가 사라져 곤충 수가 더 늘어난다","그 곤충을 감염시키는 바이러스도 증가해 수를 줄인다"],"answer":2,"why":"그 곤충을 감염시키는 바이러스도 증가해 수를 줄인다","refs":[7,8]},{"type":"변형 탐지","q":"원문과 일치하는 것은?","choices":["About half of the oxygen on Earth is produced by plankton in the oceans.","All of the oxygen on Earth is produced directly by viruses."],"answer":0,"why":"About half of the oxygen on Earth is produced by plankton in the oceans.","refs":[2]}],"key_sentence_en":"About half of the oxygen on Earth is produced by plankton in the oceans, and the primary food source for these plankton is nutrients released from bacteria killed by viral infections.","key_sentence_ko":"지구에 있는 산소의 약 절반은 바다의 플랑크톤이 생산하며, 이 플랑크톤의 주요 먹이는 바이러스 감염으로 죽은 박테리아에서 방출되는 영양소이다."},{"id":"l3-viruses-77","title":"77쪽 · DNA에서 태반까지","lead":"바이러스의 DNA 전달과 태반 발달 사례를 연결하되 ‘확정’과 ‘보고’의 강도를 구별하세요.","core":"바이러스 DNA가 자손에게 전달되면 진화에 영향을 줄 수 있으며, 고대 바이러스가 태반 발달에 중요한 역할을 했다는 보고가 있다.","diagram":{"kind":"steps","title":"본문이 제시한 진화 연결","items":[{"head":"생식 세포 감염","body":"바이러스 DNA가 난자·정자를 통해 자손에게 전달될 수 있다.","refs":[2]},{"head":"새 DNA 삽입","body":"게놈에 새 DNA가 들어가는 것은 진화의 한 메커니즘이다.","refs":[3,4]},{"head":"태반의 역할","body":"태아에게 물질 교환·보호를 제공하며 몸 안의 이동을 가능하게 한다.","refs":[5,6,7,8,9]},{"head":"고대 바이러스 보고","body":"1억 3천만 년 이상 전 감염 바이러스가 태반 발달에 기여한 것으로 보고됐다.","refs":[10]}],"takeaway":"바이러스가 홀로 태반을 만들었다고 단정하지 않는다."},"blocking_vocab":[{"word":"offspring","meaning":"자손"},{"word":"genome","meaning":"게놈"},{"word":"placenta","meaning":"태반"},{"word":"fetus","meaning":"태아"}],"sentences":[{"n":1,"en":"<Helpers of Evolution> Another less recognized role of viruses is their contribution to the evolution of life on Earth.","ko":"<진화의 조력자> 바이러스의 또 다른 잘 알려지지 않은 역할은 지구 생명체의 진화에 대한 기여이다.","grammar":[]},{"n":2,"en":"When a virus infects a reproductive cell of its host, such as an egg or sperm, the viral DNA may be passed down to the host's offspring.","ko":"바이러스가 난자나 정자와 같은 숙주의 생식 세포를 감염시키면 바이러스의 DNA가 숙주의 자손에게 전달될 수 있다.","grammar":[{"label":"may be passed down","explanation":"may는 가능성이고 수동태는 바이러스 DNA가 자손에게 전달될 수 있음을 뜻한다."}]},{"n":3,"en":"The insertion of new DNA into genomes is a significant mechanism of evolution.","ko":"새로운 DNA가 게놈에 삽입되는 것은 진화의 중요한 메커니즘이다.","grammar":[]},{"n":4,"en":"Without viruses, in other words, the evolutionary potential for all life on the planet would be impacted.","ko":"다시 말해, 바이러스가 없다면 지구상의 모든 생명체의 진화 잠재력이 영향을 받을 것이다.","grammar":[]},{"n":5,"en":"One example of viruses' contributions to evolution is their role in the development of the placenta in mammals.","ko":"바이러스가 진화에 기여한 한 가지 예는 포유류의 태반 발달에서 바이러스가 한 역할이다.","grammar":[]},{"n":6,"en":"A placenta is a complex organ that helps the fetus grow securely inside its mother's body.","ko":"태반은 태아가 엄마의 몸 안에서 안전하게 성장할 수 있도록 돕는 복잡한 기관이다.","grammar":[]},{"n":7,"en":"It facilitates the exchange of oxygen, nutrients, and waste products while protecting the fetus from the mother's immune system.","ko":"태반은 산소, 영양분, 노폐물의 교환을 용이하게 하는 동시에 태아를 엄마의 면역 체계로부터 보호한다.","grammar":[]},{"n":8,"en":"In the early days of evolution, female animals had to leave their offspring in one location, like eggs in a nest, making them vulnerable to predators.","ko":"진화 초기에 암컷 동물은 둥지에 놓인 알처럼 새끼를 한 곳에 놓아두어야 했기 때문에 포식자의 공격에 취약할 수밖에 없었다.","grammar":[]},{"n":9,"en":"After the emergence of the placenta, females were able to carry their young inside their bodies safely from one location to another.","ko":"태반의 출현 이후 암컷은 새끼를 몸 안에 넣어 한 장소에서 다른 장소로 안전하게 옮길 수 있게 되었다.","grammar":[]},{"n":10,"en":"Viruses that infected our remote ancestors more than 130 million years ago have been reported to have served a key function in the development of this vital organ.","ko":"1억 3천만 년 이상 전 인류의 먼 조상을 감염시킨 바이러스가 이 중요한 기관의 발달에 핵심적인 역할을 한 것으로 보고되었다.","grammar":[{"label":"have been reported to have served","explanation":"보고되었다는 말과 완료부정사를 함께 읽는다. 역사적 기여가 보고되었다는 것이지 단독 원인이라고 확정하지 않는다."}]}],"structure":[],"flow":[{"label":"일반 원리","text":"바이러스 DNA가 생식 세포를 거쳐 자손에게 전달될 수 있다.","refs":[1,2,3,4],"sentences":"S1 · S2 · S3 · S4"},{"label":"사례","text":"태반은 태아의 성장·보호와 물질 교환을 돕는다.","refs":[5,6,7],"sentences":"S5 · S6 · S7"},{"label":"전후 대비","text":"태반 이전의 취약성과 이후 몸 안에서의 안전한 이동을 비교한다.","refs":[8,9],"sentences":"S8 · S9"},{"label":"근거의 강도","text":"고대 바이러스가 이 기관의 발달에 핵심 역할을 한 것으로 보고되었다.","refs":[10],"sentences":"S10"}],"checks":[{"type":"핵심","q":"바이러스와 진화의 관계로 글이 말하는 것은?","choices":["바이러스 DNA 전달이 진화에 영향을 줄 수 있다","바이러스가 모든 포유류 태반을 단독으로 만들었다","진화에는 DNA 삽입이 전혀 관계없다"],"answer":0,"why":"바이러스 DNA 전달이 진화에 영향을 줄 수 있다","refs":[2,3,10]},{"type":"근거","q":"태반이 하는 일은?","choices":["태아를 모체 면역계에 무방비로 노출한다","태아의 산소 교환을 막는다","태아 성장과 물질 교환을 돕고 보호한다"],"answer":2,"why":"태아 성장과 물질 교환을 돕고 보호한다","refs":[6,7]},{"type":"변형 탐지","q":"원문의 근거 강도와 맞는 표현은?","choices":["have been reported to have served a key function","have been proven to be the only cause"],"answer":0,"why":"have been reported to have served a key function","refs":[10]}],"key_sentence_en":"Viruses that infected our remote ancestors more than 130 million years ago have been reported to have served a key function in the development of this vital organ.","key_sentence_ko":"1억 3천만 년 이상 전 인류의 먼 조상을 감염시킨 바이러스가 이 중요한 기관의 발달에 핵심적인 역할을 한 것으로 보고되었다."},{"id":"l3-viruses-78","title":"78쪽 · 유전 정보를 운반하는 바이러스","lead":"유전자 치료의 목적과 변형 바이러스가 맡는 ‘운반체’ 역할을 분리해 보세요.","core":"유전자 치료에서는 교정된 유전 정보를 환자 세포에 전달하고, 특별히 변형된 바이러스를 그 운반체 중 하나로 쓸 수 있다.","diagram":{"kind":"steps","title":"유전자 치료의 전달 구조","items":[{"head":"문제","body":"유전적 장애가 건강 문제로 이어질 수 있다.","refs":[3,4]},{"head":"교정 정보","body":"환자 세포에 올바른 유전적 지침을 전달하려 한다.","refs":[5,6]},{"head":"운반체","body":"특별히 변형된 바이러스가 정보 전달 매개체 중 하나다.","refs":[7]},{"head":"가능한 결과","body":"세포가 제대로 기능하면 일부 질병과 싸우는 데 도움이 될 수 있다.","refs":[8]}],"takeaway":"본문은 가능성을 설명한다. 모든 질병의 치료 성공을 보장하지 않는다."},"blocking_vocab":[{"word":"genetic disorder","meaning":"유전적 장애"},{"word":"gene therapy","meaning":"유전자 치료"},{"word":"carrier","meaning":"운반체"},{"word":"potentially","meaning":"잠재적으로"}],"sentences":[{"n":1,"en":"<Means for Cures> As scientific knowledge about viruses continues to expand, new opportunities for utilizing them in the battle against diseases are arising.","ko":"<치료를 위한 수단> 바이러스에 대한 과학적 지식이 계속 확장됨에 따라 질병과의 전쟁에서 바이러스를 활용할 수 있는 새로운 기회가 생겨나고 있다.","grammar":[]},{"n":2,"en":"Of notable interest are the areas of gene therapy and cancer treatment.","ko":"주목할 만한 관심사는 유전자 치료와 암 치료 분야이다.","grammar":[]},{"n":3,"en":"Genes can be compared to instruction guides that govern how our bodies function.","ko":"유전자는 우리 몸이 기능하는 방식을 규정하는 지침서에 비유할 수 있다.","grammar":[]},{"n":4,"en":"Sometimes, people are born with genetic disorders, which can lead to health problems.","ko":"때때로 사람들은 유전적 장애를 가지고 태어나며 이 장애가 건강에 문제를 일으킬 수 있다.","grammar":[]},{"n":5,"en":"Gene therapy steps in to fix these issues.","ko":"유전자 치료는 이러한 문제를 해결하기 위해 개입한다.","grammar":[]},{"n":6,"en":"The essence of gene therapy lies in delivering corrected genetic instructions to a patient's cells, enabling them to function properly.","ko":"유전자 치료의 핵심은 환자의 세포에 올바른 유전적 지침을 전달하여 세포가 제대로 기능할 수 있도록 하는 것에 있다.","grammar":[{"label":"lie in -ing","explanation":"lies in delivering에서 in은 전치사라 delivering이 온다. 치료의 핵심이 교정 지침의 전달이라는 뜻이다."}]},{"n":7,"en":"In this process, specially modified viruses are used as one of the carriers of the genetic instructions.","ko":"이 과정에서 특수하게 변형된 바이러스가 유전적 지시를 전달하는 매개체 중 하나로 사용된다.","grammar":[]},{"n":8,"en":"If the patient's cells function properly, it can potentially help the body fight off certain diseases.","ko":"환자의 세포가 제대로 기능하면 신체가 특정 질병을 퇴치하는 데 잠재적으로 도움이 될 수 있다.","grammar":[{"label":"If 조건절·can potentially","explanation":"세포가 제대로 기능할 경우라는 조건과 잠재적 도움이라는 가능성을 구별한다."}]}],"structure":[],"flow":[{"label":"새 가능성","text":"바이러스 지식이 늘며 유전자·암 치료에 쓸 기회가 생긴다.","refs":[1,2],"sentences":"S1 · S2"},{"label":"치료 목적","text":"유전적 장애로 생긴 문제에 교정된 지침을 보내 세포 기능을 돕는다.","refs":[3,4,5,6],"sentences":"S3 · S4 · S5 · S6"},{"label":"운반과 가능성","text":"변형 바이러스가 운반체의 하나이며 일부 질병 퇴치에 도움이 될 수 있다.","refs":[7,8],"sentences":"S7 · S8"}],"checks":[{"type":"핵심","q":"변형 바이러스가 맡는 역할은?","choices":["교정된 유전 정보를 전하는 운반체 중 하나","모든 질병을 자동으로 치료하는 유일한 약","세포의 유전 정보를 무조건 없애는 수단"],"answer":0,"why":"교정된 유전 정보를 전하는 운반체 중 하나","refs":[6,7,8]},{"type":"근거","q":"유전자 치료의 핵심은?","choices":["모든 바이러스를 자연에서 제거하는 것","세포 기능을 완전히 정지시키는 것","교정된 유전적 지침을 환자 세포에 전달하는 것"],"answer":2,"why":"교정된 유전적 지침을 환자 세포에 전달하는 것","refs":[6]},{"type":"변형 탐지","q":"원문과 일치하는 것은?","choices":["modified viruses are used as one of the carriers","modified viruses are used as the only carrier"],"answer":0,"why":"modified viruses are used as one of the carriers","refs":[7]}],"key_sentence_en":"In this process, specially modified viruses are used as one of the carriers of the genetic instructions.","key_sentence_ko":"이 과정에서 특수하게 변형된 바이러스가 유전적 지시를 전달하는 매개체 중 하나로 사용된다."},{"id":"l3-viruses-79","title":"79쪽 · 암 치료의 가능성과 남은 과제","lead":"가능한 기술과 현재의 개발 단계, 앞으로 알아야 할 것을 구별해 보세요.","core":"바이러스의 암세포 표적 치료는 가능성을 탐구하는 초기 단계이며, 다양한 바이러스 연구는 유익한 활용과 방어책 개발에 도움을 줄 수 있다.","diagram":{"kind":"steps","title":"가능성과 한계의 경계","items":[{"head":"치료 아이디어","body":"바이러스의 세포 감염·파괴 능력을 암세포에 이용하려 한다.","refs":[1,2]},{"head":"조건부 목표","body":"성공한다면 건강한 세포는 두고 암세포를 표적으로 삼는다.","refs":[2]},{"head":"현재 단계","body":"유전자·암 치료 활용은 아직 초기 단계다.","refs":[3,4]},{"head":"더 알아야 할 것","body":"바이러스의 종류·특성을 연구해 활용과 방어책을 넓힌다.","refs":[5,6,7]}],"takeaway":"‘If successful’과 ‘early stages’를 빼고 이미 완성된 치료처럼 말하지 않는다."},"blocking_vocab":[{"word":"target","meaning":"표적으로 삼다"},{"word":"unharmed","meaning":"손상되지 않은"},{"word":"incurable","meaning":"치료 불가능한"},{"word":"diversity","meaning":"다양성"}],"sentences":[{"n":1,"en":"Using viruses to treat cancer, another use of viruses, is based on the notion of utilizing their natural ability to infect and kill cells.","ko":"바이러스를 이용한 암 치료는 바이러스의 또 다른 용도로서, 세포를 감염시키고 죽이는 바이러스의 자연적인 능력을 활용한다는 개념에 기반을 두고 있다.","grammar":[]},{"n":2,"en":"If successful, viruses can be manipulated to specifically target and destroy cancer cells while leaving healthy cells unharmed.","ko":"성공한다면 바이러스를 조작하여 건강한 세포는 손상시키지 않으면서 암세포만 명확히 표적으로 삼아 파괴할 수 있다.","grammar":[{"label":"If successful","explanation":"성공한다면이라는 조건이다. 건강한 세포를 남겨 두는 표적 치료가 이미 일반적으로 완성됐다는 말이 아니다."}]},{"n":3,"en":"The use of viruses in gene therapy and cancer treatment is still in the early stages.","ko":"유전자 치료와 암 치료에 바이러스를 사용하는 것은 아직 초기 단계에 머물러 있다.","grammar":[]},{"n":4,"en":"However, many researchers are involved in hundreds of projects with the goal of discovering cures for diseases that were once thought to be incurable.","ko":"그러나 많은 연구자들이 한때 불치병으로 여겨졌던 질병의 치료법을 발견하기 위해 수백 개의 프로젝트에 참여하고 있다.","grammar":[]},{"n":5,"en":"We have yet to find out how many virus types even exist, let alone the characteristics of each of them.","ko":"우리는 아직 각 바이러스의 특성은 물론이고 얼마나 많은 종류의 바이러스가 존재하는지조차 파악하지 못하고 있다.","grammar":[]},{"n":6,"en":"The more we learn about viruses, however, the better equipped we will be to use certain viruses for beneficial purposes and to develop defenses against viruses that could lead to the next pandemic.","ko":"하지만 바이러스에 대해 더 많이 알수록 특정 바이러스를 유익한 목적으로 사용하고 다음 팬데믹으로 이어질 수 있는 바이러스에 대한 방어책을 개발하는 데 더 잘 대비할 수 있을 것이다.","grammar":[{"label":"The more ... the better","explanation":"바이러스를 더 많이 배울수록 유익한 활용과 방어책 개발에 더 잘 대비할 수 있다는 비례 표현이다."}]},{"n":7,"en":"More than that, learning more about viral diversity will help us reach a deeper understanding of the working of our planet, ecosystems, and our own bodies.","ko":"뿐만 아니라, 바이러스 다양성에 대해 더 많이 알게 되는 것은 지구와 생태계, 우리 몸의 작용에 대해 더 깊이 이해할 수 있게 도움을 줄 것이다.","grammar":[]}],"structure":[],"flow":[{"label":"치료 구상","text":"바이러스의 감염·파괴 능력을 암세포에 선택적으로 쓰려 한다.","refs":[1,2],"sentences":"S1 · S2"},{"label":"진행 상황","text":"활용은 초기 단계지만 다양한 치료 연구가 진행 중이다.","refs":[3,4],"sentences":"S3 · S4"},{"label":"지식의 빈칸","text":"바이러스 종류와 특성은 아직 다 알지 못한다.","refs":[5],"sentences":"S5"},{"label":"글의 결론","text":"더 배우면 유익한 활용·방어와 생태계 이해에 도움이 된다.","refs":[6,7],"sentences":"S6 · S7"}],"checks":[{"type":"핵심","q":"바이러스의 치료 활용에 대한 현재 상태는?","choices":["가능성을 연구 중이며 아직 초기 단계다","모든 암을 완치하는 보편적 기술로 확정됐다","연구가 전혀 진행되지 않는다"],"answer":0,"why":"가능성을 연구 중이며 아직 초기 단계다","refs":[1,2,3,4]},{"type":"근거","q":"더 많은 바이러스 연구가 도움이 되는 두 방향은?","choices":["모든 바이러스 제거와 생태계 폐쇄","암 치료만 있고 생태계 이해는 없음","유익한 활용과 해로운 바이러스에 대한 방어"],"answer":2,"why":"유익한 활용과 해로운 바이러스에 대한 방어","refs":[5,6,7]},{"type":"변형 탐지","q":"원문과 일치하는 것은?","choices":["The use of viruses in gene therapy and cancer treatment is still in the early stages.","The use of viruses in gene therapy and cancer treatment has already been perfected."],"answer":0,"why":"The use of viruses in gene therapy and cancer treatment is still in the early stages.","refs":[3]}],"key_sentence_en":"The use of viruses in gene therapy and cancer treatment is still in the early stages.","key_sentence_ko":"유전자 치료와 암 치료에 바이러스를 사용하는 것은 아직 초기 단계에 머물러 있다."}]},{"id":"l3-further-reading","label":"3과 · Further Reading","scope":"The Strange Mask of the Plague Doctor · 82–83쪽 · 2부분","passages":[{"id":"l3-fr-82","title":"82쪽 · The Strange Mask of the Plague Doctor","lead":"전염병 의사의 기묘한 가면 · 가면의 모양뿐 아니라 의사들이 그것을 쓴 이유를 찾아보세요.","core":"1600년대 일부 의사들은 흑사병이 나쁜 공기에서 온다고 믿고, 허브를 채운 새 부리 모양 가면과 보호 의상을 착용했다.","diagram":{"kind":"compare","title":"보호 의상의 겉모습과 당시 믿음","items":[{"head":"의사들이 착용·사용한 것","body":"긴 코트·연결된 바지와 부츠·가죽 모자와 장갑·막대기·허브를 넣은 새 부리 모양 가면","refs":[2,3,4,5]},{"head":"그들이 믿었던 보호 원리","body":"흑사병의 원인을 ‘나쁜 공기’로 생각했고, 허브가 공기를 걸러 주기를 바랐다.","refs":[6,7]}],"takeaway":"가면의 허브는 당시의 믿음이다. 실제 병원인으로 확정하면 안 된다."},"blocking_vocab":[{"word":"plague","meaning":"흑사병, 페스트"},{"word":"beak","meaning":"새의 부리"},{"word":"herb","meaning":"허브, 약초"},{"word":"filter","meaning":"걸러내다"}],"sentences":[{"n":1,"en":"When a deadly disease called the plague killed many people in Europe in the 1600s, some doctors wore a strange costume to treat the sick.","ko":"1600년대 유럽에서 흑사병(페스트)이라는 치명적인 질병으로 많은 사람이 사망했을 때, 일부 의사들은 기묘한 의상을 입고 환자를 치료했다.","grammar":[{"label":"the sick","explanation":"the + 형용사는 여기서 ‘아픈 사람들’을 가리킵니다. 환자를 치료한 주체는 의사들입니다."}]},{"n":2,"en":"The costume had a long coat with polish on it and pants and boots that were attached.","ko":"이 의상은 광택이 나는 긴 코트와, 하나로 연결된 바지와 부츠로 이루어졌다.","grammar":[]},{"n":3,"en":"Their shirts were fastened, and they wore hats and gloves made of goat skin.","ko":"셔츠가 끝까지 채워졌고, 염소 가죽으로 만든 모자와 장갑을 착용했다.","grammar":[]},{"n":4,"en":"The doctors also had a stick that they used to touch or push away the sick people.","ko":"그들은 또한 아픈 사람들을 만지거나 밀쳐내는 데 사용하는 막대기를 가지고 있었다.","grammar":[]},{"n":5,"en":"The most unusual part of the costume was the mask: It had glasses and a long nose like a bird's beak, which was filled with herbs and other things that smelled good.","ko":"의상에서 가장 특이한 부분은 마스크였다. 안경과 새 부리 같은 긴 코가 있었고 허브와 좋은 냄새가 나는 것들로 가득 차 있었다.","grammar":[{"label":"which가 받는 것","explanation":"which was filled with herbs는 새 부리 같은 긴 코를 설명합니다. 허브가 의사들의 믿음에서 어떤 역할인지 뒤 문장과 연결하세요."}]},{"n":6,"en":"The doctors thought that the plague was caused by bad air that could disrupt the body's internal balance.","ko":"의사들은 흑사병이 몸의 내부 균형을 깨뜨릴 수 있는 나쁜 공기 때문에 발생한다고 생각했다.","grammar":[]},{"n":7,"en":"They hoped that the herbs in the mask would filter the air and protect them from getting sick.","ko":"그들은 마스크의 허브가 공기를 걸러내고 병에 걸리지 않도록 보호해 주기를 바랐다.","grammar":[{"label":"would filter ... and protect","explanation":"would 뒤에 filter와 protect가 병렬입니다. 둘 다 의사들이 바란 효과이지 입증된 효과가 아닙니다."}]}],"structure":[],"flow":[{"label":"상황","text":"흑사병이 유럽에서 많은 생명을 앗아가자 일부 의사들이 환자를 치료했다.","refs":[1],"sentences":"S1"},{"label":"옷과 도구","text":"몸을 덮는 의복, 막대기와 특이한 가면을 사용했다.","refs":[2,3,4,5],"sentences":"S2 · S3 · S4 · S5"},{"label":"당시 설명","text":"의사들은 나쁜 공기를 원인으로 생각했다.","refs":[6],"sentences":"S6"},{"label":"기대","text":"허브가 공기를 걸러 자신들을 지킬 것이라 바랐다.","refs":[7],"sentences":"S7"}],"checks":[{"type":"핵심","q":"의사들이 새 부리 모양 가면에 허브를 채운 이유는?","choices":["나쁜 공기를 걸러 병을 피하려고","박테리아를 직접 관찰하려고","환자에게 약초를 먹이려고"],"answer":0,"why":"나쁜 공기를 걸러 병을 피하려고","refs":[5,6,7]},{"type":"근거","q":"의사들이 환자와 거리를 둘 때 쓴 도구는?","choices":["안경","가죽 장갑","막대기"],"answer":2,"why":"막대기","refs":[4]},{"type":"판단","q":"원문이 확정한 내용과 다른 것은?","choices":["가면의 긴 코에는 허브가 들어 있었다.","허브가 흑사병을 실제로 예방했다.","의사들은 나쁜 공기를 병의 원인으로 생각했다."],"answer":1,"why":"허브가 흑사병을 실제로 예방했다.","refs":[5,6,7]}],"key_sentence_en":"They hoped that the herbs in the mask would filter the air and protect them from getting sick.","key_sentence_ko":"그들은 마스크의 허브가 공기를 걸러내고 병에 걸리지 않도록 보호해 주기를 바랐다."},{"id":"l3-fr-83","title":"83쪽 · 믿음에서 의학적 근거로","lead":"첫 문장의 But가 무엇을 뒤집는지, 그 다음 과거와 현재를 어떻게 비교하는지 보세요.","core":"흑사병의 실제 원인은 박테리아였고 옛 의상의 보호 효과는 없었지만, 오늘날에는 의학과 보호 장비가 발달했다. 의료인에게 의지하는 점은 이어진다.","diagram":{"kind":"compare","title":"옛 믿음과 현재의 대처","items":[{"head":"과거 · 틀린 설명","body":"실제 원인은 박테리아. 동물→사람, 벼룩 물림·환자 접촉으로 퍼질 수 있었다. 옛 의복은 충분히 보호하지 못했다.","refs":[1,2,3,4]},{"head":"현재 · 달라진 방법","body":"현대 의학으로 박테리아·바이러스를 탐지·대응하고, 연구·치료에 보호 장비를 사용한다.","refs":[5,6,7]}],"takeaway":"변한 것은 병을 이해하고 대응하는 방법; 변하지 않은 것은 의료인과 과학자에게 의지하는 마음이다."},"blocking_vocab":[{"word":"bacteria","meaning":"박테리아, 세균"},{"word":"flea","meaning":"벼룩"},{"word":"protective gear","meaning":"보호 장비"},{"word":"reliance","meaning":"신뢰, 의지"}],"sentences":[{"n":1,"en":"But they were wrong.","ko":"하지만 그들은 틀렸다.","grammar":[{"label":"But they were wrong","explanation":"they는 앞쪽 의사들입니다. 그들이 틀린 것은 ‘나쁜 공기’라는 병원인 설명과 보호 기대입니다."}]},{"n":2,"en":"The plague was caused by bacteria that could spread from animals to people.","ko":"흑사병은 동물에서 사람으로 퍼질 수 있는 박테리아에 의해 발생했다.","grammar":[]},{"n":3,"en":"The bacteria could also spread through flea bites or contact with sick people.","ko":"박테리아는 벼룩에 물리거나 아픈 사람과의 접촉을 통해서도 퍼질 수 있었다.","grammar":[]},{"n":4,"en":"The doctors' costume and methods did not really protect them from the plague.","ko":"의사들의 의복과 방법은 실제로 흑사병으로부터 그들을 보호하지 못했다.","grammar":[]},{"n":5,"en":"Things have greatly changed since then.","ko":"그 이후 상황이 크게 바뀌었다.","grammar":[]},{"n":6,"en":"With modern medicine, we detect and counter bacteria and viruses swiftly.","ko":"현대 의학으로 우리는 박테리아와 바이러스를 신속하게 탐지하고 대응할 수 있게 되었다.","grammar":[]},{"n":7,"en":"Protective gear protects us during virus research and patient treatment.","ko":"보호 장비는 바이러스 연구와 환자 치료 과정에서 우리를 보호해 준다.","grammar":[]},{"n":8,"en":"Yet, our reliance on brave doctors and scientists remains unchanged, as they combat unseen enemies to protect humanity.","ko":"하지만 인류를 보호하기 위해 보이지 않는 적과 싸우는 용감한 의사와 과학자들에 대한 우리의 신뢰는 변하지 않았다.","grammar":[{"label":"reliance ... remains","explanation":"주어의 중심은 복수형 doctors and scientists가 아니라 단수 reliance입니다. 그래서 remains를 씁니다."}]}],"structure":[],"flow":[{"label":"반전","text":"앞쪽 의사들의 믿음은 틀렸다.","refs":[1],"sentences":"S1"},{"label":"실제 원인","text":"흑사병은 박테리아로 생기며 여러 경로로 전파될 수 있었다.","refs":[2,3],"sentences":"S2 · S3"},{"label":"옛 방법의 한계","text":"당시의 의복과 방법은 의사를 실제로 보호하지 못했다.","refs":[4],"sentences":"S4"},{"label":"현재와 지속","text":"의학·보호 장비는 달라졌지만 의료인과 과학자에게 의지하는 점은 남았다.","refs":[5,6,7,8],"sentences":"S5 · S6 · S7 · S8"}],"checks":[{"type":"핵심","q":"옛날과 오늘날을 비교할 때 맞는 것은?","choices":["오늘날에도 옛날 가면과 허브만을 사용한다.","의학적 대응은 변했지만 의료인에게 의지하는 마음은 이어진다.","흑사병은 나쁜 공기 때문에 발생했다는 설명이 확정되었다."],"answer":1,"why":"의학적 대응은 변했지만 의료인에게 의지하는 마음은 이어진다.","refs":[1,4,5,6,7,8]},{"type":"근거","q":"본문이 제시한 박테리아 전파 경로는?","choices":["벼룩 물림 또는 환자 접촉","허브 냄새","의사의 긴 코트"],"answer":0,"why":"벼룩 물림 또는 환자 접촉","refs":[2,3]},{"type":"지칭","q":"But they were wrong.에서 they는?","choices":["흑사병 박테리아","앞쪽의 흑사병 의사들","오늘날의 과학자들"],"answer":1,"why":"앞쪽의 흑사병 의사들","refs":[1]}],"key_sentence_en":"Yet, our reliance on brave doctors and scientists remains unchanged, as they combat unseen enemies to protect humanity.","key_sentence_ko":"하지만 인류를 보호하기 위해 보이지 않는 적과 싸우는 용감한 의사와 과학자들에 대한 우리의 신뢰는 변하지 않았다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 진주고2 교과서 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button>${s.grammar?.length?` <button class="reveal grammar-open" data-toggle="grammar">문법 포인트</button>`:''}<p class="translation">${esc(s.ko)}</p>${s.grammar?.length?`<div class="grammar-panel">${s.grammar.map(g=>`<div class="grammar-item"><b>${esc(g.label)}</b><p>${esc(g.explanation)}</p>${g.transform_value?`<small>시험에서는 이렇게 바꿀 수 있어요.</small><p class="grammar-transform">${esc(g.transform_value)}</p>`:''}</div>`).join('')}</div>`:''}</div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.parentElement.querySelector('.translation');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='grammar'){const target=btn.parentElement.querySelector('.grammar-panel');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'문법 닫기':'문법 포인트'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

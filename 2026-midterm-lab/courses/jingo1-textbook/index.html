</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">JINJU HIGH SCHOOL · GRADE 1</p><h1>공통영어2 교과서</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">교과서 1·2과 본문과 Special Lesson 1을 연결했습니다. Special Lesson은 학교 교사용 설명자료의 원문·해석을 사용했습니다.</div><div class="units" id="units"></div><p class="subnote">단원을 고른 뒤 구간별로 읽고, 한눈에 정리한 흐름과 영어 근거를 확인하세요.</p></main>
<script id="course-data" type="application/json">{"course":{"id":"jingo1-textbook","title":"진주고1 공통영어2 교과서","grade":"고1"},"units":[{"id":"l1","label":"1과 · Bonding with Others","scope":"17–20쪽 본문","passages":[{"id":"l1-17","title":"17쪽 · 숲에서 길을 잃다","core":"산불로 표지판이 훼손되어, 익숙한 숲을 걷던 Compean이 길을 잃는다."},{"id":"l1-18","title":"18쪽 · 사진은 보냈지만 위치는 모른다","core":"Compean은 마지막 배터리로 사진을 보냈지만, 흐린 화질과 꺼진 위치 설정 탓에 경찰은 위치를 찾지 못한다."},{"id":"l1-19","title":"19쪽 · 사진 속 단서를 읽다","core":"Ben Kuo는 검은 재에서 산불을, 푸른 식생에서 산의 남쪽을 추론한다."},{"id":"l1-20","title":"20쪽 · 사진과 위성 영상을 맞춰 보다","core":"Kuo가 사진과 위성 이미지를 맞춰 위치를 알려 주자 경찰이 Compean을 구조한다."}]},{"id":"l2","label":"2과 · What Keeps Us Moving Forward?","scope":"37–40쪽 본문","passages":[{"id":"l2-37","title":"37쪽 · 작은 흔적에서 사람을 찾기","core":"과학 수사는 현장의 흔적을 모으고 분석해 범인을 찾으며, Lee는 이 분야의 발전에 기여했다."},{"id":"l2-38","title":"38쪽 · 늦게 시작한 Lee의 선택","core":"의학 진출을 막힌 Lee는 훗날 Magrath의 영향으로 법의학을 공부하고 학교의 교육 기반을 세웠다."},{"id":"l2-39","title":"39쪽 · 제도와 현장 훈련을 함께 바꾸다","core":"Lee는 검시관 제도를 넓히고, 증거를 훼손하던 형사들에게 미니어처로 세심한 관찰을 가르치려 했다."},{"id":"l2-40","title":"40쪽 · 미니어처로 단서를 보는 법을 배우다","core":"Lee의 미니어처 훈련은 형사들의 관찰력을 키워 사건 해결을 도왔고, 그녀의 법의학 기여는 널리 인정받았다."}]},{"id":"sl1","label":"Special Lesson 1 · A Wonder under the Waves","scope":"본문 6구간","passages":[{"id":"sl1-01","title":"Special Lesson 1 · 1. 문어를 만나기 전","core":"여러 생명체 가운데 문어를 소개하고, 살아남는 데 도움이 되는 특징을 살펴보겠다고 예고한다."},{"id":"sl1-02","title":"Special Lesson 1 · 2. 팔에도 퍼진 신경계","core":"문어는 신경 세포의 절반 이상이 팔에 있고, 팔들이 직접 소통하며 먹이 찾는 방법을 정한다. ‘뇌가 아홉 개’라는 말은 비유이지 정확한 과학적 설명은 아니다."},{"id":"sl1-03","title":"Special Lesson 1 · 3. 눈 깜짝할 새의 위장","core":"문어는 피부색 세포에 붙은 근육을 움직여 색을 바꾸고, 숨거나 먹잇감에 다가간다. 변화에는 0.1초도 걸리지 않는다."},{"id":"sl1-04","title":"Special Lesson 1 · 4. 다시 자라는 팔","core":"문어는 잃은 팔의 세포·조직을 다시 만들고 약 130일 뒤 거의 원래와 같은 기능의 팔을 얻는다."},{"id":"sl1-05","title":"Special Lesson 1 · 5. 푸른 피와 세 심장","core":"문어의 피는 구리 함유 단백질 때문에 파랗고 차가운 곳에서 산소를 잘 옮긴다. 이 피를 순환시키기 위해 세 심장이 일한다."},{"id":"sl1-06","title":"Special Lesson 1 · 6. 문어가 남기는 생각","core":"문어의 여러 능력은 지구 생명의 다양성을 떠올리게 하며, 앞으로도 놀라운 동물이 발견될 수 있다."}]}]}</script><script>

칙은 남는다."}, {"title": "No maths involved의 역설", "text": "사람을 끌기 위해 수학이 아니라고 광고하지만, 추론과 논리 자체가 수학이라는 점을 비꼰다."}], "learning_visual": {"layout": "compare-conclusion", "preview_mode": "image", "preview_title": "스도쿠 숫자를 모양으로 바꿔도 풀 수 있을까?", "preview_caption": "숫자 1~9의 크기가 아니라 서로 다른 아홉 기호의 배치 규칙을 보자.", "preview_items": [{"label": "겉모습", "text": "1~9 숫자", "refs": [2, 3]}, {"label": "실제 원리", "text": "서로 다른 9개 기호의 패턴", "refs": [4, 5, 6]}], "title": "숫자가 없어도 남는 수학", "items": [{"label": "스도쿠 규칙", "text": "각 행·열·3×3 칸에 아홉 기호가 한 번씩 들어간다", "refs": [2, 3]}, {"label": "숫자를 바꿔도", "text": "1~9를 문자나 모양으로 바꿔도 같은 규칙이 작동한다", "refs": [4, 5, 6]}, {"label": "결론", "text": "수학은 숫자 계산만이 아니라 패턴·구조·연결을 다룬다", "refs": [1, 7, 8, 9, 10]}], "takeaway": "신문의 '수학은 없다'는 문구를 글쓴이는 반박한다. 스도쿠의 논리와 패턴 자체가 수학이라는 뜻이다."}}, {"id": "q37", "source_label": "2026년 9월 고1 · 37번", "sentences": [{"n": 1, "en": "Even before telescopes existed, people looked out into space and tried to understand the universe.", "ko": "망원경이 존재하기도 전에, 사람들은 우주 로 밖을 내다보았고 우주를 이해하려고 노력했다 ."}, {"n": 2, "en": "The Egyptians, Babylonians, Greeks, and Maya were among the first peoples to map the movements of the stars.", "ko": "이집트인, 바빌로니아인, 그리스인, 그리고 마 야인들은 별들의 움직임을 지도로 만든 최초의 민족 중에 있었다."}, {"n": 3, "en": "In Europe, a 16th-century Polish mathematician named Nicolaus Copernicus put forth a revolutionary idea.", "ko": "유럽에서는, Nicolaus Copernicus라고 불리는 16세기의 폴란드 수학자가 한 가지 혁명적인 아이디어를 제기했다 ."}, {"n": 4, "en": "Copernicus watched the stars and took measurements by eye.", "ko": "Copernicus는 별들을 관찰했고 맨눈으로 측정했다 ."}, {"n": 5, "en": "He concluded that the view of the universe accepted at the time ─that the Sun traveled around Earth ─was wrong, and that it was in fact Earth that traveled around the Sun.", "ko": "그는 그 당시에 받아들여진 우주에 대한 관점, 즉 태양이 지구 주위를 이동했다는 것이 틀렸고, 태양 주위를 이동한 것은 사실 지구였다고 결론지었다."}, {"n": 6, "en": "Despite widespread objections to his ideas, he published his theory in a book.", "ko": "그의 아이디어에 대해 널리 퍼진 반대에도 불구하고 , 그는 한 권의 책에 그의 이론을 출판했다."}, {"n": 7, "en": "Later astronomers built on Copernicus’ work.", "ko": "나중에 천문학자들은 Copernicus의 연구를 바탕으로 삼았다 ."}, {"n": 8, "en": "Technological improvements led to the development of the telescope in the early 17th century.", "ko": "기술적인 개선은 17세기 초에 망원경의 발전으로 이어졌다."}, {"n": 9, "en": "Using a telescope, the Italian scientist Galileo Galilei discovered the four largest moons of Jupiter and observed craters on Earth’s Moon.", "ko": "망원경을 사용하여, 이탈리아 과학자 Galileo Galilei는 목성의 네 개의 가장 큰 위성을 발견했고 지구의 달에 있는 분화구를 관찰했다 ."}, {"n": 10, "en": "He also confirmed that Copernicus’ theory was correct.", "ko": "그는 또한 Copernicus의 이론이 옳았음을 확증했다 ."}, {"n": 11, "en": "Over the centuries, scientific discoveries and information from telescopes advanced our knowledge of how the universe works.", "ko": "수 세기에 걸쳐, 망원경으로부터 온 과학적 발견과 정보는 우주가 어떻게 작동하는지에 대한 우리의 지식을 전진시켰다 ."}], "core": "맨눈의 관찰에서 망원경으로 이어지며 우주에 대한 앎이 나아갔다.", "flow": [{"label": "배경", "sentences": "S1–2", "text": "망원경 이전에도 사람들은 우주를 이해하려 했고 옛 민족들이 별을 지도로 남겼다", "refs": [1, 2]}, {"label": "인물", "sentences": "S3–4", "text": "16세기 코페르니쿠스가 맨눈으로 재며 혁명적인 생각을 내놓는다", "refs": [3, 4]}, {"label": "주장", "sentences": "S5–6", "text": "도는 것은 태양이 아니라 지구라고 결론짓고 반대에도 책으로 펴냈다", "refs": [5, 6]}, {"label": "이음", "sentences": "S7–8", "text": "뒷사람들이 그 연구를 발판 삼았고 17세기 초 망원경이 나온다", "refs": [7, 8]}, {"label": "확증", "sentences": "S9–11", "text": "갈릴레이가 목성의 위성과 달의 분화구를 보고 그 이론이 옳음을 확인했다", "refs": [9, 10, 11]}], "structure": [{"title": "맨눈의 시대", "text": "옛 민족의 별 지도와 코페르니쿠스의 맨눈 측정. 도구 없이 얻은 결론이다"}, {"title": "망원경의 시대", "text": "17세기 초 망원경이 나오고 갈릴레이가 눈으로 확인해 그 결론을 확증한다"}], "short_title": "37번 · 맨눈에서 망원경까지", "lead": "새 도구는 이미 나온 생각을 어떻게 더 확실한 지식으로 바꾸었을까?", "image": "../../assets/g1-37-telescope-knowledge.webp", "image_alt": "맨눈으로 별을 관찰하고 지도를 그리는 사람들과 초기 망원경으로 목성의 위성과 달의 분화구를 보는 장면", "image_caption": "맨눈의 측정에서 시작한 우주 이해는 망원경 관찰로 확인되고 더 멀리 나아갔다.", "before_question": "망원경은 코페르니쿠스의 생각에 어떤 역할을 했을까?", "prediction_choices": ["그의 이론을 처음 떠올리게 했다", "후대 관찰로 그의 이론을 확증했다", "그의 맨눈 측정을 불가능하게 했다"], "prediction_actual": "코페르니쿠스는 맨눈으로 이론을 세웠고, 뒤의 갈릴레이가 망원경 관찰로 그 이론을 확인했다.", "blocking_vocab": [{"word": "put forth", "meaning": "제시하다"}, {"word": "by eye", "meaning": "맨눈으로"}, {"word": "widespread objection", "meaning": "널리 퍼진 반대"}, {"word": "build on", "meaning": "~을 바탕으로 발전시키다"}, {"word": "confirm", "meaning": "확증하다"}], "visual_links": [{"label": "맨눈 관찰", "refs": [1, 2, 3, 4]}, {"label": "망원경의 등장", "refs": [7, 8]}, {"label": "새 관찰과 확증", "refs": [9, 10, 11]}], "core_check": {"q": "글의 전개를 가장 정확하게 요약한 것은?", "choices": ["망원경 이전의 우주 관찰은 아무런 지식을 만들지 못했다.", "맨눈 관찰로 나온 이론이 망원경의 발견과 확증을 거치며 우주 지식을 발전시켰다.", "갈릴레이는 코페르니쿠스 이론이 틀렸음을 확인했다."], "answer": 1, "why": "S1~6은 맨눈 관찰과 코페르니쿠스 이론을, S7~11은 망원경과 갈릴레이의 확증을 잇는다.", "refs": [1, 4, 5, 7, 8, 9, 10, 11]}, "precision": [{"type": "근거·지칭", "q": "S10의 He가 가리키는 인물은?", "choices": ["Nicolaus Copernicus", "Galileo Galilei", "Theodore M. Porter"], "answer": 1, "why": "S9의 주어 Galileo Galilei를 이어 받아 그가 코페르니쿠스 이론을 확증했다고 한다.", "refs": [9, 10]}, {"type": "변형 탐지", "q": "원문의 시간 순서와 일치하는 문장을 고르세요.", "choices": ["Copernicus measured by eye before Galileo used a telescope to confirm his theory.", "Galileo confirmed the theory before Copernicus made naked-eye measurements."], "answer": 0, "why": "S4~5의 맨눈 측정과 결론이 S8~10의 망원경 관찰과 확증보다 앞선다.", "refs": [4, 5, 8, 9, 10]}], "supplement": [{"title": "도구 이전에도 과학은 있었다", "text": "망원경은 관찰을 크게 확장했지만, 별을 지도화하고 맨눈으로 측정하는 시도는 이미 있었다."}, {"title": "build on의 역할", "text": "후대 과학자가 앞선 연구를 버리는 것이 아니라 발판으로 삼아 새 도구와 증거로 발전시킨다는 뜻이다."}], "learning_visual": {"layout": "timeline", "preview_title": "망원경이 없던 때에도 우주를 알 수 있었을까?", "preview_caption": "맨눈 관찰→코페르니쿠스의 주장→망원경 관찰을 시간 순서로 보자.", "preview_items": [{"label": "망원경 이전", "text": "별의 움직임을 눈으로 관찰", "refs": [1, 2, 3, 4]}, {"label": "망원경 이후", "text": "목성의 달과 달 표면 관찰", "refs": [8, 9]}], "title": "관찰 도구가 넓힌 우주 지식", "items": [{"label": "옛 관찰", "text": "여러 문명이 별의 움직임을 기록했다", "refs": [1, 2]}, {"label": "16세기 코페르니쿠스", "text": "맨눈 측정으로 지구가 태양 주위를 돈다고 주장했다", "refs": [3, 4, 5, 6]}, {"label": "17세기 망원경", "text": "기술 발전으로 더 자세히 관찰할 도구가 생겼다", "refs": [7, 8]}, {"label": "갈릴레오와 이후", "text": "목성의 큰 달과 달의 분화구를 관찰하고 지식을 확장했다", "refs": [9, 10, 11]}], "takeaway": "코페르니쿠스가 망원경을 썼다는 뜻이 아니다. 그의 맨눈 관찰 뒤 망원경이 개발되었다."}}, {"id": "q38", "source_label": "2026년 9월 고1 · 38번", "sentences": [{"n": 1, "en": "To harness the full potential of units of measurement, we need some degree of consistency.", "ko": "측정 단위의 최대 잠재력을 이용하려면 우 리는 어느 정도의 일관성 이 필요하다."}, {"n": 2, "en": "Subjective measures contain useful knowledge, but this can be difficult to share, based as it is on an individual’s experience.", "ko": "주관적인 측정은 유용한 지식을 포함하고 있지만, 그 지식은 개인의 경험에 기반하기 때문에 공유하기 어려울 수 있다."}, {"n": 3, "en": "The historian of science Theodore M. Porter describes measurement as a ‘technology of distance’: a tool that uses shared rules to bridge differences of culture and geography, allowing for the exchange of information.", "ko": "과학사학자 Theodore M. Porter는 측정을 ‘ 거리의 기술 ’이라고 묘사한다. 즉, 문화와 지리의 차이를 메우기 위해 공유된 규칙을 사용하여 정보의 교환을 가능하게 하는 도구이다."}, {"n": 4, "en": "Following this logic, if measurement is another sort of language, then just as with words, individual units need reliable definitions in order to communicate.", "ko": "이러한 논리에 따라서, 측정이 또 다른 종류의 언어라면, 단어와 마찬가지로, 개별 단위는 의사소통을 하기 위해 신뢰할 만한 정의가 필요하다 ."}, {"n": 5, "en": "In the earliest societies, these definitions might need to be shared no more widely than a single settlement, meaning that the definition can be no more complex than knowing that a unit was equal to a certain body part.", "ko": "가장 초기의 사회에서, 이러한 정의는 하나의 정착지 정도의 범위로만 공유될 필요가 있었을 것이고, 이는 그 정의가 한 단위는 특정 신체 분위와 대등하다는 것을 아는 정도로만 복잡하면 된다는 것을 의미한다."}, {"n": 6, "en": "As these communities grew in size, though, the inadequacies of this system would become evident.", "ko": "하지만 이러한 공동체들이 규모가 커지면서, 이 체계의 불충분함이 분명해졌다 ."}, {"n": 7, "en": "Imagine a disagreement over trade or tribute: it is a moment of conflict that demands greater consistency in measurement.", "ko": "무역이나 조공에 관한 불일치를 상상해 보아라. 그것은 측정에 있어 더 큰 일관성을 요구하는 갈등의 순간이다."}], "core": "측정이 언어처럼 통하려면 단위마다 믿을 만한 정의와 일관성이 있어야 한다.", "flow": [{"label": "일관성의 필요", "sentences": "S1–2", "text": "측정 단위에는 일관성이 필요하지만 개인의 주관적 경험은 다른 사람과 나누기 어렵다.", "refs": [1, 2]}, {"label": "거리의 기술", "sentences": "S3–4", "text": "측정은 서로 다른 문화와 지리를 잇는 공유 규칙이며 언어의 단어처럼 믿을 만한 정의가 필요하다.", "refs": [3, 4]}, {"label": "작은 공동체", "sentences": "S5", "text": "작은 정착지에서는 몸의 한 부위를 기준으로 삼아도 통할 수 있었다.", "refs": [5]}, {"label": "규모의 변화", "sentences": "S6–7", "text": "공동체와 교역이 커지자 그런 기준의 허점이 드러나 더 큰 일관성이 필요해졌다.", "refs": [6, 7]}], "structure": [{"title": "문제 — 제각각인 단위", "text": "주관적 측정과 몸의 한 부위. 공동체가 커지면 서로 통하지 않는다"}, {"title": "해결 — 공유된 규칙", "text": "믿을 만한 정의를 갖춘 단위. 문화와 지리의 거리를 메워 정보를 주고받게 한다"}], "short_title": "38번 · 측정은 공유하는 언어다", "lead": "사람마다 자기 팔 길이를 자로 쓰면 멀리 떨어진 사람과도 정확히 거래할 수 있을까?", "image": "../../assets/g1-38-measurement-language.webp", "image_alt": "시장 상인들이 각자의 팔 길이로 천을 재며 다투고, 가운데의 공통 측정 막대로 같은 길이를 확인하는 그림", "image_caption": "공동체가 커질수록 개인의 몸이 아니라 모두가 공유하는 단위와 일관된 정의가 필요하다.", "before_question": "측정 단위가 멀리 떨어진 사람 사이에서도 통하려면 무엇이 필요할까?", "prediction_choices": ["각자의 경험에 따른 주관적 기준", "공유된 규칙과 믿을 만한 정의", "한 정착지 안에서만 쓰는 몸의 한 부위"], "prediction_actual": "측정이 정보를 주고받는 언어가 되려면 공유된 규칙, 믿을 만한 정의, 일관성이 필요하다.", "blocking_vocab": [{"word": "harness", "meaning": "활용하다"}, {"word": "consistency", "meaning": "일관성"}, {"word": "bridge", "meaning": "차이를 메우다"}, {"word": "reliable definition", "meaning": "믿을 만한 정의"}, {"word": "inadequacy", "meaning": "불충분함"}], "visual_links": [{"label": "개인 기준의 차이", "refs": [2, 5]}, {"label": "공유된 규칙", "refs": [1, 3, 4]}, {"label": "거래 갈등", "refs": [6, 7]}], "core_check": {"q": "측정이 ‘거리의 기술’이 되기 위한 조건은?", "choices": ["사람마다 다른 경험을 그대로 유지하는 것", "단위에 공유된 규칙과 믿을 만한 정의를 두어 일관되게 쓰는 것", "모든 단위를 신체 부위로만 정하는 것"], "answer": 1, "why": "S1·S3~4는 일관성, 공유된 규칙, 믿을 만한 정의가 문화와 지리 차이를 메운다고 말한다.", "refs": [1, 3, 4]}, "precision": [{"type": "근거·지칭", "q": "S5의 these definitions가 가리키는 것은?", "choices": ["개별 단위의 믿을 만한 정의", "개인의 주관적 경험", "무역과 조공의 갈등"], "answer": 0, "why": "S4의 individual units need reliable definitions를 받아 초기 사회에서 그 정의가 어느 범위까지 공유됐는지 설명한다.", "refs": [4, 5]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["As communities grew, body-based local units became increasingly inadequate.", "Larger communities needed less consistency in measurement than small settlements."], "answer": 0, "why": "S5~7은 공동체가 커지자 단순한 몸 기준의 허점이 드러나 더 큰 일관성이 필요해졌다고 한다.", "refs": [5, 6, 7]}], "supplement": [{"title": "technology of distance", "text": "측정은 멀리 떨어진 사람도 같은 규칙으로 정보를 교환하게 하므로 문화와 지리의 거리를 메우는 기술이다."}, {"title": "언어와 단위의 유추", "text": "단어에 공유된 뜻이 필요하듯, 단위에도 공유된 정의가 있어야 의사소통이 된다."}], "learning_visual": {"layout": "principle-timeline", "preview_title": "서로 다른 사람이 같은 길이를 말하려면?", "preview_caption": "각자의 몸을 기준으로 한 단위가 왜 먼 곳까지는 통하지 않는지 생각해 보자.", "preview_items": [{"label": "작은 공동체", "text": "몸의 일부를 단위로 삼아도 통할 수 있다", "refs": [5]}, {"label": "더 넓은 거래", "text": "그 기준만으로는 분쟁이 생길 수 있다", "refs": [6, 7]}], "title": "측정이 '멀리 통하는 언어'가 되는 조건", "items": [{"label": "원리 · 공유할 언어", "text": "측정은 다른 사람과 나누려면 믿을 만한 단위 정의가 필요하다", "refs": [1, 2, 3, 4]}, {"label": "작은 공동체", "text": "몸의 일부를 기준으로 삼아도 통할 수 있었다", "refs": [5]}, {"label": "범위가 커지면", "text": "공동체와 교역이 넓어져 그런 기준의 한계가 드러난다", "refs": [6]}, {"label": "거래와 갈등", "text": "멀리 떨어진 사람도 인정할 일관된 측정이 필요하다", "refs": [7]}], "takeaway": "'측정은 언어'라는 비유의 핵심은 숫자 자체가 아니라 함께 쓰는 정의가 거리를 넘어 뜻을 전달한다는 점이다."}}, {"id": "q39", "source_label": "2026년 9월 고1 · 39번", "sentences": [{"n": 1, "en": "With millions of members in a colony, leaf-cutter ants cultivate their own food.", "ko": "한 군락에 수백만 마리의 구성원이 있는 절엽 개미는 그들만의 먹이를 경작한다 ."}, {"n": 2, "en": "Just like humans, they’re farmers.", "ko": "인간과 마찬가지로, 그들은 농부이다 ."}, {"n": 3, "en": "Some of the ants set forth from the nest to find fresh vegetation; when they find it, they chew off large pieces that they carry back to the nest.", "ko": "몇몇 개미는 신선한 식물을 찾기 위해 둥지를 떠난다 . 그리고 그들이 그것을 찾으면, 그들은 그들이 둥지로 다시 짊어지고 올 큰 조각을 씹어 떼어낸다."}, {"n": 4, "en": "However, the ants don’t eat these leaves.", "ko": "하지만, 개미는 이 잎을 먹지 않는다 ."}, {"n": 5, "en": "Instead, smaller worker ants take the pieces of leaves, chew them into smaller pieces, and use these as fertilizer to grow fungus in large underground ‘gardens.’", "ko": "대신에, 더 작은 일개미가 잎 조각을 가져다가 그것들을 더 작은 조각으로 씹고, 그것들을 커다란 지하 ‘정원’에서 균류를 키우기 위한 비료 로 사용한다."}, {"n": 6, "en": "The ants feed the fungus, and the fungus blossoms into small fruiting bodies which the ants later eat.", "ko": "개미는 균류에게 먹이를 주고, 균류는 개미가 나중에 먹을 작은 자실체로 피어난다 ."}, {"n": 7, "en": "Using this successful farming strategy, the ants build enormous nests underground, something spanning hundreds of square meters.", "ko": "이 성공적인 농업 전략을 사용하여, 개미는 지하에 거대한 둥지 , 수백 제곱미터에 달하는 것을 짓는다."}, {"n": 8, "en": "Just like humans, they have perfected an agricultural civilization.", "ko": "인간과 마찬가지로, 그들은 농업 문명을 완성했다 ."}], "core": "잎꾼개미는 잎을 먹지 않고 그것으로 균류를 길러 먹는 농부다.", "flow": [{"label": "소개", "sentences": "S1–2", "text": "수백만이 사는 군락의 잎꾼개미는 먹이를 스스로 기르는 농부다", "refs": [1, 2]}, {"label": "채집", "sentences": "S3", "text": "밖에 나가 잎을 씹어 떼어 둥지로 나른다", "refs": [3]}, {"label": "반전", "sentences": "S4", "text": "그런데 그 잎을 먹지는 않는다", "refs": [4]}, {"label": "재배", "sentences": "S5–6", "text": "잘게 씹어 지하 정원의 비료로 삼아 균류를 기르고 그 자실체를 먹는다", "refs": [5, 6]}, {"label": "규모", "sentences": "S7–8", "text": "그 방식으로 수백 제곱미터의 둥지를 짓고 사람처럼 농업 문명을 이루었다", "refs": [7, 8]}], "structure": [{"title": "원인 — 잎을 비료로 쓰는 방식", "text": "잎을 먹지 않고 잘게 씹어 균류를 기르는 데 쓴다"}, {"title": "결과 — 농업 문명", "text": "자실체라는 안정된 먹이와 수백 제곱미터의 둥지를 얻는다"}], "short_title": "39번 · 잎을 먹지 않는 개미 농부", "lead": "잎꾼개미가 잎을 둥지로 가져가면서도 그 잎을 먹지 않는다면 무엇에 쓸까?", "image": "../../assets/g1-39-ant-farming.webp", "image_alt": "지상에서는 잎 조각을 나르고 지하에서는 잎을 잘게 처리해 균류 정원과 자실체를 기르는 잎꾼개미 둥지의 단면 그림", "image_caption": "잎은 먹이가 아니라 지하 정원의 비료가 되고, 개미가 실제로 먹는 것은 길러 낸 균류의 자실체다.", "before_question": "개미가 나른 잎은 결국 어디에 쓰일까?", "prediction_choices": ["개미가 바로 먹는다", "균류를 기르는 비료로 쓴다", "둥지 입구를 막는 벽으로 쓴다"], "prediction_actual": "잎을 잘게 씹어 지하 정원의 비료로 쓰고, 그 위에서 균류를 길러 자실체를 먹는다.", "blocking_vocab": [{"word": "cultivate", "meaning": "경작하다"}, {"word": "set forth", "meaning": "길을 나서다"}, {"word": "vegetation", "meaning": "식물"}, {"word": "fertilizer", "meaning": "비료"}, {"word": "fruiting body", "meaning": "자실체"}], "visual_links": [{"label": "잎 채집", "refs": [3]}, {"label": "잎은 먹지 않음", "refs": [4]}, {"label": "균류 농사", "refs": [5, 6, 7]}], "core_check": {"q": "잎꾼개미를 농부라고 부르는 까닭은?", "choices": ["잎을 직접 먹고 남은 것을 저장해서", "잎을 비료로 사용해 균류를 길러 그 자실체를 먹어서", "사람이 만든 농장에서만 살기 때문에"], "answer": 1, "why": "S4~6은 잎을 먹지 않고 비료로 써 균류를 키운 뒤 자실체를 먹는다고 설명한다.", "refs": [4, 5, 6]}, "precision": [{"type": "근거·지칭", "q": "S4의 these leaves가 가리키는 것은?", "choices": ["개미가 둥지로 가져온 식물의 큰 조각", "균류의 자실체", "지하 정원의 흙"], "answer": 0, "why": "S3에서 신선한 식물에서 떼어 둥지로 가져온 조각을 받는다.", "refs": [3, 4]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Leaf-cutter ants eat the leaves immediately after carrying them underground.", "Leaf-cutter ants use leaf pieces to grow fungus and later eat its fruiting bodies."], "answer": 1, "why": "S4~6의 반전과 재배 과정을 그대로 담는다.", "refs": [4, 5, 6]}], "supplement": [{"title": "반전 문장 S4", "text": "잎을 나르는 장면 때문에 잎을 먹는다고 예상하기 쉽다. However 뒤에서 그 예상을 뒤집는 것이 핵심이다."}, {"title": "농업의 세 단계", "text": "채집한 잎 → 비료 → 균류의 자실체라는 순서를 잡으면 세부 선지의 대상 바꾸기를 피할 수 있다."}], "learning_visual": {"layout": "chain", "preview_mode": "image", "preview_title": "잎꾼개미가 잎을 옮기는 까닭은?", "preview_caption": "잎을 곧바로 먹는지, 다른 먹이를 기르는 데 쓰는지 구분해 보자.", "preview_items": [{"label": "보이는 행동", "text": "큰 잎을 둥지로 운반", "refs": [3]}, {"label": "진짜 목적", "text": "균류를 길러 먹기", "refs": [4, 5, 6]}], "title": "잎에서 개미의 먹이까지", "items": [{"label": "채집", "text": "일부 개미가 식물을 잘라 둥지로 옮긴다", "refs": [1, 2, 3]}, {"label": "가공", "text": "작은 일개미가 잎을 더 잘게 씹는다", "refs": [4, 5]}, {"label": "재배", "text": "잎을 비료로 써 지하 정원에서 균류를 기른다", "refs": [5, 6]}, {"label": "먹이", "text": "나중에 균류의 자실체를 먹는다", "refs": [6, 7, 8]}], "takeaway": "가장 흔한 오독은 '잎을 먹는다'이다. 잎은 균류 재배 재료이고, 실제 먹이는 자란 균류다."}}, {"id": "q40", "source_label": "2026년 9월 고1 · 40번", "sentences": [{"n": 1, "en": "From an evolutionary perspective, self-esteem has developed as a monitoring mechanism for the quality of our relationships.", "ko": "진화적 관점에서, 자아존중감은 우리 관계의 질을 위한 감시 작동 원리로서 발달해 왔다 ."}, {"n": 2, "en": "The system monitors other people’s reactions to our behaviors and sends an alarm that alerts us to any possible changes in our inclusion status.", "ko": "이 시스 템은 우리의 행동에 대한 다른 사람들의 반응을 감시하고, 우리의 포함 상태에서의 어떠한 가능한 변화에 대해 우리를 경계시키는 경보를 보낸다 ."}, {"n": 3, "en": "The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low.", "ko": "이 감시 시스템은 그것이 우리의 관계적 가치가 떨어지거나 낮다는 것을 탐지할 때까지 보통 무의식적으로 작동한다 ."}, {"n": 4, "en": "When the alarm bell rings, the threat to our social bonds is pushed into conscious awareness and we evaluate the situation.", "ko": "경보가 울릴 때, 우리의 사회적 유대에 대한 위협이 의식적 인식으로 밀려 들어오고 우리는 그 상황을 평가한다."}, {"n": 5, "en": "Am I being accepted or am I being pushed out?", "ko": "‘내가 수용되고 있는가 , 아니면 밀려나고 있는가?"}, {"n": 6, "en": "Do I need to adjust my behaviors to fix the relationship?", "ko": "나는 관계를 바로잡기 위해 내 행동을 조정할 필요 가 있는가?’"}, {"n": 7, "en": "With such a high value for survival closely tied with relationships, it makes sense that the way we mobilize our internal resources around relationships would be highly networked in our brain and body.", "ko": "관계와 밀접하게 연결된 생존을 위한 그러한 높은 가치와 함께, 우리가 관계를 중심으로 내부 자원을 동원하는 방식이 우리의 뇌와 신체 내에서 고도로 연결되어있다는 것은 타당하다 ."}, {"n": 8, "en": "It also makes sense that we would develop specific mechanisms to attend to minimizing rejection and enhancing acceptance.", "ko": "우리가 거절을 최소화하고 수용을 높이는 것에 주의를 기울이기 위한 특정한 작동 원리들을 발달시켰다는 점 또한 타당하다."}, {"n": 9, "en": "The continuous scanning is normal, a part of being human.", "ko": "지속적인 점검은 정상적이며, 인간다움의 한 부분 이다."}, {"n": 10, "en": "We all have an interpersonal process of searching for cues from the environment to assess our value in the social structure.", "ko": "우리 모두는 사회적 구조 내에서 우리의 가치를 평가하기 위해 환경에서 단서를 찾는 대인 관계적 과정을 가지고 있다."}], "core": "자아존중감은 관계의 질을 재다가 위험을 알리는 감시 작동 원리다.", "flow": [{"label": "정의", "sentences": "S1", "text": "자아존중감은 관계의 질을 재는 감시 작동 원리로 발달했다", "refs": [1]}, {"label": "작동", "sentences": "S2–3", "text": "남의 반응을 살펴 경보를 내되 관계의 가치가 하락하거나 이미 낮다는 것을 감지할 때까지 대체로 무의식적으로 작동한다", "refs": [2, 3]}, {"label": "경보", "sentences": "S4–6", "text": "울리면 위협이 의식으로 올라오고 받아들여지는지 행동을 바꿔야 하는지 묻는다", "refs": [4, 5, 6]}, {"label": "까닭", "sentences": "S7–8", "text": "생존이 관계에 걸려 있으니 그런 작동 원리가 촘촘히 얽힌 것은 당연하다", "refs": [7, 8]}, {"label": "맺음", "sentences": "S9–10", "text": "끊임없는 점검은 정상이며 우리 모두 환경의 단서로 자기 값을 잰다", "refs": [9, 10]}], "structure": [{"title": "원인 — 관계가 곧 생존", "text": "무리에 들어 있느냐가 살아남는 문제였다"}, {"title": "결과 — 자아존중감이라는 경보", "text": "관계적 가치를 늘 살피다 떨어지면 의식으로 올려 행동을 고치게 한다"}], "short_title": "40번 · 관계를 살피는 자아존중감 경보", "lead": "우리는 왜 다른 사람의 표정과 반응에서 끊임없이 관계의 단서를 찾을까?", "image": "../../assets/g1-40-relational-monitor.webp", "image_alt": "모임 한가운데 사람이 주변 사람들의 표정과 몸짓을 살피고, 비유적인 탐지 원과 작은 경보가 관계 단서를 감지하는 그림", "image_caption": "자아존중감은 관계적 가치가 떨어지는 신호를 감지해 위협을 의식으로 올리는 감시 장치처럼 작동한다.", "before_question": "진화적 관점에서 자아존중감은 무엇을 감시할까?", "prediction_choices": ["학업 성취의 순위", "다른 사람과의 관계의 질과 수용 상태", "신체의 에너지 사용량"], "prediction_actual": "자아존중감은 타인의 반응과 관계적 가치를 살피다가 배제 위험이 생기면 경보를 보낸다.", "blocking_vocab": [{"word": "monitoring mechanism", "meaning": "감시 작동 원리"}, {"word": "inclusion status", "meaning": "집단에 포함된 상태"}, {"word": "relational value", "meaning": "관계적 가치"}, {"word": "social bond", "meaning": "사회적 유대"}, {"word": "cue", "meaning": "단서"}], "visual_links": [{"label": "타인의 반응 감시", "refs": [1, 2, 3]}, {"label": "관계 경보", "refs": [4, 5, 6]}, {"label": "지속적인 단서 탐색", "refs": [9, 10]}], "core_check": {"q": "자아존중감의 기능을 가장 정확하게 설명한 것은?", "choices": ["관계와 무관하게 개인의 능력만 평가한다.", "관계의 질과 수용 상태를 감시하다 위험이 생기면 행동 조정을 검토하게 한다.", "항상 의식적으로 작동해 모든 타인의 반응을 차단한다."], "answer": 1, "why": "S1~6은 관계의 질을 감시하고 가치 하락을 감지하면 경보와 평가가 시작된다고 설명한다.", "refs": [1, 2, 3, 4, 5, 6]}, "precision": [{"type": "근거·지칭", "q": "S2의 The system이 가리키는 것은?", "choices": ["자아존중감이라는 관계 감시 작동 원리", "사회의 경제 구조", "의식적인 기억 체계"], "answer": 0, "why": "S1의 self-esteem ... as a monitoring mechanism을 받아 작동 방식을 설명한다.", "refs": [1, 2]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["The monitoring system usually stays nonconscious until relational value appears to fall.", "Self-esteem stops people from noticing possible rejection or changes in inclusion."], "answer": 0, "why": "S3~4는 평소 무의식적으로 작동하다 관계적 가치 저하를 감지하면 위협을 의식으로 올린다고 한다.", "refs": [3, 4]}], "supplement": [{"title": "경보는 자아존중감 자체의 비유", "text": "실제 종이나 기계가 있다는 뜻이 아니다. 관계 위험을 감지해 주의를 끄는 기능을 경보에 빗댄다."}, {"title": "continuous scanning은 정상", "text": "관계 단서를 찾는 일이 곧 병적 불안이라는 뜻이 아니라 인간에게 자연스러운 과정이라고 결론 낸다."}], "learning_visual": {"layout": "chain", "preview_mode": "image", "preview_title": "자아존중감은 관계에서 무엇을 감지할까?", "preview_caption": "다른 사람의 반응을 살피다가 소속감에 변화가 생기면 경보가 울리는 비유다.", "preview_items": [{"label": "평소", "text": "관계의 신호를 무의식적으로 살핌", "refs": [1, 2, 3]}, {"label": "변화", "text": "배제될 가능성이 감지됨", "refs": [2, 3, 4]}], "title": "관계 신호를 살피는 경보 장치", "items": [{"label": "감시", "text": "다른 사람의 반응과 관계의 가치를 계속 살핀다", "refs": [1, 2, 3, 9, 10]}, {"label": "경보", "text": "소속감이 낮아질 가능성이 보이면 의식에 알린다", "refs": [2, 3, 4]}, {"label": "판단", "text": "받아들여지는지, 밀려나는지 상황을 따져 본다", "refs": [4, 5]}, {"label": "대응", "text": "관계를 고치기 위해 행동을 바꿀지 생각한다", "refs": [6, 7, 8]}], "takeaway": "자아존중감을 점수처럼 높이는 방법에 대한 글이 아니다. 관계 상태를 감지하는 작동 원리를 설명한다."}}, {"id": "q41", "source_label": "2026년 9월 고1 · 41~42번", "sentences": [{"n": 1, "en": "The role of ‘slang’ in popular culture has fundamentally changed because of the internet.", "ko": "대중 문화에서 ‘슬랭’의 역할은 인터넷 때문에 근본적으로 변화해 왔다 ."}, {"n": 2, "en": "Since the emergence of Standard English, the rule makers of language have been in charge, and their prescriptive norms about a ‘correct’ version of the English language have dominated our channels of communication.", "ko": "표준 영어의 등장 이후, 언어 규칙 제정자들이 통제해왔으며, 영어의 ‘올바른’ 형태에 대한 그들의 규범적 기준이 우리의 의사소통 경로를 지배해 왔다."}, {"n": 3, "en": "If you wanted your voice to be heard by the public, you had to work within their limits, conforming to the strict expectations of either print or broadcast media.", "ko": "만약 당신이 당신의 목소리가 대중에게 들리기를 원했다면, 당신은 인쇄 혹은 방송 매체의 엄격한 기대에 순응하며, 그들의 제약 안에서 활동해야만 했다."}, {"n": 4, "en": "Social media completely broke that barrier.", "ko": "소셜 미디어가 그 장벽을 완전히 허물었다 ."}, {"n": 5, "en": "The playing field is now level, and public access is democratized.", "ko": "이제 경쟁 조건은 공평해졌고, 대중의 접근은 민주화 되었다."}, {"n": 6, "en": "Anybody and everybody can become a public figure on the new communicative platforms, meaning that nobody’s left to enforce the old rules.", "ko": "누구나 그리고 모두가 새로운 의사소통 플랫폼에서 공적인 인물이 될 수 있으며, 이는 옛 규칙을 강제하기 위해 남겨진 사람이 아무도 없음 을 의미한다."}, {"n": 7, "en": "TV presenters and journalists might not have been able to use slang, but content creators can.", "ko": "TV 진행자와 기자들은 슬랭을 사용할 수 없었을지도 모르지만, 콘텐츠 제작자들은 할 수 있다 ."}, {"n": 8, "en": "We regularly use words like ‘function’ and ‘side-eye,’ and our influence both legitimizes these terms and gives them a large platform to spread quicker than they could have before.", "ko": "우리는 ‘function’과 ‘side-eye’ 같은 단어를 일상적으로 사용하며, 우리의 영향력은 이러한 용어가 정당한 표현으로 인정받게 하고 그것들이 이전보다 더 빠르게 퍼질 수 있는 큰 플랫폼을 제공한다."}, {"n": 9, "en": "Content creators also come from a greater variety of backgrounds than people working in traditional media.", "ko": "콘텐츠 제작자들은 또한 전통 적인 매체에서 일하는 사람들보다 더 큰 다양한 배경 출신 이다."}, {"n": 10, "en": "This means that slang can more naturally go beyond the economic and social barriers that once limited its growth.", "ko": "이것은 슬랭이 한때 그것의 성장을 제한했던 경제적, 사회적 장벽 을 더 자연스럽게 넘어설 수 있다는 것을 의미한다."}, {"n": 11, "en": "The loose social networks that previously connected us geographically are simply stronger online, and memes are now transmitted at rapid pace.", "ko": "이전에는 지리적으로 우리를 연결했던 느슨한 사회적 네트워크가 온라인상에서는 단순히 더 강하며, 밈은 이제 빠른 속도로 전파된다 ."}], "core": "인터넷이 언어의 문지기를 없애면서 슬랭이 장벽을 넘어 빠르게 퍼진다.", "flow": [{"label": "주제", "sentences": "S1", "text": "인터넷 때문에 대중문화에서 슬랭의 역할이 근본부터 바뀌었다", "refs": [1]}, {"label": "옛날", "sentences": "S2–3", "text": "규칙 제정자들이 의사소통 경로를 쥐고 있어 그들의 제약 안에서만 목소리를 낼 수 있었다", "refs": [2, 3]}, {"label": "전환", "sentences": "S4–5", "text": "소셜 미디어가 그 장벽을 허물어 운동장이 평평해지고 접근이 민주화되었다", "refs": [4, 5]}, {"label": "결과", "sentences": "S6–7", "text": "누구나 공적 인물이 되니 옛 규칙을 강제할 사람이 없고, 제작자는 슬랭을 쓴다", "refs": [6, 7]}, {"label": "작동", "sentences": "S8–9", "text": "우리가 쓰는 말과 영향력이 이런 용어를 정당한 표현으로 인정받게 하며, 제작자들의 배경도 전통 매체보다 다양하다", "refs": [8, 9]}, {"label": "맺음", "sentences": "S10–11", "text": "그래서 슬랭이 경제·사회의 장벽을 넘고 연결은 온라인에서 더 강해져 밈이 빠르게 퍼진다", "refs": [10, 11]}], "structure": [{"title": "전에는 — 문지기가 있었다", "text": "표준 영어의 규칙 제정자와 인쇄·방송의 엄격한 기대. 그 안에서만 말할 수 있었다"}, {"title": "지금은 — 문지기가 없다", "text": "누구나 공적 인물이 되고, 쓰는 말이 곧 용어를 정당한 표현으로 인정받게 하며 빠르게 퍼진다"}], "short_title": "41~42번 · 문지기 없는 언어의 시대", "lead": "인터넷은 누가 공적으로 말할 수 있는지, 어떤 말이 퍼질 수 있는지를 어떻게 바꾸었을까?", "image": "../../assets/g1-41-internet-slang.webp", "image_alt": "엄격한 방송·인쇄의 문과 장벽이 무너지고, 다양한 배경의 콘텐츠 제작자들이 빈 화면과 말풍선으로 서로 연결되는 그림", "image_caption": "소셜 미디어가 언어의 문지기를 없애자 다양한 사람이 쓰는 말이 장벽을 넘어 빠르게 퍼진다.", "before_question": "인터넷이 슬랭의 확산을 바꾼 가장 큰 이유는 무엇일까?", "prediction_choices": ["표준 영어 규칙을 더 엄격하게 만들었기 때문에", "공적 발언의 문지기를 약화시키고 누구나 넓게 말할 수 있게 했기 때문에", "인쇄와 방송만 사용할 수 있게 했기 때문에"], "prediction_actual": "소셜 미디어가 기존 매체의 장벽과 규칙 집행자를 약화시켜 다양한 사람이 쓰는 말이 넓고 빠르게 퍼진다.", "index_numbers": ["41", "42"], "blocking_vocab": [{"word": "prescriptive norm", "meaning": "규범적 기준"}, {"word": "conform to", "meaning": "~에 순응하다"}, {"word": "level playing field", "meaning": "공평한 경쟁 조건"}, {"word": "legitimize", "meaning": "정당한 표현으로 인정받게 하다"}, {"word": "go beyond", "meaning": "~을 넘어가다"}], "visual_links": [{"label": "옛 매체의 문지기", "refs": [2, 3]}, {"label": "장벽 붕괴", "refs": [4, 5, 6]}, {"label": "다양하고 빠른 확산", "refs": [7, 8, 9, 10, 11]}], "core_check": {"q": "인터넷이 슬랭의 역할을 바꾼 과정을 가장 정확하게 설명한 것은?", "choices": ["기존 언어 규칙을 더 강하게 집행해 슬랭을 줄였다.", "공적 접근을 민주화하고 다양한 제작자의 말을 넓은 네트워크로 빠르게 퍼뜨렸다.", "전통 매체 종사자만 공적 인물이 될 수 있게 했다."], "answer": 1, "why": "S4~11은 장벽 붕괴, 접근 민주화, 다양한 제작자, 용어의 정당화와 빠른 확산을 잇는다.", "refs": [4, 5, 6, 7, 8, 9, 10, 11]}, "precision": [{"type": "근거·지칭", "q": "S3의 their limits가 가리키는 것은?", "choices": ["언어 규칙 제정자들의 규범과 제약", "콘텐츠 제작자들의 다양한 배경", "온라인의 느슨한 사회 연결망"], "answer": 0, "why": "S2의 rule makers와 그들의 prescriptive norms를 받아 인쇄·방송의 엄격한 기대를 말한다.", "refs": [2, 3]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Online creators can help legitimize and spread slang beyond old social and economic barriers.", "Social media left the old language gatekeepers fully in control of public communication."], "answer": 0, "why": "S6~11은 규칙 집행자가 사라지고 제작자의 말이 장벽을 넘어 빠르게 퍼진다고 한다.", "refs": [6, 7, 8, 9, 10, 11]}], "supplement": [{"title": "gatekeeper의 구조", "text": "본문에 단어 자체는 없지만 S2~3의 규칙 제정자와 매체 제약이 문지기 역할을 한다. S4의 barrier가 그 구조를 뒤집는다."}, {"title": "legitimize와 spread", "text": "많이 쓰이면 표현이 받아들여지고, 큰 플랫폼과 강한 온라인 연결망이 그 표현을 더 빨리 퍼뜨린다."}], "learning_visual": {"layout": "compare-conclusion", "preview_mode": "image", "preview_title": "누가 새로운 표현을 널리 퍼뜨릴 수 있게 됐을까?", "preview_caption": "인쇄·방송의 문지기와 누구나 발언하는 소셜 미디어를 비교하자.", "preview_items": [{"label": "예전", "text": "규칙 제정자와 기존 매체의 제한", "refs": [2, 3]}, {"label": "지금", "text": "다양한 제작자의 온라인 발언", "refs": [4, 5, 6, 9]}], "title": "문지기가 사라지자 달라진 언어의 길", "items": [{"label": "기존 매체", "text": "표준 영어 규범에 맞춰야 공적 발언이 가능했다", "refs": [1, 2, 3]}, {"label": "소셜 미디어", "text": "접근 장벽이 낮아져 다양한 사람이 제작자가 된다", "refs": [4, 5, 6, 7, 9]}, {"label": "슬랭의 변화", "text": "사용이 표현을 인정받게 하고 장벽 너머로 빠르게 퍼뜨린다", "refs": [8, 10, 11]}], "takeaway": "인터넷이 새 단어를 혼자 만들어냈다는 뜻이 아니다. 누가 말하고 얼마나 널리 퍼질 수 있는지가 바뀌었다."}}]}</script>
  <script>
    const dataset=JSON.parse(document.getElementById('passage-data').textContent); const app=document.getElementById('app'); const tabs=document.querySelector('.tabs');
    const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function refs(xs){return xs.join(',')}
    function renderQuestions(items,pi,prefix,p){return items.map((q,qi)=>{const evidence=(q.refs||[]).map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p><b>S${s.n}</b> ${esc(s.en)}</p>`).join('');return `<div class="quiz-item" data-answer="${q.answer}" data-why="${esc(q.why)}">${q.type?`<span class="qtype">${esc(q.type)}</span>`:''}<div class="quiz-q">${qi+1}. ${esc(q.q)}</div>${q.choices.map((c,ci)=>`<label class="choice"><input type="radio" name="${prefix}-${pi}-${qi}" value="${ci}">${esc(c)}</label>`).join('')}<div class="quiz-actions"><button class="check">확인</button><p class="feedback" aria-live="polite"></p><div class="q-evidence"><strong>다시 볼 영어 근거</strong>${evidence}</div></div></div>`}).join('')}

    function renderLearningVisual(v,preview=false){
      const items=preview?v.preview_items:v.items;
      const columns=preview?Math.min(items.length,3):v.layout==='branches'?3:['compare','fork-followup','fork-response','fork-synthesis','fork-extension','compare-conclusion','compare-response','compare-example-response','compare-two-conclusion','compare-examples','letter-grid'].includes(v.layout)?2:['chain-response','principle-timeline'].includes(v.layout)?3:Math.min(items.length,4);
      const cards=items.map((x,i)=>`<div class="visual-node" data-step="${i+1}"><b>${esc(x.label)}</b><p>${esc(x.text)}</p>${preview?'':`<small>${(x.refs||[]).map(n=>'S'+n).join('·')}</small>`}</div>`).join('');
      return `<div class="learning-visual visual-${esc(v.layout)} ${preview?'visual-preview':'stage-visual'}" style="--visual-columns:${columns}" role="group" aria-label="${esc(preview?v.preview_title:v.title)}"><span class="visual-eyebrow">${preview?'읽기 전 한눈에':'원문 근거로 확인'}</span><h4>${esc(preview?v.preview_title:v.title)}</h4><div class="visual-nodes">${cards}</div>${preview?'':`<p class="visual-takeaway">${esc(v.takeaway)}</p>`}</div>`;
    }

    function renderPassage(p,pi){
      const prev=dataset.passages[pi-1],next=dataset.passages[pi+1];
      const passageNumber=x=>x.short_title.match(/(\d+(?:[~–-]\d+)?)번/)?.[1]||x.id.slice(1);
      const prevNav=prev?`<a class="passage-switch" href="#${prev.id}" data-id="${prev.id}">← ${passageNumber(prev)}번</a>`:'<a href="index.html">← 목록</a>';
      const nextNav=next?`<a class="passage-switch" href="#${next.id}" data-id="${next.id}">${passageNumber(next)}번 →</a>`:'<a href="index.html">목록으로 →</a>';
      const sentenceByN=n=>p.sentences.find(s=>s.n===n);
      const flow=p.flow.map(x=>{const ev=x.refs.map(sentenceByN).filter(Boolean).map(s=>`<p><b>S${s.n}</b> ${esc(s.en)}</p>`).join('');return `<button class="flow-card inline-source" data-refs="${refs(x.refs)}"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><span class="backlink">근거 영어 펼치기 ＋</span><div class="inline-evidence">${ev}</div></button>`}).join('');
      const isContrast=Array.isArray(p.contrast),structureItems=isContrast?p.contrast:(p.structure||[]);
      const structureCards=structureItems.map((x,i)=>`${isContrast&&i?'<div class="versus">VS</div>':''}<div class="contrast-card"><b>${esc(x.title)}</b>${x.accent?`<em>${esc(x.accent)}</em>`:''}<div>${esc(x.text)}</div></div>`).join('');
      const visualLinks=(p.learning_visual?.preview_items||p.visual_links).map(x=>`<button class="evidence-link jump-source" data-refs="${refs(x.refs)}">${esc(x.label)} · ${x.refs.map(n=>'S'+n).join('·')}</button>`).join('');
      const prediction=p.prediction_choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction-${pi}" value="${i}">${esc(x)}</label>`).join('');
      const vocab=(p.blocking_vocab||[]).map(v=>`<span class="vocab-item"><b>${esc(v.word)}</b>${esc(v.meaning)}</span>`).join('');
      const sentences=p.sentences.map(s=>`<article class="sentence" id="${p.id}-source-${s.n}" data-source-n="${s.n}"><div class="shead"><span class="num">${s.n}</span><div class="en">${esc(s.en)}</div></div><div class="sentence-actions"><button class="tiny" data-toggle="ko">해석 보기</button></div><div class="translation">${esc(s.ko)}</div></article>`).join('');
      const supplements=(p.supplement||[]).map(x=>`<div class="supplement-item"><b>${esc(x.title)}</b><p>${esc(x.text)}</p></div>`).join('');
      const finalQuestions=renderQuestions([p.core_check,p.precision[0],p.precision[1]],pi,'final',p);
      return `<article class="passage" id="${p.id}" ${pi?'hidden':''}>
      <nav class="study-nav" aria-label="지문 이동">${prevNav}<a class="list-link" href="index.html">지문 목록</a><button class="quick-toggle" type="button">빠르게 보기</button>${nextNav}</nav>
      <nav class="stage-nav" aria-label="학습 단계"><a href="#${p.id}-stage-1">1 장면</a><a href="#${p.id}-stage-2">2 원문</a><a href="#${p.id}-stage-3">3 흐름</a><a href="#${p.id}-stage-4">4 확인</a></nav>
      <div class="hero"><div class="hero-copy"><span class="source">${esc(p.source_label)}</span><h2>${esc(p.short_title)}</h2><p class="lead">${esc(p.lead)}</p></div><figure class="visual">${p.learning_visual&&p.learning_visual.preview_mode!=="image"?renderLearningVisual(p.learning_visual,true):`<img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async">`}<figcaption>${esc(p.learning_visual?p.learning_visual.preview_caption:p.image_caption)}</figcaption><div class="visual-links" aria-label="그림과 영어 근거 연결">${visualLinks}</div></figure></div>
      <section class="section stage-anchor" id="${p.id}-stage-1"><span class="step">1 · 장면 잡기</span><h3>그림을 보고 먼저 고르기</h3><div class="think">${esc(p.before_question)}</div><div class="prediction-set">${prediction}</div><div class="prediction-note">좋아요. 이제 원문에서 네 예상을 확인해 보세요 ↓</div></section>
      <section class="section source-section stage-anchor" id="${p.id}-stage-2"><span class="step">2 · 원문 읽기</span><div class="sent-toolbar"><div><h3>영어로 읽고, 막힌 문장만 열기</h3><p class="hint">먼저 핵심어를 확인하고 영어를 끝까지 읽으세요. 막힌 문장만 해석을 열 수 있습니다.</p></div></div><div class="vocab-strip"><strong>읽기 전에 잡을 핵심어</strong><div class="vocab-list">${vocab}</div></div>${sentences}</section>
      <section class="section stage-anchor" id="${p.id}-stage-3"><span class="step">3 · 글의 흐름</span><h3>이 지문이 움직이는 방식</h3><div class="prediction-closure"><strong>네 예상</strong><span class="prediction-picked">아직 선택하지 않음</span><span class="prediction-arrow">→</span><strong>실제</strong><span>${esc(p.prediction_actual)}</span></div><div class="summary-panel"><strong>CORE IDEA</strong><p>${esc(p.core)}</p></div>${p.learning_visual?renderLearningVisual(p.learning_visual):`<div class="contrast">${structureCards}</div>`}${p.learning_visual?.preview_mode==="postread"?`<figure class="postread-illustration"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption>${esc(p.image_caption)}</figcaption></figure>`:""}<p class="hint" style="margin-top:26px">카드를 누르면 이 자리에서 영어 근거 문장이 펼쳐집니다.</p><div class="flow">${flow}</div><details class="deep-dive"><summary>더 알아보기 · 핵심 표현의 뉘앙스</summary><div class="deep-dive-body">${supplements}</div></details></section>
      <section class="section stage-anchor" id="${p.id}-stage-4"><span class="step">4 · 시험 확인</span><h3>세 문제로 이해 확인하기</h3><p class="hint">핵심·지칭·변형을 확인합니다. 틀리면 문제 바로 아래에서 영어 근거를 다시 볼 수 있습니다.</p>${finalQuestions}<div class="final-recap"><strong>마지막 한 줄</strong><p>${esc(p.core)}</p></div></section>
      </article>`;
    }
    dataset.passages.forEach((p,i)=>{tabs.insertAdjacentHTML('beforeend',`<button class="tab" data-id="${p.id}" aria-selected="${i===0}">${i+1}. ${esc(p.short_title)}</button>`);app.insertAdjacentHTML('beforeend',renderPassage(p,i));});
    let quickMode=false;function select(id,{scrollTop=true,updateHash=true}={}){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===id)));document.querySelectorAll('.passage').forEach(p=>{const active=p.id===id;p.hidden=!active;if(active){p.classList.toggle('quick-mode',quickMode);const q=p.querySelector('.quick-toggle');if(q)q.textContent=quickMode?'전체 보기':'빠르게 보기'}});if(updateHash)history.replaceState(null,'','#'+id);if(scrollTop){window.scrollTo(0,0);requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,0)));}}
    tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)select(b.dataset.id)});
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('jump-source')){const article=b.closest('.passage');const ids=b.dataset.refs.split(',');const first=article.querySelector(`[data-source-n="${ids[0]}"]`);article.querySelectorAll('.sentence').forEach(x=>x.classList.toggle('focused',ids.includes(x.dataset.sourceN)));first.scrollIntoView({behavior:'smooth',block:'center'})}if(b.classList.contains('reveal')){const a=b.nextElementSibling;a.classList.toggle('show');b.textContent=a.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장도 보기'}if(b.dataset.toggle==='ko'){const s=b.closest('.sentence');const box=s.querySelector('.translation');box.classList.toggle('show');b.textContent=box.classList.contains('show')?'해석 닫기':'해석 보기'}if(b.classList.contains('check')){const item=b.closest('.quiz-item');const picked=item.querySelector('input:checked');const f=item.querySelector('.feedback');if(!picked){f.className='feedback no';f.textContent='먼저 하나를 골라 보세요.';return}const ok=Number(picked.value)===Number(item.dataset.answer);f.className='feedback '+(ok?'ok':'no');f.textContent=(ok?'맞았어요. ':'다시 생각해 봐요. ')+item.dataset.why}});
    function routeToHash(){const old=document.getElementById('unavailable-passage');if(old)old.remove();const initial=location.hash.slice(1);const route=(initial.match(/^(q\d+)(?:-stage-(\d+))?$/)||[]);const passageId=route[1];const matched=dataset.passages.find(p=>p.id===passageId||(p.index_numbers||[]).some(n=>'q'+n===passageId));if(!initial){select(dataset.passages[0].id)}else if(matched){if(route[2]){select(matched.id,{scrollTop:false,updateHash:false});requestAnimationFrame(()=>document.getElementById(matched.id+'-stage-'+route[2])?.scrollIntoView({block:'start'}))}else select(matched.id)}else{document.querySelectorAll('.passage').forEach(p=>p.hidden=true);app.insertAdjacentHTML('afterbegin','<section class="section" id="unavailable-passage"><h2>이 번호의 지문은 준비 중이거나 시험 범위에서 제외되었습니다.</h2><p><a href="index.html">← 지문 번호 목록으로 돌아가기</a></p></section>')}}window.addEventListener('hashchange',routeToHash);routeToHash();

    document.addEventListener('change',e=>{const input=e.target.closest('input[name^="prediction-"]');if(!input)return;const article=input.closest('.passage');const label=input.closest('.choice').textContent.trim();article.dataset.prediction=label;article.classList.add('predicted');article.querySelector('.prediction-picked').textContent=label;article.querySelector('.prediction-note').classList.add('show')});
    document.addEventListener('click',e=>{const quick=e.target.closest('.quick-toggle');if(quick){const article=quick.closest('.passage');const on=!article.classList.contains('quick-mode');quickMode=on;article.classList.toggle('quick-mode',on);quick.textContent=on?'전체 보기':'빠르게 보기';(on?article.querySelector('[id$="stage-3"]'):article).scrollIntoView({behavior:'smooth',block:'start'});return}const card=e.target.closest('.inline-source');if(card){const box=card.querySelector('.inline-evidence');box.classList.toggle('show');card.querySelector('.backlink').textContent=box.classList.contains('show')?'근거 영어 접기 －':'근거 영어 펼치기 ＋';return}const check=e.target.closest('.check');if(check){const item=check.closest('.quiz-item');const picked=item.querySelector('input:checked');if(!picked)return;const ok=Number(picked.value)===Number(item.dataset.answer);const evidence=item.querySelector('.q-evidence');evidence.classList.toggle('show',!ok)}});
    document.addEventListener('click',e=>{const link=e.target.closest('.passage-switch');if(!link)return;e.preventDefault();select(link.dataset.id)});
  </script>
</body>
</html>

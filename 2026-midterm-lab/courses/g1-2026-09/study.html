  <script id="passage-data" type="application/json">{"meta": {"school": "고1 공통", "range": "2026년 9월 전국연합학력평가", "purpose": "시험 지문 이해를 돕는 클릭형 학습 자료", "tracking": false}, "passages": [{"id": "q20", "short_title": "20번 · 학습 게임의 목표", "source_label": "2026년 9월 고1 · 20번", "lead": "학습 게임은 재미있기만 하면 좋은 게임일까?", "image": "../../assets/g1-20-learning-game.webp", "image_alt": "왼쪽에는 규칙과 게임 요소가 지나치게 많아 산만한 게임 앞의 학생, 오른쪽에는 단순한 학습 과제에 직접 참여하는 학생이 대비된 교육용 그림", "image_caption": "왼쪽은 규칙과 게임 요소가 학습을 가린 상태, 오른쪽은 적당한 재미 속에서 학습자가 직접 참여하는 상태를 나타낸다.", "before_question": "학습 게임에서 더 중요한 것은 ‘계속 재미있게 해 주는 것’일까, ‘학습자가 직접 참여하게 하는 것’일까?", "prediction_choices": ["규칙과 게임 요소를 최대한 많이 넣는 것", "학습자가 내용과 상호작용하며 능동적으로 참여하게 하는 것", "게임의 규칙을 가능한 한 복잡하게 만드는 것"], "core_check": {"q": "글쓴이의 주장을 가장 정확하게 담은 문장은?", "choices": ["학습 게임도 상업용 게임만큼 재미있어야 성공한다.", "학습 게임은 오락보다 참여와 상호작용을 목표로 해야 한다.", "게임 요소가 많을수록 학습 성과가 높아진다."], "answer": 1, "why": "S6–10은 재미 자체가 아니라 참여·상호작용·능동성이 학습 게임의 목표라고 반복한다.", "refs": [6, 7, 8, 9, 10]}, "visual_links": [{"label": "규칙·요소가 많음", "refs": [2, 3, 5]}, {"label": "가벼운 재미", "refs": [1, 6]}, {"label": "참여와 상호작용", "refs": [7, 8, 9, 10]}], "core": "학습 게임은 오락이 아니라 참여와 상호작용을 목표로 삼아야 한다.", "key_sentence_en": "Focus on engagement rather than entertainment.", "key_sentence_ko": "오락이 아니라 참여에 집중하라.", "flow": [{"label": "기준", "sentences": "S1", "refs": [1], "text": "학습 게임은 ‘필요한 만큼만’ 재미있으면 된다."}, {"label": "문제", "sentences": "S2–3", "refs": [2, 3], "text": "재미있는 게임을 만들려다 오히려 학습이 어려워진다."}, {"label": "경계", "sentences": "S4–5", "refs": [4, 5], "text": "상업용 게임처럼 규칙과 요소를 잔뜩 쌓지 말아야 한다."}, {"label": "주장", "sentences": "S6–7", "refs": [6, 7], "text": "재미는 가볍게 두고 오락보다 참여에 집중한다."}, {"label": "근거", "sentences": "S8–9", "refs": [8, 9], "text": "교육성을 만드는 것은 내용과의 상호작용과 참여 수준이다."}, {"label": "결론", "sentences": "S10", "refs": [10], "text": "즐겁게 하는 것보다 참여하고 능동적이게 하는 것이 중요하다."}], "contrast": [{"title": "Entertainment first", "accent": "오락 중심", "text": "보상·규칙·게임 요소를 계속 더해 재미를 붙잡으려 함"}, {"title": "Engagement first", "accent": "참여 중심", "text": "적당한 재미 속에서 학습 내용과 상호작용하게 함"}], "sentences": [{"n": 1, "en": "Learning games need to be what we call ‘fun enough.’", "ko": "학습 게임은 우리가 ‘필요한 만큼 재미있는’이라 부르는 것이 될 필요가 있다."}, {"n": 2, "en": "Many new learning-game developers try to design an entertaining game.", "ko": "많은 새로운 학습 게임 개발자는 재미있는 게임을 설계하려고 한다."}, {"n": 3, "en": "Unfortunately, that often makes learning harder rather than easier.", "ko": "불행히도 그것은 종종 학습을 더 쉽게라기보다는 오히려 더 어렵게 만든다."}, {"n": 4, "en": "Remember, you are not creating the next great commercial game to entertain your learners; you are creating a learning game in which success will be measured by the achievement of learning outcomes.", "ko": "당신은 학습자를 즐겁게 하기 위한 훌륭한 상업용 게임을 만들고 있는 것이 아니라는 것을 기억하라. 당신은 성공이 학습 성과의 달성에 의해 측정될 학습 게임을 만들고 있다."}, {"n": 5, "en": "Resist the temptation to create a ton of rules, pile on different game elements, and incorporate multiple dynamics to keep player interest high.", "ko": "플레이어의 흥미를 높이기 위해 수많은 규칙을 만들고, 다른 게임 요소들을 쌓아 올리고, 다양한 역학을 포함하려는 유혹을 억제하라."}, {"n": 6, "en": "Yes, the game should be engaging with a mild level of fun, but learning should be the goal.", "ko": "그렇다, 게임은 가벼운 수준의 재미를 가지고 참여를 이끌어야 하지만, 학습이 목표가 되어야 한다."}, {"n": 7, "en": "Focus on engagement rather than entertainment.", "ko": "오락이 아니라 참여에 집중하라."}, {"n": 8, "en": "The goals of the game play should be interactivity and engagement.", "ko": "게임 플레이의 목표는 상호작용성과 참여여야 한다."}, {"n": 9, "en": "Research shows that what makes games instructional is the level of interactivity and engagement the learners have with the content.", "ko": "연구는 게임을 교육적으로 만드는 것은 학습자가 콘텐츠와 갖는 상호작용성과 참여의 수준임을 보여준다."}, {"n": 10, "en": "Given those parameters, making sure the learners are engaged and active is far more important than making sure they are entertained.", "ko": "그러한 요인을 고려할 때, 그들이 즐거워하는 것을 보장하는 것보다 학습자가 참여하고 능동적인지를 보장하는 것이 훨씬 더 중요하다."}], "precision": [{"type": "근거·지칭", "q": "S3의 that이 가리키는 것은?", "choices": ["재미있는 게임을 설계하려는 일", "학습 성과를 측정하는 일", "학습자가 능동적으로 참여하는 일"], "answer": 0, "why": "바로 앞 S2의 ‘재미있는 게임을 설계하는 것’을 가리킨다.", "refs": [2, 3]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Making sure learners are entertained is more important than making sure they are engaged and active.", "Making sure learners are engaged and active is more important than making sure they are entertained."], "answer": 1, "why": "S10은 ‘즐겁게 하는 것’보다 ‘참여하고 능동적이게 하는 것’이 훨씬 중요하다고 한다.", "refs": [10]}], "prediction_actual": "재미를 많이 넣는 것보다 학습자가 내용과 상호작용하며 참여하는 것이 중요하다.", "blocking_vocab": [{"word": "fun enough", "meaning": "필요한 만큼 재미있는"}, {"word": "entertaining", "meaning": "오락성이 있는"}, {"word": "engagement", "meaning": "참여·몰입"}, {"word": "interactivity", "meaning": "상호작용성"}, {"word": "instructional", "meaning": "교육적인"}], "supplement": [{"title": "engagement와 entertainment의 차이", "text": "entertainment는 즐겁게 해 주는 오락에 가깝고, engagement는 학습자가 내용에 주의를 기울이고 직접 참여하는 상태에 가깝다."}, {"title": "fun enough의 뉘앙스", "text": "재미가 필요 없다는 뜻이 아니다. 학습을 돕는 만큼의 재미는 필요하지만, 재미 자체가 목표가 되어서는 안 된다는 뜻이다."}], "learning_visual": {"layout": "compare", "preview_mode": "image", "preview_title": "학습 게임에서 먼저 지켜야 할 것은?", "preview_caption": "그림의 왼쪽과 오른쪽 중 실제 학습 목표에 가까운 쪽을 골라보자.", "preview_items": [{"label": "재미", "text": "규칙과 요소를 계속 더하기", "refs": [2, 3, 5]}, {"label": "참여", "text": "학습 내용과 직접 상호작용하기", "refs": [7, 8, 9]}], "title": "재미는 수단, 참여와 학습은 목표", "items": [{"label": "오락 중심의 함정", "text": "요소를 잔뜩 쌓으면 오히려 학습이 어려워질 수 있다", "refs": [2, 3, 4, 5]}, {"label": "학습 게임의 기준", "text": "적당한 재미 속에서 학생이 내용과 상호작용하고 능동적으로 참여한다", "refs": [6, 7, 8, 9, 10]}], "takeaway": "글쓴이는 게임의 재미를 없애자는 것이 아니다. 성공을 재는 기준을 오락이 아니라 학습 성과에 두자는 주장이다(S4·6)."}}, {"id": "q21", "short_title": "21번 · 움직임은 삶이다", "source_label": "2026년 9월 고1 · 21번", "lead": "사람은 가만히 앉아 살도록 만들어졌을까, 움직이며 살도록 만들어졌을까?", "image": "../../assets/g1-21-movement-life.webp", "image_alt": "왼쪽에는 어두운 방에서 스마트 기기를 보며 오래 앉아 있는 학생, 오른쪽에는 밝은 야외에서 달리고 기어오르는 학생들이 대비된 그림", "image_caption": "왼쪽은 기기 앞에 오래 앉아 있는 상태, 오른쪽은 밖에서 달리고 기어오르는 움직임의 상태를 나타낸다.", "before_question": "글쓴이가 인간의 본래 설계에 더 가깝다고 보는 모습은 어느 쪽일까?", "prediction_choices": ["스마트 기기 앞에 오래 앉아 있는 모습", "밖에서 달리고 뛰고 기어오르는 모습", "움직임을 줄이고 계획된 활동만 하는 모습"], "prediction_actual": "인간은 움직이도록 만들어졌고, 움직임을 통해 배우고 소통하며 성장하도록 되어 있다.", "core": "움직이도록 만들어진 설계에서 어른도 아이도 점점 멀어지고 있다.", "blocking_vocab": [{"word": "participate in", "meaning": "~에 참여하다"}, {"word": "occupy", "meaning": "차지하다"}, {"word": "be held captive", "meaning": "사로잡히다"}, {"word": "movement repertoire", "meaning": "다양한 움직임 능력"}, {"word": "be meant to", "meaning": "~하도록 되어 있다"}], "visual_links": [{"label": "오래 앉아 있음", "refs": [2, 3, 4]}, {"label": "밖에서 움직임", "refs": [5, 6, 7]}, {"label": "움직임이 곧 삶", "refs": [9, 10, 11]}], "sentences": [{"n": 1, "en": "We are wonderfully made, yet we don’t allow ourselves to participate in the wonder for which we were created.", "ko": "우리는 경이롭게 만들어졌지만, 우리가 창조된 목적인 그 경이로움에 우리 자신이 참여하게 하지 않는다."}, {"n": 2, "en": "Instead of moving anywhere and everywhere, most of us spend our time moving nowhere.", "ko": "어디로든 사방으로 움직이는 대신에, 우리의 대부분은 어디로도 움직이지 않은 채 우리의 시간을 보낸다."}, {"n": 3, "en": "We occupy the same square footage of a chair for hours and hours every day.", "ko": "우리는 매일 몇 시간이고 의자의 같은 공간을 차지하고 앉아 있다."}, {"n": 4, "en": "Many kids today are being held captive by ‘smart’ devices like phones and tablets.", "ko": "오늘날 많은 아이들은 폰과 태블릿 같은 ‘스마트’ 기기들에 사로잡혀 있는 중이다."}, {"n": 5, "en": "They are not going outside to play, they are not learning how to socialize and read physical cues from others.", "ko": "그들은 놀기 위해 밖으로 나가지 않고 있으며, 사회화하는 법과 타인으로부터 신체적 신호를 읽는 법을 배우고 있지 않다."}, {"n": 6, "en": "As a result they are not learning or building their movement repertoire, the very thing that will help them learn, communicate, create, and become emotionally mature.", "ko": "그 결과 그들은 움직임 레퍼토리, 즉 학습하고 소통하고 창조하며 정서적으로 성숙하도록 도와줄 바로 그것을 배우거나 형성하지 않고 있다."}, {"n": 7, "en": "They are not even learning how to run, how to skip, or how to climb.", "ko": "그들은 심지어 달리는 법, 깡충 뛰는 법, 혹은 기어오르는 법조차 배우고 있지 않다."}, {"n": 8, "en": "Instead, extraordinary lives through movement."], "answer": 1, "why": "S10은 인간이 움직이도록 만들어졌고 움직임을 통해 특별한 삶을 살도록 되어 있다고 말한다.", "refs": [10]}], "supplement": [{"title": "be held captive의 비유", "text": "원래는 ‘포로로 붙잡혀 있다’는 뜻이다. 여기서는 아이들이 스마트 기기에서 벗어나지 못하는 상태를 강하게 표현한다."}, {"title": "movement repertoire의 뜻", "text": "달리기·뛰기·기어오르기처럼 상황에 맞게 꺼내 쓸 수 있는 다양한 움직임 능력의 묶음을 말한다."}], "learning_visual": {"layout": "compare-conclusion", "preview_mode": "image", "preview_title": "우리 몸의 설계와 실제 생활은 어떻게 다를까?", "preview_caption": "오래 앉아 있거나 기기에 붙들린 상태와 뛰고 오르는 움직임을 대비해 보자.", "preview_items": [{"label": "오늘의 생활", "text": "의자·기기 앞에 머무르기", "refs": [2, 3, 4]}, {"label": "몸의 설계", "text": "달리고 뛰고 오르기", "refs": [7, 10]}], "title": "움직임을 빼앗긴 생활과 몸의 설계", "items": [{"label": "움직임 부족", "text": "어른은 오래 앉고, 아이는 기기 앞에서 바깥놀이를 놓친다", "refs": [2, 3, 4, 5]}, {"label": "움직임의 역할", "text": "몸의 다양한 움직임은 학습·소통·창조·정서 성숙을 돕는다", "refs": [6, 7]}, {"label": "글쓴이의 결론", "text": "움직이도록 만들어진 본래 설계에서 멀어지지 말자", "refs": [9, 10, 11]}], "takeaway": "기기가 모든 문제의 유일한 원인이라는 글이 아니다. 핵심은 움직임의 기회를 잃는 생활 방식이다."}}, {"id": "q22", "source_label": "2026년 9월 고1 · 22번", "sentences": [{"n": 1, "en": "Perhaps you have heard of the Law of Attraction, which states that ‘like attracts like’ and that by focusing on positive or negative thoughts, one can bring about positive or negative results.", "ko": "아마 당신은 끌어당김의 법칙 을 들어본 적이 있을텐데, 이는 ‘같은 것은 같은 것을 끌어당긴다’ 그리고 긍정적 혹은 부정적 생각에 집중함으로써 사람은 긍정적 혹은 부정적 결과를 가져올 수 있다고 말한다."}, {"n": 2, "en": "The common flaw in our understanding of this law is that we believe all we have to do is think about or visualize something to manifest it.", "ko": "이 법칙에 대한 우리의 이해에서 흔한 오류 는 어떤 것을 현실로 이루려면 그것을 생각하거나 시각화하기만 하면 된다고 믿는 것이다."}, {"n": 3, "en": "It is true that we attract at the level of our own vibration and that our thoughts and words are extremely magnetic.", "ko": "우리가 자신의 진동 수준에 따라 끌어당기며, 우리의 생각과 말이 매우 강한 자기력 을 지니고 있다는 점은 사실이다."}, {"n": 4, "en": "But the most powerful attractor is our belief system.", "ko": "그러나 가장 강력한 끌어당기는 것은 우리의 신념 체계이다 ."}, {"n": 5, "en": "You can create beautiful poster boards full of images of what you want and affirm every day that you are available for an incredibly successful, passionate career or a loving relationship; but if you don’t truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging.", "ko": "당신이 원하는 것들의 이미지로 가득 찬 아름다운 포스터 보드를 만들고, 놀라울 만큼 성공적이고 열정적인 경력 혹은 사랑하고 있는 관계를 누릴만하다고 매일 확언할 수 있다. 하지만 스스로가 충분하고, 가치 있고, 사랑받을 만하고, 그럴 자격이 있다고 진정으로 믿지 않는다면 , 훌륭한 경력이나 관계를 당신의 삶 속으로 끌어들이는 일은 더 어려울 수도 있다."}, {"n": 6, "en": "Consider what limiting beliefs you have that contradict your desires and upgrade them to beliefs that are in line with what you want to attract.", "ko": "당신의 욕구와 모순되는 어떤 제한적인 신념들을 당신이 가졌는지를 깊이 생각하고, 당신이 끌어당기고자 하는 것과 일치하는 신념으로 그것들을 업그레이드하라."}], "core": "생각하고 그려 보는 것보다 스스로를 믿는 신념 체계가 더 강하게 끌어당긴다.", "flow": [{"label": "법칙과 오해", "sentences": "S1–2", "text": "생각이 결과를 끌어온다는 법칙을, 그저 생각하고 그리기만 하면 된다는 뜻으로 오해한다.", "refs": [1, 2]}, {"label": "인정과 전환", "sentences": "S3–4", "text": "생각과 말의 힘을 인정하지만, 가장 강력한 끌어당김은 더 깊은 신념 체계라고 전환한다.", "refs": [3, 4]}, {"label": "구체적 예시", "sentences": "S5", "text": "목표를 그려 보고 확언해도 스스로를 충분하고 자격 있다고 믿지 않으면 결과를 끌어오기 어렵다.", "refs": [5]}, {"label": "실천 결론", "sentences": "S6", "text": "욕구와 충돌하는 제한적 신념을 찾아 원하는 방향과 맞는 신념으로 바꾸라고 권한다.", "refs": [6]}], "structure": [{"title": "생각 — thoughts and words", "text": "집중하고 그려 보고 확언하는 것. 힘은 있으나 그것만으로는 부족하다"}, {"title": "신념 — belief system", "text": "스스로가 충분하고 가치 있고 자격 있다고 여기는 것. 가장 강하게 끌어당긴다"}], "short_title": "22번 · 생각보다 강한 신념", "lead": "원하는 미래를 계속 생각하면 충분할까, 그보다 깊은 것이 필요할까?", "image": "../../assets/g1-22-belief-system.webp", "image_alt": "목표 장면으로 꾸민 비전 보드 옆에서 거울 속 자신을 진지하게 바라보는 사람의 한 장면", "image_caption": "화려한 목표 장면을 그려 보는 일과, 그것을 누릴 자격이 있다고 스스로 믿는 일은 다를 수 있다.", "before_question": "글쓴이가 원하는 결과를 끌어오는 데 가장 강력하다고 보는 것은 무엇일까?", "prediction_choices": ["원하는 장면을 반복해서 시각화하는 것", "스스로에 대한 깊은 신념 체계", "긍정적인 말을 최대한 많이 반복하는 것"], "prediction_actual": "생각과 말에도 힘은 있지만, 가장 강력한 끌어당김은 자신에 대한 신념 체계에서 나온다.", "blocking_vocab": [{"word": "Law of Attraction", "meaning": "끌어당김의 법칙"}, {"word": "manifest", "meaning": "현실로 이루다"}, {"word": "vibration", "meaning": "진동·에너지 수준"}, {"word": "magnetic", "meaning": "강하게 끌어당기는"}, {"word": "limiting belief", "meaning": "가능성을 제한하는 신념"}], "visual_links": [{"label": "목표를 그려 봄", "refs": [1, 2]}, {"label": "신념 체계", "refs": [3, 4]}, {"label": "욕구와 신념의 불일치", "refs": [5, 6]}], "contrast": [{"title": "Thoughts and images", "accent": "생각하고 그려 보기", "text": "힘은 있지만 그것만으로 원하는 결과가 보장되지는 않음"}, {"title": "Belief system", "accent": "스스로에 대한 믿음", "text": "가치 있고 사랑받을 만하며 자격이 있다고 믿는 더 깊은 기반"}], "core_check": {"q": "글쓴이의 주장을 가장 정확하게 담은 문장은?", "choices": ["원하는 것을 시각화하기만 하면 반드시 현실이 된다.", "생각과 말보다 자신의 신념 체계가 더 강력한 끌어당김을 만든다.", "제한적 신념은 욕구를 더 선명하게 만들어 준다."], "answer": 1, "why": "S3–6은 생각과 말의 힘을 인정하면서도 가장 강력한 것은 신념 체계라고 말한다.", "refs": [3, 4, 5, 6]}, "precision": [{"type": "근거·지칭", "q": "S6의 them이 가리키는 것은?", "choices": ["your desires", "limiting beliefs", "positive results"], "answer": 1, "why": "upgrade의 목적어 them은 바로 앞의 limiting beliefs를 가리킨다.", "refs": [6]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Visualizing something is the most powerful attractor.", "A belief system can be more powerful than thoughts and words in attracting results."], "answer": 1, "why": "S3–4는 생각과 말의 힘을 인정한 뒤 신념 체계가 가장 강력하다고 말한다.", "refs": [3, 4]}], "supplement": [{"title": "manifest의 문맥", "text": "여기서는 생각 속 목표를 실제 삶의 결과로 나타나게 한다는 뜻으로 쓰였다."}, {"title": "in line with의 뜻", "text": "‘~와 일치하는’이라는 뜻이다. 원하는 것과 속마음의 신념이 같은 방향이어야 한다는 결론을 만든다."}], "learning_visual": {"layout": "compare-example-response", "preview_mode": "image", "preview_title": "비전 보드를 만들기만 하면 충분할까?", "preview_caption": "포스터의 이미지와 자신에 대한 믿음은 글에서 서로 다른 역할을 한다.", "preview_items": [{"label": "겉으로 보이는 것", "text": "원하는 미래를 그린 보드", "refs": [5]}, {"label": "보이지 않는 것", "text": "스스로 가치 있다고 믿는 마음", "refs": [4, 5]}], "title": "생각·시각화보다 강하다고 주장하는 것", "items": [{"label": "흔한 오해", "text": "원하는 것을 생각하고 그리기만 하면 이루어진다고 본다", "refs": [1, 2]}, {"label": "글쓴이의 강조", "text": "겉의 생각과 말보다 자기 신념 체계가 더 큰 영향을 준다고 본다", "refs": [3, 4]}, {"label": "비전 보드 사례", "text": "성공을 그려도 스스로 자격이 없다고 믿으면 어려울 수 있다", "refs": [5]}, {"label": "제안", "text": "바라는 것과 충돌하는 제한적 믿음을 살펴 바꾸라", "refs": [6]}], "takeaway": "이는 본문 글쓴이의 주장이지 '생각만으로 현실이 반드시 바뀐다'는 검증된 사실로 제시하는 자료가 아니다."}}, {"id": "q23", "source_label": "2026년 9월 고1 · 23번", "sentences": [{"n": 1, "en": "It’s important for humans to have many kinds of minds, because variation is critical for the survival of a species.", "ko": "인간이 다양한 유형의 마음을 갖는 것은 중요한데, 변이는 종의 생존에 결정적 이기 때문이다."}, {"n": 2, "en": "One of Charles Darwin’s greatest insights was that variation is a prerequisite for natural selection to work.", "ko": "Charles Darwin의 가장 위대한 통찰 중 하나는 변이가 자연선택이 작동하기 위한 선행 조건 이라는 점이었다."}, {"n": 3, "en": "Think about it: If there’s a huge change in the environment, like a catastrophic drop in the food supply or a big increase in temperature, a species without much variation might be completely wiped out.", "ko": "생각해 보라. 만약에 식량 공급에서의 재앙 적 감소나 기온에서의 큰 상승과 같은 환경에 거대한 변화가 있다면, 많은 변이가 없는 종은 완전히 사라질 수도 있다."}, {"n": 4, "en": "A species with great variation will more likely have some survivors after any catastrophe ―the members who are well suited for the new environment.", "ko": "변이가 큰 종은 어떤 재앙 이후에도 몇몇 생존자들 즉 새로운 환경에 잘 적응한 구성원들을 가질 가능성이 더 크다."}, {"n": 5, "en": "Darwin observed variation in the bodies of animals, and the same principle applies to human minds.", "ko": "Darwin은 동물의 몸에서 변이를 관찰했으며, 동일한 원리는 인간의 마음에도 적용된다 ."}, {"n": 6, "en": "If we all had the same kind of mind ―if there were only one human nature ―then when disaster struck, we might become extinct.", "ko": "만약 우리가 모두 같은 유형의 마음을 가지고 있고 인간 본성이 하나뿐이라면, 재난이 닥쳤을 때 우리는 멸종할지도 모른다 ."}, {"n": 7, "en": "Thankfully, our species has many kinds of minds, both within a single culture and across cultures, so we’re less likely to be wiped out.", "ko": "다행히도 우리 종은 단일 문화 내와 문화 간 둘 다에서 다양한 유형의 마음을 지니고 있어서 우리는 사라질 가능성이 더 낮다 ."}, {"n": 8, "en": "This variation preserves the evolvability of our species.", "ko": "이러한 변이는 우리 종의 진화 가능성을 보존한다 ."}], "core": "몸의 변이가 종을 살리듯 마음의 다양성이 인류의 진화 가능성을 지킨다.", "flow": [{"label": "주제", "sentences": "S1", "text": "마음이 여러 갈래인 것이 중요하다 — 변이가 종의 생존에 결정적이기 때문이다", "refs": [1]}, {"label": "근거", "sentences": "S2", "text": "다윈의 통찰 — 변이는 자연선택이 작동하기 위한 선행 조건이다", "refs": [2]}, {"label": "가정", "sentences": "S3", "text": "환경이 크게 바뀌면 변이가 적은 종은 통째로 사라질 수 있다", "refs": [3]}, {"label": "대비", "sentences": "S4", "text": "변이가 큰 종은 새 환경에 맞는 새 환경에 맞는 일부 생존자를 남길 가능성이 더 크다", "refs": [4]}, {"label": "옮김", "sentences": "S5–6", "text": "같은 원리가 마음에도 적용된다 — 마음이 하나뿐이면 재난 때 멸종할 수 있다", "refs": [5, 6]}, {"label": "결론", "sentences": "S7–8", "text": "다행히 우리 종은 마음이 여러 갈래라 사라질 가능성이 낮고 진화 가능성이 지켜진다", "refs": [7, 8]}], "structure": [{"title": "원인 — 변이가 있다", "text": "몸이든 마음이든 여러 갈래라는 것. 자연선택이 고를 재료가 있다는 뜻이다"}, {"title": "결과 — 살아남는다", "text": "환경이 크게 바뀌어도 새 환경에 맞는 구성원이 남아 종의 진화 가능성이 이어진다"}], "short_title": "23번 · 마음의 다양성이 종을 살린다", "lead": "환경이 갑자기 바뀔 때, 구성원의 특성이 거의 같은 종과 다양한 종 가운데 어느 쪽이 살아남기 쉬울까?", "image": "../../assets/g1-23-variation-survival-v2.webp", "image_alt": "기온이 크게 오른 메마른 환경에서 서로 다른 생각의 무늬를 지닌 사람들이 함께 생존 방법을 찾는 교육용 그림", "image_caption": "큰 기온 상승과 먹을거리 감소 같은 변화 속에서도, 여러 종류의 마음은 서로 다른 대응 가능성을 남긴다.", "before_question": "갑작스러운 환경 변화 뒤 종의 생존 가능성을 높이는 것은 무엇일까?", "prediction_choices": ["모든 구성원이 완전히 같은 특성을 갖는 것", "구성원 사이에 다양한 변이가 있는 것", "가장 빠른 구성원만 남기는 것"], "prediction_actual": "종 안의 변이는 새로운 환경에 맞는 생존자를 남겨 종의 생존과 진화 가능성을 지킨다.", "blocking_vocab": [{"word": "variation", "meaning": "변이·다양성"}, {"word": "critical", "meaning": "결정적인"}, {"word": "prerequisite", "meaning": "선행 조건"}, {"word": "be wiped out", "meaning": "완전히 사라지다"}, {"word": "be suited for", "meaning": "~에 적합하다"}], "visual_links": [{"label": "환경의 큰 변화", "refs": [3]}, {"label": "남는 생존자", "refs": [4]}, {"label": "몸에서 마음으로", "refs": [5, 6, 7, 8]}], "contrast": [{"title": "Little variation", "accent": "변이가 적은 종", "text": "환경이 크게 바뀌면 모든 구성원이 함께 사라질 위험이 큼"}, {"title": "Great variation", "accent": "변이가 큰 종", "text": "새 환경에 맞는 일부 구성원이 살아남아 진화 가능성을 이어 감"}], "core_check": {"q": "글쓴이의 주장을 가장 정확하게 담은 문장은?", "choices": ["한 문화 안에서는 같은 유형의 마음만 유지해야 한다.", "몸의 변이처럼 마음의 다양성도 인류의 생존과 진화 가능성을 지킨다.", "환경 변화는 변이가 적은 종에 더 많은 생존자를 남긴다."], "answer": 1, "why": "S5–8은 몸의 변이에 관한 원리를 인간 마음의 다양성에 적용해 생존과 진화 가능성을 설명한다.", "refs": [5, 6, 7, 8]}, "precision": [{"type": "근거·지칭", "q": "S8의 This variation이 가리키는 것은?", "choices": ["문화 안팎에 존재하는 다양한 유형의 마음", "환경의 온도가 급격히 오르는 현상", "동물의 몸이 모두 같아지는 현상"], "answer": 0, "why": "S7의 many kinds of minds를 받아 인간 마음의 다양성을 가리킨다.", "refs": [7, 8]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Variation matters only in animal bodies, not in human minds.", "The principle of variation in animal bodies also applies to human minds."], "answer": 1, "why": "S5는 동물 몸에서 관찰한 변이의 원리가 인간 마음에도 적용된다고 말한다.", "refs": [5]}], "supplement": [{"title": "변이가 자연선택의 선행 조건인 이유", "text": "차이가 있어야 환경에 더 잘 맞는 구성원이 남을 수 있다. 모두가 같다면 자연선택이 고를 차이도 없다."}, {"title": "evolvability", "text": "환경 변화에 맞추어 앞으로도 변화하고 적응할 수 있는 능력, 즉 ‘진화 가능성’을 뜻한다."}], "learning_visual": {"layout": "fork-extension", "preview_title": "환경이 크게 바뀌면 어떤 집단이 살아남을까?", "preview_caption": "먹이 감소나 기온 상승 같은 환경 변화에서, 구성원의 차이가 어떤 결과를 낳을지 생각해 보자.", "preview_items": [{"label": "환경 변화", "text": "먹이 감소 또는 기온 상승", "refs": [3]}, {"label": "질문", "text": "모두 같을 때와 서로 다를 때의 결과는?", "refs": [3, 4]}], "title": "몸의 변이에서 마음의 다양성으로 이어지는 논증", "items": [{"label": "공통 조건", "text": "먹이가 줄거나 기온이 오르는 큰 변화가 닥친다", "refs": [2, 3]}, {"label": "변이가 적은 종", "text": "새 환경에 맞는 개체가 없어 모두 사라질 수 있다", "refs": [3]}, {"label": "변이가 많은 종", "text": "새 환경에 맞는 일부 개체가 살아남을 가능성이 크다", "refs": [4]}, {"label": "인간의 마음에 적용", "text": "동물 몸의 변이에 관한 원리를 서로 다른 마음의 중요성으로 확장한다", "refs": [5, 6, 7, 8]}], "takeaway": "'모두 협력해서 산다'가 아니라, 다양한 특성 중 새 환경에 맞는 일부가 살아남을 가능성을 말한다."}}, {"id": "q24", "source_label": "2026년 9월 고1 · 24번", "sentences": [{"n": 1, "en": "Letting go of our need for control, being aware, is a lot about gathering the courage to face uncertainty.", "ko": "통제하려는 우리의 욕구를 내려놓는 것, 즉 알아차리는 것은, 매우 불확실성에 맞설 용기를 모으는 일에 관한 것이다."}, {"n": 2, "en": "Human beings want to know.", "ko": "인간은 알고 싶어 한다 ."}, {"n": 3, "en": "When we don’t know, when things are uncertain, we often feel frightened and become inflexible.", "ko": "우리가 알지 못할 때, 상황이 불확실할 때 우리는 종종 두려움을 느끼고 경직된다 ."}, {"n": 4, "en": "So we pretend that things are more predictable than they really are, even though we actually live with enormous uncertainty all the time.", "ko": "그래서 우리가 항상 막대한 불확실성과 실제로 살아가고 있음에도 불구하고, 우리는 상황이 실제로 그것들이 그러한 것보다 더 예측 가능하다고 가장한다 ."}, {"n": 5, "en": "We cling to our plans and ideas about how things should be and turn out ever so desperately.", "ko": "우리는 상황이 어떻게 되어야 하고 어떻게 결과로 나타나야 하는지에 대한 우리의 계획과 생각들에 매우 절박하게 매달린다 ."}, {"n": 6, "en": "And there’s nothing wrong with having plans.", "ko": "그리고 계획을 가지는 것에는 아무런 잘못도 없다 ."}, {"n": 7, "en": "I think it’s a beautiful thing.", "ko": "나는 그것이 아주 아름다운 것이라고 생각한다."}, {"n": 8, "en": "But there’s a difference between planning and thinking all your plans have to come to fruition.", "ko": "그러나 계획을 세우는 것과, 세운 모든 계획이 열매를 맺어야 한다고 믿는 것 사이에는 차이가 있다 ."}, {"n": 9, "en": "American president Eisenhower once said: ‘Plans are worthless, but planning is everything.’", "ko": "미국의 대통령 Eisenhower는 한때 ‘계획은 쓸모없지만, 계획하는 것은 모든 것이다 .’라고 말했다."}, {"n": 10, "en": "Imagine if we all used pencil instead of ink to write in our calendars and planners.", "ko": "우리가 모두 우리의 달력과 플래너에 잉크 대신 연필로 글을 쓴다고 상상해 보라."}, {"n": 11, "en": "Both figuratively and literally.", "ko": "비유적으로 그리고 문자 그대로 둘 다."}, {"n": 12, "en": "Imagine if we could bear in mind that what we write down, what we think is going to happen, might not be what actually happens.", "ko": "우리가 적어 놓는 것, 우리가 일어날 것이라고 생각하는 것이 실제로 일어나는 것과 다를 수도 있음을 염두에 둘 수 있다고 상상해 보라."}, {"n": 13, "en": "And if we could try our best to be all right with that.", "ko": "그리고 그 사실을 괜찮게 받아들이려고 우리가 최선을 다할 수 있다고."}], "core": "계획은 세우되 그대로 되어야 한다는 집착은 내려놓고 불확실성을 견디자.", "flow": [{"label": "주제", "sentences": "S1", "text": "통제 욕구를 내려놓는 일은 불확실성에 맞설 용기의 문제다", "refs": [1]}, {"label": "까닭", "sentences": "S2–3", "text": "사람은 알고 싶어 하고, 모르면 두려워 경직된다", "refs": [2, 3]}, {"label": "증상", "sentences": "S4–5", "text": "그래서 실제보다 예측 가능한 척하며 계획과 생각에 절박하게 매달린다", "refs": [4, 5]}, {"label": "단서", "sentences": "S6–7", "text": "계획을 갖는 것 자체는 잘못이 아니고 오히려 아름다운 일이다", "refs": [6, 7]}, {"label": "가름", "sentences": "S8–9", "text": "계획을 세우는 것과 다 이뤄져야 한다고 믿는 것은 다르다 — 아이젠하워의 말", "refs": [8, 9]}, {"label": "제안", "sentences": "S10–13", "text": "달력을 연필로 쓰듯 적어 둔 것이 달라질 수 있음을 새기고 괜찮아하도록 애써 보자", "refs": [10, 11, 12, 13]}], "structure": [{"title": "잉크 — 계획이 그대로여야 한다", "text": "모르는 것이 두려워 예측 가능한 척하며 계획과 생각에 절박하게 매달리는 쪽"}, {"title": "연필 — 계획은 바뀔 수 있다", "text": "계획은 세우되 적어 둔 것이 실제와 다를 수 있음을 새기고 그것을 괜찮아하는 쪽"}], "short_title": "24번 · 계획은 연필로 쓰기", "lead": "계획을 세우는 것과 계획이 반드시 그대로 되어야 한다고 믿는 것은 같은 일일까?", "image": "../../assets/g1-24-pencil-plans-v2.webp", "image_alt": "펼친 일정표의 한쪽에는 잉크로 고정된 계획이 있고, 다른 쪽에는 연필·지우개·지운 흔적으로 계획을 유연하게 수정하는 손이 보이는 그림", "image_caption": "계획은 세우되, 연필로 쓰듯 실제 상황에 따라 바뀔 수 있음을 받아들이라는 비유다.", "before_question": "글쓴이가 권하는 계획 방식은 무엇일까?", "prediction_choices": ["불확실하므로 계획을 전혀 세우지 않는 것", "세운 계획은 어떤 일이 있어도 그대로 지키는 것", "계획은 세우되 바뀔 가능성을 받아들이는 것"], "prediction_actual": "계획 자체는 좋지만, 모든 계획이 반드시 그대로 이뤄져야 한다는 집착은 내려놓아야 한다.", "blocking_vocab": [{"word": "let go of", "meaning": "~을 내려놓다"}, {"word": "uncertainty", "meaning": "불확실성"}, {"word": "cling to", "meaning": "~에 매달리다"}, {"word": "come to fruition", "meaning": "결실을 맺다"}, {"word": "bear in mind", "meaning": "염두에 두다"}], "visual_links": [{"label": "계획에 매달림", "refs": [4, 5]}, {"label": "계획 자체는 괜찮음", "refs": [6, 7, 8, 9]}, {"label": "연필로 쓰기", "refs": [10, 11, 12, 13]}], "contrast": [{"title": "Ink", "accent": "계획이 그대로여야 함", "text": "불확실성을 두려워해 계획과 생각에 절박하게 매달리는 태도"}, {"title": "Pencil", "accent": "계획은 바뀔 수 있음", "text": "계획은 세우되 실제가 달라질 수 있음을 염두에 두고 받아들이는 태도"}], "core_check": {"q": "글쓴이의 주장을 가장 정확하게 담은 문장은?", "choices": ["계획은 쓸모없으므로 미래를 준비하지 말아야 한다.", "불확실성을 없애려면 모든 계획을 반드시 완성해야 한다.", "계획은 세우되 그대로 되어야 한다는 집착은 내려놓아야 한다."], "answer": 2, "why": "S6–13은 계획 자체를 긍정하면서도 모든 계획이 반드시 이뤄져야 한다는 집착과 구분한다.", "refs": [6, 7, 8, 9, 10, 12, 13]}, "precision": [{"type": "근거·지칭", "q": "S7의 it이 가리키는 것은?", "choices": ["having plans", "facing uncertainty", "using pencil"], "answer": 0, "why": "S6의 having plans를 받아 계획을 가지는 일을 가리킨다.", "refs": [6, 7]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Planning and believing every plan must succeed are different things.", "Because plans may change, planning itself should be avoided."], "answer": 0, "why": "S8은 계획을 세우는 것과 모든 계획이 결실을 맺어야 한다고 믿는 것은 다르다고 말한다.", "refs": [8]}], "supplement": [{"title": "Plans are worthless, but planning is everything", "text": "개별 계획은 상황에 따라 빗나갈 수 있지만, 계획하는 과정에서 생각하고 준비하는 일은 매우 중요하다는 뜻이다."}, {"title": "연필의 비유", "text": "연필은 지우고 고칠 수 있다. 계획을 세우되 현실이 달라지면 수정할 수 있어야 한다는 태도를 구체화한다."}], "learning_visual": {"layout": "compare-conclusion", "preview_mode": "image", "preview_title": "계획을 잉크 대신 연필로 쓴다면?", "preview_caption": "연필은 계획을 버리는 것이 아니라 바뀔 수 있음을 인정하는 비유다.", "preview_items": [{"label": "잉크", "text": "원래 계획이 반드시 이루어져야 한다", "refs": [5, 8, 10]}, {"label": "연필", "text": "계획하되 수정 가능성을 남긴다", "refs": [9, 10, 11, 12, 13]}], "title": "계획 자체와 계획에 매달리는 태도", "items": [{"label": "불확실성 앞의 반응", "text": "두려워서 현실이 예측 가능한 척하고 계획에 매달린다", "refs": [1, 2, 3, 4, 5]}, {"label": "글쓴이가 버리지 않는 것", "text": "계획을 세우는 일 자체는 가치 있다고 본다", "refs": [6, 7, 8, 9]}, {"label": "바꾸려는 태도", "text": "예상과 달라도 견딜 수 있도록 계획을 연필처럼 다룬다", "refs": [10, 11, 12, 13]}], "takeaway": "결론은 무계획이 아니다. 계획의 유용함과 결과에 대한 집착을 분리해야 한다."}}, {"id": "q26", "source_label": "2026년 9월 고1 · 26번", "sentences": [{"n": 1, "en": "Paul Farmer was an American medical anthropologist and physician.", "ko": "Paul Farmer는 미국의 의학 인류학자이자 의사 였다."}, {"n": 2, "en": "He was born in 1959 in Massachusetts and grew up with an early awareness of social inequality.", "ko": "그는 1959년에 매사추세츠에서 태어났으며, 사회적 불평등에 대한 이른 인식 을 갖고 성장했다."}, {"n": 3, "en": "During his time at Duke University, he lived in Paris for half a year and became fluent in French, which benefited him in his future work in Haiti.", "ko": "Duke University에 다니는 동안 그는 반년 간 파리에 살았고 프랑스어에 유창해졌는데 , 이는 그의 훗날 아이티에서의 활동에 도움이 되었다."}, {"n": 4, "en": "After graduating from Duke University, he began volunteer work at a hospital in Cangé, Haiti.", "ko": "Duke University 졸업 후, 그는 아이티 Cangé에 있는 병원에서 자원봉사 활동을 시작했다 ."}, {"n": 5, "en": "He later returned to the United States and earned both a master’s degree and a PhD in medical anthropology at Harvard University.", "ko": "그는 이후 미국으로 돌아갔고, Harvard University에서 의학 인류학의 석사 학위와 박사 학위 둘 다 를 취득했다."}, {"n": 6, "en": "In 1987, he co-founded Partners In Health, an organization that works in countries like Haiti, Rwanda, and Peru to provide medical treatment and strengthen public health systems.", "ko": "1987년에 그는 의학적 치료를 제공하고 공중 보건 체계를 강화하기 위해 아이티, 르완다, 그리고 페루와 같은 국가에서 일하는 단체인 Partners In Health를 공동 설립했다 ."}, {"n": 7, "en": "Throughout his life, he wrote more than ten books and over a hundred academic papers.", "ko": "그의 생애 동안 그는 10권이 넘는 책과 100편이 넘는 학술 논문을 저술했다 ."}, {"n": 8, "en": "He received many major awards during his career, and after his death, he was also honored with the WHO Director-General’s Global Health Leaders Award for his lifelong work to improve health for the poor.", "ko": "그의 경력 동안 많은 주요 상을 받았고, 사망 후에 그는 또한 가난한 사람들의 건강을 개선하기 위한 평생의 과업 으로 WHO Director-General’s Global Health Leaders Award를 수상했다."}], "core": "가난한 이들의 건강을 위해 평생 일한 의학 인류학자이자 의사의 발자취.", "flow": [{"label": "정의", "sentences": "S1", "text": "미국의 의학 인류학자이자 의사였다", "refs": [1]}, {"label": "출생", "sentences": "S2", "text": "1959년 매사추세츠에서 태어나 일찍부터 사회적 불평등을 알아차리며 자랐다", "refs": [2]}, {"label": "대학", "sentences": "S3–4", "text": "파리에서 반년을 살아 프랑스어에 유창해졌고, 졸업 뒤 아이티 병원에서 자원봉사를 시작했다", "refs": [3, 4]}, {"label": "학위", "sentences": "S5", "text": "미국으로 돌아가 하버드에서 석사와 박사를 함께 땄다", "refs": [5]}, {"label": "설립", "sentences": "S6", "text": "1987년 여러 나라에서 치료와 보건 체계를 맡을 단체를 공동 설립했다", "refs": [6]}, {"label": "남김", "sentences": "S7–8", "text": "책과 논문을 남기고 생전과 사후에 걸쳐 큰 상을 받았다", "refs": [7, 8]}], "structure": [{"title": "때 — 1959 → 대학 → 1987 → 생애 끝", "text": "출생·유학·졸업·학위·설립·저술·수상이 시간 순서로 이어진다"}, {"title": "곳 — 매사추세츠 · 파리 · 아이티 · 하버드", "text": "장소가 바뀔 때마다 하는 일이 바뀐다. 선지는 이 짝을 흔든다"}], "short_title": "26번 · 가난한 이들의 의사", "lead": "한 사람의 이동 경로를 따라가면, 그의 평생 과업은 어디를 향하고 있을까?", "image": "../../assets/g1-26-public-health.webp", "image_alt": "지역 진료소에서 의사와 현지 보건 인력이 환자를 돌보고, 곁에 연구 서적이 놓인 공중 보건 활동 그림", "image_caption": "진료·보건 체계·연구를 함께 이어 간 삶의 중심에는 가난한 이들의 건강이 있었다.", "before_question": "Paul Farmer의 여러 활동을 하나로 묶는 가장 알맞은 말은 무엇일까?", "prediction_choices": ["세계 여러 나라를 여행한 학자의 삶", "가난한 이들의 건강을 개선한 의사이자 연구자의 삶", "학위와 수상을 가장 중요하게 여긴 작가의 삶"], "prediction_actual": "의료 현장·공중 보건 체계·연구를 연결하며 가난한 이들의 건강을 위해 평생 일했다.", "blocking_vocab": [{"word": "medical anthropologist", "meaning": "의학 인류학자"}, {"word": "social inequality", "meaning": "사회적 불평등"}, {"word": "co-found", "meaning": "공동 설립하다"}, {"word": "strengthen", "meaning": "강화하다"}, {"word": "lifelong work", "meaning": "평생의 과업"}], "visual_links": [{"label": "진료 현장", "refs": [4, 6]}, {"label": "보건 체계", "refs": [6, 8]}, {"label": "책과 연구", "refs": [5, 7]}], "core_check": {"q": "Paul Farmer의 생애를 가장 정확하게 요약한 것은?", "choices": ["프랑스어 연구와 대학 교육에만 집중한 학자였다.", "의료 현장·공중 보건·연구를 연결해 가난한 이들의 건강 개선에 힘썼다.", "여러 나라의 병원을 방문했지만 직접 단체를 만들지는 않았다."], "answer": 1, "why": "S4·S6·S7·S8은 현장 봉사, 단체 설립, 연구, 가난한 이들의 건강을 위한 평생 과업을 함께 보여 준다.", "refs": [4, 6, 7, 8]}, "precision": [{"type": "근거·지칭", "q": "S3의 which가 가리키는 내용은?", "choices": ["Duke University에 다닌 것", "파리에서 프랑스어에 유창해진 것", "아이티에서 병원을 세운 것"], "answer": 1, "why": "which는 바로 앞의 ‘became fluent in French’를 받아, 그 능력이 훗날 아이티 활동에 도움이 됐다고 설명한다.", "refs": [3]}, {"type": "변형 탐지", "q": "원문의 시간 순서와 일치하는 문장을 고르세요.", "choices": ["After volunteering in Haiti, Farmer returned to the United States and earned graduate degrees at Harvard.", "Farmer earned graduate degrees at Harvard before beginning any work in Haiti."], "answer": 0, "why": "S4에서 아이티 자원봉사를 시작하고, S5에서 이후 미국으로 돌아가 하버드 학위를 취득한다.", "refs": [4, 5]}], "supplement": [{"title": "medical anthropology", "text": "질병과 치료를 몸의 문제만이 아니라 문화·사회·불평등의 맥락에서도 살피는 분야다."}, {"title": "전기문 읽기의 기준", "text": "연도와 장소를 따로 외우기보다 ‘어디에서 무엇을 했는가’를 짝지으면 선지의 순서 바꾸기를 잡기 쉽다."}], "learning_visual": {"layout": "timeline", "preview_title": "의사이자 인류학자, Paul Farmer의 발자취", "preview_caption": "의학 공부와 현장 활동이 가난한 사람들을 위한 보건 사업으로 어떻게 이어졌는지 살펴보자.", "preview_items": [{"label": "출생과 성장", "text": "1959년 출생, 사회적 불평등을 일찍 인식", "refs": [2]}, {"label": "대학 시절", "text": "프랑스어를 익혀 훗날 아이티 활동에 활용", "refs": [3]}], "title": "한 사람의 삶을 따라가며 읽기", "items": [{"label": "출발", "text": "1959년 출생, 사회적 불평등을 일찍 인식했다", "refs": [1, 2]}, {"label": "대학 시절", "text": "프랑스어를 익혀 훗날 아이티 활동에 활용했다", "refs": [3]}, {"label": "현장과 공부", "text": "아이티 병원에서 봉사하고 하버드에서 의학 인류학을 연구했다", "refs": [4, 5]}, {"label": "지속한 일", "text": "1987년 Partners In Health를 공동 설립하고 여러 나라의 치료·보건을 도왔다", "refs": [6, 7, 8]}], "takeaway": "이 지문의 중심은 수상 이력보다 가난한 사람들의 건강을 위한 연구와 현장 활동의 연결이다."}}, {"id": "q29", "source_label": "2026년 9월 고1 · 29번", "sentences": [{"n": 1, "en": "To understand how breathing affects athletic performance, we first need to understand how the body makes energy from air and food.", "ko": "호흡이 운동 수행 능력에 어떻게 영향을 미치는지를 이해하기 위해서는, 우리는 먼저 신체가 공기와 음식으로부터 어떻게 에너지를 만들어 내는지 를 이해할 필요가 있다."}, {"n": 2, "en": "There are two options: with oxygen, a process known as aerobic respiration, and without it, which is called anaerobic respiration.", "ko": "두 가지 옵션이 있는데, 산소를 사용하는 것은 유산소 호흡 이라고 알려진 과정이고, 산소 없이 이루어지는 것은 무산소 호흡 이라고 불린다."}, {"n": 3, "en": "Anaerobic energy is generated only with glucose (a simple sugar), and it’s quicker and easier for our bodies to access.", "ko": "무산소 에너지는 오직 포도당(단순당)만으로 생성되며, 그것은 우리 몸이 이용하기에 더 빠르고 더 쉽다."}, {"n": 4, "en": "It’s a kind of backup system and turbo boost when the body doesn’t have enough oxygen.", "ko": "그것은 몸에 충분한 산소가 없을 때의 일종의 예비 시스템이자 터보 부스트 이다."}, {"n": 5, "en": "But anaerobic energy is inefficient and can be toxic, creating too much lactic acid.", "ko": "그러나 무산소 에너지는 비효율적이고 독성을 띨 수도 있으며, 너무 많은 젖산을 만들어 낸다."}, {"n": 6, "en": "The sickness, muscle weakness, and sweating you experience after you’ve pushed it too hard at the gym is the feeling of anaerobic overload.", "ko": "헬스장에서 자신을 지나치게 몰아붙인 뒤 경험하게 되는 메스꺼움, 근육 약화, 그리고 땀은 바로 무산소 과부하 라는 느낌이다."}, {"n": 7, "en": "This process explains why the first few minutes of an intense workout are often so miserable.", "ko": "이 과정은 왜 고강도 운동의 처음 몇 분이 흔히 그렇게 힘든지 를 설명해 준다."}, {"n": 8, "en": "Our lungs and respiratory system haven’t caught up to supply the oxygen our bodies need, and so the body has to use anaerobic respiration.", "ko": "우리의 폐와 호흡계는 아직 우리 몸이 필요로 하는 산소를 공급할 만큼 따라잡지 못했기 때문에, 몸은 무산소 호흡을 사용할 수밖에 없다."}, {"n": 9, "en": "This also explains why, after we’re warmed up, exercise feels easier.", "ko": "이것은 또한 왜 우리가 몸이 충분히 풀린 뒤에는 운동이 더 쉽게 느껴지는지 도 설명해 준다."}, {"n": 10, "en": "The body has switched from anaerobic to aerobic respiration.", "ko": "몸이 무산소에서 유산소 호흡으로 전환한 것이다."}], "core": "몸은 산소를 쓰는 길과 쓰지 않는 길로 에너지를 만들고, 운동 중에 그 사이를 갈아탄다.", "flow": [{"label": "열기", "sentences": "S1", "text": "호흡과 운동을 이으려면 에너지 만드는 법부터 알아야 한다", "refs": [1]}, {"label": "가름", "sentences": "S2", "text": "산소를 쓰는 유산소와 쓰지 않는 무산소, 둘이다", "refs": [2]}, {"label": "특징", "sentences": "S3–4", "text": "무산소는 포도당만으로 빠르게 꺼내 쓰는 예비 장치다", "refs": [3, 4]}, {"label": "대가", "sentences": "S5–6", "text": "비효율적이고 젖산을 쌓아 메스꺼움·근육 약화·땀을 부른다", "refs": [5, 6]}, {"label": "적용", "sentences": "S7–8", "text": "그래서 고강도 운동 처음 몇 분이 힘들다 — 호흡계가 산소를 못 따라잡는다", "refs": [7, 8]}, {"label": "전환", "sentences": "S9–10", "text": "몸이 풀리면 무산소에서 유산소로 갈아타 운동이 쉬워진다", "refs": [9, 10]}], "structure": [{"title": "무산소 — 빠르지만 비싸다", "text": "포도당만으로 즉시 꺼내 쓴다. 비효율적이고 젖산이 쌓여 몸이 괴롭다"}, {"title": "유산소 — 느리지만 값싸다", "text": "산소를 써서 만든다. 몸이 풀려 공급이 따라잡히면 이쪽으로 갈아탄다"}], "short_title": "29번 · 몸이 에너지를 갈아타는 순간", "lead": "운동 첫 몇 분은 괴로운데, 몸이 풀리면 왜 갑자기 쉬워질까?", "image": "../../assets/g1-29-energy-pathways.webp", "image_alt": "같은 달리기 선수가 운동 초반에는 힘겨워하고, 호흡이 따라잡은 뒤에는 안정적으로 달리는 연속 장면", "image_caption": "산소 공급이 부족한 초반에는 무산소 호흡을 쓰지만, 몸이 풀리면 유산소 호흡으로 전환한다.", "before_question": "운동을 시작한 직후보다 몸이 풀린 뒤 더 쉽게 느껴지는 까닭은 무엇일까?", "prediction_choices": ["근육이 에너지를 더 이상 쓰지 않아서", "몸이 무산소 호흡에서 유산소 호흡으로 전환해서", "젖산이 에너지원으로 완전히 바뀌어서"], "prediction_actual": "호흡계가 필요한 산소 공급을 따라잡으면서 몸이 무산소에서 유산소 호흡으로 전환한다.", "blocking_vocab": [{"word": "aerobic respiration", "meaning": "유산소 호흡"}, {"word": "anaerobic respiration", "meaning": "무산소 호흡"}, {"word": "backup system", "meaning": "예비 시스템"}, {"word": "lactic acid", "meaning": "젖산"}, {"word": "catch up", "meaning": "뒤처진 상태를 따라잡다"}], "visual_links": [{"label": "초반의 고통", "refs": [5, 6, 7]}, {"label": "산소 부족", "refs": [4, 8]}, {"label": "유산소로 전환", "refs": [9, 10]}], "core_check": {"q": "운동 중 에너지 생산의 변화를 가장 정확하게 설명한 것은?", "choices": ["운동 내내 몸은 산소 없이 같은 방식으로 에너지를 만든다.", "몸은 초반에 빠른 무산소 호흡을 쓰다가 산소 공급이 따라잡으면 유산소 호흡으로 전환한다.", "유산소 호흡은 빠르지만 젖산을 많이 만들어 운동을 어렵게 한다."], "answer": 1, "why": "S3~8은 초반 무산소 호흡의 특징과 부담을, S9~10은 몸이 풀린 뒤 유산소 호흡으로 바뀌는 과정을 설명한다.", "refs": [3, 4, 5, 7, 8, 9, 10]}, "precision": [{"type": "근거·지칭", "q": "S7의 This process가 가리키는 것은?", "choices": ["산소가 충분한 유산소 호흡", "산소가 부족할 때 무산소 에너지를 쓰며 과부하가 생기는 과정", "음식을 포도당으로 바꾸지 않는 과정"], "answer": 1, "why": "S3~6에서 설명한 무산소 에너지의 빠른 사용과 젖산·불편함의 과정을 가리킨다.", "refs": [3, 4, 5, 6, 7]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["After warming up, exercise feels easier because the body switches from anaerobic to aerobic respiration.", "After warming up, the body stops receiving oxygen and relies more heavily on anaerobic respiration."], "answer": 0, "why": "S9~10은 몸이 풀린 뒤 무산소에서 유산소 호흡으로 전환해 운동이 쉬워진다고 말한다.", "refs": [9, 10]}], "supplement": [{"title": "빠른 것과 효율적인 것은 다르다", "text": "무산소 에너지는 빨리 꺼내 쓰기 쉽지만 비효율적이고 부담이 크다. 빠르다는 말이 더 좋은 방식이라는 뜻은 아니다."}, {"title": "switch from A to B", "text": "A에서 B로 전환한다는 표현이다. 이 지문의 마지막 인과를 한 번에 묶어 주는 핵심 구조다."}], "learning_visual": {"layout": "principle-timeline", "preview_mode": "image", "preview_title": "운동을 시작할 때와 몸이 풀린 뒤, 왜 느낌이 다를까?", "preview_caption": "산소 공급이 따라오는 시점을 기준으로 에너지 경로가 달라진다.", "preview_items": [{"label": "시작 직후", "text": "산소 공급이 아직 부족함", "refs": [7, 8]}, {"label": "몸이 풀린 뒤", "text": "산소를 쓰는 경로로 전환", "refs": [9, 10]}], "title": "산소 공급에 따라 바뀌는 에너지 경로", "items": [{"label": "먼저 알아둘 분류", "text": "산소를 쓰는 유산소·쓰지 않는 무산소 호흡이 있다", "refs": [1, 2]}, {"label": "강한 운동 초반", "text": "폐가 산소 수요를 따라잡기 전이라 무산소 경로를 쓴다", "refs": [3, 4, 7, 8]}, {"label": "초반의 어려움", "text": "글은 무산소 경로의 과부하가 괴로운 느낌과 연결된다고 설명한다", "refs": [5, 6, 7]}, {"label": "워밍업 후", "text": "산소 공급이 따라오면 유산소 경로로 바뀌어 더 수월해진다", "refs": [9, 10]}], "takeaway": "글은 운동 초반 산소 공급의 부족과 몸이 풀린 뒤 달라진 호흡 경로를 대비한다."}}, {"id": "q30", "source_label": "2026년 9월 고1 · 30번", "sentences": [{"n": 1, "en": "Keep your paragraphs short.", "ko": "단락을 짧게 유지하라 ."}, {"n": 2, "en": "Writing is visual ― it catches the eye before it has a chance to catch the brain.", "ko": "글쓰기는 시각적인데 즉 그것이 뇌를 사로잡을 기회를 갖기 전에 눈을 사로잡는다 ."}, {"n": 3, "en": "Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type can discourage a reader from even starting to read.", "ko": "짧은 단락은 당신이 쓴 것 주변에 여백을 넣어 그것을 매력적으로 보이게 하는 반면, 긴 활자 덩어리는 독자가 아예 읽기 시작하는 것조차 꺼리게 만들 수 있다."}, {"n": 4, "en": "Newspaper paragraphs should be only two or three sentences long; newspaper type is set in a narrow width, and the inches quickly add up.", "ko": "신문 단락은 오직 두세 문장 길이여야 하는데, 신문의 활자는 좁은 폭으로 짜여 있고, 인치는 빠르게 늘어난다."}, {"n": 5, "en": "You may think such frequent paragraphing will damage the development of your point.", "ko": "당신은 이러한 잦은 단락 나누기가 당신의 요지 전개에 해를 입힐 것이라고 생각할 수도 있다."}, {"n": 6, "en": "Obviously The New Yorker is obsessed by this fear ― a reader can go for miles without relief.", "ko": "명백히 The New Yorker는 이 두려움에 사로잡혀 있는데, 독자는 쉼 없이 수 마일을 갈 수 있다."}, {"n": 7, "en": "Don’t worry; the gains far outweigh the hazards.", "ko": "걱정하지 마라. 얻는 이점이 위험성을 훨씬 능가한다 ."}, {"n": 8, "en": "But don’t go too far.", "ko": "하지만 너무 지나치지는 말라 ."}, {"n": 9, "en": "A succession of tiny paragraphs is as annoying as a paragraph that’s too long.", "ko": "아주 작은 단락의 연속은 너무 긴 단락만큼이나 짜증스럽다 ."}, {"n": 10, "en": "I’m thinking of all those tiny paragraphs ― verbless wonders ― written by modern journalists trying to make their articles quick ‘n’ easy.", "ko": "나는 기사를 빠르‘고’ 쉽게 만들려고 애쓰는 현대의 기자들에 의해 쓰여진 그 모든 아주 작은 단락들, 즉 동사가 없는 경이로운 것들을 떠올리고 있다."}, {"n": 11, "en": "Actually they make the reader’s job harder by chopping up a natural train of thought.", "ko": "사실 그것들은 자연스러운 생각의 맥락을 잘라내 버림으로써 독자의 일을 더 어렵게 만든다 ."}], "core": "단락은 짧게 — 다만 생각의 맥락이 끊길 만큼 잘게 쪼개지는 말라.", "flow": [{"label": "주장", "sentences": "S1", "text": "단락을 짧게 유지하라", "refs": [1]}, {"label": "까닭", "sentences": "S2–3", "text": "글은 뇌보다 눈이 먼저 잡는다 — 짧으면 여백이 생겨 읽고 싶어지고 길면 시작조차 꺼린다", "refs": [2, 3]}, {"label": "기준", "sentences": "S4", "text": "신문 단락은 두세 문장이면 된다", "refs": [4]}, {"label": "반론", "sentences": "S5–6", "text": "자주 끊으면 요지가 상할까 걱정하는 쪽도 있다", "refs": [5, 6]}, {"label": "답", "sentences": "S7–8", "text": "얻는 것이 훨씬 크다 — 다만 지나치지는 말라", "refs": [7, 8]}, {"label": "단서", "sentences": "S9–11", "text": "너무 잘게 쪼갠 단락은 짜증스럽고 생각의 맥락을 끊어 읽기를 더 어렵게 만든다", "refs": [9, 10, 11]}], "structure": [{"title": "문제 — 긴 활자 덩어리", "text": "여백이 없어 눈이 먼저 물러난다. 독자가 읽기 시작조차 꺼린다"}, {"title": "해결 — 짧은 단락, 그러나 지나치지 않게", "text": "여백이 생겨 읽고 싶어진다. 다만 잘게 쪼개면 생각의 맥락이 끊긴다"}], "short_title": "30번 · 짧게, 그러나 잘게는 말고", "lead": "긴 단락과 너무 잘게 끊긴 단락 사이에서 읽기 좋은 길이는 어디일까?", "image": "../../assets/g1-30-short-paragraphs.webp", "image_alt": "한쪽에는 빽빽한 긴 활자 덩어리, 가운데에는 여백 있는 짧은 단락, 다른 쪽에는 생각의 흐름을 끊는 지나치게 작은 단락들이 놓인 지면 그림", "image_caption": "짧은 단락은 눈에 여백을 주지만, 지나치게 쪼개면 자연스러운 생각의 흐름이 끊어진다.", "before_question": "글쓴이가 권하는 단락 구성은 무엇일까?", "prediction_choices": ["가능한 한 한 단락을 길게 유지하기", "짧되 생각의 흐름이 끊기지 않게 묶기", "모든 문장을 각각 한 단락으로 만들기"], "prediction_actual": "짧은 단락으로 여백을 주되, 자연스러운 생각의 맥락을 자를 만큼 잘게 쪼개지는 말아야 한다.", "blocking_vocab": [{"word": "inviting", "meaning": "읽고 싶게 만드는"}, {"word": "chunk of type", "meaning": "활자 덩어리"}, {"word": "outweigh", "meaning": "~보다 더 크다"}, {"word": "succession", "meaning": "연속"}, {"word": "train of thought", "meaning": "생각의 맥락"}], "visual_links": [{"label": "긴 활자 덩어리", "refs": [2, 3]}, {"label": "짧은 단락과 여백", "refs": [1, 3, 4]}, {"label": "지나친 파편화", "refs": [8, 9, 10, 11]}], "core_check": {"q": "글쓴이의 조언을 가장 정확하게 요약한 것은?", "choices": ["단락은 짧을수록 언제나 좋으므로 한 문장씩 나누어야 한다.", "독자의 눈을 위해 단락을 짧게 하되 생각의 흐름을 해칠 만큼 잘게 나누지는 말아야 한다.", "요지 전개를 위해 모든 단락을 길게 유지해야 한다."], "answer": 1, "why": "S1~7은 짧은 단락의 이점을, S8~11은 지나치게 작은 단락이 생각의 맥락을 자르는 문제를 함께 말한다.", "refs": [1, 3, 7, 8, 9, 11]}, "precision": [{"type": "근거·지칭", "q": "S6의 this fear가 가리키는 것은?", "choices": ["짧은 단락이 눈에 잘 띌 것이라는 기대", "잦은 단락 나누기가 요지 전개를 해칠 것이라는 걱정", "신문의 활자 폭이 좁아질 것이라는 걱정"], "answer": 1, "why": "바로 앞 S5의 ‘frequent paragraphing will damage the development of your point’를 받는다.", "refs": [5, 6]}, {"type": "변형 탐지", "q": "원문의 조언과 일치하는 문장을 고르세요.", "choices": ["Paragraphs should be short, but excessive fragmentation can make a natural train of thought harder to follow.", "A succession of tiny paragraphs is always easier to read than a longer coherent paragraph."], "answer": 0, "why": "S8~11은 지나치게 작은 단락의 연속도 긴 단락만큼 성가시고 생각의 맥락을 끊는다고 말한다.", "refs": [8, 9, 10, 11]}], "supplement": [{"title": "writing is visual", "text": "독자는 내용을 이해하기 전에 먼저 지면의 모양을 본다. 단락 길이가 의미뿐 아니라 읽기 시작할 마음에도 영향을 준다는 뜻이다."}, {"title": "균형형 주장", "text": "‘짧게 하라’가 끝이 아니다. But don’t go too far 뒤의 제한까지 포함해야 글쓴이의 온전한 주장이 된다."}], "learning_visual": {"layout": "branches", "preview_mode": "image", "preview_title": "짧은 단락이 무조건 좋을까?", "preview_caption": "빽빽한 글, 적당히 나뉜 글, 너무 잘게 쪼갠 글을 비교하자.", "preview_items": [{"label": "너무 김", "text": "시작하기 어렵다", "refs": [2, 3]}, {"label": "적당함", "text": "눈에 숨 쉴 공간을 준다", "refs": [1, 3]}, {"label": "너무 짧음", "text": "생각의 흐름이 끊긴다", "refs": [8, 9, 10, 11]}], "title": "단락 길이의 두 극단을 피하기", "items": [{"label": "판단 기준", "text": "독자가 로 퍼진다고 설명한다.", "refs": [2, 3, 4, 5, 6]}, "precision": [{"type": "근거·지칭", "q": "S5의 these things가 가리키는 것은?", "choices": ["마을의 특유한 사과 파이 같은 음식", "마을 밖 사람들이 싫어하는 태도", "우유를 처음 마신 시기"], "answer": 0, "why": "바로 앞 S4의 마을 특유 조리법으로 만든 사과 파이 같은 음식을 받는다.", "refs": [4, 5]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Tastes can spread from person to person almost regardless of the food's qualities.", "People's tastes remain independent of family, friends, school, and work."], "answer": 0, "why": "S3과 S6은 입맛을 사람들에게 배우며, 음식의 특성과 거의 무관하게 사람 사이로 퍼진다고 말한다.", "refs": [3, 6]}], "supplement": [{"title": "social의 범위", "text": "단순히 ‘사교적’이라는 뜻이 아니다. 가족·친구·학교·직장·마을 같은 관계망 속에서 형성된다는 뜻이다."}, {"title": "like viruses", "text": "입맛이 질병이라는 뜻이 아니라, 한 사람에게서 다른 사람으로 빠르게 옮겨 가는 방식을 비유한다."}], "learning_visual": {"layout": "branches", "preview_mode": "image", "preview_title": "입맛은 음식 안에만 있을까?", "preview_caption": "가족·친구·마을 사람들과의 관계가 음식에 대한 마음을 어떻게 바꾸는지 보자.", "preview_items": [{"label": "음식 자체", "text": "맛과 성질", "refs": [2, 6]}, {"label": "사람 사이", "text": "함께 먹고 보는 관계", "refs": [2, 3, 5, 6]}], "title": "사람을 따라 생기고 퍼지는 입맛", "items": [{"label": "출발", "text": "입맛은 개인만의 감각이 아니라 사회적이다", "refs": [1]}, {"label": "가까운 관계", "text": "가족·친구·학교·일터에서 먹는 법을 배운다", "refs": [2, 3]}, {"label": "집단의 정체성", "text": "한 마을의 사과파이는 그 집단에 속한 사람에게 의미가 있다", "refs": [4, 5]}, {"label": "퍼짐과 거부", "text": "누가 좋아하느냐를 보며 취향이 옮거나 멀어지기도 한다", "refs": [6, 7, 8, 9]}], "takeaway": "사과파이·샐러드의 맛을 평가하는 글이 아니다. 음식의 성질보다 사회적 관계가 취향을 만든다는 주장이다."}}, {"id": "q32", "source_label": "2026년 9월 고1 · 32번", "sentences": [{"n": 1, "en": "One of the most fascinating and empowering insights in Stoic philosophy is that our emotions are not random; they arise from our judgments.", "ko": "스토아 철학에서 가장 매혹적이고 힘을 주는 통찰 중 하나는 우리의 감정이 임의적이지 않다는 것이다. 즉, 그것들은 우리의 판단으로부터 생겨난다 ."}, {"n": 2, "en": "This may sound surprising, especially if you’ve ever felt overwhelmed by anger, fear, or sadness.", "ko": "이것은 특히 만약 당신이 분노, 두려움 또는 슬픔에 압도당해 본 적이 있다면 놀랍게 들릴 수 있다."}, {"n": 3, "en": "But the Stoics taught that emotions aren’t just automatic reactions.", "ko": "하지만 스토아학파는 감정이 단지 자동적인 반응이 아니라고 가르쳤다."}, {"n": 4, "en": "They’re shaped by how we interpret events.", "ko": "그것들은 어떻게 우리가 사건을 해석하는지에 의해 형성된다 ."}, {"n": 5, "en": "Here’s how it works: something happens, you interpret what it means, and that interpretation triggers an emotional response.", "ko": "여기에 그것이 작동하는 방식이 있다. 무언가가 발생하면, 당신은 그것이 무엇을 의미하는지 해석하고, 그 해석은 감정적 반응을 일으킨다 ."}, {"n": 6, "en": "For example: If someone criticizes you, you may feel angry not due to the words themselves but because you perceive the comment as unfair or threatening.", "ko": "예를 들어, 만약 누군가가 당신을 비난한다면, 당신은 그 말 자체 때문이 아니라 당신이 그 언급을 불공정하거나 위협적이라고 인식하기 때문에 화가 날 수 있다."}, {"n": 7, "en": "If you lose a job, you might feel devastated not simply because of the job loss but because you believe it defines your worth or future.", "ko": "만약 당신이 일자리를 잃는다면, 당신은 단지 일자리 상실 때문만이 아니라 그것이 당신의 가치나 미래를 규정한다고 믿기 때문에 망연자실할 수 있다."}, {"n": 8, "en": "Change the judgment, and you change the emotion.", "ko": "그 해석을 바꿔라 , 그러면 당신은 그 감정을 바꾼다."}, {"n": 9, "en": "This doesn’t mean suppressing how you feel; it means examining the story you tell yourself and choosing one that serves you better.", "ko": "이것은 당신이 어떻게 느끼는지를 억누르는 것을 의미하는 것이 아니라, 그것은 당신이 스스로에게 하는 이야기를 점검하고 당신에게 더 도움이 되는 것을 선택하는 것을 의미한다."}], "core": "감정은 사건이 아니라 그 사건을 어떻게 해석하느냐에서 생겨난다.", "flow": [{"label": "통찰", "sentences": "S1", "text": "감정은 임의적이지 않고 우리의 판단에서 생겨난다", "refs": [1]}, {"label": "반응", "sentences": "S2–3", "text": "압도되어 본 사람에게는 놀랍겠지만 감정은 단순한 자동 반응만은 아니다", "refs": [2, 3]}, {"label": "원리", "sentences": "S4–5", "text": "감정은 해석으로 빚어진다 — 사건 → 해석 → 감정", "refs": [4, 5]}, {"label": "보기", "sentences": "S6–7", "text": "비난에 화나는 것도 실직에 무너지는 것도 말이나 사건이 아니라 인식과 믿음 때문이다", "refs": [6, 7]}, {"label": "쓰임", "sentences": "S8–9", "text": "판단을 바꾸면 감정이 바뀐다 — 억누르라는 말이 아니라 이야기를 점검하라는 말이다", "refs": [8, 9]}], "structure": [{"title": "원인 — 해석과 판단", "text": "사건이 무엇을 뜻한다고 보는가. 불공정하다 · 나를 iew_mode": "image", "preview_title": "비판을 들으면 왜 화가 날까?", "preview_caption": "말 자체와 그 말을 '부당하다'고 받아들이는 해석을 분리해 보자.", "preview_items": [{"label": "사건", "text": "누군가 나를 비판한다", "refs": [6]}, {"label": "사이의 한 단계", "text": "그 뜻을 어떻게 해석할까?", "refs": [4, 5, 6]}], "title": "사건과 감정 사이에는 해석이 있다", "items": [{"label": "사건", "text": "비판을 듣거나 직장을 잃는다", "refs": [5, 6, 7]}, {"label": "해석", "text": "그 일을 부당하거나 위협적이라고, 혹은 내 가치에 관한 일이라고 판단한다", "refs": [4, 5, 6, 7]}, {"label": "감정", "text": "그 판단에 따라 분노나 슬픔이 생긴다", "refs": [1, 5, 6, 7]}, {"label": "스토아 철학의 제안", "text": "감정을 억누르기보다 자신의 해석을 점검한다", "refs": [8, 9]}], "takeaway": "스토아 철학의 관점은 '감정이 없어야 한다'가 아니다. 사건에 붙인 의미를 살펴보자는 것이다."}}, {"id": "q33", "source_label": "2026년 9월 고1 · 33번", "sentences": [{"n": 1, "en": "The ancient Greeks felt that the visual artist’s goal was to copy visual experience.", "ko": "고대 그리스인들은 시각 예술가의 목표가 시각적 경험을 모방하는 것 이라고 생각했다."}, {"n": 2, "en": "This approach appears in the realism of ancient Greek sculpture and pottery.", "ko": "이런 접근은 고대 그리스 조각과 도자기의 사실주의 에 나타난다."}, {"n": 3, "en": "We must sadly note that, due to the action of time and weather, no paintings from ancient Greek artists exist today.", "ko": "우리는 시간과 날씨의 작용 때문에 고대 그리스 예술가들의 회화 작품이 오늘날 존재하지 않는다는 점 을 슬프게도 주목해야 한다."}, {"n": 4, "en": "We can only surmise their quality based on tales such as that of Zeuxis and Parhassios, the obvious skill in ancient Greek sculpture, and in drawings that survive on ancient Greek pottery.", "ko": "우리는 Zeuxis와 Parhassios의 그것과 같은 이야기, 고대 그리스 조각의 분명한 기량, 그리고 고대 그리스 도자기 위에 남아있는 그림들을 바탕으로 그것들의 질을 오직 짐작할 수 있을 뿐 이다."}, {"n": 5, "en": "This definition of art as copying reality has a problem, though.", "ko": "하지만, 현실을 모방하는 것으로의 예술의 이런 정의는 문제가 있다 ."}, {"n": 6, "en": "Jackson Pollock, a leader in the New York School of the 1950’s, intentionally did not copy existing objects in his art.", "ko": "1950년대 뉴욕 화파의 리더 Jackson Pollock은 그의 예술 안에서 기존 사물을 의도적으로 모방하지 않았다 ."}, {"n": 7, "en": "While painting these works, Pollock and his fellow artists would consciously avoid making marks or passages that resembled recognizable objects.", "ko": "이러한 작품들을 그리는 동안, Pollock과 그의 동료 예술가들은 알아볼 수 있는 사물과 닮은 흔적이나 부분을 만드는 것을 의식적으로 피하곤 했다 ."}, {"n": 8, "en": "They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis ― simple copying ― does not sufficiently define art.", "ko": "그들은 어떤 것도 모방하지 않은 예술 작품을 만드는 데 성공했고, 그러므로 모사, 즉 단순한 모방으로서의 고대 그리스 예술관은 예술을 충분히 정의하지는 못한다 는 점을 보여주었다."}], "core": "예술을 현실의 모방으로 보는 정의는 폴록 앞에서 무너진다.", "flow": [{"label": "정의", "sentences": "S1–2", "text": "고대 그리스는 예술가의 목표를 본 것의 모방으로 보았고 조각과 도자기가 그 증거다", "refs": [1, 2]}, {"label": "단서", "sentences": "S3–4", "text": "그리스 회화는 남지 않아 이야기와 조각·도자기 그림으로 짐작할 뿐이다", "refs": [3, 4]}, {"label": "전환", "sentences": "S5", "text": "그런데 이 정의에는 문제가 있다", "refs": [5]}, {"label": "반례", "sentences": "S6–7", "text": "폴록과 동료들은 알아볼 수 있는 것과 닮은 흔적을 의식적으로 피했다", "refs": [6, 7]}, {"label": "결론", "sentences": "S8", "text": "아무것도 모방하지 않은 작품이 나왔으므로 모방으로서의 예술관은 부족하다", "refs": [8]}], "structure": [{"title": "모방으로서의 예술 — mimesis", "text": "본 것을 그대로 옮기는 것. 그리스 조각과 도자기의 사실주의가 그 얼굴이다"}, {"title": "모방하지 않는 예술 — 폴록", "text": "알아볼 수 있는 것과 닮은 흔적을 일부러 피한다. 아무것도 모방하지 않고도 예술이 된다"}], "short_title": "33번 · 모방만으로 예술을 정의할 수 있을까", "lead": "아무것도 닮지 않은 그림도 예술이라면, ‘예술은 현실의 모방’이라는 정의는 충분할까?", "image": "../../assets/g1-33-art-definition.webp", "image_alt": "박물관에서 학생이 사실적인 고대 그리스 부조와 도자기, 알아볼 수 있는 사물을 닮지 않은 추상 회화를 비교하는 그림", "image_caption": "현실을 닮게 만든 고대 그리스 작품과, 알아볼 수 있는 대상을 피한 비재현 회화가 예술의 정의를 시험한다.", "before_question": "폴록의 작품이 드러내는 문제는 무엇일까?", "prediction_choices": ["그리스 작품은 기술이 부족했다.", "현실 모방만으로는 예술 전체를 충분히 정의할 수 없다.", "알아볼 수 있는 대상을 그려야만 예술이 된다."], "prediction_actual": "아무것도 모방하지 않은 작품도 예술이 될 수 있으므로, 현실의 단순한 모방만으로는 예술을 충분히 정의할 수 없다.", "blocking_vocab": [{"word": "visual experience", "meaning": "시각적 경험"}, {"word": "surmise", "meaning": "짐작하다"}, {"word": "resemble", "meaning": "~을 닮다"}, {"word": "recognizable", "meaning": "알아볼 수 있는"}, {"word": "mimesis", "meaning": "모방·모사"}], "visual_links": [{"label": "그리스의 사실주의", "refs": [1, 2, 3, 4]}, {"label": "닮지 않은 흔적", "refs": [6, 7]}, {"label": "정의의 한계", "refs": [5, 8]}], "core_check": {"q": "글의 결론을 가장 정확하게 담은 것은?", "choices": ["고대 그리스 회화가 남아 있지 않으므로 예술을 정의할 수 없다.", "비재현 작품의 존재는 예술을 현실의 모방으로만 정의하기에 부족함을 보여 준다.", "폴록은 기존 사물을 더 정확하게 모방해 그리스 예술관을 완성했다."], "answer": 1, "why": "S5~8은 현실 모방이라는 정의를 제시한 뒤, 알아볼 수 있는 대상을 피한 작품을 반례로 들어 그 정의가 불충분하다고 결론 낸다.", "refs": [5, 6, 7, 8]}, "precision": [{"type": "근거·지칭", "q": "S8의 They가 가리키는 것은?", "choices": ["ancient Greek artists", "Pollock and his fellow artists", "recognizable objects"], "answer": 1, "why": "S7의 Pollock and his fellow artists를 받아, 그들이 아무것도 모방하지 않은 작품을 만드는 데 성공했다고 이어 간다.", "refs": [7, 8]}, {"type": "변형 탐지", "q": "원문의 뜻과 일치하는 문장을 고르세요.", "choices": ["Pollock deliberately avoided marks that looked like recognizable objects.", "Pollock demonstrated that all art must copy existing reality."], "answer": 0, "why": "S6~8은 폴록이 기존 사물을 모방하지 않고 알아볼 수 있는 흔적을 의식적으로 피했다고 설명한다.", "refs": [6, 7, 8]}], "supplement": [{"title": "mimesis", "text": "현실이나 경험을 예술이 닮게 재현한다는 개념이다. 글은 이 정의가 틀렸다고 하기보다 ‘충분하지 않다’고 말한다."}, {"title": "반례의 논리", "text": "정의가 모든 예술을 설명해야 하는데, 모방하지 않은 작품도 예술이라면 ‘예술=모방’이라는 정의에는 빈틈이 생긴다."}], "learning_visual": {"layout": "compare-conclusion", "preview_mode": "image", "preview_title": "실물을 닮지 않아도 예술일까?", "preview_caption": "그리스의 모방관과 폴록의 비재현 회화를 대비해 보자.", "preview_items": [{"label": "고대의 기준", "text": "보이는 현실을 복제한다", "refs": [1, 2]}, {"label": "반례", "text": "아무 사물도 닮지 않게 그린다", "refs": [6, 7]}], "title": "예술=현실 복사라는 정의의 반례", "items": [{"label": "그리스의 생각", "text": "시각 예술은 보이는 현실을 모방한다", "refs": [1, 2, 3, 4]}, {"label": "폴록의 작품", "text": "알아볼 수 있는 사물을 의도적으로 닮지 않게 했다", "refs": [5, 6, 7]}, {"label": "논리적 결론", "text": "복사하지 않은 것도 예술이므로 모방만으로는 예술을 정의할 수 없다", "refs": [8]}], "takeaway": "폴록의 작품이 그리스 작품보다 우월하다는 비교가 아니라, 옛 정의가 모든 작품을 포괄하지 못한다는 논증이다."}}, {"id": "q34", "source_label": "2026년 9월 고1 · 34번", "sentences": [{"n": 1, "en": "If our bodies know best, why are they easily injured when we do something so seemingly natural as running?", "ko": "만약 우리의 몸이 가장 잘 안다면, 왜 그들은 우리가 달리기처럼 겉보기에 자연스러운 무언가를 할 때 쉽게 다칠까 ?"}, {"n": 2, "en": "On the one hand, running seems very easy, but that is only because our bodies are so very good at it.", "ko": "한편으로, 달리기는 매우 쉬워 보이지만, 그것은 오직 우리의 몸이 그것을 아주 잘하기 때문 이다."}, {"n": 3, "en": "The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs.", "ko": "지구상의 가장 강력한 슈퍼 컴퓨터도 매인 줄이 풀린 채 두 다리로 달리는 데 필요한 엄청난 수의 계산 을 처리할 수 없다."}, {"n": 4, "en": "Wherever our running intelligence is, running is not all conscious to us and is so complicated that only the T-1000 Terminators of our imagination are able to do it.", "ko": "우리의 달리기 지능이 어디에 있든 간에, 달리기는 우리에게 완전히 의식적이지 않고 , 너무 복잡해서 오직 우리의 상상 속 T-1000 터미네이터만이 그것을 할 수 있다."}, {"n": 5, "en": "Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities.", "ko": "우리의 달리기 지식은 근섬유, 세포, 그리고 우리의 DNA 속에 아주 깊이 묻혀 있기 때문에, 우리는 우리가 그것의 복잡성을 완전히 설명할 수 없다는 것 을 받아들여야 한다."}, {"n": 6, "en": "That doesn’t mean our bodies don’t know how to do it.", "ko": "그것은 우리의 몸이 그것을 어떻게 하는지 모른다는 것 을 의미하지는 않는다."}, {"n": 7, "en": "We may feel our way towards understanding the alchemy of running by learning how to use our senses, getting them firing, and seeing what they are capable of, and accepting that our bodies know more about running than we ever will.", "ko": "우리는 우리의 감각을 사용하는 법을 배우고, 그것들을 활성화하게 하고, 그리고 그것들이 무엇을 할 수 있는지 봄으로써, 달리기의 연금술을 이해하고, 우리의 몸이 우리가 장차 그러할 것보다 달리기에 대해 더 잘 알고 있다는 것 을 받아들이는 쪽으로 더듬어 나아갈 수 있다."}], "core": "달리기의 앎은 몸속 깊이 묻혀 있어 말로 다 풀 수 없다.", "flow": [{"label": "물음과 반론", "sentences": "S1–2", "text": "몸이 잘 안다면 왜 달리다 다칠까? 달리기가 쉬워 보이는 까닭은 몸이 그만큼 잘하기 때문이다.", "refs": [1, 2]}, {"label": "복잡한 몸의 앎", "sentences": "S3–5", "text": "슈퍼컴퓨터도 다 계산하지 못할 만큼 복잡한 앎이 근섬유·세포·DNA에 담겨 있어 의식 the Sudoku puzzles that appear daily in newspapers.", "ko": "신문에 매일 실리는 스도쿠 퍼즐을 예로 들어보자."}, {"n": 3, "en": "The objective is to complete a 9 × 9 grid, starting from a few given numbers or clues, while ensuring that each row, each column and each 3 × 3 block contains all the digits from 1 to 9 once and only once.", "ko": "그 목표는 각 행, 각 열, 그리고 각 3×3 블록이 1부터 9까지의 모든 숫자를 한 번씩 그리고 오직 한 번만 포함하는 것을 확실하게 하면서, 몇 개의 주어진 숫자나 단서로부터 시작하여 9×9 격자를 완성하는 것이다."}, {"n": 4, "en": "But the numerical values of the digits are irrelevant; what is important is that there are nine distinct symbols.", "ko": "그러나 숫자의 수치적인 값은 관련이 없다 . 중요한 것은 아홉 개의 별개의 기호가 있다는 것이다."}, {"n": 5, "en": "They could be nine letters or nine shapes.", "ko": "그것들은 아홉 개의 글자 또는 아홉 개의 모양일 수도 있다."}, {"n": 6, "en": "It’s the pattern that matters.", "ko": "중요한 것은 패턴이다 ."}, {"n": 7, "en": "One Irish daily paper publishes these puzzles with the statement ‘There’s no maths involved, simply use reasoning and logic!’", "ko": "한 아일랜드 일간지는 ‘ 수학과 관련이 없습니다 . 단지 추론과 논리를 사용하세요!’라는 말과 함께 이러한 퍼즐을 게재했다."}, {"n": 8, "en": "It seems that even the idea that something might be spoiled by mathematics is enough to scare off potential solvers!", "ko": "수학에 의해서 더럽혀질지도 모른다는 ‘생각’만으로도 잠재적인 풀이자들을 겁주어 쫓아 버리기에 충분한 것처럼 보인다!"}, {"n": 9, "en": "Could you imagine the promotion of an exhibition in the National Gallery with the slogan ‘No art involved, just painting and sculpture’ ?", "ko": "당신은 ‘예술과 관련이 없습니다. 단지 그림과 조각 뿐’이라는 슬로건을 가진 국립 미술관의 전시회 홍보를 상상할 수 있겠는가?"}, {"n": 10, "en": "If you can do Sudoku, you can do maths!", "ko": "만약 당신이 스도쿠를 할 수 있다면, 당신은 수학을 할 수 있다 !"}], "core": "수학이 다루는 것은 숫자가 아니라 패턴이며 스도쿠가 그 증거다.", "flow": [{"label": "주장", "sentences": "S1", "text": "수학의 관심사는 숫자가 아니라 패턴·구조·대칭·연결이다", "refs": [1]}, {"label": "보기", "sentences": "S2–3", "text": "신문의 스도쿠 — 각 행·열·블록에 1~9를 한 번씩 채운다", "refs": [2, 3]}, {"label": "핵심", "sentences": "S4–6", "text": "숫자의 값은 상관없다. 글자든 모양이든 아홉 개의 별개 기호면 된다", "refs": [4, 5, 6]}, {"label": "역설", "sentences": "S7–8", "text":

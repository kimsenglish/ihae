</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">JINJU GIRLS' HIGH SCHOOL · GRADE 1</p><h1>진주여고1 · 올림포스 영독 기본1</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">전체 시험 범위: 3·4·5·8강과 9강 p60~63<br>현재 3·4·5강의 14지문이 연결되었습니다. 8강과 9강 7지문은 제작 중입니다.</div><div class="units" id="units"></div><p class="subnote">연결된 14지문에는 각각 원문 근거 시각 자료와 클릭형 문제 3개가 있습니다. 나머지는 연결 전입니다.</p></main>
<script id="course-data" type="application/json">{"course":"진주여고1 부교재","units":[{"id":"olym03","label":"올림포스 영독 기본1 · 3강","scope":"주장·요지","passages":[{"id":"olym03-01","title":"no.01","core":"멘토의 역할은 대신 생각해 주는 것이 아니라 멘티가 말하게 하고 잘 들어 주는 것이다."},{"id":"olym03-02","title":"no.02","core":"전문성과 창의력은 다른 것이어서 전문성이 커지면 창의력은 오히려 줄어들 수 있다."},{"id":"olym03-03","title":"no.03","core":"새 삶이나 진로는 미리 다 알 수 없으니 조각 그림 맞추듯 그림이 나타날 때까지 계속하면 된다."},{"id":"olym03-04","title":"no.04","core":"우리는 초기 습관을 고르지 않고 물려받은 각본을 따르며, 그 사회적 규범이 보이지 않는 규칙이 된다."}]},{"id":"olym04","label":"올림포스 영독 기본1 · 4강","scope":"함축적 의미","passages":[{"id":"olym04-01","title":"no.01","core":"조직은 원칙과 가치를 닻으로 남긴 채 전략과 그 밖의 모든 것을 바꿀 수 있다."},{"id":"olym04-02","title":"no.02","core":"개인적인 것처럼 보이는 대부분의 행동과 감정은 사회 규칙에 따라 해내는 수행이다."},{"id":"olym04-03","title":"no.03","core":"조리는 몸이 얻는 에너지를 늘려 최초 조리자에게 이점을 주고 인류 진화의 시작부터 몸을 바꿔 놓았다."},{"id":"olym04-04","title":"no.04","core":"텔레비전은 스포츠와 대중을 강력하게 묶어 스포츠 발전과 마케팅을 이끈 가장 중요한 매체가 되었다."}]},{"id":"olym05","label":"올림포스 영독 기본1 · 5강","scope":"주제·제목","passages":[{"id":"olym05-01","title":"p32 · 수능 대비 ANALYSIS","core":"미각이 뛰어난 사람은 특정 맛에 강하게 반응해 전반적으로 더 나은 건강 습관을 갖는다."},{"id":"olym05-02","title":"p34 · no.01","core":"전통적인 아프리카 사회에서 원로는 축적된 지식으로 인지적 문지기 노릇을 하며 이야기로 그것을 전한다."},{"id":"olym05-03","title":"p35 · no.02","core":"건축 법규는 위험의 피해를 줄이지만 좁은 목표와 공공 정책의 불평등 때문에 한계가 있다."},{"id":"olym05-04","title":"p36 · no.03","core":"긴장을 흥분이라고 자신에게 말하는 것만으로 불안한 에너지가 긍정적인 것으로 바뀐다."},{"id":"olym05-05","title":"p37 · 서술형 Practice","core":"방해 없이 자신을 진정시키는 조용한 시간이 명료성과 판단력을 되살린다."},{"id":"olym05-06","title":"p38 · 논술형 Practice","core":"진정한 사회 자본은 대면 관계에서 오므로 방해가 되는 전자 연결에 대처할 규칙을 미리 정해야 한다."}]}]}</script><script>

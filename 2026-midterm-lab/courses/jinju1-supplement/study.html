.diagram{overflow:hidden}
.diagram-items{counter-reset:visual-step}
.diagram-card{box-shadow:0 2px 0 rgba(13,76,57,.04)}
.diagram-card b{line-height:1.35}
.diagram-card small{font-variant-numeric:tabular-nums}
/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items,.diagram.diagram-argument .diagram-items,
.diagram.diagram-steps-possible .diagram-items,.diagram.diagram-case-advice .diagram-items,
.diagram.diagram-steps-response .diagram-items,.diagram.diagram-cause-response .diagram-items,
.diagram.diagram-compare-open .diagram-items{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;
  border-left:3px solid #68aa91;margin-left:14px;padding-left:25px}
.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card,.diagram.diagram-argument .diagram-card,
.diagram.diagram-steps-possible .diagram-card,.diagram.diagram-case-advice .diagram-card,
.diagram.diagram-steps-response .diagram-card,.diagram.diagram-cause-response .diagram-card,
.diagram.diagram-compare-open .diagram-card{position:relative;counter-increment:visual-step}
.diagram.diagram-steps .diagram-card:before,.diagram.diagram-timeline .diagram-card:before,
.diagram.diagram-cycle .diagram-card:before,.diagram.diagram-argument .diagram-card:before,
.diagram.diagram-steps-possible .diagram-card:before,.diagram.diagram-case-advice .diagram-card:before,
.diagram.diagram-steps-response .diagram-card:before,.diagram.diagram-cause-response .diagram-card:before,
.diagram.diagram-compare-open .diagram-card:before{content:counter(visual-step);position:absolute;left:-47px;top:10px;
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:#176b52;color:#fff;font-size:12px;font-weight:800;border:3px solid #f0f6ef}
.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-possible .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-case-advice .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-response .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cause-response .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-compare-open .diagram-items .diagram-card:not(:last-child):after{
  content:'↓';position:absolute;left:-39px;bottom:-26px;margin:0;padding:0 2px;
  color:#176b52;background:#f0f6ef;line-height:1.2;font-size:17px;font-weight:800}
.diagram.diagram-cycle .diagram-items:after{content:'↶ 반복되는 해석';font-size:12px;color:#176b52;
  font-weight:750;margin:-13px 0 0 4px}
/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.diagram.diagram-condition .diagram-card:first-child,.diagram.diagram-branches .diagram-card:first-child{
  grid-column:1/-1;background:#dceee5;border-color:#82baa2;position:relative}
.diagram.diagram-condition .diagram-card:first-child:after,.diagram.diagram-branches .diagram-card:first-child:after{
  content:'↙                 ↘';position:absolute;bottom:-25px;left:0;right:0;text-align:center;
  color:#176b52;font-size:18px;font-weight:900;white-space:pre}
.diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.diagram.diagram-compare .diagram-card,.diagram.diagram-cases .diagram-card{
  border-top:5px solid #1b795c;background:linear-gradient(180deg,#f9fffb,#fff 48%)}
.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}
.diagram.diagram-web .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.diagram.diagram-web .diagram-card:first-child{grid-column:1/-1;justify-self:center;width:min(100%,360px);
  background:#dceee5;border-color:#498f6e;border-radius:100px;position:relative}
.diagram.diagram-web .diagram-card:first-child:after{content:'↙                         ↘';
  position:absolute;left:0;right:0;bottom:-28px;color:#176b52;font-weight:900;white-space:pre}
.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;padding-top:23px}
.diagram.diagram-dose .diagram-items:before{content:'';position:absolute;top:10px;left:10%;right:10%;height:5px;
  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}
.diagram.diagram-dose .diagram-card:before{content:'';position:absolute;top:-23px;left:calc(50% - 7px);
  width:14px;height:14px;border-radius:50%;background:#176b52;border:3px solid #f0f6ef}
.diagram.diagram-dose .diagram-card:nth-child(2){background:#dceee5;border-color:#82baa2}
.diagram.diagram-dose .diagram-card b{font-size:18px}
/* Cooking: familiar side benefits are distinct from the source's energy-to-adaptation claim. */
.diagram.diagram-energy-route .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px}
.diagram.diagram-energy-route .diagram-card{position:relative;min-width:0;border-top:5px solid #237c5c;padding-top:35px;background:#fffdf8}
.diagram.diagram-energy-route .diagram-card:first-child{grid-column:1/-1;border:1px dashed #a9b8ad;background:#f8faf6;padding:10px 14px}
.diagram.diagram-energy-route .diagram-card:first-child:before{content:'먼저 떠오르는 장점';display:block;color:#65766b;font-size:11px;font-weight:800;margin-bottom:3px}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}
.diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'→';position:absolute;right:-19px;top:calc(50% - 16px);color:#176b52;font-size:26px;font-weight:900;z-index:1}
.diagram.diagram-energy-route .diagram-card:nth-child(2){background:#e5f4e9}.diagram.diagram-energy-route .diagram-card:nth-child(4){background:#fff2d9;border-top-color:#b78539}
/* The first pass shows only the visual map; stage 3 restores the evidence. */
.diagram.is-overview .diagram-card p,.diagram.is-overview .diagram-card small{display:none}
.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}
.diagram.is-overview .diagram-card b{font-size:15px}
.diagram.is-overview .diagram-takeaway{display:block;background:#dceee5;border:0;border-radius:11px;
  margin-top:14px;padding:10px 12px;text-align:center;color:#14543f}
/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}
.diagram.diagram-dialogue .diagram-card:before{content:'●';position:absolute;left:14px;top:13px;
  color:#176b52;font-size:24px;line-height:1}
.diagram.diagram-dialogue .diagram-card:after{content:'';position:absolute;left:12px;top:42px;
  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}
.diagram.diagram-dialogue .diagram-card:nth-child(2){background:#fff7e9;border-color:#c78f4b}
.diagram.diagram-dialogue .diagram-card:nth-child(2):before{color:#a96e2c}
.diagram.diagram-dialogue .diagram-card:nth-child(2):after{background:#a96e2c}
.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}
/* A claim supported by parallel examples ends in one explicit conclusion. */
.diagram.diagram-examples-conclusion .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}
.diagram.diagram-examples-conclusion .diagram-card:first-child{background:#e1efe7;border:2px solid #76ad91;text-align:center}
.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(-n+2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(-n+2){border-top:5px solid #1b795c}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Analogy maps one domain to another, followed by a concrete example. */
.diagram.diagram-analogy .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-analogy .diagram-card:nth-child(1){border-top:5px solid #1b795c}
.diagram.diagram-analogy .diagram-card:nth-child(2){border-top:5px solid #bd8141}
.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Three roles are simultaneous parts of one contrast, not a causal sequence. */
.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diagram.diagram-roles-contrast .diagram-card{border-top:5px solid #1b795c}
.diagram.diagram-roles-contrast .diagram-card:nth-child(2){border-top-color:#b25745}
.diagram.diagram-roles-contrast .diagram-card:nth-child(3){border-top-color:#bd8141}

<script id="course-data" type="application/json">{"course": "진주여고1 부교재", "units": [{"id": "olym03", "label": "올림포스 영독 기본1 · 3강", "scope": "주장·요지", "passages": [{"id": "olym03-01", "unit": "olym03", "number": 1, "title": "no.01", "sentences": [{"n": 1, "en": "It has been said that most people listen with the intention to reply rather than to understand.", "ko": "대부분 사람은 이해하려는 의도보다는 답변하려는 의도로 듣는다는 말이 있어 왔다.", "role": "흔한 말 놓기 — 사람들이 대답하려고 듣는다는 말을 먼저 깐다."}, {"n": 2, "en": "Your job as a mentor is to facilitate your mentee's thinking and not to try and do it for them, no matter how tempting that may be.", "ko": "멘토로서 여러분의 역할은 여러분의 멘티의 사고를 촉진하는 것이지 아무리 솔깃할 수 있다고 하더라도 멘티를 대신해서 그것을 해 주려고 애쓰는 것이 아니다.", "role": "역할 규정 — 멘토의 몫은 대신 해 주는 게 아니라고 못 박는다."}, {"n": 3, "en": "If, during a mentoring session, you realise you're doing most of the talking, then I'd respectfully suggest that you just stop, sit back and listen.", "ko": "만약 멘토링 시간 중에 여러분이 말 대부분을 하고 있다는 것을 깨닫는다면, 그냥 멈추고 가만히 있으면서 (멘티가 하는 말을) 듣기를 정중히 제안한다.", "role": "이르기 — 말을 많이 하고 있거든 멈추고 들으라고 이른다."}, {"n": 4, "en": "A good part of the mentee's learning process happens when he/she thinks out loud.", "ko": "멘티의 학습 과정의 상당 부분은 멘티가 생각을 입 밖에 내어 말할 때 발생한다.", "role": "근거 ① — 멘티는 소리 내어 생각할 때 배운다고 받친다."}, {"n": 5, "en": "The rest of it happens by reflection and practice outside mentoring sessions.", "ko": "나머지는 멘토링 시간 밖에서의 성찰과 실천에 의해 발생한다.", "role": "근거 ② — 나머지는 시간 밖 성찰과 실천에서 온다고 보탠다."}, {"n": 6, "en": "Therefore, your mentee should be doing most of the talking.", "ko": "따라서 여러분의 멘티가 대부분의 말을 해야 한다.", "role": "결론 — 그러니 멘티가 말을 더 해야 한다고 매듭짓는다."}, {"n": 7, "en": "Listening actively and empathically helps mentees to gain insight and to express themselves more effectively.", "ko": "적극적이고 공감하면서 경청하는 것은 멘티가 통찰을 얻고 자신을 더 효과적으로 표현하도록 돕는다.", "role": "효과 — 공감하며 들으면 통찰과 표현이 는다고 잇는다."}, {"n": 8, "en": "For your mentee to have a sense of being heard and of feeling acknowledged, it is essential that you listen well.", "ko": "여러분의 멘티가 경청되고 인정받는다고 느끼려면, 여러분이 잘 들어 주는 것이 극히 중요하다.", "role": "당부로 맺기 — 인정받는 느낌을 주려면 잘 들으라고 닫는다."}], "core": "멘토의 역할은 대신 생각해 주는 것이 아니라 멘티가 말하게 하고 잘 들어 주는 것이다.", "flow": [{"label": "문제", "sentences": "S1~3", "text": "대답하려고 듣거나 대신 생각하며 멘토가 말을 독점해서는 안 된다.", "refs": [1, 2, 3]}, {"label": "학습의 주체", "sentences": "S4~6", "text": "멘티는 생각을 소리 내어 말하고, 밖에서 반성·연습한다. 그래서 멘티가 더 많이 말해야 한다.", "refs": [4, 5, 6]}, {"label": "멘토의 역할", "sentences": "S7~8", "text": "적극적이고 공감적인 경청이 멘티의 통찰과 표현을 돕는다.", "refs": [7, 8]}], "structure": [{"title": "대답하려고 듣기", "text": "멘토가 말을 대부분 하고 멘티를 대신해 생각해 준다"}, {"title": "이해하려고 듣기", "text": "멘티가 소리 내어 생각하게 하고 멘토는 적극적·공감적으로 듣는다"}], "key_sentence_en": "A mentor's job is not to do the thinking for the mentee but to facilitate it, so the mentee should be doing most of the talking and it is essential that the mentor listen well.", "image": "../../assets/jinju1-olym03-01-mentor-listening.webp", "image_alt": "왼쪽에서는 멘토가 말을 많이 하고 멘티는 듣고 있다. 오른쪽에서는 멘티가 생각을 말하고 멘토는 주의 깊게 듣고 있다.", "image_caption": "S2~4·6~8: 멘토가 대신 생각하고 말하기보다, 멘티가 생각을 소리 내어 말하도록 경청해야 합니다. 두 장면은 글의 대비를 설명하는 개념 삽화입니다.", "blocking_vocab": [{"word": "mentee", "meaning": "멘티·지도를 받는 사람"}, {"word": "facilitate", "meaning": "돕다·촉진하다"}, {"word": "empathically", "meaning": "공감하며"}], "diagram": {"kind": "dialogue", "title": "멘토링의 대화 주체가 바뀌어야 한다", "items": [{"head": "멘토가 대신 말함", "body": "멘토가 대신 생각하고 답하려는 습관은 멘티의 생각을 막는다.", "refs": [1, 2, 3]}, {"head": "멘티가 생각을 말함", "body": "멘토가 적극적·공감적으로 들을 때 멘티의 통찰과 표현이 깊어진다.", "refs": [4, 6, 7, 8]}], "takeaway": "멘티가 더 많이 말하고, 멘토는 듣고 생각을 돕는다 · S2·S6~8"}, "checks": [{"type": "핵심", "q": "멘토가 해야 할 가장 중요한 일은?", "choices": ["멘티가 생각을 말하도록 돕고 잘 듣는다.", "멘티 대신 생각과 말을 끝낸다."], "answer": 0, "why": "S2·6~8에서 멘티가 주로 말하고 멘토가 잘 들어야 한다고 한다.", "refs": [2, 6, 7, 8]}, {"type": "학습 근거", "q": "멘티의 학습 과정 중 상당 부분은 언제 일어나는가?", "choices": ["멘토가 혼자 계속 설명할 때", "멘티가 생각을 소리 내어 말할 때"], "answer": 1, "why": "S4의 thinks out loud.", "refs": [4]}, {"type": "변형 탐지", "q": "S2의 역할과 일치하는 문장은?", "choices": ["A mentor should do the mentee's thinking for them.", "A mentor should facilitate the mentee's thinking."], "answer": 1, "why": "S2의 facilitate ... not ... do it for them을 확인한다.", "refs": [2]}], "easy_story": "멘토가 대답을 대신 찾아 주며 계속 말하면, 멘티는 자기 생각을 꺼낼 기회를 잃습니다. 멘티가 생각을 말로 표현하는 과정 자체가 배움이기 때문이에요. 그래서 멘토는 말을 줄이고 공감하며 들어 주어야 합니다. 그때 멘티가 스스로 깨닫고 더 잘 표현할 수 있습니다."}, {"id": "olym03-02", "unit": "olym03", "number": 2, "title": "no.02", "sentences": [{"n": 1, "en": "The expert myth is the belief that the more you know, the more creative you become.", "ko": "'전문가 신화'는 더 많이 알수록 더욱더 창의적으로 된다는 믿음이다.", "role": "뜻풀이 — 많이 알수록 창의롭다는 믿음을 이름과 함께 든다."}, {"n": 2, "en": "On the face of it, this seems quite logical.", "ko": "표면적으로는 이것이 꽤 논리적으로 보인다.", "role": "인정 — 겉보기에는 그럴듯해 보인다고 한발 받아 준다."}, {"n": 3, "en": "The rationale is that in order to be truly creative, one must master a field or a domain.", "ko": "그 근거는 진정으로 창의적으로 되려면 어떤 한 분야나 영역에 숙달해야 한다는 것이다.", "role": "논리 대기 — 창의하려면 한 분야를 통달해야 한다는 근거를 든다."}, {"n": 4, "en": "Creativity often requires some level of expertise, but expertise and creativity are nonetheless very different things.", "ko": "창의력은 흔히 어느 정도의 전문성을 요구하지만, 그래도 전문성과 창의력은 매우 다른 것이다.", "role": "선 긋기 — 전문성과 창의력은 다른 것이라고 갈라 놓는다."}, {"n": 5, "en": "Someone can know a great deal about something and yet show little creativity in that domain.", "ko": "어떤 사람은 어떤 것에 대해 많이 알 수 있지만, 그 영역에서 창의력을 거의 보이지 못할 수도 있다.", "role": "보기 — 많이 알아도 창의롭지 못할 수 있다고 든다."}, {"n": 6, "en": "However, research into the lives of creative people shows that in some cases \"expertise can actually hinder creative ability of individuals. ... As expertise grows, creativity sometimes diminishes. Sometimes the best insights come from those outside a particular field, ...\"", "ko": "그러나 창의적인 사람들의 삶에 대한 연구는 어떤 경우에는 \"전문성이 실제로 사람들의 창의력을 저해할 수 있다. ... 전문성이 커짐에 따라 창의력은 때때로 줄어든다. 때때로 최고의 통찰은 해당 분야 밖에 있는 사람들에게서 나온다, ...\"라는 것을 보여 준다.", "role": "인용 — 전문성이 창의를 막기도 한다는 연구를 그대로 옮긴다."}, {"n": 7, "en": "There is good reason for this.", "ko": "이것에는 충분한 이유가 있다.", "role": "넘기기 — 그럴 만한 까닭이 있다며 설명으로 넘어간다."}, {"n": 8, "en": "When we are too heavily invested in a task, we may tend to overlook the obvious.", "ko": "우리가 어떤 한 과업에 너무 많은 시간과 노력을 쏟으면 명백한 것을 간과하기 쉬울 수도 있을 것이다.", "role": "까닭으로 맺기 — 깊이 빠지면 뻔한 것을 놓친다고 닫는다."}], "core": "전문성과 창의력은 다른 것이어서 전문성이 커지면 창의력은 오히려 줄어들 수 있다.", "flow": [{"label": "그럴듯한 통념", "sentences": "S1~3", "text": "전문지식이 늘면 창의성도 늘어난다는 믿음은 논리적으로 보인다.", "refs": [1, 2, 3]}, {"label": "구별", "sentences": "S4~5", "text": "어느 정도 전문성은 필요하지만 창의력과 같은 것은 아니다.", "refs": [4, 5]}, {"label": "반례와 이유", "sentences": "S6~8", "text": "전문성이 때로 창의성을 줄이고, 일에 너무 깊이 빠지면 자명한 것을 놓친다.", "refs": [6, 7, 8]}], "structure": [{"title": "전문가 신화", "text": "한 분야에 숙달해야 진정으로 창의적이 된다는 그럴듯한 믿음"}, {"title": "연구가 말하는 것", "text": "전문성이 커질수록 창의력이 줄고 최고의 통찰은 분야 밖에서 나온다"}], "key_sentence_en": "Expertise and creativity are nonetheless very different things, and as expertise grows, creativity sometimes diminishes, because we may tend to overlook the obvious when we are too heavily invested in a task.", "blocking_vocab": [{"word": "expert myth", "meaning": "전문가에 관한 통념"}, {"word": "expertise", "meaning": "전문성"}, {"word": "diminish", "meaning": "줄어들다"}], "diagram": {"kind": "compare", "title": "전문성과 창의력은 같은 능력일까", "items": [{"head": "통념", "body": "많이 알수록 더 창의적이 된다고 생각함", "refs": [1, 2, 3]}, {"head": "연구가 보여 준 단서", "body": "전문성이 창의력을 방해할 때도 있고 외부인이 통찰을 얻을 수 있음", "refs": [4, 5, 6, 7, 8]}], "takeaway": "전문성이 불필요하다는 주장은 아님 · S4"}, "checks": [{"type": "핵심", "q": "전문성과 창의력의 관계에 관한 글의 주장과 일치하는 것은?", "choices": ["어느 정도 전문성은 필요해도 지나치면 창의력을 막을 수 있다.", "전문성은 언제나 창의력을 키운다."], "answer": 0, "why": "S4는 일정 수준의 전문성을 인정하고 S6은 방해 가능성을 제시한다.", "refs": [4, 6]}, {"type": "이유 근거", "q": "일에 너무 깊이 몰입하면 무엇을 놓칠 수 있는가?", "choices": ["모든 전문지식", "자명한 것"], "answer": 1, "why": "S8의 overlook the obvious.", "refs": [8]}, {"type": "변형 탐지", "q": "S6과 일치하는 문장은?", "choices": ["As expertise grows, creativity always increases.", "As expertise grows, creativity sometimes diminishes."], "answer": 1, "why": "S6의 sometimes diminishes를 확인한다.", "refs": [6]}], "easy_story": "어떤 분야를 잘 알려면 공부와 경험이 필요합니다. 하지만 많이 안다는 것과 새롭게 생각한다는 것은 같지 않아요. 한 일에 너무 오래 몰두하면 오히려 눈앞의 당연한 점을 놓칠 수 있습니다. 그래서 전문성이 커질수록 창의력이 반드시 커진다는 믿음을 이 글은 반박합니다."}, {"id": "olym03-03", "unit": "olym03", "number": 3, "title": "no.03", "sentences": [{"n": 1, "en": "Just as you don't know everything in advance about a trip you are going to take, neither can you know everything about how your new life or career might unfold.", "ko": "여러분이 떠날 여행에 대해 모든 것을 미리 알 수 없는 것과 꼭 마찬가지로, 여러분의 새로운 삶이나 진로가 어떻게 펼쳐질지에 대해서도 모든 것을 알 수는 없다.", "role": "견줌으로 열기 — 여행처럼 진로도 미리 다 알 수 없다고 연다."}, {"n": 2, "en": "But that's fine.", "ko": "하지만 괜찮다.", "role": "안심시키기 — 그래도 괜찮다고 짧게 받쳐 준다."}, {"n": 3, "en": "You just have to treat it like doing a jigsaw: accept that the full picture is going to emerge gradually rather than instantly.", "ko": "여러분은 그것을 조각 그림 맞추기를 하듯 그것을 다루기만 하면 되는데, 전체 그림이 즉각적이 아니라 서서히 나타날 거라는 사실을 받아들여라.", "role": "비유 세우기 — 조각 그림 맞추듯 서서히 드러남을 받아들이라 한다."}, {"n": 4, "en": "While sometimes it will be straightforward to fit pieces together, at other times it will take more effort and patience.", "ko": "때로는 조각을 맞추는 것이 간단한 반면에, 또 어떤 때에는 더 많은 노력과 인내가 필요할 것이다.", "role": "비유 풀기 ① — 쉬울 때도 있고 애먹을 때도 있다고 푼다."}, {"n": 5, "en": "Sometimes you will find interesting pieces that open up a whole new section, and at other times you may find pieces that don't seem to belong anywhere right now.", "ko": "때로는 완전히 새로운 부분을 여는 흥미로운 조각을 발견할 수도 있고, 또 어떤 때에는 당장은 아무 곳에도 속하지 않는 것 같은 조각을 발견할 수도 있을 것이다.", "role": "비유 풀기 ② — 새 길을 여는 조각도, 갈 곳 없는 조각도 있다고 잇는다."}, {"n": 6, "en": "You just need to keep at it until the picture emerges and you can see clearly what you have achieved.", "ko": "여러분은 그림이 나타날 때까지 그저 그것을 계속할 필요가 있고, 그러면 자신이 달성한 것을 명확하게 볼 수 있다.", "role": "당부로 맺기 — 그림이 드러날 때까지 계속하라고 닫는다."}], "core": "새 삶이나 진로는 미리 다 알 수 없으니 조각 그림 맞추듯 그림이 나타날 때까지 계속하면 된다.", "flow": [{"label": "불확실성", "sentences": "S1~2", "text": "여행처럼 새 삶·진로가 어떻게 펼쳐질지 처음부터 전부 알 수는 없다.", "refs": [1, 2]}, {"label": "퍼즐 비유", "sentences": "S3~4", "text": "전체 그림은 즉시가 아니라 서서히 나타나며 때로 노력과 인내가 든다.", "refs": [3, 4]}, {"label": "계속하기", "sentences": "S5~6", "text": "지금 놓을 곳이 없는 조각도 생기지만 그림이 드러날 때까지 계속하면 된다.", "refs": [5, 6]}], "structure": [{"title": "문제 — 앞이 안 보임", "text": "새 삶이나 진로가 어떻게 펼쳐질지 미리 알 수 없다"}, {"title": "해결 — 조각 맞추기", "text": "한 번에 보이길 바라지 말고 조각을 맞춰 가며 그림이 드러날 때까지 계속한다"}], "key_sentence_en": "Since you cannot know in advance how your new life or career will unfold, treat it like doing a jigsaw and keep at it until the full picture emerges.", "image": "../../assets/jinju1-olym03-03-jigsaw.webp", "image_alt": "아직 완성되지 않은 직소 퍼즐의 여러 조각을 맞추며 전체 그림이 서서히 드러나는 모습", "image_caption": "S3~6: 진로나 새 삶도 완성된 그림을 처음부터 보는 일이 아니라 조각을 계속 맞추는 과정에 빗댑니다.", "blocking_vocab": [{"word": "unfold", "meaning": "전개되다"}, {"word": "jigsaw", "meaning": "조각 그림 맞추기"}, {"word": "emerge", "meaning": "나타나다"}], "checks": [{"type": "핵심", "q": "새 진로를 직소 퍼즐에 비유한 이유는?", "choices": ["계속 조각을 맞추며 그림이 점차 드러나서", "시작할 때 완성된 미래를 전부 알아야 해서"], "answer": 0, "why": "S3의 gradually rather than instantly와 S6의 keep at it.", "refs": [3, 6]}, {"type": "비유 근거", "q": "지금은 놓을 곳을 찾지 못한 퍼즐 조각은 무엇을 보여 주는가?", "choices": ["조각이 틀렸으니 반드시 버려야 함", "모든 과정이 즉시 분명해지지는 않음"], "answer": 1, "why": "S5는 don't seem to belong anywhere right now라고만 한다.", "refs": [5]}, {"type": "변형 탐지", "q": "S3과 일치하는 문장은?", "choices": ["The full picture must emerge instantly before you begin.", "The full picture emerges gradually rather than instantly."], "answer": 1, "why": "S3의 gradually rather than instantly.", "refs": [3]}], "easy_story": "새로운 진로나 삶을 시작할 때 끝모습을 미리 볼 수는 없습니다. 퍼즐을 맞출 때도 처음에는 조각 하나가 어디에 들어갈지 모르지만, 여러 조각을 놓다 보면 그림이 조금씩 드러나죠. 지금은 자리를 모르는 경험도 있을 수 있습니다. 전체를 당장 알려고 멈추기보다 계속해 보라는 이야기입니다.", "learning_map": {"kind": "steps", "title": "처음에 전부 알 수 없어도", "items": [{"head": "새 삶·진로의 불확실성", "body": "여행과 마찬가지로 어떻게 펼쳐질지 미리 다 알 수는 없다.", "refs": [1, 2]}, {"head": "조각 그림의 비유", "body": "전체 모습은 서서히 드러나며, 어떤 조각에는 노력과 인내가 든다.", "refs": [3, 4]}, {"head": "계속 맞추기", "body": "지금 자리가 보이지 않는 조각도 있으므로 그림이 보일 때까지 계속한다.", "refs": [5, 6]}], "takeaway": "완성된 그림은 처음부터 주어지는 것이 아니라 계속하는 동안 나타난다."}}, {"id": "olym03-04", "unit": "olym03", "number": 4, "title": "no.04", "sentences": [{"n": 1, "en": "We don't choose our earliest habits, we imitate them.", "ko": "우리는 우리의 초기 습관을 선택하지 않으며, 그것을 모방한다.", "role": "단언 — 초기 습관은 고른 것이 아니라 흉내 낸 것이라 못 박는다."}, {"n": 2, "en": "We follow the script handed down by our friends and family, our church or school, our local community and society at large.", "ko": "우리는 친구와 가족, 교회나 학교, 지역 사회와 사회 전반에 의해 물려받는 각본을 따른다.", "role": "풀이 — 가족·학교·사회가 물려준 각본을 따른다고 푼다."}, {"n": 3, "en": "Each of these cultures and groups comes with its own set of expectations and standards ─ when and whether to get married, how many children to have, which holidays to celebrate, how much money to spend on your child's birthday party.", "ko": "이러한 각 문화와 집단에는 언제 결혼할지와 결혼할 것인지, 얼마나 많은 자녀를 가질지, 어떤 명절을 축하할지, 자녀의 생일 파티에 얼마를 지출할지의 그 자체의 기대와 기준이 있다.", "role": "보기 나열 — 결혼·자녀 수·명절·생일 비용까지 늘어놓는다."}, {"n": 4, "en": "In many ways, these social norms are the invisible rules that guide your behavior each day.", "ko": "여러 면에서 이러한 사회적 규범은 매일 여러분의 행동을 이끄는 보이지 않는 규칙이다.", "role": "개념 세우기 — 그것이 행동을 이끄는 보이지 않는 규칙이라 한다."}, {"n": 5, "en": "You're always keeping them in mind, even if they are not at the top of your mind.", "ko": "그것이 여러분의 마음속에 가장 먼저 떠오르는 것이 아니더라도, 여러분은 그것을 항상 마음속에 두고 있다.", "role": "부연 — 앞에 떠오르지 않아도 늘 품고 산다고 덧댄다."}, {"n": 6, "en": "Often, you follow the habits of your culture without thinking, without questioning, and sometimes without remembering.", "ko": "자주 여러분은 아무 생각 없이, 의심 없이, 때로는 기억하지 못한 채 여러분 문화의 관습을 따른다.", "role": "강조 — 생각도 의문도 기억도 없이 따른다고 못 박는다."}, {"n": 7, "en": "As the French philosopher Michel de Montaigne wrote, \"The customs and practices of life in society sweep us along.\"", "ko": "프랑스 철학자 Michel de Montaigne이 썼듯이, \"사회에서 삶의 관습과 관행은 우리의 정신을 온통 빼앗는다.\"", "role": "인용으로 맺기 — 관습이 우리를 휩쓴다는 말로 닫는다."}], "core": "우리는 초기 습관을 고르지 않고 물려받은 각본을 따르며, 그 사회적 규범이 보이지 않는 규칙이 된다.", "flow": [{"label": "습관의 출처", "sentences": "S1~2", "text": "어릴 때 습관은 선택보다 모방이며 여러 집단의 각본을 따른다.", "refs": [1, 2]}, {"label": "규범의 내용", "sentences": "S3~4", "text": "집단마다 기대·기준이 있고 일상 행동의 보이지 않는 규칙이 된다.", "refs": [3, 4]}, {"label": "작동 방식", "sentences": "S5~7", "text": "규범을 늘 떠올리지 않아도 문화적 습관을 의심 없이 따르게 된다.", "refs": [5, 6, 7]}], "structure": [{"title": "원인 — 물려받은 각본", "text": "친구·가족·학교·지역 사회가 기대와 기준을 함께 넘겨준다"}, {"title": "결과 — 보이지 않는 규칙", "text": "생각도 의문도 없이 매일의 행동이 그 규범대로 흘러간다"}], "key_sentence_en": "We do not choose our earliest habits but imitate the script handed down by our groups, so the social norms of our culture work as invisible rules that guide our behavior without thinking or questioning.", "blocking_vocab": [{"word": "imitate", "meaning": "모방하다"}, {"word": "script", "meaning": "행동의 각본"}, {"word": "social norm", "meaning": "사회적 규범"}], "diagram": {"kind": "steps", "title": "보이지 않는 행동 규칙의 형성", "items": [{"head": "주변에서 받음", "body": "가족·친구·학교·지역사회가 습관의 각본을 전함", "refs": [1, 2]}, {"head": "기대와 기준", "body": "결혼·자녀·기념일 등 선택에 대한 집단의 기대", "refs": [3]}, {"head": "일상 속 적용", "body": "규범을 늘 의식하거나 무의식적으로 따름", "refs": [4, 5, 6, 7]}]}, "checks": [{"type": "핵심", "q": "글에서 초기 습관은 주로 어떻게 생기는가?", "choices": ["가족·사회에서 보고 모방한다.", "스스로 하나씩 고른다."], "answer": 0, "why": "S1의 don't choose ... imitate와 S2의 주변 집단.", "refs": [1, 2]}, {"type": "지칭 근거", "q": "‘보이지 않는 규칙’에 해당하는 것은?", "choices": ["일상을 이끄는 사회적 규범", "항상 종이에 적힌 법률"], "answer": 0, "why": "S4의 social norms are the invisible rules.", "refs": [4]}, {"type": "변형 탐지", "q": "S6과 일치하는 문장은?", "choices": ["We often follow cultural habits without questioning them.", "We follow cultural habits only after carefully questioning them."], "answer": 0, "why": "S6의 without thinking, without questioning.", "refs": [6]}], "easy_story": "우리는 어릴 때 결혼, 명절, 생일 같은 일을 어떻게 하는지 스스로 정하기보다 주변 사람을 보고 배웁니다. 그렇게 익힌 방식이 너무 익숙해지면 누가 정한 규칙인지도 의식하지 않아요. 그래서 ‘내가 원래 이렇게 행동한다’고 느끼는 습관 속에도 사회가 물려준 보이지 않는 규범이 있을 수 있습니다."}]}, {"id": "olym04", "label": "올림포스 영독 기본1 · 4강", "scope": "함축적 의미", "passages": [{"id": "olym04-01", "unit": "olym04", "number": 1, "title": "no.01", "sentences": [{"n": 1, "en": "Nothing about an organization's strategy or business model is sacrosanct.", "ko": "조직의 전략이나 비즈니스 모델에서 신성불가침인 것은 아무 것도 없다.", "role": "단언 — 전략과 사업 모형에 성역은 없다고 잘라 연다."}, {"n": 2, "en": "But there must be a cutting point between principles and values and everything else.", "ko": "하지만 원칙과 가치, 그리고 그 외의 모든 것 사이에는 반드시 구분점이 존재해야 한다.", "role": "선 긋기 — 그래도 원칙·가치와 나머지는 갈라야 한다고 못 박는다."}, {"n": 3, "en": "They represent precious, freestanding assets that must be independent of strategy.", "ko": "그것들은 전략으로부터 독립적이어야 하는 소중하고 독립된 자산을 나타낸다.", "role": "성격 ① — 전략에서 독립된 소중한 자산이라 밝힌다."}, {"n": 4, "en": "They provide continuity and identity when everything else is expendable.", "ko": "그 외의 모든 것이 소모용인데 그것들은 연속성과 정체성을 제공한다.", "role": "성격 ② — 나머지가 흔들릴 때 이어 줌과 정체성을 준다고 잇는다."}, {"n": 5, "en": "They represent the core element of the culture and the unchanging soul of the organization.", "ko": "그것들은 문화의 핵심 요소이자 조직의 변하지 않는 정신을 나타낸다.", "role": "성격 ③ — 문화의 핵이자 변치 않는 정신이라 못 박는다."}, {"n": 6, "en": "Cases in which leaders have successfully remodeled an entire enterprise represent organizational change in its comprehensive and supreme category.", "ko": "리더가 기업 전체를 성공적으로 개조한 사례는 그것의 포괄적이면서도 가장 중요한 범주에서의 조직상의 변화를 나타낸다.", "role": "사례로 넘기기 — 기업을 통째로 바꾼 사례로 눈길을 옮긴다."}, {"n": 7, "en": "We learn from these cases that retaining principles and values during the process of change is not only possible but necessary to provide an anchor.", "ko": "이러한 사례에서 우리는 변화의 과정에서 원칙과 가치를 유지하는 것이 가능할 뿐만 아니라 의지할 것을 제공하는 데 필수적이라는 것을 배운다.", "role": "교훈 — 바뀔 때도 원칙을 지키는 것이 닻이 된다고 배운다."}, {"n": 8, "en": "Ironically, perhaps, organizations with the strongest principles and values often have the highest adaptive capacity because people attach themselves to them and understand that everything else is on the table.", "ko": "어쩌면, 역설적이게도 가장 강력한 원칙과 가치를 가진 조직이 흔히 최고의 적응 능력을 갖고 있는데, 사람들이 그것들은 고수하고 그 외의 모든 것들은 검토 대상이라는 것을 이해하기 때문이다.", "role": "역설 — 원칙이 굳은 조직이 오히려 잘 바뀐다고 뒤집는다."}, {"n": 9, "en": "If you want to keep your promises, burn the house when it's time to reinvent the company.", "ko": "약속을 지키고 싶다면, 회사를 새롭게 만들어야 할 때라면 집을 불태우라.", "role": "비유 ① — 새로 지으려면 집을 태우라고 세게 말한다."}, {"n": 10, "en": "But save the nails.", "ko": "하지만 못은 남겨 두라.", "role": "비유 ② — 다만 못은 남기라며 지킬 것을 못 박고 닫는다."}], "core": "조직은 원칙과 가치를 닻으로 남긴 채 전략과 그 밖의 모든 것을 바꿀 수 있다.", "flow": [{"label": "경계", "sentences": "S1~3", "text": "전략·사업 모형은 바꿀 수 있지만 원칙·가치는 독립된 자산으로 남겨야 한다.", "refs": [1, 2, 3]}, {"label": "이유", "sentences": "S4~5", "text": "원칙과 가치가 변화 중에도 연속성과 조직 정체성을 유지한다.", "refs": [4, 5]}, {"label": "변화의 조건", "sentences": "S6~8", "text": "기업 전체를 바꾸는 과정에서도 이 닻을 지켜야 적응할 수 있다.", "refs": [6, 7, 8]}, {"label": "비유", "sentences": "S9~10", "text": "집을 다시 지을 때처럼 나머지는 바꿔도 핵심의 ‘못’은 남긴다.", "refs": [9, 10]}], "structure": [{"title": "불태울 집 — 전략과 나머지", "text": "신성불가침이 아니며 전부 검토 대상이라 통째로 바꿀 수 있다"}, {"title": "남길 못 — 원칙과 가치", "text": "전략에서 독립된 자산으로 연속성·정체성·변하지 않는 정신을 준다"}], "key_sentence_en": "Organizations can reinvent strategy while preserving principles and values as an anchor.", "blocking_vocab": [{"word": "sacrosanct", "meaning": "절대 바꿀 수 없는"}, {"word": "continuity", "meaning": "연속성"}, {"word": "adaptive capacity", "meaning": "적응 능력"}], "diagram": {"kind": "compare", "title": "조직 변화에서 지킬 것과 바꿀 것", "items": [{"head": "지킬 것 · 원칙과 가치", "body": "문화의 핵심이자 연속성과 정체성을 주는 닻", "refs": [2, 3, 4, 5, 7]}, {"head": "바꿀 것 · 전략과 사업 방식", "body": "필요하면 기업 전체를 다시 설계할 수 있는 가변 요소", "refs": [1, 6, 8, 9, 10]}], "takeaway": "‘집은 태우되 못은 남긴다’는 원칙 보존과 전략 재창조의 비유 · S9~10"}, "checks": [{"type": "핵심", "q": "조직을 크게 바꿀 때 유지해야 할 것은?", "choices": ["원칙과 가치", "기존 전략·사업 모형 전부"], "answer": 0, "why": "S2~5와 S7의 principles and values.", "refs": [2, 3, 4, 5, 7]}, {"type": "비유 근거", "q": "‘집을 태우되 못은 남겨라’의 ‘못’이 가리키는 것은?", "choices": ["버려야 할 모든 사업 전략", "원칙과 가치"], "answer": 1, "why": "S9~10은 앞의 원칙 보존과 조직 재창조를 비유한다.", "refs": [7, 9, 10]}, {"type": "변형 탐지", "q": "S8과 일치하는 문장은?", "choices": ["Strong principles always prevent organizational adaptation.", "Strong principles can coexist with high adaptive capacity."], "answer": 1, "why": "S8의 strongest principles ... highest adaptive capacity.", "refs": [8]}], "easy_story": "회사가 새로운 상황에 맞춰 전략과 사업 방식을 바꿔야 할 때가 있습니다. 그렇다고 지키겠다고 약속한 원칙과 가치까지 모두 버리면 그 조직이 무엇을 위해 존재하는지 잃습니다. 원칙은 그대로 두고 나머지를 검토할 수 있을 때 오히려 큰 변화가 가능해집니다. 마지막의 ‘집을 불태워도 못은 남겨라’는 이 구별을 나타내는 비유입니다."}, {"id": "olym04-02", "unit": "olym04", "number": 2, "title": "no.02", "sentences": [{"n": 1, "en": "There is something in human nature that prompts us to think of our actions, as well as our feelings, as though they were the distinctive issue of something inside us, something uniquely ours.", "ko": "인간 본성에는, 우리의 행동, 나아가 우리의 감정이 마치 우리 내부의 어떤 것에 대한 특이한 문제, 즉 우리만의 고유한 어떤 것에 대한 문제인 것처럼 생각하게 이끄는 무언가가 있다.", "role": "본성 짚기 — 행동과 감정을 내 것으로만 여기게 된다고 연다."}, {"n": 2, "en": "Some are.", "ko": "일부는 그렇다.", "role": "짧게 인정 — 일부는 정말 그렇다고 한 발 물러선다."}, {"n": 3, "en": "But most of the actions and feelings that help us enter into working relations with fellow members of the world are not all that private.", "ko": "하지만 우리가 세상의 동료 구성원들과 과업 수행 관계를 시작하도록 돕는 대부분의 행동과 감정은 그다지 개인적인 것이 아니다.", "role": "뒤집기 — 그러나 대부분은 그리 사적이지 않다고 꺾는다."}, {"n": 4, "en": "They are, in fact, performances we execute in acceptably close conformity to widely accepted social rules.", "ko": "사실, 그것들은 우리가 널리 받아들여지는 사회적 규칙을 용인할 수 있을 정도로 근접하게 따르면서 실행하는 일이다.", "role": "바꿔 말하기 — 사회 규칙에 맞춰 해내는 수행이라 다시 밝힌다."}, {"n": 5, "en": "These rules are learned and held by us in such an easy way that we indulge the conceit that they are our own brilliant accomplishments.", "ko": "이러한 규칙은 우리가 너무나 쉽게 배워서 보유하기 때문에 우리는 그것들이 우리 자신의 훌륭한 업적이라는 자만심에 빠진다.", "role": "착각 설명 — 너무 쉽게 익혀 제 업적으로 여긴다고 푼다."}, {"n": 6, "en": "We think of them as though they were the inventions of our own utterly original psychic lives, when most of them are as familiar to others as they are to us.", "ko": "우리는 그것들을 마치 우리 자신의 완전히 독창적인 정신적 삶의 발명품인 것처럼 생각하지만, 그것 중 대부분은 우리에게 친숙한 것처럼 다른 사람들에게도 친숙하다.", "role": "부연 — 내 발명 같지만 남에게도 익숙하다고 짚는다."}, {"n": 7, "en": "Social things are quite simply social.", "ko": "사회적인 것들은 그야말로 사회적이다.", "role": "한마디로 맺기 — 사회적인 것은 사회적일 뿐이라 못 박는다."}], "core": "개인적인 것처럼 보이는 대부분의 행동과 감정은 사회 규칙에 따라 해내는 수행이다.", "flow": [{"label": "직감", "sentences": "S1~2", "text": "우리는 행동·감정을 고유한 내면의 결과로 여기며, 일부는 실제로 그렇다.", "refs": [1, 2]}, {"label": "반박", "sentences": "S3~4", "text": "그러나 사람들과 관계 맺는 많은 행위는 사회 규칙에 맞춘 수행이다.", "refs": [3, 4]}, {"label": "착각·결론", "sentences": "S5~7", "text": "규칙을 너무 자연스럽게 배워 자기 창작물처럼 여기지만 사회적인 것은 사회적이다.", "refs": [5, 6, 7]}], "structure": [{"title": "느낌 — 내 것이라는 생각", "text": "행동과 감정이 내 안에서 나온 고유하고 독창적인 것이라 여긴다"}, {"title": "실제 — 공유된 규칙", "text": "널리 받아들여지는 사회 규칙에 맞춰 해내는 수행이며 남들에게도 친숙하다"}], "key_sentence_en": "Most actions and feelings that seem private are performances shaped by shared social rules.", "blocking_vocab": [{"word": "distinctive", "meaning": "독특한"}, {"word": "conformity", "meaning": "부합·순응"}, {"word": "conceit", "meaning": "자부심·착각"}], "diagram": {"kind": "compare", "title": "‘내 마음에서 나온 것’이라는 느낌과 실제", "items": [{"head": "개인 고유로 느끼는 것", "body": "행동과 감정이 자기 안에서 독창적으로 나온다고 여김", "refs": [1, 2]}, {"head": "사회적으로 배우는 것", "body": "많은 행동·감정은 널리 받아들여진 규칙에 맞춘 수행", "refs": [3, 4, 5, 6, 7]}], "takeaway": "글은 모든 감정이 사회적이라고 하지 않는다 · S2~3"}, "checks": [{"type": "핵심", "q": "글이 많은 행동·감정에 대해 말하는 것은?", "choices": ["모두 개인만의 독창적 발명이다.", "상당수는 배운 사회 규칙에 맞추어 수행된다."], "answer": 1, "why": "S3~4와 S6~7은 다수가 사회적으로 익힌 것이라고 한다.", "refs": [3, 4, 6, 7]}, {"type": "한정 근거", "q": "글은 개인에게 고유한 행동·감정을 완전히 부정하는가?", "choices": ["그렇다. 예외가 전혀 없다고 한다.", "아니다. 일부는 그렇다고 인정한다."], "answer": 1, "why": "S2의 Some are.", "refs": [2]}, {"type": "변형 탐지", "q": "S4와 일치하는 문장은?", "choices": ["Many actions are entirely independent of social rules.", "Many actions conform closely to widely accepted social rules."], "answer": 1, "why": "S4의 conformity to ... social rules.", "refs": [4]}], "easy_story": "우리는 말투나 감정 표현이 전부 나만의 개성이라고 여기기 쉽습니다. 그러나 다른 사람과 어울릴 때 하는 행동 상당수는 함께 사는 사회에서 배운 규칙을 따릅니다. 그 규칙을 워낙 자연스럽게 익혀서 스스로 만들어 낸 것처럼 착각하는 거예요. 글은 개인적인 것처럼 느껴지는 행동에도 사회적인 바탕이 있음을 보여 줍니다."}, {"id": "olym04-03", "unit": "olym04", "number": 3, "title": "no.03", "sentences": [{"n": 1, "en": "Cooked food does many familiar things.", "ko": "조리된 음식은 친숙한 여러 가지 일을 한다.", "role": "화제 열기 — 조리가 익숙한 여러 일을 한다고 크게 연다."}, {"n": 2, "en": "It makes our food safer, creates delicious tastes, and reduces the risk of going bad.", "ko": "그것은 우리의 음식을 더 안전하게 만들고, 맛있는 맛을 만들어 내며, (음식이) 상할 위험성을 줄여준다.", "role": "나열 ① — 안전·맛·상함 줄이기를 늘어놓는다."}, {"n": 3, "en": "Heating can allow us to open, cut, or mash tough foods.", "ko": "가열은 우리가 질긴 음식을 쪼개거나 자르거나 으깰 수 있게 한다.", "role": "나열 ② — 질긴 것을 다루게 해 준다고 보탠다."}, {"n": 4, "en": "But none of these advantages is as important as a little-appreciated aspect: cooking increases the amount of energy our bodies obtain from our food.", "ko": "그러나 이러한 장점 중 어떤 것도 거의 인정받지 못한 한 가지 측면만큼 중요한 것은 없는데, 그것은 조리가 우리 몸이 음식에서 얻는 에너지의 양을 증가시킨다는 것이다.", "role": "핵심 세우기 — 그보다 중요한 것은 에너지를 늘리는 일이라 못 박는다."}, {"n": 5, "en": "The extra energy gave the first cooks biological advantages.", "ko": "여분의 에너지는 최초로 조리를 한 사람들에게 생물학적 이점을 주었다.", "role": "고리 ① — 그 여분이 최초 조리자에게 이점을 줬다고 잇는다."}, {"n": 6, "en": "They survived and reproduced better than before.", "ko": "그들은 이전보다 더 잘 생존하고 번식했다.", "role": "고리 ② — 더 잘 살아남고 번식했다고 이어 붙인다."}, {"n": 7, "en": "Their genes spread.", "ko": "그들의 유전자가 퍼졌다.", "role": "고리 ③ — 그 유전자가 퍼졌다고 짧게 잇는다."}, {"n": 8, "en": "Their bodies responded by biologically adapting to cooked food, shaped by natural selection to take maximum advantage of the new diet.", "ko": "그들의 몸은 생물학적으로 조리된 음식에 적응함으로써 반응했고, 자연 선택에 의해 새로운 식단을 최대한 활용하도록 형성되었다.", "role": "고리 ④ — 몸이 조리 음식에 맞게 바뀌었다고 잇는다."}, {"n": 9, "en": "There were changes in anatomy, physiology, ecology, life history, psychology, and society.", "ko": "해부학적 구조, 생리, 생태, 생활사, 심리, 그리고 사회에 변화가 생겼다.", "role": "범위 넓히기 — 몸부터 사회까지 두루 바뀌었다고 넓힌다."}, {"n": 10, "en": "Fossil evidence indicates that this dependence arose not just some tens of thousands of years ago, but right back at the beginning of our time on Earth, at the start of human evolution.", "ko": "화석 증거는 이러한 의존성이 겨우 수만 년 전이 아니라 과거에 지구상에서 우리의 시간이 시작한 바로 그때, 즉 인류의 진화가 시작한 때에 발생했다는 것을 보여 준다.", "role": "시기 못 박기 — 그 시작이 인류 진화의 첫머리라고 화석으로 댄다."}, {"n": 11, "en": "We should indeed pin our humanity on cooks.", "ko": "우리는 정말로 우리의 인간다움을 조리를 한 사람들의 덕분으로 돌려야 한다.", "role": "맺음 — 인간다움을 조리한 이들 덕으로 돌리라며 닫는다."}], "core": "조리는 몸이 얻는 에너지를 늘려 최초 조리자에게 이점을 주고 인류 진화의 시작부터 몸을 바꿔 놓았다.", "flow": [{"label": "익숙한 장점", "sentences": "S1~3", "text": "조리는 음식을 안전하고 맛있게 하며 단단한 음식을 먹기 쉽게 한다.", "refs": [1, 2, 3]}, {"label": "더 큰 이점", "sentences": "S4~5", "text": "핵심은 몸이 음식에서 얻는 에너지가 늘어 초기 조리자에게 이점이 생긴 것이다.", "refs": [4, 5]}, {"label": "진화의 경로", "sentences": "S6~8", "text": "생존·번식 개선과 유전자 확산을 거쳐 몸이 조리 식단에 적응했다.", "refs": [6, 7, 8]}, {"label": "오래된 변화", "sentences": "S9~11", "text": "몸과 사회의 여러 면이 바뀌었고 화석은 인류 진화 초기부터의 의존을 시사한다.", "refs": [9, 10, 11]}], "structure": [{"title": "원인 — 늘어난 에너지", "text": "조리가 같은 음식에서 몸이 얻는 에너지의 양을 늘렸다"}, {"title": "결과 — 몸과 삶의 변화", "text": "생존·번식의 이점이 유전자로 퍼지고 해부·생리·생태·생활사·심리·사회가 바뀌었다"}], "key_sentence_en": "Cooking increased usable energy and drove biological changes from the beginning of human evolution.", "blocking_vocab": [{"word": "obtain", "meaning": "얻다"}, {"word": "biological advantage", "meaning": "생물학적 이점"}, {"word": "natural selection", "meaning": "자연선택"}], "diagram": {"kind": "energy-route", "title": "조리가 인류에게 준 핵심 이점", "items": [{"head": "익숙한 장점", "body": "안전·맛·손질처럼 바로 느껴지는 이점이 있다.", "refs": [1, 2, 3]}, {"head": "에너지를 더 얻음", "body": "더 중요한 변화는 몸이 음식에서 얻는 에너지가 늘어난다는 점이다.", "refs": [4]}, {"head": "더 잘 살아남고 번식", "body": "추가 에너지가 초기 조리자에게 생물학적 이점을 주고 유전자가 퍼졌다.", "refs": [5, 6, 7]}, {"head": "조리 식단에 몸이 적응", "body": "몸과 생활의 여러 면이 조리 식단에 맞춰 변했다.", "refs": [8, 9, 10, 11]}], "takeaway": "익숙한 맛·안전의 장점과 글이 강조하는 에너지·진화의 경로를 구별하세요."}, "checks": [{"type": "핵심", "q": "글이 강조하는 조리의 가장 중요한 이점은?", "choices": ["음식 색깔의 변화", "몸이 음식에서 얻는 에너지의 증가"], "answer": 1, "why": "S4는 안전·맛보다 에너지 획득 증가를 더 중요하게 든다.", "refs": [2, 3, 4]}, {"type": "인과 근거", "q": "초기 조리자의 추가 에너지는 무엇과 이어졌는가?", "choices": ["생존·번식의 즉각 중단", "더 나은 생존·번식과 유전자 확산"], "answer": 1, "why": "S5~7의 연쇄다.", "refs": [5, 6, 7]}, {"type": "변형 탐지", "q": "S10과 일치하는 문장은?", "choices": ["Cooking dependence began only a few decades ago.", "Cooking dependence reaches back to early human evolution."], "answer": 1, "why": "S10의 at the start of human evolution.", "refs": [10]}], "easy_story": "음식을 익히면 안전하고 먹기 쉬워지는 장점이 있습니다. 글이 더 중요하게 보는 것은 몸이 같은 음식에서 얻는 에너지가 늘어난다는 점이에요. 초기 조리자들이 그 에너지 덕분에 더 잘 생존하고 번식했다면, 그 특성이 퍼지며 몸도 조리된 음식에 적응했을 것입니다. 그래서 조리를 단순한 요리 기술이 아니라 인류 진화와 연결합니다."}, {"id": "olym04-04", "unit": "olym04", "number": 4, "title": "no.04", "sentences": [{"n": 1, "en": "Radio provided the driving force to solidify the era of patronage; however, the invention that soon followed remains to this day the most significant communication medium that has influenced and aided the development of sports.", "ko": "라디오가 애용의 시대를 확고히 하는 원동력을 제공했지만, 곧 뒤를 이은 발명품이 스포츠 발전에 영향을 미치고 도움을 준 가장 중요한 통신 매체로 오늘날까지 남아 있다.", "role": "판 깔기 — 라디오 뒤에 온 발명이 가장 중요하다고 운을 뗀다."}, {"n": 2, "en": "Who knew what sportscaster Bill Stern questioned and introduced in 1939 would enhance the growth and development of sports marketing practices for decades?", "ko": "스포츠 캐스터 Bill Stern이 1939년에 의문을 제기하면서 소개했던 것이 수십 년 동안 스포츠 마케팅 관행의 성장과 발전을 향상할 줄 누가 알았겠는가?", "role": "되묻기 — 1939년 그 일이 이럴 줄 누가 알았겠냐고 눈길을 끈다."}, {"n": 3, "en": "The display platform, the television, though airing two average baseball teams battling for fourth place, provided an incredibly formidable and profitable union between sports and the American public.", "ko": "비록 4위를 다투는 평범한 두 야구팀을 방송하긴 해도, 텔레비전이라는 디스플레이 플랫폼은 스포츠와 미국 대중 간의 믿을 수 없을 정도로 강력하고 수익성 있는 결합을 제공했다.", "role": "정체 밝히기 — 그것이 텔레비전이며 강력한 결합을 낳았다고 밝힌다."}, {"n": 4, "en": "The television provided a means for sports organizations to expand their market presence and a unique opportunity for marketers to engage their publics.", "ko": "텔레비전은 스포츠 단체가 시장 진출을 확장할 수 있는 수단과 마케터가 대중의 관심을 사로잡을 특별한 기회를 제공했다.", "role": "구실 풀기 — 시장 확장의 길과 대중을 끌 기회를 줬다고 푼다."}, {"n": 5, "en": "The notion of a \"picture being worth a thousand words\" became a reality with the invention and its intervention and presentation of sports.", "ko": "한 장의 '그림이 천 마디 말의 가치가 있다'라는 개념은 그 발명품, 그리고 그것의 스포츠 개입과 제공으로 현실이 되었다.", "role": "맺음 — 그림 한 장이 천 마디라는 말이 현실이 됐다고 닫는다."}], "core": "텔레비전은 스포츠와 대중을 강력하게 묶어 스포츠 발전과 마케팅을 이끈 가장 중요한 매체가 되었다.", "flow": [{"label": "매체 변화", "sentences": "S1~2", "text": "라디오 이후 등장한 발명이 스포츠의 성장과 마케팅에 큰 영향을 주었다.", "refs": [1, 2]}, {"label": "텔레비전의 연결", "sentences": "S3", "text": "평범한 두 야구팀 경기조차 텔레비전에서 스포츠와 미국 대중을 강하게 묶었다.", "refs": [3]}, {"label": "확장·효과", "sentences": "S4~5", "text": "스포츠 조직의 시장 확대와 마케터의 대중 참여가 가능해졌다.", "refs": [4, 5]}], "structure": [{"title": "원인 — 텔레비전의 등장", "text": "1939년 소개된 텔레비전이 스포츠를 눈으로 보게 만들었다"}, {"title": "결과 — 스포츠 마케팅의 성장", "text": "스포츠와 대중이 묶이고 단체는 시장을, 마케터는 대중을 얻었다"}], "key_sentence_en": "Television joined sports with the public and became a decisive medium for sports marketing.", "image": "../../assets/jinju1-olym04-04-televised-baseball.webp", "image_alt": "초기 텔레비전으로 야구 경기를 보는 사람들의 개념 삽화", "image_caption": "S1~5: 라디오에 이어 텔레비전이 스포츠 장면을 보여 주며 대중과 스포츠를 강하게 연결했습니다. 실제 1939년 기록 사진은 아닙니다.", "blocking_vocab": [{"word": "patronage", "meaning": "후원"}, {"word": "formidable", "meaning": "강력한"}, {"word": "market presence", "meaning": "시장 존재감"}], "checks": [{"type": "핵심", "q": "글에서 스포츠 발전에 특히 중요한 매체는?", "choices": ["전보", "텔레비전"], "answer": 1, "why": "S1은 라디오 뒤 발명을 예고하고 S3~5가 텔레비전의 효과를 밝힌다.", "refs": [1, 3, 4, 5]}, {"type": "사례 근거", "q": "평범한 야구 경기 중계가 보여 준 것은?", "choices": ["스포츠가 대중과 완전히 분리됨", "스포츠와 대중의 강력한 연결"], "answer": 1, "why": "S3의 formidable and profitable union.", "refs": [3]}, {"type": "변형 탐지", "q": "S4와 일치하는 문장은?", "choices": ["Television gave sports organizations a way to expand their market presence.", "Television prevented sports organizations from expanding their market presence."], "answer": 0, "why": "S4의 provided a means ... expand.", "refs": [4]}], "easy_story": "라디오도 스포츠를 알렸지만, 텔레비전은 경기를 화면으로 보여 줄 수 있었습니다. 평범한 야구 경기까지 많은 사람이 보게 되자 스포츠 단체는 더 넓은 대중과 만날 수 있었어요. 기업에도 사람들의 관심을 끌 기회가 생겼습니다. 그래서 글은 텔레비전이 스포츠의 성장과 마케팅을 함께 바꾼 매체라고 말합니다.", "learning_map": {"kind": "steps", "title": "화면이 바꾼 스포츠의 연결", "items": [{"head": "라디오 다음의 매체", "body": "라디오에 이어 텔레비전이 스포츠 발전에 영향을 준 매체로 등장한다.", "refs": [1, 2]}, {"head": "스포츠와 대중의 연결", "body": "평범한 야구 경기 방송조차 미국 대중과 스포츠를 강하게 묶었다.", "refs": [3]}, {"head": "시장·참여의 확장", "body": "스포츠 조직은 시장을 넓히고 마케터는 대중과 만나는 기회를 얻었다.", "refs": [4, 5]}], "takeaway": "텔레비전의 시각적 전달은 스포츠와 대중을 묶고 시장의 확장을 도왔다."}}]}, {"id": "olym05", "label": "올림포스 영독 기본1 · 5강", "scope": "주제·제목", "passages": [{"id": "olym05-01", "unit": "olym05", "number": 1, "title": "no.01", "sentences": [{"n": 1, "en": "Supertasters and nontasters respond similarly to many foods, but supertasters are more sensitive to certain sweet and bitter substances.", "ko": "미각이 뛰어난 사람과 뛰어나지 않은 사람은 많은 음식에 비슷하게 반응하지만, 미각이 뛰어난 사람은 단맛과 쓴맛이 나는 특정한 재료에 더 민감하다.", "role": "차이 밝히기 — 미각이 뛰어난 이가 단맛·쓴맛에 더 민감하다고 연다."}, {"n": 2, "en": "These differences in taste sensitivity influence people's eating habits in ways that can have repercussions for their physical health.", "ko": "이러한 미각 민감도의 차이는 신체 건강에 영향을 미칠 수 있는 방식으로 사람들의 식습관에 영향을 미친다.", "role": "연결 짓기 — 그 차이가 식습관을 거쳐 건강까지 간다고 잇는다."}, {"n": 3, "en": "For example, supertasters are less likely to be fond of sweets and tend to consume fewer high-fat foods, both of which are likely to reduce their risk for cardiovascular disease.", "ko": "예를 들어, 미각이 뛰어난 사람은 단 음식을 덜 좋아할 수 있고 고지방 음식을 덜 먹는 경향이 있는데, 이 두 가지 모두 심혈관 질환의 위험을 줄일 수 있다.", "role": "보기 ① — 단것과 고지방을 덜 먹어 심혈관 위험이 준다고 든다."}, {"n": 4, "en": "Supertasters also tend to react more negatively to alcohol and smoking, thereby reducing their likelihood of developing drinking problems or nicotine addiction.", "ko": "미각이 뛰어난 사람은 또한 음주와 흡연에 더 부정적으로 반응하는 경향이 있는데, 그렇게 함으로써 그들에게 음주 문제나 니코틴 중독이 발생할 가능성을 줄인다.", "role": "보기 ② — 술·담배에 부정적이라 중독 위험도 낮다고 보탠다."}, {"n": 5, "en": "The only health disadvantage identified for supertasters thus far is that they respond more negatively to many vegetables, which seems to hold down their vegetable intake.", "ko": "지금까지 미각이 뛰어난 사람에게 확인된 유일한 건강상의 단점은 그들이 많은 채소에 대해 더 부정적으로 반응한다는 것인데, 그것은 채소 섭취를 억제하는 듯하다.", "role": "단점 하나 — 채소도 싫어해 섭취가 준다는 흠을 짚는다."}, {"n": 6, "en": "Overall, however, supertasters tend to have better health habits than nontasters, thanks to their strong reactions to certain tastes.", "ko": "그러나, 전반적으로는 미각이 뛰어난 사람이 특정 맛에 대한 자신의 강한 반응 덕분에 미각이 뛰어나지 않은 사람보다 더 나은 건강 습관을 갖는 경향이 있다.", "role": "저울질 — 그래도 전체로는 습관이 더 낫다고 저울질해 맺는다."}], "core": "미각이 뛰어난 사람은 특정 맛에 강하게 반응해 전반적으로 더 나은 건강 습관을 갖는다.", "flow": [{"label": "전제", "sentences": "S1-2", "text": "두 집단은 대체로 비슷하나 단맛·쓴맛 민감도가 갈리고 그것이 식습관을 좌우한다", "refs": [1, 2]}, {"label": "근거", "sentences": "S3", "text": "단 음식과 고지방 음식을 덜 먹어 심혈관 질환 위험이 줄어든다", "refs": [3]}, {"label": "근거", "sentences": "S4", "text": "음주와 흡연에도 더 부정적이어서 중독 가능성이 낮아진다", "refs": [4]}, {"label": "양보", "sentences": "S5", "text": "다만 채소에도 부정적이어서 채소 섭취가 억제되는 단점이 하나 있다", "refs": [5]}, {"label": "결론", "sentences": "S6", "text": "그래도 전반적으로는 더 나은 건강 습관을 갖는 경향이 있다", "refs": [6]}], "structure": [{"title": "원인 — 예민한 미각", "text": "특정 단맛과 쓴맛에 강하게 반응한다"}, {"title": "결과 — 더 나은 습관", "text": "단 음식·고지방·술·담배를 멀리한다. 대신 채소도 덜 먹는다"}], "key_sentence_en": "Supertasters react strongly to certain tastes, and those reactions give them better health habits overall.", "diagram": {"kind": "branches", "title": "맛 민감도의 이익과 예외", "items": [{"head": "맛 민감도 차이", "body": "일부 단맛·쓴맛에 더 민감해 먹는 습관이 달라짐", "refs": [1, 2]}, {"head": "단맛·지방·술·담배를 덜 찾음", "body": "단것·기름진 음식·술·담배를 덜 찾는 경향", "refs": [3, 4]}, {"head": "채소도 덜 먹을 수 있음", "body": "채소에도 강하게 반응해 덜 먹을 수 있음", "refs": [5]}], "takeaway": "미각이 뛰어난 사람은 특정 맛에 강하게 반응해 전반적으로 더 나은 건강 습관을 갖는다."}, "easy_story": "같은 음식을 먹어도 맛을 훨씬 강하게 느끼는 사람이 있어요. 그래서 단것이나 기름진 것, 술과 담배를 덜 찾는 이점이 생길 수 있어요. 하지만 쓴맛이 강한 채소까지 피할 수 있습니다. ‘맛에 민감하면 무조건 건강하다’가 아니라 이익과 예외를 함께 보는 글이에요.", "blocking_vocab": [{"word": "supertasters", "meaning": "맛에 매우 민감한 사람들"}, {"word": "cardiovascular", "meaning": "심혈관의"}, {"word": "repercussions", "meaning": "영향·결과"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["맛에 민감한 사람은 모든 건강한 음식을 예외 없이 더 좋아한다.", "미각이 뛰어난 사람은 특정 맛에 강하게 반응해 전반적으로 더 나은 건강 습관을 갖는다."], "answer": 1, "why": "미각이 뛰어난 사람은 특정 맛에 강하게 반응해 전반적으로 더 나은 건강 습관을 갖는다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 2, 3, 4, 5, 6]}, {"type": "근거 확인", "q": "맛에 민감한 사람에게도 생길 수 있는 예외는?", "choices": ["채소를 덜 먹게 될 수도 있다.", "채소를 반드시 더 많이 먹는다."], "answer": 0, "why": "채소에도 강하게 반응해 덜 먹을 수 있음", "refs": [5]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["Supertasters and nontasters respond similarly to many foods, but supertasters are less sensitive to certain sweet and bitter substances.", "Supertasters and nontasters respond similarly to many foods, but supertasters are more sensitive to certain sweet and bitter substances."], "answer": 1, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [1]}]}, {"id": "olym05-02", "unit": "olym05", "number": 2, "title": "no.02", "sentences": [{"n": 1, "en": "Every society has its cognitive \"police officers\" or gatekeepers who together define the fundamental cognitive orientation of the people and principally oversee the approved characterization and the defense of the societal norms.", "ko": "모든 사회에는 함께 사람들의 기본적인 인지적 성향을 규정하고 주로 사회 규범의 승인된 정의와 수호를 감독하는 인지적 '경찰관' 또는 문지기가 있다.", "role": "틀 세우기 — 어느 사회에나 규범을 지키는 문지기가 있다고 연다."}, {"n": 2, "en": "Among traditional African societies, this policing or gatekeeping role is performed mostly by the adult members through the acquisition of a library of ideas, because they are believed to have accumulated the knowledge and wisdom of the society.", "ko": "전통적인 아프리카 사회에서 이러한 감시 활동이나 문지기 역할은 생각의 서고 습득을 통해 성인 구성원에 의해 대부분 수행되는데, 이것은 그들이 그 사회에 대한 지식과 지혜를 축적해왔다고 여겨지기 때문이다.", "role": "좁히기 — 아프리카에서는 성인 구성원이 그 몫을 맡는다고 좁힌다."}, {"n": 3, "en": "No wonder then, that the Akan of Ghana has wise sayings and proverbs, such as \"Each time an elderly dies it is as if a library had burned down.\"", "ko": "그렇다면 가나의 아칸족에게 \"노인 한 명이 죽을 때마다 도서관 하나가 불타는 것과 같다\"와 같은 지혜로운 격언과 속담이 있는 것은 놀랄 일이 아니다.", "role": "속담 인용 — 노인의 죽음을 도서관 화재에 견준 말을 든다."}, {"n": 4, "en": "In addition to acting as guides to the land and its flora and fauna, elders convey knowledge to youngsters individually by telling stories, and thus overseeing their learning process.", "ko": "원로들은 땅과 그곳의 동식물에 대한 안내자 역할을 할 뿐만 아니라, 이야기를 해 줌으로써 젊은이들에게 개별적으로 지식을 전달하고, 그리고 이런 식으로 그들의 학습 과정을 감독한다.", "role": "구실 풀기 — 원로가 안내자이자 이야기로 지식을 넘긴다고 푼다."}, {"n": 5, "en": "There is also a reverence of filial piety, the respect for the elderly that is equated with wisdom.", "ko": "효도에 대한 숭상, 즉 지혜와 동일시되는 노인에 대한 존경심도 있다.", "role": "맺음 — 지혜와 동일시된 노인 존경이 있다고 갈무리한다."}], "core": "전통적인 아프리카 사회에서 원로는 축적된 지식으로 인지적 문지기 노릇을 하며 이야기로 그것을 전한다.", "flow": [{"label": "전제", "sentences": "S1", "text": "어느 사회에나 인지적 성향을 규정하고 규범을 지키는 문지기가 있다", "refs": [1]}, {"label": "적용", "sentences": "S2", "text": "아프리카 사회에서는 지식과 지혜를 쌓았다고 여겨지는 성인이 그 역할을 맡는다", "refs": [2]}, {"label": "근거", "sentences": "S3", "text": "「노인 한 명이 죽으면 도서관 하나가 불탄다」는 아칸족 속담이 그것을 보여 준다", "refs": [3]}, {"label": "전개", "sentences": "S4", "text": "원로는 안내자 노릇에 더해 이야기로 지식을 전하고 배움을 감독한다", "refs": [4]}, {"label": "결론", "sentences": "S5", "text": "노인에 대한 존경은 지혜와 동일시된다", "refs": [5]}], "structure": [{"title": "원인 — 쌓인 지식과 지혜", "text": "오랜 세월 「생각의 서고」를 갖춘 성인 구성원이 사회의 기억을 품는다"}, {"title": "결과 — 문지기와 존경", "text": "규범을 지키고 이야기로 배움을 이끌며, 노인에 대한 존경이 지혜와 같아진다"}], "key_sentence_en": "In traditional African societies, elders serve as cognitive gatekeepers whose accumulated knowledge is passed on through stories.", "diagram": {"kind": "web", "title": "사회 지식은 누가 어떻게 전하는가", "items": [{"head": "원로 = 지식의 문지기", "body": "원로가 사회의 지식·규범을 지키는 역할", "refs": [1, 2]}, {"head": "축적된 지혜", "body": "노인의 죽음을 도서관 소실에 비유", "refs": [3]}, {"head": "이야기로 전승", "body": "원로가 이야기로 젊은 세대에 지식을 전함", "refs": [4, 5]}], "takeaway": "전통적인 아프리카 사회에서 원로는 축적된 지식으로 인지적 문지기 노릇을 하며 이야기로 그것을 전한다."}, "easy_story": "한 사회가 오랫동안 알아낸 지식은 책에만 남는 게 아니에요. 경험 많은 원로가 무엇을 기억하고 전할지 살피고, 이야기를 통해 다음 세대에 알려 줍니다. 그래서 원로는 단순히 나이 많은 사람이 아니라 지식이 지나가는 문을 지키는 사람입니다.", "blocking_vocab": [{"word": "gatekeepers", "meaning": "문지기·접근을 관리하는 사람들"}, {"word": "accumulated", "meaning": "축적된"}, {"word": "overseeing", "meaning": "감독하는"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["전통적인 아프리카 사회에서 원로는 축적된 지식으로 인지적 문지기 노릇을 하며 이야기로 그것을 전한다.", "전통 사회의 지식은 이야기나 원로의 도움 없이 저절로 전해진다."], "answer": 0, "why": "전통적인 아프리카 사회에서 원로는 축적된 지식으로 인지적 문지기 노릇을 하며 이야기로 그것을 전한다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 2, 3, 4, 5]}, {"type": "근거 확인", "q": "전통 사회에서 원로가 지식을 전하는 수단은?", "choices": ["지식은 누구에게도 전달하지 않는다.", "이야기로 축적된 지혜를 전한다."], "answer": 1, "why": "원로가 이야기로 젊은 세대에 지식을 전함", "refs": [4, 5]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["Among traditional African societies, this policing or gatekeeping role is performed mostly by the adult members through the acquisition of a library of ideas, because they are believed to have accumulated the knowledge and wisdom of the society.", "Among traditional African societies, this policing or gatekeeping role is not performed mostly by the adult members through the acquisition of a library of ideas, because they are believed to have accumulated the knowledge and wisdom of the society."], "answer": 0, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [2]}]}, {"id": "olym05-03", "unit": "olym05", "number": 3, "title": "no.03", "sentences": [{"n": 1, "en": "Building codes can reduce the adverse impacts of hazards.", "ko": "건축 법규는 위험 요소로 인한 해로운 영향을 줄일 수 있다.", "role": "효용 제시 — 건축 법규가 피해를 줄일 수 있다고 연다."}, {"n": 2, "en": "For example, hurricane clips may prevent roofs from detaching from buildings during the high winds of passing tropical cyclones and thus prevent rain damage.", "ko": "예를 들어, 허리케인용 고정 장치는 지나가는 열대성 사이클론(인도양의 열대성 저기압)의 강한 바람이 불 때 지붕이 건물에서 분리되는 것을 방지하여 비 피해를 예방할 수 있다.", "role": "보기 — 지붕 고정 장치가 비 피해를 막는다고 든다."}, {"n": 3, "en": "However, as with engineered structures, building codes have their limitations.", "ko": "그러나 공학적 구조물에서와 마찬가지로, 건축 법규에도 그것의 한계가 있다.", "role": "방향 틀기 — 그러나 법규에도 한계가 있다고 꺾는다."}, {"n": 4, "en": "It was reported that in the wake of Hurricane Andrew, which struck South Florida in 1992, officials realized that strict building codes would not prevent serious damage.", "ko": "1992년에 사우스 플로리다를 강타한 허리케인 Andrew가 지나간 후에, 관료들은 엄격한 건축 법규가 심각한 피해를 막지 못할 것이라는 점을 깨달았다고 전해졌다.", "role": "근거 ① — 1992년 앤드루 뒤의 깨달음을 사례로 든다."}, {"n": 5, "en": "Furthermore, earthquake codes are typically designed to prevent buildings from collapsing, not to maintain structural integrity of the building and ensure habitability after a large earthquake.", "ko": "게다가, 지진 법규는 일반적으로 건물이 붕괴되는 것을 방지하기 위해서 고안된 것이지, 큰 지진이 발생한 후 건물의 구조적 온전성을 유지하고 거주 적합성을 보장하기 위해서가 아니었다.", "role": "근거 ② — 지진 법규는 붕괴만 막을 뿐이라고 짚는다."}, {"n": 6, "en": "This policy increases human survival rates in earthquakes, but is less effective in reducing the economic impact.", "ko": "이 정책은 지진 발생 시 인명 생존율을 높이지만, 경제적 영향을 줄이는 데 덜 효과적이다.", "role": "평가 — 목숨은 지켜도 경제 피해는 덜 막는다고 저울질한다."}, {"n": 7, "en": "Furthermore, building codes are the offspring of public policy, and policy is vulnerable to inequity in its application across the breadth of society, and may be ignored or not enforced.", "ko": "게다가, 건축 법규는 공공 정책의 산물이며, 정책은 사회 전반에 걸친 적용에 있어서 불평등에 취약하고, 무시되거나 시행되지 않을 수도 있다.", "role": "뿌리 캐기 — 법규가 정책의 산물이라 불평등에 약하다며 닫는다."}], "core": "건축 법규는 위험의 피해를 줄이지만 좁은 목표와 공공 정책의 불평등 때문에 한계가 있다.", "flow": [{"label": "주장", "sentences": "S1-2", "text": "건축 법규는 피해를 줄이며 허리케인용 고정 장치가 그 예다", "refs": [1, 2]}, {"label": "전환", "sentences": "S3", "text": "그러나 공학적 구조물처럼 건축 법규에도 한계가 있다", "refs": [3]}, {"label": "근거", "sentences": "S4", "text": "허리케인 Andrew 뒤 엄격한 법규도 심각한 피해를 막지 못함이 드러났다", "refs": [4]}, {"label": "근거", "sentences": "S5-6", "text": "지진 법규는 붕괴만 막도록 설계돼 생존율은 높이나 경제적 피해에는 약하다", "refs": [5, 6]}, {"label": "결론", "sentences": "S7", "text": "법규는 공공 정책의 산물이라 적용의 불평등에 취약하고 무시될 수 있다", "refs": [7]}], "structure": [{"title": "해결책으로서의 법규", "text": "지붕 고정 장치처럼 위험의 해로운 영향을 실제로 줄인다"}, {"title": "그 해결책의 한계", "text": "붕괴만 막고 경제적 피해는 못 줄이며, 정책이라 불평등하게 적용되거나 무시된다"}], "key_sentence_en": "Building codes reduce hazard impacts but are limited by their narrow goals and by the inequity of the public policy behind them.", "diagram": {"kind": "compare", "title": "건축 법규의 효과와 한계", "items": [{"head": "피해 감소", "body": "지붕 고정 등으로 자연재해 피해를 줄임", "refs": [1, 2]}, {"head": "설계 목표·정책의 한계", "body": "붕괴 방지가 목표여도 손상·정책 불평등은 남음", "refs": [3, 4, 5, 6, 7]}], "takeaway": "건축 법규는 위험의 피해를 줄이지만 좁은 목표와 공공 정책의 불평등 때문에 한계가 있다."}, "easy_story": "건물을 튼튼하게 짓는 법규가 있으면 위험이 닥쳐도 피해를 줄일 수 있어요. 그렇다고 법규 하나로 모든 문제가 해결되지는 않습니다. 무엇을 막도록 설계했는지, 정책의 혜택이 누구에게 닿는지에 한계가 있기 때문이에요. 효과와 한계를 함께 읽어야 합니다.", "blocking_vocab": [{"word": "habitability", "meaning": "거주 가능성"}, {"word": "structural", "meaning": "구조상의"}, {"word": "vulnerable", "meaning": "취약한"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["건축 법규만 있으면 모든 재난 피해와 사회적 불평등을 없앨 수 있다.", "건축 법규는 위험의 피해를 줄이지만 좁은 목표와 공공 정책의 불평등 때문에 한계가 있다."], "answer": 1, "why": "건축 법규는 위험의 피해를 줄이지만 좁은 목표와 공공 정책의 불평등 때문에 한계가 있다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 2, 3, 4, 5, 6, 7]}, {"type": "근거 확인", "q": "건축 법규의 효과를 한정하는 것은?", "choices": ["좁은 설계 목표와 공공 정책의 불평등이다.", "법규가 모든 피해를 완전히 없앤다는 점이다."], "answer": 0, "why": "붕괴 방지가 목표여도 손상·정책 불평등은 남음", "refs": [3, 4, 5, 6, 7]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["Building codes cannot reduce the adverse impacts of hazards.", "Building codes can reduce the adverse impacts of hazards."], "answer": 1, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [1]}]}, {"id": "olym05-04", "unit": "olym05", "number": 4, "title": "no.04", "sentences": [{"n": 1, "en": "Harvard business professor Alison Wood Brooks has done studies that show how stress and anxiety change based on what we tell ourselves.", "ko": "하버드 대학교 경영 대학원 교수 Alison Wood Brooks는 우리가 자신에게 말하는 바에 따라 스트레스와 불안이 어떻게 바뀌는지 보여 주는 연구를 수행했다.", "role": "연구 소개 — 자기에게 하는 말이 불안을 바꾼다는 연구를 든다."}, {"n": 2, "en": "Brooks's experiment sounds like a blast or a nightmare, depending on your perspective.", "ko": "Brooks의 실험은 여러분의 관점에 따라 신나는 경험처럼 들리기도 하고 악몽처럼 들리기도 한다.", "role": "흥미 돋우기 — 그 실험이 신나기도 악몽 같기도 하다고 흔든다."}, {"n": 3, "en": "She took a group of subjects with stage fright to a crowded bar with a stage and had them get up there and sing.", "ko": "그녀는 무대 공포증이 있는 피실험자들을 무대가 있는 붐비는 바에 데려가서 그들이 무대에 올라가 노래를 부르도록 했다.", "role": "설계 ① — 무대 공포증인 이들에게 바에서 노래시켰다고 밝힌다."}, {"n": 4, "en": "All the subjects arrived nervous, as expected.", "ko": "예상대로 모든 피실험자는 긴장한 채로 도착했다.", "role": "출발 상태 — 모두 긴장한 채 왔다고 시작점을 적는다."}, {"n": 5, "en": "But Brooks measured whether or not having them change their language ─ calling their nerves \"excitement\" ─ made any difference.", "ko": "하지만 Brooks는 피실험자들이 그들의 언어를 바꾸도록 한 것, 즉 긴장을 '흥분'이라고 부르도록 한 것이 어떤 차이를 가져오는지를 측정했다.", "role": "쟁점 짚기 — 긴장을 '흥분'이라 부르게 한 효과를 쟀다고 밝힌다."}, {"n": 6, "en": "She had one nervous group tell themselves over and over, \"I am excited,\" and tested them against a control group who just sat with their nerves and their regular self-talk.", "ko": "그녀는 긴장한 한 집단에게 \"나는 신난다.\"라고 반복해서 자신에게 말하게 하고, 그들을 긴장하여 평소의 혼잣말을 하며 그냥 앉아 있는 대조군과 대조하여 실험했다.", "role": "설계 ② — 되뇐 집단과 그냥 앉은 집단을 견줬다고 잇는다."}, {"n": 7, "en": "The results were eye-opening.", "ko": "결과는 놀랄 만했다.", "role": "뜸 들이기 — 결과가 놀라웠다며 눈길을 모은다."}, {"n": 8, "en": "The decision to tell themselves that the feeling they were experiencing was excitement helped them convert the energy into something positive, even useful.", "ko": "자신이 경험하고 있는 감정이 흥분이라고 자기 자신에게 말하기로 한 결정은 그들이 에너지를 긍정적인, 나아가 유용한 것으로 바꾸는 데 도움이 되었다.", "role": "결과로 맺기 — 그 한마디가 긴장을 쓸모 있는 힘으로 바꿨다고 닫는다."}], "core": "긴장을 흥분이라고 자신에게 말하는 것만으로 불안한 에너지가 긍정적인 것으로 바뀐다.", "flow": [{"label": "도입", "sentences": "S1-2", "text": "자신에게 하는 말에 따라 스트레스와 불안이 어떻게 바뀌는지 살핀 연구가 있다", "refs": [1, 2]}, {"label": "설계", "sentences": "S3-4", "text": "무대 공포증이 있는 사람들을 붐비는 바의 무대에 세워 노래하게 했다", "refs": [3, 4]}, {"label": "조작", "sentences": "S5-6", "text": "한 집단은 「나는 신난다」를 되뇌게 하고 대조군은 평소대로 두었다", "refs": [5, 6]}, {"label": "결과", "sentences": "S7-8", "text": "흥분이라고 말하기로 한 결정이 그 에너지를 긍정적이고 유용한 것으로 바꾸었다", "refs": [7, 8]}], "structure": [{"title": "실험군 — 「나는 신난다」", "text": "같은 긴장을 흥분이라 부르자 에너지가 긍정적인 쪽으로 돌아섰다"}, {"title": "대조군 — 평소의 혼잣말", "text": "긴장을 그대로 안고 앉아 있었고 달라진 것이 없었다"}], "key_sentence_en": "Telling yourself that your nerves are excitement can turn anxious energy into something positive.", "diagram": {"kind": "branches", "title": "같은 긴장, 다른 자기 말", "items": [{"head": "무대에 서는 불안", "body": "무대에서 노래할 참가자 모두 긴장함", "refs": [1, 2, 3, 4]}, {"head": "‘나는 신난다’ 반복", "body": "‘신난다’고 말해 불안의 에너지를 긍정적으로 사용", "refs": [5, 6, 7, 8]}, {"head": "평소대로 둔 대조군", "body": "평소 자기 말을 유지한 집단과 비교", "refs": [5, 6]}], "takeaway": "긴장을 흥분이라고 자신에게 말하는 것만으로 불안한 에너지가 긍정적인 것으로 바뀐다."}, "easy_story": "무대에 올라야 하는 사람은 누구나 긴장했어요. 연구자는 한쪽에는 ‘나는 신난다’고 말하게 하고, 다른 쪽은 평소처럼 긴장을 느끼게 했습니다. 몸의 긴장을 없앤 게 아니라 그 에너지를 해석하는 말을 바꾸자 더 긍정적으로 쓸 수 있었다는 이야기예요.", "blocking_vocab": [{"word": "excitement", "meaning": "흥분"}, {"word": "experiment", "meaning": "실험"}, {"word": "perspective", "meaning": "관점"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["불안을 흥분이라고 말하면 오히려 긍정적인 에너지가 완전히 사라진다.", "긴장을 흥분이라고 자신에게 말하는 것만으로 불안한 에너지가 긍정적인 것으로 바뀐다."], "answer": 1, "why": "긴장을 흥분이라고 자신에게 말하는 것만으로 불안한 에너지가 긍정적인 것으로 바뀐다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 2, 3, 4, 5, 6, 7, 8]}, {"type": "근거 확인", "q": "긴장을 다루는 실험에서 비교한 자기 말은?", "choices": ["‘나는 신난다’고 반복해서 말한다.", "‘나는 무조건 실패한다’고 반복한다."], "answer": 0, "why": "‘신난다’고 말해 불안의 에너지를 긍정적으로 사용", "refs": [5, 6, 7, 8]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["The decision to tell themselves that the feeling they were experiencing was excitement helped them convert the energy into something positive, even useful.", "The decision to tell themselves that the feeling they were experiencing was excitement prevented them from converting the energy into something positive, even useful."], "answer": 0, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [8]}]}, {"id": "olym05-05", "unit": "olym05", "number": 5, "title": "no.05", "sentences": [{"n": 1, "en": "I met a CEO once who had an amazing approach to problem solving.", "ko": "나는 언젠가 문제 해결에 대한 놀라운 접근 방식을 가진 CEO를 만난 적이 있다.", "role": "인물 소개 — 남다른 문제 해결법을 가진 CEO를 만났다고 연다."}, {"n": 2, "en": "Whenever his organization had a problem, he'd gather information about it.", "ko": "자신의 조직에 문제가 있을 때마다 그는 그것에 대한 정보를 수집하곤 했다.", "role": "차례 ① — 문제가 생기면 먼저 정보를 모았다고 밝힌다."}, {"n": 3, "en": "Once he had all the information, he'd say to his people, \"Okay, we're going to go to solution now.", "ko": "모든 정보가 수집되면 그는 직원들에게 \"자, 이제 우리는 해결책으로 나아갈 것입니다.", "role": "차례 ② — 이제 해결로 가자고 직원들에게 말한다고 잇는다."}, {"n": 4, "en": "But before we do that, I want you to spread out around the building and sit quietly, or take a walk for about a half hour.", "ko": "하지만 그것을 하기 전에 저는 여러분이 건물 이곳저곳에 흩어져서 조용히 앉아 있거나 30분 정도 산책을 하기를 바랍니다.", "role": "지시 ① — 그 전에 흩어져 앉거나 30분 걸으라고 시킨다."}, {"n": 5, "en": "Whatever you do, I want you to quiet yourself.", "ko": "여러분이 무엇을 하든 여러분 자신을 진정시키세요.", "role": "지시 ② — 무엇을 하든 자신을 진정시키라고 못 박는다."}, {"n": 6, "en": "No telephone, nothing to read.", "ko": "전화도 안 되고, 무언가를 읽지도 마세요.", "role": "금지 — 전화도 읽을거리도 없이 하라고 조건을 조인다."}, {"n": 7, "en": "And I want you to look for the answer within.\"", "ko": "그리고 내면에서 해답을 찾길 바랍니다.\"라고 말하곤 했다.", "role": "지시 ③ — 답은 안에서 찾으라며 말을 맺는다."}, {"n": 8, "en": "He told me it blew his mind to see how people's clarity and decision-making capacity would come back when they had a chance to quiet themselves and think through something without all kinds of distractions.", "ko": "그는 사람들이 온갖 방해 요소 없이 자신을 진정시키고 무언가를 충분히 생각할 기회를 가졌을 때 그들의 명료성과 의사 결정 능력이 회복되곤 하는 것을 보고 깜짝 놀랐다고 내게 말했다.", "role": "결과 — 방해가 없자 명료함과 결정력이 돌아왔다고 밝힌다."}, {"n": 9, "en": "I think half our problems of not behaving on our good intentions is that we don't give ourselves any space to rethink who we want to be.", "ko": "나는 우리가 좋은 의도로 행동하지 못하는 문제의 절반은 우리가 어떤 사람이 되고 싶은지를 다시 생각할 어떤 여유도 가지지 않는다는 것이라고 생각한다.", "role": "맺음 — 되돌아볼 여유가 없는 것이 문제의 절반이라 닫는다."}], "core": "방해 없이 자신을 진정시키는 조용한 시간이 명료성과 판단력을 되살린다.", "flow": [{"label": "도입", "sentences": "S1-2", "text": "문제 해결에 남다른 방식을 지닌 CEO 는 문제가 생기면 먼저 정보를 모았다", "refs": [1, 2]}, {"label": "지시", "sentences": "S3-5", "text": "해결로 나아가기 전에 흩어져 조용히 앉거나 30분쯤 걸으라고 시켰다", "refs": [3, 4, 5]}, {"label": "조건", "sentences": "S6-7", "text": "전화도 읽을 것도 없이 내면에서 해답을 찾으라고 했다", "refs": [6, 7]}, {"label": "결과", "sentences": "S8", "text": "방해가 없자 사람들의 명료성과 의사 결정 능력이 되살아났다", "refs": [8]}, {"label": "결론", "sentences": "S9", "text": "다시 생각할 여유가 없다는 것이 문제의 절반이다", "refs": [9]}], "structure": [{"title": "문제 — 여유 없는 머리", "text": "온갖 방해 속에서 좋은 의도대로 행동하지 못한다"}, {"title": "해결 — 조용한 30분", "text": "전화도 읽을 것도 없이 자신을 진정시키면 명료성과 판단력이 돌아온다"}], "key_sentence_en": "Quieting yourself without distractions restores clarity and the capacity to decide.", "diagram": {"kind": "steps", "title": "문제 해결 전에 필요한 정지", "items": [{"head": "정보를 모음", "body": "문제에 관한 정보를 먼저 모음", "refs": [1, 2]}, {"head": "방해 없이 조용히 있음", "body": "방해 없이 조용히 앉거나 걸으며 생각", "refs": [3, 4, 5, 6, 7]}, {"head": "명료한 판단 회복", "body": "명료함과 판단 능력이 다시 돌아옴", "refs": [8, 9]}], "takeaway": "방해 없이 자신을 진정시키는 조용한 시간이 명료성과 판단력을 되살린다."}, "easy_story": "문제를 풀려고 정보를 모았다고 곧바로 좋은 판단이 나오는 것은 아니에요. 계속 방해를 받으며 급하게 생각하면 머리가 더 복잡해집니다. 잠시 조용히 멈춰 자신을 가라앉히면 무엇이 중요한지 다시 분명해질 수 있어요.", "blocking_vocab": [{"word": "distractions", "meaning": "주의를 흩뜨리는 것들"}, {"word": "intentions", "meaning": "의도"}, {"word": "capacity", "meaning": "능력"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["방해를 더 많이 받으며 즉시 결정을 내릴수록 판단이 명료해진다.", "방해 없이 자신을 진정시키는 조용한 시간이 명료성과 판단력을 되살린다."], "answer": 1, "why": "방해 없이 자신을 진정시키는 조용한 시간이 명료성과 판단력을 되살린다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 2, 3, 4, 5, 6, 7, 8, 9]}, {"type": "근거 확인", "q": "명료한 판단을 되찾는 데 필요한 시간은?", "choices": ["방해 없이 조용히 자신을 진정시키는 시간이다.", "끊임없이 방해받으며 급히 결정하는 시간이다."], "answer": 0, "why": "방해 없이 조용히 앉거나 걸으며 생각", "refs": [3, 4, 5, 6, 7]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["But before we do that, I want you to spread out around the building and sit quietly, or take a walk for about a half hour.", "But after we do that, I want you to spread out around the building and sit quietly, or take a walk for about a half hour."], "answer": 0, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [4]}]}, {"id": "olym05-06", "unit": "olym05", "number": 6, "title": "no.06", "sentences": [{"n": 1, "en": "Your real social capital is most likely going to come from people you know in the physical world rather than through your virtual social networks.", "ko": "여러분의 진정한 사회 자본은 가상의 소셜 네트워크를 통해서가 아니라 아마도 물리적 세계에서 여러분이 아는 사람들에게서 기인할 것이다.", "role": "주장 세우기 — 진짜 사회 자본은 실제로 아는 사람에게서 온다고 연다."}, {"n": 2, "en": "Knowing that, as well as knowing that you may get interrupted by communications from your electronic world, you should develop rules about how to deal with intrusive e-connections when you are actually face to face with friends.", "ko": "그것을 아는 것과 더불어 여러분의 전자 세계에서 오는 연락에 의해 여러분이 방해받을 수 있다는 것을 알기에, 여러분은 실제로 친구와 대면하고 있을 때 방해가 되는 전자 연결에 어떻게 대처할지에 대한 규칙을 만들어야 한다.", "role": "요구 — 그러니 대면 중 끼어드는 연락에 규칙을 세우라고 이른다."}, {"n": 3, "en": "Too often you see people with their smartphones lined up on a restaurant table, willing to interrupt themselves to respond to whoever has just sent a text.", "ko": "음식점 테이블에 스마트폰을 늘어 놓고 방금 문자를 보낸 사람이 누구든 그에게 응답하기 위해 기꺼이 스스로를 방해하는 사람들을 여러분은 너무 자주 본다.", "role": "장면 들기 — 식탁에 폰을 늘어놓고 답하는 모습을 그린다."}, {"n": 4, "en": "This doesn't mean that you can't respond to these interruptions if they are important; it just means that you have to define an \"important\" message in advance and then leave the rest alone for after your social get-together.", "ko": "이것은 이러한 방해가 중요한 경우에도 여러분이 그것에 응답할 수 없다는 뜻이 아니라, '중요한' 메시지를 미리 규정하고 나머지는 사교 모임이 끝난 후에 보도록 남겨 두어야 한다는 의미일 뿐이다.", "role": "오해 막기 — 다 무시하라는 말이 아니라 미리 가르라는 뜻이라 푼다."}, {"n": 5, "en": "You need to take your local audience into account while understanding the needs of your remote audience.", "ko": "여러분은 멀리 있는 여러분의 청자의 필요를 이해하면서도 현재 여러분과 같은 공간에 있는 청자를 고려해야 한다.", "role": "맺음 — 멀리 있는 이도 살피되 앞사람을 먼저 보라며 닫는다."}], "core": "진정한 사회 자본은 대면 관계에서 오므로 방해가 되는 전자 연결에 대처할 규칙을 미리 정해야 한다.", "flow": [{"label": "주제", "sentences": "S1", "text": "진정한 사회 자본은 가상의 연결망보다 직접 아는 사람들에게서 온다", "refs": [1]}, {"label": "지시", "sentences": "S2", "text": "그러니 대면 중에 오는 방해에 어떻게 대처할지 규칙을 만들어야 한다", "refs": [2]}, {"label": "예시", "sentences": "S3", "text": "탁자에 스마트폰을 늘어놓고 문자에 답하려 스스로를 방해하는 모습을 자주 본다", "refs": [3]}, {"label": "단서", "sentences": "S4", "text": "중요한 메시지는 미리 규정하고 나머지는 모임 뒤로 미룬다", "refs": [4]}, {"label": "결론", "sentences": "S5", "text": "멀리 있는 청자를 이해하되 곁에 있는 청자를 먼저 고려한다", "refs": [5]}], "structure": [{"title": "문제 — 스스로 만드는 방해", "text": "대면 중에도 문자에 답하려고 자기 대화를 끊는다"}, {"title": "해결 — 미리 정한 규칙", "text": "「중요한」의 기준을 앞서 정하고 나머지는 모임 뒤로 미뤄 곁 사람을 먼저 본다"}], "key_sentence_en": "Because real social capital comes from face-to-face ties, set rules in advance so that digital interruptions do not crowd out the people in front of you.", "diagram": {"kind": "compare", "title": "가까운 관계와 전자 연결", "items": [{"head": "대면의 사회 자본", "body": "가까이에서 만나는 사람과의 관계가 중요", "refs": [1, 2]}, {"head": "화면이 만드는 방해", "body": "알림이 만남을 끊음 → 중요한 연락만 응답", "refs": [3, 4, 5]}], "takeaway": "진정한 사회 자본은 대면 관계에서 오므로 방해가 되는 전자 연결에 대처할 규칙을 미리 정해야 한다."}, "easy_story": "연락할 수 있는 사람이 많아도 눈앞 사람과 제대로 만나지 못하면 관계는 약해질 수 있어요. 기기 알림이 대화를 끊기 때문입니다. 글은 중요한 사회적 자본이 대면 관계에서 온다고 보고, 방해를 줄일 규칙을 미리 정하라고 합니다.", "blocking_vocab": [{"word": "interruptions", "meaning": "방해·중단"}, {"word": "intrusive", "meaning": "끼어드는"}, {"word": "electronic", "meaning": "전자적인"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["전자 기기로 계속 연결되기만 하면 대면 관계의 방해를 걱정할 필요가 없다.", "진정한 사회 자본은 대면 관계에서 오므로 방해가 되는 전자 연결에 대처할 규칙을 미리 정해야 한다."], "answer": 1, "why": "진정한 사회 자본은 대면 관계에서 오므로 방해가 되는 전자 연결에 대처할 규칙을 미리 정해야 한다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 2, 3, 4, 5]}, {"type": "근거 확인", "q": "전자 연결이 관계에 줄 수 있는 문제는?", "choices": ["대면 관계의 방해를 항상 없앤다.", "대면 관계를 방해할 수 있다."], "answer": 1, "why": "알림이 만남을 끊음 → 중요한 연락만 응답", "refs": [3, 4, 5]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["Your real social capital is not most likely going to come from people you know in the physical world rather than through your virtual social networks.", "Your real social capital is most likely going to come from people you know in the physical world rather than through your virtual social networks."], "answer": 1, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [1]}]}]}, {"id": "olym08", "label": "올림포스 영독 기본1 · 8강", "scope": "어법 정확성", "passages": [{"id": "olym08-01", "unit": "olym08", "number": 1, "title": "p54 수능 대비 ANALYSIS", "sentences": [{"n": 1, "en": "Knowledge, for science, aims to be proven knowledge, justified by evidence and reason.", "ko": "과학에서 지식은 증명된 지식이 되는 것을 목표로 하는데, 이는 증거와 이성에 의해 정당화된다.", "role": "과학의 지식 과학은 증거와 이성으로 정당화되는 지식을 추구한다."}, {"n": 2, "en": "Nothing is accepted as true unless it has been proved to be so, or there are good reasons to believe that it will be at some point in the future.", "ko": "어떤 것도 그것이 그럴 것이라고(진실이라고) 증명되지 않았거나, 미래의 어느 시점에 그럴 것이라고 믿을 만한 충분한 이유가 있지 않은 한, 진실이라고 인정되지 않는다.", "role": "인정의 조건 진실로 인정하려면 이미 입증되었거나 앞으로 입증될 것이라고 믿을 충분한 근거가 있어야 한다."}, {"n": 3, "en": "This reflects the philosophical quest for certainty that goes back to Rene Descartes, who refused to accept anything that he could not know for certain to be true.", "ko": "이는 Rene Descartes로 거슬러 올라가는 확실성에 관한 철학적 추구를 반영하는데, 그는 자신이 진실이라고 확실하게 알 수 없는 어떤 것도 받아들이기를 거부했다.", "role": "철학적 뿌리 확실한 지식의 추구를 Descartes의 철학과 연결한다."}, {"n": 4, "en": "He hoped to base all knowledge on self-evident propositions, and thought that reason should take priority over observation.", "ko": "그는 모든 지식을 자명한 명제에 기반하기를 희망했고, 이성이 관찰에 우선해야 한다고 생각했다.", "role": "이성의 우위 Descartes는 자명한 명제와 이성을 지식의 토대로 삼고자 했다."}, {"n": 5, "en": "Descartes was aware that his senses frequently misled him.", "ko": "Descartes는 감각이 자주 자신을 오도한다는 것을 알고 있었다.", "role": "감각의 한계 Descartes는 감각이 자신을 잘못 이끌 수 있음을 인식했다."}, {"n": 6, "en": "The implication of this ─ a view which had a long history, prior to the rise of science ─ was that, if the evidence of our senses did not conform to reason, it was likely that they were in error.", "ko": "과학이 발달하기 이전부터 오랜 역사를 갖고 있는 견해인 이것의 의미는 감각의 증거가 이성과 일치하지 않으면, 그것들은 오류에 빠졌을 가능성이 있다는 것이었다.", "role": "판단의 기준 감각과 이성이 충돌하면 감각 쪽이 틀렸다고 판단하는 관점을 설명한다."}], "core": "과학의 확실한 지식 추구는 증거와 이성을 중시하며, Descartes는 감각이 이성과 충돌하면 감각의 오류를 의심했다.", "flow": [{"label": "과학의 목표", "sentences": "S1–2", "text": "지식은 이미 입증되었거나 앞으로 입증될 것이라고 믿을 충분한 근거가 있어야 한다.", "refs": [1, 2]}, {"label": "철학적 배경", "sentences": "S3–4", "text": "Descartes는 자명한 명제에 지식을 세우고 관찰보다 이성을 우선했다.", "refs": [3, 4]}, {"label": "감각의 한계", "sentences": "S5", "text": "그는 감각이 자신을 잘못 이끌 수 있음을 알고 있었다.", "refs": [5]}, {"label": "불일치의 판단", "sentences": "S6", "text": "감각과 이성이 일치하지 않으면 감각 쪽의 오류 가능성을 높게 보았다.", "refs": [6]}], "structure": [{"title": "출발점", "text": "감각은 사람을 오도할 수 있다."}, {"title": "판단 원칙", "text": "감각의 증거와 이성이 충돌하면 감각의 오류를 의심한다."}], "key_sentence_en": "The pursuit of certain knowledge reflects a tradition that gave reason priority when sensory evidence conflicted with it.", "diagram": {"kind": "compare", "title": "Descartes가 충돌을 판단하는 기준", "items": [{"head": "이성과 근거", "body": "과학은 증거와 이성으로 정당화한 지식을 추구", "refs": [1, 2, 3, 4]}, {"head": "오류 가능성이 있는 감각", "body": "감각이 이성과 충돌하면 감각의 오류를 의심", "refs": [5, 6]}], "takeaway": "과학의 확실한 지식 추구는 증거와 이성을 중시하며, Descartes는 감각이 이성과 충돌하면 감각의 오류를 의심했다."}, "easy_story": "눈으로 본 것이 언제나 참일까요? Descartes는 감각이 자신을 속인 적이 있다는 것을 알았어요. 그래서 감각과 이성이 충돌하면, 보이는 것만 믿기보다 증거와 이성으로 따져야 한다고 생각했습니다. 과학이 확실한 지식을 찾으려는 태도와 연결됩니다.", "blocking_vocab": [{"word": "propositions", "meaning": "명제들"}, {"word": "certainty", "meaning": "확실성"}, {"word": "observation", "meaning": "관찰"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["Descartes는 이성과 감각이 충돌할 때 반드시 감각을 더 믿어야 한다고 보았다.", "과학의 확실한 지식 추구는 증거와 이성을 중시하며, Descartes는 감각이 이성과 충돌하면 감각의 오류를 의심했다."], "answer": 1, "why": "과학의 확실한 지식 추구는 증거와 이성을 중시하며, Descartes는 감각이 이성과 충돌하면 감각의 오류를 의심했다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 2, 3, 4, 5, 6]}, {"type": "근거 확인", "q": "Descartes가 이성과 충돌할 때 의심한 것은?", "choices": ["오류 가능성이 있는 감각이다.", "근거 있는 이성 자체만이다."], "answer": 0, "why": "감각이 이성과 충돌하면 감각의 오류를 의심", "refs": [5, 6]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["He hoped to base all knowledge on self-evident propositions, and thought that observation should take priority over reason.", "He hoped to base all knowledge on self-evident propositions, and thought that reason should take priority over observation."], "answer": 1, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [4]}]}, {"id": "olym08-02", "unit": "olym08", "number": 2, "title": "p56 no.01", "sentences": [{"n": 1, "en": "Many of the ancient urban centers obtained their food supply from intensive irrigated agriculture in the region where they were located, and it is usually suggested that this is because labor productivity is particularly high with irrigated agriculture.", "ko": "고대의 많은 도시 중심지는 그것이 위치한 지역에서 집약적인 관개 농업을 통해 식량을 공급받았는데, 일반적으로 이는 관개 농업의 노동 생산성이 특히 높기 때문임을 시사한다.", "role": "일반적인 설명 도시가 관개 농업에 의존한 이유를 높은 노동 생산성으로 설명하는 견해를 제시한다."}, {"n": 2, "en": "It seems more relevant to point out that this type of primitive subsistence system has a particularly high output per unit of land.", "ko": "이러한 유형의 원시적 생존 체계는 단위 토지당 생산량이 특히 높다는 점을 언급하는 것이 더 적절해 보인다.", "role": "설명의 전환 노동 생산성보다 단위 면적당 생산량에 주목해야 한다고 제안한다."}, {"n": 3, "en": "The high demand for labor per unit of land and the high output per unit of land made it necessary and possible for a large number of families to live within a small area.", "ko": "단위 토지당 높은 노동력 수요와 단위 토지당 높은 생산량은 많은 수의 가구가 좁은 지역 안에 사는 것을 필요하고 가능하게 했다.", "role": "집중 거주의 조건 많은 노동력과 높은 면적당 생산량이 좁은 지역에 많은 가구가 모여 살게 했다."}, {"n": 4, "en": "Therefore, even if the surplus per family is small, the total surplus available within a fairly small distance from the town will be large.", "ko": "따라서 가구당 잉여물이 적더라도 마을에서 상당히 짧은 거리 내에서 이용할 수 있는 총 잉여물은 많을 것이다.", "role": "집적의 효과 가구당 잉여물이 적어도 많은 가구가 모이면 도시 주변의 총량은 커진다."}, {"n": 5, "en": "In addition, the irrigation canals, or the river used for irrigation, can be used for boat transport of food to the town.", "ko": "게다가 용수로, 즉 관개에 사용되는 강은 배로 식량을 마을까지 옮기는 데 사용될 수 있다.", "role": "운송의 이점 용수로나 관개에 쓰는 강을 식량의 수상 운송에도 활용할 수 있다."}], "core": "관개 농업은 단위 면적당 높은 생산량과 노동력 수요로 밀집 거주를 가능하게 하고, 도시 주변의 식량 공급과 운송을 뒷받침했다.", "flow": [{"label": "기존 설명", "sentences": "S1", "text": "관개 농업의 높은 노동 생산성이 고대 도시의 식량 공급을 설명한다는 견해이다.", "refs": [1]}, {"label": "관점 수정", "sentences": "S2", "text": "글쓴이는 노동 생산성보다 단위 면적당 높은 생산량에 주목한다.", "refs": [2]}, {"label": "집중과 잉여", "sentences": "S3–4", "text": "많은 가구가 좁은 지역에 모여 살아 총잉여 식량이 커진다.", "refs": [3, 4]}, {"label": "운송 이점", "sentences": "S5", "text": "용수로나 관개에 쓰는 강은 식량을 도시로 나르는 수상 운송에도 이용된다.", "refs": [5]}], "structure": [{"title": "일반적인 설명", "text": "노동 생산성이 높아서 도시의 식량을 공급한다."}, {"title": "글쓴이가 강조한 설명", "text": "단위 면적당 높은 생산량과 노동 수요가 가구의 밀집과 총잉여를 만든다."}], "key_sentence_en": "Irrigated agriculture supported ancient towns through high output per unit of land, concentrated settlement, and water transport.", "diagram": {"kind": "branches", "title": "관개 농업이 도시를 뒷받침한 두 길", "items": [{"head": "관개 농업", "body": "글쓴이는 노동 생산성보다 땅 한 단위에서 얻는 많은 생산량에 주목한다.", "refs": [1, 2]}, {"head": "좁은 지역의 식량 잉여", "body": "높은 생산량과 노동력 수요로 사람이 모여 도시 주변 식량 잉여가 커진다.", "refs": [3, 4]}, {"head": "도시까지의 운송", "body": "별도로, 용수로나 강은 식량을 도시로 실어 나르는 길이 된다.", "refs": [5]}], "takeaway": "밀집된 식량 공급과 수로 운송은 서로 다른 두 뒷받침이다."}, "easy_story": "도시에는 많은 사람이 모여 살고 먹을 것이 계속 들어와야 해요. 관개 농업은 좁은 땅에서도 많은 식량을 만들고, 그만큼 많은 일손도 필요했습니다. 사람들이 가까이 모이고, 물길로 식량을 운반할 수 있었기에 도시를 뒷받침했다는 흐름입니다.", "blocking_vocab": [{"word": "irrigation", "meaning": "관개"}, {"word": "productivity", "meaning": "생산성"}, {"word": "subsistence", "meaning": "생계·생존"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["관개 농업은 식량 생산과 운송에 아무 영향을 주지 않아 도시 형성과 무관했다.", "관개 농업은 단위 면적당 높은 생산량과 노동력 수요로 밀집 거주를 가능하게 하고, 도시 주변의 식량 공급과 운송을 뒷받침했다."], "answer": 1, "why": "관개 농업은 단위 면적당 높은 생산량과 노동력 수요로 밀집 거주를 가능하게 하고, 도시 주변의 식량 공급과 운송을 뒷받침했다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 2, 3, 4, 5]}, {"type": "근거 확인", "q": "관개 농업이 도시를 도운 길 중 하나는?", "choices": ["수로가 운송을 가능하게 했다.", "수로가 이동과 공급을 막았다."], "answer": 0, "why": "관개 수로나 강을 배 운송에 이용", "refs": [5]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["It seems more relevant to point out that this type of primitive subsistence system has a particularly low output per unit of land.", "It seems more relevant to point out that this type of primitive subsistence system has a particularly high output per unit of land."], "answer": 1, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [2]}]}, {"id": "olym08-03", "unit": "olym08", "number": 3, "title": "p57 no.02", "sentences": [{"n": 1, "en": "We have vast forests in this country but not enough to provide all of the wood, all of the wilderness, and all of the accessible recreation that we want.", "ko": "이 나라에는 방대한 숲이 있지만, 우리가 원하는 모든 목재, 모든 야생의 자연, 모든 이용할 수 있는 휴양을 제공하기에는 충분하지 않다.", "role": "자원의 한계 숲이 넓어도 우리가 원하는 모든 용도를 충족할 만큼 충분하지는 않다."}, {"n": 2, "en": "As soon as we log trees, build roads, or improve trails and campsites, we lose some wilderness.", "ko": "우리가 나무를 벌목하거나, 도로를 건설하거나, 등산로와 야영장을 개선하는 순간, 우리는 얼마간의 야생의 자연을 잃게 된다.", "role": "숲 이용의 대가 벌목과 편의 시설 조성은 야생의 자연을 줄인다."}, {"n": 3, "en": "Similarly, we have large amounts of fresh water, but if we use water to grow rice in California, the water consumed cannot be used for drinking water in California cities.", "ko": "마찬가지로, 우리는 많은 양의 담수가 있지만, 우리가 캘리포니아주에서 벼를 재배하기 위해 물을 사용하면, 소비된 물은 캘리포니아주 도시에서 식수로 사용될 수 없다."

, "role": "물 이용의 대가 농업에 사용한 물을 도시의 식수로 동시에 쓸 수는 없다."}, {"n": 4, "en": "If we use fire to help a forest renew itself, we will have air pollution downwind while the fire burns.", "ko": "숲이 스스로를 새롭게 하는 것을 돕기 위해 우리가 불을 사용한다면, 불이 타는 동안 바람을 타고 대기 오염이 발생하게 할 것이다.", "role": "산불 활용의 대가 숲의 재생을 위해 불을 쓰면 타는 동안 바람 아래쪽에 대기 오염이 생긴다."}, {"n": 5, "en": "We have many goals, so we have to make choices about how to allocate our limited resources.", "ko": "우리는 많은 목표를 가지고 있으므로, 우리는 우리의 제한된 자원을 어떻게 배분할지 선택해야 한다.", "role": "선택의 필요 여러 목표를 충족하려면 한정된 자원의 배분 방식을 선택해야 한다."}, {"n": 6, "en": "The cost of those choices is what we give up ─ the cost of opportunities lost.", "ko": "이러한 선택의 대가는 우리가 포기하는 것, 즉 상실된 기회의 비용이다.", "role": "기회비용 선택의 대가는 그 선택 때문에 포기한 다른 기회의 가치이다."}], "core": "자원이 한정되어 있으므로 여러 목표 중 용도를 선택해야 하며, 그 선택의 비용은 포기한 다른 기회이다.", "flow": [{"label": "자원의 한계", "sentences": "S1", "text": "방대한 숲도 우리가 원하는 모든 용도를 충족할 만큼 충분하지 않다.", "refs": [1]}, {"label": "이용의 대가", "sentences": "S2–4", "text": "개발은 자연을 줄이고 농업용수는 식수로 쓸 수 없으며 불은 대기 오염을 낳는다.", "refs": [2, 4]}, {"label": "배분의 선택", "sentences": "S5", "text": "여러 목표를 위해 제한된 자원을 어떻게 배분할지 선택한다.", "refs": [5]}, {"label": "기회비용", "sentences": "S6", "text": "선택의 대가는 그 때문에 포기한 다른 기회의 가치이다.", "refs": [6]}], "structure": [{"title": "조건", "text": "목표는 여러 가지이지만 자원은 한정되어 있다."}, {"title": "필요한 판단", "text": "한 용도를 선택하면 다른 용도의 기회를 포기하게 된다."}], "key_sentence_en": "Allocating limited resources among competing goals entails opportunity costs: the alternatives we give up.", "diagram": {"kind": "steps", "title": "한정된 자원의 선택", "items": [{"head": "자원은 충분하지 않음", "body": "숲과 물은 원하는 모든 용도를 채우기에 부족", "refs": [1]}, {"head": "용도를 선택함", "body": "한 용도를 고르면 다른 가치나 용도를 잃음", "refs": [2, 4, 5]}, {"head": "포기한 기회가 비용", "body": "포기한 기회가 선택의 비용", "refs": [6]}], "takeaway": "자원이 한정되어 있으므로 여러 목표 중 용도를 선택해야 하며, 그 선택의 비용은 포기한 다른 기회이다."}, "easy_story": "한 시간에 두 가지 일을 동시에 전부 할 수는 없어요. 한쪽을 선택하는 순간 다른 쪽을 할 기회를 내려놓습니다. 글은 돈뿐 아니라 이렇게 포기한 ‘다른 가능성’도 선택의 비용이라고 말해요.", "blocking_vocab": [{"word": "allocate", "meaning": "배분하다"}, {"word": "opportunities", "meaning": "기회들"}, {"word": "pollution", "meaning": "오염"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["한정된 자원에서도 한 용도를 선택하면 다른 기회를 포기할 필요가 없다.", "자원이 한정되어 있으므로 여러 목표 중 용도를 선택해야 하며, 그 선택의 비용은 포기한 다른 기회이다."], "answer": 1, "why": "자원이 한정되어 있으므로 여러 목표 중 용도를 선택해야 하며, 그 선택의 비용은 포기한 다른 기회이다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 2, 4, 5, 6]}, {"type": "근거 확인", "q": "선택의 비용은 무엇을 가리키는가?", "choices": ["선택 때문에 포기한 다른 기회다.", "이미 선택해 얻은 것만을 뜻한다."], "answer": 0, "why": "포기한 기회가 선택의 비용", "refs": [6]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["The cost of those choices is what we give up ─ the cost of opportunities lost.", "The cost of those choices is not what we give up ─ the cost of opportunities lost."], "answer": 0, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [6]}]}, {"id": "olym08-04", "unit": "olym08", "number": 4, "title": "p58 no.03", "sentences": [{"n": 1, "en": "Not all innovations that improve human living standards show up in revenue and profits.", "ko": "인간의 생활 수준을 향상하는 모든 혁신이 수입과 수익에 나타나는 것은 아니다.", "role": "주제 제시 생활 수준을 높이는 혁신이 반드시 매출이나 이익의 증가로 나타나지는 않는다."}, {"n": 2, "en": "Some instead accrue directly to consumers.", "ko": "어떤 수입과 수익은 대신에 소비자에게 직접적으로 생긴다.", "role": "혜택의 귀속 수입 증가로 나타나지 않는 혁신의 혜택이 소비자에게 직접 돌아갈 수 있다."}, {"n": 3, "en": "Many of the product improvements brought about by technology have the paradoxical effect of reducing industry revenue.", "ko": "기술에 의해 초래된 많은 제품의 개선은 산업 수입을 감소시키는 역설적 효과를 가진다.", "role": "역설적 효과 기술이 제품을 개선하면서도 산업 수입을 줄일 수 있다."}, {"n": 4, "en": "To see why, suppose people used to pay $1 to download a song.", "ko": "그 이유를 알려면 사람들이 어떤 노래를 다운로드하기 위해 1달러를 냈다고 가정해 보라.", "role": "사례 도입 한 곡을 내려받는 가격이 1달러였던 상황을 가정한다."}, {"n": 5, "en": "Then some change comes along so that people can listen to the song while paying only a quarter of what they used to pay.", "ko": "그런 다음 어떤 변화가 생겨서 사람둘은 예전에 냈던 금액의 4분의 1만 내면서 그 노래를 들을 수 있게 된다.", "role": "가격 하락 가격이 예전의 4분의 1로 내려가 소비자는 더 적은 돈을 낸다."}, {"n": 6, "en": "If there is no change in the number of people purchasing the song, revenue will fall by 75 percent.", "ko": "그 노래를 구매하는 사람들의 수에 변화가 없다면, 수입은 75퍼센트 감소할 것이다.", "role": "수입 계산 ① 구매자 수가 같으면 가격이 4분의 1이 되어 총수입이 75퍼센트 줄어든다."}, {"n": 7, "en": "Even if the number of people buying a song doubles with the lower price, revenue will still fall by 50 percent.", "ko": "더 낮은 가격으로 인해 노래를 구매하는 사람들의 수가 두 배가 되더라도, 수입은 여전히 50퍼센트 감소할 것이다.", "role": "수입 계산 ② 구매자 수가 두 배가 되어도 가격 하락 때문에 총수입은 절반으로 줄어든다."}, {"n": 8, "en": "But people, by which we mean society as a whole, will be much better off.", "ko": "하지만 사람들은, 우리가 그것으로 사회 전체를 의미하는데, 형편이 훨씬 더 나아질 것이다.", "role": "사회적 혜택 수입이 줄어도 사회 전체는 더 나은 형편이 될 수 있다."}, {"n": 9, "en": "The point is that revenue reduction, and an accompanying failure to raise GDP, is not by itself evidence that society is worse off.", "ko": "요점은 수입 감소와 이에 수반하는 GDP(국내 총생산) 증가 실패가 그 자체로 사회의 형편이 더 나빠진다는 증거는 아니라는 것이다.", "role": "핵심 결론 수입과 GDP가 늘지 않는다는 사실만으로 사회가 나빠졌다고 판단할 수 없다."}], "core": "기술 혁신이 가격과 산업 수입을 낮추더라도 소비자는 이익을 얻을 수 있으므로, 수입이나 GDP의 변화만으로 사회의 형편을 판단할 수 없다.", "flow": [{"label": "주장과 이유", "sentences": "S1–3", "text": "생활 수준을 높이는 혁신이 산업 수입을 줄이고 혜택을 소비자에게 돌릴 수 있다.", "refs": [1, 3]}, {"label": "가격 변화", "sentences": "S4–5", "text": "한 곡의 가격이 1달러에서 4분의 1달러로 내려가는 상황을 가정한다.", "refs": [4, 5]}, {"label": "수입의 감소", "sentences": "S6–7", "text": "구매자 수가 같으면 수입이 75%, 두 배가 되어도 50% 줄어든다.", "refs": [6, 7]}, {"label": "사회적 평가", "sentences": "S8–9", "text": "수입과 GDP가 증가하지 않아도 사회 전체의 형편은 좋아질 수 있다.", "refs": [8, 9]}], "structure": [{"title": "산업의 수입", "text": "가격 하락으로 구매자 수가 늘어도 수입이 줄 수 있다."}, {"title": "사회가 얻는 혜택", "text": "소비자는 더 낮은 비용으로 같은 제품을 이용할 수 있다."}], "key_sentence_en": "Lower revenue after a technological improvement does not by itself show that society is worse off.", "diagram": {"kind": "bars", "title": "가격이 1/4로 내려가면 수입은?", "max": 100, "unit": "", "items": [{"head": "원래 수입", "value": 100, "body": "원래 수입을 100으로 놓은 기준값", "refs": [4]}, {"head": "구매자 그대로", "value": 25, "body": "가격 1/4 → 수입 75% 감소", "refs": [5, 6]}, {"head": "구매자 2배", "value": 50, "body": "가격 1/4 × 구매자 2배 → 수입 50% 감소", "refs": [5, 7]}], "takeaway": "막대는 실제 달러 액수가 아니라 원래 수입=100인 상대 지수다. 수입이 줄어도 소비자는 더 나아질 수 있다 · S8~9"}, "easy_story": "원래 한 곡을 1달러에 듣던 사람이 이제 25센트만 내면 됩니다. 듣는 사람이 그대로라면 회사 수입은 4분의 1이고, 두 배로 늘어도 절반이에요. 하지만 사람들은 더 싼값에 노래를 듣습니다. 그러니 회사 수입 감소만 보고 사회 전체가 나빠졌다고 말할 수 없어요.", "blocking_vocab": [{"word": "paradoxical", "meaning": "역설적인"}, {"word": "innovations", "meaning": "혁신들"}, {"word": "purchasing", "meaning": "구매하는"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["산업 수입이 줄었다면 소비자도 반드시 손해를 보았으므로 다른 정보는 볼 필요가 없다.", "기술 혁신이 가격과 산업 수입을 낮추더라도 소비자는 이익을 얻을 수 있으므로, 수입이나 GDP의 변화만으로 사회의 형편을 판단할 수 없다."], "answer": 1, "why": "기술 혁신이 가격과 산업 수입을 낮추더라도 소비자는 이익을 얻을 수 있으므로, 수입이나 GDP의 변화만으로 사회의 형편을 판단할 수 없다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 3, 4, 5, 6, 7, 8, 9]}, {"type": "근거 확인", "q": "값이 1/4이고 구매자 수가 같다면 수입은?", "choices": ["원래 수입의 25%가 된다.", "원래 수입의 75%가 된다."], "answer": 0, "why": "가격 1/4 → 수입 75% 감소", "refs": [5, 6]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["Then some change comes along so that people cannot listen to the song while paying only a quarter of what they used to pay.", "Then some change comes along so that people can listen to the song while paying only a quarter of what they used to pay."], "answer": 1, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [5]}]}]}, {"id": "olym09", "label": "올림포스 영독 기본1 · 9강", "scope": "p60~63만 · 어휘 적절성", "passages": [{"id": "olym09-01", "unit": "olym09", "number": 1, "title": "p60 수능 대비 ANALYSIS", "sentences": [{"n": 1, "en": "If you were a high performer in your work before becoming a manager, you may find the journey into management particularly difficult.", "ko": "만약 여러분이 관리자가 되기 전에 여러분의 직무에서 높은 성과를 낸 사람이었다면, 관리직으로의 여정이 특히 어렵다고 느낄 수도 있다.", "role": "성공한 직원의 어려움 직원으로서의 높은 성과가 관리자로의 전환을 쉽게 해 주지는 않는다."}, {"n": 2, "en": "Because of their previous success, stars are understandably reluctant to give up the attitudes and practices they think produced their success thus far, and they're unwilling to change themselves.", "ko": "이전의 성공 때문에, 최고의 직원들은 자신이 생각하기에 지금까지 자신의 성공을 만들어 낸 태도와 관행을 포기하는 것을 당연히 꺼리고, 자신을 변화시키려 하지 않는다.", "role": "과거 성공에 대한 집착 성공을 가져왔다고 믿는 태도와 관행을 버리지 않으려는 것이 변화의 걸림돌이다."}, {"n": 3, "en": "They don't know how to develop or coach people because they never needed much coaching themselves, or so they believe.", "ko": "그들은 그들 자신이 지도를 많이 필요로 한 적이 결코 없었거나 그렇다고 믿기 때문에, 사람들을 어떻게 성장시키고 지도해야 하는지 모른다.", "role": "지도 경험의 한계 스스로 지도를 많이 필요로 하지 않았다는 경험이나 믿음 때문에 다른 사람을 지도할 줄 모른다."}, {"n": 4, "en": "They don't know how to deal with people who lack their motivation.", "ko": "그들은 동기가 부족한 사람들을 어떻게 다루어야 하는지 모른다.", "role": "동기 차이를 다루는 어려움 자신들처럼 동기가 높지 않은 사람을 관리하는 방법도 모른다."}, {"n": 5, "en": "Because they've never failed, they've had little practice reflecting on and learning from experience.", "ko": "그들은 실패한 적이 한 번도 없어서, 경험을 성찰하고 경험을 통해 배우는 연습을 한 적이 거의 없다.", "role": "실패에서 배우는 연습 부족 실패 경험이 없어서 자신의 경험을 돌아보고 배우는 연습도 부족하다."}, {"n": 6, "en": "No wonder many former stars turn into mediocre bosses.", "ko": "이전에는 최고의 직원이었던 많은 사람들이 그다지 훌륭하지 않은 상사가 되는 것은 놀랄 일이 아니다.", "role": "앞선 이유의 귀결 앞에서 제시한 한계 때문에 뛰어난 직원이 평범한 상사가 되는 일이 생긴다."}, {"n": 7, "en": "If you were a star, be aware that the very success that produced your promotion can now work against you.", "ko": "만약 여러분이 최고의 직원이었다면, 여러분의 승진을 가져온 바로 그 성공이 이제 여러분에게 불리하게 작용할 수 있다는 점을 인식하라.", "role": "성공의 역효과를 경계 승진을 가능하게 한 과거의 성공이 새 역할에서는 오히려 방해가 될 수 있다."}], "core": "직원으로서 성공을 가져온 경험과 태도가 관리자로의 전환에는 장애가 될 수 있다.", "flow": [{"label": "문제 제기", "sentences": "S1", "text": "높은 성과를 내던 직원이 관리자가 되면 특히 어려움을 겪을 수 있다.", "refs": [1]}, {"label": "변화의 거부", "sentences": "S2", "text": "과거 성공을 만든 태도와 관행을 버리지 않으려 한다.", "refs": [2]}, {"label": "관리 역량의 한계", "sentences": "S3–5", "text": "타인 지도와 동기 차이의 대처, 실패에서 배우는 연습이 부족하다.", "refs": [3, 5]}, {"label": "결론과 경계", "sentences": "S6–7", "text": "과거 성공이 새 역할에서 불리하게 작용할 수 있음을 알아야 한다.", "refs": [6, 7]}], "structure": [{"title": "과거의 성공", "text": "성공 경험을 만든 태도와 관행을 고수한다."}, {"title": "관리자로서의 어려움", "text": "변화를 거부하고 다른 사람을 지도하는 데 한계를 보인다."}], "key_sentence_en": "Past success as an employee can make the transition into management more difficult.", "diagram": {"kind": "compare", "title": "직원으로서의 성공 ≠ 관리자 역량", "items": [{"head": "과거의 성공 습관", "body": "성과를 낸 옛 습관을 버리기 어려움", "refs": [1, 2]}, {"head": "새 역할에 필요한 지도·학습", "body": "새 역할에는 코칭·다른 동기 이해·실패 학습이 필요", "refs": [3, 5, 6, 7]}], "takeaway": "직원으로서 성공을 가져온 경험과 태도가 관리자로의 전환에는 장애가 될 수 있다."}, "easy_story": "일을 잘하던 사람이 관리자가 되었다고 예전 습관이 모두 도움이 되지는 않아요. 이제는 혼자 성과를 내는 것보다 다른 사람을 이끌고 배우는 일이 중요해졌기 때문입니다. ‘잘하던 방식’이 새 역할에서는 오히려 걸림돌이 될 수 있다는 글이에요.", "blocking_vocab": [{"word": "promotion", "meaning": "승진"}, {"word": "motivation", "meaning": "동기"}, {"word": "reluctant", "meaning": "꺼리는"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["직원으로서 성공한 방식은 새로운 관리자 역할에서도 언제나 그대로 통한다.", "직원으로서 성공을 가져온 경험과 태도가 관리자로의 전환에는 장애가 될 수 있다."], "answer": 1, "why": "직원으로서 성공을 가져온 경험과 태도가 관리자로의 전환에는 장애가 될 수 있다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 2, 3, 5, 6, 7]}, {"type": "근거 확인", "q": "관리자로 옮겨 갈 때 필요한 것은?", "choices": ["새 역할에 맞는 지도와 학습이다.", "직원 시절 방식만 바꾸지 않고 반복하는 것이다."], "answer": 0, "why": "새 역할에는 코칭·다른 동기 이해·실패 학습이 필요", "refs": [3, 5, 6, 7]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["If you were a high performer in your work after becoming a manager, you may find the journey into management particularly difficult.", "If you were a high performer in your work before becoming a manager, you may find the journey into management particularly difficult."], "answer": 1, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [1]}]}, {"id": "olym09-02", "unit": "olym09", "number": 2, "title": "p62 no.01", "sentences": [{"n": 1, "en": "Action takes place by choosing which ends shall be satisfied by the employment of means.", "ko": "행동은 수단을 사용하여 어떤 목적을 충족시킬 것인가를 '선택함'으로써 일어난다.", "role": "행동과 선택 행동은 주어진 수단으로 어떤 목적을 충족할지 선택하는 과정이다."}, {"n": 2, "en": "Time is scarce for man only because whichever ends he chooses to satisfy, there are others that must remain unsatisfied.", "ko": "인간에게 시간이 '부족한' 이유는 어떤 목적을 충족시키기로 선택하든, 충족되지 않은 채로 남아야 하는 다른 것이 존재하기 마련이기 때문이다.", "role": "시간이 부족한 이유 어떤 목적을 선택하더라도 충족하지 못하는 다른 목적이 남기 때문에 시간은 희소하다."}, {"n": 3, "en": "When we must use a means so that some ends remain unsatisfied, the necessity for a choice among ends arises.", "ko": "우리가 어떤 목적이 충족되지 않은 채로 남아있도록 수단을 사용해야 할 때, '목적 중에서 하나를 선택'해야 할 필요성이 생긴다.", "role": "선택의 필요 수단이 모든 목적을 충족할 수 없을 때 목적 사이의 선택이 필요해진다."}, {"n": 4, "en": "For example, Jones is engaged in watching a baseball game on television.", "ko": "예를 들어, Jones는 텔레비전으로 야구 경기를 시청하고 있다.", "role": "시간 선택의 사례 야구 경기를 보고 있는 Jones의 사례로 시간 배분의 선택을 설명한다."}, {"n": 5, "en": "He is faced with the choice of spending the next hour in: (a) continuing to watch the baseball game, (b) playing bridge, or (c) going for a drive.", "ko": "그는 앞으로 한 시간을 쓰는 데, (a) 야구 경기를 계속 시청할지, (b) 브리지 게임을 할지, 아니면 (c) 드라이브를 하러 갈지를 선택해야 하는 상황에 직면한다.", "role": "세 가지 대안 Jones는 한 시간 동안 할 수 있는 세 활동 가운데 하나를 선택해야 한다."}, {"n": 6, "en": "He would like to do all three of these things, but his means (time) is insufficient.", "ko": "그는 이 세 가지를 모두 하고 싶지만, 그의 수단(시간)이 불충분하다.", "role": "욕구와 수단의 불균형 세 활동을 모두 하고 싶은 욕구에 비해 시간이 부족하다."}, {"n": 7, "en": "As a result, he must choose; one end can be satisfied, but the others must go unfulfilled.", "ko": "결과적으로, 그는 '선택해야' 하는데, 하나의 목적은 충족될 수 있지만, 나머지 목적은 충족되지 않은 채로 있어야 한다.", "role": "선택과 포기 한 목적을 선택하여 충족시키면 나머지 목적은 충족하지 못한다."}, {"n": 8, "en": "Suppose that he decides on course A.", "ko": "그가 경로 A로 결정한다고 가정해 보자.", "role": "하나의 대안 선택 Jones가 세 대안 중 A를 고른 상황을 가정한다."}, {"n": 9, "en": "This is a clear indication that he has ranked the satisfaction of end A higher than the satisfaction of ends B or C.", "ko": "이것은 그가 목적 A의 충족 순위를 목적 B 혹은 C의 충족보다 더 높게 '매겼'음을 분명히 보여 준다.", "role": "선택이 드러내는 우선순위 A를 선택한 행동은 A의 충족을 B나 C보다 더 중요하게 평가했음을 보여 준다."}], "core": "수단이 부족하면 목적 사이에서 선택해야 하며, 그 선택은 목적의 우선순위를 보여 준다.", "flow": [{"label": "선택의 원리", "sentences": "S1–3", "text": "수단으로 모든 목적을 충족할 수 없으므로 목적 사이의 선택이 필요하다.", "refs": [1, 3]}, {"label": "시간 배분 사례", "sentences": "S4–6", "text": "Jones는 야구 시청·브리지·드라이브를 모두 원하지만 시간이 부족하다.", "refs": [4, 6]}, {"label": "선택과 포기", "sentences": "S7–8", "text": "일부 목적은 포기해야 하며, Jones가 A를 선택한다고 가정한다.", "refs": [7, 8]}, {"label": "우선순위의 표시", "sentences": "S9", "text": "A의 선택은 A의 충족에 B나 C보다 높은 순위를 부여했음을 뜻한다.", "refs": [9]}], "structure": [{"title": "수단의 희소성", "text": "시간 등 수단은 모든 목적을 동시에 충족할 수 없다."}, {"title": "선택이 드러내는 순위", "text": "선택한 목적의 충족을 포기한 목적보다 높게 평가한다."}], "key_sentence_en": "Scarce means require a choice among ends, and the choice reveals their ranking.", "diagram": {"kind": "branches", "title": "시간이 부족할 때 드러나는 우선순위", "items": [{"head": "모든 목적을 채울 수 없음", "body": "시간이 모자라 원하는 일을 모두 할 수 없음", "refs": [1, 3, 4, 6]}, {"head": "A를 선택", "body": "다음 한 시간을 야구 보기로 선택", "refs": [7, 8, 9]}, {"head": "B·C를 포기", "body": "카드놀이와 드라이브는 포기함", "refs": [7, 8, 9]}], "takeaway": "수단이 부족하면 목적 사이에서 선택해야 하며, 그 선택은 목적의 우선순위를 보여 준다."}, "easy_story": "시간과 수단이 넉넉하면 여러 목표를 다 할 수 있겠죠. 하지만 부족할 때는 무엇을 먼저 할지 골라야 합니다. A를 고르고 B와 C를 놓는 선택은, 말로 하지 않아도 무엇을 더 중요하게 여기는지 보여 줍니다.", "blocking_vocab": [{"word": "insufficient", "meaning": "부족한"}, {"word": "satisfaction", "meaning": "만족"}, {"word": "unfulfilled", "meaning": "충족되지 않은"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["시간과 수단이 부족해도 모든 목적을 똑같이 달성할 수 있다.", "수단이 부족하면 목적 사이에서 선택해야 하며, 그 선택은 목적의 우선순위를 보여 준다."], "answer": 1, "why": "수단이 부족하면 목적 사이에서 선택해야 하며, 그 선택은 목적의 우선순위를 보여 준다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 3, 4, 6, 7, 8, 9]}, {"type": "근거 확인", "q": "목적 A를 고른다는 것은 무엇도 뜻하는가?", "choices": ["모든 목적을 동시에 완전히 이룬다.", "다른 목적 B·C를 포기한다."], "answer": 1, "why": "카드놀이와 드라이브는 포기함", "refs": [7, 8, 9]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["Time is not scarce for man only because whichever ends he chooses to satisfy, there are others that must remain unsatisfied.", "Time is scarce for man only because whichever ends he chooses to satisfy, there are others that must remain unsatisfied."], "answer": 1, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [2]}]}, {"id": "olym09-03", "unit": "olym09", "number": 3, "title": "p63 no.02", "sentences": [{"n": 1, "en": "Environmental stresses cause changes in the genetic makeup of a population by favoring certain gene variants more than others.", "ko": "환경 스트레스는 특정 유전자 변이형을 다른 것보다 더 선호함으로써 개체군의 유전자 구성에 변화를 일으킨다.", "role": "환경에 의한 선택 환경 스트레스가 특정 유전자 변이형에 유리하게 작용하면 개체군의 유전자 구성이 달라진다."}, {"n": 2, "en": "This is, in fact, the normal way that populations can adapt rapidly to changes in their environment without mutations being required to produce new adaptations.", "ko": "이는 사실 돌연변이가 새로운 적응 형태를 만들어 내야 할 필요 없이 개체군이 자신들의 환경 변화에 빠르게 적응할 수 있는 정상적인 방식이다.", "role": "기존 변이형을 통한 적응 개체군은 새로운 돌연변이를 기다리지 않고 기존 변이형에 대한 선택을 통해 환경에 적응할 수 있다."}, {"n": 3, "en": "It is also the reason why populations with genetic diversity are more likely to survive in the face of change.", "ko": "그것은 유전적 다양성을 가진 개체군이 변화에 직면했을 때 생존할 가능성이 더 높은 이유이기도 하다.", "role": "다양성의 이점 다양한 유전자 변이형이 있으면 환경 변화에 유리한 변이형이 선택되어 살아남을 가능성이 높다."}, {"n": 4, "en": "However, there is another side of this phenomenon related to human impacts on populations.", "ko": "그러나 개체군에 대한 인간의 영향과 관련된 이 현상의 또 다른 측면이 있다.", "role": "인간의 영향으로 전환 자연스러운 적응 과정이 인간의 영향 아래에서는 다른 문제를 낳을 수 있음을 제시한다."}, {"n": 5, "en": "Toxins added to the environment create selection pressure for individuals that are more tolerant of the toxins.", "ko": "환경에 더해지는 독소는 그 독소에 더 내성이 강한 개체를 선택하라는 압력을 만들어 낸다.", "role": "독소가 만드는 선택 압력 환경에 들어온 독소는 그 독소에 더 강한 개체가 선택되도록 작용한다."}, {"n": 6, "en": "One negative impact of this is that it can reduce the genetic diversity of a population.", "ko": "이것의 부정적인 영향 한 가지는 그것이 개체군의 유전적 다양성을 감소시킬 수 있다는 것이다.", "role": "다양성 감소의 문제 독소에 강한 개체가 선택되는 과정은 개체군의 유전적 다양성을 줄일 수 있다."}, {"n": 7, "en": "Another problem occurs if the organism is a pest and the toxin is contained in, for example, a pesticide.", "ko": "또 다른 문제는 생물체가 해충이고 독소가 예를 들어 살충제에 포함되어 있는 경우 발생한다.", "role": "살충제의 사례 선택 대상이 해충이고 독소가 살충제에 포함된 경우 또 다른 문제가 생긴다."}, {"n": 8, "en": "As a result of the selection pressure, the population seems to develop tolerance to the toxin.", "ko": "선택 압력의 결과로 그 개체군은 그 독소에 대한 내성을 갖게 되는 것처럼 보인다.", "role": "집단의 내성 증가 선택 압력이 작용한 결과 해충 개체군이 독소에 내성을 갖게 되는 것처럼 보인다."}, {"n": 9, "en": "The pesticide then becomes less effective.", "ko": "그러면 그 살충제는 효과가 떨어진다.", "role": "살충제 효과의 감소 해충 개체군의 내성으로 인해 살충제의 효과가 낮아진다."}], "core": "환경에 의한 선택은 적응을 돕지만, 독소에 대한 선택은 다양성을 줄이고 살충제 효과를 낮출 수 있다.", "flow": [{"label": "선택과 적응", "sentences": "S1–3", "text": "환경은 특정 변이형을 더 선호하며, 유전적 다양성은 변화 속 생존에 유리하다.", "refs": [1, 3]}, {"label": "인간 영향으로 전환", "sentences": "S4–5", "text": "환경에 더해진 독소가 내성이 강한 개체에 유리한 선택 압력을 만든다.", "refs": [4, 5]}, {"label": "다양성 감소", "sentences": "S6", "text": "이 선택은 개체군의 유전적 다양성을 줄일 수 있다.", "refs": [6]}, {"label": "살충제 효과 감소", "sentences": "S7–9", "text": "해충 개체군이 독소에 내성을 갖게 되는 것처럼 보이면 살충제의 효과가 낮아진다.", "refs": [7, 9]}], "structure": [{"title": "환경 선택의 기능", "text": "기존 유전자 변이형의 선택을 통해 환경에 적응한다."}, {"title": "인간 영향 아래의 문제", "text": "독소에 강한 개체의 선택이 다양성 감소와 살충제 효과 저하를 낳을 수 있다."}], "key_sentence_en": "Selection can help populations adapt, but toxin-driven selection can reduce diversity and pesticide effectiveness.", "diagram": {"kind": "branches", "title": "같은 선택 압력의 두 측면", "items": [{"head": "환경의 선택 압력", "body": "환경은 어떤 유전자 변이형에 다른 변이형보다 유리하게 작용한다.", "refs": [1]}, {"head": "변화에 적응", "body": "기존 유전적 다양성이 있으면 환경 변화 속에서 개체군이 적응하고 살아남기 쉽다.", "refs": [2, 3]}, {"head": "독소에 노출되면", "body": "내성 개체가 선택되면 다양성이 줄고, 해충에겐 살충제가 덜 듣는다.", "refs": [4, 5, 6, 7, 8, 9]}], "takeaway": "선택은 적응을 도울 수 있지만 독소 내성의 선택에는 부작용도 있다."}, "easy_story": "환경이 바뀌면 서로 다른 형질 중 새 환경에 맞는 것들이 살아남습니다. 다양성이 있으면 변화에 대응할 길이 생길 수 있죠. 그런데 독소나 살충제에 견디는 형질만 남도록 선택하면 다양성이 줄고 약의 효과도 낮아질 수 있어요. 같은 ‘선택’이라도 결과가 다릅니다.", "blocking_vocab": [{"word": "pesticide", "meaning": "살충제"}, {"word": "diversity", "meaning": "다양성"}, {"word": "mutations", "meaning": "돌연변이들"}], "checks": [{"type": "핵심", "q": "두 주장 중 글의 핵심과 일치하는 것은?", "choices": ["독소에 대한 선택은 언제나 생물의 다양성을 키우고 살충제 효과를 높인다.", "환경에 의한 선택은 적응을 돕지만, 독소에 대한 선택은 다양성을 줄이고 살충제 효과를 낮출 수 있다."], "answer": 1, "why": "환경에 의한 선택은 적응을 돕지만, 독소에 대한 선택은 다양성을 줄이고 살충제 효과를 낮출 수 있다. 원문 근거를 아래 S번호에서 다시 확인하세요.", "refs": [1, 3, 4, 5, 6, 7, 9]}, {"type": "근거 확인", "q": "독소에 대한 선택이 다양성에 줄 수 있는 영향은?", "choices": ["다양성을 반드시 늘린다.", "다양성을 줄일 수 있다."], "answer": 1, "why": "내성 개체 선택 → 다양성·살충제 효과 감소 가능", "refs": [5, 6, 7, 8, 9]}, {"type": "원문 변형 탐지", "q": "이 지문에 실제로 나오는 영어 문장은?", "choices": ["Environmental stresses cause changes in the genetic makeup of a population by favoring certain gene variants more than others.", "Environmental stresses cause changes in the genetic makeup of a population by favoring certain gene variants less than others."], "answer": 0, "why": "단어와 논리의 방향을 영어 원문과 직접 대조하세요.", "refs": [1]}]}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function storyPreview(t){return String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean)[0]||''}function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 진주여고1 부교재 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button><p class="translation">${esc(s.ko)}</p></div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`${p.easy_story?`<p class="context-hint"><b>읽기 단서</b> ${esc(storyPreview(p.easy_story))}</p>`:''}<div class="read-handoff"><button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div><div class="source-visual"><p class="source-visual-label">원문으로 확인한 한눈 지도</p>${renderDiagram(p.learning_map||p.diagram)}</div><details class="easy-story story-after-reading"><summary>막혔다면 · 이야기처럼 다시 읽기</summary>${storySteps(p.easy_story)}</details>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

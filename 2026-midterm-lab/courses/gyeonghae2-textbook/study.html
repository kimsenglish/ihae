을 알면 사회적 상호작용을 더 깊이 이해할 수 있다 → 게임 이론은 모두에게 좋은 결과를 가져오는 협력을 촉진할 수 있다.","blocking_vocab":[{"word":"interaction","meaning":"소통"},{"word":"prisoner's dilemma","meaning":"죄수의 딜레마"},{"word":"game theory","meaning":"게임 이론"},{"word":"self-interest","meaning":"사적 이익"},{"word":"outcome","meaning":"결과"}],"sentences":[{"n":1,"en":"Many real-world situations show that strategies based on self-interest can lead to bad outcomes for the individual as well as the group.","ko":"많은 실생활에서의 상황은 사적인 이익에 기반한 전략이 개인과 그룹 모두에게 좋지 않은 결과로 이어질 수 있다는 것을 보여준다.","grammar":[]},{"n":2,"en":"Consider, for instance, two competing soft drink companies.","ko":"예를 들어, 경쟁사인 두 청량음료 회사를 생각해 보아라.","grammar":[]},{"n":3,"en":"Company A wants to increase sales, so they strategically decide to lower the price of their drinks, as this will draw customers away from Company B.","ko":"A 회사는 매출이 증가하기를 원하기 때문에 전략적으로 음료의 가격을 낮추기로 하는데, 이는 B 회사의 고객을 끌어올 것이기 때문이다.","grammar":[]},{"n":4,"en":"In this situation, Company B will have to do the same in order to stay competitive.","ko":"이 상황에서, B 회사는 경쟁력을 유지하기 위해 같은 방식으로 해야 할 것이다.","grammar":[]},{"n":5,"en":"In the end, the lower prices will reduce profits for both.","ko":"결국에 낮춰진 가격은 두 회사의 이익을 모두 감소시킬 것이다.","grammar":[]},{"n":6,"en":"Despite being competitors, both companies would have been better off maintaining a stable price.","ko":"경쟁자임에도 불구하고 두 회사는 안정적인 가격을 유지하는 것이 더 나았을 것이다.","grammar":[]},{"n":7,"en":"Game theory studies situations like the prisoner's dilemma so that we can be better prepared to make decisions in the real world.","ko":"게임 이론은 우리가 실제 세상에서 결정을 내리는 데 준비가 더 잘 되어있을 수 있도록 죄수의 딜레마와 같은 상황을 연구한다.","grammar":[]},{"n":8,"en":"Moreover, by showing us how the choices we make are connected with those of others, it leads us to a deeper understanding of human social interaction.","ko":"또한 우리가 내리는 결정들이 다른 사람들이 내리는 결정과 어떻게 연결되어 있는지를 보여주어 우리가 인간의 사회적 상호작용에 대한 더 깊은 이해를 할 수 있도록 이끈다.","grammar":[{"label":"the choices we make are connected","explanation":"the choices we make are connected — choices 뒤 목적격 관계대명사 생략 · the choices that we make"}]},{"n":9,"en":"In this way, it can benefit society by promoting cooperative behavior that brings about optimal outcomes for everyone.","ko":"이렇게, 모두에게 최적의 결과를 가져오는 협력적 행동을 촉진함으로써 게임 이론은 사회를 이롭게 할 수 있다.","grammar":[{"label":"by promoting cooperative behavior that brings about","explanation":"by promoting cooperative behavior that brings about — 방법을 나타내는 전치사 by + 동명사 · behavior를 받는 주격 관계대명사 that"}]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3","text":"사익 중심의 전략은 집단과 개인 모두에게 손해가 될 수 있다 → 두 음료 회사의 가격 경쟁을 새로운 사례로 든다 → A 회사는 B 회사의 고객을 끌어와 매출을 늘리려고 가격을 내린다","refs":[1,2,3]},{"label":"전개","sentences":"S4 · S5 · S6","text":"B 회사도 경쟁력을 지키려고 가격을 내리게 된다 → 연쇄적인 가격 인하의 결과로 두 회사의 이익이 모두 감소한다 → 가격을 안정적으로 유지했다면 두 회사에 더 유리했을 것이라고 평가한다","refs":[4,5,6]},{"label":"도착","sentences":"S7 · S8 · S9","text":"게임 이론의 연구는 현실에서 더 준비된 결정을 하도록 돕는다 → 자신과 타인의 선택이 연결됨을 알면 사회적 상호작용을 더 깊이 이해할 수 있다 → 게임 이론은 모두에게 좋은 결과를 가져오는 협력을 촉진할 수 있다","refs":[7,8,9]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["본문2 · P.72 · From Competition to Cooperation: 사익 중심의 전략은 집단과 개인 모두에게 손해가 될 수 있다 → 게임 이론은 모두에게 좋은 결과를 가져오는 협력을 촉진할 수 있다","사익 중심의 전략은 집단과 개인 모두에게 손해가 될 수 있다 → 두 음료 회사의 가격 경쟁을 새로운 사례로 든다 → A 회사는 B 회사의 고객을 끌어와 매출을 늘리려고 가격을 내린다","게임 이론의 연구는 현실에서 더 준비된 결정을 하도록 돕는다 → 자신과 타인의 선택이 연결됨을 알면 사회적 상호작용을 더 깊이 이해할 수 있다 → 게임 이론은 모두에게 좋은 결과를 가져오는 협력을 촉진할 수 있다"],"answer":0,"why":"본문2 · P.72 · From Competition to Cooperation: 사익 중심의 전략은 집단과 개인 모두에게 손해가 될 수 있다 → 게임 이론은 모두에게 좋은 결과를 가져오는 협력을 촉진할 수 있다","refs":[1,9]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","게임 이론의 연구는 현실에서 더 준비된 결정을 하도록 돕는다 → 자신과 타인의 선택이 연결됨을 알면 사회적 상호작용을 더 깊이 이해할 수 있다 → 게임 이론은 모두에게 좋은 결과를 가져오는 협력을 촉진할 수 있다","사익 중심의 전략은 집단과 개인 모두에게 손해가 될 수 있다 → 두 음료 회사의 가격 경쟁을 새로운 사례로 든다 → A 회사는 B 회사의 고객을 끌어와 매출을 늘리려고 가격을 내린다"],"answer":1,"why":"게임 이론의 연구는 현실에서 더 준비된 결정을 하도록 돕는다 → 자신과 타인의 선택이 연결됨을 알면 사회적 상호작용을 더 깊이 이해할 수 있다 → 게임 이론은 모두에게 좋은 결과를 가져오는 협력을 촉진할 수 있다","refs":[7,8,9]},{"type":"문법","q":"S8의 'the choices we make are connected' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","the choices we make are connected — choices 뒤 목적격 관계대명사 생략 · the choices that we make"],"answer":2,"why":"the choices we make are connected — choices 뒤 목적격 관계대명사 생략 · the choices that we make","refs":[8]}],"key_sentence_en":"In this way, it can benefit society by promoting cooperative behavior that brings about optimal outcomes for everyone.","key_sentence_ko":"이렇게, 모두에게 최적의 결과를 가져오는 협력적 행동을 촉진함으로써 게임 이론은 사회를 이롭게 할 수 있다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 경해여고2 교과서 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button>${s.grammar?.length?` <button class="reveal grammar-open" data-toggle="grammar">문법 포인트</button>`:''}<p class="translation">${esc(s.ko)}</p>${s.grammar?.length?`<div class="grammar-panel">${s.grammar.map(g=>`<div class="grammar-item"><b>${esc(g.label)}</b><p>${esc(g.explanation)}</p>${g.transform_value?`<small>시험에서는 이렇게 바꿀 수 있어요.</small><p class="grammar-transform">${esc(g.transform_value)}</p>`:''}</div>`).join('')}</div>`:''}</div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${p.image&&p.diagram?`<div class="post-reading-map">${renderDiagram(p.diagram,false)}</div>`:''}${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.parentElement.querySelector('.translation');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='grammar'){const target=btn.parentElement.querySelector('.grammar-panel');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'문법 닫기':'문법 포인트'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

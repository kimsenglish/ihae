/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items,.diagram.diagram-argument .diagram-items,

.diagram.diagram-steps-response .diagram-items,.diagram.diagram-cause-response .diagram-items,

.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card,.diagram.diagram-argument .diagram-card,
.diagram.diagram-steps-possible .diagram-card,.diagram.diagram-case-advice .diagram-card,
.diagram.diagram-steps-response .diagram-card,.diagram.diagram-cause-response .diagram-card,

.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-possible .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-case-advice .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-response .diagram-items .diagram-card:not(:last-child):after,

/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{

.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}

.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));

  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}

/* Cooking: familiar side benefits are distinct from the source's energy-to-adaptation claim. */

.diagram.diagram-energy-route .diagram-card{position:relative;min-width:0;border-top:5px solid #237c5c;padding-top:35px;background:#fffdf8}
.diagram.diagram-energy-route .diagram-card:first-child{grid-column:1/-1;border:1px dashed #a9b8ad;background:#f8faf6;padding:10px 14px}
.diagram.diagram-energy-route .diagram-card:first-child:before{content:'먼저 떠오르는 장점';display:block;color:#65766b;font-size:11px;font-weight:800;margin-bottom:3px}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}
.diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'→';position:absolute;right:-19px;top:calc(50% - 16px);color:#176b52;font-size:26px;font-weight:900;z-index:1}
.diagram.diagram-energy-route .diagram-card:nth-child(2){background:#e5f4e9}.diagram.diagram-energy-route .diagram-card:nth-child(4){background:#fff2d9;border-top-color:#b78539}
/* Three alternative survival responses, not three consecutive steps. */
.diagram.diagram-reaction-options .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 10px}
.diagram.diagram-reaction-options .diagram-card:first-child{grid-column:1/-1;text-align:center;background:#dceee5;border:2px solid #82baa2;position:relative}
.diagram.diagram-reaction-options .diagram-card:first-child:after{content:'↙    ↓    ↘';position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:#176b52;font-weight:900;font-size:21px;white-space:pre}
.diagram.diagram-reaction-options .diagram-card:not(:first-child){text-align:center;border-top:5px solid #247b5b}
.diagram.diagram-reaction-options .diagram-card:not(:first-child) b{font-size:20px}
.diagram.diagram-reaction-options .diagram-card:not(:first-child):before{display:block;font-size:27px;line-height:1;margin-bottom:8px;color:#176b52}
.diagram.diagram-reaction-options .diagram-card:nth-child(2):before{content:'⏸'}.diagram.diagram-reaction-options .diagram-card:nth-child(3):before{content:'➜'}.diagram.diagram-reaction-options .diagram-card:nth-child(4):before{content:'↗'}

.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}

  margin-top:14px;padding:10px 12px;text-align:center;color:#14543f}
/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}

  color:#176b52;font-size:24px;line-height:1}

  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}

.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}

.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}

.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}

.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}

.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

<script id="course-data" type="application/json">{"course":{"id":"gyeonghae2-textbook","title":"경해여고2 영어독해와작문 교과서","grade":"고2"},"units":[{"id":"l1","label":"1과 · A Step to Spark Change","scope":"1과 본문 전체","passages":[{"id":"l1-01","title":"Ruth Bader Ginsburg 는 누구인가","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"긴즈버그는 뛰어난 학생이었지만 여성이라는 이유로 차별을 겪었다. 그래도 학업을 이어 가 컬럼비아 로스쿨을 수석으로 졸업했다.","diagram":{"kind":"steps","title":"지문 내용을 한눈에","items":[{"head":"동상의 주인공","body":"정의와 성평등을 위해 평생 힘쓴 긴즈버그","refs":[1,2,3,4,5]},{"head":"뛰어난 학생","body":"코넬대를 수석으로 졸업하고 하버드 로스쿨에 들어감","refs":[6,7,8,9]},{"head":"마주한 장벽","body":"여학생의 입학 자리를 문제 삼는 시선과 도서관 이용 제한을 겪음","refs":[10,11,12]},{"head":"이후의 성취","body":"마지막 해에 컬럼비아로 옮겨 다시 수석으로 졸업","refs":[13]}],"takeaway":"긴즈버그는 뛰어난 학생이었지만 여성이라는 이유로 차별을 겪었다. 그래도 학업을 이어 가 컬럼비아 로스쿨을 수석으로 졸업했다."},"easy_story":"소녀들이 사진을 찍는 동상의 주인공은 긴즈버그다. 그는 성적이 뛰어나 코넬대를 수석 졸업하고 하버드 로스쿨에 들어갔다. 그러나 여학생이 거의 없던 그곳에서 여성이란 이유로 차별을 겪었다. 마지막 해에는 컬럼비아 로스쿨로 옮겼고, 그곳도 수석으로 졸업했다.","blocking_vocab":[{"word":"barrier","meaning":"장벽"},{"word":"justice","meaning":"정의"},{"word":"gender equality","meaning":"성평등"},{"word":"discrimination","meaning":"차별"}],"sentences":[{"n":1,"en":"Two girls excitedly pose to take pictures in front of a statue of a woman.","ko":"<장벽을 허문 재판관> 두 명의 소녀가 한 여성의 동상 앞에서 사진을 찍기 위해 신나게 포즈를 취한다.","grammar":[]},{"n":2,"en":"Who is this woman?","ko":"이 여성은 누구일까?","grammar":[]},{"n":3,"en":"She is not a famous actress or a pop star.","ko":"그녀는 유명한 배우나 팝스타가 아니다.","grammar":[{"label":"a famous actress","explanation":"a famous actress · a pop star — 보어 병렬"}]},{"n":4,"en":"Her name is Ruth Bader Ginsburg.","ko":"그녀의 이름은 루스 베이더 긴즈버그이다.","grammar":[]},{"n":5,"en":"She is an American icon who inspired the world by devoting her life to justice and gender equality.","ko":"그녀는 정의와 성평등에 그녀의 삶을 헌신하여 전 세계에 영감을 준 미국의 아이콘이다.","grammar":[{"label":"justice and gender equality","explanation":"justice and gender equality — 명사 병렬","transform_label":"who inspired the world — 주격 관계대명사 → 접속사+대명사 — who를 and she로 바꿔 두 절로","transform_value":"… American icon, and she inspired the …"}]},{"n":6,"en":"Ginsburg was born in Brooklyn in 1933.","ko":"긴즈버그는 브루클린에서 1933년에 태어났다.","grammar":[{"label":"was born","explanation":"was born — 수동태 사용"}]},{"n":7,"en":"During her academic career, Ginsburg was an excellent student, despite having to overcome many barriers.","ko":"학창 시절 동안에 긴즈버그는 많은 장벽을 극복해야 함에도 불구하고 뛰어난 학생이었다.","grammar":[]},{"n":8,"en":"She always received good grades as a child, and she continued to excel in university.","ko":"그녀는 어릴 적에 항상 좋은 성적을 받았고, 대학에서도 계속해서 뛰어났다.","grammar":[]},{"n":9,"en":"In 1954, Ginsburg graduated from Cornell University at the top of her class, and she was later accepted into Harvard Law School.","ko":"1954년에 긴즈버그는 코넬 대학교를 수석으로 졸업했고, 이후에 하버드 로스쿨(법학대학원)에 입학했다.","grammar":[]},{"n":10,"en":"While attending Harvard, however, Ginsburg faced discrimination.","ko":"그러나 하버드에 재학하는 동안 긴즈버그는 차별에 직면했다.","grammar":[]},{"n":11,"en":"There were only nine women out of 500 students in the program, and many people thought the school should have given the women's spots to men.","ko":"프로그램에서 500명의 학생 중 여성은 겨우 9명에 불과했고, 많은 사람들은 그 여성의 자리도 남성에게 주었어야 했다고 생각했다.","grammar":[]},{"n":12,"en":"They were even restricted from using some sections of the library.","ko":"여성들은 심지어 도서관의 일부 구역을 이용하는 것에서도 제한되었다.","grammar":[]},{"n":13,"en":"Ginsburg transferred to Columbia Law School for her final year, and she graduated at the top of her class in 1959.","ko":"긴즈버그는 마지막 학년에 컬럼비아 로스쿨로 편입했고, 1959년에 수석으로 졸업했다.","grammar":[]}],"structure":[],"flow":[{"label":"인물 소개","text":"동상의 주인공 긴즈버그가 정의와 성평등을 위해 힘쓴 인물임을 밝힌다.","sentences":"S1 · S2 · S3 · S4 · S5","refs":[1,2,3,4,5]},{"label":"학업과 장벽","text":"성적은 뛰어났지만 하버드에서는 여학생이라는 이유로 차별을 겪었다.","sentences":"S6 · S7 · S8 · S9 · S10 · S11 · S12","refs":[6,7,8,9,10,11,12]},{"label":"이어진 성취","text":"마지막 해에 컬럼비아로 옮긴 뒤 수석으로 졸업했다.","sentences":"S13","refs":[13]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["긴즈버그는 뛰어난 학생이었지만 여성이라는 이유로 차별을 겪었다. 그래도 학업을 이어 가 컬럼비아 로스쿨을 수석으로 졸업했다.","동상 앞에서 사진 찍는 소녀들을 보여 준다 → 동상 속 인물이 누구인지 묻는다 → 배우도 팝스타도 아니라고 선을 긋는다 → 그가 Ruth Bader Ginsburg임을 알린다","하버드에서 차별을 겪었다고 방향을 튼다 → 500명 중 여성 아홉, 자리 시비를 든다 → 도서관 이용까지 막혔다고 보탠다 → 컬럼비아 편입과 수석 졸업으로 닫는다"],"answer":0,"why":"긴즈버그는 뛰어난 학생이었지만 여성이라는 이유로 차별을 겪었다. 그래도 학업을 이어 가 컬럼비아 로스쿨을 수석으로 졸업했다.","refs":[1,13]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","마지막 해에 컬럼비아로 옮긴 뒤 수석으로 졸업했다.","동상 앞에서 사진 찍는 소녀들을 보여 준다 → 동상 속 인물이 누구인지 묻는다 → 배우도 팝스타도 아니라고 선을 긋는다 → 그가 Ruth Bader Ginsburg임을 알린다"],"answer":1,"why":"마지막 해에 컬럼비아로 옮긴 뒤 수석으로 졸업했다.","refs":[10,11,12,13]},{"type":"문법","q":"S3의 'a famous actress' 설명으로 알맞은 것은?","choices":["a famous actress · a pop star — 보어 병렬","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"a famous actress · a pop star — 보어 병렬","refs":[3]}],"key_sentence_en":"Ginsburg transferred to Columbia Law School for her final year, and she graduated at the top of her class in 1959.","key_sentence_ko":"긴즈버그는 마지막 학년에 컬럼비아 로스쿨로 편입했고, 1959년에 수석으로 졸업했다.","image":"../../assets/gyeonghae2-textbook-rbg-six-panel.webp","image_alt":"긴즈버그 동상 앞의 소녀들, 학업에 힘쓰는 긴즈버그, 수석 졸업과 로스쿨 진학, 남학생이 대부분인 강의실, 도서관 이용 제한, 컬럼비아 로스쿨 수석 졸업을 차례로 보여 주는 여섯 장면","image_caption":"S1–S13 · 동상의 인물 → 뛰어난 학생 → 하버드의 차별 → 컬럼비아 수석 졸업"},{"id":"l1-02","title":"뛰어난 성적에도 막힌 취업","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"긴즈버그는 뛰어난 학력에도 차별 때문에 변호사 일자리를 구하기 어려웠다. 교수를 거쳐 법관이 된 뒤에도 성평등을 위해 일했다.","diagram":{"kind":"steps","title":"지문 내용을 한눈에","items":[{"head":"취업 장벽","body":"여성·유대인·어머니라는 이유로 변호사 일을 구하기 어려움","refs":[1,2,3]},{"head":"불평등한 제안","body":"로펌은 남성 변호사보다 낮은 급여를 제시해 받아들이지 않음","refs":[4,5]},{"head":"새로운 길","body":"법학 교수가 되고 성차별 사건을 대법원에서 변론","refs":[6,7,8]},{"head":"법관으로","body":"판사가 된 뒤 여성으로는 두 번째 미국 대법관이 됨","refs":[9,10,11]}],"takeaway":"긴즈버그는 뛰어난 학력에도 차별 때문에 변호사 일자리를 구하기 어려웠다. 교수를 거쳐 법관이 된 뒤에도 성평등을 위해 일했다."},"easy_story":"좋은 성적만으로는 당시의 취업 차별을 넘기 어려웠다. 긴즈버그는 로펌에서 남성 변호사보다 적은 급여를 제안받자 그 일을 택하지 않았다. 대신 법을 더 공부해 교수가 되었고, 성차별 사건을 변론했다. 뒤에는 판사와 대법관이 되어 성평등을 위한 일을 계속했다.","blocking_vocab":[{"word":"record","meaning":"녹음하다"},{"word":"gender equality","meaning":"성평등"},{"word":"discrimination","meaning":"차별"}],"sentences":[{"n":1,"en":"Even with her impressive academic record, Ginsburg still had a hard time finding a job as a lawyer.","ko":"그녀의 뛰어난 학력에도 불구하고, 긴즈버그는 여전히 변호사로서 일자리를 구하는 데 어려움을 겪었다.","grammar":[]},{"n":2,"en":"She was not only a woman but also Jewish and a mother.","ko":"그녀는 여성이었을 뿐만 아니라 유대인이었고, 아이의 어머니였다.","grammar":[{"label":"not only a woman but also","explanation":"not only a woman but also — 상관접속사","transform_label":"not only A but also B → B as well as A — A뿐만 아니라 B도","transform_value":"She was Jewish and a mother as well as a woman."},{"label":"Jewish and a mother","explanation":"Jewish and a mother — 보어 병렬"}]},{"n":3,"en":"The first position she found was as a law clerk for a U.S. district judge.","ko":"그녀가 찾은 첫 번째 직장은 미국 지방 법원 판사의 법률 서기였다.","grammar":[{"label":"position she","explanation":"position she — 목적격 관계대명사 생략 · position that she","transform_label":"The first position she found — 목적격 관계대명사 생략 → that 복원 — 목적격 관계대명사 that을 넣는다","transform_value":"… first position that she found …"}]},{"n":4,"en":"After two years in this position, she finally started to get offers from law firms.","ko":"이곳에서 2년을 근무한 후, 그녀는 마침내 로펌으로부터 제안을 받기 시작했다.","grammar":[]},{"n":5,"en":"However, these offers always came with a salary lower than those of the firm's male lawyers, so she didn't accept any of them.","ko":"그러나, 그 제안에는 항상 그 회사의 남성 변호사들보다 낮은 급여가 포함되어 있었기 때문에 그녀는 그 제안 중 어떤 것도 받아들이지 않았다.","grammar":[]},{"n":6,"en":"Instead, she decided to study other areas of law and eventually became a law professor.","ko":"대신에, 그녀는 법의 다른 분야를 공부하기로 했고, 마침내 법학 교수가 되었다.","grammar":[{"label":"decided","explanation":"decided · became — 동사 병렬"}]},{"n":7,"en":"She taught at Columbia University, and, in 1972, she became the first woman to be offered a permanent professorship there.","ko":"그녀는 컬럼비아 대학교에서 강의했고, 1972년에는 그곳에서 종신 교수직을 제안받은 최초의 여성이 되었다.","grammar":[]},{"n":8,"en":"While at Columbia, Ginsburg also worked hard as general counsel for the American Civil Liberties Union (ACLU) and argued many gender discrimination cases in the U.S. Supreme Court.","ko":"컬럼비아 대학에서 근무하는 동안, 긴즈버그는 미국 시민 자유 연맹(ACLU)의 법률 고문으로도 열심히 일했으며, 미국 대법원에서 수많은 성차별 사건을 변론했다.","grammar":[]},{"n":9,"en":"In 1980, Ginsburg left Columbia University to become a judge.","ko":"1980년, 긴즈버그는 판사가 되기 위해 컬럼비아 대학교를 떠났다.","grammar":[]},{"n":10,"en":"Thirteen years later, she was appointed to the U.S. Supreme Court and became only the second woman to hold the position.","ko":"13년 후, 그녀는 미국 대법관으로 임명되었고 여성으로는 두 번째로 대법관직을 맡게 되었다.","grammar":[]},{"n":11,"en":"During her time as a judge, Ginsburg never stopped fighting for women's rights and gender equality.","ko":"판사로 재직하는 동안, 긴즈버그는 여성의 권리와 성평등을 위한 싸움을 멈추지 않았다.","grammar":[]}],"structure":[],"flow":[{"label":"성적과 현실의 차이","text":"뛰어난 학력에도 차별 때문에 취업이 어려웠고, 로펌은 남성보다 낮은 급여를 제시했다.","sentences":"S1 · S2 · S3 · S4 · S5","refs":[1,2,3,4,5]},{"label":"길을 바꿈","text":"법학 교수가 되어 성차별 사건을 변론하며 평등을 위한 일을 이어 갔다.","sentences":"S6 · S7 · S8","refs":[6,7,8]},{"label":"법관이 된 뒤","text":"판사를 거쳐 미국 대법관이 된 뒤에도 여성의 권리와 성평등을 위해 싸웠다.","sentences":"S9 · S10 · S11","refs":[9,10,11]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["시민 자유 연맹에서 성차별 사건을 변론한다 → 판사가 되려고 대학을 떠난다 → 13년 뒤 두 번째 여성 대법관이 된다 → 재직 내내 싸움을 멈추지 않았다고 요약한다","긴즈버그는 뛰어난 학력에도 차별 때문에 변호사 일자리를 구하기 어려웠다. 교수를 거쳐 법관이 된 뒤에도 성평등을 위해 일했다.","좋은 학력에도 취업이 막혔음을 짚는다 → 여성·유대인·어머니라는 조건을 든다 → 지방 법원 서기가 첫 자리였다고 밝힌다 → 2년 뒤 로펌의 제안이 오기 시작한다"],"answer":1,"why":"긴즈버그는 뛰어난 학력에도 차별 때문에 변호사 일자리를 구하기 어려웠다. 교수를 거쳐 법관이 된 뒤에도 성평등을 위해 일했다.","refs":[1,11]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","판사를 거쳐 미국 대법관이 된 뒤에도 여성의 권리와 성평등을 위해 싸웠다.","좋은 학력에도 취업이 막혔음을 짚는다 → 여성·유대인·어머니라는 조건을 든다 → 지방 법원 서기가 첫 자리였다고 밝힌다 → 2년 뒤 로펌의 제안이 오기 시작한다"],"answer":1,"why":"판사를 거쳐 미국 대법관이 된 뒤에도 여성의 권리와 성평등을 위해 싸웠다.","refs":[8,9,10,11]},{"type":"문법","q":"S2의 'not only a woman but also' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","not only a woman but also — 상관접속사"],"answer":2,"why":"She was Jewish and a mother as well as a woman.","refs":[2]}],"key_sentence_en":"During her time as a judge, Ginsburg never stopped fighting for women's rights and gender equality.","key_sentence_ko":"판사로 재직하는 동안, 긴즈버그는 여성의 권리와 성평등을 위한 싸움을 멈추지 않았다."},{"id":"l1-03","title":"성별을 가르지 않는 법","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"긴즈버그가 도운 성평등의 변화는 여성만을 위한 것이 아니었다. 남성의 간병 세금 혜택과 여성의 독립적인 대출 권리도 포함된다.","diagram":{"kind":"compare","title":"성평등이 바꾼 서로 다른 두 권리","items":[{"head":"사례 1 · 남성의 간병","body":"미혼 남성 모리츠는 어머니를 돌볼 간병인을 고용해도 세금 혜택을 못 받았다. 사건 뒤 성별과 관계없이 받을 수 있도록 법이 바뀌었다.","refs":[2,3,4,5,6,7,8]},{"head":"사례 2 · 여성의 대출","body":"과거에는 기혼 여성이 돈을 잘 벌어도 대출에 남편 서명이 필요했다. 신용 기회 균등법은 은행의 차별을 막는다.","refs":[9,10,11]}],"takeaway":"긴즈버그가 도운 성평등의 변화는 여성만을 위한 것이 아니었다. 남성의 간병 세금 혜택과 여성의 독립적인 대출 권리도 포함된다."},"easy_story":"글은 긴즈버그가 도운 법의 변화를 세 가지 예로 설명한다. 이 부분에는 앞의 두 가지가 나온다. 첫째, 아픈 어머니를 돌보던 미혼 남성 모리츠는 당시 법 때문에 간병인 고용 세금 혜택을 받지 못했다. 사건 뒤에는 성별에 관계없이 혜택을 받을 수 있게 바뀌었다. 둘째, 기혼 여성은 소득이 높아도 대출에 남편 서명이 필요했는데, 은행이 성별 등에 따라 차별하지 못하게 하는 법이 통과되었다.","blocking_vocab":[{"word":"legislation","meaning":"법안, 법률"},{"word":"gender equality","meaning":"성평등"},{"word":"entitle","meaning":"자격을 부여하다"}],"sentences":[{"n":1,"en":"Here are three examples of legislation that Ginsburg helped to pass.","ko":"다음은 긴즈버그가 통과시키는 데 도움을 준 법안의 세 가지 예시이다.","grammar":[{"label":"Here are three examples","explanation":"Here are three examples — 도치 · 수 일치"},{"label":"that Ginsburg helped to pass","explanation":"that Ginsburg helped to pass — 목적격 관계대명사"}]},{"n":2,"en":"1. Men are entitled to the same caregiving and Social Security rights as women.","ko":"1. 남성은 여성과 동일한 간병 및 사회 보장의 권리를 누릴 자격이 있다.","grammar":[]},{"n":3,"en":"Ginsburg always argued that gender equality policies should benefit both men and women.","ko":"긴즈버그는 성평등 정책은 남성과 여성 모두에게 혜택을 주어야 한다고 항상 주장했다.","grammar":[]},{"n":4,"en":"In 1972, Ginsburg represented Charles Moritz, who was a journalist in his early sixties.","ko":"1972년에, 긴즈버그는 찰스 모리츠를 변호했는데 그는 60대 초반의 기자였다.","grammar":[]},{"n":5,"en":"Moritz needed help taking care of his sick mother.","ko":"모리츠는 그의 아픈 어머니를 돌보는 데 도움이 필요했다.","grammar":[]},{"n":6,"en":"However, he could not receive tax benefits for hiring a caregiver, because they were only available to women, divorced men, and men whose wives were disabled or had passed away.","ko":"그러나 간병인을 고용하는 것에 대한 세금 혜택은 여성 및 이혼한 남성, 아내가 장애가 있거나 사망한 남성에게만 주어졌기 때문에 그는 그 혜택을 받을 수 없었다.","grammar":[{"label":"whose wives","explanation":"whose wives — 소유격 관계대명사 (✗ whose the wives)"},{"label":"were disabled or had passed away","explanation":"were disabled or had passed away — whose wives의 병렬 서술 · 상태와 선행 완료"}]},{"n":7,"en":"As an unmarried man, Moritz did not qualify to have his taxes reduced.","ko":"미혼 남성으로서, 모리츠는 세금을 감면받을 수 있는 자격을 갖추지 못했다.","grammar":[]},{"n":8,"en":"Nevertheless, after this case, the federal law was changed to allow people of any gender to have their taxes reduced so that they can hire caregivers.","ko":"그럼에도 불구하고, 이 사건 이후 어떤 성별의 사람이라도 간병인을 고용할 수 있게 세금을 감면해 주도록 연방법이 바뀌었다.","grammar":[{"label":"was changed to allow","explanation":"was changed to allow — 수동태＋to부정사 · 「허용하도록 바뀌었다」","transform_label":"so that S can V → in order to V — …할 수 있도록","transform_value":"… taxes reduced in order to hire caregivers."},{"label":"so that they can hire","explanation":"so that they can hire — 목적"}]},{"n":9,"en":"2. Women have the right to financial independence and equal benefits.","ko":"2. 여성은 재정적 독립과 동등한 혜택을 누릴 권리가 있다.","grammar":[]},{"n":10,"en":"In 1974, Ginsburg's work also helped pass the Equal Credit Opportunity Act, which prevents banks from discriminating against people based on their age, race, gender, national origin, or marriage status.","ko":"1974년, 긴즈버그의 노력은 신용 기회 균등법이 통과되는 데도 기여했는데 이 법은 은행이 나이, 인종, 성별, 출신 국가, 결혼 여부에 따라 사람들을 차별하는 것을 막는다.","grammar":[]},{"n":11,"en":"Prior to this act, married women needed their husband to sign for a loan, even if they had a job and a higher income.","ko":"이 법안 이전에는 결혼한 여성들이 직업이 있고 더 높은 소득이 있더라도 대출을 받기 위해서는 남편의 서명이 필요했다.","grammar":[]}],"structure":[],"flow":[{"label":"첫 사례의 문제","text":"간병인을 고용한 미혼 남성 모리츠가 당시의 성별 기준 때문에 세금 혜택을 받지 못했다.","sentences":"S1 · S2 · S3 · S4 · S5 · S6 · S7","refs":[1,2,3,4,5,6,7]},{"label":"첫 사례의 변화","text":"이 사건 뒤에는 간병인 고용을 위한 세금 감면을 성별과 관계없이 받을 수 있게 되었다.","sentences":"S8","refs":[8]},{"label":"둘째 사례","text":"여성의 대출에 남편 서명이 필요했던 상황에서, 은행의 차별을 막는 법이 통과되었다.","sentences":"S9 · S10 · S11","refs":[9,10,11]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["법률 세 가지 사례를 들겠다고 알린다 → 첫째 법의 요지를 한 줄로 내건다 → 성평등 정책은 남녀 모두에 이로워야 한다고 편다 → 1972년 변호한 Moritz를 등장시킨다","그 뒤 성별을 가리지 않게 법이 바뀌었다고 맺는다 → 둘째 법의 요지를 한 줄로 내건다 → 신용 기회 균등법 통과에 이바지했음을 든다 → 법 이전엔 남편 서명이 필요했다고 대비한다","긴즈버그가 도운 성평등의 변화는 여성만을 위한 것이 아니었다. 남성의 간병 세금 혜택과 여성의 독립적인 대출 권리도 포함된다."],"answer":2,"why":"긴즈버그가 도운 성평등의 변화는 여성만을 위한 것이 아니었다. 남성의 간병 세금 혜택과 여성의 독립적인 대출 권리도 포함된다.","refs":[1,11]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["법률 세 가지 사례를 들겠다고 알린다 → 첫째 법의 요지를 한 줄로 내건다 → 성평등 정책은 남녀 모두에 이로워야 한다고 편다 → 1972년 변호한 Moritz를 등장시킨다","앞의 사건과 관계없는 새 주제","여성의 대출에 남편 서명이 필요했던 상황에서, 은행의 차별을 막는 법이 통과되었다."],"answer":2,"why":"여성의 대출에 남편 서명이 필요했던 상황에서, 은행의 차별을 막는 법이 통과되었다.","refs":[8,9,10,11]},{"type":"문법","q":"S1의 'Here are three examples' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","Here are three examples — 도치 · 수 일치"],"answer":2,"why":"Here are three examples — 도치 · 수 일치","refs":[1]}],"key_sentence_en":"Prior to this act, married women needed their husband to sign for a loan, even if they had a job and a higher income.","key_sentence_ko":"이 법안 이전에는 결혼한 여성들이 직업이 있고 더 높은 소득이 있더라도 대출을 받기 위해서는 남편의 서명이 필요했다."},{"id":"l1-04","title":"평생에 걸친 싸움","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"남성만 받던 주립 학교의 입학 정책에 맞서, 긴즈버그는 여성에게도 같은 교육 기회가 있어야 한다고 주장했다.","diagram":{"kind":"steps","title":"지문 내용을 한눈에","items":[{"head":"기존 정책","body":"버지니아 군사학교는 남성만 입학시킴","refs":[1,2,3]},{"head":"긴즈버그의 주장","body":"여성도 남성과 같은 교육 과정에 참여할 수 있어야 함","refs":[4]},{"head":"판결의 의미","body":"공공 기관에서 여성의 평등한 교육 권리를 보장하는 데 기여","refs":[5]},{"head":"글의 마무리","body":"다른 사람도 함께하게 하는 방식으로 소중한 것을 위해 싸우라는 말","refs":[6,7,8]}],"takeaway":"남성만 받던 주립 학교의 입학 정책에 맞서, 긴즈버그는 여성에게도 같은 교육 기회가 있어야 한다고 주장했다."},"easy_story":"세 번째 사례는 학교 입학이다. 남성만 받던 버지니아 군사학교의 정책은 평등한 보호 원칙에 어긋난다고 대법원이 판단했다. 긴즈버그는 여성도 남성과 같은 교육 과정에 들어갈 수 있어야 한다고 주장했다. 글은 평등을 위한 그의 활동을 돌아보고, 다른 사람도 함께하도록 이끌며 싸우라는 그의 말로 끝난다.","blocking_vocab":[{"word":"justice","meaning":"정의"},{"word":"state-funded","meaning":"국가의 지원을 받는"},{"word":"equal protection","meaning":"동등한 보호"},{"word":"public institution","meaning":"공공 기관"},{"word":"follow in her footsteps","meaning":"그녀의 뒤를 따르다"}],"sentences":[{"n":1,"en":"3. State-funded schools must admit women.","ko":"3. 주립 학교는 여성의 입학을 받아들여야 한다.","grammar":[]},{"n":2,"en":"In 1996, Ginsburg was also responsible for the Supreme Court's historic decision in United States v. Virginia.","ko":"1996년, 긴즈버그는 '미국 대 버지니아' 사건에서 대법원의 역사적인 판결을 담당하기도 했다.","grammar":[]},{"n":3,"en":"The decision stated that Virginia Military Institute's male-only admissions policy went against the principle of equal protection.","ko":"그 판결은 버지니아 군사학교의 남성만 입학시키는 정책은 평등한 보호의 원칙에 위배된다고 명시했다.","grammar":[]},{"n":4,"en":"Ginsburg argued that women should be allowed to join the same program as men.","ko":"긴즈버그는 여성이 남성과 같은 프로그램에 참여할 수 있어야 한다고 주장했다.","grammar":[]},{"n":5,"en":"This decision helped ensure that women have equal rights to education at public institutions in the United States.","ko":"이 판결은 여성들이 미국의 공공 기관에서 교육에 대한 평등한 권리를 보장받는 데 도움을 주었다.","grammar":[]},{"n":6,"en":"Throughout her life, Ruth Bader Ginsburg fought for the things she cared about and inspired others to follow in her footsteps.","ko":"그녀의 일생 동안, 긴즈버그는 그녀가 중요하게 생각하는 것들을 위해서 싸웠고 타인이 그녀의 발자취를 따르도록 영감을 주었다.","grammar":[]},{"n":7,"en":"Even though she passed away on September 18, 2020, she will always be remembered as a champion of equality and a tireless defender of justice.","ko":"2020년 9월 18일에 세상을 떠났다 하더라도, 그녀는 항상 평등의 옹호자이자 지칠 줄 모르는 정의의 수호자로 기억될 것이다.","grammar":[{"label":"will always be remembered as","explanation":"will always be remembered as — 수동태"},{"label":"a champion","explanation":"a champion · a tireless defender — 명사 병렬"}]},{"n":8,"en":"\"Fight for the things that you care about, but do it in a way that will lead others to join you.\" - Ruth Bader Ginsburg -","ko":"\"자신이 소중히 여기는 것을 위해 싸우되, 다른 사람들이 당신에게 동조하도록 이끌 수 있는 방식으로 해라.\" - 루스 베이더 긴즈버그 -","grammar":[{"label":"that you care about","explanation":"that you care about — 목적격 관계대명사"},{"label":"that will lead","explanation":"that will lead — 주격 관계대명사"}]}],"structure":[],"flow":[{"label":"세 번째 장벽","text":"남성만 입학시키던 주립 학교의 정책이 평등한 보호 원칙에 어긋난다고 판단되었다.","sentences":"S1 · S2 · S3","refs":[1,2,3]},{"label":"주장과 결과","text":"여성도 같은 과정에 참여해야 한다는 주장이 공공 교육의 평등한 권리를 지키는 데 기여했다.","sentences":"S4 · S5","refs":[4,5]},{"label":"남긴 말","text":"평생 평등을 위해 힘쓴 긴즈버그의 말로 글을 마무리한다.","sentences":"S6 · S7 · S8","refs":[6,7,8]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["셋째 법의 요지를 한 줄로 내건다 → 1996년 대법원 판결에서 맡은 몫을 든다 → 남성 전용 입학이 평등에 어긋난다고 밝힌다","소중히 여긴 가치를 위해 싸웠다고 묶는다 → 떠난 뒤에도 기억될 이름임을 밝힌다 → 본인의 말을 그대로 실어 글을 닫는다","남성만 받던 주립 학교의 입학 정책에 맞서, 긴즈버그는 여성에게도 같은 교육 기회가 있어야 한다고 주장했다."],"answer":2,"why":"남성만 받던 주립 학교의 입학 정책에 맞서, 긴즈버그는 여성에게도 같은 교육 기회가 있어야 한다고 주장했다.","refs":[1,8]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","평생 평등을 위해 힘쓴 긴즈버그의 말로 글을 마무리한다.","셋째 법의 요지를 한 줄로 내건다 → 1996년 대법원 판결에서 맡은 몫을 든다 → 남성 전용 입학이 평등에 어긋난다고 밝힌다"],"answer":1,"why":"평생 평등을 위해 힘쓴 긴즈버그의 말로 글을 마무리한다.","refs":[6,7,8]},{"type":"문법","q":"S7의 'will always be remembered as' 설명으로 알맞은 것은?","choices":["will always be remembered as — 수동태","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"will always be remembered as — 수동태","refs":[7]}],"key_sentence_en":"\"Fight for the things that you care about, but do it in a way that will lead others to join you.\" - Ruth Bader Ginsburg -","key_sentence_ko":"\"자신이 소중히 여기는 것을 위해 싸우되, 다른 사람들이 당신에게 동조하도록 이끌 수 있는 방식으로 해라.\" - 루스 베이더 긴즈버그 -"},{"id":"l1-05","title":"생각·감정·행동의 인지 삼각형","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"생각·감정·행동은 서로 영향을 준다. 부정적인 순환이 생길 수 있지만, 어느 한 부분을 긍정적으로 바꾸면 다른 부분도 달라질 수 있다.","diagram":{"kind":"cycle","title":"인지 삼각형: 생각·감정·행동의 순환","items":[{"head":"생각","body":"두 번 떨어진 마르코는 '연기 재능이 없어'라고 생각함","refs":[1,2,3]},{"head":"감정","body":"그 생각 때문에 실망하고 낙담함","refs":[4]},{"head":"행동","body":"오디션을 그만두고, 다시 자신을 형편없는 배우로 생각함","refs":[5,6]}],"takeaway":"생각·감정·행동은 서로 영향을 준다. 부정적인 순환이 생길 수 있지만, 어느 한 부분을 긍정적으로 바꾸면 다른 부분도 달라질 수 있다."},"easy_story":"마르코는 오디션에 두 번 떨어지자 재능이 없다고 생각했다. 이 생각은 낙담으로 이어졌고, 그는 오디션을 그만두었다. 그러자 스스로를 더 나쁜 배우로 여기게 되었다. 이렇게 생각·감정·행동이 서로 영향을 주는 것이 '인지 삼각형'이다. 한 부분의 부정적인 변화가 다른 부분에 영향을 줄 수도 있지만, 반대로 한 부분을 긍정적으로 바꾸면 순환 전체가 달라질 수도 있다.","blocking_vocab":[{"word":"cognitive triangle","meaning":"인지 삼각형"},{"word":"reject","meaning":"거절하다, 탈락시키다"},{"word":"discouraged","meaning":"낙담한"},{"word":"altogether","meaning":"완전히"},{"word":"reverse","meaning":"반대의 경우"}],"sentences":[{"n":1,"en":"Marco is a high school student who loves acting.","ko":"<생각하고, 느끼고, 행동하라: 더 나은 나를 위한 비결> 마르코는 연기를 사랑하는 고등학교 학생이다.","grammar":[{"label":"who loves acting","explanation":"who loves acting — 주격 관계대명사","transform_label":"loves acting — 동명사 목적어 → to부정사 목적어 — acting을 to act로 · love 는 둘 다 쓸 수 있다","transform_value":"… who loves to act."}]},{"n":2,"en":"Unluckily, he was rejected the last two times he auditioned for a local community play.","ko":"안타깝게도, 그는 참가한 지역 연극 오디션에서 두 번이나 떨어졌다.","grammar":[{"label":"times he auditioned","explanation":"times he auditioned — 관계부사 · 관계표현 생략 · times that he auditioned","transform_label":"two times he auditioned — 관계부사 생략 → when 복원 — 선행사 times 뒤에 when을 넣는다","transform_value":"… two times when he auditioned …"}]},{"n":3,"en":"That made him think that he didn't have enough talent to act.","ko":"그것은 그가 연기에 충분한 재능을 가지고 있지 않다는 생각이 들게 했다.","grammar":[]},{"n":4,"en":"These thoughts made him feel disappointed and discouraged.","ko":"이 생각들은 그가 실망스럽고 좌절하는 감정을 느끼게 했다.","grammar":[]},{"n":5,"en":"Therefore, he started to behave like he had lost all hope, and he stopped auditioning altogether.","ko":"그래서 그는 모든 희망을 잃은 것처럼 행동하기 시작했고, 오디션에 참가하는 것을 완전히 멈췄다.","grammar":[{"label":"had lost","explanation":"had lost — 과거완료 · 기준이 되는 과거보다 앞선 일","transform_label":"started to behave — to부정사 목적어 → 동명사 목적어 — to behave를 behaving으로 · start 는 둘 다 쓸 수 있다","transform_value":"… he started behaving like he …"}]},{"n":6,"en":"That led him to tell himself that he was a bad actor.","ko":"그것은 그가 자신을 형편없는 배우라고 여기게 했다.","grammar":[]},{"n":7,"en":"This cycle of thoughts, feelings, and behavior is known as the cognitive triangle.","ko":"이 생각, 감정, 행동의 순환은 인지 삼각형으로 알려져 있다.","grammar":[]},{"n":8,"en":"If one point of the triangle is negative, it can affect the other points.","ko":"만약 그 삼각형의 한 꼭짓점이 부정적이면, 그것은 다른 꼭짓점에도 영향을 줄 수 있다.","grammar":[]},{"n":9,"en":"However, the reverse is also true.","ko":"그러나 그 반대도 마찬가지이다.","grammar":[]},{"n":10,"en":"If you change one point in a positive way, it can change the others as well.","ko":"만약 당신이 한 꼭짓점을 긍정적으로 바꾸면, 그것은 다른 꼭짓점들도 또한 바꿀 수 있다.","grammar":[]},{"n":11,"en":"It can be used as a tool for resetting our attitude toward life, resulting in positive changes.","ko":"그것은 우리의 삶에 대한 태도를 재설정하는 데 사용되어, 긍정적인 변화라는 결과로 이어질 수 있다.","grammar":[]}],"structure":[],"flow":[{"label":"마르코의 악순환","text":"탈락 뒤 부정적 생각이 생기고, 낙담해 오디션을 그만두면서 생각은 더 나빠진다.","sentences":"S1 · S2 · S3 · S4 · S5 · S6","refs":[1,2,3,4,5,6]},{"label":"개념 설명","text":"생각·감정·행동이 서로 영향을 주는 관계를 인지 삼각형이라 한다.","sentences":"S7 · S8","refs":[7,8]},{"label":"바꿀 가능성","text":"한 부분을 긍정적으로 바꾸면 다른 부분도 바뀔 수 있어 태도를 다시 세우는 데 도움이 된다.","sentences":"S9 · S10 · S11","refs":[9,10,11]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["생각·감정·행동은 서로 영향을 준다. 부정적인 순환이 생길 수 있지만, 어느 한 부분을 긍정적으로 바꾸면 다른 부분도 달라질 수 있다.","연기를 좋아하는 고등학생 마르코를 세운다 → 오디션에 두 번 떨어진 일을 든다 → 재능이 없다는 생각으로 이어졌음을 짚는다 → 그 생각이 실망과 낙담을 불렀다고 잇는다","한 꼭짓점이 나머지에 영향을 준다고 푼다 → 그 반대도 성립한다고 방향을 돌린다 → 하나를 좋게 바꾸면 나머지도 바뀐다고 한다 → 태도를 다시 세우는 도구가 됨을 밝힌다"],"answer":0,"why":"생각·감정·행동은 서로 영향을 준다. 부정적인 순환이 생길 수 있지만, 어느 한 부분을 긍정적으로 바꾸면 다른 부분도 달라질 수 있다.","refs":[1,11]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["한 부분을 긍정적으로 바꾸면 다른 부분도 바뀔 수 있어 태도를 다시 세우는 데 도움이 된다.","연기를 좋아하는 고등학생 마르코를 세운다 → 오디션에 두 번 떨어진 일을 든다 → 재능이 없다는 생각으로 이어졌음을 짚는다 → 그 생각이 실망과 낙담을 불렀다고 잇는다","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"한 부분을 긍정적으로 바꾸면 다른 부분도 바뀔 수 있어 태도를 다시 세우는 데 도움이 된다.","refs":[8,9,10,11]},{"type":"문법","q":"S1의 'who loves acting' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","who loves acting — 주격 관계대명사","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"… who loves to act.","refs":[1]}],"key_sentence_en":"It can be used as a tool for resetting our attitude toward life, resulting in positive changes.","key_sentence_ko":"그것은 우리의 삶에 대한 태도를 재설정하는 데 사용되어, 긍정적인 변화라는 결과로 이어질 수 있다.","image":"../../assets/gyeonghae2-textbook-marco-six-panel.webp","image_alt":"연기를 좋아하던 마르코가 두 번의 오디션 탈락 뒤 부정적인 생각과 감정, 행동의 순환에 빠졌다가 연습과 재도전이라는 작은 긍정적 변화를 시작하는 여섯 장면","image_caption":"S1–S11 · 탈락 → 부정적 생각 → 좌절 → 회피의 순환, 한 지점의 긍정적 변화가 다른 지점도 바꿀 수 있음"},{"id":"l1-06","title":"생각을 따지고 감정을 받아들이기","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"부정적인 생각은 사실인지 따져 보고, 감정은 무시하지 말고 먼저 받아들여야 한다. 그래야 생각과 감정을 바꿀 출발점이 생긴다.","diagram":{"kind":"compare","title":"인지 삼각형을 활용하는 두 방법","items":[{"head":"생각 다루기","body":"'나는 못해'라는 생각이 꼭 사실은 아니다. 하나씩 따져 보며 생각하는 방식을 바꾼다.","refs":[1,2,3,4,5,6,7,8,9]},{"head":"감정 받아들이기","body":"좋고 나쁜 감정 모두 실제로 느끼는 것이다. 무시하지 않고 인정하면 스트레스를 줄이고 감정을 바꿀 수 있다.","refs":[10,11,12,13,14,15,16,17]}],"takeaway":"부정적인 생각은 사실인지 따져 보고, 감정은 무시하지 말고 먼저 받아들여야 한다. 그래야 생각과 감정을 바꿀 출발점이 생긴다."},"easy_story":"이 부분에는 인지 삼각형을 활용하는 두 방법이 나온다. 먼저 '나는 대화를 못해' 같은 부정적인 생각이 정말 사실인지 하나씩 따져 본다. 사실이 아닌 생각도 아픈 감정을 만들 수 있기 때문이다. 다음으로 그 감정을 유치하다며 무시하지 않고, 실제로 느끼는 감정으로 받아들인다. 받아들이는 것이 스트레스를 줄이고 감정을 바꾸는 첫 단계다.","blocking_vocab":[{"word":"simply","meaning":"단순히"},{"word":"cognitive triangle","meaning":"인지 삼각형"},{"word":"valid","meaning":"타당한"}],"sentences":[{"n":1,"en":"1. Tackling Negative Thoughts","ko":"1. 부정적인 생각에 대처하기","grammar":[]},{"n":2,"en":"Each day, your mind is filled with thousands of different thoughts, some of which are negative.","ko":"매일 당신의 마음은 수천 가지의 다른 생각들로 채워져 있으며, 그 생각들 중 일부는 부정적이다.","grammar":[]},{"n":3,"en":"Do any of these sound familiar?","ko":"이 중 익숙하게 들리는 것이 있는가?","grammar":[]},{"n":4,"en":"\"I'm not good at conversation.\"","ko":"\"나는 대화를 잘하지 못해.\"","grammar":[]},{"n":5,"en":"\"I shouldn't have bothered trying.\"","ko":"\"나는 굳이 시도하려고 애쓰지 말았어야 했어.\"","grammar":[]},{"n":6,"en":"\"There must be something wrong with me.\"","ko":"\"나한테 뭔가 잘못된 점이 있는 게 분명해.\"","grammar":[]},{"n":7,"en":"These thoughts, which are often not even rooted in fact, are simply part of habit or instinct.","ko":"보통은 사실에 기반하지도 않은 이 생각들은 단지 습관이나 본능일 뿐이다.","grammar":[]},{"n":8,"en":"Yet they cause real feelings that are painful and depressing.","ko":"그러나 이 생각들은 고통스럽고 우울한 실제 감정을 불러일으킨다.","grammar":[]},{"n":9,"en":"Using the cognitive triangle, you can challenge these thoughts one by one and begin to reprogram the way you think.","ko":"인지 삼각형을 이용하여, 당신은 이 생각들에 하나씩 도전하고 당신이 생각하는 방식을 다시 프로그래밍하기 시작할 수 있다.","grammar":[{"label":"the way you think","explanation":"the way you think — 관계부사 the way (✗ the way how)","transform_label":"Using the cognitive triangle — 분사구문 → 조건을 나타내는 부사절 — 접속사·주어를 넣고 분사를 정동사로","transform_value":"If you use the cognitive …"}]},{"n":10,"en":"2. Accepting Your Feelings","ko":"2. 감정을 받아들이기","grammar":[]},{"n":11,"en":"The feelings you have, whether negative or positive, are real and valid.","ko":"긍정적이든 부정적이든, 당신이 느끼는 감정은 실제이고 유효하다.","grammar":[{"label":"whether negative","explanation":"whether negative — 주어 + be동사 생략","transform_label":"whether negative — 주어 + be동사 생략 → 주어 + be동사 복원 — whether 뒤에 주어와 be동사를 되살린다","transform_value":"… have, whether they are negative or …"},{"label":"feelings you","explanation":"feelings you — 목적격 관계대명사 생략 · feelings that you"}]},{"n":12,"en":"Dismissing or minimizing them does not change that.","ko":"감정을 무시하거나 축소하는 것이 그 사실을 바꾸지 않는다.","grammar":[]},{"n":13,"en":"When you think of your feelings as being childish, inaccurate, or not allowed, you may feel negatively about them.","ko":"당신이 당신의 감정을 유치하고, 부정확하고, 허용되지 않는 것이라고 여길 때, 당신은 그 감정에 대해 부정적으로 느낄 수 있다.","grammar":[]},{"n":14,"en":"Of course, feeling bad about your emotions is normal and natural.","ko":"물론 자신의 감정에 대해 나쁘게 느끼는 것은 정상적이고 자연스러운 일이다.","grammar":[]},{"n":15,"en":"Therefore, the first step in changing them is to embrace them.","ko":"그러므로 그것을 변화시키는 첫 번째 단계는 받아들이는 것이다.","grammar":[]},{"n":16,"en":"Once you accept them, you will feel less stressed.","ko":"일단 그것을 받아들이면, 당신은 스트레스를 덜 받게 된다.","grammar":[]},{"n":17,"en":"Then, finally, you can alter your feelings, taking back control.","ko":"그리고 마침내, 당신은 감정에 대한 통제권을 되찾으면서 당신의 감정을 바꿀 수 있다.","grammar":[{"label":"문장 전환","explanation":"taking back control — 부대상황 분사구문 → 접속사 + 절 — and 와 주어 you 를 세워 절로 편다","transform_label":"taking back control — 부대상황 분사구문 → 접속사 + 절 — and 와 주어 you 를 세워 절로 편다","transform_value":"… your feelings, and you take back control."}]}],"structure":[],"flow":[{"label":"첫째 · 생각","text":"부정적인 혼잣말이 꼭 사실인 것은 아니므로 하나씩 따져 생각하는 방식을 바꾼다.","sentences":"S1 · S2 · S3 · S4 · S5 · S6 · S7 · S8 · S9","refs":[1,2,3,4,5,6,7,8,9]},{"label":"둘째 · 감정","text":"감정은 실제이므로 무시하거나 잘못되었다고 몰아붙이지 말고 먼저 받아들인다.","sentences":"S10 · S11 · S12 · S13 · S14 · S15","refs":[10,11,12,13,14,15]},{"label":"받아들인 뒤","text":"감정을 인정하면 스트레스가 줄고, 그다음 감정을 바꿀 수 있다.","sentences":"S16 · S17","refs":[16,17]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["무시해도 그 사실은 달라지지 않는다고 되받는다 → 감정을 낮잡으면 스스로 부정적이 된다고 짚는다 → 그렇게 느끼는 일도 자연스럽다고 감싼다 → 바꾸려면 먼저 껴안으라고 이른다 → 받아들이면 스트레스가 줄어든다고 잇는다 → 마침내 통제권을 되찾는다고 맺는다","부정적인 생각은 사실인지 따져 보고, 감정은 무시하지 말고 먼저 받아들여야 한다. 그래야 생각과 감정을 바꿀 출발점이 생긴다.","첫째 방법으로 생각 다루기를 내건다 → 하루에도 수천 생각이 오가고 일부는 부정적이라 한다 → 익숙한 말이 있는지 독자에게 되묻는다 → 대화를 못한다는 흔한 혼잣말을 든다 → 괜히 시도했다는 혼잣말을 든다 → 내게 문제가 있다는 혼잣말을 든다"],"answer":1,"why":"부정적인 생각은 사실인지 따져 보고, 감정은 무시하지 말고 먼저 받아들여야 한다. 그래야 생각과 감정을 바꿀 출발점이 생긴다.","refs":[1,17]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["첫째 방법으로 생각 다루기를 내건다 → 하루에도 수천 생각이 오가고 일부는 부정적이라 한다 → 익숙한 말이 있는지 독자에게 되묻는다 → 대화를 못한다는 흔한 혼잣말을 든다 → 괜히 시도했다는 혼잣말을 든다 → 내게 문제가 있다는 혼잣말을 든다","앞의 사건과 관계없는 새 주제","감정을 인정하면 스트레스가 줄고, 그다음 감정을 바꿀 수 있다."],"answer":2,"why":"감정을 인정하면 스트레스가 줄고, 그다음 감정을 바꿀 수 있다.","refs":[12,13,14,15,16,17]},{"type":"문법","q":"S9의 'the way you think' 설명으로 알맞은 것은?","choices":["the way you think — 관계부사 the way (✗ the way how)","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"If you use the cognitive …","refs":[9]}],"key_sentence_en":"Then, finally, you can alter your feelings, taking back control.","key_sentence_ko":"그리고 마침내, 당신은 감정에 대한 통제권을 되찾으면서 당신의 감정을 바꿀 수 있다."},{"id":"l1-07","title":"행동을 하나 바꾸기","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"부정적 순환을 끊으려면 행동을 한꺼번에 바꾸려 하지 말고 작은 변화 하나부터 시작한다. 결과가 달라도 시도와 피드백은 다음에 도움이 된다.","diagram":{"kind":"steps","title":"지문 내용을 한눈에","items":[{"head":"행동이 왜 중요한가","body":"행동을 바꾸면 부정적인 생각에 맞서 순환을 끊는 데 도움이 됨","refs":[1,2]},{"head":"결과가 안 좋아도","body":"시도한 경험이 남고, 구체적인 피드백을 다음에 활용할 수 있음","refs":[3,4]},{"head":"어디서 시작하나","body":"갑자기 전부 바꾸지 말고 행동 하나를 작게 바꿈","refs":[5,6]},{"head":"다시 마르코에게","body":"인지 삼각형을 써서 부정적 순환을 멈추고 긍정적인 면을 발견할 수 있음","refs":[7,8,9]}],"takeaway":"부정적 순환을 끊으려면 행동을 한꺼번에 바꾸려 하지 말고 작은 변화 하나부터 시작한다. 결과가 달라도 시도와 피드백은 다음에 도움이 된다."},"easy_story":"생각과 감정뿐 아니라 행동도 바꿀 수 있다. 마르코가 오디션을 다시 본다고 해서 반드시 합격하는 것은 아니다. 그래도 시도했다는 경험이 남고, 무엇을 고쳐야 할지 피드백을 구할 수 있다. 모든 행동을 한 번에 바꾸려 하기보다 작은 행동 하나부터 바꾸면 부정적인 순환을 끊는 데 도움이 될 수 있다.","blocking_vocab":[{"word":"cognitive triangle","meaning":"인지 삼각형"},{"word":"negative cycle","meaning":"부정적인 순환"},{"word":"outcome","meaning":"결과"}],"sentences":[{"n":1,"en":"3. Changing Your Behavior","ko":"3. 행동 변화시키기","grammar":[]},{"n":2,"en":"Changing your behavior can be a good way to interrupt the negative cycle, because it challenges your thoughts about it.","ko":"행동을 변화시키는 것은 부정적인 순환에 대한 당신의 생각에 도전하기 때문에 부정적인 순환을 차단하는 좋은 방법이 될 수 있다.","grammar":[]},{"n":3,"en":"Even if the new behavior does not create the desired outcome, you will be glad that you at least tried.","ko":"새로운 행동이 바라던 결과를 끌어내지는 못하더라도, 당신은 적어도 시도했다는 것에 기쁨을 느낄 것이다.","grammar":[]},{"n":4,"en":"In some cases, you can ask for specific feedback about why something didn't go right, which will help you the next time.","ko":"어떤 경우에는, 당신은 어떤 것이 왜 제대로 진행되지 않았는지에 대한 구체적인 피드백을 요청할 수도 있고, 그것은 다음번에 도움이 될 것이다.","grammar":[]},{"n":5,"en":"Unsurprisingly, it would be difficult to suddenly start behaving completely differently one day.","ko":"당연히, 어느 날 갑자기 완전히 다르게 행동하는 것은 어려울 것이다.","grammar":[]},{"n":6,"en":"So begin by making one small change to your behavior ─ it could be a big step toward changing your cycle.","ko":"그러므로 당신의 행동에 작은 변화를 주는 것에서 시작해라. 그것은 당신의 순환을 바꾸는 큰 발걸음이 될 수 있을 것이다.","grammar":[]},{"n":7,"en":"Now let's get back to Marco's case to see how a positive cycle works.","ko":"이제, 마르코의 사례로 돌아가서 긍정적인 순환이 어떻게 작용하는지를 살펴보자.","grammar":[]},{"n":8,"en":"If you are suffering from challenges in your life that are pushing you into a negative cycle, how about trying the cognitive triangle?","ko":"만약 당신이 부정적인 순환으로 밀어 넣는 인생에서의 어려움으로 고통받고 있다면, 인지 삼각형을 시도해 보는 것은 어떨까?","grammar":[{"label":"that are pushing","explanation":"that are pushing — 주격 관계대명사","transform_label":"How about -ing? → Why don't you V? — …하는 게 어때?","transform_value":"… negative cycle, why don't you try the cognitive …"}]},{"n":9,"en":"You can stop yourself from thinking too negatively, and you may discover a positive aspect of your life that wasn't there before.","ko":"당신은 지나치게 부정적으로 생각하는 것으로부터 자신을 막을 수 있고, 이전에는 없던 삶의 긍정적인 측면을 발견할지도 모른다.","grammar":[{"label":"that wasn't there before","explanation":"that wasn't there before — 주격 관계대명사","transform_label":"stop oneself from -ing → refrain from -ing — …하는 것을 삼가다","transform_value":"You can refrain from thinking …"}]}],"structure":[],"flow":[{"label":"셋째 · 행동","text":"행동 변화는 부정적인 생각에 맞서 순환을 끊는 방법이다.","sentences":"S1 · S2","refs":[1,2]},{"label":"시도의 가치","text":"바라는 결과가 나오지 않아도 시도와 피드백은 다음에 도움이 된다.","sentences":"S3 · S4","refs":[3,4]},{"label":"작게 시작","text":"행동 하나를 작게 바꾸는 데서 시작하고, 인지 삼각형을 마르코의 상황에도 적용해 본다.","sentences":"S5 · S6 · S7 · S8 · S9","refs":[5,6,7,8,9]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["마르코 사례로 돌아가 보자고 이끈다 → 힘들다면 인지 삼각형을 써 보라고 청한다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다","부정적 순환을 끊으려면 행동을 한꺼번에 바꾸려 하지 말고 작은 변화 하나부터 시작한다. 결과가 달라도 시도와 피드백은 다음에 도움이 된다.","셋째 방법으로 행동 고치기를 내건다 → 행동이 생각에 맞서 순환을 끊는다고 푼다 → 결과가 없어도 시도가 남는다고 다독인다"],"answer":1,"why":"부정적 순환을 끊으려면 행동을 한꺼번에 바꾸려 하지 말고 작은 변화 하나부터 시작한다. 결과가 달라도 시도와 피드백은 다음에 도움이 된다.","refs":[1,9]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","행동 하나를 작게 바꾸는 데서 시작하고, 인지 삼각형을 마르코의 상황에도 적용해 본다.","셋째 방법으로 행동 고치기를 내건다 → 행동이 생각에 맞서 순환을 끊는다고 푼다 → 결과가 없어도 시도가 남는다고 다독인다"],"answer":1,"why":"행동 하나를 작게 바꾸는 데서 시작하고, 인지 삼각형을 마르코의 상황에도 적용해 본다.","refs":[7,8,9]},{"type":"문법","q":"S8의 'that are pushing' 설명으로 알맞은 것은?","choices":["that are pushing — 주격 관계대명사","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"… negative cycle, why don't you try the cognitive …","refs":[8]}],"key_sentence_en":"You can stop yourself from thinking too negatively, and you may discover a positive aspect of your life that wasn't there before.","key_sentence_ko":"당신은 지나치게 부정적으로 생각하는 것으로부터 자신을 막을 수 있고, 이전에는 없던 삶의 긍정적인 측면을 발견할지도 모른다."}]},{"id":"l2","label":"2과 · Listening to the Voice of Art","scope":"2과 본문 전체","passages":[{"id":"l2-01","title":"다음 장면을 궁금하게 하다","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"다음 장면을 궁금하게 하다: 공이 담을 넘는 사건으로 이야기를 시작한다 → 무엇이 그렇게 만드는지 물어 본론을 연다","diagram":{"kind":"timeline","title":"결정적인 순간에서 멈추는 이야기","items":[{"head":"사건","body":"공이 낡은 집의 울타리를 넘어간다.","refs":[1]},{"head":"긴장","body":"소년이 울타리를 넘어가 공을 든 노인과 마주한다.","refs":[2,3,4]},{"head":"뜻밖의 단서","body":"화난 듯 보이던 노인의 얼굴에 눈물이 흐른다.","refs":[5]},{"head":"멈춤","body":"노인이 다가오는 순간 이야기가 끊긴다.","refs":[6,7,8]}],"takeaway":"정보를 모두 주지 않고 멈추면 독자는 다음 장면을 알고 싶어 한다."},"easy_story":"공이 담을 넘는 사건으로 이야기를 시작한다 → 넘어간 뒤 곧 후회했다며 조바심을 심는다 → 노인이 공을 들고 있었다는 사정을 댄다 → 화난 쪽과 떠는 쪽을 마주 세운다. 노인의 눈물을 발견하게 해 결을 튼다 → 다가서는 대목에서 말을 끊어 궁금증을 남긴다 → 독자의 마음속 물음을 대신 소리 내 준다 → 그 궁금함이 좋은 이야기의 알맹이라고 밝힌다. 오랜 벽화를 들어 이야기의 내력을 받친다 → 좋은 이야기가 하는 일을 한 줄로 밝힌다 → 어디서 오든 다들 좋아한다고 넓힌다 → 무엇이 그렇게 만드는지 물어 본론을 연다.","blocking_vocab":[{"word":"essential","meaning":"필수적인"},{"word":"creepy","meaning":"오싹한"},{"word":"overgrown","meaning":"풀이 무성한"},{"word":"trembling","meaning":"떨고 있는"},{"word":"anticipation","meaning":"기대감"}],"sentences":[{"n":1,"en":"While playing one day, a young boy accidentally kicks his ball over a fence towards a creepy, old house in the middle of an overgrown yard.","ko":"<우리가 이야기를 사랑하는 이유는 무엇일까?> 어느 날 한 소년이 놀다가, 풀이 무성한 마당 가운데에 있는 오싹하고 낡은 집을 향해 실수로 공을 차서 울타리를 넘긴다.","grammar":[]},{"n":2,"en":"He climbs over the fence, but he regrets his decision as soon as he sets foot on the property.","ko":"그는 울타리 너머로 기어 올라가지만, 그 주택에 발을 딛자마자 자신의 결정을 후회한다.","grammar":[]},{"n":3,"en":"That's because he sees an old man holding the ball.","ko":"한 노인이 그 공을 들고 있는 것을 발견하기 때문이다.","grammar":[]},{"n":4,"en":"The man looks upset, but the trembling boy shyly asks for his ball back.","ko":"그 노인은 화가 난 듯 보이지만, 떨고 있는 소년은 조심스럽게 자신의 공을 돌려달라고 한다.","grammar":[]},{"n":5,"en":"The boy notices tears streaming down the man's face.","ko":"그 소년은 눈물이 그 노인의 얼굴을 타고 흐르는 것을 알아차린다.","grammar":[]},{"n":6,"en":"The man takes a step toward the boy and ...","ko":"그 노인은 소년에게 한 발짝 다가가고 ...","grammar":[]},{"n":7,"en":"You're probably wondering: \"What happens next?\"","ko":"당신은 아마도 궁금할 것이다.","grammar":[]},{"n":8,"en":"This feeling of curiosity and anticipation that builds up in the reader or listener is at the core of good storytelling.","ko":"\"다음에 무슨 일이 일어날까?\" 독자나 청자에게 쌓이는 이러한 호기심과 기대의 감정은 좋은 스토리텔링의 핵심이다.","grammar":[{"label":"This feeling of curiosity and anticipation that builds up","explanation":"This feeling of curiosity and anticipation that builds up — 주격 관계대명사 that · 관계절이 낀 자리의 수 일치","transform_label":"that builds up in the reader or listener is — 주격 관계대명사 · 주어–동사 수 일치 → 두 문장 — 관계대명사를 대명사로 바꿔 문장을 나눈다","transform_value":"… and anticipation is at the core of good storytelling. It builds up …"}]},{"n":9,"en":"Stories have been around for a long time, as demonstrated by 27,000-year-old cave paintings, and they are an essential tool for communication.","ko":"27,000년 된 동굴 벽화가 증명하듯, 이야기는 오랜 시간 존재해 왔으며, 의사소통을 위한 필수적인 도구이다.","grammar":[{"label":"as demonstrated","explanation":"as demonstrated — 유사관계대명사 as 뒤 be동사 생략 · as is demonstrated","transform_label":"as demonstrated by 27,000-year-old cave paintings — 수동 분사구 → as 27,000-year-old cave paintings demonstrate — 행위자를 주어로 세워 능동 절로 편다","transform_value":"… cave paintings demonstrate, and they …"}]},{"n":10,"en":"Great stories take bits of information and weave them together in a unique and compelling way.","ko":"훌륭한 이야기는 몇 가지의 정보를 가져와서 그것들을 독특하고 설득력 있는 방식으로 엮는다.","grammar":[]},{"n":11,"en":"Everyone loves a good story, whether it comes from a novel, a film, or a conversation with a friend.","ko":"그것이 소설에서 왔든, 영화에서 왔든, 아니면 친구와의 대화에서 왔든, 모든 사람들은 재미있는 이야기를 좋아한다.","grammar":[]},{"n":12,"en":"What makes a good story so engaging?","ko":"무엇이 재미있는 이야기를 그토록 매력적으로 만들까?","grammar":[{"label":"What makes a good story so engaging","explanation":"What makes a good story so engaging — 5형식 make + 목적격보어"}]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"공이 담을 넘는 사건으로 이야기를 시작한다 → 넘어간 뒤 곧 후회했다며 조바심을 심는다 → 노인이 공을 들고 있었다는 사정을 댄다 → 화난 쪽과 떠는 쪽을 마주 세운다","refs":[1,2,3,4]},{"label":"전개","sentences":"S5 · S6 · S7 · S8","text":"노인의 눈물을 발견하게 해 결을 튼다 → 다가서는 대목에서 말을 끊어 궁금증을 남긴다 → 독자의 마음속 물음을 대신 소리 내 준다 → 그 궁금함이 좋은 이야기의 알맹이라고 밝힌다","refs":[5,6,7,8]},{"label":"도착","sentences":"S9 · S10 · S11 · S12","text":"오랜 벽화를 들어 이야기의 내력을 받친다 → 좋은 이야기가 하는 일을 한 줄로 밝힌다 → 어디서 오든 다들 좋아한다고 넓힌다 → 무엇이 그렇게 만드는지 물어 본론을 연다","refs":[9,10,11,12]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["공이 담을 넘는 사건으로 이야기를 시작한다 → 넘어간 뒤 곧 후회했다며 조바심을 심는다 → 노인이 공을 들고 있었다는 사정을 댄다 → 화난 쪽과 떠는 쪽을 마주 세운다","오랜 벽화를 들어 이야기의 내력을 받친다 → 좋은 이야기가 하는 일을 한 줄로 밝힌다 → 어디서 오든 다들 좋아한다고 넓힌다 → 무엇이 그렇게 만드는지 물어 본론을 연다","다음 장면을 궁금하게 하다: 공이 담을 넘는 사건으로 이야기를 시작한다 → 무엇이 그렇게 만드는지 물어 본론을 연다"],"answer":2,"why":"다음 장면을 궁금하게 하다: 공이 담을 넘는 사건으로 이야기를 시작한다 → 무엇이 그렇게 만드는지 물어 본론을 연다","refs":[1,12]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["오랜 벽화를 들어 이야기의 내력을 받친다 → 좋은 이야기가 하는 일을 한 줄로 밝힌다 → 어디서 오든 다들 좋아한다고 넓힌다 → 무엇이 그렇게 만드는지 물어 본론을 연다","공이 담을 넘는 사건으로 이야기를 시작한다 → 넘어간 뒤 곧 후회했다며 조바심을 심는다 → 노인이 공을 들고 있었다는 사정을 댄다 → 화난 쪽과 떠는 쪽을 마주 세운다","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"오랜 벽화를 들어 이야기의 내력을 받친다 → 좋은 이야기가 하는 일을 한 줄로 밝힌다 → 어디서 오든 다들 좋아한다고 넓힌다 → 무엇이 그렇게 만드는지 물어 본론을 연다","refs":[9,10,11,12]},{"type":"문법","q":"S8의 'This feeling of curiosity and anticipation that builds up' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","This feeling of curiosity and anticipation that builds up — 주격 관계대명사 that · 관계절이 낀 자리의 수 일치","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"… and anticipation is at the core of good storytelling. It builds up …","refs":[8]}],"key_sentence_en":"What makes a good story so engaging?","key_sentence_ko":"무엇이 재미있는 이야기를 그토록 매력적으로 만들까?","image":"../../assets/gyeonghae2-textbook-story-cliffhanger-four-panel.webp","image_alt":"소년이 공을 낡은 집의 울타리 너머로 차고, 울타리를 넘어가 공을 든 노인과 마주한 뒤, 노인의 눈물과 다가오는 한 걸음 앞에서 이야기가 멈추는 네 장면","image_caption":"S1–S8 · 사건을 이어 보여 주다가 결정적인 순간에 멈추면 독자의 호기심과 기대가 커짐"},{"id":"l2-02","title":"공감이 행동으로 이어지다","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"공감이 행동으로 이어지다: 학자들이 무엇을 살폈는지 밝힌다 → 기부라는 실제 행동을 들어 앞말을 받친다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"학자들이 무엇을 살폈는지 밝힌다 → 그 실험이 어떻게 짜였는지 보인다","refs":[1,2]},{"head":"전개","body":"무엇의 수치가 움직였는지와 그 뜻을 밝힌다 → 언제 그 물질이 나왔는지까지 좁혀 준다","refs":[3,4]},{"head":"도착","body":"그 수치와 남을 돕는 마음이 이어짐을 잇는다 → 기부라는 실제 행동을 들어 앞말을 받친다","refs":[5,6]}],"takeaway":"공감이 행동으로 이어지다: 학자들이 무엇을 살폈는지 밝힌다 → 기부라는 실제 행동을 들어 앞말을 받친다"},"easy_story":"학자들이 무엇을 살폈는지 밝힌다 → 그 실험이 어떻게 짜였는지 보인다. 무엇의 수치가 움직였는지와 그 뜻을 밝힌다 → 언제 그 물질이 나왔는지까지 좁혀 준다. 그 수치와 남을 돕는 마음이 이어짐을 잇는다 → 기부라는 실제 행동을 들어 앞말을 받친다.","blocking_vocab":[{"word":"simply","meaning":"단순히"},{"word":"lease","meaning":"임대차 계약"},{"word":"compelling","meaning":"마음을 끄는"},{"word":"oxytocin","meaning":"옥시토신"},{"word":"empathy","meaning":"공감"}],"sentences":[{"n":1,"en":"Scientists have researched what happens when people hear stories that they feel deeply connected to.","ko":"<이야기 뒤에 숨어있는 과학> 과학자들은 사람들이 자신에게 깊게 연관되어 있다고 느끼는 이야기를 들을 때 어떤 일이 일어나는지 연구했다.","grammar":[{"label":"what happens","explanation":"what happens — 간접의문문의 어순"},{"label":"stories that they feel deeply connected to","explanation":"stories that they feel deeply connected to — 목적격 관계대명사"}]},{"n":2,"en":"In one study, participants were made to listen to stories while their hormone levels were being examined by researchers.","ko":"한 연구에서는 참가자들의 호르몬 수치가 연구자들에 의해 관찰되는 동안, 참가자들에게 이야기를 듣게 했다.","grammar":[]},{"n":3,"en":"The researchers found a change in the level of oxytocin, a hormone related to trust and empathy that motivates cooperation with others.","ko":"연구자들은 타인과의 협력을 촉진하는, 신뢰와 공감과 관련된 호르몬인 옥시토신에서의 수치 변화를 발견했다.","grammar":[]},{"n":4,"en":"The participants' oxytocin levels increased when they heard these stories, and the researchers discovered that oxytocin was consistently released during character-driven parts of the stories.","ko":"참가자들의 옥시토신 수치는 그들이 이러한 이야기를 들었을 때 상승했고, 연구자들은 옥시토신이 이야기 중 인물이 중심이 되는 부분을 듣는 동안 지속적으로 분비된다는 것을 발견했다.","grammar":[]},{"n":5,"en":"Furthermore, there was a strong link between the level of oxytocin and how willing the participants were to help others.","ko":"게다가 옥시토신의 수치와 참가자들이 얼마나 기꺼이 타인을 돕고 싶어 하는지의 정도 사이에는 강한 연관성이 있었다.","grammar":[]},{"n":6,"en":"For example, people are 사람들에 대한 설득력 있는 이야기를 들을 때 행동을 취하고, 자선 단체에 기부할 확률이 더 높다."},{"id":"l2-03","title":"경험하듯 반응하는 뇌","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"경험하듯 반응하는 뇌: 뇌가 실제처럼 반응한다는 결과로 화제를 옮긴다 → 그 앎이 공감과 유대로 이어진다고 닫는다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"뇌가 실제처럼 반응한다는 결과로 화제를 옮긴다 → 뇌를 찍으면 어느 자리가 켜지는지 밝힌다 → 짧은 문장 하나를 들어 실험대에 올린다 → 그 문장이 어느 영역까지 건드리는지 짚는다","refs":[1,2,3,4]},{"head":"전개","body":"생생하면 실제처럼 반응한다고 묶어 준다 → 어릴 적 경험이 좁다는 사정을 먼저 놓는다 → 그래서 이야기 속 세계가 즐거움을 잇는다 → 즐거움 그 이상이라며 논의를 한 단 올린다 → 주제와 교훈을 실어 나른다는 몫을 든다","refs":[5,6,7,8,9]},{"head":"도착","body":"그 실어 나름이 강한 반응의 이유임을 짚는다 → 감정에 호소해 뜻이 건네짐을 풀어 준다 → 뜻이 닿으면 감정이 나뉜 것임을 알게 됨을 든다 → 그 앎이 공감과 유대로 이어진다고 닫는다","refs":[10,11,12,13]}],"takeaway":"경험하듯 반응하는 뇌: 뇌가 실제처럼 반응한다는 결과로 화제를 옮긴다 → 그 앎이 공감과 유대로 이어진다고 닫는다"},"easy_story":"뇌가 실제처럼 반응한다는 결과로 화제를 옮긴다 → 뇌를 찍으면 어느 자리가 켜지는지 밝힌다 → 짧은 문장 하나를 들어 실험대에 올린다 → 그 문장이 어느 영역까지 건드리는지 짚는다. 생생하면 실제처럼 반응한다고 묶어 준다 → 어릴 적 경험이 좁다는 사정을 먼저 놓는다 → 그래서 이야기 속 세계가 즐거움을 잇는다 → 즐거움 그 이상이라며 논의를 한 단 올린다 → 주제와 교훈을 실어 나른다는 몫을 든다. 그 실어 나름이 강한 반응의 이유임을 짚는다 → 감정에 호소해 뜻이 건네짐을 풀어 준다 → 뜻이 닿으면 감정이 나뉜 것임을 알게 됨을 든다 → 그 앎이 공감과 유대로 이어진다고 닫는다.","blocking_vocab":[{"word":"engaging","meaning":"매력적인"},{"word":"empathy","meaning":"공감"},{"word":"brain scan","meaning":"뇌 스캔"},{"word":"stimulate","meaning":"자극하다"},{"word":"underlying","meaning":"이면에 있는"}],"sentences":[{"n":1,"en":"Research has also shown that your brain responds to a story as if you were actually experiencing it.","ko":"또한 연구는 마치 당신이 이야기를 실제로 경험하는 것처럼 당신의 뇌가 반응한다는 것을 밝혀냈다.","grammar":[]},{"n":2,"en":"If you underwent a brain scan while listening to an engaging story, it would show activity in the language processing areas of the brain as well as the sections that are stimulated when experiencing the events that the story describes.","ko":"당신이 흥미로운 이야기를 듣는 동안 뇌 스캔을 해본다면, 이야기가 묘사하는 사건들을 경험할 때 자극을 받는 영역뿐만 아니라 뇌의 언어처리 영역에서도 활동성을 보여줄 것이다.","grammar":[{"label":"If you underwent a brain scan","explanation":"If you underwent a brain scan — 가정법 과거","transform_label":"If you underwent … it would show … — 가정법 과거 → 열린 조건문 — if절을 현재로, 주절 would 를 will 로 바꾼다","transform_value":"If you undergo a brain … story, it will show activity …"}]},{"n":3,"en":"For instance, consider the sentence, \"Running through the crowd, we heard a loud scream.\"","ko":"예를 들어, \"군중 사이를 달리다가 우리는 큰 비명을 들었다\"라는 문장을 떠올려 보아라.","grammar":[{"label":"문장 전환","explanation":"Running through the crowd — 분사구문 → 시간 부사절 — 접속사 as 와 주어 we 를 되살려 절로 편다","transform_label":"Running through the crowd — 분사구문 → 시간 부사절 — 접속사 as 와 주어 we 를 되살려 절로 편다","transform_value":"… the sentence, \"As we ran through the …"}]},{"n":4,"en":"Hearing this sentence would stimulate both the sensory and motor sections of your brain in addition to the language processing areas.","ko":"이 문장을 듣는 것은 언어 처리 영역에 더해 뇌의 감각과 운동 영역 모두를 자극할 것이다.","grammar":[]},{"n":5,"en":"In other words, when it comes to vividly described stories, your brain is made to react as if the events were really happening.","ko":"다시 말해, 생생하게 묘사된 이야기에 관한 한, 당신의 뇌는 그 사건이 마치 실제로 일어나고 있는 것처럼 반응하게 된다.","grammar":[{"label":"as if the events were really happening","explanation":"as if the events were really happening — as if 가정법","transform_label":"is made to react — 사역동사 make 의 수동태 → 능동태 — 행위자를 주어로 세우고 to 를 뗀다","transform_value":"… described stories, vivid description makes your brain …"}]},{"n":6,"en":"When we are children, our personal experience is limited.","ko":"<메신저로서의 이야기> 어린 시절, 우리의 개인적인 경험은 한정되어 있다.","grammar":[]},{"n":7,"en":"Therefore, the many diverse environments explored in stories are highly entertaining to us.","ko":"그래서 이야기에서 겪는 많은 다양한 환경은 우리를 매우 즐겁게 해준다.","grammar":[]},{"n":8,"en":"Yet stories are more than just entertainment.","ko":"그러나 이야기는 단순한 즐거움 그 이상이다.","grammar":[]},{"n":9,"en":"They can also convey a wide range of underlying themes and lessons.","ko":"그것은 광범위한 근본적인 주제와 교훈을 전달할 수도 있다.","grammar":[]},{"n":10,"en":"Interestingly, the very communication of these messages is one reason why we respond so strongly to stories.","ko":"흥미롭게도, 바로 이 메시지의 전달이 우리가 이야기에 그토록 강렬하게 반응하는 한 가지 이유이다.","grammar":[]},{"n":11,"en":"Human beings are always seeking ways of connecting with one another, and by appealing to our emotions, stories enable us to communicate messages effectively.","ko":"인간은 항상 서로 연결될 수 있는 방법을 찾고 있고, 이야기는 우리의 감정에 호소함으로써 우리가 메시지를 효과적으로 전달할 수 있게 해준다.","grammar":[]},{"n":12,"en":"When a story's message gets through to us, we are reminded that the emotions we feel are shared by others.","ko":"이야기의 메시지가 우리에게 통하면, 우리는 우리가 느끼는 감정을 타인과도 공유한다는 것을 상기하게 된다.","grammar":[]},{"n":13,"en":"This helps us to feel empathy and a special sense of togetherness.","ko":"그것은 우리가 공감과 특별한 유대감을 느끼는 것을 돕는다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"뇌가 실제처럼 반응한다는 결과로 화제를 옮긴다 → 뇌를 찍으면 어느 자리가 켜지는지 밝힌다 → 짧은 문장 하나를 들어 실험대에 올린다 → 그 문장이 어느 영역까지 건드리는지 짚는다","refs":[1,2,3,4]},{"label":"전개","sentences":"S5 · S6 · S7 · S8 · S9","text":"생생하면 실제처럼 반응한다고 묶어 준다 → 어릴 적 경험이 좁다는 사정을 먼저 놓는다 → 그래서 이야기 속 세계가 즐거움을 잇는다 → 즐거움 그 이상이라며 논의를 한 단 올린다 → 주제와 교훈을 실어 나른다는 몫을 든다","refs":[5,6,7,8,9]},{"label":"도착","sentences":"S10 · S11 · S12 · S13","text":"그 실어 나름이 강한 반응의 이유임을 짚는다 → 감정에 호소해 뜻이 건네짐을 풀어 준다 → 뜻이 닿으면 감정이 나뉜 것임을 알게 됨을 든다 → 그 앎이 공감과 유대로 이어진다고 닫는다","refs":[10,11,12,13]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["그 실어 나름이 강한 반응의 이유임을 짚는다 → 감정에 호소해 뜻이 건네짐을 풀어 준다 → 뜻이 닿으면 감정이 나뉜 것임을 알게 됨을 든다 → 그 앎이 공감과 유대로 이어진다고 닫는다","경험하듯 반응하는 뇌: 뇌가 실제처럼 반응한다는 결과로 화제를 옮긴다 → 그 앎이 공감과 유대로 이어진다고 닫는다","뇌가 실제처럼 반응한다는 결과로 화제를 옮긴다 → 뇌를 찍으면 어느 자리가 켜지는지 밝힌다 → 짧은 문장 하나를 들어 실험대에 올린다 → 그 문장이 어느 영역까지 건드리는지 짚는다"],"answer":1,"why":"경험하듯 반응하는 뇌: 뇌가 실제처럼 반응한다는 결과로 화제를 옮긴다 → 그 앎이 공감과 유대로 이어진다고 닫는다","refs":[1,13]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["그 실어 나름이 강한 반응의 이유임을 짚는다 → 감정에 호소해 뜻이 건네짐을 풀어 준다 → 뜻이 닿으면 감정이 나뉜 것임을 알게 됨을 든다 → 그 앎이 공감과 유대로 이어진다고 닫는다","뇌가 실제처럼 반응한다는 결과로 화제를 옮긴다 → 뇌를 찍으면 어느 자리가 켜지는지 밝힌다 → 짧은 문장 하나를 들어 실험대에 올린다 → 그 문장이 어느 영역까지 건드리는지 ath the surface, it sends a message about the love of family and accepting oneself.","ko":"그러나, 그 표면 아래에서 그것은 가족에 대한 사랑과 스스로를 받아들이는 것에 대한 메시지를 전달한다.","grammar":[]},{"n":4,"en":"People watching the film can relate to the struggles of the characters even though they do not have magical powers themselves.","ko":"영화를 보는 사람들은 그들에게 마법의 힘이 없다 하더라도 등장인물의 분투를 그들 자신과 연결 지을 수 있다.","grammar":[{"label":"People watching","explanation":"People watching — 주격 관계대명사+be 생략 · People who are watching"},{"label":"People watching","explanation":"People watching — 주격 관계대명사+be 생략 · People who are watching"}]},{"n":5,"en":"As a result, they can enjoy the film's explorations of family and individuality and gain wisdom from them.","ko":"그 결과, 그들은 가족과 개인에 대한 영화 속의 탐구를 즐기고 이로부터 지혜를 얻을 수 있다.","grammar":[]},{"n":6,"en":"Stories are an essential part of our lives.","ko":"이야기는 우리 삶의 필수적인 부분이다.","grammar":[]},{"n":7,"en":"They allow us to take imaginative journeys to places that we might never visit in real life, and they also give us a chance to learn more about ourselves.","ko":"그것은 우리가 실제 삶에서는 가보지 못할 장소로 상상 속의 여행을 떠나게 해주고, 우리 스스로에 대해 알아갈 기회를 주기도 한다.","grammar":[{"label":"places that we might never visit","explanation":"places that we might never visit — 목적격 관계대명사 that · 뒤에 목적어가 빠져 있다"},{"label":"give us a chance to learn","explanation":"give us a chance to learn — 4형식 · to부정사의 형용사적 용법 · 「배울」"}]},{"n":8,"en":"Great stories have the power to change minds and win hearts.","ko":"훌륭한 이야기는 생각을 바꾸고 마음을 사로잡는 힘이 있다.","grammar":[]},{"n":9,"en":"Let me tell you a story ─ you know you want to hear one.","ko":"여러분에게 이야기를 하나 해주겠다. 당신은 그 이야기를 듣고 싶어 할 것이다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3","text":"앞의 설명을 받칠 영화 한 편을 꺼낸다 → 겉으로는 단순해 보인다고 먼저 놓는다 → 그 아래 담긴 메시지를 들춰 뒤집는다","refs":[1,2,3]},{"label":"전개","sentences":"S4 · S5 · S6","text":"마법이 없어도 인물에 이입함을 짚는다 → 그래서 즐기며 배움을 얻는다고 잇는다 → 이야기가 삶의 필수임을 내세우며 마무리에 든다","refs":[4,5,6]},{"label":"도착","sentences":"S7 · S8 · S9","text":"상상 ng":"민속 예술"},{"word":"irrelevant","meaning":"중요하지 않은"},{"word":"on a large scale","meaning":"대규모로"},{"word":"literally","meaning":"말 그대로"},{"word":"chaekgeori","meaning":"책거리"}],"sentences":[{"n":1,"en":"There are many famous artists who are known all around the world, such as Monet and Picasso.","ko":"<민화: 한국의 민속 예술을 만나다> 모네와 피카소 등 전 세계에 알려진 수많은 유명 예술가가 있다.","grammar":[]},{"n":2,"en":"Most folk artists, on the other hand, are unknown, and their work is often seen as simple and irrelevant.","ko":"반면에 대부분의 민속 예술가는 잘 알려지지 않았고, 그들의 작품은 단순하고 중요하지 않은 것으로 여겨지는 경우가 많다.","grammar":[{"label":"their work is often seen","explanation":"their work is often seen — 작품 활동을 뭉뚱그린 work 는 불가산이라 is (✗ their work are)","transform_label":"is often seen as simple and irrelevant — 5형식 수동태 · see A as B → 능동태 — 행위자 people 을 주어로 세운다","transform_value":"… unknown, and people often see their work …"}]},{"n":3,"en":"However, folk art is important because it has a deep connection to the society that produced it.","ko":"그러나 민속 예술은 그것이 제작된 사회와 깊은 관련이 있기 때문에 중요하다.","grammar":[{"label":"the society that produced it","explanation":"the society that produced it — 주격 관계대명사 that · 사회가 민화를 낳았다 (✗ that it produced)"}]},{"n":4,"en":"In Korea, folk art is known as minhwa.","ko":"한국에서, 민속 예술은 민화라고 알려져 있다.","grammar":[]},{"n":5,"en":"Minhwa has existed for hundreds of years.","ko":"<책거리: 외국의 영향을 받은 민화> 민화는 수백 년 동안 존재해 왔다.","grammar":[]},{"n":6,"en":"In the late 18th century, during the Joseon Dynasty era, people began producing and selling minhwa on a large scale.","ko":"18세기 후반 조선 시대에, 사람들은 민화를 대규모로 생산하고 판매하기 시작했다.","grammar":[]},{"n":7,"en":"At the same time, trade with other countries brought new goods and ideas to Korea.","ko":"동시에, 다른 나라와의 무역은 한국으로 새로운 상품과 사상을 들여왔다.","grammar":[{"label":"brought new goods and ideas to Korea","explanation":"brought new goods and ideas to Korea — 3형식 + 전치사 to · 4형식으로 바꿔 쓸 수 있다"}]},{"n":8,"en":"This led to an interesting theme in minhwa ─ chaekgeori.","ko":"그것은 민화의 흥미로운 주제인 책거리로 이어졌다.","grammar":[]},{"n":9,"en":"Chaekgeori literally means \"books and things.\"","ko":"책거리는 말 그대로 '책과 사물'을 의미한다.","grammar":[]},{"n":10,"en":"Chaekgeori art was basically screen paintings of bookshelves.","ko":"책거리 예술은 기본적으로 책꽂이를 그린 병풍 그림이었다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3","text":"이름난 화가들을 견줄 한쪽에 놓는다 → 이름 없는 민속 예술가 쪽을 맞붙인다 → 그래도 값지다며 까닭과 함께 뒤집는다","refs":[1,2,3]},{"label":"전개","sentences":"S4 · S5 · S6 · S7","text":"우리말로 무엇이라 부르는지 밝힌다 → 그 그림이 오래되었음을 먼저 놓는다 → 크게 만들고 팔기 시작한 때를 못 박는다 → 같은 무렵의 무역이라는 사정을 겹친다","refs":[4,5,6,7]},{"label":"도착","sentences":"S8 · S9 · S10","text":"그 사정이 새 주제로 이어졌음을 잇는다 → 그 이름의 글자 뜻을 밝혀 준다 → 그 그림이 실제로 어떤 물건인지 못 박는다","refs":[8,9,10]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["이름난 화가들을 견줄 한쪽에 놓는다 → 이름 없는 민속 예술가 쪽을 맞붙인다 → 그래도 값지다며 까닭과 함께 뒤집는다","그 사정이 새 주제로 이어졌음을 잇는다 → 그 이름의 글자 뜻을 밝혀 준다 → 그 그림이 실제로 어떤 물건인지 못 박는다","책과 사물을 그린 병풍: 이름난 화가들을 견줄 한쪽에 놓는다 → 그 그림이 실제로 어떤 물건인지 못 박는다"],"answer":2,"why":"책과 사물을 그린 병풍: 이름난 화가들을 견줄 한쪽에 놓는다 → 그 그림이 실제로 어떤 물건인지 못 박는다","refs":[1,10]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["이름난 화가들을 견줄 한쪽에 놓는다 → 이름 없는 민속 예술가 쪽을 맞붙인다 → 그래도 값지다며 까닭과 함께 뒤집는다","앞의 사건과 관계없는 새 주제","그 사정이 새 주제로 이어졌음을 잇는다 → 그 이름의 글자 뜻을 밝혀 준다 → 그 그림이 실제로 어떤 물건인지 못 박는다"],"answer":2,"why":"그 사정이 새 주제로 이어졌음을 잇는다 → 그 이름의 글자 뜻을 밝혀 준다 → 그 그림이 실제로 어떤 물건인지 못 박는다","refs":[8,9,10]},{"type":"문법","q":"S2의 'their work is often seen' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","their work is often seen — 작품 활동을 뭉뚱그린 work 는 불가산이라 is (✗ their work are)"],"answer":2,"why":"… unknown, and people often see their work …","refs":[2]}],"key_sentence_en":"Chaekgeori art was basically screen paintings of bookshelves.","key_sentence_ko":"책거리 예술은 기본적으로 책꽂이를 그린 병풍 그림이었다.","image":"../../assets/gyeonghae2-textbook-chaekgeori-four-panel.webp","image_alt":"조선 후기 민화의 제작과 판매, 외국과의 무역으로 들어온 새로운 물건과 생각, 이를 책거리 주제로 바꾸어 그리는 과정, 책과 여러 사물이 놓인 책거리 병풍을 차례로 보여 주는 네 장면","image_caption":"S5–S10 · 민화의 대량 생산·판매 + 외국과의 교류 → 책과 사물을 그린 책거리 병풍"},{"id":"l2-06","title":"세계화와 사회 풍자","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"세계화와 사회 풍자: 누가 왜 그것을 주문했는지 밝힌다 → 또 다른 목적이 있었다며 결을 튼다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"누가 왜 그것을 주문했는지 밝힌다 → 선반의 물건이 무엇을 드러냈는지 짚는다 → 무역이 늘며 그림 속 물건도 달라졌음을 잇는다 → 그림에서 만나는 물건들을 늘어놓는다","refs":[1,2,3,4]},{"head":"전개","body":"물건에서 화풍으로 눈을 옮긴다 → 서양 기법이 어떤 느낌을 냈는지 밝힌다 → 그 이전 그림의 결을 맞붙여 차이를 보인다 → 이 그림이 시대의 변화를 비춘다고 닫는다 → 또 다른 그림 갈래를 꺼내 소개한다","refs":[5,6,7,8,9]},{"head":"도착","body":"앞의 그림과 달리 누구에게 사랑받았는지 짚는다 → 두 짐승이 지녔던 뜻을 밝힌다 → 그래서 집에 걸었다는 까닭을 잇는다 → 또 다른 목적이 있었다며 결을 튼다","refs":[10,11,12,13]}],"takeaway":"세계화와 사회 풍자: 누가 왜 그것을 주문했는지 밝힌다 → 또 다른 목적이 있었다며 결을 튼다"},"easy_story":"누가 왜 그것을 주문했는지 밝힌다 → 선반의 물건이 무엇을 드러냈는지 짚는다 → 무역이 늘며 그림 속 물건도 달라졌음을 잇는다 → 그림에서 만나는 물건들을 늘어놓는다. 물건에서 화풍으로 눈을 옮긴다 → 서양 기법이 어떤 느낌을 냈는지 밝힌다 → 그 이전 그림의 결을 맞붙여 차이를 보인다 → 이 그림이 시대의 변화를 비춘다고 닫는다 → 또 다른 그림 갈래를 꺼내 소개한다. 앞의 그림과 달리 누구에게 사랑받았는지 짚는다 → 두 짐승이 지녔던 뜻을 밝힌다 → 그래서 집에 걸었다는 까닭을 잇는다 → 또 다른 목적이 있었다며 결을 튼다.","blocking_vocab":[{"word":"perspective","meaning":"관점"},{"word":"chaekgeori","meaning":"책거리"},{"word":"exotic","meaning":"이국적인"}],"sentences":[{"n":1,"en":"Wealthy people at the time hired artists to create chaekgeori paintings specifically for them.","ko":"그 당시의 부유한 사람들은 책거리 그림을 특별히 자신만을 위해 제작하기 위해 화가를 고용했다.","grammar":[]},{"n":2,"en":"Having expensive and exotic items on the shelves showed how rich they were.","ko":"값비싸고 이국적인 물건들이 선반에 놓여 있는 것은 그들이 얼마나 부유한지를 보여주었다.","grammar":[{"label":"how rich they were","explanation":"how rich they were — 간접의문문의 어순","transform_label":"Having expensive and exotic items on the shelves showed — 동명사구 주어의 단수 취급 → to부정사 주어 — -ing 를 to + 동사원형으로 바꾼다","transform_value":"To have expensive and …"}]},{"n":3,"en":"As international trade brought more foreign goods into Korea, these items began appearing in chaekgeori paintings.","ko":"국제 무역이 더 많은 외국 물품을 한국에 들여오면서, 그 물건들은 책거리 그림에 나타나기 시작했다.","grammar":[]},{"n":4,"en":"For example, you can often find unusual fruit, plants, vases, and other exotic objects in them.","ko":"예를 들어, 특이한 과일, 식물, 화병과 다른 이국적인 물건들을 발견할 수 있다.","grammar":[]},{"n":5,"en":"Another effect of Korea's globalization can be seen in the style of the paintings.","ko":"한국 세계화의 또 다른 영향은 화풍에서 보여질 수 있다.","grammar":[]},{"n":6,"en":"Through Western techniques such as linear perspective and shading, the bookshelves and objects were made to appear highly realistic.","ko":"선 원근법과 음영 같은 서양의 기술로 책꽂이와 물건들은 매우 현실적으로 표현되었다.","grammar":[]},{"n":7,"en":"In contrast, traditional Korean paintings before this time favored curving lines and empty spaces.","ko":"반면에, 그 시대 이전의 한국 전통화들은 곡선과 여백을 선호했다.","grammar":[]},{"n":8,"en":"These chaekgeori paintings illustrate the great changes that were happening in Korea at that time.","ko":"이 책거리 그림들은 당시에 한국에서 일어나고 있었던 큰 변화를 보여준다.","grammar":[]},{"n":9,"en":"Another popular minhwa theme was kkachi horangi, which can be translated as \"magpie and tiger.\"","ko":"<까치호랑이의 사회 풍자> 민화에서 인기 있던 또 다른 주제는 '까치와 호랑이'로 해석될 수 있는 '까치호랑이'이다.","grammar":[{"label":"kkachi horangi, which can be translated as","explanation":"kkachi horangi, which can be translated as — 관계대명사의 계속적 용법","transform_label":"which can be translated → 접속사 + 대명사 — 계속적 용법을 접속사+대명사로 푼다","transform_value":"… kkachi horangi, and it can be …"}]},{"n":10,"en":"Unlike chaekgeori paintings, these paintings were popular with common people.","ko":"책거리 그림들과 다르게, 이 그림은 평민들에게 인기 있었다.","grammar":[]},{"n":11,"en":"Both magpies and tigers were believed to bring good luck.","ko":"까치와 호랑이는 둘 다 행운을 가져다준다고 생각되었다.","grammar":[]},{"n":12,"en":"Therefore, hanging these pictures in a home was thought to chase away evil.","ko":"그러므로, 이 그림을 집에 걸어 놓는 것은 악한 기운을 쫓아낸다고 여겨졌다.","grammar":[{"label":"hanging these pictures in a home was thought","explanation":"hanging these pictures in a home was thought — 동명사 주어 · 단수 취급 · 수동태","transform_label":"hanging these pictures in a home was thought — 동명사 주어의 단수 취급 → 능동 that절 — 행위자 people 을 세우고 that절로 편다","transform_value":"Therefore, people thought that hanging these … a home chased away evil."}]},{"n":13,"en":"However, there was another purpose as well ─ humor.","ko":"하지만 또 다른 목적인 해학도 있었다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"누가 왜 그것을 주문했는지 밝힌다 → 선반의 물건이 무엇을 드러냈는지 짚는다 → 무역이 늘며 그림 속 물건도 달라졌음을 잇는다 → 그림에서 만나는 물건들을 늘어놓는다","refs":[1,2,3,4]},{"label":"전개","sentences":"S5 · S6 · S7 · S8 · S9","text":"물건에서 화풍으로 눈을 옮긴다 → 서양 기법이 어떤 느낌을 냈는지 밝힌다 → 그 이전 그림의 결을 맞붙여 차이를 보인다 → 이 그림이 시대의 변화를 비춘다고 닫는다 → 또 다른 그림 갈래를 꺼내 소개한다","refs":[5,6,7,8,9]},{"label":"도착","sentences":"S10 · S11 · S12 · S13","text":"앞의 그림과 달리 누구에게 사랑받았는지 짚는다 → 두 짐승이 지녔던 뜻을 밝힌다 → 그래서 집에 걸었다는 까닭을 잇는다 → 또 다른 목적이 있었다며 결을 튼다","refs":[10,11,12,13]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["누가 왜 그것을 주문했는지 밝힌다 → 선반의 물건이 무엇을 드러냈는지 짚는다 → 무역이 늘며 그림 속 물건도 달라졌음을 잇는다 → 그림에서 만나는 물건들을 늘어놓는다","앞의 그림과 달리 누구에게 사랑받았는지 짚는다 → 두 짐승이 지녔던 뜻을 밝힌다 → 그래서 집에 걸었다는 까닭을 잇는다 → 또 다른 목적이 있었다며 결을 튼다","세계화와 사회 풍자: 누가 왜 그것을 주문했는지 밝힌다 → 또 다른 목적이 있었다며 결을 튼다"],"answer":2,"why":"세계화와 사회 풍자: 누가 왜 그것을 주문했는지 밝힌다 → 또 다른 목적이 있었다며 결을 튼다","refs":[1,13]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["누가 왜 그것을 주문했는지 밝힌다 → 선반의 물건이 무엇을 드러냈는지 짚는다 → 무역이 늘며 그림 속 물건도 달라졌음을 잇는다 → 그림에서 만나는 물건들을 늘어놓는다","앞의 사건과 관계없는 새 주제","앞의 그림과 달리 누구에게 사랑받았는지 짚는다 → 두 짐승이 지녔던 뜻을 밝힌다 → 그래서 집에 걸었다는 까닭을 잇는다 → 또 다른 목적이 있었다며 결을 튼다"],"answer":2,"why":"앞의 그림과 달리 누구에게 사랑받았는지 짚는다 → 두 짐승이 지녔던 뜻을 밝힌다 → 그래서 집에 걸었다는 까닭을 잇는다 → 또 다른 목적이 있었다며 결을 튼다","refs":[10,11,12,13]},{"type":"문법","q":"S2의 'how rich they were' 설명으로 알맞은 것은?","choices":["how rich they were — 간접의문문의 어순","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"To have expensive and …","refs":[2]}],"key_sentence_en":"However, there was another purpose as well ─ humor.","key_sentence_ko":"하지만 또 다른 목적인 해학도 있었다."},{"id":"l2-07","title":"상류층을 비웃는 까치","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"상류층을 비웃는 까치: 가운데 짐승이 무엇을 가리키는지 밝힌다 → 그리 보면 감상이 여행이 된다며 글을 닫는다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"가운데 짐승이 무엇을 가리키는지 밝힌다 → 크게 그리면서도 우스꽝스럽게 둔 점을 짚는다 → 가장자리 새가 누구를 가리키는지 밝힌다 → 크기에서 밀린다는 점을 먼저 둔다","refs":[1,2,3,4]},{"head":"전개","body":"그런데도 도리어 놀리고 있다고 뒤집는다 → 그 시절 신분이 갈려 있었음을 놓는다 → 그 그림이 아랫사람에게 준 몫을 짚는다","refs":[5,6,7]},{"head":"도착","body":"두 주제가 민속 예술의 값을 보여 준다고 묶는다 → 보고 즐길 거리만은 아니라고 못을 박는다 → 사회의 속을 들여다보게 해 줌을 밝힌다 → 그리 보면 감상이 여행이 된다며 글을 닫는다","refs":[8,9,10,11]}],"takeaway":"상류층을 비웃는 까치: 가운데 짐승이 무엇을 가리키는지 밝힌다 → 그리 보면 감상이 여행이 된다며 글을 닫는다"},"easy_story":"가운데 짐승이 무엇을 가리키는지 밝힌다 → 크게 그리면서도 우스꽝스럽게 둔 점을 짚는다 → 가장자리 새가 누구를 가리키는지 밝힌다 → 크기에서 밀린다는 점을 먼저 둔다. 그런데도 도리어 놀리고 있다고 뒤집는다 → 그 시절 신분이 갈려 있었음을 놓는다 → 그 그림이 아랫사람에게 준 몫을 짚는다. 두 주제가 민속 예술의 값을 보여 준다고 묶는다 → 보고 즐길 거리만은 아니라고 못을 박는다 → 사회의 속을 들여다보게 해 줌을 밝힌다 → 그리 보면 감상이 여행이 된다며 글을 닫는다.","blocking_vocab":[{"word":"journey","meaning":"여정"},{"word":"culture","meaning":"문화"},{"word":"folk art","meaning":"민속 예술"},{"word":"upper class","meaning":"상류층"}],"sentences":[{"n":1,"en":"In these paintings, the tiger positioned in the center of the canvas represents the upper class of Korean society.","ko":"이 그림에서 캔버스 중앙에 위치한 호랑이는 한국 사회의 상류층을 상징한다.","grammar":[{"label":"tiger positioned","explanation":"tiger positioned — 주격 관계대명사+be 생략 · tiger that is positioned"},{"label":"tiger positioned","explanation":"tiger positioned — 주격 관계대명사+be 생략 · tiger that is positioned"}]},{"n":2,"en":"Although it generally takes up the most space as the main focus of the painting, the tiger usually sits in a strange position with a silly expression on its face.","ko":"비록 그것이 일반적으로 그림의 주요한 부분으로 대부분의 공간을 차지하긴 하지만, 호랑이는 보통 우스꽝스러운 표정을 짓고 이상한 자세로 앉아 있다.","grammar":[{"label":"takes up the most space","explanation":"takes up the most space — 최상급","transform_label":"Although — although와 despite/in spite of → despite + 동명사 — 접속사 절을 전치사 + 동명사구로 줄인다","transform_value":"Despite generally taking up the …"}]},{"n":3,"en":"On the other hand, "explanation":"the type of situation that is analyzed — 선행사 situation을 받는 주격 관계대명사 that · is analyzed는 수동태"}]},{"n":2,"en":"Game theory is a mathematical approach to the study of human interaction and behavior.","ko":"게임 이론은 인간의 상호작용과 행동 연구에 대한 수학적 접근이다.","grammar":[]},{"n":3,"en":"More specifically, it analyzes situations where individuals, or \"players,\" make interdependent decisions.","ko":"더 구체적으로는, 그것은 개인 또는 '플레이어'가 상호 의존적인 결정을 내리는 상황을 분석한다.","grammar":[{"label":"situations where individuals","explanation":"situations where individuals — 선행사 situations를 받는 관계부사 where · in which로 바꿔 쓸 수 있음"},{"label":"individuals, or \"players,\" make interdependent decisions","explanation":"individuals, or \"players,\" make interdependent decisions — or가 앞말을 달리 부르는 동격 · individuals와 players는 같은 대상"}]},{"n":4,"en":"In such situations, or \"games,\" each individual has to consider how others might act when figuring out what to do.","ko":"이러한 상황, 즉 '게임'에서 각 개인은 무엇을 할지 결정할 때, 다른 사람들이 어떻게 행동할지를 고려해야 한다.","grammar":[{"label":"when figuring out","explanation":"when figuring out — 접속사를 남긴 분사구문 · when (each individual is) figuring out"},{"label":"what to do","explanation":"what to do — 의문사 + to부정사 · 「무엇을 할지」"}]},{"n":5,"en":"Game theory approaches such situations mathematically in order to determine the most optimal decisions that the \"players\" can make.","ko":"게임 이론은 '플레이어'가 내릴 수 있는 가장 최적의 결정을 확정하기 위해 그러한 상황에 수학적으로 접근한다.","grammar":[]},{"n":6,"en":"What was your decision in the imaginary situation above?","ko":"위에서 나온 가상의 상황에서 당신의 결정은 무엇이었는가?","grammar":[]},{"n":7,"en":"Game theory shows that the most rational strategy for each player is to confess.","ko":"게임 이론은 각 플레이어에게 가장 합리적인 전략은 자백하는 것이라는 것을 보여준다.","grammar":[]},{"n":8,"en":"That is because confessing brings about a better outcome for the individual no matter what the other player decides to do.","ko":"왜냐하면 자백은 다른 플레이어가 무엇을 하기로 결정하든, 개인에게는 더 나은 결과를 가져다주기 때문이다.","grammar":[]},{"n":9,"en":"The most rational strategy for the individual, though, is not always the best strategy for the group as a whole.","ko":"그러나 개인에게 가장 합리적인 전략이 집단 전체에게도 가장 좋은 전략이 되는 것은 아니다.","grammar":[]},{"n":10,"en":"The ideal outcome for the group, in which the total amount of time spent in prison is only two years, can only be achieved if both players remain silent.","ko":"집단에 이상적인 결과, 즉 감옥에서 보내는 총기간이 단지 2년이 되는 것은 두 플레이어가 모두 묵비권을 행사해야만 달성될 수 있다.","grammar":[]},{"n":11,"en":"Do you think you could trust your friend enough to make such a risky decision?","ko":"당신은 그렇게 위험한 결정을 내릴 만큼 당신의 친구를 충분히 신뢰할 수 있겠는가?","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"앞의 사례를 게임 이론에서 다루는 죄수의 딜레마로 소개한다 → 게임 이론은 인간의 상호작용과 행동을 수학적으로 연구한다 → 한 사람의 선택이 다른 사람의 선택과 얽혀 있는 상황을 다룬다 → 자신의 행동을 정하려면 상대가 어떻게 행동할지도 고려해야 한다","refs":[1,2,3,4]},{"label":"전개","sentences":"S5 · S6 · S7","text":"수학적 분석을 통해 가능한 최적의 선택을 찾는다 → 처음 제시한 상황에서 내린 선택을 다시 떠올리게 한다 → 각 개인의 합리적 선택은 자백이라는 결론을 제시한다","refs":[5,6,7]},{"label":"도착","sentences":"S8 · S9 · S10 · S11","text":"상대가 침묵하든 자백하든 자신에게는 자백하는 쪽의 형량이 더 짧다 → 개인의 합리적 선택과 집단 전체의 최선은 다를 수 있다 → 집단의 최선인 총 2년형은 두 사람 모두 침묵해야 실현된다 → 침묵이라는 공동 최선을 선택하려면 상대에 대한 신뢰가 필요하다","refs":[8,9,10,11]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["본문2 · P.71 · The Prisoner’s Dilemma: 앞의 사례를 게임 이론에서 다루는 죄수의 딜레마로 소개한다 → 침묵이라는 공동 최선을 선택하려면 상대에 대한 신뢰가 필요하다","앞의 사례를 게임 이론에서 다루는 죄수의 딜레마로 소개한다 → 게임 이론은 인간의 상호작용과 행동을 수학적으로 연구한다 → 한 사람의 선택이 다른 사람의 선택과 얽혀 있는 상황을 다룬다 → 자신의 행동을 정하려면 상대가 어떻게 행동할지도 고려해야 한다","상대가 침묵하든 자백하든 자신에게는 자백하는 쪽의 형량이 더 짧다 → 개인의 합리적 선택과 집단 전체의 최선은 다를 수 있다 → 집단의 최선인 총 2년형은 두 사람 모두 침묵해야 실현된다 → 침묵이라는 공동 최선을 선택하려면 상대에 대한 신뢰가 필요하다"],"answer":0,"why":"본문2 · P.71 · The Prisoner’s Dilemma: 앞의 사례를 게임 이론에서 다루는 죄수의 딜레마로 소개한다 → 침묵이라는 공동 최선을 선택하려면 상대에 대한 신뢰가 필요하다","refs":[1,11]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","상대가 침묵하든 자백하든 자신에게는 자백하는 쪽의 형량이 더 짧다 → 개인의 합리적 선택과 집단 전체의 최선은 다를 수 있다 → 집단의 최선인 총 2년형은 두 사람 모두 침묵해야 실현된다 → 침묵이라는 공동 최선을 선택하려면 상대에 대한 신뢰가 필요하다","앞의

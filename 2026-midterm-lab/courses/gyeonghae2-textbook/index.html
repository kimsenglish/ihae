</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">GYEONGHAE GIRLS' HIGH SCHOOL · GRADE 2</p><h1>영어독해와작문 교과서</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 1과·2과·3과 본문 2<br>Word 원문·공식 해석을 기준으로, 지문 흐름과 헷갈리는 문법만 클릭해 확인합니다.</div><div class="units" id="units"></div><p class="subnote">1·2과 전체와 3과 본문 2를 단락별로 읽을 수 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":{"id":"gyeonghae2-textbook","title":"경해여고2 영어독해와작문 교과서","grade":"고2"},"units":[{"id":"l1","label":"1과 · A Step to Spark Change","scope":"1과 본문 전체","passages":[{"id":"l1-01","title":"Ruth Bader Ginsburg 는 누구인가","core":"긴즈버그는 뛰어난 학생이었지만 여성이라는 이유로 차별을 겪었다. 그래도 학업을 이어 가 컬럼비아 로스쿨을 수석으로 졸업했다."},{"id":"l1-02","title":"뛰어난 성적에도 막힌 취업","core":"긴즈버그는 뛰어난 학력에도 차별 때문에 변호사 일자리를 구하기 어려웠다. 교수를 거쳐 법관이 된 뒤에도 성평등을 위해 일했다."},{"id":"l1-03","title":"성별을 가르지 않는 법","core":"긴즈버그가 도운 성평등의 변화는 여성만을 위한 것이 아니었다. 남성의 간병 세금 혜택과 여성의 독립적인 대출 권리도 포함된다."},{"id":"l1-04","title":"평생에 걸친 싸움","core":"남성만 받던 주립 학교의 입학 정책에 맞서, 긴즈버그는 여성에게도 같은 교육 기회가 있어야 한다고 주장했다."},{"id":"l1-05","title":"생각·감정·행동의 인지 삼각형","core":"생각·감정·행동은 서로 영향을 준다. 부정적인 순환이 생길 수 있지만, 어느 한 부분을 긍정적으로 바꾸면 다른 부분도 달라질 수 있다."},{"id":"l1-06","title":"생각을 따지고 감정을 받아들이기","core":"부정적인 생각은 사실인지 따져 보고, 감정은 무시하지 말고 먼저 받아들여야 한다. 그래야 생각과 감정을 바꿀 출발점이 생긴다."},{"id":"l1-07","title":"행동을 하나 바꾸기","core":"부정적 순환을 끊으려면 행동을 한꺼번에 바꾸려 하지 말고 작은 변화 하나부터 시작한다. 결과가 달라도 시도와 피드백은 다음에 도움이 된다."}]},{"id":"l2","label":"2과 · Listening to the Voice of Art","scope":"2과 본문 전체","passages":[{"id":"l2-01","title":"다음 장면을 궁금하게 하다","core":"다음 장면을 궁금하게 하다: 공이 담을 넘는 사건으로 이야기를 시작한다 → 무엇이 그렇게 만드는지 물어 본론을 연다"},{"id":"l2-02","title":"공감이 행동으로 이어지다","core":"공감이 행동으로 이어지다: 학자들이 무엇을 살폈는지 밝힌다 → 기부라는 실제 행동을 들어 앞말을 받친다"},{"id":"l2-03","title":"경험하듯 반응하는 뇌","core":"경험하듯 반응하는 뇌: 뇌가 실제처럼 반응한다는 결과로 화제를 옮긴다 → 그 앎이 공감과 유대로 이어진다고 닫는다"},{"id":"l2-04","title":"생각과 마음을 바꾸는 이야기","core":"생각과 마음을 바꾸는 이야기: 앞의 설명을 받칠 영화 한 편을 꺼낸다 → 이야기를 들려주겠다는 말로 글을 닫는다"},{"id":"l2-05","title":"책과 사물을 그린 병풍","core":"책과 사물을 그린 병풍: 이름난 화가들을 견줄 한쪽에 놓는다 → 그 그림이 실제로 어떤 물건인지 못 박는다"},{"id":"l2-06","title":"세계화와 사회 풍자","core":"세계화와 사회 풍자: 누가 왜 그것을 주문했는지 밝힌다 → 또 다른 목적이 있었다며 결을 튼다"},{"id":"l2-07","title":"상류층을 비웃는 까치","core":"상류층을 비웃는 까치: 가운데 짐승이 무엇을 가리키는지 밝힌다 → 그리 보면 감상이 여행이 된다며 글을 닫는다"}]},{"id":"l3-r2","label":"3과 · Mathematics around Us","scope":"3과 본문 2","passages":[{"id":"l3-r2-01","title":"본문2 · P.70 · Game Theory in Decision-Making","core":"본문2 · P.70 · Game Theory in Decision-Making: 범죄 혐의를 받는 두 친구의 의사 결정 상황을 가정한다 → 상대의 행동을 모르는 상태에서 어떤 선택을 할지 묻는다"},{"id":"l3-r2-02","title":"본문2 · P.71 · The Prisoner’s Dilemma","core":"본문2 · P.71 · The Prisoner’s Dilemma: 앞의 사례를 게임 이론에서 다루는 죄수의 딜레마로 소개한다 → 침묵이라는 공동 최선을 선택하려면 상대에 대한 신뢰가 필요하다"},{"id":"l3-r2-03","title":"본문2 · P.72 · From Competition to Cooperation","core":"본문2 · P.72 · From Competition to Cooperation: 사익 중심의 전략은 집단과 개인 모두에게 손해가 될 수 있다 → 게임 이론은 모두에게 좋은 결과를 가져오는 협력을 촉진할 수 있다"}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

</script></body></html>

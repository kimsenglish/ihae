</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">GYEONGHAE GIRLS' HIGH SCHOOL · GRADE 2</p><h1>영어독해와작문 교과서</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 1과·2과·3과 본문 2<br>Word 원문·공식 해석을 기준으로, 지문 흐름과 헷갈리는 문법만 클릭해 확인합니다.</div><div class="units" id="units"></div><p class="subnote">1·2과 전체와 3과 본문 2를 단락별로 읽을 수 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":{"id":"gyeonghae2-textbook","title":"경해여고2 영어독해와작문 교과서","grade":"고2"},"units":[{"id":"l1","label":"1과 · A Step to Spark Change","scope":"1과 본문 전체","passages":[{"id":"l1-01","title":"Ruth Bader Ginsburg 는 누구인가","core":"긴즈버그는 뛰어난 학생이었지만 여성이라는 이유로 차별을 겪었다. 그래도 학업을 이어 가 컬럼비아 로스쿨을 수석으로 졸업했다."},{"id":"l1-02","title":"뛰어난 성적에도 막힌 취업","core":"긴즈버그는 뛰어난 학력에도 차별 때문에 변호사 일자리를 구하기 어려웠다. 교수를 거쳐 법관이 된 뒤에도 성평등을 위해 일했다."},{"id":"l1-03","title":"성별을 가르지 않는 법","core":"긴즈버그가 도운 성평등의 변화는 여성만을 위한 것이 아니었다. 남성의 간병 세금 혜택과 여성의 독립적인 대출 권리도 포함된다."},{"id":"l1-04","title":"평생에 걸친 싸움","core":"남성만 받던 주립 학교의 입학 정책에 맞서, 긴즈버그는 여성에게도 같은 교육 기회가 있어야 한다고 주장했다."},{"id":"l1-05","title":"생각·감정·행동의 인지 삼각형","core":"생각·감정·행동은 서로 영향을 준다. 부정적인 순환이 생길 수 있지만, 어느 한 부분을 긍정적으로 바꾸면 다른 부분도 달라질 수 있다."},{"id":"l1-06","title":"생각을 따지고 감정을 받아들이기","core":"부정적인 생각은 사실인지 따져 보고, 감정은 무시하지 말고 먼저 받아들여야 한다. 그래야 생각과 감정을 바꿀 출발점이 생긴다."},{"id":"l1-07","title":"행동을 하나 바꾸기","core":"부정적 순환을 끊으려면 행동을 한꺼번에 바꾸려 하지 말고 작은 변화 하나부터 시작한다. 결과가 달라도 시도와 피드백은 다음에 도움이 된다."}]},{"id":"l2","label":"2과 · Listening to the Voice of Art","scope":"2과 본문 전체","passages":[{"id":"l2-01","title":"다음 장면을 궁금하게 하다","core":"이야기는 결말이 궁금한 순간에 멈추면 독자의 호기심과 기대를 키운다. 글은 이 짧은 예를 통해 좋은 이야기의 힘을 소개한다."},{"id":"l2-02","title":"공감이 행동으로 이어지다","core":"인물 중심의 이야기를 들을 때 옥시토신 수치가 높아졌고, 그 수치는 타인을 도우려는 마음과도 관련이 있었다는 연구를 소개한다."},{"id":"l2-03","title":"경험하듯 반응하는 뇌","core":"생생한 이야기는 뇌가 장면을 경험하듯 반응하게 한다. 또 감정과 교훈을 전달해 사람들 사이에 공감과 유대감을 만든다."},{"id":"l2-04","title":"생각과 마음을 바꾸는 이야기","core":"좋은 이야기는 겉의 재미 뒤에 의미를 담는다. 사람은 인물의 고민에 공감하며 자신을 더 이해하고 생각을 바꿀 수 있다."},{"id":"l2-05","title":"책과 사물을 그린 병풍","core":"민화는 단순한 그림이 아니라 그 시대 사회를 보여 준다. 조선 후기의 생산 확대와 외국 교류는 책과 사물을 그린 책거리로 이어졌다."},{"id":"l2-06","title":"세계화와 사회 풍자","core":"책거리에는 외국 물건과 서양의 그림 기법이 나타난다. 글은 이어서 평민에게 인기 있었던 다른 민화, 까치호랑이를 소개한다."},{"id":"l2-07","title":"상류층을 비웃는 까치","core":"까치호랑이는 작은 까치가 우스운 호랑이를 내려다보는 그림으로 계급 사회를 풍자한다. 민화는 당시 사람들의 가치관까지 보여 준다."}]},{"id":"l3-r2","label":"3과 · Mathematics around Us","scope":"3과 본문 2","passages":[{"id":"l3-r2-01","title":"본문2 · P.70 · Game Theory in Decision-Making","core":"서로 연락할 수 없는 두 사람이 각자 자백할지 침묵할지 골라야 한다. 두 사람의 선택이 합쳐져 형량이 달라진다."},{"id":"l3-r2-02","title":"본문2 · P.71 · The Prisoner’s Dilemma","core":"각자는 상대가 무엇을 하든 자백하면 자기 형량이 줄어든다. 하지만 두 사람의 형량을 합치면 둘 다 침묵하는 편이 더 낫다."},{"id":"l3-r2-03","title":"본문2 · P.72 · From Competition to Cooperation","core":"한 회사가 손님을 끌려고 가격을 내리면 경쟁사도 따라 내려 두 회사의 이익이 줄 수 있다. 각자의 이익만 좇은 선택이 모두에게 불리할 수 있다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('units').innerHTML=data.units.map((u,i)=>`<details class="unit" ${i===0?'open':''}><summary><div><h2>${esc(u.label)}</h2><span class="scope">${esc(u.scope)}</span></div><span class="count">${u.passages.length}지문</span></summary><div class="passages">${u.passages.map((p,j)=>`${u.passages.length>6&&j%5===0?`<h3 class="chunk-label">${j+1}–${Math.min(j+5,u.passages.length)}번</h3>`:''}<a class="passage" href="study.html#${esc(p.id)}"><b>${esc(p.title)}</b><span>${esc(p.core)}</span></a>`).join('')}</div></details>`).join('');
</script></body></html>

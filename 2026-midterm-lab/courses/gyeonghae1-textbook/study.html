/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items,.diagram.diagram-argument .diagram-items,

.diagram.diagram-steps-response .diagram-items,.diagram.diagram-cause-response .diagram-items,

.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card,.diagram.diagram-argument .diagram-card,
.diagram.diagram-steps-possible .diagram-card,.diagram.diagram-case-advice .diagram-card,
.diagram.diagram-steps-response .diagram-card,.diagram.diagram-cause-response .diagram-card,

.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-possible .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-case-advice .diagram-items .diagram-card:not(:last-child):after,

/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}

.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}

.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));

  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}

.diagram.diagram-dose .diagram-card b{font-size:18px}
/* Cooking: familiar side benefits are distinct from the source's energy-to-adaptation claim. */

.diagram.diagram-energy-route .diagram-card{position:relative;min-width:0;border-top:5px solid #237c5c;padding-top:35px;background:#fffdf8}
.diagram.diagram-energy-route .diagram-card:first-child{grid-column:1/-1;border:1px dashed #a9b8ad;background:#f8faf6;padding:10px 14px}
.diagram.diagram-energy-route .diagram-card:first-child:before{content:'먼저 떠오르는 장점';display:block;color:#65766b;font-size:11px;font-weight:800;margin-bottom:3px}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}
.diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'→';position:absolute;right:-19px;top:calc(50% - 16px);color:#176b52;font-size:26px;font-weight:900;z-index:1}
.diagram.diagram-energy-route .diagram-card:nth-child(2){background:#e5f4e9}.diagram.diagram-energy-route .diagram-card:nth-child(4){background:#fff2d9;border-top-color:#b78539}
/* Three alternative survival responses, not three consecutive steps. */
.diagram.diagram-reaction-options .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 10px}
.diagram.diagram-reaction-options .diagram-card:first-child{grid-column:1/-1;text-align:center;background:#dceee5;border:2px solid #82baa2;position:relative}
.diagram.diagram-reaction-options .diagram-card:first-child:after{content:'↙    ↓    ↘';position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:#176b52;font-weight:900;font-size:21px;white-space:pre}
.diagram.diagram-reaction-options .diagram-card:not(:first-child){text-align:center;border-top:5px solid #247b5b}

.diagram.diagram-reaction-options .diagram-card:not(:first-child):before{display:block;font-size:27px;line-height:1;margin-bottom:8px;color:#176b52}
.diagram.diagram-reaction-options .diagram-card:nth-child(2):before{content:'⏸'}.diagram.diagram-reaction-options .diagram-card:nth-child(3):before{content:'➜'}.diagram.diagram-reaction-options .diagram-card:nth-child(4):before{content:'↗'}

.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}

  margin-top:14px;padding:10px 12px;text-align:center;color:#14543f}
/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}

  color:#176b52;font-size:24px;line-height:1}

  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}

.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}

.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}

.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}

.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Three roles are simultaneous parts of one contrast, not a causal sequence. */
.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

<script id="course-data" type="application/json">{"course":{"id":"gyeonghae1-textbook","title":"경해여고1 공통영어2 교과서","grade":"고1"},"units":[{"id":"l1","label":"1과 · Make Your World a Better Place","scope":"p13–17 본문","passages":[{"id":"l1-01","title":"미래의 희망은 젊은이다","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"미래의 희망은 젊은이다: 미래에 희망을 주는 것들을 늘어놓아 말문을 연다 → 세 사람을 살펴보겠다고 읽을 길을 안내한다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"흐름 1","body":"미래에 희망을 주는 것들을 늘어놓아 말문을 연다","refs":[1]},{"head":"흐름 2","body":"그중에서도 어린 세대가 으뜸이라고 무게를 옮긴다","refs":[2]},{"head":"흐름 3","body":"이미 나서서 답을 찾는 이들이 있음을 든다","refs":[3]},{"head":"흐름 4","body":"세 사람을 살펴보겠다고 읽을 길을 안내한다","refs":[4]}],"takeaway":"미래의 희망은 젊은이다: 미래에 희망을 주는 것들을 늘어놓아 말문을 연다 → 세 사람을 살펴보겠다고 읽을 길을 안내한다"},"easy_story":"미래에 희망을 주는 것들을 늘어놓아 말문을 연다. 그중에서도 어린 세대가 으뜸이라고 무게를 옮긴다. 이미 나서서 답을 찾는 이들이 있음을 든다. 세 사람을 살펴보겠다고 읽을 길을 안내한다.","blocking_vocab":[{"word":"nonprofit","meaning":"비영리의"},{"word":"accountable","meaning":"책임 있는"},{"word":"committed to","meaning":"~에 헌신하는"},{"word":"inspirational","meaning":"영감을 주는"}],"sentences":[{"n":1,"en":"<Young Change-Makers Shaping the Future> There are a lot of things that fill us with hope for the future: technology, science, accountable leaders, and nonprofit organizations committed to doing good.","ko":"<미래를 만들어가는 젊은 변화를 만드는 사람들> 우리를 미래에 대한 희망으로 채우는 많은 것들이 있다: 기술, 과학, 책임감 있는 지도자들, 그리고 선을 행하는 데 전념하는 비영리 단체들.","grammar":[{"label":"that fill","explanation":"that fill — 주격 관계대명사 · 관계대명사절의 수 일치","transform_label":"There are — 유도부사 there 구문 → 일반 주어문 — There are를 지우고 명사구를 주어 자리로","transform_value":"A lot of things fill us with hope for the future: technology, science, accountable leaders, and nonprofit organizations committed to doing good."},{"label":"committed to doing","explanation":"committed to doing — 과거분사 후치수식 · be committed to + 동명사"}]},{"n":2,"en":"However, few things give us more hope for the future than young people.","ko":"그러나 젊은이들보다 우리에게 미래에 대한 더 많은 희망을 주는 것들은 거의 없다.","grammar":[]},{"n":3,"en":"Some young people are already working toward solutions for the problems their communities and the world are facing.","ko":"일부 젊은이들은 이미 그들의 공동체와 세계가 직면하고 있는 문제들에 대한 해결책을 향해 노력하고 있다.","grammar":[{"label":"problems their communities","explanation":"problems their communities — 목적격 관계대명사 생략 · problems that their communities","transform_label":"problems their communities — 목적격 관계대명사 생략 → that 복원 — problems 뒤 that 복원","transform_value":"… the problems that their communities …"}]},{"n":4,"en":"Let's look at three inspirational examples of these young people.","ko":"이 젊은이들의 세 가지 영감을 주는 예들을 살펴보자.","grammar":[]}],"structure":[],"flow":[{"label":"흐름 1","sentences":"S1","text":"미래에 희망을 주는 것들을 늘어놓아 말문을 연다","refs":[1]},{"label":"흐름 2","sentences":"S2","text":"그중에서도 어린 세대가 으뜸이라고 무게를 옮긴다","refs":[2]},{"label":"흐름 3","sentences":"S3","text":"이미 나서서 답을 찾는 이들이 있음을 든다","refs":[3]},{"label":"흐름 4","sentences":"S4","text":"세 사람을 살펴보겠다고 읽을 길을 안내한다","refs":[4]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["미래의 희망은 젊은이다: 미래에 희망을 주는 것들을 늘어놓아 말문을 연다 → 세 사람을 살펴보겠다고 읽을 길을 안내한다","미래에 희망을 주는 것들을 늘어놓아 말문을 연다","세 사람을 살펴보겠다고 읽을 길을 안내한다"],"answer":0,"why":"미래의 희망은 젊은이다: 미래에 희망을 주는 것들을 늘어놓아 말문을 연다 → 세 사람을 살펴보겠다고 읽을 길을 안내한다","refs":[1,4]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","세 사람을 살펴보겠다고 읽을 길을 안내한다","미래에 희망을 주는 것들을 늘어놓아 말문을 연다"],"answer":1,"why":"세 사람을 살펴보겠다고 읽을 길을 안내한다","refs":[4]},{"type":"문법","q":"S1의 'that fill' 설명으로 알맞은 것은?","choices":["that fill — 주격 관계대명사 · 관계대명사절의 수 일치","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"A lot of things fill us with hope for the future: technology, science, accountable leaders, and nonprofit organizations committed to doing good.","refs":[1]}],"key_sentence_en":"Let's look at three inspirational examples of these young people.","key_sentence_ko":"이 젊은이들의 세 가지 영감을 주는 예들을 살펴보자."},{"id":"l1-02","title":"Trisha Prabhu · 사이버 폭력을 막는 앱","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"Trisha Prabhu · 사이버 폭력을 막는 앱: 누가 무엇으로 무엇과 싸우는지 밝힌다 → 마음을 바꾼 비율로 효과를 못 박는다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"누가 무엇으로 무엇과 싸우는지 밝힌다 → 그 앱이 어떤 원리로 움직이는지 풀어 준다 → 실제로 뜨는 문구를 들어 작동을 눈에 보이게 한다","refs":[1,2,3]},{"head":"전개","body":"그가 접한 소식이 출발점이 되었음을 든다 → 충격이 만들기로 이어졌음을 잇는다","refs":[4,5]},{"head":"도착","body":"쓰인 범위와 달라진 눈길을 밝힌다 → 그 앱이 아이들에게 무엇을 해 주었는지 짚는다 → 마음을 바꾼 비율로 효과를 못 박는다","refs":[6,7,8]}],"takeaway":"Trisha Prabhu · 사이버 폭력을 막는 앱: 누가 무엇으로 무엇과 싸우는지 밝힌다 → 마음을 바꾼 비율로 효과를 못 박는다"},"easy_story":"누가 무엇으로 무엇과 싸우는지 밝힌다 → 그 앱이 어떤 원리로 움직이는지 풀어 준다 → 실제로 뜨는 문구를 들어 작동을 눈에 보이게 한다. 그가 접한 소식이 출발점이 되었음을 든다 → 충격이 만들기로 이어졌음을 잇는다. 쓰인 범위와 달라진 눈길을 밝힌다 → 그 앱이 아이들에게 무엇을 해 주었는지 짚는다 → 마음을 바꾼 비율로 효과를 못 박는다.","blocking_vocab":[{"word":"keyboard","meaning":"건반 악기"},{"word":"innovative","meaning":"혁신적인"},{"word":"cyberbullying","meaning":"사이버 폭력"}],"sentences":[{"n":1,"en":"<Combating Online Hate with ReThink> Trisha Prabhu, a young computer scientist from the U.S., is fighting cyberbullying with her innovative application ReThink.","ko":"<ReThink로 온라인 혐오와 맞서기> 미국의 젊은 컴퓨터 과학자인 트리샤 프라부는 그녀의 혁신적인 애플리케이션인 ReThink로 사이버 폭력과 싸우고 있다.","grammar":[]},{"n":2,"en":"ReThink is a virtual keyboard that uses artificial intelligence to detect potentially hurtful text messages before they are sent and prompts young people to pause and reconsider their words.","ko":"ReThink는 인공 지능을 사용하여 잠재적으로 상처를 주는 문자 메시지가 전송되기 전에 그것들을 감지하고 젊은 이들이 잠시 멈추고 그들의 말을 재고하도록 촉구하는 가상 키보드이다.","grammar":[]},{"n":3,"en":"When a user types a message that contains potentially offensive language, such as \"I hate you,\" ReThink prompts: \"Hold on! Are you sure you want to say that?\" or \"Remember. You are what you type!\"","ko":"사용자가 \"미워.\"와 같은 잠재적으로 공격적인 언어를 포함하는 메시지를 입력할 때 ReThink는 다음과 같이 프롬프트를 표시한다: \"잠깐만요! 정말 그렇게 말하고 싶나요?\" 또는 \"기억하세요. 당신은 당신이 입력한 것입니다!\"","grammar":[]},{"n":4,"en":"In 2014, when Trisha was just thirteen years old, she read the tragic news of a twelve-year-old girl who had been cyberbullied for over a year and a half.","ko":"2014년, 트리샤가 겨우 열세 살이었던 때 그녀는 일 년 반 이상 사이버 폭력을 당했던 열두 살 소녀의 비극적인 뉴스를 읽었다.","grammar":[]},{"n":5,"en":"Shocked at the story, she decided to prevent cyberbullying by using technology and created ReThink.","ko":"그 이야기에 충격을 받고 그녀는 기술을 사용하여 사이버 폭력을 막기로 결심하고 ReThink를 만들었다.","grammar":[]},{"n":6,"en":"ReThink has been used by schools and organizations worldwide and has successfully raised awareness on cyberbullying.","ko":"ReThink는 전 세계의 학교와 단체에 의해 사용되어 왔고 성공적으로 사이버 폭력에 대한 인식을 높였다.","grammar":[]},{"n":7,"en":"It has helped young people make better decisions in digital space where people could easily be unkind toward each other.","ko":"그것은 사람들이 서로에게 쉽사리 불친절할 수 있는 디지털 공간에서 젊은이들이 더 나은 결정을 내릴 수 있도록 도왔다.","grammar":[{"label":"has helped","explanation":"has helped — 현재완료","transform_label":"helped young people make — help + 동사원형 (✗ makes) → help + to부정사 — 원형부정사 앞에 to를 넣는다","transform_value":"… young people to make better …"},{"label":"digital space where","explanation":"digital space where — 관계부사"}]},{"n":8,"en":"In fact, it has been found that when using ReThink, adolescents change their minds 93% of the time and decide not to post offensive messages.","ko":"실제로 ReThink를 사용할 때 청소년들은 93%의 경우 마음을 바꾸고 공격적인 메시지를 게시하지 않기로 결정하는 것으로 밝혀졌다.","grammar":[{"label":"it has been found that","explanation":"it has been found that — 가주어 it + 진주어 that절 · 현재완료 수동태","transform_label":"when using ReThink — 부사절의 축약 · 주어 + be동사 생략 → 시간을 나타내는 부사절 — 생략된 주어를 넣고 분사를 정동사로 바꾼다","transform_value":"… that when they use ReThink, adolescents …"}]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3","text":"누가 무엇으로 무엇과 싸우는지 밝힌다 → 그 앱이 어떤 원리로 움직이는지 풀어 준다 → 실제로 뜨는 문구를 들어 작동을 눈에 보이게 한다","refs":[1,2,3]},{"label":"전개","sentences":"S4 · S5","text":"그가 접한 소식이 출발점이 되었음을 든다 → 충격이 만들기로 이어졌음을 잇는다","refs":[4,5]},{"label":"도착","sentences":"S6 · S7 · S8","text":"쓰인 범위와 달라진 눈길을 밝힌다 → 그 앱이 아이들에게 무엇을 해 주었는지 짚는다 → 마음을 바꾼 비율로 효과를 못 박는다","refs":[6,7,8] 원으로 삶을 바꾼 일로 화제를 넓힌다 → 손수 만든 세 가지를 꼽아 앞말을 받친다.","blocking_vocab":[{"word":"invent","meaning":"발명하다"},{"word":"generator","meaning":"발전기"},{"word":"transmitter","meaning":"송신기"},{"word":"affordable","meaning":"비용을 감당할 수 있는"}],"sentences":[{"n":1,"en":"<Inventing with Discarded Electronic Parts> Kelvin Doe, a self-taught inventor and engineer from Sierra Leone, has been fascinated with electronics since childhood.","ko":"<버려진 전자 부품으로 발명하기> 시에라리온 출신의 독학한 발명가이자 공학자인 켈빈 도는 어린 시절부터 전자 기기에 매료되어 왔다.","grammar":[]},{"n":2,"en":"He would often do experiments with discarded electronics he found in trash cans to create his own inventions.","ko":"그는 종종 자신의 발명품을 만들기 위해 쓰레기통에서 발견한 버려진 전자 기기로 실험을 하곤 했다.","grammar":[{"label":"electronics he","explanation":"electronics he — 목적격 관계대명사 생략 · electronics that he","transform_label":"electronics he found — 목적격 관계대명사 생략 → that 복원 — 선행사 뒤에 목적격 that을 되살린다","transform_value":"… discarded electronics that he found …"}]},{"n":3,"en":"In 2009, at the young age of thirteen, Kelvin built his own FM radio station by using a transmitter he made from discarded electronic parts.","ko":"2009년, 열세 살의 어린 나이에, 켈빈은 버려진 전자 부품으로 만든 송신기를 사용하여 자신만의 FM 라디오 방송국을 만들었다.","grammar":[{"label":"transmitter he made","explanation":"transmitter he made — 목적격 관계대명사 생략 · transmitter that he made","transform_label":"a transmitter he made — 목적격 관계대명사 생략 → which 복원 — transmitter 뒤 which 복원","transform_value":"… a transmitter which he made …"}]},{"n":4,"en":"In 2014, during the time when an Ebola outbreak affected Africa, Kelvin's radio station proved to be invaluable.","ko":"2014년, 에볼라 발병이 아프리카에 영향을 미쳤던 시기에, 켈빈의 라디오 방송국은 귀중한 것으로 증명되었다.","grammar":[]},{"n":5,"en":"With schools closed, his radio station provided educational programs to students over the radio.","ko":"학교가 문을 닫은 가운데, 그의 라디오 방송국은 학생들에게 라디오를 통해 교육 프로그램을 제공했다.","grammar":[]},{"n":6,"en":"This was especially important in his country, where the radio was the main source of media.","ko":"이것은 라디오가 미디어의 주요 공급원이었던 그의 나라에서 특히 중요했다.","grammar":[]},{"n":7,"en":"Kelvin also improved the lives of people around him by providing affordable resources.","ko":"켈빈은 또한 적당한 가격의 자원을 제공함으로써 그의 주변 사람들의 삶을 향상시켰다.","grammar":[]},{"n":8,"en":"He invented a battery capable of powering homes and small businesses, designed a generator that runs on salt water, and constructed a windmill to supply electricity to his community.","ko":"그는 가정과 소규모 사업체에 전력을 공급할 수 있는 배터리를 발명했고, 소금물로 작동하는 발전기를 설계했으며, 그의 지역 사회에 전기를 공급하기 위해 풍차를 건설했다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3","text":"어디 출신의 누구이며 무엇에 끌렸는지 밝힌다 → 남이 내다 버린 부품으로 실험하던 모습을 보인다 → 어린 나이에 세운 방송국을 든다","refs":[1,2,3]},{"label":"전개","sentences":"S4 · S5","text":"위기의 때에 그 방송국이 값졌음을 짚는다 → 학교가 닫힌 동안 교육을 전한 일을 든다","refs":[4,5]},{"label":"도착","sentences":"S6 · S7 · S8","text":"그 나라에서 라디오가 갖는 무게를 밝힌다 → 값싼 자원으로 삶을 바꾼 일로 화제를 넓힌다 → 손수 만든 세 가지를 꼽아 앞말을 받친다","refs":[6,7,8]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["어디 출신의 누구이며 무엇에 끌렸는지 밝힌다 → 남이 내다 버린 부품으로 실험하던 모습을 보인다 → 어린 나이에 세운 방송국을 든다","그 나라에서 라디오가 갖는 무게를 밝힌다 → 값싼 자원으로 삶을 바꾼 일로 화제를 넓힌다 → 손수 만든 세 가지를 꼽아 앞말을 받친다","Kelvin Doe · 버려진 부품으로 만든 발명: 어디 출신의 누구이며 무엇에 끌렸는지 밝힌다 → 손수 만든 세 가지를 꼽아 앞말을 받친다"],"answer":2,"why":"Kelvin Doe · 버려진 부품으로 만든 발명: 어디 출신의 누구이며 무엇에 끌렸는지 밝힌다 → 손수 만든 세 가지를 꼽아 앞말을 받친다","refs":[1,8]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["어디 출신의 누구이며 무엇에 끌렸는지 밝힌다 → 남이 내다 버린 부품으로 실험하던 모습을 보인다 → 어린 나이에 세운 방송국을 든다","앞의 사건과 관계없는 새 주제","그 나라에서 라디오가 갖는 무게를 밝힌다 → 값싼 자원으로 삶을 바꾼 일로 화제를 넓힌다 → 손수 만든 세 가지를 꼽아 앞말을 받친다"],"answer":2,"why":"그 나라에서 라디오가 갖는 무게를 밝힌다 → 값싼 자원으로 삶을 바꾼 일로 화제를 넓힌다 → 손수 만든 세 가지를 꼽아 앞말을 받친다","refs":[6,7,8]},{"type":"문법","q":"S2의 'electronics he' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","electronics he — 목적격 관계대명사 생략 · electronics that he"],"answer":2,"why":"… discarded electronics that he found …","refs":[2]}],"key_sentence_en":"He invented a battery capable of powering homes and small businesses, desi ers furniture and household essentials to families and individuals transitioning from homelessness to stable housing.","ko":"그것은 노숙에서 안정적인 주거로 전환하는 가족과 개인에게 가구와 가정 필수품을 제공하는 비영리 단체이다.","grammar":[{"label":"that offers","explanation":"that offers — 주격 관계대명사 · 단수","transform_label":"individuals transitioning — 현재분사 후치수식 → 관계사절 — 분사 앞에 who are를 되살린다","transform_value":"… and individuals who are transitioning from …"}]},{"n":3,"en":"He says, \"For people who have lived in their cars, in and out of shelters, and in the woods, to be home again is a triumph, a sense of peace, and something to be celebrated.\"","ko":"그는 \"그들의 차 안에서, 쉼터를 오가며, 그리고 숲에서 생활해 온 사람들에게 다시 집으로 돌아오는 것은 승리이며, 평화로움이며, 축하할 일입니 다.\"라고 말한다.","grammar":[{"label":"who have lived","explanation":"who have lived — 주격 관계대명사 · 현재완료 계속 용법","transform_label":"to be home again is — to부정사의 명사적 용법 · 주어 → 동명사 주어 — to be를 being으로 바꾼다","transform_value":"… the woods, being home again …"},{"label":"a triumph, a sense of peace","explanation":"a triumph, a sense of peace — 보어 병렬"}]},{"n":4,"en":"John's journey began in 2015.","ko":"존의 여정은 2015년에 시작되었다.","grammar":[]},{"n":5,"en":"At the age of twelve, he volunteered at a local shelter where people in need were staying.","ko":"열두 살 때 그는 도움이 필요한 사람들이 머물고 있는 지역 쉼터에서 자원봉사를 했다.","grammar":[]},{"n":6,"en":"He learned that many of the shelter residents worked hard to rent houses and trailers but faced difficulties in furnishing their new homes upon moving in.","ko":"그는 쉼터 거주자 중 많은 사람들이 집과 트레일러를 빌리려고 열심히 일하지만 이사를 하자마자 새 집을 가구로 꾸미는 데 어려움을 겪는다는 것을 알게 되었다.","grammar":[]},{"n":7,"en":"This prompted John to decide to do something for those transitioning out of homelessness.","ko":"이것은 존이 노숙 생활에서 벗어나는 사람들을 위해 무언가를 하기로 결심하게 했다.","grammar":[]},{"n":8,"en":"Needing donations to gather essential items to help them, John reached out to his family, friends, and neighbors.","ko":"그들을 돕기 위한 필수 물품을 모으기 위해 기부가 필요했기에 존은 가족, 친구, 이웃들에게 도움을 요청했다.","grammar":[]},{"n":9,"en":"As word of his efforts spread, donations began to rush in.","ko":"그의 노력에 대한 소문이 퍼지면서 기부가 쇄도하기 시작했다.","grammar":[]},{"n":10,"en":"So John was able to help more people get settled.","ko":"그래서 존은 더 많은 사람들이 정착할 수 있도록 도울 수 있었다.","grammar":[]},{"n":11,"en":"He said, \"I never knew the impact that a simple couch or a kitchen table could have. Furniture can restore the dignity of a family.\"","ko":"그는 \"저는 단순한 소파나 식탁이 미칠 수 있는 영향을 전혀 몰랐습니다. 가구는 가족의 존엄성을 회복시킬 수 있습니다.\"라고 말했다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"누가 언제 무엇을 세웠는지 밝힌다 → 그 단체가 하는 일을 풀어 준다 → 그의 말을 옮겨 일의 뜻을 대신 말하게 한다 → 그 여정의 시작 해를 못 박는다","refs":[1,2,3,4]},{"label":"전개","sentences":"S5 · S6 · S7","text":"어린 나이에 한 봉사 경험을 든다 → 그곳에서 알게 된 뜻밖의 어려움을 밝힌다 → 그 앎이 행동으로 이어졌음을 잇는다","refs":[5,6,7]},{"label":"도착","sentences":"S8 · S9 · S10 · S11","text":"물품을 모으려 주변에 손을 내민 일을 든다 → 이야기가 퍼지자 도움이 몰렸음을 알린다 → 그 덕에 더 많은 이를 도왔음을 잇는다 → 가구가 존엄을 되돌린다는 그의 말을 옮긴다","refs":[8,9,10,11]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["누가 언제 무엇을 세웠는지 밝힌다 → 그 단체가 하는 일을 풀어 준다 → 그의 말을 옮겨 일의 뜻을 대신 말하게 한다 → 그 여정의 시작 해를 못 박는다","물품을 모으려 주변에 손을 내민 일을 든다 → 이야기가 퍼지자 도움이 몰렸음을 알린다 → 그 덕에 더 많은 이를 도왔음을 잇는다 → 가구가 존엄을 되돌린다는 그의 말을 옮긴다","John Stagliano · 가구를 나누는 비영리 활동: 누가 언제 무엇을 세웠는지 밝힌다 → 가구가 존엄을 되돌린다는 그의 말을 옮긴다"],"answer":2,"why":"John Stagliano · 가구를 나누는 비영리 활동: 누가 언제 무엇을 세웠는지 밝힌다 → 가구가 존엄을 되돌린다는 그의 말을 옮긴다","refs":[1,11]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","물품을 모으려 주변에 손을 내민 일을 든다 → 이야기가 퍼지자 도움이 몰렸음을 알린다 → 그 덕에 더 많은 이를 도왔음을 잇는다 → 가구가 존엄을 되돌린다는 그의 말을 옮긴다","누가 언제 무엇을 세웠는지 밝힌다 → 그 단체가 하는 일을 풀어 준다 → 그의 말을 옮겨 일의 뜻을 대신 말하게 한다 → 그 여정의 시작 해를 못 박는다"],"answer":1,"why":"물품을 모으려 주변에 손을 내민 일을 든다 → 이야기가 퍼지자 도움이 몰렸음을 알린다 → 그 덕에 더 많은 이를 도왔음을 잇는다 → 가구가 존엄을 되돌린다는 그의 말을 옮긴다","refs":[8,9,10,11]},{"type":"문법","q":"S1의 'a young social activist from the U.S. who founded' 설명으로 알맞은 것은?","choices":["a young social activist from the U.S. who founded — 사람을 받는 주격 관계대명사 who","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동 건사할 수 있음을 든다. 앞의 설명을 받칠 실물 하나를 꺼낸다 → 그것이 어떤 문제를 더는지 밝힌다 → 하루에 얻는 물의 양으로 성능을 보인다 → 물을 모으는 첫 방식을 보인다. 공기 중 물기까지 거두는 두 번째 방식을 잇는다 → 단순함이 이 물건의 힘임을 짚는다 → 짧은 시간에 지을 수 있음을 들어 앞말을 받친다 → 이 사례가 무엇을 증명하는지로 읽을거리를 닫는다.","blocking_vocab":[{"word":"sustainable","meaning":"지속 가능한"},{"word":"appropriate technology","meaning":"적정 기술"},{"word":"renewable","meaning":"재생 가능한"},{"word":"maintain","meaning":"유지·관리하다"},{"word":"affordable","meaning":"비용을 감당할 수 있는"}],"sentences":[{"n":1,"en":"<Appropriate Technology> Appropriate technology refers to technological solutions that are designed to suitably meet the specific needs of a community.","ko":"<적정 기술> 적정 기술이란 지역 사회의 특정한 요구를 적합하게 충족하도록 설계된 기술적 해결책을 말한다.","grammar":[]},{"n":2,"en":"Such technologies typically utilize locally available resources, so they reduce costs and promote local industries.","ko":"그러한 기술은 일반적으로 지역에서 이용 가능한 자원을 활용하기 때문에 비용을 줄이고 지역 산업을 촉진한다.","grammar":[{"label":"reduce costs and promote local industries","explanation":"reduce costs and promote local industries — 동사 병렬","transform_label":"so they reduce — 결과를 나타내는 접속사 so → 이유를 나타내는 부사절 because — 앞 절을 because절로 돌리고 so를 지운다","transform_value":"Because such technologies …"}]},{"n":3,"en":"These technologies are environmentally sustainable because they rely on renewable resources.","ko":"이러한 기술은 재생 가능한 자원에 의존하기 때문에 환경적으로 지속 가능하다.","grammar":[]},{"n":4,"en":"Additionally, their designs are easy to use, which allows local communities to maintain the technologies without specialized training.","ko":"게다가, 그들의 설계는 사용이 쉽기 때문에 지역 사회가 전문적인 교육 없이 기술을 유지할 수 있다.","grammar":[]},{"n":5,"en":"The Warka Tower is one good example of appropriate technology.","ko":"와카 타워는 적정 기술의 좋은 예 중 하나이다.","grammar":[]},{"n":6,"en":"This tower helps with the lack of clean water in many regions.","ko":"이 타워는 많은 지역에서 깨끗한 물이 부족한 것을 돕는다.","grammar":[]},{"n":7,"en":"It employs natural processes to deliver 100 liters of clean water daily.","ko":"그것은 매일 백 리터의 깨끗한 물을 공급하기 위해 자연 공정을 사용한다.","grammar":[]},{"n":8,"en":"It gathers rainwater in a pot at its base.","ko":"그것은 바닥에 있는 냄비에 빗물을 모은다.","grammar":[]},{"n":9,"en":"Additionally, the tower captures fog and changes it into water drops that collect on nets, and then the water drops fall into the pot.","ko":"또한, 그 타워는 안개를 포집하여 그물에 모이는 물방울로 변화시키고, 그 물방울이 냄비 안으로 떨어진다.","grammar":[{"label":"captures","explanation":"captures · changes — 동사 병렬 · 주어–동사 수 일치"},{"label":"that collect on nets","explanation":"that collect on nets — 주격 관계대명사 · 복수"}]},{"n":10,"en":"One of the tower's strengths is that it is simple.","ko":"그 타워의 장점 중 하나는 간단하다는 것이다.","grammar":[]},{"n":11,"en":"A small team can construct it in just one day by using eco-friendly materials like soil, wood, and natural fiber nets.","ko":"흙, 나무, 천연 섬유망과 같은 친환경 재료를 사용하여 소규모 팀이 하루 만에 그것을 만들 수 있다.","grammar":[{"label":"materials like soil, wood, and natural fiber nets","explanation":"materials like soil, wood, and natural fiber nets — 명사 병렬","transform_label":"by using eco-friendly materials — 전치사 + 동명사 → 가목적어 it 구문 — 동명사를 주어로, make it possible for A to B로","transform_value":"Using eco-friendly materials like soil, wood, and natural fiber nets makes it possible for a small team to construct the tower in just one day."}]},{"n":12,"en":"Truly, the Warka Tower demonstrates how appropriate technology can solve local issues in a way that is affordable, effective, and eco-friendly.","ko":"실제로, 와카 타워는 어떻게 적정 기술이 경제적이고 효율적이며 친환경적인 방법으로 지역 문제를 해결할 수 있는지를 보여 준다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"딸린 읽을거리의 열쇠말 뜻을 세워 준다 → 지역 자원을 쓴다는 점과 그 이득을 든다 → 재생 자원에 기대어 환경에 맞음을 든다 → 다루기 쉬워 스스로 건사할 수 있음을 든다","refs":[1,2,3,4]},{"label":"전개","sentences":"S5 · S6 · S7 · S8","text":"앞의 설명을 받칠 실물 하나를 꺼낸다 → 그것이 어떤 문제를 더는지 밝힌다 → 하루에 얻는 물의 양으로 성능을 보인다 → 물을 모으는 첫 방식을 보인다","refs":[5,6,7,8]},{"label":"도착","sentences":"S9 · S10 · S11 · S12","text":"공기 중 물기까지 거두는 두 번째 방식을 잇는다 → 단순함이 이 물건의 힘임을 짚는다 → 짧은 시간에 지을 수 있음을 들어 앞말을 받친다 → 이 사례가 무엇을 증명하는지로 읽을거리를 닫는다","refs":[9,10,11,12]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["공기 중 물기까지 거두는 두 번째 방식을 잇는다 → 단순함이 이 물건의 힘임을 짚는다 → 짧은 시간에 지을 수 있음을 들어 앞말을 받친다 → 이 사례가 무엇을 증명하는지로 읽을거리를 닫는다","적정기술과 Warka Tower: 딸린 읽을거리의 열쇠말 뜻을 세워 준다 → 이 사례가 무엇을 증명하는지로 읽을거리를 닫는다","딸린 읽을거리의 열쇠말 뜻을 세워 준다 → 지역 자원을 쓴다는 점과 그 이득을 든다 → 재생 자원에 기대어 환경에 맞음을 든다 → 다루기 쉬워 스스로 건사할 수 있음을 든다"],"answer":1,"why":"적정기술과 Warka Tower: 딸린 읽을거리의 열쇠말 뜻을 세워 준다 → 이 사례가 무엇을 증명하는지로 읽을거리를 닫는다","refs":[1,12]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","공기 중 물기까지 거두는 두 번째 방식을 잇는다 → 단순함이 이 물건의 힘임을 짚는다 → 짧은 시간에 지을 수 있음을 들어 앞말을 받친다 → 이 사례가 무엇을 증명하는지로 읽을거리를 닫는다","딸린 읽을거리의 열쇠말 뜻을 세워 준다 → 지역 자원을 쓴다는 점과 그 이득을 든다 → 재생 자원에 기대어 환경에 맞음을 든다 → 다루기 쉬워 스스로 건사할 수 있음을 든다"],"answer":1,"why":"공기 중 물기까지 거두는 두 번째 방식을 잇는다 → 단순함이 이 물건의 힘임을 짚는다 → 짧은 시간에 지을 수 있음을 들어 앞말을 받친다 → 이 사례가 무엇을 증명하는지로 읽을거리를 닫는다","refs":[9,10,11,12]},{"type":"문법","q":"S2의 'reduce costs and promote local industries' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","reduce costs and promote local industries — 동사 병렬","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"Because such technologies …","refs":[2]}],"key_sentence_en":"Truly, the Warka Tower demonstrates how appropriate technology can solve local issues in a way that is affordable, effective, and eco-friendly.","key_sentence_ko":"실제로, 와카 타워는 어떻게 적정 기술이 경제적이고 효율적이며 친환경적인 방법으로 지역 문제를 해결할 수 있는지를 보여 준다.","image":"../../assets/gyeonghae1-textbook-warka-six-panel.webp","image_alt":"깨끗한 물이 부족한 마을에서 자연 재료로 와르카 타워를 짓고, 빗물과 안개를 그물에 모아 물방울로 응결시켜 바닥 항아리에 저장한 뒤 마을 사람들이 사용하는 여섯 장면","image_caption":"S6–S12 · 빗물 저장 → 안개를 그물에 포집 → 물방울 응결·낙하 → 지역에 깨끗한 물 제공"}]},{"id":"l2","label":"2과 · From Tradition to Trend","scope":"p35–39 본문","passages":[{"id":"l2-01","title":"손끝에서 이루어지는 배달","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"손끝에서 이루어지는 배달: 하루 안에 다 배달된다는 사실로 말문을 연다 → 그 내력을 묻는 말로 본론을 연다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"하루 안에 다 배달된다는 사실로 말문을 연다 → 배달 자체보다 여기서만 자란 결을 짚는다","refs":[1,2]},{"head":"전개","body":"때·물건·장소를 가리지 않는다는 점을 넓혀 설명한다 → 앱이 가게를 줄 세우는 기준들을 늘어놓는다","refs":[3,4]},{"head":"도착","body":"손끝 하나로 끝난다는 말로 앞 설명을 감싼다 → 그 내력을 묻는 말로 본론을 연다","refs":[5,6]}],"takeaway":"손끝에서 이루어지는 배달: 하루 안에 다 배달된다는 사실로 말문을 연다 → 그 내력을 묻는 말로 본론을 연다"},"easy_story":"하루 안에 다 배달된다는 사실로 말문을 연다 → 배달 자체보다 여기서만 자란 결을 짚는다. 때·물건·장소를 가리지 않는다는 점을 넓혀 설명한다 → 앱이 가게를 줄 세우는 기준들을 늘어놓는다. 손끝 하나로 끝난다는 말로 앞 설명을 감싼다 → 그 내력을 묻는 말로 본론을 연다.","blocking_vocab":[{"word":"culture","meaning":"문화"},{"word":"delivery","meaning":"배달"},{"word":"limited to","meaning":"~에 국한된"},{"word":"various standards","meaning":"다양한 기준"},{"word":"literally","meaning":"말 그대로"}],"sentences":[{"n":1,"en":"In Korea, nearly anything can be delivered within twenty-four hours.","ko":"<K-배달, 신속하고 믿음직하다> 한국에서는, 거의 모든 것이 24시간 이내에 배달될 수 있다.","grammar":[{"label":"nearly anything can be delivered","explanation":"nearly anything can be delivered — 조동사 + 수동태 · 부사 nearly","transform_label":"nearly anything can be delivered within twenty-four hours — 조동사의 수동태 → 능동태 — 행위자를 주어로 올리고 be p.p. 를 원형으로","transform_value":"In Korea, people can deliver nearly anything …"}]},{"n":2,"en":"Delivery is not limited to Korea; however, a unique culture has developed around the Korean delivery industry.","ko":"배달은 한국에만 국한된 것은 아니다. 그러나, 독특한 문화가 한국 배달 산업을 중심으로 발달하였다.","grammar":[{"label":"a unique culture has developed","explanation":"a unique culture has developed — 현재완료 능동 · develop 은 자동사 「스스로 발달하다」","transform_label":"be limited to N → be restricted to N — ~에 국한되다","transform_value":"… is not restricted to Korea; …"}]},{"n":3,"en":"People in Korea can order whatever they want whenever they want and have it delivered wherever they want.","ko":"한국에 있는 사람들은 그들이 원하는 때라면 언제든지 그들이 원하는 것이 무엇이든 주문할 수 있고, 그들이 원하는 곳이라면 어디든지 그것을 배달 받을 수 있다.","grammar":[]},{"n":4,"en":"Delivery apps rank stores by various standards: review scores, popularity, price, delivery fee, and distance, to name a few.","ko":"배달 애플리케이션은 다양한 기준으로 상점들의 순위를 매긴다. 예를 들자면, 후기 점수, 인기, 가격, 배달료, 그리고 거리 등.","grammar":[]},{"n":5,"en":"The speedy delivery of purchased items to your house is literally at the tips of your fingers.","ko":"구매한 물건이 당신의 집으로 빠르게 배달 되는 것은 말 그대로 당신 손가락 끝에 달려 있다.","grammar":[]},{"n":6,"en":"What is the history behind this culture?","ko":"이 문화 이면의 역사는 무엇일까?","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2","text":"하루 안에 다 배달된다는 사실로 말문을 연다 → 배달 자체보다 여기서만 자란 결을 짚는다","refs":[1,2]},{"label":"전개","sentences":"S3 · S4","text":"때·물건·장소를 가리지 않는다는 점을 넓혀 설명한다 → 앱이 가게를 줄 세우는 기준들을 늘어놓는다","refs":[3,4]},{"label":"도착","sentences":"S5 · S6","text":"손끝 하나로 끝난다는 말로 앞 설명을 감싼다 → 그 내력을 묻는 말로 본론을 연다","refs":[5,6]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["하루 안에 다 배달된다는 사실로 말문을 연다 → 배달 자체보다 여기서만 자란 결을 짚는다","손끝 하나로 끝난다는 말로 앞 설명을 감싼다 → 그 내력을 묻는 말로 본론을 연다","손끝에서 이루어지는 배달: 하루 안에 다 배달된다는 사실로 말문을 연다 → 그 내력을 묻는 말로 본론을 연다"],"answer":2,"why":"손끝에서 이루어지는 배달: 하루 안에 다 배달된다는 사실로 말문을 연다 → 그 내력을 묻는 말로 본론을 연다","refs":[1,6]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["손끝 하나로 끝난다는 말로 앞 설명을 감싼다 → 그 내력을 묻는 말로 본론을 연다","하루 안에 다 배달된다는 사실로 말문을 연다 → 배달 자체보다 여기서만 자란 결을 짚는다","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"손끝 하나로 끝난다는 말로 앞 설명을 감싼다 → 그 내력을 묻는 말로 본론을 연다","refs":[5,6]},{"type":"문법","q":"S1의 'nearly anything can be delivered' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","nearly anything can be delivered — 조동사 + 수동태 · 부사 nearly","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"In Korea, people can deliver nearly anything …","refs":[1]}],"key_sentence_en":"What is the history behind this culture?","key_sentence_ko":"이 문화 이면의 역사는 무엇일까?"},{"id":"l2-02","title":"속도와 상호 신뢰의 전통","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"속도와 상호 신뢰의 전통: 옛 일기라는 첫 증거를 꺼낸다 → 그것이 오늘의 배달로 이어졌으리라 내다본다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"옛 일기라는 첫 증거를 꺼낸다 → 그 일기에 무엇이 적혔는지 옮긴다 → 그 기록이 무엇을 증명하는지 값매긴다 → 편지를 나르던 옛 직업을 든다 → 주소가 없던 때라 갖춰야 했던 능력을 짚는다","refs":[1,2,3,4,5]},{"head":"전개","body":"삯을 매기던 기준을 덧붙인다 → 다음 시기의 배달 전문가로 눈을 옮긴다 → 속도를 높이려 탈것을 썼음을 덧붙인다 → 주문에서 배달까지의 차례를 보인다","refs":[6,7,8,9]},{"head":"도착","body":"실수가 거의 없었다고 한마디로 못 박는다 → 큰돈도 정확히 날랐다는 사실로 앞말을 받친다 → 확인조차 않던 손님 모습으로 믿음을 보인다 → 이 제도가 무엇에 기댄 것인지 밝힌다 → 그것이 오늘의 배달로 이어졌으리라 내다본다","refs":[10,11,12,13,14]}],"takeaway":"속도와 상호 신뢰의 전통: 옛 일기라는 첫 증거를 꺼낸다 → 그것이 오늘의 배달로 이어졌으리라 내다본다"},"easy_story":"옛 일기라는 첫 증거를 꺼낸다 → 그 일기에 무엇이 적혔는지 옮긴다 → 그 기록이 무엇을 증명하는지 값매긴다 → 편지를 나르던 옛 직업을 든다 → 주소가 없던 때라 갖춰야 했던 능력을 짚는다. 삯을 매기던 기준을 덧붙인다 → 다음 시기의 배달 전문가로 눈을 옮긴다 → 속도를 높이려 탈것을 썼음을 덧붙인다 → 주문에서 배달까지의 차례를 보인다. 실수가 거의 없었다고 한마디로 못 박는다 → 큰돈도 정확히 날랐다는 사실로 앞말을 받친다 → 확인조차 않던 손님 모습으로 믿음을 보인다 → 이 제도가 무엇에 기댄 것인지 밝힌다 → 그것이 오늘의 배달로 이어졌으리라 내다본다.","blocking_vocab":[{"word":"culture","meaning":"문화"},{"word":"delivery","meaning":"배달"},{"word":"messenger","meaning":"전인, 심부름꾼"}],"sentences":[{"n":1,"en":"In 1768, Hwang Yun-seok, a scholar, made a diary entry after taking the gwageo, a public service entrance exam.","ko":"1768년에 학자인 황윤석은 관리 채용 시험인 과거에 응시한 후 일기 기록을 남겼다.","grammar":[]},{"n":2,"en":"He wrote that he and his friends had ordered a delivery of naengmyeon for lunch.","ko":"그는 그와 그의 친구들이 점심 식사로 냉면 배달을 시켰다고 썼다.","grammar":[]},{"n":3,"en":"Hwang's diary is the first historical document indicating Koreans have been delivering food for at least two and a half centuries.","ko":"황윤석의 일기는 한국인들이 최소한 두 세기 반 동안 음식을 배달해 왔음을 보여 주는 최초의 역사적 기록물이다.","grammar":[]},{"n":4,"en":"During the Joseon period, specialized people called jeonin delivered letters for a fee.","ko":"조선 시대 동안, 전인이라고 불리는 전문화된 사람들이 돈을 받고 편지를 배달했다.","grammar":[]},{"n":5,"en":"In the days before the modern address systems, letters were delivered by name and place of residence, so a jeonin had to know the local areas like the back of his hand.","ko":"현대 주소 시스템이 있기 이전 시대에 편지는 이름과 거주지에 따라 배달되었으므로 전인은 해당 지역을 매우 잘 알고 있어야만 했다.","grammar":[]},{"n":6,"en":"Service prices were determined by schedule and distance.","ko":"서비스 가격은 일정과 거리에 따라 결정되었다.","grammar":[]},{"n":7,"en":"During the Japanese colonial period, Seoul's streets were filled with delivery professionals called \"messengers,\" most working for a company named Yongdalsa.","ko":"일제 강점기 동안, 서울의 거리는 '메신저'라고 불리는 배달 전문인들로 가득 차 있었는데, 그들 대부분은 용달사라는 이름의 회사에서 일하고 있었다.","grammar":[{"label":"professionals called","explanation":"professionals called — 주격 관계대명사+be 생략 · professionals who were called","transform_label":"most working for a company named Yongdalsa — 독립분사구문 · 의미상 주어가 따로 있다 → 등위절 — 의미상 주어 most 를 그대로 주어로 세운다","transform_value":"… called \"messengers,\" and most of them worked for a …"},{"label":"company named","explanation":"company named — 주격 관계대명사+be 생략 · company that was named","transform_label":"be filled with N → be full of N — ~로 가득 차다","transform_value":"… streets were full of delivery professionals …"}]},{"n":8,"en":"Many used bikes to speed up delivery.","ko":"많은 이들이 배달 속도를 높이기 위해서 자전거를 사용했다.","grammar":[]},{"n":9,"en":"When customers contacted Yongdalsa, a messenger went to pick up the item and then delivered it.","ko":"고객들이 용달사에 연락을 취하면, 메신저가 물건을 가지러 와서는 그것을 배달했다.","grammar":[]},{"n":10,"en":"Delivery mistakes were rare.","ko":"배달 실수는 드물었다.","grammar":[]},{"n":11,"en":"Messengers were sometimes charged with carrying large bundles of cash, but they were unfailingly honest and accurate.","ko":"메신저들은 때때로 다량의 현금 배달을 담당하기도 했는데, 그들은 변함없이 정직하고 정확했다.","grammar":[]},{"n":12,"en":"Customers trusted the messengers so much that they often did not check the items they received.","ko":"고객들은 메신저를 매우 믿었기에 종종 그들이 받은 물품을 확인하지도 않았다.","grammar":[{"label":"items they received","explanation":"items they received — 목적격 관계대명사 생략 · items that they received","transform_label":"trusted the messengers so much that they often did not check the items they received — so ~ that 구문 → that 복원 — items 와 they 사이에 that 이 숨어 있다","transform_value":"… the items that they received."}]},{"n":13,"en":"This messenger service was unique to Korea and was based on a culture of mutual trust and a hunger for speed.","ko":"이러한 메신 배달로 이어졌으리라 내다본다","refs":[10,11,12,13,14]},{"type":"문법","q":"S7의 'professionals called' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","professionals called — 주격 관계대명사+be 생략 · professionals who were called"],"answer":2,"why":"… called \"messengers,\" and most of them worked for a …","refs":[7]}],"key_sentence_en":"It is possible that this paved the way for modern motorcycle delivery.","key_sentence_ko":"이것이 현대의 오토바이 배달의 토대를 닦았을 가능성이 있다."},{"id":"l2-03","title":"도시화와 배달 수요","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"도시화와 배달 수요: 해방 뒤 나라가 갈린 사정을 놓는다 → 배달 영역이 커졌다고 이 대목을 닫는다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"해방 뒤 나라가 갈린 사정을 놓는다 → 이어 전쟁이 터졌음을 잇는다 → 그 격변에 배달 체계가 무너졌음을 밝힌다","refs":[1,2,3]},{"head":"전개","body":"다시 자라난 때를 못 박아 흐름을 돌린다 → 사람이 도시로 몰린 사정을 든다 → 그 몰림이 수요를 키웠음을 잇는다 → 신문과 우유라는 첫 인기 품목을 든다","refs":[4,5,6,7]},{"head":"도착","body":"점심때 도심의 모습을 그려 보인다 → 보자기 도시락이라는 다음 시기 모습을 든다 → 배달 영역이 커졌다고 이 대목을 닫는다","refs":[8,9,10]}],"takeaway":"도시화와 배달 수요: 해방 뒤 나라가 갈린 사정을 놓는다 → 배달 영역이 커졌다고 이 대목을 닫는다"},"easy_story":"해방 뒤 나라가 갈린 사정을 놓는다 → 이어 전쟁이 터졌음을 잇는다 → 그 격변에 배달 체계가 무너졌음을 밝힌다. 다시 자라난 때를 못 박아 흐름을 돌린다 → 사람이 도시로 몰린 사정을 든다 → 그 몰림이 수요를 키웠음을 잇는다 → 신문과 우유라는 첫 인기 품목을 든다. 점심때 도심의 모습을 그려 보인다 → 보자기 도시락이라는 다음 시기 모습을 든다 → 배달 영역이 커졌다고 이 대목을 닫는다.","blocking_vocab":[{"word":"delivery","meaning":"배달"},{"word":"urbanization","meaning":"도시화"},{"word":"upheaval","meaning":"격변, 대혼란"},{"word":"demand","meaning":"수요"}],"sentences":[{"n":1,"en":"After Korea's liberation from colonial rule, it was divided into two.","ko":"식민지 지배에서 한국이 해방된 후, 한국은 둘로 나뉘었다.","grammar":[]},{"n":2,"en":"Then came the Korean War (1950-1953).","ko":"그리고는 한국 전쟁(1950-1953)이 발발했다.","grammar":[{"label":"문장 전환","explanation":"Then came the Korean War — 부사가 앞선 도치 → 본래 어순 — 부사 뒤로 넘어갔던 주어를 동사 앞으로 되돌린다","transform_label":"Then came the Korean War — 부사가 앞선 도치 → 본래 어순 — 부사 뒤로 넘어갔던 주어를 동사 앞으로 되돌린다","transform_value":"… War (1950-1953) came."}]},{"n":3,"en":"During this series of upheavals, Korea's delivery system fell apart.","ko":"이 일련의 격변 동안, 한국의 배달 시스템은 무너졌다.","grammar":[{"label":"this series of upheavals","explanation":"this series of upheavals — series 는 단수와 복수의 꼴이 같다","transform_label":"fall apart → collapse — 무너지다","transform_value":"… delivery system collapsed."}]},{"n":4,"en":"It was during the 1960s that delivery services grew again thanks to urbanization.","ko":"도시화 덕분에 배달 산업이 다시 성장한 것은 1960년대 동안이었다.","grammar":[]},{"n":5,"en":"As economic development progressed, people flocked to urban areas, where labor became concentrated.","ko":"경제 발전이 진행됨에 따라, 사람들은 노동력이 집중되는 도시 지역으로 모여들었다.","grammar":[]},{"n":6,"en":"This boosted the demand for delivery services.","ko":"이것이 배달 서비스에 대한 수요를 촉진 시켰다.","grammar":[]},{"n":7,"en":"Deliveries of newspapers and milk quickly became popular.","ko":"신문과 우유 배달이 빠르게 인기를 얻었다.","grammar":[]},{"n":8,"en":"During lunchtime, city centers were filled with restaurant workers delivering trays full of food, stacked on top of each other.","ko":"점심시간 동안, 도시 중심부는 음식이 가득 찬 차곡차곡 쌓아 올려진 쟁반을 배달하는 식당 직원들로 가득 찼다.","grammar":[{"label":"were filled with","explanation":"were filled with — 수동태 + 전치사 with","transform_label":"restaurant workers delivering trays full of food, stacked on top of each other — 현재분사와 과거분사의 후치수식 → 관계사절 — 분사 앞에 관계대명사와 be동사를 되살린다","transform_value":"… restaurant workers who were delivering trays … of food that were stacked on …"}]},{"n":9,"en":"In the late 1980s and 1990s, caterers delivered homemade lunches in cloth bags to urban offices and returned later to collect empty dishes.","ko":"1980년대 후반과 1990년대에는, 음식 공급자들이 보자기에 싼 집에서 만든 점심을 도시의 사무실로 배달하였고 나중에 빈 그릇을 가져가기 위해 돌아왔다.","grammar":[]},{"n":10,"en":"The delivery area grew rapidly.","ko":"배달 영역은 빠르게 성장했다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3","text":"해방 뒤 나라가 갈린 사정을 놓는다 → 이어 전쟁이 터졌음을 잇는다 → 그 격변에 배달 체계가 무너졌음을 밝힌다","refs":[1,2,3]},{"label":"전개","sentences":"S4 · S5 · S6 · S7","text":"다시 임을 짚는다 → 자동화·지도·앱이 한 몫을 늘어놓는다 → 전자 상거래의 성장도 수요를 밀었음을 든다. 익일 배송이라는 약속을 세운다 → 이제 당일까지 간다며 그 약속이 앞당겨짐을 보인다 → 날짜와 시간까지 고를 수 있음을 덧붙인다.","blocking_vocab":[{"word":"delivery","meaning":"배달"},{"word":"logistics","meaning":"물류"},{"word":"express home delivery","meaning":"신속 가정 배송"},{"word":"on average","meaning":"평균적으로"},{"word":"e-commerce","meaning":"전자상거래"}],"sentences":[{"n":1,"en":"In 1992, taekbae service, an express home delivery service through which a person receives an ordered item in at least a day or two was introduced.","ko":"1992년에는 주문한 물건을 최소 하루 또는 이틀 안에 받을 수 있는 신속 가정배달 서비스인 택배 서비스가 도입되었다.","grammar":[{"label":"an express home delivery service through which","explanation":"an express home delivery service through which — 전치사 + 관계대명사 · 관계부사로 바꿔 쓸 수 있다","transform_label":"an express home delivery service through which a person receives an ordered item — 전치사 + 관계대명사 → 두 문장 — 관계사를 대명사로 바꾸고 두 문장으로 나눈다","transform_value":"In 1992, taekbae service was introduced. It is an express home delivery service, and through it a person receives an ordered item in at least a day or two."},{"label":"in at least a day or two was introduced","explanation":"in at least a day or two was introduced — 주어와 동사가 멀어진 수동태"}]},{"n":2,"en":"On the first day, there were just two deliveries.","ko":"첫날에는 고작 두 건의 배달이 있었다.","grammar":[]},{"n":3,"en":"Now, millions of items are delivered daily.","ko":"이제 매일 수백만 개의 물건들이 배달된다.","grammar":[]},{"n":4,"en":"On average, a South Korean uses taekbae sixty-five times per year.","ko":"평균적으로 한국인 한 명은 택배를 연간 65번 이용한다.","grammar":[]},{"n":5,"en":"It was the development of digital and information technology that enabled the remarkable growth of taekbae.","ko":"택배의 놀랄 만한 성장을 가능하게 해 준 것은 바로 디지털과 정보 기술의 발전이었다.","grammar":[]},{"n":6,"en":"Logistics automation, GPS maps, and mobile applications have extended the range and scale of delivery services while keeping prices reasonable.","ko":"물류 자동화, GPS 지도, 그리고 모바일 애플리케이션은 가격을 적절하게 유지하면서도 배달의 범위와 규모를 넓혀 주었다.","grammar": ]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2","text":"도보에서 여기까지 온 길을 한 줄로 감싼다 → 기술 변화로 더 나아가리라 전망한다","refs":[1,2]},{"label":"전개","sentences":"S3 · S4 · S5","text":"바깥에서 이미 쓰이는 드론과 로봇을 든다 → 국내에서도 시험 중이라는 사실을 잇는다 → 배달 없이는 지금 삶이 굴러가지 않는다고 못 박는다","refs":[3,4,5]},{"label":"도착","sentences":"S6 · S7","text":"믿음을 지키려 무엇을 앞세우는지 밝힌다 → 믿음과 기술이 앞날의 힘이 되리라 닫는다","refs":[6,7]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["도보에서 여기까지 온 길을 한 줄로 감싼다 → 기술 변화로 더 나아가리라 전망한다","믿음을 지키려 무엇을 앞세우는지 밝힌다 → 믿음과 기술이 앞날의 힘이 되리라 닫는다","드론과 자율 로봇: 도보에서 여기까지 온 길을 한 줄로 감싼다 → 믿음과 기술이 앞날의 힘이 되리라 닫는다"],"answer":2,"why":"드론과 자율 로봇: 도보에서 여기까지 온 길을 한 줄로 감싼다 → 믿음과 기술이 앞날의 힘이 되리라 닫는다","refs":[1,7]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["도보에서 여기까지 온 길을 한 줄로 감싼다 → 기술 변화로 더 나아가리라 전망한다","앞의 사건과 관계없는 새 주제","믿음을 지키려 무엇을 앞세우는지 밝힌다 → 믿음과 기술이 앞날의 힘이 되리라 닫는다"],"answer":2,"why":"믿음을 지키려 무엇을 앞세우는지 밝힌다 → 믿음과 기술이 앞날의 힘이 되리라 닫는다","refs":[6,7]},{"type":"문법","q":"S3의 'are being used to deliver' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","are being used to deliver — 현재진행 수동태 · 「배달하는 데」"],"answer":2,"why":"Logistics companies in foreign countries are using drones and autonomous robots to deliver items.","refs":[3]}],"key_sentence_en":"These persistent efforts for reliability and the adoption of advanced delivery technology will continue being the driving forces that will move Korean delivery forward well into the future.","key_sentence_ko":"이러한 신뢰를 위한 꾸준한 노력과 진보한 배달 기술의 도입은 한국 배달을 미래로 훨씬 나아가게 할 원동력이 될 것이다."}]},{"id":"l2-grammar","label":"2과 · Grammar in Context","scope":"42–43쪽 · 강조 구문 / so … that","passages":[{"id":"l2-grammar-42","title":"42쪽 · 강조 구문: 무엇을 강조할까?","lead":"같은 사건이라도 It is/was … that 사이에 무엇을 넣느냐에 따라 강조점이 달라집니다.","core":"It is/was + 강조할 말 + that + 나머지: 새 사실을 더하는 것이 아니라, 원래 문장의 한 부분을 강조합니다.","diagram":{"kind":"compare","title":"문장 구조를 한눈에","items":[{"head":"원래 사건","body":"Latest technologies make this online exhibition possible.","ref 트는 지난 토요일에 개와 함께 산책했다.","grammar":[{"label":"시간 강조 연습","explanation":"강조할 말은 last Saturday입니다. It was last Saturday that Kate took a walk with her dog.처럼 시간을 강조합니다."}]},{"n":9,"en":"Brian read the novel he borrowed from Jack in the park.","ko":"브라이언은 공원에서 잭에게 빌린 소설을 읽었다.","grammar":[{"label":"목적어 강조 연습","explanation":"강조할 말은 the novel he borrowed from Jack입니다. It was the novel he borrowed from Jack that Brian read in the park.처럼 목적어 전체를 한 덩어리로 옮깁니다."}]},{"n":10,"en":"What is the most important thing in a friendship? Why?","ko":"우정에서 가장 중요한 것은 무엇인가? 왜 그런가?","grammar":[]},{"n":11,"en":"It is trust that is the most important thing because trust makes a friendship meaningful and strong.","ko":"우정에서 가장 중요한 것은 바로 신뢰다. 신뢰가 우정을 의미 있고 굳건하게 만들기 때문이다.","grammar":[{"label":"주어 강조","explanation":"trust를 강조한 모범 문장입니다. that 뒤의 is는 원래 문장의 동사이고, 강조 구조의 is와 구별해야 합니다."}]}],"structure":[],"flow":[{"label":"형태 보기","text":"It is/was와 that 사이에 강조할 말이 들어갑니다.","sentences":"S1 · S5","refs":[1,5]},{"label":"내용 확인","text":"가상 박물관의 여러 활동을 가능하게 하는 것은 최신 기술입니다.","sentences":"S2 · S3 · S4 · S5","refs":[2,3,4,5]},{"label":"바꿔 말하기","text":"S6–S9에서 사람 Michael, 장소 near the lake, 시간 last Saturday, 목적어 the novel he borrowed from Jack을 차례로 강조합니다.","sentences":"S6 · S7 · S8 · S9","refs":[6,7,8,9]},{"label":"스스로 적용","text":"우정에서 가장 중요한 것으로 trust를 강조한 예시를 읽습니다.","sentences":"S10 · S11","refs":[10,11]}],"checks":[{"type":"강조점","q":"S5에서 특히 강조하는 것은?","choices":["박물관이 세워진 시기","이 전시를 가능하게 하는 최신 기술","전시 공간에 있는 꽃밭"],"answer":1,"why":"근거 영어 문장을 펼쳐 확인해 보세요.","refs":[5]},{"type":"구조","q":"Michael을 강조해 S6을 바르게 바꾼 문장은?","choices":["It was Michael that took a photo for his friend.","It was Michael took a photo for his friend.","It was took Michael that a photo for his friend."],"answer":0,"why":"근거 영어 문장을 펼쳐 확인해 보세요.","refs":[6]},{"type":"범위","q":"S9에서 강조할 목적어를 통째로 고르면?","choices":["the novel he borrowed","in the park","the novel he borrowed from Jack"],"answer":2,"why":"근거 영어 문장을 펼쳐 확인해 보세요.","refs":[9]}],"key_sentence_en":"It is the latest technologies, such as 3D exhibition platforms and virtual reality, that make this online exhibition possible.","key_sentence_ko":"이 온라인 전시를 가능하게 하는 것은 바로 3D 전시 플랫폼과 가상 현실 같은 최신 기술이다."},{"id":"l2-grammar-43","title":"43쪽 · so … that: 정도와 결과","lead":"앞부분의 정도가 강해서 뒤의 결과로 이어질 때 so … that을 사용합니다.","core":"so + 형용사/부사 + that + 결과절: ‘너무/매우 …해서, 그 결과 …하다’의 관계를 읽습니다.","diagram":{"kind":"compare","title":"문장 구조를 한눈에","items":[{"head":"정도","body":"버스 와이파이가 매우 빨랐다 · so fast","refs":[4]},{"head":"결과","body":"단 1분 만에 사진을 내려받을 수 있었다 · that I could …","refs":[4]},{"head":"다른 예","body":"지하철이 매우 편리했다 → ‘Wow!’라고 거듭 말했다","refs":[10]}],"takeaway":"핵심은 ‘아주 …했다’에서 멈추지 않고, that 뒤의 실제 결과까지 읽는 것입니다."},"blocking_vocab":[{"word":"messenger","meaning":"전인, 심부름꾼"},{"word":"appreciation","meaning":"감사, 고마움"},{"word":"energized","meaning":"힘이 난"}],"sentences":[{"n":1,"en":"Customers trusted the messengers so much that they often did not check the items.","ko":"고객들은 전인들을 매우 신뢰해서 물품을 자주 확인하지 않았다.","grammar":[{"label":"정도 → 결과","explanation":"so much는 ‘매우 많이 신뢰했다’는 정도, that 이하는 ‘물품을 확인하지 않았다’는 결과입니다."}]},{"n":2,"en":"What impressed you most when you first came to Korea?","ko":"처음 한국에 왔을 때 무엇이 가장 인상적이었나요?","grammar":[]},{"n":3,"en":"Well, there were two things.","ko":"음, 두 가지가 있었어요.","grammar":[]},{"n":4,"en":"First, the free Wi-Fi on buses was so fast that I could download photos in just a minute.","ko":"첫째, 버스의 무료 와이파이가 매우 빨라서 단 1분 만에 사진을 내려받을 수 있었어요.","grammar":[{"label":"빠른 정도 → 가능한 일","explanation":"so fast가 정도, that I could download photos in just a minute가 결과입니다."}]},{"n":5,"en":"That was amazing!","ko":"정말 놀라웠어요!","grammar":[]},{"n":6,"en":"I've never thought about that.","ko":"그건 생각해 본 적이 없네요.","grammar":[]},{"n":7,"en":"And what was the other thing?","ko":"다른 하나는 무엇이었나요?","grammar":[]},{"n":8,"en":"The subway system, definitely!","ko":"당연히 지하철 시스템이요!","grammar":[]},{"n":9,"en":"The signs, the colors, and the clear directions made it so easy for me to find my way.","ko":"표지판, 색깔, 명확한 길 안내 덕분에 길을 찾기가 아주 쉬웠어요.","grammar":[{"label":"비슷해 보여도 다른 구조","explanation":"so easy가 있지만 이 문장에는 that 결과절이 없습니다. make it easy for me to find my way 구조와 구별하세요."}]},{"n":10,"en":"It was so convenient that I could not stop saying, \"Wow!\"","ko":"너무 편리해서 ‘와!’라는 말이 계속 나왔어요.","grammar":[{"label":"편리한 정도 → 반응","explanation":"so convenient가 정도, that 뒤가 ‘Wow!’를 계속 말하게 된 결과입니다."}]},{"n":11,"en":"The concert was great.","ko":"그 공연은 훌륭했다.","grammar":[]},{"n":12,"en":"The audience showed its appreciation by cheering.","ko":"관객들은 환호하며 감사를 표현했다.","grammar":[]},{"n":13,"en":"The movie was scary.","ko":"그 영화는 무서웠다.","grammar":[]},{"n":14,"en":"I had to cover my eyes during certain scenes.","ko":"나는 몇몇 장면에서 눈을 가려야 했다.","grammar":[]},{"n":15,"en":"The math problems were challenging.","ko":"그 수학 문제들은 어려웠다.","grammar":[]},{"n":16,"en":"It took Daniel hours to solve them.","ko":"대니얼이 문제들을 푸는 데 몇 시간이 걸렸다.","grammar":[]},{"n":17,"en":"I love the song Let It Go by Idina Menzel.","ko":"나는 이디나 멘젤이 부른 ‘Let It Go’를 좋아한다.","grammar":[]},{"n":18,"en":"The singer's voice is so powerful that I feel energized.","ko":"그 가수의 목소리가 매우 힘차서 나는 힘이 난다.","grammar":[{"label":"힘찬 정도 → 느낌","explanation":"so powerful이 목소리의 정도, that I feel energized가 그로 인한 느낌입니다."}]}],"structure":[],"flow":[{"label":"형태 보기","text":"so much that: 신뢰의 정도가 물품을 확인하지 않은 결과로 이어집니다.","sentences":"S1","refs":[1]},{"label":"대화 ①","text":"버스의 무료 와이파이가 빠른 덕분에 짧은 시간에 사진을 내려받았습니다.","sentences":"S2 · S3 · S4 · S5 · S6","refs":[2,3,4,5,6]},{"label":"대화 ②","text":"지하철 안내가 길 찾기를 쉽게 했고, 편리해서 감탄했습니다. S9와 S10의 구조는 다릅니다.","sentences":"S7 · S8 · S9 · S10","refs":[7,8,9,10]},{"label":"적용","text":"공연·영화·수학 문제를 각각 정도와 결과의 한 문장으로 이어 봅니다.","sentences":"S11 · S12 · S13 · S14 · S15 · S16","refs":[11,12,13,14,15,16]},{"label":"예시","text":"가수의 힘찬 목소리가 듣는 사람에게 힘을 주는 결과로 이어집니다.","sentences":"S17 · S18","refs":[17,18]}],"checks":[{"type":"관계","q":"S4에서 that 뒤에 오는 결과는?","choices":["버스에 와이파이를 설치했다","지하철 표지판을 읽었다","1분 만에 사진을 내려받을 수 있었다"],"answer":2,"why":"근거 영어 문장을 펼쳐 확인해 보세요.","refs":[4]},{"type":"구별","q":"S9와 S10에 대한 설명으로 맞는 것은?","choices":["S9에만 that 결과절이 있다","S10에 so … that 결과절이 있고 S9에는 없다","두 문장 모두 that 결과절이 있다"],"answer":1,"why":"근거 영어 문장을 펼쳐 확인해 보세요.","refs":[9,10]},{"type":"적용","q":"S13–14를 연결할 때 문맥에 맞는 문장은?","choices":["The movie was so scary that the concert was great.","The movie was scary that I had to cover my eyes.","The movie was so scary that I had to cover my eyes during certain scenes."],"answer":2,"why":"근거 영어 문장을 펼쳐 확인해 보세요.","refs":[13,14]}],"key_sentence_en":"First, the free Wi-Fi on buses was so fast that I could download photos in just a minute.","key_sentence_ko":"첫째, 버스의 무료 와이파이가 매우 빨라서 단 1분 만에 사진을 내려받을 수 있었어요."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 경해여고1 교과서 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button>${s.grammar?.length?` <button class="reveal grammar-open" data-toggle="grammar">문법 포인트</button>`:''}<p class="translation">${esc(s.ko)}</p>${s.grammar?.length?`<div class="grammar-panel">${s.grammar.map(g=>`<div class="grammar-item"><b>${esc(g.label)}</b><p>${esc(g.explanation)}</p>${g.transform_value?`<small>시험에서는 이렇게 바꿀 수 있어요.</small><p class="grammar-transform">${esc(g.transform_value)}</p>`:''}</div>`).join('')}</div>`:''}</div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.parentElement.querySelector('.translation');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='grammar'){const target=btn.parentElement.querySelector('.grammar-panel');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'문법 닫기':'문법 포인트'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

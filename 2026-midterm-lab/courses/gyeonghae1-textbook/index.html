</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">GYEONGHAE GIRLS' HIGH SCHOOL · GRADE 1</p><h1>공통영어2 교과서</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 1과 p13–17·p27 / 2과 p35–39·p42–43<br>본문은 Word 원문·공식 해석을, 문법 42·43쪽은 학교 교과서 사진의 인쇄 문장을 기준으로 했습니다.</div><div class="units" id="units"></div><p class="subnote">1과 본문·추가 읽기, 2과 본문과 Grammar in Context를 단락·쪽별로 읽을 수 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":{"id":"gyeonghae1-textbook","title":"경해여고1 공통영어2 교과서","grade":"고1"},"units":[{"id":"l1","label":"1과 · Make Your World a Better Place","scope":"p13–17 본문","passages":[{"id":"l1-01","title":"미래의 희망은 젊은이다","core":"기술과 과학도 미래에 희망을 주지만, 글쓴이는 이미 문제 해결에 나선 젊은이들을 특히 주목한다."},{"id":"l1-02","title":"Trisha Prabhu · 사이버 폭력을 막는 앱","core":"트리샤의 ReThink는 상처를 줄 말을 보내기 전에 다시 생각하게 하여 사이버 폭력을 막는다."},{"id":"l1-03","title":"Kelvin Doe · 버려진 부품으로 만든 발명","core":"켈빈은 버려진 전자 부품으로 라디오 방송국과 전력 장치를 만들어 지역 사회의 교육과 생활을 도왔다."},{"id":"l1-04","title":"John Stagliano · 가구를 나누는 비영리 활동","core":"존은 새집에 가구를 마련하기 어려운 사람들을 위해 Home Again을 세워 가구와 생활필수품을 나눴다."},{"id":"l1-05","title":"세 사람의 공통점","core":"트리샤·켈빈·존의 행동은 사회 문제를 해결하고 다른 젊은이들에게도 변화를 만들 힘이 있음을 보여 준다."},{"id":"l1-06","title":"그들이 지금 하는 일","core":"세 사람은 처음 소개된 활동을 끝내지 않고, 각자의 방식으로 사람들을 계속 돕고 있다."}]},{"id":"l1-tech","label":"1과 · Reading about Technology","scope":"p27 추가 읽기","passages":[{"id":"l1-tech-01","title":"적정기술과 Warka Tower","core":"적정 기술은 지역의 필요와 자원에 맞춘 기술이다. 와카 타워는 빗물과 안개를 모아 깨끗한 물을 얻는 사례다."}]},{"id":"l2","label":"2과 · From Tradition to Trend","scope":"p35–39 본문","passages":[{"id":"l2-01","title":"손끝에서 이루어지는 배달","core":"손끝에서 이루어지는 배달: 하루 안에 다 배달된다는 사실로 말문을 연다 → 그 내력을 묻는 말로 본론을 연다"},{"id":"l2-02","title":"속도와 상호 신뢰의 전통","core":"속도와 상호 신뢰의 전통: 옛 일기라는 첫 증거를 꺼낸다 → 그것이 오늘의 배달로 이어졌으리라 내다본다"},{"id":"l2-03","title":"도시화와 배달 수요","core":"도시화와 배달 수요: 해방 뒤 나라가 갈린 사정을 놓는다 → 배달 영역이 커졌다고 이 대목을 닫는다"},{"id":"l2-04","title":"익일에서 당일 배송으로","core":"익일에서 당일 배송으로: 택배가 언제 어떤 약속으로 생겼는지 밝힌다 → 날짜와 시간까지 고를 수 있음을 덧붙인다"},{"id":"l2-05","title":"드론과 자율 로봇","core":"드론과 자율 로봇: 도보에서 여기까지 온 길을 한 줄로 감싼다 → 믿음과 기술이 앞날의 힘이 되리라 닫는다"}]},{"id":"l2-grammar","label":"2과 · Grammar in Context","scope":"42–43쪽 · 강조 구문 / so … that","passages":[{"id":"l2-grammar-42","title":"42쪽 · 강조 구문: 무엇을 강조할까?","core":"It is/was + 강조할 말 + that + 나머지: 새 사실을 더하는 것이 아니라, 원래 문장의 한 부분을 강조합니다."},{"id":"l2-grammar-43","title":"43쪽 · so … that: 정도와 결과","core":"so + 형용사/부사 + that + 결과절: ‘너무/매우 …해서, 그 결과 …하다’의 관계를 읽습니다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">DAEA HIGH SCHOOL · GRADE 1</p><h1>공통영어2 교과서</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 1과·2과 본문 전체<br>Word 원문·공식 해석을 기준으로, 헷갈리는 문장에만 클릭형 문법 설명을 붙였습니다.</div><div class="units" id="units"></div><p class="subnote">1·2과 본문 16개 단락을 단락별로 읽을 수 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":{"id":"daea1-textbook","title":"대아고1 공통영어2 교과서","grade":"고1"},"units":[{"id":"l1","label":"1과 · Embrace Connections","scope":"본문 전체","passages":[{"id":"l1-01","title":"이름에서 시작된 연결","core":"이름이 같은 사람들을 온라인에서 발견하고 연락한 일이 새로운 인연의 출발점이 된다."},{"id":"l1-02","title":"세 명의 음악인 발견","core":"친구 신청을 받아 준 여러 Sam Lee 중 음악을 좋아하는 세 사람을 발견한다."},{"id":"l1-03","title":"가상 밴드 제안","core":"음악을 좋아하는 세 Sam Lee에게 가상 밴드를 제안했고 모두 흔쾌히 동의한다."},{"id":"l1-04","title":"연습의 문제와 해결","core":"시차와 영상 통화의 소리 문제 때문에, 밴드는 함께 연습하는 대신 각자 녹음한 부분을 조립하기로 한다."},{"id":"l1-05","title":"가상 조립식 녹음","core":"네 사람은 건반, 노래, 기타, 드럼을 차례로 녹음해 한 곡을 완성한다."},{"id":"l1-06","title":"차이를 통한 배움","core":"서로 다른 장르와 문화에서 온 네 사람은 곡을 번갈아 고르며 새로운 음악을 배운다."},{"id":"l1-07","title":"팬데믹과 중단","core":"팬데믹 속에서 온라인 만남이 더 소중해졌지만, 싱가포르 Sam의 입원으로 밴드 활동은 잠시 멈춘다."},{"id":"l1-08","title":"아픈 친구를 위한 음악","core":"밴드 친구들은 입원한 Sam을 위해 생일 노래를 녹음하고, 웃음을 선물한다."},{"id":"l1-09","title":"자작곡 완성","core":"친구가 회복한 뒤 만든 자작곡은 큰 인기를 얻지 못했지만, 함께 이룬 성취가 자랑스러웠다."},{"id":"l1-10","title":"관계의 의미","core":"배경과 경험이 다른 네 사람은 오히려 서로의 고민을 나누고 새로운 관점의 조언을 주는 친구가 된다."},{"id":"l1-11","title":"바람과 결론","core":"직접 만나지 못하더라도 같은 이름에서 시작해 깊은 우정을 얻은 것만으로도 행운이다."}]},{"id":"l2","label":"2과 · From Problems to Solutions","scope":"본문 전체","passages":[{"id":"l2-01","title":"낡은 지역에 새 활력을","core":"낡아 떠나던 동네도 정부와 주민이 협력하면 다시 살기 좋은 곳으로 바뀔 수 있다."},{"id":"l2-02","title":"42가구가 만든 변화","core":"철거 대신 빈 아파트를 1유로에 팔고 주민이 고치게 한 결과, 42가구와 동네가 함께 살아났다."},{"id":"l2-03","title":"오염된 조선소를 다시 보다","core":"오염된 옛 조선소를 바꾸기 위해 시는 시민에게 토지 정화와 창의적 작업 공간을 함께 이루는 계획을 요청했다."},{"id":"l2-04","title":"업사이클링 업무 지구","core":"오염된 땅에는 기초를 놓기 어려워 낡은 배를 사무 공간으로 바꾸고 길과 정화 식물을 더했다."},{"id":"l2-05","title":"창의성과 협력","core":"두 도시 재생 사례의 성공에는 돈과 계획뿐 아니라 창의성, 공동체 정신, 협력이 필요했다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

</script></body></html>

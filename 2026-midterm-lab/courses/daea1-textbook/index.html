</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">DAEA HIGH SCHOOL · GRADE 1</p><h1>공통영어2 교과서</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 1과·2과 본문 전체<br>Word 원문·공식 해석을 기준으로, 헷갈리는 문장에만 클릭형 문법 설명을 붙였습니다.</div><div class="units" id="units"></div><p class="subnote">1·2과 본문 16개 단락을 단락별로 읽을 수 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":{"id":"daea1-textbook","title":"대아고1 공통영어2 교과서","grade":"고1"},"units":[{"id":"l1","label":"1과 · Embrace Connections","scope":"본문 전체","passages":[{"id":"l1-01","title":"이름에서 시작된 연결","core":"이름에서 시작된 연결: 글을 이끄는 사람이 자기 이름을 먼저 밝힌다 → 몇 사람을 골라 말을 걸며 이야기를 다음 단계로 민다"},{"id":"l1-02","title":"세 명의 음악인 발견","core":"세 명의 음악인 발견: 요청이 받아들여져 관계가 열렸음을 알린다 → 기타를 맡을 마지막 한 사람을 든다"},{"id":"l1-03","title":"가상 밴드 제안","core":"가상 밴드 제안: 생각이 떠올랐다고 알려 다음 이야기를 끌어온다 → 앞의 일을 여정의 출발점으로 자리매김한다"},{"id":"l1-04","title":"연습의 문제와 해결","core":"연습의 문제와 해결: 연습을 시도했으나 걸림돌이 있었다고 알린다 → 찾아낸 길을 공장에 빗대어 밝힌다"},{"id":"l1-05","title":"가상 조립식 녹음","core":"가상 조립식 녹음: 곡 만들기의 첫 순서를 보인다 → 남은 순서까지 이어 한 곡이 완성됨을 보인다"},{"id":"l1-06","title":"차이를 통한 배움","core":"차이를 통한 배움: 연주할 노래를 정하던 방식을 밝힌다 → 앞의 경험에 대한 화자의 느낌을 붙인다"},{"id":"l1-07","title":"팬데믹과 중단","core":"팬데믹과 중단: 세상을 덮친 새 상황을 들여와 때를 바꾼다 → 한 사람의 입원으로 밴드가 멈췄음을 알린다"},{"id":"l1-08","title":"아픈 친구를 위한 음악","core":"아픈 친구를 위한 음악: 멈춘 와중에도 만남은 이어졌음을 뒤집어 보인다 → 병상의 벗에게서 본 것에 대한 마음을 적는다"},{"id":"l1-09","title":"자작곡 완성","core":"자작곡 완성: 회복을 계기로 자작곡이라는 새 일을 꺼낸다 → 반응은 적었으나 보람은 컸다고 견준다"},{"id":"l1-10","title":"관계의 의미","core":"관계의 의미: 밴드를 특별하다고 값매기며 마무리를 시작한다 → 서로 다른 눈이 준 도움이 값졌다고 정리한다"},{"id":"l1-11","title":"바람과 결론","core":"바람과 결론: 언젠가 한자리에서 연주하고 싶다는 소망을 놓는다 → 삶의 놀라움에 대한 감탄으로 글을 닫는다"}]},{"id":"l2","label":"2과 · From Problems to Solutions","scope":"본문 전체","passages":[{"id":"l2-01","title":"낡은 지역에 새 활력을","core":"낡은 지역에 새 활력을: 도시가 늙으면 사람이 떠난다는 사정을 먼저 놓는다 → 그 기대 밖의 일이 실제로 일어났다고 못 박는다"},{"id":"l2-02","title":"42가구가 만든 변화","core":"42가구가 만든 변화: 이 동네가 범죄로 이름났던 때를 되짚는다 → 지금은 살고 싶은 곳이 되었다고 첫 사례를 닫는다"},{"id":"l2-03","title":"오염된 조선소를 다시 보다","core":"오염된 조선소를 다시 보다: 두 번째 사례가 놓인 옛 산업 지역을 소개한다 → 일하는 공간으로 바꿀 길도 요구했음을 든다"},{"id":"l2-04","title":"업사이클링 업무 지구","core":"업사이클링 업무 지구: 한 회사의 안이 뽑혀 임대를 얻었음을 알린다 → 보러 오는 사람도 많다며 두 번째 사례를 매듭짓는다"},{"id":"l2-05","title":"창의성과 협력","core":"창의성과 협력: 친환경 기술의 마당으로 이름났다고 값매긴다 → 다른 도시에 주는 뜻으로 글 전체를 닫는다"}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

</script></body></html>

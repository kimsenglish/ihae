px;cursor:pointer}.choice:has(input:checked){border-color:var(--green);background:#e8f3e8}.choice input{accent-color:var(--green);margin-right:8px}.answerline{display:none;margin-top:13px;padding:13px;background:#e7f2e9;border-radius:11px}.answerline.show{display:block}.vocab{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}.vocab span{background:#fff2d9;border-radius:100px;padding:6px 10px;font-size:13px}.vocab b{color:var(--green)}.sentence{display:grid;grid-template-columns:35px 1fr;gap:8px;border-top:1px solid var(--line);padding:17px 0}.sentence:first-child{border-top:0}.num{font-weight:900;color:var(--green)}.en{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.5}.translation{display:none;background:#eff4ee;border-radius:9px;padding:11px 13px;margin:10px 0 0}.translation.show{display:block}.reveal{border:1px solid #bad5c7;background:white;border-radius:8px;color:var(--green);font-size:12px;font-weight:850;padding:5px 10px;margin-top:9px}.core{font-size:20px;font-weight:850;background:#e5f1e9;border-left:5px solid var(--green);padding:16px 18px;border-radius:0 12px 12px 0}.structure{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0 22px}.structure div{border:1px solid var(--line);padding:15px;border-radius:12px;background:#faf8f3}.structure b{display:block;color:var(--green)}.flow{display:grid;gap:8px}.flow button{text-align:left;border:1px solid var(--line);background:#faf8f3;padding:14px 16px;border-radius:12px;width:100%;color:var(--ink)}.flow button:hover{border-color:var(--green)}.flow b{color:var(--green);margin-right:9px}.flow small{color:#a76823;font-weight:850}.flow p{margin:5px 0}.evidence{display:none;margin-top:10px;background:white;padding:10px;border-radius:8px;font-family:Georgia,serif}.evidence.show{display:block}.evidence p{font-size:14px}.quiz{border-top:1px solid var(--line);padding:17px 0}.quiz:first-child{border-top:0}.qtype{font-size:12px;font-weight:900;color:#a36b28}.feedback{min-height:20px;font-size:14px;font-weight:750}.quiz .evidence{background:#fff3d7}.final{background:var(--ink);color:white;padding:18px;border-radius:14px;margin-top:18px}.final button{background:var(--gold);border:0;border-radius:9px;padding:9px 13px;font-weight:900}.final p{display:none;margin:12px 0 0}.final p.show{display:block}.next{display:block;margin-top:20px;color:var(--green);font-weight:900;text-align:right}.quiet{font-size:13px;color:var(--muted)}@media(max-width:700px){main{padding:13px 13px 70px}.topnav a,.topnav button{padding:8px;font-size:11px}.steps a{font-size:10px;padding:10px 2px}.visual{grid-template-columns:1fr}.structure{grid-template-columns:1fr}.en{font-size:17px}.section{margin:14px 0}}

.diagram-steps .diagram-card:not(:last-child):after{content:'↓';display:block;text-align:center;color:var(--green);font-weight:900;line-height:8px;margin:8px -12px -12px}
.easy-story{margin-top:22px;max-width:760px;border-top:2px solid #b8d4c3;padding:17px 2px 0}

.diagram{overflow:hidden}
.diagram-items{counter-reset:visual-step}
.diagram-card{box-shadow:0 2px 0 rgba(13,76,57,.04)}
.diagram-card b{line-height:1.35}
.diagram-card small{font-variant-numeric:tabular-nums}
/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items,.diagram.diagram-argument .diagram-items,
.diagram.diagram-steps-possible .diagram-items,.diagram.diagram-case-advice .diagram-items,
.diagram.diagram-steps-response .diagram-items,.diagram.diagram-cause-response .diagram-items,
.diagram.diagram-compare-open .diagram-items{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;
  border-left:3px solid #68aa91;margin-left:14px;padding-left:25px}
.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card,.diagram.diagram-argument .diagram-card,
.diagram.diagram-steps-possible .diagram-card,.diagram.diagram-case-advice .diagram-card,
.diagram.diagram-steps-response .diagram-card,.diagram.diagram-cause-response .diagram-card,
.diagram.diagram-compare-open .diagram-card{position:relative;counter-increment:visual-step}
.diagram.diagram-steps .diagram-card:before,.diagram.diagram-timeline .diagram-card:before,
.diagram.diagram-cycle .diagram-card:before,.diagram.diagram-argument .diagram-card:before,
.diagram.diagram-steps-possible .diagram-card:before,.diagram.diagram-case-advice .diagram-card:before,
.diagram.diagram-steps-response .diagram-card:before,.diagram.diagram-cause-response .diagram-card:before,
.diagram.diagram-compare-open .diagram-card:before{content:counter(visual-step);position:absolute;left:-47px;top:10px;
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:#176b52;color:#fff;font-size:12px;font-weight:800;border:3px solid #f0f6ef}
.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-possible .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-case-advice .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-response .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cause-response .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-compare-open .diagram-items .diagram-card:not(:last-child):after{
  content:'↓';position:absolute;left:-39px;bottom:-26px;margin:0;padding:0 2px;
  color:#176b52;background:#f0f6ef;line-height:1.2;font-size:17px;font-weight:800}
.diagram.diagram-cycle .diagram-items:after{content:'↶ 반복되는 해석';font-size:12px;color:#176b52;
  font-weight:750;margin:-13px 0 0 4px}
/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.diagram.diagram-condition .diagram-card:first-child,.diagram.diagram-branches .diagram-card:first-child{
  grid-column:1/-1;background:#dceee5;border-color:#82baa2;position:relative}
.diagram.diagram-condition .diagram-card:first-child:after,.diagram.diagram-branches .diagram-card:first-child:after{
  content:'↙                 ↘';position:absolute;bottom:-25px;left:0;right:0;text-align:center;
  color:#176b52;font-size:18px;font-weight:900;white-space:pre}
.diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.diagram.diagram-compare .diagram-card,.diagram.diagram-cases .diagram-card{
  border-top:5px solid #1b795c;background:linear-gradient(180deg,#f9fffb,#fff 48%)}
.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}
.diagram.diagram-web .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-web .diagram-card{border-radius:20px;border:2px solid #a4cab4;text-align:center}
.diagram.diagram-web .diagram-card:first-child{grid-column:1/-1;justify-self:center;width:min(100%,360px);
  background:#dceee5;border-color:#498f6e;border-radius:100px;position:relative}
.diagram.diagram-web .diagram-card:first-child:after{content:'↙                         ↘';
  position:absolute;left:0;right:0;bottom:-28px;color:#176b52;font-weight:900;white-space:pre}
.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;padding-top:23px}
.diagram.diagram-dose .diagram-items:before{content:'';position:absolute;top:10px;left:10%;right:10%;height:5px;
  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}
.diagram.diagram-dose .diagram-card:before{content:'';position:absolute;top:-23px;left:calc(50% - 7px);
  width:14px;height:14px;border-radius:50%;background:#176b52;border:3px solid #f0f6ef}
.diagram.diagram-dose .diagram-card:nth-child(2){background:#dceee5;border-color:#82baa2}
.diagram.diagram-dose .diagram-card b{font-size:18px}
/* Cooking: familiar side benefits are distinct from the source's energy-to-adaptation claim. */
.diagram.diagram-energy-route .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px}
.diagram.diagram-energy-route .diagram-card{position:relative;min-width:0;border-top:5px solid #237c5c;padding-top:35px;background:#fffdf8}
.diagram.diagram-energy-route .diagram-card:first-child{grid-column:1/-1;border:1px dashed #a9b8ad;background:#f8faf6;padding:10px 14px}
.diagram.diagram-energy-route .diagram-card:first-child:before{content:'먼저 떠오르는 장점';display:block;color:#65766b;font-size:11px;font-weight:800;margin-bottom:3px}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}
.diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'→';position:absolute;right:-19px;top:calc(50% - 16px);color:#176b52;font-size:26px;font-weight:900;z-index:1}
.diagram.diagram-energy-route .diagram-card:nth-child(2){background:#e5f4e9}.diagram.diagram-energy-route .diagram-card:nth-child(4){background:#fff2d9;border-top-color:#b78539}
/* Three alternative survival responses, not three consecutive steps. */
.diagram.diagram-reaction-options .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 10px}
.diagram.diagram-reaction-options .diagram-card:first-child{grid-column:1/-1;text-align:center;background:#dceee5;border:2px solid #82baa2;position:relative}
.diagram.diagram-reaction-options .diagram-card:first-child:after{content:'↙    ↓    ↘';position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:#176b52;font-weight:900;font-size:21px;white-space:pre}
.diagram.diagram-reaction-options .diagram-card:not(:first-child){text-align:center;border-top:5px solid #247b5b}
.diagram.diagram-reaction-options .diagram-card:not(:first-child) b{font-size:20px}
.diagram.diagram-reaction-options .diagram-card:not(:first-child):before{display:block;font-size:27px;line-height:1;margin-bottom:8px;color:#176b52}
.diagram.diagram-reaction-options .diagram-card:nth-child(2):before{content:'⏸'}.diagram.diagram-reaction-options .diagram-card:nth-child(3):before{content:'➜'}.diagram.diagram-reaction-options .diagram-card:nth-child(4):before{content:'↗'}
.diagram.diagram-reaction-options .diagram-takeaway{background:#fff2d9;border:0;border-radius:10px;padding:12px}
/* The first pass shows only the visual map; stage 3 restores the evidence. */
.diagram.is-overview .diagram-card p,.diagram.is-overview .diagram-card small{display:none}
.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}
.diagram.is-overview .diagram-card b{font-size:15px}
.diagram.is-overview .diagram-takeaway{display:block;background:#dceee5;border:0;border-radius:11px;
  margin-top:14px;padding:10px 12px;text-align:center;color:#14543f}
/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}
.diagram.diagram-dialogue .diagram-card:before{content:'●';position:absolute;left:14px;top:13px;
  color:#176b52;font-size:24px;line-height:1}
.diagram.diagram-dialogue .diagram-card:after{content:'';position:absolute;left:12px;top:42px;
  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}
.diagram.diagram-dialogue .diagram-card:nth-child(2){background:#fff7e9;border-color:#c78f4b}
.diagram.diagram-dialogue .diagram-card:nth-child(2):before{color:#a96e2c}
.diagram.diagram-dialogue .diagram-card:nth-child(2):after{background:#a96e2c}
.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}
/* A claim supported by parallel examples ends in one explicit conclusion. */
.diagram.diagram-examples-conclusion .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}
.diagram.diagram-examples-conclusion .diagram-card:first-child{background:#e1efe7;border:2px solid #76ad91;text-align:center}
.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(-n+2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(-n+2){border-top:5px solid #1b795c}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Analogy maps one domain to another, followed by a concrete example. */
.diagram.diagram-analogy .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-analogy .diagram-card:nth-child(1){border-top:5px solid #1b795c}
.diagram.diagram-analogy .diagram-card:nth-child(2){border-top:5px solid #bd8141}
.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Three roles are simultaneous parts of one contrast, not a causal sequence. */
.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diagram.diagram-roles-contrast .diagram-card{border-top:5px solid #1b795c}
.diagram.diagram-roles-contrast .diagram-card:nth-child(2){border-top-color:#b25745}
.diagram.diagram-roles-contrast .diagram-card:nth-child(3){border-top-color:#bd8141}
@media(max-width:650px){
 .diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items,
 .diagram.diagram-dialogue .diagram-items,
 .diagram.diagram-web .diagram-items,
 .diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items,

 .diagram.diagram-examples-conclusion .diagram-items,
 .diagram.diagram-compare-conclusion .diagram-items,

 .diagram.diagram-analogy .diagram-items,

 .diagram.diagram-examples-conclusion .diagram-card:first-child,
 .diagram.diagram-examples-conclusion .diagram-card:last-child,

<script id="course-data" type="application/json">{"course":{"id":"daea1-textbook","title":"대아고1 공통영어2 교과서","grade":"고1"},"units":[{"id":"l1","label":"1과 · Embrace Connections","scope":"본문 전체","passages":[{"id":"l1-01","title":"이름에서 시작된 연결","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"이름이 같은 사람들을 온라인에서 발견하고 연락한 일이 새로운 인연의 출발점이 된다.","diagram":{"kind":"steps","title":"같은 이름에서 시작된 연결","items":[{"head":"이샘 → Sam Lee","body":"자기 이름을 영어 이름으로 바꿈","refs":[1,2,3]},{"head":"검색","body":"세계 곳곳의 동명이인을 발견","refs":[4,5,6,7]},{"head":"친구 신청","body":"몇 사람에게 먼저 연락","refs":[8]}]},"easy_story":"이샘은 자신의 이름에서 영어 이름 Sam을 만들었습니다. Lee라는 성이 한국에만 흔하다고 생각했는데, 검색해 보니 세계 곳곳에 Sam Lee가 있었어요. 호기심에 몇 사람에게 친구 신청을 보냅니다.","blocking_vocab":[{"word":"vitality","meaning":"생명력"},{"word":"randomly","meaning":"무작위로"},{"word":"request","meaning":"요청"}],"sentences":[{"n":1,"en":"<A Band United by a Name> My name is Lee Saem.","ko":"<이름으로 뭉친 밴드> 내 이름은 이샘이다.","grammar":[]},{"n":2,"en":"My first name has an impressive meaning in Korean: “a source of power and vitality.”","ko":"내 이름은 한국어로 '힘과 생명력의 원천'이라는 인상적인 뜻을 가진다.","grammar":[]},{"n":3,"en":"Since Saem sounds like Sam, I decided to make that my English name.","ko":"샘은 Sam과 비슷하게 들리기 때문에, 나는 그것을 내 영어 이름으로 하기로 결정했다.","grammar":[]},{"n":4,"en":"Growing up, I thought Lee was a common last name only in Korea.","ko":"자라면서, 나는 Lee가 한국에서만 흔한 성이라고 생각했다.","grammar":[]},{"n":5,"en":"Little did I know that it’s actually common in many other countries, too.","ko":"나는 그것이 실제로 여러 다른 국가들에서도 흔하다는 것을 거의 알지 못했다.","grammar":[{"label":"Little did I know","explanation":"Little did I know — 부정 의미의 Little이 문두에 나온 부정어 도치 · did + 주어 + 동사원형"}]},{"n":6,"en":"When I searched “Sam Lee” on a social media website, I was amazed at what I saw.","ko":"내가 소셜 미디어 웹 사이트에서 'Sam Lee'를 검색해 봤을 때, 나는 내가 본 것에 깜짝 놀랐다.","grammar":[{"label":"what I saw","explanation":"what I saw — 관계대명사 what","transform_label":"When I searched — 시간을 나타내는 부사절 → 분사구문 — 접속사·주어를 지우고 동사를 -ing로","transform_value":"Searching “Sam Lee” …"}]},{"n":7,"en":"There were so many people all over the world with that name!","ko":"전 세계에 그 이름을 가진 많은 사람들이 있었다!","grammar":[]},{"n":8,"en":"Just for fun, I randomly chose several Sam Lees and sent them friend requests.","ko":"단순히 재미로, 나는 몇 명의 Sam Lee들을 무작위로 선택해 그들에게 친구 요청을 보냈다.","grammar":[]}],"structure":[],"flow":[{"label":"내 이름","sentences":"S1 · S2 · S3","text":"이샘은 이름의 뜻과 영어 이름 Sam을 정한 까닭을 소개한다.","refs":[1,2,3]},{"label":"뜻밖의 발견","sentences":"S4 · S5 · S6 · S7","text":"Lee가 다른 나라에도 흔하고 Sam Lee라는 이름을 가진 사람이 많다는 걸 검색으로 알게 된다.","refs":[4,5,6,7]},{"label":"첫 연락","sentences":"S8","text":"그중 몇 사람을 골라 친구 신청을 보내며 이야기가 시작된다.","refs":[8]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["이름이 같은 사람들을 온라인에서 발견하고 연락한 일이 새로운 인연의 출발점이 된다.","이샘은 이름의 뜻과 영어 이름 Sam을 정한 까닭을 소개한다.","그중 몇 사람을 골라 친구 신청을 보내며 이야기가 시작된다."],"answer":0,"why":"이름이 같은 사람들을 온라인에서 발견하고 연락한 일이 새로운 인연의 출발점이 된다.","refs":[1,8]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","그중 몇 사람을 골라 친구 신청을 보내며 이야기가 시작된다.","이샘은 이름의 뜻과 영어 이름 Sam을 정한 까닭을 소개한다."],"answer":1,"why":"그중 몇 사람을 골라 친구 신청을 보내며 이야기가 시작된다.","refs":[8]},{"type":"문법","q":"S5의 'Little did I know' 설명으로 알맞은 것은?","choices":["Little did I know — 부정 의미의 Little이 문두에 나온 부정어 도치 · did + 주어 + 동사원형","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"Little did I know — 부정 의미의 Little이 문두에 나온 부정어 도치 · did + 주어 + 동사원형","refs":[5]}],"key_sentence_en":"Just for fun, I randomly chose several Sam Lees and sent them friend requests.","key_sentence_ko":"단순히 재미로, 나는 몇 명의 Sam Lee들을 무작위로 선택해 그들에게 친구 요청을 보냈다."},{"id":"l1-02","title":"세 명의 음악인 발견","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"친구 신청을 받아 준 여러 Sam Lee 중 음악을 좋아하는 세 사람을 발견한다.","diagram":{"kind":"roster","title":"서로 다른 세 음악인","items":[{"head":"싱가포르 Sam","body":"노래·작사","refs":[4]},{"head":"캐나다 Samantha","body":"드럼","refs":[5,6]},{"head":"미국 Sam","body":"전기 기타","refs":[7]}]},"easy_story":"친구 신청을 받은 Sam Lee들의 소개를 보니 공통점이 있었습니다. 싱가포르의 Sa 려하기 위해 우리가 할 수 있는 것을 했다.","grammar":[{"label":"what we could do","explanation":"what we could do — 명사절 목적어","transform_label":"what we could do — 관계대명사 what → the things that — what을 the things that으로 풀기","transform_value":"… and did the things that we could …"}]},{"n":3,"en":"Since he had to stay in the hospital on his birthday, the rest of us recorded his favorite song as his birthday present.","ko":"그가 그의 생일에 병원에 머물러야 했기 때문에, 나머지 우리는 그의 생일 선물로 그가 매우 좋아하는 노래를 녹음했다.","grammar":[]},{"n":4,"en":"When we played it for him, he laughed so hard that he cried.","ko":"우리가 그를 위해 그것을 연주했을 때, 그는 너무 웃어서 눈물을 흘렸다.","grammar":[]},{"n":5,"en":"That was mainly because the song was sung by the worst singer in the band — me!","ko":"그것은 주로 그 노래가 밴드에서 가장 노래를 못 부르는 사람인 나에 의해 불렸기 때문이었다!","grammar":[]},{"n":6,"en":"It was good to see him laugh even though he was lying in his hospital bed.","ko":"그가 병원 침대에 누워 있었음에도 불구하고 그가 웃는 것을 보는 것은 좋았다.","grammar":[]}],"structure":[],"flow":[{"label":"연락 유지","sentences":"S1 · S2","text":"밴드가 쉬는 동안에도 영상 통화로 만나 친구를 격려한다.","refs":[1,2]},{"label":"생일 선물","sentences":"S3","text":"병원에 있는 싱가포르 Sam을 위해 나머지 멤버가 좋아하는 노래를 녹음한다.","refs":[3]},{"label":"반응","sentences":"S4 · S5 · S6","text":"노래를 못하는 화자의 목소리 덕분에 Sam이 크게 웃는다.","refs":[4,5,6]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["밴드가 쉬는 동안에도 영상 통화로 만나 친구를 격려한다.","노래를 못하는 화자의 목소리 덕분에 Sam이 크게 웃는다.","밴드 친구들은 입원한 Sam을 위해 생일 노래를 녹음하고, 웃음을 선물한다."],"answer":2,"why":"밴드 친구들은 입원한 Sam을 위해 생일 노래를 녹음하고, 웃음을 선물한다.","refs":[1,6]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","노래를 못하는 화자의 목소리 덕분에 Sam이 크게 웃는다.","밴드가 쉬는 동안에도 영상 통화로 만나 친구를 격려한다."],"answer":1,"why":"노래를 못하는 화자의 목소리 덕분에 Sam이 크게 웃는다.","refs":[4,5,6]},{"type":"문법","q":"S1의 'by using' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","by using — 전치사 + 동명사 (✗ by use)","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"… to time through the video …","refs":[1]}],"key_sentence_en":"It was good to see him laugh even though he was lying in his hospital bed.","key_sentence_ko":"그가 병원 침대에 누워 있었음에도 불구하고 그가 웃는 것을 보는 것은 좋았다."},{"id":"l1-09","title":"자작곡 완성","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"친구가 회복한 뒤 만든 자작곡은 큰 인기를 얻지 못했지만, 함께 이룬 성취가 자랑스러웠다.","diagram":{"kind":"steps","title":"인기보다 소중했던 성취","items":[{"head":"함께 만든 곡","body":"친구가 회복한 뒤 작곡·녹음","refs":[1,2]},{"head":"온라인 반응","body":"큰 관심은 받지 못함","refs":[3]},{"head":"네 사람의 마음","body":"함께 해낸 일이 자랑스러움","refs":[3]}]},"easy_story":"싱가포르 Sam이 회복한 뒤 네 사람은 직접 곡을 쓰고 녹음했습니다. 제목은 Long-Distance Friendship이에요. 온라인에서 큰 관심을 받지는 못했지만, 함께 해냈다는 사실에 만족합니다.","blocking_vocab":[{"word":"record","meaning":"녹음하다"},{"word":"recover","meaning":"회복하다"},{"word":"attention","meaning":"관심, 주목"},{"word":"achieve","meaning":"성취하다"}],"sentences":[{"n":1,"en":"After Singaporean Sam recovered, we decided to write and record our own song.","ko":"싱가포르 Sam이 회복된 후, 우리는 우리만의 곡을 쓰고 녹음하기로 결정했다.","grammar":[{"label":"to write and record","explanation":"to write and record — to부정사 병렬 · to 생략 · 「곡을 쓰고 녹음하기로」","transform_label":"decided to write and record — to부정사 목적어 → that절 — decided to를 decided that S would로","transform_value":"… we decided that we would write and …"},{"label":"our own song","explanation":"our own song — 소유격 강조"}]},{"n":2,"en":"We called the song “Long-Distance Friendship,” and we posted it online.","ko":"우리는 그 노래를 '장거리 우정'이라고 불렀고, 온라인에 그것을 게시했다.","grammar":[]},{"n":3,"en":"The song didn’t get much attention, but we were proud of what we had achieved together.","ko":"그 노래는 많은 관심을 받지는 못했지만, 우리는 우리가 함께 이룬 것에 자랑스러웠다.","grammar":[{"label":"what we had achieved","explanation":"what we had achieved — 관계대명사 what"},{"label":"had achieved","explanation":"had achieved — 과거완료"}]}],"structure":[],"flow":[{"label":"회복 뒤 도전","sentences":"S1","text":"싱가포르 Sam이 낫자 함께 자작곡을 쓰고 녹음한다.","refs":[1]},{"label":"온라인 공개","sentences":"S2","text":"Long-Distance Friendship이라는 제목으로 곡을 올린다.","refs":[2]},{"label":"진짜 성과","sentences":"S3","text":"큰 인기는 없었지만 네 사람은 공동의 성취를 자랑스러워한다.","refs" ife experiences","explanation":"nor have we had the same life experiences — 부정어 nor 뒤의 도치 · 현재완료","transform_label":"nor have we had — 부정어 nor 도치 → and ~ not ~ either — nor을 and로 풀고 not ~ either로","transform_value":"After all, we don’t come from similar backgrounds, and we haven’t had the same life experiences, either."}]},{"n":4,"en":"Yet we now talk about almost everything together, including the hardships we face in life.","ko":"그러나 우리는 이제 우리가 삶에서 마주하는 어려움을 포함하여 거의 모든 것에 대해 함께 이야기한다.","grammar":[]},{"n":5,"en":"I think it’s been really valuable to get advice from people with such different perspectives.","ko":"나는 이렇게 다른 관점을 가진 사람들로부터 조언을 얻는 것이 정말 소중했다고 생각한다.","grammar":[{"label":"it’s been really valuable to get advice","explanation":"it’s been really valuable to get advice — 현재완료 + 가주어 it · 진주어 to부정사 · 「조언을 얻는 것이 정말 값졌다」","transform_label":"valuable to get advice — 가주어 it + 진주어 to부정사 → 동명사 주어 — it을 빼고 to부정사를 동명사 주어로","transform_value":"I think getting advice from … different perspectives has been really valuable."}]}],"structure":[],"flow":[{"label":"뜻밖의 친밀함","sentences":"S1 · S2","text":"처음 예상하지 못한 강한 관계가 밴드 안에서 생겼다.","refs":[1,2]},{"label":"차이와 공감","sentences":"S3 · S4","text":"배경과 경험은 다르지만 어려움까지 서로 이야기한다.","refs":[3,4]},{"label":"관계의 가치","sentences":"S5","text":"서로 다른 관점에서 받는 조언이 도움이 된다.","refs":[5]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["서로 다른 관점에서 받는 조언이 도움이 된다.","배경과 경험이 다른 네 사람은 오히려 서로의 고민을 나누고 새로운 관점의 조언을 주는 친구가 된다.","처음 예상하지 못한 강한 관계가 밴드 안에서 생겼다."],"answer":1,"why":"배경과 경험이 다른 네 사람은 오히려 서로의 고민을 나누고 새로운 관점의 조언을 주는 친구가 된다.","refs":[1,5]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","서로 다른 관점에서 받는 조언이 도움이 된다.","처음 예상하지 못한 강한 관계가 밴드 안에서 생겼다."],"answer":1,"why":"서로 다른 관점에서 받는 조언이 도움이 된다.","refs":[5]},{"type":"문법","q":"S3의 'nor have we had the same life experiences' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","nor have we had the same life experiences — 부정어 nor 뒤의 도치 · 현재완료","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"After all, we don’t come from similar backgrounds, and we haven’t had the same life experiences, either.","refs":[3]}],"key_sentence_en":"I think it’s been really valuable to get advice from people with such different perspectives.","key_sentence_ko":"나는 이렇게 다른 관점을 가진 사람들로부터 조언을 얻는 것이 정말 소중했다고 생각한다."},{"id":"l1-11","title":"바람과 결론","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"직접 만나지 못하더라도 같은 이름에서 시작해 깊은 우정을 얻은 것만으로도 행운이다.","diagram":{"kind":"steps","title":"만남보다 먼저 이룬 것","items":[{"head":"앞으로의 바람","body":"직접 만나 연주하기","refs":[1]},{"head":"이미 이룬 일","body":"우연히 만난 네 사람의 우정","refs":[2,3,4]}]},"easy_story":"네 사람은 언젠가 실제로 만나 길에서 연주하고 싶어 합니다. 그렇지 못하더라도 이미 얻은 것이 있어요. 우연히 같은 이름을 가진 네 사람이 친구가 된 것 자체가 놀랍고 소중한 일입니다.","blocking_vocab":[{"word":"in person","meaning":"직접"},{"word":"lucky","meaning":"행운인"},{"word":"simply","meaning":"단순히"}],"sentences":[{"n":1,"en":"We would all like to meet in person and play our music on the street someday.","ko":"우리는 모두 언젠가 직접 만나서 길거리에서 우리의 음악을 연주하고 싶어 한다.","grammar":[{"label":"문장 전환","explanation":"would all like to meet — would like to → want to — would like to를 want to로 바꾸기","transform_label":"would all like to meet — would like to → want to — would like to를 want to로 바꾸기","transform_value":"We all want to meet …"}]},{"n":2,"en":"But even if that never happens, we’ve still been incredibly lucky.","ko":"그러나 그런 일이 일어나지 않더라도, 우리는 여전히 믿을 수 없을 정도로 운이 좋았다.","grammar":[{"label":"we’ve still been","explanation":"we’ve still been — 현재완료"}]},{"n":3,"en":"Four random people became great friends simply because of our names.","ko":"네 명의 무작위의 사람들은 그저 우리의 이름 때문에 좋은 친구가 되었다.","grammar":[]},{"n":4,"en":"Life can be amazing sometimes!","ko":"삶은 때때로 놀라울 수 있다!","grammar":[]}],"structure":[],"flow":[{"label":"바람","sentences":"S1","text":"언젠가 직접 만나 거리에서 음악을 연주하고 싶어 한다.","refs":[1]},{"label":"더 중요한 것","sentences":"S2","text":"만남이 실현되지 않더라도 이미 큰 행운을 얻었다고 여긴다.","refs":[2]},{"label":"결론","sentences":"S3 · S4","text":"같은 이름이라는 우연이 네 사람을 좋은 친구로 이어 주었다.","refs":[3,4]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["직접 만나지 못하더라도 같은 이름에서 시작해 깊은 우정을 얻은 것만으로도 행운이다.","언젠가 직접 만나 거리에서 음악을 연주하고 싶어 한다.","같은 이름이라는 우연이 네 사람을 좋은 친구로 이어 주었다."],"answer":0,"why":"직접 만나지 못하더라도 같은 이름에서 시작해 깊은 우정을 얻은 것만으로도 행운이다.","refs":[1,4]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","같은 이름이라는 우연이 네 사람을 좋은 친구로 이어 주었다.","언젠가 직접 만나 거리에서 음악을 연주하고 싶어 한다."],"answer":1,"why":"같은 이름이라는 우연이 네 사람을 좋은 친구로 이어 주었다.","refs":[3,4]},{"type":"문법","q":"S1의 '문장 전환' 설명으로 알맞은 것은?","choices":["would all like to meet — would like to → want to — would like to를 want to로 바꾸기","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"We all want to meet …","refs":[1]}],"key_sentence_en":"Life can be amazing sometimes!","key_sentence_ko":"삶은 때때로 놀라울 수 있다!"}]},{"id":"l2","label":"2과 · From Problems to Solutions","scope":"본문 전체","passages":[{"id":"l2-01","title":"낡은 지역에 새 활력을","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"낡아 떠나던 동네도 정부와 주민이 협력하면 다시 살기 좋은 곳으로 바뀔 수 있다.","diagram":{"kind":"steps","title":"Wallisblok의 달라진 모습","items":[{"head":"도시의 문제","body":"낡고 활기 없는 동네","refs":[1]},{"head":"협력","body":"정부와 시민이 함께 재생","refs":[2,3]},{"head":"지금","body":"가족이 살고 이웃이 만나는 곳","refs":[6,7,8,9]}]},"easy_story":"도시의 오래된 동네는 활기를 잃어 사람들이 떠나기도 합니다. 글은 정부와 주민의 협력이 해결책이라고 말하며 네덜란드의 두 사례를 예고해요. 첫 사례인 로테르담의 Wallisblok은 지금 가족들이 지내는 곳이지만 예전에는 아무도 그렇게 될 줄 몰랐습니다.","blocking_vocab":[{"word":"lifeless","meaning":"활기 없는"},{"word":"collaboration","meaning":"협력"},{"word":"revitalize","meaning":"활성화하다"},{"word":"architecture","meaning":"건축"}],"sentences":[{"n":1,"en":"As cities age, neighborhoods can become old and lifeless, which may cause citizens to move away.","ko":"<오래된 도시들에 새로운 활기 불어넣기> 도시가 오래됨에 따라 주변 지역은 낡고 활기 없어질 수 있는데, 이는 시민들을 떠나게 할 수도 있다.","grammar":[{"label":"lifeless, which may cause citizens to move away","explanation":"lifeless, which may cause citizens to move away — 관계대명사의 계속적 용법","transform_label":", which may cause citizens to move away — 계속적 용법의 관계대명사 → 두 문장 — 앞 절을 This 로 받아 두 문장으로 나눈다","transform_value":"… and lifeless. This may cause …"},{"label":"cause citizens to move away","explanation":"cause citizens to move away — cause + 목적어 + 목적격보어 to부정사"}]},{"n":2,"en":"When this happens, a collaboration between the local government and citizens is an effective way to revitalize the area.","ko":"이런 상황이 발생할 때, 지역 정부와 시민 간의 협력은 지역을 활성화시킬 효과적인 방법이다.","grammar":[]},{"n":3,"en":"Let's take a look at two projects in the Netherlands to find out what successful urban revitalization looks like.","ko":"성공적인 도시 재생이 어떤 모습인지 알아보기 위해 네덜란드의 두 프로젝트를 살펴보자.","grammar":[]},{"n":4,"en":"Rotterdam, the second largest city in the Netherlands, is known for its modern architecture and busy port.","ko":"<Wallisblok: 1유로 아파트 프로젝트> 네덜란드에서 두 번째로 가장 큰 도시인 로테르담은 현대적인 건축과 붐비는 항구로 알려져 있다.","grammar":[]},{"n":5,"en":"By taking a ten-minute tram ride west from the city center, however, you can get to a more peaceful environment.","ko":"하지만 도심에서 서쪽으로 십 분간 전차를 탐으로써, 당신은 더 평화로운 환경에 이를 수 있다.","grammar":[]},{"n":6,"en":"Instead of crowded streets, you will see neighbors chatting in front of a modern residential structure and families spending time in its garden.","ko":"붐비는 거리 대신에, 당신은 이웃들이 현대적인 주거 건축물 앞에서 이야기를 나누는 것과 가족들이 정원에서 시간을 보내는 것을 보게 될 것이다.","grammar":[]},{"n":7,"en":"The structure is a large apartment building called Wallisblok.","ko":"그 건축물은 Wallisblok이라 불리는 큰 아파트 건물이다.","grammar":[{"label":"building called","explanation":"building called — 주격 관계대명사+be 생략 · building that is called"}]},{"n":8,"en":"Not that long ago, this area was very different, and nobody thought it could become a place where families would want to live.","ko":"얼마 전까지, 이 지역은 매우 달랐고, 아무도 그곳이 가족들이 살고 싶어 할 장소가 될 수 있다고 생각하지 않았다.","grammar":[]},{"n":9,"en":"Yet that is exactly what happened.","ko":"그러나 그것이 정확히 일어난 일이다.","grammar":[]}],"structure":[],"flow":[{"label":"문제와 방법","sentences":"S1 · S2 · S3","text":"쇠퇴한 동네에서 사람이 떠나고, 정부와 시민의 협력이 재생 방법으로 제시된다.","refs":[1,2,3]},{"label":"현재 모습","sentences":"S4 · S5 · S6 · S7","text":"로테르담 Wallisblok에서는 이웃과 가족이 함께 지내는 평화로운 풍경을 볼 수 있다.","refs":[4,5,6,7]},{"label":"과거와 대조","sentences":"S8 · S9","text":"예전에는 살고 싶은 동네가 되리라고 예상하지 못했지만 실제로 변화했다.","refs":[8,9]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["쇠퇴한 동네에서 사람이 떠나고, 정부와 시민의 협력이 재생 방법으로 제시된다.","예전에는 살고 싶은 동네가 되리라고 예상하지 못했지만 실제로 변화했다.","낡아 떠나던 동네도 정부와 주민이 협력하면 다시 살기 좋은 곳으로 바뀔 수 있다."],"answer":2,"why":"낡아 떠나던 동네도 정부와 주민이 협력하면 다시 살기 좋은 곳으로 바뀔 수 있다.","refs":[1,9]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["예전에는 살고 싶은 동네가 되리라고 예상하지 못했지만 실제로 변화했다.","쇠퇴한 동네에서 사람이 떠나고, 정부와 시민의 협력이 재생 방법으로 제시된다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"예전에는 살고 싶은 동네가 되리라고 예상하지 못했지만 실제로 변화했다.","refs":[8,9]},{"type":"문법","q":"S1의 'lifeless, which may cause citizens to move away' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","lifeless, which may cause citizens to move away — 관계대명사의 계속적 용법","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"… and lifeless. This may cause …","refs":[1]}],"key_sentence_en":"Yet that is exactly what happened.","key_sentence_ko":"그러나 그것이 정확히 일어난 일이다."},{"id":"l2-02","title":"42가구가 만든 변화","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"철거 대신 빈 아파트를 1유로에 팔고 주민이 고치게 한 결과, 42가구와 동네가 함께 살아났다.","diagram":{"kind":"steps","title":"철거 대신 주민이 고친 건물","items":[{"head":"문제","body":"방치된 집·부족한 예산","refs":[1,2,3,4]},{"head":"정부의 제안","body":"1유로 매입 + 구매자가 개보수","refs":[5,6]},{"head":"주민의 참여","body":"42가구가 집과 공동 공간을 바꿈","refs":[7,9,10,12]},{"head":"결과","body":"건물과 주변 동네가 개선","refs":[13,14]}]},"easy_story":"Wallisblok은 범죄가 많고 빈집이 방치된 곳이었습니다. 정부는 돈이 부족해 새 건물을 짓는 대신 빈집을 1유로에 팔되 구매자가 직접 고치게 했어요. 창의적으로 집을 꾸미고 싶었던 42가구가 들어왔고 건물과 주변 동네까지 달라졌습니다.","blocking_vocab":[{"word":"simply","meaning":"단순히"},{"word":"abandoned","meaning":"버려진"},{"word":"illegally","meaning":"불법적으로"},{"word":"limited budget","meaning":"제한된 예산"},{"word":"renovate","meaning":"개보수하다"}],"sentences":[{"n":1,"en":"For years, the neighborhood was known for its high crime rates.","ko":"수년간, 그 지역은 높은 범죄율로 알려져 있었다.","grammar":[]},{"n":2,"en":"Many apartments in Wallisblok were abandoned and then taken over by people who lived in them illegally.","ko":"Wallisblok의 많은 아파트들은 버려졌고, 그런 다음 그것들에 불법으로 거주하는 사람들에 의해 점령되었다.","grammar":[{"label":"were abandoned and then taken over by people","explanation":"were abandoned and then taken over by people — 수동태 두 개의 병렬 · be동사 공유"},{"label":"people who lived in them illegally","explanation":"people who lived in them illegally — 사람을 받는 주격 관계대명사 who"}]},{"n":3,"en":"At first, the local government thought that the best solution was simply to tear the building down and build a new one in its place.","ko":"처음에, 지역 정부는 가장 좋은 해결책이 단순히 건물을 허물고 그 자리에 새로운 건물을 짓는 것이라고 생각했다.","grammar":[{"label":"to tear the building down and build a new one in","explanation":"to tear the building down and build a new one in — to부정사 두 개의 병렬 · 「건물을 헐고 그 자리에 새 건물을 짓는 것」","transform_label":"tear A down → demolish A — ~을 헐다, 철거하다","transform_value":"… simply to demolish the building …"}]},{"n":4,"en":"However, having a limited budget, the government was unable to do so and had to come up with a new plan.","ko":"그러나 제한된 예산을 지니고 있어서, 정부는 그렇게 할 수 없었고 새로운 계획을 생각해 내야 했다.","grammar":[]},{"n":5,"en":"The plan was to sell the empty apartments for one euro each.","ko":"그 계획은 비어 있는 아파트들을 각각 1유로에 판매하는 것이었다.","grammar":[]},{"n":6,"en":"The only condition was that people who bought these apartments needed to renovate them.","ko":"유일한 조건은 이러한 아파트들을 사는 사람들이 그것들을 개조해야 한다는 것이었다.","grammar":[]},{"n":7,"en":"Although the new residents would have to pay for these renovations, the government's plan soon attracted many applicants.","ko":"새로운 거주자들이 이러한 보수 공사에 돈을 지불해야 했음에도, 정부의 계획은 곧 많은 신청자들을 끌어들였다.","grammar":[]},{"n":8,"en":"Apparently, it was not just the idea of one-euro apartments that people found attractive.","ko":"보아하니, 사람들이 매력적으로 여긴 것은 단지 1유로 아파트라는 아이디어뿐만이 아니었다.","grammar":[]},{"n":9,"en":"They were also excited by the opportunity to use their creativity to improve the building.","ko":"그들은 또한 건물을 개선하기 위해 그들의 창의성을 이용할 수 있는 기회에도 흥미를 느꼈다.","grammar":[]},{"n":10,"en":"In the end, 42 new families moved into Wallisblok.","ko":"마침내, 42개의 새로운 가족이 Wallisblok으로 이사했다.","grammar":[]},{"n":11,"en":"The government's bold plan was a success.","ko":"정부의 대담한 계획은 성공이었다.","grammar":[]},{"n":12,"en":"The residents transformed the old, worn-out building into 42 unique apartments with a community garden and rooftop terrace.","ko":"거주자들은 오래되고 낡은 건물을 공동체 정원과 옥상 테라스가 있는 42개의 독특한 아파트로 바꿔 놓았다.","grammar":[{"label":"with a community garden and rooftop terrace","explanation":"with a community garden and rooftop terrace — 전치사 with + 명사 병렬"}]},{"n":13,"en":"The surrounding area soon began to improve as well.","ko":"주변 지역도 이내 개선되기 시작했다.","grammar":[]},{"n":14,"en":"Today, Wallisblok is one of the most desirable places to live in Rotterdam.","ko":"오늘날, Wallisblok은 로테르담에서 가장 살기 좋은 장소들 중 하나이다.","grammar":[]}],"structure":[],"flow":[{"label":"위기","sentences":"S1 · S2 · S3 · S4","text":"범죄와 빈집 문제가 있었지만 정부 예산으로 철거·신축하기 어려웠다.","refs":[1,2,3,4]},{"label":"새 조건","sentences":"S5 · S6 · S7 · S8 · S9","text":"빈집을 1유로에 파는 대신 새 주민이 직접 개보수하게 했다.","refs":[5,6,7,8,9]},{"label":"변화","sentences":"S10 · S11 · S12 · S13 · S14","text":"42가구가 개성 있는 집과 공동 공간을 만들고 주변 지역도 좋아졌다.","refs":[10,11,12,13,14]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["42가구가 개성 있는 집과 공동 공간을 만들고 주변 지역도 좋아졌다.","철거 대신 빈 아파트를 1유로에 팔고 주민이 고치게 한 결과, 42가구와 동네가 함께 살아났다.","범죄와 빈집 문제가 있었지만 정부 예산으로 철거·신축하기 어려웠다."],"answer":1,"why":"철거 대신 빈 아파트를 1유로에 팔고 주민이 고치게 한 결과, 42가구와 동네가 함께 살아났다.","refs":[1,14]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["42가구가 개성 있는 집과 공동 공간을 만들고 주변 지역도 좋아졌다.","범죄와 빈집 문제가 있었지만 정부 예산으로 철거·신축하기 어려웠다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"42가구가 개성 있는 집과 공동 공간을 만들고 주변 지역도 좋아졌다.","refs":[10,11,12,13,14]},{"type":"문법","q":"S2의 'were abandoned and then taken over by people' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","were abandoned and then taken over by people — 수동태 두 개의 병렬 · be동사 공유"],"answer":2,"why":"were abandoned and then taken over by people — 수동태 두 개의 병렬 · be동사 공유","refs":[2]}],"key_sentence_en":"Today, Wallisblok is one of the most desirable places to live in Rotterdam.","key_sentence_ko":"오늘날, Wallisblok은 로테르담에서 가장 살기 좋은 장소들 중 하나이다."},{"id":"l2-03","title":"오염된 조선소를 다시 보다","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"오염된 옛 조선소를 바꾸기 위해 시는 시민에게 토지 정화와 창의적 작업 공간을 함께 이루는 계획을 요청했다.","diagram":{"kind":"goals","title":"De Ceuvel 계획에 필요한 두 목표","items":[{"head":"출발점","body":"버려지고 오염된 옛 조선소","refs":[1,2,3,4]},{"head":"목표 1","body":"땅을 정화하고 지속 가능하게 개발","refs":[6,7]},{"head":"목표 2","body":"창의적인 작업 공간 마련","refs":[6,8]}]},"easy_story":"암스테르담 북쪽의 조선소와 공장이 문을 닫자 땅이 오래 버려지고 오염됐습니다. 시는 De Ceuvel 조선소를 샀지만 활용 방법을 몰랐어요. 그래서 시민들에게 오염된 땅을 지속 가능하게 정리하고 창의적인 작업 공간도 만드는 방안을 부탁했습니다.","blocking_vocab":[{"word":"achieve","meaning":"성취하다"},{"word":"abandoned","meaning":"버려진"},{"word":"shipyard","meaning":"조선소"},{"word":"official","meaning":"공무원"},{"word":"sustainable","meaning":"지속 가능한"}],"sentences":[{"n":1,"en":"In the early 20th century, there was an area in the northern part of Amsterdam that was full of shipyards and factories.","ko":"<De Ceuvel: 친환경 기술 놀이터> 20세기 초, 암스테르담 북부에는 조선소와 공장들로 가득 찬 지역이 있었다.","grammar":[]},{"n":2,"en":"Over time, the shipyards closed down, and the work once done at the factories was moved abroad.","ko":"시간이 흘러 조선소들은 문을 닫았고, 한때 공장에서 행해지던 일들은 해외로 옮겨졌다.","grammar":[{"label":"work once","explanation":"work once — 주격 관계대명사+be 생략 · work that was once","transform_label":"the work once done at the factories was moved abroad — 과거분사의 후치수식 · 본동사 구별 → 관계사절 — 분사 앞에 관계대명사와 be동사를 되살린다","transform_value":"… the work that was once done …"}]},{"n":3,"en":"As a result, the area was left abandoned and polluted for years.","ko":"그 결과, 그 지역은 수년 동안 버려지고 오염되어 있었다.","grammar":[]},{"n":4,"en":"Wanting to do something to improve the area, the city purchased an abandoned shipyard called De Ceuvel.","ko":"그 지역을 개선할 무언가를 하고 싶었기 때문에, 그 도시는 De Ceuvel이라고 불리는 버려진 조선소를 매입했다.","grammar":[{"label":"shipyard called","explanation":"shipyard called — 주격 관계대명사+be 생략 · shipyard that was called","transform_label":"Wanting to do something to improve the area — 분사구문 · 숨은 주어 → 이유 부사절 — 분사의 숨은 주어는 주절 주어 the city 다","transform_value":"Because it wanted to do …"}]},{"n":5,"en":"However, city officials did not know what to do with it.","ko":"그러나 시 공무원들은 그것으로 무엇을 해야 할지 몰랐다.","grammar":[]},{"n":6,"en":"So they turned to the public for help by asking for plans that would achieve two primary goals.","ko":"그래서 그들은 두 가지 주요 목표를 달성할 계획을 요청함으로써 대중에게 의지하여 도움을 구했다.","grammar":[]},{"n":7,"en":"First, the plan had to include a method to clean up the land and turn it into a sustainable development.","ko":"첫째, 그 계획은 땅을 정화하고 그것을 지속 가능한 개발지로 변화시킬 방법을 포함해야 했다.","grammar":[]},{"n":8,"en":"Second, it had to suggest a way to transform the site into a creative workspace.","ko":"둘째, 그것은 그 장소를 창의적인 업무 공간으로 변형시킬 방법을 제안해야 했다.","grammar":[]}],"structure":[],"flow":[{"label":"쇠퇴","sentences":"S1 · S2 · S3","text":"조선소 폐쇄와 공장 이전 뒤 그 지역이 오랫동안 방치·오염되었다.","refs":[1,2,3]},{"label":"시의 선택","sentences":"S4 · S5 · S6","text":"시는 옛 조선소를 샀지만 활용 방안을 몰라 시민의 제안을 받았다.","refs":[4,5,6]},{"label":"두 목표","sentences":"S7 · S8","text":"토지 정화·지속 가능한 개발과 창의적 작업 공간이 모두 필요했다.","refs":[7,8]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["토지 정화·지속 가능한 개발과 창의적 작업 공간이 모두 필요했다.","오염된 옛 조선소를 바꾸기 위해 시는 시민에게 토지 정화와 창의적 작업 공간을 함께 이루는 계획을 요청했다.","조선소 폐쇄와 공장 이전 뒤 그 지역이 오랫동안 방치·오염되었다."],"answer":1,"why":"오염된 옛 조선소를 바꾸기 위해 시는 시민에게 토지 정화와 창의적 작업 공간을 함께 이루는 계획을 요청했다.","refs":[1,8]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["토지 정화·지속 가능한 개발과 창의적 작업 공간이 모두 필요했다.","조선소 폐쇄와 공장 이전 뒤 그 지역이 오랫동안 방치·오염되었다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"토지 정화·지속 가능한 개발과 창의적 작업 공간이 모두 필요했다.","refs":[7,8]},{"type":"문법","q":"S2의 'work once' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","work once — 주격 관계대명사+be 생략 · work that was once","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"… the work that was once done …","refs":[2]}],"key_sentence_en":"Second, it had to suggest a way to transform the site into a creative workspace.","key_sentence_ko":"둘째, 그것은 그 장소를 창의적인 업무 공간으로 변형시킬 방법을 제안해야 했다."},{"id":"l2-04","title":"업사이클링 업무 지구","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"오염된 땅에는 기초를 놓기 어려워 낡은 배를 사무 공간으로 바꾸고 길과 정화 식물을 더했다.","diagram":{"kind":"steps","title":"오염된 조선소를 쓰는 방법","items":[{"head":"건물 기초 불가","body":"오염된 진흙 땅","refs":[2,3]},{"head":"낡은 배 활용","body":"작업실·문화 공간으로 고침","refs":[3,4,5]},{"head":"주변 정리","body":"나무 길과 정화 식물","refs":[6,7]},{"head":"오늘","body":"기술 시험·방문 장소","refs":[8,9]}]},"easy_story":"건축 회사는 De Ceuvel을 친환경 사무 구역으로 만들기로 했습니다. 오염된 진흙 땅에는 건물 기초를 놓기 어려워 버려진 배를 싸게 사서 작업 공간으로 고쳤어요. 배 사이에는 나무 길을 놓고 땅을 정화하는 식물도 심었습니다.","blocking_vocab":[{"word":"in person","meaning":"직접"},{"word":"abandoned","meaning":"버려진"},{"word":"shipyard","meaning":"조선소"},{"word":"innovative","meaning":"혁신적인"},{"word":"lease","meaning":"임대차 계약"}],"sentences":[{"n":1,"en":"In the end, an architectural company submitted an innovative plan and was awarded a ten-year lease on the former shipyard.","ko":"마침내, 한 건축 회사가 획기적인 계획을 제출했고 이전의 조선소에 대한 10년 임대차 계약을 받았다.","grammar":[]},{"n":2,"en":"The plan was to turn the site into a sustainable office park.","ko":"그 계획은 그 장소를 지속 가능한 복합 상업 지구로 변화시키는 것이었다.","grammar":[]},{"n":3,"en":"Since it was impossible to build foundations on the oily mud of the polluted land, the architects decided to use old, abandoned boats instead.","ko":"오염된 땅의 기름진 진흙에 기반을 구축하는 것은 불가능했기 때문에, 건축가들은 대신에 낡고, 버려진 배들을 사용하기로 결정했다.","grammar":[]},{"n":4,"en":"They were able to purchase these at low prices from the boats' owners.","ko":"그들은 이것들을 배의 소유주들로부터 낮은 가격에 구입할 수 있었다.","grammar":[]},{"n":5,"en":"The architects created a small community that includes creative workspaces, studios, meeting rooms, cultural spaces, and even a cafe, all by upcycling the boats.","ko":"건축가들은 배들을 업사이클함으로써 창의적인 업무 공간, 스튜디오, 회의실, 문화 공간, 심지어 카페까지 포함하는 작은 공동체를 만들어 냈다.","grammar":[{"label":"workspaces, studios, meeting rooms, cultural spaces, and even a cafe","explanation":"workspaces, studios, meeting rooms, cultural spaces, and even a cafe — 명사 병렬","transform_label":"a small community that includes — 주격 관계대명사 · 선행사에 맞춘 동사 → 두 문장 — 관계대명사를 대명사 It 으로 바꿔 문장을 나눈다","transform_value":"… small community by upcycling the boats. It includes creative …"}]},{"n":6,"en":"Then, to connect the boats, wooden paths were built.","ko":"그런 다음, 배들을 연결하기 위해 나무로 된 길이 만들어졌다.","grammar":[]},{"n":7,"en":"In addition, special plants that purify polluted soil were planted across the site.","ko":"또한 오염된 토양을 정화하는 특별한 식물들이 그 장소 전체에 심어졌다.","grammar":[{"label":"special plants that purify polluted soil were planted","explanation":"special plants that purify polluted soil were planted — 주격 관계대명사 that · 관계절이 낀 자리의 수 일치","transform_label":"special plants that purify polluted soil — 식물을 꾸미는 주격 관계사절 → 현재분사구 — 「관계대명사 + 동사」를 현재분사 하나로 줄인다","transform_value":"… special plants purifying polluted soil …"}]},{"n":8,"en":"Today, some people come to De Ceuvel to test new sustainable technologies such as bio-filters and water reuse systems.","ko":"오늘날, 어떤 사람들은 바이오필터와 물 재사용 체계와 같은 새로운 지속 가능한 기술들을 시험해 보기 위해 De Ceuvel에 온다.","grammar":[]},{"n":9,"en":"Many others come to experience this successful revitalization project in person.","ko":"많은 다른 이들은 직접 이 성공적인 재활성화 프로젝트를 경험하러 온다.","grammar":[]}],"structure":[],"flow":[{"label":"계획과 제약","sentences":"S1 · S2 · S3","text":"건축 회사가 임대받아 사무 구역을 구상하지만 오염된 진흙에는 기초를 세울 수 없다.","refs":[1,2,3]},{"label":"배를 활용","sentences":"S3 · S4 · S5","text":"버려진 배를 싸게 사서 작업실·회의실·문화 공간 등으로 고친다.","refs":[3,4,5]},{"label":"연결과 정화","sentences":"S6 · S7","text":"나무 길로 배를 잇고 오염된 토양을 정화하는 식물을 심는다.","refs":[6,7]},{"label":"현재","sentences":"S8 · S9","text":"지속 가능한 기술을 시험하거나 재생된 공간을 보러 사람들이 찾는다.","refs":[8,9]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":[ ow known as — be known as + 자격","transform_label":"be known as N → be regarded as N — ~로 여겨지다","transform_value":"… is now regarded as one …"}]},{"n":2,"en":"At the end of the lease, the project will also leave behind a more valuable piece of land for the next people who use it.","ko":"임대 계약 종료 시에, 그 프로젝트는 또한 그것을 이용할 다음 사람들을 위한 더 귀중한 땅덩어리를 남기게 될 것이다.","grammar":[]},{"n":3,"en":"These two examples of urban revitalization in the Netherlands required much more than a budget and a plan.","ko":"네덜란드에서의 이러한 두 가지 도시 재생 사례들은 예산과 계획보다 훨씬 더 많은 것들을 필요로 했다.","grammar":[]},{"n":4,"en":"Innovative thinking, creativity, community spirit, and cooperation were all vital to their success.","ko":"혁신적인 사고, 창의성, 공동체 의식, 그리고 협력이 모두 그것들의 성공에 필수적이었다.","grammar":[]},{"n":5,"en":"These projects are great sources of inspiration for other cities that are looking to bring new life to abandoned areas.","ko":"이 프로젝트들은 버려진 지역에 새로운 생명을 가져오기를 기대하고 있는 다른 도시들을 위한 대단한 영감의 원천이다.","grammar":[{"label":"other cities that are looking to bring","explanation":"other cities that are looking to bring — 사물을 받는 주격 관계대명사 that · 현재진행형","transform_label":"other cities that are looking to bring new life to abandoned areas → 분사구 — that are 를 통째로 지우면 분사구만 남는다","transform_value":"These projects are great sources of inspiration for other cities looking to bring new life to abandoned areas."}]}],"structure":[],"flow":[{"label":"De Ceuvel의 성과","sentences":"S1 · S2","text":"친환경 기술의 실험장이 되었고 다음 이용자에게 더 나은 땅을 남기게 된다.","refs":[1,2]},{"label":"두 사례의 공통점","sentences":"S3 · S4","text":"Wallisblok과 De Ceuvel에는 돈·계획 외에 창의성과 공동체 협력이 중요했다.","refs":[3,4]},{"label":"확장","sentences":"S5","text":"버려진 지역을 되살리려는 다른 도시에도 본보기가 된다.","refs":[5]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["친환경 기술의 실험장이 되었고 다음 이용자에게 더 나은 땅을 남기게 된다.","버려진 지역을 되살리려는 다른 도시에도 본보기가 된다.","두 도시 재생 사례의 성공에는 돈과 계획뿐 아니라 창의성, 공동체 정신, 협력이 필요했다."],"answer":2,"why":"두 도시 재생 사례의 성공에는 돈과 계획뿐 아니라 창의성, 공동체 정신, 협력이 필요했다.","refs":[1,5]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["친환경 기술의 실험장이 되었고 다음 이용자에게 더 나은 땅을 남기게 된다.","앞의 사건과 관계없는 새 주제","버려진 지역을 되살리려는 다른 도시에도 본보기가 된다."],"answer":2,"why":"버려진 지역을 되살리려는 다른 도시에도 본보기가 된다.","refs":[5]},{"type":"문법","q":"S1의 'is now known as' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","is now known as — be known as + 자격"],"answer":2,"why":"… is now regarded as one …","refs":[1]}],"key_sentence_en":"These projects are great sources of inspiration for other cities that are looking to bring new life to abandoned areas.","key_sentence_ko":"이 프로젝트들은 버려진 지역에 새로운 생명을 가져오기를 기대하고 있는 다른 도시들을 위한 대단한 영감의 원천이다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 대아고1 교과서 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button>${s.grammar?.length?` <button class="reveal grammar-open" data-toggle="grammar">문법 포인트</button>`:''}<p class="translation">${esc(s.ko)}</p>${s.grammar?.length?`<div class="grammar-panel">${s.grammar.map(g=>`<div class="grammar-item"><b>${esc(g.label)}</b><p>${esc(g.explanation)}</p>${g.transform_value?`<small>시험에서는 이렇게 바꿀 수 있어요.</small><p class="grammar-transform">${esc(g.transform_value)}</p>`:''}</div>`).join('')}</div>`:''}</div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section ${prediction?'has-prediction':''}" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.parentElement.querySelector('.translation');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='grammar'){const target=btn.parentElement.querySelector('.grammar-panel');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'문법 닫기':'문법 포인트'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

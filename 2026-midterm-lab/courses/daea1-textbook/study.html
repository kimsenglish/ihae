.diagram{overflow:hidden}

/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items,.diagram.diagram-argument .diagram-items,

.diagram.diagram-steps-response .diagram-items,.diagram.diagram-cause-response .diagram-items,

.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card,.diagram.diagram-argument .diagram-card,
.diagram.diagram-steps-possible .diagram-card,.diagram.diagram-case-advice .diagram-card,
.diagram.diagram-steps-response .diagram-card,.diagram.diagram-cause-response .diagram-card,

.diagram.diagram-steps .diagram-card:before,.diagram.diagram-timeline .diagram-card:before,
.diagram.diagram-cycle .diagram-card:before,.diagram.diagram-argument .diagram-card:before,

  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;

.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-possible .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-case-advice .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-response .diagram-items .diagram-card:not(:last-child):after,

  font-weight:750;margin:-13px 0 0 4px}
/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}

  color:#176b52;font-size:18px;font-weight:900;white-space:pre}

  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

  border-top:5px solid #1b795c;background:linear-gradient(180deg,#f9fffb,#fff 48%)}
.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}

.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));

.diagram.diagram-dose .diagram-items:before{content:'';position:absolute;top:10px;left:10%;right:10%;height:5px;
  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}

.diagram.diagram-dose .diagram-card b{font-size:18px}
/* Cooking: familiar side benefits are distinct from the source's energy-to-adaptation claim. */
.diagram.diagram-energy-route .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px}
.diagram.diagram-energy-route .diagram-card{position:relative;min-width:0;border-top:5px solid #237c5c;padding-top:35px;background:#fffdf8}
.diagram.diagram-energy-route .diagram-card:first-child{grid-column:1/-1;border:1px dashed #a9b8ad;background:#f8faf6;padding:10px 14px}
.diagram.diagram-energy-route .diagram-card:first-child:before{content:'먼저 떠오르는 장점';display:block;color:#65766b;font-size:11px;font-weight:800;margin-bottom:3px}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}
.diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'→';position:absolute;right:-19px;top:calc(50% - 16px);color:#176b52;font-size:26px;font-weight:900;z-index:1}
.diagram.diagram-energy-route .diagram-card:nth-child(2){background:#e5f4e9}.diagram.diagram-energy-route .diagram-card:nth-child(4){background:#fff2d9;border-top-color:#b78539}
/* Three alternative survival responses, not three consecutive steps. */
.diagram.diagram-reaction-options .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 10px}
.diagram.diagram-reaction-options .diagram-card:first-child{grid-column:1/-1;text-align:center;background:#dceee5;border:2px solid #82baa2;position:relative}
.diagram.diagram-reaction-options .diagram-card:first-child:after{content:'↙    ↓    ↘';position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:#176b52;font-weight:900;font-size:21px;white-space:pre}
.diagram.diagram-reaction-options .diagram-card:not(:first-child){text-align:center;border-top:5px solid #247b5b}
.diagram.diagram-reaction-options .diagram-card:not(:first-child) b{font-size:20px}
.diagram.diagram-reaction-options .diagram-card:not(:first-child):before{display:block;font-size:27px;line-height:1;margin-bottom:8px;color:#176b52}
.diagram.diagram-reaction-options .diagram-card:nth-child(2):before{content:'⏸'}.diagram.diagram-reaction-options .diagram-card:nth-child(3):before{content:'➜'}.diagram.diagram-reaction-options .diagram-card:nth-child(4):before{content:'↗'}

.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}

  margin-top:14px;padding:10px 12px;text-align:center;color:#14543f}
/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}

  color:#176b52;font-size:24px;line-height:1}
.diagram.diagram-dialogue .diagram-card:after{content:'';position:absolute;left:12px;top:42px;
  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}

.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}
/* A claim supported by parallel examples ends in one explicit conclusion. */

.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}

.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(-n+2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(-n+2){border-top:5px solid #1b795c}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}

.diagram.diagram-analogy .diagram-card:nth-child(1){border-top:5px solid #1b795c}
.diagram.diagram-analogy .diagram-card:nth-child(2){border-top:5px solid #bd8141}
.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Three roles are simultaneous parts of one contrast, not a causal sequence. */
.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diagram.diagram-roles-contrast .diagram-card{border-top:5px solid #1b795c}

 먼저 놓는다 → 관과 시민이 손잡는 길을 답으로 내놓는다 → 두 사례를 보겠다고 읽을 차례를 예고한다","refs":[1,2,3]},{"head":"전개","body":"첫 사례가 놓인 도시의 인상을 먼저 그린다 → 도심에서 벗어난 다른 분위기로 눈을 옮긴다 → 이웃과 가족이 어울리는 지금 모습을 보여 준다","refs":[4,5,6]},{"head":"도착","body":"그 건물의 이름을 밝혀 이야기의 초점을 잡는다 → 예전에는 아무도 기대하지 않던 곳임을 밝힌다 → 그 기대 밖의 일이 실제로 일어났다고 못 박는다","refs":[7,8,9]}],"takeaway":"낡은 지역에 새 활력을: 도시가 늙으면 사람이 떠난다는 사정을 먼저 놓는다 → 그 기대 밖의 일이 실제로 일어났다고 못 박는다"},"easy_story":"도시가 늙으면 사람이 떠난다는 사정을 먼저 놓는다 → 관과 시민이 손잡는 길을 답으로 내놓는다 → 두 사례를 보겠다고 읽을 차례를 예고한다. 첫 사례가 놓인 도시의 인상을 먼저 그린다 → 도심에서 벗어난 다른 분위기로 눈을 옮긴다 → 이웃과 가족이 어울리는 지금 모습을 보여 준다. 그 건물의 이름을 밝혀 이야기의 초점을 잡는다 → 예전에는 아무도 기대하지 않던 곳임을 밝힌다 → 그 기대 밖의 일이 실제로 일어났다고 못 박는다.","blocking_vocab":[{"word":"lifeless","meaning":"활기 없는"},{"word":"collaboration","meaning":"협력"},{"word":"revitalize","meaning":"활성화하다"},{"word":"architecture","meaning":"건축"}],"sentences":[{"n":1,"en":"As cities age, neighborhoods can become old and lifeless, which may cause citizens to move away.","ko":"<오래된 도시들에 새로운 활기 불어넣기> 도시가 오래됨에 따라 주변 지역은 낡고 활기 없어질 수 있는데, 이는 시민들을 떠나게 할 수도 있다.","grammar":[{"label":"lifeless, which may cause citizens to move away","explanation":"lifeless, which may cause citizens to move away — 관계대명사의 계속적 용법","transform_label":", which may cause citizens to move away — 계속적 용법의 관계대명사 → 두 문장 — 앞 절을 This 로 받아 두 문장으로 나눈다","transform_value":"… and lifeless. This may cause …"},{"label":"cause citizens to move away","explanation":"cause citizens to move away — cause + 목적어 + 목적격보어 to부정사"}]},{"n":2,"en":"When this happens, a collaboration between the local government and citizens is an effective way to revitalize the area.","ko":"이런 상황이 발생할 때, 지역 정부와 시민 간의 협력은 지역을 활성화시킬 효과적인 방법이다.","grammar":[]},{"n":3,"en":"Let's take a look at two projects in the Netherlands to find out what successful urban revitalization looks like.","ko":"성공적인 도시 재생이 어떤 모습인지 알아보기 위해 네덜란드의 두 프로젝트를 살펴보자.","grammar":[]},{"n":4,"en":"Rotterdam, the second largest city in the Netherlands, is known for its modern architecture and busy port.","ko":"<Wallisblok: 1유로 아파트 프로젝트> 네덜란드에서 두 번째로 가장 큰 도시인 로테르담은 현대적인 건축과 붐비는 항구로 알려져 있다.","grammar":[]},{"n":5,"en":"By taking a ten-minute tram ride west from the city center, however, you can get to a more peaceful environment.","ko":"하지만 도심에서 서쪽으로 십 분간 전차를 탐으로써, 당신은 더 평화로운 환경에 이를 수 있다.","grammar":[]},{"n":6,"en":"Instead of crowded streets, you will see neighbors chatting in front of a modern residential structure and families spending time in its garden.","ko":"붐비는 거리 대신에, 당신은 이웃들이 현대적인 주거 건축물 앞에서 이야기를 나누는 것과 가족들이 정원에서 시간을 보내는 것을 보게 될 것이다.","grammar":[]},{"n":7,"en":"The structure is a large apartment building called Wallisblok.","ko":"그 건축물은 Wallisblok이라 불리는 큰 아파트 건물이다.","grammar":[{"label":"building called","explanation":"building called — 주격 관계대명사+be 생략 · building that is called"}]},{"n":8,"en":"Not that long ago, this area was very different, and nobody thought it could become a place where families would want to live.","ko":"얼마 전까지, 이 지역은 매우 달랐고, 아무도 그곳이 가족들이 살고 싶어 할 장소가 될 수 있다고 생각하지 않았다.","grammar":[]},{"n":9,"en":"Yet that is exactly what happened.","ko":"그러나 그것이 정확히 일어난 일이다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3","text":"도시가 늙으면 사람이 떠난다는 사정을 먼저 놓는다 → 관과 시민이 손잡는 길을 답으로 내놓는다 → 두 사례를 보겠다고 읽을 차례를 예고한다","refs":[1,2,3]},{"label":"전개","sentences":"S4 · S5 · S6","text":"첫 사례가 놓인 도시의 인상을 먼저 그린다 → 도심에서 벗어난 다른 분위기로 눈을 옮긴다 → 이웃과 가족이 어울리는 지금 모습을 보여 준다","refs":[4,5,6]},{"label":"도착","sentences":"S7 · S8 · S9","text":"그 건물의 이름을 밝혀 이야기의 초점을 잡는다 → 예전에는 아무도 기대하지 않던 곳임을 밝힌다 → 그 기대 밖의 일이 실제로 일어났다고 못 박는다","refs":[7,8,9]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["도시가 늙으면 사람이 떠난다는 사정을 먼저 놓는다 → 관과 시민이 손잡는 길을 답으로 내놓는다 → 두 사례를 보겠다고 읽을 차례를 예고한다","그 건물의 이름을 밝혀 이야기의 초점을 잡는다 → 예전에는 아무도 기대하지 않던 곳임을 밝힌다 → 그 기대 밖의 일이 실제로 일어났다고 못 박는다","낡은 지역에 새 활력을: 도시가 늙으면 사람이 떠난다는 사정을 먼저 놓는다 → 그 기대 밖의 일이 실제로 일어났다고 못 박는다"],"answer":2,"why":"낡은 지역에 새 활력을: 도시가 늙으면 사람이 떠난다는 사정을 먼저 놓는다 → 그 기대 밖의 일이 실제로 일어났다고 못 박는다","refs":[1,9]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["그 건물의 이름을 밝혀 이야기의 초점을 잡는다 → 예전에는 아무도 기대하지 않던 곳임을 밝힌다 → 그 기대 밖의 일이 실제로 일어났다고 못 박는다","도시가 늙으면 사람이 떠난다는 사정을 먼저 놓는다 → 관과 시민이 손잡는 길을 답으로 내놓는다 → 두 사례를 보겠다고 읽을 차례를 예고한다","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"그 건물의 이름을 밝혀 이야기의 초점을 잡는다 → 예전에는 아무도 기대하지 않던 곳임을 밝힌다 → 그 기대 밖의 일이 실제로 일어났다고 못 박는다","refs":[7,8,9]},{"type":"문법","q":"S1의 'lifeless, which may cause citizens to move away' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","lifeless, which may cause citizens to move away — 관계대명사의 계속적 용법","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"… and lifeless. This may cause …","refs":[1]}],"key_sentence_en":"Yet that is exactly what happened.","key_sentence_ko":"그러나 그것이 정확히 일어난 일이다."},{"id":"l2-02","title":"42가구가 만든 변화","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"42가구가 만든 변화: 이 동네가 범죄로 이름났던 때를 되짚는다 → 지금은 살고 싶은 곳이 되었다고 첫 사례를 닫는다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"이 동네가 범죄로 이름났던 때를 되짚는다 → 빈집이 불법 점거로 이어진 흐름을 짚는다 → 허물고 새로 짓겠다던 처음 생각을 든다 → 예산에 막혀 그 길을 접었음을 밝힌다 → 1유로에 팔겠다는 뜻밖의 계획을 꺼낸다","refs":[1,2,3,4,5]},{"head":"전개","body":"사는 사람이 고쳐야 한다는 단서를 붙인다 → 돈이 드는데도 신청자가 몰렸음을 알린다 → 값싼 집만이 끌린 이유가 아니었다고 바로잡는다 → 손수 꾸밀 기회가 더 컸음을 덧붙인다","refs":[6,7,8,9]},{"head":"도착","body":"실제로 들어온 가구 수로 결과를 확인시킨다 → 대담한 계획이 통했다고 값매긴다 → 낡은 건물이 어떻게 달라졌는지 구체로 든다 → 변화가 건물 밖 동네까지 번졌음을 짚는다 → 지금은 살고 싶은 곳이 되었다고 첫 사례를 닫는다","refs":[10,11,12,13,14]}],"takeaway":"42가구가 만든 변화: 이 동네가 범죄로 이름났던 때를 되짚는다 → 지금은 살고 싶은 곳이 되었다고 첫 사례를 닫는다"},"easy_story":"이 동네가 범죄로 이름났던 때를 되짚는다 → 빈집이 불법 점거로 이어진 흐름을 짚는다 → 허물고 새로 짓겠다던 처음 생각을 든다 → 예산에 막혀 그 길을 접었음을 밝힌다 → 1유로에 팔겠다는 뜻밖의 계획을 꺼낸다. 사는 사람이 고쳐야 한다는 단서를 붙인다 → 돈이 드는데도 신청자가 몰렸음을 알린다 → 값싼 집만이 끌린 이유가 아니었다고 바로잡는다 → 손수 꾸밀 기회가 더 컸음을 덧붙인다. 실제로 들어온 가구 수로 결과를 확인시킨다 → 대담한 계획이 통했다고 값매긴다 → 낡은 건물이 어떻게 달라졌는지 구체로 든다 → 변화가 건물 밖 동네까지 번졌음을 짚는다 → 지금은 살고 싶은 곳이 되었다고 첫 사례를 닫는다.","blocking_vocab":[{"word":"simply","meaning":"단순히"},{"word":"abandoned","meaning":"버려진"},{"word":"illegally","meaning":"불법적으로"},{"word":"limited budget","meaning":"제한된 예산"},{"word":"renovate","meaning":"개보수하다"}],"sentences":[{"n":1,"en":"For years, the neighborhood was known for its high crime rates.","ko":"수년간, 그 지역은 높은 범죄율로 알려져 있었다.","grammar":[]},{"n":2,"en":"Many apartments in Wallisblok were abandoned and then taken over by people who lived in them illegally.","ko":"Wallisblok의 많은 아파트들은 버려졌고, 그런 다음 그것들에 불법으로 거주하는 사람들에 의해 점령되었다.","grammar":[{"label":"were abandoned and then taken over by people","explanation":"were abandoned and then taken over by people — 수동태 두 개의 병렬 · be동사 공유"},{"label":"people who lived in them illegally","explanation":"people who lived in them illegally — 사람을 받는 주격 관계대명사 who"}]},{"n":3,"en":"At first, the local government thought that the best solution was simply to tear the building down and build a new one in its place.","ko":"처음에, 지역 정부는 가장 좋은 해결책이 단순히 건물을 허물고 그 자리에 새로운 건물을 짓는 것이라고 생각했다.","grammar":[{"label":"to tear the building down and build a new one in","explanation":"to tear the building down and build a new one in — to부정사 두 개의 병렬 · 「건물을 헐고 그 자리에 새 건물을 짓는 것」","transform_label":"tear A down → demolish A — ~을 헐다, 철거하다","transform_value":"… simply to demolish the building …"}]},{"n":4,"en":"However, having a limited budget, the government was unable to do so and had to come up with a new plan.","ko":"그러나 제한된 예산을 지니고 있어서, 정부는 그렇게 할 수 없었고 새로운 계획을 생각해 내야 했다.","grammar":[]},{"n":5,"en":"The plan was to sell the empty apartments for one euro each.","ko":"그 계획은 비어 있는 아파트들을 각각 1유로에 판매하는 것이었다.","grammar":[]},{"n":6,"en":"The only condition was that people who bought these apartments needed to renovate them.","ko":"유일한 조건은 이러한 아파트들을 사는 사람들이 그것들을 개조해야 한다는 것이었다.","grammar":[]},{"n":7,"en":"Although the new residents would have to pay for these renovations, the government's plan soon attracted many applicants.","ko":"새로운 거주자들이 이러한 보수 공사에 돈을 지불해야 했음에도, 정부의 계획은 곧 많은 신청자들을 끌어들였다.","grammar":[]},{"n":8,"en":"Apparently, it was not just the idea of one-euro apartments that people found attractive.","ko":"보아하니, 사람들이 매력적으로 여긴 것은 단지 1유로 아파트라는 아이디어뿐만이 아니었다.","grammar":[]},{"n":9,"en":"They were also excited by the opportunity to use their creativity to improve the building.","ko":"그들은 또한 건물을 개선하기 위해 그들의 창의성을 이용할 수 있는 기회에도 흥미를 느꼈다.","grammar":[]},{"n":10,"en":"In the end, 42 new families moved into Wallisblok.","ko":"마침내, 42개의 새로운 가족이 Wallisblok으로 이사했다.","grammar":[]},{"n":11,"en":"The government's bold plan was a success.","ko":"정부의 대담한 계획은 성공이었다.","grammar":[]},{"n":12,"en":"The residents transformed the old, worn-out building into 42 unique apartments with a community garden and rooftop terrace.","ko":"거주자들은 오래되고 낡은 건물을 공동체 정원과 옥상 테라스가 있는 42개의 독특한 아파트로 바꿔 놓았다.","grammar":[{"label":"with a community garden and rooftop terrace","explanation":"with a community garden and rooftop terrace — 전치사 with + 명사 병렬"}]},{"n":13,"en":"The surrounding area soon began to improve as well.","ko":"주변 지역도 이내 개선되기 시작했다.","grammar":[]},{"n":14,"en":"Today, Wallisblok is one of the most desirable places to live in Rotterdam.","ko":"오늘날, Wallisblok은 로테르담에서 가장 살기 좋은 장소들 중 하나이다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4 · S5","text":"이 동네가 범죄로 이름났던 때를 되짚는다 → 빈집이 불법 점거로 이어진 흐름을 짚는다 → 허물고 새로 짓겠다던 처음 생각을 든다 → 예산에 막혀 그 길을 접었음을 밝힌다 → 1유로에 팔겠다는 뜻밖의 계획을 꺼낸다","refs":[1,2,3,4,5]},{"label":"전개","sentences":"S6 · S7 · S8 · S9","text":"사는 사람이 고쳐야 한다는 단서를 붙인다 → 돈이 드는데도 신청자가 몰렸음을 알린다 → 값싼 집만이 끌린 이유가 아니었다고 바로잡는다 → 손수 꾸밀 기회가 더 컸음을 덧붙인다","refs":[6,7,8,9]},{"label":"도착","sentences":"S10 · S11 · S12 · S13 · S14","text":"실제로 들어온 가구 수로 결과를 확인시킨다 → 대담한 계획이 통했다고 값매긴다 → 낡은 건물이 어떻게 달라졌는지 구체로 든다 → 변화가 건물 밖 동네까지 번졌음을 짚는다 → 지금은 살고 싶은 곳이 되었다고 첫 사례를 닫는다","refs":[10,11,12,13,14]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["실제로 들어온 가구 수로 결과를 확인시킨다 → 대담한 계획이 통했다고 값매긴다 → 낡은 건물이 어떻게 달라졌는지 구체로 든다 → 변화가 건물 밖 동네까지 번졌음을 짚는다 → 지금은 살고 싶은 곳이 되었다고 첫 사례를 닫는다","42가구가 만든 변화: 이 동네가 범죄로 이름났던 때를 되짚는다 → 지금은 살고 싶은 곳이 되었다고 첫 사례를 닫는다","이 동네가 범죄로 이름났던 때를 되짚는다 → 빈집이 불법 점거로 이어진 흐름을 짚는다 → 허물고 새로 ":"achieve","meaning":"성취하다"},{"word":"abandoned","meaning":"버려진"},{"word":"shipyard","meaning":"조선소"},{"word":"official","meaning":"공무원"},{"word":"sustainable","meaning":"지속 가능한"}],"sentences":[{"n":1,"en":"In the early 20th century, there was an area in the northern part of Amsterdam that was full of shipyards and factories.","ko":"<De Ceuvel: 친환경 기술 놀이터> 20세기 초, 암스테르담 북부에는 조선소와 공장들로 가득 찬 지역이 있었다.","grammar":[]},{"n":2,"en":"Over time, the shipyards closed down, and the work once done at the factories was moved abroad.","ko":"시간이 흘러 조선소들은 문을 닫았고, 한때 공장에서 행해지던 일들은 해외로 옮겨졌다.","grammar":[{"label":"work once","explanation":"work once — 주격 관계대명사+be 생략 · work that was once","transform_label":"the work once done at the factories was moved abroad — 과거분사의 후치수식 · 본동사 구별 → 관계사절 — 분사 앞에 관계대명사와 be동사를 되살린다","transform_value":"… the work that was once done …"}]},{"n":3,"en":"As a result, the area was left abandoned and polluted for years.","ko":"그 결과, 그 지역은 수년 동안 버려지고 오염되어 있었다.","grammar":[]},{"n":4,"en":"Wanting to do something to improve the area, the city purchased an abandoned shipyard called De Ceuvel.","ko":"그 지역을 개선할 무언가를 하고 싶었기 때문에, 그 도시는 De Ceuvel이라고 불리는 버려진 조선소를 매입했다.","grammar":[{"label":"shipyard called","explanation":"shipyard called — 주격 관계대명사+be 생략 · shipyard that was called","transform_label":"Wanting to do something to improve the area — 분사구문 · 숨은 주어 → 이유 부사절 — 분사의 숨은 주어는 주절 주어 the city 다","transform_value":"Because it wanted to do …"}]},{"n":5,"en":"However, city officials did not know what to do with it.","ko":"그러나 시 공무원들은 그것으로 무엇을 해야 할지 몰랐다.","grammar":[]},{"n":6,"en":"So they turned to the public for help by asking for plans that would achieve two primary goals.","ko":"그래서 그들은 두 가지 주요 목표를 달성할 계획을 요청함으로써 대중에게 의지하여 도움을 구했다.","grammar":[]},{"n":7,"en":"First, the plan had to include a method to clean up the land and turn it into a sustainable development.","ko":"첫째, 그 계획은 땅을 정화하고 그것을 지속 가능한 개발지로 변화시킬 방법을 포함해야 했다.","grammar":[]},{"n":8,"en":"Second, it had to su ,3]},{"head":"전개","body":"그 배를 싸게 구할 수 있었음을 덧붙인다 → 배를 되살려 만든 공간들을 늘어놓아 보인다 → 배와 배를 잇는 길을 낸 일을 이어 붙인다","refs":[4,5,6]},{"head":"도착","body":"땅을 되살리는 식물을 심은 일을 하나 더 든다 → 지금 그곳에서 기술을 시험한다는 오늘을 보인다 → 보러 오는 사람도 많다며 두 번째 사례를 매듭짓는다","refs":[7,8,9]}],"takeaway":"업사이클링 업무 지구: 한 회사의 안이 뽑혀 임대를 얻었음을 알린다 → 보러 오는 사람도 많다며 두 번째 사례를 매듭짓는다"},"easy_story":"한 회사의 안이 뽑혀 임대를 얻었음을 알린다 → 뽑힌 안이 무엇을 겨눴는지 한마디로 밝힌다 → 땅에 못 짓는 대신 배를 쓰기로 한 결정을 든다. 그 배를 싸게 구할 수 있었음을 덧붙인다 → 배를 되살려 만든 공간들을 늘어놓아 보인다 → 배와 배를 잇는 길을 낸 일을 이어 붙인다. 땅을 되살리는 식물을 심은 일을 하나 더 든다 → 지금 그곳에서 기술을 시험한다는 오늘을 보인다 → 보러 오는 사람도 많다며 두 번째 사례를 매듭짓는다.","blocking_vocab":[{"word":"in person","meaning":"직접"},{"word":"abandoned","meaning":"버려진"},{"word":"shipyard","meaning":"조선소"},{"word":"innovative","meaning":"혁신적인"},{"word":"lease","meaning":"임대차 계약"}],"sentences":[{"n":1,"en":"In the end, an architectural company submitted an innovative plan and was awarded a ten-year lease on the former shipyard.","ko":"마침내, 한 건축 회사가 획기적인 계획을 제출했고 이전의 조선소에 대한 10년 임대차 계약을 받았다.","grammar":[]},{"n":2,"en":"The plan was to turn the site into a sustainable office park.","ko":"그 계획은 그 장소를 지속 가능한 복합 상업 지구로 변화시키는 것이었다.","grammar":[]},{"n":3,"en":"Since it was impossible to build foundations on the oily mud of the polluted land, the architects decided to use old, abandoned boats instead.","ko":"오염된 땅의 기름진 진흙에 기반을 구축하는 것은 불가능했기 때문에, 건축가들은 대신에 낡고, 버려진 배들을 사용하기로 결정했다.","grammar":[]},{"n":4,"en":"They were able to purchase these at low prices from the boats' owners.","ko":"그들은 이것들을 배의 소유주들로부터 낮은 가격에 구입할 수 있었다.","grammar":[]},{"n":5,"en":"The architects created a small community that includes creative workspaces, studios, meeting rooms, cultural spaces, and even a cafe, all by upcycling the boats.","ko":"건축가들은 배들을 업사이클함으로써 창의적인 업무 공간, 스튜디오, 회의실, 문화 공간, 심지어 카페까지 포함하는 작은 공동체를 만들어 냈다.","grammar":[{"label":"workspaces, studios, meeting rooms, cultural spaces, and even a cafe","explanation":"workspaces, studios, meeting rooms, cultural spaces, and even a cafe — 명사 병렬","transfo 발한 놀이터들 중 하나로 알려져 있다.","grammar":[{"label":"is now known as","explanation":"is now known as — be known as + 자격","transform_label":"be known as N → be regarded as N — ~로 여겨지다","transform_value":"… is now regarded as one …"}]},{"n":2,"en":"At the end of the lease, the project will also leave behind a more valuable piece of land for the next people who use it.","ko":"임대 계약 종료 시에, 그 프로젝트는 또한 그것을 이용할 다음 사람들을 위한 더 귀중한 땅덩어리를 남기게 될 것이다.","grammar":[]},{"n":3,"en":"These two examples of urban revitalization in the Netherlands required much more than a budget and a plan.","ko":"네덜란드에서의 이러한 두 가지 도시 재생 사례들은 예산과 계획보다 훨씬 더 많은 것들을 필요로 했다.","grammar":[]},{"n":4,"en":"Innovative thinking, creativity, community spirit, and cooperation were all vital to their success.","ko":"혁신적인 사고, 창의성, 공동체 의식, 그리고 협력이 모두 그것들의 성공에 필수적이었다.","grammar":[]},{"n":5,"en":"These projects are great sources of inspiration for other cities that are looking to bring new life to abandoned areas.","ko":"이 프로젝트들은 버려진 지역에 새로운 생명을 가져오기를 기대하고 있는 다른 도시들을 위한 대단한 영감의 원천이다.","grammar":[{"label":"other cities that are looking to bring","explanation":"other cities that are looking to bring — 사물을 받는 주격 관계대명사 that · 현재진행형","transform_label":"other cities that are looking to bring new life to abandoned areas → 분사구 — that are 를 통째로 지우면 분사구만 남는다","transform_value":"These projects are great sources of inspiration for other cities looking to bring new life to abandoned areas."}]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2","text":"친환경 기술의 마당으로 이름났다고 값매긴다 → 계약이 끝난 뒤의 몫까지 내다본다","refs":[1,2]},{"label":"전개","sentences":"S3","text":"두 사례가 돈과 계획만으로 된 것이 아님을 든다","refs":[3]},{"label":"도착","sentences":"S4 · S5","text":"성공을 떠받친 네 가지를 꼽아 놓는다 → 다른 도시에 주는 뜻으로 글 전체를 닫는다","refs":[4,5]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["친환경 기술의 마당으로 이름났다고 값매긴다 → 계약이 끝난 뒤의 몫까지 내다본다","성공을 떠받친 네 가지를 꼽아 놓는다 → 다른 도시에 주는 뜻으로 글 전체를 닫는다","창의성과 협력: 친환경 기술의 마당으로 이름났다고 값매긴다 → 다른 도시에 주는 뜻으로 글 전체를 닫는다"],"answer":2,"why":"창의성과 협력: 친환경 기술의 마당으로 이름났다고 값매긴다 → 다른 도시에 주는 뜻으로 글 전체를 닫는다","refs":[1,5]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["친환경 기술의 마당으로 이름났다고 값매긴다 → 계약이 끝난 뒤의 몫까지 내다본다","앞의 사건과 관계없는 새 주제","성공을 떠받친 네 가지를 꼽아 놓는다 → 다른 도시에 주는 뜻으로 글 전체를 닫는다"],"answer":2,"why":"성공을 떠받친 네 가지를 꼽아 놓는다 → 다른 도시에 주는 뜻으로 글 전체를 닫는다","refs":[4,5]},{"type":"문법","q":"S1의 'is now known as' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","is now known as — be known as + 자격"],"answer":2,"why":"… is now regarded as one …","refs":[1]}],"key_sentence_en":"These projects are great sources of inspiration for other cities that are looking to bring new life to abandoned areas.","key_sentence_ko":"이 프로젝트들은 버려진 지역에 새로운 생명을 가져오기를 기대하고 있는 다른 도시들을 위한 대단한 영감의 원천이다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 대아고1 교과서 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button>${s.grammar?.length?` <button class="reveal grammar-open" data-toggle="grammar">문법 포인트</button>`:''}<p class="translation">${esc(s.ko)}</p>${s.grammar?.length?`<div class="grammar-panel">${s.grammar.map(g=>`<div class="grammar-item"><b>${esc(g.label)}</b><p>${esc(g.explanation)}</p>${g.transform_value?`<small>시험에서는 이렇게 바꿀 수 있어요.</small><p class="grammar-transform">${esc(g.transform_value)}</p>`:''}</div>`).join('')}</div>`:''}</div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='grammar'){const target=btn.parentElement.querySelector('.grammar-panel');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'문법 닫기':'문법 포인트'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

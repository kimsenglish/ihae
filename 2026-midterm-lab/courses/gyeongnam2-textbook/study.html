.diagram{overflow:hidden}
.diagram-items{counter-reset:visual-step}
.diagram-card{box-shadow:0 2px 0 rgba(13,76,57,.04)}
.diagram-card b{line-height:1.35}
.diagram-card small{font-variant-numeric:tabular-nums}
/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items,.diagram.diagram-argument .diagram-items,
.diagram.diagram-steps-possible .diagram-items,.diagram.diagram-case-advice .diagram-items,
.diagram.diagram-steps-response .diagram-items,.diagram.diagram-cause-response .diagram-items,
.diagram.diagram-compare-open .diagram-items{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;
  border-left:3px solid #68aa91;margin-left:14px;padding-left:25px}
.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card,.diagram.diagram-argument .diagram-card,
.diagram.diagram-steps-possible .diagram-card,.diagram.diagram-case-advice .diagram-card,
.diagram.diagram-steps-response .diagram-card,.diagram.diagram-cause-response .diagram-card,
.diagram.diagram-compare-open .diagram-card{position:relative;counter-increment:visual-step}
.diagram.diagram-steps .diagram-card:before,.diagram.diagram-timeline .diagram-card:before,
.diagram.diagram-cycle .diagram-card:before,.diagram.diagram-argument .diagram-card:before,
.diagram.diagram-steps-possible .diagram-card:before,.diagram.diagram-case-advice .diagram-card:before,
.diagram.diagram-steps-response .diagram-card:before,.diagram.diagram-cause-response .diagram-card:before,
.diagram.diagram-compare-open .diagram-card:before{content:counter(visual-step);position:absolute;left:-47px;top:10px;
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:#176b52;color:#fff;font-size:12px;font-weight:800;border:3px solid #f0f6ef}
.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-possible .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-case-advice .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-response .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cause-response .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-compare-open .diagram-items .diagram-card:not(:last-child):after{
  content:'↓';position:absolute;left:-39px;bottom:-26px;margin:0;padding:0 2px;
  color:#176b52;background:#f0f6ef;line-height:1.2;font-size:17px;font-weight:800}
.diagram.diagram-cycle .diagram-items:after{content:'↶ 반복되는 해석';font-size:12px;color:#176b52;
  font-weight:750;margin:-13px 0 0 4px}
/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.diagram.diagram-condition .diagram-card:first-child,.diagram.diagram-branches .diagram-card:first-child{
  grid-column:1/-1;background:#dceee5;border-color:#82baa2;position:relative}
.diagram.diagram-condition .diagram-card:first-child:after,.diagram.diagram-branches .diagram-card:first-child:after{
  content:'↙                 ↘';position:absolute;bottom:-25px;left:0;right:0;text-align:center;
  color:#176b52;font-size:18px;font-weight:900;white-space:pre}
.diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.diagram.diagram-compare .diagram-card,.diagram.diagram-cases .diagram-card{
  border-top:5px solid #1b795c;background:linear-gradient(180deg,#f9fffb,#fff 48%)}
.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}
.diagram.diagram-web .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.diagram.diagram-web .diagram-card:first-child{grid-column:1/-1;justify-self:center;width:min(100%,360px);
  background:#dceee5;border-color:#498f6e;border-radius:100px;position:relative}
.diagram.diagram-web .diagram-card:first-child:after{content:'↙                         ↘';
  position:absolute;left:0;right:0;bottom:-28px;color:#176b52;font-weight:900;white-space:pre}
.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;padding-top:23px}
.diagram.diagram-dose .diagram-items:before{content:'';position:absolute;top:10px;left:10%;right:10%;height:5px;
  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}
.diagram.diagram-dose .diagram-card:before{content:'';position:absolute;top:-23px;left:calc(50% - 7px);
  width:14px;height:14px;border-radius:50%;background:#176b52;border:3px solid #f0f6ef}
.diagram.diagram-dose .diagram-card:nth-child(2){background:#dceee5;border-color:#82baa2}
.diagram.diagram-dose .diagram-card b{font-size:18px}
/* Cooking: familiar side benefits are distinct from the source's energy-to-adaptation claim. */
.diagram.diagram-energy-route .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px}
.diagram.diagram-energy-route .diagram-card{position:relative;min-width:0;border-top:5px solid #237c5c;padding-top:35px;background:#fffdf8}
.diagram.diagram-energy-route .diagram-card:first-child{grid-column:1/-1;border:1px dashed #a9b8ad;background:#f8faf6;padding:10px 14px}
.diagram.diagram-energy-route .diagram-card:first-child:before{content:'먼저 떠오르는 장점';display:block;color:#65766b;font-size:11px;font-weight:800;margin-bottom:3px}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}
.diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'→';position:absolute;right:-19px;top:calc(50% - 16px);color:#176b52;font-size:26px;font-weight:900;z-index:1}
.diagram.diagram-energy-route .diagram-card:nth-child(2){background:#e5f4e9}.diagram.diagram-energy-route .diagram-card:nth-child(4){background:#fff2d9;border-top-color:#b78539}
/* Three alternative survival responses, not three consecutive steps. */
.diagram.diagram-reaction-options .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 10px}
.diagram.diagram-reaction-options .diagram-card:first-child{grid-column:1/-1;text-align:center;background:#dceee5;border:2px solid #82baa2;position:relative}
.diagram.diagram-reaction-options .diagram-card:first-child:after{content:'↙    ↓    ↘';position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:#176b52;font-weight:900;font-size:21px;white-space:pre}
.diagram.diagram-reaction-options .diagram-card:not(:first-child){text-align:center;border-top:5px solid #247b5b}
.diagram.diagram-reaction-options .diagram-card:not(:first-child) b{font-size:20px}
.diagram.diagram-reaction-options .diagram-card:not(:first-child):before{display:block;font-size:27px;line-height:1;margin-bottom:8px;color:#176b52}
.diagram.diagram-reaction-options .diagram-card:nth-child(2):before{content:'⏸'}.diagram.diagram-reaction-options .diagram-card:nth-child(3):before{content:'➜'}.diagram.diagram-reaction-options .diagram-card:nth-child(4):before{content:'↗'}
.diagram.diagram-reaction-options .diagram-takeaway{background:#fff2d9;border:0;border-radius:10px;padding:12px}
/* The first pass shows only the visual map; stage 3 restores the evidence. */
.diagram.is-overview .diagram-card p,.diagram.is-overview .diagram-card small{display:none}
.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}
.diagram.is-overview .diagram-card b{font-size:15px}
.diagram.is-overview .diagram-takeaway{display:block;background:#dceee5;border:0;border-radius:11px;
  margin-top:14px;padding:10px 12px;text-align:center;color:#14543f}
/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}
.diagram.diagram-dialogue .diagram-card:before{content:'●';position:absolute;left:14px;top:13px;
  color:#176b52;font-size:24px;line-height:1}
.diagram.diagram-dialogue .diagram-card:after{content:'';position:absolute;left:12px;top:42px;
  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}
.diagram.diagram-dialogue .diagram-card:nth-child(2){background:#fff7e9;border-color:#c78f4b}
.diagram.diagram-dialogue .diagram-card:nth-child(2):before{color:#a96e2c}
.diagram.diagram-dialogue .diagram-card:nth-child(2):after{background:#a96e2c}
.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}
/* A claim supported by parallel examples ends in one explicit conclusion. */
.diagram.diagram-examples-conclusion .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}
.diagram.diagram-examples-conclusion .diagram-card:first-child{background:#e1efe7;border:2px solid #76ad91;text-align:center}
.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(-n+2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(-n+2){border-top:5px solid #1b795c}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Analogy maps one domain to another, followed by a concrete example. */
.diagram.diagram-analogy .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-analogy .diagram-card:nth-child(1){border-top:5px solid #1b795c}
.diagram.diagram-analogy .diagram-card:nth-child(2){border-top:5px solid #bd8141}
.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Three roles are simultaneous parts of one contrast, not a causal sequence. */
.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diagram.diagram-roles-contrast .diagram-card{border-top:5px solid #1b795c}
.diagram.diagram-roles-contrast .diagram-card:nth-child(2){border-top-color:#b25745}
.diagram.diagram-roles-contrast .diagram-card:nth-child(3){border-top-color:#bd8141}

<script id="course-data" type="application/json">{"course":{"id":"gyeongnam2-textbook","title":"경남예고2 영어Ⅰ 교과서","grade":"고2"},"units":[{"id":"l1","label":"1과 · For a Satisfying Life","scope":"본문 7구간","passages":[{"id":"l1-01","title":"강연을 여는 말","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"잡지 편집자가 여러 경험의 가치를 말하기 위해 친구들의 이야기를 소개한다.","diagram":{"kind":"roster","title":"이 강연의 출발점","items":[{"head":"누가?","body":"청소년 잡지 편집자","refs":[1,2]},{"head":"누구에게?","body":"미래를 고민하는 청소년 독자","refs":[4]},{"head":"무엇을?","body":"여러 경험의 가치와 친구들의 이야기","refs":[5,6,7]}]},"easy_story":"강연자는 청소년 잡지 편집자입니다. 미래를 걱정하는 독자들에게 여러 경험이 왜 중요한지 이야기하려고 합니다. 먼저 친구들이 보내 준 이야기를 하나씩 들려주겠다고 합니다.","blocking_vocab":[],"sentences":[{"n":1,"en":"Hi, everyone.","ko":"<삶은 경험해 내는 여행이다> 안녕하세요, 여러분.","grammar":[]},{"n":2,"en":"My name is Minji Song, and I am the editor of an online teen magazine, Teens Today.","ko":"저의 이름은 송민지이고, 저는 온라인 10대 청소년 잡지 <Teens Today>의 편집자입니다.","grammar":[{"label":"magazine, Teens Today","explanation":"magazine, Teens Today — 동격","transform_label":"magazine, Teens Today — 동격 → 계속적 용법의 관계대명사 — 콤마 뒤에 which is called를 넣는다","transform_value":"… teen magazine, which is called Teens Today."}]},{"n":3,"en":"I am honored to have been asked to give a talk.","ko":"강연을 요청받게 되어 영광입니다.","grammar":[]},{"n":4,"en":"Many of our high school student subscribers send me messages with concerns about their future.","ko":"많은 저희 (잡지) 고등학생 구독자들이 저에게 미래에 관한 걱정을 담은 메시지를 보냅니다.","grammar":[]},{"n":5,"en":"So today, I will talk about the value of experiences in making a better future.","ko":"그래서 오늘, 저는 더 나은 미래를 만드는 데 있어 경험의 가치에 관해 이야기하고자 합니다.","grammar":[]},{"n":6,"en":"For this talk, I asked my old friends to write down stories about what they experienced when they were younger.","ko":"이 강연을 위해, 저는 제 오랜 친구들에게 그들이 어릴 때 경험했던 것에 관한 이야기를 적어 달라고 부탁했습니다.","grammar":[{"label":"asked my old friends to write down","explanation":"asked my old friends to write down — 5형식 · my old friends는 목적어 · to write down은 목적격보어","transform_label":"what they experienced — 관계대명사 what → 선행사 + which — what을 선행사와 which로 나눈다","transform_value":"… stories about the things which they experienced …"}]},{"n":7,"en":"I would like to start by reading them one by one.","ko":"저는 그것들을 하나씩 읽으면서 시작하겠습니다.","grammar":[]}],"structure":[],"flow":[{"label":"강연자","sentences":"S1 · S2 · S3","text":"청소년 잡지 편집자가 청중에게 자신을 소개한다.","refs":[1,2,3]},{"label":"주제","sentences":"S4 · S5","text":"미래를 고민하는 청소년에게 경험의 가치를 말하려 한다.","refs":[4,5]},{"label":"이어질 이야기","sentences":"S6 · S7","text":"친구들에게 받은 경험담을 읽어 주겠다고 한다.","refs":[6,7]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["잡지 편집자가 여러 경험의 가치를 말하기 위해 친구들의 이야기를 소개한다.","청소년 잡지 편집자가 청중에게 자신을 소개한다.","친구들에게 받은 경험담을 읽어 주겠다고 한다."],"answer":0,"why":"잡지 편집자가 여러 경험의 가치를 말하기 위해 친구들의 이야기를 소개한다.","refs":[1,7]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","친구들에게 받은 경험담을 읽어 주겠다고 한다.","청소년 잡지 편집자가 청중에게 자신을 소개한다."],"answer":1,"why":"친구들에게 받은 경험담을 읽어 주겠다고 한다.","refs":[6,7]},{"type":"문법","q":"S2의 'magazine, Teens Today' 설명으로 알맞은 것은?","choices":["magazine, Teens Today — 동격","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"… teen magazine, which is called Teens Today.","refs":[2]}],"key_sentence_en":"I would like to start by reading them one by one.","key_sentence_ko":"저는 그것들을 하나씩 읽으면서 시작하겠습니다."},{"id":"l1-02","title":"수영을 배우다","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"수영을 시작한 사람은 힘든 연습 속에서도 즐거움과 실력 향상을 경험했다.","diagram":{"kind":"steps","title":"수영 경험에서 일어난 변화","items":[{"head":"해 보고 싶다","body":"올림픽을 보고 부모님께 배워도 되는지 묻는다","refs":[1,2,3,4]},{"head":"연습한다","body":"어렵지만 즐겁고 기록도 나아진다","refs":[5,6,7]},{"head":"도전이 커진다","body":"대회·근력 훈련을 앞두고 포기하지 않으려 한다","refs":[8,9,10,11]}]},"easy_story":"올림픽 수영을 보고 자신도 해 보고 싶어 부모님 허락을 받았습니다. 처음에는 어려웠지만 연습할수록 기록이 좋아졌고, 코치는 대회 출전과 근력 훈련을 권했습니다. 훈련이 힘들 때마다 고생 없이 얻는 게 없다고 자신을 다잡았습니다.","blocking_vocab":[],"sentences":[{"n":1,"en":"One summer day, I was watching an Olympic swimming event on TV.","ko":"<저는 수영하는 것을 좋아했습니다> 어느 여름날, 저는 TV로 올림픽 수영 경기를 보고 있었습니다.","grammar":[]},{"n":2,"en":"The gold medalist looked fantastic, and I wanted to be just like him.","ko":"금메달을 딴 사람은 대단해 보였고, 저는 그 사람처럼 되고 싶었습니다.","grammar":[]},{"n":3,"en":"I asked my parents if I could learn to swim.","ko":"저는 부모님께 수영을 배워도 되는지 여쭤봤습니다.","grammar":[]},{"n":4,"en":"They approved and said, \"Yes.\"","ko":"그들은 허락하셨고, \"그러렴.\"하고 말씀하셨습니다.","grammar":[]},{"n":5,"en":"Swimming was difficult at first, but after a year, I became a good swimmer.","ko":"수영하는 것은 처음에는 어려웠지만, 일 년이 지나자, 저는 수영을 곧잘 하게 되었습니다.","grammar":[]},{"n":6,"en":"I felt tired but happy when I was out of breath after every practice.","ko":"매번 연습 후 숨이 가쁠 때면 지쳤지만 즐거웠습니다.","grammar":[{"label":"felt tired but happy","explanation":"felt tired but happy — 2형식 · 병렬"}]},{"n":7,"en":"As I practiced more, my times got better and better.","ko":"제가 연습을 더 할수록, 제 시간(기록)은 점점 더 나아졌습니다.","grammar":[]},{"n":8,"en":"One day, my coach suggested that I enter a competition.","ko":"어느 날, 저의 코치 선생님은 제가 대회에 참가할 것을 제안하셨습니다.","grammar":[]},{"n":9,"en":"He also advised me that for good results I should build muscle strength through weight training.","ko":"그는 또한 저에게 좋은 결과를 위해 웨이트 트레이닝을 통해 근력을 길러야 한다고 조언해 주셨습니다.","grammar":[]},{"n":10,"en":"The training was demanding, leaving me exhausted at times.","ko":"훈련은 힘들었고, 때로는 저를 매우 지치게 했습니다.","grammar":[{"label":"leaving me exhausted","explanation":"leaving me exhausted — 결과를 나타내는 분사구문 · leave + 목적어 + 형용사 목적격보어","transform_label":"leaving me exhausted — 분사구문 → 결과를 나타내는 등위절 — 접속사·주어를 되살리고 분사를 정동사로","transform_value":"… was demanding, so it left me exhausted …"}]},{"n":11,"en":"Whenever I felt this way, I told myself, \"No pain, no gain.\"","ko":"저는 이렇게 느낄 때마다, 저 자신에게 말했습니다. \"고생 없이는 얻는 게 없다.\"","grammar":[{"label":"Whenever","explanation":"Whenever — 복합관계부사","transform_label":"Whenever S V → Every time S V — …할 때마다","transform_value":"Every time I felt …"}]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"올림픽 경기를 보고 수영을 배우기 시작했다.","refs":[1,2,3,4]},{"label":"변화","sentences":"S5 · S6 · S7","text":"연습이 힘들어도 즐거웠고 기록이 나아졌다.","refs":[5,6,7]},{"label":"더 큰 도전","sentences":"S8 · S9 · S10 · S11","text":"대회와 근력 훈련 앞에서 스스로를 격려했다.","refs":[8,9,10,11]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["대회와 근력 훈련 앞에서 스스로를 격려했다.","수영을 시작한 사람은 힘든 연습 속에서도 즐거움과 실력 향상을 경험했다.","올림픽 경기를 보고 수영을 배우기 시작했다."],"answer":1,"why":"수영을 시작한 사람은 힘든 연습 속에서도 즐거움과 실력 향상을 경험했다.","refs":[1,11]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","대회와 근력 훈련 앞에서 스스로를 격려했다.","올림픽 경기를 보고 수영을 배우기 시작했다."],"answer":1,"why":"대회와 근력 훈련 앞에서 스스로를 격려했다.","refs":[8,9,10,11]},{"type":"문법","q":"S6의 'felt tired but happy' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","felt tired but happy — 2형식 · 병렬"],"answer":2,"why":"felt tired but happy — 2형식 · 병렬","refs":[6]}],"key_sentence_en":"Whenever I felt this way, I told myself, \"No pain, no gain.\"","key_sentence_ko":"저는 이렇게 느낄 때마다, 저 자신에게 말했습니다. \"고생 없이는 얻는 게 없다.\""},{"id":"l1-03","title":"연극 무대에 서다","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"수줍은 학생이 연극에 도전해 연습과 친구들의 도움으로 무대에서 대사를 해냈다.","diagram":{"kind":"steps","title":"연극 무대까지","items":[{"head":"권유와 수락","body":"수줍은 학생이 역할을 맡는다","refs":[1,2,3,4]},{"head":"연습","body":"처음엔 막혔지만 자신감이 붙는다","refs":[5,6]},{"head":"공연","body":"긴장 → 친구의 격려 → 대사 성공","refs":[7,8,9]}]},"easy_story":"처음에는 조용하고 수줍어 작은 역할도 망설였습니다. 연습할수록 자신감이 생겼지만 공연 직전에는 머리가 하얘졌습니다. 친구들의 격려를 받고 결국 대사를 해낼 수 있었습니다.","blocking_vocab":[],"sentences":[{"n":1,"en":"I used to be quiet and shy when I was a child.","ko":"<저는 연극에서 연기를 했습니다> 저는 어릴 때 조용했고 수줍음이 많았습니다.","grammar":[]},{"n":2,"en":"My homeroom teacher told me one day that she was putting on a play for our school festival.","ko":"저의 담임 선생님께서는 어느 날 저에게 학교 축제에 연극을 하나 하려고 한다고 말씀하셨습니다.","grammar":[{"label":"was putting on","explanation":"was putting on — 과거진행","transform_label":"told me one day that — 4형식 + 명사절 접속사 → say to + 목적어 — told me를 said to me로 바꾼다","transform_value":"… homeroom teacher said to me one …"}]},{"n":3,"en":"She suggested that I take on a small role, saying that being in a play would be a good experience.","ko":"선생님께서는 제가 작은 역할을 하나 맡을 것을 제안하셨고, 연극에 참여하는 것이 좋은 경험이 될 거라고 말씀하셨습니다.","grammar":[]},{"n":4,"en":"So, I decided to do it.","ko":"그래서 저는 그것을 하기로 했습니다.","grammar":[]},{"n":5,"en":"I was so nervous at the first rehearsal that I could not say my lines at all.","ko":"저는 첫 예행연습 때 너무 긴장해서 제 대사를 전혀 말할 수 없었습니다.","grammar":[]},{"n":6,"en":"However, as I practiced my lines more, I became more and more confident.","ko":"하지만 저는 대사를 더 많이 연습할수록, 점점 더 자신감이 생겼습니다.","grammar":[]},{"n":7,"en":"On the day of the performance, I got anxious and my mind went blank just before I stepped on the stage.","ko":"공연 당일, 저는 불안했고, 무대로 올라가기 직전에는 정신이 멍해졌습니다.","grammar":[]},{"n":8,"en":"My classmates tapped me on the shoulder and encouraged me.","ko":"저의 반 친구들은 제 어깨를 두드리며 저를 격려해 주었습니다.","grammar":[{"label":"tapped me on the shoulder and encouraged me","explanation":"tapped me on the shoulder and encouraged me — 동사 병렬 · 과거시제","transform_label":"tapped … and encouraged — 3형식 능동태 → 수동태 — 목적어를 주어로, 동사를 be+p.p.로","transform_value":"I was tapped on the shoulder and encouraged by my classmates."}]},{"n":9,"en":"Thanks to this, I was able to perform my lines perfectly.","ko":"이 덕분에 저는 제 대사를 완벽하게 해낼 수 있었습니다.","grammar":[]}],"structure":[],"flow":[{"label":"도전","sentences":"S1 · S2 · S3 · S4","text":"선생님의 권유로 연극에 참여하기로 한다.","refs":[1,2,3,4]},{"label":"연습","sentences":"S5 · S6","text":"처음엔 대사도 못 했지만 자신감이 늘었다.","refs":[5,6]},{"label":"무대","sentences":"S7 · S8 · S9","text":"긴장했으나 친구들의 격려로 대사를 해냈다.","refs":[7,8,9]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["선생님의 권유로 연극에 참여하기로 한다.","긴장했으나 친구들의 격려로 대사를 해냈다.","수줍은 학생이 연극에 도전해 연습과 친구들의 도움으로 무대에서 대사를 해냈다."],"answer":2,"why":"수줍은 학생이 연극에 도전해 연습과 친구들의 도움으로 무대에서 대사를 해냈다.","refs":[1,9]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["선생님의 권유로 연극에 참여하기로 한다.","앞의 사건과 관계없는 새 주제","긴장했으나 친구들의 격려로 대사를 해냈다."],"answer":2,"why":"긴장했으나 친구들의 격려로 대사를 해냈다.","refs":[7,8,9]},{"type":"문법","q":"S2의 'was putting on' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","was putting on — 과거진행"],"answer":2,"why":"… homeroom teacher said to me one …","refs":[2]}],"key_sentence_en":"Thanks to this, I was able to perform my lines perfectly.","key_sentence_ko":"이 덕분에 저는 제 대사를 완벽하게 해낼 수 있었습니다."},{"id":"l1-04","title":"조경 건축가를 꿈꾸다","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"조경 대회 포스터를 보고 조경 건축가에 관심을 갖게 되어 필요한 과목을 더 공부하기로 했다.","diagram":{"kind":"steps","title":"관심이 공부 방향을 바꾸다","items":[{"head":"포스터 발견","body":"조경 디자인 대회를 보고 관심이 생김","refs":[1,2]},{"head":"직업 이해","body":"공간을 바꾸는 조경 건축가를 꿈꿈","refs":[3,4,5]},{"head":"준비","body":"필요한 수학·과학에 더 힘씀","refs":[6,7,8]}]},"easy_story":"조경 디자인 대회 포스터를 보고 조경 건축가라는 일을 알아보았습니다. 공간을 새롭게 만드는 일에 끌려 장래 희망으로 생각하게 됐습니다. 그 일을 하려면 수학과 과학이 필요하다는 사실을 알고 두 과목에 더 힘쓰기로 했습니다.","blocking_vocab":[],"sentences":[{"n":1,"en":"One day, I saw a poster advertising the city's landscape design contest.","ko":"<저는 조경 건축가가 되고 싶었습니다> 어느 날, 저는 시의 조경 디자인 대회를 알리는 포스터를 보았습니다.","grammar":[]},{"n":2,"en":"The instant I saw it, I got interested.","ko":"저는 그것을 보자마자, 관심이 생겼습니다.","grammar":[]},{"n":3,"en":"After doing some research on the Internet, I discovered that landscape designing involves arranging and decorating outdoor spaces.","ko":"인터넷에서 검색을 약간 한 후, 저는 조경 디자인이 외부 공간을 정돈하고 꾸미는 일을 한다는 것을 알게 되었습니다.","grammar":[{"label":"arranging and decorating","explanation":"arranging and decorating — 동명사 병렬","transform_label":"After doing some research — 전치사 + 동명사 → 부사절 — After 뒤에 주어·동사를 되살린다","transform_value":"After I did some research …"}]},{"n":4,"en":"I thought a landscape architect's work was impressive because the arrangement of plants and structures can transform a space.","ko":"식물과 구조물을 배열하여 공간을 변화시킬 수 있기 때문에, 저는 조경 건축가가 하는 일이 인상적이라고 생각했습니다.","grammar":[]},{"n":5,"en":"This inspired me to think about becoming a landscape architect.","ko":"이것은 저로 하여금 조경 건축가가 되는 것에 대해 생각해 보도록 해 주었습니다.","grammar":[]},{"n":6,"en":"I found out that I had to be good at math and science in order to become a landscape architect.","ko":"저는 조경 건축가가 되기 위해서는 수학과 과학을 잘해야 한다는 것을 알게 되었습니다.","grammar":[]},{"n":7,"en":"This is because landscape architects must calculate the dimensions and slopes of land as well as thoroughly examine environmental factors such as soil, air, and climate.","ko":"이것은 조경 건축가가 토양, 공기, 그리고 기후 같은 환경 요소들을 철두철미하게 조사해야 할 뿐 아니라 땅의 넓이와 경사도를 계산해야 하기 때문입니다.","grammar":[{"label":"calculate","explanation":"calculate · examine — 병렬 · 동사원형","transform_label":"B as well as A → not only A but also B — A뿐 아니라 B도","transform_value":"… architects must not only thoroughly examine … and climate but also calculate the dimensions and slopes of land."}]},{"n":8,"en":"I was not good at either subject at the time, so I decided to put more effort into studying them.","ko":"저는 그 당시 그 두 과목 모두 잘하지 못했어서, 그것들을 공부하는 데 더 많은 노력을 쏟아붓기로 결심했습니다.","grammar":[]}],"structure":[],"flow":[{"label":"관심의 시작","sentences":"S1 · S2 · S3","text":"포스터를 보고 조경 건축이 무슨 일인지 찾아봤다.","refs":[1,2,3]},{"label":"새로운 꿈","sentences":"S4 · S5","text":"공간을 바꾸는 일에 매력을 느꼈다.","refs":[4,5]},{"label":"그 꿈을 위한 행동","sentences":"S6 · S7 · S8","text":"수학·과학의 필요를 알고 더 공부하기로 한다.","refs":[6,7,8]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["포스터를 보고 조경 건축이 무슨 일인지 찾아봤다.","수학·과학의 필요를 알고 더 공부하기로 한다.","조경 대회 포스터를 보고 조경 건축가에 관심을 갖게 되어 필요한 과목을 더 공부하기로 했다."],"answer":2,"why":"조경 대회 포스터를 보고 조경 건축가에 관심을 갖게 되어 필요한 과목을 더 공부하기로 했다.","refs":[1,8]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","수학·과학의 필요를 알고 더 공부하기로 한다.","포스터를 보고 조경 건축이 무슨 일인지 찾아봤다."],"answer":1,"why":"수학·과학의 필요를 알고 더 공부하기로 한다.","refs":[6,7,8]},{"type":"문법","q":"S3의 'arranging and decorating' 설명으로 알맞은 것은?","choices":["arranging and decorating — 동명사 병렬","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"After I did some 의 열정은 더 강해졌습니다.","grammar":[]},{"n":8,"en":"So I started writing short stories and sharing them with my friends and family.","ko":"그래서 저는 단편 소설들을 쓰고 그것들을 저의 친구들과 가족들에게 공유하기 시작했습니다.","grammar":[]},{"n":9,"en":"I felt a sense of accomplishment whenever they told me my stories were good.","ko":"저는 그들이 저에게 제 이야기가 훌륭하다고 말할 때마다 성취감을 느꼈습니다.","grammar":[{"label":"whenever they told me","explanation":"whenever they told me — 복합관계부사","transform_label":"told me my stories were — 명사절 접속사 that 생략 → that 복원 — told me 뒤에 that을 넣는다","transform_value":"… told me that my stories …"}]}],"structure":[],"flow":[{"label":"우연한 시작","sentences":"S1 · S2 · S3","text":"입원 중 심심해서 종이에 쓰기 시작했다.","refs":[1,2,3]},{"label":"새로 느낀 것","sentences":"S4 · S5 · S6","text":"글을 쓰면 마음이 놓여 공책을 구했다.","refs":[4,5,6]},{"label":"열정의 성장","sentences":"S7 · S8 · S9","text":"단편을 쓰고 남의 반응에서 성취감을 얻었다.","refs":[7,8,9]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["입원 중 우연히 시작한 글쓰기가 점차 열정과 성취감으로 이어졌다.","입원 중 심심해서 종이에 쓰기 시작했다.","단편을 쓰고 남의 반응에서 성취감을 얻었다."],"answer":0,"why":"입원 중 우연히 시작한 글쓰기가 점차 열정과 성취감으로 이어졌다.","refs":[1,9]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["단편을 쓰고 남의 반응에서 성취감을 얻었다.","입원 중 심심해서 종이에 쓰기 시작했다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"단편을 쓰고 남의 반응에서 성취감을 얻었다.","refs":[7,8,9]},{"type":"문법","q":"S4의 'what I wanted to do' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","what I wanted to do — 관계대명사 what","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"… I wrote the things which I wanted …","refs":[4]}],"key_sentence_en":"I felt a sense of accomplishment whenever they told me my stories were good.","key_sentence_ko":"저는 그들이 저에게 제 이야기가 훌륭하다고 말할 때마다 성취감을 느꼈습니다."},{"id":"l1-06","title":"네 친구의 현재는?","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"수영·연극·조경·글쓰기의 경험을 모두 거친 한 사람이 지금은 잡지 편집자로 일한다.","diagram":{"kind":"roster","title":"네 친구의 지금 모습은?","items":[{"head":"첫 두 경험","body":"수영·연극","refs":[2,3]},{"head":"다음 두 경험","body":"조경·글쓰기","refs":[4,5]},{"head":"화자의 질문","body":"이 사 ,"ko":"새로운 것들을 탐구하는 것은 때때로 여러분의 미래를 형성하는 데 도움이 되는 귀중한 경험으로 이어질 수 있습니다.","grammar":[]},{"n":14,"en":"I myself tried many different things before I finally became an editor because I enjoyed writing.","ko":"제가 글 쓰기를 좋아해서 결국 편집자가 되기 전에, 저는 몸소 많은 각양각색의 것들을 해 보았습니다.","grammar":[]},{"n":15,"en":"Thanks to these many interests, I can write articles about math and science, speak confidently in front of an audience, and relieve my stress by swimming.","ko":"이러한 여러 관심사들 덕분에 저는 수학과 과학에 관한 기사를 쓸 수 있고, 청중 앞에서 자신 있게 말할 수 있으며 수영을 하면서 제 스트레스를 완화시킬 수 있습니다.","grammar":[{"label":"write","explanation":"write · speak · relieve — 병렬 · 조동사 뒤 원형"}]}],"structure":[],"flow":[{"label":"질문","sentences":"S1 · S2 · S3 · S4 · S5","text":"수영·연극·조경·글쓰기를 한 사람들이 지금 무엇을 하는지 묻는다.","refs":[1,2,3,4,5]},{"label":"반전","sentences":"S6 · S7","text":"네 사람은 모두 강연자 자신이고 지금은 편집자다.","refs":[6,7]},{"label":"의미","sentences":"S8 · S9 · S10 · S11 · S12 · S13 · S14 · S15","text":"관심이 바뀌는 것은 자연스럽고 경험은 이후의 일에 쓰인다.","refs":[8,9,10,11,12,13,14,15]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["관심이 바뀌는 것은 자연스럽고 경험은 이후의 일에 쓰인다.","수영·연극·조경·글쓰기의 경험을 모두 거친 한 사람이 지금은 잡지 편집자로 일한다.","수영·연극·조경·글쓰기를 한 사람들이 지금 무엇을 하는지 묻는다."],"answer":1,"why":"수영·연극·조경·글쓰기의 경험을 모두 거친 한 사람이 지금은 잡지 편집자로 일한다.","refs":[1,15]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["수영·연극·조경·글쓰기를 한 사람들이 지금 무엇을 하는지 묻는다.","앞의 사건과 관계없는 새 주제","관심이 바뀌는 것은 자연스럽고 경험은 이후의 일에 쓰인다."],"answer":2,"why":"관심이 바뀌는 것은 자연스럽고 경험은 이후의 일에 쓰인다.","refs":[8,9,10,11,12,13,14,15]},{"type":"문법","q":"S8의 'have changed' 설명으로 알맞은 것은?","choices":["have changed — 현재완료","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"have changed — 현재완료","refs":[8]}],"key_sentence_en":"Thanks to these many interests, I can write articles about math and science, speak confidently in front of an audience, and relieve my stress by swimming.","key_sentence_ko":"이러한 여러 관심사들 덕분에 저는 수학과 과학에 관한 기사를 쓸 수 있고, 청중 앞에서 자신 있게 말할 수 있으며 수영을 하면서 제 스트레스를 완화시킬 수 있습니다.","index_core":"수영·연극·조경·글쓰기 경험담 뒤에 화자가 던지는 질문을 읽어 보자."},{"id":"l1-07","title":"경험이 남기는 것","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"학창 시절의 다양한 시도는 낭비가 아니라 자신을 발견하고 성장하는 기회다.","diagram":{"kind":"roster","title":"강연자가 남긴 조언","items":[{"head":"해 보기","body":"다양한 경험은 낭비가 아님","refs":[1]},{"head":"알아 가기","body":"학창 시절에 자신을 발견하고 성장","refs":[2,3]},{"head":"열어 두기","body":"한 모습으로 자신을 고정하지 않기","refs":[4,5,6]}]},"easy_story":"여러 일을 경험하는 시간은 낭비가 아닙니다. 학창 시절에는 무엇을 좋아하고 잘하는지 알아 가는 과정이 중요합니다. 자신을 한 가지로만 단정하지 말고 유연하게 가능성을 열어 두라는 조언으로 강연을 마칩니다.","blocking_vocab":[],"sentences":[{"n":1,"en":"Allowing yourself the opportunity to experience a variety of things is not a waste of time.","ko":"여러분 자신에게 다양한 것을 경험할 기회를 주는 것은 시간 낭비가 아닙니다.","grammar":[{"label":"Allowing yourself the opportunity to experience a variety of things is","explanation":"Allowing yourself the opportunity to experience a variety of things is — 주어–동사 수 일치 · 단수","transform_label":"Allowing yourself … is — 동명사 주어 → 가주어 it ~ 진주어 to부정사 — It is로 열고 to부정사를 뒤로","transform_value":"It is not a waste of time to allow yourself the opportunity to experience a variety of things."}]},{"n":2,"en":"Your school days are a time of self-discovery and personal growth.","ko":"여러분의 학창 시절은 자기 발견과 개인 성장의 시간입니다.","grammar":[]},{"n":3,"en":"As you spend each day wisely, you will be able to figure out what kind of person you are and what you enjoy doing.","ko":"여러분이 하루하루를 현명하게 보내면서 여러분이 어떤 사람인지 그리고 여러분이 무엇을 좋아서 하는지 알아낼 수 있을 것입니다.","grammar":[{"label":"what kind of person you are","explanation":"what kind of person you are · what you enjoy doing — 간접의문문 병렬 · 주어+동사 어순"}]},{"n":4,"en":"Do not attempt to define yourself in just one way as you undergo this process.","ko":"이과정을 겪어 나갈 때 자신을 한 가지 방식으로만 정의하려고 하지 마세요.","grammar":[]},{"n":5,"en":"Be flexible.","ko":"유연해지세요.","grammar":[]},{"n":6,"en":"Remember that your potential is limitless.","ko":"여러분의 잠재력은 무한하다는 것을 명심하세요.","grammar":[]},{"n":7,"en":"Thank you for your time.","ko":"시간 내주셔서 감사합니다.","grammar":[]}],"structure":[],"flow":[{"label":"경험의 가치","sentences":"S1 · S2 · S3","text":"여러 시도는 자기 발견과 성장의 시간이다.","refs":[1,2,3]},{"label":"태도","sentences":"S4 · S5","text":"자신을 한 가지로 규정하지 말고 유연하라고 한다.","refs":[4,5]},{"label":"마무리","sentences":"S6 · S7","text":"가능성을 기억하라며 청중에게 감사한다.","refs":[6,7]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["가능성을 기억하라며 청중에게 감사한다.","학창 시절의 다양한 시도는 낭비가 아니라 자신을 발견하고 성장하는 기회다.","여러 시도는 자기 발견과 성장의 시간이다."],"answer":1,"why":"학창 시절의 다양한 시도는 낭비가 아니라 자신을 발견하고 성장하는 기회다.","refs":[1,7]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","가능성을 기억하라며 청중에게 감사한다.","여러 시도는 자기 발견과 성장의 시간이다."],"answer":1,"why":"가능성을 기억하라며 청중에게 감사한다.","refs":[6,7]},{"type":"문법","q":"S1의 'Allowing yourself the opportunity to experience a variety of things is' 설명으로 알맞은 것은?","choices":["Allowing yourself the opportunity to experience a variety of things is — 주어–동사 수 일치 · 단수","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"It is not a waste of time to allow yourself the opportunity to experience a variety of things.","refs":[1]}],"key_sentence_en":"Thank you for your time.","key_sentence_ko":"시간 내주셔서 감사합니다."}]},{"id":"l1-rm","label":"1과 · Read More","scope":"p26 추가 읽기","passages":[{"id":"l1-rm-01","title":"스티브 잡스와 캘리그래피 수업","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"스티브 잡스가 호기심으로 들은 캘리그래피 수업은 나중에 컴퓨터의 아름다운 글자체 설계에 쓰였다.","diagram":{"kind":"steps","title":"당장은 몰랐던 배움의 쓸모","items":[{"head":"대학 시절","body":"호기심으로 캘리그래피 수업 선택","refs":[1,2,3,4,5,6]},{"head":"그때 배운 것","body":"글자체와 글자 사이 간격","refs":[7,8]},{"head":"나중에","body":"컴퓨터에 아름다운 글꼴을 설계","refs":[9,10,11,12]}]},"easy_story":"대학생 잡스는 미래에 어떤 일을 할지 모르던 때 흥미가 가는 캘리그래피 수업을 들었습니다. 당시에는 그 배움이 쓸모 있을지 몰랐습니다. 하지만 훗날 컴퓨터의 글자체와 자간을 설계할 때 그 경험이 도움이 됐습니다.","blocking_vocab":[{"word":"innovative","meaning":"혁신적인"}],"sentences":[{"n":1,"en":"When Steve Jobs was a college student, he did not know what he wanted to do in the future.","ko":"<경험을 받아들이세요> Steve Jobs가 대학생이었을 때, 그는 자신이 장차 무엇을 하고 싶은지 알지 못했다.","grammar":[]},{"n":2,"en":"He felt uncertain about how the normal classes he was required to take could help him figure out what to do with his life.","ko":"그는 그가 수강해야 하는 일반적인 수업들이 그의 삶에서 무엇을 해야 할지 깨닫는 데 어떻게 도움이 될 수 있을지 불확실했다.","grammar":[]},{"n":3,"en":"He decided to start checking out things that seemed interesting to him.","ko":"그는 자신에게 흥미롭게 보이는 것들을 살펴보기 시작하기로 결심했다.","grammar":[{"label":"things that seemed interesting","explanation":"things that seemed interesting — 주격 관계대명사","transform_label":"He decided to start checking out — to부정사 목적어 → decide that절 — to부정사 목적어를 that절로 펴 주어를 드러낸다","transform_value":"He decided that he would start checking …"}]},{"n":4,"en":"One day, he was walking around the college grounds and a poster caught his eye.","ko":"어느 날, 그는 대학 교내를 돌아다니고 있었는데, 한 포스터가 그의 눈길을 끌었다.","grammar":[]},{"n":5,"en":"The handwritten letters on every poster were elegant and beautiful.","ko":"모든 포스터에 손으로 쓰인 글자들은 우아하고 아름다웠다.","grammar":[]},{"n":6,"en":"He became fascinated with the art of producing beautiful handwriting, also known as calligraphy, and decided to attend a calligraphy class.","ko":"그는 캘리그래피(calligraphy)라고도 알려진, 아름다운 손 글씨를 만들어 내는 예술에 매료되었고, 캘리그래피 수업을 수강하기로 결심했다.","grammar":[]},{"n":7,"en":"He gained an understanding of letter styles and learned to adjust the spacing between various combinations of letters.","ko":"그는 글자체에 대한 이해를 얻게 되었고 글자들의 다양한 조합 간의 간격을 조정하는 것을 배웠다.","grammar":[]},{"n":8,"en":"At that time, he did not expect that learning it would be useful or applicable to his life in the future.","ko":"그 당시에, 그는 그것을 배우는 것이 유용하거나 장차 그의 삶에 적용 가능할 거라고는 예상하지 못했다.","grammar":[]},{"n":9,"en":"However, later when he developed his own computer operating system, he incorporated what he learned from that class into designing the system.","ko":"그러나 나중에 그가 직접 컴퓨터 운영 체제를 개발했을 때, 그는 그 수업에서 배웠던 것을 시스템 디자인에 반영했다.","grammar":[{"label":"what he learned from that class","explanation":"what he learned from that class — 관계대명사 what 절이 incorporated의 목적어","transform_label":"incorporate A into B → reflect A in B — A를 B에 반영하다","transform_value":"… system, he reflected what he … that class in designing the …"}]},{"n":10,"en":"As a result, he developed his own computer system with visually appealing letter styles.","ko":"그 결과, 그는 시각적으로 매력적인 글자체를 가진 자신의 컴퓨터 체제를 개발해 냈다.","grammar":[]},{"n":11,"en":"The artistic letters became a sensation at the time and are still widely used.","ko":"그 예술적인 글자체들은 당시에 돌풍을 일으켰고, 여전히 널리 쓰이고 있다.","grammar":[]},{"n":12,"en":"His innovative incorporation of calligraphy into the world of technology, which started from his personal interest, has inspired many other corporations' computer system designs.","ko":"그의 개인적인 흥미에서 시작된 캘리그래피를 기술의 세계에 혁신적으로 접목시킨 일은 다른 많은 기업들의 컴퓨터 시스템 디자인에 영감을 주었다.","grammar":[{"label":"which started from his personal interest","explanation":"which started from his personal interest — 계속적 용법의 주격 관계대명사","transform_label":"which started from his personal interest — 계속적 용법 → 접속사 + 대명사 — which 를 and it 으로 풀어 두 절로 나눈다","transform_value":"… personal interest, and it has inspired …"},{"label":"has inspired","explanation":"has inspired — 현재완료 · 지금까지 이어지는 영향"}]}],"structure":[],"flow":[{"label":"진로가 불확실한 때","sentences":"S1 · S2 · S3 · S4","text":"잡스는 흥미가 가는 수업을 선택했다.","refs":[1,2,3,4]},{"label":"배운 것","sentences":"S5 · S6 · S7 · S8","text":"캘리그래피에서 글자체와 자간의 아름다움을 익혔다.","refs":[5,6,7,8]},{"label":"나중의 연결","sentences":"S9 · S10 · S11 · S12","text":"그 경험이 컴퓨터 글꼴 설계와 산업에 영향을 주었다.","refs":[9,10,11,12]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["그 경험이 컴퓨터 글꼴 설계와 산업에 영향을 주었다.","스티브 잡스가 호기심으로 들은 캘리그래피 수업은 나중에 컴퓨터의 아름다운 글자체 설계에 쓰였다.","잡스는 흥미가 가는 수업을 선택했다."],"answer":1,"why":"스티브 잡스가 호기심으로 들은 캘리그래피 수업은 나중에 컴퓨터의 아름다운 글자체 설계에 쓰였다.","refs":[1,12]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","그 경험이 컴퓨터 글꼴 설계와 산업에 영향을 주었다.","잡스는 흥미가 가는 수업을 선택했다."],"answer":1,"why":"그 경험이 컴퓨터 글꼴 설계와 산업에 영향을 주었다.","refs":[9,10,11,12]},{"type":"문법","q":"S3의 'things that seemed interesting' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","things that seemed interesting — 주격 관계대명사"],"answer":2,"why":"He decided that he would start checking …","refs":[3]}],"key_sentence_en":"His innovative incorporation of calligraphy into the world of technology, which started from his personal interest, has inspired many other corporations' computer system designs.","key_sentence_ko":"그의 개인적인 흥미에서 시작된 캘리그래피를 기술의 세계에 혁신적으로 접목시킨 일은 다른 많은 기업들의 컴퓨터 시스템 디자인에 영감을 주었다."}]},{"id":"l2","label":"2과 · Creativity Is Key","scope":"본문 7구간","passages":[{"id":"l2-01","title":"고정된 일상에서 벗어나기","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"익숙한 방식에서 잠시 벗어나 다른 관점으로 보면 창의적인 해결책을 찾을 수 있다.","diagram":{"kind":"compare","title":"관점을 바꾸면?","items":[{"head":"같은 방식만 고집","body":"좋은 생각을 놓칠 수 있음","refs":[1]},{"head":"다른 각도로 보기","body":"이해가 넓어지고 창의적인 해결책을 찾음","refs":[2,3]}]},"easy_story":"매일 같은 방식으로 생각하면 좋은 아이디어를 놓칠 수 있습니다. 문제를 다른 각도에서 보면 이해의 폭이 넓어지고 새로운 해결책이 떠오릅니다. 글은 그 힘을 보여 주는 두 사례를 소개합니다.","blocking_vocab":[],"sentences":[{"n":1,"en":"As we go through life, we may become stuck in a routine, missing out on extraordinary ideas or solutions.","ko":"<독창적 사고의 잠재력> 우리는 인생을 살아가면서 일상에 갇혀, 비범한 발상이나 해결책을 놓치기도 합니다.","grammar":[{"label":"문장 전환","explanation":"missing out on extraordinary ideas — 부가적 분사구문 → 접속사 + 절 — and 와 주어 we 를 세워 절로 편다","transform_label":"missing out on extraordinary ideas — 부가적 분사구문 → 접속사 + 절 — and 와 주어 we 를 세워 절로 편다","transform_value":"… a routine, and we may miss out on …"}]},{"n":2,"en":"In such a situation, we can try considering things from a different angle.","ko":"그런 상황에서, 우리는 다른 시각에서 생각해 볼 수 있습니다.","grammar":[]},{"n":3,"en":"By doing so, we can expand our understanding of the world, challenge our assumptions, and find creative solutions to problems.","ko":"그렇게 함으로써, 우리는 세상에 대한 이해를 넓히고, (우리가 기존에 갖고 있던) 가정을 반박하며, 문제에 대한 창의적인 해결책을 모색할 수 있습니다.","grammar":[]},{"n":4,"en":"Let's look at two stories that demonstrate the power of thinking differently.","ko":"다르게 사고하기의 힘을 보여 주는 두 가지 이야기를 살펴봅시다.","grammar":[{"label":"two stories that demonstrate","explanation":"two stories that demonstrate — 사물을 받는 주격 관계대명사 that"}]}],"structure":[],"flow":[{"label":"문제","sentences":"S1 · S2","text":"고정된 일상과 시각이 새 생각을 막을 수 있다.","refs":[1,2]},{"label":"글의 방향","sentences":"S3 · S4","text":"다른 관점이 창의적인 해결책을 낳는 두 사례를 본다.","refs":[3,4]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["고정된 일상과 시각이 새 생각을 막을 수 있다.","다른 관점이 창의적인 해결책을 낳는 두 사례를 본다.","익숙한 방식에서 잠시 벗어나 다른 관점으로 보면 창의적인 해결책을 찾을 수 있다."],"answer":2,"why":"익숙한 방식에서 잠시 벗어나 다른 관점으로 보면 창의적인 해결책을 찾을 수 있다.","refs":[1,4]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["다른 관점이 창의적인 해결책을 낳는 두 사례를 본다.","고정된 일상과 시각이 새 생각을 막을 수 있다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"다른 관점이 창의적인 해결책을 낳는 두 사례를 본다.","refs":[3,4]},{"type":"문법","q":"S1의 '문장 전환' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","missing out on extraordinary ideas — 부가적 분사구문 → 접속사 + 절 — and 와 주어 we 를 세워 절로 편다","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"… a routine, and we may miss out on …","refs":[1]}],"key_sentence_en":"Let's look at two stories that demonstrate the power of thinking differently.","key_sentence_ko":"다르게 사고하기의 힘을 보여 주는 두 가지 이야기를 살펴봅시다."},{"id":"l2-02","title":"설계가 막힌 건축가","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"숙련된 건축가 Gropius도 새 건물의 통행로를 어떻게 설계할지 결정하지 못했다.","diagram":{"kind":"compare","title":"남은 설계 문제","items":[{"head":"이미 된 것","body":"건물의 대부분","refs":[1,3]},{"head":"아직 못 정한 것","body":"사람들이 다닐 통행로","refs":[2,3,4]}]},"easy_story":"Gropius는 실력 있는 건축가였지만 한 건물에서 막혔습니다. 건물은 거의 완성됐는데 사람들이 다닐 길을 아직 정하지 못한 것입니다. 여러 안을 생각해도 마음에 들지 않았습니다.","blocking_vocab":[{"word":"architecture","meaning":"건축"}],"sentences":[{"n":1,"en":"Walter Gropius was a well-known architect, widely regarded as one of the pioneers of modernist architecture.","ko":"<누가 통행로를 만들었을까?> Walter Gropius는 현대 건축의 선구자 중 한 명으로 널리 여겨지는 유명한 건축가였습니다.","grammar":[]},{"n":2,"en":"However, even this expert architect was once troubled when designing an amusement park.","ko":"그런데, 이 숙련된 건축가조차도 놀이공원을 설계할 때 곤란에 처한 적이 있었습니다.","grammar":[]},{"n":3,"en":"He finished most of the main structures except for the pathways between the attractions.","ko":"그는 놀이기구 사이의 통행로를 제외하고는 주요 건축물의 대부분을 다 지었습니다.","grammar":[]},{"n":4,"en":"Gropius wanted to find the best design for the pathways but could not come up with anything that satisfied him.","ko":"Gropius는 통행로에 맞는 최적의 디자인을 찾고 싶었지만, 그를 만족시킨 어떤 것도 떠올릴 수 없었습니다.","grammar":[{"label":"anything that satisfied him","explanation":"anything that satisfied him — 주격 관계대명사 that"}]}],"structure":[],"flow":[{"label":"인물","sentences":"S1 · S2","text":"Gropius는 현대 건축의 선구자다.","refs":[1,2]},{"label":"막힌 과제","sentences":"S3 · S4","text":"건물의 다른 부분은 지었지만 통행로 설계가 만족스럽지 않았다.","refs":[3,4]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["건물의 다른 부분은 지었지만 통행로 설계가 만족스럽지 않았다.","숙련된 건축가 Gropius도 새 건물의 통행로를 어떻게 설계할지 결정하지 못했다.","Gropius는 현대 건축의 선구자다."],"answer":1,"why":"숙련된 건축가 Gropius도 새 건물의 통행로를 어떻게 설계할지 결정하지 못했다.","refs":[1,4]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["건물의 다른 부분은 지었지만 통행로 설계가 만족스럽지 않았다.","Gropius는 현대 건축의 선구자다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"건물의 다른 부분은 지었지만 통행로 설계가 만족스럽지 않았다.","refs":[3,4]},{"type":"문법","q":"S4의 'anything that satisfied him' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","anything that satisfied him — 주격 관계대명사 that"],"answer":2,"why":"anything that satisfied him — 주격 관계대명사 that","refs":[4]}],"key_sentence_en":"Gropius wanted to find the best design for the pathways but could not come up with anything that satisfied him.","key_sentence_ko":"Gropius는 통행로에 맞는 최적의 디자인을 찾고 싶었지만, 그를 만족시킨 어떤 것도 떠올릴 수 없었습니다."},{"id":"l2-03","title":"자유로운 포도 따기","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"포도원 주인이 손님에게 직접 포도를 따게 한 방식은 수확 문제를 풀면서 손님에게 경험도 주었다.","diagram":{"kind":"steps","title":"노부부의 포도원 방식","items":[{"head":"상황","body":"노부부가 아파 직접 포도를 딸 수 없음","refs":[4,5]},{"head":"방법","body":"상자에 5프랑을 넣고 손님이 직접 따 감","refs":[6]},{"head":"효과","body":"포도 과숙 방지 + 손님의 즐거운 경험","refs":[7]}]},"easy_story":"Gropius는 프랑스에서 사람 없는 포도원 앞의 상자를 봤습니다. 건강이 좋지 않은 노부부가 손님에게 5프랑만 넣고 포도를 직접 따 가게 한 것입니다. 포도는 지나치게 익기 전에 수확되고 손님은 즐거운 경험을 얻었습니다.","blocking_vocab":[],"sentences":[{"n":1,"en":"One day, Gropius took a trip to France.","ko":"어느 날, Gropius는 프랑스로 여행을 떠났습니다.","grammar":[]},{"n":2,"en":"The place he went to was famous for its vineyards.","ko":"그가 간 곳은 포도원으로 유명했습니다.","grammar":[{"label":"place he went","explanation":"place he went — 목적격 관계대명사 생략 · place that he went"}]},{"n":3,"en":"Farmers were selling grapes along the road near each vineyard.","ko":"농부들은 각 포도원 근처 길을 따라 포도를 팔고 있었습니다.","grammar":[]},{"n":4,"en":"Then, one far ahead caught his eye because there was no one selling grapes but only a box by the side of the road.","ko":"그때, 멀리 떨어진 한 포도원이 그의 눈길을 끌었습니다. 왜냐하면 그곳에는 포도를 팔고 있는 사람 없이 길가에 상자만 하나 있었기 때문이었습니다.","grammar":[]},{"n":5,"en":"It turned out that the elderly couple who owned the vineyard were in poor health and could not pick the grapes themselves.","ko":"사실, 그 포도원 주인인 노부부는 건강이 좋지 않아 포도를 직접 딸 수 없었습니다.","grammar":[]},{"n":6,"en":"Instead, they let people pick as many grapes as they wanted as long as they put five francs in the box.","ko":"대신에, 그들은 사람들에게 (길가에 있는) 그 상자에 5프랑을 넣는 한 원하는 만큼 포도를 마음껏 따가도 된다고 허락했습니다.","grammar":[]},{"n":7,"en":"The couple not only prevented their grapes from becoming too ripe by permitting grape picking, but they also provided an enjoyable experience for their customers.","ko":"이 부부는 포도 따기를 허용함으로써 포도가 너무 익는 것을 방지할 뿐만 아니라 고객들에게 즐거운 경험도 제공했습니다.","grammar":[{"label":"not only prevented their grapes from becoming too ripe","explanation":"not only prevented their grapes from becoming too ripe — not only A but also B"}]}],"structure":[],"flow":[{"label":"낯선 장면","sentences":"S1 · S2 · S3 · S4","text":"길가의 다른 포도원과 달리 한곳에는 사람 없이 상자만 있었다.","refs":[1,2,3,4]},{"label":"이유와 방법","sentences":"S5 · S6","text":"아픈 노부부가 손님에게 돈을 넣고 직접 따 가게 했다.","refs":[5,6]},{"label":"두 효과","sentences":"S7","text":"포도 과숙을 막고 손님에게 즐거움을 주었다.","refs":[7]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["포도 과숙을 막고 손님에게 즐거움을 주었다.","포도원 주인이 손님에게 직접 포도를 따게 한 방식은 수확 문제를 풀면서 손님에게 경험도 주었다.","길가의 다른 포도원과 달리 한곳에는 사람 없이 상자만 있었다."],"answer":1,"why":"포도원 주인이 손님에게 직접 포도를 따게 한 방식은 수확 문제를 풀면서 손님에게 경험도 주었다.","refs":[1,7]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["포도 과숙을 막고 손님에게 즐거움을 주었다.","길가의 다른 포도원과 달리 한곳에는 사람 없이 상자만 있었다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"포도 과숙을 막고 손님에게 즐거움을 주었다.","refs":[7]},{"type":"문법","q":"S2의 'place he went' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","place he went — 목적격 관계대명사 생략 · place that he went","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"place he went — 목적격 관계대명사 생략 · place that he went","refs":[2]}],"key_sentence_en":"The couple not only prevented their grapes from becoming too ripe by permitting grape picking, but they also provided an enjoyable experience for their customers.","key_sentence_ko":"이 부부는 포도 따기를 허용함으로써 포도가 너무 익는 것을 방지할 뿐만 아니라 고객들에게 즐거운 경험도 제공했습니다."},{"id":"l2-04","title":"잔디 위에 생긴 오솔길","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"Gropius는 통행로를 미리 정하는 대신 방문객이 잔디에 낸 자국을 따라 길을 만들었다.","diagram":{"kind":"steps","title":"길을 먼저 그리지 않았다","items":[{"head":"잔디부터 심기","body":"통행로 자리를 미리 확정하지 않음","refs":[1,2,3]},{"head":"사람이 실제로 걷기","body":"발길이 잔디에 오솔길을 남김","refs":[4,5]},{"head":"자국을 길로 만들기","body":"실제 이용 경로에 맞춘 영구 통행로","refs":[6,7,10]}]},"easy_story":"포도원에서 손님에게 일부 일을 맡긴 방법을 떠올린 Gropius는 길 자리에도 우선 잔디를 심었습니다. 방문객들이 실제로 걸어 다니자 잔디 위에 자연스러운 길이 생겼습니다. 그는 그 자국을 따라 영구 통행로를 만들었고, 이 새 방식은 좋은 평가를 받았습니다.","blocking_vocab":[{"word":"convenient","meaning":"편리한"},{"word":"architecture","meaning":"건축"}],"sentences":[{"n":1,"en":"Astonished by the elderly couple's idea of allowing customers to freely pick grapes, Gropius thought it would be good to extend this idea to the amusement park design and allow visitors to create their own paths.","ko":"Gropius는 고객들이 자유롭게 포도를 딸 수 있게 한 노부부의 아이디어에 깜짝 놀랐기 때문에, Gropius는 이 발상을 놀이공원 디자인으로 확장하여 방문객들이 그들만의 통행로를 만들 수 있도록 하는 것이 좋겠다고 생각했습니다.","grammar":[{"label":"to extend this idea to the amusement park design and allow","explanation":"to extend this idea to the amusement park design and allow — to부정사 병렬 · to 생략 · 「이 발상을 확장하고 방문객이 만들게 하는 것이」","transform_label":"Astonished by the elderly couple's idea — 과거분사구문 → 이유 부사절 — Because 와 주어·be 동사를 되살린다","transform_value":"Because he was astonished by …"},{"label":"thought it would be good to extend this idea","explanation":"thought it would be good to extend this idea — that 생략 목적어절 · 절 안의 가주어 it + 진주어 to V"}]},{"n":2,"en":"Upon returning to his project, he instructed the construction team to plant grass in areas where he wanted to create the pathways.","ko":"그는 프로젝트로 돌아오자마자, 건축 팀에게 길을 내고자 한 곳에 잔디를 심도록 지시했습니다.","grammar":[{"label":"where he wanted","explanation":"where he wanted — 관계부사"}]},{"n":3,"en":"When the grass started to grow, he opened the amusement park earlier than planned.","ko":"잔디가 자라기 시작했을 때, 그는 예정보다 더 일찍 놀이공원을 개장했습니다.","grammar":[]},{"n":4,"en":"In places where people repeatedly walked, small footpaths started to form on the grass.","ko":"사람들이 반복적으로 걸어 다닌 곳의 잔디 위에, 작은 오솔길이 생기기 시작했습니다.","grammar":[]},{"n":5,"en":"The shapes of the paths were not unified, with some wide and some narrow, because they were formed naturally by visitors.","ko":"방문객들의 발길에 따라 자연스럽게 형성되다 보니, 이 오솔길의 형태는 통일되어 있지 않아서 어떤 곳은 넓고 어떤 곳은 좁았습니다.","grammar":[]},{"n":6,"en":"The following year, Gropius used the grass pathways as an outline on which he built permanent pathways, resulting in the most convenient and efficient routes.","ko":"이듬해에, Gropius는 잔디 위에 생긴 오솔길을 윤곽선으로 사용하여 영구적인 통행로를 만들었고, 그 결과 가장 편리하면서 효율적인 경로가 되었습니다.","grammar":[{"label":"문장 전환","explanation":"on which he built permanent pathways — 전치사 + 관계대명사 → 관계부사 where — 뒤 절이 완전하니 관계부사 where 로 바꾼다","transform_label":"on which he built permanent pathways — 전치사 + 관계대명사 → 관계부사 where — 뒤 절이 완전하니 관계부사 where 로 바꾼다","transform_value":"… an outline where he built …"}]},{"n":7,"en":"This pathway design was later chosen as the best road design at the 1971 International Landscape Architecture Symposium in London.","ko":"이 통행로 디자인은 나중에 1971년 런던에서 열린 국제 조경 건축 심포지엄에서 가장 훌륭한 길 디자인으로 선정되었습니다.","grammar":[]},{"n":8,"en":"It was contrary to common sense to allow people to walk on newly sprouted grass because it could damage the grass.","ko":"새로 돋아나는 잔디 위를 걷도록 하는 것은 잔디를 상하게 할 수 있었기 때문에 상식에 어긋나는 것이었습니다.","grammar":[]},{"n":9,"en":"Moreover, it was unprecedented for an architect to let people do the designing.","ko":"게다가, 건축가가 사람들에게 디자인을 하도록 한 것은 전례가 없었습니다.","grammar":[]},{"n":10,"en":"Nonetheless, Gropius gained insight into creating ideal pathways by thinking outside the box.","ko":"그럼에도 불구하고, Gropius는 고정관념을 벗어난 사고를 통해 이상적인 통행로를 만드는 데 있어 통찰력을 얻었습니다.","grammar":[]}],"structure":[],"flow":[{"label":"새 발상","sentences":"S1 · S2 · S3","text":"방문객의 움직임으로 길의 자리를 정하자고 생각했다.","refs":[1,2,3]},{"label":"실행","sentences":"S4 · S5 · S6","text":"잔디에 생긴 여러 오솔길을 따라 영구 통행로를 냈다.","refs":[4,5,6]},{"label":"평가","sentences":"S7 · S8 · S9 · S10","text":"관습을 벗어난 설계가 높이 평가되었다.","refs":[7,8,9,10]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["Gropius는 통행로를 미리 정하는 대신 방문객이 잔디에 낸 자국을 따라 길을 만들었다.","방문객의 움직임으로 길의 자리를 정하자고 생각했다.","관습을 벗어난 설계가 높이 평가되었다."],"answer":0,"why":"Gropius는 통행로를 미리 정하는 대신 방문객이 잔디에 낸 자국을 따라 길을 만들었다.","refs":[1,10]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","관습을 벗어난 설계가 높이 평가되었다.","방문객의 움직임으로 길의 자리를 정하자고 생각했다."],"answer":1,"why":"관습을 벗어난 설계가 높이 평가되었다.","refs":[7,8,9,10]},{"type":"문법","q":"S1의 'to extend this idea to the amusement park design and allow' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","to extend this idea to the amusement park design and allow — to부정사 병렬 · to 생략 · 「이 발상을 확장하고 방문객이 만들게 하는 것이」"],"answer":2,"why":"Because he was astonished by …","refs":[1]}],"key_sentence_en":"Nonetheless, Gropius gained insight into creating ideal pathways by thinking outside the box.","key_sentence_ko":"그럼에도 불구하고, Gropius는 고정관념을 벗어난 사고를 통해 이상적인 통행로를 만드는 데 있어 통찰력을 얻었습니다."},{"id":"l2-05","title":"15초가 길게 느껴지는 이유","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"엘리베이터의 실제 속도보다 할 일이 없고 갇힌 듯한 느낌이 승객의 불만을 키웠다.","diagram":{"kind":"compare","title":"속도와 체감은 다르다","items":[{"head":"실제 운행","body":"한 층에 약 15초; 기술로 속도 향상은 어려움","refs":[6,7,10]},{"head":"승객의 느낌","body":"할 일이 없어 더디고 공간이 답답함","refs":[8,9]}]},"easy_story":"엘리베이터 기술이 발전했는데도 승객들은 느리다고 불평했습니다. 한 층에 15초가 걸렸고 그동안 할 일이 없어 시간이 더 길게 느껴졌습니다. 갇힌 듯한 답답함도 있었지만 당시 기술로 실제 속도를 높이기는 어려웠습니다.","blocking_vocab":[{"word":"architecture","meaning":"건축"}],"sentences":[{"n":1,"en":"Have you ever wondered why there are mirrors in elevators?","ko":"<엘리베이터 안에는 왜 거울이 있을까?> 엘리베이터 안에 왜 거울이 있는지에 대해 궁금해 한 적이 있나요?","grammar":[{"label":"Have you ever wondered","explanation":"Have you ever wondered — 현재완료 경험 의문문"}]},{"n":2,"en":"The world's first successful passenger elevator was installed in a five-story building in New York in 1857.","ko":"세계 최초의 성공적인 승객용 엘리베이터는 1857년 뉴욕의 5층 건물에 설치되었습니다.","grammar":[]},{"n":3,"en":"This prominent development brought excitement to the field of architecture by making it possible to build much taller buildings than ever before.","ko":"이 주목할 만한 발전은 기존보다 훨씬 더 높은 건물을 지을 수 있게 해 주었기에 건축 분야에 큰 호응을 불러일으켰습니다.","grammar":[]},{"n":4,"en":"Nevertheless, passengers were highly dissatisfied regardless of how practical it was.","ko":"그럼에도 불구하고 승객들은 이것이 아무리 실용적이라 하더라도 매우 불만족스러워 했습니다.","grammar":[]},{"n":5,"en":"Employees of the elevator company conducted a customer survey in order to find out why the passengers were so unhappy.","ko":"엘리베이터 회사 직원들은 승객들이 왜 그렇게 불만족스러워하는지 알아내기 위해 고객 설문 조사를 실시했습니다.","grammar":[]},{"n":6,"en":"The results of the questionnaire showed that it was the elevator's slow speed that was causing dissatisfaction.","ko":"설문 조사 결과는 불만족의 원인이 엘리베이터의 느린 속도라는 것을 보여 주었습니다.","grammar":[]},{"n":7,"en":"The trip from one floor to the next took nearly fifteen seconds.","ko":"한 층에서 그다음 층까지 이동하는 데 거의 15초가 걸렸습니다.","grammar":[]},{"n":8,"en":"The employees also discovered that passengers thought the elevator was much slower than it actually was because passengers had nothing to do.","ko":"직원들은 또한 승객들이 아무것도 할 게 없다 보니 엘리베이터가 실제보다 훨씬 더 느리다고 생각한다는 것을 발견했습니다.","grammar":[]},{"n":9,"en":"During the slow ride, some passengers complained and said they felt trapped.","ko":"느리게 이동하는 동안에, 일부 승객은 불평했고 갇혀 있는 것처럼 느껴진다고 말했습니다.","grammar":[{"label":"complained and said","explanation":"complained and said — 과거시제 동사 병렬"},{"label":"said they felt trapped","explanation":"said they felt trapped — 명사절 접속사 that 생략 · felt + 과거분사 보어"}]},{"n":10,"en":"Even though the employees identified speed as the main source of dissatisfaction, it was not something that could be improved immediately due to technological limitations.","ko":"비록 직원들이 속도를 불만족의 주요 원인으로 파악했지만, 그것은 기술적 한계로 인해 즉시 개선될 수 있는 것이 아니었습니다.","grammar":[{"label":"that could be improved immediately","explanation":"that could be improved immediately — 주격 관계대명사 that"},{"label":"something that could be improved","explanation":"something that could be improved — 사물을 받는 주격 관계대명사 that · 조동사 + 수동태"}]}],"structure":[],"flow":[{"label":"불만","sentences":"S1 · S2 · S3 · S4 · S5","text":"엘리베이터가 발전했어도 승객은 느리다고 느꼈다.","refs":[1,2,3,4,5]},{"label":"실제 원인","sentences":"S6 · S7 · S8 · S9","text":"15초 동안 할 일이 없고 갇힌 느낌이 들었다.","refs":[6,7,8,9]},{"label":"기술적 한계","sentences":"S10","text":"속도 자체를 올리기는 어려웠다.","refs":[10]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["엘리베이터가 발전했어도 승객은 느리다고 느꼈다.","속도 자체를 올리기는 어려웠다.","엘리베이터의 실제 속도보다 할 일이 없고 갇힌 듯한 느낌이 승객의 불만을 키웠다."],"answer":2,"why":"엘리베이터의 실제 속도보다 할 일이 없고 갇힌 듯한 느낌이 승객의 불만을 키웠다.","refs":[1,10]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["엘리베이터가 발전했어도 승객은 느리다고 느꼈다.","앞의 사건과 관계없는 새 주제","속도 자체를 올리기는 어려웠다."],"answer":2,"why":"속도 자체를 올리기는 어려웠다.","refs":[10]},{"type":"문법","q":"S1의 'Have you ever wondered' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","Have you ever wondered — 현재완료 경험 의문문"],"answer":2,"why":"Have you ever wondered — 현재완료 경험 의문문","refs":[1]}],"key_sentence_en":"Even though the employees identified speed as the main source of dissatisfaction, it was not something that could be improved immediately due to technological limitations.","key_sentence_ko":"비록 직원들이 속도를 불만족의 주요 원인으로 파악했지만, 그것은 기술적 한계로 인해 즉시 개선될 수 있는 것이 아니었습니다."},{"id":"l2-06","title":"거울이라는 해결책","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"직원은 속도를 바꾸지 못해도 승객의 지루함과 답답함을 거울로 줄일 수 있다고 보았다.","diagram":{"kind":"compare","title":"무엇을 고칠 것인가?","items":[{"head":"처음 붙든 문제","body":"엘리베이터 속도","refs":[1,2,3]},{"head":"새로 본 문제·해법","body":"지루함과 답답함 → 거울 설치","refs":[3,4,5,6,7]}]},"easy_story":"한 직원은 기계가 아니라 승객의 입장에서 문제를 다시 봤습니다. 진짜 불편은 기다리는 동안의 지루함과 갇힌 느낌일 수 있었습니다. 그래서 엘리베이터 안에 거울을 달아 공간이 넓어 보이고 승객이 볼거리도 생기게 하자고 제안했습니다.","blocking_vocab":[{"word":"perspective","meaning":"관점"}],"sentences":[{"n":1,"en":"Then, one day, one employee of the elevator company began to look at the problem from a different perspective.","ko":"그러고 나서, 엘리베이터 회사의 한 직원이 그 문제를 다른 시각으로 바라보기 시작했습니다.","grammar":[]},{"n":2,"en":"She thought about it from a passenger's point of view.","ko":"그녀는 승객의 관점에서 그 문제에 대해 생각해 보았습니다.","grammar":[]},{"n":3,"en":"She thought that what mattered was not speed but discomfort and boredom.","ko":"그녀는 중요한 것은 속도가 아니라 불편함과 지루함이라고 생각했습니다.","grammar":[{"label":"what mattered was","explanation":"what mattered was — 관계대명사 what 명사절"}]},{"n":4,"en":"She asked herself what could be done in this case.","ko":"그녀는 이러한 경우에 어떤 것을 할 수 있는지 스스로에게 물어보았습니다.","grammar":[{"label":"what could be done in this case","explanation":"what could be done in this case — 간접의문문 what절"}]},{"n":5,"en":"After many days of searching for a solution, she proposed installing a mirror inside the elevator.","ko":"해결책을 찾기 위해 여러 날을 보낸 후에, 그녀는 엘리베이터 안에 거울을 설치하는 것을 제안했습니다.","grammar":[]},{"n":6,"en":"She believed that it could make the elevator appear larger, reducing the feeling of being trapped.","ko":"그녀는 이것이 엘리베이터를 더 크게 보이게 만들어서 갇힌 느낌을 줄일 수 있을 것이라고 믿었습니다.","grammar":[]},{"n":7,"en":"Also, she believed that people could relieve boredom by looking in the mirror.","ko":"또한, 그녀는 사람들이 거울을 보면서 지루함을 덜 수 있을 것이라고 생각했습니다.","grammar":[]}],"structure":[],"flow":[{"label":"관점 바꾸기","sentences":"S1 · S2","text":"직원이 승객의 입장에서 문제를 생각한다.","refs":[1,2]},{"label":"문제 재정의","sentences":"S3 · S4","text":"속도보다 불편함과 지루함을 해결해야 한다.","refs":[3,4]},{"label":"해법","sentences":"S5 · S6 · S7","text":"거울로 답답함과 지루함을 줄이자고 한다.","refs":[5,6,7]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["직원이 승객의 입장에서 문제를 생각한다.","거울로 답답함과 지루함을 줄이자고 한다.","직원은 속도를 바꾸지 못해도 승객의 지루함과 답답함을 거울로 줄일 수 있다고 보았다."],"answer":2,"why":"직원은 속도를 바꾸지 못해도 승객의 지루함과 답답함을 거울로 줄일 수 있다고 보았다.","refs":[1,7]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["직원이 승객의 입장에서 문제를 생각한다.","앞의 사건과 관계없는 새 주제","거울로 답답함과 지루함을 줄이자고 한다."],"answer":2,"why":"거울로 답답함과 지루함을 줄이자고 한다.","refs":[5,6,7]},{"type":"문법","q":"S3의 'what mattered was' 설명으로 알맞은 것은?","choices":["what mattered was — 관계대명사 what 명사절","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"what mattered was — 관계대명사 what 명사절","refs":[3]}],"key_sentence_en":"Also, she believed that people could relieve boredom by looking in the mirror.","key_sentence_ko":"또한, 그녀는 사람들이 거울을 보면서 지루함을 덜 수 있을 것이라고 생각했습니다."},{"id":"l2-07","title":"시간 인식의 변화","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"거울은 속도를 바꾸지 않았지만 승객이 느끼는 시간을 바꾸어 불만을 줄였다.","diagram":{"kind":"compare","title":"달라진 것은 속도가 아니다","items":[{"head":"실제 시간","body":"엘리베이터 속도는 그대로","refs":[1,3]},{"head":"느낀 시간","body":"거울을 보며 덜 지루해 빨라진 듯 느낌","refs":[1,2,4]}]},"easy_story":"거울을 단 뒤 엘리베이터 속도는 그대로였습니다. 그런데 승객은 거울을 보느라 시간이 덜 길게 느껴져 더 빨라졌다고 반응했습니다. 글은 막힌 문제를 다른 시각에서 보면 이런 해법을 찾을 수 있다고 마무리합니다.","blocking_vocab":[{"word":"attention","meaning":"관심, 주목"},{"word":"perspective","meaning":"관점"}],"sentences":[{"n":1,"en":"On a survey done after the mirror was installed, passengers commented on how much faster the new elevator was, even though the speed was exactly the same.","ko":"거울이 설치된 후에 실시된 설문 조사에서, (엘리베이터의) 속도가 정확히 동일하였음에도 불구하고, 승객들은 새로운 엘리베이터가 얼마나 훨씬 더 빨라졌는지에 대해 얘기했습니다.","grammar":[{"label":"survey done","explanation":"survey done — 주격 관계대명사+be 생략 · survey that was done"}]},{"n":2,"en":"Passengers stopped paying attention to the speed of the elevator because they were looking in the mirror.","ko":"승객들은 거울을 보고 있었기 때문에 엘리베이터의 속도에 관심을 기울이지 않았습니다.","grammar":[]},{"n":3,"en":"If the employee had thought only of ways to increase the speed of the elevator to resolve the problem, it might not have been possible to find a solution.","ko":"만약 그 직원이 문제를 해결하기 위해 엘리베이터의 속도를 높이는 방법만 생각했다면, 해결책을 찾기가 불가능했을 수도 있었을 것입니다.","grammar":[{"label":"If the employee had thought only of ways to increase the speed of the elevator","explanation":"If the employee had thought only of ways to increase the speed of the elevator — 가정법 과거완료"}]},{"n":4,"en":"However, by viewing the problem from a different perspective, the employee found the solution by speeding up the customers' perception of time.","ko":"그러나 그 직원은 문제를 다른 관점에서 바라봄으로써, 승객들의 시간에 대한 인식의 속도를 높여서 해결책을 찾았습니다.","grammar":[]},{"n":5,"en":"In solving problems that are new to us, it is quite easy to get stuck in a particular point of view.","ko":"우리가 새로운 문제를 해결할 때, 특정한 관점에 갇히기 매우 쉽습니다.","grammar":[]},{"n":6,"en":"However, even a simple shift in perspective can result in a creative solution.","ko":"하지만 간단한 관점의 변화만으로도 창의적인 해결책으로 결과가 나타날 수 있습니다.","grammar":[]},{"n":7,"en":"So, the next time you face a problem, try thinking about it from a different angle.","ko":"따라서 여러분이 다음에 문제에 직면했을 때, 다른 관점에서 문제를 생각해 보는 것을 시도해 보세요.","grammar":[]}],"structure":[],"flow":[{"label":"결과","sentences":"S1 · S2","text":"속도는 그대로인데 빨라졌다고 느꼈다.","refs":[1,2]},{"label":"왜 달라졌나","sentences":"S3 · S4","text":"기계가 아니라 승객의 시간 감각을 바꿨기 때문이다.","refs":[3,4]},{"label":"교훈","sentences":"S5 · S6 · S7","text":"한 관점에 갇히지 말고 문제를 다른 각도로 보라.","refs":[5,6,7]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["한 관점에 갇히지 말고 문제를 다른 각도로 보라.","거울은 속도를 바꾸지 않았지만 승객이 느끼는 시간을 바꾸어 불만을 줄였다.","속도는 그대로인데 빨라졌다고 느꼈다."],"answer":1,"why":"거울은 속도를 바꾸지 않았지만 승객이 느끼는 시간을 바꾸어 불만을 줄였다.","refs":[1,7]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["한 관점에 갇히지 말고 문제를 다른 각도로 보라.","속도는 그대로인데 빨라졌다고 느꼈다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"한 관점에 갇히지 말고 문제를 다른 각도로 보라.","refs":[5,6,7]},{"type":"문법","q":"S1의 'survey done' 설명으로 알맞은 것은?","choices":["survey done — 주격 관계대명사+be 생략 · survey that was done","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"survey done — 주격 관계대명사+be 생략 · survey that was done","refs":[1]}],"key_sentence_en":"So, the next time you face a problem, try thinking about it from a different angle.","key_sentence_ko":"따라서 여러분이 다음에 문제에 직면했을 때, 다른 관점에서 문제를 생각해 보는 것을 시도해 보세요."}]},{"id":"l2-rm","label":"2과 · Read More","scope":"추가 읽기","passages":[{"id":"l2-rm-01","title":"사지 말라는 광고","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"두 회사는 ‘사지 말라’는 뜻밖의 메시지로 책임 있는 이미지를 얻고 고객의 반응을 이끌었다.","diagram":{"kind":"roster","title":"같은 역발상, 두 광고","items":[{"head":"패스트푸드","body":"자주 먹지 말라고 고객에게 말함","refs":[3,4,5,6,7]},{"head":"패션","body":"옷을 덜·천천히 사자고 말함","refs":[8,9,10,11,12]},{"head":"공통 반응","body":"책임 있는 메시지에 고객의 호응이 따름","refs":[13,14,15]}]},"easy_story":"패스트푸드 회사는 자주 먹지 말라고 말해 오히려 책임 있는 모습으로 받아들여졌습니다. 한 패션 회사도 옷을 무턱대고 사서 빨리 버리는 소비를 경계하자고 했습니다. 두 사례 모두 고객은 회사의 진심을 긍정적으로 보고 더 관심을 보였습니다.","blocking_vocab":[{"word":"attention","meaning":"관심, 주목"}],"sentences":[{"n":1,"en":"Have you ever come across an advertisement that actually encourages customers not to buy a product?","ko":"<구매를 자제할 때 최고의 판매가 됩니다> 여러분은 실제로 고객에게 제품을 사지 말라고 권장하는 광고를 본 적이 있나요?","grammar":[{"label":"an advertisement that actually encourages customers not to buy a product","explanation":"an advertisement that actually encourages customers not to buy a product — 주격 관계대명사 that"}]},{"n":2,"en":"It does not seem to make sense, but there are instances where companies have successfully used this somewhat odd approach.","ko":"이는 말이 안 되는 것처럼 보이지만, 회사들이 이러한 다소 특이한 접근법을 성공적으로 활용한 사례가 있습니다.","grammar":[{"label":"where companies have","explanation":"where companies have — 관계부사"}]},{"n":3,"en":"For example, there was a fast-food company that was concerned about public criticism on negative health effects due to the high fat content of fast food.","ko":"예시로, 고지방의 패스트푸드 때문에 건강에 부정적인 영향에 관한 대중의 비난을 염려한 패스트푸드 회사가 있었습니다.","grammar":[{"label":"there was a fast-food company that was concerned","explanation":"there was a fast-food company that was concerned — 유도부사 there 구문 · 주격 관계대명사 that"}]},{"n":4,"en":"Instead of trying to dispute the public criticism and claim their food was healthy, the company tried something different.","ko":"대중의 비난을 반박하고 자사의 음식이 건강에 좋다고 주장하려고 하는 대신에, 회사는 다른 방식을 시도했습니다.","grammar":[]},{"n":5,"en":"They discouraged customers from eating fast food, like hamburgers, too often.","ko":"그들은 고객들에게 햄버거와 같은 패스트푸드를 너무 자주 먹지 말라고 말렸습니다.","grammar":[]},{"n":6,"en":"Unexpectedly, this approach had an interesting effect.","ko":"예기치 못하게도, 이러한 접근법은 흥미로운 효과를 발휘했습니다.","grammar":[]},{"n":7,"en":"The company gained a positive image as being socially responsible, attracting more customers.","ko":"그 회사는 사회적으로 책임감 있다는 긍정적인 인상을 얻어 더 많은 고객을 끌어들였습니다.","grammar":[]},{"n":8,"en":"This approach was also successful in the world of fashion.","ko":"이러한 접근 방식은 패션계에서도 성공적이었습니다.","grammar":[]},{"n":9,"en":"There was a rising concern about buying clothes and throwing them away quickly.","ko":"의류를 빠르게 사고 버리는 것에 대한 커져가는 우려가 있었습니다.","grammar":[]},{"n":10,"en":"This type of fast fashion trend has a destructive impact on the environment because excessive production of clothes produces a massive amount of waste.","ko":"이러한 패스트 패션 경향은 과도한 의류 생산이 대량의 쓰레기를 생성하여 환경에 파괴적인 영향을 미칩니다.","grammar":[]},{"n":11,"en":"Surprisingly, one fashion company started to persuade people not to buy their clothes.","ko":"놀랍게도, 어떤 패션 회사는 사람들에게 자사의 옷을 사지 말라고 설득하기 시작했습니다.","grammar":[]},{"n":12,"en":"They argued that people should consume less and far more slowly.","ko":"그들은 사람들이 더 적고, 훨씬 더 천천히 소비해야 한다고 주장했습니다.","grammar":[]},{"n":13,"en":"This unconventional marketing strategy not only raised awareness about the harmful effects of fast fashion on the environment, but also increased the company's sales.","ko":"이러한 독특한 마케팅 전략은 패스트 패션이 환경에 끼치는 폐해에 대한 인식을 높였을 뿐만 아니라 회사의 판매량도 증가시켰습니다.","grammar":[]},{"n":14,"en":"People thought that this brand really cared about the environment, and they started to buy more of this company's products.","ko":"사람들은 이 브랜드가 실제로 환경에 관심을 가지고 있는 것으로 생각했고, 이 회사의 제품을 더 많이 구매하기 시작했습니다.","grammar":[]},{"n":15,"en":"To sum up, both of these companies positioned themselves as responsible brands by discouraging consumption, which ultimately captured the attention and appreciation of a growing audience.","ko":"요약하자면, 이 두 회사는 소비를 막음으로써 책임 있는 브랜드로 자리 잡았으며, 결국 증가하는 고객의 관심과 인정을 받았습니다.","grammar":[]}],"structure":[],"flow":[{"label":"뜻밖의 광고","sentences":"S1 · S2","text":"사지 말라는 말이 성공한 사례가 있다고 소개한다.","refs":[1,2]},{"label":"음식 사례","sentences":"S3 · S4 · S5 · S6 · S7","text":"자주 먹지 말라고 권한 회사가 책임 있는 이미지를 얻었다.","refs":[3,4,5,6,7]},{"label":"옷 사례","sentences":"S8 · S9 · S10 · S11 · S12 · S13 · S14","text":"과도한 구매·폐기를 경계하자 인식과 반응이 좋아졌다.","refs":[8,9,10,11,12,13,14]},{"label":"공통점","sentences":"S15","text":"두 회사의 선택을 묶어 마무리한다.","refs":[15]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["두 회사는 ‘사지 말라’는 뜻밖의 메시지로 책임 있는 이미지를 얻고 고객의 반응을 이끌었다.","사지 말라는 말이 성공한 사례가 있다고 소개한다.","두 회사의 선택을 묶어 마무리한다."],"answer":0,"why":"두 회사는 ‘사지 말라’는 뜻밖의 메시지로 책임 있는 이미지를 얻고 고객의 반응을 이끌었다.","refs":[1,15]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["사지 말라는 말이 성공한 사례가 있다고 소개한다.","앞의 사건과 관계없는 새 주제","두 회사의 선택을 묶어 마무리한다."],"answer":2,"why":"두 회사의 선택을 묶어 마무리한다.","refs":[15]},{"type":"문법","q":"S1의 'an advertisement that actually encourages customers not to buy a product' 설명으로 알맞은 것은?","choices":["an advertisement that actually encourages customers not to buy a product — 주격 관계대명사 that","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"an advertisement that actually encourages customers not to buy a product — 주격 관계대명사 that","refs":[1]}],"key_sentence_en":"To sum up, both of these companies positioned themselves as responsible brands by discouraging consumption, which ultimately captured the attention and appreciation of a growing audience.","key_sentence_ko":"요약하자면, 이 두 회사는 소비를 막음으로써 책임 있는 브랜드로 자리 잡았으며, 결국 증가하는 고객의 관심과 인정을 받았습니다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 경남예고2 교과서 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button>${s.grammar?.length?` <button class="reveal grammar-open" data-toggle="grammar">문법 포인트</button>`:''}<p class="translation">${esc(s.ko)}</p>${s.grammar?.length?`<div class="grammar-panel">${s.grammar.map(g=>`<div class="grammar-item"><b>${esc(g.label)}</b><p>${esc(g.explanation)}</p>${g.transform_value?`<small>시험에서는 이렇게 바꿀 수 있어요.</small><p class="grammar-transform">${esc(g.transform_value)}</p>`:''}</div>`).join('')}</div>`:''}</div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section ${prediction?'has-prediction':''}" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.parentElement.querySelector('.translation');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='grammar'){const target=btn.parentElement.querySelector('.grammar-panel');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'문법 닫기':'문법 포인트'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

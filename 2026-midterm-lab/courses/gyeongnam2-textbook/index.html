<script id="course-data" type="application/json">{"course":{"id":"gyeongnam2-textbook","title":"경남예고2 영어Ⅰ 교과서","grade":"고2"},"units":[{"id":"l1","label":"1과 · For a Satisfying Life","scope":"본문 7구간","passages":[{"id":"l1-01","title":"강연을 여는 말","core":"잡지 편집자가 여러 경험의 가치를 말하기 위해 친구들의 이야기를 소개한다."},{"id":"l1-02","title":"수영을 배우다","core":"수영을 시작한 사람은 힘든 연습 속에서도 즐거움과 실력 향상을 경험했다."},{"id":"l1-03","title":"연극 무대에 서다","core":"수줍은 학생이 연극에 도전해 연습과 친구들의 도움으로 무대에서 대사를 해냈다."},{"id":"l1-04","title":"조경 건축가를 꿈꾸다","core":"조경 대회 포스터를 보고 조경 건축가에 관심을 갖게 되어 필요한 과목을 더 공부하기로 했다."},{"id":"l1-05","title":"글쓰기에 빠지다","core":"입원 중 우연히 시작한 글쓰기가 점차 열정과 성취감으로 이어졌다."},{"id":"l1-06","title":"네 친구의 현재는?","core":"수영·연극·조경·글쓰기 경험담 뒤에 화자가 던지는 질문을 읽어 보자."},{"id":"l1-07","title":"경험이 남기는 것","core":"학창 시절의 다양한 시도는 낭비가 아니라 자신을 발견하고 성장하는 기회다."}]},{"id":"l1-rm","label":"1과 · Read More","scope":"p26 추가 읽기","passages":[{"id":"l1-rm-01","title":"스티브 잡스와 캘리그래피 수업","core":"스티브 잡스가 호기심으로 들은 캘리그래피 수업은 나중에 컴퓨터의 아름다운 글자체 설계에 쓰였다."}]},{"id":"l2","label":"2과 · Creativity Is Key","scope":"본문 7구간","passages":[{"id":"l2-01","title":"고정된 일상에서 벗어나기","core":"익숙한 방식에서 잠시 벗어나 다른 관점으로 보면 창의적인 해결책을 찾을 수 있다."},{"id":"l2-02","title":"설계가 막힌 건축가","core":"숙련된 건축가 Gropius도 새 건물의 통행로를 어떻게 설계할지 결정하지 못했다."},{"id":"l2-03","title":"자유로운 포도 따기","core":"포도원 주인이 손님에게 직접 포도를 따게 한 방식은 수확 문제를 풀면서 손님에게 경험도 주었다."},{"id":"l2-04","title":"잔디 위에 생긴 오솔길","core":"Gropius는 통행로를 미리 정하는 대신 방문객이 잔디에 낸 자국을 따라 길을 만들었다."},{"id":"l2-05","title":"15초가 길게 느껴지는 이유","core":"엘리베이터의 실제 속도보다 할 일이 없고 갇힌 듯한 느낌이 승객의 불만을 키웠다."},{"id":"l2-06","title":"거울이라는 해결책","core":"직원은 속도를 바꾸지 못해도 승객의 지루함과 답답함을 거울로 줄일 수 있다고 보았다."},{"id":"l2-07","title":"시간 인식의 변화","core":"거울은 속도를 바꾸지 않았지만 승객이 느끼는 시간을 바꾸어 불만을 줄였다."}]},{"id":"l2-rm","label":"2과 · Read More","scope":"추가 읽기","passages":[{"id":"l2-rm-01","title":"사지 말라는 광고","core":"두 회사는 ‘사지 말라’는 뜻밖의 메시지로 책임 있는 이미지를 얻고 고객의 반응을 이끌었다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

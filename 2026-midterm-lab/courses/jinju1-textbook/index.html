</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">JINJU GIRLS HIGH SCHOOL · GRADE 1</p><h1>공통영어2 교과서</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 1과 17–20쪽 · 3과 65–68쪽<br>영어·해석은 Word 원본, 문장 설명과 문법 후보는 교사용 설명자료를 기준으로 했습니다.</div><div class="units" id="units"></div><p class="subnote">단원을 고른 뒤 쪽별로 읽고, 근거 문장과 확인 문제를 살펴보세요.</p></main>
<script id="course-data" type="application/json">{"course":{"id":"jinju1-textbook","title":"진주여고1 공통영어2 교과서","grade":"고1"},"units":[{"id":"l1","label":"1과 · Bonding with Others","scope":"17–20쪽 본문","passages":[{"id":"l1-17","title":"17쪽 · 숲에서 길을 잃다","core":"산불로 표지판이 훼손되어, 익숙한 숲을 걷던 Compean이 길을 잃는다."},{"id":"l1-18","title":"18쪽 · 사진은 보냈지만 위치는 모른다","core":"Compean은 마지막 배터리로 사진을 보냈지만, 흐린 화질과 꺼진 위치 설정 탓에 경찰은 위치를 찾지 못한다."},{"id":"l1-19","title":"19쪽 · 사진 속 단서를 읽다","core":"Ben Kuo는 검은 재에서 산불을, 푸른 식생에서 산의 남쪽을 추론한다."},{"id":"l1-20","title":"20쪽 · 사진과 위성 영상을 맞춰 보다","core":"Kuo가 사진과 위성 이미지를 맞춰 위치를 알려 주자 경찰이 Compean을 구조한다."}]},{"id":"l3","label":"3과 · Knowing Ourselves, Knowing Others","scope":"65–68쪽 본문","passages":[{"id":"l3-65","title":"65쪽 · 책에서 다시 만난 호랑이","core":"Tae Keller의 소설은 할머니가 들려준 한국 설화에서 영감을 받아 호랑이에 대한 관심을 되살린다."},{"id":"l3-66","title":"66쪽 · 한국 문화 속 호랑이","core":"호랑이는 오래전부터 한국의 바위 그림과 여러 문화에 등장했고, 동물 설화에서도 중요한 존재다."},{"id":"l3-67","title":"67쪽 · 호랑이를 두려워하면서 존경하다","core":"사람들은 호랑이를 존경하면서도 두려워했고, 약해진 국가 상징은 두 올림픽 마스코트로 다시 살아났다."},{"id":"l3-68","title":"68쪽 · 지금도 살아 있는 호랑이의 의미","core":"야생 호랑이는 드물어졌지만, 노래와 이야기 속 호랑이는 여전히 한국 문화의 상징으로 남아 있다."}]}]}</script><script>

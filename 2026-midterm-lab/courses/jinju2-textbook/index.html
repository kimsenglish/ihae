<script id="course-data" type="application/json">{"course":{"id":"jinju2-textbook","title":"진주여고2 영어II 교과서","grade":"고2"},"units":[{"id":"l1-body","label":"1과 · Connecting Through Pop Culture","scope":"본문 17–23쪽 · 7부분","passages":[{"id":"l1-hiphop-01","title":"17쪽 · 폭력에서 평화 협정으로","core":"경제 불황과 갱단 폭력이 심한 브롱스에서 Ghetto Brothers의 평화 협정이 새로운 평화 문화의 출발점이 된다."},{"id":"l1-hiphop-02","title":"18쪽 · 블록 파티와 DJ의 기술","core":"평화 협정 뒤 블록 파티가 열렸고, Kool Herc가 두 턴테이블로 브레이크 구간을 늘려 힙합 음악과 춤에 영향을 주었다."},{"id":"l1-hiphop-03","title":"19쪽 · 춤과 MC의 역할","core":"브레이크 구간은 B-Boys·B-Girls의 춤으로, DJ의 리듬감 있는 외침은 별도 역할인 MCing으로 발전했다."},{"id":"l1-hiphop-04","title":"20쪽 · hip-hop이라는 말","core":"hip-hop이라는 말의 정확한 기원은 알 수 없지만 파티의 구호에서 나왔다고 전해지며, 그 표현과 음악이 퍼졌다."},{"id":"l1-hiphop-05","title":"21쪽 · 파티 가사에서 사회 비판으로","core":"〈The Message〉를 계기로 힙합 가사는 즐거운 파티의 표현을 넘어 게토의 현실과 불의·인종 차별에 맞서는 사회적 메시지를 담는다."},{"id":"l1-hiphop-06","title":"22쪽 · 존경과 자기 가치","core":"힙합의 존경은 어려움을 딛고 문화를 만든 선구자에게 향하면서, 자신과 타인의 가치를 인정하는 메시지로 확장된다."},{"id":"l1-hiphop-07","title":"23쪽 · 세계적 문화가 된 힙합","core":"평화 문화에서 출발한 힙합은 세계적 인정을 받으며 자기표현·불의에 대한 저항·사람 간 연결의 수단이 되었다."}]},{"id":"l1-culture","label":"1과 · Culture Zoom-in","scope":"추가 범위: The Spanish Flu Didn’t Start in Spain","passages":[{"id":"l1-culture","title":"Culture Zoom-in · 스페인 독감의 이름","core":"‘스페인 독감’이라는 이름은 발원지가 확인되어 붙은 이름이 아니다. 스페인의 공개 보도로 생긴 오해이며 실제 발원지는 아직 모른다."}]},{"id":"l3-body","label":"3과 · Living With Viruses","scope":"본문 73–79쪽 · 7부분","passages":[{"id":"l3-viruses-73","title":"73쪽 · 바이러스가 해롭기만 할까?","core":"글은 대유행의 막대한 피해를 먼저 보여 주며 ‘바이러스는 오직 해롭다’는 인상에서 출발한다."},{"id":"l3-viruses-74","title":"74쪽 · 야생동물과의 접촉이 늘어난 이유","core":"자연 장벽 파괴와 서식지 변화로 사람·야생동물의 접촉이 늘어 새 바이러스의 전파 기회가 커졌다. 하지만 바이러스가 꼭 해롭기만 한 것은 아니다."},{"id":"l3-viruses-75","title":"75쪽 · 박테리아 수를 조절하는 바이러스","core":"일부 바이러스는 박테리아 안에서 증식하고 다른 박테리아로 퍼져 특정 박테리아의 과도한 증가를 억제한다."},{"id":"l3-viruses-76","title":"76쪽 · 산소와 곤충의 두 갈래","core":"바이러스는 박테리아에서 나온 영양분을 통해 플랑크톤의 산소 생산을 뒷받침하고, 곤충 개체 수도 조절한다."},{"id":"l3-viruses-77","title":"77쪽 · DNA에서 태반까지","core":"바이러스 DNA가 자손에게 전달되면 진화에 영향을 줄 수 있으며, 고대 바이러스가 태반 발달에 중요한 역할을 했다는 보고가 있다."},{"id":"l3-viruses-78","title":"78쪽 · 유전 정보를 운반하는 바이러스","core":"유전자 치료에서는 교정된 유전 정보를 환자 세포에 전달하고, 특별히 변형된 바이러스를 그 운반체 중 하나로 쓸 수 있다."},{"id":"l3-viruses-79","title":"79쪽 · 암 치료의 가능성과 남은 과제","core":"바이러스의 암세포 표적 치료는 가능성을 탐구하는 초기 단계이며, 다양한 바이러스 연구는 유익한 활용과 방어책 개발에 도움을 줄 수 있다."}]}]}</script><script>

</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">JINJU HIGH SCHOOL · GRADE 2</p><h1>진주고2 · 수특 Light 영독연습</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">확정 범위: 5강 2번부터 / 7·8·10강 · 19지문<br>원문·해석·한눈 지도와 클릭 문제를 제공합니다.</div><div class="units" id="units"></div><p class="subnote">모든 지문에 영어 원문·해석·원문 근거 도식과 클릭형 확인 문제가 연결되어 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":"진주고2","units":[{"id":"light05","label":"5강 2번부터","scope":"","passages":[{"id":"light05-01","title":"no.01","core":"부부 상담의 마음 챙김은 자기 인식을 넘어 배우자에 대한 인식까지 넓히는 훈련이다."},{"id":"light05-02","title":"no.02","core":"가축화는 인간과 동물의 관계를 포식자와 먹이를 넘어 서로를 바꾸는 상호 의존으로 옮겨 놓았다."},{"id":"light05-03","title":"no.03","core":"공룡은 엉덩이에 놓인 질량 중심 덕분에 힘들이지 않고 서고 빠르게 달릴 수 있었다."},{"id":"light05-04","title":"no.04","core":"건축학 졸업생과 등록 건축가 사이에 큰 격차가 있지만 떠난 이들의 진로는 잡히지 않는다."}]},{"id":"light07","label":"7강","scope":"","passages":[{"id":"light07-01","title":"no.01","core":"낯선 사람과도 협력하는 인간의 다층 사회는 언어의 도움 없이는 아마 불가능하다."},{"id":"light07-02","title":"no.02","core":"동물은 위협을 끊임없이 살피고 신호로 알리며, 안전감은 종의 지속적 생존에 필수적이다."},{"id":"light07-03","title":"no.03","core":"성장 사고방식은 회복력과 호기심을 길러 재능만으로는 얻기 힘든 성취와 오래가는 동기를 만든다."},{"id":"light07-04","title":"no.04","core":"아이는 전통 농가에서는 분명한 쓸모를 지니지만 현대 문명에서는 그 쓸모를 말하기 어렵다."},{"id":"light07-05","title":"no.05","core":"두 소비자 모두 물건이 비인격적 상품이 아니길 바라지만 인격을 얻는 방식이 서로 다르다."}]},{"id":"light08","label":"8강","scope":"","passages":[{"id":"light08-01","title":"08강 43번 · P.50","core":"피타고라스는 현의 길이와 음의 관계에서 본 수학적 질서를 우주 전체로 확장했다."},{"id":"light08-02","title":"08강 44번 · P.51","core":"교육과 경제에 따른 공동체의 분리가 여러 격차를 키우며 사회의 기본 구조를 바꾸고 있다."},{"id":"light08-03","title":"08강 45번 · P.52","core":"새의 도구 사용은 드물지만 정교한 둥지 짓기는 사고력과 인지적 행동을 보여 준다."},{"id":"light08-04","title":"08강 46번 · P.53","core":"몰입은 그 경험 자체가 보상이지만 어떤 활동에서는 집중하려는 노력이 먼저 필요하다."},{"id":"light08-05","title":"08강 47~48번 · P.54","core":"청소년을 꽃보다 잡초에 빗대어, 제거 충동 대신 섬세한 돌봄이 필요한 시기임을 설명한다."}]},{"id":"light10","label":"10강","scope":"","passages":[{"id":"light10-01","title":"10강 56번 · P.62","core":"상은 내재적 동기를 강화할 수 있지만 성과급은 기준 충족과 수치 조작에 관심을 돌릴 수 있다."},{"id":"light10-02","title":"10강 57번 · P.63","core":"감정은 얼굴·목소리·몸의 여러 경로로 중복 전달되므로 얼굴의 역할을 무시할 수 없다."},{"id":"light10-03","title":"10강 58번 · P.64","core":"과거 심리학 이론들은 세부 설명은 달라도 내적 충동이나 외부 요인이 인간 행동을 결정한다고 보았다."},{"id":"light10-04","title":"10강 59번 · P.65","core":"십 대는 자유를 다루는 법을 배우며 뇌의 변화와 정신의 형성이 활발하게 이루어지는 시기이다."},{"id":"light10-05","title":"10강 60~62번 · P.66","core":"부정적인 게시 습관을 바꾼 부모는 자신의 태도가 실제 아이들에게도 영향을 주고 있었음을 깨닫는다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('units').innerHTML=data.units.map((u,i)=>`<details class="unit" ${i===0?'open':''}><summary><div><h2>${esc(u.label)}</h2><span class="scope">${esc(u.scope)}</span></div><span class="count">${u.passages.length}지문</span></summary><div class="passages">${u.passages.map((p,j)=>`${u.passages.length>6&&j%5===0?`<h3 class="chunk-label">${j+1}–${Math.min(j+5,u.passages.length)}번</h3>`:''}<a class="passage" href="study.html#${esc(p.id)}"><b>${esc(p.title)}</b><span>원문과 한눈 지도 보기 →</span></a>`).join('')}</div></details>`).join('');
</script></body></html>

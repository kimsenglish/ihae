anipulations","meaning":"조작들"}],"checks":[{"type":"핵심","q":"두 주장 중 글의 핵심과 일치하는 것은?","choices":["상과 성과급은 모두 내재적 동기만 키우며 지표나 돈에 관심을 돌리지 않는다.","상은 내재적 동기를 강화할 수 있지만 성과급은 기준 충족과 수치 조작에 관심을 돌릴 수 있다."],"answer":1,"why":"상은 내재적 동기를 강화할 수 있지만 성과급은 기준 충족과 수치 조작에 관심을 돌릴 수 있다. 원문 근거를 아래 S번호에서 다시 확인하세요.","refs":[1,2,3,8,9,10]},{"type":"근거 확인","q":"성과급이 관심을 돌릴 수 있는 대상은?","choices":["오직 일의 내재적 가치뿐이다.","기준·수치·돈이다."],"answer":1,"why":"돈과 기준에 몰두하고 지표를 조작할 수도 있음","refs":[3,4,5,8,9]},{"type":"원문 변형 탐지","q":"이 지문에 실제로 나오는 영어 문장은?","choices":["Awards cannot strengthen people's commitment to the organization giving the award.","Awards can strengthen people's commitment to the organization giving the award."],"answer":1,"why":"단어와 논리의 방향을 영어 원문과 직접 대조하세요.","refs":[1]}]},{"id":"light10-02","unit":"light10","number":2,"title":"10강 57번 · P.63","sentences":[{"n":1,"en":"Faces cannot be discounted as carriers of emotion.","ko":"얼굴은 감정의 전달자로서 무시될 수 없다.","role":"얼굴의 중요성 감정 전달에서 얼굴이 하는 역할을 무시해서는 안 된다."},{"n":2,"en":"Tennis matches require forceful actions of the body and are played to a crowd, so the dominance of the body over the face is natural.","ko":"테니스 경기는 신체의 강한 동작을 요구하고 관중을 대상으로 진행되므로, 얼굴보다 신체가 우세한 것은 당연하다.","role":"경기의 특수성 테니스에서는 경기 특성상 얼굴보다 몸의 감정 표현이 두드러진다."},{"n":3,"en":"Tennis matches are only one of a vast range of situations that cause emotion.","ko":"테니스 경기는 감정을 유발하는 광범위한 상황 중 하나에 불과하다.","role":"일반화의 한계 테니스 경기만으로 모든 감정 전달 상황을 설명할 수는 없다."},{"n":4,"en":"Many encounters, both intense and casual, involve people sitting or standing face-to-face, where emotion is carried primarily by the face and voice and less by the rest of the body.","ko":"강렬하든 가볍든 많은 만남은 사람들이 얼굴을 마주보고 앉거나 서 있는 것을 포함하는데, 여기서 감정은 주로 얼굴과 목소리로 전달되고 나머지 신체로는 덜 전달된다.","role":"대면 상황 일상적인 대면 상황에서는 얼굴과 목소리가 감정을 주로 전달한다."},{"n":5,"en":"Human communication is typically redundant, presumably at least in part to reduce error; if you miss part of a message, say, in a noisy restaurant, you might get another part, enough to understand.","ko":"인간의 의사소통은 일반적으로 중복적이며, 추정컨데 적어도 부분적으로는 오류를 줄이기 위하여 그러한데, 만약 이를테면 시끄러운 식당에서 메시지의 일부를 놓치더라도, 여러분은 다른 부분을 얻게 되고 (그것을) 충분히 이해할 수 있을 것이다.","role":"중복의 기능 여러 경로로 메시지를 전하면 일부를 놓쳐도 뜻을 이해할 수 있다."},{"n":6,"en":"In line with this, like many expressions and communications, emotion is expressed in the face, voice, and body and redundantly even within each mode.","ko":"이와 같이, 많은 표정 및 의사소통과 마찬가지로, 감정은 얼굴, 목소리, 몸으로 표현되며 심지어 각각의 방식 내에서는 중복적으로 표현된다.","role":"감정 전달의 중복 감정은 여러 표현 경로로 전달되며 한 경로 안에서도 중복되어 나타난다."},{"n":7,"en":"People who are blind can grasp emotion from voice, both prosody and words; people who are deaf can grasp emotion from face and body.","ko":"시각장애인은 목소리, 즉 운율과 단어로부터 감정을 파악할 수 있고, 청각장애인은 얼굴과 몸으로부터 감정을 파악할 수 있다.","role":"서로 보완하는 경로 시각이나 청각의 제약이 있어도 다른 표현 경로에서 감정을 파악할 수 있다."}],"core":"감정은 얼굴·목소리·몸의 여러 경로로 중복 전달되므로 얼굴의 역할을 무시할 수 없다.","flow":[{"label":"주장","sentences":"S1–3","text":"몸이 두드러지는 테니스 경기만으로 얼굴의 감정 전달 역할을 낮춰 볼 수 없다.","refs":[1,3]},{"label":"다른 상황","sentences":"S4","text":"대면 상황에서는 얼굴과 목소리가 감정을 주로 전달한다.","refs":[4]},{"label":"중복과 보완","sentences":"S5–7","text":"메시지의 중복은 일부를 놓쳐도 뜻을 이해하게 하며 여러 감정 표현 경로가 서로 보완한다.","refs":[5,7]}],"structure":[{"title":"특수 상황","text":"테니스 경기에서는 신체 동작이 두드러짐"},{"title":"일상적 전달","text":"얼굴·목소리·몸이 중복하여 감정을 전달"}],"key_sentence_en":"Emotion is communicated redundantly through the face, voice, and body, so no single situation can determine the importance of each channel.","diagram":{"kind":"web","title":"감정은 여러 경로로 중복 전달","items":[{"head":"한 감정 메시지","body":"감정은 얼굴·목소리·몸으로 겹쳐 전달","refs":[5,6]},{"head":"얼굴·목소리","body":"마주 보는 대화에서는 이 둘이 주된 경로","refs":[4]},{"head":"몸의 움직임","body":"몸짓도 전달하며 다른 경로를 보완","refs":[2,5,6,7]}],"takeaway":"상황에 따라 두드러지는 경로가 다르고, 여러 경로가 겹쳐 전달 오류를 줄인다."},"easy_story":"우리가 느끼는 감정은 얼굴에만 나타나지 않습니다. 목소리와 몸의 움직임도 함께 메시지를 보내요. 여러 경로가 겹친다고 해서 얼굴이 쓸모없어지는 것은 아닙니다. 글은 몸 전체의 표현 속에서 얼굴의 역할도 보라고 합니다.","blocking_vocab":[{"word":"redundantly","meaning":"중복해서"},{"word":"expressions","meaning":"표현들"},{"word":"communications","meaning":"의사소통들"}],"checks":[{"type":"핵심","q":"두 주장 중 글의 핵심과 일치하는 것은?","choices":["감정은 얼굴 한 경로로만 전달되므로 목소리와 몸의 움직임은 볼 필요가 없다.","감정은 얼굴·목소리·몸의 여러 경로로 중복 전달되므로 얼굴의 역할을 무시할 수 없다."],"answer":1,"why":"감정은 얼굴·목소리·몸의 여러 경로로 중복 전달되므로 얼굴의 역할을 무시할 수 없다. 원문 근거를 아래 S번호에서 다시 확인하세요.","refs":[1,3,4,5,7]},{"type":"근거 확인","q":"얼굴과 함께 감정을 전할 수 있는 경로는?","choices":["얼굴 외에는 아무 경로도 없다.","목소리와 몸의 움직임이다."],"answer":1,"why":"마주 보는 대화에서는 이 둘이 주된 경로 몸짓도 전달하며 다른 경로를 보완","refs":[2,4,5,6,7]},{"type":"원문 변형 탐지","q":"이 지문에 실제로 나오는 영어 문장은?","choices":["Tennis matches require forceful actions of the body and are played to a crowd, so the dominance of the body over the face is natural.","Tennis matches require forceful actions of the body and are played to a crowd, so the dominance of the body over the face is not natural."],"answer":0,"why":"단어와 논리의 방향을 영어 원문과 직접 대조하세요.","refs":[2]}]}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function storyPreview(t){return String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean)[0]||''}function render(){const id=location.hash.slice(1);if(['light10-03','light10-04','light10-05'].includes(id)){location.replace('index.html');return;}const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 진주고2 부교재 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+(p.scope?' · '+p.scope:'');document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button><p class="translation">${esc(s.ko)}</p></div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1" data-passage-id="${esc(p.id)}"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`${p.easy_story?`<p class="context-hint"><b>읽기 단서</b> ${esc(storyPreview(p.easy_story))}</p>`:''}<div class="read-handoff"><button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div><div class="source-visual"><p class="source-visual-label">원문으로 확인한 한눈 지도</p>${renderDiagram(p.learning_map||p.diagram)}</div><details class="easy-story story-after-reading"><summary>막혔다면 · 이야기처럼 다시 읽기</summary>${storySteps(p.easy_story)}</details>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

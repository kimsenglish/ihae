.easy-story{margin-top:22px;max-width:760px;border-top:2px solid #b8d4c3;padding:17px 2px 0}
.easy-story h3{margin:0 0 10px;color:#14543f;font-size:16px}.story-steps{list-style:none;counter-reset:story;margin:0;padding:0;display:grid;gap:8px}.story-steps li{counter-increment:story;display:grid;grid-template-columns:27px 1fr;gap:9px;align-items:start;font-size:16px;line-height:1.7}.story-steps li::before{content:counter(story);display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#daf0e2;color:#14543f;font-size:12px;font-weight:900;margin-top:2px}

.diagram{overflow:hidden}
.diagram-items{counter-reset:visual-step}
.diagram-card{box-shadow:0 2px 0 rgba(13,76,57,.04)}
.diagram-card b{line-height:1.35}

/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;
  border-left:3px solid #68aa91;margin-left:14px;padding-left:25px}
.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card{position:relative;counter-increment:visual-step}
.diagram.diagram-steps .diagram-card:before,.diagram.diagram-timeline .diagram-card:before,
.diagram.diagram-cycle .diagram-card:before{content:counter(visual-step);position:absolute;left:-47px;top:10px;
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:#176b52;color:#fff;font-size:12px;font-weight:800;border:3px solid #f0f6ef}
.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after{

.diagram.diagram-cycle .diagram-items:after{content:'↶ 반복되는 해석';font-size:12px;color:#176b52;
  font-weight:750;margin:-13px 0 0 4px}
/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.diagram.diagram-condition .diagram-card:first-child,.diagram.diagram-branches .diagram-card:first-child{
  grid-column:1/-1;background:#dceee5;border-color:#82baa2;position:relative}
.diagram.diagram-condition .diagram-card:first-child:after,.diagram.diagram-branches .diagram-card:first-child:after{
  content:'↙                 ↘';position:absolute;bottom:-25px;left:0;right:0;text-align:center;
  color:#176b52;font-size:18px;font-weight:900;white-space:pre}

  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

  background:#dceee5;border-color:#498f6e;border-radius:100px;position:relative}
.diagram.diagram-web .diagram-card:first-child:after{content:'↙                         ↘';
  position:absolute;left:0;right:0;bottom:-28px;color:#176b52;font-weight:900;white-space:pre}
.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));

.diagram.diagram-dose .diagram-items:before{content:'';position:absolute;top:10px;left:10%;right:10%;height:5px;
  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}
.diagram.diagram-dose .diagram-card:before{content:'';position:absolute;top:-23px;left:calc(50% - 7px);

<script id="course-data" type="application/json">{"course": "경해여고1 부교재", "units": [{"id": "olym12", "label": "올림포스 영독 기본1 · 12강", "scope": "서술형·논술형", "passages": [{"id": "olym12-01", "unit": "olym12", "number": 1, "title": "p85 · 서술형 Practice", "core": "음악 훈련은 음악을 감정으로 받던 뇌를 구조를 따지는 쪽으로 바꾸어 놓는다.", "flow": [{"label": "전제·이전", "sentences": "S1~3", "text": "음악 학습은 뇌를 바꾼다. 훈련 전에는 감정을 다루는 우반구가 주로 음악을 처리한다.", "refs": [1, 2, 3]}, {"label": "변화", "sentences": "S4~5", "text": "훈련은 처리를 좌반구로 옮긴다. 글은 그 까닭을 묻는다.", "refs": [4, 5]}, {"label": "설명·관찰", "sentences": "S6~7", "text": "음악의 복잡한 구조를 언어처럼 듣고, 언어 이해 부위가 활성화된다.", "refs": [6, 7]}], "structure": [{"title": "훈련 없는 청취자 — 우반구", "text": "감정을 다루는 쪽으로 음악을 받아들인다"}, {"title": "훈련된 음악가 — 좌반구", "text": "음악을 언어처럼 들으며 구조적 복잡성을 분간한다"}], "key_sentence_en": "Musical training changes how the brain processes music.", "blocking_vocab": [{"word": "hemisphere", "meaning": "대뇌 반구"}, {"word": "lateralised", "meaning": "한쪽 반구가 우세한"}, {"word": "discern", "meaning": "분간하다"}], "diagram": {"kind": "compare", "title": "음악을 처리하는 방식의 변화", "items": [{"head": "특별한 훈련 없음", "body": "감정을 다루는 우반구를 주로 사용", "refs": [2, 3]}, {"head": "음악 훈련을 받음", "body": "좌반구로 처리가 이동하며 언어처럼 구조를 분간", "refs": [4, 6, 7]}]}, "checks": [{"type": "핵심", "q": "음악 훈련 뒤 음악을 처리하는 방식은?", "choices": ["우반구의 감정 처리만 더 강해진다.", "좌반구·언어 관련 처리로 이동한다."], "answer": 1, "why": "S4는 좌반구로의 이동, S6~7은 언어처럼 듣는 설명과 관찰이다.", "refs": [4, 6, 7]}, {"type": "대조 근거", "q": "훈련이 없는 청취자는 주로 어느 쪽으로 음악을 처리하는가?", "choices": ["좌반구", "우반구"], "answer": 1, "why": "S2~3의 right hemisphere와 right-lateralised.", "refs": [2, 3]}, {"type": "변형 탐지", "q": "S7과 일치하는 문장은?", "choices": ["Music activates only the visual cortex of trained musicians.", "Music activates a brain region associated with language comprehension in trained musicians."], "answer": 1, "why": "S7의 language comprehension을 확인한다.", "refs": [7]}], "easy_story": "악기를 배우기 전에는 음악을 듣고 주로 느낌을 받습니다. 오래 훈련하면 음악 안의 구조를 더 잘 알아차리게 되고, 뇌에서 음악을 처리하는 방식도 달라집니다. 글은 훈련된 음악가가 음악을 언어처럼 분석해 듣는 모습을 설명합니다.", "sentences": [{"n": 1, "en": "There is no question that learning to sing or play a musical instrument changes the structure of your brain.", "ko": "노래나 악기 연주를 배우는 것이 뇌의 구조를 바꾼다는 것은 의심의 여지가 없다."}, {"n": 2, "en": "If you enjoy music but have no special training, then your brain processes it mostly through its right hemisphere, the side of the brain that deals with emotion.", "ko": "여러분이 음악을 좋아하지만 특별한 훈련을 받지 않는다면 여러분의 뇌는 주로 감정을 다루는 부분인 우반구를 통해 음악을 처리한다."}, {"n": 3, "en": "In the face of music, you are 'right-lateralised'.", "ko": "음악을 접하여 여러분은 '우측의 지배를 받게' 된다."}, {"n": 4, "en": "Many studies show that musical training shifts the brain's processing of music to its left hemisphere; musicians are left-brained.", "ko": "많은 연구는 음악 훈련이 뇌의 음악 처리를 그것의 좌반구로 옮긴다는 것을 보여 준다. 즉, 음악가들은 좌뇌형이다."}, {"n": 5, "en": "There are several guesses about why this happens.", "ko": "왜 이것이 일어나는지에 관한 여러 추측이 있다."}, {"n": 6, "en": "One explanation is that they have learned to hear music more like language, discerning a level of structural complexity beyond the grasp of ordinary listeners.", "ko": "한 가지 설명은 그들이 평범한 청취자의 이해를 넘어선 구조적 복잡성 수준을 분명히 이해하면서 음악을 오히려 언어에 가깝게 듣는 법을 학습하였다는 것이다."}, {"n": 7, "en": "When trained musicians hear music, it activates the part of the brain associated with language comprehension.", "ko": "훈련된 음악가들이 음악을 들을 때, 그것은 언어 이해와 관련된 뇌 부위를 활성화한다."}]}, {"id": "olym12-02", "unit": "olym12", "number": 2, "title": "p86 · 논술형 Practice", "core": "잔 표면의 질감이 같은 커피의 단맛과 쓴맛을 다르게 느끼게 만든다.", "flow": [{"label": "실험 조건", "sentences": "S1~2", "text": "같은 모양의 머그 두 개에 둥근 돌기 또는 각진 돌기를 입혔다.", "refs": [1, 2]}, {"label": "평가", "sentences": "S3", "text": "쇼핑객이 맛의 단맛·쓴맛·강도·호감도를 평가했다.", "refs": [3]}, {"label": "결과·조언", "sentences": "S4~5", "text": "둥근 표면은 평균 약 18% 더 달게, 각진 표면은 최대 27% 더 쓰게 느껴졌다. 설탕을 줄이려면 둥글고 부드러운 컵을 권한다.", "refs": [4, 5]}], "structure": [{"title": "둥글고 오돌토돌한 잔", "text": "둥근 곡면 — 단맛 쪽으로 · 평균 18퍼센트 더 달다"}, {"title": "네모지고 각진 잔", "text": "각진 모서리 — 쓴맛 쪽으로 · 최대 27퍼센트 더 쓰고 강하다"}], "key_sentence_en": "The texture of a mug can change perceived sweetness and bitterness.", "image": "../../assets/gyeonghae1-olym12-02-mug-texture.webp", "image_alt": "형태와 커피가 같은 두 머그잔의 표면: 하나는 둥근 돌기, 다른 하나는 각진 돌기", "image_caption": "S1~4: 컵 자체의 형태와 음료는 같고 표면의 질감만 다릅니다. 둥근 돌기는 더 달게, 각진 돌기는 더 쓰고 강하게 느껴졌습니다.", "blocking_vocab": [{"word": "bobbly", "meaning": "오돌토돌한"}, {"word": "angular", "meaning": "각진"}, {"word": "intensity", "meaning": "강도"}], "checks": [{"type": "핵심", "q": "실험에서 서로 다르게 만든 것은?", "choices": ["같은 모양 컵의 표면 질감", "컵 전체의 모양"], "answer": 0, "why": "S1의 identically shaped와 different textures를 함께 확인한다.", "refs": [1, 2]}, {"type": "수치 근거", "q": "각진 표면의 컵에서 같은 음료는 어떻게 느껴졌는가?", "choices": ["최대 27% 더 쓰고 강렬하게", "평균 18% 더 달게"], "answer": 0, "why": "S4의 angular-textured mug는 more bitter and much more intense다.", "refs": [4]}, {"type": "변형 탐지", "q": "S4와 일치하는 문장은?", "choices": ["The drinks in the angular mug tasted about 18 percent sweeter.", "The drinks in the round mug tasted about 18 percent sweeter."], "answer": 1, "why": "S4의 round bobbly와 sweeter를 연결한다.", "refs": [4]}], "easy_story": "연구진은 모양은 똑같지만 손에 닿는 표면만 다른 머그잔 두 개를 만들었습니다. 둥글게 울퉁불퉁한 잔에서는 같은 커피가 더 달게, 각진 질감의 잔에서는 더 쓰게 느껴졌어요. 커피 자체가 바뀐 게 아니라 잔의 촉감이 맛의 판단에 영향을 준 것입니다. 마지막에는 둥근 그릇과 매끈한 둥근 질감을 권합니다.", "sentences": [{"n": 1, "en": "A group of researchers at the University of Twente in the Netherlands recently 3D-printed two identically shaped mugs with different textures to test the effects on taste.", "ko": "네덜란드의 Twente 대학교의 한 연구팀은 최근 맛에 미치는 영향을 테스트하기 위해 질감이 다른 동일한 모양의 머그잔 두 개를 3D 프린팅하였다."}, {"n": 2, "en": "One was covered in a rounded bobbly texture, and the other had a blocky, angular texture.", "ko": "하나는 둥글고 오돌토돌한 질감으로 덮여 있었고 다른 하나는 블록처럼 네모지고 각진 질감이었다."}, {"n": 3, "en": "In a supermarket taste test for a fictitious new brand made by the study team, the researchers offered shoppers a sample of coffee from one of the mugs and asked them to evaluate the taste for qualities including sweetness, bitterness, intensity and pleasantness.", "ko": "연구팀이 만든 가상의 새 브랜드에 대한 슈퍼마켓 맛 테스트에서 연구원들은 쇼핑객들에게 그 머그잔 중 하나에 담긴 커피 샘플을 제공하고, 단맛·쓴맛·강도·호감도 등의 특성에 대해 맛을 평가하도록 요청했다."}, {"n": 4, "en": "Drinks in the round bobbly mug tasted on average around 18 percent sweeter, while in the angular-textured mug the same drinks tasted up to 27 percent more bitter and much more intense.", "ko": "둥글고 오돌토돌한 머그잔에 담긴 음료는 평균 약 18% 더 단맛이 난 반면, 각진 질감의 머그잔에 담긴 같은 음료는 최대 27% 더 쓰고 훨씬 더 강렬하게 느껴졌다."}, {"n": 5, "en": "If you're trying to cut down on your sugar, avoid drinking from a mug with a rough or angular texture ─ go for a round bowl and mug, and if possible ones with a smooth rounded texture too.", "ko": "설탕 섭취를 줄이려고 한다면 거칠거나 각진 질감의 머그잔은 피하고, 둥근 그릇과 머그잔을 선택하며, 가능하면 부드럽고 둥근 질감의 그릇과 머그잔을 고르는 것이 좋다."}], "learning_map": {"kind": "compare", "title": "커피는 같고, 잔 표면만 다르다", "items": [{"head": "둥근 돌기", "body": "같은 커피가 평균 약 18% 더 달게 느껴졌다", "refs": [1, 2, 4]}, {"head": "각진 돌기", "body": "같은 커피가 최대 27% 더 쓰고 더 강하게 느껴졌다", "refs": [1, 2, 4]}], "takeaway": "컵의 형태가 아니라 표면 질감을 바꾼 비교다."}}]}, {"id": "olym13", "label": "올림포스 영독 기본1 · 13강", "scope": "무관한 문장 찾기", "passages": [{"id": "olym13-01", "unit": "olym13", "number": 1, "title": "p88 수능 대비 ANALYSIS", "core": "청중은 심사위원이 아니라 명확한 전달을 바라며, 한두 실수는 오히려 매력을 높인다.", "flow": [{"label": "걱정의 원인", "sentences": "S1~2", "text": "연설을 소통보다 공연으로 여기고 청중을 엄격한 심사위원처럼 생각한다.", "refs": [1, 2]}, {"label": "실제 청중", "sentences": "S3~4", "text": "청중은 기교가 아닌 명확한 생각의 전달을 바란다.", "refs": [3, 4]}, {"label": "반전", "sentences": "S5", "text": "한두 실수는 오히려 인간적인 매력을 줄 수도 있다.", "refs": [5]}], "structure": [{"title": "공연으로 보는 연설", "text": "실수 하나하나가 감점이 되는 절대적 완벽함의 잣대"}, {"title": "의사소통으로 보는 연설", "text": "생각을 명확히 전하는 것이 목적이고 실수는 오히려 인간적으로 보이게 한다"}], "key_sentence_en": "People fear mistakes because they view speechmaking as a performance, but speech audiences are not judges looking for a virtuoso performance, and an error or two can even make a speaker seem more human.", "blocking_vocab": [{"word": "virtuoso", "meaning": "고도의 기교를 보이는 사람"}, {"word": "address", "meaning": "연설"}, {"word": "enhance", "meaning": "높이다"}], "diagram": {"kind": "compare", "title": "연설 청중을 어떻게 볼 것인가", "items": [{"head": "발표자가 두려워하는 평가", "body": "모든 말·제스처를 완벽함의 잣대로 심판한다고 여김", "refs": [1, 2]}, {"head": "실제 청중이 원하는 것", "body": "기교가 아니라 생각을 명확하고 직접 전달하는 연설", "refs": [3, 4]}], "takeaway": "한두 실수가 발표자를 더 인간적으로 보이게 할 수도 있음 · S5"}, "checks": [{"type": "핵심", "q": "청중이 연설에서 가장 바라는 것은?", "choices": ["실수 없는 기교 공연", "생각을 명확하고 직접 전달하는 말"], "answer": 1, "why": "S4의 well-thought-out address와 communicates ... clearly and directly.", "refs": [4]}, {"type": "대조 근거", "q": "발표자가 실수를 지나치게 걱정하는 원인은?", "choices": ["청중이 실제로 심사위원이어서", "연설을 공연으로 여겨서"], "answer": 1, "why": "S1의 performance rather than communication; S3은 심사위원과 다르다고 한다.", "refs": [1, 3]}, {"type": "변형 탐지", "q": "S5와 일치하는 문장은?", "choices": ["Any error always destroys a speaker's appeal.", "An error or two can make a speaker seem more human."], "answer": 1, "why": "S5의 can actually enhance를 확인한다.", "refs": [5]}], "easy_story": "발표할 때 작은 실수를 하면 청중이 모두 나를 나쁘게 볼까요? 글은 청중이 완벽한 공연을 심사하러 온 게 아니라 생각을 잘 전달받으러 왔다고 말합니다. 한두 실수는 오히려 발표자가 사람답게 느껴져 매력이 될 수 있어요.", "sentences": [{"n": 1, "en": "One of the biggest reasons people are concerned about making a mistake in a speech is that they view speechmaking as a performance rather than an act of communication.", "ko": "사람들이 연설에서 실수하는 것을 걱정하는 가장 큰 이유 중 하나는 연설을 의사소통 행위가 아닌 공연으로 생각하기 때문이다."}, {"n": 2, "en": "They feel the audience is judging them against a scale of absolute perfection in which every misstated word or awkward gesture will count against them.", "ko": "그들은 (자신이) 잘못 말한 단어 하나, (자신의) 어색한 제스처 하나도 자신에게 불리하게 작용할 절대적인 완벽함이라는 잣대로 청중이 자신을 평가하고 있다고 느낀다."}, {"n": 3, "en": "But speech audiences are not like judges in a violin recital or an ice-skating contest.", "ko": "하지만 연설의 청중은 바이올린 연주회나 아이스 스케이팅 대회의 심사위원과 다르다."}, {"n": 4, "en": "They are not looking for a virtuoso performance, but for a well-thought-out address that communicates the speaker's ideas clearly and directly.", "ko": "그들은 고도의 기교를 보여 주는 공연이 아니라 연설자의 생각을 명확하고 직접적으로 전달하는 신중한 연설을 바라고 있다."}, {"n": 5, "en": "Sometimes an error or two can actually enhance a speaker's appeal by making her or him seem more human.", "ko": "때로는 한두 가지 실수가 사실은 발표자를 더 인간적으로 보이게 함으로써 그 사람의 매력을 높일 수 있다."}]}, {"id": "olym13-02", "unit": "olym13", "number": 2, "title": "p90 no.01", "core": "사람은 물을 정화하고 폐수를 처리하는 생태계를 직접 건설하며 이는 생물 공학의 한 부분이다.", "flow": [{"label": "주장과 예", "sentences": "S1~2", "text": "인간은 목적에 맞는 생태계를 조성하고 연못·식생수로를 만든다.", "refs": [1, 2]}, {"label": "정화 작용", "sentences": "S3~4", "text": "습지 식물·박테리아가 영양분과 독소 제거를 돕는다.", "refs": [3, 4]}, {"label": "확장·명칭", "sentences": "S5~6", "text": "도시 폐수 처리에도 적용되며 생물 공학의 일부다.", "refs": [5, 6]}], "structure": [{"title": "문제 — 오염된 물", "text": "지표 유출수, 광산 폐수, 도시 폐수에 영양분과 독소가 실려 온다"}, {"title": "해결 — 지어 만든 생태계", "text": "연못·식생수로·습지 식물과 박테리아가 그것을 흡수·제거해 물을 정화한다"}], "key_sentence_en": "Humans construct ecosystems such as ponds, bioswales and wetlands that clean water and treat wastewater, and these human-constructed ecosystems are part of biological engineering.", "blocking_vocab": [{"word": "bioswale", "meaning": "식생수로"}, {"word": "runoff", "meaning": "지표 유출수"}, {"word": "toxin", "meaning": "독소"}], "diagram": {"kind": "cases", "title": "사람이 조성한 생태계의 서로 다른 사례", "items": [{"head": "연못·식생수로", "body": "지표 유출수를 모으는 구조", "refs": [2]}, {"head": "연못·수로의 습지 식물", "body": "들어온 물의 영양분을 흡수·제거", "refs": [3]}, {"head": "특별 설계한 습지", "body": "박테리아와 식물이 광산 폐수의 독소 제거를 도움", "refs": [4]}, {"head": "대규모 인공 생태계", "body": "도시 폐수의 일부를 처리", "refs": [5]}], "takeaway": "네 칸은 하나의 물이 차례로 거치는 단계가 아니라 본문이 든 조성 사례들이다 · S2~6"}, "checks": [{"type": "핵심", "q": "본문의 인공 생태계는 무엇을 위해 조성되는가?", "choices": ["모든 미생물 제거", "물의 오염물질 처리"], "answer": 1, "why": "S2~5의 유출수·광산 폐수·도시 폐수 사례다.", "refs": [2, 3, 4, 5]}, {"type": "인과 근거", "q": "부들 같은 습지 식물의 역할은?", "choices": ["물에 새 독소를 더함", "오염된 물속 영양분을 흡수·제거"], "answer": 1, "why": "S3의 use and remove nutrients.", "refs": [3]}, {"type": "변형 탐지", "q": "S4와 일치하는 문장은?", "choices": ["Bacteria and plants can help remove toxins from mine wastewater.", "Only concrete canals can remove toxins from mine wastewater."], "answer": 0, "why": "S4의 bacteria and plants를 확인한다.", "refs": [4]}], "easy_story": "사람이 만든 생태계도 물을 깨끗하게 하는 데 쓰일 수 있습니다. 얕은 연못과 식물이 있는 수로, 광산 폐수를 처리하는 습지, 도시 폐수를 다루는 큰 생태계는 서로 다른 사례예요. 하나가 다음 단계로 이어지는 한 시설이 아니라, 목적에 맞춰 생태계를 설계한 여러 예입니다.", "sentences": [{"n": 1, "en": "Some ecosystems, over a wide range of sites and purposes, are constructed by humans.", "ko": "매우 다양한 장소에서 여러 목적에 따라 일부 생태계가 인간에 의해 조성된다."}, {"n": 2, "en": "For example, we may construct shallow ponds or a series of canals known as bioswales that collect runoff of surface water.", "ko": "예를 들어 우리는 얕은 연못이나, 지표 유출수를 모으는 식생수로라고 알려진 일련의 운하를 건설할 수도 있다."}, {"n": 3, "en": "Marsh plants, such as cattails, when planted in ponds or canals, use and remove nutrients in water that's delivered to them as a waste or pollutant, helping clean the water.", "ko": "부들 같은 습지 식물은 연못이나 운하에 심으면, 폐기물이나 오염 물질로 유입된 물속의 영양분을 흡수하고 제거해 물을 정화하는 데 도움이 된다."}, {"n": 4, "en": "Specially designed wetland ecosystems have been constructed where bacteria and plants process mine wastewater and help remove toxins from water.", "ko": "박테리아와 식물이 광산 폐수를 처리하고 물속 독소를 제거하는 데 도움이 되는 특별 설계 습지 생태계가 조성되어 왔다."}, {"n": 5, "en": "Other large-scale ecosystems are constructed to partially treat urban wastewater.", "ko": "다른 대규모 생태계도 도시 폐수를 부분적으로 처리하기 위해 조성된다."}, {"n": 6, "en": "Human-constructed ecosystems are part of what is known as biological engineering.", "ko": "인간이 조성한 생태계는 생물 공학으로 알려진 분야의 한 부분이다."}]}, {"id": "olym13-03", "unit": "olym13", "number": 3, "title": "p91 no.02", "core": "이동 통신이 널리 퍼져 비음성 메시지가 기준이 되었고 대면 소통의 소멸을 걱정하게 되었다.", "flow": [{"label": "확산", "sentences": "S1~2", "text": "모바일 기기가 늘며 이모티콘과 비음성 소통이 일반화됐다.", "refs": [1, 2]}, {"label": "규모", "sentences": "S3~4", "text": "2013년 가입 규모와 수십억 건 메시지가 확산의 정도를 보여 준다.", "refs": [3, 4]}, {"label": "우려", "sentences": "S5", "text": "연구자는 대면 소통이 사라질 가능성을 걱정한다.", "refs": [5]}], "structure": [{"title": "원인 — 이동 통신의 확산", "text": "기기가 인구수에 맞먹게 퍼지고 비음성 메시지가 기본이 되었다"}, {"title": "결과 — 대면 소통 우려", "text": "이모티콘이 늘고 매체가 넘쳐 얼굴을 맞대는 소통이 사라질 수 있다는 걱정이 생겼다"}], "key_sentence_en": "Mobile communications have spread so widely that non-voice messages have become the norm, and researchers have worried that face-to-face communications could become extinct.", "blocking_vocab": [{"word": "non-voice communications", "meaning": "비음성 통신"}, {"word": "subscription", "meaning": "서비스 가입 건수"}, {"word": "prolific", "meaning": "매우 많은"}], "diagram": {"kind": "steps", "title": "모바일 소통의 확산과 우려", "items": [{"head": "기기 확산", "body": "모바일 기기 사용 증가와 이모티콘 사용 확대", "refs": [1, 2]}, {"head": "비음성 소통이 일반화", "body": "2013년 가입 건수는 세계 인구 추정치와 거의 같음", "refs": [2, 3]}, {"head": "전자 메시지 폭증", "body": "공개·사적 경로로 수십억 건을 주고받음", "refs": [4]}, {"head": "연구자의 우려", "body": "대면 소통의 소멸 가능성을 걱정함", "refs": [5]}]}, "checks": [{"type": "핵심", "q": "모바일 소통의 확산과 함께 제기된 우려는?", "choices": ["대면 소통의 소멸 가능성", "비음성 메시지의 완전한 소멸"], "answer": 0, "why": "S5의 face-to-face communications could become extinct는 우려이지 확정된 사실이 아니다.", "refs": [5]}, {"type": "수치 근거", "q": "2013년 모바일 가입 건수는 무엇과 거의 같았는가?", "choices": ["세계 인구 추정치", "전 세계 컴퓨터 보유 가구 수"], "answer": 0, "why": "S3의 number of mobile subscriptions와 global population.", "refs": [3]}, {"type": "변형 탐지", "q": "S2와 일치하는 문장은?", "choices": ["Non-voice communications became the norm.", "Non-voice communications became the exception."], "answer": 0, "why": "S2의 norm rather than the exception.", "refs": [2]}], "easy_story": "휴대전화가 널리 퍼지면서 말로 통화하는 것만이 소통은 아니게 되었습니다. 문자와 이모티콘 같은 비음성 메시지가 흔해졌죠. 글은 이 변화의 규모를 보여 준 뒤, 화면을 통한 소통이 너무 많아져 얼굴을 마주 보는 대화가 줄지 않을까 걱정합니다.", "sentences": [{"n": 1, "en": "Mobile communications have changed the way we interact with our computers and, as more time is spent on mobile devices, emoticon use has followed.", "ko": "이동 통신은 우리가 컴퓨터와 상호 작용하는 방식을 바꾸었고, 모바일 기기 사용 시간이 늘면서 이모티콘 사용도 그 뒤를 따랐다."}, {"n": 2, "en": "Cellular phones, smartphones, tablets, and similar technologies have penetrated the world at an enormous rate and non-voice communications have become the norm rather than the exception.", "ko": "휴대폰, 스마트폰, 태블릿, 이와 유사한 기술이 엄청난 속도로 전 세계에 침투했으며, 비음성 통신은 예외가 아니라 일반적인 것이 되었다."}, {"n": 3, "en": "In 2013, the number of mobile subscriptions almost equaled the estimated number of individuals that made up the global population in the same year.", "ko": "2013년 모바일 서비스 가입 건수는 같은 해의 추정 세계 인구수와 거의 같았다."}, {"n": 4, "en": "Users of these technologies have posted, pinned, tweeted, sent and/or received billions of electronic messages through public or private (text messages, emails, etc.) means.", "ko": "이러한 기술 이용자들은 공개적인 또는 사적인 (문자 메시지, 이메일 등) 수단을 통해 수십억 개의 전자 메시지를 게시하고, 고정하고, 트윗하고, 송수신해왔다."}, {"n": 5, "en": "These communications media have become so prolific, researchers have worried that face-to-face communications could become extinct.", "ko": "이러한 통신 매체가 너무 많아져서, 연구자들은 대면 소통이 소멸할 수 있다고 우려해 왔다."}]}, {"id": "olym13-04", "unit": "olym13", "number": 4, "title": "p92 no.03", "core": "정서적 뇌가 과흥분된 아이에게는 포옹과 공감, 그리고 한마디 말이 이성으로 가는 다리가 된다.", "flow": [{"label": "상태", "sentences": "S1~3", "text": "강한 감정은 아이를 이성적인 상태에서 벗어나게 한다.", "refs": [1, 2, 3]}, {"label": "돌봄", "sentences": "S4", "text": "포옹과 상황을 공감하는 말로 감정의 강도를 누그러뜨린다.", "refs": [4]}, {"label": "연결", "sentences": "S5", "text": "말이 정서와 이성 사이의 다리가 되어 감정 조절과 듣기를 돕는다.", "refs": [5]}], "structure": [{"title": "문제 — 이성 밖에 놓인 아이", "text": "정서적 뇌가 과흥분해 기분을 억누르지 못하고 지시도 듣지 못한다"}, {"title": "해결 — 포옹·공감·한마디", "text": "감정의 강도를 먼저 낮추고 말로 이성과 감정 사이에 다리를 놓는다"}], "key_sentence_en": "When intense emotion overexcites the emotional brain, a child cannot contain their mood, so a hug, an empathic reflection and a spoken word are the best ways to bridge emotion and reason.", "blocking_vocab": [{"word": "overexcited", "meaning": "과흥분한"}, {"word": "tantrum", "meaning": "짜증·분노 발작"}, {"word": "empathic reflection", "meaning": "공감하며 되짚기"}], "diagram": {"kind": "steps", "title": "아이의 감정을 진정시키는 연결", "items": [{"head": "강한 감정", "body": "정서적 뇌가 과흥분하면 감정 조절이 어려움", "refs": [1, 2, 3]}, {"head": "포옹·공감", "body": "상황을 공감하며 되짚어 감정의 강도를 낮춤", "refs": [4]}, {"head": "한마디 말", "body": "정서와 이성 사이의 다리가 되어 말을 들을 여지를 줌", "refs": [5]}]}, "checks": [{"type": "핵심", "q": "감정이 과흥분한 아이를 도울 최선의 전략은?", "choices": ["포옹과 공감하는 되짚기", "지시를 더 세게 반복하기"], "answer": 0, "why": "S4의 a hug and an empathic reflection.", "refs": [4]}, {"type": "인과 근거", "q": "한마디 말이 '다리'가 되는 이유는?", "choices": ["이성적 뇌가 감정을 진정시키거나 부모의 말을 듣게 도와서", "아이의 감정을 즉시 없애서"], "answer": 0, "why": "S5는 soothe 또는 at least listen이라고 한정한다.", "refs": [5]}, {"type": "변형 탐지", "q": "S5와 일치하는 문장은?", "choices": ["A spoken word can connect the emotional and rational worlds.", "A spoken word always makes the child's emotion vanish instantly."], "answer": 0, "why": "S5의 form a bridge와 at least를 확인한다.", "refs": [5]}], "easy_story": "감정이 크게 올라온 아이에게 논리적인 설명부터 하면 잘 들리지 않을 수 있어요. 먼저 안아 주고 감정을 공감해 주면 흥분이 조금 가라앉습니다. 그때 짧은 말이 감정의 세계와 이성적인 생각 사이에 다리를 놓을 수 있다는 글입니다.", "sentences": [{"n": 1, "en": "When a region of the emotional brain is overexcited due to frustration, sadness or any other intense emotion, the child is not able to contain their mood.", "ko": "좌절감, 슬픔 또는 다른 어떤 강렬한 감정으로 인해 정서적 뇌의 한 부위가 과도하게 흥분되면, 아이는 자신의 기분을 억누를 수 없게 된다."}, {"n": 2, "en": "This is when the tantrums occur ─ situations in which the child closes in on themself and is not able to do what they are told ─ or comments are made which the parents find hard to deal with.", "ko": "이때 아이가 자기 안으로 움츠러들어 지시받은 일을 하지 못하는 짜증 상황이 벌어지거나, 부모가 대처하기 어렵다고 느끼는 말이 튀어나온다."}, {"n": 3, "en": "Literally, the child is outside themselves, outside their rational part.", "ko": "말 그대로 아이는 제정신을 잃고 이성적인 부분에서 벗어난 상태다."}, {"n": 4, "en": "To help them calm down, and to see reason, the best strategy is a hug and an empathic reflection of the situation to defuse the intensity of the emotion.", "ko": "아이가 진정하고 이성을 되찾도록 돕는 가장 좋은 방법은, 포옹하고 상황을 공감하며 되짚어 주어 감정의 강도를 누그러뜨리는 것이다."}, {"n": 5, "en": "A spoken word will form a bridge between the two worlds, allowing the child's rational brain to help soothe their emotions, or at least give them the ability to listen to what their parents are saying.", "ko": "한마디 말은 두 세계 사이에 다리를 놓아, 아이의 이성적 뇌가 감정을 가라앉히도록 돕거나 적어도 아이에게 부모의 말을 들을 수 있는 능력을 줄 것이다."}]}]}, {"id": "olym14", "label": "올림포스 영독 기본1 · 14강", "scope": "글의 순서 배열", "passages": [{"id": "olym14-01", "unit": "olym14", "number": 1, "title": "no.01", "core": "방관자가 나서지 못하는 것은 성격의 결함이 아니라 지켜보는 사람이 많을수록 책임이 흩어지기 때문이다.", "flow": [{"label": "불편한 통찰", "sentences": "S1~4", "text": "우리도 비상 상황에서 대응하지 못할 수 있지만 스스로는 더 잘할 거라 믿고 싶다.", "refs": [1, 2, 3, 4]}, {"label": "원인 재해석", "sentences": "S5~6", "text": "방관의 원인은 성격상의 결함보다 상황의 제약이다.", "refs": [5, 6]}, {"label": "수의 효과", "sentences": "S7~8", "text": "목격자가 많을수록 개입 가능성은 낮아지고 한 명이면 대체로 대응한다.", "refs": [7, 8]}, {"label": "책임 분산", "sentences": "S9~10", "text": "여럿이 보면 책임이 흩어져 어느 한 명도 충분한 개인 책임을 느끼지 못한다.", "refs": [9, 10]}], "structure": [{"title": "원인 — 여럿이 지켜봄", "text": "목격자가 많을수록 책임감이 그들 사이로 흩어져 약해진다"}, {"title": "결과 — 아무도 나서지 않음", "text": "어느 한 명도 개입할 만큼의 개인적 책임감을 느끼지 못한다"}], "key_sentence_en": "Bystanders fail to respond not because of defects in their character but because the situation constrains their behavior, and responsibility diffuses as more bystanders witness an emergency.", "blocking_vocab": [{"word": "bystander", "meaning": "방관자"}, {"word": "intervene", "meaning": "개입하다"}, {"word": "diffuse", "meaning": "분산되다"}], "diagram": {"kind": "compare", "title": "응급 현장의 목격자 수와 책임감", "items": [{"head": "혼자 목격", "body": "개인적 책임을 느껴 대체로 대응함", "refs": [8]}, {"head": "여럿이 목격", "body": "책임이 서로 분산되어 각자가 느끼는 책임이 약해짐", "refs": [7, 9, 10]}], "takeaway": "성격 결함보다는 상황의 제약 · S5~6"}, "checks": [{"type": "핵심", "q": "방관자가 행동하지 않는 가장 중요한 설명은?", "choices": ["개개인의 성격 결함", "목격자가 많을 때 책임의 분산"], "answer": 1, "why": "S5는 성격 결함을 부정하고 S7~10은 상황과 책임 분산을 설명한다.", "refs": [5, 6, 7, 9, 10]}, {"type": "대조 근거", "q": "한 사람만 응급 현장을 목격하면 보통 어떻게 하는가?", "choices": ["반드시 책임을 다른 사람에게 돌린다.", "대체로 대응한다."], "answer": 1, "why": "S8의 a single bystander ... would usually respond.", "refs": [8]}, {"type": "변형 탐지", "q": "S7과 일치하는 문장은?", "choices": ["The more bystanders there are, the less likely any one will intervene.", "The more bystanders there are, the more likely each will intervene."], "answer": 0, "why": "S7의 more ... less likely를 확인한다.", "refs": [7]}], "easy_story": "누군가 위험에 처했는데 주변 사람들이 모두 가만히 있으면, 다들 나쁜 사람이라서일까요? 사람이 많을수록 ‘다른 누군가 하겠지’ 하고 책임이 나뉘어 느껴질 수 있어요. 혼자 목격하면 오히려 나설 가능성이 커집니다. 글은 성격보다 상황의 힘을 설명합니다.", "sentences": [{"n": 1, "en": "Social psychology tells us that bystanders in emergency situations are acting normally when they fail to respond.", "ko": "사회 심리학에 따르면 비상 상황에서 방관자는 그들이 대응하지 못할 때 정상적으로 행동하고 있는 것이다."}, {"n": 2, "en": "We would fail to respond as well.", "ko": "우리도 또한 대응하지 못할 것이다."}, {"n": 3, "en": "That social psychological insight makes us uncomfortable.", "ko": "그러한 사회 심리학적 통찰은 우리를 불편하게 만든다."}, {"n": 4, "en": "We like to feel we would behave differently, better.", "ko": "우리는 다르게, 더 잘 행동할 것으로 생각하고 싶어 한다."}, {"n": 5, "en": "The problem with bystanders, however, does not stem from defects in their character that prevent them from helping.", "ko": "그러나 방관자 문제는 그들이 도움을 주는 것을 막는 성격상의 결함에서 비롯되는 것이 아니다."}, {"n": 6, "en": "Rather, the situation that bystanders find themselves in constrains their behavior more than we realize.", "ko": "그보다는 방관자가 처한 상황이 우리가 인식하는 것보다 더 많이 그들의 행동을 제약한다."}, {"n": 7, "en": "For example, the more bystanders there are, the less likely any one of them will intervene.", "ko": "예를 들어, 방관자가 더 많을수록 그들 중 어느 한 명이라도 개입할 가능성이 더 낮을 것이다."}, {"n": 8, "en": "A single bystander at the scene of an emergency would usually respond, just as we hope we would.", "ko": "응급 현장에 있는 단 한 명의 방관자는 보통 우리가 그러기를 바라는 바로 그대로 대응할 것이다."}, {"n": 9, "en": "But when a number of bystanders witness an emergency, responsibility apparently diffuses among them, getting weaker.", "ko": "그러나 다수의 방관자가 비상 상황을 목격할 때, 그들 사이에서 책임감이 명백히 분산되어 점점 약해진다."}, {"n": 10, "en": "No one bystander feels enough personal responsibility to respond.", "ko": "어떤 한 명의 방관자도 대응할 충분한 개인적 책임감을 느끼지 못한다."}]}, {"id": "olym14-02", "unit": "olym14", "number": 2, "title": "no.02", "core": "퍼스널 브랜딩의 핵심은 자신을 알릴 기회를 알아보는 인식과 미리 내다보는 예상이다.", "flow": [{"label": "거리낌과 필요", "sentences": "S1~3", "text": "자기를 홍보하는 계획은 불편할 수 있지만 브랜딩은 성공에 중요하다.", "refs": [1, 2, 3]}, {"label": "두 열쇠", "sentences": "S4~6", "text": "기회에 대한 인식과 예상을 통해 좋은 인상을 준비한다.", "refs": [4, 5, 6]}, {"label": "실천", "sentences": "S7", "text": "남들이 자신을 어떻게 말해 주기를 원하는지 생각한다.", "refs": [7]}], "structure": [{"title": "문제 — 불편함과 놓친 기회", "text": "스스로 홍보하는 일이 어색해 기회를 알아보지도 준비하지도 못한다"}, {"title": "해결 — 인식과 예상", "text": "기회를 알아보고 미리 내다본 뒤, 없는 자리에서 듣고 싶은 말을 기준으로 삼는다"}], "key_sentence_en": "Personal branding is not done behind the scenes but is essential to success, and its key is being aware of chances to brand yourself and anticipating the moments when your brand will show.", "blocking_vocab": [{"word": "personal branding", "meaning": "자기 이미지 구축"}, {"word": "anticipation", "meaning": "예상"}, {"word": "favorable impression", "meaning": "좋은 인상"}], "diagram": {"kind": "compare", "title": "퍼스널 브랜딩의 동등한 두 요소", "items": [{"head": "인식 · awareness", "body": "자신을 알릴 기회와 남기고 싶은 인상을 알아차림", "refs": [4, 5, 7]}, {"head": "예상 · anticipation", "body": "역량을 보여 줄 기회가 올 것을 내다보고 준비함", "refs": [4, 6]}], "takeaway": "인식 → 예상의 필수 순서가 아니라 함께 필요한 두 요소 · S4~6"}, "checks": [{"type": "핵심", "q": "퍼스널 브랜딩의 두 핵심 요소는?", "choices": ["인식과 예상", "즉흥성과 무관심"], "answer": 0, "why": "S4의 awareness and anticipation.", "refs": [4]}, {"type": "인과 근거", "q": "기회를 미리 예상하지 못하면?", "choices": ["역량이 자동으로 알려진다.", "기회가 올 때 준비되어 있지 않을 수 있다."], "answer": 1, "why": "S6의 may not be prepared when they occur.", "refs": [6]}, {"type": "변형 탐지", "q": "S5와 일치하는 문장은?", "choices": ["Being unaware of opportunities guarantees a favorable impression.", "Being unaware of opportunities may prevent a favorable impression."], "answer": 1, "why": "S5의 may not ... favorable impression.", "refs": [5]}], "easy_story": "자신을 알리는 일에서는 두 가지를 함께 해야 합니다. 기회가 왔다는 것을 알아채지 못하면 인상을 남길 수 없고, 미리 내다보지 못하면 준비할 수 없어요. ‘인식’ 다음에 반드시 ‘예상’을 거치는 순서가 아니라 둘 다 필요한 요소입니다.", "sentences": [{"n": 1, "en": "Personal branding is not something that you have to do behind the scenes.", "ko": "퍼스널 브랜딩은 여러분이 남몰래 해야 하는 것이 아니다."}, {"n": 2, "en": "For many it does not always feel comfortable to deliberately plan how we are going to promote ourselves and our accomplishments to others.", "ko": "의도적으로 우리 자신과 우리의 업적을 다른 사람들에게 어떻게 홍보할지 계획하는 것이 많은 사람에게 항상 편안하게 느껴지는 것은 아니다."}, {"n": 3, "en": "Personal branding, however, is essential to achieving success.", "ko": "하지만 퍼스널 브랜딩은 성공을 이루는 데 필수적이다."}, {"n": 4, "en": "The key takeaway from this concept is awareness and anticipation.", "ko": "이 개념의 주요한 핵심은 인식과 예상이다."}, {"n": 5, "en": "If you are not aware of the opportunities to brand yourself, you may not be directed to leave a favorable impression.", "ko": "만약 자신을 눈에 띄게 할 기회를 인식하지 못한다면, 여러분은 호의적인 인상을 남기게 되지 못할 수도 있다."}, {"n": 6, "en": "If you cannot anticipate the opportunities that will present themselves to favorably demonstrate your brand through capability, you may not be prepared when they occur.", "ko": "역량을 통해 여러분의 브랜드를 호의적으로 보여 줄 기회가 찾아올 것을 예상할 수 없다면, 여러분은 그 기회가 생길 때 준비가 되어 있지 않을 수도 있다."}, {"n": 7, "en": "So as you begin to think about what you want to be known for, begin to be more aware of what you want people to say about you when you are not in the room as an effective way to guide your personal brand.", "ko": "그래서 자신이 무엇으로 알려지고 싶은지에 대해 생각을 시작할 때, 여러분의 퍼스널 브랜드를 이끌 효과적인 방법으로서 사람들이 여러분이 방에 없을 때 여러분에 대해 무엇을 말하기를 원하는지를 더 많이 인식하기 시작하라."}]}, {"id": "olym14-03", "unit": "olym14", "number": 3, "title": "no.03", "core": "움직임을 알아보는 능력 덕분에 Tombaugh는 사진을 뒤집어 보며 움직인 점 하나를 찾아 명왕성을 확인했다.", "flow": [{"label": "탐색", "sentences": "S1~3", "text": "1930년 Tombaugh는 해왕성 너머 행성을 찾기 위해 같은 하늘을 며칠 간격으로 두 번 찍었다.", "refs": [1, 2, 3]}, {"label": "구별 원리", "sentences": "S4~5", "text": "항성은 그대로지만 행성은 위치가 달라져 작은 움직이는 점을 찾으면 된다.", "refs": [4, 5]}, {"label": "방법", "sentences": "S6~7", "text": "기계가 사진 두 장을 번갈아 보여 주자 움직이는 점을 발견했다.", "refs": [6, 7]}, {"label": "결과", "sentences": "S8", "text": "그 점을 현재 왜소 행성으로 분류되는 명왕성으로 확인했다.", "refs": [8]}], "structure": [{"title": "문제 — 점 하나를 어떻게 찾나", "text": "움직이지 않는 수많은 점 사이에 섞인 작은 점 하나를 눈으로 가려내야 했다"}, {"title": "해결 — 뒤집어 보기", "text": "사진 두 장을 번갈아 보여 주면 움직임이 눈에 띄어 한 점이 곧바로 드러난다"}], "key_sentence_en": "The ability to detect visual movement let Clyde Tombaugh find a moving dot by flipping paired sky photographs on a machine, and he identified that dot as Pluto.", "image": "../../assets/gyeonghae1-olym14-03-blink-comparator.webp", "image_alt": "1930년 관측자가 블링크 비교기로 며칠 간격의 별 사진 두 장을 비교하고 위치가 달라진 작은 점을 찾는 개념 삽화", "image_caption": "S2~8: 별은 제자리에, 행성 후보의 점 하나만 두 사진 사이에서 움직입니다. 관측 과정을 설명하는 개념 삽화입니다.", "blocking_vocab": [{"word": "astronomy", "meaning": "천문학"}, {"word": "unmoving", "meaning": "움직이지 않는"}, {"word": "flip back and forth", "meaning": "앞뒤로 번갈아 보여 주다"}], "checks": [{"type": "핵심", "q": "Tombaugh가 작은 점을 찾을 수 있었던 방법은?", "choices": ["서로 다른 날짜의 사진을 번갈아 비교한다.", "사진 한 장만 오래 바라본다."], "answer": 0, "why": "S3은 두 번 촬영, S6~7은 두 사진을 번갈아 보여 주는 기계를 설명한다.", "refs": [3, 6, 7]}, {"type": "대조 근거", "q": "사진 두 장 사이에서 항성과 행성의 차이는?", "choices": ["항성은 거의 그대로, 행성은 이동", "항성은 이동, 행성은 그대로"], "answer": 0, "why": "S4의 stars remain unmoving, while a planet moves.", "refs": [4]}, {"type": "변형 탐지", "q": "S8과 일치하는 문장은?", "choices": ["Pluto is now listed as a dwarf planet.", "Pluto is now listed as a star."], "answer": 0, "why": "S8의 dwarf planet을 확인한다.", "refs": [8]}], "easy_story": "멀리 있는 별과 행성은 사진 속에서 모두 작은 점으로 보입니다. Tombaugh는 같은 하늘을 두 번 찍어 사진을 빠르게 번갈아 보았어요. 그대로 있는 항성 사이에서 자리가 옮겨진 점 하나를 찾아 명왕성으로 확인했습니다. 핵심은 ‘움직임을 알아차리는 능력’을 이용한 비교입니다.", "sentences": [{"n": 1, "en": "The ability to detect visual movement played an interesting role in the history of astronomy.", "ko": "시각적 움직임을 감지하는 능력은 천문학의 역사에서 흥미로운 역할을 했다."}, {"n": 2, "en": "In 1930, Clyde Tombaugh was searching the skies for a possible undiscovered planet beyond Neptune.", "ko": "1930년에, Clyde Tombaugh는 해왕성 너머에 있을지도 모르는 미발견 행성을 찾기 위해 하늘을 탐색하고 있었다."}, {"n": 3, "en": "He photographed each region of the sky twice, several days apart.", "ko": "그는 하늘의 각 영역을 며칠 간격으로 두 번씩 촬영했다."}, {"n": 4, "en": "Stars essentially remain unmoving in photos, while a planet moves from one photo to the next.", "ko": "항성은 본질적으로 사진에서 움직이지 않는 상태로 남아 있는 반면, 행성은 한 사진에서 다음 사진으로 가면서 이동한다."}, {"n": 5, "en": "However, how would he find a small dot that moved among all the countless unmoving dots in the sky?", "ko": "하지만 그가 하늘에서 움직이지 않는 수많은 점들 사이에서 움직인 하나의 작은 점을 어떻게 찾을 것인가?"}, {"n": 6, "en": "He put each pair of photos on a machine that would flip back and forth between one photo and the other.", "ko": "그는 각 쌍의 사진을 한 사진과 다른 사진을 앞뒤로 번갈아 보여 주는 기계에 놓았다."}, {"n": 7, "en": "When he came to one pair of photos, he immediately noticed one dot moving as the machine flipped back and forth.", "ko": "한 쌍의 사진에 다다랐을 때, 그는 기계가 사진을 번갈아 보여 주자 점 하나가 움직이는 것을 즉시 알아챘다."}, {"n": 8, "en": "He identified that dot as Pluto, which astronomers now list as a dwarf planet.", "ko": "그는 그 점을 명왕성으로 확인했는데, 천문학자들은 현재 그것을 왜소 행성의 목록에 포함한다."}], "learning_map": {"kind": "compare", "title": "며칠 간격의 사진 두 장을 번갈아 본다", "items": [{"head": "그대로인 별", "body": "별의 점은 두 사진에서 사실상 움직이지 않는다", "refs": [3, 4]}, {"head": "움직인 점 하나", "body": "위치가 바뀐 점을 블링크 비교기로 찾아 명왕성으로 확인한다", "refs": [4, 6, 7, 8]}], "takeaway": "움직인 점을 찾는 과정이지 모든 별의 위치가 달라지는 것이 아니다."}}, {"id": "olym14-04", "unit": "olym14", "number": 4, "title": "no.04", "core": "숲은 탄소를 흡수하고 산소를 주는데도 사소한 쓰임 때문에 다시 자라는 속도보다 빨리 베어진다.", "flow": [{"label": "문제", "sentences": "S1~2", "text": "재성장 속도보다 빠른 벌채는 공급·종·숲의 기능을 위협한다.", "refs": [1, 2]}, {"label": "기능", "sentences": "S3~4", "text": "숲은 대기 탄소를 흡수하고 산소를 공급한다.", "refs": [3, 4]}, {"label": "짧은 쓰임", "sentences": "S5~7", "text": "허리케인 때 창문을 막은 합판은 폭풍 뒤 버려진다.", "refs": [5, 6, 7]}, {"label": "역설", "sentences": "S8", "text": "폭풍을 줄이는 데 도움 될 숲을 그 일시적 용도로 베어낸다.", "refs": [8]}], "structure": [{"title": "원인 — 사소한 목재 사용", "text": "폭풍 지나면 버릴 합판처럼 근시안적인 쓰임이 너무 많다"}, {"title": "결과 — 숲의 기능 상실", "text": "탄소를 흡수하고 폭풍을 눅여 줄 숲이 바로 그 폭풍을 막느라 사라진다"}], "key_sentence_en": "People cut down forests faster than forests can regrow, so we must reduce trivial uses of wood because forests control global warming and provide the oxygen we breathe.", "blocking_vocab": [{"word": "regrow", "meaning": "다시 자라다"}, {"word": "greenhouse gases", "meaning": "온실 가스"}, {"word": "plywood", "meaning": "합판"}], "diagram": {"kind": "argument", "title": "숲의 기능과 단기 목재 사용의 역설", "items": [{"head": "숲의 기능", "body": "탄소를 흡수해 온난화를 억제하고 산소를 공급", "refs": [2, 3, 4]}, {"head": "단기 사용", "body": "허리케인에 대비해 합판으로 창문을 막았다가 버림", "refs": [5, 6, 7]}, {"head": "역설", "body": "폭풍을 억제하는 데 도움이 될 숲을 그 목적으로 베어냄", "refs": [1, 8]}]}, "checks": [{"type": "핵심", "q": "숲을 사소한 용도로 베는 일이 역설적인 까닭은?", "choices": ["합판은 반드시 영구히 재사용되므로", "그 숲이 폭풍을 억제하는 데 도움 될 수도 있어서"], "answer": 1, "why": "S8의 otherwise would aid in controlling such storms.", "refs": [8]}, {"type": "기능 근거", "q": "본문이 말하는 숲의 기능은?", "choices": ["탄소 흡수와 산소 공급", "온실가스 생산과 산소 흡수"], "answer": 0, "why": "S3~4의 두 기능을 확인한다.", "refs": [3, 4]}, {"type": "변형 탐지", "q": "S1과 일치하는 문장은?", "choices": ["People cut down forests faster than they can regrow.", "Forests regrow faster than people cut them down."], "answer": 0, "why": "S1의 much faster than the rate ... regrow.", "refs": [1]}], "easy_story": "숲은 목재만 주는 곳이 아닙니다. 탄소를 흡수하고 산소를 주며 폭풍을 막는 데도 도움을 줍니다. 그런데 짧게 쓰고 버릴 합판을 얻으려고 숲을 다시 자라는 속도보다 빨리 베어 내요. 폭풍을 막아 줄 숲을 폭풍 대비용 판재 때문에 없애는 역설이 핵심입니다.", "sentences": [{"n": 1, "en": "People are cutting down forests much faster than the rate at which forests can regrow.", "ko": "사람들은 숲이 재성장할 수 있는 속도보다 훨씬 더 빠르게 숲을 베어내고 있다."}, {"n": 2, "en": "We need to dramatically reduce our use of wood, not just because the supply is decreasing, and not just because entire species of flora and fauna that live in forests are vanishing, but because the forest performs an important function.", "ko": "우리는 목재 사용을 급격하게 줄여야 하는데, 이는 공급이 감소하고 있기 때문만이 아니라, 그리고 숲에 서식하는 동식물군 전체 종이 사라지고 있기 때문만이 아니라, 숲이 중요한 기능을 수행하기 때문이다."}, {"n": 3, "en": "Forests control global warming by absorbing carbon from the atmosphere and reducing greenhouse gases.", "ko": "숲은 대기로부터 탄소를 흡수하고 온실 가스를 줄여 지구온난화를 억제한다."}, {"n": 4, "en": "They also provide oxygen for us to breathe.", "ko": "그것은 또한 우리가 숨 쉴 수 있는 산소를 공급한다."}, {"n": 5, "en": "There are too many trivial and shortsighted uses of wood.", "ko": "목재의 사소하고 근시안적인 쓰임새가 너무 많다."}, {"n": 6, "en": "When a hurricane advances on a city, people board up their windows with plywood.", "ko": "허리케인이 도시로 다가오면 사람들은 합판으로 창문을 막는다."}, {"n": 7, "en": "After the storm has passed, they discard the plywood.", "ko": "폭풍이 지나간 후에, 그들은 합판을 버린다."}, {"n": 8, "en": "It's ironic to think that for purposes such as these, forests are cut down that otherwise would aid in controlling such storms.", "ko": "이러한 목적을 위해 숲이 베어지는데, 그렇지 않았다면 숲이 그러한 폭풍을 통제하는 데 도움이 되었으리라는 것을 생각하면 아이러니이다."}]}]}, {"id": "olym15", "label": "올림포스 영독 기본1 · 15강", "scope": "수능 Analysis·1번만", "passages": [{"id": "olym15-01", "unit": "olym15", "number": 1, "title": "p100 수능 대비 ANALYSIS", "core": "금리 인상으로 인플레이션을 억제하면 대출·통화량은 줄지만, 그 고통은 정책 영향력이 작은 채무자에게 집중될 수 있다.", "flow": [{"label": "정책", "sentences": "S1~2", "text": "인플레이션에 대응해 정부가 금리를 올려 신규 대출을 억제한다.", "refs": [1, 2]}, {"label": "효과", "sentences": "S3", "text": "시중 돈과 구매력이 줄며 물가 상승 압력이 낮아진다.", "refs": [3]}, {"label": "연쇄 비용", "sentences": "S4~6", "text": "기존 채무자의 비용 증가가 파산·실직·연쇄 불이행으로 이어질 수 있다.", "refs": [4, 5, 6]}, {"label": "결론", "sentences": "S7", "text": "정책의 어려움은 정책에 영향력이 작은 사람들에게 돌아간다.", "refs": [7]}], "structure": [{"title": "정책의 목적", "text": "금리를 올려 통화량과 인플레이션 압력을 낮춘다."}, {"title": "함께 생기는 문제", "text": "채무자의 비용과 상환 불능이 늘고 약자에게 고통이 집중된다."}], "key_sentence_en": "Higher interest rates can curb inflation while imposing severe hardship on debtors with little influence over policy.", "blocking_vocab": [{"word": "inflationary pressure", "meaning": "물가 상승 압력"}, {"word": "default", "meaning": "채무 불이행"}, {"word": "contraction", "meaning": "축소"}], "diagram": {"kind": "branches", "title": "금리 인상에서 갈라지는 두 영향", "items": [{"head": "공통 출발 · 금리 인상", "body": "정부는 신규 대출을 통한 돈의 창출을 억제하려 한다.", "refs": [1, 2]}, {"head": "물가 관련 경로", "body": "신규 대출이 줄고 기존 대출이 상환되면서 시중 돈·구매력이 줄어 물가 상승 압력이 낮아진다.", "refs": [2, 3]}, {"head": "기존 채무자의 부담", "body": "대출 비용이 커져 파산·실직·채무 불이행이 이어질 수 있고, 고통은 정책 영향력이 작은 사람에게 집중된다.", "refs": [4, 5, 6, 7]}], "takeaway": "두 영향은 금리 인상에서 갈라진다. 물가 압력 감소가 채무자 고통의 선행 단계라는 뜻이 아니다 · S2~7"}, "checks": [{"type": "핵심", "q": "인플레이션 억제 정책의 역설은?", "choices": ["금리 인상의 고통이 정책 영향력이 작은 채무자에게 집중될 수 있다.", "금리 인상은 모든 사람의 대출비용을 반드시 낮춘다."], "answer": 0, "why": "S4~7의 비용 연쇄와 hardship falls on people with little power.", "refs": [4, 5, 6, 7]}, {"type": "인과 근거", "q": "금리 인상이 인플레이션 압력을 낮추는 경로는?", "choices": ["신규 대출 증가→시중 통화 증가", "신규 대출 감소→시중 통화·구매력 감소"], "answer": 1, "why": "S2~3의 대출, 통화, 구매력, 압력의 순서다.", "refs": [2, 3]}, {"type": "변형 탐지", "q": "S7과 일치하는 문장은?", "choices": ["The hardship falls only on those with the most power over policy.", "The hardship falls on people with little power to influence policy."], "answer": 1, "why": "S7의 little power를 확인한다.", "refs": [7]}], "easy_story": "물가가 오르면 돈의 가치가 떨어져 금리를 높이라는 요구가 커질 수 있습니다. 금리가 오르면 대출과 통화량이 줄어 물가 상승 압력을 낮추는 길이 있습니다. 동시에 빚을 갚는 부담이 커져 파산이나 실직 같은 어려움이 채무자에게 집중될 수 있어요. 물가를 잡는 효과와 부담의 분배를 두 갈래로 봐야 합니다.", "sentences": [{"n": 1, "en": "Money loses value when inflation takes place; hence, those with large amounts of money encourage a strong government response to inflation.", "ko": "인플레이션이 발생하면 화폐는 가치를 잃게 되므로, 많은 돈을 가진 사람들은 인플레이션에 대한 정부의 강력한 대응을 부추긴다."}, {"n": 2, "en": "Governments respond by raising interest rates to discourage the creation of additional money through loans.", "ko": "정부는 대출을 통한 추가 자금 창출을 막기 위해 금리를 인상함으로써 대응한다."}, {"n": 3, "en": "As other loans are paid back, with fewer people taking out new loans, money disappears from circulation, reducing the ability of people to buy things and, thereby, reducing the inflationary pressure.", "ko": "다른 대출이 상환되고, 새로운 대출을 받는 사람이 줄어들면, 돈이 유통에서 사라져, 사람들의 물건 구매 능력이 줄어들고, 그것 때문에 인플레이션 압력이 감소한다."}, {"n": 4, "en": "For people and businesses with outstanding loans, the increased cost that results can be disastrous.", "ko": "미상환 대출이 있는 개인과 기업의 경우, 결과로 생긴 늘어난 비용은 파멸을 초래할 수 있다."}, {"n": 5, "en": "Increased expenses and bankruptcies lead to job loss, and consequently, more people unable to pay for their homes, cars and other loans.", "ko": "늘어난 비용과 파산은 실직으로 이어지고, 결과적으로 더 많은 사람들이 집, 자동차 및 기타 대출금을 갚지 못한다."}, {"n": 6, "en": "This leads to another round of defaults and subsequent contraction in the money supply.", "ko": "이것은 또 한 차례의 채무 불이행과 뒤이은 통화 공급의 축소로 이어진다."}, {"n": 7, "en": "This cure for inflation may bring as much or more hardship than the inflation, but the hardship falls on people with little power to influence policy.", "ko": "인플레이션에 대한 이러한 해결책은 인플레이션만큼 또는 그 이상의 어려움을 가져올 수도 있겠지만, 그 어려움은 정책에 영향을 미칠 힘이 거의 없는 사람들에게 돌아간다."}]}, {"id": "olym15-02", "unit": "olym15", "number": 2, "title": "p102 no.01", "core": "소비자는 제품의 원산지로 품질을 추단하며, 자국·외국에 대한 인식과 정보 처리 방식이 이 판단에 영향을 준다.", "flow": [{"label": "원리", "sentences": "S1~2", "text": "사람처럼 제품도 만들어진 곳으로 고정관념적 판단을 받는다.", "refs": [1, 2]}, {"label": "서로 다른 선호", "sentences": "S3~4", "text": "어떤 소비자는 외국산, 다른 소비자는 자국산을 더 좋게 추단한다.", "refs": [3, 4]}, {"label": "사례", "sentences": "S5~6", "text": "일본 소비자 선호를 고려해 여행 가방의 일본 설계·제조를 강조한다.", "refs": [5, 6]}, {"label": "조건·예외", "sentences": "S7~8", "text": "정보 처리 동기·목표와 해당 국가 정책에 대한 감정이 반응을 좌우한다.", "refs": [7, 8]}], "structure": [{"title": "원산지를 통한 품질 추정", "text": "외국산 선호 또는 자국산 선호가 제품의 평가에 반영된다."}, {"title": "영향을 조절하는 요인", "text": "정보 처리 동기·목표와 그 국가의 정치·사회 정책에 대한 태도"}], "key_sentence_en": "A product’s country of origin can shape consumers’ evaluations, depending on their stereotypes, processing goals, and attitudes toward that country.", "blocking_vocab": [{"word": "country of origin", "meaning": "원산지"}, {"word": "infer", "meaning": "추단하다"}, {"word": "stereotype", "meaning": "고정관념으로 판단하다"}], "diagram": {"kind": "compare", "title": "원산지 단서에 대한 소비자 판단", "items": [{"head": "외국산 선호", "body": "일부 개발도상국 소비자는 외국 브랜드에 더 높은 품질을 추단", "refs": [3]}, {"head": "자국산 선호", "body": "일부 국가는 자국 제품이 더 낫다고 믿음; 일본산 강조 사례", "refs": [4, 5, 6]}], "takeaway": "정보를 깊이 처리할 동기가 낮거나 원산지에 주목할 때 더 큰 영향 · S7; 정책에 대한 반감은 부정적 반응도 가능 · S8"}, "checks": [{"type": "핵심", "q": "원산지가 제품 평가에 미치는 영향은?", "choices": ["어느 나라에서나 외국산만 우수하다고 여긴다.", "소비자 집단과 정보 처리 조건에 따라 달라진다."], "answer": 1, "why": "S3~4는 서로 다른 방향의 선호, S7~8은 조건을 제시한다.", "refs": [3, 4, 7, 8]}, {"type": "사례 근거", "q": "일본에서 더 비싼 여행 가방을 팔 때 강조한 것은?", "choices": ["미국에서 설계·제조함", "일본에서 설계·제조함"], "answer": 1, "why": "S6의 designed and made in Japan.", "refs": [6]}, {"type": "변형 탐지", "q": "S7과 일치하는 문장은?", "choices": ["Low motivation to process brand information eliminates origin-based inferences.", "Low motivation to process brand information can increase origin-based inferences."], "answer": 1, "why": "S7의 more likely when ... unmotivated.", "refs": [7]}], "easy_story": "우리가 사람을 출신지로 미리 판단하듯 물건도 생산된 나라만 보고 품질을 예상할 때가 있어요. 어떤 소비자는 외국산을, 어떤 소비자는 자국산을 더 좋게 여깁니다. 기업은 이 인식을 이용하고, 국가 정책에 대한 감정까지 제품 평가에 옮겨 올 수 있어요.", "sentences": [{"n": 1, "en": "Knowledge about a product's country of origin can affect the way consumers think about it.", "ko": "제품의 원산지에 대한 지식은 소비자가 그것에 대해 생각하는 방식에 영향을 미칠 수 있다."}, {"n": 2, "en": "Just as we stereotype people based on where they were born, we stereotype products based on where they were made.", "ko": "마치 우리가 사람들을 태어난 곳에 근거해서 고정 관념적으로 파악하는 것과 똑같이, 우리는 제품도 그것이 만들어진 곳에 근거해서 고정 관념적으로 파악한다."}, {"n": 3, "en": "Consumers in developing countries, for instance, often infer higher quality for brands perceived as foreign.", "ko": "예를 들어 개발 도상국의 소비자들은 흔히 외국산으로 인식되는 브랜드에 대해 더 높은 품질을 추단한다."}, {"n": 4, "en": "Conversely, consumers in some nations believe their country's products are superior to those made elsewhere.", "ko": "반대로 일부 국가의 소비자들은 자국 제품이 다른 곳에서 만들어진 제품보다 더 우수하다고 생각한다."}, {"n": 5, "en": "Japanese consumers, for example, tend to infer that made-in-Japan products are higher quality than made-in-America products.", "ko": "예를 들어, 일본 소비자들은 일본산 제품이 미국산 제품보다 품질이 더 높다고 추단하는 경향이 있다."}, {"n": 6, "en": "Therefore, a luggage company markets its pricier luggage in Japan by stressing that the products are designed and made in Japan.", "ko": "따라서, 한 여행 가방 회사는 제품이 일본에서 디자인되고 만들어지는 것이라는 점을 강조함으로써 일본에서 더 비싼 여행 가방을 시장에 내놓는다."}, {"n": 7, "en": "Consumers are more likely to make inferences about a brand based on its country of origin when they are unmotivated to process brand information or when their processing goal guides attention towards origin information.", "ko": "소비자는 브랜드 정보를 처리할 동기가 없거나 자신의 처리 목표가 원산지 정보에 대해 주목하도록 이끌 때, 원산지에 근거해서 브랜드에 대해 추단할 가능성이 더 높다."}, {"n": 8, "en": "If consumers dislike a country's political or social policies, they may respond negatively to its products.", "ko": "소비자가 한 국가의 정치적 또는 사회적 정책을 싫어한다면, 그 국가의 제품에 대해 부정적으로 반응할 수도 있다."}]}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${d.items.map(x=>`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('')}</div>${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 경해여고1 부교재 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button><p class="translation">${esc(s.ko)}</p></div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 먼저 생각</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}<div class="read-handoff"><button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div></section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${p.diagram||p.learning_map?`<div class="source-visual"><p class="source-visual-label">원문으로 확인한 한눈 지도</p>${renderDiagram(p.learning_map||p.diagram)}</div>`:''}<details class="easy-story story-after-reading"><summary>막혔다면 · 이야기처럼 다시 읽기</summary>${storySteps(p.easy_story)}</details>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,

.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,

.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}

.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

<script id="course-data" type="application/json">{"course":"대아고1 Booster 부교재","units":[{"id":"ch04","label":"4과 · 동사의 이해","scope":"p45~54 · 독해 지문","passages":[{"id":"ch04-01","unit":"ch04","number":1,"title":"p45 · 독해훈련","sentences":[{"n":1,"en":"Pencils of Promise is a non-profit organization that builds needed schools and increases educational opportunities in the developing world, such as Ghana and Laos.","ko":"Pencils of Promise는 가나와 라오스 같은 개발 도상국 에서 필요한 학교를 짓고 교육의 기회를 증대시키는 비영리 단체 이다.","role":"화제 열기 — 단체의 성격과 활동 지역을 먼저 밝힌다."},{"n":2,"en":"Founder Adam Braun got the idea for the name, Pencils of Promise, after he had met a boy begging in India.","ko":"설립자 Adam Braun은 인도에서 구걸을 하는 한 소년을 만난 후 Pencils of Promise라는 이름에 대한 아이디어를 얻었다 .","role":"일화 들기 — 이름이 어디서 왔는지로 이야기를 연다."},{"n":3,"en":"Adam asked the boy what he wanted most in the world and he replied, “A pencil.”","ko":"Adam은 그 소년에게 그가 세상에서 가장 원하는 것 이 무엇인지 물었고 그 아이는 “ 연필 이요.”라고 대답했다.","role":"장면 보이기 — 소년의 한마디가 이름의 씨앗이 된다."},{"n":4,"en":"Realizing the importance of education in many developing countries, Adam spent years handing out thousands of pencils and pens across fifty countries before founding Pencils of Promise.","ko":"많은 개발 도상국에서의 교육의 중요성 을 깨닫고, Adam은 Pencils of Promise를 설립하기 전에 수천 개의 연필과 펜을 전 세계 50개국에 나누어 주며 몇 년을 보냈다.","role":"준비 과정 — 단체를 세우기 전의 오랜 활동을 든다."},{"n":5,"en":"Since it was established in 2008, the charity has built more than 300 schools and helped more than 30,000 kids go to school.","ko":"2008년에 설립된 이래로 , 그 자선 단체는 300개 이상의 학교 를 지었고, 3만 명 이상의 아이들이 학교에 갈 수 있도록 도왔다.","role":"수치 제시 — 설립 뒤 쌓인 실적을 숫자로 든다."},{"n":6,"en":"It also supports projects through ongoing teacher training and scholarships.","ko":"그것은 또한 지속적인 교사 양성 과 장학금 을 통해 프로젝트들을 지원한다.","role":"부연 — 학교 건립 밖의 지원까지 덧붙인다."}],"core":"한 소년의 연필 한 자루에서 시작된 단체가 학교를 짓고 아이들을 학교에 보내고 있다.","flow":[{"label":"단체와 이름","sentences":"S1–3","text":"교육 기회를 넓히는 단체의 이름은 인도에서 만난 소년이 연필을 원한 일화에서 비롯됐다.","refs":[1,2,3]},{"label":"설립 전 활동","sentences":"S4","text":"설립자는 여러 나라에 오랫동안 연필과 펜을 나누어 주었다.","refs":[4]},{"label":"설립 후 성과","sentences":"S5–6","text":"학교 건설과 학생 지원에 더해 교사 양성·장학금으로 활동을 이어 간다.","refs":[5,6]}],"structure":[{"title":"계기 — 소년의 연필 한 자루","text":"인도에서 구걸하던 소년이 가장 원한 것이 연필이었다"},{"title":"결과 — 학교 300개","text":"설립 뒤 학교 300개를 짓고 아이 3만 명을 학교에 보냈다"}],"key_sentence_en":"Pencils of Promise, whose name came from a begging boy’s wish for a pencil, has built more than 300 schools and helped more than 30,000 children go to school.","lead":"한 소년이 ‘연필 한 자루’를 원한다고 말한 뒤, 어떤 일이 시작되었을까?","image":"../../assets/daea1-ch04-01-pencil.webp","image_alt":"한 손에서 다른 손으로 연필 한 자루를 건네는 모습을 중심으로 표현한 교육용 그림","image_caption":"소년이 가장 원한 것은 연필 한 자루였다. 그림 속 학교는 이후 교육 지원을 나타내는 상징이다.","prediction":{"question":"단체 이름 ‘Pencils of Promise’의 출발점은 무엇일까?","choices":["한 소년이 가장 원한다고 말한 연필 한 자루","처음부터 계획된 대규모 학교 건설 사업"],"answer":0,"actual":"설립자 Adam Braun은 인도에서 만난 소년이 가장 원하는 것이 연필이라고 답한 경험에서 이름의 아이디어를 얻었다."},"blocking_vocab":[{"word":"non-profit organization","meaning":"비영리 단체"},{"word":"educational opportunity","meaning":"교육 기회"},{"word":"found","meaning":"설립하다"},{"word":"charity","meaning":"자선 단체"}],"checks":[{"type":"핵심","q":"이 글의 중심 내용으로 가장 알맞은 것은?","choices":["Adam Braun은 단체 설립 전에 학교 300개를 지었다.","한 소년의 연필 한 자루에서 시작한 단체가 교육 기회를 넓혔다.","연필 대신 태블릿을 주는 것이 교육의 핵심이라고 주장한다."],"answer":1,"why":"S2~5에서 연필을 원한 소년과 설립 전 활동, 설립 후 학교 건설·등교 지원이 이어진다.","refs":[2,3,4,5]},{"type":"순서·근거","q":"원문에서 연필과 펜을 나누어 준 시기는 언제인가?","choices":["소년을 만나기 전","Pencils of Promise를 설립하기 전","단체가 학교 300개를 세운 뒤"],"answer":1,"why":"S4의 before founding Pencils of Promise가 순서를 결정한다.","refs":[4]},{"type":"변형 탐지","q":"원문의 사실과 일치하는 문장은?","choices":["Before it was established in 2008, the charity had already built more than 300 schools.","Since it was established in 2008, the charity has built more than 300 schools."],"answer":1,"why":"S5는 2008년 설립 이래 300개 이상의 학교를 지었다고 한다. 설립 전으로 바꾸면 틀린다.","refs":[5]}],"easy_story":"인도에서 만난 아이에게 가장 갖고 싶은 것을 묻자 ‘연필’이라는 답이 돌아왔습니다. Adam은 교육받는 데 필요한 작은 물건조차 없는 아이들이 있다는 것을 알게 되었어요. 먼저 여러 나라에 연필과 펜을 나눠 주다가, 나중에는 학교를 짓고 학생·교사를 지원하는 단체를 세웠습니다. 단체 이름과 활동이 모두 이 만남에서 이어집니다."},{"id":"ch04-02","unit":"ch04","number":2,"title":"p47 · 독해훈련","sentences":[{"n":1,"en":"The history of science is littered with theories that scientists once believed, but which they now reject.","ko":"과학의 역사는 과학자들이 한때 믿었지만 지금은 인정하지 않는 이론들로 어지럽혀져 있다.","role":"주장 세우기 — 과학사는 버려진 이론의 더미라고 못 박는다."},{"n":2,"en":"For nearly two thousand years, bad air, or “miasma,” emanating from rotting organic matter was believed to be the chief cause of disease — until the nineteenth century, when other scientists found that the diseases are caused by germs.","ko":"거의 2천 년 동안, 썩어 가는 유기물에서 나오는 나쁜 공기, 즉 ‘독기’가 질병의 주요 원인 이라고 믿어졌는데, 다른 과학자들이 질병이 세균 에 의해 야기된다는 것을 발견한 19세기까지 그랬다.","role":"사례 제시 — 독기설이 세균설로 갈아치워진 일을 든다."},{"n":3,"en":"A thousand years of precision measurements and mathematical arguments had established that the Sun, planets, and stars all move around the stationary Earth — until a series of scientists, from Copernicus to Newton, questioned and overturned this theory.","ko":"천 년간의 정밀 측정 과 수학적 논증이 태양, 행성, 별들 모두가 움직이지 않는 지구 주변을 돌고 있다는 것을 확증했는데, 이는 코페르니쿠스에서 뉴턴에 이르기까지 일련의 과학자들이 의문을 제기하고 이 이론을 뒤집기까지였다.","role":"사례 추가 — 천 년을 버틴 천동설이 뒤집힌 일을 든다."},{"n":4,"en":"After that, Newton’s theory of universal gravitation was accepted as the true explanation of the motions of the Moon around the Earth and the Earth around the Sun.","ko":"이후 뉴턴의 만유인력 이론 은 지구 주위를 도는 달과 태양 주위를 도는 지구의 움직임에 대한 진정한 설명 으로 받아들여졌다.","role":"이어 붙이기 — 새 이론이 그 자리를 차지했다고 잇는다."},{"n":5,"en":"But today even Newton’s theory has been mostly pushed aside for Einstein’s theory of relativity.","ko":"그러나 오늘날 뉴턴의 이론조차도 아인슈타인의 상대성 이론에 대체로 밀려나 있다.","role":"맺음 — 뉴턴조차 예외가 아니라며 첫 주장으로 되돌아온다."}],"core":"과학사는 한때 믿었다가 버린 이론들로 가득하며 뉴턴조차 예외가 아니다.","flow":[{"label":"바뀌는 이론","sentences":"S1–2","text":"한때 믿었던 설명도 새 근거로 뒤집힌다. 질병의 독기설과 세균 발견이 첫 예다.","refs":[1,2]},{"label":"천동설에서 뉴턴까지","sentences":"S3–4","text":"천동설도 밀려나고 뉴턴의 중력 이론이 받아들여졌다.","refs":[3,4]},{"label":"다시 바뀐 설명","sentences":"S5","text":"오늘날에는 뉴턴의 설명조차 상대성 이론에 상당 부분 자리를 내주었다.","refs":[5]}],"structure":[{"title":"한때 참이던 이론","text":"독기설·천동설·뉴턴의 만유인력이 차례로 정설이었다"},{"title":"지금 밀려난 자리","text":"세균설·코페르니쿠스·아인슈타인에게 차례로 자리를 내주었다"}],"key_sentence_en":"Scientific theories that were once accepted as true have been overturned one after another, and even Newton’s theory has been pushed aside.","lead":"한때 받아들인 과학 이론은 왜 나중에 바뀔까?","image":"../../assets/daea1-ch04-02-theories.webp","image_alt":"옛 질병 원인설과 세균 발견, 지구 중심과 태양 중심 모형, 뉴턴의 중력과 이후 시공간 모형을 나란히 놓은 세 장면","image_caption":"S2~5의 세 사례를 그림으로 정리했다. 한때 타당하다고 믿었던 설명도 새 근거와 이론에 따라 바뀔 수 있다.","prediction":{"question":"뉴턴의 중력 이론도 나중에 바뀐 설명의 사례일까?","choices":["그렇다. 오늘날 상대성 이론에 상당 부분 밀려났다.","아니다. 이후의 과학 설명은 전혀 영향을 주지 못했다."],"answer":0,"actual":"S4~5는 뉴턴의 중력 이론이 받아들여졌지만 오늘날 아인슈타인의 상대성 이론에 상당 부분 자리를 내주었다고 한다."},"blocking_vocab":[{"word":"miasma","meaning":"나쁜 공기라는 옛 질병 원인설"},{"word":"stationary","meaning":"움직이지 않는"},{"word":"push aside","meaning":"밀어내다"}],"checks":[{"type":"핵심","q":"과학 이론에 관해 이 글이 강조하는 것은?","choices":["뉴턴의 이론은 지금까지 전혀 바뀌지 않았다.","한때 받아들인 이론도 새 설명에 의해 버려질 수 있다."],"answer":1,"why":"S1의 일반 진술 뒤에 질병 원인설·천동설·뉴턴 이론의 교체가 예시로 나온다.","refs":[1,2,3,5]},{"type":"순서·근거","q":"원문에서 뉴턴의 중력 이론 다음에 더 널리 쓰이게 된 설명은?","choices":["나쁜 공기인 미아즈마 이론","움직이지 않는 지구를 중심으로 한 설명","아인슈타인의 상대성 이론"],"answer":2,"why":"S4~5는 뉴턴 이론이 받아들여진 뒤 오늘날 아인슈타인의 상대성 이론에 상당 부분 밀려났다고 한다.","refs":[4,5]},{"type":"변형 탐지","q":"S2의 질병 원인 설명과 일치하는 것은?","choices":["Germs were once believed to cause disease, but bad air was later identified as the cause.","Bad air was once believed to cause disease, but germs were later identified as the cause."],"answer":1,"why":"S2의 옛 믿음은 나쁜 공기, 후대에 발견된 원인은 세균이다.","refs":[2]}],"easy_story":"과학자들이 오랫동안 맞다고 믿었던 설명도 새로운 발견 앞에서는 바뀔 수 있습니다. 질병의 원인을 ‘나쁜 공기’로 보던 설명은 세균 발견 뒤 밀려났고, 지구를 중심에 둔 우주 설명도 뒤집혔습니다. 한때 강력했던 뉴턴의 설명도 뒤에 나온 이론과 다시 비교됩니다. 글의 초점은 특정 과학자가 틀렸다는 비난보다 과학 지식이 고정되어 있지 않다는 점입니다."},{"id":"ch04-03","unit":"ch04","number":3,"title":"p49 · 독해훈련","sentences":[{"n":1,"en":"It is important to have members of a group meeting generate ideas individually before the group gets together for discussion.","ko":"그룹이 토론을 위해 모이기 전에 그룹 회의 구성원들이 개별적으로 아이디어를 낼 수 있도록 하는 것이 중요하다 .","role":"주장 세우기 — 토론에 앞서 혼자 생각해 두라고 내건다."},{"n":2,"en":"It is best if they write down their ideas and give them to the group leader in advance.","ko":"그들이 자신의 아이디어를 글로 써서 그룹 리더에게 미리 주는 것이 가장 좋다.","role":"절차 설명 — 먼저 글로 적어 미리 내라고 이른다."},{"n":3,"en":"The ideas then have to be distributed to the group members without saying who presented which ideas.","ko":"그런 다음 그 아이디어들은 누가 어떤 아이디어를 냈는지 언급 없이 그룹 구성원들에게 배포되어야 한다.","role":"절차 잇기 — 누가 냈는지 감춘 채 돌리라고 이른다."},{"n":4,"en":"This step minimizes the extent to which people can serve as immediate advocates for their ideas.","ko":"이런 단계가 사람들로 하여금 자신의 아이디어에 즉각적인 옹호자 가 되는 정도를 최소화한다 .","role":"까닭 대기 — 익명으로 돌리는 이유를 밝힌다."},{"n":5,"en":"After the ideas have been distributed, everyone should take some time to expand on them.","ko":"아이디어가 배포된 후 , 모두가 그것들을 확장시킬 시간을 가져야 한다.","role":"절차 맺기 — 받은 아이디어를 각자 키우게 한다."},{"n":6,"en":"After each group member has generated ideas and has had a chance to build on the ideas from other people, the group should have the opportunity to engage in discussion.","ko":"각각의 그룹 구성원이 아이디어를 내고 다른 사람들의 아이디어를 기반으로 발전시키는 기회를 가지고 난 뒤, 그 그룹은 토론에 참여할 기회를 가져야 한다.","role":"맺음 — 이 모두를 마친 뒤에야 토론이라고 매듭짓는다."}],"core":"토론에 앞서 각자 아이디어를 내고 익명으로 돌려 키운 뒤에야 그룹이 토론에 들어가야 한다.","flow":[{"label":"먼저 개별 작성","sentences":"S1–2","text":"모이기 전에 각자가 아이디어를 글로 적어 미리 제출한다.","refs":[1,2]},{"label":"익명 공유의 이유","sentences":"S3–4","text":"제안자를 밝히지 않고 배포해 자기 아이디어를 즉각 옹호하는 영향을 줄인다.","refs":[3,4]},{"label":"확장 뒤 토론","sentences":"S5–6","text":"서로의 아이디어를 발전시킬 시간을 가진 다음 그룹 토론을 시작한다.","refs":[5,6]}],"structure":[{"title":"문제 — 즉각적인 옹호","text":"바로 토론에 들어가면 자기 아이디어의 옹호자가 되어 버린다"},{"title":"해결 — 익명으로 돌리기","text":"미리 적어 내고 누가 냈는지 지운 채 돌린 뒤에야 토론한다"}],"key_sentence_en":"Members should generate and expand ideas on their own and receive them anonymously before the group begins its discussion.","lead":"토론을 바로 시작하기보다, 각자의 생각을 어떻게 나누고 키울까?","image":"../../assets/daea1-ch04-03-idea-sequence.webp","image_alt":"각자 종이에 생각을 적고, 이름 없는 종이를 나눠 읽은 뒤, 함께 토론하는 세 장면","image_caption":"S1~3, S5~6의 순서: 개별 작성 → 익명 공유 → 서로의 생각 확장 → 토론. 종이의 내용과 작성자 이름은 드러나지 않는다.","prediction":{"question":"회의 토론은 어느 단계 뒤에 시작하는 것이 좋을까?","choices":["처음부터 바로 토론한다.","개별 작성과 익명 공유, 아이디어 확장 뒤에 토론한다."],"answer":1,"actual":"S1~6은 먼저 각자 생각을 적어 익명으로 공유하고 다른 사람의 생각을 발전시킨 다음 토론하라고 한다."},"blocking_vocab":[{"word":"in advance","meaning":"미리"},{"word":"advocate","meaning":"옹호자"},{"word":"expand on","meaning":"~을 발전시키다"}],"checks":[{"type":"핵심","q":"글에서 권하는 회의 순서는?","choices":["개별 아이디어 작성 → 익명 공유 → 서로의 아이디어 확장 → 토론","토론 → 발표자 공개 → 개별 아이디어 작성"],"answer":0,"why":"S1~3, S5~6에 이 순서가 제시된다.","refs":[1,2,3,5,6]},{"type":"근거","q":"아이디어를 익명으로 배포하는 이유는?","choices":["제안자가 곧바로 자기 아이디어를 옹호하는 영향을 줄이기 위해","그룹 리더가 모든 아이디어를 혼자 결정하도록 하기 위해"],"answer":0,"why":"S3의 익명 배포에 이어 S4가 즉각적인 자기 아이디어 옹호를 줄인다고 설명한다.","refs":[3,4]},{"type":"변형 탐지","q":"토론을 시작할 시점에 관해 원문과 맞는 것은?","choices":["Members should discuss before generating ideas individually.","Members should discuss after generating and building on ideas."],"answer":1,"why":"S6은 각자 아이디어를 만들고 다른 사람의 생각을 발전시킬 기회를 가진 뒤 토론하라고 한다.","refs":[6]}],"easy_story":"회의를 시작하자마자 말하면 목소리가 큰 사람의 생각이나 자기 아이디어에 대한 방어가 토론을 이끌 수 있습니다. 그래서 먼저 각자가 따로 아이디어를 적고, 낸 사람의 이름 없이 서로에게 돌립니다. 남의 아이디어까지 발전시킬 시간을 가진 뒤에야 토론합니다. 순서를 이렇게 짠 이유는 처음 생각을 지키는 경쟁보다 아이디어 자체를 키우기 위해서예요."},{"id":"ch04-04","unit":"ch04","number":4,"title":"p51 · 독해훈련","sentences":[{"n":1,"en":"What surprises anyone in his or her introduction to medieval cooking is the rich variety of spices.","ko":"중세 요리를 처음 접한 사람을 놀라게 하는 것 은 풍부하고 다양한 양념이다.","role":"화제 열기 — 중세 요리에서 가장 먼저 눈에 띄는 것을 든다."},{"n":2,"en":"While a twentieth-century cook might prefer to emphasize one specific taste in a dish, using a limited number of aromatic ingredients, medieval cooks must have believed “more is better.”","ko":"20세기 요리사는 아마도 제한된 수의 향신료를 사용하면서 요리에서 한 가지 특정한 맛 을 강조하는 것을 선호하는 반면에, 중세 요리사는 ‘ 많을수록 좋다 ’라고 믿었음이 틀림없다.","role":"맞세우기 — 오늘날 요리사와 중세 요리사를 나란히 놓는다."},{"n":3,"en":"They used to have eight to ten seasonings in a single dish.","ko":"그들은 요리 하나 에 여덟에서 열 가지 의 양념을 사용하곤 했다.","role":"수치 제시 — 한 요리에 쓰던 양념 수를 숫자로 든다."},{"n":4,"en":"A record shows that spices in medieval times were too expensive to be much in evidence in the cooking pot, but this turned out to be untrue.","ko":"한 기록에 따르면, 중세 시대의 양념은 너무 비싸서 냄비 속에 눈에 띌 정도로 많이 넣을 수 없었다고 하지만, 이것은 사실이 아닌 것으로 밝혀졌다.","role":"뒤집기 — 값 때문에 못 썼다는 기록을 사실이 아니라고 친다."},{"n":5,"en":"Many spices may have been costly, but they were highly sought after.","ko":"많은 양념이 비쌌을지 모르지만, 그것들은 매우 인기 있었다.","role":"부연 — 비싼 값이 오히려 인기를 막지 못했다고 잇는다."},{"n":6,"en":"Some common seasonings, like pepper, continue to be standard in the modern kitchen.","ko":"후추와 같이 몇몇 흔한 양념 은 현대 주방에서도 계속 기본 이 되고 있다.","role":"오늘로 잇기 — 지금까지 기본으로 남은 양념을 든다."},{"n":7,"en":"Other often-used spices, such as cassia, are used more modestly now.","ko":"계피와 같이 자주 사용되던 다른 양념은 현재는 더 삼가서 사용된다.","role":"맺음 — 이제는 절제해 쓰는 양념까지 짚어 마무리한다."}],"core":"중세 요리사는 양념을 아낌없이 썼고 비싸서 못 썼다는 기록은 사실이 아니었다.","flow":[{"label":"도입","sentences":"S1","text":"중세 요리를 처음 접한 사람을 놀라게 하는 것은 풍부하고 다양한 양념이다","refs":[1]},{"label":"대비","sentences":"S2-3","text":"20세기 요리사와 달리 중세 요리사는 「많을수록 좋다」를 믿어 여덟에서 열 가지를 썼다","refs":[2,3]},{"label":"뒤집기","sentences":"S4","text":"비싸서 많이 못 썼다는 기록은 사실이 아닌 것으로 밝혀졌다","refs":[4]},{"label":"근거","sentences":"S5","text":"비쌌을지 몰라도 양념은 매우 인기가 있었다","refs":[5]},{"label":"오늘","sentences":"S6-7","text":"후추는 지금도 기본이고 계피는 더 삼가서 쓰인다","refs":[6,7]}],"structure":[{"title":"20세기 요리사","text":"향신료를 아껴 한 가지 맛을 도드라지게 한다"},{"title":"중세 요리사","text":"「많을수록 좋다」며 한 요리에 여덟에서 열 가지를 썼다"}],"key_sentence_en":"Medieval cooks used many spices in a single dish because spices were highly sought after, and some of them are still standard today.","lead":"중세 요리의 향신료는 비싸서 거의 쓰지 않았을까?","image":"../../assets/daea1-ch04-04-spices.webp","image_alt":"왼쪽 중세 요리사가 여러 향신료를 한 냄비에 넣고, 오른쪽 현대 요리사는 소수의 양념을 사용하는 비교 그림","image_caption":"S1~3의 중세 요리는 한 접시에 8~10가지 양념을 쓰기도 했다. 오른쪽은 S2의 현대 요리 방식과 비교한 장면이다.","prediction":{"question":"중세 요리사는 한 요리에 향신료를 어느 정도 썼을까?","choices":["비싸서 거의 쓰지 않았다.","한 요리에 8~10가지 양념을 쓰기도 했다."],"answer":1,"actual":"S3은 한 요리에 8~10가지 양념을 썼다고 하고, S4~5는 비싸서 거의 쓰지 않았다는 기록이 사실이 아니라고 정정한다."},"blocking_vocab":[{"word":"seasoning","meaning":"양념"},{"word":"sought after","meaning":"수요가 많은"},{"word":"modestly","meaning":"절제하여"}],"checks":[{"type":"핵심","q":"중세 요리의 양념 사용에 관한 설명으로 알맞은 것은?","choices":["양념이 비싸서 거의 모든 요리에서 빠졌다.","한 요리에 여러 양념을 쓰는 경향이 있었고, 비싸서 거의 쓰지 않았다는 기록은 사실이 아니었다."],"answer":1,"why":"S2~5가 풍부한 사용과 잘못된 기록을 대조한다.","refs":[2,3,4,5]},{"type":"수치·근거","q":"S3에서 중세 요리사는 한 요리에 몇 가지 양념을 쓰곤 했는가?","choices":["20~30가지","8~10가지","1가지"],"answer":1,"why":"S3에 eight to ten seasonings in a single dish라고 명시되어 있다.","refs":[3]},{"type":"변형 탐지","q":"오늘날 양념 사용에 관한 원문과 맞는 것은?","choices":["Cassia remains common, while pepper is used more modestly.","Pepper remains common, while cassia is used more modestly."],"answer":1,"why":"S6은 pepper가 여전히 표준적이고 S7은 cassia가 이제 더 절제되어 쓰인다고 한다.","refs":[6,7]}],"easy_story":"오늘의 요리사는 한 가지 맛을 살리려고 향신료를 제한할 수 있지만, 중세 요리사는 한 음식에 여러 양념을 함께 썼습니다. 그러니 ‘향신료가 비싸서 거의 못 넣었을 것’이라는 설명은 실제 사용 모습과 맞지 않아요. 비싸면서도 인기 있어서 많이 사용한 것입니다. 글은 현대의 조리법을 기준으로 중세 음식을 상상하면 생기는 오해를 바로잡습니다."},{"id":"ch04-05","unit":"ch04","number":5,"title":"p52 · READ & APPLY 1","sentences":[{"n":1,"en":"In a seminar for construction managers, a group engaged in a discussion about the importance of seeking input from work crews on job sites.","ko":"건설 관리자들을 위한 세미나에서, 한 집단이 작업 현장에서 직원들로부터 조언을 구하는 것의 중요성 에 대한 토론에 참가했다.","role":"장면 열기 — 세미나 토론의 주제를 먼저 놓는다."},{"n":2,"en":"Joe, a senior project manager, asked, “Won’t my people think I’m weak if I ask for their ideas?”","ko":"선임 프로젝트 관리자인 Joe는 “내가 직원들의 생각을 물으면 그들이 내가 약하다고 생각하지 않을까요?”라고 물었다.","role":"통념 세우기 — 물으면 약해 보인다는 걱정을 앞에 놓는다."},{"n":3,"en":"This led to a passionate discussion in which many of the younger participants shared their belief that when a boss asks for their contributions, they feel respected and included.","ko":"이것은 많은 젊은 참가자들이 상사가 그들의 기여를 요구할 때, 존중받고 포함되어 있다고 느낀다는 믿음을 공유하는 열정적인 토론으로 이어졌다.","role":"반박 — 젊은 참가자들이 정반대로 느낀다고 되받는다."},{"n":4,"en":"As the discussion continued, it became clear that the most important point was that they felt acknowledged when their suggestions were acted upon.","ko":"토론이 계속되면서, 가장 중요한 점은 그들이 자신들의 제안이 실행됐을 때 인정받는다고 느꼈다는 것임이 분명해졌다.","role":"핵심 짚기 — 묻는 데서 그치지 않고 실행까지 가야 한다고 짚는다."},{"n":5,"en":"As one of the participants explained, “It is so much better when the line of communication is open, and I feel that I’m being listened to.”","ko":"참가자들 중 한 명은 “ 소통 창구 가 열려 있을 때 훨씬 더 좋고, 내 말을 듣고 있다고 느낍니다.”라고 설명했다.","role":"인용 — 참가자의 말을 그대로 들어 앞말을 받친다."},{"n":6,"en":"In the old days of top-down hierarchy, Joe’s concern about asking and listening may have been well founded, but that world is fading.","ko":"하향식 계급제가 있던 구시대에서는 (직원의 조언을) 묻고 듣는 것에 대한 Joe의 걱정이 근거가 충분했을지 모르지만, 그런 세상은 사라지고 있다 .","role":"시대 가르기 — 그 걱정이 통하던 세상이 저물었다고 말한다."},{"n":7,"en":"Now being open to the influence of others is a key to expanding your influence.","ko":"이제 다른 사람들의 영향에 열려 있는 것 이 여러분의 영향력을 넓히는 열쇠이다.","role":"맺음 — 열린 태도가 영향력의 열쇠라고 매듭짓는다."}],"core":"의견을 물으면 약해 보일까 걱정하지만 사람들은 오히려 존중받는다고 느끼며 실행될 때 인정받는다.","flow":[{"label":"물음","sentences":"S1-2","text":"세미나에서 한 선임 관리자가 물으면 약해 보이지 않겠느냐고 걱정한다","refs":[1,2]},{"label":"반박","sentences":"S3","text":"젊은 참가자들은 상사가 기여를 구할 때 존중받는다고 느낀다고 말한다","refs":[3]},{"label":"핵심","sentences":"S4","text":"제안이 실행되었을 때 인정받는다고 느낀 것이 가장 중요한 점이었다","refs":[4]},{"label":"인용","sentences":"S5","text":"소통 창구가 열려 있고 내 말을 듣고 있다고 느낄 때 훨씬 좋다","refs":[5]},{"label":"맺음","sentences":"S6-7","text":"하향식 시대는 저물었고 남의 영향에 열려 있는 것이 영향력의 열쇠다","refs":[6,7]}],"structure":[{"title":"구시대의 걱정","text":"물으면 약해 보인다 — 하향식 계급제에서는 근거가 있었다"},{"title":"지금의 현장","text":"물어봐 주면 존중받는다고 느끼고 실행해 주면 인정받는다고 느낀다"}],"key_sentence_en":"Asking for and acting on others’ ideas makes people feel respected, so being open to their influence is now the key to expanding your own.","lead":"관리자가 작업자의 의견을 묻고 실제로 반영하면 어떻게 느낄까?","image":"../../assets/daea1-ch04-05-worker-input.webp","image_alt":"건설 현장 회의에서 작업자가 도면을 가리켜 의견을 말하고, 이어 관리자가 그 도면을 고치며 의견을 듣는 두 장면","image_caption":"S1~4의 의견 요청과 반영을 나타낸 개념 장면이다. 도면에 반영된 구체적인 제안 내용은 본문에 나오지 않는다.","prediction":{"question":"직원은 상사가 언제 더 인정해 준다고 느낄까?","choices":["의견을 묻기만 하고 아무 변화가 없을 때","의견을 듣고 실제로 그 제안을 반영할 때"],"answer":1,"actual":"S3은 의견을 물을 때 존중받는다고 느끼고 S4는 제안이 실행될 때 특히 인정받는다고 설명한다."},"blocking_vocab":[{"word":"seek input","meaning":"의견을 구하다"},{"word":"acknowledged","meaning":"인정받는"},{"word":"top-down hierarchy","meaning":"하향식 위계"}],"checks":[{"type":"핵심","q":"구성원 의견을 듣는 관리자에 대해 글이 말하는 것은?","choices":["의견을 구하면 언제나 약한 관리자로 여겨진다.","의견을 구하고 실제로 반영하면 존중과 인정감을 주며 영향력도 넓힐 수 있다."],"answer":1,"why":"S3~4와 S7이 구성원의 반응과 오늘날 영향력의 조건을 설명한다.","refs":[3,4,7]},{"type":"근거","q":"참여자들이 가장 중요하다고 느낀 것은?","choices":["자신의 제안이 실행되는 것","의견을 익명으로 제출하는 것","관리자가 회의를 줄이는 것"],"answer":0,"why":"S4에서 suggestions were acted upon일 때 인정받는다고 한다.","refs":[4]},{"type":"변형 탐지","q":"과거와 현재의 대비로 원문과 맞는 것은?","choices":["Joe's concern may have fit an old top-down hierarchy, but that world is fading.","Joe's concern fits the present because top-down hierarchy is becoming stronger."],"answer":0,"why":"S6은 하향식 위계의 시대가 사라지고 있다고 말한다.","refs":[6]}],"easy_story":"관리자는 직원에게 의견을 물으면 권위가 약해 보일까 걱정합니다. 하지만 직원 쪽에서는 자신의 의견을 묻는 행동을 존중과 참여의 표시로 받아들입니다. 특히 제안이 실제로 실행되면 ‘내 말을 들었다’는 느낌이 강해져요. 다른 사람의 영향을 받아들이는 것이 오히려 관리자의 영향력을 넓힐 수 있다는 결론입니다."},{"id":"ch04-06","unit":"ch04","number":6,"title":"p52 · READ & APPLY 2","sentences":[{"n":1,"en":"According to the Population Research Bureau (PRB), approximately 108 billion humans have populated the planet since the advent of the species.","ko":"인구조사국(PRB)에 따르면, 종(인류)의 출현 이후로 약 1,080억 명 의 인간이 지구에 거주해 왔다.","role":"수치 제시 — 지금까지 지구에 살았던 사람 수를 든다."},{"n":2,"en":"Each person who has come and gone was unique, and each of the 7.5 billion people alive today is unique.","ko":"왔다 간(태어나 살다 죽은) 사람마다 제각기 독특했고 , 오늘날 살아 있는 75억 인구 도 제각기 독특하다.","role":"전제 놓기 — 지난 사람도 지금 사람도 저마다 다르다고 세운다."},{"n":3,"en":"There’s no one like you in all of human history.","ko":"인류 역사 상 당신과 같은 사람은 없다.","role":"좁히기 — 그 이야기를 읽는 「당신」에게 곧장 대 본다."},{"n":4,"en":"The combination of your genetic endowment and the way that genetic material is influenced by your life experience results in a one-of-a-kind phenomenon.","ko":"당신의 유전적 자질 과 유전적 물질이 당신 삶의 경험에 의해 영향을 받는 방식의 조합은 독특한 현상 을 야기한다.","role":"까닭 대기 — 타고난 것과 겪은 것의 만남이 그 차이를 만든다."},{"n":5,"en":"And yet, in so many ways, we are all the same.","ko":"그럼에도 불구하고, 아주 많은 면에서, 우리는 모두 똑같다 .","role":"뒤집기 — 다름에서 같음으로 이야기를 돌려세운다."},{"n":6,"en":"Our basic human needs for air, food, shelter, security, esteem, love, and so on are universal.","ko":"공기, 음식, 주거, 안전, 존중, 사랑 등에 대한 우리의 기본적인 인간적 욕구 는 보편적 이다.","role":"근거 대기 — 누구에게나 같은 욕구를 늘어놓아 받친다."},{"n":7,"en":"Everyone, everywhere, in every culture wants respect.","ko":"모든 사람은, 어디서나, 모든 문화권에서 존중을 원한다.","role":"좁히기 — 그 보편성을 「존중」 하나로 모은다."},{"n":8,"en":"Leadership is the art of skillfully meeting universal human needs, including the need to be appreciated for being unique and the need for a sense of belonging and connection.","ko":"지도력은 독특한 존재로 인정받고자 하는 욕구와 소속 및 유대감에 대한 욕구를 포함하여, 보편적인 인간의 욕구를 능숙하게 충족시키는 기술이다.","role":"맺음 — 두 욕구를 함께 채우는 일이 지도력이라고 매듭짓는다."}],"core":"사람은 저마다 유일무이하지만 기본 욕구는 보편적이고 지도력은 그 둘을 함께 채우는 기술이다.","flow":[{"label":"수치","sentences":"S1","text":"인류 출현 이후 약 1,080억 명이 지구에 살아 왔다","refs":[1]},{"label":"전제","sentences":"S2-3","text":"지나간 사람도 오늘의 75억도 저마다 다르며 당신 같은 사람은 없다","refs":[2,3]},{"label":"까닭","sentences":"S4","text":"타고난 자질과 삶의 경험이 맞물려 유일무이한 현상을 낳는다","refs":[4]},{"label":"전환","sentences":"S5-7","text":"그럼에도 기본 욕구는 보편적이고 누구나 존중을 원한다","refs":[5,6,7]},{"label":"결론","sentences":"S8","text":"지도력은 독특함의 인정과 소속의 욕구를 함께 채우는 기술이다","refs":[8]}],"structure":[{"title":"다름","text":"1,080억 명이 살다 갔지만 당신과 같은 사람은 없다"},{"title":"같음","text":"공기·음식·안전·존중 같은 기본 욕구는 누구에게나 똑같다"}],"key_sentence_en":"Although every person is one of a kind, our basic needs are universal, and leadership means meeting both at once.","lead":"사람마다 서로 다르면서도 함께 공유하는 것은 무엇일까?","image":"../../assets/daea1-ch04-06-belonging.webp","image_alt":"서로 다른 사람들이 한자리에 모여 이야기하며 한 사람이 각자의 말을 고르게 듣는 장면","image_caption":"S2~8의 ‘각자는 고유하지만 존중과 소속을 바라는 공통 욕구가 있다’는 내용을 모임 장면으로 표현했다.","prediction":{"question":"지도력은 개인의 특별함과 공통 욕구 중 무엇을 고려해야 할까?","choices":["둘 다 고려해야 한다.","개인의 특별함만 고려하면 된다."],"answer":0,"actual":"S8은 고유한 존재로 인정받고 싶다는 욕구와 소속·연결의 욕구를 함께 충족하는 기술로 지도력을 설명한다."},"blocking_vocab":[{"word":"genetic endowment","meaning":"타고난 유전적 자질"},{"word":"universal","meaning":"보편적인"},{"word":"sense of belonging","meaning":"소속감"}],"checks":[{"type":"핵심","q":"지도력에 관해 글이 제시하는 핵심은?","choices":["모두에게 공통인 욕구와 각자의 독특함을 인정받고 싶은 욕구를 함께 충족하는 것","서로 다른 사람의 욕구를 모두 똑같다고 간주하는 것"],"answer":0,"why":"S5~8은 보편적 욕구와 유일한 존재로 존중받고 싶은 욕구를 함께 제시한다.","refs":[5,6,7,8]},{"type":"근거","q":"개인이 유일무이하게 되는 이유로 S4가 든 것은?","choices":["모든 사람에게 동일한 생활 경험","유전적 자질과 그것에 영향을 주는 삶의 경험의 결합"],"answer":1,"why":"S4의 genetic endowment와 life experience가 결합한다고 한다.","refs":[4]},{"type":"변형 탐지","q":"S6~8과 일치하는 문장은?","choices":["Basic needs are unique to each person, while nobody needs appreciation.","Basic needs are universal, while people also want to be appreciated as unique."],"answer":1,"why":"보편적인 기본 욕구와 고유한 사람으로 인정받을 욕구가 모두 나온다.","refs":[6,8]}],"easy_story":"세상에는 같은 사람이 한 명도 없습니다. 타고난 특징과 살아온 경험이 사람마다 다르기 때문입니다. 하지만 공기·음식·안전·존중처럼 누구에게나 필요한 것도 있습니다. 좋은 지도력은 ‘각자 다르다’는 점만 보거나 ‘다 똑같다’고 묶는 것이 아니라, 개인을 알아보면서 공통된 욕구도 채우는 일입니다."},{"id":"ch04-07","unit":"ch04","number":7,"title":"p53 · READ & APPLY 3","sentences":[{"n":1,"en":"The arguments in favor of a single language of air traffic control are obvious.","ko":"항공 교통 관제의 단일 언어 에 찬성하는 주장은 명확하다 .","role":"주장 세우기 — 단일 언어에 찬성하는 근거가 뚜렷하다고 연다."},{"n":2,"en":"It is much safer if all pilots understand all conversations.","ko":"모든 조종사들이 모든 대화 를 이해할 수 있다면 훨씬 더 안전 하다.","role":"까닭 짚기 — 다 알아들으면 더 안전하다는 이유를 먼저 든다."},{"n":3,"en":"Pilots who have a two-way radio are supposed to always keep listening attentively on the appropriate frequency.","ko":"쌍방향 무전기 를 가진 조종사들은 항상 적절한 주파수로 주의를 기울여 계속 수신 하도록 되어 있다.","role":"규칙 들기 — 조종사가 늘 무엇을 듣게 되어 있는지 밝힌다."},{"n":4,"en":"They listen not only to messages addressed to themselves, but also to messages that are being sent to and from other pilots in their neighborhood.","ko":"그들은 자신들에게 전달되는 메시지뿐만 아니라 인근에 있는 다른 조종사들에게 오가는 메시지도 듣는다.","role":"범위 넓히기 — 듣는 대상이 남의 교신까지라고 짚는다."},{"n":5,"en":"In this way they can learn about weather and traffic conditions from other pilots, without having to keep referring to air traffic control.","ko":"이런 식으로 그들은 항공 교통 관제에 계속 문의하지 않고도 다른 조종사들로부터 날씨와 교통 상황 에 대해 알 수 있다.","role":"이득 제시 — 관제에 묻지 않고도 정보를 얻는다고 든다."},{"n":6,"en":"Furthermore, if they hear an error in someone else’s communications, they can draw attention to it.","ko":"게다가, 다른 누군가의 대화에서 오류를 듣게 되면 , 그들은 그것에 주의를 끌 수 있다.","role":"이득 추가 — 남의 실수까지 잡아낼 수 있다고 덧붙인다."},{"n":7,"en":"If more than one language is being used, the risk of a breakdown in communication inevitably increases.","ko":"둘 이상의 언어 가 사용되고 있다면, 의사소통 단절의 위험이 필연적으로 증가한다.","role":"맺음 — 언어가 둘 이상이면 위험이 커진다고 뒤집어 매듭짓는다."}],"core":"단일 언어라야 모든 조종사가 모든 교신을 알아들어 안전하고, 언어가 둘이면 위험이 커진다.","flow":[{"label":"주장","sentences":"S1-2","text":"단일 언어에 찬성하는 근거는 뚜렷하며 다 알아들으면 훨씬 안전하다","refs":[1,2]},{"label":"규칙","sentences":"S3","text":"무전기를 가진 조종사는 늘 적절한 주파수를 주의 깊게 듣게 되어 있다","refs":[3]},{"label":"범위","sentences":"S4","text":"자기 교신뿐 아니라 인근 조종사의 교신까지 듣는다","refs":[4]},{"label":"이득","sentences":"S5-6","text":"관제에 묻지 않고 날씨와 교통을 알고 남의 오류도 짚을 수 있다","refs":[5,6]},{"label":"맺음","sentences":"S7","text":"언어가 둘 이상이면 의사소통 단절의 위험이 필연적으로 커진다","refs":[7]}],"structure":[{"title":"원인 — 단일 언어","text":"모든 조종사가 모든 교신을 알아듣는다"},{"title":"결과 — 안전","text":"관제에 묻지 않고 정보를 얻고 남의 교신에서 오류까지 잡아낸다"}],"key_sentence_en":"A single language lets every pilot follow every conversation, so using more than one language inevitably raises the risk of a breakdown in communication.","lead":"조종사는 자기 비행기에게 온 교신만 들어도 안전할까?","image":"../../assets/daea1-ch04-07-radio.webp","image_alt":"조종석에서 무전을 듣는 조종사와 주변의 다른 두 항공기, 앞쪽의 날씨 상황을 함께 보여 주는 그림","image_caption":"S2~5: 같은 무선 주파수의 주변 교신을 이해하면 다른 조종사가 전하는 날씨와 항공기 이동 정보도 얻는다. 곡선은 교신을 뜻하는 그림 표시다.","prediction":{"question":"조종사가 주변 다른 비행기의 교신도 이해해야 하는 이유는?","choices":["날씨·주변 항공기·오류 정보를 함께 파악할 수 있어서","자기에게 온 메시지만 들으면 모든 정보를 알 수 있어서"],"answer":0,"actual":"S2~6은 모든 교신을 이해하고 들으면 날씨와 교통 상황을 알며 다른 교신의 오류도 알아차릴 수 있다고 설명한다."},"blocking_vocab":[{"word":"air traffic control","meaning":"항공 교통 관제"},{"word":"frequency","meaning":"무선 주파수"},{"word":"breakdown in communication","meaning":"의사소통 장애"}],"checks":[{"type":"핵심","q":"항공 관제에 단일 언어가 필요한 가장 큰 이유는?","choices":["조종사가 자기에게 온 메시지만 들으면 되기 때문","조종사가 모든 교신을 이해해 위험과 오류를 알아챌 수 있기 때문"],"answer":1,"why":"S2와 S4~7이 다른 조종사의 교신까지 이해하는 안전상 이점을 설명한다.","refs":[2,4,5,6,7]},{"type":"근거","q":"조종사가 다른 조종사들의 교신도 듣는 까닭은?","choices":["날씨·교통 상황을 파악하고 통신 오류를 지적할 수 있어서","관제사의 업무를 완전히 없애기 위해서"],"answer":0,"why":"S5~6이 두 효과를 명시한다.","refs":[5,6]},{"type":"변형 탐지","q":"여러 언어 사용의 결과에 관해 원문과 맞는 것은?","choices":["Using more than one language increases the risk of a communication breakdown.","Using more than one language inevitably removes the risk of a communication breakdown."],"answer":0,"why":"S7의 increases를 removes로 뒤집으면 의미가 반대가 된다.","refs":[7]}],"easy_story":"조종사는 자기 비행기에 오는 무전만 듣지 않습니다. 주변 비행기와 관제사의 대화도 듣고 날씨·교통 상황을 파악하거나 오류를 발견할 수 있어요. 그런데 교신 언어가 서로 다르면 남에게 오가는 중요한 정보를 알아듣지 못할 수 있습니다. 그래서 이 글은 항공 교통 관제에서 모두가 이해하는 한 언어가 안전에 유리하다고 주장합니다."},{"id":"ch04-08","unit":"ch04","number":8,"title":"p53 · READ & APPLY 4","sentences":[{"n":1,"en":"Whether you have a “favorite” child is clearly in the eye of the beholder.","ko":"여러분에게 ‘편애하는’ 자녀가 있는지 여부 는 분명 보는 사람의 눈 에 달려 있다.","role":"주장 세우기 — 편애를 정하는 쪽이 부모가 아니라고 못 박는다."},{"n":2,"en":"That is, if your child thinks you play favorites, then you may as well accept it: You play favorites.","ko":"즉, 여러분의 자녀가 여러분이 편애한다고 생각한다면, 그것을 받아들이는 편이 낫다. 여러분이 편애하고 있다고 말이다.","role":"바꿔 말하기 — 아이가 그렇게 여기면 그게 곧 편애라고 잇는다."},{"n":3,"en":"To a child, a parent who treats different children differently is playing favorites.","ko":"아이 입장에서 , 다른 아이들을 다르게 대하는 부모는 편애하고 있는 것이다.","role":"잣대 대기 — 아이의 셈법으로는 다르게 대함이 곧 편애다."},{"n":4,"en":"Suppose you allow your 15-year-old to stay out until 9:00 on weekend nights, but insist that your 13-year-old be in by 6:00.","ko":"여러분이 15세 아이에게는 주말 밤에 9시까지 밖에 있는 것을 허락하지만, 13세 아이에게는 6시까지 들어와야 한다고 주장하는 것을 가정해 보자.","role":"사례 제시 — 통금 시간을 나이별로 다르게 잡아 본다."},{"n":5,"en":"You will undoubtedly be accused of being unfair.","ko":"여러분은 당연히 불공평한 것에 대해 비난을 받을 것이다.","role":"결과 보이기 — 그렇게 하면 반드시 비난을 듣는다고 잇는다."},{"n":6,"en":"Likewise, if your 15-year-old notices that his younger sibling is not required, as he used to be at that age, to mow the lawn every Saturday morning, again you are playing favorites.","ko":"마찬가지로, 여러분의 15세 자녀가 자신은 동생 나이 때 매주 토요일 아침 잔디를 깎으라는 요구를 받았지만 동생은 그런 요구를 받지 않는다는 것을 알게 되면, 여러분은 다시 편애를 하는 셈이다.","role":"사례 추가 — 집안일 면제도 첫째에게는 편애로 보인다."},{"n":7,"en":"No matter that the 13-year-old can’t distinguish between flower beds and grass.","ko":"13세 아이가 화단과 잔디 를 구별하지 못하는 것은 중요하지 않다 .","role":"물러서기 — 면제에 그럴듯한 까닭이 있어도 소용없다고 친다."},{"n":8,"en":"Your firstborn child will no doubt take this as discrimination, and no explanation will convince him.","ko":"여러분의 첫째 아이는 의심의 여지 없이 이것을 차별로 받아들일 것이고, 어떤 해명도 그를 설득하지 못할 것이다.","role":"맺음 — 첫째는 차별로 못 박고 어떤 해명도 통하지 않는다."}],"core":"편애인지 아닌지는 부모가 아니라 그것을 보는 아이가 정하며 해명은 통하지 않는다.","flow":[{"label":"주장","sentences":"S1-2","text":"편애 여부는 보는 사람의 눈에 달렸고 아이가 그렇게 여기면 그것이 편애다","refs":[1,2]},{"label":"잣대","sentences":"S3","text":"아이에게는 다르게 대하는 부모가 곧 편애하는 부모다","refs":[3]},{"label":"보기","sentences":"S4-5","text":"통금을 나이별로 다르게 정하면 반드시 불공평하다는 비난을 듣는다","refs":[4,5]},{"label":"보기","sentences":"S6","text":"동생만 잔디 깎기를 면제받아도 다시 편애가 된다","refs":[6]},{"label":"맺음","sentences":"S7-8","text":"까닭이 있어도 소용없고 첫째는 차별로 받아들여 어떤 해명도 통하지 않는다","refs":[7,8]}],"structure":[{"title":"부모의 눈","text":"나이에 맞춰 다르게 대했을 뿐 그럴 만한 까닭이 있다"},{"title":"아이의 눈","text":"다르게 대하는 것이 곧 편애이고 어떤 해명도 통하지 않는다"}],"key_sentence_en":"Favoritism is decided by the child who sees it, so treating children differently looks like discrimination no matter how good the reason is.","lead":"부모의 설명이 있어도 아이는 왜 편애라고 느낄 수 있을까?","image":"../../assets/daea1-ch04-08-fairness.webp","image_alt":"두 형제자매의 서로 다른 귀가 시각을 설명하는 부모와, 잔디 깎는 일의 차이를 지적하는 큰아이의 두 장면","image_caption":"S4의 9시와 6시 귀가 시각 차이, S6~8의 잔디 깎는 일 차이를 아이가 불공평하게 느끼는 예시다. 실제 편애가 입증되었다는 뜻은 아니다.","prediction":{"question":"부모가 차이를 설명하면 큰아이는 곧바로 납득할까?","choices":["그렇다. 설명이 모든 의심을 없앤다.","아니다. 아이가 보는 차이는 편애로 남을 수 있다."],"answer":1,"actual":"S1~3은 판단이 아이의 시각에 달렸다고 하고 S8은 설명으로도 큰아이를 설득하기 어렵다고 한다."},"blocking_vocab":[{"word":"in the eye of the beholder","meaning":"보는 사람에게 달린"},{"word":"play favorites","meaning":"편애하다"},{"word":"discrimination","meaning":"차별"}],"checks":[{"type":"핵심","q":"글에서 편애 여부를 결정하는 시각은 누구의 것인가?","choices":["차이를 대우받는다고 느끼는 아이의 시각","해명하는 부모의 의도만"],"answer":0,"why":"S1~3과 S8은 아이가 다르게 대우받는다고 느끼면 부모의 설명이 통하지 않을 수 있다고 한다.","refs":[1,2,3,8]},{"type":"사례 근거","q":"큰아이에게 적용된 주말 귀가 시간은?","choices":["오후 6시","자정","밤 9시"],"answer":2,"why":"S4는 15세에게 밤 9시, 13세에게 오후 6시를 제시한다.","refs":[4]},{"type":"변형 탐지","q":"부모의 설명에 관한 원문과 맞는 것은?","choices":["No explanation will convince the firstborn child in the lawn-mowing example.","An explanation will certainly convince the firstborn child in the lawn-mowing example."],"answer":0,"why":"S8은 어떤 설명도 큰아이를 납득시키지 못한다고 한다.","refs":[6,7,8]}],"easy_story":"부모는 나이와 능력이 달라서 자녀에게 다른 규칙을 적용했다고 설명할 수 있습니다. 그러나 더 일찍 귀가하거나 예전에 혼자 잔디를 깎았던 아이는 차이를 먼저 보고 ‘편애’라고 느낄 수 있어요. 이 글은 부모의 이유가 옳은지 판정하기보다, 편애를 느끼는 아이의 시각에서는 해명만으로 그 인식이 쉽게 사라지지 않는다고 말합니다."},{"id":"ch04-09","unit":"ch04","number":9,"title":"p54 · READ & APPLY 5","sentences":[{"n":1,"en":"Improving the infrastructure, landscape design, and building management to provide access to green walkable spaces provides a sustainable solution for promoting health and reducing morbidity.","ko":"걸어서 다닐 수 있는 녹지 공간에 대한 접근을 제공하기 위해 사회 기반 시설과 경관 설계, 건물 관리를 개선하는 것은 건강 증진과 질병률 감소 를 위한 지속 가능한 해결책 을 제시한다.","role":"해법 내걸기 — 걷기 좋은 녹지를 늘리는 일을 답으로 내놓는다."},{"n":2,"en":"Walkable neighborhoods reduce obesity and diabetes rates regardless of age, gender, or socioeconomic status.","ko":"걷기에 적합한 지역은 나이나 성별, 사회 경제적 지위에 상관없이 비만과 당뇨 를 줄여 준다.","role":"근거 제시 — 누구에게나 몸에 이롭다는 결과를 든다."},{"n":3,"en":"Researchers have even found that those living in areas characterized by dense greenspace have reduced mortality in comparison to those living in areas devoid of greenspace.","ko":"연구자들은 심지어 빽빽한 녹지 공간 이 특징인 지역에 사는 사람들이 녹지 공간이 없는 지역에 사는 사람들에 비해 사망률 이 감소했다는 것을 발견했다.","role":"근거 추가 — 녹지가 빽빽한 곳의 사망률이 더 낮다고 든다."},{"n":4,"en":"Their cognitive function has been shown to improve as well.","ko":"그들의 인지 기능 도 향상되는 것으로 나타났다.","role":"근거 보태기 — 몸에 이어 머리에도 이롭다고 덧붙인다."},{"n":5,"en":"While the environmental, physical, and mental health benefits are clearly documented, the value that greenspace has for the health of the overall community can be tremendous.","ko":"환경적, 신체적 및 정신적 건강상의 이점이 명확하게 문서화되었지만, 녹지 공간이 전체 지역 사회 의 건강에 대해 갖는 가치는 엄청날 수 있다.","role":"넓히기 — 개인의 건강에서 지역 사회의 가치로 눈을 옮긴다."},{"n":6,"en":"Civic engagement facilities, recreational and natural parks, as well as outdoor recreation facilities can have clear benefits for fostering positive social ties and a sense of place and can build social capital among individuals and groups.","ko":"야외 휴양 시설은 물론 시민 참여시설, 휴양 및 자연공원이 긍정적인 사회적 유대 와 장소 감각을 발전시키는데 분명한 혜택을 줄 수 있고, 개인들 간 그리고 단체들 간의 사회적 자본 을 만들어 낼 수 있다.","role":"맺음 — 시설과 공원이 사회적 자본까지 쌓는다고 매듭짓는다."}],"core":"걷기 좋은 녹지로 가는 길을 넓히면 개인의 건강을 넘어 지역 사회의 자본까지 자란다.","flow":[{"label":"녹지 접근","sentences":"S1–2","text":"녹지와 걷기 좋은 환경을 넓히는 것은 여러 사람의 건강에 도움이 된다.","refs":[1,2]},{"label":"건강 근거","sentences":"S3–4","text":"녹지가 많은 곳은 사망률이 낮고 인지 기능도 나아지는 것으로 나타난다.","refs":[3,4]},{"label":"사회적 이익","sentences":"S5–6","text":"건강을 넘어 사회적 유대와 자본도 강화할 수 있다.","refs":[5,6]}],"structure":[{"title":"원인 — 걷기 좋은 녹지","text":"시설·경관·건물 관리를 고쳐 녹지로 가는 길을 넓힌다"},{"title":"결과 — 건강과 공동체","text":"비만·당뇨·사망률이 낮아지고 인지 기능과 사회적 자본까지 자란다"}],"key_sentence_en":"Better access to green walkable spaces improves individual health and also builds social ties and social capital in the whole community.","lead":"걷기 좋은 녹지는 개인의 건강만 돕는 것일까?","image":"../../assets/daea1-ch04-09-greenwalk.webp","image_alt":"집에서 나와 나무가 빽빽한 공원으로 이어지는 보행로에서 주민들이 걷고 이웃과 이야기하는 장면","image_caption":"S1~6의 걷기 좋은 녹지 접근과 S6의 긍정적인 사회적 관계를 나타낸다. 건강 효과를 개인에게 보장한다는 뜻은 아니다.","prediction":{"question":"녹지 보행 공간의 가치가 개인의 신체 건강에서 끝날까?","choices":["아니다. 지역 사회의 관계와 소속감에도 이어진다.","그렇다. 공동체와는 아무 관계가 없다."],"answer":0,"actual":"S5~6은 개인 건강을 넘어 사회적 유대, 장소에 대한 소속감, 사회적 자본을 말한다."},"blocking_vocab":[{"word":"morbidity","meaning":"질병률"},{"word":"dense greenspace","meaning":"녹지가 밀집한 공간"},{"word":"social capital","meaning":"사회적 자본"}],"checks":[{"type":"핵심","q":"걷기 좋은 녹지의 효과로 글이 강조하는 범위는?","choices":["개인의 건강과 지역 사회의 유대·사회적 자본 모두","개인의 운동량만"],"answer":0,"why":"S1~4는 개인의 건강, S5~6은 공동체 유대와 사회적 자본을 말한다.","refs":[1,2,3,4,5,6]},{"type":"근거","q":"S2에서 걷기 좋은 동네의 효과로 든 것은?","choices":["녹지 없는 지역의 사망률 감소","비만과 당뇨병 비율 감소"],"answer":1,"why":"S2는 reduce obesity and diabetes rates라고 한다.","refs":[2]},{"type":"변형 탐지","q":"S6의 공동체 효과와 일치하는 것은?","choices":["Parks and outdoor facilities can foster social ties and build social capital.","Parks and outdoor facilities weaken social ties and reduce social capital."],"answer":0,"why":"S6의 foster와 build를 반대 의미로 바꾸면 틀린다.","refs":[6]}],"easy_story":"동네에 걷기 좋은 녹지가 있으면 사람들이 움직이기 쉬워지고 건강에 도움이 될 수 있습니다. 글은 비만·당뇨, 사망률, 인지 기능에 관한 근거를 차례로 듭니다. 효과는 개인 몸에서 끝나지 않아요. 공원과 야외 시설에서 사람들이 만나면 유대감과 지역 사회의 연결도 커질 수 있다는 방향으로 확장됩니다."}]},{"id":"ch05","label":"5과 · 형용사적 수식어구","scope":"p59~64 · 독해만","passages":[{"id":"ch05-01","unit":"ch05","number":1,"title":"p59 · 독해훈련","sentences":[{"n":1,"en":"When you make an apology, look for ways to undo some of the hurt you have caused.","ko":"여러분이 사과 를 할 때, 여러분이 야기한 상처를 어느 정도 원상태로 돌리는 방법을 찾아라.","role":"당부 열기 — 사과할 땐 상처를 되돌릴 길을 찾으라고 이른다."},{"n":2,"en":"The goal here is not to bribe someone into liking you again, but to let him or her know you really care and feel bad about what you have done.","ko":"여기서 목적은 누군가에게 뇌물 을 써서 여러분을 다시 좋아하게 하는 것이 아니라, 여러분이 저지른 일에 대해 정말로 신경 쓰고 죄책감 을 느낀다는 것을 상대방이 알게 하는 것이다.","role":"목적 밝히기 — 환심 사기가 아니라 진심을 알리는 일이라 못 박는다."},{"n":3,"en":"If you blow off your friend, why not make plans to do something your friend loves?","ko":"만약 여러분이 친구를 바람맞힌다면 , 친구가 정말 좋아하는 무언가를 할 계획을 세우는 것이 어떻겠는가?","role":"사례 제시 — 친구를 바람맞혔다면 좋아하는 일을 계획하라고 든다."},{"n":4,"en":"That will show you care about your friend and the friendship.","ko":"그것은 여러분이 친구와 우정 에 대해 신경 쓴다는 것을 보여 줄 것이다.","role":"효과 — 그 행동이 마음을 보여 준다고 짚어 준다."},{"n":5,"en":"The same goes if your dad is upset that you borrowed his car and returned it with soda cans rolling around on the floorboard.","ko":"여러분이 아버지의 차를 빌렸다가 바닥에 음료수 캔 이 여기저기 굴러다니는 채로 돌려주어 아버지가 화가 난 경우에도 마찬가지이다 .","role":"사례 추가 — 아버지 차를 어지럽힌 경우로 같은 이치를 잇는다."},{"n":6,"en":"Make him an offer to clean it inside and out the next day.","ko":"다음 날 아버지에게 차를 안팎으로 세차하겠다고 제안해 보라.","role":"행동 제안 — 다음 날 세차하겠다고 나서 보라고 구체화한다."},{"n":7,"en":"Then, he may allow you to use his car again.","ko":"그러면, 아버지는 여러분이 차를 다시 쓸 수 있도록 허락해 줄지도 모른다.","role":"효과 — 그러면 다시 차를 빌려 줄지 모른다고 그려 준다."},{"n":8,"en":"If what you’ve done is a minor offence, a verbal apology should do, but if the hurt person is too upset to forgive or forget it, you should be sincere about your action plans.","ko":"만약 여러분이 저지른 일이 사소한 실수 라면 말로 하는 사과가 효과가 있을 테지만, 만약 마음상한 사람이 너무 화가 나 용서를 못 하거나 잊지 못한다면, 여러분은 행동 계획에 진심을 다해야 한다.","role":"맺음 — 사소하면 말로, 크면 행동으로 갚으라고 닫는다."}],"core":"사과할 때는 준 상처를 되돌릴 방법을 찾아야 하고, 상대가 많이 상했다면 행동 계획에 진심을 담아야 한다.","flow":[{"label":"지시","sentences":"S1","text":"사과할 때는 자신이 야기한 상처를 되돌릴 방법을 찾으라","refs":[1]},{"label":"목적","sentences":"S2","text":"환심을 사려는 것이 아니라 진심으로 마음 쓴다는 것을 알리는 것이다","refs":[2]},{"label":"예시","sentences":"S3-4","text":"친구를 바람맞혔다면 친구가 좋아할 일을 할 계획을 세워 본다","refs":[3,4]},{"label":"예시","sentences":"S5-7","text":"아버지 차를 지저분하게 돌려줬다면 세차를 제안한다","refs":[5,6,7]},{"label":"정리","sentences":"S8","text":"사소하면 말로 족하지만 많이 상했다면 행동 계획에 진심을 담아야 한다","refs":[8]}],"structure":[{"title":"문제 — 내가 준 상처","text":"바람맞히거나 빌린 물건을 함부로 다뤄 상대가 상했다"},{"title":"해결 — 되돌릴 행동","text":"환심이 아니라 상처를 되돌리는 구체적인 행동 계획을 내놓는다"}],"key_sentence_en":"When you make an apology, look for ways to undo some of the hurt you have caused, and if the hurt person is too upset, you should be sincere about your action plans.","lead":"진심 어린 사과는 말만 하는 것일까, 상처를 되돌릴 행동까지 제안하는 것일까?","image":"../../assets/daea1-ch05-01-apology.webp","image_alt":"차 바닥에 음료수 캔이 놓여 있고, 십대가 아버지에게 빈손으로 차 안을 가리키며 이야기하는 장면","image_caption":"차를 지저분하게 돌려준 뒤에는 다음 날 안팎으로 세차하겠다고 제안하는 것이 본문의 예시다. 그림은 제안하는 순간을 나타낸다.","prediction":{"question":"사과의 목적을 글쓴이는 무엇이라고 볼까?","choices":["상대가 다시 나를 좋아하게 만드는 것","상처를 되돌릴 방법을 찾아 진심을 행동으로 보이는 것"],"answer":1,"actual":"S1~2는 환심을 사는 것이 아니라 상처를 되돌릴 방법을 찾고 진심으로 마음 쓴다는 것을 알리는 것이라고 한다."},"blocking_vocab":[{"word":"undo the hurt","meaning":"준 상처를 어느 정도 되돌리다"},{"word":"bribe A into -ing","meaning":"A에게 뇌물을 써서 ~하게 하다"},{"word":"blow off","meaning":"바람맞히다"},{"word":"floorboard","meaning":"자동차 바닥"},{"word":"verbal apology","meaning":"말로 하는 사과"}],"checks":[{"type":"핵심","q":"글쓴이가 강조하는 사과의 방식은?","choices":["상처의 정도에 맞게 말이나 진심 어린 행동 계획으로 보상하기","사과하지 않고 시간이 지나기를 기다리기","상대의 호감을 되찾기 위해 어떤 수단이든 쓰기"],"answer":0,"why":"S1~2와 S8은 상처를 되돌릴 방법을 찾되, 큰 상처에는 진심 어린 행동 계획이 필요하다고 정리한다.","refs":[1,2,8]},{"type":"지칭","q":"S4의 That이 가리키는 행동은?","choices":["친구가 좋아하는 일을 함께할 계획을 세우는 것","친구를 계속 바람맞히는 것","아버지의 차를 다시 빌리는 것"],"answer":0,"why":"S3에서 제안한 make plans to do something your friend loves를 받는다.","refs":[3,4]},{"type":"변형 탐지","q":"S8의 뜻과 일치하는 문장을 고르세요.","choices":["For a minor offence, a verbal apology is never enough; for deeper hurt, an action plan is unnecessary.","For a minor offence, a verbal apology may be enough; for deeper hurt, sincere action plans matter."],"answer":1,"why":"S8은 사소한 실수와 큰 상처를 구분하고, 후자에는 진심 어린 행동 계획이 필요하다고 한다.","refs":[8]}],"easy_story":"사과는 ‘미안해’라는 말로만 끝나지 않을 때가 있습니다. 친구와 약속을 어겼다면 함께할 일을 마련하고, 빌린 차를 더럽혔다면 직접 씻겠다고 제안하는 식입니다. 상대의 환심을 돈이나 선물로 사려는 것이 아니라, 내가 만든 문제를 바로잡으려 한다는 것을 행동으로 보여 주는 거예요. 상처가 클수록 말보다 이런 계획이 중요해집니다."},{"id":"ch05-02","unit":"ch05","number":2,"title":"p61 · 독해훈련","sentences":[{"n":1,"en":"Some economies of scale are a result of the statistical law of large numbers.","ko":"일부 규모의 경제 는 큰 숫자의 통계 법칙 의 결과이다.","role":"연결 짓기 — 규모의 경제 일부가 통계 법칙에서 온다고 잇는다."},{"n":2,"en":"Loosely speaking, the law of large numbers states that the closer the average value of a sample of objects chosen randomly from some population is to the true mean of the population, the larger the size of the sample.","ko":"대략적으로 말해서, 큰 숫자의 법칙은 어떤 모집단에서 무작위로 선택된 대상 표본의 평균값이 모집단의 실제 평균에 가까울수록 그 표본의 크기가 더 크다고 진술한다.","role":"뜻풀이 — 표본이 클수록 참값에 가깝다는 법칙을 풀어 준다."},{"n":3,"en":"For example, there is much less variation in the death rate of a large population like the United States — i.e., the number of deaths per year divided by the population — than in the death rate of a small town.","ko":"예를 들어, 미국과 같은 큰 모집단의 사망률, 즉 연간 사망자 수 를 인구로 나눈 수는 작은 마을의 사망률보다 훨씬 더 변동이 적다 .","role":"보기 들기 — 큰 나라와 작은 마을의 사망률을 견주어 든다."},{"n":4,"en":"The current death rate of the U.S. population is about 720 per 100,000 per year, and does not change much from year to year.","ko":"현재 미국 인구의 사망률은 연간 10만 명당 720명 정도로 해마다 크게 변하지 않는다.","role":"수치 제시 — 미국은 10만 명당 720명으로 해마다 고르다고 든다."},{"n":5,"en":"In a small town with a population of 500, however, there may be only one death in one year, but seven in the following year, and four the year after that, and so on.","ko":"그러나, 인구 500명의 작은 마을에서는 한 해에 1명만이 , 이듬해에는 7명이, 그 다음 해에는 4명이 사망하는 식이다.","role":"맺음 — 500명 마을은 1·7·4명으로 들쭉날쭉하다고 맞세워 맺는다."}],"core":"표본이 클수록 평균이 실제 평균에 가까워지므로 큰 모집단은 작은 마을보다 변동이 훨씬 적다.","flow":[{"label":"큰 수의 법칙","sentences":"S1–2","text":"표본이 커질수록 그 평균은 모집단의 실제 평균에 가까워진다.","refs":[1,2]},{"label":"큰 모집단","sentences":"S3–4","text":"미국처럼 큰 모집단의 사망률은 해마다 변화가 적다.","refs":[3,4]},{"label":"작은 마을","sentences":"S5","text":"인구가 적은 마을에서는 해마다 사망자 수가 크게 달라질 수 있다.","refs":[5]}],"structure":[{"title":"큰 모집단 — 미국","text":"사망률이 10만 명당 720명 안팎으로 해마다 거의 그대로다"},{"title":"작은 마을 — 500명","text":"한 해 1명, 이듬해 7명으로 들쭉날쭉하다"}],"key_sentence_en":"The law of large numbers states that the closer a sample average is to the true mean, the larger the sample is, so a large population shows much less variation than a small town.","blocking_vocab":[{"word":"law of large numbers","meaning":"큰 수의 법칙"},{"word":"true mean","meaning":"모집단의 실제 평균"},{"word":"variation","meaning":"변동"}],"checks":[{"type":"핵심","q":"큰 수의 법칙에 따른 글의 요지는?","choices":["표본이 클수록 평균은 실제 평균에서 멀어진다.","표본이 클수록 평균이 실제 평균에 가까워지고 비율의 변동이 작아진다."],"answer":1,"why":"S2가 표본 크기와 평균의 관계를 설명하고 S3~5가 사망률로 보여 준다.","refs":[2,3,4,5]},{"type":"사례 근거","q":"변동 폭이 더 큰 사망률 사례는 어느 쪽인가?","choices":["인구 500명의 작은 마을","미국 전체 인구"],"answer":0,"why":"S3~5에서 큰 인구의 사망률은 덜 변하고 작은 마을은 해마다 사망자 수가 크게 달라진다.","refs":[3,4,5]},{"type":"변형 탐지","q":"S5의 작은 마을 사례와 일치하는 것은?","choices":["Deaths may number one, then seven, then four over three years.","Deaths must number exactly four in every year."],"answer":0,"why":"S5는 작은 마을의 사망자가 해마다 1명, 7명, 4명 등으로 달라질 수 있다고 한다.","refs":[5]}],"easy_story":"인구가 500명인 마을에서 사망자가 1명인 해와 7명인 해는 사망률이 크게 달라 보입니다. 반면 미국처럼 인구가 아주 큰 집단에서는 몇 명의 차이가 전체 비율을 크게 흔들지 못합니다. 글은 표본이 클수록 평균이 전체의 평균에 가까워진다는 큰 수의 법칙으로 이 차이를 설명합니다. 사망자의 절대 수가 아니라 인구 대비 비율의 변동을 비교하는 것이 핵심입니다.","diagram":{"kind":"compare","title":"큰 집단과 작은 마을의 연도별 변동","items":[{"head":"큰 집단 · 미국","body":"사망률은 연간 약 10만 명당 720명으로 해마다 크게 변하지 않음","refs":[3,4]},{"head":"작은 마을 · 인구 500명","body":"사망자 수가 한 해 1명, 다음 해 7명, 그다음 해 4명으로 크게 달라질 수 있음","refs":[3,5]}],"takeaway":"두 카드의 단위가 다르므로 숫자 크기를 직접 비교하지 말고 연도별 변동에 주목 · S3~5"}},{"id":"ch05-03","unit":"ch05","number":3,"title":"p62 · READ & APPLY 1","sentences":[{"n":1,"en":"The Mozart Effect is a phrase used to mean that listening to Mozart’s music has some beneficial effects on health, happiness, and learning.","ko":"모차르트 효과는 모차르트의 음악을 듣는 것이 건강과 행복, 학습에 유익한 효과 가 있다는 것을 뜻하는 데 사용되는 어구 이다.","role":"뜻풀이 — 모차르트 효과가 무슨 말인지 먼저 밝힌다."},{"n":2,"en":"This seems a reasonable assessment — except that some people got overexcited by the reports from some scientists, and interpreted them to mean that listening to Mozart’s music can magically increase your general intelligence.","ko":"이것은 합리적인 평가 인 것 같다. 몇몇 사람들이 과학자들의 보고서에 과도하게 흥분해 그 보고서들이 모차르트 음악을 듣는 것이 마법처럼 여러분의 일반 지능을 높일 수 있다는 것을 의미한다고 해석한 것만 제외하면 말이다.","role":"단서 달기 — 지능이 오른다는 데까지 부풀린 오해를 짚는다."},{"n":3,"en":"For the last few decades, the Mozart Effect has been argued about.","ko":"지난 수십 년 동안 모차르트 효과는 논란 이 되어 왔다.","role":"배경 — 수십 년째 다툼거리였다고 흐름을 깐다."},{"n":4,"en":"But no research has demonstrated that merely listening to Mozart’s music can have a lasting impact on general intelligence, so there is no reason to believe that it will raise your IQ.","ko":"그러나 어떤 연구도 단지 모차르트 음악을 듣는 것이 일반 지능에 지속적인 영향 을 줄 수 있음을 입증하지 못했고, 따라서 그것이 여러분의 지능을 높여 줄 것이라고 믿을 이유 는 없다.","role":"잘라 말하기 — 지능을 올린다는 근거가 없다고 잘라 말한다."},{"n":5,"en":"However, you might well find that listening to many kinds of music makes you feel happier, calmer, and less stressed, so you can think more clearly and work better.","ko":"그러나, 다양한 종류의 음악을 듣는 것이 여러분을 더 행복하고, 더 차분하고 , 그리고 스트레스를 덜 받게 만들어 여러분이 더 명확하게 생각하고 일을 더 잘할 수 있다는 것을 알게 될 것이다.","role":"살려 두기 — 마음이 편해져 일이 잘될 수는 있다며 살려 맺는다."}],"core":"모차르트 음악이 지능을 높인다는 증거는 없지만 음악은 기분을 낫게 해 더 잘 생각하게 한다.","flow":[{"label":"효과와 과장","sentences":"S1–2","text":"모차르트 음악의 이로움을 지능이 마법처럼 오른다는 주장으로 과장했다.","refs":[1,2]},{"label":"연구의 한계","sentences":"S3–4","text":"논란이 이어졌지만 듣기만 해서 일반 지능이 오래 높아진다는 연구 근거는 없다.","refs":[3,4]},{"label":"남는 가능성","sentences":"S5","text":"여러 종류의 음악은 기분과 스트레스를 조절해 생각과 일에 도움을 줄 수 있다.","refs":[5]}],"structure":[{"title":"부풀려진 주장","text":"모차르트를 들으면 일반 지능이 마법처럼 오른다"},{"title":"남는 사실","text":"지능 증거는 없고, 기분이 나아져 더 잘 생각하고 일하게 되는 정도다"}],"key_sentence_en":"No research has demonstrated that merely listening to Mozart’s music can have a lasting impact on general intelligence, but many kinds of music may still make you feel happier and work better.","blocking_vocab":[{"word":"lasting impact","meaning":"지속적인 영향"},{"word":"general intelligence","meaning":"일반 지능"},{"word":"think more clearly","meaning":"더 명료하게 생각하다"}],"image":"../../assets/daea1-ch05-03-mozart-four-panel.webp","image_alt":"음악을 들으면 지능이 마법처럼 높아진다고 상상하는 장면, 지속적 지능 향상이 입증되지 않았음을 검토하는 연구자들, 여러 음악으로 기분이 편안해진 학생, 그 뒤 집중해 공부하는 학생의 네 장면","image_caption":"S1-S5 · ‘음악만 들으면 IQ 상승’이라는 과장 → 지속 효과는 입증되지 않음 → 기분·스트레스 개선을 통해 더 명료하게 생각할 가능성","checks":[{"type":"핵심","q":"모차르트 음악의 효과를 글은 어떻게 구분하는가?","choices":["음악만 들으면 IQ가 영구적으로 오른다는 연구가 있다.","지능을 오래 높인다는 증거는 없지만 음악이 기분과 사고를 도울 수 있다."],"answer":1,"why":"S4는 IQ 상승 근거가 없다고 하고 S5는 기분·사고의 도움 가능성을 말한다.","refs":[4,5]},{"type":"근거","q":"S5에서 음악이 더 잘 생각하고 일하게 돕는 경로는?","choices":["더 행복하고 차분하며 스트레스가 덜해지는 것","유전적으로 지능이 바뀌는 것"],"answer":0,"why":"S5는 음악이 감정을 좋게 만들어 더 명료하게 생각할 수 있다고 한다.","refs":[5]},{"type":"변형 탐지","q":"S4의 연구 결과와 일치하는 것은?","choices":["Research has demonstrated a lasting IQ gain from merely listening to Mozart.","No research has demonstrated a lasting IQ gain from merely listening to Mozart."],"answer":1,"why":"S4의 no research를 research has로 바꾸면 반대가 된다.","refs":[4]}],"easy_story":"음악을 들은 뒤 공부가 잘된 느낌이 든다고 해서 지능 자체가 오래 높아졌다는 뜻은 아닙니다. ‘모차르트 음악을 듣기만 하면 똑똑해진다’는 주장은 연구로 입증되지 않았어요. 그렇지만 음악이 기분을 좋게 하거나 스트레스를 줄여 생각을 더 또렷하게 하는 도움은 줄 수 있습니다. 글은 지능 향상 주장과 기분을 통한 도움을 분리합니다.","diagram":{"kind":"compare","title":"‘모차르트 효과’에서 입증된 것과 기대할 수 있는 것","items":[{"head":"입증되지 않음","body":"음악을 듣기만 하면 일반 지능이나 IQ가 오래 높아진다는 주장","refs":[2,3,4]},{"head":"가능한 도움","body":"여러 종류의 음악이 기분·차분함·스트레스를 개선해 더 명료하게 생각하게 할 수 있음","refs":[5]}],"takeaway":"기분과 사고의 단기 도움을 지능의 지속적 상승으로 바꾸지 않는다 · S4~5"}},{"id":"ch05-04","unit":"ch05","number":4,"title":"p62 · READ & APPLY 2","sentences":[{"n":1,"en":"In a big company, what’s small tends to get lost.","ko":"큰 회사에서는 작은 것 이 묻히기 쉽다 .","role":"단언 — 큰 회사에선 작은 것이 묻힌다고 한마디로 던진다."},{"n":2,"en":"As businesses and companies grow, their size can become major obstacles.","ko":"사업체와 회사가 커지면서 , 그들의 크기는 주된 장애물 이 될 수 있다.","role":"풀어 놓기 — 커진 몸집 자체가 걸림돌이 된다고 잇는다."},{"n":3,"en":"The difficult communications, the layers of management, and the lack of casual interactions begin to occur, and all of these things work against the creation of an energizing atmosphere.","ko":"어려운 의사소통, 관리 단계, 일상적 상호 작용의 결핍 이 생기기 시작하고, 이 모든 것들은 활기를 북돋우는 분위기 창출에 방해가 된다 .","role":"증상 나열 — 막힌 소통·겹친 결재·줄어든 대화를 열거한다."},{"n":4,"en":"The entrepreneurial benefits of being small — flexibility, speed, and ease of communication — are often lost in a big company.","ko":"소규모의 사업상 이익, 즉 유연성, 속도, 의사소통의 용이성 은 큰 회사에서는 대개 소실된다 .","role":"잃는 것 — 유연성·속도·소통이라는 작음의 이점을 짚는다."},{"n":5,"en":"Therefore, isolating small projects and keeping them out of the mainstream operations can be the way to grow.","ko":"그러므로, 작은 프로젝트들을 분리하고 그것들을 주류 사업 으로부터 떼어 내 유지하는 것이 성장하는 방법이 될 수 있다.","role":"처방 — 작은 일감을 본류에서 떼어 두라고 답을 낸다."},{"n":6,"en":"By running separate, smaller businesses in larger entities, businesses can have great success, creating high-spirited, energized people backed by the right resources.","ko":"더 큰 기업체 안에서 별개의 더 작은 사업체들을 운영함으로써, 사업은 적절한 자원 의 지원을 받는 진취적이고 활력 넘치는 인재를 만들어 내면서, 큰 성공을 거둘 수 있다.","role":"기대 효과 — 큰 기업 안 작은 사업체로 성공한다며 닫는다."}],"core":"회사가 커지면 작을 때의 이익을 잃으므로 작은 사업을 주류에서 떼어 놓는 것이 성장하는 길이다.","flow":[{"label":"커질수록 잃는 것","sentences":"S1–3","text":"큰 회사에서는 의사소통과 일상적 교류가 어려워져 작은 조직의 활기가 묻힌다.","refs":[1,2,3]},{"label":"작은 조직의 이점","sentences":"S4","text":"유연성·속도·쉬운 소통이 큰 조직에서 사라지기 쉽다.","refs":[4]},{"label":"분리 운영","sentences":"S5–6","text":"작은 프로젝트를 주류 사업에서 떼어 운영하면 큰 조직의 자원과 작은 팀의 활기를 함께 살릴 수 있다.","refs":[5,6]}],"structure":[{"title":"문제 — 커진 몸집","text":"의사소통이 어려워지고 관리 단계가 늘며 소규모의 이익이 사라진다"},{"title":"해결 — 작게 떼어 두기","text":"작은 프로젝트를 주류에서 분리해 별개의 작은 사업으로 돌린다"}],"key_sentence_en":"Therefore, isolating small projects and keeping them out of the mainstream operations can be the way to grow.","lead":"큰 회사가 작고 민첩한 조직의 장점을 살리려면?","image":"../../assets/daea1-ch05-04-small-project.webp","image_alt":"큰 회사 건물 안에 구분된 작은 프로젝트 공간에서 구성원들이 가까이 모여 의견을 나누는 장면","image_caption":"S1~6에서 큰 조직의 의사소통 문제를 짚고, 작은 프로젝트를 주류 운영과 분리해 운영하는 방안을 제시한다. 그림은 그 공간 관계만 나타낸다.","prediction":{"question":"회사가 커져도 작은 조직의 유연함을 살리는 방법은?","choices":["작은 프로젝트를 분리해 운영한다.","관리 단계를 더 늘려 모든 프로젝트를 묶는다."],"answer":0,"actual":"S5~6은 작은 프로젝트를 주류 운영에서 분리하여 큰 조직 안에서 작고 민첩한 사업을 돌리는 방법을 제안한다."},"blocking_vocab":[{"word":"entrepreneurial","meaning":"기업가적인"},{"word":"mainstream operations","meaning":"주류 사업 운영"},{"word":"high-spirited","meaning":"활기찬"}],"checks":[{"type":"핵심","q":"큰 회사가 작은 사업의 장점을 유지하는 방법은?","choices":["작은 프로젝트를 주류 운영에서 분리해 독립적으로 돌린다.","모든 작은 프로젝트를 더 복잡한 관리 층에 흡수한다."],"answer":0,"why":"S4의 잃어버린 장점에 대한 해결로 S5~6이 분리 운영을 제시한다.","refs":[4,5,6]},{"type":"근거","q":"S4가 든 작은 사업의 장점은?","choices":["느린 결정과 많은 관리 단계","유연성·속도·쉬운 소통"],"answer":1,"why":"S4에 flexibility, speed, ease of communication이 나온다.","refs":[4]},{"type":"변형 탐지","q":"S3~4의 성장 문제와 일치하는 것은?","choices":["As companies grow, difficult communication can erode the advantages of being small.","As companies grow, communication always becomes easier and small-company advantages increase."],"answer":0,"why":"S3~4는 회사가 커지며 의사소통이 어려워지고 작은 조직의 장점을 잃는다고 한다.","refs":[3,4]}],"easy_story":"작은 팀은 서로 빠르게 말하고 움직일 수 있습니다. 회사가 커지면 관리 단계가 늘고 일상적인 대화가 줄어 그 장점을 잃기 쉽죠. 그래서 새로운 작은 프로젝트를 큰 회사의 일반 업무 속에 묻어 두지 말고 별도로 운영하자는 제안이 나옵니다. 그러면 큰 회사의 자원을 받으면서도 작은 팀의 속도와 활기를 살릴 수 있습니다."},{"id":"ch05-05","unit":"ch05","number":5,"title":"p63 · READ & APPLY 3","sentences":[{"n":1,"en":"There may be a few superhumans out there who know from age five exactly what they want to do when they grow up, and what form it will take.","ko":"다섯 살부터 자라서 무엇을 하고 싶은지, 그리고 그것이 어떤 형태일지를 정확히 아는 초인 이 몇 명 있을 수도 있다.","role":"예외 먼저 — 다섯 살에 길을 아는 초인도 있다고 인정하고 연다."},{"n":2,"en":"For the rest of us, it’s almost never that simple.","ko":"나머지 우리들 에게는, 그것이 거의 그렇게 간단하지 않다 .","role":"방향 틀기 — 나머지에게는 그리 간단치 않다고 초점을 옮긴다."},{"n":3,"en":"Jobs and careers don’t fall from the sky to land at our feet, where we simply pick them up and accept them as the perfect fit for life.","ko":"직업과 경력은 하늘에서 우리 발치 에 떨어져 그것을 그냥 집어 들어 인생에 완벽하게 들어맞는 것으로 받아들이게 되지 않는다.","role":"부정으로 그리기 — 직업이 발치에 떨어지지 않는다고 그림을 지운다."},{"n":4,"en":"Simply put, the process of discovery unfolds a bit differently for most people.","ko":"간단히 말해, 발견 과정 은 대부분의 사람들에게 약간 다르게 펼쳐진다 .","role":"정리 — 발견은 사람마다 다르게 펼쳐진다고 요점을 잡는다."},{"n":5,"en":"As we advance throughout a career (or series of careers), most of us have a number of different work experiences ranging from frustrating to awesome.","ko":"우리가 경력을 (혹은 일련의 경력들을) 쌓아 갈 때 , 우리들 대다수는 좌절감 을 주는 것에서부터 멋진 것까지 여러 다양한 직업상의 경험을 한다.","role":"실제 그리기 — 좌절에서 보람까지 여러 경험을 겪는다고 푼다."},{"n":6,"en":"Through those experiences, we learn as much about what we don’t want as what we do, and realize everyone is different.","ko":"그런 경험을 통해, 우리는 우리가 원하는 것만큼이나 우리가 원치 않는 것에 대해 배우며, 모두가 다르다는 것을 깨닫는다 .","role":"맺음 — 그 겪음으로 원치 않는 것도 배운다고 마무리한다."}],"core":"진로 발견은 사람마다 다르게 펼쳐지며 여러 경험이 원하는 것만큼 원치 않는 것도 가르친다.","flow":[{"label":"일찍 정해지지 않음","sentences":"S1–3","text":"어릴 때 진로를 정확히 아는 사람은 드물고, 완벽한 일이 저절로 주어지지도 않는다.","refs":[1,2,3]},{"label":"발견의 과정","sentences":"S4–5","text":"사람마다 여러 경력과 좋고 나쁜 일 경험을 거치며 발견해 간다.","refs":[4,5]},{"label":"경험의 배움","sentences":"S6","text":"그 과정에서 원하는 것만큼 원하지 않는 것도 알아 간다.","refs":[6]}],"structure":[{"title":"소수의 초인","text":"다섯 살부터 무엇을 할지, 어떤 모습일지까지 정확히 안다"},{"title":"나머지 우리","text":"여러 경험을 거치며 원하는 것과 원치 않는 것을 함께 배워 간다"}],"key_sentence_en":"Simply put, the process of discovery unfolds a bit differently for most people, and through many different work experiences we learn as much about what we don’t want as what we do.","blocking_vocab":[{"word":"perfect fit","meaning":"완벽하게 맞는 것"},{"word":"unfold","meaning":"펼쳐지다"},{"word":"frustrating","meaning":"좌절스러운"}],"image":"../../assets/daea1-ch05-05-career-four-panel.webp","image_alt":"어릴 때 여러 진로 앞에서 고민하는 사람, 좌절스러운 일 경험, 만족스러운 일 경험, 두 경험에서 배운 뒤 자신만의 다음 길을 고르는 같은 사람의 네 장면","image_caption":"S1-S6 · 대부분은 일찍 정답을 아는 것이 아니라 여러 경험을 거치며 원하는 것과 원하지 않는 것을 함께 배운다.","checks":[{"type":"핵심","q":"진로를 찾는 과정에 관해 글이 강조하는 것은?","choices":["여러 직업 경험을 거치며 원하는 것과 원하지 않는 것을 함께 배운다.","대부분의 사람은 다섯 살 때 평생 직업을 정확히 안다."],"answer":0,"why":"S1~2는 일찍 아는 경우가 드물고 S5~6은 다양한 경험에서 배운다고 한다.","refs":[1,2,5,6]},{"type":"근거","q":"S5에서 일 경험의 폭은 어떻게 묘사되는가?","choices":["좌절스러운 경험부터 아주 좋은 경험까지","항상 완벽하게 만족스러운 경험만"],"answer":0,"why":"S5의 ranging from frustrating to awesome을 확인한다.","refs":[5]},{"type":"변형 탐지","q":"S6과 일치하는 문장은?","choices":["Experiences teach us only what we want, never what we do not want.","Experiences teach us what we do not want as well as what we do want."],"answer":1,"why":"S6의 as much about what we don’t want as what we do를 뒤집으면 틀린다.","refs":[6]}],"easy_story":"어릴 때부터 딱 맞는 직업을 아는 사람은 드뭅니다. 일을 해 보기 전에는 어떤 점이 좋은지도, 무엇이 자신과 맞지 않는지도 알기 어렵기 때문입니다. 여러 직업 경험에는 실망스러운 일과 만족스러운 일이 함께 있습니다. 글은 진로가 한 번에 ‘발견’되는 답이 아니라 그런 경험을 거치며 각자 다르게 드러나는 과정이라고 설명합니다.","diagram":{"kind":"steps","title":"진로를 발견하는 과정","items":[{"head":"처음부터 정해지지 않음","body":"대부분은 어릴 때 완성된 진로를 알지 못함","refs":[1,2,3]},{"head":"서로 다른 경험","body":"좋은 경험과 좌절스러운 경험을 모두 겪으며 진로가 펼쳐짐","refs":[4,5]},{"head":"선호를 알아감","body":"원하는 것만큼 원하지 않는 것도 배움","refs":[6]}],"takeaway":"특정 직업을 추천하거나 진로의 정답을 하나로 정한 글이 아니다 · S4~6"}},{"id":"ch05-06","unit":"ch05","number":6,"title":"p63 · READ & APPLY 4","sentences":[{"n":1,"en":"No one knows for sure how the universe was created.","ko":"아무도 어떻게 우주가 만들어졌는지 확실히 모른다.","role":"전제 놓기 — 우주의 시작을 아무도 확실히 모른다고 깐다."},{"n":2,"en":"A lot of scientists think that the big bang theory is the most likely explanation.","ko":"많은 과학자들은 빅뱅 이론 이 가장 그럴듯한 설명 이라고 생각한다.","role":"이론 들기 — 빅뱅이 가장 그럴듯하다는 학계 견해를 든다."},{"n":3,"en":"It goes like this: About 13.7 billion years ago, all the matter in the universe, as we know it, was packed together in one superhot dense point called a singularity.","ko":"그것은 이와 같이 전개된다. 약 137억 년 전에, 우리가 알고 있는 형태의 우주에 있는 모든 물질이 특이점 이라고 불리는 하나의 엄청나게 뜨겁고 밀집된 점에 뭉쳐 있었다 .","role":"과정 설명 — 137억 년 전 모든 물질이 한 점에 뭉쳐 있었다고 푼다."},{"n":4,"en":"No one is really sure why, but this singularity began a dramatic expansion.","ko":"아무도 왜인지는 확실히 모르지만, 이 특이점은 극적인 팽창 을 시작했다.","role":"과정 잇기 — 까닭 모를 급팽창이 시작됐다고 잇는다."},{"n":5,"en":"It was an event in which all the particles of the early universe filled all of space, rushing away from each other.","ko":"그것은 서로서로 빠르게 멀어지면서 초기 우주의 모든 미립자 가 공간을 모두 채운 사건이었다.","role":"부연 — 미립자가 서로 멀어지며 공간을 채웠다고 그린다."},{"n":6,"en":"Then, the universe began to cool as it expanded.","ko":"그러고 나서, 우주는 확장하면서 식기 시작했다 .","role":"과정 넘기기 — 팽창하며 식기 시작했다고 다음 단계로 넘긴다."},{"n":7,"en":"About 3 minutes after the big bang, it had cooled from 100 million trillion trillion (10³²) degrees Kelvin to 10 billion degrees Kelvin.","ko":"빅뱅 3분 후쯤, 그것의 온도는 10의 32승 K에서 100억 K로 떨어졌다 .","role":"수치 제시 — 3분 만에 10³²K에서 100억 K로 떨어졌다고 든다."},{"n":8,"en":"And as it cooled, matter formed and, later, galaxies.","ko":"그리고, 그것이 식으면서 물질이 형성되었고, 나중에는 은하가 형성되었다.","role":"맺음 — 식으면서 물질과 은하가 생겼다고 끝을 맺는다."}],"core":"빅뱅 이론에 따르면 하나의 특이점이 극적으로 팽창했고 우주가 식으면서 물질과 은하가 생겼다.","flow":[{"label":"전제","sentences":"S1-2","text":"아무도 확실히 모르지만 많은 과학자가 빅뱅을 가장 그럴듯하게 본다","refs":[1,2]},{"label":"시작","sentences":"S3","text":"약 137억 년 전 모든 물질이 특이점이라는 한 점에 뭉쳐 있었다","refs":[3]},{"label":"팽창","sentences":"S4-5","text":"까닭은 몰라도 그 점이 극적으로 팽창해 미립자가 공간을 채웠다","refs":[4,5]},{"label":"냉각","sentences":"S6-7","text":"팽창하며 식어 3분 만에 10의 32승 K에서 100억 K로 내려갔다","refs":[6,7]},{"label":"결과","sentences":"S8","text":"식으면서 물질이 생기고 나중에 은하가 만들어졌다","refs":[8]}],"structure":[{"title":"원인 — 팽창과 냉각","text":"특이점이 극적으로 팽창하고 그 과정에서 온도가 급격히 내려갔다"},{"title":"결과 — 물질과 은하","text":"식으면서 물질이 형성되고 뒤이어 은하가 생겨났다"}],"key_sentence_en":"A lot of scientists think that the big bang theory is the most likely explanation: a singularity began a dramatic expansion, and as the universe cooled, matter and galaxies formed.","blocking_vocab":[{"word":"singularity","meaning":"특이점"},{"word":"dramatic expansion","meaning":"급격한 팽창"},{"word":"particle","meaning":"입자"}],"checks":[{"type":"핵심","q":"빅뱅 이론의 사건 순서로 알맞은 것은?","choices":["은하 형성 → 특이점 냉각 → 팽창","뜨겁고 밀집된 특이점 → 팽창 → 냉각 → 물질과 은하 형성"],"answer":1,"why":"S3~8이 특이점의 팽창과 우주 냉각, 이후 물질·은하 형성을 순서대로 제시한다.","refs":[3,4,5,6,8]},{"type":"근거","q":"글은 특이점이 팽창하기 시작한 이유를 어떻게 다루는가?","choices":["아무도 확실히 모른다고 한다.","은하가 밀어냈기 때문이라고 확정한다."],"answer":0,"why":"S4의 No one is really sure why가 직접 근거다.","refs":[4]},{"type":"변형 탐지","q":"냉각과 형성의 관계로 S8과 일치하는 것은?","choices":["As the universe heated up, galaxies formed first and matter formed later.","As the universe cooled, matter formed and galaxies formed later."],"answer":1,"why":"S8은 냉각 → 물질 → 나중에 은하의 순서를 말한다.","refs":[8]}],"easy_story":"우주의 시작을 확실히 본 사람은 없어서 글도 빅뱅을 하나의 유력한 설명으로 소개합니다. 그 설명에 따르면 매우 뜨겁고 밀집된 한 점이 급격히 팽창했고, 우주가 넓어지면서 식었습니다. 온도가 내려가자 물질이 만들어지고 나중에 은하가 형성되었다는 순서예요. ‘왜 팽창했는가’는 글에서도 모른다고 하므로 원인까지 알아낸 이야기로 읽지 않아야 합니다.","diagram":{"kind":"steps","title":"빅뱅 이론이 설명하는 순서","items":[{"head":"특이점","body":"약 137억 년 전, 물질이 뜨겁고 밀도 높은 한 점에 모여 있었다는 설명","refs":[2,3]},{"head":"팽창","body":"특이점이 극적으로 팽창하며 초기 입자들이 서로 멀어짐","refs":[4,5]},{"head":"냉각과 형성","body":"팽창하며 식고, 물질과 나중의 은하가 형성됨","refs":[6,7,8]}],"takeaway":"원문의 ‘가장 가능성 높은 설명’이지 창조 과정이 확정됐다는 뜻은 아님 · S1~2"}},{"id":"ch05-07","unit":"ch05","number":7,"title":"p64 · READ & APPLY 5","sentences":[{"n":1,"en":"In telling students how the native Indians helped the Europeans, one high school textbook for United States History featured a picture of Indians girdling trees and text that asserted: “The Indians taught the colonists an easy method of felling trees known as girdling.","ko":"학생들에게 인디언들이 어떻게 유럽인들을 도왔는지를 말함에 있어, 한 고등학교 미국 역사 교과서는 나무를 띠 모양으로 벗기고 있는 인디언들의 사진과 다음과 같이 주장하는 글을 실었다. “인디언들이 식민지 이주자들에게 환상 박피라고 알려진 나무를 쉽게 벌채하는 방법을 가르쳤다.","role":"인용 열기 — 교과서가 인디언이 벌목을 가르쳤다고 쓴 대목을 든다."},{"n":2,"en":"They stripped off the bark of the trees and waited for them to die.","ko":"그들은 나무의 껍질을 벗기고 나무가 죽기를 기다렸다 .","role":"인용 잇기 — 껍질을 벗겨 죽기를 기다렸다는 설명을 옮긴다."},{"n":3,"en":"In time the trees fell; the land was cleared for fields and houses.”","ko":"이윽고 나무들이 쓰러졌고 , 그 땅은 밭과 집을 위해 개간되었다 .”","role":"인용 맺기 — 그렇게 땅을 개간했다는 문장까지 그대로 든다."},{"n":4,"en":"This illustration can have one meaning — namely, that the Europeans did not have the faintest notion of how to fell a tree.","ko":"이 설명은 한 가지를 의미할 수 있는데 , 다시 말해 유럽인들이 나무를 벌채하는 방법을 전혀 모르고 있었다는 것이다.","role":"함의 끄집기 — 그 말은 유럽인이 벌목을 몰랐다는 뜻이라 짚는다."},{"n":5,"en":"This kind of statement is false.","ko":"이런 종류의 진술은 거짓이다 .","role":"판정 — 그런 진술은 거짓이라고 잘라 말한다."},{"n":6,"en":"After all, the Europeans had to cross the Atlantic to come to America, and they did so via ships made of wood.","ko":"어쨌든, 유럽인들은 미국에 오기 위해 대서양을 건너야 했고 , 그들은 목재로 만들어진 배로 그렇게 했던 것이다.","role":"반증 제시 — 그들이 목재 배를 타고 건너왔다는 사실을 든다."},{"n":7,"en":"And, of course, the wood was derived from trees they felled with steel axes.","ko":"그리고 당연히, 그 목재는 그들이 강철 도끼로 쓰러뜨린 나무에서 얻은 것이었다.","role":"반증 추가 — 그 목재는 강철 도끼로 벤 나무라고 못 박는다."},{"n":8,"en":"Europeans, of course, downed trees for centuries, long before they came to America, and, moreover, by methods far more efficient than by girdling.","ko":"물론, 유럽인들은 미국에 오기 훨씬 전부터 수 세기 동안 , 게다가, 환상 박피보다 훨씬 더 효율적인 방법으로 , 나무를 베어 넘어뜨렸다.","role":"반증 보태기 — 훨씬 앞서 더 효율적인 방법을 썼다고 보탠다."},{"n":9,"en":"They did not have to learn the Indian’s method of downing trees.","ko":"그들은 나무를 쓰러뜨리는 인디언의 방법을 배울 필요가 없었다 .","role":"맺음 — 그러니 배울 필요가 없었다고 앞의 주장을 닫는다."}],"core":"인디언이 벌목을 가르쳤다는 교과서 설명은 유럽인이 나무를 벨 줄 몰랐다는 잘못된 믿음을 만든다.","flow":[{"label":"인용","sentences":"S1-3","text":"한 교과서는 인디언이 환상 박피라는 벌목법을 이주자에게 가르쳤다고 적었다","refs":[1,2,3]},{"label":"함의","sentences":"S4","text":"그 설명은 유럽인이 벌목법을 전혀 몰랐다는 뜻이 될 수 있다","refs":[4]},{"label":"반박","sentences":"S5","text":"그런 진술은 거짓이다","refs":[5]},{"label":"근거","sentences":"S6-7","text":"유럽인은 목재로 만든 배로 대서양을 건넜고 그 목재는 강철 도끼로 벤 것이다","refs":[6,7]},{"label":"결론","sentences":"S8-9","text":"유럽인에게는 더 오래되고 효율적인 벌목 지식이 있어 배울 필요가 없었다","refs":[8,9]}],"structure":[{"title":"교과서의 그림","text":"인디언이 이주자에게 쉬운 벌목법을 가르쳐 주었다"},{"title":"실제","text":"유럽인은 강철 도끼로 나무를 베어 배를 만들어 왔고 배울 필요가 없었다"}],"key_sentence_en":"The textbook account creates the false myth that European settlers did not know how to fell trees before learning girdling from Native Indians.","lead":"교과서 그림이 암시한 '처음 배운 벌목법'은 사실일까?","image":"../../assets/daea1-ch05-07-tree-claim.webp","image_alt":"나무껍질을 벗기는 방식을 그린 오래된 책과, 강철 도끼로 목재를 다듬어 배를 만드는 유럽인의 장면을 대비한 그림","image_caption":"S1~3의 교과서 설명과 S6~8의 반박 근거를 나란히 놓았다. 책의 주장을 역사적 사실로 받아들이지 않도록 주의하자.","prediction":{"question":"유럽인은 아메리카에 오기 전 나무 베는 법을 몰랐을까?","choices":["그렇다. 현지에서 처음 배웠다.","아니다. 이미 도끼로 나무를 베어 목선을 만들었다."],"answer":1,"actual":"S6~9는 유럽인이 아메리카에 오기 오래전부터 강철 도끼로 나무를 베어 목선을 만들었다며 교과서의 암시를 반박한다."},"blocking_vocab":[{"word":"girdling","meaning":"나무껍질을 벗겨 말라 죽게 하는 방식"},{"word":"fell a tree","meaning":"나무를 베다"},{"word":"steel axe","meaning":"강철 도끼"}],"checks":[{"type":"핵심","q":"교과서의 벌목 설명을 글쓴이가 비판하는 이유는?","choices":["유럽인이 이미 나무를 벨 줄 알았는데 인디언에게 처음 배운 것처럼 보이게 해서","인디언이 나무껍질을 벗기는 방법을 전혀 몰랐기 때문에"],"answer":0,"why":"S4~9는 유럽인이 이미 오랫동안 나무를 베어 왔음을 근거로 그 함의를 반박한다.","refs":[4,5,6,7,8,9]},{"type":"근거","q":"유럽인이 나무를 베는 기술을 알고 있었다는 증거로 든 것은?","choices":["강철 도끼로 벤 나무로 만든 배를 타고 대서양을 건넌 사실","인디언에게 강철 도끼를 건네받은 사실"],"answer":0,"why":"S6~7은 목선과 강철 도끼를 증거로 제시한다.","refs":[6,7]},{"type":"변형 탐지","q":"S8~9와 일치하는 문장은?","choices":["Europeans first learned to fell trees after coming to America.","Europeans had felled trees for centuries before coming to America."],"answer":1,"why":"S8은 유럽인이 미국에 오기 오래전부터 벌목했다고 한다.","refs":[8,9]}],"easy_story":"한 교과서는 원주민이 유럽 이주민에게 나무를 베는 법을 가르쳤다고 소개합니다. 그런데 이를 유럽인은 그 전까지 벌목을 몰랐다는 뜻으로 받아들이면 문제가 생깁니다. 유럽인은 이미 나무로 만든 배를 타고 대서양을 건넜고, 그 목재도 나무를 베어 얻었습니다. 글은 교과서의 설명이 만들어 내는 잘못된 함의를 이 근거로 반박합니다."}]},{"id":"test1","label":"고난도 유형 TEST 1회","scope":"p144~149","passages":[{"id":"test1-01","unit":"test1","number":1,"title":"no.01","sentences":[{"n":1,"en":"Should we put away childish things as we grow older?","ko":"우리는 나이가 들면서 유치한 일들을 치워야 하는가?","role":"물음 던지기 — 나이 들면 유치한 것을 버려야 하냐고 화두를 연다."},{"n":2,"en":"Some things, perhaps, but not the willingness to enjoy simple pleasures.","ko":"아마 몇몇 유치한 일들은 치워야겠지만, 소박한 즐거움 을 누리려는 마음까지 버려서는 안 된다 .","role":"답 내기 — 소박한 즐거움만은 버리지 말라고 갈래를 갈라 답한다."},{"n":3,"en":"The ability to give yourself treats and rewards is one of the basic strategies for improving mental fitness, and there is a good reason for this.","ko":"자신에게 대접과 보상 을 제공하는 능력은 정신 건강 을 증진시키기 위한 기본적인 전략 중 하나이고, 이것에는 타당한 이유가 있다.","role":"주장 세우기 — 자기 대접이 마음 건강의 기본 전략이라 내세운다."},{"n":4,"en":"In the first place, treats and rewards provide enjoyment and pleasure, which contribute to feeling good and confident.","ko":"우선, 대접과 보상은 즐거움과 기쁨 을 주는데, 이는 기분이 좋고 자신감 을 가지는 데 기여한다.","role":"근거 ① — 즐거움이 기분과 자신감을 세워 준다고 받친다."},{"n":5,"en":"In addition, they create the best environment for helping you change in the directions you wish to change.","ko":"게다가, 그것들은 여러분이 변하고자 하는 방향으로 여러분을 변하도록 돕는 최고의 환경 을 만들어 준다.","role":"근거 ② — 바라는 쪽으로 바뀔 바탕을 만들어 준다고 보탠다."},{"n":6,"en":"A joyless time filled only with tasks done out of duty or responsibility restricts your ability to develop, and feels more like a preparation for life than living life itself.","ko":"의무감이나 책임감으로 완수되는 과제로만 채워진 재미없는 시간 은 발전하는 능력을 방해하고 , 삶 자체를 사는 것이라기보다는 삶을 준비하는 기분이 들게 한다.","role":"뒤집어 보이기 — 의무로만 채운 시간은 발전을 막는다고 뒤집어 보인다."},{"n":7,"en":"It runs the risk of turning effort into duty.","ko":"그것은 노력을 의무로 바꾸는 위험을 무릅쓴다 .","role":"경고로 맺기 — 노력이 의무로 굳는 위험을 짚으며 닫는다."}],"core":"자신에게 대접과 보상을 줄 줄 아는 능력은 정신 건강의 기본 전략이고 의무만 남은 시간은 발전을 막는다.","flow":[{"label":"물음","sentences":"S1-2","text":"나이 들며 유치한 것을 치워야 하나 — 소박한 즐거움만은 남겨야 한다","refs":[1,2]},{"label":"주장","sentences":"S3","text":"자신에게 대접과 보상을 주는 능력은 정신 건강을 키우는 기본 전략이다","refs":[3]},{"label":"이유","sentences":"S4","text":"즐거움과 기쁨을 주어 기분이 좋고 자신감을 갖는 데 이바지한다","refs":[4]},{"label":"이유","sentences":"S5","text":"원하는 방향으로 변하도록 돕는 최고의 환경을 만들어 준다","refs":[5]},{"label":"반례","sentences":"S6-7","text":"의무로만 채운 재미없는 시간은 발전을 막고 노력을 의무로 바꿔 버린다","refs":[6,7]}],"structure":[{"title":"대접과 보상이 있는 시간","text":"즐거움과 자신감을 주고 원하는 변화를 돕는 환경이 된다"},{"title":"의무만 있는 시간","text":"발전을 막고 삶이 아니라 삶의 준비처럼 느껴지게 한다"}],"key_sentence_en":"The ability to give yourself treats and rewards is one of the basic strategies for improving mental fitness, while a joyless time filled only with duties restricts your ability to develop.","lead":"나이가 들어도 소박한 즐거움과 자신에게 주는 보상을 남겨야 하는 이유는 무엇일까?","image":"../../assets/daea1-test1-01-small-reward.webp","image_alt":"해야 할 일을 하다가 지친 학생이 작은 휴식과 음악을 즐기며 편안해지는 두 장면을 나란히 보여 주는 그림","image_caption":"S3~6: 대접과 보상은 책임을 없애는 것이 아니라 즐거움과 자신감을 보태는 방법입니다.","blocking_vocab":[{"word":"put away","meaning":"치우다·그만두다"},{"word":"mental fitness","meaning":"정신 건강"},{"word":"contribute to","meaning":"~에 기여하다"},{"word":"joyless","meaning":"즐거움이 없는"},{"word":"out of duty","meaning":"의무감에서"}],"checks":[{"type":"핵심","q":"글쓴이가 소박한 즐거움을 남겨야 한다고 보는 이유는?","choices":["나이가 들수록 유치한 일은 하나도 버려서는 안 된다.","대접과 보상은 기분과 자신감을 돕고 원하는 변화를 위한 환경을 만든다.","즐거움은 모든 책임을 버리게 만들어 정신 건강을 높인다."],"answer":1,"why":"S3~5는 대접과 보상이 정신 건강의 전략이며 즐거움·자신감과 변화의 환경을 제공한다고 한다.","refs":[3,4,5]},{"type":"지칭","q":"S5의 they가 가리키는 것은?","choices":["directions you wish to change","treats and rewards","tasks done out of duty"],"answer":1,"why":"앞 문장 S4의 treats and rewards를 받아, 그것들이 변화에 좋은 환경을 만든다고 이어진다.","refs":[4,5]},{"type":"변형 탐지","q":"S6의 비교와 일치하는 문장을 고르세요.","choices":["A joyless time of duty feels more like living life itself than preparation for life.","A joyless time of duty feels more like preparation for life than living life itself."],"answer":1,"why":"S6은 의무만 남은 시간이 삶 자체를 사는 것보다 삶을 준비하는 것처럼 느껴진다고 한다.","refs":[6]}],"easy_story":"나이가 들었다고 즐거움까지 버리면 삶이 의무만 남은 시간처럼 느껴질 수 있습니다. 자신에게 소박한 보상을 주면 기분과 자신감에 도움이 되고, 바뀌려고 노력할 힘도 얻을 수 있어요. 반대로 할 일만 가득하면 발전을 돕기는커녕 노력을 부담으로 만들 수 있습니다. 글은 즐거움을 철없는 행동이 아니라 정신 건강을 돌보는 방법으로 봅니다.","diagram":{"kind":"compare","title":"보상과 즐거움이 없는 시간의 차이","items":[{"head":"작은 보상·즐거움","body":"기쁨과 자신감을 주고 원하는 방향으로 바뀔 환경을 만듦","refs":[2,3,4,5]},{"head":"의무만 남은 시간","body":"발전 능력을 제한하고 노력을 또 하나의 의무로 만들 위험","refs":[6,7]}],"takeaway":"모든 의무를 버리라는 주장이 아니라 단순한 즐거움을 없애지 말라는 주장 · S1~3"}},{"id":"test1-02","unit":"test1","number":2,"title":"no.02","sentences":[{"n":1,"en":"Somewhere, somehow, there are “switches” in the genome that tell our genes when to turn on and express themselves.","ko":"어디엔가, 왜 그런지 모르겠지만, 우리 유전자에게 스스로를 언제 활성화하고 발현해야 하는지 알려 주는 ‘ 스위치 ’가 게놈 안에 있다.","role":"화제 열기 — 유전자를 켜고 끄는 스위치가 있다고 앞세운다."},{"n":2,"en":"The switches that turn genes on and off are not well understood.","ko":"유전자를 활성화하고 비활성화하게 하는 그 스위치가 잘 알려져 있지는 않다.","role":"한계 밝히기 — 그 스위치를 아직 잘 모른다고 솔직히 짚는다."},{"n":3,"en":"Some of them lie within the genes themselves.","ko":"그 스위치들 중 일부는 유전자 자체 안에 있다.","role":"자리 ① — 일부는 유전자 안에 있다고 하나를 짚어 준다."},{"n":4,"en":"Others are thought to lie within the so-called “junk DNA,” poorly understood matter that comprises the large majority of the genome.","ko":"다른 것들은 게놈의 대다수 를 구성하고 있는 잘 알려지지 않은 물질인 소위 ‘ 정크 DNA ’ 안에 있는 것으로 여겨진다.","role":"자리 ② — 나머지는 정크 DNA 안에 있으리라 본다고 잇는다."},{"n":5,"en":"In 2006, it was reported that individual differences may result from previously undetected variations in the number of times that certain key genes are copied in the genome.","ko":"2006년에, 개체의 차이 는 이전에 발견되지 않은, 게놈에서 특정한 핵심 유전자가 복제되는 횟수 의 변화에서 기인할 수 있다고 보고되었다.","role":"새 보고 — 2006년 복제 횟수 차이라는 발견을 끌어온다."},{"n":6,"en":"Preliminary findings suggest that entire sequences may be repeated as many as ten times, differing widely between individuals and yielding differences in the overall “copy number” of genes.","ko":"사전 연구 결과에 따르면 (특정한 핵심 유전자의) 전체 배열 은 최대 열 번이나 반복될 수 있는데, 개인마다 크게 달라서 유전자의 전체 ‘사본 수’에서 차이를 낼 수 있다.","role":"수치 제시 — 최대 열 번까지 반복돼 사람마다 다르다고 든다."},{"n":7,"en":"Perhaps we have ignored material such as this or “junk DNA” for too long, focusing instead on the more obvious proteins that were easier to measure and investigate.","ko":"아마도 우리는 이와 같은 물질이나 ‘정크 DNA’를 너무 오랫동안 무시해 왔고 , 대신 측정과 조사가 더 쉬운 보다 명확한 단백질 에 초점을 맞춰 왔다.","role":"반성 — 쉬운 단백질만 보느라 이것을 오래 지나쳤다고 돌아본다."},{"n":8,"en":"In any case, high school genetics books are losing their resale value almost as quickly as they are published.","ko":"어쨌든, 고등학교 유전학 교재 는 출판되는 것만큼이나 빠르게 재판매 가치 를 잃고 있다.","role":"익살로 맺기 — 유전학 교재가 금세 낡는다며 변화의 속도를 비튼다."}],"core":"유전자 스위치는 아직 잘 모르고 새 발견이 잇따라 유전학 교재는 나오자마자 낡아 버린다.","flow":[{"label":"전제","sentences":"S1-2","text":"게놈 어딘가에 유전자를 켜고 끄는 스위치가 있으나 잘 알려져 있지 않다","refs":[1,2]},{"label":"위치","sentences":"S3-4","text":"일부는 유전자 안에, 다른 것들은 정크 DNA 안에 있다고 여겨진다","refs":[3,4]},{"label":"새 발견","sentences":"S5-6","text":"2006년 보고는 핵심 유전자의 복제 횟수 차이가 개체 차이를 낳는다고 알렸다","refs":[5,6]},{"label":"반성","sentences":"S7","text":"측정하기 쉬운 단백질에만 매달려 이런 물질을 너무 오래 무시해 왔다","refs":[7]},{"label":"결론","sentences":"S8","text":"어쨌든 유전학 교재는 출판되는 속도만큼 빠르게 값을 잃는다","refs":[8]}],"structure":[{"title":"원인 — 빠르게 바뀌는 지식","text":"스위치는 아직 모르고 복제 횟수 같은 새 실마리가 잇따른다"},{"title":"결과 — 낡아 버리는 교재","text":"고등학교 유전학 교재가 출판되자마자 재판매 값을 잃는다"}],"key_sentence_en":"The switches that turn genes on and off are not well understood, and new findings about copy number keep changing the picture, so high school genetics books are losing their resale value almost as quickly as they are published.","blocking_vocab":[{"word":"genome","meaning":"유전체"},{"word":"junk DNA","meaning":"기능을 잘 모르는 DNA 영역"},{"word":"copy number","meaning":"유전자 복제 횟수"}],"checks":[{"type":"핵심","q":"유전학 교재가 빨리 낡는 까닭은?","choices":["유전자 스위치의 작동을 이미 완전히 이해했기 때문에","유전자 스위치와 복제 횟수 등 새 발견이 계속 나와 이해가 빠르게 바뀌어서"],"answer":1,"why":"S2~8은 잘 모르는 스위치와 새 복제 횟수 발견을 제시하고 교재가 빨리 낡는다고 끝낸다.","refs":[2,5,6,7,8]},{"type":"근거","q":"S4에서 일부 스위치가 있다고 여겨지는 곳은?","choices":["이른바 junk DNA 안","오직 단백질 바깥의 세포벽"],"answer":0,"why":"S4는 Others are thought to lie within the so-called junk DNA라고 한다.","refs":[4]},{"type":"변형 탐지","q":"복제 횟수 발견에 관한 S5와 맞는 것은?","choices":["Previously undetected differences in gene copy number may explain individual differences.","Previously undetected differences in gene copy number cannot affect individual differences."],"answer":0,"why":"S5의 may result from을 cannot affect로 바꾸면 원문의 가능성을 부정한다.","refs":[5]}],"easy_story":"유전자가 언제 켜지고 꺼지는지는 아직 다 밝혀지지 않았습니다. 글은 유전자 안이나 ‘정크 DNA’로 불리던 부분에 스위치가 있을 수 있다고 소개합니다. 또 어떤 유전자가 몇 번 복제되느냐의 차이도 사람마다 다를 수 있다는 연구가 나옵니다. 알아야 할 것이 계속 발견되니 유전학 교과서도 금방 옛 설명이 될 수 있다는 결론입니다.","diagram":{"kind":"steps","title":"유전자 조절에 관한 아직 열린 질문","items":[{"head":"유전자 ‘스위치’","body":"유전자의 발현을 켜고 끄는 장치가 있지만 충분히 알려지지 않음","refs":[1,2,3,4]},{"head":"복제 횟수의 차이","body":"특정 유전자의 사본 수 변화가 개인차와 관련될 수 있다는 예비 발견","refs":[5,6]},{"head":"지식의 빠른 변화","body":"이런 발견 때문에 유전학 교재가 금방 낡을 수 있음","refs":[7,8]}],"takeaway":"개인차의 원인을 확정한 연구로 그리지 않는다 · S5~6"}},{"id":"test1-03","unit":"test1","number":3,"title":"no.03","sentences":[{"n":1,"en":"When people in a movie hide their identities, the plot inevitably unfolds to the point where circumstances force them to reveal themselves or where they are found out.","ko":"영화 속 인물들이 정체를 숨길 때, 줄거리는 필연적으로 상황상 어쩔 수 없이 자신을 드러낼 수밖에 없거나 발각되는 지점까지 전개된다.","role":"장면 열기 — 영화에서 숨긴 정체는 결국 드러난다고 그린다."},{"n":2,"en":"By the end of the film, the mysteries of identity have been solved and the story concludes neatly.","ko":"영화가 끝날 무렵 , 정체에 대한 미스터리가 풀리고 이야기는 깔끔하게 결론이 난다.","role":"부연 — 끝에는 수수께끼가 풀리고 깔끔히 닫힌다고 잇는다."},{"n":3,"en":"But real life is not so scripted.","ko":"하지만 실제 삶 은 그렇게 대본화되어 있지 않다.","role":"전환 — 현실은 그런 대본이 아니라고 방향을 튼다."},{"n":4,"en":"In the real world, people do not usually wear costumes or disguises, but many do find subtle ways to make themselves seem better than they really are.","ko":"현실 세계에서, 사람들은 보통 분장이나 변장 을 하지 않지만, 많은 사람들이 스스로가 실제보다 더 나아 보이게 하는 미묘한 방법 을 정말로 찾는다.","role":"현실 대기 — 변장 대신 더 나아 보이려는 술수를 쓴다고 짚는다."},{"n":5,"en":"I suspect we have all done that at times, somewhere — some of us more than others — but anytime it happens it sets us up for personal and relational failure.","ko":"나는 우리 모두가, 우리 중 일부는 다른 사람들보다 더 많이, 때때로 , 어딘가에서 그렇게 했던 적이 있다고 생각하지만, 그런 일이 일어날 때마다 그것은 우리가 개인적, 관계적 실패 를 겪게 한다.","role":"자기 고백 — 누구나 그래 봤지만 그것이 실패를 부른다고 못 박는다."},{"n":6,"en":"Sometimes, it can lead to greater suffering.","ko":"가끔 그것은 더 큰 고통 으로 이어지기도 한다.","role":"보태기 — 때로는 더 큰 고통까지 온다고 무게를 더한다."},{"n":7,"en":"To enjoy success in our lives and in our dealings with others, we need to thoroughly know our true selves and allow the right people to know us completely as well.","ko":"삶에서 그리고 다른 사람들과의 관계에서 성공을 누리기 위해서, 우리는 우리 자신의 진정한 자아 를 철저히 알고, 또한 올바른 사람들이 우리를 완전히 알 수 있게 할 필요가 있다.","role":"당부 — 참된 자기를 알고 옳은 이에게 보이라며 맺는다."}],"core":"영화와 달리 현실에는 대본이 없어 꾸밈은 실패로 이어지니 진짜 자아를 알고 알려야 한다.","flow":[{"label":"영화","sentences":"S1-2","text":"영화에서는 숨긴 정체가 반드시 드러나고 이야기가 깔끔히 끝난다","refs":[1,2]},{"label":"전환","sentences":"S3","text":"그러나 실제 삶은 그렇게 대본화되어 있지 않다","refs":[3]},{"label":"현실","sentences":"S4","text":"분장은 안 해도 실제보다 나아 보이게 하는 미묘한 방법을 찾는다","refs":[4]},{"label":"결과","sentences":"S5-6","text":"그럴 때마다 개인적·관계적 실패를 부르고 더 큰 고통이 되기도 한다","refs":[5,6]},{"label":"결론","sentences":"S7","text":"성공하려면 진짜 자아를 철저히 알고 옳은 사람들에게 온전히 알려야 한다","refs":[7]}],"structure":[{"title":"영화 속 숨김","text":"반드시 드러나고 미스터리가 풀리며 이야기가 깔끔히 끝난다"},{"title":"현실 속 꾸밈","text":"대본이 없어 저절로 풀리지 않고 실패와 더 큰 고통으로 이어진다"}],"key_sentence_en":"To enjoy success in our lives and in our dealings with others, we need to thoroughly know our true selves and allow the right people to know us completely as well.","lead":"영화처럼 정체가 드러나는 장면과 현실의 자기 꾸밈은 어떻게 다를까?","image":"../../assets/daea1-test1-03-identity.webp","image_alt":"영화 무대에서 가면을 내려놓는 인물과, 일상에서 겉모습을 의식하는 인물 및 가까운 사람과 마주 앉는 장면","image_caption":"S1~2는 영화에서 정체가 해결되는 결말, S3~7은 대본 없는 현실에서 자신을 실제보다 좋아 보이게 꾸미는 문제와 진짜 자신을 아는 일을 대비한다.","prediction":{"question":"현실의 사람들은 영화처럼 가면을 써야만 정체를 숨길까?","choices":["그렇다. 실제 변장이 주된 방법이다.","아니다. 자신을 더 좋아 보이게 하는 미묘한 방식도 있다."],"answer":1,"actual":"S4는 현실에서 의상이나 변장은 흔치 않지만 자신을 실제보다 좋아 보이게 하는 미묘한 방법이 있다고 말한다."},"blocking_vocab":[{"word":"scripted","meaning":"대본대로 짜인"},{"word":"disguise","meaning":"변장"},{"word":"relational failure","meaning":"관계의 실패"}],"checks":[{"type":"핵심","q":"진짜 자아를 드러내야 한다는 글의 이유는?","choices":["현실의 모든 관계에는 영화처럼 정해진 결말이 있어서","자신을 실제보다 좋게 꾸미면 개인과 관계의 실패로 이어질 수 있어서"],"answer":1,"why":"S3~7은 현실에는 대본이 없고 자기 꾸밈은 실패를 부르므로 진짜 자아를 알아야 한다고 한다.","refs":[3,4,5,6,7]},{"type":"근거","q":"현실에서 사람들이 흔히 쓰는 ‘위장’으로 S4가 든 것은?","choices":["자신을 실제보다 더 좋아 보이게 하는 미묘한 방법","항상 실제 의상과 가면을 쓰는 행동"],"answer":0,"why":"S4는 실제 의상보다 subtle ways to make themselves seem better를 말한다.","refs":[4]},{"type":"변형 탐지","q":"영화와 현실의 대비로 원문과 맞는 것은?","choices":["Real-life identities are always neatly revealed because life is fully scripted.","Movie identities are neatly revealed, but real life is not so scripted."],"answer":1,"why":"S1~3의 영화와 현실 대비를 확인한다.","refs":[1,2,3]}],"easy_story":"영화에서는 정체를 숨긴 인물이 끝내 밝혀지고 이야기가 깔끔히 끝납니다. 현실에는 그런 대본이 없지만, 사람들은 남에게 실제보다 더 좋아 보이려는 작은 꾸밈을 하곤 합니다. 글은 그 꾸밈이 자신과 관계에 실패를 가져올 수 있다고 봅니다. 그래서 자신의 모습을 제대로 알고, 믿을 만한 사람에게 진짜 모습을 알리는 일이 중요하다고 말합니다."},{"id":"test1-04","unit":"test1","number":4,"title":"no.04","sentences":[{"n":1,"en":"Many companies these days employ planned obsolescence — a deliberate effort by companies to make their products unusable or outdated after a period of time.","ko":"오늘날 많은 회사가 계획적 구식화 를 이용하는데, 이것은 일정한 시간이 지난 후 자신들의 제품을 사용할 수 없거나 구식으로 만드는 회사들에 의한 의도적인 노력 이다.","role":"뜻풀이 — 계획적 구식화가 무엇인지 정의로 열어 준다."},{"n":2,"en":"A good example of this is a mobile phone.","ko":"이를 잘 보여 주는 좋은 예 가 휴대 전화 다.","role":"보기 세우기 — 휴대 전화를 잘 보여 주는 사례로 내세운다."},{"n":3,"en":"Mobile phones are often designed with only current technology, despite the manufacturer’s knowledge of future technology.","ko":"휴대전화는 종종 제조업체가 미래의 기술 에 대한 지식을 갖고 있음에도 불구하고 현재 기술로만 설계된다.","role":"설계 짚기 — 뒷 기술을 알면서도 현재 기술로만 만든다고 짚는다."},{"n":4,"en":"For instance, a mobile phone may have parts and connections that fit current products.","ko":"가령, 한 휴대 전화는 현재 제품에 딱 들어맞는 부품들과 접속부를 가지고 있을 것이다.","role":"구체화 ① — 지금 제품에 맞는 부품과 접속부를 든다."},{"n":5,"en":"The manufacturer may already be working on updated phones using different sizes of connections.","ko":"그 제조업체는 이미 다른 크기 의 접속부를 사용하는 최신 전화 를 만들고 있을지 모른다.","role":"구체화 ② — 제조사는 이미 다른 규격을 준비 중이라고 잇는다."},{"n":6,"en":"Although the current phone can be upgraded with software, eventually the “old” connections will make the product unusable and the customer needs a new phone.","ko":"소프트웨어로 현재의 전

화를 업그레이드할 수 있다 해도, 결국 ‘ 오래된 ’ 접속부 때문에 그 제품은 사용할 수 없게 되고 고객은 새로운 전화가 필요하게 된다.","role":"결론 — 결국 못 쓰게 되어 새로 사야 한다고 고리를 닫는다."},{"n":7,"en":"This strategy is not good for the environment, but by reducing the amount of time between repeat purchases, the company can improve their sales.","ko":"이러한 전략이 환경에는 좋지 않지만, 재구매 사이 의 기간을 단축함으로써 회사는 매출을 개선 할 수 있다.","role":"평가로 맺기 — 환경엔 나쁘나 매출엔 이롭다고 양면을 저울질한다."}],"core":"계획적 구식화는 제품을 일정 기간 뒤 못 쓰게 만들어 재구매 주기를 줄이고 매출을 올린다.","flow":[{"label":"정의","sentences":"S1-2","text":"제품을 일정 기간 뒤 못 쓰게 하려는 의도적 노력이며 휴대 전화가 좋은 예다","refs":[1,2]},{"label":"작동","sentences":"S3-4","text":"미래 기술을 알면서도 현재 기술로만 설계해 지금 제품에 맞는 접속부를 단다","refs":[3,4]},{"label":"전개","sentences":"S5","text":"제조사는 이미 다른 크기의 접속부를 쓰는 최신 전화를 만들고 있다","refs":[5]},{"label":"결과","sentences":"S6","text":"오래된 접속부 탓에 결국 못 쓰게 되어 새 전화를 사야 한다","refs":[6]},{"label":"평가","sentences":"S7","text":"환경에는 나쁘지만 재구매 주기를 줄여 매출을 개선한다","refs":[7]}],"structure":[{"title":"원인 — 의도된 설계","text":"미래 기술을 알면서도 현재 기술로만 만들어 접속부를 낡게 한다"},{"title":"결과 — 짧아진 주기","text":"고객은 새 제품을 사야 하고 회사는 매출을 올린다 — 환경에는 나쁘다"}],"key_sentence_en":"Many companies employ planned obsolescence, and by reducing the amount of time between repeat purchases, the company can improve their sales.","lead":"아직 작동하는 전화도 왜 새 제품과 연결되지 않을까?","image":"../../assets/daea1-test1-04-obsolescence.webp","image_alt":"작동하는 구형 휴대전화와 맞지 않는 연결 부품, 새 규격의 휴대전화, 쌓여 가는 전자폐기물","image_caption":"S3~6의 연결 규격 불일치와 S7의 환경 문제를 나타낸다. 특정 실제 기종이나 연결 방식의 사례로 단정하지 않는다.","prediction":{"question":"소프트웨어를 고칠 수 있어도 구형 휴대전화가 결국 쓰기 어려워지는 이유는?","choices":["연결 부품의 옛 규격이 새 제품과 맞지 않아서","모든 부품이 같은 날 완전히 고장 나서"],"answer":0,"actual":"S4~6은 새 제품의 연결 규격이 달라지면 기존 휴대전화는 소프트웨어를 올려도 구형 연결 부품 때문에 결국 쓰기 어려워진다고 한다."},"blocking_vocab":[{"word":"planned obsolescence","meaning":"계획적 구식화"},{"word":"outdated","meaning":"구식이 된"},{"word":"repeat purchase","meaning":"재구매"}],"checks":[{"type":"핵심","q":"계획적 구식화의 목적과 결과는?","choices":["제품을 영구적으로 쓰게 해 재구매를 없앤다.","제품을 일정 기간 뒤 못 쓰게 해 재구매 간격을 줄이고 매출을 높인다."],"answer":1,"why":"S1이 전략을 정의하고 S7이 재구매 간격과 매출의 관계를 밝힌다.","refs":[1,7]},{"type":"근거","q":"휴대전화가 소프트웨어 업그레이드 뒤에도 결국 못 쓰게 되는 이유는?","choices":["오래된 연결 부품의 규격이 새 제품과 맞지 않아서","제조사가 소프트웨어를 아예 만들지 않아서"],"answer":0,"why":"S4~6은 연결 부품 규격의 변화와 구형 연결의 한계를 설명한다.","refs":[4,5,6]},{"type":"변형 탐지","q":"환경과 매출에 관한 S7과 맞는 것은?","choices":["The strategy helps the environment but always lowers company sales.","The strategy harms the environment but can improve company sales."],"answer":1,"why":"S7은 환경에는 좋지 않지만 매출은 올릴 수 있다고 한다.","refs":[7]}],"easy_story":"지금 쓰는 휴대전화는 멀쩡해 보여도 새 제품의 접속부 크기가 달라지면 오래된 기기와 함께 쓰기 어려워질 수 있습니다. 제조사가 미래 기술을 알면서도 현재 제품을 그렇게 설계하면 고객은 예정보다 빨리 새 전화를 사야 할 수 있어요. 글은 이런 의도적인 수명 단축을 ‘계획적 구식화’라고 부릅니다. 회사 매출에는 유리하지만 환경에는 좋지 않다는 평가도 함께 나옵니다."},{"id":"test1-05","unit":"test1","number":5,"title":"no.05","sentences":[{"n":1,"en":"We usually look for nervousness as one of the signs of lying — like the person is worried about getting caught.","ko":"우리는 보통 거짓말의 징후 중 하나로 초조함 을 찾는다 ― 그 사람이 들킬까 걱정하는 것처럼.","role":"통념 놓기 — 거짓말의 표시로 초조함을 찾는다고 먼저 깐다."},{"n":2,"en":"But a made-up story itself can also tell us if someone is lying.","ko":"하지만 지어낸 이야기 또한 그 자체로 누군가 거짓말을 하고 있는지를 우리에게 알려 줄 수 있다.","role":"방향 틀기 — 이야기 자체도 알려 준다며 새 실마리를 든다."},{"n":3,"en":"One thing is almost always missing from a story that is not true — what went wrong.","ko":"사실이 아닌 이야기에서는 한 가지가 거의 항상 빠져 있는데, 바로 무엇이 잘못되었는지 에 대한 것이다.","role":"핵심 제시 — 거짓 이야기엔 잘못된 일이 빠진다고 못 박는다."},{"n":4,"en":"Events that are made up rarely include any negative details.","ko":"지어낸 사건들은 부정적인 세부 내용을 거의 포함하지 않는다.","role":"바꿔 말하기 — 지어낸 사건엔 부정적 대목이 없다고 다시 짚는다."},{"n":5,"en":"A person who is lying is concerned about getting their story straight, and their thoughts are essentially one-dimensional.","ko":"거짓말을 하는 사람은 자기 이야기의 앞뒤를 맞추는 데 신경 쓰고, 그들의 생각은 본질적으로 일차원적 이다.","role":"원인 ① — 앞뒤 맞추기에 매여 생각이 단순해진다고 푼다."},{"n":6,"en":"So the story tends to include only primary thoughts — which are positive.","ko":"그래서 그 이야기는 최초의 생각 , 즉 긍정적인 생각만을 포함하는 경향이 있다.","role":"결론 — 그래서 최초의 긍정적 생각만 담긴다고 잇는다."},{"n":7,"en":"This is because negation is not a primary emotion.","ko":"이것은 부정이 기본 정서 가 아니기 때문이다.","role":"원인 ② — 부정이 기본 정서가 아니라는 이치를 댄다."},{"n":8,"en":"In other words, to think of something negative, you have to think of the positive first.","ko":"달리 말하면 , 부정적인 무언가를 생각하려면 여러분은 먼저 긍정적인 것을 생각해야 한다.","role":"풀어 주기 — 부정하려면 긍정을 먼저 떠올려야 한다고 쉽게 푼다."},{"n":9,"en":"In much the same way, if I said “Don’t think of an elephant,” you could not fulfill my request.","ko":"내가 여러분에게 ‘ 코끼리를 생각하지 말라’고 하면, 여러분이 내 요청을 이행할 수 없는 것과 대체로 같은 것이다.","role":"빗대기 — 코끼리를 생각하지 말라는 말로 알기 쉽게 보인다."},{"n":10,"en":"In order to process the information, you need to first think of an elephant.","ko":"정보를 처리 하기 위해서, 여러분은 먼저 코끼리를 생각해야 하는 것이다.","role":"비유 마무리 — 처리하려면 먼저 떠올려야 한다고 매듭짓는다."},{"n":11,"en":"Ask a friend to tell you about their last vacation.","ko":"친구에게 지난 휴가 에 대해 이야기할 것을 요청해 보라.","role":"실험 권하기 — 친구에게 지난 휴가를 물어보라고 시켜 본다."},{"n":12,"en":"He or she will cover all the bases, both positive and negative — maybe the food was good, maybe the flight was delayed.","ko":"그는 긍정적인 것과 부정적인 것 모든 면 을 다룰 것이다 ― 아마 음식은 좋았고 아마 비행기는 연착했을 것이다.","role":"예상 결과 ① — 좋은 일과 나쁜 일이 함께 나온다고 내다본다."},{"n":13,"en":"Then ask someone to make up a story about a vacation that they never went on.","ko":"그런 다음 누군가에게 그들이 결코 가 보지 않은 휴가에 관한 이야기를 지어낼 것을 요청해 보라.","role":"대조 실험 — 가 보지 않은 휴가를 지어내 보라고 짝을 세운다."},{"n":14,"en":"You’ll notice that the elements of the story are usually all positive.","ko":"여러분은 그 이야기의 요소들 이 대체로 모두 긍정적이라는 것을 알아차리게 될 것이다.","role":"예상 결과 ② — 그 이야기는 온통 긍정뿐일 것이라 짚는다."},{"n":15,"en":"The baggage never gets lost on a made-up trip.","ko":"지어낸 여행 에서 짐은 절대 분실되지 않는다.","role":"한마디로 맺기 — 지어낸 여행엔 짐이 없어지지 않는다고 못 박는다."}],"core":"지어낸 이야기는 부정적인 세부가 빠지므로 이야기 자체가 거짓말인지를 알려 준다.","flow":[{"label":"통념","sentences":"S1-2","text":"보통 초조함을 거짓의 징후로 보지만 이야기 자체도 알려 준다","refs":[1,2]},{"label":"주장","sentences":"S3-4","text":"사실이 아닌 이야기에는 무엇이 잘못됐는지가 거의 빠져 있다","refs":[3,4]},{"label":"까닭","sentences":"S5-8","text":"거짓말하는 사람의 생각은 일차원적이라 긍정만 담기며 부정은 기본 정서가 아니다","refs":[5,6,7,8]},{"label":"비유","sentences":"S9-10","text":"「코끼리를 생각하지 말라」는 요청을 이행할 수 없는 것과 같다","refs":[9,10]},{"label":"실험","sentences":"S11-15","text":"실제 휴가는 좋고 나쁨이 다 나오지만 지어낸 여행에서는 짐이 분실되지 않는다","refs":[11,12,13,14,15]}],"structure":[{"title":"실제 겪은 이야기","text":"좋은 일과 나쁜 일이 함께 나온다 — 음식은 좋았고 비행기는 연착했다"},{"title":"지어낸 이야기","text":"긍정만 남는다 — 지어낸 여행에서 짐은 절대 분실되지 않는다"}],"key_sentence_en":"A made-up story itself can tell us if someone is lying, because events that are made up rarely include any negative details.","blocking_vocab":[{"word":"made-up story","meaning":"지어낸 이야기"},{"word":"negative detail","meaning":"부정적인 세부"},{"word":"one-dimensional","meaning":"단선적인"}],"checks":[{"type":"핵심","q":"지어낸 이야기에서 흔히 빠지는 것은?","choices":["일이 잘못된 부정적인 세부","긍정적인 주요 내용"],"answer":0,"why":"S3~6은 거짓 이야기에서 부정적 세부가 거의 없고 긍정적인 주된 생각만 남는다고 한다.","refs":[3,4,5,6]},{"type":"사례 근거","q":"실제로 다녀온 여행 이야기의 예로 글이 든 부정적 세부는?","choices":["수하물이 반드시 분실됨","비행기가 지연됨"],"answer":1,"why":"S12에는 flight was delayed가 실제 여행 이야기의 예이고 S15의 baggage never gets lost는 지어낸 여행의 특징이다.","refs":[12,15]},{"type":"변형 탐지","q":"지어낸 여행 이야기에 관한 S13~15와 맞는 것은?","choices":["Made-up vacation stories are usually all positive and omit lost baggage.","Made-up vacation stories usually include many negative details and lost baggage."],"answer":0,"why":"S14~15는 지어낸 이야기가 대개 긍정적인 내용만 있고 수하물 분실이 없다고 한다.","refs":[13,14,15]}],"easy_story":"거짓말을 찾을 때 얼굴의 긴장만 보는 대신 이야기 내용도 보자는 글입니다. 실제 여행을 말하면 좋았던 일과 비행기 지연 같은 나쁜 일이 섞일 수 있어요. 반면 여행을 지어내는 사람은 이야기를 맞추느라 잘못된 일을 빠뜨리고 좋은 일 위주로 말하는 경향이 있다는 주장입니다. ‘가짜 여행에서는 짐을 잃어버리지 않는다’는 끝 문장은 그 대비를 기억하게 합니다.","diagram":{"kind":"compare","title":"실제 여행 이야기와 지어낸 여행 이야기","items":[{"head":"실제 경험 이야기","body":"좋았던 일과 불편했던 일이 함께 나올 수 있음 · 음식이 좋고 비행기가 지연됨","refs":[11,12]},{"head":"지어낸 이야기의 경향","body":"부정적인 세부가 빠지고 긍정적인 요소만 남기 쉬움 · 짐이 분실되지 않음","refs":[3,4,13,14,15]}],"takeaway":"한 세부만으로 거짓말을 확정하는 법칙이 아니라 글이 말하는 경향 · S3~4, S14"}}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 대아고1 Booster 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button><p class="translation">${esc(s.ko)}</p></div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

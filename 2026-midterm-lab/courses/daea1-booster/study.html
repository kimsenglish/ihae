<script id="course-data" type="application/json">{"course":"대아고1 Booster 부교재","units":[{"id":"ch04","label":"4과 · 동사의 이해","scope":"p44~54 · 문법·독해","passages":[{"id":"ch04-01","unit":"ch04","number":1,"title":"p45 · 독해훈련","sentences":[{"n":1,"en":"Pencils of Promise is a non-profit organization that builds needed schools and increases educational opportunities in the developing world, such as Ghana and Laos.","ko":"Pencils of Promise는 가나와 라오스 같은 개발 도상국 에서 필요한 학교를 짓고 교육의 기회를 증대시키는 비영리 단체 이다.","role":"화제 열기 — 단체의 성격과 활동 지역을 먼저 밝힌다."},{"n":2,"en":"Founder Adam Braun got the idea for the name, Pencils of Promise, after he had met a boy begging in India.","ko":"설립자 Adam Braun은 인도에서 구걸을 하는 한 소년을 만난 후 Pencils of Promise라는 이름에 대한 아이디어를 얻었다 .","role":"일화 들기 — 이름이 어디서 왔는지로 이야기를 연다."},{"n":3,"en":"Adam asked the boy what he wanted most in the world and he replied, “A pencil.”","ko":"Adam은 그 소년에게 그가 세상에서 가장 원하는 것 이 무엇인지 물었고 그 아이는 “ 연필 이요.”라고 대답했다.","role":"장면 보이기 — 소년의 한마디가 이름의 씨앗이 된다."},{"n":4,"en":"Realizing the importance of education in many developing countries, Adam spent years handing out thousands of pencils and pens across fifty countries before founding Pencils of Promise.","ko":"많은 개발 도상국에서의 교육의 중요성 을 깨닫고, Adam은 Pencils of Promise를 설립하기 전에 수천 개의 연필과 펜을 전 세계 50개국에 나누어 주며 몇 년을 보냈다.","role":"준비 과정 — 단체를 세우기 전의 오랜 활동을 든다."},{"n":5,"en":"Since it was established in 2008, the charity has built more than 300 schools and helped more than 30,000 kids go to school.","ko":"2008년에 설립된 이래로 , 그 자선 단체는 300개 이상의 학교 를 지었고, 3만 명 이상의 아이들이 학교에 갈 수 있도록 도왔다.","role":"수치 제시 — 설립 뒤 쌓인 실적을 숫자로 든다."},{"n":6,"en":"It also supports projects through ongoing teacher training and scholarships.","ko":"그것은 또한 지속적인 교사 양성 과 장학금 을 통해 프로젝트들을 지원한다.","role":"부연 — 학교 건립 밖의 지원까지 덧붙인다."}],"core":"한 소년의 연필 한 자루에서 시작된 단체가 학교를 짓고 아이들을 학교에 보내고 있다.","flow":[{"label":"소개","sentences":"S1","text":"개발 도상국에 학교를 짓고 교육 기회를 넓히는 비영리 단체다","refs":[1]},{"label":"일화","sentences":"S2-3","text":"인도에서 만난 소년이 가장 원한 것이 연필이었고 거기서 이름이 왔다","refs":[2,3]},{"label":"준비","sentences":"S4","text":"설립 전 몇 해 동안 50개국에 수천 개의 연필과 펜을 나눠 주었다","refs":[4]},{"label":"성과","sentences":"S5","text":"2008년 설립 이래 학교 300개를 짓고 아이 3만 명을 도왔다","refs":[5]},{"label":"부연","sentences":"S6","text":"교사 양성과 장학금을 통해 프로젝트도 지원한다","refs":[6]}],"structure":[{"title":"계기 — 소년의 연필 한 자루","text":"인도에서 구걸하던 소년이 가장 원한 것이 연필이었다"},{"title":"결과 — 학교 300개","text":"설립 뒤 학교 300개를 짓고 아이 3만 명을 학교에 보냈다"}],"key_sentence_en":"Pencils of Promise, whose name came from a begging boy’s wish for a pencil, has built more than 300 schools and helped more than 30,000 children go to school.","lead":"한 소년이 ‘연필 한 자루’를 원한다고 말한 뒤, 어떤 일이 시작되었을까?","image":"../../assets/daea1-ch04-01-pencil.webp","image_alt":"한 손에서 다른 손으로 연필 한 자루를 건네는 모습을 중심으로 표현한 교육용 그림","image_caption":"소년이 가장 원한 것은 연필 한 자루였다. 그림 속 학교는 이후 교육 지원을 나타내는 상징이다.","prediction":{"question":"단체 이름 ‘Pencils of Promise’의 출발점은 무엇일까?","choices":["한 소년이 가장 원한다고 말한 연필 한 자루","처음부터 계획된 대규모 학교 건설 사업"],"answer":0,"actual":"설립자 Adam Braun은 인도에서 만난 소년이 가장 원하는 것이 연필이라고 답한 경험에서 이름의 아이디어를 얻었다."},"blocking_vocab":[{"word":"non-profit organization","meaning":"비영리 단체"},{"word":"educational opportunity","meaning":"교육 기회"},{"word":"found","meaning":"설립하다"},{"word":"charity","meaning":"자선 단체"}],"checks":[{"type":"핵심","q":"이 글의 중심 내용으로 가장 알맞은 것은?","choices":["한 소년의 연필 한 자루에서 시작한 단체가 교육 기회를 넓혔다.","연필 대신 태블릿을 주는 것이 교육의 핵심이라고 주장한다.","Adam Braun은 단체 설립 전에 학교 300개를 지었다."],"answer":0,"why":"S2~5에서 연필을 원한 소년과 설립 전 활동, 설립 후 학교 건설·등교 지원이 이어진다.","refs":[2,3,4,5]},{"type":"순서·근거","q":"원문에서 연필과 펜을 나누어 준 시기는 언제인가?","choices":["Pencils of Promise를 설립하기 전","단체가 학교 300개를 세운 뒤","소년을 만나기 전"],"answer":0,"why":"S4의 before founding Pencils of Promise가 순서를 결정한다.","refs":[4]},{"type":"변형 탐지","q":"원문의 사실과 일치하는 문장은?","choices":["Since it was established in 2008, the charity has built more than 300 schools.","Before it was established in 2008, the charity had already built more than 300 schools."],"answer":0,"why":"S5는 2008년 설립 이래 300개 이상의 학교를 지었다고 한다. 설립 전으로 바꾸면 틀린다.","refs":[5]}]},{"id":"ch04-02","unit":"ch04","number":2,"title":"p47 · 독해훈련","sentences":[{"n":1,"en":"The history of science is littered with theories that scientists once believed, but which they now reject.","ko":"과학의 역사는 과학자들이 한때 믿었지만 지금은 인정하지 않는 이론들로 어지럽혀져 있다.","role":"주장 세우기 — 과학사는 버려진 이론의 더미라고 못 박는다."},{"n":2,"en":"For nearly two thousand years, bad air, or “miasma,” emanating from rotting organic matter was believed to be the chief cause of disease — until the nineteenth century, when other scientists found that the diseases are caused by germs.","ko":"거의 2천 년 동안, 썩어 가는 유기물에서 나오는 나쁜 공기, 즉 ‘독기’가 질병의 주요 원인 이라고 믿어졌는데, 다른 과학자들이 질병이 세균 에 의해 야기된다는 것을 발견한 19세기까지 그랬다.","role":"사례 제시 — 독기설이 세균설로 갈아치워진 일을 든다."},{"n":3,"en":"A thousand years of precision measurements and mathematical arguments had established that the Sun, planets, and stars all move around the stationary Earth — until a series of scientists, from Copernicus to Newton, questioned and overturned this theory.","ko":"천 년간의 정밀 측정 과 수학적 논증이 태양, 행성, 별들 모두가 움직이지 않는 지구 주변을 돌고 있다는 것을 확증했는데, 이는 코페르니쿠스에서 뉴턴에 이르기까지 일련의 과학자들이 의문을 제기하고 이 이론을 뒤집기까지였다.","role":"사례 추가 — 천 년을 버틴 천동설이 뒤집힌 일을 든다."},{"n":4,"en":"After that, Newton’s theory of universal gravitation was accepted as the true explanation of the motions of the Moon around the Earth and the Earth around the Sun.","ko":"이후 뉴턴의 만유인력 이론 은 지구 주위를 도는 달과 태양 주위를 도는 지구의 움직임에 대한 진정한 설명 으로 받아들여졌다.","role":"이어 붙이기 — 새 이론이 그 자리를 차지했다고 잇는다."},{"n":5,"en":"But today even Newton’s theory has been mostly pushed aside for Einstein’s theory of relativity.","ko":"그러나 오늘날 뉴턴의 이론조차도 아인슈타인의 상대성 이론에 대체로 밀려나 있다.","role":"맺음 — 뉴턴조차 예외가 아니라며 첫 주장으로 되돌아온다."}],"core":"과학사는 한때 믿었다가 버린 이론들로 가득하며 뉴턴조차 예외가 아니다.","flow":[{"label":"주장","sentences":"S1","text":"과학의 역사는 한때 믿었지만 지금은 인정하지 않는 이론들로 어지럽다","refs":[1]},{"label":"사례","sentences":"S2","text":"2천 년 가까이 믿어진 독기설이 19세기 세균의 발견으로 뒤집혔다","refs":[2]},{"label":"사례","sentences":"S3","text":"천 년의 측정과 논증이 세운 천동설이 코페르니쿠스에서 뉴턴까지로 무너졌다","refs":[3]},{"label":"전개","sentences":"S4","text":"그 뒤 뉴턴의 만유인력이 참된 설명으로 받아들여졌다","refs":[4]},{"label":"맺음","sentences":"S5","text":"그러나 오늘날 뉴턴조차 상대성 이론에 대체로 밀려나 있다","refs":[5]}],"structure":[{"title":"한때 참이던 이론","text":"독기설·천동설·뉴턴의 만유인력이 차례로 정설이었다"},{"title":"지금 밀려난 자리","text":"세균설·코페르니쿠스·아인슈타인에게 차례로 자리를 내주었다"}],"key_sentence_en":"Scientific theories that were once accepted as true have been overturned one after another, and even Newton’s theory has been pushed aside."},{"id":"ch04-03","unit":"ch04","number":3,"title":"p49 · 독해훈련","sentences":[{"n":1,"en":"It is important to have members of a group meeting generate ideas individually before the group gets together for discussion.","ko":"그룹이 토론을 위해 모이기 전에 그룹 회의 구성원들이 개별적으로 아이디어를 낼 수 있도록 하는 것이 중요하다 .","role":"주장 세우기 — 토론에 앞서 혼자 생각해 두라고 내건다."},{"n":2,"en":"It is best if they write down their ideas and give them to the group leader in advance.","ko":"그들이 자신의 아이디어를 글로 써서 그룹 리더에게 미리 주는 것이 가장 좋다.","role":"절차 설명 — 먼저 글로 적어 미리 내라고 이른다."},{"n":3,"en":"The ideas then have to be distributed to the group members without saying who presented which ideas.","ko":"그런 다음 그 아이디어들은 누가 어떤 아이디어를 냈는지 언급 없이 그룹 구성원들에게 배포되어야 한다.","role":"절차 잇기 — 누가 냈는지 감춘 채 돌리라고 이른다."},{"n":4,"en":"This step minimizes the extent to which people can serve as immediate advocates for their ideas.","ko":"이런 단계가 사람들로 하여금 자신의 아이디어에 즉각적인 옹호자 가 되는 정도를 최소화한다 .","role":"까닭 대기 — 익명으로 돌리는 이유를 밝힌다."},{"n":5,"en":"After the ideas have been distributed, everyone should take some time to expand on them.","ko":"아이디어가 배포된 후 , 모두가 그것들을 확장시킬 시간을 가져야 한다.","role":"절차 맺기 — 받은 아이디어를 각자 키우게 한다."},{"n":6,"en":"After each group member has generated ideas and has had a chance to build on the ideas from other people, the group should have the opportunity to engage in discussion.","ko":"각각의 그룹 구성원이 아이디어를 내고 다른 사람들의 아이디어를 기반으로 발전시키는 기회를 가지고 난 뒤, 그 그룹은 토론에 참여할 기회를 가져야 한다.","role":"맺음 — 이 모두를 마친 뒤에야 토론이라고 매듭짓는다."}],"core":"토론에 앞서 각자 아이디어를 내고 익명으로 돌려 키운 뒤에야 그룹이 토론에 들어가야 한다.","flow":[{"label":"주장","sentences":"S1","text":"모이기 전에 구성원이 개별적으로 아이디어를 내게 하는 것이 중요하다","refs":[1]},{"label":"절차","sentences":"S2-3","text":"글로 적어 미리 내고 누가 냈는지 밝히지 않은 채 배포한다","refs":[2,3]},{"label":"까닭","sentences":"S4","text":"그래야 자기 아이디어의 즉각적인 옹호자가 되는 일이 줄어든다","refs":[4]},{"label":"절차","sentences":"S5","text":"배포된 뒤 모두가 그것을 확장할 시간을 갖는다","refs":[5]},{"label":"맺음","sentences":"S6","text":"각자 내고 남의 것을 발전시킨 뒤에야 그룹이 토론에 들어간다","refs":[6]}],"structure":[{"title":"문제 — 즉각적인 옹호","text":"바로 토론에 들어가면 자기 아이디어의 옹호자가 되어 버린다"},{"title":"해결 — 익명으로 돌리기","text":"미리 적어 내고 누가 냈는지 지운 채 돌린 뒤에야 토론한다"}],"key_sentence_en":"Members should generate and expand ideas on their own and receive them anonymously before the group begins its discussion."},{"id":"ch04-04","unit":"ch04","number":4,"title":"p51 · 독해훈련","sentences":[{"n":1,"en":"What surprises anyone in his or her introduction to medieval cooking is the rich variety of spices.","ko":"중세 요리를 처음 접한 사람을 놀라게 하는 것 은 풍부하고 다양한 양념이다.","role":"화제 열기 — 중세 요리에서 가장 먼저 눈에 띄는 것을 든다."},{"n":2,"en":"While a twentieth-century cook might prefer to emphasize one specific taste in a dish, using a limited number of aromatic ingredients, medieval cooks must have believed “more is better.”","ko":"20세기 요리사는 아마도 제한된 수의 향신료를 사용하면서 요리에서 한 가지 특정한 맛 을 강조하는 것을 선호하는 반면에, 중세 요리사는 ‘ 많을수록 좋다 ’라고 믿었음이 틀림없다.","role":"맞세우기 — 오늘날 요리사와 중세 요리사를 나란히 놓는다."},{"n":3,"en":"They used to have eight to ten seasonings in a single dish.","ko":"그들은 요리 하나 에 여덟에서 열 가지 의 양념을 사용하곤 했다.","role":"수치 제시 — 한 요리에 쓰던 양념 수를 숫자로 든다."},{"n":4,"en":"A record shows that spices in medieval times were too expensive to be much in evidence in the cooking pot, but this turned out to be untrue.","ko":"한 기록에 따르면, 중세 시대의 양념은 너무 비싸서 냄비 속에 눈에 띌 정도로 많이 넣을 수 없었다고 하지만, 이것은 사실이 아닌 것으로 밝혀졌다.","role":"뒤집기 — 값 때문에 못 썼다는 기록을 사실이 아니라고 친다."},{"n":5,"en":"Many spices may have been costly, but they were highly sought after.","ko":"많은 양념이 비쌌을지 모르지만, 그것들은 매우 인기 있었다.","role":"부연 — 비싼 값이 오히려 인기를 막지 못했다고 잇는다."},{"n":6,"en":"Some common seasonings, like pepper, continue to be standard in the modern kitchen.","ko":"후추와 같이 몇몇 흔한 양념 은 현대 주방에서도 계속 기본 이 되고 있다.","role":"오늘로 잇기 — 지금까지 기본으로 남은 양념을 든다."},{"n":7,"en":"Other often-used spices, such as cassia, are used more modestly now.","ko":"계피와 같이 자주 사용되던 다른 양념은 현재는 더 삼가서 사용된다.","role":"맺음 — 이제는 절제해 쓰는 양념까지 짚어 마무리한다."}],"core":"중세 요리사는 양념을 아낌없이 썼고 비싸서 못 썼다는 기록은 사실이 아니었다.","flow":[{"label":"도입","sentences":"S1","text":"중세 요리를 처음 접한 사람을 놀라게 하는 것은 풍부하고 다양한 양념이다","refs":[1]},{"label":"대비","sentences":"S2-3","text":"20세기 요리사와 달리 중세 요리사는 「많을수록 좋다」를 믿어 여덟에서 열 가지를 썼다","refs":[2,3]},{"label":"뒤집기","sentences":"S4","text":"비싸서 많이 못 썼다는 기록은 사실이 아닌 것으로 밝혀졌다","refs":[4]},{"label":"근거","sentences":"S5","text":"비쌌을지 몰라도 양념은 매우 인기가 있었다","refs":[5]},{"label":"오늘","sentences":"S6-7","text":"후추는 지금도 기본이고 계피는 더 삼가서 쓰인다","refs":[6,7]}],"structure":[{"title":"20세기 요리사","text":"향신료를 아껴 한 가지 맛을 도드라지게 한다"},{"title":"중세 요리사","text":"「많을수록 좋다」며 한 요리에 여덟에서 열 가지를 썼다"}],"key_sentence_en":"Medieval cooks used many spices in a single dish because spices were highly sought after, and some of them are still standard today."},{"id":"ch04-05","unit":"ch04","number":5,"title":"p52 · READ & APPLY 1","sentences":[{"n":1,"en":"In a seminar for construction managers, a group engaged in a discussion about the importance of seeking input from work crews on job sites.","ko":"건설 관리자들을 위한 세미나에서, 한 집단이 작업 현장에서 직원들로부터 조언을 구하는 것의 중요성 에 대한 토론에 참가했다.","role":"장면 열기 — 세미나 토론의 주제를 먼저 놓는다."},{"n":2,"en":"Joe, a senior project manager, asked, “Won’t my people think I’m weak if I ask for their ideas?”","ko":"선임 프로젝트 관리자인 Joe는 “내가 직원들의 생각을 물으면 그들이 내가 약하다고 생각하지 않을까요?”라고 물었다.","role":"통념 세우기 — 물으면 약해 보인다는 걱정을 앞에 놓는다."},{"n":3,"en":"This led to a passionate discussion in which many of the younger participants shared their belief that when a boss asks for their contributions, they feel respected and included.","ko":"이것은 많은 젊은 참가자들이 상사가 그들의 기여를 요구할 때, 존중받고 포함되어 있다고 느낀다는 믿음을 공유하는 열정적인 토론으로 이어졌다.","role":"반박 — 젊은 참가자들이 정반대로 느낀다고 되받는다."},{"n":4,"en":"As the discussion continued, it became clear that the most important point was that they felt acknowledged when their suggestions were acted upon.","ko":"토론이 계속되면서, 가장 중요한 점은 그들이 자신들의 제안이 실행됐을 때 인정받는다고 느꼈다는 것임이 분명해졌다.","role":"핵심 짚기 — 묻는 데서 그치지 않고 실행까지 가야 한다고 짚는다."},{"n":5,"en":"As one of the participants explained, “It is so much better when the line of communication is open, and I feel that I’m being listened to.”","ko":"참가자들 중 한 명은 “ 소통 창구 가 열려 있을 때 훨씬 더 좋고, 내 말을 듣고 있다고 느낍니다.”라고 설명했다.","role":"인용 — 참가자의 말을 그대로 들어 앞말을 받친다."},{"n":6,"en":"In the old days of top-down hierarchy, Joe’s concern about asking and listening may have been well founded, but that world is fading.","ko":"하향식 계급제가 있던 구시대에서는 (직원의 조언을) 묻고 듣는 것에 대한 Joe의 걱정이 근거가 충분했을지 모르지만, 그런 세상은 사라지고 있다 .","role":"시대 가르기 — 그 걱정이 통하던 세상이 저물었다고 말한다."},{"n":7,"en":"Now being open to the influence of others is a key to expanding your influence.","ko":"이제 다른 사람들의 영향에 열려 있는 것 이 여러분의 영향력을 넓히는 열쇠이다.","role":"맺음 — 열린 태도가 영향력의 열쇠라고 매듭짓는다."}],"core":"의견을 물으면 약해 보일까 걱정하지만 사람들은 오히려 존중받는다고 느끼며 실행될 때 인정받는다.","flow":[{"label":"물음","sentences":"S1-2","text":"세미나에서 한 선임 관리자가 물으면 약해 보이지 않겠느냐고 걱정한다","refs":[1,2]},{"label":"반박","sentences":"S3","text":"젊은 참가자들은 상사가 기여를 구할 때 존중받는다고 느낀다고 말한다","refs":[3]},{"label":"핵심","sentences":"S4","text":"제안이 실행되었을 때 인정받는다고 느낀 것이 가장 중요한 점이었다","refs":[4]},{"label":"인용","sentences":"S5","text":"소통 창구가 열려 있고 내 말을 듣고 있다고 느낄 때 훨씬 좋다","refs":[5]},{"label":"맺음","sentences":"S6-7","text":"하향식 시대는 저물었고 남의 영향에 열려 있는 것이 영향력의 열쇠다","refs":[6,7]}],"structure":[{"title":"구시대의 걱정","text":"물으면 약해 보인다 — 하향식 계급제에서는 근거가 있었다"},{"title":"지금의 현장","text":"물어봐 주면 존중받는다고 느끼고 실행해 주면 인정받는다고 느낀다"}],"key_sentence_en":"Asking for and acting on others’ ideas makes people feel respected, so being open to their influence is now the key to expanding your own."},{"id":"ch04-06","unit":"ch04","number":6,"title":"p52 · READ & APPLY 2","sentences":[{"n":1,"en":"According to the Population Research Bureau (PRB), approximately 108 billion humans have populated the planet since the advent of the species.","ko":"인구조사국(PRB)에 따르면, 종(인류)의 출현 이후로 약 1,080억 명 의 인간이 지구에 거주해 왔다.","role":"수치 제시 — 지금까지 지구에 살았던 사람 수를 든다."},{"n":2,"en":"Each person who has come and gone was unique, and each of the 7.5 billion people alive today is unique.","ko":"왔다 간(태어나 살다 죽은) 사람마다 제각기 독특했고 , 오늘날 살아 있는 75억 인구 도 제각기 독특하다.","role":"전제 놓기 — 지난 사람도 지금 사람도 저마다 다르다고 세운다."},{"n":3,"en":"There’s no one like you in all of human history.","ko":"인류 역사 상 당신과 같은 사람은 없다.","role":"좁히기 — 그 이야기를 읽는 「당신」에게 곧장 대 본다."},{"n":4,"en":"The combination of your genetic endowment and the way that genetic material is influenced by your life experience results in a one-of-a-kind phenomenon.","ko":"당신의 유전적 자질 과 유전적 물질이 당신 삶의 경험에 의해 영향을 받는 방식의 조합은 독특한 현상 을 야기한다.","role":"까닭 대기 — 타고난 것과 겪은 것의 만남이 그 차이를 만든다."},{"n":5,"en":"And yet, in so many ways, we are all the same.","ko":"그럼에도 불구하고, 아주 많은 면에서, 우리는 모두 똑같다 .","role":"뒤집기 — 다름에서 같음으로 이야기를 돌려세운다."},{"n":6,"en":"Our basic human needs for air, food, shelter, security, esteem, love, and so on are universal.","ko":"공기, 음식, 주거, 안전, 존중, 사랑 등에 대한 우리의 기본적인 인간적 욕구 는 보편적 이다.","role":"근거 대기 — 누구에게나 같은 욕구를 늘어놓아 받친다."},{"n":7,"en":"Everyone, everywhere, in every culture wants respect.","ko":"","role":"좁히기 — 그 보편성을 「존중」 하나로 모은다."},{"n":8,"en":"Leadership is the art of skillfully meeting universal human needs, including the need to be appreciated for being unique and the need for a sense of belonging and connection.","ko":"지도력은 독특한 존재로 인정받고자 하는 욕구와 소속 및 유대감에 대한 욕구를 포함하여, 보편적인 인간의 욕구를 능숙하게 충족시키는 기술이다.","role":"맺음 — 두 욕구를 함께 채우는 일이 지도력이라고 매듭짓는다."}],"core":"사람은 저마다 유일무이하지만 기본 욕구는 보편적이고 지도력은 그 둘을 함께 채우는 기술이다.","flow":[{"label":"수치","sentences":"S1","text":"인류 출현 이후 약 1,080억 명이 지구에 살아 왔다","refs":[1]},{"label":"전제","sentences":"S2-3","text":"지나간 사람도 오늘의 75억도 저마다 다르며 당신 같은 사람은 없다","refs":[2,3]},{"label":"까닭","sentences":"S4","text":"타고난 자질과 삶의 경험이 맞물려 유일무이한 현상을 낳는다","refs":[4]},{"label":"전환","sentences":"S5-7","text":"그럼에도 기본 욕구는 보편적이고 누구나 존중을 원한다","refs":[5,6,7]},{"label":"결론","sentences":"S8","text":"지도력은 독특함의 인정과 소속의 욕구를 함께 채우는 기술이다","refs":[8]}],"structure":[{"title":"다름","text":"1,080억 명이 살다 갔지만 당신과 같은 사람은 없다"},{"title":"같음","text":"공기·음식·안전·존중 같은 기본 욕구는 누구에게나 똑같다"}],"key_sentence_en":"Although every person is one of a kind, our basic needs are universal, and leadership means meeting both at once."},{"id":"ch04-07","unit":"ch04","number":7,"title":"p53 · READ & APPLY 3","sentences":[{"n":1,"en":"The arguments in favor of a single language of air traffic control are obvious.","ko":"항공 교통 관제의 단일 언어 에 찬성하는 주장은 명확하다 .","role":"주장 세우기 — 단일 언어에 찬성하는 근거가 뚜렷하다고 연다."},{"n":2,"en":"It is much safer if all pilots understand all conversations.","ko":"모든 조종사들이 모든 대화 를 이해할 수 있다면 훨씬 더 안전 하다.","role":"까닭 짚기 — 다 알아들으면 더 안전하다는 이유를 먼저 든다."},{"n":3,"en":"Pilots who have a two-way radio are supposed to always keep listening attentively on the appropriate frequency.","ko":"쌍방향 무전기 를 가진 조종사들은 항상 적절한 주파수로 주의를 기울여 계속 수신 하도록 되어 있다.","role":"규칙 들기 — 조종사가 늘 무엇을 듣게 되어 있는지 밝힌다."},{"n":4,"en":"They listen not only to messages addressed to themselves, but also to messages that are being sent to and from other pilots in their neighborhood.","ko":"그들은 자신들에게 전달되는 메시지뿐만 아니라 인근에 있는 다른 조종사들에게 오가는 메시지도 듣는다.","role":"범위 넓히기 — 듣는 대상이 남의 교신까지라고 짚는다."},{"n":5,"en":"In this way they can learn about weather and traffic conditions from other pilots, without having to keep referring to air traffic control.","ko":"이런 식으로 그들은 항공 교통 관제에 계속 문의하지 않고도 다른 조종사들로부터 날씨와 교통 상황 에 대해 알 수 있다.","role":"이득 제시 — 관제에 묻지 않고도 정보를 얻는다고 든다."},{"n":6,"en":"Furthermore, if they hear an error in someone else’s communications, they can draw attention to it.","ko":"게다가, 다른 누군가의 대화에서 오류를 듣게 되면 , 그들은 그것에 주의를 끌 수 있다.","role":"이득 추가 — 남의 실수까지 잡아낼 수 있다고 덧붙인다."},{"n":7,"en":"If more than one language is being used, the risk of a breakdown in communication inevitably increases.","ko":"둘 이상의 언어 가 사용되고 있다면, 의사소통 단절의 위험이 필연적으로 증가한다.","role":"맺음 — 언어가 둘 이상이면 위험이 커진다고 뒤집어 매듭짓는다."}],"core":"단일 언어라야 모든 조종사가 모든 교신을 알아들어 안전하고, 언어가 둘이면 위험이 커진다.","flow":[{"label":"주장","sentences":"S1-2","text":"단일 언어에 찬성하는 근거는 뚜렷하며 다 알아들으면 훨씬 안전하다","refs":[1,2]},{"label":"규칙","sentences":"S3","text":"무전기를 가진 조종사는 늘 적절한 주파수를 주의 깊게 듣게 되어 있다","refs":[3]},{"label":"범위","sentences":"S4","text":"자기 교신뿐 아니라 인근 조종사의 교신까지 듣는다","refs":[4]},{"label":"이득","sentences":"S5-6","text":"관제에 묻지 않고 날씨와 교통을 알고 남의 오류도 짚을 수 있다","refs":[5,6]},{"label":"맺음","sentences":"S7","text":"언어가 둘 이상이면 의사소통 단절의 위험이 필연적으로 커진다","refs":[7]}],"structure":[{"title":"원인 — 단일 언어","text":"모든 조종사가 모든 교신을 알아듣는다"},{"title":"결과 — 안전","text":"관제에 묻지 않고 정보를 얻고 남의 교신에서 오류까지 잡아낸다"}],"key_sentence_en":"A single language lets every pilot follow every conversation, so using more than one language inevitably raises the risk of a breakdown in communication."},{"id":"ch04-08","unit":"ch04","number":8,"title":"p53 · READ & APPLY 4","sentences":[{"n":1,"en":"Whether you have a “favorite” child is clearly in the eye of the beholder.","ko":"여러분에게 ‘편애하는’ 자녀가 있는지 여부 는 분명 보는 사람의 눈 에 달려 있다.","role":"주장 세우기 — 편애를 정하는 쪽이 부모가 아니라고 못 박는다."},{"n":2,"en":"That is, if your child thinks you play favorites, then you may as well accept it: You play favorites.","ko":"즉, 여러분의 자녀가 여러분이 편애한다고 생각한다면, 그것을 받아들이는 편이 낫다. 여러분이 편애하고 있다고 말이다.","role":"바꿔 말하기 — 아이가 그렇게 여기면 그게 곧 편애라고 잇는다."},{"n":3,"en":"To a child, a parent who treats different children differently is playing favorites.","ko":"아이 입장에서 , 다른 아이들을 다르게 대하는 부모는 편애하고 있는 것이다.","role":"잣대 대기 — 아이의 셈법으로는 다르게 대함이 곧 편애다."},{"n":4,"en":"Suppose you allow your 15-year-old to stay out until 9:00 on weekend nights, but insist that your 13-year-old be in by 6:00.","ko":"여러분이 15세 아이에게는 주말 밤에 9시까지 밖에 있는 것을 허락하지만, 13세 아이에게는 6시까지 들어와야 한다고 주장하는 것을 가정해 보자.","role":"사례 제시 — 통금 시간을 나이별로 다르게 잡아 본다."},{"n":5,"en":"You will undoubtedly be accused of being unfair.","ko":"","role":"결과 보이기 — 그렇게 하면 반드시 비난을 듣는다고 잇는다."},{"n":6,"en":"Likewise, if your 15-year-old notices that his younger sibling is not required, as he used to be at that age, to mow the lawn every Saturday morning, again you are playing favorites.","ko":"마찬가지로, 여러분의 15세 자녀가 자신은 동생 나이 때 매주 토요일 아침 잔디를 깎으라는 요구를 받았지만 동생은 그런 요구를 받지 않는다는 것을 알게 되면, 여러분은 다시 편애를 하는 셈이다.","role":"사례 추가 — 집안일 면제도 첫째에게는 편애로 보인다."},{"n":7,"en":"No matter that the 13-year-old can’t distinguish between flower beds and grass.","ko":"13세 아이가 화단과 잔디 를 구별하지 못하는 것은 중요하지 않다 .","role":"물러서기 — 면제에 그럴듯한 까닭이 있어도 소용없다고 친다."},{"n":8,"en":"Your firstborn child will no doubt take this as discrimination, and no explanation will convince him.","ko":"여러분의 첫째 아이는 의심의 여지 없이 이것을 차별로 받아들일 것이고, 어떤 해명도 그를 설득하지 못할 것이다.","role":"맺음 — 첫째는 차별로 못 박고 어떤 해명도 통하지 않는다."}],"core":"편애인지 아닌지는 부모가 아니라 그것을 보는 아이가 정하며 해명은 통하지 않는다.","flow":[{"label":"주장","sentences":"S1-2","text":"편애 여부는 보는 사람의 눈에 달렸고 아이가 그렇게 여기면 그것이 편애다","refs":[1,2]},{"label":"잣대","sentences":"S3","text":"아이에게는 다르게 대하는 부모가 곧 편애하는 부모다","refs":[3]},{"label":"보기","sentences":"S4-5","text":"통금을 나이별로 다르게 정하면 반드시 불공평하다는 비난을 듣는다","refs":[4,5]},{"label":"보기","sentences":"S6","text":"동생만 잔디 깎기를 면제받아도 다시 편애가 된다","refs":[6]},{"label":"맺음","sentences":"S7-8","text":"까닭이 있어도 소용없고 첫째는 차별로 받아들여 어떤 해명도 통하지 않는다","refs":[7,8]}],"structure":[{"title":"부모의 눈","text":"나이에 맞춰 다르게 대했을 뿐 그럴 만한 까닭이 있다"},{"title":"아이의 눈","text":"다르게 대하는 것이 곧 편애이고 어떤 해명도 통하지 않는다"}],"key_sentence_en":"Favoritism is decided by the child who sees it, so treating children differently looks like discrimination no matter how good the reason is."},{"id":"ch04-09","unit":"ch04","number":9,"title":"p54 · READ & APPLY 5","sentences":[{"n":1,"en":"Improving the infrastructure, landscape design, and building management to provide access to green walkable spaces provides a sustainable solution for promoting health and reducing morbidity.","ko":"걸어서 다닐 수 있는 녹지 공간에 대한 접근을 제공하기 위해 사회 기반 시설과 경관 설계, 건물 관리를 개선하는 것은 건강 증진과 질병률 감소 를 위한 지속 가능한 해결책 을 제시한다.","role":"해법 내걸기 — 걷기 좋은 녹지를 늘리는 일을 답으로 내놓는다."},{"n":2,"en":"Walkable neighborhoods reduce obesity and diabetes rates regardless of age, gender, or socioeconomic status.","ko":"걷기에 적합한 지역은 나이나 성별, 사회 경제적 지위에 상관없이 비만과 당뇨 를 줄여 준다.","role":"근거 제시 — 누구에게나 몸에 이롭다는 결과를 든다."},{"n":3,"en":"Researchers have even found that those living in areas characterized by dense greenspace have reduced mortality in comparison to those living in areas devoid of greenspace.","ko":"연구자들은 심지어 빽빽한 녹지 공간 이 특징인 지역에 사는 사람들이 녹지 공간이 없는 지역에 사는 사람들에 비해 사망률 이 감소했다는 것을 발견했다.","role":"근거 추가 — 녹지가 빽빽한 곳의 사망률이 더 낮다고 든다."},{"n":4,"en":"Their cognitive function has been shown to improve as well.","ko":"그들의 인지 기능 도 향상되는 것으로 나타났다.","role":"근거 보태기 — 몸에 이어 머리에도 이롭다고 덧붙인다."},{"n":5,"en":"While the environmental, physical, and mental health benefits are clearly documented, the value that greenspace has for the health of the overall community can be tremendous.","ko":"환경적, 신체적 및 정신적 건강상의 이점이 명확하게 문서화되었지만, 녹지 공간이 전체 지역 사회 의 건강에 대해 갖는 가치는 엄청날 수 있다.","role":"넓히기 — 개인의 건강에서 지역 사회의 가치로 눈을 옮긴다."},{"n":6,"en":"Civic engagement facilities, recreational and natural parks, as well as outdoor recreation facilities can have clear benefits for fostering positive social ties and a sense of place and can build social capital among individuals and groups.","ko":"야외 휴양 시설은 물론 시민 참여시설, 휴양 및 자연공원이 긍정적인 사회적 유대 와 장소 감각을 발전시키는데 분명한 혜택을 줄 수 있고, 개인들 간 그리고 단체들 간의 사회적 자본 을 만들어 낼 수 있다.","role":"맺음 — 시설과 공원이 사회적 자본까지 쌓는다고 매듭짓는다."}],"core":"걷기 좋은 녹지로 가는 길을 넓히면 개인의 건강을 넘어 지역 사회의 자본까지 자란다.","flow":[{"label":"해법","sentences":"S1","text":"시설과 경관, 건물 관리를 개선해 녹지 접근을 넓히는 것이 지속 가능한 해법이다","refs":[1]},{"label":"근거","sentences":"S2","text":"걷기 좋은 동네는 나이·성별·지위와 상관없이 비만과 당뇨를 줄인다","refs":[2]},{"label":"근거","sentences":"S3","text":"녹지가 빽빽한 곳의 주민은 그렇지 않은 곳보다 사망률이 낮다","refs":[3]},{"label":"근거","sentences":"S4","text":"그들의 인지 기능도 향상되는 것으로 나타났다","refs":[4]},{"label":"넓히기","sentences":"S5-6","text":"개인의 건강을 넘어 사회적 유대와 사회적 자본까지 키울 수 있다","refs":[5,6]}],"structure":[{"title":"원인 — 걷기 좋은 녹지","text":"시설·경관·건물 관리를 고쳐 녹지로 가는 길을 넓힌다"},{"title":"결과 — 건강과 공동체","text":"비만·당뇨·사망률이 낮아지고 인지 기능과 사회적 자본까지 자란다"}],"key_sentence_en":"Better access to green walkable spaces improves individual health and also builds social ties and social capital in the whole community."}]},{"id":"ch05","label":"5과 · 형용사적 수식어구","scope":"p59~64 · 독해만","passages":[{"id":"ch05-01","unit":"ch05","number":1,"title":"p59 · 독해훈련","sentences":[{"n":1,"en":"When you make an apology, look for ways to undo some of the hurt you have caused.","ko":"여러분이 사과 를 할 때, 여러분이 야기한 상처를 어느 정도 원상태로 돌리는 방법을 찾아라.","role":"당부 열기 — 사과할 땐 상처를 되돌릴 길을 찾으라고 이른다."},{"n":2,"en":"The goal here is not to bribe someone into liking you again, but to let him or her know you really care and feel bad about what you have done.","ko":"여기서 목적은 누군가에게 뇌물 을 써서 여러분을 다시 좋아하게 하는 것이 아니라, 여러분이 저지른 일에 대해 정말로 신경 쓰고 죄책감 을 느낀다는 것을 상대방이 알게 하는 것이다.","role":"목적 밝히기 — 환심 사기가 아니라 진심을 알리는 일이라 못 박는다."},{"n":3,"en":"If you blow off your friend, why not make plans to do something your friend loves?","ko":"만약 여러분이 친구를 바람맞힌다면 , 친구가 정말 좋아하는 무언가를 할 계획을 세우는 것이 어떻겠는가?","role":"사례 제시 — 친구를 바람맞혔다면 좋아하는 일을 계획하라고 든다."},{"n":4,"en":"That will show you care about your friend and the friendship.","ko":"그것은 여러분이 친구와 우정 에 대해 신경 쓴다는 것을 보여 줄 것이다.","role":"효과 — 그 행동이 마음을 보여 준다고 짚어 준다."},{"n":5,"en":"The same goes if your dad is upset that you borrowed his car and returned it with soda cans rolling around on the floorboard.","ko":"여러분이 아버지의 차를 빌렸다가 바닥에 음료수 캔 이 여기저기 굴러다니는 채로 돌려주어 아버지가 화가 난 경우에도 마찬가지이다 .","role":"사례 추가 — 아버지 차를 어지럽힌 경우로 같은 이치를 잇는다."},{"n":6,"en":"Make him an offer to clean it inside and out the next day.","ko":"다음 날 아버지에게 차를 안팎으로 세차하겠다고 제안해 보라.","role":"행동 제안 — 다음 날 세차하겠다고 나서 보라고 구체화한다."},{"n":7,"en":"Then, he may allow you to use his car again.","ko":"그러면, 아버지는 여러분이 차를 다시 쓸 수 있도록 허락해 줄지도 모른다.","role":"효과 — 그러면 다시 차를 빌려 줄지 모른다고 그려 준다."},{"n":8,"en":"If what you’ve done is a minor offence, a verbal apology should do, but if the hurt person is too upset to forgive or forget it, you should be sincere about your action plans.","ko":"만약 여러분이 저지른 일이 사소한 실수 라면 말로 하는 사과가 효과가 있을 테지만, 만약 마음상한 사람이 너무 화가 나 용서를 못 하거나 잊지 못한다면, 여러분은 행동 계획에 진심을 다해야 한다.","role":"맺음 — 사소하면 말로, 크면 행동으로 갚으라고 닫는다."}],"core":"사과할 때는 준 상처를 되돌릴 방법을 찾아야 하고, 상대가 많이 상했다면 행동 계획에 진심을 담아야 한다.","flow":[{"label":"지시","sentences":"S1","text":"사과할 때는 자신이 야기한 상처를 되돌릴 방법을 찾으라","refs":[1]},{"label":"목적","sentences":"S2","text":"환심을 사려는 것이 아니라 진심으로 마음 쓴다는 것을 알리는 것이다","refs":[2]},{"label":"예시","sentences":"S3-4","text":"친구를 바람맞혔다면 친구가 좋아할 일을 할 계획을 세워 본다","refs":[3,4]},{"label":"예시","sentences":"S5-7","text":"아버지 차를 지저분하게 돌려줬다면 세차를 제안한다","refs":[5,6,7]},{"label":"정리","sentences":"S8","text":"사소하면 말로 족하지만 많이 상했다면 행동 계획에 진심을 담아야 한다","refs":[8]}],"structure":[{"title":"문제 — 내가 준 상처","text":"바람맞히거나 빌린 물건을 함부로 다뤄 상대가 상했다"},{"title":"해결 — 되돌릴 행동","text":"환심이 아니라 상처를 되돌리는 구체적인 행동 계획을 내놓는다"}],"key_sentence_en":"When you make an apology, look for ways to undo some of the hurt you have caused, and if the hurt person is too upset, you should be sincere about your action plans.","lead":"진심 어린 사과는 말만 하는 것일까, 상처를 되돌릴 행동까지 제안하는 것일까?","image":"../../assets/daea1-ch05-01-apology.webp","image_alt":"차 바닥에 음료수 캔이 놓여 있고, 십대가 아버지에게 빈손으로 차 안을 가리키며 이야기하는 장면","image_caption":"차를 지저분하게 돌려준 뒤에는 다음 날 안팎으로 세차하겠다고 제안하는 것이 본문의 예시다. 그림은 제안하는 순간을 나타낸다.","prediction":{"question":"사과의 목적을 글쓴이는 무엇이라고 볼까?","choices":["상대가 다시 나를 좋아하게 만드는 것","상처를 되돌릴 방법을 찾아 진심을 행동으로 보이는 것"],"answer":1,"actual":"S1~2는 환심을 사는 것이 아니라 상처를 되돌릴 방법을 찾고 진심으로 마음 쓴다는 것을 알리는 것이라고 한다."},"blocking_vocab":[{"word":"undo the hurt","meaning":"준 상처를 어느 정도 되돌리다"},{"word":"bribe A into -ing","meaning":"A에게 뇌물을 써서 ~하게 하다"},{"word":"blow off","meaning":"바람맞히다"},{"word":"floorboard","meaning":"자동차 바닥"},{"word":"verbal apology","meaning":"말로 하는 사과"}],"checks":[{"type":"핵심","q":"글쓴이가 강조하는 사과의 방식은?","choices":["상대의 호감을 되찾기 위해 어떤 수단이든 쓰기","상처의 정도에 맞게 말이나 진심 어린 행동 계획으로 보상하기","사과하지 않고 시간이 지나기를 기다리기"],"answer":1,"why":"S1~2와 S8은 상처를 되돌릴 방법을 찾되, 큰 상처에는 진심 어린 행동 계획이 필요하다고 정리한다.","refs":[1,2,8]},{"type":"지칭","q":"S4의 That이 가리키는 행동은?","choices":["친구가 좋아하는 일을 함께할 계획을 세우는 것","친구를 계속 바람맞히는 것","아버지의 차를 다시 빌리는 것"],"answer":0,"why":"S3에서 제안한 make plans to do something your friend loves를 받는다.","refs":[3,4]},{"type":"변형 탐지","q":"S8의 뜻과 일치하는 문장을 고르세요.","choices":["For a minor offence, a verbal apology may be enough; for deeper hurt, sincere action plans matter.","For a minor offence, a verbal apology is never enough; for deeper hurt, an action plan is unnecessary."],"answer":0,"why":"S8은 사소한 실수와 큰 상처를 구분하고, 후자에는 진심 어린 행동 계획이 필요하다고 한다.","refs":[8]}]},{"id":"ch05-02","unit":"ch05","number":2,"title":"p61 · 독해훈련","sentences":[{"n":1,"en":"Some economies of scale are a result of the statistical law of large numbers.","ko":"일부 규모의 경제 는 큰 숫자의 통계 법칙 의 결과이다.","role":"연결 짓기 — 규모의 경제 일부가 통계 법칙에서 온다고 잇는다."},{"n":2,"en":"Loosely speaking, the law of large numbers states that the closer the average value of a sample of objects chosen randomly from some population is to the true mean of the population, the larger the size of the sample.","ko":"대략적으로 말해서, 큰 숫자의 법칙은 어떤 모집단에서 무작위로 선택된 대상 표본의 평균값이 모집단의 실제 평균에 가까울수록 그 표본의 크기가 더 크다고 진술한다.","role":"뜻풀이 — 표본이 클수록 참값에 가깝다는 법칙을 풀어 준다."},{"n":3,"en":"For example, there is much less variation in the death rate of a large population like the United States — i.e., the number of deaths per year divided by the population — than in the death rate of a small town.","ko":"예를 들어, 미국과 같은 큰 모집단의 사망률, 즉 연간 사망자 수 를 인구로 나눈 수는 작은 마을의 사망률보다 훨씬 더 변동이 적다 .","role":"보기 들기 — 큰 나라와 작은 마을의 사망률을 견주어 든다."},{"n":4,"en":"The current death rate of the U.S. population is about 720 per 100,000 per year, and does not change much from year to year.","ko":"현재 미국 인구의 사망률은 연간 10만 명당 720명 정도로 해마다 크게 변하지 않는다.","role":"수치 제시 — 미국은 10만 명당 720명으로 해마다 고르다고 든다."},{"n":5,"en":"In a small town with a population of 500, however, there may be only one death in one year, but seven in the following year, and four the year after that, and so on.","ko":"그러나, 인구 500명의 작은 마을에서는 한 해에 1명만이 , 이듬해에는 7명이, 그 다음 해에는 4명이 사망하는 식이다.","role":"맺음 — 500명 마을은 1·7·4명으로 들쭉날쭉하다고 맞세워 맺는다."}],"core":"표본이 클수록 평균이 실제 평균에 가까워지므로 큰 모집단은 작은 마을보다 변동이 훨씬 적다.","flow":[{"label":"법칙","sentences":"S1-2","text":"규모의 경제 일부는 큰 수의 법칙에서 나오며 표본이 클수록 평균이 참값에 가깝다","refs":[1,2]},{"label":"예시","sentences":"S3","text":"미국 같은 큰 모집단의 사망률은 작은 마을보다 변동이 훨씬 적다","refs":[3]},{"label":"수치","sentences":"S4","text":"미국은 10만 명당 720명 정도로 해마다 크게 변하지 않는다","refs":[4]},{"label":"대비","sentences":"S5","text":"인구 500명 마을에서는 1명, 7명, 4명 식으로 널뛴다","refs":[5]}],"structure":[{"title":"큰 모집단 — 미국","text":"사망률이 10만 명당 720명 안팎으로 해마다 거의 그대로다"},{"title":"작은 마을 — 500명","text":"한 해 1명, 이듬해 7명으로 들쭉날쭉하다"}],"key_sentence_en":"The law of large numbers states that the closer a sample average is to the true mean, the larger the sample is, so a large population shows much less variation than a small town."},{"id":"ch05-03","unit":"ch05","number":3,"title":"p62 · READ & APPLY 1","sentences":[{"n":1,"en":"The Mozart Effect is a phrase used to mean that listening to Mozart’s music has some beneficial effects on health, happiness, and learning.","ko":"모차르트 효과는 모차르트의 음악을 듣는 것이 건강과 행복, 학습에 유익한 효과 가 있다는 것을 뜻하는 데 사용되는 어구 이다.","role":"뜻풀이 — 모차르트 효과가 무슨 말인지 먼저 밝힌다."},{"n":2,"en":"This seems a reasonable assessment — except that some people got overexcited by the reports from some scientists, and interpreted them to mean that listening to Mozart’s music can magically increase your general intelligence.","ko":"이것은 합리적인 평가 인 것 같다. 몇몇 사람들이 과학자들의 보고서에 과도하게 흥분해 그 보고서들이 모차르트 음악을 듣는 것이 마법처럼 여러분의 일반 지능을 높일 수 있다는 것을 의미한다고 해석한 것만 제외하면 말이다.","role":"단서 달기 — 지능이 오른다는 데까지 부풀린 오해를 짚는다."},{"n":3,"en":"For the last few decades, the Mozart Effect has been argued about.","ko":"지난 수십 년 동안 모차르트 효과는 논란 이 되어 왔다.","role":"배경 — 수십 년째 다툼거리였다고 흐름을 깐다."},{"n":4,"en":"But no research has demonstrated that merely listening to Mozart’s music can have a lasting impact on general intelligence, so there is no reason to believe that it will raise your IQ.","ko":"그러나 어떤 연구도 단지 모차르트 음악을 듣는 것이 일반 지능에 지속적인 영향 을 줄 수 있음을 입증하지 못했고, 따라서 그것이 여러분의 지능을 높여 줄 것이라고 믿을 이유 는 없다.","role":"잘라 말하기 — 지능을 올린다는 근거가 없다고 잘라 말한다."},{"n":5,"en":"However, you might well find that listening to many kinds of music makes you feel happier, calmer, and less stressed, so you can think more clearly and work better.","ko":"그러나, 다양한 종류의 음악을 듣는 것이 여러분을 더 행복하고, 더 차분하고 , 그리고 스트레스를 덜 받게 만들어 여러분이 더 명확하게 생각하고 일을 더 잘할 수 있다는 것을 알게 될 것이다.","role":"살려 두기 — 마음이 편해져 일이 잘될 수는 있다며 살려 맺는다."}],"core":"모차르트 음악이 지능을 높인다는 증거는 없지만 음악은 기분을 낫게 해 더 잘 생각하게 한다.","flow":[{"label":"정의","sentences":"S1","text":"모차르트 효과는 그 음악이 건강·행복·학습에 이롭다는 뜻의 어구다","refs":[1]},{"label":"오해","sentences":"S2","text":"일부가 과도하게 흥분해 지능이 마법처럼 오른다는 뜻으로 해석했다","refs":[2]},{"label":"논란","sentences":"S3","text":"지난 수십 년 동안 모차르트 효과는 논란이 되어 왔다","refs":[3]},{"label":"반박","sentences":"S4","text":"지능에 지속적 영향을 준다고 입증한 연구는 하나도 없다","refs":[4]},{"label":"여지","sentences":"S5","text":"다만 여러 음악이 기분을 낫게 해 더 잘 생각하고 일하게 할 수는 있다","refs":[5]}],"structure":[{"title":"부풀려진 주장","text":"모차르트를 들으면 일반 지능이 마법처럼 오른다"},{"title":"남는 사실","text":"지능 증거는 없고, 기분이 나아져 더 잘 생각하고 일하게 되는 정도다"}],"key_sentence_en":"No research has demonstrated that merely listening to Mozart’s music can have a lasting impact on general intelligence, but many kinds of music may still make you feel happier and work better."},{"id":"ch05-04","unit":"ch05","number":4,"title":"p62 · READ & APPLY 2","sentences":[{"n":1,"en":"In a big company, what’s small tends to get lost.","ko":"큰 회사에서는 작은 것 이 묻히기 쉽다 .","role":"단언 — 큰 회사에선 작은 것이 묻힌다고 한마디로 던진다."},{"n":2,"en":"As businesses and companies grow, their size can become major obstacles.","ko":"사업체와 회사가 커지면서 , 그들의 크기는 주된 장애물 이 될 수 있다.","role":"풀어 놓기 — 커진 몸집 자체가 걸림돌이 된다고 잇는다."},{"n":3,"en":"The difficult communications, the layers of management, and the lack of casual interactions begin to occur, and all of these things work against the creation of an energizing atmosphere.","ko":"어려운 의사소통, 관리 단계, 일상적 상호 작용의 결핍 이 생기기 시작하고, 이 모든 것들은 활기를 북돋우는 분위기 창출에 방해가 된다 .","role":"증상 나열 — 막힌 소통·겹친 결재·줄어든 대화를 열거한다."},{"n":4,"en":"The entrepreneurial benefits of being small — flexibility, speed, and ease of communication — are often lost in a big company.","ko":"소규모의 사업상 이익, 즉 유연성, 속도, 의사소통의 용이성 은 큰 회사에서는 대개 소실된다 .","role":"잃는 것 — 유연성·속도·소통이라는 작음의 이점을 짚는다."},{"n":5,"en":"Therefore, isolating small projects and keeping them out of the mainstream operations can be the way to grow.","ko":"그러므로, 작은 프로젝트들을 분리하고 그것들을 주류 사업 으로부터 떼어 내 유지하는 것이 성장하는 방법이 될 수 있다.","role":"처방 — 작은 일감을 본류에서 떼어 두라고 답을 낸다."},{"n":6,"en":"By running separate, smaller businesses in larger entities, businesses can have great success, creating high-spirited, energized people backed by the right resources.","ko":"더 큰 기업체 안에서 별개의 더 작은 사업체들을 운영함으로써, 사업은 적절한 자원 의 지원을 받는 진취적이고 활력 넘치는 인재를 만들어 내면서, 큰 성공을 거둘 수 있다.","role":"기대 효과 — 큰 기업 안 작은 사업체로 성공한다며 닫는다."}],"core":"회사가 커지면 작을 때의 이익을 잃으므로 작은 사업을 주류에서 떼어 놓는 것이 성장하는 길이다.","flow":[{"label":"문제","sentences":"S1-2","text":"큰 회사에서는 작은 것이 묻히고 크기 자체가 주된 장애물이 된다","refs":[1,2]},{"label":"증상","sentences":"S3","text":"어려운 의사소통과 관리 단계, 일상적 교류의 결핍이 활기를 막는다","refs":[3]},{"label":"상실","sentences":"S4","text":"유연성·속도·의사소통의 쉬움이라는 소규모의 이익이 사라진다","refs":[4]},{"label":"해법","sentences":"S5","text":"작은 프로젝트를 분리해 주류 사업에서 떼어 두는 것이 성장하는 방법이다","refs":[5]},{"label":"결과","sentences":"S6","text":"큰 기업 안에서 별개의 작은 사업을 돌리면 활력 있는 인재와 성공을 얻는다","refs":[6]}],"structure":[{"title":"문제 — 커진 몸집","text":"의사소통이 어려워지고 관리 단계가 늘며 소규모의 이익이 사라진다"},{"title":"해결 — 작게 떼어 두기","text":"작은 프로젝트를 주류에서 분리해 별개의 작은 사업으로 돌린다"}],"key_sentence_en":"Therefore, isolating small projects and keeping them out of the mainstream operations can be the way to grow."},{"id":"ch05-05","unit":"ch05","number":5,"title":"p63 · READ & APPLY 3","sentences":[{"n":1,"en":"There may be a few superhumans out there who know from age five exactly what they want to do when they grow up, and what form it will take.","ko":"다섯 살부터 자라서 무엇을 하고 싶은지, 그리고 그것이 어떤 형태일지를 정확히 아는 초인 이 몇 명 있을 수도 있다.","role":"예외 먼저 — 다섯 살에 길을 아는 초인도 있다고 인정하고 연다."},{"n":2,"en":"For the rest of us, it’s almost never that simple.","ko":"나머지 우리들 에게는, 그것이 거의 그렇게 간단하지 않다 .","role":"방향 틀기 — 나머지에게는 그리 간단치 않다고 초점을 옮긴다."},{"n":3,"en":"Jobs and careers don’t fall from the sky to land at our feet, where we simply pick them up and accept them as the perfect fit for life.","ko":"직업과 경력은 하늘에서 우리 발치 에 떨어져 그것을 그냥 집어 들어 인생에 완벽하게 들어맞는 것으로 받아들이게 되지 않는다.","role":"부정으로 그리기 — 직업이 발치에 떨어지지 않는다고 그림을 지운다."},{"n":4,"en":"Simply put, the process of discovery unfolds a bit differently for most people.","ko":"간단히 말해, 발견 과정 은 대부분의 사람들에게 약간 다르게 펼쳐진다 .","role":"정리 — 발견은 사람마다 다르게 펼쳐진다고 요점을 잡는다."},{"n":5,"en":"As we advance throughout a career (or series of careers), most of us have a number of different work experiences ranging from frustrating to awesome.","ko":"우리가 경력을 (혹은 일련의 경력들을) 쌓아 갈 때 , 우리들 대다수는 좌절감 을 주는 것에서부터 멋진 것까지 여러 다양한 직업상의 경험을 한다.","role":"실제 그리기 — 좌절에서 보람까지 여러 경험을 겪는다고 푼다."},{"n":6,"en":"Through those experiences, we learn as much about what we don’t want as what we do, and realize everyone is different.","ko":"그런 경험을 통해, 우리는 우리가 원하는 것만큼이나 우리가 원치 않는 것에 대해 배우며, 모두가 다르다는 것을 깨닫는다 .","role":"맺음 — 그 겪음으로 원치 않는 것도 배운다고 마무리한다."}],"core":"진로 발견은 사람마다 다르게 펼쳐지며 여러 경험이 원하는 것만큼 원치 않는 것도 가르친다.","flow":[{"label":"예외","sentences":"S1-2","text":"다섯 살에 이미 아는 초인도 있겠지만 나머지에게는 그리 간단하지 않다","refs":[1,2]},{"label":"실제","sentences":"S3","text":"직업은 하늘에서 발치에 떨어져 딱 맞는 것으로 주어지지 않는다","refs":[3]},{"label":"정리","sentences":"S4","text":"간단히 말해 발견 과정은 사람마다 조금씩 다르게 펼쳐진다","refs":[4]},{"label":"경험","sentences":"S5","text":"경력을 쌓으며 좌절부터 멋진 일까지 여러 경험을 한다","refs":[5]},{"label":"결론","sentences":"S6","text":"그 경험이 원하는 것만큼 원치 않는 것도 가르쳐 준다","refs":[6]}],"structure":[{"title":"소수의 초인","text":"다섯 살부터 무엇을 할지, 어떤 모습일지까지 정확히 안다"},{"title":"나머지 우리","text":"여러 경험을 거치며 원하는 것과 원치 않는 것을 함께 배워 간다"}],"key_sentence_en":"Simply put, the process of discovery unfolds a bit differently for most people, and through many different work experiences we learn as much about what we don’t want as what we do."},{"id":"ch05-06","unit":"ch05","number":6,"title":"p63 · READ & APPLY 4","sentences":[{"n":1,"en":"No one knows for sure how the universe was created.","ko":"아무도 어떻게 우주가 만들어졌는지 확실히 모른다.","role":"전제 놓기 — 우주의 시작을 아무도 확실히 모른다고 깐다."},{"n":2,"en":"A lot of scientists think that the big bang theory is the most likely explanation.","ko":"많은 과학자들은 빅뱅 이론 이 가장 그럴듯한 설명 이라고 생각한다.","role":"이론 들기 — 빅뱅이 가장 그럴듯하다는 학계 견해를 든다."},{"n":3,"en":"It goes like this: About 13.7 billion years ago, all the matter in the universe, as we know it, was packed together in one superhot dense point called a singularity.","ko":"그것은 이와 같이 전개된다. 약 137억 년 전에, 우리가 알고 있는 형태의 우주에 있는 모든 물질이 특이점 이라고 불리는 하나의 엄청나게 뜨겁고 밀집된 점에 뭉쳐 있었다 .","role":"과정 설명 — 137억 년 전 모든 물질이 한 점에 뭉쳐 있었다고 푼다."},{"n":4,"en":"No one is really sure why, but this singularity began a dramatic expansion.","ko":"아무도 왜인지는 확실히 모르지만, 이 특이점은 극적인 팽창 을 시작했다.","role":"과정 잇기 — 까닭 모를 급팽창이 시작됐다고 잇는다."},{"n":5,"en":"It was an event in which all the particles of the early universe filled all of space, rushing away from each other.","ko":"그것은 서로서로 빠르게 멀어지면서 초기 우주의 모든 미립자 가 공간을 모두 채운 사건이었다.","role":"부연 — 미립자가 서로 멀어지며 공간을 채웠다고 그린다."},{"n":6,"en":"Then, the universe began to cool as it expanded.","ko":"그러고 나서, 우주는 확장하면서 식기 시작했다 .","role":"과정 넘기기 — 팽창하며 식기 시작했다고 다음 단계로 넘긴다."},{"n":7,"en":"About 3 minutes after the big bang, it had cooled from 100 million trillion trillion (10³²) degrees Kelvin to 10 billion degrees Kelvin.","ko":"빅뱅 3분 후쯤, 그것의 온도는 10의 32승 K에서 100억 K로 떨어졌다 .","role":"수치 제시 — 3분 만에 10³²K에서 100억 K로 떨어졌다고 든다."},{"n":8,"en":"And as it cooled, matter formed and, later, galaxies.","ko":"그리고, 그것이 식으면서 물질이 형성되었고, 나중에는 은하가 형성되었다.","role":"맺음 — 식으면서 물질과 은하가 생겼다고 끝을 맺는다."}],"core":"빅뱅 이론에 따르면 하나의 특이점이 극적으로 팽창했고 우주가 식으면서 물질과 은하가 생겼다.","flow":[{"label":"전제","sentences":"S1-2","text":"아무도 확실히 모르지만 많은 과학자가 빅뱅을 가장 그럴듯하게 본다","refs":[1,2]},{"label":"시작","sentences":"S3","text":"약 137억 년 전 모든 물질이 특이점이라는 한 점에 뭉쳐 있었다","refs":[3]},{"label":"팽창","sentences":"S4-5","text":"까닭은 몰라도 그 점이 극적으로 팽창해 미립자가 공간을 채웠다","refs":[4,5]},{"label":"냉각","sentences":"S6-7","text":"팽창하며 식어 3분 만에 10의 32승 K에서 100억 K로 내려갔다","refs":[6,7]},{"label":"결과","sentences":"S8","text":"식으면서 물질이 생기고 나중에 은하가 만들어졌다","refs":[8]}],"structure":[{"title":"원인 — 팽창과 냉각","text":"특이점이 극적으로 팽창하고 그 과정에서 온도가 급격히 내려갔다"},{"title":"결과 — 물질과 은하","text":"식으면서 물질이 형성되고 뒤이어 은하가 생겨났다"}],"key_sentence_en":"A lot of scientists think that the big bang theory is the most likely explanation: a singularity began a dramatic expansion, and as the universe cooled, matter and galaxies formed."},{"id":"ch05-07","unit":"ch05","number":7,"title":"p64 · READ & APPLY 5","sentences":[{"n":1,"en":"In telling students how the native Indians helped the Europeans, one high school textbook for United States History featured a picture of Indians girdling trees and text that asserted: “The Indians taught the colonists an easy method of felling trees known as girdling.","ko":"학생들에게 인디언들이 어떻게 유럽인들을 도왔는지를 말함에 있어, 한 고등학교 미국 역사 교과서는 나무를 띠 모양으로 벗기고 있는 인디언들의 사진과 다음과 같이 주장하는 글을 실었다. “인디언들이 식민지 이주자들에게 환상 박피라고 알려진 나무를 쉽게 벌채하는 방법을 가르쳤다.","role":"인용 열기 — 교과서가 인디언이 벌목을 가르쳤다고 쓴 대목을 든다."},{"n":2,"en":"They stripped off the bark of the trees and waited for them to die.","ko":"그들은 나무의 껍질을 벗기고 나무가 죽기를 기다렸다 .","role":"인용 잇기 — 껍질을 벗겨 죽기를 기다렸다는 설명을 옮긴다."},{"n":3,"en":"In time the trees fell; the land was cleared for fields and houses.”","ko":"이윽고 나무들이 쓰러졌고 , 그 땅은 밭과 집을 위해 개간되었다 .”","role":"인용 맺기 — 그렇게 땅을 개간했다는 문장까지 그대로 든다."},{"n":4,"en":"This illustration can have one meaning — namely, that the Europeans did not have the faintest notion of how to fell a tree.","ko":"이 설명은 한 가지를 의미할 수 있는데 , 다시 말해 유럽인들이 나무를 벌채하는 방법을 전혀 모르고 있었다는 것이다.","role":"함의 끄집기 — 그 말은 유럽인이 벌목을 몰랐다는 뜻이라 짚는다."},{"n":5,"en":"This kind of statement is false.","ko":"이런 종류의 진술은 거짓이다 .","role":"판정 — 그런 진술은 거짓이라고 잘라 말한다."},{"n":6,"en":"After all, the Europeans had to cross the Atlantic to come to America, and they did so via ships made of wood.","ko":"어쨌든, 유럽인들은 미국에 오기 위해 대서양을 건너야 했고 , 그들은 목재로 만들어진 배로 그렇게 했던 것이다.","role":"반증 제시 — 그들이 목재 배를 타고 건너왔다는 사실을 든다."},{"n":7,"en":"And, of course, the wood was derived from trees they felled with steel axes.","ko":"그리고 당연히, 그 목재는 그들이 강철 도끼로 쓰러뜨린 나무에서 얻은 것이었다.","role":"반증 추가 — 그 목재는 강철 도끼로 벤 나무라고 못 박는다."},{"n":8,"en":"Europeans, of course, downed trees for centuries, long before they came to America, and, moreover, by methods far more efficient than by girdling.","ko":"물론, 유럽인들은 미국에 오기 훨씬 전부터 수 세기 동안 , 게다가, 환상 박피보다 훨씬 더 효율적인 방법으로 , 나무를 베어 넘어뜨렸다.","role":"반증 보태기 — 훨씬 앞서 더 효율적인 방법을 썼다고 보탠다."},{"n":9,"en":"They did not have to learn the Indian’s method of downing trees.","ko":"그들은 나무를 쓰러뜨리는 인디언의 방법을 배울 필요가 없었다 .","role":"맺음 — 그러니 배울 필요가 없었다고 앞의 주장을 닫는다."}],"core":"인디언이 벌목을 가르쳤다는 교과서 설명은 유럽인이 나무를 벨 줄 몰랐다는 잘못된 믿음을 만든다.","flow":[{"label":"인용","sentences":"S1-3","text":"한 교과서는 인디언이 환상 박피라는 벌목법을 이주자에게 가르쳤다고 적었다","refs":[1,2,3]},{"label":"함의","sentences":"S4","text":"그 설명은 유럽인이 벌목법을 전혀 몰랐다는 뜻이 될 수 있다","refs":[4]},{"label":"반박","sentences":"S5","text":"그런 진술은 거짓이다","refs":[5]},{"label":"근거","sentences":"S6-7","text":"유럽인은 목재로 만든 배로 대서양을 건넜고 그 목재는 강철 도끼로 벤 것이다","refs":[6,7]},{"label":"결론","sentences":"S8-9","text":"유럽인에게는 더 오래되고 효율적인 벌목 지식이 있어 배울 필요가 없었다","refs":[8,9]}],"structure":[{"title":"교과서의 그림","text":"인디언이 이주자에게 쉬운 벌목법을 가르쳐 주었다"},{"title":"실제","text":"유럽인은 강철 도끼로 나무를 베어 배를 만들어 왔고 배울 필요가 없었다"}],"key_sentence_en":"The textbook account creates the false myth that European settlers did not know how to fell trees before learning girdling from Native Indians."}]},{"id":"test1","label":"고난도 유형 TEST 1회","scope":"p144~149","passages":[{"id":"test1-01","unit":"test1","number":1,"title":"no.01","sentences":[{"n":1,"en":"Should we put away childish things as we grow older?","ko":"우리는 나이가 들면서 유치한 일들을 치워야 하는가?","role":"물음 던지기 — 나이 들면 유치한 것을 버려야 하냐고 화두를 연다."},{"n":2,"en":"Some things, perhaps, but not the willingness to enjoy simple pleasures.","ko":"아마 몇몇 유치한 일들은 치워야겠지만, 소박한 즐거움 을 누리려는 마음까지 버려서는 안 된다 .","role":"답 내기 — 소박한 즐거움만은 버리지 말라고 갈래를 갈라 답한다."},{"n":3,"en":"The ability to give yourself treats and rewards is one of the basic strategies for improving mental fitness, and there is a good reason for this.","ko":"자신에게 대접과 보상 을 제공하는 능력은 정신 건강 을 증진시키기 위한 기본적인 전략 중 하나이고, 이것에는 타당한 이유가 있다.","role":"주장 세우기 — 자기 대접이 마음 건강의 기본 전략이라 내세운다."},{"n":4,"en":"In the first place, treats and rewards provide enjoyment and pleasure, which contribute to feeling good and confident.","ko":"우선, 대접과 보상은 즐거움과 기쁨 을 주는데, 이는 기분이 좋고 자신감 을 가지는 데 기여한다.","role":"근거 ① — 즐거움이 기분과 자신감을 세워 준다고 받친다."},{"n":5,"en":"In addition, they create the best environment for helping you change in the directions you wish to change.","ko":"게다가, 그것들은 여러분이 변하고자 하는 방향으로 여러분을 변하도록 돕는 최고의 환경 을 만들어 준다.","role":"근거 ② — 바라는 쪽으로 바뀔 바탕을 만들어 준다고 보탠다."},{"n":6,"en":"A joyless time filled only with tasks done out of duty or responsibility restricts your ability to develop, and feels more like a preparation for life than living life itself.","ko":"의무감이나 책임감으로 완수되는 과제로만 채워진 재미없는 시간 은 발전하는 능력을 방해하고 , 삶 자체를 사는 것이라기보다는 삶을 준비하는 기분이 들게 한다.","role":"뒤집어 보이기 — 의무로만 채운 시간은 발전을 막는다고 뒤집어 보인다."},{"n":7,"en":"It runs the risk of turning effort into duty.","ko":"그것은 노력을 의무로 바꾸는 위험을 무릅쓴다 .","role":"경고로 맺기 — 노력이 의무로 굳는 위험을 짚으며 닫는다."}],"core":"자신에게 대접과 보상을 줄 줄 아는 능력은 정신 건강의 기본 전략이고 의무만 남은 시간은 발전을 막는다.","flow":[{"label":"물음","sentences":"S1-2","text":"나이 들며 유치한 것을 치워야 하나 — 소박한 즐거움만은 남겨야 한다","refs":[1,2]},{"label":"주장","sentences":"S3","text":"자신에게 대접과 보상을 주는 능력은 정신 건강을 키우는 기본 전략이다","refs":[3]},{"label":"이유","sentences":"S4","text":"즐거움과 기쁨을 주어 기분이 좋고 자신감을 갖는 데 이바지한다","refs":[4]},{"label":"이유","sentences":"S5","text":"원하는 방향으로 변하도록 돕는 최고의 환경을 만들어 준다","refs":[5]},{"label":"반례","sentences":"S6-7","text":"의무로만 채운 재미없는 시간은 발전을 막고 노력을 의무로 바꿔 버린다","refs":[6,7]}],"structure":[{"title":"대접과 보상이 있는 시간","text":"즐거움과 자신감을 주고 원하는 변화를 돕는 환경이 된다"},{"title":"의무만 있는 시간","text":"발전을 막고 삶이 아니라 삶의 준비처럼 느껴지게 한다"}],"key_sentence_en":"The ability to give yourself treats and rewards is one of the basic strategies for improving mental fitness, while a joyless time filled only with duties restricts your ability to develop.","lead":"나이가 들어도 소박한 즐거움과 자신에게 주는 보상을 남겨야 하는 이유는 무엇일까?","blocking_vocab":[{"word":"put away","meaning":"치우다·그만두다"},{"word":"mental fitness","meaning":"정신 건강"},{"word":"contribute to","meaning":"~에 기여하다"},{"word":"joyless","meaning":"즐거움이 없는"},{"word":"out of duty","meaning":"의무감에서"}],"checks":[{"type":"핵심","q":"글쓴이가 소박한 즐거움을 남겨야 한다고 보는 이유는?","choices":["대접과 보상은 기분과 자신감을 돕고 원하는 변화를 위한 환경을 만든다.","즐거움은 모든 책임을 버리게 만들어 정신 건강을 높인다.","나이가 들수록 유치한 일은 하나도 버려서는 안 된다."],"answer":0,"why":"S3~5는 대접과 보상이 정신 건강의 전략이며 즐거움·자신감과 변화의 환경을 제공한다고 한다.","refs":[3,4,5]},{"type":"지칭","q":"S5의 they가 가리키는 것은?","choices":["treats and rewards","tasks done out of duty","directions you wish to change"],"answer":0,"why":"앞 문장 S4의 treats and rewards를 받아, 그것들이 변화에 좋은 환경을 만든다고 이어진다.","refs":[4,5]},{"type":"변형 탐지","q":"S6의 비교와 일치하는 문장을 고르세요.","choices":["A joyless time of duty feels more like preparation for life than living life itself.","A joyless time of duty feels more like living life itself than preparation for life."],"answer":0,"why":"S6은 의무만 남은 시간이 삶 자체를 사는 것보다 삶을 준비하는 것처럼 느껴진다고 한다.","refs":[6]}]},{"id":"test1-02","unit":"test1","number":2,"title":"no.02","sentences":[{"n":1,"en":"Somewhere, somehow, there are “switches” in the genome that tell our genes when to turn on and express themselves.","ko":"어디엔가, 왜 그런지 모르겠지만, 우리 유전자에게 스스로를 언제 활성화하고 발현해야 하는지 알려 주는 ‘ 스위치 ’가 게놈 안에 있다.","role":"화제 열기 — 유전자를 켜고 끄는 스위치가 있다고 앞세운다."},{"n":2,"en":"The switches that turn genes on and off are not well understood.","ko":"유전자를 활성화하고 비활성화하게 하는 그 스위치가 잘 알려져 있지는 않다.","role":"한계 밝히기 — 그 스위치를 아직 잘 모른다고 솔직히 짚는다."},{"n":3,"en":"Some of them lie within the genes themselves.","ko":"그 스위치들 중 일부는 유전자 자체 안에 있다.","role":"자리 ① — 일부는 유전자 안에 있다고 하나를 짚어 준다."},{"n":4,"en":"Others are thought to lie within the so-called “junk DNA,” poorly understood matter that comprises the large majority of the genome.","ko":"다른 것들은 게놈의 대다수 를 구성하고 있는 잘 알려지지 않은 물질인 소위 ‘ 정크 DNA ’ 안에 있는 것으로 여겨진다.","role":"자리 ② — 나머지는 정크 DNA 안에 있으리라 본다고 잇는다."},{"n":5,"en":"In 2006, it was reported that individual differences may result from previously undetected variations in the number of times that certain key genes are copied in the genome.","ko":"2006년에, 개체의 차이 는 이전에 발견되지 않은, 게놈에서 특정한 핵심 유전자가 복제되는 횟수 의 변화에서 기인할 수 있다고 보고되었다.","role":"새 보고 — 2006년 복제 횟수 차이라는 발견을 끌어온다."},{"n":6,"en":"Preliminary findings suggest that entire sequences may be repeated as many as ten times, differing widely between individuals and yielding differences in the overall “copy number” of genes.","ko":"사전 연구 결과에 따르면 (특정한 핵심 유전자의) 전체 배열 은 최대 열 번이나 반복될 수 있는데, 개인마다 크게 달라서 유전자의 전체 ‘사본 수’에서 차이를 낼 수 있다.","role":"수치 제시 — 최대 열 번까지 반복돼 사람마다 다르다고 든다."},{"n":7,"en":"Perhaps we have ignored material such as this or “junk DNA” for too long, focusing instead on the more obvious proteins that were easier to measure and investigate.","ko":"아마도 우리는 이와 같은 물질이나 ‘정크 DNA’를 너무 오랫동안 무시해 왔고 , 대신 측정과 조사가 더 쉬운 보다 명확한 단백질 에 초점을 맞춰 왔다.","role":"반성 — 쉬운 단백질만 보느라 이것을 오래 지나쳤다고 돌아본다."},{"n":8,"en":"In any case, high school genetics books are losing their resale value almost as quickly as they are published.","ko":"어쨌든, 고등학교 유전학 교재 는 출판되는 것만큼이나 빠르게 재판매 가치 를 잃고 있다.","role":"익살로 맺기 — 유전학 교재가 금세 낡는다며 변화의 속도를 비튼다."}],"core":"유전자 스위치는 아직 잘 모르고 새 발견이 잇따라 유전학 교재는 나오자마자 낡아 버린다.","flow":[{"label":"전제","sentences":"S1-2","text":"게놈 어딘가에 유전자를 켜고 끄는 스위치가 있으나 잘 알려져 있지 않다","refs":[1,2]},{"label":"위치","sentences":"S3-4","text":"일부는 유전자 안에, 다른 것들은 정크 DNA 안에 있다고 여겨진다","refs":[3,4]},{"label":"새 발견","sentences":"S5-6","text":"2006년 보고는 핵심 유전자의 복제 횟수 차이가 개체 차이를 낳는다고 알렸다","refs":[5,6]},{"label":"반성","sentences":"S7","text":"측정하기 쉬운 단백질에만 매달려 이런 물질을 너무 오래 무시해 왔다","refs":[7]},{"label":"결론","sentences":"S8","text":"어쨌든 유전학 교재는 출판되는 속도만큼 빠르게 값을 잃는다","refs":[8]}],"structure":[{"title":"원인 — 빠르게 바뀌는 지식","text":"스위치는 아직 모르고 복제 횟수 같은 새 실마리가 잇따른다"},{"title":"결과 — 낡아 버리는 교재","text":"고등학교 유전학 교재가 출판되자마자 재판매 값을 잃는다"}],"key_sentence_en":"The switches that turn genes on and off are not well understood, and new findings about copy number keep changing the picture, so high school genetics books are losing their resale value almost as quickly as they are published."},{"id":"test1-03","unit":"test1","number":3,"title":"no.03","sentences":[{"n":1,"en":"When people in a movie hide their identities, the plot inevitably unfolds to the point where circumstances force them to reveal themselves or where they are found out.","ko":"영화 속 인물들이 정체를 숨길 때, 줄거리는 필연적으로 상황상 어쩔 수 없이 자신을 드러낼 수밖에 없거나 발각되는 지점까지 전개된다.","role":"장면 열기 — 영화에서 숨긴 정체는 결국 드러난다고 그린다."},{"n":2,"en":"By the end of the film, the mysteries of identity have been solved and the story concludes neatly.","ko":"영화가 끝날 무렵 , 정체에 대한 미스터리가 풀리고 이야기는 깔끔하게 결론이 난다.","role":"부연 — 끝에는 수수께끼가 풀리고 깔끔히 닫힌다고 잇는다."},{"n":3,"en":"But real life is not so scripted.","ko":"하지만 실제 삶 은 그렇게 대본화되어 있지 않다.","role":"전환 — 현실은 그런 대본이 아니라고 방향을 튼다."},{"n":4,"en":"In the real world, people do not usually wear costumes or disguises, but many do find subtle ways to make themselves seem better than they really are.","ko":"현실 세계에서, 사람들은 보통 분장이나 변장 을 하지 않지만, 많은 사람들이 스스로가 실제보다 더 나아 보이게 하는 미묘한 방법 을 정말로 찾는다.","role":"현실 대기 — 변장 대신 더 나아 보이려는 술수를 쓴다고 짚는다."},{"n":5,"en":"I suspect we have all done that at times, somewhere — some of us more than others — but anytime it happens it sets us up for personal and relational failure.","ko":"나는 우리 모두가, 우리 중 일부는 다른 사람들보다 더 많이, 때때로 , 어딘가에서 그렇게 했던 적이 있다고 생각하지만, 그런 일이 일어날 때마다 그것은 우리가 개인적, 관계적 실패 를 겪게 한다.","role":"자기 고백 — 누구나 그래 봤지만 그것이 실패를 부른다고 못 박는다."},{"n":6,"en":"Sometimes, it can lead to greater suffering.","ko":"가끔 그것은 더 큰 고통 으로 이어지기도 한다.","role":"보태기 — 때로는 더 큰 고통까지 온다고 무게를 더한다."},{"n":7,"en":"To enjoy success in our lives and in our dealings with others, we need to thoroughly know our true selves and allow the right people to know us completely as well.","ko":"삶에서 그리고 다른 사람들과의 관계에서 성공을 누리기 위해서, 우리는 우리 자신의 진정한 자아 를 철저히 알고, 또한 올바른 사람들이 우리를 완전히 알 수 있게 할 필요가 있다.","role":"당부 — 참된 자기를 알고 옳은 이에게 보이라며 맺는다."}],"core":"영화와 달리 현실에는 대본이 없어 꾸밈은 실패로 이어지니 진짜 자아를 알고 알려야 한다.","flow":[{"label":"영화","sentences":"S1-2","text":"영화에서는 숨긴 정체가 반드시 드러나고 이야기가 깔끔히 끝난다","refs":[1,2]},{"label":"전환","sentences":"S3","text":"그러나 실제 삶은 그렇게 대본화되어 있지 않다","refs":[3]},{"label":"현실","sentences":"S4","text":"분장은 안 해도 실제보다 나아 보이게 하는 미묘한 방법을 찾는다","refs":[4]},{"label":"결과","sentences":"S5-6","text":"그럴 때마다 개인적·관계적 실패를 부르고 더 큰 고통이 되기도 한다","refs":[5,6]},{"label":"결론","sentences":"S7","text":"성공하려면 진짜 자아를 철저히 알고 옳은 사람들에게 온전히 알려야 한다","refs":[7]}],"structure":[{"title":"영화 속 숨김","text":"반드시 드러나고 미스터리가 풀리며 이야기가 깔끔히 끝난다"},{"title":"현실 속 꾸밈","text":"대본이 없어 저절로 풀리지 않고 실패와 더 큰 고통으로 이어진다"}],"key_sentence_en":"To enjoy success in our lives and in our dealings with others, we need to thoroughly know our true selves and allow the right people to know us completely as well."},{"id":"test1-04","unit":"test1","number":4,"title":"no.04","sentences":[{"n":1,"en":"Many companies these days employ planned obsolescence — a deliberate effort by companies to make their products unusable or outdated after a period of time.","ko":"오늘날 많은 회사가 계획적 구식화 를 이용하는데, 이것은 일정한 시간이 지난 후 자신들의 제품을 사용할 수 없거나 구식으로 만드는 회사들에 의한 의도적인 노력 이다.","role":"뜻풀이 — 계획적 구식화가 무엇인지 정의로 열어 준다."},{"n":2,"en":"A good example of this is a mobile phone.","ko":"이를 잘 보여 주는 좋은 예 가 휴대 전화 다.","role":"보기 세우기 — 휴대 전화를 잘 보여 주는 사례로 내세운다."},{"n":3,"en":"Mobile phones are often designed with only current technology, despite the manufacturer’s knowledge of future technology.","ko":"휴대전화는 종종 제조업체가 미래의 기술 에 대한 지식을 갖고 있음에도 불구하고 현재 기술로만 설계된다.","role":"설계 짚기 — 뒷 기술을 알면서도 현재 기술로만 만든다고 짚는다."},{"n":4,"en":"For instance, a mobile phone may have parts and connections that fit current products.","ko":"가령, 한 휴대 전화는 현재 제품에 딱 들어맞는 부품들과 접속부를 가지고 있을 것이다.","role":"구체화 ① — 지금 제품에 맞는 부품과 접속부를 든다."},{"n":5,"en":"The manufacturer may already be working on updated phones using different sizes of connections.","ko":"그 제조업체는 이미 다른 크기 의 접속부를 사용하는 최신 전화 를 만들고 있을지 모른다.","role":"구체화 ② — 제조사는 이미 다른 규격을 준비 중이라고 잇는다."},{"n":6,"en":"Although the current phone can be upgraded with software, eventually the “old” connections will make the product unusable and the customer needs a new phone.","ko":"소프트웨어로 현재의 전화를 업그레이드할 수 있다 해도, 결국 ‘ 오래된 ’ 접속부 때문에 그 제품은 사용할 수 없게 되고 고객은 새로운 전화가 필요하게 된다.","role":"결론 — 결국 못 쓰게 되어 새로 사야 한다고 고리를 닫는다."},{"n":7,"en":"This strategy is not good for the environment, but by reducing the amount of time between repeat purchases, the company can improve their sales.","ko":"이러한 전략이 환경에는 좋지 않지만, 재구매 사이 의 기간을 단축함으로써 회사는 매출을 개선 할 수 있다.","role":"평가로 맺기 — 환경엔 나쁘나 매출엔 이롭다고 양면을 저울질한다."}],"core":"계획적 구식화는 제품을 일정 기간 뒤 못 쓰게 만들어 재구매 주기를 줄이고 매출을 올린다.","flow":[{"label":"정의","sentences":"S1-2","text":"제품을 일정 기간 뒤 못 쓰게 하려는 의도적 노력이며 휴대 전화가 좋은 예다","refs":[1,2]},{"label":"작동","sentences":"S3-4","text":"미래 기술을 알면서도 현재 기술로만 설계해 지금 제품에 맞는 접속부를 단다","refs":[3,4]},{"label":"전개","sentences":"S5","text":"제조사는 이미 다른 크기의 접속부를 쓰는 최신 전화를 만들고 있다","refs":[5]},{"label":"결과","sentences":"S6","text":"오래된 접속부 탓에 결국 못 쓰게 되어 새 전화를 사야 한다","refs":[6]},{"label":"평가","sentences":"S7","text":"환경에는 나쁘지만 재구매 주기를 줄여 매출을 개선한다","refs":[7]}],"structure":[{"title":"원인 — 의도된 설계","text":"미래 기술을 알면서도 현재 기술로만 만들어 접속부를 낡게 한다"},{"title":"결과 — 짧아진 주기","text":"고객은 새 제품을 사야 하고 회사는 매출을 올린다 — 환경에는 나쁘다"}],"key_sentence_en":"Many companies employ planned obsolescence, and by reducing the amount of time between repeat purchases, the company can improve their sales."},{"id":"test1-05","unit":"test1","number":5,"title":"no.05","sentences":[{"n":1,"en":"We usually look for nervousness as one of the signs of lying — like the person is worried about getting caught.","ko":"우리는 보통 거짓말의 징후 중 하나로 초조함 을 찾는다 ― 그 사람이 들킬까 걱정하는 것처럼.","role":"통념 놓기 — 거짓말의 표시로 초조함을 찾는다고 먼저 깐다."},{"n":2,"en":"But a made-up story itself can also tell us if someone is lying.","ko":"하지만 지어낸 이야기 또한 그 자체로 누군가 거짓말을 하고 있는지를 우리에게 알려 줄 수 있다.","role":"방향 틀기 — 이야기 자체도 알려 준다며 새 실마리를 든다."},{"n":3,"en":"One thing is almost always missing from a story that is not true — what went wrong.","ko":"사실이 아닌 이야기에서는 한 가지가 거의 항상 빠져 있는데, 바로 무엇이 잘못되었는지 에 대한 것이다.","role":"핵심 제시 — 거짓 이야기엔 잘못된 일이 빠진다고 못 박는다."},{"n":4,"en":"Events that are made up rarely include any negative details.","ko":"지어낸 사건들은 부정적인 세부 내용을 거의 포함하지 않는다.","role":"바꿔 말하기 — 지어낸 사건엔 부정적 대목이 없다고 다시 짚는다."},{"n":5,"en":"A person who is lying is concerned about getting their story straight, and their thoughts are essentially one-dimensional.","ko":"거짓말을 하는 사람은 자기 이야기의 앞뒤를 맞추는 데 신경 쓰고, 그들의 생각은 본질적으로 일차원적 이다.","role":"원인 ① — 앞뒤 맞추기에 매여 생각이 단순해진다고 푼다."},{"n":6,"en":"So the story tends to include only primary thoughts — which are positive.","ko":"그래서 그 이야기는 최초의 생각 , 즉 긍정적인 생각만을 포함하는 경향이 있다.","role":"결론 — 그래서 최초의 긍정적 생각만 담긴다고 잇는다."},{"n":7,"en":"This is because negation is not a primary emotion.","ko":"이것은 부정이 기본 정서 가 아니기 때문이다.","role":"원인 ② — 부정이 기본 정서가 아니라는 이치를 댄다."},{"n":8,"en":"In other words, to think of something negative, you have to think of the positive first.","ko":"달리 말하면 , 부정적인 무언가를 생각하려면 여러분은 먼저 긍정적인 것을 생각해야 한다.","role":"풀어 주기 — 부정하려면 긍정을 먼저 떠올려야 한다고 쉽게 푼다."},{"n":9,"en":"In much the same way, if I said “Don’t think of an elephant,” you could not fulfill my request.","ko":"내가 여러분에게 ‘ 코끼리를 생각하지 말라’고 하면, 여러분이 내 요청을 이행할 수 없는 것과 대체로 같은 것이다.","role":"빗대기 — 코끼리를 생각하지 말라는 말로 알기 쉽게 보인다."},{"n":10,"en":"In order to process the information, you need to first think of an elephant.","ko":"정보를 처리 하기 위해서, 여러분은 먼저 코끼리를 생각해야 하는 것이다.","role":"비유 마무리 — 처리하려면 먼저 떠올려야 한다고 매듭짓는다."},{"n":11,"en":"Ask a friend to tell you about their last vacation.","ko":"친구에게 지난 휴가 에 대해 이야기할 것을 요청해 보라.","role":"실험 권하기 — 친구에게 지난 휴가를 물어보라고 시켜 본다."},{"n":12,"en":"He or she will cover all the bases, both positive and negative — maybe the food was good, maybe the flight was delayed.","ko":"그는 긍정적인 것과 부정적인 것 모든 면 을 다룰 것이다 ― 아마 음식은 좋았고 아마 비행기는 연착했을 것이다.","role":"예상 결과 ① — 좋은 일과 나쁜 일이 함께 나온다고 내다본다."},{"n":13,"en":"Then ask someone to make up a story about a vacation that they never went on.","ko":"그런 다음 누군가에게 그들이 결코 가 보지 않은 휴가에 관한 이야기를 지어낼 것을 요청해 보라.","role":"대조 실험 — 가 보지 않은 휴가를 지어내 보라고 짝을 세운다."},{"n":14,"en":"You’ll notice that the elements of the story are usually all positive.","ko":"여러분은 그 이야기의 요소들 이 대체로 모두 긍정적이라는 것을 알아차리게 될 것이다.","role":"예상 결과 ② — 그 이야기는 온통 긍정뿐일 것이라 짚는다."},{"n":15,"en":"The baggage never gets lost on a made-up trip.","ko":"지어낸 여행 에서 짐은 절대 분실되지 않는다.","role":"한마디로 맺기 — 지어낸 여행엔 짐이 없어지지 않는다고 못 박는다."}],"core":"지어낸 이야기는 부정적인 세부가 빠지므로 이야기 자체가 거짓말인지를 알려 준다.","flow":[{"label":"통념","sentences":"S1-2","text":"보통 초조함을 거짓의 징후로 보지만 이야기 자체도 알려 준다","refs":[1,2]},{"label":"주장","sentences":"S3-4","text":"사실이 아닌 이야기에는 무엇이 잘못됐는지가 거의 빠져 있다","refs":[3,4]},{"label":"까닭","sentences":"S5-8","text":"거짓말하는 사람의 생각은 일차원적이라 긍정만 담기며 부정은 기본 정서가 아니다","refs":[5,6,7,8]},{"label":"비유","sentences":"S9-10","text":"「코끼리를 생각하지 말라」는 요청을 이행할 수 없는 것과 같다","refs":[9,10]},{"label":"실험","sentences":"S11-15","text":"실제 휴가는 좋고 나쁨이 다 나오지만 지어낸 여행에서는 짐이 분실되지 않는다","refs":[11,12,13,14,15]}],"structure":[{"title":"실제 겪은 이야기","text":"좋은 일과 나쁜 일이 함께 나온다 — 음식은 좋았고 비행기는 연착했다"},{"title":"지어낸 이야기","text":"긍정만 남는다 — 지어낸 여행에서 짐은 절대 분실되지 않는다"}],"key_sentence_en":"A made-up story itself can tell us if someone is lying, because events that are made up rarely include any negative details."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 대아고1 Booster 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===all.length-1;
const hasScene=!!p.prediction;const labels=hasScene?['1 장면','2 원문','3 흐름','4 확인']:['1 준비','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=hasScene?`<div class="visual"><div><p class="prompt">${esc(p.prediction.question)}</p>${p.prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div></div><figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure></div>`:`<p class="prompt">첫 문장을 읽고 글이 어디로 갈지 생각해 보세요.</p><div class="en">${esc(p.sentences[0].en)}</div><p class="quiet">정답을 미리 보지 않아도 됩니다. 아래에서 원문을 읽은 뒤 핵심을 확인해 보세요.</p>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button><p class="translation">${esc(s.ko)}</p></div></article>`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 먼저 생각</span><h2>${hasScene?'그림에서 시작하기':'첫 문장에서 시작하기'}</h2>${scene}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${hasScene?`<p class="answerline show"><b>예상 확인 · </b>${esc(p.prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${structure}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id};window.addEventListener('hashchange',render);render();
</script></body></html>

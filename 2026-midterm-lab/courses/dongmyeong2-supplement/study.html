5","title":"5. p96-no.03","lead":"내 기여가 보이는가?","sentences":[{"n":1,"en":"Social loafing is especially likely to occur when our own contribution is not clear or measurable.","ko":"사회적 태만은 특히 자신의 기여도가 명확하지 않거나 측정할 수 없을 때 발생할 가능성이 있다."},{"n":2,"en":"Researchers at Purdue University, for example, found that college swimmers on a relay team swam faster when their individual time was announced than when only the total relay time was announced.","ko":"예를 들어, Purdue 대학교의 연구자들은 계영팀의 대학 수영 선수들이 전체 계영 시간만 발표될 때보다 개인 기록이 발표될 때 더 빨리 헤엄친다는 사실을 발견했다."},{"n":3,"en":"Similarly, when asked to clap or cheer \"as loud as they can,\" people exert much less effort when they're in a group ─ and their lack of effort is not apparent ─ than when they're alone.","ko":"마찬가지로, '최대한 큰 소리로' 박수를 치거나 응원하라는 요청을 받을 때 사람들은 혼자 있을 때보다 여럿이 있을 때, 즉 노력 부족이 눈에 띄지 않을 때 훨씬 더 적은 노력을 기울인다."},{"n":4,"en":"This lack of effort isn't limited to physical tasks: people who simply imagined being in a group setting later pledged less money to a charitable organization than those who imagined being with just one other person.","ko":"이러한 노력의 부족은 육체적인 일에만 국한되지 않는데 단순히 여럿이 함께 있다고 상상한 사람들은 나중에 단 한 사람과 함께 있다고 상상한 사람들보다 자선 단체에 더 적은 돈을 (기부하기로) 약속했다."},{"n":5,"en":"Social loafing also explains why so few people turn out to vote, even if they have strong political views.","ko":"사회적 태만은 정치적 견해가 확고하더라도 투표를 하기 위해 나서는 사람이 적은 이유도 설명해 준다."}],"easy_story":"함께 일할 때 누가 얼마나 했는지 드러나지 않으면, 사람은 자기 노력을 줄일 수 있습니다. 글은 개인 기록이 공개된 계영 경기와 박수·응원 사례를 통해 그 차이를 보여 줍니다. 이 현상은 몸을 움직이는 일뿐 아니라 기부 약속이나 투표에도 나타날 수 있다고 설명합니다.","core":"사람들은 자신의 기여가 따로 드러나지 않을 때 힘을 덜 쏟으며, 이 사회적 태만은 기부와 투표에서도 나타난다.","flow":[{"label":"주제 → 실험 ①","sentences":"S1–2","text":"기여도가 명확하지 않거나 측정되지 않을 때 사회적 태만이 일어난다 · 개인 기록이 발표될 때 계영 선수들이 더 빨리 헤엄쳤다","refs":[1,2]},{"label":"실험 ② → 확장","sentences":"S3–4","text":"노력 부족이 눈에 띄지 않는 집단에서 박수·응원에 훨씬 적게 힘을 썼다 · 몸으로 하는 일뿐 아니라 기부 약속에서도 같은 일이 벌어진다","refs":[3,4]},{"label":"적용","sentences":"S5","text":"견해가 확고해도 투표에 나서는 사람이 적은 까닭까지 설명한다","refs":[5]}],"structure":[{"title":"기여가 드러날 때","text":"개인 기록이 발표되고 혼자일 때 힘을 다 쏟는다"},{"title":"기여가 묻힐 때","text":"집단에 섞여 노력 부족이 보이지 않으면 힘을 아낀다"}],"key_sentence_en":"People put in less effort when their individual contribution cannot be seen or measured, and this social loafing shows up in donating and voting as well as in physical tasks.","blocking_vocab":[{"word":"social loafing","meaning":"사회적 태만"},{"word":"contribution","meaning":"기여"},{"word":"measurable","meaning":"측정 가능한"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["개인 기여를 측정할수록 집단 구성원의 노력이 줄어든다.","사람들은 자신의 기여가 따로 드러나지 않을 때 힘을 덜 쏟으며, 이 사회적 태만은 기부와 투표에서도 나타난다."],"answer":1,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[5]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["기여도가 명확하지 않거나 측정되지 않을 때 사회적 태만이 일어난다","노력 부족이 눈에 띄지 않는 집단에서 박수·응원에 훨씬 적게 힘을 썼다"],"answer":1,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S1의 원문 문장을 고르세요.","choices":["Social loafing is especially likely to occur when our own contribution is clear and measurable.","Social loafing is especially likely to occur when our own contribution is not clear or measurable."],"answer":1,"why":"원문 표현은 “not clear or measurable”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[1]}],"diagram":{"kind":"compare","title":"내 기여가 보이는가?","items":[{"head":"보임","body":"개인 기록이 발표된 계영 선수는 더 빨랐다","refs":[1,2]},{"head":"안 보임","body":"집단 박수·응원에서는 노력이 줄었다","refs":[1,3]},{"head":"확장","body":"기부 약속과 투표에도 같은 현상","refs":[4,5]}],"takeaway":"기여가 따로 드러나지 않을 때 사회적 태만이 나타나기 쉽다."}},{"id":"q35-06","title":"6. p97-no.04","lead":"공감을 켜서 분노를 가라앉히기","sentences":[{"n":1,"en":"One of the best ways to soothe ourselves is by extending empathy.","ko":"자신을 진정시키는 가장 좋은 방법 중 하나는 공감을 베푸는 것이다."},{"n":2,"en":"It is impossible to be angry and compassionate at the same time.","ko":"화를 내면서 동시에 공감하는 것은 불가능하다."},{"n":3,"en":"To activate empathy on command, we must know what we feel in our body when we are empathetic.","ko":"의지에 따라 공감을 활성화하려면, 우리가 공감할 때 몸에서 무엇을 느끼는지 알아야 한다."},{"n":4,"en":"We can watch for the beating of our heart, the smile on our face, the calm we feel.","ko":"심장의 박동, 얼굴의 미소, 느끼는 평온함이 나타나기를 기다릴 수 있다."},{"n":5,"en":"These bodily sensations activate the part of our brain that feels sympathy and closeness to others.","ko":"이러한 신체적 감각은 공감과 타인에 대한 친밀감을 느끼는 우리 뇌의 부위를 활성화한다."},{"n":6,"en":"They will happen when we are in harmony with our children and last only a few seconds at first, but over time, we can stretch these moments.","ko":"이 감각들은 우리가 자녀와 조화를 이루고 있을 때 발생할 터인데, 처음에는 몇 초 동안만 지속되지만, 시간이 지나면서 이러한 순간들을 늘릴 수 있다."},{"n":7,"en":"With practice, we can find empathy even when we are upset with our young teenager or they are angry at us, if we remember not to take their behavior personally.","ko":"연습을 함으로써 우리는 우리의 어린 십 대들에게 화가 나거나 그들이 우리에게 화를 낼 때조차도 공감에 이를 수 있는데, '만약' 우리가 그들의 행동을 모욕적으로 받아들이지만 않는다면 그렇다."}],"easy_story":"화가 났을 때 상대를 곧바로 모욕하는 사람으로 받아들이면 공감하기 어렵습니다. 글은 공감할 때의 미소·심장 박동·평온함 같은 몸의 느낌을 알아차리고 그 순간을 연습하라고 합니다. 처음에는 짧아도, 상대의 행동을 모욕으로만 보지 않으면 화난 순간에도 공감에 다가갈 수 있다는 뜻입니다.","core":"분노와 공감은 함께 설 수 없으므로, 공감할 때의 신체 감각을 알아차리고 연습하면 화가 난 순간에도 스스로를 진정시킬 수 있다.","flow":[{"label":"주제 → 방법","sentences":"S1–3","text":"자신을 진정시키는 가장 좋은 방법 중 하나는 공감을 베푸는 것이다 · 화를 내면서 동시에 공감하는 것은 불가능하다 · 공감을 의지로 켜려면 공감할 때 몸의 느낌을 알아야 한다","refs":[1,2,3]},{"label":"표시 → 작동 원리","sentences":"S4–5","text":"심장의 박동, 얼굴의 미소, 느끼는 평온함을 기다린다 · 그 신체 감각이 공감과 친밀감을 느끼는 뇌 부위를 켠다","refs":[4,5]},{"label":"한계 → 조건","sentences":"S6–7","text":"처음에는 몇 초뿐이지만 시간이 지나면 그 순간을 늘릴 수 있다 · 행동을 모욕으로 받아들이지 않으면 화난 순간에도 공감에 이른다","refs":[6,7]}],"structure":[{"title":"분노에 머무는 길","text":"아이의 행동을 나에 대한 공격으로 받아들인다"},{"title":"공감으로 가는 길","text":"몸의 감각을 알아차려 공감하는 뇌 부위를 켠다"}],"key_sentence_en":"Since anger and compassion cannot coexist, noticing the bodily sensations of empathy and practicing them lets us calm ourselves even when our teenager upsets us.","blocking_vocab":[{"word":"empathy","meaning":"공감"},{"word":"compassionate","meaning":"연민을 느끼는"},{"word":"sensations","meaning":"감각"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["분노와 공감은 함께 설 수 없으므로, 공감할 때의 신체 감각을 알아차리고 연습하면 화가 난 순간에도 스스로를 진정시킬 수 있다.","상대의 행동을 개인적 모욕으로 받아들일수록 공감이 쉬워진다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[7]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["자신을 진정시키는 가장 좋은 방법 중 하나는 공감을 베푸는 것이다","공감을 의지로 켜려면 공감할 때 몸의 느낌을 알아야 한다"],"answer":1,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S2의 원문 문장을 고르세요.","choices":["It is easy to be angry and compassionate at the same time.","It is impossible to be angry and compassionate at the same time."],"answer":1,"why":"원문 표현은 “impossible”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[2]}],"diagram":{"kind":"stages","title":"공감을 켜서 분노를 가라앉히기","items":[{"head":"분노 상태","body":"화를 내면서 동시에 공감할 수는 없다","refs":[1,2]},{"head":"몸의 신호","body":"심장 박동·미소·평온함을 알아차린다","refs":[3,4,5]},{"head":"연습","body":"처음의 몇 초를 늘려 화난 순간에도 공감","refs":[6,7]}],"takeaway":"공감의 신체 감각을 알아차리고 연습하는 것이 진정의 길이다."}},{"id":"q35-07","title":"7. p98-no.05","lead":"보이는 진화와 보이지 않는 우연","sentences":[{"n":1,"en":"Because of their physicalist beliefs, many scientists keep averaging out difficult problems as if that's the best (or only) way to handle randomness.","ko":"물리주의적 신념 때문에, 많은 과학자는 어려운 문제들을 계속 평균화하는데, 마치 그것이 무작위성을 다루는 최선의 (또는 유일한) 방법인 것처럼 그렇게 한다."},{"n":2,"en":"A striking example is evolution.","ko":"두드러진 예는 진화이다."},{"n":3,"en":"Looking at an elephant, you can see that its snake-like trunk and sail-like ears are unique.","ko":"코끼리를 보면, 그 뱀처럼 생긴 긴 코와 돛처럼 생긴 귀가 독특하다는 것을 알 수 있다."},{"n":4,"en":"The elephant evolved to have them, and according to Darwinian theory, having just this kind of trunk and that kind of ears enabled the first elephants to survive better.","ko":"코끼리는 그것들을 가지도록 진화했는데, 다윈의 이론에 따르면 바로 이런 종류의 코와 저런 종류의 귀를 가지는 것이 최초의 코끼리들이 더 잘 생존하게 했다."},{"n":5,"en":"New adaptations begin at the genetic level with a mutation that hasn't been seen before.","ko":"새로운 적응 형태는 유전적 단계에서 이전에 관찰되지 않은 돌연변이로써 시작된다."},{"n":6,"en":"Mutations occur at random, so standard evolution says, and they must be passed on to later generations in order to become permanent.","ko":"돌연변이는 무작위로 발생하므로, 권위 있는 진화론이 말하기를, 그것들이 영구적으로 되기 위해서 후대에 전달되어야만 한다."},{"n":7,"en":"If a single pink elephant appeared millions of years ago, we'll never know, because that genetic mutation failed to be passed on.","ko":"수백만 년 전에 분홍색 코끼리 한 마리가 나타났더라도, 우리는 결코 알지 못할 것인데, 그 유전적 돌연변이가 후대에 전달되지 못했기 때문이다."}],"easy_story":"코끼리의 코나 귀가 생존에 도움이 되었다는 설명만 들으면 진화가 처음부터 정해진 길처럼 보일 수 있습니다. 하지만 새로운 형질은 우연한 돌연변이에서 시작하고, 다음 세대에 전해지지 않으면 남지 않습니다. 우리가 모르는 ‘분홍 코끼리’의 예는 전해지지 않아 사라진 수많은 우연을 떠올리게 합니다.","core":"과학자들이 무작위성을 평균으로 처리하기 때문에, 코끼리를 설명하는 매끄러운 진화 이야기는 전해지지 못한 수많은 돌연변이를 가린다.","flow":[{"label":"문제 → 실물","sentences":"S1–3","text":"많은 과학자가 어려운 문제를 계속 평균화해 무작위성을 지운다 · 그 두드러진 예가 진화다 · 코끼리의 뱀 같은 코와 돛 같은 귀는 독특하다","refs":[1,2,3]},{"label":"설명 → 출발점","sentences":"S4–5","text":"다윈의 이론은 그 형질이 생존을 도왔다고 매끄럽게 설명한다 · 새 적응은 전례 없는 돌연변이에서 유전 단계로 시작된다","refs":[4,5]},{"label":"조건 → 값","sentences":"S6–7","text":"무작위로 생긴 변이는 후대로 전해져야 영구적이 된다 · 전해지지 못한 분홍 코끼리는 우리가 결코 알 수 없다","refs":[6,7]}],"structure":[{"title":"평균이 보여 주는 진화","text":"이런 코와 저런 귀가 생존에 유리했다는 매끄러운 이야기"},{"title":"평균이 가리는 진화","text":"전해지지 못해 흔적도 남기지 못한 무작위 돌연변이들"}],"key_sentence_en":"Scientists tend to average away randomness, so the tidy Darwinian story of the elephant hides the countless random mutations that were never passed on.","blocking_vocab":[{"word":"randomness","meaning":"무작위성"},{"word":"mutation","meaning":"돌연변이"},{"word":"passed on","meaning":"전해진"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["현재 보이는 형질만이 진화 과정에서 발생한 모든 변이다.","과학자들이 무작위성을 평균으로 처리하기 때문에, 코끼리를 설명하는 매끄러운 진화 이야기는 전해지지 못한 수많은 돌연변이를 가린다."],"answer":1,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[7]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["많은 과학자가 어려운 문제를 계속 평균화해 무작위성을 지운다","코끼리의 뱀 같은 코와 돛 같은 귀는 독특하다"],"answer":1,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S5의 원문 문장을 고르세요.","choices":["New adaptations begin at the genetic level with a mutation that has been seen many times before.","New adaptations begin at the genetic level with a mutation that hasn't been seen before."],"answer":1,"why":"원문 표현은 “hasn't been seen before”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[5]}],"diagram":{"kind":"branch","title":"보이는 진화와 보이지 않는 우연","items":[{"head":"돌연변이","body":"새로운 변이는 유전 단계에서 우연히 시작","refs":[5]},{"head":"전해진 변이","body":"코끼리의 독특한 형질처럼 관찰 가능","refs":[3,4,6]},{"head":"사라진 변이","body":"후대에 전해지지 않으면 알 길이 없다","refs":[6,7]}],"takeaway":"현재의 형질만으로 매끄럽게 설명하면 사라진 무작위 변이를 놓친다."}},{"id":"q35-08","title":"8. p99-no.06","lead":"낱말 뜻만으로는 모자라다","sentences":[{"n":1,"en":"Learning a language opens the door to learning about the way humans express themselves, interact with each other, and experience the social, cultural, and material world.","ko":"언어를 배우는 것은 인간이 자신을 표현하고, 서로 소통하며 사회적, 문화적, 물질적 세계를 경험하는 방식에 대해 배우는 문을 여는 것이다."},{"n":2,"en":"Understanding what is said in a language requires far more than merely learning the meaning of words and memorizing the dictionary.","ko":"언어로 말하여진 것을 이해하는 것은 단지 단어의 의미를 배우고 사전을 외우는 것 이상이 필요하다."},{"n":3,"en":"To understand a joke or recognize an allusion, one needs to be attentive to the way words are used and the context that is assumed.","ko":"농담을 이해하거나 암시를 인식하려면 단어가 사용되는 방식과 가정된 상황에 주의를 기울여야 한다."},{"n":4,"en":"Such a broader ability to use a language opens up the literature of a people, their culture, and their world.","ko":"언어를 사용하는 그러한 더 넓은 능력은 한 민족의 문학, 그들의 문화, 그리고 세계를 열어 준다."},{"n":5,"en":"Language may also be used ironically, to evoke something else, or to lie, to mislead about intentions, or to hide one's ideas.","ko":"언어는 또한 다른 것을 떠올리게 하거나, 거짓말을 하거나, 의도를 오도하거나, 자신의 생각을 숨기기 위해 반어적으로 사용될 수도 있다."},{"n":6,"en":"Discerning what people convey depends on understanding language as it was used at a particular time and place.","ko":"사람들이 전달하는 것을 파악하는 것은 특정 시간과 장소에서 사용된 (것으로서의) 언어를 이해하는 것에 달려 있다."}],"easy_story":"사전에서 낱말 뜻을 알아도, 그 말이 농담인지 반어인지 모르면 상대의 뜻을 놓칠 수 있습니다. 말하는 사람이 무엇을 전제하는지, 언제 어디서 그 말을 쓰는지까지 보아야 합니다. 그래서 글은 언어 배우기를 단어 암기보다 넓은 문화와 맥락 이해로 설명합니다.","core":"언어를 제대로 이해하는 일은 낱말의 뜻을 넘어 쓰이는 방식과 전제된 맥락, 그리고 쓰인 시간과 장소까지 읽어 내는 일이다.","flow":[{"label":"판 벌이기 → 주제","sentences":"S1–2","text":"언어를 배우는 것은 사람의 표현·소통·경험 방식을 배우는 문이다 · 뜻을 배우고 사전을 외우는 것보다 훨씬 더 많은 것이 필요하다","refs":[1,2]},{"label":"내용 → 보상","sentences":"S3–4","text":"농담과 암시를 알려면 낱말의 쓰임과 전제된 맥락에 주의해야 한다 · 그 넓은 능력이 한 민족의 문학·문화·세계를 열어 준다","refs":[3,4]},{"label":"어긋남 → 결론","sentences":"S5–6","text":"언어는 반어·거짓말·오도·은폐를 위해서도 쓰인다 · 뜻을 잡는 일은 그 시간과 장소의 쓰임을 아는 데 달려 있다","refs":[5,6]}],"structure":[{"title":"좁은 언어 학습","text":"낱말의 뜻과 사전을 외우는 데서 끝난다"},{"title":"넓은 언어 능력","text":"쓰임과 맥락, 쓰인 시간과 장소까지 읽어 낸다"}],"key_sentence_en":"Truly understanding a language goes beyond word meanings to the way words are used, the context assumed, and the particular time and place of their use.","blocking_vocab":[{"word":"context","meaning":"맥락"},{"word":"ironically","meaning":"반어적으로"},{"word":"discerning","meaning":"분별해 알아내는"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["단어의 사전적 뜻만 외우면 말하는 이의 의도를 완전히 알 수 있다.","언어를 제대로 이해하는 일은 낱말의 뜻을 넘어 쓰이는 방식과 전제된 맥락, 그리고 쓰인 시간과 장소까지 읽어 내는 일이다."],"answer":1,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[6]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["언어를 배우는 것은 사람의 표현·소통·경험 방식을 배우는 문이다","농담과 암시를 알려면 낱말의 쓰임과 전제된 맥락에 주의해야 한다"],"answer":1,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S6의 원문 문장을 고르세요.","choices":["Discerning what people convey depends on understanding language as it was used at a particular time and place.","Discerning what people convey depends on understanding language as it was used at a dictionary definition alone."],"answer":0,"why":"원문 표현은 “particular time and place”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[6]}],"diagram":{"kind":"layers","title":"낱말 뜻만으로는 모자라다","items":[{"head":"낱말","body":"사전적 뜻을 아는 것","refs":[2]},{"head":"쓰임","body":"농담·암시·반어와 전제된 맥락","refs":[3,5]},{"head":"장면","body":"누가 언제 어디서 그 말을 썼는가","refs":[1,4,6]}],"takeaway":"언어 이해는 뜻·쓰임·맥락·시간과 장소를 함께 읽는 일이다."}},{"id":"q35-09","title":"9. p100-no.07","lead":"코드가 화면 밖으로 나온다","sentences":[{"n":1,"en":"Code is now present in almost all the occupations, transactions and interactions that make up a meaningful life.","ko":"코드는 이제 의미 있는 삶을 구성하는 거의 모든 직업, 거래 및 상호 작용에 존재한다."},{"n":2,"en":"It's unavoidable.","ko":"그것은 피할 수 없다."},{"n":3,"en":"And the empire of code is no longer confined to the separate dimension of 'cyberspace.'","ko":"그리고 코드의 제국은 더 이상 '사이버 공간'이라는 별개의 차원에 국한되지 않는다."},{"n":4,"en":"We cannot escape by shutting a laptop or logging off.","ko":"우리는 노트북을 닫거나 로그오프함으로써 탈출할 수 없다."},{"n":5,"en":"We are physically surrounded by technology, encountering hundreds or thousands of digital objects every day.","ko":"우리는 물리적으로 기술에 둘러싸여 매일 수백 또는 수천 개의 디지털 객체와 마주친다."},{"n":6,"en":"As Bruce Schneier says, it used to be that things contained computers, but now 'they are computers with things attached to them.'","ko":"Bruce Schneier가 말하듯이, 전에는 사물에 컴퓨터가 포함되었으나, 이제 '그것(사물)은 그것(컴퓨터)에 사물이 붙어 있는 컴퓨터이다.'"},{"n":7,"en":"Soon, tens of billions of once-dumb artefacts will be connected to the internet, equipped with sensors and endowed with processing power, enabling them to interact with us and each other.","ko":"곧 한때는 시시했던 수백억 개의 인공물들이 인터넷에 연결되고, 센서가 장착되고, 처리 능력을 부여받아 우리와 서로 상호 작용을 할 수 있게 될 것이다."},{"n":8,"en":"All these technologies will contain rules, and we will have to follow them.","ko":"이 모든 기술들은 규칙들을 포함할 것이며, 우리는 그것들을 따라야 할 것이다."}],"easy_story":"코드는 노트북을 켰을 때만 만나는 별도의 사이버 세계에 갇혀 있지 않습니다. 센서와 컴퓨터 기능이 들어간 물건이 우리 주변에 많아지고, 그 물건들이 서로 연결됩니다. 그러면 물건 안에 심긴 작동 규칙이 우리의 일상 행동에도 영향을 주게 된다는 글입니다.","core":"코드는 사이버 공간을 넘어 우리 주변의 사물 자체가 되었고, 수백억 기기가 연결되면서 그 안에 심긴 규칙이 우리 삶을 규율하게 된다.","flow":[{"label":"주제 → 확장","sentences":"S1–3","text":"코드는 삶을 이루는 거의 모든 직업·거래·상호 작용에 존재한다 · 그것은 피할 수 없다 · 코드의 제국은 사이버 공간이라는 별개의 차원에 갇혀 있지 않다","refs":[1,2,3]},{"label":"탈출 불가 → 뒤집힘","sentences":"S4–6","text":"노트북을 닫거나 로그오프해도 벗어날 수 없다 · 매일 수천 개의 디지털 객체에 물리적으로 둘러싸여 있다 · 사물 속 컴퓨터가 아니라 사물이 붙은 컴퓨터가 되었다","refs":[4,5,6]},{"label":"앞일 → 값","sentences":"S7–8","text":"수백억 인공물이 센서와 처리 능력을 얻어 서로 작동한다 · 그 기술에 담긴 규칙을 우리가 따라야 하게 된다","refs":[7,8]}],"structure":[{"title":"전에는","text":"코드는 사이버 공간에 머물고 사물 안에 컴퓨터가 들어 있었다"},{"title":"이제는","text":"사물이 곧 컴퓨터이고 그 규칙이 우리를 규율한다"}],"key_sentence_en":"Code has spread beyond cyberspace into the objects around us, and as tens of billions of them come online, the rules built into them will govern our lives.","blocking_vocab":[{"word":"code","meaning":"코드"},{"word":"cyberspace","meaning":"사이버 공간"},{"word":"sensors","meaning":"센서"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["코드는 사이버 공간을 넘어 우리 주변의 사물 자체가 되었고, 수백억 기기가 연결되면서 그 안에 심긴 규칙이 우리 삶을 규율하게 된다.","노트북을 닫기만 하면 코드의 영향에서 벗어날 수 있다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[8]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["코드의 제국은 사이버 공간이라는 별개의 차원에 갇혀 있지 않다","코드는 삶을 이루는 거의 모든 직업·거래·상호 작용에 존재한다"],"answer":0,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S4의 원문 문장을 고르세요.","choices":["We can escape by shutting a laptop or logging off.","We cannot escape by shutting a laptop or logging off."],"answer":1,"why":"원문 표현은 “cannot escape”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[4]}],"diagram":{"kind":"shift","title":"코드가 화면 밖으로 나온다","items":[{"head":"사이버 공간","body":"노트북을 닫아도 코드를 피할 수 없다","refs":[1,2,3,4]},{"head":"연결된 사물","body":"기기와 센서가 물리적 일상에 퍼진다","refs":[5,6,7]},{"head":"생활 규칙","body":"기술에 들어 있는 규칙을 따라야 한다","refs":[8]}],"takeaway":"코드는 별도 가상 공간이 아니라 생활 속 사물과 규칙이 되었다."}},{"id":"q35-10","title":"10. p101-no.08","lead":"친구가 된 관리자의 갈림길","sentences":[{"n":1,"en":"As a manager, if you create friendships with your people, if you try to motivate them through the personal ties you've created or allowed, you're likely to find yourself having to choose between maintaining the ties or obtaining the best results possible.","ko":"관리자로서 직원들과 친구 관계를 맺고, 여러분이 만들거나 허용한 개인적인 유대를 통해 그들에게 동기를 부여하고자 한다면, 유대를 유지할 것인지 가능한 최상의 결과를 얻을 것인지 선택해야 하는 상황에 직면하게 될 가능성이 있다."},{"n":2,"en":"If you maintain the ties, you will compromise results or make unethical choices that harm others not for a greater good but for the good of a friend.","ko":"유대를 유지하면, 결과를 손상하거나 더 큰 이익이 아니라 친구의 이익을 위해서 다른 사람들에게 해를 끼치는 비윤리적인 선택을 하게 될 것이다."},{"n":3,"en":"If you choose work and the work group over the wishes of a friend, as eventually and inevitably you must, the friend will feel betrayed.","ko":"친구의 바람에 앞서 일과 업무 그룹을 선택하면, 최종적으로 그리고 불가피하게 그렇게 해야 하는데, 친구는 배신감을 느낄 것이다."},{"n":4,"en":"Sooner or later you must decide against, disappoint, criticize, discipline, demote, or even fire someone who works for you.","ko":"조만간 여러분은 여러분을 위해 일하는 사람에게 불리하게 결정하거나, 그들을 실망시키거나, 비판하거나, 징계하거나, 강등시키거나, 심지어 해고해야 할 것이다."},{"n":5,"en":"To someone who thought you were friends, those actions will feel like a personal betrayal and will damage or destroy that person's commitment to the work.","ko":"여러분이 친구라고 생각한 사람에게는 그런 행동이 개인적인 배신으로 느껴질 것이며, 그 사람의 업무에 대한 헌신을 손상하거나 파괴할 것이다."}],"easy_story":"관리자가 직원과 친구처럼 가까워지면 어려운 선택이 생깁니다. 친구 사이를 지키려고 업무 기준을 낮추거나, 반대로 필요한 징계·해고를 하면 상대가 배신으로 느낄 수 있습니다. 글은 개인적 유대와 관리자의 책임이 부딪히는 상황을 두 갈래로 보여 줍니다.","core":"직원과 친구가 된 관리자는 유대를 지킬지 최상의 성과를 낼지 골라야 하며, 어느 쪽을 골라도 윤리나 신뢰를 잃게 된다.","flow":[{"label":"갈림길 → 대가 ①","sentences":"S1–2","text":"직원과 친구가 되면 유대와 최상의 성과 사이에서 골라야 한다 · 유대를 지키면 성과를 깎고 친구를 위해 비윤리적 선택을 한다","refs":[1,2]},{"label":"대가 ② → 불가피","sentences":"S3–4","text":"일을 고르면 친구는 배신감을 느낀다 · 조만간 부하를 실망시키고 징계하거나 해고해야 한다","refs":[3,4]},{"label":"끝값","sentences":"S5","text":"친구로 여긴 사람에게는 배신이 되어 업무 헌신까지 무너진다","refs":[5]}],"structure":[{"title":"유대를 지키는 쪽","text":"성과를 손상하고 친구를 위한 비윤리적 선택에 이른다"},{"title":"일을 지키는 쪽","text":"친구가 배신감을 느껴 업무에 대한 헌신을 잃는다"}],"key_sentence_en":"A manager who befriends subordinates is forced to choose between keeping those ties and getting the best results, and either choice ends up costing ethics or trust.","blocking_vocab":[{"word":"personal ties","meaning":"개인적 유대"},{"word":"betrayed","meaning":"배신당한"},{"word":"commitment","meaning":"헌신"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["직원과 친구가 된 관리자는 유대를 지킬지 최상의 성과를 낼지 골라야 하며, 어느 쪽을 골라도 윤리나 신뢰를 잃게 된다.","친구가 된 관리자는 어려운 업무 결정을 피할 수 있다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[5]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["직원과 친구가 되면 유대와 최상의 성과 사이에서 골라야 한다","일을 고르면 친구는 배신감을 느낀다"],"answer":1,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S4의 원문 문장을 고르세요.","choices":["Sooner or later you never need to decide against, disappoint, criticize, discipline, demote, or even fire someone who works for you.","Sooner or later you must decide against, disappoint, criticize, discipline, demote, or even fire someone who works for you."],"answer":1,"why":"원문 표현은 “must decide”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[4]}],"diagram":{"kind":"branch","title":"친구가 된 관리자의 갈림길","items":[{"head":"친구 관계","body":"부하와 사적 유대를 만들었다","refs":[1]},{"head":"유대를 지킴","body":"성과·윤리적 판단이 손상될 수 있다","refs":[2]},{"head":"일을 택함","body":"친구가 배신감을 느끼고 헌신이 무너진다","refs":[3,4,5]}],"takeaway":"관리자는 어느 선택에서도 관계나 성과의 대가를 치른다."}}]},{"id":"q36","label":"Chapter 4 · QN36~37","scope":"p102~107 · 4지문","passages":[{"id":"q36-01","title":"1. p102-기출 예제 01","lead":"같은 물건, 언어에 따라 달라진 묘사","sentences":[{"n":1,"en":"Shakespeare wrote, \"What's in a name? That which we call a rose by any other name would smell as sweet.\"","ko":"셰익스피어는 \"이름 안에 무엇이 있는가? 우리가 장미라고 부르는 것은 그 어떤 다른 이름으로 불러도 그만큼 달콤한 냄새가 날 것이다.\"라고 썼다."},{"n":2,"en":"According to Stanford University psychology professor Lera Boroditsky, that's not necessarily so.","ko":"Stanford 대학교의 심리학 교수인 Lera Boroditsky에 따르면, 그것이 반드시 그렇지는 않다."},{"n":3,"en":"Focusing on the grammatical gender differences between German and Spanish, Boroditsky's work indicates that the gender our language assigns to a given noun influences us to subconsciously give that noun characteristics of the grammatical gender.","ko":"독일어와 스페인어 간의 문법적 성 차이에 초점을 맞춘 Boroditsky의 연구에 따르면, 우리의 언어가 특정 명사에 부여하는 성은 우리가 무의식적으로 그 명사에 문법적 성의 특성을 부여하도록 영향을 미친다."},{"n":4,"en":"Take the word bridge.","ko":"'다리'라는 단어를 보자."},{"n":5,"en":"In German, bridge (die brucke) is a feminine noun; in Spanish, bridge (el puente) is a masculine noun.","ko":"독일어로 '다리'(die brucke)는 여성 명사이지만, 스페인어로 '다리'(el puente)는 남성 명사이다."},{"n":6,"en":"Boroditsky found that when asked to describe a bridge, native German speakers used words like beautiful, elegant, slender.","ko":"Boroditsky는 독일어 원어민이 다리를 묘사하라는 요청을 받았을 때, '아름다운', '우아한', '날씬한' 같은 단어를 사용한다는 사실을 알아냈다."},{"n":7,"en":"When native Spanish speakers were asked the same question, they used words like strong, sturdy, towering.","ko":"같은 질문을 받았을 때, 스페인어 원어민은 '강한', '튼튼한', '우뚝 솟은' 같은 단어를 사용했다."},{"n":8,"en":"This worked the other way around as well.","ko":"이것은 반대의 경우에도 마찬가지였다."},{"n":9,"en":"The word key is masculine in German and feminine in Spanish.","ko":"'열쇠'라는 단어는 독일어에서는 남성형이고 스페인어에서는 여성형이다."},{"n":10,"en":"When asked to describe a key, native German speakers used words like jagged, heavy, hard, metal.","ko":"독일어 원어민이 열쇠를 묘사하라는 요청을 받았을 때, '뾰족뾰족한', '무거운', '단단한', '금속의' 같은 단어를 사용했다."},{"n":11,"en":"Spanish speakers used words like intricate, golden, lovely.","ko":"스페인어 사용자는 '정교한', '황금빛의', '사랑스러운' 같은 단어를 사용했다."}],"easy_story":"같은 ‘다리’라도 독일어와 스페인어에서 붙는 문법적 성은 서로 다릅니다. 그 차이에 따라 사람들은 다리를 묘사할 때 고르는 말도 다르게 사용했습니다. ‘열쇠’에서는 두 언어의 성이 반대로 바뀝니다. 글은 사물 자체가 바뀐 게 아니라 언어의 이름 붙이기가 생각에 영향을 준다고 보여 줍니다.","core":"언어가 명사에 붙인 문법적 성은, 그 명사를 묘사하는 말까지 무의식적으로 바꾼다.","flow":[{"label":"인용","sentences":"S1-2","text":"이름은 알맹이와 무관하다는 셰익스피어의 말을 들고, 꼭 그렇지는 않다고 뒤집는다","refs":[1,2]},{"label":"주제","sentences":"S3","text":"언어가 붙인 성이 그 명사의 인상을 무의식적으로 물들인다","refs":[3]},{"label":"사례 ①","sentences":"S4-7","text":"다리 — 독일어는 여성, 스페인어는 남성이라 묘사하는 말이 갈린다","refs":[4,5,6,7]},{"label":"뒤집기","sentences":"S8-9","text":"성이 반대인 낱말로도 같은 일이 일어난다","refs":[8,9]},{"label":"사례 ②","sentences":"S10-11","text":"열쇠 — 독일어는 남성, 스페인어는 여성이라 묘사하는 말도 뒤바뀐다","refs":[10,11]}],"structure":[{"title":"독일어 — 다리는 여성, 열쇠는 남성","text":"다리를 아름다운·우아한·날씬한으로, 열쇠를 뾰족한·무거운·단단한으로 묘사한다"},{"title":"스페인어 — 다리는 남성, 열쇠는 여성","text":"다리를 강한·튼튼한·우뚝 솟은으로, 열쇠를 정교한·황금빛의·사랑스러운으로 묘사한다"}],"key_sentence_en":"The grammatical gender a language assigns to a noun shapes the very words its speakers use to describe that noun.","blocking_vocab":[{"word":"grammatical gender","meaning":"문법적 성"},{"word":"bridge","meaning":"다리"},{"word":"describe","meaning":"묘사하다"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["언어가 명사에 붙인 문법적 성은, 그 명사를 묘사하는 말까지 무의식적으로 바꾼다.","다리와 열쇠의 물리적 형태가 언어마다 달라진다는 주장이다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[10,11]},{"type":"근거","q":"S4-7에서 확인할 수 있는 내용은?","choices":["다리 — 독일어는 여성, 스페인어는 남성이라 묘사하는 말이 갈린다","이름은 알맹이와 무관하다는 셰익스피어의 말을 들고, 꼭 그렇지는 않다고 뒤집는다"],"answer":0,"why":"S4-7의 영어 원문을 다시 확인하세요.","refs":[4,5,6,7]},{"type":"변형 탐지","q":"S11의 원문 문장을 고르세요.","choices":["German speakers used words like intricate, golden, lovely.","Spanish speakers used words like intricate, golden, lovely."],"answer":1,"why":"원문 표현은 “Spanish speakers”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[11]}],"diagram":{"kind":"matrix","title":"같은 물건, 언어에 따라 달라진 묘사","items":[{"head":"다리 · 독일어","body":"여성형 → 아름다운·우아한·날씬한","refs":[4,5,6]},{"head":"다리 · 스페인어","body":"남성형 → 강한·튼튼한·우뚝 솟은","refs":[5,7]},{"head":"열쇠 · 독일어","body":"남성형 → 뾰족한·무거운·단단한","refs":[8,9,10]},{"head":"열쇠 · 스페인어","body":"여성형 → 정교한·황금빛의·사랑스러운","refs":[9,11]}],"takeaway":"문법적 성이 물건 자체가 아닌 묘사하는 사람의 말을 바꾼다."}},{"id":"q36-02","title":"2. p104-기출 예제 02","lead":"보는 것과 안다고 믿는 것 사이","sentences":[{"n":1,"en":"Our perception always involves some imagination.","ko":"우리의 인식은 항상 얼마간의 상상력을 수반한다."},{"n":2,"en":"It is more similar to painting than to photography.","ko":"그것은 사진보다는 그림과 더 비슷하다."},{"n":3,"en":"And, according to the confirmation effect, we blindly trust the reality we construct.","ko":"그리고, 확증 효과에 따르면, 우리는 자신이 구축하는 현실을 맹목적으로 신뢰한다."},{"n":4,"en":"This is best witnessed in visual illusions, which we perceive with full confidence, as if there were no doubt that we are portraying reality faithfully.","ko":"이것은 시각적 착각들에서 가장 잘 목격되는데, 마치 우리가 현실을 충실하게 묘사하고 있다는 것에 의심의 여지가 없는 것처럼 우리는 그것을 온전히 자신 있게 인식한다."},{"n":5,"en":"One interesting way of discovering this ─ in a simple game that can be played at any moment ─ is the following.","ko":"언제든지 할 수 있는 간단한 게임에서 이것을 발견하는 한 가지 흥미로운 방법은 다음과 같다."},{"n":6,"en":"Whenever you are with another person, ask him or her to close their eyes, and start asking questions about what is nearby ─ not very particular details but the most striking elements of the scene.","ko":"여러분이 다른 사람과 함께 있을 때마다, 그 사람에게 눈을 감으라고 요청하고, 근처에 있는 것, 즉 그 현장의 아주 구체적인 세부 사항이 아니라 가장 눈에 띄는 요소들에 대해 질문하기 시작하라."},{"n":7,"en":"What is the color of the wall?","ko":"벽의 색깔은 무엇인가?"},{"n":8,"en":"Is there a table in the room?","ko":"방에 테이블이 있는가?"},{"n":9,"en":"Does that man have a beard?","ko":"저 남자는 턱수염이 있는가?"},{"n":10,"en":"You will see that the majority of us are quite ignorant about what lies around us.","ko":"여러분은 우리 대다수가 우리 주변에 놓여 있는 것에 대해 상당히 무지하다는 것을 알게 될 것이다."},{"n":11,"en":"This is not so puzzling.","ko":"이것은 그렇게 이해하기 어렵지 않다."},{"n":12,"en":"The most extraordinary fact is that we completely disregard this ignorance.","ko":"가장 놀라운 사실은 우리가 이 무지를 완전히 무시한다는 것이다."}],"easy_story":"우리가 보는 세상은 사진처럼 있는 그대로 저장되는 것이 아니라, 모르는 부분을 상상으로 메운 그림에 가깝습니다. 눈을 감고 바로 주변의 색이나 물건을 물으면 생각보다 답하지 못하는 사람이 많습니다. 더 놀라운 점은 그렇게 모르는 부분이 많다는 사실을 평소에는 알아채지도 못한다는 것입니다.","core":"우리는 스스로 지어낸 현실을 의심 없이 믿고, 정작 아무것도 모른다는 사실조차 알아채지 못한다.","flow":[{"label":"주제","sentences":"S1-2","text":"인식에는 늘 상상이 섞인다 — 사진이 아니라 그림에 가깝다","refs":[1,2]},{"label":"근거","sentences":"S3-4","text":"확증 효과로 지어낸 현실을 맹신한다 — 착시가 그 증거다","refs":[3,4]},{"label":"실험","sentences":"S5-9","text":"눈을 감기고 벽 색깔·테이블·턱수염을 물어본다","refs":[5,6,7,8,9]},{"label":"결과","sentences":"S10-11","text":"대다수가 주변을 모른다 — 여기까지는 놀랄 일이 아니다","refs":[10,11]},{"label":"뒤집기","sentences":"S12","text":"정작 놀라운 것은 그 무지를 우리가 완전히 무시한다는 점이다","refs":[12]}],"structure":[{"title":"놀랄 일이 아닌 것","text":"우리 대다수가 주변에 무엇이 있는지 잘 모른다"},{"title":"진짜 놀라운 것","text":"그 모름을 알아채지도 않고 완전히 무시한다"}],"key_sentence_en":"We not only trust the reality we construct but also completely overlook how little we actually know about our surroundings.","blocking_vocab":[{"word":"perception","meaning":"인식"},{"word":"imagination","meaning":"상상력"},{"word":"ignorance","meaning":"무지"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["사람은 주변을 정확히 모른다는 사실을 늘 의식한다.","우리는 스스로 지어낸 현실을 의심 없이 믿고, 정작 아무것도 모른다는 사실조차 알아채지 못한다."],"answer":1,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[12]},{"type":"근거","q":"S5-9에서 확인할 수 있는 내용은?","choices":["눈을 감기고 벽 색깔·테이블·턱수염을 물어본다","인식에는 늘 상상이 섞인다 — 사진이 아니라 그림에 가깝다"],"answer":0,"why":"S5-9의 영어 원문을 다시 확인하세요.","refs":[5,6,7,8,9]},{"type":"변형 탐지","q":"S1의 원문 문장을 고르세요.","choices":["Our perception always involves some imagination.","Our perception always involves no imagination."],"answer":0,"why":"원문 표현은 “some imagination”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[1]}],"diagram":{"kind":"layers","title":"보는 것과 안다고 믿는 것 사이","items":[{"head":"인식","body":"우리는 사실을 사진처럼 복사하지 않고 상상을 섞는다","refs":[1,2]},{"head":"확신","body":"스스로 지은 현실을 의심 없이 믿는다","refs":[3,4]},{"head":"실험","body":"눈을 감으면 주변의 색·물건도 모른다","refs":[5,6,7,8,9,10,11]},{"head":"반전","body":"모른다는 사실마저 무시한다","refs":[12]}],"takeaway":"인식은 구성된 것인데 우리는 그것을 완전한 현실로 믿는다."}},{"id":"q36-03","title":"3. p106-no.01","lead":"유인원 무리의 두 바깥 위협","sentences":[{"n":1,"en":"Why are apes social creatures?","ko":"유인원은 왜 사회적 동물인가?"},{"n":2,"en":"If apes are like most animals that live in groups, communal life was attractive to their ancestors because it afforded more effective protection from dangerous animals.","ko":"유인원이 집단생활을 하는 대부분의 동물과 같다면, 공동체 생활은 위험한 동물로부터 더 효과적으로 보호할 수 있었기 때문에 그 조상들에게 매력적이었다."},{"n":3,"en":"When large, lethal carnivores are lurking, it's better to have more companions even just to act as passive lookouts.","ko":"크고 치명적인 육식 동물이 숨어 있을 때는 단지 수동적인 감시자 역할을 위해서라도 동료가 더 많은 것이 더 낫다."},{"n":4,"en":"Sometimes apes will also rally together to actively fend off a predator.","ko":"유인원은 때때로 포식자를 적극적으로 막기 위해 함께 힘을 모으기도 한다."},{"n":5,"en":"Even more important, perhaps, are more familiar threats.","ko":"훨씬 더 중요한 것은 아마도 더 친숙한 위협일 것이다."},{"n":6,"en":"Intergroup violence between members of the same or related primate species is common, especially when groups have an interest in defending scarce territory and resources.","ko":"같은 영장류 종 또는 관련 영장류 종 구성원 사이의 집단 간 폭력은 흔하며, 집단들이 희소한 영역과 자원을 방어하려는 이해관계를 가지고 있는 경우에 특히 그렇다."},{"n":7,"en":"Some apes cooperate in order to compete violently with neighbors.","ko":"일부 유인원은 이웃과 폭력적으로 경쟁하기 위해 협력하기도 한다."},{"n":8,"en":"So, living in cooperative groups offered competitive advantages over other primate groups ─ so long as members could find a way to avoid spiraling cycles of violence arising from within.","ko":"따라서 구성원들이 내부에서 발생하는 점차 증가하는 폭력의 순환을 피할 수 있는 방법을 찾을 수만 있다면, 협력적인 집단에서 사는 것이 다른 영장류 집단에 비해 경쟁 우위를 제공했다."}],"easy_story":"유인원이 무리 지어 살면 바깥 포식자를 함께 경계할 수 있습니다. 글은 그보다 같은 종의 다른 무리와 맞서는 데 집단의 힘이 더 중요했을 수 있다고 말합니다. 다만 무리 안에서도 폭력이 커질 수 있으므로, 내부 갈등을 피할 수 있어야 협력이 이점이 됩니다.","core":"유인원의 무리 생활은 바깥 포식자보다 같은 종 이웃과의 싸움에서 더 큰 힘을 발휘했고, 안에서 터지는 폭력만 다스리면 경쟁 우위가 되었다.","flow":[{"label":"물음","sentences":"S1","text":"유인원은 왜 사회적 동물인가","refs":[1]},{"label":"첫 답","sentences":"S2-4","text":"바깥 포식자를 막으려고 — 망을 보고 때로는 맞선다","refs":[2,3,4]},{"label":"전환","sentences":"S5-6","text":"더 중요한 것은 같은 종 이웃과의 집단 간 폭력이다","refs":[5,6]},{"label":"뒤집기","sentences":"S7","text":"협력이 평화가 아니라 싸움을 위한 것이기도 하다","refs":[7]},{"label":"맺음","sentences":"S8","text":"안에서 터지는 폭력만 피하면 협력은 경쟁 우위가 된다","refs":[8]}],"structure":[{"title":"바깥의 위협","text":"크고 치명적인 육식 동물 — 감시자와 협공으로 막는다"},{"title":"안쪽의 위협","text":"같은·가까운 종 이웃과의 집단 간 폭력 — 희소한 영역과 자원을 두고 벌어진다"}],"key_sentence_en":"Apes live in groups less to escape predators than to win contests with neighboring groups, provided they can hold internal violence in check.","blocking_vocab":[{"word":"predator","meaning":"포식자"},{"word":"cooperate","meaning":"협력하다"},{"word":"violence","meaning":"폭력"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["유인원의 무리 생활은 바깥 포식자보다 같은 종 이웃과의 싸움에서 더 큰 힘을 발휘했고, 안에서 터지는 폭력만 다스리면 경쟁 우위가 되었다.","무리 생활의 유일한 이점은 포식자를 피하는 것이었다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[8]},{"type":"근거","q":"S5-6에서 확인할 수 있는 내용은?","choices":["더 중요한 것은 같은 종 이웃과의 집단 간 폭력이다","유인원은 왜 사회적 동물인가"],"answer":0,"why":"S5-6의 영어 원문을 다시 확인하세요.","refs":[5,6]},{"type":"변형 탐지","q":"S7의 원문 문장을 고르세요.","choices":["Some apes cooperate in order to avoid all conflict with neighbors.","Some apes cooperate in order to compete violently with neighbors."],"answer":1,"why":"원문 표현은 “compete violently”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[7]}],"diagram":{"kind":"branch","title":"유인원 무리의 두 바깥 위협","items":[{"head":"무리 생활","body":"함께 감시하고 필요하면 힘을 모은다","refs":[1,2,3,4]},{"head":"포식자","body":"큰 육식 동물로부터 보호받는다","refs":[2,3,4]},{"head":"이웃 무리","body":"같은·가까운 종과 자원을 두고 충돌한다","refs":[5,6,7]}],"takeaway":"두 바깥 위협에 맞서려면 협력이 이롭다. 다만 무리 안의 폭력 악순환을 피해야 한다는 조건이 있다 · S8"}},{"id":"q36-04","title":"4. p107-no.02","lead":"물 관리와 독재: 주장과 반례","sentences":[{"n":1,"en":"In 1957 Karl Wittfogel published what would become a very influential, and also heavily criticized, book titled Oriental Despotism.","ko":"1957년 Karl Wittfogel은 영향력이 매우 큰데, 또한 크게 비판받게 될 'Oriental Despotism'이라는 제목의 책을 출판했다."},{"n":2,"en":"He argued that societies that rely on a centralized system of providing either water (irrigation) or protection from water (flood control) tend toward autocracy.","ko":"그는 물을 공급하거나(관개) 물로부터 보호하는(홍수 통제) 중앙집권식 시스템에 의존하는 사회는 독재로 향하는 경향이 있다고 주장했다."},{"n":3,"en":"Wittfogel emphasized a functional need for central control, and many have criticized this assumption.","ko":"Wittfogel은 중앙 통제의 기능적 필요성을 강조했고, 많은 사람이 이 가정을 비판했다."},{"n":4,"en":"In a great number of societies, irrigation has been managed in a decentralized manner, and as Elinor Ostrom famously argued, local communities often solve problems such as these in a self-governing manner.","ko":"많은 사회에서 관개는 분권화된 방식으로 관리되어 왔으며, Elinor Ostrom이 주장한 것으로 유명하듯이, 지역 사회는 종종 이러한 문제를 자치적인 방식으로 해결한다."},{"n":5,"en":"The other big problem is that while Chinese agriculture would, over time, come to rely heavily on irrigation, the society of the Shang depended on rain-fed agriculture.","ko":"또 다른 큰 문제는 시간이 지나면 중국 농업이 관개에 크게 의존하게 될 것이었지만, 상나라 사회는 빗물만 이용하는 농업에 의존했다는 점이다."},{"n":6,"en":"Irrigation, and particularly centrally managed irrigation, would not arrive in China until considerably later.","ko":"관개, 그리고 특히 중앙에서 관리하는 관개는 상당히 늦게야 중국에 도달하게 될 것이었다."},{"n":7,"en":"Even then, irrigation would be practiced predominantly in southern China where the most important crop was rice.","ko":"심지어 그때도 관개는 가장 중요한 작물이 쌀인 중국 남부에서 주로 시행될 터였다."}],"easy_story":"Wittfogel은 물을 중앙에서 관리해야 하는 사회가 독재로 향한다고 주장했습니다. 하지만 글은 물을 지역에서 나누어 관리한 사례와, 옛 상나라가 관개가 아닌 빗물 농업을 했다는 점을 듭니다. 이 두 근거 때문에 ‘물 관리가 필요하면 반드시 중앙집권·독재가 된다’고 단정하기 어렵습니다.","core":"물을 중앙에서 다루는 사회가 독재로 간다는 Wittfogel의 주장은, 분권 사례와 상나라의 실제 농업 앞에서 흔들린다.","flow":[{"label":"배경","sentences":"S1-2","text":"1957년 Wittfogel은 물을 중앙에서 다루는 사회가 독재로 기운다고 주장했다","refs":[1,2]},{"label":"전환","sentences":"S3","text":"그 전제에 많은 비판이 따랐다","refs":[3]},{"label":"반론 ①","sentences":"S4","text":"분권 방식으로도 관개가 관리되어 왔다 — Ostrom의 자치 사례","refs":[4]},{"label":"반론 ②","sentences":"S5-6","text":"상나라는 빗물 농업이었고 관개는 한참 뒤에야 왔다","refs":[5,6]},{"label":"맺음","sentences":"S7","text":"그마저도 쌀농사 지역인 남부에 치우쳐 시행되었다","refs":[7]}],"structure":[{"title":"Wittfogel의 주장","text":"물 공급·홍수 통제를 중앙에서 맡는 사회는 독재로 향한다"},{"title":"비판","text":"분권으로도 관개는 굴러갔고, 상나라는 애초에 빗물 농업이었다"}],"key_sentence_en":"Wittfogel's claim that centrally managed water leads to autocracy is weakened by decentralized irrigation and by the rain-fed farming of the Shang.","blocking_vocab":[{"word":"irrigation","meaning":"관개"},{"word":"central","meaning":"중앙의"},{"word":"decentralized","meaning":"분권적인"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["물을 중앙에서 다루는 사회가 독재로 간다는 Wittfogel의 주장은, 분권 사례와 상나라의 실제 농업 앞에서 흔들린다.","상나라가 처음부터 중앙 관개에 의존했다는 것이 저자의 근거다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[7]},{"type":"근거","q":"S4에서 확인할 수 있는 내용은?","choices":["1957년 Wittfogel은 물을 중앙에서 다루는 사회가 독재로 기운다고 주장했다","분권 방식으로도 관개가 관리되어 왔다 — Ostrom의 자치 사례"],"answer":1,"why":"S4의 영어 원문을 다시 확인하세요.","refs":[4]},{"type":"변형 탐지","q":"S6의 원문 문장을 고르세요.","choices":["Irrigation, and particularly centrally managed irrigation, had already arrived in China until considerably later.","Irrigation, and particularly centrally managed irrigation, would not arrive in China until considerably later."],"answer":1,"why":"원문 표현은 “would not arrive”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[6]}],"diagram":{"kind":"branch","title":"물 관리와 독재: 주장과 반례","items":[{"head":"Wittfogel","body":"중앙 물 관리 → 독재 경향이라는 주장","refs":[1,2,3]},{"head":"반례 1","body":"분권적으로 관개를 관리한 사회가 있다","refs":[4]},{"head":"반례 2","body":"상나라는 빗물 농업, 관개는 나중에 등장","refs":[5,6,7]}],"takeaway":"물 관리가 반드시 중앙 통제와 독재를 요구한다는 전제는 흔들린다."}}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){
 const node=x=>`<div class="dm-node"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></div>`;
 const cards=d.items.map(node);
 let visual='';
 if(d.kind==='matrix') visual=`<div class="dm-matrix">${cards.join('')}</div>`;
 else if(d.kind==='branch') visual=`<div class="dm-root">${cards[0]}</div><div class="dm-fork">${cards.slice(1,d.items.length===4?3:undefined).join('')}</div>${d.items.length===4?`<div class="dm-condition">${cards[3]}</div>`:''}`;
 else if(d.kind==='compare') visual=`<div class="dm-compare">${cards.slice(0,2).join('<span class="dm-versus" aria-hidden="true">↔</span>')}</div>${cards.length>2?`<div class="dm-implication">${cards.slice(2).join('')}</div>`:''}`;
 else if(d.kind==='layers') visual=`<div class="dm-layers">${cards.join('')}</div>`;
 else if(d.kind==='cycle') visual=`<div class="dm-cycle">${cards.join('<span class="dm-arrow" aria-hidden="true">→</span>')}</div><p class="dm-loop">↶ 다시 처음으로</p>`;
 else visual=`<div class="dm-sequence">${cards.join('<span class="dm-arrow" aria-hidden="true">→</span>')}</div>`;
 return `<div class="diagram dm-diagram dm-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3>${visual}<p class="dm-conclusion">${esc(d.takeaway)}</p></div>`;
}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 동명고2 올림포스 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button><p class="translation">${esc(s.ko)}</p></div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section ${prediction?'has-prediction':''}" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}<button type="button" class="read-next dm-to-reading" data-stage="stage-2">영어 원문 읽기 →</button>${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${p.image&&p.diagram?`<div class="dm-after-map">${renderDiagram(p.diagram,false)}</div>`:''}${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

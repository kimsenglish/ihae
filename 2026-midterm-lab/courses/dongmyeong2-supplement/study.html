px;cursor:pointer}.choice:has(input:checked){border-color:var(--green);background:#e8f3e8}.choice input{accent-color:var(--green);margin-right:8px}.answerline{display:none;margin-top:13px;padding:13px;background:#e7f2e9;border-radius:11px}.answerline.show{display:block}.vocab{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}.vocab span{background:#fff2d9;border-radius:100px;padding:6px 10px;font-size:13px}.vocab b{color:var(--green)}.sentence{display:grid;grid-template-columns:35px 1fr;gap:8px;border-top:1px solid var(--line);padding:17px 0}.sentence:first-child{border-top:0}.num{font-weight:900;color:var(--green)}.en{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.5}.translation{display:none;background:#eff4ee;border-radius:9px;padding:11px 13px;margin:10px 0 0}.translation.show{display:block}.reveal{border:1px solid #bad5c7;background:white;border-radius:8px;color:var(--green);font-size:12px;font-weight:850;padding:5px 10px;margin-top:9px}.core{font-size:20px;font-weight:850;background:#e5f1e9;border-left:5px solid var(--green);padding:16px 18px;border-radius:0 12px 12px 0}.structure{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0 22px}.structure div{border:1px solid var(--line);padding:15px;border-radius:12px;background:#faf8f3}.structure b{display:block;color:var(--green)}.flow{display:grid;gap:8px}.flow button{text-align:left;border:1px solid var(--line);background:#faf8f3;padding:14px 16px;border-radius:12px;width:100%;color:var(--ink)}.flow button:hover{border-color:var(--green)}.flow b{color:var(--green);margin-right:9px}.flow small{color:#a76823;font-weight:850}.flow p{margin:5px 0}.evidence{display:none;margin-top:10px;background:white;padding:10px;border-radius:8px;font-family:Georgia,serif}.evidence.show{display:block}.evidence p{font-size:14px}.quiz{border-top:1px solid var(--line);padding:17px 0}.quiz:first-child{border-top:0}.qtype{font-size:12px;font-weight:900;color:#a36b28}.feedback{min-height:20px;font-size:14px;font-weight:750}.quiz .evidence{background:#fff3d7}.final{background:var(--ink);color:white;padding:18px;border-radius:14px;margin-top:18px}.final button{background:var(--gold);border:0;border-radius:9px;padding:9px 13px;font-weight:900}.final p{display:none;margin:12px 0 0}.final p.show{display:block}.next{display:block;margin-top:20px;color:var(--green);font-weight:900;text-align:right}.quiet{font-size:13px;color:var(--muted)}@media(max-width:700px){main{padding:13px 13px 70px}.topnav a,.topnav button{padding:8px;font-size:11px}.steps a{font-size:10px;padding:10px 2px}.visual{grid-template-columns:1fr}.structure{grid-template-columns:1fr}.en{font-size:17px}.section{margin:14px 0}}

.diagram{background:#f0f6ef;border:1px solid #c9ddce;border-radius:16px;padding:16px;min-width:0}
.diagram h3{margin:0 0 12px;font-size:17px;color:var(--green)}.visual:has(.diagram){align-items:start}
.diagram-items{display:grid;gap:8px}.diagram-compare .diagram-items{grid-template-columns:repeat(2,minmax(0,1fr))}
.diagram-card{background:white;border:1px solid #d2dfd4;border-radius:12px;padding:12px;min-width:0}
.diagram-card b{display:block;color:var(--green);font-size:14px}.diagram-card p{margin:5px 0;font-size:13px;line-height:1.5}
.diagram-card small{color:#986b2f;font-size:11px}.diagram-takeaway{border-top:1px solid #c9ddce;padding-top:9px;margin:10px 0 0;font-size:13px;font-weight:800}
.diagram-steps .diagram-card:not(:last-child):after{content:'↓';display:block;text-align:center;color:var(--green);font-weight:900;line-height:8px;margin:8px -12px -12px}
.easy-story{margin-top:22px;max-width:760px;border-top:2px solid #b8d4c3;padding:17px 2px 0}
.easy-story h3{margin:0 0 10px;color:#14543f;font-size:16px}.story-steps{list-style:none;counter-reset:story;margin:0;padding:0;display:grid;gap:8px}.story-steps li{counter-increment:story;display:grid;grid-template-columns:27px 1fr;gap:9px;align-items:start;font-size:16px;line-height:1.7}.story-steps li::before{content:counter(story);display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#daf0e2;color:#14543f;font-size:12px;font-weight:900;margin-top:2px}

.diagram{overflow:hidden}
.diagram-items{counter-reset:visual-step}
.diagram-card{box-shadow:0 2px 0 rgba(13,76,57,.04)}
.diagram-card b{line-height:1.35}
.diagram-card small{font-variant-numeric:tabular-nums}
/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items,.diagram.diagram-argument .diagram-items,
.diagram.diagram-steps-possible .diagram-items,.diagram.diagram-case-advice .diagram-items,
.diagram.diagram-steps-response .diagram-items,.diagram.diagram-cause-response .diagram-items,
.diagram.diagram-compare-open .diagram-items{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;
  border-left:3px solid #68aa91;margin-left:14px;padding-left:25px}
.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card,.diagram.diagram-argument .diagram-card,
.diagram.diagram-steps-possible .diagram-card,.diagram.diagram-case-advice .diagram-card,
.diagram.diagram-steps-response .diagram-card,.diagram.diagram-cause-response .diagram-card,
.diagram.diagram-compare-open .diagram-card{position:relative;counter-increment:visual-step}
.diagram.diagram-steps .diagram-card:before,.diagram.diagram-timeline .diagram-card:before,
.diagram.diagram-cycle .diagram-card:before,.diagram.diagram-argument .diagram-card:before,
.diagram.diagram-steps-possible .diagram-card:before,.diagram.diagram-case-advice .diagram-card:before,
.diagram.diagram-steps-response .diagram-card:before,.diagram.diagram-cause-response .diagram-card:before,
.diagram.diagram-compare-open .diagram-card:before{content:counter(visual-step);position:absolute;left:-47px;top:10px;
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:#176b52;color:#fff;font-size:12px;font-weight:800;border:3px solid #f0f6ef}
.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-possible .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-case-advice .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-response .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cause-response .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-compare-open .diagram-items .diagram-card:not(:last-child):after{
  content:'↓';position:absolute;left:-39px;bottom:-26px;margin:0;padding:0 2px;
  color:#176b52;background:#f0f6ef;line-height:1.2;font-size:17px;font-weight:800}
.diagram.diagram-cycle .diagram-items:after{content:'↶ 반복되는 해석';font-size:12px;color:#176b52;
  font-weight:750;margin:-13px 0 0 4px}
/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.diagram.diagram-condition .diagram-card:first-child,.diagram.diagram-branches .diagram-card:first-child{
  grid-column:1/-1;background:#dceee5;border-color:#82baa2;position:relative}
.diagram.diagram-condition .diagram-card:first-child:after,.diagram.diagram-branches .diagram-card:first-child:after{
  content:'↙                 ↘';position:absolute;bottom:-25px;left:0;right:0;text-align:center;
  color:#176b52;font-size:18px;font-weight:900;white-space:pre}
.diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.diagram.diagram-compare .diagram-card,.diagram.diagram-cases .diagram-card{
  border-top:5px solid #1b795c;background:linear-gradient(180deg,#f9fffb,#fff 48%)}
.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}
.diagram.diagram-web .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-web .diagram-card{border-radius:20px;border:2px solid #a4cab4;text-align:center}
.diagram.diagram-web .diagram-card:first-child{grid-column:1/-1;justify-self:center;width:min(100%,360px);
  background:#dceee5;border-color:#498f6e;border-radius:100px;position:relative}
.diagram.diagram-web .diagram-card:first-child:after{content:'↙                         ↘';
  position:absolute;left:0;right:0;bottom:-28px;color:#176b52;font-weight:900;white-space:pre}
.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;padding-top:23px}
.diagram.diagram-dose .diagram-items:before{content:'';position:absolute;top:10px;left:10%;right:10%;height:5px;
  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}
.diagram.diagram-dose .diagram-card:before{content:'';position:absolute;top:-23px;left:calc(50% - 7px);
  width:14px;height:14px;border-radius:50%;background:#176b52;border:3px solid #f0f6ef}
.diagram.diagram-dose .diagram-card:nth-child(2){background:#dceee5;border-color:#82baa2}
.diagram.diagram-dose .diagram-card b{font-size:18px}
/* Cooking: familiar side benefits are distinct from the source's energy-to-adaptation claim. */
.diagram.diagram-energy-route .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px}
.diagram.diagram-energy-route .diagram-card{position:relative;min-width:0;border-top:5px solid #237c5c;padding-top:35px;background:#fffdf8}
.diagram.diagram-energy-route .diagram-card:first-child{grid-column:1/-1;border:1px dashed #a9b8ad;background:#f8faf6;padding:10px 14px}
.diagram.diagram-energy-route .diagram-card:first-child:before{content:'먼저 떠오르는 장점';display:block;color:#65766b;font-size:11px;font-weight:800;margin-bottom:3px}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}
.diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'→';position:absolute;right:-19px;top:calc(50% - 16px);color:#176b52;font-size:26px;font-weight:900;z-index:1}
.diagram.diagram-energy-route .diagram-card:nth-child(2){background:#e5f4e9}.diagram.diagram-energy-route .diagram-card:nth-child(4){background:#fff2d9;border-top-color:#b78539}
/* Three alternative survival responses, not three consecutive steps. */
.diagram.diagram-reaction-options .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 10px}
.diagram.diagram-reaction-options .diagram-card:first-child{grid-column:1/-1;text-align:center;background:#dceee5;border:2px solid #82baa2;position:relative}
.diagram.diagram-reaction-options .diagram-card:first-child:after{content:'↙    ↓    ↘';position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:#176b52;font-weight:900;font-size:21px;white-space:pre}
.diagram.diagram-reaction-options .diagram-card:not(:first-child){text-align:center;border-top:5px solid #247b5b}
.diagram.diagram-reaction-options .diagram-card:not(:first-child) b{font-size:20px}
.diagram.diagram-reaction-options .diagram-card:not(:first-child):before{display:block;font-size:27px;line-height:1;margin-bottom:8px;color:#176b52}
.diagram.diagram-reaction-options .diagram-card:nth-child(2):before{content:'⏸'}.diagram.diagram-reaction-options .diagram-card:nth-child(3):before{content:'➜'}.diagram.diagram-reaction-options .diagram-card:nth-child(4):before{content:'↗'}
.diagram.diagram-reaction-options .diagram-takeaway{background:#fff2d9;border:0;border-radius:10px;padding:12px}
/* The first pass shows only the visual map; stage 3 restores the evidence. */
.diagram.is-overview .diagram-card p,.diagram.is-overview .diagram-card small{display:none}
.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}
.diagram.is-overview .diagram-card b{font-size:15px}
.diagram.is-overview .diagram-takeaway{display:block;background:#dceee5;border:0;border-radius:11px;
  margin-top:14px;padding:10px 12px;text-align:center;color:#14543f}
/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}
.diagram.diagram-dialogue .diagram-card:before{content:'●';position:absolute;left:14px;top:13px;
  color:#176b52;font-size:24px;line-height:1}
.diagram.diagram-dialogue .diagram-card:after{content:'';position:absolute;left:12px;top:42px;
  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}
.diagram.diagram-dialogue .diagram-card:nth-child(2){background:#fff7e9;border-color:#c78f4b}
.diagram.diagram-dialogue .diagram-card:nth-child(2):before{color:#a96e2c}
.diagram.diagram-dialogue .diagram-card:nth-child(2):after{background:#a96e2c}
.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}
/* A claim supported by parallel examples ends in one explicit conclusion. */
.diagram.diagram-examples-conclusion .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}
.diagram.diagram-examples-conclusion .diagram-card:first-child{background:#e1efe7;border:2px solid #76ad91;text-align:center}
.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(-n+2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(-n+2){border-top:5px solid #1b795c}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Analogy maps one domain to another, followed by a concrete example. */
.diagram.diagram-analogy .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-analogy .diagram-card:nth-child(1){border-top:5px solid #1b795c}
.diagram.diagram-analogy .diagram-card:nth-child(2){border-top:5px solid #bd8141}
.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Three roles are simultaneous parts of one contrast, not a causal sequence. */
.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diagram.diagram-roles-contrast .diagram-card{border-top:5px solid #1b795c}
.diagram.diagram-roles-contrast .diagram-card:nth-child(2){border-top-color:#b25745}
.diagram.diagram-roles-contrast .diagram-card:nth-child(3){border-top-color:#bd8141}
@media(max-width:650px){
 .diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items,
 .diagram.diagram-dialogue .diagram-items,
 .diagram.diagram-web .diagram-items,
 .diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items,

 .diagram.diagram-examples-conclusion .diagram-items,
 .diagram.diagram-compare-conclusion .diagram-items,
 .diagram.diagram-compare-explanation .diagram-items,
 .diagram.diagram-analogy .diagram-items,
 .diagram.diagram-roles-contrast .diagram-items{grid-template-columns:minmax(0,1fr)}
 .diagram.diagram-examples-conclusion .diagram-card:first-child,
 .diagram.diagram-examples-conclusion .diagram-card:last-child,
 .diagram.diagram-compare-conclusion .diagram-card:last-child,

 .diagram.diagram-analogy .diagram-card:last-child{grid-column:auto}

<script id="course-data" type="application/json">{"course":"동명고2 올림포스 9대 변별유형","units":[{"id":"ch3","label":"Chapter 3 · QN31~34","scope":"p76~89 · 12지문","passages":[{"id":"ch3-01","title":"1. p76-기출 예제 01","lead":"소비의 중심이 이동한다","sentences":[{"n":1,"en":"People have always needed to eat, and they always will.","ko":"사람들은 항상 먹을 것이 필요했으며, 또 항상 그럴 것이다."},{"n":2,"en":"Rising emphasis on self-expression values does not put an end to material desires.","ko":"자기표현 가치에 관한 늘어나는 강조가 물질적 욕구를 끝내지는 않는다."},{"n":3,"en":"But prevailing economic orientations are gradually being reshaped.","ko":"하지만 우세한 경제적 방향성이 서서히 재형성되고 있다."},{"n":4,"en":"People who work in the knowledge sector continue to seek high salaries, but they place equal or greater emphasis on doing stimulating work and being able to follow their own time schedules.","ko":"지식 부문에서 일하는 사람들은 계속 높은 급료를 추구하지만, 그들은 (아주 흥미로워) 자극이 되는 일을 하는 것과 그들 자신의 시간 계획을 따르는 것에 동등한 또는 더 큰 중점을 둔다."},{"n":5,"en":"Consumption is becoming progressively less determined by the need for sustenance and the practical use of the goods consumed.","ko":"소비는 점진적으로 생존에 대한 필요와 소비되는 재화의 실용적 사용에 의해 덜 결정된다."},{"n":6,"en":"People still eat, but a growing component of food's value is determined by its nonmaterial aspects.","ko":"사람들은 여전히 먹지만, 음식 가치의 증가하는 구성 요소가 그것의 비물질적인 측면에 의해 결정된다."},{"n":7,"en":"People pay a premium to eat exotic cuisines that provide an interesting experience or that symbolize a distinctive life-style.","ko":"사람들은 흥미로운 경험을 제공하거나 독특한 생활 방식을 상징하는 이국적인 요리를 먹고자 할증금을 낸다."},{"n":8,"en":"The publics of postindustrial societies place growing emphasis on \"political consumerism,\" such as boycotting goods whose production violates ecological or ethical standards.","ko":"탈공업화 사회의 대중은 생산이 생태적 또는 윤리적 기준을 위반하는 상품의 구매를 거부하는 것과 같은 '정치적 소비주의'에 점점 더 많은 중점을 둔다."},{"n":9,"en":"Consumption is less and less a matter of sustenance and more and more a question of life-style ― and choice.","ko":"소비는 점점 덜 생존의 문제이며 점점 더 생활 방식, 그리고 선택의 문제이다."}],"easy_story":"먹고사는 데 필요한 물건은 지금도 중요합니다. 글은 그런 필요가 사라졌다고 말하지 않습니다. 하지만 사람들은 돈만이 아니라 일의 재미와 시간의 자유를 따지고, 상품을 살 때 맛이나 윤리도 살핍니다. 그래서 소비가 점점 생존만의 문제가 아니라 어떤 생활을 선택할지의 문제가 된다는 뜻입니다.","core":"탈공업화 사회에서 소비는 생존의 문제에서 생활 방식과 선택의 문제로 옮겨 가고 있다.","flow":[{"label":"전제","sentences":"S1-2","text":"먹을 것은 늘 필요하고 자기표현 가치가 물질적 욕구를 없애지는 않는다","refs":[1,2]},{"label":"전환","sentences":"S3","text":"그러나 우세한 경제적 방향성이 서서히 다시 짜이고 있다","refs":[3]},{"label":"근거","sentences":"S4-5","text":"지식 노동자는 높은 급료만큼 자극적인 일과 시간의 자유를 중시한다","refs":[4,5]},{"label":"예시","sentences":"S6-8","text":"이국적 요리에 할증금을 내고 윤리에 어긋난 상품은 사지 않는다","refs":[6,7,8]},{"label":"결론","sentences":"S9","text":"소비는 점점 덜 생존의 문제이고 점점 더 생활 방식과 선택의 문제다","refs":[9]}],"structure":[{"title":"생존으로서의 소비","text":"먹고 쓰기 위한 실용적 필요가 소비를 결정한다"},{"title":"생활 방식으로서의 소비","text":"경험·상징·윤리 같은 비물질적 측면이 값과 선택을 정한다"}],"key_sentence_en":"As societies become postindustrial, consumption is driven less by sustenance than by nonmaterial values and life-style choice.","blocking_vocab":[{"word":"sustenance","meaning":"생존·생계"},{"word":"self-expression","meaning":"자기표현"},{"word":"ethical","meaning":"윤리적인"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["탈공업화 사회에서 소비는 생존의 문제에서 생활 방식과 선택의 문제로 옮겨 가고 있다.","물질적 필요가 완전히 사라져 소비가 중단되었다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[9]},{"type":"근거","q":"S4-5에서 확인할 수 있는 내용은?","choices":["지식 노동자는 높은 급료만큼 자극적인 일과 시간의 자유를 중시한다","먹을 것은 늘 필요하고 자기표현 가치가 물질적 욕구를 없애지는 않는다"],"answer":0,"why":"S4-5의 영어 원문을 다시 확인하세요.","refs":[4,5]},{"type":"변형 탐지","q":"S3의 원문 문장을 고르세요.","choices":["But prevailing economic orientations are suddenly being reshaped.","But prevailing economic orientations are gradually being reshaped."],"answer":1,"why":"원문 표현은 “gradually”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[3]}],"diagram":{"kind":"shift","title":"소비의 중심이 이동한다","items":[{"head":"생존·실용","body":"먹고 쓰는 데 필요한 가치","refs":[1,2,5]},{"head":"자기표현","body":"일의 자극·시간 선택, 이국적 음식","refs":[4,6,7]},{"head":"윤리적 선택","body":"생산 방식까지 살펴 구매를 거부","refs":[8]}],"takeaway":"필요가 사라진 것은 아니다. 소비의 무게중심이 생활 방식과 선택으로 옮겨 간다."}},{"id":"ch3-02","title":"2. p78-기출 예제 02","lead":"내가 바꿀 수 있는가?","sentences":[{"n":1,"en":"Epictetus wrote, \"A man's master is he who is able to confirm or remove whatever that man seeks or shuns.\"","ko":"Epictetus는 \"사람의 주인은 그 사람이 추구하거나 피하는 것 무엇이든지를 확인하거나 제거할 수 있는 사람이다.\"라고 썼다."},{"n":2,"en":"If you depend on no one except yourself to satisfy your desires, you will have no master other than yourself and you will be free.","ko":"만일 여러분이 자신의 욕망을 만족시키기 위해 여러분 자신 외에 누구에게도 의존하지 않는다면, 여러분은 여러분 자신 외에 주인이 없을 것이고 여러분은 자유로울 것이다."},{"n":3,"en":"Stoic philosophy was about that ― taking charge of your life, learning to work on those things that are within your power to accomplish or change and not to waste energy on things you cannot.","ko":"스토아 철학은 여러분의 삶을 책임지고, 성취하거나 변화하기 위해 여러분의 힘 안에 있는 것들에 노력하는 것과 여러분이 할 수 없는 것들에 에너지를 낭비하지 않는 것을 배우는 것에 관한 것이었다."},{"n":4,"en":"In particular, the Stoics warned against reacting emotionally to what is outside your control.","ko":"특히, 스토아 학파는 여러분의 통제 밖에 있는 것에 대해 감정적으로 반응하는 것에 대해 경고했다."},{"n":5,"en":"Often, Epictetus argued, it's not our circumstances that get us down but rather the judgments we make about them.","ko":"흔히, Epictetus는 우리를 낙담시키는 것은 우리의 상황이 아니라 오히려 그것들에 대해 우리가 내리는 판단이라고 주장했다."},{"n":6,"en":"Consider anger.","ko":"분노를 생각해보라."},{"n":7,"en":"We don't get angry at the rain if it spoils our picnic.","ko":"우리는 비가 우리의 소풍을 망친다 해도, 그것에 화가 나지 않는다."},{"n":8,"en":"That would be silly because we can't do anything about the rain.","ko":"그것은 어리석은 짓인데, 우리가 비에 대해 아무것도 할 수 없기 때문이다."},{"n":9,"en":"But we often do get angry if someone mistreats us.","ko":"하지만 우리는 누군가가 우리를 나쁘게 대한다면 흔히 정말 화가 난다."},{"n":10,"en":"We usually can't control or change that person any more than we can stop the rain, so that is equally silly.","ko":"우리가 비를 멈출 수 없는 것처럼 우리는 대개 그 사람을 통제하거나 바꿀 수도 없으므로, 그것은 마찬가지로 어리석다."},{"n":11,"en":"More generally, it is just as pointless to tie our feelings of well-being to altering another individual's behavior as it is to tie them to the weather.","ko":"더 일반적으로, 우리의 안녕에 관한 감정을 다른 개인의 행동을 바꾸는 것에 연결하는 것은, 그것들을 날씨에 연결하는 것만큼이나 무의미하다."},{"n":12,"en":"Epictetus wrote, \"If it concerns anything not in our control, be prepared to say that it is nothing to you.\"","ko":"Epictetus는 \"만약 그것이 우리의 통제 안에 있지 않은 것과 관련이 있다면, 그것은 당신에게 아무것도 아니라고 말할 준비를 하라.\"고 썼다."}],"easy_story":"비가 오는 것을 내 마음대로 바꿀 수 없듯이, 다른 사람이 어떻게 행동할지도 완전히 통제할 수 없습니다. 그런데 우리는 비보다 다른 사람에게 더 화를 내곤 합니다. 스토아 철학은 그 일을 보는 내 판단을 돌아보라고 합니다. 내가 할 수 있는 일에는 힘을 쓰되, 남의 행동에 내 행복을 전부 걸지 말라는 이야기입니다.","core":"스토아 철학은 통제 밖의 일에 감정으로 반응하지 말라 하며, 남의 행동에 안녕을 매는 것은 날씨에 매는 것과 같다고 본다.","flow":[{"label":"인용","sentences":"S1-2","text":"남에게 의존하지 않으면 주인은 자신뿐이고 자유롭다","refs":[1,2]},{"label":"원칙","sentences":"S3-4","text":"힘 안의 일에 애쓰고 통제 밖의 것에 감정으로 반응하지 말라","refs":[3,4]},{"label":"전환","sentences":"S5","text":"우리를 낙담시키는 것은 상황이 아니라 그에 대한 판단이다","refs":[5]},{"label":"예시","sentences":"S6-10","text":"비에는 화내지 않으면서 사람에게는 화내지만 둘 다 못 바꾸긴 마찬가지다","refs":[6,7,8,9,10]},{"label":"결론","sentences":"S11-12","text":"남의 행동에 안녕을 매는 일은 날씨에 매는 것만큼 무의미하다","refs":[11,12]}],"structure":[{"title":"통제 안의 것","text":"내 판단과 노력 — 여기에 힘을 쓰면 스스로의 주인이 된다"},{"title":"통제 밖의 것","text":"날씨와 남의 행동 — 감정으로 반응해 봐야 어리석을 뿐이다"}],"key_sentence_en":"Stoic philosophy urges us not to react emotionally to what lies outside our control, since tying our well-being to what we cannot change is as pointless as tying it to the weather.","blocking_vocab":[{"word":"control","meaning":"통제"},{"word":"Stoic","meaning":"스토아 철학의"},{"word":"anger","meaning":"분노"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["스토아 철학은 통제 밖의 일에 감정으로 반응하지 말라 하며, 남의 행동에 안녕을 매는 것은 날씨에 매는 것과 같다고 본다.","남의 행동을 바꾸려는 분노가 자유로 가는 핵심 방법이다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[11,12]},{"type":"근거","q":"S5에서 확인할 수 있는 내용은?","choices":["우리를 낙담시키는 것은 상황이 아니라 그에 대한 판단이다","남에게 의존하지 않으면 주인은 자신뿐이고 자유롭다"],"answer":0,"why":"S5의 영어 원문을 다시 확인하세요.","refs":[5]},{"type":"변형 탐지","q":"S7의 원문 문장을 고르세요.","choices":["We get angry at the rain if it spoils our picnic.","We don't get angry at the rain if it spoils our picnic."],"answer":1,"why":"원문 표현은 “don't get angry”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[7]}],"diagram":{"kind":"branch","title":"내가 바꿀 수 있는가?","items":[{"head":"판단 기준","body":"나의 힘 안에 있는 일인가","refs":[3,4]},{"head":"통제 가능","body":"내 행동과 판단에 힘을 쓴다","refs":[2,3,5]},{"head":"통제 불가","body":"비나 남의 행동에 안녕을 맡기지 않는다","refs":[7,9,11,12]}],"takeaway":"상황 자체보다 상황에 대한 판단과 반응이 중요하다."}},{"id":"ch3-03","title":"3. p80-no.01","lead":"집은 그대로인데 행복이 흔들린다","sentences":[{"n":1,"en":"Imagine you've bought a nice piece of land and built a house.","ko":"멋진 땅을 사서 집을 지었다고 상상해 보라."},{"n":2,"en":"The house is magnificent, with at least three more bedrooms than you need.","ko":"그 집은 여러분이 필요한 것보다 침실이 적어도 3개 더 있는 멋진 집이다."},{"n":3,"en":"One year later, somebody else buys the neighboring plot and constructs a house so luxurious it makes yours look like a garden shed.","ko":"1년 후, 다른 어떤 사람이 옆에 있는 땅을 사서 여러분의 집이 정원의 헛간처럼 보이게 할 정도로 아주 호화로운 집을 짓는다."},{"n":4,"en":"What happens?","ko":"무슨 일이 일어날까?"},{"n":5,"en":"Your blood pressure rises and your life satisfaction drops ─ even though you're still living very well.","ko":"여러분은 혈압이 오르고 삶의 만족도가 떨어지는데 ─ 비록 여전히 아주 잘 살고 있다 하더라도 그렇다."},{"n":6,"en":"Money is relative.","ko":"돈은 상대적이다."},{"n":7,"en":"Not just in comparison to others, but in comparison to your past.","ko":"다른 사람과의 비교뿐만 아니라 자신의 과거와 비교해서도 그러하다."},{"n":8,"en":"If you earned $50,000 per year during the first half of your career and today you earn $75,000, you'll be happier than if you first earned $75,000 and now earn just $60,000.","ko":"경력 전반기에 연간 5만 달러를 벌었고 현재 7만 5천 달러를 벌고 있다면, 처음에 7만 5천 달러를 벌다가 지금은 6만 달러만 버는 경우보다 더 행복할 것이다."},{"n":9,"en":"This is despite the fact that, averaging the figures, you come out better off overall in the second scenario.","ko":"이는 수치의 평균을 내면 두 번째 시나리오에서 전반적으로 더 나은 결과를 얻을 수 있다는 사실에도 불구하고 그렇다."},{"n":10,"en":"Simply put, your level of wealth ─ above the poverty line ─ is primarily a matter of interpretation.","ko":"간단히 말해, 재산 수준은, 빈곤선 이상인 경우, 주로 해석의 문제이다."},{"n":11,"en":"But this is good news; it means it's up to you whether money makes you happy or not.","ko":"하지만 이것은 좋은 소식이다; 그것의 의미는 돈이 여러분을 행복하게 만들지의 여부가 여러분에게 달려 있다는 것이다."}],"easy_story":"멋진 집에 살다가 더 큰 이웃집을 보면, 내 집은 그대로인데도 덜 만족스러울 수 있습니다. 돈의 액수만 보는 게 아니라 남의 형편이나 예전의 내 형편과 비교하기 때문입니다. 글은 기본적인 빈곤선을 넘은 뒤에는 이런 비교와 해석이 행복에 영향을 준다고 말합니다.","core":"빈곤선을 넘으면 재산 수준은 남과 과거에 견주는 해석의 문제이며 행복 여부는 자신에게 달렸다.","flow":[{"label":"예화","sentences":"S1-3","text":"멋진 집을 지었는데 이웃이 더 호화로운 집을 세운다","refs":[1,2,3]},{"label":"결과","sentences":"S4-5","text":"여전히 잘 사는데도 혈압이 오르고 삶의 만족도가 떨어진다","refs":[4,5]},{"label":"주제","sentences":"S6-7","text":"돈은 상대적이며 남뿐 아니라 자신의 과거와도 견주어진다","refs":[6,7]},{"label":"근거","sentences":"S8-9","text":"오르는 소득이 평균이 더 높은 내리막 소득보다 행복하게 한다","refs":[8,9]},{"label":"결론","sentences":"S10-11","text":"빈곤선 위에서는 해석의 문제이니 행복 여부는 자신에게 달렸다","refs":[10,11]}],"structure":[{"title":"원인 — 비교","text":"이웃의 집, 그리고 자신의 지난 소득과 견주게 된다"},{"title":"결과 — 만족의 변동","text":"실제 형편이 나아도 만족이 떨어지고, 총액이 적어도 오르막이면 더 행복하다"}],"key_sentence_en":"Above the poverty line, your level of wealth is relative to others and to your own past, so whether money makes you happy is primarily a matter of interpretation.","blocking_vocab":[{"word":"relative","meaning":"상대적인"},{"word":"satisfaction","meaning":"만족"},{"word":"poverty line","meaning":"빈곤선"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["빈곤선을 넘으면 재산 수준은 남과 과거에 견주는 해석의 문제이며 행복 여부는 자신에게 달렸다.","빈곤선 위에서는 돈의 절대액만으로 행복이 결정된다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[10,11]},{"type":"근거","q":"S6-7에서 확인할 수 있는 내용은?","choices":["돈은 상대적이며 남뿐 아니라 자신의 과거와도 견주어진다","멋진 집을 지었는데 이웃이 더 호화로운 집을 세운다"],"answer":0,"why":"S6-7의 영어 원문을 다시 확인하세요.","refs":[6,7]},{"type":"변형 탐지","q":"S6의 원문 문장을 고르세요.","choices":["Money is absolute.","Money is relative."],"answer":1,"why":"원문 표현은 “relative”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[6]}],"diagram":{"kind":"compare","title":"집은 그대로인데 행복이 흔들린다","items":[{"head":"내 집","body":"멋진 집을 지어 생활은 나아졌다","refs":[1,2]},{"head":"이웃의 집","body":"더 큰 집을 본 뒤 만족도가 떨어진다","refs":[3,4,5]},{"head":"비교의 기준","body":"남뿐 아니라 자신의 과거 소득에도 견준다","refs":[6,7,8,9]}],"takeaway":"빈곤선을 넘은 뒤의 행복은 재산의 절대량보다 해석과 비교에 좌우된다."}},{"id":"ch3-04","title":"4. p81-no.02","lead":"같이 배워도 사용 환경이 다르다","sentences":[{"n":1,"en":"All learning involves memory.","ko":"모든 학습은 기억을 수반한다."},{"n":2,"en":"But people are most likely to remember what they have used and maybe invented, not what they have had drilled into their heads.","ko":"하지만 사람들은 머릿속에 주입된 것이 아니라 자신이 사용하거나 어쩌면 만들어 냈던 것을 기억할 가능성이 가장 크다."},{"n":3,"en":"Marshall and Albert began learning French in the sixth grade, but six weeks into the fall semester, Albert's parents moved to Paris, taking the young boy and his sister with them.","ko":"Marshall과 Albert는 6학년 때 프랑스어를 배우기 시작했지만, 가을 학기가 시작되고 6주 후 Albert의 부모님은 그 어린 소년과 그의 여동생을 데리고 파리로 이사했다."},{"n":4,"en":"By the time he graduated from high school, Marshall had taken six years of French, memorizing vocabulary and usually acing the exams.","ko":"고등학교를 졸업했을 때, Marshall은 이미 6년 동안 프랑스어를 배웠으며 어휘를 암기하고 시험에서 대개 A를 받았다."},{"n":5,"en":"His parents drilled him, using all the sophisticated procedures of spaced repetition.","ko":"그의 부모님은 간격을 두고 반복하는 모든 정교한 절차를 사용하여 그를 훈련시켰다."},{"n":6,"en":"It doesn't take much imagination or insight, however, to guess which one of the two boys read, spoke, and wrote French with almost perfect fluency when they met for a reunion right before going off to college, and which one struggled to keep up with the chatter.","ko":"그러나 대학 진학 직전에 동창회를 위해 만났을 때 두 소년 중 누가 프랑스어를 거의 완벽하게 유창하게 읽고, 말하고, 썼는지, 그리고 누가 수다를 따라잡기 위해 애썼는지 추측하는 데는 많은 상상력이나 통찰력이 필요하지 않다."},{"n":7,"en":"People learn deeply by doing in authentic situations.","ko":"사람들은 진짜 상황에서 학습함으로써 깊이 학습한다."}],"easy_story":"두 사람이 프랑스어를 배웁니다. 한 사람은 파리에서 실제로 쓰고, 다른 사람은 오랫동안 외워 시험을 잘 봅니다. 동창회에서 말을 자연스럽게 하는 사람은 실제 상황에서 언어를 사용한 쪽입니다. 이 예시는 시험 점수와 별개로, 직접 써 본 경험이 오래 남고 깊은 배움으로 이어진다는 점을 보여 줍니다.","core":"사람은 머릿속에 주입된 것이 아니라 직접 써 본 것을 기억하므로 진짜 상황에서 해 봐야 깊이 배운다.","flow":[{"label":"원칙","sentences":"S1-2","text":"학습은 기억을 수반하지만 기억에 남는 것은 자신이 써 본 것이다","refs":[1,2]},{"label":"사례","sentences":"S3","text":"둘이 함께 프랑스어를 시작했으나 Albert 는 파리로 옮겨 갔다","refs":[3]},{"label":"대비","sentences":"S4-5","text":"Marshall 은 6년간 암기와 간격 반복으로 시험에서 A를 받았다","refs":[4,5]},{"label":"결과","sentences":"S6","text":"동창회에서 누가 유창했고 누가 따라가기 힘들었는지는 뻔하다","refs":[6]},{"label":"결론","sentences":"S7","text":"사람은 진짜 상황에서 해 봄으로써 깊이 배운다","refs":[7]}],"structure":[{"title":"Marshall — 주입식","text":"6년의 암기와 간격 반복, 시험 성적은 좋았으나 말이 안 나온다"},{"title":"Albert — 실제 상황","text":"파리에서 쓰며 익혀 거의 완벽하게 읽고 말하고 쓴다"}],"key_sentence_en":"People remember what they have used and invented rather than what has been drilled into their heads, so they learn deeply by doing in authentic situations.","blocking_vocab":[{"word":"authentic","meaning":"실제적인"},{"word":"memory","meaning":"기억"},{"word":"repetition","meaning":"반복"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["교실 시험 점수만 높으면 실제 언어 사용도 반드시 유창하다.","사람은 머릿속에 주입된 것이 아니라 직접 써 본 것을 기억하므로 진짜 상황에서 해 봐야 깊이 배운다."],"answer":1,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[7]},{"type":"근거","q":"S4-5에서 확인할 수 있는 내용은?","choices":["Marshall 은 6년간 암기와 간격 반복으로 시험에서 A를 받았다","학습은 기억을 수반하지만 기억에 남는 것은 자신이 써 본 것이다"],"answer":0,"why":"S4-5의 영어 원문을 다시 확인하세요.","refs":[4,5]},{"type":"변형 탐지","q":"S7의 원문 문장을 고르세요.","choices":["People learn deeply by doing in authentic situations.","People learn deeply by memorizing in authentic situations."],"answer":0,"why":"원문 표현은 “by doing”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[7]}],"diagram":{"kind":"compare","title":"같이 배워도 사용 환경이 다르다","items":[{"head":"Marshall","body":"교실에서 어휘를 외우고 시험에서 A","refs":[3,4,5]},{"head":"Albert","body":"파리에서 프랑스어를 실제로 사용","refs":[3,6]},{"head":"글의 결론","body":"진짜 상황에서 써 본 것이 깊이 남는다","refs":[1,2,7]}],"takeaway":"암기한 지식과 실제로 써 본 언어는 기억의 깊이가 다르다."}},{"id":"ch3-05","title":"5. p82-no.03","lead":"열이 나면 체감 시간이 달라진다","sentences":[{"n":1,"en":"Hudson Hoagland, an American doctor, had shown in the 1930s that the ability to 'count' time was temperature dependent.","ko":"미국의 의사 Hudson Hoagland는 1930년대에 시간을 '세는' 능력이 체온 의존적임을 입증했었다."},{"n":2,"en":"His wife was ill and had a very high fever, somewhere around 39'C.","ko":"그의 아내는 몸이 아팠고 대략 39'C 정도의 아주 높은 열이 났다."},{"n":3,"en":"Hoagland needed to go to the drugstore for some medication for her.","ko":"Hoagland는 아내를 위해 약국에 가서 약을 사 와야 했다."},{"n":4,"en":"When he got home his wife was quite upset with him for taking so long, claiming that he had been away for hours.","ko":"집에 돌아왔을 때 그의 아내는 그가 몇 시간 동안 자리를 비웠다고 주장하면서 그가 너무 오래 걸린 데 대해 상당히 화가 나 있었다."},{"n":5,"en":"In truth, his trip had only taken about 20 minutes.","ko":"사실 그가 갔다 온 시간은 20분 정도밖에 걸리지 않았다."},{"n":6,"en":"His wife's misperception interested Hoagland.","ko":"아내의 오해는 Hoagland의 관심을 끌었다."},{"n":7,"en":"Without telling her what he was thinking, he asked her to estimate the duration of a minute by counting to 60 at the rate of one number per second.","ko":"그는 아내에게 자신이 무슨 생각을 하고 있는지 말하지 않고 1초에 한 숫자씩 60까지 세면서 1분의 시간 길이를 추정해 달라고 부탁했다."},{"n":8,"en":"It turned out that his wife's estimate of a minute was only 30 seconds long.","ko":"아내가 추정한 1분은 30초에 불과했다는 것이 드러났다."},{"n":9,"en":"She did much better as her temperature fell.","ko":"체온이 떨어짐에 따라 그녀는 훨씬 더 잘 해냈다."},{"n":10,"en":"Her ability to time intervals obviously varied with temperature, so her interval timer worked in an entirely different way to a temperature-compensated circadian clock.","ko":"그녀가 시간 간격을 측정하는 능력은 온도에 따라 분명히 달랐으며, 그래서 그녀의 시간 간격 타이머는 온도로 보정된 체내 시계에 맞추어 완전히 다른 방식으로 작동했다."}],"easy_story":"고열이 난 아내는 남편이 잠깐 자리를 비웠는데도 아주 오래 기다렸다고 느꼈습니다. 60까지 세어 1분을 재게 하자, 아내가 느낀 1분은 실제로 약 30초였습니다. 열이 내려가면서 셈이 더 정확해진 것으로 보아, 이 글은 시간을 느끼는 속도가 체온에 따라 달라진다고 설명합니다.","core":"시간을 세는 능력은 체온에 달려 있어 고열이 나면 1분을 30초로 세게 된다.","flow":[{"label":"주장","sentences":"S1","text":"Hoagland 는 시간을 세는 능력이 체온에 달렸음을 1930년대에 보였다","refs":[1]},{"label":"발단","sentences":"S2-5","text":"고열이 난 아내가 20분을 몇 시간으로 느끼고 화를 냈다","refs":[2,3,4,5]},{"label":"실험","sentences":"S6-7","text":"생각을 숨긴 채 1초에 하나씩 60까지 세어 1분을 재게 했다","refs":[6,7]},{"label":"결과","sentences":"S8-9","text":"아내의 1분은 30초였고 체온이 내리자 훨씬 정확해졌다","refs":[8,9]},{"label":"결론","sentences":"S10","text":"시간 간격 타이머는 온도로 보정된 체내 시계와 전혀 다르게 작동한다","refs":[10]}],"structure":[{"title":"원인 — 높은 체온","text":"열이 오르면 몸속 시간 세기가 빨라진다"},{"title":"결과 — 늘어난 시간감","text":"1분을 30초로 세고 20분을 몇 시간처럼 느낀다"}],"key_sentence_en":"Hoagland showed that the ability to 'count' time is temperature dependent, since his feverish wife estimated a minute as only 30 seconds and did much better as her temperature fell.","blocking_vocab":[{"word":"temperature","meaning":"체온·온도"},{"word":"interval","meaning":"시간 간격"},{"word":"misperception","meaning":"잘못된 인식"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["시간을 세는 능력은 체온에 달려 있어 고열이 나면 1분을 30초로 세게 된다.","고열이 나도 시간 간격을 세는 능력은 일정하다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[10]},{"type":"근거","q":"S6-7에서 확인할 수 있는 내용은?","choices":["생각을 숨긴 채 1초에 하나씩 60까지 세어 1분을 재게 했다","Hoagland 는 시간을 세는 능력이 체온에 달렸음을 1930년대에 보였다"],"answer":0,"why":"S6-7의 영어 원문을 다시 확인하세요.","refs":[6,7]},{"type":"변형 탐지","q":"S9의 원문 문장을 고르세요.","choices":["She did much better as her temperature fell.","She did much better as her temperature rose."],"answer":0,"why":"원문 표현은 “temperature fell”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[9]}],"diagram":{"kind":"stages","title":"열이 나면 체감 시간이 달라진다","items":[{"head":"고열","body":"아내의 체온이 약 39도까지 올랐다","refs":[2]},{"head":"체감","body":"약국에 다녀온 20분을 몇 시간처럼 느꼈다","refs":[3,4,5]},{"head":"측정","body":"아내가 센 1분은 실제 약 30초였다","refs":[6,7,8]},{"head":"회복","body":"체온이 떨어지자 시간 추정이 정확해졌다","refs":[9,10]}],"takeaway":"체온 변화가 시간 간격을 세는 능력에 영향을 준다."}},{"id":"ch3-06","title":"6. p83-no.04","lead":"인정의 효과는 개인성에서 나온다","sentences":[{"n":1,"en":"When we ask people to tell us about the most meaningful recognition they've received, they consistently say that it's \"personal.\"","ko":"우리가 사람들에게 자신들이 받은 '가장 의미 있는 인정'에 관해 이야기해 달라고 부탁하면 그들은 한결같이 그것은 '개인적인' 것이라고 답한다."},{"n":2,"en":"They say that it feels special.","ko":"그들은 그것이 특별하게 느껴진다고 말한다."},{"n":3,"en":"That's why it's so important for you as a leader to pay attention to the likes and dislikes of each and every individual in your group.","ko":"그래서 리더로서 여러분이 그룹 구성원 개개인이 좋아하는 것과 싫어하는 것에 주의를 기울이는 것이 매우 중요하다."},{"n":4,"en":"You get a lot more emotional bang for your buck when you make recognition and rewards personal.","ko":"인정과 보상을 개인적이게 만들 때 훨씬 더 큰 감정적 효과를 얻는다."},{"n":5,"en":"Step into the shoes of other people and ask yourself, \"What do I wish someone would do to celebrate and recognize my contribution?\"","ko":"다른 사람의 입장이 되어 \"나는 내가 한 기여를 축하하고 인정하기 위해 다른 사람이 무엇을 해 주기를 바라는가?\"라고 자문해 보라."},{"n":6,"en":"Let your answer to this question guide your own thinking about how to acknowledge the contributions of others, while also being sensitive to the fact that not everyone is just like you.","ko":"모든 사람이 여러분과 꼭 같지는 않다는 사실도 또한 세심하게 인식하는 한편, 이 질문에 대한 답이 다른 사람의 기여를 인정하는 방법에 대한 여러분의 생각을 이끌도록 하라."},{"n":7,"en":"This means that you have to get close enough to others to know about what would make recognition meaningful to them.","ko":"이것은 곧, 무엇이 인정을 다른 사람들에게 의미 있게 만드는지에 관해 알기 위해서는 그들과 충분히 가까워져야 한다는 뜻이다."}],"easy_story":"여러 사람에게 똑같은 보상을 주는 것보다, 각자가 중요하게 여기는 방식으로 인정할 때 더 뜻깊을 수 있습니다. 그러려면 리더는 ‘나라면 좋겠다’고 짐작하는 데서 멈추지 말고, 그 사람이 무엇을 좋아하고 싫어하는지 알아야 합니다. 글의 핵심은 개인에게 맞는 인정이며, 가까이서 상대를 아는 일이 그 출발점입니다.","core":"가장 의미 있는 인정은 개인적인 것이므로 리더는 한 사람 한 사람의 호오를 알 만큼 가까워져야 한다.","flow":[{"label":"근거","sentences":"S1-2","text":"가장 의미 있는 인정이 무엇이냐 물으면 한결같이 「개인적」이라 답한다","refs":[1,2]},{"label":"주장","sentences":"S3","text":"그래서 리더는 구성원 개개인의 좋아함과 싫어함에 주의해야 한다","refs":[3]},{"label":"이유","sentences":"S4","text":"인정과 보상을 개인적으로 만들 때 감정적 효과가 훨씬 커진다","refs":[4]},{"label":"지시","sentences":"S5-6","text":"남의 입장이 되어 자문하되 모두가 나 같지는 않음을 잊지 말라","refs":[5,6]},{"label":"결론","sentences":"S7","text":"그러려면 무엇이 그들에게 의미 있는지 알 만큼 가까워져야 한다","refs":[7]}],"structure":[{"title":"문제 — 형식적인 인정","text":"누구에게나 같은 방식이면 특별하게 느껴지지 않는다"},{"title":"해결 — 개인적인 인정","text":"한 사람 한 사람의 호오를 알 만큼 가까워져 그에 맞게 인정한다"}],"key_sentence_en":"Because the most meaningful recognition is personal, a leader must pay attention to the likes and dislikes of each and every individual and get close enough to know what makes recognition meaningful to them.","blocking_vocab":[{"word":"recognition","meaning":"인정"},{"word":"personal","meaning":"개인적인"},{"word":"reward","meaning":"보상"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["모두에게 똑같은 보상을 줄수록 인정의 감정적 효과가 커진다.","가장 의미 있는 인정은 개인적인 것이므로 리더는 한 사람 한 사람의 호오를 알 만큼 가까워져야 한다."],"answer":1,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[7]},{"type":"근거","q":"S4에서 확인할 수 있는 내용은?","choices":["인정과 보상을 개인적으로 만들 때 감정적 효과가 훨씬 커진다","가장 의미 있는 인정이 무엇이냐 물으면 한결같이 「개인적」이라 답한다"],"answer":0,"why":"S4의 영어 원문을 다시 확인하세요.","refs":[4]},{"type":"변형 탐지","q":"S2의 원문 문장을 고르세요.","choices":["They say that it feels special.","They say that it feels ordinary."],"answer":0,"why":"원문 표현은 “special”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[2]}],"diagram":{"kind":"stages","title":"인정의 효과는 개인성에서 나온다","items":[{"head":"관찰","body":"의미 있었던 인정은 개인적이었다","refs":[1,2]},{"head":"리더의 일","body":"각자의 좋아함과 싫어함을 안다","refs":[3,5,6]},{"head":"효과","body":"그 사람에게 맞춘 인정과 보상이 더 크게 와 닿는다","refs":[4,7]}],"takeaway":"같은 보상도 상대를 알고 맞춰 줄 때 더 의미 있다."}},{"id":"ch3-07","title":"7. p84-no.05","lead":"조부모가 곁에 있을 때","sentences":[{"n":1,"en":"Humans live way longer than similar species, and we persist long after our physical or reproductive usefulness has peaked, which isn't very 'selective' if you think about it.","ko":"인간은 비슷한 종보다 훨씬 오래 살며, 신체적 또는 생식적 유용성이 정점에 이른 지 오랜 후에도 생존하는데, 생각해 보면 그것은 그다지 '자연 선택적'이지 않다."},{"n":2,"en":"There are many theories as to why we ended up so enduring, but one factor seems to play a big part, which is the positive influence of grandparents, on the survival of young ones and the community at large.","ko":"인류가 결국 그렇게 오래 살게 된 이유에 대해서는 여러 가지 이론이 있지만, 조부모의 긍정적인 영향이라는 한 요소가 어린 자녀와 공동체 전체의 생존에 큰 역할을 하는 것 같다."},{"n":3,"en":"Older members of a primitive human community may not have been very good at hunting or the physical stuff, but they were still perfectly capable of looking after the babies and children, and didn't need to spend time pursuing mates or any of that other exhausting stuff.","ko":"원시 인류 공동체의 나이 든 구성원들은 사냥이나 육체적인 일에는 능숙하지 못했을지 몰라도 아기와 아이들을 돌보는 것을 여전히 완벽하게 할 수 있었고, 짝을 찾거나 그 밖의 소모적인 일에 시간을 쏟을 필요가 없었다."},{"n":4,"en":"The children were cared for, learned wisdom was passed on directly, extra hands were available for the day-to-day stuff...","ko":"아이들은 보살핌을 받았으며, 학습된 지혜는 직접 전수되었고, 일상적인 일에 여분의 일손이 이용될 수 있었으며..."},{"n":5,"en":"The advantages of keeping your old folks around are many and varied, it seems.","ko":"노부모를 모시는 것의 장점은 다양하고 많은 것 같다."}],"easy_story":"나이가 든 사람은 더 이상 사냥을 잘하지 못해도 아기와 아이를 돌볼 수 있습니다. 그 과정에서 아이는 보살핌을 받고, 가족이나 공동체에는 경험과 일손이 더해집니다. 글은 인간이 생식 능력의 정점을 지난 뒤에도 오래 사는 이유를 조부모의 이런 도움과 연결합니다.","core":"인간이 생식적 쓸모를 지난 뒤에도 오래 사는 것은 조부모가 아이와 공동체에 이롭기 때문이다.","flow":[{"label":"의문 → 답하기","sentences":"S1–2","text":"인간은 유용성이 정점을 지난 뒤에도 오래 사는데 이는 선택적이지 않아 보인다 · 여러 이론 중 조부모의 긍정적 영향이 큰 몫을 하는 듯하다","refs":[1,2]},{"label":"근거 → 열거","sentences":"S3–4","text":"사냥에는 서툴러도 아기와 아이를 돌볼 수 있고 짝을 찾을 필요도 없었다 · 아이는 보살핌을 받고 지혜가 전수되며 일손이 늘어났다","refs":[3,4]},{"label":"결론","sentences":"S5","text":"노부모를 곁에 두는 이로움은 다양하고 많아 보인다","refs":[5]}],"structure":[{"title":"원인 — 곁에 남은 노인","text":"돌봄과 지혜 전수, 일손이라는 몫을 해낸다"},{"title":"결과 — 길어진 수명","text":"아이와 공동체의 생존에 이로워 오래 사는 쪽이 남았다"}],"key_sentence_en":"Humans persist long after their physical or reproductive usefulness has peaked because the positive influence of grandparents on the survival of young ones and the community at large brings many and varied advantages.","blocking_vocab":[{"word":"reproductive","meaning":"생식의"},{"word":"wisdom","meaning":"지혜"},{"word":"advantages","meaning":"이점들"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["인간이 생식적 쓸모를 지난 뒤에도 오래 사는 것은 조부모가 아이와 공동체에 이롭기 때문이다.","조부모는 아이와 공동체에 이점이 없어 선택적으로 불리하다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[5]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["인간은 유용성이 정점을 지난 뒤에도 오래 사는데 이는 선택적이지 않아 보인다","사냥에는 서툴러도 아기와 아이를 돌볼 수 있고 짝을 찾을 필요도 없었다"],"answer":1,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S5의 원문 문장을 고르세요.","choices":["The advantages of keeping your old folks around are few and limited, it seems.","The advantages of keeping your old folks around are many and varied, it seems."],"answer":1,"why":"원문 표현은 “many and varied”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[5]}],"diagram":{"kind":"branch","title":"조부모가 곁에 있을 때","items":[{"head":"오래 사는 인간","body":"생식적 쓸모를 지난 뒤에도 살아간다","refs":[1,2]},{"head":"아이","body":"보살핌을 받고 지혜를 배운다","refs":[3,4]},{"head":"공동체","body":"일손과 생활의 도움을 얻는다","refs":[3,4,5]}],"takeaway":"노년층의 기여가 장수의 진화적 이점을 설명한다."},"image":"../../assets/dongmyeong2-ch3-07-grandparent-care.webp","image_alt":"조부모와 어린아이가 함께 일상적인 집안일을 하며 도움과 배움을 나누는 따뜻한 삽화","image_caption":"S2~4: 조부모는 아이를 돌보고 지혜를 전하며 공동체의 일상에도 기여할 수 있습니다. 특정 시대의 실제 생활 모습은 아닙니다."},{"id":"ch3-08","title":"8. p85-no.06","lead":"표본 크기가 추정에 미치는 영향","sentences":[{"n":1,"en":"Psychology researchers estimate how larger populations of people would respond by testing smaller, representative samples of people.","ko":"심리학 연구자들은 사람들의 더 작고 대표적인 표본을 테스트함으로써 사람들의 더 큰 모집단이 어떻게 반응할지 추정한다."},{"n":2,"en":"It is intuitive that larger samples would produce more accurate estimates of how the entire population would respond.","ko":"더 큰 표본이 전체 모집단이 어떻게 반응할지를 더 정확하게 추정할 것이라는 사실은 직관적이다."},{"n":3,"en":"Consider, for example, a study of attitudes about wearing face masks among incoming first-year students at your college or university.","ko":"예를 들어 대학이나 대학교에 입학하는 1학년 학생들 사이에서 안면 마스크를 착용하는 것에 대한 태도에 관한 연구를 생각해 보라."},{"n":4,"en":"A study that includes half of all incoming students is likely to provide a far better approximation of what the entire population feels than a study that includes only 10 incoming students.","ko":"단 10명의 입학생을 포함하는 연구보다, 모든 입학생의 절반을 포함한 연구가 훨씬 더 나은 근사치를 제공할 가능성이 있다."},{"n":5,"en":"The issue is how strongly random chance influences the smaller sample.","ko":"문제는 무작위 확률이 더 작은 표본에 얼마나 강하게 영향을 미치는가 하는 것이다."},{"n":6,"en":"What if 8 out of the 10 students in the smaller sample happened to come from the same town?","ko":"만약 작은 표본의 10명 중 8명이 같은 마을에서 왔다면 어떻게 될까?"},{"n":7,"en":"Or if 9 of them identified as women?","ko":"또는 그들 중 9명이 여성으로 확인된다면 어떨까?"},{"n":8,"en":"A larger sample is less prone to be skewed toward one particular town, gender, or any other factor that might distort the results.","ko":"더 큰 표본은 하나의 특정한 마을, 성별 또는 결과를 왜곡할 수도 있는 다른 요인으로 편향되는 경향이 더 적다."},{"n":9,"en":"Scientists might assume that a small sample is sufficient, when a larger one is actually required to achieve an accurate estimation of the population effects.","ko":"모집단의 효과에 대한 정확한 추정을 얻기 위해 더 큰 표본이 실제로 요구되는데도, 과학자들은 작은 표본이 충분하다고 가정할 수도 있을 것이다."}],"easy_story":"학교 전체를 알고 싶은데 학생 열 명만 뽑았다고 생각해 봅시다. 우연히 같은 마을 출신이나 한 성별이 대부분일 수 있습니다. 학생을 더 많이 뽑으면 이런 우연한 치우침이 줄어들 가능성이 큽니다. 그래서 큰 집단을 정확히 짐작하려면 작은 표본이면 충분하다고 쉽게 믿어서는 안 된다는 글입니다.","core":"작은 표본일수록 무작위 확률에 크게 흔들리므로 큰 표본이라야 모집단을 정확히 추정한다.","flow":[{"label":"원리","sentences":"S1-2","text":"작은 대표 표본으로 모집단을 추정하며 큰 표본이 더 정확하리라는 것은 직관적이다","refs":[1,2]},{"label":"예시","sentences":"S3-4","text":"입학생 절반을 넣은 연구가 열 명만 넣은 연구보다 훨씬 낫다","refs":[3,4]},{"label":"까닭","sentences":"S5","text":"문제는 무작위 확률이 작은 표본에 얼마나 세게 작용하느냐다","refs":[5]},{"label":"되묻기","sentences":"S6-7","text":"열 명 중 여덟이 같은 마을 출신이거나 아홉이 여성이라면 어떻게 될까","refs":[6,7]},{"label":"결론","sentences":"S8-9","text":"큰 표본은 덜 치우치는데도 작은 표본으로 충분하다고 여기기 쉽다","refs":[8,9]}],"structure":[{"title":"작은 표본","text":"무작위 확률에 크게 흔들려 한 마을·한 성별로 쏠릴 수 있다"},{"title":"큰 표본","text":"특정 요인으로 덜 치우쳐 모집단의 효과를 정확히 추정한다"}],"key_sentence_en":"Because random chance strongly influences the smaller sample, a larger sample is less prone to be skewed and gives a more accurate estimation of the population effects.","blocking_vocab":[{"word":"sample","meaning":"표본"},{"word":"random chance","meaning":"무작위 확률"},{"word":"population","meaning":"모집단"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["표본이 작을수록 무작위 편향이 줄어 추정이 정확해진다.","작은 표본일수록 무작위 확률에 크게 흔들리므로 큰 표본이라야 모집단을 정확히 추정한다."],"answer":1,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[8,9]},{"type":"근거","q":"S5에서 확인할 수 있는 내용은?","choices":["문제는 무작위 확률이 작은 표본에 얼마나 세게 작용하느냐다","작은 대표 표본으로 모집단을 추정하며 큰 표본이 더 정확하리라는 것은 직관적이다"],"answer":0,"why":"S5의 영어 원문을 다시 확인하세요.","refs":[5]},{"type":"변형 탐지","q":"S5의 원문 문장을 고르세요.","choices":["The issue is how strongly random chance influences the smaller sample.","The issue is how strongly random chance influences the larger sample."],"answer":0,"why":"원문 표현은 “smaller sample”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[5]}],"diagram":{"kind":"compare","title":"표본 크기가 추정에 미치는 영향","items":[{"head":"10명 표본","body":"우연히 한 마을·한 성별에 치우칠 수 있다","refs":[3,5,6,7]},{"head":"입학생 절반","body":"전체 입학생의 태도에 더 가까운 근사치","refs":[3,4,8]},{"head":"주의","body":"작은 표본을 충분하다고 착각하기 쉽다","refs":[9]}],"takeaway":"작은 표본일수록 무작위 우연에 크게 흔들린다."}},{"id":"ch3-09","title":"9. p86-no.07","lead":"문제를 쪼개면 왜 새 문제가 생길까","sentences":[{"n":1,"en":"Linear solutions are often limited in their effectiveness when trying to solve problems that involve multiple layers of cycles and paradox.","ko":"여러 층의 순환과 역설을 포함하는 문제를 해결하고자 할 때, 선형적인 해결책은 그 효과가 흔히 제한적이다."},{"n":2,"en":"In fact, they often make the presenting problems worse.","ko":"사실, 그것들은 표출되는 문제를 더 악화시킨다."},{"n":3,"en":"Linear solutions involve breaking the problem into component parts and then addressing the symptoms of each component with a separate solution or set of solutions.","ko":"선형적인 해결책은 문제를 구성 요소로 나누고, 각 구성 요소의 증상을 개별적인 해결책이나 해결책의 모음으로 다루는 것을 포함한다."},{"n":4,"en":"Each solution, like any other aspect of nature, will have pros and cons.","ko":"다른 자연의 모든 측면과 마찬가지로, 각 해결책에는 장단점이 있을 것이다."},{"n":5,"en":"Everything in life has an upside and a downside.","ko":"삶의 모든 것에는 긍정적인 면과 부정적인 면이 있다."},{"n":6,"en":"Side effects are a downside of medications, for example.","ko":"예를 들어, 약물의 부작용은 약물 치료의 부정적인 면이다."},{"n":7,"en":"A single problem might be divided into several subproblems, each with its own attempted solutions that have their own downsides.","ko":"하나의 문제는 여러 하위 문제로 나누어질 수도 있는데, 각각의 하위 문제는 그 자체의 부정적인 측면이 있는 그 자체의 시도된 해결책을 가진다."},{"n":8,"en":"As a result, the solutions to a single problem create new problems.","ko":"그 결과, 하나의 문제에 대한 해결책들이 새로운 문제들을 만든다."},{"n":9,"en":"One obvious example of that might be how we have used technology to try to save time only to find we have to work more to be able to buy the latest gadgets and learn more so we can know how to use them.","ko":"그것의 한 가지 명백한 예는, 시간을 절약하기 위해 기술을 사용해 왔으나 결국 최신 기기를 구매할 수 있도록 일을 더 많이 해야 하고 그것을 사용하는 방법을 알 수 있도록 더 많은 것을 배워야 한다는 것을 알게 되는 것일 수도 있다."},{"n":10,"en":"Another example might be the bureaucracy that is involved in getting service from a government department.","ko":"또 다른 예는 정부 부서에서 서비스를 받기 위해 겪는 번잡한 사무 절차일 수도 있을 것이다."}],"easy_story":"복잡한 문제를 작은 조각으로 나누고 각 조각에만 해결책을 붙이면, 다른 곳에서 새 문제가 생길 수 있습니다. 약이 병을 낫게 하면서 부작용을 낳는 사례처럼, 해결책에는 좋은 면만 있는 것이 아닙니다. 글은 여러 문제가 얽혀 있을수록 한 줄로 곧장 해결하려는 방식의 한계를 보라고 합니다.","core":"모든 해결책에는 부정적인 면이 딸려 있어 문제를 쪼개는 선형적 해결책은 새 문제를 낳는다.","flow":[{"label":"주장","sentences":"S1-2","text":"순환과 역설이 겹친 문제에서 선형적 해결책은 효과가 제한되고 오히려 악화시킨다","refs":[1,2]},{"label":"정의","sentences":"S3","text":"문제를 구성 요소로 쪼개 증상마다 따로 해결책을 대는 방식이다","refs":[3]},{"label":"까닭","sentences":"S4-6","text":"자연의 모든 것처럼 해결책마다 장단점이 있고 약의 부작용이 그 예다","refs":[4,5,6]},{"label":"전개","sentences":"S7-8","text":"하위 문제마다 부정적 면이 딸리니 해결책들이 새 문제를 만든다","refs":[7,8]},{"label":"예시","sentences":"S9-10","text":"시간을 아끼려던 기술과 정부 부서의 번잡한 절차가 그 되풀이다","refs":[9,10]}],"structure":[{"title":"원인 — 쪼개어 따로 풀기","text":"문제를 구성 요소로 나누고 증상마다 개별 해결책을 붙인다"},{"title":"결과 — 새 문제의 증식","text":"해결책마다 딸린 부정적 면이 쌓여 새로운 문제가 생겨난다"}],"key_sentence_en":"Because every solution has its own downside, linear solutions that break a problem into component parts end up creating new problems.","blocking_vocab":[{"word":"linear","meaning":"선형적인"},{"word":"side effects","meaning":"부작용"},{"word":"paradox","meaning":"역설"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["모든 해결책에는 부정적인 면이 딸려 있어 문제를 쪼개는 선형적 해결책은 새 문제를 낳는다.","복잡한 문제는 부분마다 따로 해결하면 부작용 없이 끝난다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[9,10]},{"type":"근거","q":"S4-6에서 확인할 수 있는 내용은?","choices":["자연의 모든 것처럼 해결책마다 장단점이 있고 약의 부작용이 그 예다","순환과 역설이 겹친 문제에서 선형적 해결책은 효과가 제한되고 오히려 악화시킨다"],"answer":0,"why":"S4-6의 영어 원문을 다시 확인하세요.","refs":[4,5,6]},{"type":"변형 탐지","q":"S2의 원문 문장을 고르세요.","choices":["In fact, they often make the presenting problems worse.","In fact, they often make the presenting problems better."],"answer":0,"why":"원문 표현은 “worse”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[2]}],"diagram":{"kind":"cycle","title":"문제를 쪼개면 왜 새 문제가 생길까","items":[{"head":"복합 문제","body":"순환·역설이 여러 층으로 얽혀 있다","refs":[1]},{"head":"선형 해법","body":"증상마다 따로 해결책을 붙인다","refs":[2,3]},{"head":"부작용","body":"각 해결책의 부정적 면이 새 문제를 낳는다","refs":[4,5,6,7,8]}],"takeaway":"문제와 해결책의 연결을 보지 못하면 해결이 또 다른 문제의 시작이 된다."}},{"id":"ch3-10","title":"10. p87-no.08","lead":"리더가 남기는 유산의 두 길","sentences":[{"n":1,"en":"One paradox of power is that leaders who are most effective in building a positive legacy that outlasts them are those least interested in exercising power for its own sake, or in establishing their own place in history.","ko":"권력의 역설 중 하나는 자신보다 더 오래가는 긍정적인 유산을 남기는 데 가장 유능한 리더들은 그(권력) 자체를 위해서 권력을 행사하거나 역사에 자신의 자리를 확고히 하는 데 전혀 관심이 없는 사람들이라는 것이다."},{"n":2,"en":"J. Patrick Dobel cautions leaders that \"insisting on credit for your achievements invites disappointment and distortion of personal energy and aspirations.\"","ko":"J. Patrick Dobel은 리더들에게 '자신의 성취에 대한 공로를 주장하는 것은 실망과 개인의 에너지 및 포부의 왜곡을 자초한다'고 경고한다."},{"n":3,"en":"He also advises aspiring leaders to be proactive \"sooner rather than later; a person's legacy unfolds every day,\" and priorities and relationships formed early in a career create the foundations for later achievements.","ko":"그는 또한 포부가 있는 리더들에게 '차라리 일찌감치' 상황을 앞서서 주도하도록 조언하는데, '사람의 유산은 매일 드러나며,' 경력 초기에 형성된 우선순위와 관계가 나중 성취의 토대를 만든다."},{"n":4,"en":"People cannot control how history will judge them, but they can be conscious of how their daily interactions and priorities affect followers and institutions.","ko":"사람은 역사가 자신을 어떻게 평가할지를 통제할 수 없으나 자신의 일상적인 소통과 우선순위가 추종자와 기관에 어떻게 영향을 미치는지는 알 수 있다."},{"n":5,"en":"Unless leaders' priorities include support for others' careers as well as their own, their legacy is likely to be limited.","ko":"리더들의 우선순위가 자기 자신의 것뿐만 아니라 다른 사람들의 경력을 지원하는 것을 포함하지 않으면, 그들의 유산은 제한될 가능성이 있다."},{"n":6,"en":"As one leadership development expert notes, \"The ultimate test of a leader is not whether he or she makes smart decisions ... but whether he or she teaches others to be leaders and builds an organization that can sustain its success even when he or she is not around.\"","ko":"한 리더십 개발 전문가가 언급하듯이, \"리더에 대한 최종 시험은 그가 현명한 결정을 내리는지 여부가 아니라, 그가 다른 사람들을 리더가 되도록 가르치고 심지어 그가 없는 상황에서도 성공을 지속할 수 있는 조직을 구축하는지의 여부이다.\""}],"easy_story":"좋은 리더가 오래 남길 것은 ‘내가 공을 세웠다’는 이름표만이 아닙니다. 매일 관계를 맺고 우선순위를 바로 세우면서, 다른 사람도 리더가 되도록 가르칩니다. 그 리더가 떠난 뒤에도 조직이 잘 움직인다면, 그것이 글에서 말하는 오래가는 유산입니다.","core":"오래가는 유산을 남기는 리더는 권력 자체에 가장 무심하며, 남을 리더로 키우는 데서 그 유산이 나온다.","flow":[{"label":"역설 → 경고","sentences":"S1–2","text":"긍정적 유산을 남기는 리더일수록 권력과 역사 속 자리에 관심이 적다 · 공로를 주장하면 실망과 에너지의 왜곡을 부른다","refs":[1,2]},{"label":"조언 → 실천","sentences":"S3–5","text":"유산은 매일 펼쳐지므로 일찌감치 우선순위와 관계를 만들어야 한다 · 역사의 평가는 못 바꿔도 일상의 소통과 우선순위는 살필 수 있다","refs":[3,4,5]},{"label":"맺음","sentences":"S6","text":"최종 시험은 현명한 결정이 아니라 남을 리더로 키우는 일이다","refs":[6]}],"structure":[{"title":"권력을 좇는 리더","text":"공로를 주장하고 역사 속 자리를 세우려 해 실망과 왜곡을 부른다"},{"title":"유산을 남기는 리더","text":"매일의 우선순위와 관계로 남의 경력을 받쳐 오래가는 조직을 만든다"}],"key_sentence_en":"The leaders who build the most lasting positive legacy are those least interested in power for its own sake, and their legacy depends on daily priorities that teach others to be leaders.","blocking_vocab":[{"word":"legacy","meaning":"유산"},{"word":"credit","meaning":"공로"},{"word":"priorities","meaning":"우선순위"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["오래가는 유산을 남기는 리더는 권력 자체에 가장 무심하며, 남을 리더로 키우는 데서 그 유산이 나온다.","강한 리더는 권력 자체를 추구하고 자기 공로만 남긴다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[6]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["긍정적 유산을 남기는 리더일수록 권력과 역사 속 자리에 관심이 적다","유산은 매일 펼쳐지므로 일찌감치 우선순위와 관계를 만들어야 한다"],"answer":1,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S5의 원문 문장을 고르세요.","choices":["Unless leaders' priorities include support for their own careers alone, their legacy is likely to be limited.","Unless leaders' priorities include support for others' careers as well as their own, their legacy is likely to be limited."],"answer":1,"why":"원문 표현은 “others' careers as well as their own”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[5]}],"diagram":{"kind":"compare","title":"리더가 남기는 유산의 두 길","items":[{"head":"자기 공로","body":"권력과 역사 속 자기 자리를 좇는다","refs":[1,2]},{"head":"남의 성장","body":"일상의 관계를 가꾸고 다른 리더를 키운다","refs":[3,4,5,6]},{"head":"유산의 기준","body":"자신 없이도 조직이 지속되는가","refs":[6]}],"takeaway":"오래가는 유산은 권력 과시보다 다음 리더를 키우는 데 있다."}},{"id":"ch3-11","title":"11. p88-no.09","lead":"말을 배우기 전에 경험을 만들기","sentences":[{"n":1,"en":"Particularly for very young children, those who are learning the language of instruction, or those with language delays/disorders, it is important to make experiences concrete.","ko":"특히 매우 어린 아이들, 교수 언어를 배우고 있는 아이들, 또는 언어 지연/장애가 있는 아이들에게는 경험을 구체적으로 만드는 것이 중요하다."},{"n":2,"en":"Collaborative storytelling ─ for instance, starting with a stuffed toy and initiating a story and then passing to a child in succession with the words, \"and then,\" is a way to build narrative skills in children.","ko":"예를 들어, 봉제 인형으로 시작하여 이야기에 착수하며, 그런 다음 '그러고 나서'라는 말과 함께 잇달아 한 아이에게 (말을) 넘기는 협력적인 이야기 만들기는 아이들의 이야기 기술을 키워 주는 방법이다."},{"n":3,"en":"Teachers who work to build prior knowledge can do a better job of giving every child a chance to participate and succeed.","ko":"사전 지식을 쌓아 주는 데 노력하는 교사들은 모든 아이에게 참여하고 성공할 기회를 주는 것을 더 잘할 수 있다."},{"n":4,"en":"During a summer reading support program for children, there was talk of going camping but all the children had not had this experience.","ko":"아이들을 위한 여름 독서 지원 프로그램 동안 캠핑 가는 것에 대한 이야기가 나왔지만, 모든 아이들이 이 경험을 한 것은 아니었다."},{"n":5,"en":"The teacher used real objects while telling a story about a camping trip, created a learning center set up like a campsite with a tent, \"campfire,\" and even real animals from a taxidermist; had children take a virtual camping trip online, and, as a culminating activity, parked her camper on the school property so that children could go on a simulated camping trip.","ko":"그 교사는 캠핑 여행에 대한 이야기를 하면서 실제 물건을 사용했고, 텐트, '캠프파이어', 심지어 박제사로부터 구한 진짜 동물들이 있는 캠핑장처럼 꾸며진 학습 센터를 만들었고, 아이들에게 온라인으로 가상 캠핑 여행을 하게 했고, 마무리 활동으로 아이들이 모의 캠핑 여행을 갈 수 있도록 학교 부지에 자신의 캠핑카를 주차했다."},{"n":6,"en":"Together, they built a \"word wall\" with the words and pictures the students gathered and later used to talk and write about camping experiences.","ko":"함께 그들은 학생들이 모으고 나중에 캠핑 경험에 대해 말하고 쓰는 데 사용한 단어와 그림을 가지고 '단어 벽'을 만들었다."}],"easy_story":"캠핑을 해 본 적 없는 아이에게 캠핑 이야기를 말로만 들려주면 떠올리기 어려울 수 있습니다. 교사는 실제 물건과 캠핑카를 보여 주고, 아이들이 모은 단어와 그림으로 단어 벽을 만듭니다. 구체적인 경험이 생기면 언어가 더딘 아이도 함께 말하고 쓸 바탕을 얻습니다.","core":"어린 아이와 언어가 더딘 아이에게는 경험을 구체적으로 만들어 사전 지식을 쌓아 주어야 한다.","flow":[{"label":"원칙 → 예시","sentences":"S1–2","text":"어린 아이와 언어 지연이 있는 아이에게는 경험을 구체적으로 만드는 일이 중요하다 · 봉제 인형으로 시작해 「그러고 나서」로 넘기는 협력적 이야기 만들기가 한 방법이다","refs":[1,2]},{"label":"주제 → 사례","sentences":"S3–5","text":"사전 지식을 쌓아 주는 교사라야 모든 아이에게 참여할 기회를 준다 · 캠핑 경험이 없는 아이들에게 실제 물건과 캠핑카까지 써서 경험을 만들었다","refs":[3,4,5]},{"label":"마무리","sentences":"S6","text":"모은 낱말과 그림으로 단어 벽을 만들어 말하고 쓰는 데 썼다","refs":[6]}],"structure":[{"title":"문제 — 없는 사전 경험","text":"캠핑을 해 본 적 없는 아이는 그 이야기에 참여할 발판이 없다"},{"title":"해결 — 경험을 만들어 주기","text":"실물·모형·가상 체험으로 겪게 한 뒤 낱말로 정리해 말하고 쓰게 한다"}],"key_sentence_en":"Because young children and those with language delays learn from concrete experience, teachers who build prior knowledge give every child a chance to participate and succeed.","blocking_vocab":[{"word":"concrete","meaning":"구체적인"},{"word":"prior knowledge","meaning":"사전 지식"},{"word":"word wall","meaning":"단어 벽"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["경험이 부족한 아이에게는 실제 물건보다 추상적 설명이 먼저다.","어린 아이와 언어가 더딘 아이에게는 경험을 구체적으로 만들어 사전 지식을 쌓아 주어야 한다."],"answer":1,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[6]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["어린 아이와 언어 지연이 있는 아이에게는 경험을 구체적으로 만드는 일이 중요하다","사전 지식을 쌓아 주는 교사라야 모든 아이에게 참여할 기회를 준다"],"answer":1,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S3의 원문 문장을 고르세요.","choices":["Teachers who work to build prior knowledge can do a better job of giving every child a chance to participate and succeed.","Teachers who work to build standardized tests can do a better job of giving every child a chance to participate and succeed."],"answer":0,"why":"원문 표현은 “prior knowledge”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[3]}],"diagram":{"kind":"stages","title":"말을 배우기 전에 경험을 만들기","items":[{"head":"구체적인 물건","body":"봉제 인형·캠핑 물건을 직접 만진다","refs":[1,2,4,5]},{"head":"사전 지식","body":"함께 이야기를 만들고 경험을 나눈다","refs":[2,3,4]},{"head":"말·글","body":"낱말과 그림으로 단어 벽을 만든다","refs":[6]}],"takeaway":"구체적 경험이 쌓여야 모든 아이가 이야기와 글에 참여하기 쉽다."}},{"id":"ch3-12","title":"12. p89-no.10","lead":"전문가가 갈릴 때 판단하기","sentences":[{"n":1,"en":"Usually, when experts disagree, doubt is the most reasonable response.","ko":"보통 전문가들의 의견이 일치하지 않을 때는 의심이 가장 합리적인 대응이다."},{"n":2,"en":"You might have an opinion about whether the Chinese stock market will rise next year.","ko":"여러분은 내년에 중국 주식 시장이 상승할 것인지에 대한 의견을 가질 수도 있을 것이다."},{"n":3,"en":"You might have an opinion about the best explanation of the fall of Rome.","ko":"로마의 몰락에 대한 최선의 설명에 대한 의견을 가질 수도 있을 것이다."},{"n":4,"en":"But unless you have some privileged information others lack, you should feel some doubt if there's no consensus among the world's leading experts.","ko":"그러나 여러분이 다른 사람들에게 없고 소수에게 독점된 어떤 정보를 가지지 않은 한, 세계 최고의 전문가들 사이에 합의가 없다면 약간의 의구심을 느낄 것이다."},{"n":5,"en":"You should probably acknowledge, at least, that the evidence doesn't decisively support your preferred view over all others.","ko":"아마 적어도 증거가 다른 모든 견해보다 여러분이 선호하는 견해를 결정적으로 뒷받침하지 못한다는 점을 인정해야 할 것이다."},{"n":6,"en":"You might still prefer your view.","ko":"여러분은 여전히 자신의 견해를 선호할 수도 있다."},{"n":7,"en":"You might champion it, defend it, argue for it, see the counterarguments as flawed, think those who disagree are failing to appreciate the overall balance of considerations.","ko":"그것을 위해 싸우고, 그것을 옹호하고, 그것에 찬성 주장을 하고, 반론에 결함이 있다고 보고, 동의하지 않는 사람들이 고려 사항의 전체적인 균형을 인식하지 못하고 있다고 생각할 수도 있다."},{"n":8,"en":"But appropriate epistemic humility and recognition of your history of sometimes misplaced confidence ought, probably, to inspire substantial uncertainty in moments of judicious assessment.","ko":"그러나 적절한 인식론적 겸손과 때때로 잘못된 확신을 가졌던 자신의 역사를 인정하는 것은 아마도 신중한 평가의 순간에 상당한 불확실성을 불러일으킬 것이다."},{"n":9,"en":"This is true, of course, when you are a novice, but it is also often true when you yourself are among the experts.","ko":"이것은 물론 여러분이 초심자일 때도 해당되지만, 자신이 전문가에 속할 때도 해당되는 경우가 많다."}],"easy_story":"같은 주제를 잘 아는 전문가들끼리도 의견이 갈릴 수 있습니다. 내게 다른 사람이 모르는 결정적인 정보가 없다면, 한쪽을 확실한 답처럼 믿기보다 증거가 아직 부족하다고 인정해야 합니다. 글은 초심자뿐 아니라 전문가 자신에게도 이런 겸손한 의심이 필요하다고 말합니다.","core":"최고의 전문가들이 갈릴 때는 남에게 없는 정보가 없는 한 의심이 가장 합리적인 태도다.","flow":[{"label":"원칙","sentences":"S1","text":"전문가들의 의견이 갈릴 때는 의심이 가장 합리적인 대응이다","refs":[1]},{"label":"예시","sentences":"S2-3","text":"중국 주식 시장이나 로마의 몰락에 대해 저마다 의견을 가질 수 있다","refs":[2,3]},{"label":"조건","sentences":"S4-5","text":"남에게 없는 정보가 없다면 의심하고 증거가 결정적이지 않음을 인정하라","refs":[4,5]},{"label":"양보","sentences":"S6-7","text":"그래도 자기 견해를 좋아하고 옹호하며 반론을 결함으로 볼 수 있다","refs":[6,7]},{"label":"맺음","sentences":"S8-9","text":"인식론적 겸손은 초심자에게나 전문가에게나 불확실성을 남겨야 한다","refs":[8,9]}],"structure":[{"title":"문제 — 갈리는 전문가","text":"세계 최고 전문가들 사이에 합의가 없는 물음이 있다"},{"title":"해결 — 의심과 겸손","text":"남에게 없는 정보가 없다면 의심하고, 증거가 결정적이지 않음을 인정한다"}],"key_sentence_en":"Unless you have privileged information that others lack, doubt is the most reasonable response when the leading experts disagree, and that holds for novices and experts alike.","blocking_vocab":[{"word":"experts","meaning":"전문가들"},{"word":"doubt","meaning":"의심"},{"word":"evidence","meaning":"증거"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["전문가들이 갈릴수록 내 첫 판단을 확신해야 한다.","최고의 전문가들이 갈릴 때는 남에게 없는 정보가 없는 한 의심이 가장 합리적인 태도다."],"answer":1,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[8,9]},{"type":"근거","q":"S4-5에서 확인할 수 있는 내용은?","choices":["전문가들의 의견이 갈릴 때는 의심이 가장 합리적인 대응이다","남에게 없는 정보가 없다면 의심하고 증거가 결정적이지 않음을 인정하라"],"answer":1,"why":"S4-5의 영어 원문을 다시 확인하세요.","refs":[4,5]},{"type":"변형 탐지","q":"S1의 원문 문장을 고르세요.","choices":["Usually, when experts disagree, doubt is the most reasonable response.","Usually, when experts disagree, certainty is the most reasonable response."],"answer":0,"why":"원문 표현은 “doubt”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[1]}],"diagram":{"kind":"stages","title":"전문가가 갈릴 때 판단하기","items":[{"head":"전문가 불일치","body":"같은 주제에도 최고 전문가들의 의견이 다르다","refs":[1,2,3]},{"head":"특별한 정보 없음","body":"내 견해가 결정적이라는 확신을 늦춘다","refs":[4,5]},{"head":"합리적 태도","body":"초심자도 전문가도 의심과 겸손을 남긴다","refs":[6,7,8,9]}],"takeaway":"의견을 갖는 것과 결정적으로 안다고 믿는 것은 다르다."}}]},{"id":"q35","label":"Chapter 4 · QN35","scope":"p90~101 · 10지문","passages":[{"id":"q35-01","title":"1. p90-기출 예제 01","lead":"숙련이 인지 부하를 줄이는 과정","sentences":[{"n":1,"en":"Interestingly, experts do not suffer as much as beginners when performing complex tasks or combining multiple tasks.","ko":"흥미롭게도, 전문가들은 복잡한 과제를 수행하거나 많은 과제를 결합할 때 초보자만큼 어려움을 겪지 않는다."},{"n":2,"en":"Because experts have extensive practice within a limited domain, the key component skills in their domain tend to be highly practiced and more automated.","ko":"전문가는 제한된 영역 내에서 광범위한 연습을 하기 때문에, 그들의 영역에서의 핵심 구성 기술은 고도로 숙련되고 더 자동화되어 있는 경향이 있다."},{"n":3,"en":"Each of these highly practiced skills then demands relatively few cognitive resources, effectively lowering the total cognitive load that experts experience.","ko":"그래서 고도로 숙련된 이러한 각각의 기술은 비교적 적은 인지 자원을 필요로 하여, 전문가가 경험하는 총 인지 부하를 효과적으로 낮춘다."},{"n":4,"en":"Thus, experts can perform complex tasks and combine multiple tasks relatively easily.","ko":"따라서 전문가는 비교적 쉽게 복잡한 과제를 수행하고 많은 과제를 결합할 수 있다."},{"n":5,"en":"This is not because they necessarily have more cognitive resources than beginners; rather, because of the high level of fluency they have achieved in performing key skills, they can do more with what they have.","ko":"이것은 그들이 반드시 초보자보다 더 많은 인지적 자원을 가지고 있기 때문인 것은 아니며, 오히려 핵심 기술을 수행하면서 달성한 높은 수준의 능숙함 때문에 그들은 자신들이 가지고 있는 것으로 더 많은 것을 할 수 있다."},{"n":6,"en":"Beginners, on the other hand, have not achieved the same degree of fluency and automaticity in each of the component skills, and thus they struggle to combine skills that experts combine with relative ease and efficiency.","ko":"반면에, 초보자는 각각의 구성 기술에서 동일한 수준의 능숙함과 자동성을 달성하지 못했으며, 따라서 그들은 전문가가 비교적 쉽고 효율적으로 결합하는 기술을 결합하려고 애쓴다."}],"easy_story":"전문가도 초보자보다 머릿속 자원이 무한히 많은 것은 아닙니다. 반복해서 연습한 기본 기술이 거의 자동으로 움직이기 때문에, 그 기술 하나하나에 쓰는 정신적 힘이 줄어듭니다. 그래서 여러 기술을 함께 써야 하는 복잡한 과제도 초보자보다 쉽게 처리할 수 있습니다.","core":"전문가가 복잡한 과제를 쉽게 해내는 것은 인지 자원이 많아서가 아니라 숙련으로 자동화된 기술이 인지 부하를 낮추기 때문이다.","flow":[{"label":"현상 → 까닭","sentences":"S1–2","text":"전문가는 복잡한 과제나 다중 과제에서 초보자만큼 힘들어하지 않는다 · 제한된 영역의 광범위한 연습으로 핵심 기술이 숙련되고 자동화된다","refs":[1,2]},{"label":"작동 원리 → 결과","sentences":"S3–4","text":"숙련된 기술은 인지 자원을 덜 써서 총 인지 부하를 낮춘다 · 그래서 복잡한 과제와 다중 과제를 비교적 쉽게 해낸다","refs":[3,4]},{"label":"전환 → 대비","sentences":"S5–6","text":"자원이 더 많아서가 아니라 달성한 능숙함의 수준 때문이다 · 그 능숙함과 자동성에 이르지 못한 초보자는 결합에 애를 먹는다","refs":[5,6]}],"structure":[{"title":"전문가","text":"핵심 기술이 자동화되어 자원을 덜 쓰고 인지 부하가 낮다"},{"title":"초보자","text":"같은 수준의 능숙함·자동성이 없어 기술 결합에 애를 먹는다"}],"key_sentence_en":"Experts handle complex and multiple tasks more easily not because they have more cognitive resources but because their highly practiced key skills are automated and so lower their cognitive load.","blocking_vocab":[{"word":"automaticity","meaning":"자동화"},{"word":"cognitive load","meaning":"인지 부하"},{"word":"fluency","meaning":"숙련도"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["전문가가 복잡한 과제를 쉽게 해내는 것은 인지 자원이 많아서가 아니라 숙련으로 자동화된 기술이 인지 부하를 낮추기 때문이다.","전문가는 초보자보다 타고난 인지 자원이 많아 복합 과제를 쉽게 한다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[6]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["숙련된 기술은 인지 자원을 덜 써서 총 인지 부하를 낮춘다","전문가는 복잡한 과제나 다중 과제에서 초보자만큼 힘들어하지 않는다"],"answer":0,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S4의 원문 문장을 고르세요.","choices":["Thus, experts can perform complex tasks and combine multiple tasks relatively easily.","Thus, experts can perform complex tasks and combine multiple tasks only with great difficulty."],"answer":0,"why":"원문 표현은 “relatively easily”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[4]}],"diagram":{"kind":"stages","title":"숙련이 인지 부하를 줄이는 과정","items":[{"head":"넓은 연습","body":"좁은 영역의 핵심 기술을 반복","refs":[2]},{"head":"자동화","body":"기술 하나하나가 인지 자원을 덜 사용","refs":[2,3]},{"head":"부하 감소","body":"복합·다중 과제를 더 수월하게 수행","refs":[3,4,5,6]}],"takeaway":"전문가의 이점은 자원이 더 많음이 아니라 기술의 자동화다."}},{"id":"q35-02","title":"2. p92-기출 예제 02","lead":"영어 차이를 보는 시선","sentences":[{"n":1,"en":"No doubt students collaborating with other speakers of English might encounter language variances, which may interfere with intentionality.","ko":"영어로 말하는 다른 사용자와 공동으로 일하는 학생들이 언어적 차이와 마주칠 수도 있다는 것은 의심의 여지가 없고, 그것은 의도성에 방해가 될 수도 있다."},{"n":2,"en":"To address such disparities, Horner, Lu, Royster, and Trimbur (2011) call for a \"translingual approach\" in which language varieties are not perceived as barriers, but as avenues for meaning making.","ko":"이러한 차이를 다루기 위해 Horner, Lu, Royster, Trimbur(2011)는 언어의 다양성이 의미 창출의 장벽이 아니라 수단으로 인식되는 '초언어적 접근법'을 요구한다."},{"n":3,"en":"Similarly, Galloway and Rose (2015) study of Global Englishes found that exposure to other Englishes helps normalize language differences.","ko":"마찬가지로, 글로벌 영어들에 대한 Galloway와 Rose(2015)의 연구가 다른 영어들에 대한 노출이 언어 차이를 표준화하는 데 도움이 된다는 사실을 발견했다."},{"n":4,"en":"Educators have to work with students to examine phrases, expressions, and other ranges of English language use for their rhetorical and communicative possibilities and not their perceived errors or inferior status.","ko":"교육자들은 그것들의 인식되는 오류나 열등한 지위가 아니라 그것들의 수사적, 의사소통적 가능성을 위한 구문, 표현 그리고 영어 사용의 다른 범주를 검토하기 위해 학생들과 함께해야 한다."},{"n":5,"en":"After all, students are constantly reading texts and listening to speakers whose Englishes do not necessarily conform to what is considered standard in their own communities.","ko":"결국, 학생들은 계속해서 글을 읽고 화자의 말을 듣는데, 그(것)들의 영어는 그들 자신의 공동체에서 표준으로 여겨지는 것과 반드시 일치하지는 않는다."}],"easy_story":"학생들이 서로 다른 방식의 영어를 쓰면 처음에는 의도를 알아듣기 어려울 수 있습니다. 하지만 글은 그 차이를 무조건 틀린 영어로 보지 말고, 뜻을 만드는 여러 방법으로 살펴보자고 합니다. 교육자는 학생과 함께 표현이 어떤 상황에서 무슨 효과를 내는지 확인해야 한다는 이야기입니다.","core":"언어의 다양성은 의사소통의 장벽이 아니라 의미를 만드는 수단이므로, 교육자는 학생의 영어를 오류가 아니라 가능성으로 살펴야 한다.","flow":[{"label":"걸림돌 → 대안","sentences":"S1–2","text":"영어 사용자끼리 일할 때 언어적 차이가 의도 전달을 방해할 수 있다 · 초언어적 접근법은 다양성을 장벽이 아니라 의미 창출의 수단으로 본다","refs":[1,2]},{"label":"뒷받침 → 주장","sentences":"S3–4","text":"다른 영어들에 노출되면 언어 차이가 표준으로 받아들여진다 · 교육자는 학생과 함께 영어 사용을 오류가 아니라 수사적 가능성으로 검토해야 한다","refs":[3,4]},{"label":"까닭","sentences":"S5","text":"학생은 이미 표준에 맞지 않는 영어를 늘 읽고 듣고 있다","refs":[5]}],"structure":[{"title":"차이를 장벽으로 보는 눈","text":"인식되는 오류와 열등한 지위로 낮춰 본다"},{"title":"차이를 수단으로 보는 눈","text":"수사적·의사소통적 가능성으로 읽어 낸다"}],"key_sentence_en":"Because language differences are avenues for meaning making rather than barriers, educators should examine students' varieties of English for their rhetorical possibilities instead of treating them as errors.","blocking_vocab":[{"word":"variances","meaning":"차이들"},{"word":"barrier","meaning":"장벽"},{"word":"rhetorical","meaning":"수사적인"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["언어의 다양성은 의사소통의 장벽이 아니라 의미를 만드는 수단이므로, 교육자는 학생의 영어를 오류가 아니라 가능성으로 살펴야 한다.","표준과 다른 영어는 의미를 만들 수 없으므로 수업에서 배제해야 한다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[5]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["다른 영어들에 노출되면 언어 차이가 표준으로 받아들여진다","영어 사용자끼리 일할 때 언어적 차이가 의도 전달을 방해할 수 있다"],"answer":0,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S3의 원문 문장을 고르세요.","choices":["Similarly, Galloway and Rose (2015) study of Global Englishes found that exposure to other Englishes helps eliminate language differences.","Similarly, Galloway and Rose (2015) study of Global Englishes found that exposure to other Englishes helps normalize language differences."],"answer":1,"why":"원문 표현은 “normalize”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[3]}],"diagram":{"kind":"shift","title":"영어 차이를 보는 시선","items":[{"head":"문제처럼 보기","body":"다른 영어가 의도 전달을 방해할 수 있다","refs":[1]},{"head":"새 틀","body":"차이를 의미 창출의 수단으로 본다","refs":[2,3]},{"head":"수업","body":"학생의 영어를 오류가 아닌 가능성으로 검토","refs":[4,5]}],"takeaway":"언어 차이는 고쳐야 할 장애물로만 볼 것이 아니다."}},{"id":"q35-03","title":"3. p94-no.01","lead":"초기 지구의 산소 증가","sentences":[{"n":1,"en":"High concentrations of oxygen are required for complex organisms such as humans to live.","ko":"인간과 같은 복잡한 유기체가 살아가기 위해서는 고농도의 산소가 필요하다."},{"n":2,"en":"However, when oxygen-producing photosynthesis evolved some 2.7 billion years ago, its impact on the climate and biosphere would have been profound.","ko":"하지만 약 27억 년 전에 산소를 생산하는 광합성이 진전되었을 때, 산소가 기후와 생물권에 미친 영향은 지대했을 것이다."},{"n":3,"en":"It would not only have been a lethal gas to almost all early life, but as the young Earth's atmosphere had a much stronger greenhouse effect than today, the increasing amount of oxygen would have caused havoc in the biosphere.","ko":"산소는 거의 모든 초기 생명체에 치명적인 가스였을 뿐만 아니라, 젊은 지구의 대기는 지금보다 훨씬 더 강력한 온실 효과를 가지고 있었기 때문에 산소량의 증가는 생물권에 큰 혼란을 일으켰을 것이다."},{"n":4,"en":"Part of the reason for this was the much higher concentrations of methane, which is a powerful greenhouse gas, in the atmosphere.","ko":"이것에 대한 이유 중 일부는 강력한 온실가스인 메탄의 훨씬 더 높은 대기 중 농도였다."},{"n":5,"en":"Oxygen reacts quickly with methane, so as photosynthesis increased, and oxygen levels rose, the amount of methane in the atmosphere would have decreased.","ko":"산소는 메탄과 빠르게 반응하기 때문에 광합성이 증가하여 산소 농도가 높아졌을 때 대기 중 메탄의 양이 감소했을 것이다."},{"n":6,"en":"As it did, global temperatures would have dropped sharply, perhaps leading to Snowball Earth events.","ko":"그렇게 되면서 지구의 기온이 급격히 낮아졌을 것이며, 아마도 눈 덩어리 지구라는 사건으로 이어졌을 것이다."}],"easy_story":"지금 우리에게 산소는 생존에 꼭 필요합니다. 그러나 초기 생명체에게 산소가 늘어나는 일은 해로웠을 수 있습니다. 산소가 강한 온실가스인 메탄과 반응하면서 대기 중 메탄이 줄었고, 지구 온도도 크게 떨어졌을 것으로 설명합니다. 즉 같은 산소라도 오늘의 역할만 떠올리면 과거의 큰 변화를 놓치게 됩니다.","core":"오늘의 생명에게 꼭 필요한 산소는 27억 년 전 처음 늘어날 때는 초기 생명체에 치명적이었고 메탄을 줄여 기온을 급락시켰을 것이다.","flow":[{"label":"상식 → 전환","sentences":"S1–2","text":"인간 같은 복잡한 유기체가 살려면 고농도의 산소가 필요하다 · 그러나 27억 년 전 산소가 처음 생겼을 때의 영향은 지대했을 것이다","refs":[1,2]},{"label":"영향 ① → 까닭","sentences":"S3–4","text":"초기 생명체에 치명적이었고 온실 효과가 강한 대기에 큰 혼란을 일으켰다 · 그 까닭 중 일부는 강력한 온실가스인 메탄의 높은 대기 중 농도였다","refs":[3,4]},{"label":"영향 ② → 끝점","sentences":"S5–6","text":"산소가 메탄과 반응해 광합성이 늘자 대기 중 메탄의 양이 줄었다 · 그러면서 기온이 급락해 눈 덩어리 지구 사건으로 이어졌을 것이다","refs":[5,6]}],"structure":[{"title":"지금의 산소","text":"복잡한 생명이 살아가는 데 없어서는 안 되는 조건"},{"title":"처음의 산소","text":"초기 생명체에는 독이고 메탄을 없애 기후를 뒤흔든 힘"}],"key_sentence_en":"Although oxygen is essential to complex life today, the rise of oxygen-producing photosynthesis was lethal to early life and cut atmospheric methane, which would have cooled the planet sharply.","blocking_vocab":[{"word":"oxygen","meaning":"산소"},{"word":"methane","meaning":"메탄"},{"word":"greenhouse gas","meaning":"온실가스"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["오늘의 생명에게 꼭 필요한 산소는 27억 년 전 처음 늘어날 때는 초기 생명체에 치명적이었고 메탄을 줄여 기온을 급락시켰을 것이다.","산소가 늘자 메탄도 늘어 지구 기온이 급상승했다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[6]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["인간 같은 복잡한 유기체가 살려면 고농도의 산소가 필요하다","초기 생명체에 치명적이었고 온실 효과가 강한 대기에 큰 혼란을 일으켰다"],"answer":1,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S6의 원문 문장을 고르세요.","choices":["As it did, global temperatures would have risen sharply, perhaps leading to Snowball Earth events.","As it did, global temperatures would have dropped sharply, perhaps leading to Snowball Earth events."],"answer":1,"why":"원문 표현은 “dropped sharply”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[6]}],"diagram":{"kind":"stages","title":"초기 지구의 산소 증가","items":[{"head":"산소 증가","body":"약 27억 년 전 산소 생성 광합성이 등장","refs":[2,5]},{"head":"두 영향","body":"초기 생명체에 치명적 · 대기 메탄 감소","refs":[3,4,5]},{"head":"기온 하강","body":"온실 효과가 약해져 눈덩이 지구 가능성","refs":[4,5,6]}],"takeaway":"오늘 필요한 산소가 초기 지구에서는 생명과 기후를 뒤흔들었다."}},{"id":"q35-04","title":"4. p95-no.02","lead":"이야기를 이해하는 두 통로","sentences":[{"n":1,"en":"Communication through language requires that the sender and receiver share literacy in a single natural language.","ko":"언어를 통한 의사소통은 발신자와 수신자가 하나의 자연 언어로 문해력을 공유할 것을 요구한다."},{"n":2,"en":"Communication with representational images and sounds conveys a special characteristic for the moving image media, what Noel Carroll calls \"widespread accessibility.\"","ko":"재현적인 이미지와 소리로 이루어지는 의사소통은 움직이는 영상의 매체를 위해 특별한 특징을 전달해 주는데, 이는 Noel Carroll이 '광범위한 접근성'이라고 부르는 것이다."},{"n":3,"en":"If you know what a tiger looks like, you will be able to recognize one in a moving photograph or scene ─ whether it is depicted from various angles and camera distances, in black and white or in color, in a long take or in a montage of brief shots.","ko":"호랑이가 어떻게 생겼는지를 안다면 움직이는 사진이나 장면에서 호랑이를 인식할 수 있을 것인데, 그것이 다양한 각도와 카메라 거리에서 묘사되었든, 흑백으로 묘사되었든 컬러로 묘사되었든, 롱테이크로 묘사되었든 짧은 샷의 몽타주로 묘사되었든 관계없이 그럴 것이다."},{"n":4,"en":"Object recognition in photographs is automatic and requires no special learning.","ko":"사진 속 물체 인식은 자동으로 이루어지며 특별한 학습이 필요하지 않다."},{"n":5,"en":"Thus, screen stories have the capacity to appeal to \"untutored audiences.\"","ko":"따라서 화면의 이야기는 '학습되지 않은 관객'의 흥미를 끌 수 있는 능력이 있다."},{"n":6,"en":"Action films, for example, employ relatively little dialogue because they are meant to transcend the bounds of literacy and language through an emphasis on realist images depicting visual action.","ko":"예를 들어 액션 영화는 상대적으로 적은 대사를 사용하는데, 시각적 액션을 묘사하는 사실적인 이미지에 중점을 둠으로써 문해력과 언어의 한계를 넘어서도록 의도되어 있기 때문이다."}],"easy_story":"글로 쓴 말을 이해하려면 보내는 사람과 받는 사람이 같은 언어를 알아야 합니다. 반면 호랑이를 아는 사람은 사진의 각도나 색이 달라도 화면 속 호랑이를 알아볼 수 있습니다. 그래서 영화는 대사를 많이 쓰지 않아도 현실적인 영상으로 더 넓은 관객에게 이야기를 전할 수 있습니다.","core":"언어는 공유된 문해력을 요구하지만 영상 속 물체 인식은 학습 없이 자동으로 일어나므로 화면의 이야기는 문해력을 넘어 널리 통한다.","flow":[{"label":"문턱 → 대비","sentences":"S1–2","text":"언어로 통하려면 발신자와 수신자가 같은 언어의 문해력을 가져야 한다 · 재현적 이미지와 소리는 광범위한 접근성이라는 특징을 갖는다","refs":[1,2]},{"label":"보기 → 까닭","sentences":"S3–4","text":"호랑이를 알면 각도·색·편집이 달라져도 알아본다 · 사진 속 물체 인식은 자동이고 특별한 학습이 필요 없다","refs":[3,4]},{"label":"결론 → 실물","sentences":"S5–6","text":"그래서 화면의 이야기는 학습되지 않은 관객까지 끌어들인다 · 액션 영화는 대사를 줄이고 사실적 이미지로 언어의 한계를 넘는다","refs":[5,6]}],"structure":[{"title":"언어를 통한 의사소통","text":"같은 자연 언어의 문해력을 서로 갖추어야 성립한다"},{"title":"이미지를 통한 의사소통","text":"물체 인식이 자동이어서 학습 없이도 널리 통한다"}],"key_sentence_en":"Unlike language, which demands shared literacy, moving images are recognized automatically without special learning, so screen stories reach even untutored audiences.","blocking_vocab":[{"word":"literacy","meaning":"문해력"},{"word":"recognition","meaning":"인식"},{"word":"dialogue","meaning":"대사"}],"checks":[{"type":"핵심","q":"이 글이 말하는 핵심은?","choices":["언어는 공유된 문해력을 요구하지만 영상 속 물체 인식은 학습 없이 자동으로 일어나므로 화면의 이야기는 문해력을 넘어 널리 통한다.","영상 속 물체를 알아보려면 특별한 언어 교육을 먼저 받아야 한다."],"answer":0,"why":"글 전체의 주장과 결론을 확인하세요.","refs":[6]},{"type":"근거","q":"S3에서 확인할 수 있는 내용은?","choices":["언어로 통하려면 발신자와 수신자가 같은 언어의 문해력을 가져야 한다","호랑이를 알면 각도·색·편집이 달라져도 알아본다"],"answer":1,"why":"S3의 영어 원문을 다시 확인하세요.","refs":[3]},{"type":"변형 탐지","q":"S4의 원문 문장을 고르세요.","choices":["Object recognition in photographs is automatic and requires special training.","Object recognition in photographs is automatic and requires no special learning."],"answer":1,"why":"원문 표현은 “requires no special learning”입니다. 바뀐 표현은 의미를 달라지게 합니다.","refs":[4]}],"diagram":{"kind":"compare","title":"이야기를 이해하는 두 통로","items":[{"head":"언어","body":"보내는 이와 받는 이가 같은 언어를 읽고 알아야 한다","refs":[1]},{"head":"영상","body":"익숙한 물체를 사진에서 자동으로 알아본다","refs":[2,3,4]},{"head":"화면 이야기","body":"대사가 적은 액션 영화도 언어 경계를 넘는다","refs":[5,6]}],"takeaway":"재현 영상의 접근성은 공유 문해력 없이도 물체를 알아보는 데서 온다."}},{"id":"q35-0

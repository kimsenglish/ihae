</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">DONGMYEONG HIGH SCHOOL · GRADE 2</p><h1>동명고2 부교재</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 올림포스 9대 변별유형 Chapter 3 p76~89, Chapter 4 QN35~37 p90~107<br>독해 26지문을 모두 연결했습니다. 교과서·모의고사는 이 과정에 포함되지 않습니다.</div><div class="units" id="units"></div><p class="subnote">26지문 모두 원문·공식 해석·관계 도식·근거와 클릭형 확인 문제 3개가 연결되어 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":"동명고2 올림포스 9대 변별유형","units":[{"id":"ch3","label":"Chapter 3 · QN31~34","scope":"p76~89 · 12지문","passages":[{"id":"ch3-01","title":"1. p76-기출 예제 01","core":"탈공업화 사회에서 소비는 생존의 문제에서 생활 방식과 선택의 문제로 옮겨 가고 있다."},{"id":"ch3-02","title":"2. p78-기출 예제 02","core":"스토아 철학은 통제 밖의 일에 감정으로 반응하지 말라 하며, 남의 행동에 안녕을 매는 것은 날씨에 매는 것과 같다고 본다."},{"id":"ch3-03","title":"3. p80-no.01","core":"빈곤선을 넘으면 재산 수준은 남과 과거에 견주는 해석의 문제이며 행복 여부는 자신에게 달렸다."},{"id":"ch3-04","title":"4. p81-no.02","core":"사람은 머릿속에 주입된 것이 아니라 직접 써 본 것을 기억하므로 진짜 상황에서 해 봐야 깊이 배운다."},{"id":"ch3-05","title":"5. p82-no.03","core":"시간을 세는 능력은 체온에 달려 있어 고열이 나면 1분을 30초로 세게 된다."},{"id":"ch3-06","title":"6. p83-no.04","core":"가장 의미 있는 인정은 개인적인 것이므로 리더는 한 사람 한 사람의 호오를 알 만큼 가까워져야 한다."},{"id":"ch3-07","title":"7. p84-no.05","core":"인간이 생식적 쓸모를 지난 뒤에도 오래 사는 것은 조부모가 아이와 공동체에 이롭기 때문이다."},{"id":"ch3-08","title":"8. p85-no.06","core":"작은 표본일수록 무작위 확률에 크게 흔들리므로 큰 표본이라야 모집단을 정확히 추정한다."},{"id":"ch3-09","title":"9. p86-no.07","core":"모든 해결책에는 부정적인 면이 딸려 있어 문제를 쪼개는 선형적 해결책은 새 문제를 낳는다."},{"id":"ch3-10","title":"10. p87-no.08","core":"오래가는 유산을 남기는 리더는 권력 자체에 가장 무심하며, 남을 리더로 키우는 데서 그 유산이 나온다."},{"id":"ch3-11","title":"11. p88-no.09","core":"어린 아이와 언어가 더딘 아이에게는 경험을 구체적으로 만들어 사전 지식을 쌓아 주어야 한다."},{"id":"ch3-12","title":"12. p89-no.10","core":"최고의 전문가들이 갈릴 때는 남에게 없는 정보가 없는 한 의심이 가장 합리적인 태도다."}]},{"id":"q35","label":"Chapter 4 · QN35","scope":"p90~101 · 10지문","passages":[{"id":"q35-01","title":"1. p90-기출 예제 01","core":"전문가가 복잡한 과제를 쉽게 해내는 것은 인지 자원이 많아서가 아니라 숙련으로 자동화된 기술이 인지 부하를 낮추기 때문이다."},{"id":"q35-02","title":"2. p92-기출 예제 02","core":"언어의 다양성은 의사소통의 장벽이 아니라 의미를 만드는 수단이므로, 교육자는 학생의 영어를 오류가 아니라 가능성으로 살펴야 한다."},{"id":"q35-03","title":"3. p94-no.01","core":"오늘의 생명에게 꼭 필요한 산소는 27억 년 전 처음 늘어날 때는 초기 생명체에 치명적이었고 메탄을 줄여 기온을 급락시켰을 것이다."},{"id":"q35-04","title":"4. p95-no.02","core":"언어는 공유된 문해력을 요구하지만 영상 속 물체 인식은 학습 없이 자동으로 일어나므로 화면의 이야기는 문해력을 넘어 널리 통한다."},{"id":"q35-05","title":"5. p96-no.03","core":"사람들은 자신의 기여가 따로 드러나지 않을 때 힘을 덜 쏟으며, 이 사회적 태만은 기부와 투표에서도 나타난다."},{"id":"q35-06","title":"6. p97-no.04","core":"분노와 공감은 함께 설 수 없으므로, 공감할 때의 신체 감각을 알아차리고 연습하면 화가 난 순간에도 스스로를 진정시킬 수 있다."},{"id":"q35-07","title":"7. p98-no.05","core":"과학자들이 무작위성을 평균으로 처리하기 때문에, 코끼리를 설명하는 매끄러운 진화 이야기는 전해지지 못한 수많은 돌연변이를 가린다."},{"id":"q35-08","title":"8. p99-no.06","core":"언어를 제대로 이해하는 일은 낱말의 뜻을 넘어 쓰이는 방식과 전제된 맥락, 그리고 쓰인 시간과 장소까지 읽어 내는 일이다."},{"id":"q35-09","title":"9. p100-no.07","core":"코드는 사이버 공간을 넘어 우리 주변의 사물 자체가 되었고, 수백억 기기가 연결되면서 그 안에 심긴 규칙이 우리 삶을 규율하게 된다."},{"id":"q35-10","title":"10. p101-no.08","core":"직원과 친구가 된 관리자는 유대를 지킬지 최상의 성과를 낼지 골라야 하며, 어느 쪽을 골라도 윤리나 신뢰를 잃게 된다."}]},{"id":"q36","label":"Chapter 4 · QN36~37","scope":"p102~107 · 4지문","passages":[{"id":"q36-01","title":"1. p102-기출 예제 01","core":"언어가 명사에 붙인 문법적 성은, 그 명사를 묘사하는 말까지 무의식적으로 바꾼다."},{"id":"q36-02","title":"2. p104-기출 예제 02","core":"우리는 스스로 지어낸 현실을 의심 없이 믿고, 정작 아무것도 모른다는 사실조차 알아채지 못한다."},{"id":"q36-03","title":"3. p106-no.01","core":"유인원의 무리 생활은 바깥 포식자보다 같은 종 이웃과의 싸움에서 더 큰 힘을 발휘했고, 안에서 터지는 폭력만 다스리면 경쟁 우위가 되었다."},{"id":"q36-04","title":"4. p107-no.02","core":"물을 중앙에서 다루는 사회가 독재로 간다는 Wittfogel의 주장은, 분권 사례와 상나라의 실제 농업 앞에서 흔들린다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('units').innerHTML=data.units.map((u,i)=>`<details class="unit" ${i===0?'open':''}><summary><div><h2>${esc(u.label)}</h2><span class="scope">${esc(u.scope)}</span></div><span class="count">${u.passages.length}지문</span></summary><div class="passages">${u.passages.map((p,j)=>`${u.passages.length>6&&j%5===0?`<h3 class="chunk-label">${j+1}–${Math.min(j+5,u.passages.length)}번</h3>`:''}<a class="passage" href="study.html#${esc(p.id)}"><b>${esc(p.title)}</b><span>${esc(p.core)}</span></a>`).join('')}</div></details>`).join('');
</script></body></html>

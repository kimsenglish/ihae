.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}
.diagram.diagram-dialogue .diagram-card:before{content:'●';position:absolute;left:14px;top:13px;
  color:#176b52;font-size:24px;line-height:1}
.diagram.diagram-dialogue .diagram-card:after{content:'';position:absolute;left:12px;top:42px;
  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}
.diagram.diagram-dialogue .diagram-card:nth-child(2){background:#fff7e9;border-color:#c78f4b}
.diagram.diagram-dialogue .diagram-card:nth-child(2):before{color:#a96e2c}
.diagram.diagram-dialogue .diagram-card:nth-child(2):after{background:#a96e2c}
.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}
/* A claim supported by parallel examples ends in one explicit conclusion. */
.diagram.diagram-examples-conclusion .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}
.diagram.diagram-examples-conclusion .diagram-card:first-child{background:#e1efe7;border:2px solid #76ad91;text-align:center}
.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(-n+2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(-n+2){border-top:5px solid #1b795c}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Analogy maps one domain to another, followed by a concrete example. */
.diagram.diagram-analogy .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-analogy .diagram-card:nth-child(1){border-top:5px solid #1b795c}
.diagram.diagram-analogy .diagram-card:nth-child(2){border-top:5px solid #bd8141}
.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Three roles are simultaneous parts of one contrast, not a causal sequence. */
.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diagram.diagram-roles-contrast .diagram-card{border-top:5px solid #1b795c}
.diagram.diagram-roles-contrast .diagram-card:nth-child(2){border-top-color:#b25745}
.diagram.diagram-roles-contrast .diagram-card:nth-child(3){border-top-color:#bd8141}
@media(max-width:650px){
 .diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items,
 .diagram.diagram-dialogue .diagram-items,
 .diagram.diagram-web .diagram-items,
 .diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items,
 .diagram.diagram-dose .diagram-items,
 .diagram.diagram-examples-conclusion .diagram-items,
 .diagram.diagram-compare-conclusion .diagram-items,
 .diagram.diagram-compare-explanation .diagram-items,
 .diagram.diagram-analogy .diagram-items,
 .diagram.diagram-roles-contrast .diagram-items{grid-template-columns:minmax(0,1fr)}
 .diagram.diagram-examples-conclusion .diagram-card:first-child,
 .diagram.diagram-examples-conclusion .diagram-card:last-child,
 .diagram.diagram-compare-conclusion .diagram-card:last-child,
 .diagram.diagram-compare-explanation .diagram-card:last-child,
 .diagram.diagram-analogy .diagram-card:last-child{grid-column:auto}
 .diagram.diagram-condition .diagram-card:first-child,.diagram.diagram-branches .diagram-card:first-child{grid-column:auto}
 .diagram.diagram-web .diagram-card:first-child{grid-column:auto;justify-self:stretch;width:auto;border-radius:20px}
 .diagram.diagram-web .diagram-card:first-child:after{content:'↓';bottom:-24px}
 .diagram.diagram-condition .diagram-card:first-child:after,.diagram.diagram-branches .diagram-card:first-child:after{
   content:'↓';bottom:-23px}
 .diagram.diagram-dose .diagram-items{padding:0 0 0 24px;gap:20px}
 .diagram.diagram-dose .diagram-items:before{top:10px;bottom:10px;left:8px;right:auto;height:auto;width:5px;
   background:linear-gradient(180deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4)}
 .diagram.diagram-dose .diagram-card:before{top:calc(50% - 7px);left:-27px}
 .diagram.diagram-energy-route .diagram-items{grid-template-columns:minmax(0,1fr)}
 .diagram.diagram-energy-route .diagram-card:first-child{grid-column:auto}
 .diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'↓';right:calc(50% - 9px);top:auto;bottom:-27px;font-size:23px}
 .diagram.diagram-reaction-options .diagram-items{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 5px}
 .diagram.diagram-reaction-options .diagram-card{padding:10px 4px}
 .diagram.diagram-reaction-options .diagram-card:not(:first-child) b{font-size:14px}
 .diagram.diagram-reaction-options .diagram-card:first-child:after{font-size:16px}
}

<script id="course-data" type="application/json">{"course":"경해여고2 부교재","units":[{"id":"light12","label":"수특라이트 영어 12과","scope":"문단 순서","passages":[{"id":"light12-01","unit":"light12","number":1,"title":"no.01","core":"꿀벌은 왕족의 명령이 아니라 정찰과 춤, 여러 차례의 투표로 새 보금자리를 민주적으로 정한다.","flow":[{"label":"문제","sentences":"S1~4","text":"협력적인 꿀벌 군체가 커져 갈라지면 새 보금자리를 함께 골라야 한다.","refs":[1,2,3,4]},{"label":"정찰","sentences":"S5","text":"정찰병이 후보지를 찾아보고 춤으로 보고한다.","refs":[5]},{"label":"재확인","sentences":"S6","text":"다른 벌들도 가서 확인하고 자기 춤으로 의견을 낸다.","refs":[6]},{"label":"결정","sentences":"S7","text":"여러 차례 투표 뒤 다수의 지지를 얻은 곳이 새집이 된다.","refs":[7]}],"structure":[{"title":"문제 — 어디에 집을 둘까","text":"군체가 갈라져 나가지만 자기주장 강한 수천 마리가 한 곳에 합의해야 한다"},{"title":"해결 — 정찰·춤·투표","text":"답사 보고와 재확인을 여러 번 거쳐 다수 지지로 부지를 정한다"}],"key_sentence_en":"Bees choose the site of a new colony through scouting, dances and many rounds of voting, making the decision democratically rather than by royal decree.","image":"../../assets/gyeonghae2-light12-01-bee-process-four-panel.webp","image_alt":"커진 군체에서 나와 임시로 모인 벌들, 여러 나무 구멍을 정찰하는 벌들, 춤으로 정보를 알리는 정찰벌들, 재확인 후 다수가 한 나무 구멍으로 이동하는 네 장면","image_caption":"S3-S7 · 분리·임시 모임 → 정찰 → 춤으로 제안 → 재확인과 다수 지지로 새집 결정","blocking_vocab":[{"word":"royal decree","meaning":"왕의 명령"},{"word":"scout","meaning":"정찰병"},{"word":"majority support","meaning":"다수의 지지"}],"checks":[{"type":"핵심","q":"꿀벌이 새 군체의 장소를 정하는 방식은?","choices":["정찰과 춤을 거쳐 여러 차례 다수의 지지를 모은다.","여왕이 혼자 정한다."],"answer":0,"why":"S2는 왕의 명령이 아니라고 하고 S5~7은 정찰·춤·투표를 설명한다.","refs":[2,5,6,7]},{"type":"순서 근거","q":"정찰병이 춤으로 보고한 다음 다른 벌들은 무엇을 하는가?","choices":["해당 장소를 직접 살펴보고 돌아와 춤으로 의견을 전한다.","여왕의 명령을 기다린다."],"answer":0,"why":"S6에서 다른 벌들이 정찰병과 함께 직접 살펴본 뒤 자신의 춤을 선보인다.","refs":[6]},{"type":"변형 탐지","q":"S7의 결정 과정과 일치하는 것은?","choices":["The location chosen by the queen becomes the new colony's site.","The location with majority support becomes the new colony's site."],"answer":1,"why":"S7의 many rounds of voting과 majority support를 확인한다.","refs":[7]}],"easy_story":"벌집이 너무 커져 일부 벌이 새집을 찾아야 합니다. 여왕벌이 장소를 정하는 게 아니에요. 정찰벌이 여러 곳을 살피고 춤으로 알리면 다른 벌들이 직접 확인합니다. 여러 차례 지지를 모아 가장 많이 선택된 곳에 새집을 짓는다는 흐름입니다.","diagram":{"kind":"steps","title":"새집을 정하는 과정","items":[{"head":"군체가 커짐","body":"일부가 갈라져 새집을 찾아야 함","refs":[3,4]},{"head":"정찰·춤","body":"정찰병이 답사한 곳을 춤으로 알림","refs":[5]},{"head":"재확인","body":"다른 벌들도 장소를 살펴보고 의견을 냄","refs":[6]},{"head":"다수 지지","body":"여러 차례 선택 끝에 새집 확정","refs":[7]}]},"sentences":[{"n":1,"en":"Bee societies are both complex and collaborative.","ko":"꿀벌 사회는 복잡하면서도 협력적이다."},{"n":2,"en":"While the queen is certainly treated like a royal, with an entourage of her children tending to her every need, bees make big decisions democratically, not by royal decree.","ko":"여왕은 확실히 왕족처럼 대우받으며 자녀들로 이루어진 수행단이 그녀의 모든 필요 사항을 돌보지만, 꿀벌들은 중요한 결정을 왕족의 명령에 의해서가 아니라 '민주적으로' 내린다."},{"n":3,"en":"When a colony gets too large, a group of some thousands of bees will split off and create a new colony.","ko":"어떤 군체가 너무 커지면 약 수천 마리의 꿀벌 집단은 분리되어 새 군체를 만든다."},{"n":4,"en":"But deciding where to establish a new home is no simple task for these intelligent and opinionated insects.","ko":"하지만 어디에 새 보금자리를 만들 것인지 결정하는 것은 이 지능이 높고 자기주장이 강한 곤충들에게 결코 간단한 과제가 아니다."},{"n":5,"en":"To come to an educated group decision, they set up a temporary camp and send scouts to explore the surrounding areas, relating accounts of their journeys upon their return through the language of interpretive dance.","ko":"정보에 근거한 집단 결정에 이르기 위해, 꿀벌들은 임시 캠프를 세우고 주변 지역을 탐사하러 정찰병을 보내는데, 정찰병은 돌아와 의미를 담은 춤 언어를 통해 답사에 관한 이야기를 들려준다."},{"n":6,"en":"Other bees then set out on a property viewing with the scout whose dance they found most compelling, after which they return and present their own dances for those who remain undecided.","ko":"그러고 나서 다른 꿀벌들은 춤이 가장 설득력 있다고 느껴지는 정찰병과 함께 부동산 구경에 나서며, 그 후 돌아와 아직 결정하지 못한 꿀벌들을 위해 자신의 춤을 선보인다."},{"n":7,"en":"After many rounds of 'voting', the location that gathers majority support becomes the site of the new colony.","ko":"여러 차례의 '투표' 후에 대다수 지지를 얻은 장소가 새 군체의 부지가 된다."}]},{"id":"light12-02","unit":"light12","number":2,"title":"no.02","core":"기술은 가치 중립적이지 않고 설계 단계에서 이미 도덕적 가치가 스며든다.","flow":[{"label":"통념과 반박","sentences":"S1~3","text":"기술 자체는 중립이라는 통념과 달리 도덕적 가치는 설계 단계에 담길 수 있다.","refs":[1,2,3]},{"label":"자동차 사례","sentences":"S4~5","text":"운전석 인체공학 설계는 여성보다 남성의 평균 신체 치수를 기준으로 했다.","refs":[4,5]},{"label":"편향의 원인","sentences":"S6","text":"설계 결정자가 모두 남성이었던 점이 편향을 설명한다.","refs":[6]}],"structure":[{"title":"원인 — 설계 결정자가 한쪽","text":"인체 공학 설계 결정을 모두 남성이 내렸고 남성의 평균 치수만 기준이 되었다"},{"title":"결과 — 기술에 박힌 편향","text":"자동차 설계가 여성을 사실상 고려하지 않게 되어 기술 자체가 편향을 품는다"}],"key_sentence_en":"Technology is not value-free, because moral values are embedded in features built into technologies at the design stage, as the male-biased ergonomic systems of automobiles show.","diagram":{"kind":"steps","title":"설계 기준에 이미 가치가 들어간다","items":[{"head":"설계 결정자","body":"자동차 설계에 참여한 사람들이 모두 남성이었음","refs":[6]},{"head":"선택된 기준","body":"운전석 인체공학이 남성의 평균 신체 치수를 기준으로 만들어짐","refs":[4,5]},{"head":"결과","body":"여성 운전자에게는 맞지 않는 설계가 됨","refs":[4,5]}],"takeaway":"기술은 사용 단계에서만 가치가 생기는 것이 아니라 설계 단계부터 가치가 들어간다 · S1~6"},"image":"../../assets/gyeonghae2-light12-02-car-design.webp","image_alt":"남성 신체 치수를 기준으로 자동차 운전석을 설계한 뒤 여성 운전자에게는 맞지 않는 장면","image_caption":"S4~6: 설계 단계의 기준 자체에 편향이 담길 수 있습니다.","blocking_vocab":[{"word":"value-free","meaning":"가치 중립적인"},{"word":"embedded","meaning":"내재된"},{"word":"ergonomic","meaning":"인체공학적인"}],"checks":[{"type":"핵심","q":"글이 기술에 대해 반박하는 통념은?","choices":["기술 자체는 중립이고 사용 방식에만 도덕적 문제가 있다.","기술의 설계에도 가치가 반영된다."],"answer":0,"why":"S1의 통념을 S2~3이 반박한다.","refs":[1,2,3]},{"type":"사례 근거","q":"자동차 인체공학 설계가 남성에게 편향된 까닭은?","choices":["남성의 평균 신체 치수를 기준으로 남성들이 설계를 결정했기 때문에","여성의 평균 신체 치수를 우선했기 때문에"],"answer":0,"why":"S5는 남성 치수, S6은 남성만의 설계 결정을 말한다.","refs":[5,6]},{"type":"변형 탐지","q":"S3의 주장과 일치하는 것은?","choices":["Moral values enter technology only after people begin using it.","Moral values can be built into technology at the design stage."],"answer":1,"why":"S3의 embedded ... at the design stage를 확인한다.","refs":[3]}],"easy_story":"기술은 만든 뒤에 어떻게 쓰느냐에만 가치가 들어가는 걸까요? 자동차를 설계할 때 남성의 몸 치수만 기준으로 삼으면 여성에게는 불편하거나 불리할 수 있습니다. 무엇을 기준으로 설계했는지부터 이미 사람의 선택과 가치가 들어 있다는 글입니다.","sentences":[{"n":1,"en":"We might be inclined to assume that technology itself is neutral and that only the uses to which a particular technology is put are morally controversial.","ko":"우리는 기술 자체는 중립적이며 특정 기술이 사용되는 용도만이 도덕적으로 논란의 여지가 있다고 여기는 경향이 있을 수 있다."},{"n":2,"en":"However, some researchers, such as Philip Brey, professor of philosophy and ethics of technology, believe that it is a mistake to conceive of technology, independent of its uses, as something that is value-free, or unbiased.","ko":"그러나 기술 철학 및 윤리 교수인 Philip Brey 같은 일부 연구자들은 기술을 그 용도와 무관하게 가치 중립적인 것, 즉 편견이 없는 것으로 여기는 것은 실수라고 믿는다."},{"n":3,"en":"Instead, they argue, moral values are often embedded or implicit in features built into technologies at the design stage.","ko":"대신 이들은 도덕적 가치가 설계 단계에서 기술에 내장된 기능 속에 흔히 스며들어 있거나 암묵적으로 담겨 있다고 주장한다."},{"n":4,"en":"For example, critics, including some feminists, have pointed out that in the past the ergonomic systems designed for drivers of automobiles were biased toward men and gave virtually no consideration to women.","ko":"예를 들어 일부 페미니스트를 비롯한 비평가들은 과거에 자동차 운전자를 위해 설계된 인체 공학적 시스템이 남성에게 편향되어 있고 여성을 사실상 고려하지 않았다고 지적해 왔다."},{"n":5,"en":"That is, considerations having to do with the average height and typical body dimensions of men were implicitly built into the design specification.","ko":"즉, 남성의 평균 키와 일반적인 신체 치수와 관련된 고려 사항이 암묵적으로 설계 사양에 포함되어 있었다는 것이다."},{"n":6,"en":"These critics also note that decisions about how the ergonomic systems would be designed were all made by men, which likely accounts for the bias embedded in that particular technological system.","ko":"이 비평가들은 또한 인체 공학적 시스템의 설계 방식에 관한 모든 결정이 남성들에 의해 내려졌다고 지적하는데, 이것이 아마도 그 특정 기술 시스템에 내재한 편향이 생긴 이유를 설명한다."}]},{"id":"light12-03","unit":"light12","number":3,"title":"no.03","core":"식물에는 적절한 환기와 여러 방향에서 오는 부드러운 바람이 필요하다.","flow":[{"label":"필요","sentences":"S1-2","text":"식물이 죽지 않고 증산이 일어나려면 환기와 공기 순환이 있어야 한다","refs":[1,2]},{"label":"근거","sentences":"S3","text":"환기가 모자라면 해충이 생기고 흙에 곰팡이가 핀다","refs":[3]},{"label":"지시","sentences":"S4-6","text":"자연 바람이 드는 자리에 두고 갇히면 순환기나 선풍기로 흐름을 만든다","refs":[4,5,6]},{"label":"경계","sentences":"S7-8","text":"강한 바람에 직접 닿으면 잎과 줄기가 몹시 말라 부담이 된다","refs":[7,8]},{"label":"결론","sentences":"S9","text":"대신 여러 방향에서 오는 부드러운 바람을 받게 한다","refs":[9]}],"structure":[{"title":"문제 — 환기 부족과 강풍","text":"환기가 모자라면 해충·곰팡이가 생기고, 강한 바람은 잎과 줄기를 말린다"},{"title":"해결 — 부드러운 순환","text":"바람이 드는 자리에 두고 순환기·천장 선풍기로 여러 방향의 약한 바람을 만든다"}],"key_sentence_en":"Plants need good ventilation and gentle air flow from various directions, but they should not come in direct contact with strong winds from air conditioning or fans.","diagram":{"kind":"compare","title":"식물이 필요로 하는 바람","items":[{"head":"좋은 공기 흐름","body":"자연 바람이나 여러 방향에서 오는 부드러운 순환 → 증산과 병해 예방에 도움","refs":[1,2,3,4,5,6,9]},{"head":"피해야 할 바람","body":"강한 선풍기 바람을 직접 계속 맞음 → 잎과 줄기가 말라 스트레스","refs":[7,8]}],"takeaway":"환기가 필요하다는 말은 강한 바람을 직접 쏘라는 뜻이 아니다."},"image":"../../assets/gyeonghae2-light12-03-ventilation.webp","image_alt":"창가의 식물은 부드러운 공기 흐름을 받고, 강한 선풍기 바람에 직접 닿는 식물은 말라 있는 모습","image_caption":"S4~9: 자연 바람과 부드러운 순환은 좋지만 강한 바람을 직접 쐬게 해서는 안 됩니다.","blocking_vocab":[{"word":"ventilation","meaning":"환기"},{"word":"transpiration","meaning":"증산 작용"},{"word":"gentle breeze","meaning":"부드러운 바람"}],"checks":[{"type":"핵심","q":"실내 식물에 필요한 공기 환경은?","choices":["여러 방향의 부드러운 공기 흐름","강한 바람에 직접 닿는 환경"],"answer":0,"why":"S1~2는 공기 순환의 필요성을, S7~9는 강풍을 피하고 부드러운 바람을 주라고 한다.","refs":[1,2,7,8,9]},{"type":"인과 근거","q":"환기가 부족할 때 생길 수 있는 일은?","choices":["잎과 줄기가 강풍 때문에 마른다.","해충과 흙의 곰팡이가 생긴다."],"answer":1,"why":"S3은 환기 부족의 결과를, S7~8은 강풍의 결과를 구별한다.","refs":[3,7,8]},{"type":"변형 탐지","q":"S9의 권고와 일치하는 것은?","choices":["Give plants strong wind from one direction.","Give plants gentle breezes from various directions."],"answer":1,"why":"S9의 gentle과 various directions를 확인한다.","refs":[9]}],"easy_story":"식물도 공기가 움직여야 잘 살 수 있습니다. 바람이 전혀 통하지 않으면 해충이나 곰팡이가 생길 수 있어요. 그렇다고 강한 바람을 한쪽에서 계속 쐬면 잎과 줄기가 마릅니다. 필요한 것은 여러 방향에서 오는 부드러운 공기 흐름입니다.","sentences":[{"n":1,"en":"In order to prevent plants from dying, good ventilation is necessary.","ko":"식물이 죽는 것을 막기 위해서는, 적절한 환기가 필요하다."},{"n":2,"en":"For transpiration, one of the plant's processes, to occur, air circulation is invaluable.","ko":"식물의 과정 중 하나인 증산이 일어나기 위해서는 공기 순환이 매우 중요하다."},{"n":3,"en":"Inadequate ventilation may cause pest infestations to occur and mold to grow on the soil.","ko":"환기가 충분하지 않으면 해충이 발생하고 흙에 곰팡이가 생길 수 있다."},{"n":4,"en":"Ideally, place plants somewhere well ventilated where they can receive a natural breeze.","ko":"이상적으로는 식물을 자연 바람을 받을 수 있고 환기가 잘되는 곳에 둔다."},{"n":5,"en":"If they are shut indoors while you are out, create air flow with an air circulator or fan.","ko":"여러분이 외출한 동안 식물이 실내에 갇히게 된다면, 공기 순환기나 선풍기를 이용해 공기 흐름을 만들어 주라."},{"n":6,"en":"If your living environment permits it, installing a ceiling fan is also a good idea.","ko":"여러분의 생활 환경이 허락한다면, 천장형 선풍기를 설치하는 것도 좋은 생각이다."},{"n":7,"en":"However, don't allow plants to come in direct contact with strong winds from air conditioning or fans.","ko":"하지만, 식물이 에어컨이나 선풍기에서 나오는 강한 바람에 직접 닿게 하지는 말라."},{"n":8,"en":"The leaves and stems will get extremely dry, which is hard on plants.","ko":"잎과 줄기가 매우 건조해지는데, 이는 식물에 부담이 된다."},{"n":9,"en":"Instead, make sure plants are getting gentle breezes from various directions.","ko":"대신 식물이 여러 방향에서 부드러운 바람을 받도록 반드시 해 둔다."}]},{"id":"light12-04","unit":"light12","number":4,"title":"no.04","core":"고교 재정 교육을 도입한 주에서 성인기 자산 축적이 더 높았고, 어린 시절의 저축 권유와 부모의 저축에 대한 인식도 성인기 저축과 관련이 있었다.","flow":[{"label":"질문","sentences":"S1~3","text":"고교 재정 수업에서 배운 자기 통제가 성인기 자산에 영향을 주는지 살폈다.","refs":[1,2,3]},{"label":"비교 설계","sentences":"S4","text":"주마다 교육 도입 시점이 달라 지역·시기별 저축을 비교할 수 있었다.","refs":[4]},{"label":"첫 결과","sentences":"S5","text":"교육을 도입한 주에서 성인기 자산 축적이 더 높았다.","refs":[5]},{"label":"추가 결과","sentences":"S6~7","text":"어릴 때 계좌 저축을 권유받았거나 부모가 평균보다 더 저축했다고 말한 사람들도 성인기에 더 저축했다.","refs":[6,7]}],"structure":[{"title":"비교 — 재정 교육 도입 여부","text":"도입 여부와 시점이 다른 주들을 비교하니, 교육을 도입한 주의 성인기 자산 축적이 더 높았다."},{"title":"추가 관찰 — 어린 시절의 경험","text":"계좌 저축을 권유받았거나 부모가 평균보다 더 저축했다고 말한 사람들도 성인이 되어 더 저축했다."}],"key_sentence_en":"A recent study suggests that teaching self-control matters, since asset accumulation was higher in states that had adopted consumer education and among adults encouraged to save as children.","blocking_vocab":[{"word":"asset accumulation","meaning":"자산 축적"},{"word":"household financial decision making","meaning":"가계 재정 의사 결정"},{"word":"adopt","meaning":"도입하다"}],"checks":[{"type":"핵심","q":"연구에서 재정 교육 및 어린 시절의 저축 경험은 성인기의 자산·저축과 어떤 관계를 보였는가?","choices":["성인이 된 뒤의 저축과 아무 관계가 없었다.","성인이 된 뒤의 자산·저축 증가와 관련이 있었다."],"answer":1,"why":"S5~7은 프로그램 도입 주, 어릴 적 저축 권유, 부모의 저축에 대한 인식과 성인기 저축의 관계를 제시한다.","refs":[5,6,7]},{"type":"연구 근거","q":"주별 재정 교육의 효과를 비교할 수 있었던 이유는?","choices":["모든 주가 같은 해에 프로그램을 도입해서","어떤 주는 도입하지 않고 어떤 주는 서로 다른 시기에 도입해서"],"answer":1,"why":"S4의 주별·시기별 차이가 비교를 가능하게 했다.","refs":[4]},{"type":"변형 탐지","q":"S6의 결과와 일치하는 것은?","choices":["Children encouraged to save with a bank account saved more as adults.","Children encouraged to save with a bank account saved less as adults."],"answer":0,"why":"S6의 saved more than others as adults를 확인한다.","refs":[6]}],"easy_story":"돈을 모으는 습관은 어른이 된 뒤 갑자기 생기지 않을 수 있어요. 글의 연구는 학교에서 자기 통제와 가계 재정을 배우거나 어릴 때 저축을 권유받은 경험을 살핍니다. 그런 교육과 경험을 가진 사람들이 나중에 자산을 더 모았다는 비교가 핵심입니다.","diagram":{"kind":"evidence","title":"재정 교육과 성인기 저축 · 두 종류의 관찰","items":[{"head":"교육 도입 주","body":"성인기 자산 축적이 더 높음","refs":[4,5]},{"head":"교육 미도입 주","body":"주별 비교 대상","refs":[4,5]},{"head":"어릴 때 계좌 저축을 권유받음","body":"성인이 되어 다른 사람보다 더 많이 저축","refs":[6]},{"head":"부모가 평균보다 더 저축했다고 봄","body":"성인이 되어 다른 사람보다 더 많이 저축","refs":[7]}],"takeaway":"위는 주별 비교, 아래는 어린 시절 경험에 관한 별도 관찰입니다. 원문은 정확한 수치나 필연적인 인과관계를 제시하지 않습니다."},"sentences":[{"n":1,"en":"A recent study by Bernheim, Garrett, and Maki suggests that the teaching of self-controlling techniques is important.","ko":"Bernheim, Garrett, Maki의 최근 연구는 자기 통제 기법 교육이 중요하다는 점을 시사한다."},{"n":2,"en":"They studied the influence on asset accumulation in adulthood of taking courses in household financial decision making in high school.","ko":"그들은 고등학교에서 가계 재정 의사 결정에 관한 수업을 수강하는 것이 성인기의 자산 축적에 미치는 영향을 연구했다."},{"n":3,"en":"These courses covered topics such as budgeting, credit management, balancing checkbooks, and compound interest.","ko":"이 수업들은 예산 세우기, 신용 관리, 수표장 잔액 맞추기, 복리와 같은 주제를 다루었다."},{"n":4,"en":"Some states never adopted these consumer educational programs, while others adopted them at different times, making it possible to compare subsequent saving across states and over time.","ko":"어떤 주들은 이러한 소비자 교육 프로그램을 전혀 채택하지 않았고, 반면에 다른 주들은 그 프로그램들을 서로 다른 시점에 채택하여, 그 후의 저축을 주별로 그리고 시간의 흐름에 따라 비교하는 것이 가능하게 했다."},{"n":5,"en":"The researchers found that asset accumulation was higher in the states that had adopted these educational programs than in those that did not.","ko":"연구자들은 이러한 교육 프로그램을 채택했던 주들이 그러지 않은 주들보다 자산 축적 수준이 더 높았다는 사실을 알아냈다."},{"n":6,"en":"Moreover, those who as children had been encouraged to save using a bank account saved more than others as adults.","ko":"게다가 어릴 적에 은행 계좌를 이용해 저축하도록 장려되었던 사람들은 성인이 되어서 다른 사람들보다 더 많이 저축했다."},{"n":7,"en":"Similarly, those who characterized their parents as having saved more than average saved more than others.","ko":"마찬가지로 자신의 부모를 평균보다 더 많이 저축한 사람으로 묘사한 이들은 다른 사람들보다 더 많이 저축했다."}]},{"id":"light12-05","unit":"light12","number":5,"title":"no.05","core":"콘서트홀이 커지자 작은 궁정 앙상블로는 음량이 모자라 앙상블을 키우는 조정이 이루어졌다.","flow":[{"label":"이전","sentences":"S1~2","text":"바로크 시대 음악은 왕궁·교회에서 작은 청중을 위해 연주됐다.","refs":[1,2]},{"label":"변화와 문제","sentences":"S3~4","text":"큰 콘서트홀이 생겼지만 작은 궁정 앙상블의 음량으로는 홀을 채우기 어려웠다.","refs":[3,4]},{"label":"조정","sentences":"S5~6","text":"연주단 규모를 늘렸고 말러 8번 초연에서는 1,000명이 넘는 연주자·가수가 참여했다.","refs":[5,6]}],"structure":[{"title":"문제 — 커진 홀, 그대로인 음량","text":"관객이 늘어 큰 홀이 지어졌지만 궁정 앙상블은 작아 소리가 홀을 채우지 못했다"},{"title":"해결 — 앙상블 확대","text":"연주 인원을 늘리는 조정이 이루어졌고 말러 8번 초연에서 1,000명이 넘었다"}],"key_sentence_en":"As larger concert halls were built after the French Revolution, the small court ensembles were much too low in volume, so several adjustments were made, above all the enlargement of the ensemble.","diagram":{"kind":"steps","title":"큰 연주장이 연주단 규모를 키웠다","items":[{"head":"이전","body":"왕궁·교회의 작은 청중에게 작은 앙상블이 연주","refs":[1,2]},{"head":"환경 변화","body":"더 큰 관객을 담는 대형 콘서트홀이 생김","refs":[3]},{"head":"문제","body":"기존의 작은 궁정 앙상블로는 홀을 채울 음량이 부족","refs":[4]},{"head":"조정","body":"연주단 규모를 키우고, 말러 8번 초연에는 1,000명 이상이 참여","refs":[5,6]}],"takeaway":"음악 양식의 자연스러운 확대라기보다 크기가 달라진 공간에 대응한 조정이다."},"image":"../../assets/gyeonghae2-light12-05-orchestra-four-panel.webp","image_alt":"왕궁의 작은 청중과 작은 앙상블, 대형 콘서트홀, 넓은 홀에서 음량이 부족한 작은 앙상블, 관현악단과 합창단이 크게 확대된 공연의 네 장면","image_caption":"S1-S6 · 작은 궁정 앙상블 → 대형 콘서트홀 → 음량 부족 → 연주단·합창단 확대","blocking_vocab":[{"word":"ensemble","meaning":"합주단"},{"word":"concert hall","meaning":"콘서트홀"},{"word":"enlargement","meaning":"확대"}],"checks":[{"type":"핵심","q":"대형 콘서트홀의 등장에 따른 음악 공연의 조정은?","choices":["연주단 규모를 더 작게 했다.","넓어진 홀을 채우도록 연주단 규모를 키웠다."],"answer":1,"why":"S3의 큰 홀, S4의 작은 음량, S6의 연주단 확대가 인과로 이어진다.","refs":[3,4,6]},{"type":"인과 근거","q":"궁정 앙상블로 새 콘서트홀을 채우기 어려웠던 까닭은?","choices":["합주단이 작아 음량이 낮았기 때문에","청중이 왕궁에만 들어갈 수 있었기 때문에"],"answer":0,"why":"S4의 quite small and ... low in volume이 직접 근거다.","refs":[4]},{"type":"변형 탐지","q":"S6의 말러 8번 초연에 관한 내용과 일치하는 것은?","choices":["Fewer than a hundred musicians and singers performed.","Over a thousand musicians and singers performed."],"answer":1,"why":"S6의 over 1000 musicians and singers를 확인한다.","refs":[6]}],"easy_story":"작은 궁정이나 교회에서 연주할 때는 적은 연주자로도 소리가 충분했습니다. 그런데 더 많은 사람이 들어가는 큰 공연장이 생기자 같은 규모로는 멀리까지 소리를 채우기 어려웠어요. 그래서 앙상블의 크기를 키우는 조정이 이루어졌다는 이야기입니다.","sentences":[{"n":1,"en":"Western music during Baroque times was played at royal courts or in churches.","ko":"바로크 시대 동안의 서양 음악은 왕궁에서 또는 교회에서 연주되었다."},{"n":2,"en":"The audience, especially in the case of Baroque theater music, was small.","ko":"특히 바로크 극장 음악의 경우 관객 수가 적었다."},{"n":3,"en":"The turn of the French Revolution towards democracy brought along the wish of a wider audience to attend art concerts, and larger concert halls were built.","ko":"프랑스 혁명의 민주주의를 향한 전환은 더 폭넓은 관객이 예술 콘서트에 참석하려는 바람을 가져왔고, 더 큰 콘서트홀들이 지어졌다."},{"n":4,"en":"Still, the ensembles performing at court were quite small and, therefore, low in volume, much too low for a large concert hall.","ko":"그러나 궁정에서 연주하던 앙상블은 여전히 규모가 상당히 작았고, 따라서 음량도 낮았으며, 그 음량은 대형 콘서트홀에 쓰기에는 턱없이 낮았다."},{"n":5,"en":"Thus, several adjustments needed to be made to fill the halls with so many people.","ko":"따라서 그렇게 많은 사람으로 홀을 채우기 위해 몇 가지 조정이 이루어져야 했다."},{"n":6,"en":"An obvious one was the enlargement of the ensemble, which found its peak in the 8th symphony of Gustav Mahler, also called 'Symphony of a Thousand', where indeed at the premiere in 1910 over 1000 musicians and singers performed.","ko":"분명한 조정 하나는 앙상블의 확대였고, 그 확대는 Gustav Mahler의 교향곡 제8번에서 절정에 이르렀다. 이 곡은 '천인 교향곡'이라고도 불렸으며, 실제로 1910년 초연에서는 1,000명이 넘는 음악가와 가수가 공연했다."}]},{"id":"light12-06","unit":"light12","number":6,"title":"no.06","core":"적응은 새 정보를 기존 스키마에 넣는 동화와, 스키마 자체를 바꾸는 조절로 이루어진다.","flow":[{"label":"도입","sentences":"S1","text":"적응은 동화와 조절이라는 두 과정을 포함한다","refs":[1]},{"label":"정의","sentences":"S2","text":"동화는 새 정보를 이미 아는 스키마 안에 넣는 과정이다","refs":[2]},{"label":"예시","sentences":"S3-5","text":"마네킹을 나이 든 여성으로 보고 남는 정보는 버리거나 그 틀에 넣는다","refs":[3,4,5]},{"label":"전환","sentences":"S6","text":"조절에서는 새로운 상황에 따라 기존 스키마가 바뀐다","refs":[6]},{"label":"예시","sentences":"S7-8","text":"개의 스키마를 가진 아이가 소를 보면 그 틀 자체를 고쳐야 한다","refs":[7,8]}],"structure":[{"title":"Assimilation — 동화","text":"틀은 그대로 두고 새 정보를 그 안에 넣는다 → 마네킹도 '나이 든 여성'"},{"title":"Accommodation — 조절","text":"새 정보가 안 들어가면 틀 자체를 고친다 → 소를 보고 '개' 스키마를 수정"}],"key_sentence_en":"Adaptation works in two ways: assimilation puts new information into existing schemas, while accommodation changes the existing schemas themselves in response to new situations.","image":"../../assets/gyeonghae2-light12-06-schema-four-panel-v2.webp","image_alt":"네 장면: 아이가 쇼핑몰 마네킹을 보고 기존 사람 모습에 빗대는 장면과, 개를 알던 아이가 소를 만나 두 동물의 차이를 다시 생각하는 장면","image_caption":"S2~8 · 새 정보를 기존 생각에 넣는 동화와, 맞지 않는 정보를 만나 생각을 고치는 조절을 비교합니다. 그림 속 생각 구름은 이해를 돕는 비유입니다.","blocking_vocab":[{"word":"schema","meaning":"인지 도식·기존 생각의 틀"},{"word":"assimilation","meaning":"동화"},{"word":"accommodation","meaning":"조절"}],"checks":[{"type":"핵심","q":"동화와 조절의 차이는?","choices":["동화는 기존 틀에 정보를 넣고 조절은 기존 틀을 바꾼다.","동화는 기존 틀을 바꾸고 조절은 정보를 버리기만 한다."],"answer":0,"why":"S2는 동화, S6은 조절을 정의한다.","refs":[2,6]},{"type":"사례 근거","q":"개로 알고 있던 아이가 소를 보고 개의 스키마를 고쳐야 하는 과정은?","choices":["조절","동화"],"answer":0,"why":"S7~8은 새 동물의 크기·꼬리·뿔이 기존 개 스키마에 맞지 않아 수정한다고 한다.","refs":[7,8]},{"type":"변형 탐지","q":"S2·S6과 일치하는 것은?","choices":["Assimilation adds information to an existing schema, while accommodation changes that schema.","Assimilation changes an existing schema, while accommodation only adds information to it."],"answer":0,"why":"두 과정의 정의를 바꾸면 뜻이 정반대가 된다.","refs":[2,6]}],"easy_story":"새로운 것을 볼 때 우리는 먼저 아는 틀에 끼워 맞춥니다. 마네킹을 나이 든 여성처럼 보는 것이 그런 ‘동화’예요. 하지만 소를 보며 개라고만 할 수 없듯, 기존 틀로 설명되지 않으면 틀 자체를 고쳐야 합니다. 그게 ‘조절’입니다.","diagram":{"kind":"compare","title":"새 정보를 만났을 때","items":[{"head":"동화 · assimilation","body":"마네킹을 여성으로 부르고, 낯선 추가 정보는 기존의 ‘여성’ 스키마에 넣거나 버림","refs":[2,3,4,5]},{"head":"조절 · accommodation","body":"소의 크기·꼬리·뿔이 기존 ‘개’ 스키마에 맞지 않아 그 스키마를 수정함","refs":[6,7,8]}]},"sentences":[{"n":1,"en":"Adaptation includes two processes: assimilation and accommodation.","ko":"적응은 두 가지 과정, 즉 동화와 조절을 포함한다."},{"n":2,"en":"Assimilation refers to the process of including new information into existing schemas or what we already know.","ko":"동화는 새로운 정보를 기존 스키마 또는 이미 알고 있는 것에 포함하는 과정을 가리킨다."},{"n":3,"en":"For example, when a child walks into a mall and observes a mannequin draped in women's clothes, the child is likely to address it by referring to it as an older woman.","ko":"예를 들어 아이가 쇼핑몰에 들어가 여성 옷을 걸친 마네킹을 보면, 그 마네킹을 나이 든 여성으로 여겨 그렇게 부를 가능성이 크다."},{"n":4,"en":"The child may wonder how or why the woman is standing completely still or how the skin tone is different.","ko":"아이는 그 여성이 어떻게 또는 왜 완전히 가만히 서 있는지 또는 피부 색조가 어떻게 다른지 궁금해할 수도 있다."},{"n":5,"en":"This additional information will either be discarded or included in the existing schema of an older woman's appearance.","ko":"이 추가 정보는 폐기되거나 나이 든 여성의 외모에 관한 기존 스키마에 포함될 것이다."},{"n":6,"en":"In accommodation, existing schemas are changed in response to new situations and experiences.","ko":"조절에서는 새로운 상황과 경험에 따라 기존 스키마가 변화된다."},{"n":7,"en":"For example, a child has a schema of a dog.","ko":"예를 들어, 한 아이가 개에 대한 스키마를 가지고 있다."},{"n":8,"en":"But when he sees a cow, he will need to modify the schema, as the new schema of size variation in the body, such as the tail or the presence of horns, will not fit into the existing schema of a dog.","ko":"그러나 아이가 소를 보면, 몸집의 크기 차이와 꼬리·뿔의 존재 여부 같은 신체적 특징이 기존의 ‘개’ 스키마에 맞지 않으므로 그 스키마를 수정해야 한다."}]}]},{"id":"light13","label":"수특라이트 영어 13과","scope":"문장 삽입","passages":[{"id":"light13-01","unit":"light13","number":1,"title":"no.01","core":"만성 통증은 몸을 지키던 경보 시스템을 작은 자극에도 울리는 과민한 시스템으로 바꾼다.","flow":[{"label":"도입","sentences":"S1-2","text":"몸은 해를 막는 시스템을 갖췄고 신경계에는 위협을 알리는 경보가 있다","refs":[1,2]},{"label":"예시","sentences":"S3-4","text":"불이 나면 경보가 울려 나가게 하고 손을 데면 손을 뗀다","refs":[3,4]},{"label":"전환","sentences":"S5","text":"급성 통증과 달리 3~6개월 넘게 이어지는 만성 통증은 다르게 작동한다","refs":[5]},{"label":"주제","sentences":"S6-7","text":"아주 작은 자극에도 울리는 잘못된 경보가 생긴다","refs":[6,7]},{"label":"결론","sentences":"S8","text":"시간이 지나면 통증에 민감해져 더 약한 자극에도 더 아프다","refs":[8]}],"structure":[{"title":"급성 — 제대로 울리는 경보","text":"실제 위협과 부상에 반응해 피하도록 알려 주는 보호 장치"},{"title":"만성 — 잘못 울리는 경보","text":"작은 자극과 상상만으로도 울려 점점 더 민감해진다"}],"key_sentence_en":"Chronic pain can turn the body&#x27;s protective alarm into an oversensitive system.","image":"../../assets/gyeonghae2-light13-01-pain-alarm-four-panel-v2.webp","image_alt":"네 장면: 화재 경보를 듣고 대피하는 사람, 뜨거운 냄비에서 손을 떼는 사람, 작은 촛불에도 울리는 민감한 경보기, 가볍게 부딪힌 무릎에 강한 통증을 느끼는 사람","image_caption":"S2~8 · 급성 통증은 실제 위협에 반응하는 보호 경보이고, 만성 통증은 작은 자극에도 경보가 울리는 과민한 상태에 비유됩니다.","blocking_vocab":[{"word":"acute pain","meaning":"급성 통증"},{"word":"chronic pain","meaning":"만성 통증"},{"word":"sensitized","meaning":"예민해진"}],"checks":[{"type":"핵심","q":"만성 통증을 경보에 비유한 까닭은?","choices":["작은 자극에도 잘못 울리며 점점 더 예민해질 수 있어서","실제 큰 위협에서만 정확히 울리기 때문에"],"answer":0,"why":"S6~8은 잘못된 경보와 통증 민감화를 설명한다.","refs":[6,7,8]},{"type":"대조 근거","q":"글이 급성 통증과 만성 통증을 구분하는 기준은?","choices":["손에만 나타나는 통증과 무릎에만 나타나는 통증","짧게 끝나는 통증과 3~6개월을 넘게 지속되는 통증"],"answer":1,"why":"S5의 short-lived와 persisting for longer than three to six months를 확인한다.","refs":[5]},{"type":"변형 탐지","q":"S8의 변화와 일치하는 것은?","choices":["With time, more stimulation is always needed to feel pain.","With time, less stimulation can hurt more."],"answer":1,"why":"S8의 lesser stimulation hurts more를 확인한다.","refs":[8]}],"easy_story":"통증은 원래 위험을 알려 몸을 지키는 경보입니다. 뜨거운 것을 만지면 손을 떼게 하는 것처럼요. 만성 통증에서는 이 경보가 지나치게 민감해져 작은 자극에도 울릴 수 있습니다. 그래서 ‘지금 큰 손상이 있다’와 ‘경보가 과민하다’를 구별해 읽어야 합니다.","diagram":{"kind":"compare","title":"두 종류의 통증 경보","items":[{"head":"급성 통증","body":"실제 위협이나 다친 손에 반응하는 보호 경보","refs":[2,3,4,5]},{"head":"만성 통증","body":"3~6개월 넘게 이어지며 작은 자극에도 울리는 과민 경보","refs":[5,6,7,8]}]},"sentences":[{"n":1,"en":"Your body is equipped with systems designed to keep you safe from harm.","ko":"여러분의 몸은 해로운 것으로부터 여러분을 보호하기 위해 설계된 시스템을 갖추고 있다."},{"n":2,"en":"In particular, your nervous system has an alarm system to protect you from threats.","ko":"특히, 여러분의 신경계는 위협으로부터 여러분을 보호하기 위한 경보 시스템을 가지고 있다."},{"n":3,"en":"If you sense the building burning, your alarm sounds, telling you to get out.","ko":"만약 여러분이 건물에 불이 난 것을 감지하면, 경보가 울려 여러분에게 밖으로 나가라고 알려 준다."},{"n":4,"en":"Likewise, if you burnt your hand on the stove, you would pull away.","ko":"마찬가지로, 만약 여러분이 난로에 손을 데면, 손을 뗄 것이다."},{"n":5,"en":"Short-lived pain from a possible injury is acute pain, but when pain becomes chronic ─ persisting for longer than three to six months ─ it behaves differently.","ko":"있을 수 있는 부상에서 비롯된 단기간의 통증은 급성 통증이지만, 통증이 3개월에서 6개월 이상 지속되어 만성화되면 그것은 다르게 작동한다."},{"n":6,"en":"With chronic pain, as with trauma and anxiety, there is a faulty alarm system that may go off when a metaphorical candle is lit.","ko":"만성 통증에서는, 트라우마와 불안과 마찬가지로, 비유적 의미의 촛불이 켜졌을 때도(아주 작은 자극에도) 울릴 수 있는 잘못된 경보 시스템이 존재한다."},{"n":7,"en":"This can happen when you gently bump your arthritic knee or you feel the early signs of a headache and your mind envisions how it might ruin your day.","ko":"이런 일은 관절염이 있는 무릎을 살짝 부딪쳤을 때나, 두통의 초기 신호를 느끼고 그것이 어떻게 하루를 망칠 수도 있을지 머릿속에서 상상할 때 발생할 수 있다."},{"n":8,"en":"With time, we can be sensitized to pain, so that lesser stimulation hurts more.","ko":"시간이 지남에 따라, 우리는 통증에 민감해질 수 있고, 그 결과 더 약한 자극에도 더 아플 수 있다."}]},{"id":"light13-02","unit":"light13","number":2,"title":"no.02","core":"인간의 몸은 필요한 만큼만 움직이고 불필요한 활동에는 에너지를 쓰지 않도록 진화했다.","flow":[{"label":"주제","sentences":"S1-2","text":"우리 몸은 번식 외 기능에 충분하되 지나치지 않은 에너지를 쓰도록 선택되었다","refs":[1,2]},{"label":"단서","sentences":"S3","text":"'가능한 한'을 붙인 까닭은 움직이지 않고는 살 수 없기 때문이다","refs":[3]},{"label":"예시","sentences":"S4-6","text":"수렵 채집인은 놀이·생계·짝짓기·춤에 필요한 만큼은 몸을 써야 했다","refs":[4,5,6]},{"label":"근거","sentences":"S7","text":"에너지가 부족할 때 불필요한 활동은 생존과 번식에 쓸 몫을 깎는다","refs":[7]},{"label":"결론","sentences":"S8","text":"분별 있는 수렵 채집인은 재미로 5마일을 달리지 않았을 것이다","refs":[8]}],"structure":[{"title":"원인 — 에너지의 희소함","text":"쓸 에너지가 늘 모자랐고 생존과 번식이 먼저였다"},{"title":"결과 — 필요한 만큼만 움직임","text":"필요한 활동은 하되 재미만을 위한 활동은 낭비가 되어 피하도록 진화했다"}],"key_sentence_en":"Humans evolved to avoid unnecessary physical activity when energy was scarce.","blocking_vocab":[{"word":"nonreproductive functions","meaning":"번식 외 기능"},{"word":"gratuitous","meaning":"불필요한"},{"word":"scarce","meaning":"부족한"}],"checks":[{"type":"핵심","q":"진화 과정에서 몸의 에너지 사용에 대해 글이 말하는 것은?","choices":["움직임은 언제나 완전히 없어야만 살아남는다.","생존에 필요한 활동은 하되 불필요한 움직임에는 에너지를 아낀다."],"answer":1,"why":"S1~3은 가능한 한 비활동적이지만 생존에 필요한 움직임은 해야 한다고 설명한다.","refs":[1,2,3]},{"type":"인과 근거","q":"에너지가 부족할 때 재미로 뛰는 활동을 피하는 이유는?","choices":["생존·번식에 쓸 에너지가 줄어들기 때문에","사회적 의식에 참여할 필요가 없기 때문에"],"answer":0,"why":"S7은 불필요한 신체 활동이 생존·번식 에너지를 줄인다고 한다.","refs":[7]},{"type":"변형 탐지","q":"S3의 단서와 일치하는 것은?","choices":["People cannot survive or thrive without moving.","People can survive without moving at all."],"answer":0,"why":"S3의 cannot survive or thrive without moving을 확인한다.","refs":[3]}],"easy_story":"몸에는 쓸 수 있는 에너지가 한정돼 있습니다. 생존과 번식에 필요한 움직임은 해야 하지만, 에너지가 모자랄 때 쓸데없이 움직이면 중요한 곳에 쓸 몫이 줄어요. 글은 우리 몸이 ‘전혀 움직이지 않도록’이 아니라 ‘필요한 만큼 움직이도록’ 적응했다고 말합니다.","diagram":{"kind":"condition","title":"에너지가 부족할 때 움직임의 선택","items":[{"head":"공통 조건 · 에너지 부족","body":"에너지가 부족한 때가 대체로 많았으므로 생존과 번식에 쓸 에너지를 아껴야 했다.","refs":[7]},{"head":"필요한 움직임은 한다","body":"놀이·먹을거리 구하기·집안일·사회적 의식 등 생존과 생활에 필요한 활동을 한다.","refs":[3,4,5,6]},{"head":"불필요한 움직임은 줄인다","body":"재미만을 위해 5마일을 뛰며 에너지를 쓰지는 않았을 것이다.","refs":[7,8]}],"takeaway":"몸이 완전히 움직이지 않는다는 뜻이 아니라 필요한 만큼은 움직이고 불필요한 활동을 피한다 · S1~3"},"sentences":[{"n":1,"en":"Stated simply, we evolved to be as inactive as possible.","ko":"간단히 말해, 우리는 가능한 한 비활동적으로 있으려는 존재로 진화해 왔다."},{"n":2,"en":"Or to be more precise, our bodies were selected to spend enough but not too much energy on nonreproductive functions including physical activity.","ko":"더 정확히 말하면, 우리의 몸은 신체 활동을 포함한 번식 외 기능에 '충분하기는 하나 너무 지나치지 않은' 에너지를 쓰도록 선택되었다."},{"n":3,"en":"Note that I included the qualifier \"as possible\" because, obviously, one cannot survive or thrive without moving.","ko":"내가 '가능한 한'이라는 수식어를 포함했다는 것을 주목하라. 이는 명백하게도, 움직이지 않고서는 생존하거나 잘 살 수 없기 때문이다."},{"n":4,"en":"As a young hunter-gatherer, you would need to play to develop athletic skills, gain strength, and build stamina.","ko":"어린 수렵 채집인으로서, 여러분은 운동 기술을 기르고, 근력을 얻고, 체력을 키우기 위해 놀 필요가 있을 것이다."},{"n":5,"en":"As an adult, you would have no choice but to seek out food, do chores, find mates, and avoid being killed.","ko":"어른이 되면, 여러분은 먹을 것을 찾아나서고, 허드렛일을 하고, 짝을 찾고, 죽음을 피하는 일을 하지 않을 수 없을 것이다."},{"n":6,"en":"You would probably also need and want to participate in important social rituals like dancing.","ko":"여러분은 아마도 춤과 같은 중요한 사회적 의식에도 참여할 필요가 있을 것이고, 참여하고 싶을 것이다."},{"n":7,"en":"But whenever energy is scarce, as it usually was, any gratuitous physical activity would reduce how much energy you could devote to survival and reproduction.","ko":"하지만 보통 그랬듯이, 에너지가 부족할 때는 언제든지, 불필요한 신체 활동은 어떤 것이라도 여러분이 생존과 번식에 들일 수 있는 에너지의 양을 감소시킬 것이다."},{"n":8,"en":"No sensible adult hunter-gatherer would waste five hundred calories running five miles just for kicks.","ko":"분별 있는 어른 수렵 채집인은 누구도 단지 재미로 5마일을 달리며 500칼로리를 허비하지는 않을 것이다."}]},{"id":"light13-03","unit":"light13","number":3,"title":"no.03","core":"인공조명은 바다거북의 산란을 방해하고 갓 부화한 새끼를 바다 반대쪽으로 이끈다.","flow":[{"label":"도입","sentences":"S1-2","text":"바다거북은 육지에 알을 낳고 암컷은 어두운 모래 해변이 필요하다","refs":[1,2]},{"label":"피해","sentences":"S3-4","text":"해안이 다 밝으면 나쁜 곳이나 바다에 알을 낳아 새끼가 죽는다","refs":[3,4]},{"label":"까닭","sentences":"S5-6","text":"새끼는 가장 밝은 빛을 좇는데 뭍의 불빛이 달빛을 대신한다","refs":[5,6]},{"label":"해결","sentences":"S7","text":"밤에 불을 끄거나 거북이에게 거의 보이지 않는 조명을 쓴다","refs":[7]}],"structure":[{"title":"문제 — 빛 공해","text":"밝은 해안은 산란지를 뺏고, 뭍의 불빛이 달빛을 대신해 새끼를 위험으로 이끈다"},{"title":"해결 — 조명 관리","text":"밤에 불을 끄거나 거북이에게 거의 보이지 않는 '거북이에게 안전한' 조명을 쓴다"}],"key_sentence_en":"Artificial light disrupts sea turtle nesting and misleads hatchlings away from the ocean.","diagram":{"kind":"branches","title":"해안 인공조명의 두 피해","items":[{"head":"공통 출발 · 밤의 인공조명","body":"어두운 해변을 필요로 하는 바다거북의 자연스러운 신호를 가림","refs":[2,3,5,6]},{"head":"성체 암컷","body":"알 낳기를 포기하거나 불리한 곳에 산란","refs":[2,3,4]},{"head":"부화한 새끼","body":"달빛 대신 육지의 밝은 불빛을 따라 바다 반대쪽으로 이동","refs":[5,6]}],"takeaway":"해결은 야간 소등 또는 거북에게 거의 보이지 않는 조명을 쓰는 것이다 · S7"},"image":"../../assets/gyeonghae2-light13-03-turtles-six-panel.webp","image_alt":"어두운 해변을 찾는 성체, 밝은 인공조명에 방향을 돌리는 성체, 달빛을 따라 바다로 향하는 새끼, 육지 조명에 오도되는 새끼, 도로·울타리·포식자 위험, 소등과 거북에게 안전한 조명 해결의 여섯 장면","image_caption":"S1-S7 · 인공조명은 성체의 산란과 새끼의 방향 찾기를 방해하며, 야간 소등과 거북에게 거의 보이지 않는 조명이 해결책이다.","blocking_vocab":[{"word":"hatchling","meaning":"막 부화한 새끼"},{"word":"inland","meaning":"내륙 쪽에"},{"word":"light pollution","meaning":"빛 공해"}],"checks":[{"type":"핵심","q":"해안의 인공조명이 바다거북에게 주는 피해는?","choices":["산란을 방해하고 새끼를 바다 반대쪽으로 이끌 수 있다.","언제나 새끼를 안전하게 바다로 이끈다."],"answer":0,"why":"S2~3은 산란 방해, S5~6은 새끼의 방향 착오를 설명한다.","refs":[2,3,5,6]},{"type":"인과 근거","q":"새끼 거북이 육지 쪽 조명으로 향하는 까닭은?","choices":["달빛이 항상 육지 안쪽을 비추기 때문에","가장 밝은 빛을 좇는 성향이 인공조명에 의해 오도되기 때문에"],"answer":1,"why":"S5~6은 자연 상태의 달빛과 인공조명의 차이를 설명한다.","refs":[5,6]},{"type":"변형 탐지","q":"S7의 해결책과 일치하는 것은?","choices":["Turn off lights at night or use lighting nearly invisible to turtles.","Make beach lights brighter so turtles can see inland routes."],"answer":0,"why":"S7은 소등 또는 거북이에게 거의 보이지 않는 조명을 제시한다.","refs":[7]}],"easy_story":"어미 바다거북은 어두운 모래 해변에 알을 낳아야 합니다. 갓 태어난 새끼는 밝은 쪽을 따라 바다로 가는데, 육지의 인공조명이 달빛보다 두드러지면 반대쪽으로 갈 수 있어요. 밤의 불빛을 줄이거나 거북에게 덜 보이는 조명을 쓰자는 이유입니다.","sentences":[{"n":1,"en":"Light pollution is a major problem for nesting sea turtles, which lay their eggs on land because the embryos breathe through the permeable shells.","ko":"빛 공해는 산란 활동을 하는 바다거북에게 주요한 문제인데, 바다거북은 배아가 투과성 껍질을 통해 숨을 쉬기 때문에 육지에서 알을 낳는다."},{"n":2,"en":"Females need dark, sandy beaches for their nests, and will go elsewhere if there are bright lights from beach resorts, street lights, or housing.","ko":"암컷은 둥지를 위해 어두운 모래 해변이 필요하며 해변 리조트, 가로등 또는 주택에서 나오는 밝은 불빛이 있으면 다른 곳으로 갈 것이다."},{"n":3,"en":"If a whole stretch of coastline is illuminated, they may lay their eggs in inferior habitats or even deposit their eggs at sea, where their offspring will die.","ko":"해안선 전체에 불빛이 비치면, 그것은 열등한 서식지에 알을 낳거나 심지어 바다에 알을 낳을 수도 있는데, 그곳에서는 새끼가 죽을 것이다."},{"n":4,"en":"Such problems may be the reason for the reduction in sea turtle populations.","ko":"그러한 문제가 바다거북 개체 수 감소의 원인일 수도 있다."},{"n":5,"en":"Scientists believe that hatchlings move toward the brightest light.","ko":"과학자들은 갓 부화한 바다거북이 가장 밝은 빛을 향해 이동한다고 믿는다."},{"n":6,"en":"In natural conditions, this will be moonlight shining on the ocean, but if there is artificial lighting inland, the hatchlings wander toward that and get run over by traffic, eaten by predators, or caught in fencing.","ko":"자연 상태에서 이것은 바다 위로 비치는 달빛이겠지만, 뭍에 인공조명이 있으면 갓 부화한 바다거북은 그쪽을 향해 헤매다가 차에 치이거나 포식자에 잡아먹히거나 울타리에 걸린다."},{"n":7,"en":"Solutions include getting people and businesses to turn off lights at night or use \"turtlesafe\" lighting, which is virtually invisible to turtles.","ko":"해결책에는 사람과 사업체가 밤에 조명을 끄게 하거나, '거북이에게 안전한'조명, 즉 거북이에게 거의 보이지 않는 것을 사용하게 하는 것이 포함된다."}]},{"id":"light13-04","unit":"light13","number":4,"title":"no.04","core":"같은 비행을 저질러도 사회의 반응이 다르면 두 집단의 삶의 경로가 갈린다.","flow":[{"label":"도입","sentences":"S1-4","text":"일탈에 사람들이 반응하는데 그 반응이 무엇에 달렸는지 묻는다","refs":[1,2,3,4]},{"label":"연구","sentences":"S5","text":"Chambliss 가 같은 고등학교 두 비행 집단으로 그 질문을 살핀다","refs":[5]},{"label":"발견","sentences":"S6","text":"둘 다 심각한 비행을 했는데 한쪽은 성자, 다른 쪽은 망나니로 여겨졌다","refs":[6]},{"label":"전개","sentences":"S7-8","text":"그 반응이 망나니들을 감옥과 저임금 일자리로 묶어 두었다","refs":[7,8]},{"label":"결론","sentences":"S9","text":"반대로 성자들은 명망 있고 보수 높은 자리로 이어지는 길에 올랐다","refs":[9]}],"structure":[{"title":"Roughnecks — 망나니","text":"같은 비행이지만 부정적으로 인식되어 그 행동에 묶이고 감옥·저임금으로 이어졌다"},{"title":"Saints — 성자","text":"같은 비행이지만 좋게 인식되어 감옥을 피하고 명망 있는 자리로 나아갔다"}],"key_sentence_en":"Different social reactions can push similar delinquents toward sharply different life courses.","blocking_vocab":[{"word":"deviance","meaning":"일탈"},{"word":"delinquent","meaning":"비행 청소년"},{"word":"prestige","meaning":"명망·위신"}],"checks":[{"type":"핵심","q":"두 비행 집단의 삶이 달라진 핵심 요인은?","choices":["비슷한 비행을 바라보는 주변 사람들의 반응이 달라서","두 집단의 행위가 완전히 달라서"],"answer":0,"why":"S6은 두 집단 모두 비행을 했다고 하고 S8~9는 다른 사회적 반응과 결과를 보여 준다.","refs":[6,8,9]},{"type":"대조 근거","q":"'망나니' 집단에 대한 사회적 반응은 어떤 결과로 이어졌는가?","choices":["명망과 고임금 일자리로 곧바로 이어졌다.","감옥 또는 저임금 일자리로 이어질 행동에 묶였다."],"answer":1,"why":"S8의 roughnecks에 대한 결과다. S9는 saints를 대조한다.","refs":[8,9]},{"type":"변형 탐지","q":"S6의 두 집단에 관한 내용과 일치하는 것은?","choices":["Only the roughnecks committed serious delinquent acts.","Both groups committed serious delinquent acts but were perceived differently."],"answer":1,"why":"S6의 although both groups와 one ... saints, the other ... roughnecks를 확인한다.","refs":[6]}],"easy_story":"두 학생 집단 모두 심각한 비행을 했습니다. 그런데 주변은 한쪽을 ‘성자’, 다른 쪽을 ‘망나니’로 보았어요. 사회가 붙인 이름과 반응이 이후의 기회와 대우를 다르게 만들 수 있습니다. 글은 처음 행동만이 아니라 그 행동에 대한 사회의 반응을 함께 보라는 이야기입니다.","diagram":{"kind":"branches","title":"같은 반복적 비행, 다른 사회의 반응","items":[{"head":"공통 출발 · 반복적 비행","body":"두 집단 모두 심각하고 반복적인 비행을 저질렀다.","refs":[6]},{"head":"망나니로 여겨진 집단","body":"부정적 반응이 행동 지속에 영향을 주었고, 나중에 감옥 또는 저임금 일자리로 이어졌다.","refs":[6,8]},{"head":"성자로 여겨진 집단","body":"호의적 반응은 감옥을 피하고 명망 있는 일자리로 가는 삶의 경로를 도왔다.","refs":[6,9]}],"takeaway":"연구가 주목한 차이는 사회적 인식과 반응이다. 서로 다른 삶의 경로를 필연적인 결과로 단정하지 않는다 · S6~9"},"sentences":[{"n":1,"en":"When people deviate from what is expected of them, other people react.","ko":"사람들이 자신들에게 기대되는 바에서 일탈할 때, 다른 사람들은 반응한다."},{"n":2,"en":"But on what do their reactions depend?","ko":"하지만 그들의 반응은 무엇에 달려 있는가?"},{"n":3,"en":"Do they depend simply on the nature of the deviance itself, or is more involved?","ko":"그것은 단순히 일탈 그 자체의 특성에 달려 있는가 아니면 더 많은 것이 관련되어 있을까?"},{"n":4,"en":"If so, what sorts of things might be involved in their reactions?","ko":"그렇다면 어떤 종류의 것들이 그들의 반응과 관련되어 있을 수 있는가?"},{"n":5,"en":"It is these fascinating questions that William Chambliss examines in his study of two groups of delinquents in the same high school.","ko":"William Chambliss가 같은 고등학교의 두 비행 청소년 집단에 관한 그의 연구에서 조사하는 것이 바로 이 매우 흥미로운 질문들이다."},{"n":6,"en":"He found that although both groups were involved in serious and repetitive delinquent acts, one was perceived as a group of saints, while the other was viewed as a bunch of roughnecks.","ko":"그는 두 집단 다 심각하고 반복적인 비행 행위에 가담했음에도 불구하고, 한 집단은 성자 집단으로 인식되었고, 반면 다른 집단은 망나니 집단으로 여겨졌다는 사실을 발견했다."},{"n":7,"en":"After analyzing what influenced people's perceptions, and hence their reactions to the boys, Chambliss examines the far-reaching effects of those reactions.","ko":"무엇이 사람들의 인식과 그리하여 소년들에 대한 그들의 반응에 영향을 미쳤는지 분석한 후에 Chambliss는 그 반응이 장래에까지 미치는 영향을 조사한다."},{"n":8,"en":"He indicates that in the case of the roughnecks, people's reactions helped lock the boys into behaviors that continued after high school, eventually leading to prison or to low-paying jobs.","ko":"그는 망나니들의 경우, 사람들의 반응이 그 소년들을 고등학교 이후에도 계속되는 행동에 묶어 두는 데 일조하여, 결국 그들이 감옥에 가거나 저임금 일자리를 갖게 되었다고 지적한다."},{"n":9,"en":"In contrast, social reactions to the saints helped to set them on a life course that meant not only staying out of prison but also entering well-paying positions of prestige.","ko":"반면에, 성자들에 대한 사회적 반응은 그들이 감옥에 가는 일이 없을 뿐만 아니라, 명망이 있는 높은 보수를 받는 자리에 진입하는 것을 의미하는 삶의 경로에 들어가도록 도왔다."}]}]},{"id":"light14","label":"수특라이트 영어 14과","scope":"문단 요약","passages":[{"id":"light14-01","unit":"light14","number":1,"title":"no.01","core":"주당 1시간 빠르게 걷기부터 우울증 예방 효과가 나타나며, 심혈관 운동 2~6시간이 최적 범위이고 6시간을 넘겨도 추가 예방 효과는 없어 보인다.","flow":[{"label":"물음 전환","sentences":"S1~2","text":"얼마나 많이 해야 하느냐보다, 얼마나 적게 해도 예방에 도움이 되는지 묻는다.","refs":[1,2]},{"label":"시작의 이득","sentences":"S3","text":"아무것도 안 하다가 조금이라도 움직이기 시작한 사람이 가장 크게 얻는다.","refs":[3]},{"label":"최적 범위","sentences":"S4~6","text":"주당 심혈관 운동 2~6시간이 최적이며 대부분 연구는 2시간에 더 가깝다.","refs":[4,5,6]},{"label":"상한","sentences":"S7","text":"주당 6시간을 넘겨도 추가적인 예방 효과는 없어 보인다.","refs":[7]}],"structure":[{"title":"최소 — 주당 1시간부터","text":"빠르게 걷기 한 시간만으로도 어느 정도 예방 효과가 있으며, 아무것도 하지 않다가 움직이기 시작한 사람이 가장 크게 얻는다."},{"title":"최적·상한 — 심혈관 운동 2~6시간","text":"여러 연구는 주당 2~6시간을 최적 범위로 제시하고, 6시간을 넘긴 운동에는 추가적인 예방 효과가 없어 보인다고 말한다."}],"key_sentence_en":"A minimum of one hour of brisk walking weekly induces protective effects against depression, with two to six hours of cardiovascular exercise per week offering prime protection.","blocking_vocab":[{"word":"brisk walking","meaning":"빠르게 걷기"},{"word":"cardiovascular exercise","meaning":"심혈관 운동"},{"word":"additional protection","meaning":"추가 예방 효과"}],"checks":[{"type":"핵심","q":"우울증 예방을 위한 운동량에 관한 연구 결과는?","choices":["주당 1시간부터 효과가 있고 2~6시간이 최적 범위다.","주당 6시간을 넘겨야만 첫 효과가 나타난다."],"answer":0,"why":"S2는 최소 효과, S5~7은 최적 범위와 추가 효과의 한계를 말한다.","refs":[2,5,6,7]},{"type":"수치 근거","q":"주당 6시간을 넘긴 운동은 어떤 추가 효과를 보이는가?","choices":["예방 효과가 반드시 두 배로 늘어난다.","추가적인 우울증 예방 효과가 없어 보인다."],"answer":1,"why":"S7의 no additional protection을 확인한다.","refs":[7]},{"type":"변형 탐지","q":"S3의 이득이 가장 큰 사람은?","choices":["Those who move from doing nothing to doing something.","Those who move from doing something to doing nothing."],"answer":0,"why":"S3의 go from doing nothing to doing something을 확인한다.","refs":[3]}],"easy_story":"이 글의 질문은 ‘운동을 많이 해야만 도움이 될까?’입니다. 소개된 연구에서는 아무것도 안 하던 사람이 조금이라도 시작할 때 큰 차이가 났고, 주당 빠른 걷기 1시간도 예방 효과와 관련됐습니다. 글이 제시한 최적 범위는 주당 2~6시간이며, 6시간을 넘는다고 추가 효과가 계속 커지지는 않는다고 합니다.","diagram":{"kind":"dose","title":"주당 운동 시간과 우울증 예방 효과","items":[{"head":"1시간","body":"빠르게 걷기만 해도 어느 정도 예방 효과","refs":[2]},{"head":"2~6시간","body":"심혈관 운동의 최적 범위. 많은 연구는 2시간 쪽에 더 가까움","refs":[5,6]},{"head":"6시간 초과","body":"추가적인 예방 효과는 없어 보임. 기존 효과가 사라진다는 뜻은 아님","refs":[7]}],"takeaway":"가장 큰 차이는 아무것도 하지 않다가 움직이기 시작할 때 · S3"},"sentences":[{"n":1,"en":"Instead of asking how much exercise is needed to protect against depression, we should actually be asking how little.","ko":"우울증을 예방하기 위해 얼마나 많은 운동이 필요한지를 묻기보다는, 실제로는 얼마나 적은 운동이 필요한지를 물어야 한다."},{"n":2,"en":"The short answer is that just one hour of brisk walking per week has been proven to give some level of protection.","ko":"간단한 답은, 일주일에 단 1시간만 활기 있게 걷는 것만으로도 어느 정도 예방 효과가 있다는 것이 입증되었다는 것이다."},{"n":3,"en":"If you look into the research, what's striking is that, in children as well as adults, those who have the most to gain are those who go from doing nothing to doing something ─ for example, starting to cycle to work or walk to school.","ko":"연구를 살펴보면, 인상적인 점은 어른과 마찬가지로 어린이에게도 가장 큰 효과를 얻는 사람들은 아무것도 하지 않던 상태에서 무언가를 시작한 사람들, 예를 들어 출근길에 자전거를 타거나 학교에 걸어가기 시작한 사람들이라는 것이다."},{"n":4,"en":"But more than that is of course even better, and so one might wonder what level is needed for maximal effects.","ko":"하지만, 그보다 더 많은 운동을 하면 물론 훨씬 더 좋고, 따라서 최대 효과를 위해 어느 정도 수준이 필요한지 궁금해질 수 있다."},{"n":5,"en":"A number of major, well-conducted studies suggest that between two and six hours of cardiovascular exercise per week is optimal.","ko":"잘 수행된 여러 주요 연구에 따르면, 일주일에 2시간에서 6시간의 심혈관 운동이 최적이라고 한다."},{"n":6,"en":"This is a wide range, but most studies lie closer to two hours than six.","ko":"이는 넓은 범위이지만, 대부분의 연구는 6시간보다 2시간 쪽에 더 가깝다."},{"n":7,"en":"More than six hours of exercise per week appears to offer no additional protection.","ko":"일주일에 6시간을 초과하는 운동은 추가적인 예방 효과를 제공하지 않는 것으로 보인다."}]},{"id":"light14-02","unit":"light14","number":2,"title":"no.02","core":"성격의 일관성은 진화적으로 부적응처럼 보이지만 개체의 행동 가소성에 한계가 있음을 말해 준다.","flow":[{"label":"관찰과 의문","sentences":"S1~2","text":"개체의 행동이 상황과 시간에 걸쳐 일관되는 성격은 진화적으로 부적응처럼 보인다.","refs":[1,2]},{"label":"위험 사례","sentences":"S3~4","text":"늘 대담한 개체는 포식 위험이 높을 때도 같은 행동을 해 최적 전략에서 벗어날 수 있다.","refs":[3,4]},{"label":"결론","sentences":"S5","text":"그럼에도 성격이 지속된다는 것은 행동을 바꿀 수 있는 폭에 한계가 있음을 뜻한다.","refs":[5]}],"structure":[{"title":"최적의 개체","text":"대담해야 할 때만 대담하고 상황이 바뀌면 행동을 조정한다"},{"title":"성격을 가진 개체","text":"위험이 있든 없든 늘 같게 행동한다 — 바꿀 수 있는 폭 자체가 좁다"}],"key_sentence_en":"From an evolutionary perspective, personality may be harmful, as optimal individuals should adapt their behavior to changing circumstances, yet the persistence of personality suggests a limit to behavioral flexibility.","blocking_vocab":[{"word":"maladaptive","meaning":"적응에 불리한"},{"word":"predation risk","meaning":"포식 위험"},{"word":"behavioral plasticity","meaning":"행동 가소성"}],"checks":[{"type":"핵심","q":"성격의 일관성이 진화적으로 흥미로운 까닭은?","choices":["개체가 어떤 상황에서든 완벽하게 행동을 바꾸기 때문에","상황이 달라도 같은 행동을 하므로 최적 전략과 어긋날 수 있어서"],"answer":1,"why":"S2~5는 행동의 일관성과 상황별 최적 전략의 불일치를 설명한다.","refs":[2,3,4,5]},{"type":"사례 근거","q":"항상 대담한 개체가 부담하는 위험은?","choices":["포식 위험이 반드시 사라진다.","포식 위험이 높아질 수 있다."],"answer":1,"why":"S4의 elevated risk of predation이다.","refs":[4]},{"type":"변형 탐지","q":"S5의 행동 가소성에 관한 결론과 일치하는 것은?","choices":["Personality means individuals have unlimited behavioral plasticity.","Personality means individuals are limited in behavioral plasticity."],"answer":1,"why":"S5의 limited in their behavioral plasticity를 확인한다.","refs":[5]}],"easy_story":"동물은 상황에 맞춰 행동을 바꾸면 늘 유리할 것 같죠. 하지만 어떤 개체는 위험할 때도 계속 대담하게 행동합니다. 이렇게 일관된 성격이 남아 있다는 것은 행동을 마음대로 무한히 바꿀 수 없다는 단서가 됩니다. ‘성격이 좋다/나쁘다’보다 변화의 한계가 핵심입니다.","diagram":{"kind":"behavior","title":"포식 위험은 바뀌는데, 행동은 그대로?","items":[{"head":"포식 위험 없음","body":"특히 활동적인 개체","refs":[5]},{"head":"포식 위험 있음","body":"같은 개체가 여전히 가장 활동적 → 포식 위험 상승 가능","refs":[4,5]},{"head":"상황에 맞는 최적 전략","body":"대담함이 유리할 때만 대담하고, 상황이 바뀌면 행동을 조절","refs":[4]}],"takeaway":"일관된 성격은 상황에 맞춰 행동을 바꾸는 가소성이 제한되어 있음을 보여 줍니다 · S2~5"},"sentences":[{"n":1,"en":"Consistent individual differences in behavior within populations, also known as personality, are attracting the attention of many evolutionary biologists.","ko":"개체군 내에서 행동에 있어서의 일관된 개인적 차이는, 성격이라고도 알려져 있는데, 많은 진화 생물학자의 관심을 끌고 있다."},{"n":2,"en":"One of the reasons why personality is interesting from an evolutionary perspective is that behaving in a consistent way across a variety of contexts or through time seems maladaptive.","ko":"진화론적 관점에서 성격이 흥미로운 이유 중 하나는 다양한 상황이나 시간의 흐름에 걸쳐 일관된 방식으로 행동하는 것이 부적응으로 보이기 때문이다."},{"n":3,"en":"At some point, a mismatch between an individual's behavior and the optimal strategy for a given situation may be expected.","ko":"어떤 시점에서는 개체의 행동과 주어진 상황에 적합한 최적의 전략 사이에 불일치가 예상될 수도 있다."},{"n":4,"en":"For example, an individual that is consistently uninhibited and bold will at some point incur an elevated risk of predation; the optimal individual should be bold only when it makes sense to be bold, and adjust its behavior when the situation changes.","ko":"예를 들어, 일관되게 억제되지 않고 대담한 개체는 어느 시점에서는 높은 포식 위험을 초래할 것이며, 최적의 개체는 대담해야 할 때만 대담해야 하고, 상황이 바뀌면 자신의 행동을 조정해야 한다."},{"n":5,"en":"However, personality implies that individuals are limited in their behavioral plasticity; the individuals that are, for example, particularly active in the absence of predation risk are also those that are most active in the presence of predation risk.","ko":"그러나 성격은 개체가 행동 가소성에 있어 한계가 있다는 것을 함축하는데, 예를 들어 포식 위험이 없을 때 특히 활동적인 개체들은 포식 위험이 있을 때도 역시 가장 활동적인 개체들이다."}]},{"id":"light14-03","unit":"light14","number":3,"title":"no.03","core":"사람의 정체성은 무엇을 사느냐가 아니라 무슨 일을 하느냐로 형성되어, 일자리 상실이 사회를 흔든다.","flow":[{"label":"새 관점","sentences":"S1~2","text":"불평등뿐 아니라 사람들이 자신을 어떻게 보는지도 경제에서 중요하다.","refs":[1,2]},{"label":"모형 대조","sentences":"S3~4","text":"표준 모형은 일을 소비를 위한 소득 수단으로, 정체성 관점은 생산자로서의 자기 인식과 연결한다.","refs":[3,4]},{"label":"사회적 결과","sentences":"S5~6","text":"공장 일자리를 잃은 사람에게 싼 TV는 위로가 못 되고, 안정된 일자리 상실은 정치적 반발과 연결된다.","refs":[5,6]}],"structure":[{"title":"표준 경제 모형 — 소비를 위한 소득","text":"일의 목적을 소비에 쓸 소득을 얻는 것으로 본다."},{"title":"정체성 경제학 — 생산자로서의 자기 인식","text":"많은 사람은 자신이 무엇을 만드는지로 정체성을 형성하므로, 공장 일자리를 잃었을 때 TV 가격 하락은 별 위로가 되지 않는다."}],"key_sentence_en":"According to economist George Akerlof's research on the economics of identity, many people's self-identity is centered on their jobs, so the loss of them can lead to an unstable society.","diagram":{"kind":"compare","title":"사람의 정체성을 보는 두 경제 관점","items":[{"head":"소비 중심 모형","body":"일은 소비할 소득을 얻는 수단이며, 값싼 상품이 위로가 될 수 있다고 봄","refs":[3,4,5]},{"head":"생산자 정체성","body":"무슨 일을 하는지가 자기 인식을 형성하므로 안정된 일자리 상실은 정체성 상실로 이어짐","refs":[3,4,5,6]}],"takeaway":"값싼 TV는 일자리와 생산자로서의 자긍심을 대신할 수 없다."},"image":"../../assets/gyeonghae2-light14-03-factory.webp","image_alt":"문 닫힌 공장 앞에 선 노동자와 근처의 값이 내려간 텔레비전 상점","image_caption":"S4~5: 값싼 소비재가 일자리와 생산자로서의 정체성 상실을 메우지는 못합니다.","blocking_vocab":[{"word":"identity","meaning":"정체성"},{"word":"cold comfort","meaning":"위로가 되지 않는 일"},{"word":"backlash","meaning":"반발"}],"checks":[{"type":"핵심","q":"정체성 경제학에서 일자리 상실이 큰 문제인 이유는?","choices":["일은 소비할 소득만 주기 때문에","사람은 무엇을 만드는지로 자신을 규정하기도 하기 때문에"],"answer":1,"why":"S3의 표준 모형을 S4~5의 정체성 관점이 보완한다.","refs":[3,4,5]},{"type":"대조 근거","q":"일자리를 잃은 사람에게 TV 가격 인하가 위로가 되지 않는 까닭은?","choices":["일이 정체성의 일부인데 값싼 소비재는 그 상실을 메우지 못해서","TV 가격 인하는 반드시 일자리를 더 많이 없애서"],"answer":0,"why":"S4의 생산 중심 정체성이 S5의 cold comfort를 설명한다.","refs":[4,5]},{"type":"변형 탐지","q":"S4의 정체성에 관한 설명과 일치하는 것은?","choices":["People's identity can only centre on what they buy.","People's identity can centre on what they produce rather than consume."],"answer":1,"why":"S4의 produce rather than consume을 확인한다.","refs":[4]}],"easy_story":"경제를 숫자와 소비만으로 보면 일자리는 물건을 살 돈을 버는 수단입니다. 하지만 사람은 처음 만난 상대에게 무엇을 사는지보다 무슨 일을 하는지 묻습니다. 일이 자기 정체성의 일부이기 때문에, 안정된 일자리를 잃는 문제는 소득만의 문제가 아니라는 글입니다.","sentences":[{"n":1,"en":"The rise in inequality is not the only cause for economic concern.","ko":"불평등의 증가가 경제적 우려의 유일한 원인은 아니다."},{"n":2,"en":"Research by economist George Akerlof on the economics of identity has highlighted the importance of considering how people perceive themselves.","ko":"경제학자 George Akerlof의 정체성 경제학에 관한 연구는 사람들이 자기 자신을 인식하는 방식을 고려하는 것의 중요성을 강조해 왔다."},{"n":3,"en":"In the standard economic model, the only point of working is to earn income to consume.","ko":"표준 경제 모형에서 일의 유일한 목적은 소비하기 위해 수입을 얻는 것이다."},{"n":4,"en":"But the economics of identity reminds us that many people's identity is centred around what they produce, rather than what they consume.","ko":"그러나 정체성 경제학은 우리에게 많은 사람들의 정체성이 그들이 소비하는 것보다는 생산하는 것을 중심으로 형성된다는 점을 일깨워 준다."},{"n":5,"en":"We are more likely to ask someone we've just met 'What do you do?' than 'What do you buy?' So when the twin forces of technology and trade have taken away factory jobs in advanced nations, it's cold comfort to tell the struggling middle class that televisions are getting cheaper.","ko":"우리는 방금 만난 사람에게 '무엇을 사세요?'보다는 '무슨 일을 하세요?'라고 물을 가능성이 더 크다. 그래서 기술과 무역이라는 한 쌍의 힘이 선진국의 공장 일자리를 없애 버렸을 때, 고군분투하는 중산층에게 텔레비전이 더 저렴해지고 있다고 말하는 것은 달갑지 않은 위로이다."},{"n":6,"en":"The rise of populist politicians is partly a backlash against the loss of secure working-class jobs, and a reminder of the importance of low unemployment to a stable society.","ko":"대중 영합주의 정치인의 부상은 부분적으로는 안정적인 노동자 계층 일자리의 상실에 대한 반발이며, 안정적인 사회에 있어 낮은 실업률이 갖는 중요성을 일깨워 주는 것이다."}]},{"id":"light14-04","unit":"light14","number":4,"title":"no.04","core":"언론 매체에서 배운 고정관념은 기대를 만들고 그 기대가 스스로를 확증하는 예언이 된다.","flow":[{"label":"도입","sentences":"S1-2","text":"고정관념은 개인 경험이 아니라 언론 매체의 반복된 묘사에서 온다","refs":[1,2]},{"label":"전개","sentences":"S3","text":"그 묘사가 집단 구성원을 단순하고 단일한 개념으로 축소한다","refs":[3]},{"label":"주제","sentences":"S4-5","text":"고정관념은 우리도 모르게 켜져 기대를 만들고 자기 충족적 예언을 부른다","refs":[4,5]},{"label":"결론","sentences":"S6-7","text":"결국 기대를 확증하는 행동만 보여 호의적인 사람도 무례해 보인다","refs":[6,7]}],"structure":[{"title":"원인 — 되풀이되는 묘사","text":"언론 매체가 집단을 단일한 개념으로 축소해 보여 준다"},{"title":"결과 — 자기 충족적 예언","text":"기대가 우리도 모르게 켜지고, 그 기대에 따라 행동해 기대대로의 모습만 보게 된다"}],"key_sentence_en":"The media repeatedly presents simplified images of social groups, resulting in self-fulfilling expectations, which is likely to distort the way we understand these groups' actions.","blocking_vocab":[{"word":"stereotype","meaning":"고정관념"},{"word":"trigger","meaning":"촉발하다"},{"word":"self-fulfilling prophecy","meaning":"자기 충족적 예언"}],"checks":[{"type":"핵심","q":"고정관념이 '자기 충족적 예언'이 되는 과정은?","choices":["기대에 따라 행동하고 기대에 맞는 모습만 보게 된다.","언론의 묘사는 어떤 기대에도 영향을 주지 않는다."],"answer":0,"why":"S4~7은 고정관념의 촉발, 기대, 확증을 연결한다.","refs":[4,5,6,7]},{"type":"인과 근거","q":"친절하게 행동하는 사람도 무례해 보일 수 있는 까닭은?","choices":["상대가 무례할 것이라는 기대가 해석에 작용해서","친절한 행동이 본문에서 실제로 무례하다고 정의돼서"],"answer":0,"why":"S6~7은 실제 행동과 상관없이 기대를 확증해 본다고 한다.","refs":[6,7]},{"type":"변형 탐지","q":"S6의 지각에 관한 설명과 일치하는 것은?","choices":["We see only behavior that disproves our expectation.","We may see behavior that confirms our expectation even when it is absent."],"answer":1,"why":"S6의 whether or not it is actually present를 확인한다.","refs":[6]}],"easy_story":"어떤 집단을 매체가 늘 같은 모습으로 그리면 사람들은 그것을 사실처럼 기대할 수 있습니다. 그러면 실제 사람을 만날 때도 그 기대에 맞는 행동만 더 눈에 들어와요. 결국 처음의 고정관념이 맞는 것처럼 느껴지는 나쁜 고리가 생긴다는 설명입니다.","diagram":{"kind":"steps","title":"고정관념이 스스로 확인되는 고리","items":[{"head":"매체 묘사","body":"한 집단의 모습을 단순화해 반복","refs":[1,2,3]},{"head":"기대 형성","body":"대상을 만나면 고정관념이 켜짐","refs":[4,5]},{"head":"기대에 따라 행동","body":"상대가 그렇게 행동할 것이라 예상하고, 그 기대에 따라 대함","refs":[5]},{"head":"확인된 것처럼 보임","body":"실제로 그런 행동이 없어도 기대에 맞는 모습만 보고, 친절도 무례하게 해석할 수 있음","refs":[6,7]}],"takeaway":"고정관념에 따른 기대가 상대를 대하는 방식과 해석에 영향을 준다는 뜻이지, 상대가 실제로 무례하다는 뜻은 아니다 · S5~7"},"sentences":[{"n":1,"en":"We learn many stereotypes from the media, rather than our personal experiences.","ko":"우리는 많은 고정관념을 우리 개인적인 경험보다는 언론 매체로부터 배운다."},{"n":2,"en":"Media offerings repeatedly present viewers with depictions of persons from all races and ethnicities, people living in poverty, and older adults that leave impressions of what they are like.","ko":"언론 매체가 제공하는 내용은 각 인종과 민족 출신의 사람들, 빈곤 속에 사는 사람들, 그리고 노인들에 대한 묘사를 반복적으로 시청자에게 보여주며, 그들이 어떤 사람인지에 대한 인상을 남긴다."},{"n":3,"en":"Too often, these depictions devalue and reduce members belonging to these groups to a simple and single concept.","ko":"이러한 묘사는 너무 자주, 이 집단에 속한 구성원들을 평가 절하하고 단순하고 단일한 개념으로 축소한다."},{"n":4,"en":"Then, when we interact with persons from these social categories, stereotypes are triggered without our even being aware of it.","ko":"그러면 우리가 이러한 사회적 범주에 속한 사람들과 상호작용할 때, 고정관념이 우리가 인식조차 못 한 채로 작동된다."},{"n":5,"en":"These stereotypes generate in us an expectation of how a member of the group will behave; when we then act on those expectations, we precipitate a self-fulfilling prophecy.","ko":"이러한 고정관념은 집단의 구성원이 어떻게 행동할 것인가에 대한 기대를 우리 안에서 만들어 내어, 우리가 그러한 기대에 따라 행동할 때, 우리는 자기 충족적 예언을 초래하게 된다."},{"n":6,"en":"We see the behavior that confirms our expectation, whether or not it is actually present.","ko":"우리는 그 행동이 실제로 존재하든 아니든 간에 그 기대를 확증하는 행동을 본다."},{"n":7,"en":"Thus, if we assume someone is rude, to us they will appear rude, even when they act benevolently.","ko":"그래서, 우리가 누군가가 무례하다고 가정하면, 그들이 호의적으로 행동하더라도 그들은 우리에게 무례해 보인다."}]}]},{"id":"light15","label":"수특라이트 영어 15과","scope":"장문 독해","passages":[{"id":"light15-01","unit":"light15","number":1,"title":"p100 · no.01~02","core":"인간 행동은 불확실한 미래에 대한 판단과 추측에 기초하므로 오류의 가능성을 포함한다.","flow":[{"label":"주장과 논거","sentences":"S1–4","text":"미래를 완전히 안다면 행동할 필요가 없다. 행동의 존재는 미래가 불확실함을 뜻한다.","refs":[1,4]},{"label":"불확실성의 근원","sentences":"S5–7","text":"인간의 선택은 변하며, 자연 현상에 대한 지식도 충분하지 않다.","refs":[5,7]},{"label":"추정과 확실성","sentences":"S8–11","text":"행위자는 목표 달성을 예상하지만, 그 판단은 확실한 지식이 아닌 추측이다.","refs":[8,11]},{"label":"오류 가능성","sentences":"S12–13","text":"행동을 마친 뒤에야 수단이 목적에 부적절했음을 알 수 있다.","refs":[12,13]}],"structure":[{"title":"원인","text":"미래의 인간 선택과 자연 현상을 완전히 예측할 수 없다."},{"title":"결과","text":"행동은 추측에 기초하며 오류의 가능성을 포함한다."}],"key_sentence_en":"Human action depends on uncertain judgments about the future and therefore always involves the possibility of error.","blocking_vocab":[{"word":"uncertainty","meaning":"불확실성"},{"word":"speculation","meaning":"추측"},{"word":"means","meaning":"수단"}],"checks":[{"type":"핵심","q":"인간 행동에 오류 가능성이 늘 있는 까닭은?","choices":["미래를 완전히 알지 못해 판단과 추측에 따라 행동하기 때문에","미래의 인간 선택을 언제나 정확히 알 수 있기 때문에"],"answer":0,"why":"S4~7의 미래 불확실성이 S11~13의 추측과 오류 가능성으로 이어진다.","refs":[4,5,6,7,11,12,13]},{"type":"논리 근거","q":"글에 따르면 미래를 완전히 안다면 인간은 어떻게 되는가?","choices":["더 많은 추측을 하게 된다.","행동할 이유가 사라진다."],"answer":1,"why":"S3은 미래를 완전히 알면 어떤 행동도 상황을 바꿀 수 없으므로 행동하지 않는다고 한다.","refs":[3]},{"type":"변형 탐지","q":"S11~12의 관계와 일치하는 것은?","choices":["Actions are based on certain knowledge and therefore exclude error.","Actions are speculations about the future and therefore allow for error."],"answer":1,"why":"S11의 speculations와 S12의 possibility of error를 연결한다.","refs":[11,12]}],"easy_story":"우리가 무언가를 선택한다는 것은 결과를 아직 완전히 모른다는 뜻입니다. 미래의 사람들 선택도, 자연이 어떻게 변할지도 모두 알 수 없어요. 그래서 목표에 맞을 것이라고 ‘판단’해 수단을 고르지만, 결과가 나온 뒤에야 그 수단이 맞지 않았음을 알 수도 있습니다. 오류는 반드시 일어나는 일이 아니라 언제나 있는 가능성입니다.","diagram":{"kind":"uncertainty","title":"미래를 모르는 상태에서 왜 행동할까?","items":[{"head":"반대 가정 · 미래 완전 예측 → 행동 없음","body":"상황을 바꿀 수 없어 행동하지 않음","refs":[2,3]},{"head":"현실 · 행동함 → 미래 불확실","body":"행동한다는 사실은 미래가 불확실함을 뜻함","refs":[1,4]},{"head":"근원 ① 인간 선택 변화","body":"가치 판단과 생각이 바뀌어 선택을 예측할 수 없음","refs":[5,6,7]},{"head":"근원 ② 자연 지식 부족","body":"미래의 모든 전개를 알 만큼 지식이 충분하지 않음","refs":[5,6]},{"head":"목표에 맞게 수단 선택","body":"목표에 도달하리라 추측하지만 확실히 알지는 못함","refs":[8,9,10,11]},{"head":"행동 후 결과 확인","body":"선택한 수단이 맞지 않았음을 알게 될 수도 있음","refs":[12,13]}],"takeaway":"오류가 반드시 생긴다는 뜻은 아닙니다. 불확실한 미래를 추측하며 행동하므로 오류의 가능성이 항상 있다는 뜻입니다 · S11~13"},"sentences":[{"n":1,"en":"One fundamental implication derived from the existence of human action is the uncertainty of the future.","ko":"인간 행동의 존재로부터 비롯되는 한 가지 근본적인 함의는 '미래의 불확실성'이다."},{"n":2,"en":"This must be true because the contrary would completely deny the possibility of action.","ko":"이것은 사실일 수밖에 없는데, 왜냐하면 그 반대는 행동의 가능성을 완전히 부정할 것이기 때문이다."},{"n":3,"en":"If man knew future events completely, he would never act, since no act of his could change the situation.","ko":"만약 인간이 미래의 사건을 완전히 알고 있다면, 결코 어떤 행동도 하지 않을 것인데, 인간의 어떤 행동도 상황을 바꿀 수 없기 때문이다."},{"n":4,"en":"Thus, the fact of action signifies that the future is uncertain to the actors.","ko":"따라서 행동한다는 사실은 미래가 행위자에게 불확실하다는 것을 의미한다."},{"n":5,"en":"This uncertainty about future events stems from two basic sources: the unpredictability of human acts of choice, and insufficient knowledge about natural phenomena.","ko":"미래 사건에 대한 이러한 불확실성은 두 가지 기본적인 근원에서 비롯되는데, 인간의 선택 행동이 예측 불가능하다는 것과 자연 현상에 대한 지식이 불충분하다는 것이다."},{"n":6,"en":"Man does not know enough about natural phenomena to predict all their future developments, and he cannot know the content of future human choices.","ko":"인간은 자연 현상의 모든 미래 전개를 예측할 만큼 그것에 대해 충분히 알지 못하고, 미래의 인간 선택 내용을 알 수 없다."},{"n":7,"en":"All human choices are continually changing as a result of changing valuations and changing ideas about the most appropriate means of arriving at ends.","ko":"모든 인간의 선택은 변화하는 가치 판단과 목적을 달성하기 위한 가장 적절한 수단에 관한 변화하는 생각에 따라 계속 변화한다."},{"n":8,"en":"This does not mean, of course, that people do not try their best to estimate future developments.","ko":"물론 이것이 사람들이 미래의 전개를 추정하려고 최선을 다하지 않는다는 뜻은 아니다."},{"n":9,"en":"Indeed, any actor, when employing means, estimates that he will thus arrive at his desired goal.","ko":"실제로 어떤 행위자든 수단을 사용할 때, 그렇게 하면 자신이 원하는 목표에 도달할 것으로 추정한다."},{"n":10,"en":"But he never has certain knowledge of the future.","ko":"그러나 그는 결코 미래에 대한 확실한 지식을 갖고 있지 않다."},{"n":11,"en":"All his actions are of necessity speculations based on his judgment of the course of future events.","ko":"그의 모든 행동은 필연적으로 미래 사건의 전개에 대한 자신의 '판단'에 기초한 '추측'이다."},{"n":12,"en":"The omnipresence of uncertainty introduces the ever-present possibility of error in human action.","ko":"불확실성이 어디에나 존재한다는 사실은 인간 행동 속에 언제나 '오류'의 가능성이 있다는 점을 도입한다."},{"n":13,"en":"The actor may find, after he has completed his action, that the means have been inappropriate to the attainment of his end.","ko":"행위자는 자신의 행동을 완료한 후에야 그 수단이 자신의 목적 달성에 '부적절했음'을 알게 될 수도 있다."}]},{"id":"light15-02","unit":"light15","number":2,"title":"p102 · no.03~04","core":"서기관의 특권 보호가 배우기 쉬운 알파벳 문자가 받아들여지지 않은 한 이유였을 가능성이 있다.","flow":[{"label":"제한된 문해력","sentences":"S1–2","text":"문해력 습득에는 시간과 비용이 많이 드는 훈련이 필요했다.","refs":[1,2]},{"label":"특권의 보호","sentences":"S3–7","text":"서기관은 문해력을 권력의 기반으로 삼아 자신의 특별한 지위를 지키려 했다.","refs":[3,7]},{"label":"대안의 가능성","sentences":"S8–9","text":"소수의 기호만으로 글을 쓸 수 있는 알파벳 문자는 학습 부담을 줄일 수 있었다.","refs":[8,9]},{"label":"혁신 거부의 이유","sentences":"S10","text":"그러나 쉬운 문자 체계는 다른 사람들의 학습을 돕고 서기관의 특권을 위협했을 것이다.","refs":[10]}],"structure":[{"title":"일반인에게 주는 이점","text":"알파벳 문자를 쓰면 적은 수의 기호로 더 쉽게 글을 배울 수 있다."},{"title":"서기관에게 주는 위협","text":"문해력의 확산은 서기관이 누리던 특별한 지위를 약화시킬 수 있다."}],"key_sentence_en":"Scribes resisted simpler alphabetic writing because wider literacy would have threatened their privileged position.","diagram":{"kind":"steps","title":"쉽게 배울 수 있는 문자가 거부된 까닭","items":[{"head":"기존 문해력","body":"많은 전문 기호를 배우는 데 시간과 비용이 많이 들었음","refs":[1,2]},{"head":"서기관의 특권","body":"힘들게 얻은 문해력이 권력과 특별한 지위의 기반이 됨","refs":[3,7]},{"head":"쉬운 알파벳 대안","body":"적은 기호로 많은 말을 적을 수 있어 학습 부담을 낮춤","refs":[8,9]},{"head":"거부 동기","body":"다른 사람이 쉽게 배우면 서기관의 특권이 위협받기 때문에 수용하지 않았을 가능성","refs":[10]}],"takeaway":"알파벳이 어려워서가 아니라 쉬운 문자가 기존 전문가의 특권을 흔들 수 있어 거부됐을 가능성이다."},"image":"../../assets/gyeonghae2-light15-02-literacy-six-panel.webp","image_alt":"소수 엘리트에게만 허용된 문해력, 긴 서기관 훈련, 정보 특권의 보호, 다른 직업보다 높은 지위, 적은 기호의 쉬운 문자 대안, 대중의 접근을 막아 특권을 지키는 모습을 차례로 보여 주는 여섯 장면","image_caption":"S1–S10 · 어려운 훈련 → 서기관의 정보 특권 → 쉬운 문자 대안이 그 특별한 지위를 위협함","blocking_vocab":[{"word":"scribal class","meaning":"서기관 계급"},{"word":"literacy","meaning":"읽고 쓰는 능력"},{"word":"alphabetic writing","meaning":"알파벳 문자"}],"checks":[{"type":"핵심","q":"글에서 추정하는, 알파벳 문자가 받아들여지지 않은 이유는?","choices":["문해력의 보급이 서기관의 특권을 위협할 수 있어서","새 문자에 더 많은 기호가 필요해서"],"answer":0,"why":"S8의 probably는 추정임을 나타낸다. S3~4는 특권을 지키려는 태도, S9~10은 쉬운 문자 체계가 주는 위협을 말한다.","refs":[3,4,8,9,10]},{"type":"대조 근거","q":"알파벳 문자의 학습상 이점은?","choices":["수백 개의 전문 기호를 모두 익혀야 한다.","적은 수의 소리 기호로 어떤 단어든 쓸 수 있다."],"answer":1,"why":"S8~9에서 적은 기호로 단어를 쓰고 수백 개의 전문 기호를 대체할 수 있다고 한다.","refs":[8,9]},{"type":"변형 탐지","q":"S10의 서기관 지위에 관한 설명과 일치하는 것은?","choices":["Easier writing would have strengthened scribes' exclusive special status.","Easier writing would have threatened scribes' special status."],"answer":1,"why":"S10의 threatened their special status를 확인한다.","refs":[10]}],"easy_story":"옛 서기관은 읽고 쓰는 능력을 얻기 위해 오래 배웠고, 그 능력은 특별한 지위가 되었습니다. 적은 기호만 익혀도 쓸 수 있는 새 문자 체계가 널리 퍼지면 다른 사람도 쉽게 배울 수 있겠죠. 글은 그래서 서기관들이 자신의 특권을 지키려고 알파벳 문자를 꺼렸을 가능성을 말합니다. 확정 사실이 아니라 추정입니다.","sentences":[{"n":1,"en":"The ability to read and write was limited to a tiny fraction of the population for the first fifteen centuries after the invention of writing, for a number of reasons.","ko":"읽고 쓸 수 있는 능력은 문자 발명 후 처음 1,500년 동안 여러가지 이유로 인해 인구의 아주 작은 부분으로 국한되어 있었다."},{"n":2,"en":"Acquiring literacy required extensive training, which was time-consuming and expensive, and therefore available to only a small subset of the elite.","ko":"문해력을 습득하는 것은 광범위한 훈련이 필요했는데, 그것은 시간이 소요되고 비용이 많이 들었으며, 그래서 엘리트의 단지 일부 집단에게만 가능했다."},{"n":3,"en":"And the scribal class that emerged wanted to protect its privileged position as an information priesthood.","ko":"그리고 등장한 서기관 계급은 정보 사제직으로서 자신의 특권적 지위를 보호하기를 원했다."},{"n":4,"en":"It had no interest in making literacy easier to acquire and thus more widely accessible.","ko":"그 계급은 문해력을 습득하기 더 쉽게 하여 더 널리 이용 가능하도록 하는 데는 관심이 없었다."},{"n":5,"en":"Egyptian scribal-training texts emphasized the superiority of being a scribe over all other career choices, with titles like \"Do Not Be Soldier, Priest or Baker.\"","ko":"이집트의 서기관 훈련 문헌들은 \"군인, 사제, 혹은 제빵사가 되지 말라\"와 같은 표제로 다른 모든 직업보다 서기관이 되는 것의 우월성을 강조했다."},{"n":6,"en":"One of the texts begins: \"Set thine (your) heart on being a scribe, that thou (you) mayest (may) direct the whole earth.\"","ko":"문헌 중 하나는 다음과 같이 시작된다. \"너의 마음을 서기관이 되는 것에 고정하라. 그리하면 네가 온 땅을 인도할 수 있으리라.\""},{"n":7,"en":"Literacy was power.","ko":"문해력은 곧 힘이었다."},{"n":8,"en":"This probably explains why the innovation of alphabetic writing ─ in which a small group of symbols, standing for particular sounds, can be used to write any word ─ was not embraced even though it was used to render names and foreign words from early in the third millennium B.C.","ko":"이것이 아마도 특정 소리를 나타내는 적은 수의 기호 그룹이 어떤 단어든지 쓰는 데 사용될 수 있는 알파벳 문자라는 혁신이 기원전 3천 년대 초부터 이름과 외국어를 표기하는 데 사용되었는데도 불구하고, 받아들여지지 않은 이유를 설명할 것이다."},{"n":9,"en":"In theory, the scribes could then have abandoned the hundreds of specialist symbols they were required to learn and simply used alphabetic script instead.","ko":"이론적으로, 서기관들은 그렇다면 배워야 할 수백 개의 전문 기호를 버리고 알파벳 문자를 대신 사용할 수도 있었을 것이다."},{"n":10,"en":"But this would have made writing much easier for others to learn, and thus threatened their special status.","ko":"하지만 이는 다른 사람들이 글자를 훨씬 더 쉽게 배울 수 있게 했을 것이었고, 따라서 그들의 특별한 지위를 위협했을 것이다."}]}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function diagramCard(x){return `<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`}
function renderDiagram(d,overview=false){
let contents;
if(d.kind==='evidence'){
  contents=`<div class="evidence-label">① 주별 비교 · S4~5</div><div class="evidence-comparison">${diagramCard(d.items[0])}<div class="evidence-relation"><span>＞<small>성인기<br>자산 축적</small></span></div>${diagramCard(d.items[1])}</div><div class="evidence-label">② 어린 시절 경험 · 별도의 관찰</div><div class="evidence-observations">${d.items.slice(2).map(diagramCard).join('')}</div>`;
}else if(d.kind==='behavior'){
  contents=`<div class="behavior-rows">${d.items.slice(0,2).map((x,i)=>`<div class="behavior-row${i?' is-risk':''}"><div><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div><div class="behavior-same">↗ 활동성 높음</div></div>`).join('')}</div><div class="behavior-ideal">${diagramCard(d.items[2])}</div>`;
}else contents=`<div class="diagram-items">${d.items.map(diagramCard).join('')}</div>`;
return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3>${contents}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 경해여고2 부교재 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button><p class="translation">${esc(s.ko)}</p></div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section ${prediction?'has-prediction':''}" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div></section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">GYEONGHAE GIRLS' HIGH SCHOOL · GRADE 2</p><h1>경해여고2 · 수특라이트 영어</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 수특라이트 영어 12~15과<br>4개 단원 · 16지문 모두 원문, 해석, 시각 자료, 흐름, 클릭형 확인 문제가 연결되어 있습니다.</div><div class="units" id="units"></div><p class="subnote">16지문마다 본문 근거가 있는 그림 또는 개념 도표와 클릭형 문제 3개가 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":"경해여고2 부교재","units":[{"id":"light12","label":"수특라이트 영어 12과","scope":"문단 순서","passages":[{"id":"light12-01","title":"no.01","core":"꿀벌은 왕족의 명령이 아니라 정찰과 춤, 여러 차례의 투표로 새 보금자리를 민주적으로 정한다."},{"id":"light12-02","title":"no.02","core":"기술은 가치 중립적이지 않고 설계 단계에서 이미 도덕적 가치가 스며든다."},{"id":"light12-03","title":"no.03","core":"식물에는 적절한 환기와 여러 방향에서 오는 부드러운 바람이 필요하다."},{"id":"light12-04","title":"no.04","core":"고교 재정 교육을 도입한 주에서 성인기 자산 축적이 더 높았고, 어린 시절의 저축 권유와 부모의 저축에 대한 인식도 성인기 저축과 관련이 있었다."},{"id":"light12-05","title":"no.05","core":"콘서트홀이 커지자 작은 궁정 앙상블로는 음량이 모자라 앙상블을 키우는 조정이 이루어졌다."},{"id":"light12-06","title":"no.06","core":"적응은 새 정보를 기존 스키마에 넣는 동화와, 스키마 자체를 바꾸는 조절로 이루어진다."}]},{"id":"light13","label":"수특라이트 영어 13과","scope":"문장 삽입","passages":[{"id":"light13-01","title":"no.01","core":"만성 통증은 몸을 지키던 경보 시스템을 작은 자극에도 울리는 과민한 시스템으로 바꾼다."},{"id":"light13-02","title":"no.02","core":"인간의 몸은 필요한 만큼만 움직이고 불필요한 활동에는 에너지를 쓰지 않도록 진화했다."},{"id":"light13-03","title":"no.03","core":"인공조명은 바다거북의 산란을 방해하고 갓 부화한 새끼를 바다 반대쪽으로 이끈다."},{"id":"light13-04","title":"no.04","core":"같은 비행을 저질러도 사회의 반응이 다르면 두 집단의 삶의 경로가 갈린다."}]},{"id":"light14","label":"수특라이트 영어 14과","scope":"문단 요약","passages":[{"id":"light14-01","title":"no.01","core":"주당 1시간 빠르게 걷기부터 우울증 예방 효과가 나타나며, 심혈관 운동 2~6시간이 최적 범위이고 6시간을 넘겨도 추가 예방 효과는 없어 보인다."},{"id":"light14-02","title":"no.02","core":"성격의 일관성은 진화적으로 부적응처럼 보이지만 개체의 행동 가소성에 한계가 있음을 말해 준다."},{"id":"light14-03","title":"no.03","core":"사람의 정체성은 무엇을 사느냐가 아니라 무슨 일을 하느냐로 형성되어, 일자리 상실이 사회를 흔든다."},{"id":"light14-04","title":"no.04","core":"언론 매체에서 배운 고정관념은 기대를 만들고 그 기대가 스스로를 확증하는 예언이 된다."}]},{"id":"light15","label":"수특라이트 영어 15과","scope":"장문 독해","passages":[{"id":"light15-01","title":"p100 · no.01~02","core":"인간 행동은 불확실한 미래에 대한 판단과 추측에 기초하므로 오류의 가능성을 포함한다."},{"id":"light15-02","title":"p102 · no.03~04","core":"서기관의 특권 보호가 배우기 쉬운 알파벳 문자가 받아들여지지 않은 한 이유였을 가능성이 있다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

</script></body></html>

</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">JINJU GIRLS' HIGH SCHOOL · GRADE 2</p><h1>2025년 10월 고2 모의고사</h1><p class="lead">시험 범위 번호를 누르면 한눈 도식·원문·논리 흐름·클릭 문제를 차례로 볼 수 있습니다.</p><div class="notice">진주여고2 시험 범위: 22·23·33·34·37·38번<br>Word 원문 기준 6지문이 연결되어 있습니다.</div><div class="units" id="units"></div><p class="subnote">6지문 모두 근거 문장 번호가 붙은 시각 도식과 클릭형 확인 문제 3개가 연결되어 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":"진주여고2 2025년 10월 모의고사","units":[{"id":"mock25-10","label":"2025년 10월 고2 모의고사","scope":"진주여고2 시험 범위 · 22·23·33·34·37·38번","passages":[{"id":"mock25-22","title":"22번 · 호기심에서 시작하는 실험","core":"과학은 모른다는 사실을 받아들이고, 결과를 미리 단정하지 않은 채 호기심으로 실험해야 발전한다."},{"id":"mock25-23","title":"23번 · 새 이론이 인정받는 조건","core":"새 과학 이론은 기존 이론의 성공을 모두 설명하면서 기존 이론이 다루지 못한 영역까지 설명해야 인정받는다."},{"id":"mock25-33","title":"33번 · 궁전의 유리가 만든 권력","core":"궁전의 유리는 아름다운 장식이 아니라 통치자의 위계와 감시를 가시화해 복종을 이끌어 내는 권력 장치였다."},{"id":"mock25-34","title":"34번 · 침묵이 더 큰 침묵을 만드는 과정","core":"사람들은 자신의 의견이 다수라고 느끼면 표현하고 소수라고 느끼면 침묵하며, 이 차이가 반복되어 한쪽 의견만 더 크게 보이게 된다."},{"id":"mock25-37","title":"37번 · 나비와 나방을 구별하는 법과 그 한계","core":"나비와 나방은 더듬이·날개 자세·갈고리로 어느 정도 구별할 수 있지만, 색과 활동 시간에 관한 고정관념은 틀리므로 함께 이해하는 편이 낫다."},{"id":"mock25-38","title":"38번 · 야생동물 관리의 두 방식","core":"야생동물 관리는 개체군이나 서식지에 직접 개입하는 적극적 관리와, 외부 영향을 줄이며 주로 인간을 관리하는 소극적 관리로 나뉜다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('units').innerHTML=data.units.map((u,i)=>`<details class="unit" ${i===0?'open':''}><summary><div><h2>${esc(u.label)}</h2><span class="scope">${esc(u.scope)}</span></div><span class="count">${u.passages.length}지문</span></summary><div class="passages">${u.passages.map((p,j)=>`${u.passages.length>6&&j%5===0?`<h3 class="chunk-label">${j+1}–${Math.min(j+5,u.passages.length)}번</h3>`:''}<a class="passage" href="study.html#${esc(p.id)}"><b>${esc(p.title)}</b><span>${esc(p.core)}</span></a>`).join('')}</div></details>`).join('');
</script></body></html>

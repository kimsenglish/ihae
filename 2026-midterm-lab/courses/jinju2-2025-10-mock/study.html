.diagram{overflow:hidden}
.diagram-items{counter-reset:visual-step}
.diagram-card{box-shadow:0 2px 0 rgba(13,76,57,.04)}
.diagram-card b{line-height:1.35}
.diagram-card small{font-variant-numeric:tabular-nums}
/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;
  border-left:3px solid #68aa91;margin-left:14px;padding-left:25px}
.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card{position:relative;counter-increment:visual-step}
.diagram.diagram-steps .diagram-card:before,.diagram.diagram-timeline .diagram-card:before,
.diagram.diagram-cycle .diagram-card:before{content:counter(visual-step);position:absolute;left:-47px;top:10px;
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:#176b52;color:#fff;font-size:12px;font-weight:800;border:3px solid #f0f6ef}
.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after{
  content:'↓';position:absolute;left:-39px;bottom:-26px;margin:0;padding:0 2px;
  color:#176b52;background:#f0f6ef;line-height:1.2;font-size:17px;font-weight:800}
.diagram.diagram-cycle .diagram-items:after{content:'↶ 반복되는 해석';font-size:12px;color:#176b52;
  font-weight:750;margin:-13px 0 0 4px}
/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.diagram.diagram-condition .diagram-card:first-child,.diagram.diagram-branches .diagram-card:first-child{
  grid-column:1/-1;background:#dceee5;border-color:#82baa2;position:relative}
.diagram.diagram-condition .diagram-card:first-child:after,.diagram.diagram-branches .diagram-card:first-child:after{
  content:'↙                 ↘';position:absolute;bottom:-25px;left:0;right:0;text-align:center;
  color:#176b52;font-size:18px;font-weight:900;white-space:pre}
.diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.diagram.diagram-compare .diagram-card,.diagram.diagram-cases .diagram-card{
  border-top:5px solid #1b795c;background:linear-gradient(180deg,#f9fffb,#fff 48%)}
.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}
.diagram.diagram-web .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-web .diagram-card{border-radius:20px;border:2px solid #a4cab4;text-align:center}
.diagram.diagram-web .diagram-card:first-child{grid-column:1/-1;justify-self:center;width:min(100%,360px);
  background:#dceee5;border-color:#498f6e;border-radius:100px;position:relative}
.diagram.diagram-web .diagram-card:first-child:after{content:'↙                         ↘';
  position:absolute;left:0;right:0;bottom:-28px;color:#176b52;font-weight:900;white-space:pre}
.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;padding-top:23px}
.diagram.diagram-dose .diagram-items:before{content:'';position:absolute;top:10px;left:10%;right:10%;height:5px;
  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}
.diagram.diagram-dose .diagram-card:before{content:'';position:absolute;top:-23px;left:calc(50% - 7px);
  width:14px;height:14px;border-radius:50%;background:#176b52;border:3px solid #f0f6ef}
.diagram.diagram-dose .diagram-card:nth-child(2){background:#dceee5;border-color:#82baa2}
.diagram.diagram-dose .diagram-card b{font-size:18px}
/* The first pass shows only the visual map; stage 3 restores the evidence. */
.diagram.is-overview .diagram-card p,.diagram.is-overview .diagram-card small{display:none}
.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}
.diagram.is-overview .diagram-card b{font-size:15px}
.diagram.is-overview .diagram-takeaway{display:block;background:#dceee5;border:0;border-radius:11px;

/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}
.diagram.diagram-dialogue .diagram-card:before{content:'●';position:absolute;left:14px;top:13px;
  color:#176b52;font-size:24px;line-height:1}
.diagram.diagram-dialogue .diagram-card:after{content:'';position:absolute;left:12px;top:42px;
  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}
.diagram.diagram-dialogue .diagram-card:nth-child(2){background:#fff7e9;border-color:#c78f4b}
.diagram.diagram-dialogue .diagram-card:nth-child(2):before{color:#a96e2c}
.diagram.diagram-dialogue .diagram-card:nth-child(2):after{background:#a96e2c}
.diagram.diagram-dialogue .diagram-card b{font-size:17px}

<script id="course-data" type="application/json">{"course":"진주여고2 2025년 10월 모의고사","units":[{"id":"mock25-10","label":"2025년 10월 고2 모의고사","scope":"진주여고2 시험 범위 · 22·23·33·34·37·38번","passages":[{"id":"mock25-22","number":22,"title":"22번 · 호기심에서 시작하는 실험","core":"과학은 모른다는 사실을 받아들이고, 결과를 미리 단정하지 않은 채 호기심으로 실험해야 발전한다.","lead":"과학자가 이미 안다고 생각할 때와 직접 실험할 때 무엇이 달라지는지 보세요.","sentences":[{"n":1,"en":"Experiments testify to science's embrace of ignorance.","ko":"실험들은 과학의 무지에 대한 수용을 증명한다."},{"n":2,"en":"Arguably the worst thing a scientist can do is to suppose they know what will happen in a given scenario without bothering to check.","ko":"거의 틀림없이 과학자가 할 수 있는 가장 최악의 것은 그들이 확인하려는 수고를 들이지 않고 주어진 시나리오에서 일어날 일을 그들이 안다고 가정하는 것이다."},{"n":3,"en":"The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute.","ko":"실험 철학의 등장은 의심스러운 특성이 아닌 가치 있는 특성으로서의 호기심의 해방과 동시에 일어났다."},{"n":4,"en":"For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (\"state your hypothesis and then test it\"), the fact is that, as philosopher of science Ian Hacking says, \"One can conduct an experiment simply out of curiosity to see what will happen.\"","ko":"오늘날의 실험 과학은 철학적 틀과 승인된 방법론('가설을 세우고 나서 그것을 검증하라')에 의해 뒷받침되고 있다고 종종 여겨지지만, 사실은 과학 철학자 Ian Hacking이 말하듯이, '누군가는 무슨 일이 일어날 것인지를 알아보기 위해 그저 호기심에서 실험을 수행할 수도 있다'."},{"n":5,"en":"Indeed, in the view of Charles Darwin's son, the astronomer George Darwin, once in a while one should do a completely crazy experiment, even if it is most likely to prove fruitless.","ko":"게다가 Charles Darwin의 아들인 천문학자 George Darwin의 관점에서는 비록 그것이 효과 없는 것으로 증명될 가능성이 대단히 크더라도 가끔 누군가는 완전히 무모한 실험을 해야 한다."},{"n":6,"en":"You never know until you try.","ko":"여러분은 여러분이 시도하기 전까지는 절대 알 수 없다."}],"blocking_vocab":[{"word":"testify to","meaning":"~을 증명하다"},{"word":"embrace","meaning":"받아들임"},{"word":"attribute","meaning":"특성"},{"word":"fruitless","meaning":"성과 없는"}],"key_sentence_en":"You never know until you try.","easy_story":"과학자가 결과를 이미 안다고 단정하면 확인할 이유가 사라집니다. 반대로 모른다는 사실을 인정하면 호기심이 생기고, 직접 실험하면서 예상 밖의 결과를 발견할 수 있습니다.","structure":[{"title":"나쁜 출발","text":"확인하지 않고 결과를 안다고 가정함"},{"title":"과학적 출발","text":"모름을 인정하고 호기심으로 실험함"}],"flow":[{"label":"핵심 전제","sentences":"S1~2","text":"과학은 무지를 받아들이며, 확인 없이 안다고 단정하는 태도를 경계한다.","refs":[1,2]},{"label":"역사적 변화","sentences":"S3","text":"호기심이 의심스러운 태도에서 가치 있는 태도로 바뀌었다.","refs":[3]},{"label":"실험의 실제","sentences":"S4~5","text":"정해진 가설 검증뿐 아니라 순수한 호기심과 무모해 보이는 시도도 실험의 출발이 된다.","refs":[4,5]},{"label":"결론","sentences":"S6","text":"시도하기 전에는 결과를 알 수 없다.","refs":[6]}],"diagram":{"kind":"steps","title":"모름을 인정할 때 과학이 움직인다","items":[{"head":"모른다는 사실 인정","body":"결과를 이미 안다고 단정하지 않는다.","refs":[1,2]},{"head":"호기심을 가치 있게 봄","body":"무슨 일이 일어날지 직접 묻는다.","refs":[3,4]},{"head":"실험해 봄","body":"성과가 없을 듯한 시도도 가끔 감수한다.","refs":[5]},{"head":"예상 밖의 가능성","body":"시도해야만 결과를 알 수 있다.","refs":[6]}],"takeaway":"확실한 지식 → 실험이 아니라, 모름과 호기심 → 실험 → 발견"},"checks":[{"type":"핵심","q":"글이 강조하는 과학적 태도는?","choices":["결과를 미리 확정한 뒤 방법론을 따르는 태도","모름을 인정하고 호기심으로 직접 시도하는 태도"],"answer":1,"why":"글은 확인 없이 안다고 가정하는 것을 경계하고, 호기심에서 시작하는 실험을 옹호한다.","refs":[2,4,6]},{"type":"근거 확인","q":"George Darwin이 권한 행동은?","choices":["성과가 없을 듯해도 가끔 무모한 실험을 해 보는 것","승인된 방법론으로 성공이 보장된 실험만 하는 것"],"answer":0,"why":"S5에서 fruitless할 가능성이 커도 crazy experiment를 해 보라고 말한다.","refs":[5]},{"type":"원문 변형 탐지","q":"원문에 실제로 나오는 문장은?","choices":["You never know until you try.","You always know before you try."],"answer":0,"why":"never와 until이 글의 결론을 만든다.","refs":[6]}]},{"id":"mock25-23","number":23,"title":"23번 · 새 이론이 인정받는 조건","core":"새 과학 이론은 기존 이론의 성공을 모두 설명하면서 기존 이론이 다루지 못한 영역까지 설명해야 인정받는다.","lead":"뉴턴에서 아인슈타인으로 이론이 바뀌었지만, 무엇이 버려지지 않았는지 보세요.","sentences":[{"n":1,"en":"We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it.","ko":"단지 우리가 그것을 뒷받침하는 증거를 설명하는 더 나은 방법이 있을 때에만 우리는 과학 이론을 버리거나 대신할 수 있다."},{"n":2,"en":"The theories of Newton and Einstein offer great examples.","ko":"뉴턴과 아인슈타인의 이론들이 훌륭한 예시들을 제공한다."},{"n":3,"en":"A vast body of evidence supports Newton's theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations.","ko":"방대한 양의 증거가 뉴턴의 중력 이론을 뒷받침해 주지만, 19세기 후반에 이르러 과학자들은 그것의 예측들이 관찰 결과와 완벽하게 일치하지 않는 경우들을 발견하기 시작했다."},{"n":4,"en":"These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations.","ko":"이러한 불일치들은 아인슈타인이 자신의 일반 상대성 이론을 전개했을 때 비로소 설명될 수 있었고, 그것은 관찰 결과와 일치할 수 있었다."},{"n":5,"en":"Still, the many successes of Newton's theory could not be ignored, and Einstein's theory would not have gained acceptance if it had not been able to explain these successes equally well.","ko":"그럼에도 불구하고, 뉴턴의 이론의 많은 성과는 무시될 수 없었고, 아인슈타인의 이론이 만약 이러한 성과를 똑같이 잘 설명할 수 없었다면 인정을 받지 못했을 것이다."},{"n":6,"en":"It did, and that is why we now view Einstein's theory as a broader theory of gravity than Newton's theory.","ko":"그것은 그렇게 했고, 그것이 우리가 오늘날 아인슈타인의 이론을 뉴턴의 이론보다 더 포괄적인 중력 이론으로 보는 이유이다."},{"n":7,"en":"Some scientists today are seeking a theory of gravity that will go beyond Einstein's.","ko":"오늘날 몇몇의 과학자들은 아인슈타인의 이론을 넘어설 중력 이론을 찾고 있다."},{"n":8,"en":"If any new theory ever gains acceptance, it will have to match all the successes of Einstein's theory as well as work in new realms where Einstein's theory does not.","ko":"만약 어떤 새로운 이론이 언젠가 인정을 받는다면, 그것은 아인슈타인의 이론이 작동하지 않는 새로운 영역에서 작동할 뿐만 아니라 아인슈타인의 이론의 모든 성과에 필적해야 할 것이다."}],"blocking_vocab":[{"word":"discard","meaning":"버리다"},{"word":"discrepancy","meaning":"불일치"},{"word":"relativity","meaning":"상대성"},{"word":"realm","meaning":"영역"}],"key_sentence_en":"A new theory must preserve earlier successes and work in new realms.","easy_story":"새 이론은 옛 이론을 단순히 지우는 것이 아닙니다. 옛 이론이 맞힌 것들을 그대로 설명하면서, 옛 이론이 틀리거나 부족했던 부분까지 설명해야 더 넓은 이론이 됩니다.","structure":[{"title":"기존 이론의 성공","text":"새 이론이 그대로 설명해야 함"},{"title":"기존 이론의 한계","text":"새 이론이 추가로 설명해야 함"}],"flow":[{"label":"원칙","sentences":"S1","text":"기존 증거를 더 잘 설명할 때에만 이론을 대체할 수 있다.","refs":[1]},{"label":"뉴턴의 성과와 한계","sentences":"S2~3","text":"많은 증거가 뉴턴을 지지했지만 일부 예측은 관찰과 어긋났다.","refs":[2,3]},{"label":"아인슈타인의 확장","sentences":"S4~6","text":"불일치를 설명하면서 뉴턴의 성공까지 보존해 더 포괄적인 이론이 되었다.","refs":[4,5,6]},{"label":"다음 이론의 조건","sentences":"S7~8","text":"아인슈타인의 성공을 보존하고 새로운 영역에서도 작동해야 한다.","refs":[7,8]}],"diagram":{"kind":"steps","title":"이론은 지워지는 것이 아니라 더 넓어져야 한다","items":[{"head":"뉴턴","body":"많은 중력 현상을 성공적으로 설명","refs":[3]},{"head":"불일치 발견","body":"일부 예측이 관찰과 맞지 않음","refs":[3]},{"head":"아인슈타인","body":"뉴턴의 성공 + 불일치까지 설명","refs":[4,5,6]},{"head":"미래의 새 이론","body":"아인슈타인의 성공 + 새로운 영역까지 설명해야 함","refs":[7,8]}],"takeaway":"새 이론의 조건 = 기존 성과 보존 + 설명 범위 확장"},"checks":[{"type":"핵심","q":"새 이론이 인정받기 위한 조건은?","choices":["기존 이론의 성공을 버리고 전혀 다른 설명을 제시한다","기존의 성공을 설명하면서 새로운 영역에서도 작동한다"],"answer":1,"why":"대체는 삭제가 아니라 설명력의 확장이다.","refs":[1,5,8]},{"type":"근거 확인","q":"아인슈타인 이론이 더 포괄적이라고 여겨지는 이유는?","choices":["뉴턴의 성공과 뉴턴이 설명하지 못한 관찰을 함께 설명했기 때문에","뉴턴의 성공을 무시하고 새로운 관찰만 설명했기 때문에"],"answer":0,"why":"S4~6이 두 조건을 함께 보여 준다.","refs":[4,5,6]},{"type":"원문 변형 탐지","q":"원문과 일치하는 것은?","choices":["Einstein's theory is viewed as broader than Newton's theory.","Newton's theory is viewed as broader than Einstein's theory."],"answer":0,"why":"broader의 주체는 Einstein's theory이다.","refs":[6]}]},{"id":"mock25-33","number":33,"title":"33번 · 궁전의 유리가 만든 권력","core":"궁전의 유리는 아름다운 장식이 아니라 통치자의 위계와 감시를 가시화해 복종을 이끌어 내는 권력 장치였다.","lead":"유리가 ‘보이게 한다’는 성질이 어떻게 권력으로 이어지는지 보세요.","sentences":[{"n":1,"en":"Historically, palaces weren't just homes; they were carefully constructed stages designed to impress and intimidate.","ko":"역사적으로 궁전들은 단순한 거처가 아니었다. 그것들은 깊은 인상을 주고 위협하기 위해 설계된 주의 깊게 만들어진 무대들이었다."},{"n":2,"en":"While stone symbolized permanence and strength, glass offered something equally powerful: visibility.","ko":"돌은 영속성과 힘을 상징했고, 유리는 동등하게 강력한 어떤 것, 즉 가시성을 제공했다."},{"n":3,"en":"The introduction of large windows in palaces allowed rulers to literally look down upon their subjects, emphasizing their elevated position.","ko":"궁전들에 대형 창문들의 도입은 통치자들로 하여금 문자 그대로 자신들의 국민들을 내려다볼 수 있게 해 줬고, 그들의 높은 지위를 강조했다."},{"n":4,"en":"Conversely, it also allowed subjects to gaze up at their leaders, creating a sense of awe and distance.","ko":"반대로 그것은 또한 국민들이 자신들의 통치자를 '위로' 올려다보게 했고, 경외심과 거리감을 만들어 냈다."},{"n":5,"en":"Consider the Palace of Versailles: its Hall of Mirrors, lined with reflective surfaces, not only magnified the grandeur of the space but also placed the king at the center of a dazzling display, reinforcing his absolute authority.","ko":"베르사유 궁전을 생각해 보라. 반사되는 표면들로 일렬로 둘러싸인 그것의 거울의 방은 공간의 웅장함을 극대화했을 뿐 아니라, 왕을 눈부신 장식의 중심에 두어 그의 절대 권위를 강화했다."},{"n":6,"en":"The use of glass in palaces wasn't merely aesthetic; it was strategic.","ko":"궁전들에서의 유리의 용도는 단순히 미적인 것이 아니었다. 그것은 전략적이었다."},{"n":7,"en":"Open sightlines allowed for better surveillance and control, ensuring the safety and security of the ruling family.","ko":"열린 시야는 더 나은 감시와 통제를 가능하게 했고, 통치 가문의 안전과 보안을 보장했다."},{"n":8,"en":"Courtiers and visitors were constantly aware of being observed, contributing to an atmosphere of careful obedience and respect.","ko":"신하들과 방문자들은 끊임없이 관찰되고 있는 것을 의식했고, 그것은 조심스러운 복종과 존경의 분위기를 조성했다."},{"n":9,"en":"The very architecture dictated social behavior, with glass acting as a silent enforcer of the power dynamic.","ko":"유리가 권력 역학 관계의 조용한 집행자로서 역할을 하면서 건축물 그 자체가 사회적 행동을 지배했다."}],"blocking_vocab":[{"word":"visibility","meaning":"가시성, 보임"},{"word":"awe","meaning":"경외감"},{"word":"surveillance","meaning":"감시"},{"word":"enforcer","meaning":"집행자"}],"key_sentence_en":"Glass acted as a silent enforcer of the power dynamic.","easy_story":"궁전의 큰 창과 거울은 단지 화려한 장식이 아니었습니다. 왕은 위에서 내려다보고 사람들은 왕을 올려다보며, 서로가 보이는 구조는 감시와 복종을 자연스럽게 만들었습니다.","structure":[{"title":"위계의 가시화","text":"왕은 내려다보고 국민은 올려다봄"},{"title":"감시의 가시화","text":"늘 관찰된다는 의식이 행동을 통제함"}],"flow":[{"label":"궁전의 목적","sentences":"S1~2","text":"궁전은 권력을 연출하는 무대였고, 유리는 가시성을 제공했다.","refs":[1,2]},{"label":"위계 연출","sentences":"S3~5","text":"보는 방향과 반사 공간이 왕의 높은 지위와 절대 권력을 강조했다.","refs":[3,4,5]},{"label":"전략적 기능","sentences":"S6~8","text":"열린 시야는 감시와 통제를 가능하게 하고 복종을 유도했다.","refs":[6,7,8]},{"label":"결론","sentences":"S9","text":"건축과 유리가 권력 관계를 조용히 집행했다.","refs":[9]}],"diagram":{"kind":"web","title":"유리의 가시성이 권력이 되는 두 경로","items":[{"head":"궁전의 유리 = 가시성","body":"장식이 아니라 사람과 시선을 배치하는 전략","refs":[2,6]},{"head":"위계","body":"통치자는 내려다보고 국민은 올려다봄 → 경외와 거리감","refs":[3,4,5]},{"head":"감시","body":"서로 보이는 열린 시야 → 관찰 의식 → 조심스러운 복종","refs":[7,8,9]}],"takeaway":"가시성은 왕의 위치를 높이고, 사람들의 행동을 통제했다."},"checks":[{"type":"핵심","q":"글에서 궁전의 유리가 수행한 핵심 기능은?","choices":["채광과 장식만을 위한 미적 기능","위계와 감시를 통해 권력을 강화하는 전략적 기능"],"answer":1,"why":"S6은 merely aesthetic이 아니라 strategic이라고 명시한다.","refs":[6,7,9]},{"type":"근거 확인","q":"신하와 방문객의 복종 분위기가 생긴 직접 원인은?","choices":["궁전의 돌이 영속성을 상징한다는 지식","자신들이 계속 관찰되고 있다는 의식"],"answer":1,"why":"S8은 being observed의 의식이 obedience에 기여했다고 말한다.","refs":[8]},{"type":"원문 변형 탐지","q":"원문에 실제로 나오는 판단은?","choices":["The use of glass was merely aesthetic.","The use of glass was not merely aesthetic; it was strategic."],"answer":1,"why":"not merely A; B가 장식에서 전략으로 논리를 전환한다.","refs":[6]}]},{"id":"mock25-34","number":34,"title":"34번 · 침묵이 더 큰 침묵을 만드는 과정","core":"사람들은 자신의 의견이 다수라고 느끼면 표현하고 소수라고 느끼면 침묵하며, 이 차이가 반복되어 한쪽 의견만 더 크게 보이게 된다.","lead":"개인의 ‘인기 판단’이 어떻게 사회 전체의 의견 분포를 바꾸어 보이게 하는지 보세요.","sentences":[{"n":1,"en":"As a political researcher in Germany, Noelle-Neumann Observed that during election campaigns, certain views seemed to get more play than others, and sometimes people muted their opinions rather than talking about them, especially if those opinions were perceived to be unpopular.","ko":"독일의 정치 연구자로서 NoelleNeumann은 선거 운동 기간 동안 특정 견해들이 다른 견해들보다 더 많이 다뤄지는 것처럼 보이고, 때로는 특히 그러한 의견들이 인기 없는 것으로 인식되는 경우 사람들이 그것들에 대해 말하기보다는 자신들의 의견들을 표현하지 않는 것을 목격했다."},{"n":2,"en":"Noelle-Neumann calls this the spiral of silence.","ko":"NoelleNeumann은 이것을 '침묵의 나선'이라고 부른다."},{"n":3,"en":"The spiral of silence occurs when individuals who perceive that their opinions are popular express them, whereas those who do not think their opinions are popular remain quiet.","ko":"자신들의 의견이 대중적이라고 인식하는 개인들은 그것들을 표현하지만, 자신들의 의견이 대중적이라고 생각하지 않는 개인들은 조용히 있을 때 침묵의 나선이 발생한다."},{"n":4,"en":"This process occurs in a spiral, so that one side of an issue ends up with considerable publicity and the other side with very little.","ko":"이 과정은 나선형으로 일어나 문제에 대한 한쪽 입장은 상당한 주목을 받게 되고, 다른 쪽 입장은 거의 주목받지 않게 된다."},{"n":5,"en":"In everyday life, people express their opinions in a variety of ways: they talk about them, they wear buttons, they put bumper stickers on their cars, and they post their views on social media.","ko":"일상생활에서 사람들은 다양한 방식들로 자신들의 의견들을 표현한다. 그들은 그것들에 대해 말하고, 배지들을 달고, 자동차에 범퍼 스티커들을 붙이고, 소셜 미디어에 자신들의 견해들을 게시한다."},{"n":6,"en":"According to this theory, people are more apt to do these kinds of things when they perceive that others share their opinions.","ko":"이 이론에 따르면 사람들은 다른 사람들이 자신들의 의견들과 뜻을 같이한다고 인식할 때 이런 종류의 행동들을 더 많이 하는 경향이 있다."}],"blocking_vocab":[{"word":"mute","meaning":"표현하지 않다"},{"word":"perceive","meaning":"인식하다"},{"word":"publicity","meaning":"대중의 주목"},{"word":"be apt to","meaning":"~하는 경향이 있다"}],"key_sentence_en":"Perceived popularity encourages expression, while perceived unpopularity produces silence.","easy_story":"사람들은 내 의견에 동의하는 사람이 많다고 느끼면 더 크게 말합니다. 반대로 소수라고 느끼면 조용해집니다. 그 결과 실제 숫자와 별개로 말하는 쪽은 더 커 보이고 침묵하는 쪽은 더 작아 보입니다.","structure":[{"title":"인기 있다고 느낌","text":"표현 증가 → 더 많이 보임"},{"title":"인기 없다고 느낌","text":"침묵 증가 → 더 적게 보임"}],"flow":[{"label":"관찰","sentences":"S1~2","text":"인기 없다고 느끼는 의견이 침묵하는 현상을 침묵의 나선이라 부른다.","refs":[1,2]},{"label":"개인의 선택","sentences":"S3","text":"인기 판단에 따라 표현과 침묵이 갈린다.","refs":[3]},{"label":"사회적 증폭","sentences":"S4","text":"표현의 차이가 반복되면서 한쪽만 더 크게 보인다.","refs":[4]},{"label":"일상 적용","sentences":"S5~6","text":"타인이 동의한다고 느낄수록 여러 방식으로 의견을 드러낸다.","refs":[5,6]}],"diagram":{"kind":"cycle","title":"침묵의 나선은 ‘보이는 다수’를 스스로 키운다","items":[{"head":"내 의견이 인기 있다고 느낌","body":"다른 사람도 동의한다고 판단","refs":[3,6]},{"head":"의견을 적극적으로 표현","body":"말·배지·스티커·게시물로 드러냄","refs":[3,5]},{"head":"그 의견이 더 많이 보임","body":"한쪽은 큰 주목, 다른 쪽은 적은 주목","refs":[4]},{"head":"반대편은 더 침묵","body":"인기 없다고 느낄수록 말하지 않음","refs":[1,3]}],"takeaway":"보이는 의견의 크기와 실제 사람 수는 같지 않을 수 있다."},"checks":[{"type":"핵심","q":"침묵의 나선이 생기는 이유는?","choices":["인기 있다고 느끼는 쪽은 말하고 인기 없다고 느끼는 쪽은 침묵하기 때문에","모든 사람이 자신의 의견을 같은 강도로 표현하기 때문에"],"answer":0,"why":"S3이 표현과 침묵을 가르는 기준을 설명한다.","refs":[3,4]},{"type":"근거 확인","q":"한쪽 의견이 더 큰 주목을 받는 것은 무엇의 결과인가?","choices":["선거에서 실제 지지자가 반드시 더 많기 때문","표현과 침묵의 차이가 반복되는 과정"],"answer":1,"why":"글은 실제 다수 여부보다 perceived popularity와 표현 행동의 나선을 설명한다.","refs":[3,4]},{"type":"원문 변형 탐지","q":"원문과 일치하는 것은?","choices":["People remain quiet when they do not think their opinions are popular.","People remain quiet when they think their opinions are popular."],"answer":0,"why":"do not think가 침묵 조건이다.","refs":[3]}]},{"id":"mock25-37","number":37,"title":"37번 · 나비와 나방을 구별하는 법과 그 한계","core":"나비와 나방은 더듬이·날개 자세·갈고리로 어느 정도 구별할 수 있지만, 색과 활동 시간에 관한 고정관념은 틀리므로 함께 이해하는 편이 낫다.","lead":"앞부분의 구별 기준과 뒷부분의 고정관념 반박을 따로 보세요.","sentences":[{"n":1,"en":"Distinguishing moths from butterflies on outward appearance is not always easy, but there are a few rules of thumb that can help.","ko":"외적 생김새로 나비들과 나방들을 구별하는 것이 항상 쉬운 일은 아니지만, 도움이 될 수 있는 몇 가지 경험적 방법들이 있다."},{"n":2,"en":"In most butterflies the antennae end with a small club-shaped swelling, whereas in moths they are usually feathery or narrow to a fine tip.","ko":"대부분의 나비들의 경우 더듬이들은 작은 곤봉 모양의 혹으로 끝나는 반면, 나방들의 경우 그것들은 보통 깃털 모양이거나 미세한 끝부분으로 점점 가늘어진다."},{"n":3,"en":"Butterflies tend to rest with their wings held shut above their body, whereas moths more usually rest with the upper sides of the wings on full view.","ko":"나비들은 자신의 날개들이 자신의 몸 위에 닫힌 채 쉬는 경향이 있는 반면, 나방들은 더 흔히 날개들의 윗면이 완전히 드러나는 상태로 쉰다."},{"n":4,"en":"Further distinctions can be made by looking for a tiny hook that joins fore- and hindwings, a feature only present in moths.","ko":"나방들에게만 존재하는 특징인, 앞날개와 뒷날개를 연결해 주는 아주 작은 갈고리를 찾아봄으로써 그 이상의 구별들이 가능하다."},{"n":5,"en":"The stereotypical differences, with moths cast as the gloomy, nocturnal cousins of colourful sun-loving butterflies are simply wrong.","ko":"색이 화려하고 해를 좋아하는 나비들의 칙칙하고 야행성인 사촌으로 나방들이 묘사되는 정형화 된 차이들은 그야말로 잘못된 것이다."},{"n":6,"en":"There are many brightly coloured moths and many which are active throughout the day.","ko":"밝은색을 가진 나방들이 많고 낮 동안 내내 활동적인 나방들이 많이 있다."},{"n":7,"en":"Equally, there are a few nocturnal butterflies and plenty that come clothed in shades of brown and grey.","ko":"마찬가지로, 야행성의 나비들이 몇몇 있고, 갈색과 회색조를 띠는 것들이 많이 있다."},{"n":8,"en":"It's more sensible to think of them together; both butterflies and moths are beautiful and fascinating insects.","ko":"그들을 함께 묶어 생각하는 것이 더 합리적이다. 나비와 나방 둘 다 아름답고 매혹적인 곤충이기 때문이다."}],"blocking_vocab":[{"word":"rule of thumb","meaning":"경험 법칙"},{"word":"antennae","meaning":"더듬이"},{"word":"nocturnal","meaning":"야행성의"},{"word":"stereotypical","meaning":"고정관념의"}],"key_sentence_en":"The stereotypical differences are simply wrong.","easy_story":"나비와 나방은 더듬이 끝, 쉬는 날개 자세, 날개를 잇는 갈고리로 구별할 수 있습니다. 하지만 ‘나비는 밝고 낮에, 나방은 칙칙하고 밤에’라는 이미지는 예외가 많아 믿을 수 없습니다.","structure":[{"title":"쓸 수 있는 기준","text":"더듬이·날개 자세·갈고리"},{"title":"버려야 할 고정관념","text":"색깔·낮/밤 활동의 단순 구분"}],"flow":[{"label":"문제 제기","sentences":"S1","text":"겉모습 구별은 어렵지만 몇 가지 경험 법칙은 있다.","refs":[1]},{"label":"구별 기준","sentences":"S2~4","text":"더듬이, 쉬는 날개 자세, 나방의 갈고리를 살핀다.","refs":[2,3,4]},{"label":"고정관념 반박","sentences":"S5~7","text":"색과 활동 시간에는 양쪽 모두 예외가 많다.","refs":[5,6,7]},{"label":"결론","sentences":"S8","text":"둘을 함께 아름답고 매력적인 곤충으로 보는 편이 낫다.","refs":[8]}],"diagram":{"kind":"compare","title":"구별은 ‘형태 기준’으로, 고정관념은 버리기","items":[{"head":"나비에서 흔한 특징","body":"곤봉 모양 더듬이 끝 · 날개를 몸 위로 닫고 쉼","refs":[2,3]},{"head":"나방에서 흔한 특징","body":"깃털형/가는 더듬이 · 날개 윗면을 펼쳐 쉼 · 날개 연결 갈고리","refs":[2,3,4]}],"takeaway":"색이 밝다/어둡다, 낮/밤에 활동한다는 구분은 예외가 많다."},"checks":[{"type":"핵심","q":"글의 결론과 가장 가까운 것은?","choices":["형태 기준은 도움이 되지만 색과 활동 시간의 고정관념은 틀릴 수 있다","색과 활동 시간만으로 나비와 나방을 쉽게 구별할 수 있다"],"answer":0,"why":"앞부분은 형태 기준, 뒷부분은 고정관념의 예외를 제시한다.","refs":[2,3,4,5,8]},{"type":"근거 확인","q":"나방에게만 있다고 제시된 특징은?","choices":["곤봉 모양으로 부푼 더듬이 끝","앞날개와 뒷날개를 잇는 작은 갈고리"],"answer":1,"why":"S4가 only present in moths라고 명시한다.","refs":[4]},{"type":"원문 변형 탐지","q":"원문과 일치하는 것은?","choices":["All moths are gloomy insects active only at night.","There are many brightly coloured moths active throughout the day."],"answer":1,"why":"밝고 주행성인 나방이 많다는 예외가 고정관념을 깨뜨린다.","refs":[6]}]},{"id":"mock25-38","number":38,"title":"38번 · 야생동물 관리의 두 방식","core":"야생동물 관리는 개체군이나 서식지에 직접 개입하는 적극적 관리와, 외부 영향을 줄이며 주로 인간을 관리하는 소극적 관리로 나뉜다.","lead":"두 관리 방식이 모두 ‘관리 책임’이지만 무엇을 직접 바꾸는지가 다릅니다.","sentences":[{"n":1,"en":"There are numerous ways wildlife is managed, but they all imply stewardship and can be classified into two broad categories: active management and inactive management.","ko":"야생 생물이 관리되는 수많은 방법들이 있지만, 그것들은 모두 관리 책임을 수반하고 적극적 관리와 소극적 관리라는 두 가지 넓은 범주로 분류될 수 있다."},{"n":2,"en":"Active management does something to the population ― such as increasing or decreasing its size ― in a direct manner through strategies like translocations or hunting, respectively.","ko":"적극적 관리는 거주지 이전이나 사냥과 같은 전략을 통해, 각각 규모를 증가시키거나 감소시키는 것과 같이 무언가를 직접적인 방식으로 개체군에게 한다."},{"n":3,"en":"Populations can also be actively managed by altering the habitat to the benefit or disadvantage of a population.","ko":"개체군들은 또한 서식지를 개체군에게 유리하거나 불리하게 변경함으로써 적극적으로 관리될 수 있다."},{"n":4,"en":"If population numbers are too low for the goal of management agencies, other active management can be incorporated, such as predator control to minimize neonatal deaths or habitat improvement to provide required cover for neonates from predators.","ko":"만약 개체 수가 관리 기관들의 목표보다 너무 적으면 갓 태어난 개체의 사망을 최소화하는 포식자 통제나 포식자로부터 갓 태어난 새끼들을 위해 필요한 은신처를 제공하는 서식지 개선과 같은 다른 적극적 관리가 포함될 수 있다."},{"n":5,"en":"These efforts represent active approaches to management.","ko":"이러한 노력들은 관리에 대한 적극적인 접근법을 나타낸다."},{"n":6,"en":"Other populations may not be actively managed, like those in national parks.","ko":"국립 공원들의 개체군들처럼 다른 개체군들은 적극적으로 관리되지 않을지도 모른다."},{"n":7,"en":"In such situations, management activities minimize external influences on populations and habitat, which often involves management of humans and not animals.","ko":"그러한 상황들에서 관리 활동들은 개체군들과 서식지에 대한 외부 영향력을 최소화하는데, 그것은 대체로 동물들이 아닌 인간들에 대한 관리를 포함한다."}],"blocking_vocab":[{"word":"stewardship","meaning":"관리 책임"},{"word":"translocation","meaning":"이주·이동 조치"},{"word":"neonatal","meaning":"갓 태어난 개체의"},{"word":"external influence","meaning":"외부 영향"}],"key_sentence_en":"Wildlife management can be active or inactive, but both imply stewardship.","easy_story":"적극적 관리는 동물 수를 늘리거나 줄이고 서식지를 바꾸는 등 자연에 직접 손을 댑니다. 소극적 관리는 손을 놓는 것이 아니라, 국립공원처럼 인간의 영향을 줄여 동물과 서식지를 지킵니다.","structure":[{"title":"적극적 관리","text":"동물·개체 수·서식지를 직접 변화"},{"title":"소극적 관리","text":"외부 영향 최소화, 주로 인간 행동을 관리"}],"flow":[{"label":"분류","sentences":"S1","text":"모든 관리는 책임을 전제로 하며 적극적·소극적으로 나뉜다.","refs":[1]},{"label":"적극적 관리","sentences":"S2~5","text":"개체 수나 서식지를 직접 바꾸고 필요하면 포식자 통제와 서식지 개선을 한다.","refs":[2,3,4,5]},{"label":"소극적 관리","sentences":"S6~7","text":"국립공원 등에서는 외부 영향을 줄이고 동물보다 인간을 관리한다.","refs":[6,7]}],"diagram":{"kind":"branches","title":"같은 관리 책임, 다른 개입 대상","items":[{"head":"야생동물 관리 = stewardship","body":"방치가 아니라 목적에 맞게 책임지고 관리","refs":[1]},{"head":"적극적 관리","body":"이주·사냥으로 개체 수 조절 · 서식지 변경 · 포식자 통제","refs":[2,3,4,5]},{"head":"소극적 관리","body":"개체군과 서식지의 외부 영향 최소화 · 동물 대신 인간 활동 관리","refs":[6,7]}],"takeaway":"소극적 관리도 ‘아무것도 하지 않음’이 아니라 외부 영향을 줄이는 관리다."},"checks":[{"type":"핵심","q":"적극적 관리와 소극적 관리의 가장 큰 차이는?","choices":["개체군·서식지에 직접 개입하는지, 외부 영향을 줄이는지","관리 책임의 유무"],"answer":0,"why":"두 방식 모두 stewardship이지만 개입 대상과 방식이 다르다.","refs":[1,2,7]},{"type":"근거 확인","q":"소극적 관리에서 흔히 직접 관리하는 대상은?","choices":["인간의 활동","갓 태어난 동물의 수"],"answer":0,"why":"S7은 management of humans and not animals라고 말한다.","refs":[7]},{"type":"원문 변형 탐지","q":"원문과 일치하는 것은?","choices":["Inactive management often involves management of humans, not animals.","Inactive management often involves management of animals, not humans."],"answer":0,"why":"humans와 animals의 방향을 확인해야 한다.","refs":[7]}]}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 진주여고2 2025년 10월 모의고사 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button><p class="translation">${esc(s.ko)}</p></div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

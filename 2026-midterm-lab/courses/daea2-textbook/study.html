/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items,.diagram.diagram-argument .diagram-items,

.diagram.diagram-steps-response .diagram-items,.diagram.diagram-cause-response .diagram-items,

.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card,.diagram.diagram-argument .diagram-card,
.diagram.diagram-steps-possible .diagram-card,.diagram.diagram-case-advice .diagram-card,
.diagram.diagram-steps-response .diagram-card,.diagram.diagram-cause-response .diagram-card,

.diagram.diagram-cycle .diagram-card:before,.diagram.diagram-argument .diagram-card:before,

  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;

.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-possible .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-case-advice .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-response .diagram-items .diagram-card:not(:last-child):after,

  font-weight:750;margin:-13px 0 0 4px}
/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}

  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

  border-top:5px solid #1b795c;background:linear-gradient(180deg,#f9fffb,#fff 48%)}
.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}

.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));

  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}

.diagram.diagram-dose .diagram-card b{font-size:18px}
/* Cooking: familiar side benefits are distinct from the source's energy-to-adaptation claim. */
.diagram.diagram-energy-route .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px}
.diagram.diagram-energy-route .diagram-card{position:relative;min-width:0;border-top:5px solid #237c5c;padding-top:35px;background:#fffdf8}
.diagram.diagram-energy-route .diagram-card:first-child{grid-column:1/-1;border:1px dashed #a9b8ad;background:#f8faf6;padding:10px 14px}
.diagram.diagram-energy-route .diagram-card:first-child:before{content:'먼저 떠오르는 장점';display:block;color:#65766b;font-size:11px;font-weight:800;margin-bottom:3px}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}
.diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'→';position:absolute;right:-19px;top:calc(50% - 16px);color:#176b52;font-size:26px;font-weight:900;z-index:1}
.diagram.diagram-energy-route .diagram-card:nth-child(2){background:#e5f4e9}.diagram.diagram-energy-route .diagram-card:nth-child(4){background:#fff2d9;border-top-color:#b78539}
/* Three alternative survival responses, not three consecutive steps. */
.diagram.diagram-reaction-options .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 10px}
.diagram.diagram-reaction-options .diagram-card:first-child{grid-column:1/-1;text-align:center;background:#dceee5;border:2px solid #82baa2;position:relative}
.diagram.diagram-reaction-options .diagram-card:first-child:after{content:'↙    ↓    ↘';position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:#176b52;font-weight:900;font-size:21px;white-space:pre}
.diagram.diagram-reaction-options .diagram-card:not(:first-child){text-align:center;border-top:5px solid #247b5b}
.diagram.diagram-reaction-options .diagram-card:not(:first-child) b{font-size:20px}
.diagram.diagram-reaction-options .diagram-card:not(:first-child):before{display:block;font-size:27px;line-height:1;margin-bottom:8px;color:#176b52}
.diagram.diagram-reaction-options .diagram-card:nth-child(2):before{content:'⏸'}.diagram.diagram-reaction-options .diagram-card:nth-child(3):before{content:'➜'}.diagram.diagram-reaction-options .diagram-card:nth-child(4):before{content:'↗'}

.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}

  margin-top:14px;padding:10px 12px;text-align:center;color:#14543f}
/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}

  color:#176b52;font-size:24px;line-height:1}

  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}

.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}

.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}

.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(-n+2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(-n+2){border-top:5px solid #1b795c}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}

.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Three roles are simultaneous parts of one contrast, not a causal sequence. */
.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diagram.diagram-roles-contrast .diagram-card{border-top:5px solid #1b795c}

영감을 준 미국의 아이콘이다.","grammar":[{"label":"justice and gender equality","explanation":"justice and gender equality — 명사 병렬","transform_label":"who inspired the world — 주격 관계대명사 → 접속사+대명사 — who를 and she로 바꿔 두 절로","transform_value":"… American icon, and she inspired the …"}]},{"n":6,"en":"Ginsburg was born in Brooklyn in 1933.","ko":"긴즈버그는 브루클린에서 1933년에 태어났다.","grammar":[{"label":"was born","explanation":"was born — 수동태 사용"}]},{"n":7,"en":"During her academic career, Ginsburg was an excellent student, despite having to overcome many barriers.","ko":"학창 시절 동안에 긴즈버그는 많은 장벽을 극복해야 함에도 불구하고 뛰어난 학생이었다.","grammar":[]},{"n":8,"en":"She always received good grades as a child, and she continued to excel in university.","ko":"그녀는 어릴 적에 항상 좋은 성적을 받았고, 대학에서도 계속해서 뛰어났다.","grammar":[]},{"n":9,"en":"In 1954, Ginsburg graduated from Cornell University at the top of her class, and she was later accepted into Harvard Law School.","ko":"1954년에 긴즈버그는 코넬 대학교를 수석으로 졸업했고, 이후에 하버드 로스쿨(법학대학원)에 입학했다.","grammar":[]},{"n":10,"en":"While attending Harvard, however, Ginsburg faced discrimination.","ko":"그러나 하버드에 재학하는 동안 긴즈버그는 차별에 직면했다.","grammar":[]},{"n":11,"en":"There were only nine women out of 500 students in the program, and many people thought the school should have given the women's spots to men.","ko":"프로그램에서 500명의 학생 중 여성은 겨우 9명에 불과했고, 많은 사람들은 그 여성의 자리도 남성에게 주었어야 했다고 생각했다.","grammar":[]},{"n":12,"en":"They were even restricted from using some sections of the library.","ko":"여성들은 심지어 도서관의 일부 구역을 이용하는 것에서도 제한되었다.","grammar":[]},{"n":13,"en":"Ginsburg transferred to Columbia Law School for her final year, and she graduated at the top of her class in 1959.","ko":"긴즈버그는 마지막 학년에 컬럼비아 로스쿨로 편입했고, 1959년에 수석으로 졸업했다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"동상 앞에서 사진 찍는 소녀들을 보여 준다 → 동상 속 인물이 누구인지 묻는다 → 배우도 팝스타도 아니라고 선을 긋는다 → 그가 Ruth Bader Ginsburg임을 알린다","refs":[1,2,3,4]},{"label":"전개","sentences":"S5 · S6 · S7 · S8 · S9","text":"정의와 성평등에 삶을 바친 상징으로 세운다 tle":"지문 흐름을 한눈에","items":[{"head":"시작","body":"좋은 학력에도 취업이 막혔음을 짚는다 → 여성·유대인·어머니라는 조건을 든다 → 지방 법원 서기가 첫 자리였다고 밝힌다 → 2년 뒤 로펌의 제안이 오기 시작한다","refs":[1,2,3,4]},{"head":"전개","body":"낮은 급여 탓에 제안을 모두 물렸음을 든다 → 다른 분야를 공부해 법학 교수가 된다 → 컬럼비아 최초의 여성 종신 교수가 된다","refs":[5,6,7]},{"head":"도착","body":"시민 자유 연맹에서 성차별 사건을 변론한다 → 판사가 되려고 대학을 떠난다 → 13년 뒤 두 번째 여성 대법관이 된다 → 재직 내내 싸움을 멈추지 않았다고 요약한다","refs":[8,9,10,11]}],"takeaway":"뛰어난 성적에도 막힌 취업: 좋은 학력에도 취업이 막혔음을 짚는다 → 재직 내내 싸움을 멈추지 않았다고 요약한다"},"easy_story":"좋은 학력에도 취업이 막혔음을 짚는다 → 여성·유대인·어머니라는 조건을 든다 → 지방 법원 서기가 첫 자리였다고 밝힌다 → 2년 뒤 로펌의 제안이 오기 시작한다. 낮은 급여 탓에 제안을 모두 물렸음을 든다 → 다른 분야를 공부해 법학 교수가 된다 → 컬럼비아 최초의 여성 종신 교수가 된다. 시민 자유 연맹에서 성차별 사건을 변론한다 → 판사가 되려고 대학을 떠난다 → 13년 뒤 두 번째 여성 대법관이 된다 → 재직 내내 싸움을 멈추지 않았다고 요약한다.","blocking_vocab":[{"word":"record","meaning":"녹음하다"},{"word":"gender equality","meaning":"성평등"},{"word":"discrimination","meaning":"차별"}],"sentences":[{"n":1,"en":"Even with her impressive academic record, Ginsburg still had a hard time finding a job as a lawyer.","ko":"그녀의 뛰어난 학력에도 불구하고, 긴즈버그는 여전히 변호사로서 일자리를 구하는 데 어려움을 겪었다.","grammar":[]},{"n":2,"en":"She was not only a woman but also Jewish and a mother.","ko":"그녀는 여성이었을 뿐만 아니라 유대인이었고, 아이의 어머니였다.","grammar":[{"label":"not only a woman but also","explanation":"not only a woman but also — 상관접속사","transform_label":"not only A but also B → B as well as A — A뿐만 아니라 B도","transform_value":"She was Jewish and a mother as well as a woman."},{"label":"Jewish and a mother","explanation":"Jewish and a mother — 보어 병렬"}]},{"n":3,"en":"The first position she found was as a law clerk for a U.S. district judge.","ko":"그녀가 찾은 첫 번째 직장은 미국 지방 법원 판사의 법률 서기였다.","grammar":[{"label":"position she","explanation":"position she — 목적격 관계대명사 생략 · position that she","transform_label":"The first position she found — 목적격 관계대명사 생략 → that 복원 — 목적격 관계대명사 that을 넣는다","transform_value":"… first position that she found …"}]},{"n":4,"en":"After two years in this position, she finally started to get offers from law firms.","ko":"이곳에서 2년을 근무한 후, 그녀는 마침내 로펌으로부터 제안을 받기 시작했다.","grammar":[]},{"n":5,"en":"However, these offers always came with a salary lower than those of the firm's male lawyers, so she didn't accept any of them.","ko":"그러나, 그 제안에는 항상 그 회사의 남성 변호사들보다 낮은 급여가 포함되어 있었기 때문에 그녀는 그 제안 중 어떤 것도 받아들이지 않았다.","grammar":[]},{"n":6,"en":"Instead, she decided to study other areas of law and eventually became a law professor.","ko":"대신에, 그녀는 법의 다른 분야를 공부하기로 했고, 마침내 법학 교수가 되었다.","grammar":[{"label":"decided","explanation":"decided · became — 동사 병렬"}]},{"n":7,"en":"She taught at Columbia University, and, in 1972, she became the first woman to be offered a permanent professorship there.","ko":"그녀는 컬럼비아 대학교에서 강의했고, 1972년에는 그곳에서 종신 교수직을 제안받은 최초의 여성이 되었다.","grammar":[]},{"n":8,"en":"While at Columbia, Ginsburg also worked hard as general counsel for the American Civil Liberties Union (ACLU) and argued many gender discrimination cases in the U.S. Supreme Court.","ko":"컬럼비아 대학에서 근무하는 동안, 긴즈버그는 미국 시민 자유 연맹(ACLU)의 법률 고문으로도 열심히 일했으며, 미국 대법원에서 수많은 성차별 사건을 변론했다.","grammar":[]},{"n":9,"en":"In 1980, Ginsburg left Columbia University to become a judge.","ko":"1980년, 긴즈버그는 판사가 되기 위해 컬럼비아 대학교를 떠났다.","grammar":[]},{"n":10,"en":"Thirteen years later, she was appointed to the U.S. Supreme Court and became only the second woman to hold the position.","ko":"13년 후, 그녀는 미국 대법관으로 임명되었고 여성으로는 두 번째로 대법관직을 맡게 되었다.","grammar":[]},{"n":11,"en":"During her time as a judge, Ginsburg never stopped fighting for women's rights and gender equality.","ko":"판사로 재직하는 동안, 긴즈버그는 여성의 권리와 성평등을 위한 싸움을 멈추지 않았다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"좋은 학력에도 취업이 막혔음을 짚는다 → 여성·유대인·어머니라는 조건을 든다 → 지방 법원 서기가 첫 자리였다고 밝힌다 → 2년 뒤 로펌의 제안이 오기 시작한다","refs":[1,2,3,4]},{"label":"전개","sentences":"S5 · S6 · S7","text":"낮은 급여 탓에 제안을 모두 물렸음을 든다 → 다른 분야를 공부해 법학 교수가 된다 → 컬럼비아 최초의 여성 종신 교수가 된다","refs":[5,6,7]},{"label":"도착","sentences":"S8 · S9 · S10 · S11","text":"시민 자유 연맹에서 성차별 사건을 변론한다 → 판사가 되려고 대학을 떠난다 → 13년 뒤 두 번째 여성 대법관이 된다 → 재직 내내 싸움을 멈추지 않았다고 요약한다","refs":[8,9,10,11]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["시민 자유 연맹에서 성차별 사건을 변론한다 → 판사가 되려고 대학을 떠난다 → 13년 뒤 두 번째 여성 대법관이 된다 → 재직 내내 싸움을 멈추지 않았다고 요약한다","뛰어난 성적에도 막힌 취업: 좋은 학력에도 취업이 막혔음을 짚는다 → 재직 내내 싸움을 멈추지 않았다고 요약한다","좋은 학력에도 취업이 막혔음을 짚는다 → 여성·유대인·어머니라는 조건을 든다 → 지방 법원 서기가 첫 자리였다고 밝힌다 → 2년 뒤 로펌의 제안이 오기 시작한다"],"answer":1,"why":"뛰어난 성적에도 막힌 취업: 좋은 학력에도 취업이 막혔음을 짚는다 → 재직 내내 싸움을 멈추지 않았다고 요약한다","refs":[1,11]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","시민 자유 연맹에서 성차별 사건을 변론한다 → 판사가 되려고 대학을 떠난다 → 13년 뒤 두 번째 여성 대법관이 된다 → 재직 내내 싸움을 멈추지 않았다고 요약한다","좋은 학력에도 취업이 막혔음을 짚는다 → 여성·유대인·어머니라는 조건을 든다 → 지방 법원 서기가 첫 자리였다고 밝힌다 → 2년 뒤 로펌의 제안이 오기 시작한다"],"answer":1,"why":"시민 자유 연맹에서 성차별 사건을 변론한다 → 판사가 되려고 대학을 떠난다 → 13년 뒤 두 번째 여성 대법관이 된다 → 재직 내내 싸움을 멈추지 않았다고 요약한다","refs":[8,9,10,11]},{"type":"문법","q":"S2의 'not only a woman but also' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","not only a woman but also — 상관접속사"],"answer":2,"why":"She was Jewish and a mother as well as a woman.","refs":[2]}],"key_sentence_en":"During her time as a judge, Ginsburg never stopped fighting for women's rights and gender equality.","key_sentence_ko":"판사로 재직하는 동안, 긴즈버그는 여성의 권리와 성평등을 위한 싸움을 멈추지 않았다."},{"id":"l1-03","title":"성별을 가르지 않는 법","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"성별을 가르지 않는 법: 법률 세 가지 사례를 들겠다고 알린다 → 법 이전엔 남편 서명이 필요했다고 대비한다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"법률 세 가지 사례를 들겠다고 알린다 → 첫째 법의 요지를 한 줄로 내건다 → 성평등 정책은 남녀 모두에 이로워야 한다고 편다 → 1972년 변호한 Moritz를 등장시킨다","refs":[1,2,3,4]},{"head":"전개","body":"아픈 어머니를 돌볼 도움이 필요했음을 든다 → 세금 혜택 대상에서 빠진 까닭을 밝힌다 → 미혼 남성이라 감면을 못 받았음을 짚는다","refs":[5,6,7]},{"head":"도착","body":"그 뒤 성별을 가리지 않게 법이 바뀌었다고 맺는다 → 둘째 법의 요지를 한 줄로 내건다 → 신용 기회 균등법 통과에 이바지했음을 든다 → 법 이전엔 남편 서명이 필요했다고 대비한다","refs":[8,9,10,11]}],"takeaway":"성별을 가르지 않는 법: 법률 세 가지 사례를 들겠다고 알린다 → 법 이전엔 남편 서명이 필요했다고 대비한다"},"easy_story":"법률 세 가지 사례를 들겠다고 알린다 → 첫째 법의 요지를 한 줄로 내건다 → 성평등 정책은 남녀 모두에 이로워야 한다고 편다 → 1972년 변호한 Moritz를 등장시킨다. 아픈 어머니를 돌볼 도움이 필요했음을 든다 → 세금 혜택 대상에서 빠진 까닭을 밝힌다 → 미혼 남성이라 감면을 못 받았음을 짚는다. 그 뒤 성별을 가리지 않게 법이 바뀌었다고 맺는다 → 둘째 법의 요지를 한 줄로 내건다 → 신용 기회 균등법 통과에 이바지했음을 든다 → 법 이전엔 남편 서명이 필요했다고 대비한다.","blocking_vocab":[{"word":"legislation","meaning":"법안, 법률"},{"word":"gender equality","meaning":"성평등"},{"word":"entitle","meaning":"자격을 부여하다"}],"sentences":[{"n":1,"en":"Here are three examples of legislation that Ginsburg helped to pass.","ko":"다음은 긴즈버그가 통과시키는 데 도움을 준 법안의 세 가지 예시이다.","grammar":[{"label":"Here are three examples","explanation":"Here are three examples — 도치 · 수 일치"},{"label":"that Ginsburg helped to pass","explanation":"that Ginsburg helped to pass — 목적격 관계대명사"}]},{"n":2,"en":"1. Men are entitled to the same caregiving and Social Security rights as women.","ko":"1. 남성은 여성과 동일한 간병 및 사회 보장의 권리를 누릴 자격이 있다.","grammar":[]},{"n":3,"en":"Ginsburg always argued that gender equality policies should benefit both men and women.","ko":"긴즈버그는 성평등 정책은 남성과 여성 모두에게 혜택을 주어야 한다고 항상 주장했다.","grammar":[]},{"n":4,"en":"In 1972, Ginsburg represented Charles Moritz, who was a journalist in his early sixties.","ko":"1972년에, 긴즈버그는 찰스 모리츠를 변호했는데 그는 60대 초반의 기자였다.","grammar":[]},{"n":5,"en":"Moritz needed help taking care of his sick mother.","ko":"모리츠는 그의 아픈 어머니를 돌보는 데 도움이 필요했다.","grammar":[]},{"n":6,"en":"However, he could not receive tax benefits for hiring a caregiver, because they were only available to women, divorced men, and men whose wives were disabled or had passed away.","ko":"그러나 간병인을 고용하는 것에 대한 세금 혜택은 여성 및 이혼한 남성, 아내가 장애가 있거나 사망한 남성에게만 주어졌기 때문에 그는 그 혜택을 받을 수 없었다.","grammar":[{"label":"whose wives","explanation":"whose wives — 소유격 관계대명사 (✗ whose the wives)"},{"label":"were disabled or had passed away","explanation":"were disabled or had passed away — whose wives의 병렬 서술 · 상태와 선행 완료"}]},{"n":7,"en":"As an unmarried man, Moritz did not qualify to have his taxes reduced.","ko":"미혼 남성으로서, 모리츠는 세금을 감면받을 수 있는 자격을 갖추지 못했다.","grammar":[]},{"n":8,"en":"Nevertheless, after this case, the federal law was changed to allow people of any gender to have their taxes reduced so that they can hire caregivers.","ko":"그럼에도 불구하고, 이 사건 이후 어떤 성별의 사람이라도 간병인을 고용할 수 있게 세금을 감면해 주도록 연방법이 바뀌었다.","grammar":[{"label":"was changed to allow","explanation":"was changed to allow — 수동태＋to부정사 · 「허용하도록 바뀌었다」","transform_label":"so that S can V → in order to V — …할 수 있도록","transform_value":"… taxes reduced in order to hire caregivers."},{"label":"so that they can hire","explanation":"so that they can hire — 목적"}]},{"n":9,"en":"2. Women have the right to financial independence and equal benefits.","ko":"2. 여성은 재정적 독립과 동등한 혜택을 누릴 권리가 있다.","grammar":[]},{"n":10,"en":"In 1974, Ginsburg's work also helped pass the Equal Credit Opportunity Act, which prevents banks from discriminating against people based on their age, race, gender, national origin, or marriage status.","ko":"1974년, 긴즈버그의 노력은 신용 기회 균등법이 통과되는 데도 기여했는데 이 법은 은행이 나이, 인종, 성별, 출신 국가, 결혼 여부에 따라 사람들을 차별하는 것을 막는다.","grammar":[]},{"n":11,"en":"Prior to this act, married women needed their husband to sign for a loan, even if they had a job and a higher income.","ko":"이 법안 이전에는 결혼한 여성들이 직업이 있고 더 높은 소득이 있더라도 대출을 받기 위해서는 남편의 서명이 필요했다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"법률 세 가지 사례를 들겠다고 알린다 → 첫째 법의 요지를 한 줄로 내건다 → 성평등 정책은 남녀 모두에 이로워야 한다고 편다 → 1972년 변호한 Moritz를 등장시킨다","refs":[1,2,3,4]},{"label":"전개","sentences":"S5 · S6 · S7","text":"아픈 어머니를 돌볼 도움이 필요했음을 든다 → 세금 혜택 대상에서 빠진 까닭을 밝힌다 → 미혼 남성이라 감면을 못 받았음을 짚는다","refs":[5,6,7]},{"label":"도착","sentences":"S8 · S9 · S10 · S11","text":"그 뒤 성별을 가리지 않게 법이 바뀌었다고 맺는다 → 둘째 법의 요지를 한 줄로 내건다 → 신용 기회 균등법 통과에 이바지했음을 든다 → 법 이전엔 남편 서명이 필요했다고 대비한다","refs":[8,9,10,11]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["법률 세 가지 사례를 들겠다고 알린다 → 첫째 법의 요지를 한 줄로 내건다 → 성평등 정책은 남녀 모두에 이로워야 한다고 편다 → 1972년 변호한 Moritz를 등장시킨다","그 뒤 성별을 가리지 않게 법이 바뀌었다고 맺는다 → 둘째 법의 요지를 한 줄로 내건다 → 신용 기회 균등법 통과에 이바지했음을 든다 → 법 이전엔 남편 서명이 필요했다고 대비한다","성별을 가르지 않는 법: 법률 세 가지 사례를 들겠다고 알린다 → 법 이전엔 남편 서명이 필요했다고 대비한다"],"answer":2,"why":"성별을 가르지 않는 법: 법률 세 가지 사례를 들겠다고 알린다 → 법 이전엔 남편 서명이 필요했다고 대비한다","refs":[1,11]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["법률 세 가지 사례를 들겠다고 알린다 → 첫째 법의 요지를 한 줄로 내건다 → 성평등 정책은 남녀 모두에 이로워야 한다고 편다 → 1972년 변호한 Moritz를 등장시킨다","앞의 사건과 관계없는 새 주제","그 뒤 성별을 가리지 않게 법이 바뀌었다고 맺는다 → 둘째 법의 요지를 한 줄로 내건다 → 신용 기회 균등법 통과에 이바지했음을 든다 → 법 이전엔 남편 서명이 필요했다고 대비한다"],"answer":2,"why":"그 뒤 성별을 가리지 않게 법이 바뀌었다고 맺는다 → 둘째 법의 요지를 한 줄로 내건다 → 신용 기회 균등법 통과에 이바지했음을 든다 → 법 이전엔 남편 서명이 필요했다고 대비한다","refs":[8,9,10,11]},{"type":"문법","q":"S1의 'Here are three examples' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","Here are three examples — 도치 · 수 일치"],"answer":2,"why":"Here are three examples — 도치 · 수 일치","refs":[1]}],"key_sentence_en":"Prior to this act, married women needed their husband to sign for a loan, even if they had a job and a higher income.","key_sentence_ko":"이 법안 이전에는 결혼한 여성들이 직업이 있고 더 높은 소득이 있더라도 대출을 받기 위해서는 남편의 서명이 필요했다."},{"id":"l1-04","title":"평생에 걸친 싸움","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"평생에 걸친 싸움: 셋째 법의 요지를 한 줄로 내건다 → 본인의 말을 그대로 실어 글을 닫는다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"셋째 법의 요지를 한 줄로 내건다 → 1996년 대법원 판결에서 맡은 몫을 든다 → 남성 전용 입학이 평등에 어긋난다고 밝힌다","refs":[1,2,3]},{"head":"전개","body":"여성도 같은 과정에 들어갈 수 있어야 한다고 편다 → 공공 교육의 평등한 권리를 굳혔다고 매긴다","refs":[4,5]},{"head":"도착","body":"소중히 여긴 가치를 위해 싸웠다고 묶는다 → 떠난 뒤에도 기억될 이름임을 밝힌다 → 본인의 말을 그대로 실어 글을 닫는다","refs":[6,7,8]}],"takeaway":"평생에 걸친 싸움: 셋째 법의 요지를 한 줄로 내건다 → 본인의 말을 그대로 실어 글을 닫는다"},"easy_story":"셋째 법의 요지를 한 줄로 내건다 → 1996년 대법원 판결에서 맡은 몫을 든다 → 남성 전용 입학이 평등에 어긋난다고 밝힌다. 여성도 같은 과정에 들어갈 수 있어야 한다고 편다 → 공공 교육의 평등한 권리를 굳혔다고 매긴다. 소중히 여긴 가치를 위해 싸웠다고 묶는다 → 떠난 뒤에도 기억될 이름임을 밝힌다 → 본인의 말을 그대로 실어 글을 닫는다.","blocking_vocab":[{"word":"justice","meaning":"대법관"},{"word":"state-funded","meaning":"국가의 지원을 받는"},{"word":"equal protection","meaning":"동등한 보호"},{"word":"public institution","meaning":"공공 기관"},{"word":"follow in her footsteps","meaning":"그녀의 뒤를 따르다"}],"sentences":[{"n":1,"en":"3. State-funded schools must admit women.","ko":"3. 주립 학교는 여성의 입학을 받아들여야 한다.","grammar":[]},{"n":2,"en":"In 1996, Ginsburg was also responsible for the Supreme Court's historic decision in United States v. Virginia.","ko":"1996년, 긴즈버그는 '미국 대 버지니아' 사건에서 대법원의 역사적인 판결을 담당하기도 했다.","grammar":[]},{"n":3,"en":"The decision stated that Virginia Military Institute's male-only admissions policy went against the principle of equal protection.","ko":"그 판결은 버지니아 군사학교의 남성만 입학시키는 정책은 평등한 보호의 원칙에 위배된다고 명시했다.","grammar":[]},{"n":4,"en":"Ginsburg argued that women should be allowed to join the same program as men.","ko":"긴즈버그는 여성이 남성과 같은 프로그램에 참여할 수 있어야 한다고 주장했다.","grammar":[]},{"n":5,"en":"This decision helped ensure that women have equal rights to education at public institutions in the United States.","ko":"이 판결은 여성들이 미국의 공공 기관에서 교육에 대한 평등한 권리를 보장받는 데 도움을 주었다.","grammar":[]},{"n":6,"en":"Throughout her life, Ruth Bader Ginsburg fought for the things she cared about and inspired others to follow in her footsteps.","ko":"그녀의 일생 동안, 긴즈버그는 그녀가 중요하게 생각하는 것들을 위해서 싸웠고 타인이 그녀의 발자취를 따르도록 영감을 주었다.","grammar":[]},{"n":7,"en":"Even though she passed away on September 18, 2020, she will always be remembered as a champion of equality and a tireless defender of justice.","ko":"2020년 9월 18일에 세상을 떠났다 하더라도, 그녀는 항상 평등의 옹호자이자 지칠 줄 모르는 정의의 수호자로 기억될 것이다.","grammar":[{"label":"will always be remembered as","explanation":"will always be remembered as — 수동태"},{"label":"a champion","explanation":"a champion · a tireless defender — 명사 병렬"}]},{"n":8,"en":"\"Fight for the things that you care about, but do it in a way that will lead others to join you.\" - Ruth Bader Ginsburg -","ko":"\"자신이 소중히 여기는 것을 위해 싸우되, 다른 사람들이 당신에게 동조하도록 이끌 수 있는 방식으로 해라.\" - 루스 베이더 긴즈버그 -","grammar":[{"label":"that you care about","explanation":"that you care about — 목적격 관계대명사"},{"label":"that will lead","explanation":"that will lead — 주격 관계대명사"}]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3","text":"셋째 법의 요지를 한 줄로 내건다 → 1996년 대법원 판결에서 맡은 몫을 든다 → 남성 전용 입학이 평등에 어긋난다고 밝힌다","refs":[1,2,3]},{"label":"전개","sentences":"S4 · S5","text":"여성도 같은 과정에 들어갈 수 있어야 한다고 편다 → 공공 교육의 평등한 권리를 굳혔다고 매긴다","refs":[4,5]},{"label":"도착","sentences":"S6 · S7 · S8","text":"소중히 여긴 가치를 위해 싸웠다고 묶는다 → 떠난 뒤에도 기억될 이름임을 밝힌다 → 본인의 말을 그대로 실어 글을 닫는다","refs":[6,7,8]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["셋째 법의 요지를 한 줄로 내건다 → 1996년 대법원 판결에서 맡은 몫을 든다 → 남성 전용 입학이 평등에 어긋난다고 밝힌다","소중히 여긴 가치를 위해 싸웠다고 묶는다 → 떠난 뒤에도 기억될 이름임을 밝힌다 → 본인의 말을 그대로 실어 글을 닫는다","평생에 걸친 싸움: 셋째 법의 요지를 한 줄로 내건다 → 본인의 말을 그대로 실어 글을 닫는다"],"answer":2,"why":"평생에 걸친 싸움: 셋째 법의 요지를 한 줄로 내건다 → 본인의 말을 그대로 실어 글을 닫는다","refs":[1,8]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","소중히 여긴 가치를 위해 싸웠다고 묶는다 → 떠난 뒤에도 기억될 이름임을 밝힌다 → 본인의 말을 그대로 실어 글을 닫는다","셋째 법의 요지를 한 줄로 내건다 → 1996년 대법원 판결에서 맡은 몫을 든다 → 남성 전용 입학이 평등에 어긋난다고 밝힌다"],"answer":1,"why":"소중히 여긴 가치를 위해 싸웠다고 묶는다 → 떠난 뒤에도 기억될 이름임을 밝힌다 → 본인의 말을 그대로 실어 글을 닫는다","refs":[6,7,8]},{"type":"문법","q":"S7의 'will always be remembered as' 설명으로 알맞은 것은?","choices":["will always be remembered as — 수동태","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"will always be remembered as — 수동태","refs":[7]}],"key_sentence_en":"\"Fight for the things that you care about, but do it in a way that will lead others to join you.\" - Ruth Bader Ginsburg -","key_sentence_ko":"\"자신이 소중히 여기는 것을 위해 싸우되, 다른 사람들이 당신에게 동조하도록 이끌 수 있는 방식으로 해라.\" - 루스 베이더 긴즈버그 -"},{"id":"l1-05","title":"생각·감정·행동의 인지 삼각형","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"생각·감정·행동의 인지 삼각형: 연기를 좋아하는 고등학생 마르코를 세운다 → 태도를 다시 세우는 도구가 됨을 밝힌다","diagram":{"kind":"cycle","title":"인지 삼각형: 한 지점이 다른 두 지점에 영향을 준다","items":[{"head":"생각","body":"나는 연기할 재능이 부족해.","refs":[3,6]},{"head":"감정","body":"실망하고 낙담한다.","refs":[4]},{"head":"행동","body":"오디션을 완전히 그만둔다.","refs":[5]}],"takeaway":"부정적 순환도 생기지만, 한 지점을 긍정적으로 바꾸면 다른 지점들도 함께 바뀔 수 있다(S8–S11)."},"easy_story":"연기를 좋아하는 고등학생 마르코를 세운다 → 오디션에 두 번 떨어진 일을 든다 → 재능이 없다는 생각으로 이어졌음을 짚는다 → 그 생각이 실망과 낙담을 불렀다고 잇는다. 희망을 잃은 듯 오디션을 그만두었다고 잇는다 → 다시 자신을 형편없다 여기는 데로 돌아온다 → 이 순환을 인지 삼각형이라 부른다고 밝힌다. 한 꼭짓점이 나머지에 영향을 준다고 푼다 → 그 반대도 성립한다고 방향을 돌린다 → 하나를 좋게 바꾸면 나머지도 바뀐다고 한다 → 태도를 다시 세우는 도구가 됨을 밝힌다.","blocking_vocab":[{"word":"cognitive triangle","meaning":"인지 삼각형"},{"word":"reject","meaning":"거절하다, 탈락시키다"},{"word":"discouraged","meaning":"낙담한"},{"word":"altogether","meaning":"완전히"},{"word":"reverse","meaning":"반대의 경우"}],"sentences":[{"n":1,"en":"Marco is a high school student who loves acting.","ko":"<생각하고, 느끼고, 행동하라: 더 나은 나를 위한 비결> 마르코는 연기를 사랑하는 고등학교 학생이다.","grammar":[{"label":"who loves acting","explanation":"who loves acting — 주격 관계대명사","transform_label":"loves acting — 동명사 목적어 → to부정사 목적어 — acting을 to act로 · love 는 둘 다 쓸 수 있다","transform_value":"… who loves to act."}]},{"n":2,"en":"Unluckily, he was rejected the last two times he auditioned for a local community play.","ko":"안타깝게도, 그는 참가한 지역 연극 오디션에서 두 번이나 떨어졌다.","grammar":[{"label":"times he auditioned","explanation":"times he auditioned — 관계부사 · 관계표현 생략 · times that he auditioned","transform_label":"two times he auditioned — 관계부사 생략 → when 복원 — 선행사 times 뒤에 when을 넣는다","transform_value":"… two times when he auditioned …"}]},{"n":3,"en":"That made him think that he didn't have enough talent to act.","ko":"그것은 그가 연기에 충분한 재능을 가지고 있지 않다는 생각이 들게 했다.","grammar":[]},{"n":4,"en":"These thoughts made him feel disappointed and discouraged.","ko":"이 생각들은 그가 실망스럽고 좌절하는 감정을 느끼게 했다.","grammar":[]},{"n":5,"en":"Therefore, he started to behave like he had lost all hope, and he stopped auditioning altogether.","ko":"그래서 그는 모든 희망을 잃은 것처럼 행동하기 시작했고, 오디션에 참가하는 것을 완전히 멈췄다.","grammar":[{"label":"had lost","explanation":"had lost — 과거완료 · 기준이 되는 과거보다 앞선 일","transform_label":"started to behave — to부정사 목적어 → 동명사 목적어 — to behave를 behaving으로 · start 는 둘 다 쓸 수 있다","transform_value":"… he started behaving like he …"}]},{"n":6,"en":"That led him to tell himself that he was a bad actor.","ko":"그것은 그가 자신을 형편없는 배우라고 여기게 했다.","grammar":[]},{"n":7,"en":"This cycle of thoughts, feelings, and behavior is known as the cognitive triangle.","ko":"이 생각, 감정, 행동의 순환은 인지 삼각형으로 알려져 있다.","grammar":[]},{"n":8,"en":"If one point of the triangle is negative, it can affect the other points.","ko":"만약 그 삼각형의 한 꼭짓점이 부정적이면, 그것은 다른 꼭짓점에도 영향을 줄 수 있다.","grammar":[]},{"n":9,"en":"However, the reverse is also true.","ko":"그러나 그 반대도 마찬가지이다.","grammar":[]},{"n":10,"en":"If you change one point in a positive way, it can change the others as well.","ko":"만약 당신이 한 꼭짓점을 긍정적으로 바꾸면, 그것은 다른 꼭짓점들도 또한 바꿀 수 있다.","grammar":[]},{"n":11,"en":"It can be used as a tool for resetting our attitude toward life, resulting in positive changes.","ko":"그것은 우리의 삶에 대한 태도를 재설정하는 데 사용되어, 긍정적인 변화라는 결과로 이어질 수 있다.","grammar":[]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4","text":"연기를 좋아하는 고등학생 마르코를 세운다 → 오디션에 두 번 떨어진 일을 든다 → 재능이 없다는 생각으로 이어졌음을 짚는다 → 그 생각이 실망과 낙담을 불렀다고 잇는다","refs":[1,2,3,4]},{"label":"전개","sentences":"S5 · S6 · S7","text":"희망을 잃은 듯 오디션을 그만두었다고 잇는다 → 다시 자신을 형편없다 여기는 데로 돌아온다 → 이 순환을 인지 삼각형이라 부른다고 밝힌다","refs":[5,6,7]},{"label":"도착","sentences":"S8 · S9 · S10 · S11","text":"한 꼭짓점이 나머지에 영향을 준다고 푼다 → 그 반대도 성립한다고 방향을 돌린다 → 하나를 좋게 바꾸면 나머지도 바뀐다고 한다 → 태도를 다시 세우는 도구가 됨을 밝힌다","refs":[8,9,10,11]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["생각·감정·행동의 인지 삼각형: 연기를 좋아하는 고등학생 마르코를 세운다 → 태도를 다시 세우는 도구가 됨을 밝힌다","연기를 좋아하는 고등학생 마르코를 세운다 → 오디션에 두 번 떨어진 일을 든다 → 재능이 없다는 생각으로 이어졌음을 짚는다 → 그 생각이 실망과 낙담을 불렀다고 잇는다","한 꼭짓점이 나머지에 영향을 준다고 푼다 → 그 반대도 성립한다고 방향을 돌린다 → 하나를 좋게 바꾸면 나머지도 바뀐다고 한다 → 태도를 다시 세우는 도구가 됨을 밝힌다"],"answer":0,"why":"생각·감정·행동의 인지 삼각형: 연기를 좋아하는 고등학생 마르코를 세운다 → 태도를 다시 세우는 도구가 됨을 밝힌다","refs":[1,11]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["한 꼭짓점이 나머지에 영향을 준다고 푼다 → 그 반대도 성립한다고 방향을 돌린다 → 하나를 좋게 바꾸면 나머지도 바뀐다고 한다 → 태도를 다시 세우는 도구가 됨을 밝힌다","연기를 좋아하는 고등학생 마르코를 세운다 → 오디션에 두 번 떨어진 일을 든다 → 재능이 없다는 생각으로 이어졌음을 짚는다 → 그 생각이 실망과 낙담을 불렀다고 잇는다","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"한 꼭짓점이 나머지에 영향을 준다고 푼다 → 그 반대도 성립한다고 방향을 돌린다 → 하나를 좋게 바꾸면 나머지도 바뀐다고 한다 → 태도를 다시 세우는 도구가 됨을 밝힌다","refs":[8,9,10,11]},{"type":"문법","q":"S1의 'who loves acting' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","who loves acting — 주격 관계대명사","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"… who loves to act.","refs":[1]}],"key_sentence_en":"It can be used as a tool for resetting our attitude toward life, resulting in positive changes.","key_sentence_ko":"그것은 우리의 삶에 대한 태도를 재설정하는 데 사용되어, 긍정적인 변화라는 결과로 이어질 수 있다.","image":"../../assets/gyeonghae2-textbook-marco-six-panel.webp","image_alt":"연기를 좋아하던 마르코가 두 번의 오디션 탈락 뒤 부정적인 생각과 감정, 행동의 순환에 빠졌다가 연습과 재도전이라는 작은 긍정적 변화를 시작하는 여섯 장면","image_caption":"S1–S11 · 탈락 → 부정적 생각 → 좌절 → 회피의 순환, 한 지점의 긍정적 변화가 다른 지점도 바꿀 수 있음"},{"id":"l1-06","title":"생각을 따지고 감정을 받아들이기","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"생각을 따지고 감정을 받아들이기: 첫째 방법으로 생각 다루기를 내건다 → 마침내 통제권을 되찾는다고 맺는다","diagram":{"kind":"steps","title":"지문 흐름을 한눈에","items":[{"head":"시작","body":"첫째 방법으로 생각 다루기를 내건다 → 하루에도 수천 생각이 오가고 일부는 부정적이라 한다 → 익숙한 말이 있는지 독자에게 되묻는다 → 대화를 못한다는 흔한 혼잣말을 든다 → 괜히 시도했다는 혼잣말을 든다 → 내게 문제가 있다는 혼잣말을 든다","refs":[1,2,3,4,5,6]},{"head":"전개","body":"사실이 아닌 습관·본능일 뿐이라 짚는다 → 그래도 실제 고통을 낳는다고 뒤집는다 → 하나씩 따져 생각하는 방식을 다시 짜라고 권한다 → 둘째 방법으로 감정 껴안기를 내건다 → 좋든 나쁘든 감정은 실제이고 타당하다고 놓는다","refs":[7,8,9,10,11]},{"head":"도착","body":"무시해도 그 사실은 달라지지 않는다고 되받는다 → 감정을 낮잡으면 스스로 부정적이 된다고 짚는다 → 그렇게 느끼는 일도 자연스럽다고 감싼다 → 바꾸려면 먼저 껴안으라고 이른다 → 받아들이면 스트레스가 줄어든다고 잇는다 → 마침내 통제권을 되찾는다고 맺는다","refs":[12,13,14,15,16,17]}],"takeaway":"생각을 따지고 감정을 받아들이기: 첫째 방법으로 생각 다루기를 내건다 → 마침내 통제권을 되찾는다고 맺는다"},"easy_story":"첫째 방법으로 생각 다루기를 내건다 → 하루에도 수천 생각이 오가고 일부는 부정적이라 한다 → 익숙한 말이 있는지 독자에게 되묻는다 → 대화를 못한다는 흔한 혼잣말을 든다 → 괜히 시도했다는 혼잣말을 든다 → 내게 문제가 있다는 혼잣말을 든다. 사실이 아닌 습관·본능일 뿐이라 짚는다 → 그래도 실제 고통을 낳는다고 뒤집는다 → 하나씩 따져 생각하는 방식을 다시 짜라고 권한다 → 둘째 방법으로 감정 껴안기를 내건다 → 좋든 나쁘든 감정은 실제이고 타당하다고 놓는다. 무시해도 그 사실은 달라지지 않는다고 되받는다 → 감정을 낮잡으면 스스로 부정적이 된다고 짚는다 → 그렇게 느끼는 일도 자연스럽다고 감싼다 → 바꾸려면 먼저 껴안으라고 이른다 → 받아들이면 스트레스가 줄어든다고 잇는다 → 마침내 통제권을 되찾는다고 맺는다.","blocking_vocab":[{"word":"simply","meaning":"단순히"},{"word":"cognitive triangle","meaning":"인지 삼각형"},{"word":"valid","meaning":"타당한"}],"sentences":[{"n":1,"en":"1. Tackling Negative Thoughts","ko":"1. 부정적인 생각에 대처하기","grammar":[]},{"n":2,"en":"Each day, your mind is filled with thousands of different thoughts, some of which are negative.","ko":"매일 당신의 마음은 수천 가지의 다른 생각들로 채워져 있으며, 그 생각들 중 일부는 부정적이다.","grammar":[]},{"n":3,"en":"Do any of these sound familiar?","ko":"이 중 익숙하게 들리는 것이 있는가?","grammar":[]},{"n":4,"en":"\"I'm not good at conversation.\"","ko":"\"나는 대화를 잘하지 못해.\"","grammar":[]},{"n":5,"en":"\"I shouldn't have bothered trying.\"","ko":"\"나는 굳이 시도하려고 애쓰지 말았어야 했어.\"","grammar":[]},{"n":6,"en":"\"There must be something wrong with me.\"","ko":"\"나한테 뭔가 잘못된 점이 있는 게 분명해.\"","grammar":[]},{"n":7,"en":"These thoughts, which are often not even rooted in fact, are simply part of habit or instinct.","ko":"보통은 사실에 기반하지도 않은 이 생각들은 단지 습관이나 본능일 뿐이다.","grammar":[]},{"n":8,"en":"Yet they cause real feelings that are painful and depressing.","ko":"그러나 이 생각들은 고통스럽고 우울한 실제 감정을 불러일으킨다.","grammar":[]},{"n":9,"en":"Using the cognitive triangle, you can challenge these thoughts one by one and begin to reprogram the way you think.","ko":"인지 삼각형을 이용하여, 당신은 이 생각들에 하나씩 도전하고 당신이 생각하는 방식을 다시 프로그래밍하기 시작할 수 있다.","grammar":[{"label":"the way you think","explanation":"the way you think — 관계부사 the way (✗ the way how)","transform_label":"Using the cognitive triangle — 분사구문 → 조건을 나타내는 부사절 — 접속사·주어를 넣고 분사를 정동사로","transform_value":"If you use the cognitive …"}]},{"n":10,"en":"2. Accepting Your Feelings","ko":"2. 감정을 받아들이기","grammar":[]},{"n":11,"en":"The feelings you have, whether negative or positive, are real and valid.","ko":"긍정적이든 부정적이든, 당신이 느끼는 감정은 실제이고 유효하다.","grammar":[{"label":"whether negative","explanation":"whether negative — 주어 + be동사 생략","transform_label":"whether negative — 주어 + be동사 생략 → 주어 + be동사 복원 — whether 뒤에 주어와 be동사를 되살린다","transform_value":"… have, whether they are negative or …"},{"label":"feelings you","explanation":"feelings you — 목적격 관계대명사 생략 · feelings that you"}]},{"n":12,"en":"Dismissing or minimizing them does not change that.","ko":"감정을 무시하거나 축소하는 것이 그 사실을 바꾸지 않는다.","grammar":[]},{"n":13,"en":"When you think of your feelings as being childish, inaccurate, or not allowed, you may feel negatively about them.","ko":"당신이 당신의 감정을 유치하고, 부정확하고, 허용되지 않는 것이라고 여길 때, 당신은 그 감정에 대해 부정적으로 느낄 수 있다.","grammar":[]},{"n":14,"en":"Of course, feeling bad about your emotions is normal and natural.","ko":"물론 자신의 감정에 대해 나쁘게 느끼는 것은 정상적이고 자연스러운 일이다.","grammar":[]},{"n":15,"en":"Therefore, the first step in changing them is to embrace them.","ko":"그러므로 그것을 변화시키는 첫 번째 단계는 받아들이는 것이다.","grammar":[]},{"n":16,"en":"Once you accept them, you will feel less stressed.","ko":"일단 그것을 받아들이면, 당신은 스트레스를 덜 받게 된다.","grammar":[]},{"n":17,"en":"Then, finally, you can alter your feelings, taking back control.","ko":"그리고 마침내, 당신은 감정에 대한 통제권을 되찾으면서 당신의 감정을 바꿀 수 있다.","grammar":[{"label":"문장 전환","explanation":"taking back control — 부대상황 분사구문 → 접속사 + 절 — and 와 주어 you 를 세워 절로 편다","transform_label":"taking back control — 부대상황 분사구문 → 접속사 + 절 — and 와 주어 you 를 세워 절로 편다","transform_value":"… your feelings, and you take back control."}]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3 · S4 · S5 · S6","text":"첫째 방법으로 생각 다루기를 내건다 → 하루에도 수천 생각이 오가고 일부는 부정적이라 한다 → 익숙한 말이 있는지 독자에게 되묻는다 → 대화를 못한다는 흔한 혼잣말을 든다 → 괜히 시도했다는 혼잣말을 든다 → 내게 문제가 있다는 혼잣말을 든다","refs":[1,2,3,4,5,6]},{"label":"전개","sentences":"S7 · S8 · S9 · S10 · S11","text":"사실이 아닌 습관·본능일 뿐이라 짚는다 → 그래도 실제 고통을 낳는다고 뒤집는다 → 하나씩 따져 생각하는 방식을 다시 짜라고 권한다 → 둘째 방법으로 감정 껴안기를 내건다 → 좋든 나쁘든 감정은 실제이고 타당하다고 놓는다","refs":[7,8,9,10,11]},{"label":"도착","sentences":"S12 · S13 · S14 · S15 · S16 · S17","text":"무시해도 그 사실은 달라지지 않는다고 되받는다 → 감정을 낮잡으면 스스로 부정적이 된다고 짚는다 → 그렇게 느끼는 일도 자연스럽다고 감싼다 → 바꾸 고 청한다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다","refs":[7,8,9]}],"takeaway":"행동을 하나 바꾸기: 셋째 방법으로 행동 고치기를 내건다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다"},"easy_story":"셋째 방법으로 행동 고치기를 내건다 → 행동이 생각에 맞서 순환을 끊는다고 푼다 → 결과가 없어도 시도가 남는다고 다독인다. 까닭을 물어 다음에 쓰라고 보탠다 → 갑자기 다 바꾸긴 어렵다고 짚는다 → 작은 변화 하나부터 시작하라고 이른다. 마르코 사례로 돌아가 보자고 이끈다 → 힘들다면 인지 삼각형을 써 보라고 청한다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다.","blocking_vocab":[{"word":"cognitive triangle","meaning":"인지 삼각형"},{"word":"negative cycle","meaning":"부정적인 순환"},{"word":"outcome","meaning":"결과"}],"sentences":[{"n":1,"en":"3. Changing Your Behavior","ko":"3. 행동 변화시키기","grammar":[]},{"n":2,"en":"Changing your behavior can be a good way to interrupt the negative cycle, because it challenges your thoughts about it.","ko":"행동을 변화시키는 것은 부정적인 순환에 대한 당신의 생각에 도전하기 때문에 부정적인 순환을 차단하는 좋은 방법이 될 수 있다.","grammar":[]},{"n":3,"en":"Even if the new behavior does not create the desired outcome, you will be glad that you at least tried.","ko":"새로운 행동이 바라던 결과를 끌어내지는 못하더라도, 당신은 적어도 시도했다는 것에 기쁨을 느낄 것이다.","grammar":[]},{"n":4,"en":"In some cases, you can ask for specific feedback about why something didn't go right, which will help you the next time.","ko":"어떤 경우에는, 당신은 어떤 것이 왜 제대로 진행되지 않았는지에 대한 구체적인 피드백을 요청할 수도 있고, 그것은 다음번에 도움이 될 것이다.","grammar":[]},{"n":5,"en":"Unsurprisingly, it would be difficult to suddenly start behaving completely differently one day.","ko":"당연히, 어느 날 갑자기 완전히 다르게 행동하는 것은 어려울 것이다.","grammar":[]},{"n":6,"en":"So begin by making one small change to your behavior ─ it could be a big step toward changing your cycle.","ko":"그러므로 당신의 행동에 작은 변화를 주는 것에서 시작해라. 그것은 당신의 순환을 바꾸는 큰 발걸음이 될 수 있을 것이다.","grammar":[]},{"n":7,"en":"Now let's get back to Marco's case to see how a positive cycle works.","ko":"이제, 마르코의 사례로 돌아가서 긍정적인 순환이 어떻게 작용하는지를 살펴보자.","grammar":[]},{"n":8,"en":"If you are suffering from challenges in your life that are pushing you into a negative cycle, how about trying the cognitive triangle?","ko":"만약 당신이 부정적인 순환으로 밀어 넣는 인생에서의 어려움으로 고통받고 있다면, 인지 삼각형을 시도해 보는 것은 어떨까?","grammar":[{"label":"that are pushing","explanation":"that are pushing — 주격 관계대명사","transform_label":"How about -ing? → Why don't you V? — …하는 게 어때?","transform_value":"… negative cycle, why don't you try the cognitive …"}]},{"n":9,"en":"You can stop yourself from thinking too negatively, and you may discover a positive aspect of your life that wasn't there before.","ko":"당신은 지나치게 부정적으로 생각하는 것으로부터 자신을 막을 수 있고, 이전에는 없던 삶의 긍정적인 측면을 발견할지도 모른다.","grammar":[{"label":"that wasn't there before","explanation":"that wasn't there before — 주격 관계대명사","transform_label":"stop oneself from -ing → refrain from -ing — …하는 것을 삼가다","transform_value":"You can refrain from thinking …"}]}],"structure":[],"flow":[{"label":"시작","sentences":"S1 · S2 · S3","text":"셋째 방법으로 행동 고치기를 내건다 → 행동이 생각에 맞서 순환을 끊는다고 푼다 → 결과가 없어도 시도가 남는다고 다독인다","refs":[1,2,3]},{"label":"전개","sentences":"S4 · S5 · S6","text":"까닭을 물어 다음에 쓰라고 보탠다 → 갑자기 다 바꾸긴 어렵다고 짚는다 → 작은 변화 하나부터 시작하라고 이른다","refs":[4,5,6]},{"label":"도착","sentences":"S7 · S8 · S9","text":"마르코 사례로 돌아가 보자고 이끈다 → 힘들다면 인지 삼각형을 써 보라고 청한다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다","refs":[7,8,9]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["마르코 사례로 돌아가 보자고 이끈다 → 힘들다면 인지 삼각형을 써 보라고 청한다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다","행동을 하나 바꾸기: 셋째 방법으로 행동 고치기를 내건다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다","셋째 방법으로 행동 고치기를 내건다 → 행동이 생각에 맞서 순환을 끊는다고 푼다 → 결과가 없어도 시도가 남는다고 다독인다"],"answer":1,"why":"행동을 하나 바꾸기: 셋째 방법으로 행동 고치기를 내건다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다","refs":[1,9]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","마르코 사례로 돌아가 보자고 이끈다 → 힘들다면 인지 삼각형을 써 보라고 청한다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다","셋째 방법으로 행동 고치기를 내건다 → 행동이 생각에 맞서 순환을 끊는다고 푼다 → 결과가 없어도 시도가 남는다고 다독인다"],"answer":1,"why":"마르코 사례로 돌아가 보자고 이끈다 → 힘들다면 인지 삼각형을 써 보라고 청한다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다","refs":[7,8,9]},{"type":"문법","q":"S8의 'that are pushing' 설명으로 알맞은 것은?","choices":["that are pushing — 주격 관계대명사","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"… negative cycle, why don't you try the cognitive …","refs":[8]}],"key_sentence_en":"You can stop yourself from thinking too negatively, and you may discover a positive aspect of your life that wasn't there before.","key_sentence_ko":"당신은 지나치게 부정적으로 생각하는 것으로부터 자신을 막을 수 있고, 이전에는 없던 삶의 긍정적인 측면을 발견할지도 모른다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 대아고2 교과서 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button>${s.grammar?.length?` <button class="reveal grammar-open" data-toggle="grammar">문법 포인트</button>`:''}<p class="translation">${esc(s.ko)}</p>${s.grammar?.length?`<div class="grammar-panel">${s.grammar.map(g=>`<div class="grammar-item"><b>${esc(g.label)}</b><p>${esc(g.explanation)}</p>${g.transform_value?`<small>시험에서는 이렇게 바꿀 수 있어요.</small><p class="grammar-transform">${esc(g.transform_value)}</p>`:''}</div>`).join('')}</div>`:''}</div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${p.image&&p.diagram?`<div class="post-reading-map">${renderDiagram(p.diagram,false)}</div>`:''}${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.nextElementSibling;target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='grammar'){const target=btn.parentElement.querySelector('.grammar-panel');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'문법 닫기':'문법 포인트'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

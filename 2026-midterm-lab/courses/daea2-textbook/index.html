</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">DAEA HIGH SCHOOL · GRADE 2</p><h1>영어독해와작문 교과서</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 1과 p8–33<br>이 화면은 Word 원문·공식 해석과 설명자료가 확인된 본문 1·2를 다룹니다. 그 밖의 활동·문법 지면은 포함하지 않습니다.</div><div class="units" id="units"></div><p class="subnote">1과 본문 1·2를 단락별로 읽고 문법 포인트를 클릭해 확인하세요.</p></main>
<script id="course-data" type="application/json">{"course":{"id":"daea2-textbook","title":"대아고2 영어독해와작문 교과서","grade":"고2"},"units":[{"id":"l1","label":"1과 · A Step to Spark Change","scope":"1과 본문 1·2","passages":[{"id":"l1-01","title":"Ruth Bader Ginsburg 는 누구인가","core":"긴즈버그는 뛰어난 학생이었지만 여성이라는 이유로 차별을 겪었다. 그래도 학업을 이어 가 컬럼비아 로스쿨을 수석으로 졸업했다."},{"id":"l1-02","title":"뛰어난 성적에도 막힌 취업","core":"긴즈버그는 뛰어난 학력에도 차별 때문에 변호사 일자리를 구하기 어려웠다. 교수를 거쳐 법관이 된 뒤에도 성평등을 위해 일했다."},{"id":"l1-03","title":"성별을 가르지 않는 법","core":"긴즈버그가 도운 성평등의 변화는 여성만을 위한 것이 아니었다. 남성의 간병 세금 혜택과 여성의 독립적인 대출 권리도 포함된다."},{"id":"l1-04","title":"평생에 걸친 싸움","core":"남성만 받던 주립 학교의 입학 정책에 맞서, 긴즈버그는 여성에게도 같은 교육 기회가 있어야 한다고 주장했다."},{"id":"l1-05","title":"생각·감정·행동의 인지 삼각형","core":"생각·감정·행동은 서로 영향을 준다. 부정적인 순환이 생길 수 있지만, 어느 한 부분을 긍정적으로 바꾸면 다른 부분도 달라질 수 있다."},{"id":"l1-06","title":"생각을 따지고 감정을 받아들이기","core":"부정적인 생각은 사실인지 따져 보고, 감정은 무시하지 말고 먼저 받아들여야 한다. 그래야 생각과 감정을 바꿀 출발점이 생긴다."},{"id":"l1-07","title":"행동을 하나 바꾸기","core":"부정적 순환을 끊으려면 행동을 한꺼번에 바꾸려 하지 말고 작은 변화 하나부터 시작한다. 결과가 달라도 시도와 피드백은 다음에 도움이 된다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('units').innerHTML=data.units.map((u,i)=>`<details class="unit" ${i===0?'open':''}><summary><div><h2>${esc(u.label)}</h2><span class="scope">${esc(u.scope)}</span></div><span class="count">${u.passages.length}지문</span></summary><div class="passages">${u.passages.map((p,j)=>`${u.passages.length>6&&j%5===0?`<h3 class="chunk-label">${j+1}–${Math.min(j+5,u.passages.length)}번</h3>`:''}<a class="passage" href="study.html#${esc(p.id)}"><b>${esc(p.title)}</b><span>${esc(p.core)}</span></a>`).join('')}</div></details>`).join('');
</script></body></html>

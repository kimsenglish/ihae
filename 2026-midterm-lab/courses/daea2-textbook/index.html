<script id="course-data" type="application/json">{"course":{"id":"daea2-textbook","title":"대아고2 영어독해와작문 교과서","grade":"고2"},"units":[{"id":"l1","label":"1과 · A Step to Spark Change","scope":"1과 본문 1·2","passages":[{"id":"l1-01","title":"Ruth Bader Ginsburg 는 누구인가","core":"Ruth Bader Ginsburg 는 누구인가: 동상 앞에서 사진 찍는 소녀들을 보여 준다 → 컬럼비아 편입과 수석 졸업으로 닫는다"},{"id":"l1-02","title":"뛰어난 성적에도 막힌 취업","core":"뛰어난 성적에도 막힌 취업: 좋은 학력에도 취업이 막혔음을 짚는다 → 재직 내내 싸움을 멈추지 않았다고 요약한다"},{"id":"l1-03","title":"성별을 가르지 않는 법","core":"성별을 가르지 않는 법: 법률 세 가지 사례를 들겠다고 알린다 → 법 이전엔 남편 서명이 필요했다고 대비한다"},{"id":"l1-04","title":"평생에 걸친 싸움","core":"평생에 걸친 싸움: 셋째 법의 요지를 한 줄로 내건다 → 본인의 말을 그대로 실어 글을 닫는다"},{"id":"l1-05","title":"생각·감정·행동의 인지 삼각형","core":"생각·감정·행동의 인지 삼각형: 연기를 좋아하는 고등학생 마르코를 세운다 → 태도를 다시 세우는 도구가 됨을 밝힌다"},{"id":"l1-06","title":"생각을 따지고 감정을 받아들이기","core":"생각을 따지고 감정을 받아들이기: 첫째 방법으로 생각 다루기를 내건다 → 마침내 통제권을 되찾는다고 맺는다"},{"id":"l1-07","title":"행동을 하나 바꾸기","core":"행동을 하나 바꾸기: 셋째 방법으로 행동 고치기를 내건다 → 부정을 멈추고 새 면을 볼 수 있다고 닫는다"}]}]}</script><script>

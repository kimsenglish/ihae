</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../../index.html">← 전체 자료</a><p class="eyebrow">DONGMYEONG HIGH SCHOOL · GRADE 2</p><h1>영어Ⅱ 교과서</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 1과·2과 본문<br>Word 원문·공식 해석을 기준으로, 어려운 내용은 쉬운 이야기와 도식으로 풀었습니다.</div><div class="units" id="units"></div><p class="subnote">1과 7구간 · 2과 7구간을 나누어 읽을 수 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":{"id":"dongmyeong2-textbook","title":"동명고2 영어Ⅱ 교과서","grade":"고2"},"units":[{"id":"l1","label":"1과 · Build a Better World","scope":"본문 7구간","passages":[{"id":"l1-01","title":"대공황 속의 밤 왕진","core":"대공황의 힘든 시기에 두 연구자는 퇴근 후에도 백일해에 걸린 아이들을 찾아가 검체를 모았다."},{"id":"l1-02","title":"백일해의 실상과 피해","core":"백일해는 어린아이에게 특히 치명적이었지만, 당시에는 효과적인 백신이 없었다."},{"id":"l1-03","title":"두 사람의 만남과 동기","core":"두 연구자는 개인적 경험과 아이들을 돕고 싶은 마음으로, 자금과 보수가 부족해도 백신 연구를 계속했다."},{"id":"l1-04","title":"검체 수집에서 현장 실험까지","core":"검체를 모아 백신을 만들고 안전성을 확인한 뒤, 어린이를 대상으로 첫 현장 실험을 했다."},{"id":"l1-05","title":"자금 부족과 뜻밖의 도움","core":"첫 성공 뒤에도 대규모 검증 자금이 부족했지만, Eleanor Roosevelt의 도움으로 연구를 확대할 수 있었다."},{"id":"l1-06","title":"대규모 실험과 배포","core":"대규모 실험에서도 백신 효과가 확인되었고, 보급 뒤 백일해 사망자 수는 크게 줄었다."},{"id":"l1-07","title":"특허를 마다한 이유","core":"두 연구자는 특허나 명성보다 협력과 많은 생명을 구한 결과를 더 중요하게 여겼다."}]},{"id":"l2","label":"2과 · The World of Scientific Discovery","scope":"본문 7구간","passages":[{"id":"l2-01","title":"과학은 모두의 것","core":"과학은 전문가만의 일이 아니며 일반인도 시민 과학으로 연구에 기여할 수 있다."},{"id":"l2-02","title":"백만 장의 은하 이미지","core":"은하 이미지 약 100만 장을 사람이 하나씩 분류해야 하는데, 혼자서는 시간이 너무 오래 걸렸다."},{"id":"l2-03","title":"온라인 대중 참여","core":"친구의 제안으로 Galaxy Zoo를 열고, 일반인이 간단한 안내와 클릭만으로 은하를 분류하도록 했다."},{"id":"l2-04","title":"Zooniverse로 성장","core":"온라인 시민들의 대규모 참여 덕분에 은하 분류가 가능해졌고 Galaxy Zoo는 더 큰 시민 과학 플랫폼으로 성장했다."},{"id":"l2-05","title":"낯선 빛의 띠","core":"오로라를 찍던 시민들이 익숙한 오로라와 다른 빛의 띠를 발견해 임시로 Steve라고 불렀다."},{"id":"l2-06","title":"NASA와 시민의 협업","core":"시민의 관찰을 전문가와 NASA가 연구로 이어 갔지만 STEVE의 정확한 설명은 아직 확정되지 않았다."},{"id":"l2-07","title":"호기심이 만드는 기여","core":"전문 학위가 없어도 호기심과 참여 의지가 있다면 누구나 과학 발전에 기여할 수 있다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('units').innerHTML=data.units.map((u,i)=>`<details class="unit" ${i===0?'open':''}><summary><div><h2>${esc(u.label)}</h2><span class="scope">${esc(u.scope)}</span></div><span class="count">${u.passages.length}지문</span></summary><div class="passages">${u.passages.map((p,j)=>`${u.passages.length>6&&j%5===0?`<h3 class="chunk-label">${j+1}–${Math.min(j+5,u.passages.length)}번</h3>`:''}<a class="passage" href="study.html#${esc(p.id)}"><b>${esc(p.title)}</b><span>${esc(p.core)}</span></a>`).join('')}</div></details>`).join('');
</script></body></html>

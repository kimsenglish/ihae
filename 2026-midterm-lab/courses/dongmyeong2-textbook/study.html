x;font-size:14px;font-weight:750}.quiz .evidence{background:#fff3d7}.final{background:var(--ink);color:white;padding:18px;border-radius:14px;margin-top:18px}.final button{background:var(--gold);border:0;border-radius:9px;padding:9px 13px;font-weight:900}.final p{display:none;margin:12px 0 0}.final p.show{display:block}.next{display:block;margin-top:20px;color:var(--green);font-weight:900;text-align:right}.quiet{font-size:13px;color:var(--muted)}@media(max-width:700px){main{padding:13px 13px 70px}.topnav a,.topnav button{padding:8px;font-size:11px}.steps a{font-size:10px;padding:10px 2px}.visual{grid-template-columns:1fr}.structure{grid-template-columns:1fr}.en{font-size:17px}.section{margin:14px 0}}

.diagram{overflow:hidden}
.diagram-items{counter-reset:visual-step}
.diagram-card{box-shadow:0 2px 0 rgba(13,76,57,.04)}
.diagram-card b{line-height:1.35}
.diagram-card small{font-variant-numeric:tabular-nums}
/* Sequential claims are connected; the source must actually support order. */
.diagram.diagram-steps .diagram-items,.diagram.diagram-timeline .diagram-items,
.diagram.diagram-cycle .diagram-items,.diagram.diagram-argument .diagram-items,
.diagram.diagram-steps-possible .diagram-items,.diagram.diagram-case-advice .diagram-items,
.diagram.diagram-steps-response .diagram-items,.diagram.diagram-cause-response .diagram-items,
.diagram.diagram-compare-open .diagram-items{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;
  border-left:3px solid #68aa91;margin-left:14px;padding-left:25px}
.diagram.diagram-steps .diagram-card,.diagram.diagram-timeline .diagram-card,
.diagram.diagram-cycle .diagram-card,.diagram.diagram-argument .diagram-card,
.diagram.diagram-steps-possible .diagram-card,.diagram.diagram-case-advice .diagram-card,
.diagram.diagram-steps-response .diagram-card,.diagram.diagram-cause-response .diagram-card,
.diagram.diagram-compare-open .diagram-card{position:relative;counter-increment:visual-step}
.diagram.diagram-steps .diagram-card:before,.diagram.diagram-timeline .diagram-card:before,
.diagram.diagram-cycle .diagram-card:before,.diagram.diagram-argument .diagram-card:before,
.diagram.diagram-steps-possible .diagram-card:before,.diagram.diagram-case-advice .diagram-card:before,
.diagram.diagram-steps-response .diagram-card:before,.diagram.diagram-cause-response .diagram-card:before,
.diagram.diagram-compare-open .diagram-card:before{content:counter(visual-step);position:absolute;left:-47px;top:10px;
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:#176b52;color:#fff;font-size:12px;font-weight:800;border:3px solid #f0f6ef}
.diagram.diagram-steps .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-timeline .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cycle .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-argument .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-possible .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-case-advice .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-steps-response .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-cause-response .diagram-items .diagram-card:not(:last-child):after,
.diagram.diagram-compare-open .diagram-items .diagram-card:not(:last-child):after{
  content:'↓';position:absolute;left:-39px;bottom:-26px;margin:0;padding:0 2px;
  color:#176b52;background:#f0f6ef;line-height:1.2;font-size:17px;font-weight:800}
.diagram.diagram-cycle .diagram-items:after{content:'↶ 반복되는 해석';font-size:12px;color:#176b52;
  font-weight:750;margin:-13px 0 0 4px}
/* A common condition branches, while independent cases do not. */
.diagram.diagram-condition .diagram-items,.diagram.diagram-branches .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.diagram.diagram-condition .diagram-card:first-child,.diagram.diagram-branches .diagram-card:first-child{
  grid-column:1/-1;background:#dceee5;border-color:#82baa2;position:relative}
.diagram.diagram-condition .diagram-card:first-child:after,.diagram.diagram-branches .diagram-card:first-child:after{
  content:'↙                 ↘';position:absolute;bottom:-25px;left:0;right:0;text-align:center;
  color:#176b52;font-size:18px;font-weight:900;white-space:pre}
.diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.diagram.diagram-compare .diagram-card,.diagram.diagram-cases .diagram-card{
  border-top:5px solid #1b795c;background:linear-gradient(180deg,#f9fffb,#fff 48%)}
.diagram.diagram-compare .diagram-card:nth-child(even),.diagram.diagram-cases .diagram-card:nth-child(even){border-top-color:#bd8141}
.diagram.diagram-web .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-web .diagram-card{border-radius:20px;border:2px solid #a4cab4;text-align:center}
.diagram.diagram-web .diagram-card:first-child{grid-column:1/-1;justify-self:center;width:min(100%,360px);
  background:#dceee5;border-color:#498f6e;border-radius:100px;position:relative}
.diagram.diagram-web .diagram-card:first-child:after{content:'↙                         ↘';
  position:absolute;left:0;right:0;bottom:-28px;color:#176b52;font-weight:900;white-space:pre}
.diagram.diagram-dose .diagram-items{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;padding-top:23px}
.diagram.diagram-dose .diagram-items:before{content:'';position:absolute;top:10px;left:10%;right:10%;height:5px;
  background:linear-gradient(90deg,#9bc9b4,#1b795c 40%,#1b795c 67%,#9bc9b4);border-radius:5px}
.diagram.diagram-dose .diagram-card{position:relative;border-top:0;text-align:center}
.diagram.diagram-dose .diagram-card:before{content:'';position:absolute;top:-23px;left:calc(50% - 7px);
  width:14px;height:14px;border-radius:50%;background:#176b52;border:3px solid #f0f6ef}
.diagram.diagram-dose .diagram-card:nth-child(2){background:#dceee5;border-color:#82baa2}
.diagram.diagram-dose .diagram-card b{font-size:18px}
/* Cooking: familiar side benefits are distinct from the source's energy-to-adaptation claim. */
.diagram.diagram-energy-route .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px}
.diagram.diagram-energy-route .diagram-card{position:relative;min-width:0;border-top:5px solid #237c5c;padding-top:35px;background:#fffdf8}
.diagram.diagram-energy-route .diagram-card:first-child{grid-column:1/-1;border:1px dashed #a9b8ad;background:#f8faf6;padding:10px 14px}
.diagram.diagram-energy-route .diagram-card:first-child:before{content:'먼저 떠오르는 장점';display:block;color:#65766b;font-size:11px;font-weight:800;margin-bottom:3px}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before,.diagram.diagram-energy-route .diagram-card:nth-child(3):before,.diagram.diagram-energy-route .diagram-card:nth-child(4):before{position:absolute;top:8px;left:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#176b52;font-size:12px;font-weight:900}
.diagram.diagram-energy-route .diagram-card:nth-child(2):before{content:'1'}.diagram.diagram-energy-route .diagram-card:nth-child(3):before{content:'2'}.diagram.diagram-energy-route .diagram-card:nth-child(4):before{content:'3'}
.diagram.diagram-energy-route .diagram-card:nth-child(2):after,.diagram.diagram-energy-route .diagram-card:nth-child(3):after{content:'→';position:absolute;right:-19px;top:calc(50% - 16px);color:#176b52;font-size:26px;font-weight:900;z-index:1}
.diagram.diagram-energy-route .diagram-card:nth-child(2){background:#e5f4e9}.diagram.diagram-energy-route .diagram-card:nth-child(4){background:#fff2d9;border-top-color:#b78539}
/* Three alternative survival responses, not three consecutive steps. */
.diagram.diagram-reaction-options .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 10px}
.diagram.diagram-reaction-options .diagram-card:first-child{grid-column:1/-1;text-align:center;background:#dceee5;border:2px solid #82baa2;position:relative}
.diagram.diagram-reaction-options .diagram-card:first-child:after{content:'↙    ↓    ↘';position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:#176b52;font-weight:900;font-size:21px;white-space:pre}
.diagram.diagram-reaction-options .diagram-card:not(:first-child){text-align:center;border-top:5px solid #247b5b}
.diagram.diagram-reaction-options .diagram-card:not(:first-child) b{font-size:20px}
.diagram.diagram-reaction-options .diagram-card:not(:first-child):before{display:block;font-size:27px;line-height:1;margin-bottom:8px;color:#176b52}
.diagram.diagram-reaction-options .diagram-card:nth-child(2):before{content:'⏸'}.diagram.diagram-reaction-options .diagram-card:nth-child(3):before{content:'➜'}.diagram.diagram-reaction-options .diagram-card:nth-child(4):before{content:'↗'}
.diagram.diagram-reaction-options .diagram-takeaway{background:#fff2d9;border:0;border-radius:10px;padding:12px}
/* The first pass shows only the visual map; stage 3 restores the evidence. */
.diagram.is-overview .diagram-card p,.diagram.is-overview .diagram-card small{display:none}
.diagram.is-overview .diagram-card{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}
.diagram.is-overview .diagram-card b{font-size:15px}
.diagram.is-overview .diagram-takeaway{display:block;background:#dceee5;border:0;border-radius:11px;
  margin-top:14px;padding:10px 12px;text-align:center;color:#14543f}
/* A conversation is shown as speech rather than two neutral information boxes. */
.diagram.diagram-dialogue .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.diagram.diagram-dialogue .diagram-card{min-height:145px;position:relative;padding:16px 16px 16px 54px;
  border-radius:22px 22px 22px 5px;background:#e0f0e7;border:2px solid #4d9b79}
.diagram.diagram-dialogue .diagram-card:before{content:'●';position:absolute;left:14px;top:13px;
  color:#176b52;font-size:24px;line-height:1}
.diagram.diagram-dialogue .diagram-card:after{content:'';position:absolute;left:12px;top:42px;
  width:25px;height:34px;border-radius:16px 16px 6px 6px;background:#176b52}
.diagram.diagram-dialogue .diagram-card:nth-child(2){background:#fff7e9;border-color:#c78f4b}
.diagram.diagram-dialogue .diagram-card:nth-child(2):before{color:#a96e2c}
.diagram.diagram-dialogue .diagram-card:nth-child(2):after{background:#a96e2c}
.diagram.diagram-dialogue .diagram-card b{font-size:17px}
.diagram.diagram-dialogue.is-overview .diagram-card{min-height:116px}
/* A claim supported by parallel examples ends in one explicit conclusion. */
.diagram.diagram-examples-conclusion .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-examples-conclusion .diagram-card:first-child,
.diagram.diagram-examples-conclusion .diagram-card:last-child{grid-column:1/-1}
.diagram.diagram-examples-conclusion .diagram-card:first-child{background:#e1efe7;border:2px solid #76ad91;text-align:center}
.diagram.diagram-examples-conclusion .diagram-card:last-child{background:#fff2d9;border:2px solid #c5924d;text-align:center}
/* Two sides are compared before the text states its conclusion or explanation. */
.diagram.diagram-compare-conclusion .diagram-items,
.diagram.diagram-compare-explanation .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(-n+2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(-n+2){border-top:5px solid #1b795c}
.diagram.diagram-compare-conclusion .diagram-card:nth-child(2),
.diagram.diagram-compare-explanation .diagram-card:nth-child(2){border-top-color:#bd8141}
.diagram.diagram-compare-conclusion .diagram-card:last-child,
.diagram.diagram-compare-explanation .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Analogy maps one domain to another, followed by a concrete example. */
.diagram.diagram-analogy .diagram-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diagram.diagram-analogy .diagram-card:nth-child(1){border-top:5px solid #1b795c}
.diagram.diagram-analogy .diagram-card:nth-child(2){border-top:5px solid #bd8141}
.diagram.diagram-analogy .diagram-card:last-child{grid-column:1/-1;background:#e1efe7;border:2px solid #76ad91;text-align:center}
/* Three roles are simultaneous parts of one contrast, not a causal sequence. */
.diagram.diagram-roles-contrast .diagram-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diagram.diagram-roles-contrast .diagram-card{border-top:5px solid #1b795c}
.diagram.diagram-roles-contrast .diagram-card:nth-child(2){border-top-color:#b25745}
.diagram.diagram-roles-contrast .diagram-card:nth-child(3){border-top-color:#bd8141}

 .diagram.diagram-compare .diagram-items,.diagram.diagram-cases .diagram-items,

 .diagram.diagram-examples-conclusion .diagram-card:first-child,

<script id="course-data" type="application/json">{"course":{"id":"dongmyeong2-textbook","title":"동명고2 영어Ⅱ 교과서","grade":"고2"},"units":[{"id":"l1","label":"1과 · Build a Better World","scope":"본문 7구간","passages":[{"id":"l1-01","title":"대공황 속의 밤 왕진","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"대공황의 힘든 시기에 두 연구자는 퇴근 후에도 백일해에 걸린 아이들을 찾아가 검체를 모았다.","diagram":{"kind":"steps","title":"퇴근 뒤에 시작된 일","items":[{"head":"대공황의 저녁","body":"사회도 병든 아이들의 가정도 어려운 상황","refs":[1,2]},{"head":"아이들의 집 방문","body":"두 연구자가 램프 불빛에 의지해 검체 수집","refs":[3,4,5]},{"head":"절박한 현장","body":"기침·호흡 곤란을 겪는 아이들과 부모들","refs":[6]}]},"easy_story":"1932년 겨울, 사회 전체가 대공황으로 어려웠습니다. Kendrick과 Eldering은 하루 일을 마친 뒤에도 백일해에 걸린 아이들의 집을 찾아갔습니다. 그곳에서 검체를 모으며 아이들과 가족이 겪는 고통을 직접 보았습니다.","blocking_vocab":[{"word":"pertussis","meaning":"백일해"},{"word":"sample","meaning":"검체·표본"}],"sentences":[{"n":1,"en":"One evening in late November 1932, a bitterly cold wind blows fiercely as two figures emerge from a laboratory.","ko":"<치명적인 질병에 맞서 싸운 두 영웅> 1932년 11월 말 어느 날 저녁, 몹시 차가운 바람이 거세게 부는 가운데 두 명의 인물이 실험실에서 모습을 드러낸다.","grammar":[]},{"n":2,"en":"Darkness begins to fall as they set out into a world of failed banks, collapsed industry, and widespread despair ─ a world ruined by three years of the Great Depression.","ko":"그들이 파산한 은행들, 붕괴된 산업, 그리고 널리 퍼진 절망의 세계 ─ 3년간의 대공황으로 폐허가 된 세계 ─ 로 나아갈 때 어둠이 내리기 시작한다.","grammar":[{"label":"a world ruined by","explanation":"a world ruined by — 과거분사 · 수동태","transform_label":"a world ruined by — 과거분사 후치수식 → 관계사절 — ruined 앞에 that was를 넣어 절로 만든다","transform_value":"… a world that was ruined by …"}]},{"n":3,"en":"The workday has come to an end, but for Pearl Kendrick and Grace Eldering, a different kind of work is about to begin.","ko":"근무는 끝났지만, Pearl Kendrick과 Grace Eldering에게는 다른 종류의 일이 시작될 참이다.","grammar":[{"label":"has come to an end","explanation":"has come to an end — 현재완료","transform_label":"be about to V → be on the point of V-ing — 막 …하려 하다","transform_value":"… work is on the point of beginning."}]},{"n":4,"en":"They are on their way to visit the homes of children suffering from a deadly disease called pertussis.","ko":"그들은 백일해라고 불리는 치명적인 질병으로 고통받고 있는 어린이들의 집들을 방문하러 가는 길이다.","grammar":[]},{"n":5,"en":"The two women go from home to home collecting samples from the sick children by the faint light of their lamps.","ko":"두 여성은 집집마다 돌아다니면서 희미한 램프 불빛에 의지해 아픈 아이들의 검체를 수집한다.","grammar":[]},{"n":6,"en":"They listen to the tragic stories of desperate and unemployed parents as the children, coughing uncontrollably and struggling to breathe, barely hold on to life.","ko":"걷잡을 수 없이 기침하며 숨을 쉬기 위해 고군분투하는 아이들이 간신히 생을 붙잡고 있을 때, 그들은 자포자기하고 실직한 부모들의 비극적인 이야기를 듣는다.","grammar":[]}],"structure":[],"flow":[{"label":"배경","sentences":"S1 · S2","text":"대공황으로 사회가 힘든 1932년의 저녁이다.","refs":[1,2]},{"label":"두 사람의 행동","sentences":"S3 · S4 · S5","text":"퇴근한 두 연구자는 아픈 아이들을 찾아가 검체를 모은다.","refs":[3,4,5]},{"label":"현장에서 본 것","sentences":"S6","text":"아이들은 숨쉬기 힘들어하고 부모들도 절박하다.","refs":[6]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["대공황의 힘든 시기에 두 연구자는 퇴근 후에도 백일해에 걸린 아이들을 찾아가 검체를 모았다.","대공황으로 사회가 힘든 1932년의 저녁이다.","아이들은 숨쉬기 힘들어하고 부모들도 절박하다."],"answer":0,"why":"대공황의 힘든 시기에 두 연구자는 퇴근 후에도 백일해에 걸린 아이들을 찾아가 검체를 모았다.","refs":[1,6]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","아이들은 숨쉬기 힘들어하고 부모들도 절박하다.","대공황으로 사회가 힘든 1932년의 저녁이다."],"answer":1,"why":"아이들은 숨쉬기 힘들어하고 부모들도 절박하다.","refs":[6]},{"type":"문법","q":"S2의 'a world ruined by' 설명으로 알맞은 것은?","choices":["a world ruined by — 과거분사 · 수동태","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"… a world that was ruined by …","refs":[2]}],"key_sentence_en":"They listen to the tragic stories of desperate and unemployed parents as the children, coughing uncontrollably and struggling to breathe, barely hold on to life.","key_sentence_ko":"걷잡을 수 없이 기침하며 숨을 쉬기 위해 고군분투하는 아이들이 간신히 생을 붙잡고 있을 때, 그들은 자포자기하고 실직한 부모들의 비극적인 이야기를 듣는다."},{"id":"l1-02","title":"백일해의 실상과 피해","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"백일해는 어린아이에게 특히 치명적이었지만, 당시에는 효과적인 백신이 없었다.","diagram":{"kind":"roster","title":"백신이 왜 시급했을까?","items":[{"head":"증상","body":"심한 기침·호흡 곤란과 특유의 소리","refs":[1,2]},{"head":"어린이 피해","body":"1930년대 미국 연평균 사망 약 6,000명, 그중 95%가 5세 미만","refs":[3,4,5]},{"head":"남은 과제","body":"원인균은 밝혔지만 효과적인 백신은 없었음","refs":[6,7]}]},"easy_story":"백일해는 심한 기침과 호흡 곤란을 일으키는 세균성 질환입니다. 당시에는 특히 어린아이들이 많이 목숨을 잃었습니다. 원인균은 알려져 있었지만 효과적인 백신을 만드는 일은 아직 성공하지 못했습니다.","blocking_vocab":[{"word":"pertussis","meaning":"백일해"},{"word":"vaccine","meaning":"백신"}],"sentences":[{"n":1,"en":"Pertussis is a bacterial disease characterized by serious coughing, breathing difficulties, and the high-pitched \"whooping\" sound that people with the disease make as they try to breathe in.","ko":"백일해는 심각한 기침, 호흡 곤란, 그리고 이 질병에 걸린 사람들이 숨을 들이쉬려 할 때 내는 고음의 '흡(whooping)' 소리로 특징 지어지는 세균성 질환이다.","grammar":[]},{"n":2,"en":"Because of this distinct sound, people started to call the disease \"whooping cough.\"","ko":"이 독특한 소리 때문에 사람들은 이 질병을 'whooping cough(백일해)'라고 부르기 시작했다.","grammar":[]},{"n":3,"en":"For a long time, this terrible illness was one of the greatest terrors of families with young children, because babies who contracted it had a high chance of dying.","ko":"오랫동안, 이 끔찍한 병은 어린아이들이 있는 가정의 가장 큰 공포 중 하나였는데, 백일해에 걸린 아기는 사망할 확률이 높았기 때문이다.","grammar":[{"label":"who contracted it","explanation":"who contracted it — 주격 관계대명사","transform_label":"one of the greatest terrors — 최상급 · one of + 복수명사 → 원급 비교 few ~ as ~ as — few ~ as ~ as로 최상급 뜻을 살린다","transform_value":"… long time, few things were as frightening to families with young children as this terrible illness, because babies …"}]},{"n":4,"en":"In the 1930s, an average of 6,000 people died of whooping cough in the United States each year.","ko":"1930년대에, 미국에서는 매년 평균 6,000명이 백일해로 사망했다.","grammar":[]},{"n":5,"en":"Ninety-five percent of them were children under five years of age.","ko":"그들 중 95%가 5세 미만의 어린이였다.","grammar":[]},{"n":6,"en":"The cause of the disease had been identified in 1906, but the vaccines that had been developed were ineffective.","ko":"그 질병의 원인은 1906년에 밝혀졌지만, 개발된 백신은 효과가 없었다.","grammar":[{"label":"had been identified","explanation":"had been identified · had been developed — had been + p.p. 과거완료 수동태의 대응"},{"label":"that had been developed","explanation":"that had been developed — 주격 관계대명사"}]},{"n":7,"en":"Scientists and researchers worked for more than 20 years to produce an effective one, but their efforts were fruitless ─ until Kendrick and Eldering came along.","ko":"과학자들과 연구원들은 효과적인 백신을 만들기 위해 20년 이상 노력했지만, 그들의 노력은 성과가 없었다 ─ Kendrick과 Eldering이 나타나기 전까지는 말이다.","grammar":[]}],"structure":[],"flow":[{"label":"질병의 특징","sentences":"S1 · S2","text":"특유의 기침 소리와 호흡 곤란 때문에 백일해라 불렸다.","refs":[1,2]},{"label":"피해 규모","sentences":"S3 · S4 · S5","text":"아기들의 사망 위험이 높고 사망자의 대부분은 다섯 살 미만이었다.","refs":[3,4,5]},{"label":"해결되지 않은 문제","sentences":"S6 · S7","text":"원인균은 알았지만 기존 백신은 효과가 없었다.","refs":[6,7]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["원인균은 알았지만 기존 백신은 효과가 없었다.","백일해는 어린아이에게 특히 치명적이었지만, 당시에는 효과적인 백신이 없었다.","특유의 기침 소리와 호흡 곤란 때문에 백일해라 불렸다."],"answer":1,"why":"백일해는 어린아이에게 특히 치명적이었지만, 당시에는 효과적인 백신이 없었다.","refs":[1,7]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","원인균은 알았지만 기존 백신은 효과가 없었다.","특유의 기침 소리와 호흡 곤란 때문에 백일해라 불렸다."],"answer":1,"why":"원인균은 알았지만 기존 백신은 효과가 없었다.","refs":[6,7]},{"type":"문법","q":"S3의 'who contracted it' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","who contracted it — 주격 관계대명사"],"answer":2,"why":"… long time, few things were as frightening to families with young children as this terrible illness, because babies …","refs":[3]}],"key_sentence_en":"Scientists and researchers worked for more than 20 years to produce an effective one, but their efforts were fruitless ─ until Kendrick and Eldering came along.","key_sentence_ko":"과학자들과 연구원들은 효과적인 백신을 만들기 위해 20년 이상 노력했지만, 그들의 노력은 성과가 없었다 ─ Kendrick과 Eldering이 나타나기 전까지는 말이다."},{"id":"l1-03","title":"두 사람의 만남과 동기","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"두 연구자는 개인적 경험과 아이들을 돕고 싶은 마음으로, 자금과 보수가 부족해도 백신 연구를 계속했다.","diagram":{"kind":"roster","title":"어려움이 있어도 계속한 이유","items":[{"head":"왜 시작했나","body":"어린 시절의 백일해 경험과 아이들의 건강","refs":[1,2,3,4,5]},{"head":"무엇이 막았나","body":"자금 부족·퇴근 후 무보수 연구","refs":[6,7,8]},{"head":"왜 멈추지 않았나","body":"아이들과 가족의 고통을 덜려는 목표","refs":[9,10,11]}]},"easy_story":"Kendrick과 Eldering은 보건부에서 만나 백일해 백신을 함께 연구했습니다. 두 사람 모두 어릴 때 백일해를 앓았기에 아이들의 고통을 잘 알았습니다. 돈과 시간이 부족했지만, 추가 수입이 아니라 아이들과 가족의 고통을 덜기 위해 퇴근 뒤 연구를 이어 갔습니다.","blocking_vocab":[{"word":"vaccine","meaning":"백신"},{"word":"bacteriology","meaning":"세균학"}],"sentences":[{"n":1,"en":"Pearl Kendrick studied bacteriology in university and was recruited by the Michigan Department of Health in 1920.","ko":"Pearl Kendrick은 대학에서 세균학을 공부했고 1920년 미시간주 보건부에 채용되었다.","grammar":[{"label":"studied","explanation":"studied · was recruited — 능동태와 수동태의 병렬","transform_label":"was recruited by — 수동태 → 능동태 — by 뒤를 주어로 올리고 her로 받는다","transform_value":"… of Health recruited her in 1920."}]},{"n":2,"en":"It was there that she met fellow bacteriologist Grace Eldering.","ko":"그녀가 동료 세균학자인 Grace Eldering을 만난 것은 바로 그곳에서였다.","grammar":[]},{"n":3,"en":"The two quickly bonded, and in 1932 they started working together on a vaccine for whooping cough.","ko":"두 사람은 빠르게 유대감을 형성했고, 1932년에 백일해 백신을 함께 연구하기 시작했다.","grammar":[]},{"n":4,"en":"Personal experience served as motivation for both of them, as they had each survived whooping cough as children themselves and remembered the severe pain of the disease.","ko":"개인적 경험이 두 사람 모두에게 (연구에 대한) 동기가 되었는데, 둘 다 어린 시절 백일해를 직접 이겨냈고 그 질병의 극심한 고통을 기억하고 있었기 때문이다.","grammar":[]},{"n":5,"en":"Both scientists were also eager to promote children's health.","ko":"두 과학자는 또한 아이들의 건강을 증진시키기를 간절히 바랐다.","grammar":[]},{"n":6,"en":"Unfortunately, research funding was extremely limited due to the Great Depression.","ko":"안타깝게도 대공황으로 인해 연구 자금이 극히 제한되었다.","grammar":[]},{"n":7,"en":"Also, Kendrick and Eldering had to develop the vaccine as a side project.","ko":"또한 Kendrick과 Eldering은 부가적인 프로젝트로 백신을 개발해야 했다.","grammar":[]},{"n":8,"en":"It was like having a second job for which they never received any payment.","ko":"그것은 마치 어떠한 보수도 받지 못하는 두 번째 직업을 갖는 것과 같았다.","grammar":[]},{"n":9,"en":"Still, when they finished their normal duties each day, they would get started on the work that they were enthusiastic about.","ko":"그럼에도 불구하고 그들은 매일 일상적인 업무를 마치고 나면, 그들이 열의를 가진 일을 시작하곤 했다.","grammar":[{"label":"that they were","explanation":"that they were — 목적격 관계대명사","transform_label":"that they were enthusiastic about — 목적격 관계대명사 · 전치사 후치 → 전치사 + 관계대명사 — 문미 about을 관계대명사 앞으로 옮긴다","transform_value":"… the work about which they were …"}]},{"n":10,"en":"The difficulties they faced did not stop them from persisting toward their goal.","ko":"그들이 직면한 어려움들은 그들이 목표를 향해 끈질기게 나아가는 것을 막지 못했다.","grammar":[{"label":"difficulties they","explanation":"difficulties they — 목적격 관계대명사 생략 · difficulties that they","transform_label":"The difficulties they faced — 목적격 관계대명사 생략 → which 복원 — faced 앞에 which를 되살린다","transform_value":"The difficulties which they faced …"}]},{"n":11,"en":"They did not do the work to make extra money; instead, they worked to relieve the suffering of innocent children and their families.","ko":"그들은 돈을 추가로 벌기 위해 그 일을 한 것이 아니었다. 그보다는, 그들은 죄 없는 아이들과 그들의 가족들의 고통을 덜어주기 위해 연구했다.","grammar":[]}],"structure":[],"flow":[{"label":"만남","sentences":"S1 · S2 · S3","text":"두 세균학자가 만나 1932년에 함께 백신 연구를 시작했다.","refs":[1,2,3]},{"label":"동기","sentences":"S4 · S5","text":"자신들의 백일해 경험과 아이들의 건강에 대한 관심이 있었다.","refs":[4,5]},{"label":"어려움","sentences":"S6 · S7 · S8","text":"대공황으로 자금이 부족하고 보수 없는 부업처럼 연구해야 했다.","refs":[6,7,8]},{"label":"계속한 이유","sentences":"S9 · S10 · S11","text":"돈이 아니라 고통받는 아이들과 가족을 돕고 싶었다.","refs":[9,10,11]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["두 세균학자가 만나 1932년에 함께 백신 연구를 시작했다.","돈이 아니라 고통받는 아이들과 가족을 돕고 싶었다.","두 연구자는 개인적 경험과 아이들을 돕고 싶은 마음으로, 자금과 보수가 부족해도 백신 연구를 계속했다."],"answer":2,"why":"두 연구자는 개인적 경험과 아이들을 돕고 싶은 마음으로, 자금과 보수가 부족해도 백신 연구를 계속했다.","refs":[1,11]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["두 세균학자가 만나 1932년에 함께 백신 연구를 시작했다.","앞의 사건과 관계없는 새 주제","돈이 아니라 고통받는 아이들과 가족을 돕고 싶었다."],"answer":2,"why":"돈이 아니라 고통받는 아이들과 가족을 돕고 싶었다.","refs":[9,10,11]},{"type":"문법","q":"S1의 'studied' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","studied · was recruited — 능동태와 수동태의 병렬"],"answer":2,"why":"… of Health recruited her in 1920.","refs":[1]}],"key_sentence_en":"They did not do the work to make extra money; instead, they worked to relieve the suffering of innocent children and their families.","key_sentence_ko":"그들은 돈을 추가로 벌기 위해 그 일을 한 것이 아니었다. 그보다는, 그들은 죄 없는 아이들과 그들의 가족들의 고통을 덜어주기 위해 연구했다."},{"id":"l1-04","title":"검체 수집에서 현장 실험까지","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"검체를 모아 백신을 만들고 안전성을 확인한 뒤, 어린이를 대상으로 첫 현장 실험을 했다.","diagram":{"kind":"steps","title":"백신 연구의 실제 순서","items":[{"head":"검체 수집·배양","body":"환자의 기침판에서 백일해균 분석","refs":[1,2,3,4]},{"head":"백신 후보·안전성","body":"실험실 시험과 연구자 자신에게 주사","refs":[8,9,10]},{"head":"첫 현장 실험","body":"1,592명 참여; 접종한 712명 중 발병 4명, 심각한 사례 0건","refs":[11,12]}]},"easy_story":"먼저 환자가 기침한 접시에서 세균을 배양해 연구했습니다. 두 사람은 백신 후보를 만든 뒤 아이들에게 쓰기 전에 실험실 검사와 자기 주사로 안전성을 확인했습니다. 첫 현장 실험에서는 접종한 712명 중 네 명만 백일해에 걸렸고, 심각한 사례는 없었습니다.","blocking_vocab":[{"word":"vaccine","meaning":"백신"},{"word":"sample","meaning":"검체·표본"},{"word":"incubator","meaning":"세균 배양기"},{"word":"clinical trial","meaning":"임상 실험"},{"word":"field test","meaning":"현장 실험"}],"sentences":[{"n":1,"en":"They began the process of developing their vaccine by gathering samples of the bacteria that cause whooping cough.","ko":"그들은 백일해의 원인이 되는 세균의 검체를 수집함으로써 백신을 개발하는 과정을 시작했다.","grammar":[{"label":"that cause","explanation":"that cause — 관계대명사절의 수 일치","transform_label":"that cause — 주격 관계대명사 → 현재분사구 — that cause를 causing 분사로 줄인다","transform_value":"… the bacteria causing whooping cough."}]},{"n":2,"en":"To support them, local doctors and nurses provided \"cough plates\" from their patients.","ko":"그들을 지원하기 위해, 지역 의사들과 간호사들은 그들의 환자들에게서 얻은 '기침판'을 제공했다.","grammar":[]},{"n":3,"en":"The patients coughed onto a petri dish, which was then put into an incubator.","ko":"환자들은 페트리 접시 위에 기침했고, 그런 다음 그것은 세균 배양기에 넣어졌다.","grammar":[{"label":"was then put","explanation":"was then put — 수동태","transform_label":", which was then put — 계속적 용법의 관계대명사 → 접속사+대명사 — which를 and it으로 푼다","transform_value":"… petri dish, and it was then …"}]},{"n":4,"en":"This allowed the bacteria to grow into colonies that Kendrick and Eldering could analyze.","ko":"이는 세균이 Kendrick과 Eldering이 분석할 수 있는 군집으로 자라게 했다.","grammar":[{"label":"that Kendrick and Eldering","explanation":"that Kendrick and Eldering — 목적격 관계대명사","transform_label":"allowed the bacteria to grow — allow + 목적어 + to부정사 → let + 목적어 + 동사원형 — let 뒤 to를 없애고 원형으로","transform_value":"This let the bacteria …"}]},{"n":5,"en":"When they collected samples on their own, they would go to the homes of sick children.","ko":"직접 검체를 수집할 때, 그들은 아픈 아이들의 집으로 가곤 했다.","grammar":[]},{"n":6,"en":"Each time, they were reminded once again of the dreadful suffering caused by the disease.","ko":"그때마다, 그들은 그 병에 의해 야기된 끔찍한 고통을 다시 한번 떠올렸다.","grammar":[]},{"n":7,"en":"The sight of these innocent young victims coughing and struggling to breathe was a powerful reminder of the urgent need for an effective vaccine.","ko":"이 무고한 어린 희생자들이 기침하고 숨쉬기 위해 고군분투하는 모습은 효과적인 백신의 시급한 필요성을 강력하게 상기시켰다.","grammar":[]},{"n":8,"en":"Kendrick and Eldering spent many long nights studying the bacteria and finally produced a potential vaccine.","ko":"Kendrick과 Eldering은 세균을 연구하며 많은 긴 밤을 보냈고, 마침내 잠재적인 백신을 생산해 냈다.","grammar":[]},{"n":9,"en":"Before they performed any clinical trials, though, they had to be certain that it would not have any negative side effects on the subjects.","ko":"그러나 임상 실험을 실시하기 전에, 그들은 그것이 실험 대상자들에게 어떠한 부정적인 부작용도 일으키지 않을 것이라는 것을 확실히 해야 했다.","grammar":[]},{"n":10,"en":"They ran many laboratory tests, and they even injected it into themselves to confirm that it was safe.","ko":"그들은 많은 실험실 시험을 실행했고, 심지어 그들은 그것이 안전하다는 것을 확인하기 위해 스스로에게 주사했다.","grammar":[]},{"n":11,"en":"From 1934 to 1935, they conducted their first field test with 1,592 children.","ko":"1934년부터 1935년까지, 그들은 1,592명의 아이들을 대상으로 첫 현장 실험을 실시했다.","grammar":[]},{"n":12,"en":"In the group of 712 vaccinated children, only four developed whooping cough, and none of these cases were serious.","ko":"백신을 접종한 712명의 아이들의 그룹에서, 단지 4명만이 백일해에 걸렸고, 이 사례들 중 어떠한 사례도 심각하지 않았다.","grammar":[]}],"structure":[],"flow":[{"label":"세균 확보","sentences":"S1 · S2 · S3 · S4 · S5","text":"기침판과 가정 방문으로 검체를 모아 배양했다.","refs":[1,2,3,4,5]},{"label":"연구의 긴급성","sentences":"S6 · S7","text":"아픈 아이들을 직접 보며 백신이 급하다는 사실을 확인했다.","refs":[6,7]},{"label":"백신·안전 검사","sentences":"S8 · S9 · S10","text":"백신 후보를 만든 뒤 부작용이 없는지 여러 차례 확인했다.","refs":[8,9,10]},{"label":"첫 현장 실험","sentences":"S11 · S12","text":"1934~1935년 어린이 1,592명 실험에서 접종군의 결과를 살폈다.","refs":[11,12]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["기침판과 가정 방문으로 검체를 모아 배양했다.","1934~1935년 어린이 1,592명 실험에서 접종군의 결과를 살폈다.","검체를 모아 백신을 만들고 안전성을 확인한 뒤, 어린이를 대상으로 첫 현장 실험을 했다."],"answer":2,"why":"검체를 모아 백신을 만들고 안전성을 확인한 뒤, 어린이를 대상으로 첫 현장 실험을 했다.","refs":[1,12]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","1934~1935년 어린이 1,592명 실험에서 접종군의 결과를 살폈다.","기침판과 가정 방문으로 검체를 모아 배양했다."],"answer":1,"why":"1934~1935년 어린이 1,592명 실험에서 접종군의 결과를 살폈다.","refs":[11,12]},{"type":"문법","q":"S1의 'that cause' 설명으로 알맞은 것은?","choices":["that cause — 관계대명사절의 수 일치","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"… the bacteria causing whooping cough.","refs":[1]}],"key_sentence_en":"In the group of 712 vaccinated children, only four developed whooping cough, and none of these cases were serious.","key_sentence_ko":"백신을 접종한 712명의 아이들의 그룹에서, 단지 4명만이 백일해에 걸렸고, 이 사례들 중 어떠한 사례도 심각하지 않았다."},{"id":"l1-05","title":"자금 부족과 뜻밖의 도움","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"첫 성공 뒤에도 대규모 검증 자금이 부족했지만, Eleanor Roosevelt의 도움으로 연구를 확대할 수 있었다.","diagram":{"kind":"steps","title":"첫 성공에서 대규모 실험까지","items":[{"head":"첫 실험 뒤","body":"더 큰 집단에서 효과를 다시 확인해야 함","refs":[1,2]},{"head":"막힌 이유","body":"심각한 자금 부족","refs":[3,4]},{"head":"도움과 변화","body":"Eleanor Roosevelt의 지원으로 대규모 실험 자금 확보","refs":[5,6,7,8,9]}]},"easy_story":"첫 현장 실험이 좋아 보였어도 두 연구자는 더 큰 규모로 다시 확인하고 싶었습니다. 하지만 자금이 모자라 실험을 늘릴 수 없었습니다. 연구실을 방문한 Eleanor Roosevelt가 그 중요성을 이해하고 도운 덕분에 대규모 실험 비용을 마련했습니다.","blocking_vocab":[{"word":"vaccine","meaning":"백신"}],"sentences":[{"n":1,"en":"Despite the apparent success of the vaccine, Kendrick and Eldering wanted further confirmation of its effectiveness.","ko":"백신의 분명한 성공에도 불구하고, Kendrick과 Eldering은 백신의 효과에 대한 추가 확인을 원했다.","grammar":[{"label":"Despite the apparent success of the vaccine","explanation":"Despite the apparent success of the vaccine — 양보의 전치사 Despite + 명사구 「~에도 불구하고」","transform_label":"Despite + 명사구 → Although + S + V — …에도 불구하고","transform_value":"Although the vaccine was apparently successful, Kendrick and …"}]},{"n":2,"en":"They became determined to expand their research and run more tests with larger groups of children.","ko":"그들은 연구를 확대하고 더 큰 그룹의 어린이들을 대상으로 더 많은 실험을 진행하기로 굳게 결심했다.","grammar":[]},{"n":3,"en":"However, they were unable to proceed because they were facing a severe lack of funds.","ko":"그러나 그들은 심각한 자금 부족에 직면하고 있었기 때문에 (연구와 실험을) 계속 진행할 수 없었다.","grammar":[]},{"n":4,"en":"With thousands of children continuing to suffer from the disease, they found themselves in a desperate situation.","ko":"수천 명의 어린이들이 계속해서 그 질병으로 고통받고 있는 가운데, 그들은 절망적인 상황에 처했다.","grammar":[]},{"n":5,"en":"Luckily, they got help from an unexpected figure.","ko":"다행히도 그들은 예상치 못한 인물로부터 도움을 받았다.","grammar":[]},{"n":6,"en":"In 1936, First Lady Eleanor Roosevelt herself visited the laboratory and saw with her own eyes the efforts that Kendrick and Eldering were making in their ":"그의 도움으로 대규모 실험 자금을 확보했다.","refs":[9]},{"type":"문법","q":"S1의 'Despite the apparent success of the vaccine' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","Despite the apparent success of the vaccine — 양보의 전치사 Despite + 명사구 「~에도 불구하고」","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"Although the vaccine was apparently successful, Kendrick and …","refs":[1]}],"key_sentence_en":"With her help, Kendrick and Eldering were able to secure enough funding to conduct a large-scale trial.","key_sentence_ko":"그녀의 도움으로 Kendrick과 Eldering은 대규모 실험을 실시하기에 충분한 자금을 확보할 수 있었다."},{"id":"l1-06","title":"대규모 실험과 배포","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"대규모 실험에서도 백신 효과가 확인되었고, 보급 뒤 백일해 사망자 수는 크게 줄었다.","diagram":{"kind":"steps","title":"실험 결과에서 보급까지","items":[{"head":"1937년까지","body":"4,200명 이상 실험; 접종군의 높은 면역력","refs":[1,2]},{"head":"1940년·1944년","body":"미국 전역 배포 → 권장 예방접종 목록","refs":[3,4]},{"head":"1970년대 중반","body":"연간 사망자 수 10명 미만","refs":[5]}]},"easy_story":"1937년까지 어린이 4,200명 이상이 더 큰 실험에 참여했습니다. 접종군의 면역력이 높게 나타나 백신은 미국 전역에 보급되고 권장 예방접종에도 들어갔습니다. 본문은 백일해 연간 사망자 수가 1934년 7,518명에서 1970년대 중반 10명 미만으로 내려갔다고 설명합니다.","blocking_vocab":[{"word":"vaccine","meaning":"백신"},{"word":"field test","meaning":"현장 실험"},{"word":"immunity","meaning":"면역력"}],"sentences":[{"n":1,"en":"By 1937, Kendrick and Eldering were able to include more than 4,200 children in their trial.","ko":"1937년까지 Kendrick과 Eldering은 4,200명 이상의 어린이들을 그들의 실험에 포함시킬 수 있었다.","grammar":[]},{"n":2,"en":"Just as in their first field test, the vaccinated group demonstrated a high level of immunity against the disease.","ko":"첫 번째 현장 실험에서와 같이, 백신을 접종한 그룹은 질병에 대해 높은 수준의 면역력을 보여주었다.","grammar":[]},{"n":3,"en":"The scientific community was amazed at the results, and, in 1940, the vaccine started being distributed all across the United States.","ko":"과학계는 그 결과에 깜짝 놀랐고, 1940년에 백신이 미국 전역으로 배포되기 시작했다.","grammar":[]},{"n":4,"en":"Four years later, it was added to the American Medical Association's list of recommended immunizations, and soon after, there was a dramatic decline in whooping cough infections.","ko":"4년 후, 이것은 미국 의학 협회의 권장 예방접종 목록에 추가되었고, 얼마 지나지 않아 백일해 감염은 극적으로 감소했다.","grammar":[{"label":"it was added to","explanation":"it was added to — 수동태 · 과거시제","transform_label":"there was a dramatic decline — 유도부사 there 구문 → 일반 주어문 — 명사 decline을 동사로 세우고 there를 지운다","transform_value":"… cough infections declined dramatically."}]},{"n":5,"en":"In the mid-1970s, the number of annual deaths caused by whooping cough, which had reached 7,518 in 1934, dropped to under 10.","ko":"1934년에 7,518명에 달했던 백일해로 인한 연간 사망자 수는 1970년대 중반에 10명 미만으로 떨어졌다.","grammar":[{"label":"caused by whooping cough","explanation":"caused by whooping cough — 과거분사 후치수식","transform_label":"under 10 — 전치사구 → 비교급(fewer than) — under를 fewer than 비교급으로 바꾼다","transform_value":"… dropped to fewer than 10."},{"label":"which had reached","explanation":"which had reached — 계속적 용법 · 과거완료","transform_label":"which had reached 7,518 → 접속사 + 대명사 — 계속적 용법을 접속사+대명사로 푼다","transform_value":"… in 1934, and it dropped to under 10 in the mid-1970s."}]}],"structure":[],"flow":[{"label":"대규모 실험","sentences":"S1 · S2","text":"4,200명 이상을 대상으로 접종군의 높은 면역력을 확인했다.","refs":[1,2]},{"label":"보급","sentences":"S3 · S4","text":"1940년 배포가 시작되고 1944년 권장 예방접종에 포함되었다.","refs":[3,4]},{"label":"변화","sentences":"S5","text":"연간 백일해 사망자 수가 크게 감소했다.","refs":[5]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["연간 백일해 사망자 수가 크게 감소했다.","대규모 실험에서도 백신 효과가 확인되었고, 보급 뒤 백일해 사망자 수는 크게 줄었다.","4,200명 이상을 대상으로 접종군의 높은 면역력을 확인했다."],"answer":1,"why":"대규모 실험에서도 백신 효과가 확인되었고, 보급 뒤 백일해 사망자 수는 크게 줄었다.","refs":[1,5]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["4,200명 이상을 대상으로 접종군의 높은 면역력을 확인했다.","앞의 사건과 관계없는 새 주제","연간 백일해 사망자 수가 크게 감소했다."],"answer":2,"why":"연간 백일해 사망자 수가 크게 감소했다.","refs":[5]},{"type":"문법","q":"S4의 'it was added to' 설명으로 알맞은 것은?","choices":["it was added to — 수동태 · 과거시제","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"… cough infections declined dramatically.","refs":[4]}],"key_sentence_en":"In the mid-1970s, the number of annual deaths caused by whooping cough, which had reached 7,518 in 1934, dropped to under 10.","key_sentence_ko":"1934년에 7,518명에 달했던 백일해로 인한 연간 사망자 수는 1970년대 중반에 10명 미만으로 떨어졌다."},{"id":"l1-07","title":"특허를 마다한 이유","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"두 연구자는 특허나 명성보다 협력과 많은 생명을 구한 결과를 더 중요하게 여겼다.","diagram":{"kind":"compare","title":"두 사람이 선택한 보상","items":[{"head":"가질 수도 있었던 것","body":"특허로 얻는 부와 개인적 명성","refs":[1,3,4]},{"head":"중요하게 여긴 것","body":"협력의 공로와 구해 낸 생명","refs":[2,5]}]},"easy_story":"백신으로 특허를 받았다면 부자가 될 수도 있었다는 말을 들었습니다. 하지만 두 사람은 여러 사람의 도움으로 만든 것이라며 공을 혼자 차지하지 않았고, 인터뷰와 지나친 칭찬도 피했습니다. 이들에게 가장 큰 보상은 많은 생명을 구했다는 사실이었습니다.","blocking_vocab":[{"word":"vaccine","meaning":"백신"},{"word":"patent","meaning":"특허를 받다"},{"word":"modest","meaning":"겸손한"},{"word":"contribution","meaning":"기여"}],"sentences":[{"n":1,"en":"Kendrick and Eldering were often told that they could have become very wealthy if they had patented their vaccine.","ko":"Kendrick과 Eldering은 그들이 백신으로 특허를 받았더라면 매우 부유해질 수도 있었을 것이라는 말을 자주 들었다.","grammar":[{"label":"were often told","explanation":"were often told — 수동태","transform_label":"if they had patented — 가정법 과거완료 → if 생략 도치 — if를 지우고 had를 주어 앞으로","transform_value":"… very wealthy had they patented …"},{"label":"could have become","explanation":"could have become — 가정법 주절"}]},{"n":2,"en":"However, they replied that it had not been created by them alone, but with the help of many others.","ko":"그러나 그들은 그것은 둘이서만 만든 것이 아니라, 다른 많은 사람들의 도움으로 만들어졌다고 대답했다.","grammar":[]},{"n":3,"en":"They also avoided personal interviews, not wanting to reveal the great contribution they had made.","ko":"그들은 또한 자신들의 큰 공헌을 드러내고 싶지 않아 개인적인 인터뷰를 피했다.","grammar":[{"label":"contribution they","explanation":"contribution they — 목적격 관계대명사 생략 · contribution that they","transform_label":"not wanting to reveal — 분사구문의 부정 → 이유를 나타내는 부사절 — not을 접속사절로 풀고 분사를 정동사로","transform_value":"… personal interviews because they did not want to reveal …"}]},{"n":4,"en":"They said that they had genuinely enjoyed the challenge of creating the vaccine, so the excessive praise that they received made them uncomfortable.","ko":"그들은 진정으로 백신을 만드는 도전을 즐겼기 때문에, 그들이 받는 지나친 칭찬은 그들을 불편하게 만든다고 말했다.","grammar":[]},{"n":5,"en":"In the end, knowing that so many lives were being saved thanks to their hard work was enough of a reward for these remarkable and modest heroes.","ko":"결국, 그들의 노고 덕분에 매우 많은 생명이 구해지고 있다는 것을 아는 것만으로도 이 놀랍고도 겸손한 영웅들에게는 충분한 보상인 것이었다.","grammar":[]}],"structure":[],"flow":[{"label":"가능했던 보상","sentences":"S1","text":"특허를 냈다면 큰돈을 벌 수도 있었다.","refs":[1]},{"label":"두 사람의 태도","sentences":"S2 · S3 · S4","text":"여러 사람의 도움을 인정하고 인터뷰와 칭찬을 피했다.","refs":[2,3,4]},{"label":"진짜 보상","sentences":"S5","text":"살아난 사람들의 생명이 충분한 보상이었다.","refs":[5]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["살아난 사람들의 생명이 충분한 보상이었다.","두 연구자는 특허나 명성보다 협력과 많은 생명을 구한 결과를 더 중요하게 여겼다.","특허를 냈다면 큰돈을 벌 수도 있었다."],"answer":1,"why":"두 연구자는 특허나 명성보다 협력과 많은 생명을 구한 결과를 더 중요하게 여겼다.","refs":[1,5]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["앞의 사건과 관계없는 새 주제","살아난 사람들의 생명이 충분한 보상이었다.","특허를 냈다면 큰돈을 벌 수도 있었다."],"answer":1,"why":"살아난 사람들의 생명이 충분한 보상이었다.","refs":[5]},{"type":"문법","q":"S1의 'were often told' 설명으로 알맞은 것은?","choices":["were often told — 수동태","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"… very wealthy had they patented …","refs":[1]}],"key_sentence_en":"In the end, knowing that so many lives were being saved thanks to their hard work was enough of a reward for these remarkable and modest heroes.","key_sentence_ko":"결국, 그들의 노고 덕분에 매우 많은 생명이 구해지고 있다는 것을 아는 것만으로도 이 놀랍고도 겸손한 영웅들에게는 충분한 보상인 것이었다."}]},{"id":"l2","label":"2과 · The World of Scientific Discovery","scope":"본문 7구간","passages":[{"id":"l2-01","title":"과학은 모두의 것","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"과학은 전문가만의 일이 아니며 일반인도 시민 과학으로 연구에 기여할 수 있다.","diagram":{"kind":"compare","title":"과학에 참여하는 사람은?","items":[{"head":"흔한 생각","body":"실험실의 전문 과학자만 과학을 한다","refs":[1,2]},{"head":"이 글의 주장","body":"평범한 사람도 연구에 기여할 수 있다","refs":[3,4,5]}]},"easy_story":"과학이라고 하면 흰 가운을 입은 전문가만 떠올리기 쉽습니다. 글은 그 생각이 틀렸다고 말합니다. 평범한 사람도 과학 프로젝트에 참여해 실제 연구 성과를 도울 수 있고, 이제 그 사례 두 가지를 살펴봅니다.","blocking_vocab":[{"word":"citizen science","meaning":"시민 과학"},{"word":"contribution","meaning":"기여"}],"sentences":[{"n":1,"en":"When we think about science, we might consider it as a domain reserved exclusively for scientists in long, white lab coats who spend their days conducting experiments and analyzing data.","ko":"<과학은 모두를 위한 것> 과학에 대해서 생각할 때, 우리는 그것을 실험을 하고 데이터를 분석하는데 나날을 보내는 길고 흰 실험실 가운을 입은 과학자들에게 독점적으로 지정된 영역이라고 생각할 수 있다.","grammar":[]},{"n":2,"en":"They seem to have very little in common with ordinary people like us.","ko":"그들은 우리와 같은 평범한 사람들과 공통점이 거의 없는 것 같이 보인다.","grammar":[]},{"n":3,"en":"However, this perception is far from the truth.","ko":"그러나 이러한 인식은 사실과 거리가 멀다.","grammar":[]},{"n":4,"en":"In reality, science belongs to everyone, and we all have the ability to play a role in the advancement of science.","ko":"사실은, 과학은 모두의 것이며, 우리는 모두 과학의 발전에 일조할 수 있는 능력이 있다.","grammar":[{"label":"belongs to everyone","explanation":"belongs to everyone — 자동사 + 전치사 belong to · 수동태 불가"}]},{"n":5,"en":"There have been numerous citizen science projects in which ordinary people have made contributions to remarkable scientific accomplishments.","ko":"평범한 사람들이 놀라운 과학적 업적에 기여한 수많은 시민 과학 프로젝트들이 있었다.","grammar":[{"label":"문장 전환","explanation":"projects in which ordinary people — 전치사 + 관계대명사 → 관계부사 where — 뒤 절이 완전하니 관계부사 where 로 바꾼다","transform_label":"projects in which ordinary people — 전치사 + 관계대명사 → 관계부사 where — 뒤 절이 완전하니 관계부사 where 로 바꾼다","transform_value":"… science projects where ordinary people …"}]},{"n":6,"en":"Let's take a look at two of them.","ko":"그중 두 가지를 살펴보자.","grammar":[]}],"structure":[],"flow":[{"label":"흔한 생각","sentences":"S1 · S2","text":"과학은 전문가만 하는 일처럼 보인다.","refs":[1,2]},{"label":"글의 반박","sentences":"S3 · S4","text":"과학은 모두의 것이고 누구나 발전에 기여할 수 있다.","refs":[3,4]},{"label":"이어질 내용","sentences":"S5 · S6","text":"시민 과학 프로젝트 두 사례를 소개한다.","refs":[5,6]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["과학은 전문가만 하는 일처럼 보인다.","시민 과학 프로젝트 두 사례를 소개한다.","과학은 전문가만의 일이 아니며 일반인도 시민 과학으로 연구에 기여할 수 있다."],"answer":2,"why":"과학은 전문가만의 일이 아니며 일반인도 시민 과학으로 연구에 기여할 수 있다.","refs":[1,6]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["시민 과학 프로젝트 두 사례를 소개한다.","과학은 전문가만 하는 일처럼 보인다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"시민 과학 프로젝트 두 사례를 소개한다.","refs":[5,6]},{"type":"문법","q":"S4의 'belongs to everyone' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","belongs to everyone — 자동사 + 전치사 belong to · 수동태 불가","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"belongs to everyone — 자동사 + 전치사 belong to · 수동태 불가","refs":[4]}],"key_sentence_en":"Let's take a look at two of them.","key_sentence_ko":"그중 두 가지를 살펴보자."},{"id":"l2-02","title":"백만 장의 은하 이미지","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"은하 이미지 약 100만 장을 사람이 하나씩 분류해야 하는데, 혼자서는 시간이 너무 오래 걸렸다.","diagram":{"kind":"compare","title":"혼자 분류하면 생기는 문제","items":[{"head":"전체 과제","body":"은하 사진 약 100만 장","refs":[3]},{"head":"일주일의 진도","body":"5만 장 분류, 95만 장이 아직 남음","refs":[6,7]}]},"easy_story":"Schawinski에게 은하 사진 약 100만 장의 모양을 분류하는 일이 주어졌습니다. 사진이 서로 비슷해 보여도 조금씩 달라 하나하나 봐야 했습니다. 일주일 동안 5만 장밖에 분류하지 못하자 남은 95만 장을 걱정하게 됩니다.","blocking_vocab":[{"word":"classify","meaning":"분류하다"}],"sentences":[{"n":1,"en":"Kevin Schawinski was a young astronomy researcher studying black holes and the evolution of galaxies at the University of Oxford.","ko":"<은하 분류하기> Kevin Schawinski는 옥스퍼드 대학에서 블랙홀과 은하의 진화를 연구하는 젊은 천문학 연구원이었다.","grammar":[]},{"n":2,"en":"This might sound exciting, but his job there was dull and time-consuming.","ko":"이것이 흥미롭게 들릴지도 모르지만, 그곳에서 그의 일은 따분하고 시간이 많이 걸리는 일이었다.","grammar":[]},{"n":3,"en":"He had to classify around one million images of galaxies according to their shape.","ko":"그는 약 백만 장의 은하 이미지를 모양에 따라 분류해야 했다.","grammar":[]},{"n":4,"en":"Since they all looked similar but were actually shaped slightly differently, the best way to do this was to sort them while looking at each one individually.","ko":"그것들은 모두 비슷해 보이지만 사실 모양이 조금씩 달랐기 때문에, 그것을 해내는 가장 좋은 방법은 하나하나를 개별적으로 보면서 분류하는 것이었다.","grammar":[]},{"n":5,"en":"Of course, this would require a tremendous amount of time.","ko":"물론, 이것은 엄청난 시간이 필요할 것이었다.","grammar":[]},{"n":6,"en":"It took Schawinski a whole week to classify just 50,000 galaxies.","ko":"Schawinski가 고작 5만 개의 은하를 분류하는 데 꼬박 일주일이 걸렸다.","grammar":[]},{"n":7,"en":"He thought, \"But what about the remaining 950,000?\"","ko":"그는 '하지만 남아 있는 95만 개는 어쩌지?'라고 생각했다.","grammar":[{"label":"what about the remaining 950,000","explanation":"what about the remaining 950,000 — What about + 명사"}]}],"structure":[],"flow":[{"label":"과제","sentences":"S1 · S2 · S3","text":"은하 이미지 약 100만 장을 모양에 따라 분류해야 한다.","refs":[1,2,3]},{"label":"왜 오래 걸리나","sentences":"S4 · S5","text":"서로 비슷하지만 다른 사진을 하나씩 살펴야 한다.","refs":[4,5]},{"label":"혼자의 한계","sentences":"S6 · S7","text":"일주일에 5만 장을 분류했지만 95만 장이 남았다.","refs":[6,7]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["일주일에 5만 장을 분류했지만 95만 장이 남았다.","은하 이미지 약 100만 장을 사람이 하나씩 분류해야 하는데, 혼자서는 시간이 너무 오래 걸렸다.","은하 이미지 약 100만 장을 모양에 따라 분류해야 한다."],"answer":1,"why":"은하 이미지 약 100만 장을 사람이 하나씩 분류해야 하는데, 혼자서는 시간이 너무 오래 걸렸다.","refs":[1,7]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["일주일에 5만 장을 분류했지만 95만 장이 남았다.","은하 이미지 약 100만 장을 모양에 따라 분류해야 한다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"일주일에 5만 장을 분류했지만 95만 장이 남았다.","refs":[6,7]},{"type":"문법","q":"S7의 'what about the remaining 950,000' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","what about the remaining 950,000 — What about + 명사"],"answer":2,"why":"what about the remaining 950,000 — What about + 명사","refs":[7]}],"key_sentence_en":"He thought, \"But what about the remaining 950,000?\"","key_sentence_ko":"그는 '하지만 남아 있는 95만 개는 어쩌지?'라고 생각했다."},{"id":"l2-03","title":"온라인 대중 참여","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"친구의 제안으로 Galaxy Zoo를 열고, 일반인이 간단한 안내와 클릭만으로 은하를 분류하도록 했다.","diagram":{"kind":"steps","title":"Galaxy Zoo에서 한 일","items":[{"head":"간단한 안내","body":"누구나 빠르게 시작할 수 있는 사이트와 사용법","refs":[4,5,6]},{"head":"사진 보기","body":"은하 사진의 생김새를 관찰","refs":[7,8,9]},{"head":"버튼으로 분류","body":"조금 연습한 뒤 모양을 골라 분류","refs":[7,10]}]},"easy_story":"친구 Lintott은 혼자 힘든 일을 인터넷 사람들과 나누자고 제안했습니다. 두 사람은 누구나 쉽게 쓸 수 있는 Galaxy Zoo를 열었습니다. 방문자는 짧은 설명을 본 뒤 은하 사진의 모양을 버튼으로 골라 분류할 수 있었습니다.","blocking_vocab":[{"word":"galaxy","meaning":"은하"},{"word":"classify","meaning":"분류하다"},{"word":"crowdsourced","meaning":"대중 참여형의"}],"sentences":[{"n":1,"en":"One evening after work, Schawinski met a friend named Chris Lintott and complained about the situation.","ko":"어느 날 퇴근 후 저녁, Schawinski는 Chris Lintott이라는 이름의 친구를 만나서 그 상황에 대해 불평했다.","grammar":[{"label":"met a friend named Chris Lintott and complained","explanation":"met a friend named Chris Lintott and complained — 과거시제 동사 병렬"},{"label":"friend named","explanation":"friend named — 주격 관계대명사+be 생략 · friend who was named"}]},{"n":2,"en":"Lintott suggested that he turn to the Internet to ask other people for help.","ko":"Lintott은 다른 사람들에게 도움을 요청하기 위해 인터넷에 의지할 것을 제안했다.","grammar":[]},{"n":3,"en":"Eventually, the two men ended up launching a crowdsourced online project known as Galaxy Zoo.","ko":"결국, 그 두 남자는 Galaxy Zoo라고 알려진 대중을 참여시키는(= 크라우드소싱) 온라인 프로젝트를 시작하게 되었다.","grammar":[{"label":"project known","explanation":"project known — 주격 관계대명사+be 생략 · project that was known"}]},{"n":4,"en":"The website was kept as simple as possible, with a very basic design and an easy-to-use interface.","ko":"그 웹사이트는 매우 기본적인 디자인과 사용하기 쉬운 인터페이스로 최대한 단순하게 유지되었다.","grammar":[]},{"n":5,"en":"This allowed those who wanted to participate to get started quickly.","ko":"이것은 참여하기를 원하는 사람들이 빠르게 시작할 수 있게 했다.","grammar":[]},{"n":6,"en":"New visitors were greeted with a brief tutorial that explained the project.","ko":"신규 방문자들은 프로젝트에 대해 설명하는 간단한 사용 지침과 함께 환영받았다.","grammar":[{"label":"were greeted with","explanation":"were greeted with — 수동태 + 전치사 with"},{"label":"a brief tutorial that explained","explanation":"a brief tutorial that explained — 사물을 받는 주격 관계대명사 that"}]},{"n":7,"en":"Then they were shown an image of a galaxy and asked to click buttons that described its features.","ko":"그런 다음 그들에게 은하 이미지가 보여졌고, 그것의 특징을 설명하는 버튼을 클릭하도록 요청받았다.","grammar":[]},{"n":8,"en":"Is the galaxy smooth and rounded?","ko":"은하가 매끄럽고 둥근가?","grammar":[]},{"n":9,"en":"Is its shape an oval or a spiral?","ko":"그것의 모양은 타원형인가 아니면 나선형인가?","grammar":[]},{"n":10,"en":"After completion of the tutorial and a little bit of practice, the participants were able to classify galaxies effectively.","ko":"사용 지침의 완료와 약간의 연습 후에, 참가자들은 효과적으로 은하를 분류할 수 있었다.","grammar":[]}],"structure":[],"flow":[{"label":"해법 제안","sentences":"S1 · S2 · S3","text":"Lintott이 온라인에서 다른 사람의 도움을 구하자고 했다.","refs":[1,2,3]},{"label":"참여 문턱 낮추기","sentences":"S4 · S5 · S6","text":"사이트를 단순하게 만들고 짧은 사용법을 보여 주었다.","refs":[4,5,6]},{"label":"실제 참여","sentences":"S7 · S8 · S9 · S10","text":"사진을 보고 특징을 버튼으로 골라 은하를 분류했다.","refs":[7,8,9,10]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["사진을 보고 특징을 버튼으로 골라 은하를 분류했다.","친구의 제안으로 Galaxy Zoo를 열고, 일반인이 간단한 안내와 클릭만으로 은하를 분류하도록 했다.","Lintott이 온라인에서 다른 사람의 도움을 구하자고 했다."],"answer":1,"why":"친구의 제안으로 Galaxy Zoo를 열고, 일반인이 간단한 안내와 클릭만으로 은하를 분류하도록 했다.","refs":[1,10]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["사진을 보고 특징을 버튼으로 골라 은하를 분류했다.","Lintott이 온라인에서 다른 사람의 도움을 구하자고 했다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"사진을 보고 특징을 버튼으로 골라 은하를 분류했다.","refs":[7,8,9,10]},{"type":"문법","q":"S1의 'met a friend named Chris Lintott and complained' 설명으로 알맞은 것은?","choices":["주어와 동사의 관계를 무시해도 된다.","met a friend named Chris Lintott and complained — 과거시제 동사 병렬","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다."],"answer":1,"why":"met a friend named Chris Lintott and complained — 과거시제 동사 병렬","refs":[1]}],"key_sent 가 나타나는 것을 알아채기 시작했다.","grammar":[]},{"n":5,"en":"There were unusual ribbons of green and purple light, some of which seemed to stretch for thousands of kilometers.","ko":"녹색과 보라색의 특이한 빛의 띠가 있었는데, 그중 일부는 수천 킬로미터에 걸쳐 뻗어 있는 것처럼 보였다.","grammar":[{"label":"문장 전환","explanation":"some of which seemed to stretch — 수량표현 + of which → 접속사 + 대명사 — 관계부사로 못 바꾼다 · 접속사 + 대명사로 푼다","transform_label":"some of which seemed to stretch — 수량표현 + of which → 접속사 + 대명사 — 관계부사로 못 바꾼다 · 접속사 + 대명사로 푼다","transform_value":"… purple light, and some of them seemed to …"}]},{"n":6,"en":"Sometimes they lasted for just a few minutes, while other times they remained in the sky for a whole hour.","ko":"그것들은 어떤 때에는 단 몇 분간 지속되었지만, 다른 때에는 한 시간 내내 하늘에 머무르기도 했다.","grammar":[]},{"n":7,"en":"They were similar in appearance to auroras, yet they possessed some notably different features.","ko":"그것들은 오로라와 생김새가 비슷했지만, 몇 가지 현저하게 다른 특징들을 지니고 있었다.","grammar":[]},{"n":8,"en":"Unsure of what they were, the group decided to name the phenomenon \"Steve,\" based on a scene from an animated movie where some characters give that name to an unfamiliar object.","ko":"그것들이 무엇인지 확신하지 못한 그 단체는 등장인물들이 낯선 물체에 Steve라는 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 'Steve'라고 이름 짓기로 결정했다.","grammar":[]}],"structure":[],"flow":[{"label":"원래 하던 일","sentences":"S1 · S2 · S3","text":"시민 모임이 오로라를 촬영해 사진을 공유했다.","refs":[1,2,3]},{"label":"낯선 관찰","sentences":"S4 · S5 · S6 · S7","text":"녹색·보라색 띠가 나타났고 오로라와는 다른 특징도 있었다.","refs":[4,5,6,7]},{"label":"임시 이름","sentences":"S8","text":"무엇인지 몰라 Steve라고 부르기 시작했다.","refs":[8]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["시민 모임이 오로라를 촬영해 사진을 공유했다.","무엇인지 몰라 Steve라고 부르기 시작했다.","오로라를 찍던 시민들이 익숙한 오로라와 다른 빛의 띠를 발견해 임시로 Steve라고 불렀다."],"answer":2,"why":"오로라를 찍던 시민들이 익숙한 오로라와 다른 빛의 띠를 발견해 임시로 Steve라고 불렀다.","refs":[1,8]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["시민 모임이 오로라를 촬영해 사진을 공유했다.","앞의 사건과 관계없는 새 주제","무엇인지 몰라 Steve라고 부르기 시작했다."],"answer":2,"why":"무엇인지 몰라 Steve라고 부르기 시작했다.","refs":[8]},{"type":"문법","q":"S1의 'chasers\" who formed' 설명으로 알맞은 것은?","choices":["단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다.","chasers\" who formed — 사람을 받는 주격 관계대명사 who"],"answer":2,"why":"chasers\" who formed — 사람을 받는 주격 관계대명사 who","refs":[1]}],"key_sentence_en":"Unsure of what they were, the group decided to name the phenomenon \"Steve,\" based on a scene from an animated movie where some characters give that name to an unfamiliar object.","key_sentence_ko":"그것들이 무엇인지 확신하지 못한 그 단체는 등장인물들이 낯선 물체에 Steve라는 이름을 붙이는 한 애니메이션 영화의 장면을 바탕으로 이 현상을 'Steve'라고 이름 짓기로 결정했다."},{"id":"l2-06","title":"NASA와 시민의 협업","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"시민의 관찰을 전문가와 NASA가 연구로 이어 갔지만 STEVE의 정확한 설명은 아직 확정되지 않았다.","diagram":{"kind":"steps","title":"시민 발견과 전문가 연구","items":[{"head":"시민의 사진","body":"전문가에게 보여 준 낯선 빛의 띠","refs":[1,2]},{"head":"전문가·NASA","body":"오로라가 아님을 확인하고 사진 수집 연구 시작","refs":[3,4,5,6,7,8]},{"head":"아직 진행 중","body":"시민의 발견은 인정됐지만 정체의 확정적 설명은 남음","refs":[11,12,13,14]}]},"easy_story":"사진 동호회가 전문가에게 보여 주자, 전문가도 그것이 오로라가 아니라는 것만 확인할 수 있었습니다. NASA는 시민들이 사진을 모아 보내는 연구를 지원했습니다. 발견의 공은 시민들에게 돌아갔지만, STEVE를 완전히 설명하는 이론은 아직 확정되지 않아 협업이 계속됩니다.","blocking_vocab":[{"word":"citizen science","meaning":"시민 과학"},{"word":"aurora","meaning":"오로라"},{"word":"phenomenon","meaning":"현상"}],"sentences":[{"n":1,"en":"After photographing Steve for several years and discussing what it might be, the group members decided to get help from experts.","ko":"몇 년 동안 Steve의 사진을 찍고 그것이 무엇일지에 대해 논의한 후에, 그 단체 구성원들은 전문가들로부터 도움을 받기로 결정했다.","grammar":[]},{"n":2,"en":"They showed their photos of Steve to a professor of astronomy at a local university and a scientist at NASA.","ko":"그들은 Steve의 사진들을 지역 대학의 천문학 교수와 NASA의 과학자에게 보여주었다.","grammar":[]},{"n":3,"en":"Surprisingly, neither of them had any idea what Steve was.","ko":"놀랍게도, 둘 중 누구도 Steve가 무엇인지 전혀 알지 못했다.","grammar":[]},{"n":4,"en":"They confirmed that it was not an aurora, but it did not resemble anything they had seen before.","ko":"그들은 그것이 오로라가 아니라는 것은 확인했지만, 그것은 그들이 이전에 보았던 어느 것과도 비슷하지 않았다.","grammar":[{"label":"anything they had seen before","explanation":"anything they had seen before — 목적격 관계대명사 생략 · 과거완료"}]},{"n":5,"en":"They realized that the group had discovered a new type of phenomenon that had never been properly studied.","ko":"그들은 그 단체가 제대로 연구된 적이 없는 새로운 유형의 현상을 발견했다는 것을 깨달았다.","grammar":[]},{"n":6,"en":"In order to learn more about it, NASA funded a citizen science project involving the public.","ko":"이에 대해 더 자세히 알아보기 위해, NASA는 대중이 참여하는 시민 과학 프로젝트에 자금을 제공했다.","grammar":[]},{"n":7,"en":"The project asked ordinary people to gather photos of Steve and send them to NASA.","ko":"그 프로젝트는 일반인들에게 Steve의 사진을 모아서 NASA에 보내달라고 요청했다.","grammar":[]},{"n":8,"en":"It is still in progress today.","ko":"그것은 오늘날에도 여전히 진행 중이다.","grammar":[]},{"n":9,"en":"In honor of the aurora chasers who first discovered the phenomenon, the name \"Steve\" has been kept.","ko":"이 현상을 처음 발견한 오로라 추적자들에게 경의를 표하여 'Steve'라는 이름은 유지되었다.","grammar":[{"label":"chasers who first discovered","explanation":"chasers who first discovered — 사람을 받는 주격 관계대명사 who"},{"label":"has been kept","explanation":"has been kept — 현재완료 수동태"}]},{"n":10,"en":"However, it is now written in all capital letters and stands for \"Strong Thermal Emission Velocity Enhancement.\"","ko":"그러나, 그것은 이제 모두 대문자로 쓰이며, '속도 증가에 따른 강한 열 방출(Strong Thermal Emission Velocity Enhancement)'을 의미한다.","grammar":[]},{"n":11,"en":"Experts have acknowledged that it is the dedicated members of the aurora chasers group that deserve the credit for discovering STEVE.","ko":"전문가들은 STEVE를 발견한 공로를 인정받아야 할 사람들은 바로 오로라 추적자 단체의 헌신적인 구성원들임을 인정했다.","grammar":[]},{"n":12,"en":"If it had not been for them, it might have remained unnoticed forever.","ko":"만약 그들이 아니었다면, 그것은 영원히 알려지지 못한 상태로 남았을지도 모른다.","grammar":[{"label":"If it had not been for them","explanation":"If it had not been for them — 가정법 과거완료 If it had not been for"}]},{"n":13,"en":"There are many interesting theories about STEVE, but none of them have been proven for certain.","ko":"STEVE에 대한 흥미로운 이론들은 많지만, 그들 중 어느 것도 확실하게 증명된 것은 없다.","grammar":[]},{"n":14,"en":"Scientists and citizens continue to collaborate to solve this mystery, and they are learning more and more about STEVE every day.","ko":"과학자들과 시민들은 이 수수께끼를 풀기 위해 계속 협력하며, 매일 STEVE에 대해 점점 더 많은 것을 알아가고 있다.","grammar":[]}],"structure":[],"flow":[{"label":"전문가에게 질문","sentences":"S1 · S2 · S3 · S4 · S5","text":"시민들이 사진을 보여 주자 전문가들은 오로라가 아니라는 점을 확인했다.","refs":[1,2,3,4,5]},{"label":"함께 연구","sentences":"S6 · S7 · S8","text":"NASA가 시민 사진 수집 프로젝트를 지원했다.","refs":[6,7,8]},{"label":"발견의 공","sentences":"S9 · S10 · S11 · S12","text":"STEVE라는 이름을 남기고 최초 발견자들의 기여를 인정했다.","refs":[9,10,11,12]},{"label":"아직 남은 질문","sentences":"S13 · S14","text":"확정된 설명은 없고 시민과 과학자의 연구가 계속된다.","refs":[13,14]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["시민들이 사진을 보여 주자 전문가들은 오로라가 아니라는 점을 확인했다.","확정된 설명은 없고 시민과 과학자의 연구가 계속된다.","시민의 관찰을 전문가와 NASA가 연구로 이어 갔지만 STEVE의 정확한 설명은 아직 확정되지 않았다."],"answer":2,"why":"시민의 관찰을 전문가와 NASA가 연구로 이어 갔지만 STEVE의 정확한 설명은 아직 확정되지 않았다.","refs":[1,14]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["시민들이 사진을 보여 주자 전문가들은 오로라가 아니라는 점을 확인했다.","앞의 사건과 관계없는 새 주제","확정된 설명은 없고 시민과 과학자의 연구가 계속된다."],"answer":2,"why":"확정된 설명은 없고 시민과 과학자의 연구가 계속된다.","refs":[13,14]},{"type":"문법","q":"S4의 'anything they had seen before' 설명으로 알맞은 것은?","choices":["anything they had seen before — 목적격 관계대명사 생략 · 과거완료","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"anything they had seen before — 목적격 관계대명사 생략 · 과거완료","refs":[4]}],"key_sentence_en":"Scientists and citizens continue to collaborate to solve this mystery, and they are learning more and more about STEVE every day.","key_sentence_ko":"과학자들과 시민들은 이 수수께끼를 풀기 위해 계속 협력하며, 매일 STEVE에 대해 점점 더 많은 것을 알아가고 있다."},{"id":"l2-07","title":"호기심이 만드는 기여","lead":"영어 원문을 먼저 읽고, 필요한 해석과 문법 포인트만 클릭해 확인하세요.","core":"전문 학위가 없어도 호기심과 참여 의지가 있다면 누구나 과학 발전에 기여할 수 있다.","diagram":{"kind":"compare","title":"시민 과학자에게 필요한 것","items":[{"head":"필수 조건이 아닌 것","body":"과학 학위·흰 실험실 가운","refs":[1,3]},{"head":"참여의 출발점","body":"호기심과 관심, 연구에 시간을 보태려는 마음","refs":[2,4,5]}]},"easy_story":"앞의 두 프로젝트를 움직인 사람들은 대개 전문 과학자가 아닙니다. 과학 학위나 흰 가운이 없어도 가치 있는 발견과 연구에 보탬이 됐습니다. 글은 호기심을 가지고 참여하는 독자도 시민 과학자가 될 수 있다고 말하며 끝납니다.","blocking_vocab":[{"word":"achieve","meaning":"성취하다"},{"word":"contribution","meaning":"기여"}],"sentences":[{"n":1,"en":"Most of the individuals involved in these two projects are not professional scientists.","ko":"이 두 프로젝트에 참여한 대부분의 개인들은 전문 과학자가 아니다.","grammar":[{"label":"individuals involved","explanation":"individuals involved — 주격 관계대명사+be 생략 · individuals who are involved"}]},{"n":2,"en":"Instead, they are citizen scientists ─ ordinary people who desire to help advance science in areas that they are interested in.","ko":"대신, 그들은 시민 과학자들인데, 그들은 자신이 관심 있는 분야에서 과학의 발전을 돕고자 하는 평범한 사람들이다.","grammar":[{"label":"areas that they are interested in","explanation":"areas that they are interested in — 목적격 관계대명사 + 전치사 후치 · 앞으로 옮기면 areas in which they are interested"}]},{"n":3,"en":"Even though citizen scientists may not have science degrees or long, white lab coats, they are still capable of making valuable contributions to science.","ko":"시민 과학자들에게 과학 학위나 길고 흰 가운은 없을 수 있지만, 그들은 여전히 과학에 귀중한 기여를 할 수 있다.","grammar":[]},{"n":4,"en":"You can become one as well if you have curiosity and an interest in taking part in scientific research.","ko":"과학 연구에 참여하는 것에 대한 호기심과 관심이 있다면 당신도 시민 과학자가 될 수 있다.","grammar":[]},{"n":5,"en":"The next great scientific achievement could be made by citizen scientists volunteering their time for the purpose of better understanding the world.","ko":"다음 위대한 과학적 업적은 세상을 더 잘 이해하기 위한 목적으로 자신의 시간을 자발적으로 제공하는 시민 과학자들에 의해 이루어질 수도 있다.","grammar":[]}],"structure":[],"flow":[{"label":"두 사례의 공통점","sentences":"S1 · S2","text":"참여자의 대부분은 전문 과학자가 아닌 시민이었다.","refs":[1,2]},{"label":"가능한 기여","sentences":"S3","text":"학위나 흰 가운이 없어도 과학에 도움을 줄 수 있다.","refs":[3]},{"label":"독자에게 확장","sentences":"S4 · S5","text":"호기심이 있다면 누구나 참여해 다음 발견을 도울 수 있다.","refs":[4,5]}],"checks":[{"type":"핵심","q":"이 부분의 흐름을 가장 잘 압축한 것은?","choices":["호기심이 있다면 누구나 참여해 다음 발견을 도울 수 있다.","전문 학위가 없어도 호기심과 참여 의지가 있다면 누구나 과학 발전에 기여할 수 있다.","참여자의 대부분은 전문 과학자가 아닌 시민이었다."],"answer":1,"why":"전문 학위가 없어도 호기심과 참여 의지가 있다면 누구나 과학 발전에 기여할 수 있다.","refs":[1,5]},{"type":"근거","q":"글이 마지막에 도달한 내용은?","choices":["호기심이 있다면 누구나 참여해 다음 발견을 도울 수 있다.","참여자의 대부분은 전문 과학자가 아닌 시민이었다.","앞의 사건과 관계없는 새 주제"],"answer":0,"why":"호기심이 있다면 누구나 참여해 다음 발견을 도울 수 있다.","refs":[4,5]},{"type":"문법","q":"S1의 'individuals involved' 설명으로 알맞은 것은?","choices":["individuals involved — 주격 관계대명사+be 생략 · individuals who are involved","단어 뜻과 관계없이 시제만 바꾸면 항상 같은 뜻이 된다.","주어와 동사의 관계를 무시해도 된다."],"answer":0,"why":"individuals involved — 주격 관계대명사+be 생략 · individuals who are involved","refs":[1]}],"key_sentence_en":"The next great scientific achievement could be made by citizen scientists volunteering their time for the purpose of better understanding the world.","key_sentence_ko":"다음 위대한 과학적 업적은 세상을 더 잘 이해하기 위한 목적으로 자신의 시간을 자발적으로 제공하는 시민 과학자들에 의해 이루어질 수도 있다."}]}]}</script><script>
const data=JSON.parse(document.getElementById('course-data').textContent);const all=data.units.flatMap(u=>u.passages.map(p=>({...p,unitLabel:u.label,scope:u.scope})));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
function storySteps(t){const parts=String(t||'').replace(/([.!?])\s+/g,'$1|').split('|').filter(Boolean);return `<ol class="story-steps">${parts.map(part=>`<li>${esc(part)}</li>`).join('')}</ol>`}function renderDiagram(d,overview=false){const bars=d.kind==='bars';const items=d.items.map(x=>bars?`<div class="diagram-card"><b>${esc(x.head)}</b><div class="bar-track"><span class="bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/Number(d.max)*100))}%"></span></div><strong>${esc(x.value)}${esc(d.unit||'')}</strong><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`:`<div class="diagram-card"><b>${esc(x.head)}</b><p>${esc(x.body)}</p><small>${esc(x.refs.map(n=>'S'+n).join('·'))}</small></div>`).join('');return `<div class="diagram diagram-${esc(d.kind)}${overview?' is-overview':''}" role="group" aria-label="${esc(d.title)}"><h3>${esc(d.title)}</h3><div class="diagram-items">${items}</div>${bars?`<div class="bar-axis"><span>0</span><span>${esc(d.max)}${esc(d.unit||'')}</span></div>`:''}${d.takeaway?`<p class="diagram-takeaway">${esc(d.takeaway)}</p>`:''}</div>`}
function render(){const id=location.hash.slice(1);const found=all.findIndex(p=>p.id===id);current=found<0?0:found;const p=all[current];if(found<0)history.replaceState(null,'','#'+p.id);document.title=p.title+' · 동명고2 교과서 지문 이해 LAB';document.getElementById('crumb').textContent=p.unitLabel+' · '+p.scope;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead||'영어 원문을 먼저 읽고, 필요한 해석만 열어 보세요.';const prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');prevButton.textContent=current===0?'← 목록':all[current-1].unitLabel===p.unitLabel?'← 이전 지문':'← 이전 단원';nextButton.textContent=current===all.length-1?'목록으로':all[current+1].unitLabel===p.unitLabel?'다음 지문 →':'다음 단원 →';document.getElementById('crumb').textContent+=' · '+(current+1)+'/'+all.length;
const hasScene=!!(p.image||p.diagram);const prediction=p.prediction;const labels=hasScene?['1 한눈에','2 원문','3 흐름','4 확인']:['1 예상','2 원문','3 흐름','4 확인'];document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button type="button" data-stage="stage-${i+1}">${x}</button>`).join('');
const scene=`<div class="visual${hasScene?'':' no-image'}"><div><p class="prompt">${esc(prediction?prediction.question:(p.diagram?.title||'이 그림에서 어떤 관계가 보이나요?'))}</p>${prediction?`<details class="prediction-extra"><summary>먼저 예상해 보기 · 선택 사항</summary>${prediction.choices.map((x,i)=>`<label class="choice"><input type="radio" name="prediction" value="${i}">${esc(x)}</label>`).join('')}</details>`:''}${prediction?`<div class="answerline" id="prediction-answer">선택했어요. 이제 원문에서 확인해 보세요.</div>`:''}</div>${p.image?`<figure style="margin:0"><img src="${esc(p.image)}" alt="${esc(p.image_alt)}" loading="lazy" decoding="async"><figcaption class="caption">${esc(p.image_caption)}</figcaption></figure>`:p.diagram?renderDiagram(p.diagram,true):`<p class="quiet">선택한 뒤 원문을 읽으며 근거를 찾아보세요.</p>`}</div>`;
const vocab=(p.blocking_vocab||[]).map(v=>`<span><b>${esc(v.word)}</b> ${esc(v.meaning)}</span>`).join('');const sentences=p.sentences.map(s=>`<article class="sentence"><span class="num">${s.n}</span><div><div class="en">${esc(s.en)}</div><button class="reveal" data-toggle="translation">해석 보기</button>${s.grammar?.length?` <button class="reveal grammar-open" data-toggle="grammar">문법 포인트</button>`:''}<p class="translation">${esc(s.ko)}</p>${s.grammar?.length?`<div class="grammar-panel">${s.grammar.map(g=>`<div class="grammar-item"><b>${esc(g.label)}</b><p>${esc(g.explanation)}</p>${g.transform_value?`<small>시험에서는 이렇게 바꿀 수 있어요.</small><p class="grammar-transform">${esc(g.transform_value)}</p>`:''}</div>`).join('')}</div>`:''}</div></article>${(p.flow||[]).filter(x=>x.refs.length&&Math.max(...x.refs)===s.n).map(x=>`<details class="read-checkpoint"><summary>여기까지 읽고 · ${esc(x.label)} 확인</summary><p>${esc(x.text)}</p><small>${esc(x.refs.map(n=>'S'+n).join(' · '))}</small></details>`).join('')}`).join('');
const structure=p.structure.length?`<div class="structure">${p.structure.map(x=>`<div><b>${esc(x.title)}</b>${esc(x.text)}</div>`).join('')}</div>`:'';const flow=p.flow.map(x=>`<button data-toggle="evidence"><b>${esc(x.label)}</b><small>${esc(x.sentences)}</small><p>${esc(x.text)}</p><div class="evidence">${x.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></button>`).join('');
const quiz=(p.checks||[]).map((q,qi)=>`<div class="quiz" data-answer="${q.answer}"><span class="qtype">${esc(q.type)}</span><p class="prompt">${esc(q.q)}</p>${q.choices.map((choice,ci)=>`<label class="choice"><input type="radio" name="q${qi}" value="${ci}">${esc(choice)}</label>`).join('')}<p class="feedback" aria-live="polite"></p><div class="evidence"><p>${esc(q.why)}</p>${q.refs.map(n=>p.sentences.find(s=>s.n===n)).filter(Boolean).map(s=>`<p>S${s.n} · ${esc(s.en)}</p>`).join('')}</div></div>`).join('');
const review=`<p>우리말 핵심을 읽고, 설명자료가 영어로 정리한 문장을 펼쳐 비교해 보세요.</p><button class="reveal" data-toggle="english-core">영어 핵심 문장 보기</button><div class="evidence"><p class="en">${esc(p.key_sentence_en)}</p></div>`;
document.getElementById('content').innerHTML=`<section class="section ${prediction?'has-prediction':''}" id="stage-1"><span class="step">1 · 내용 한눈에</span><h2>${hasScene?'한눈에 시작하기':'핵심 예상하기'}</h2>${scene}${p.easy_story?`<div class="easy-story"><h3>이야기처럼 풀어 보기</h3>${storySteps(p.easy_story)}<button type="button" class="read-next" data-stage="stage-2">이제 영어에서 확인하기 →</button></div>`: ''}</section><section class="section" id="stage-2"><span class="step">2 · 영어 원문</span><h2>먼저 영어로 읽기</h2>${vocab?`<div class="vocab">${vocab}</div>`:''}<div>${sentences}</div></section><section class="section" id="stage-3"><span class="step">3 · 글의 흐름</span><h2>논리 따라가기</h2>${prediction?`<p class="answerline show"><b>예상 확인 · </b>${esc(prediction.actual)}</p>`:''}<div class="core">${esc(p.core)}</div>${structure?`<details class="structure-extra"><summary>핵심 대비 더 보기</summary>${structure}</details>`:''}<p class="quiet">흐름 카드를 누르면 근거 영어 문장이 바로 펼쳐집니다.</p><div class="flow">${flow}</div></section><section class="section" id="stage-4"><span class="step">4 · 핵심 확인</span><h2>${quiz?'클릭으로 확인하기':'영어 핵심으로 정리하기'}</h2>${quiz||review}${quiz?`<div class="final"><button data-toggle="final">한 줄 핵심 다시 보기</button><p>${esc(p.core)}</p></div>`:''}<a class="next" href="${current===all.length-1?'index.html':'#'+all[current+1].id}">${current===all.length-1?'목록으로 돌아가기':'다음 지문 →'}</a></section>`;
window.scrollTo(0,0)}
document.addEventListener('change',e=>{const input=e.target;if(input.name==='prediction'){document.getElementById('prediction-answer')?.classList.add('show');document.getElementById('stage-1')?.classList.add('predicted')}const quiz=input.closest('.quiz');if(quiz){const q=Number(input.value)===Number(quiz.dataset.answer);quiz.querySelector('.feedback').textContent=q?'맞았어요. 영어 근거를 확인해 보세요.':'다시 볼 영어 근거를 확인해 보세요.';quiz.querySelector('.evidence').classList.add('show')}});
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.getElementById(stage.dataset.stage)?.scrollIntoView({behavior:'smooth'});return}const btn=e.target.closest('[data-toggle]');if(!btn)return;const type=btn.dataset.toggle;if(type==='translation'){const target=btn.parentElement.querySelector('.translation');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'해석 닫기':'해석 보기'}else if(type==='grammar'){const target=btn.parentElement.querySelector('.grammar-panel');target.classList.toggle('show');btn.textContent=target.classList.contains('show')?'문법 닫기':'문법 포인트'}else if(type==='evidence'){btn.querySelector('.evidence').classList.toggle('show')}else if(type==='english-core'){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'영어 핵심 문장 닫기':'영어 핵심 문장 보기'}else if(type==='final'){btn.nextElementSibling.classList.toggle('show')}});
document.getElementById('prev').onclick=()=>{if(current>0)location.hash=all[current-1].id;else location.href='index.html'};document.getElementById('next').onclick=()=>{if(current<all.length-1)location.hash=all[current+1].id;else location.href='index.html'};window.addEventListener('hashchange',render);render();
</script></body></html>

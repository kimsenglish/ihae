<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <title>학교 선택 · KIM'S ENGLISH 이해 LAB</title>
  <link rel="stylesheet" href="assets/site.css?v=20260924school">
</head>
<body>
  <main class="shell school-home">
    <header class="site-head">
      <a class="brand" href="index.html"><span class="brand-mark">K</span><span>KIM'S ENGLISH</span></a>
      <span class="quiet-chip">지문 이해 LAB</span>
    </header>

    <section class="school-hero" aria-labelledby="school-title">
      <span class="eyebrow">2026년 2학기 시험 대비</span>
      <h1 id="school-title">우리 학교를<br>선택하세요.</h1>
      <p>학교를 누르면 이용할 수 있는 자료가 나옵니다.</p>
    </section>

    <section id="schools" aria-label="학교와 학년 선택">
      <div class="school-grid" id="school-grid">
        <button type="button" class="school-pick" data-school="daea1" aria-pressed="false"><span>대아고</span><strong>1학년</strong></button>
        <button type="button" class="school-pick" data-school="daea2" aria-pressed="false"><span>대아고</span><strong>2학년</strong></button>
        <button type="button" class="school-pick" data-school="gyeonghae1" aria-pressed="false"><span>경해여고</span><strong>1학년</strong></button>
        <button type="button" class="school-pick" data-school="gyeonghae2" aria-pressed="false"><span>경해여고</span><strong>2학년</strong></button>
        <button type="button" class="school-pick" data-school="jinju1" aria-pressed="false"><span>진주여고</span><strong>1학년</strong></button>
        <button type="button" class="school-pick" data-school="jinju2" aria-pressed="false"><span>진주여고</span><strong>2학년</strong></button>
        <button type="button" class="school-pick" data-school="jingo1" aria-pressed="false"><span>진주고</span><strong>1학년</strong></button>
        <button type="button" class="school-pick" data-school="jingo2" aria-pressed="false"><span>진주고</span><strong>2학년</strong></button>
        <button type="button" class="school-pick" data-school="dongmyeong2" aria-pressed="false"><span>동명고</span><strong>2학년</strong></button>
      </div>
    </section>

    <section class="school-materials" id="school-materials" aria-live="polite" tabindex="-1" hidden>
      <div class="school-materials-head">
        <div><span class="eyebrow">자료 선택</span><h2 id="selected-school"></h2></div>
        <a href="#schools" id="choose-again">다른 학교</a>
      </div>
      <div class="material-grid" id="material-grid"></div>
      <p class="material-note">각 자료에서 학교 시험범위에 해당하는 단원·번호를 확인하세요.</p>
    </section>

    <footer>선택 내용은 저장하거나 전송하지 않습니다.</footer>
  </main>
  <script>
    const mock1 = {type:'모의고사', name:'고1 · 9월', href:'courses/g1-2026-09/index.html'};
    const mock2 = {type:'모의고사', name:'고2 · 9월', href:'courses/g2-2026-09/index.html'};
    const schools = {
      daea1: {name:'대아고 1학년', materials:[
        {type:'교과서', name:'공통영어2', href:'courses/daea1-textbook/index.html'},
        {type:'부교재', name:'Booster', href:'courses/daea1-booster/index.html'}, mock1]},
      daea2: {name:'대아고 2학년', materials:[
        {type:'교과서', name:'영어독해와작문', href:'courses/daea2-textbook/index.html'},
        {type:'부교재', name:'N제 · 미닛15', href:'courses/daea2-supplement/index.html'}, mock2]},
      gyeonghae1: {name:'경해여고 1학년', materials:[
        {type:'교과서', name:'공통영어2', href:'courses/gyeonghae1-textbook/index.html'},
        {type:'부교재', name:'올림포스 영독 기본1', href:'courses/gyeonghae1-supplement/index.html'}, mock1]},
      gyeonghae2: {name:'경해여고 2학년', materials:[
        {type:'교과서', name:'영어독해와작문', href:'courses/gyeonghae2-textbook/index.html'},
        {type:'부교재', name:'수특 Light 영어', href:'courses/gyeonghae2-supplement/index.html'}, mock2]},
      jinju1: {name:'진주여고 1학년', materials:[
        {type:'교과서', name:'공통영어2', href:'courses/jinju1-textbook/index.html'},
        {type:'부교재', name:'올림포스 영독 기본1', href:'courses/jinju1-supplement/index.html'}, mock1]},
      jinju2: {name:'진주여고 2학년', materials:[
        {type:'교과서', name:'영어II', href:'courses/jinju2-textbook/index.html'},
        {type:'모의고사', name:'2025년 10월', href:'courses/jinju2-2025-10-mock/index.html'}, mock2]},
      jingo1: {name:'진주고 1학년', materials:[
        {type:'교과서', name:'공통영어2', href:'courses/jingo1-textbook/index.html'},
        {type:'부교재', name:'수특 Light 영어', href:'courses/jingo1-supplement/index.html'}, mock1]},
      jingo2: {name:'진주고 2학년', materials:[
        {type:'교과서', name:'영어II', href:'courses/jingo2-textbook/index.html'},
        {type:'부교재', name:'수특 Light 영독연습', href:'courses/jingo2-supplement/index.html'}, mock2]},
      dongmyeong2: {name:'동명고 2학년', materials:[
        {type:'교과서', name:'영어II 1·2과', href:'courses/dongmyeong2-textbook/index.html'},
        {type:'부교재', name:'올림포스 9대 변별유형', href:'courses/dongmyeong2-supplement/index.html'}, mock2]},
    };

    const panel = document.getElementById('school-materials');
    const buttons = [...document.querySelectorAll('.school-pick')];
    function showSchool(id, moveFocus=false) {
      const school = schools[id];
      buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.school===id)));
      if (!school) { panel.hidden=true; return; }
      document.getElementById('selected-school').textContent=school.name;
      document.getElementById('material-grid').replaceChildren(...school.materials.map(item => {
        const link=document.createElement('a');
        link.className='material-link'; link.href=item.href;
        const type=document.createElement('span'); type.className='material-type'; type.textContent=item.type;
        const name=document.createElement('strong'); name.textContent=item.name;
        const arrow=document.createElement('span'); arrow.className='material-arrow'; arrow.setAttribute('aria-hidden','true'); arrow.textContent='→';
        link.append(type,name,arrow);
        return link;
      }));
      panel.hidden=false;
      if (moveFocus) { panel.scrollIntoView({behavior:'smooth',block:'start'}); panel.focus({preventScroll:true}); }
    }
    buttons.forEach(button => button.addEventListener('click', () => {
      const id=button.dataset.school;
      if (location.hash.slice(1)===id) showSchool(id,true);
      else location.hash=id;
    }));
    window.addEventListener('hashchange', () => showSchool(location.hash.slice(1),true));
    document.getElementById('choose-again').addEventListener('click', event => {
      event.preventDefault();
      history.replaceState(null,'',location.pathname+location.search);
      showSchool('');
      document.getElementById('school-grid').scrollIntoView({behavior:'smooth',block:'start'});
      buttons[0].focus({preventScroll:true});
    });
    showSchool(location.hash.slice(1));
  </script>
</body>
</html>

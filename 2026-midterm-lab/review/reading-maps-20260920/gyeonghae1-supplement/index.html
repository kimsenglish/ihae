</style><style>.chunk-label{grid-column:1/-1;margin:4px 2px 0;color:var(--green);font-size:13px;font-weight:900}</style></head><body><main><a class="back" href="../index.html">← 전체 자료</a><p class="eyebrow">GYEONGHAE GIRLS' HIGH SCHOOL · GRADE 1</p><h1>경해여고1 · 올림포스 영독 기본1</h1><p class="lead">단원을 먼저 고른 뒤 지문을 눌러 원문·해석·논리 흐름을 살펴보세요. 답을 쓰거나 학습 기록을 남길 필요는 없습니다.</p><div class="notice">시험 범위: 12강 서술형·논술형, 13·14강, 15강 수능 Analysis·1번만<br>4개 단원 · 12지문에 원문·해석·시각 자료·흐름·클릭 문제를 연결했습니다.</div><div class="units" id="units"></div><p class="subnote">12지문마다 원문 근거 시각 자료와 클릭형 문제 3개가 연결되어 있습니다.</p></main>
<script id="course-data" type="application/json">{"course":"경해여고1 부교재","units":[{"id":"olym12","label":"올림포스 영독 기본1 · 12강","scope":"서술형·논술형","passages":[{"id":"olym12-01","title":"p85 · 서술형 Practice","core":"음악 훈련은 음악을 감정으로 받던 뇌를 구조를 따지는 쪽으로 바꾸어 놓는다."},{"id":"olym12-02","title":"p86 · 논술형 Practice","core":"잔 표면의 질감이 같은 커피의 단맛과 쓴맛을 다르게 느끼게 만든다."}]},{"id":"olym13","label":"올림포스 영독 기본1 · 13강","scope":"무관한 문장 찾기","passages":[{"id":"olym13-01","title":"p88 수능 대비 ANALYSIS","core":"청중은 심사위원이 아니라 명확한 전달을 바라며, 한두 실수는 오히려 매력을 높인다."},{"id":"olym13-02","title":"p90 no.01","core":"사람은 물을 정화하고 폐수를 처리하는 생태계를 직접 건설하며 이는 생물 공학의 한 부분이다."},{"id":"olym13-03","title":"p91 no.02","core":"이동 통신이 널리 퍼져 비음성 메시지가 기준이 되었고 대면 소통의 소멸을 걱정하게 되었다."},{"id":"olym13-04","title":"p92 no.03","core":"정서적 뇌가 과흥분된 아이에게는 포옹과 공감, 그리고 한마디 말이 이성으로 가는 다리가 된다."}]},{"id":"olym14","label":"올림포스 영독 기본1 · 14강","scope":"글의 순서 배열","passages":[{"id":"olym14-01","title":"no.01","core":"방관자가 나서지 못하는 것은 성격의 결함이 아니라 지켜보는 사람이 많을수록 책임이 흩어지기 때문이다."},{"id":"olym14-02","title":"no.02","core":"퍼스널 브랜딩의 핵심은 자신을 알릴 기회를 알아보는 인식과 미리 내다보는 예상이다."},{"id":"olym14-03","title":"no.03","core":"움직임을 알아보는 능력 덕분에 Tombaugh는 사진을 뒤집어 보며 움직인 점 하나를 찾아 명왕성을 확인했다."},{"id":"olym14-04","title":"no.04","core":"숲은 탄소를 흡수하고 산소를 주는데도 사소한 쓰임 때문에 다시 자라는 속도보다 빨리 베어진다."}]},{"id":"olym15","label":"올림포스 영독 기본1 · 15강","scope":"수능 Analysis·1번만","passages":[{"id":"olym15-01","title":"p100 수능 대비 ANALYSIS","core":"금리 인상으로 인플레이션을 억제하면 대출·통화량은 줄지만, 그 고통은 정책 영향력이 작은 채무자에게 집중될 수 있다."},{"id":"olym15-02","title":"p102 no.01","core":"소비자는 제품의 원산지로 품질을 추단하며, 자국·외국에 대한 인식과 정보 처리 방식이 이 판단에 영향을 준다."}]}]}</script><script>

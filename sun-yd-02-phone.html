<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 영어독해연습 02강 12지문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 영어독해연습 02강 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>

<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 영어독해연습 02강</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 영어독해연습 02강 12개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = { data: [
 {
  "no": "1",
  "title": "Simplifying the Observer's Job: Mind-Reading Research",

  "en": "To illustrate the benefits of simplifying the observer's job, consider psychologist William Ickes's research on \"everyday mind reading.\" One way he studies such mind reading is by having two strangers interact. He tapes the interaction and then has each participant view the tape. Participants are to stop the tape at different points and say what they are thinking. Then, participants see the tape again and are to stop it at different points and write down what their interaction partner was thinking at that point. Observers rate the degree to which the participant's guess about what the partner was thinking matches what the partner was actually thinking. Ickes could have had observers make their judgments on a 0 (not at all) to 100 (completely) scale. However, he had observers use a 3-point scale with \"O\" being \"essentially different content,\" \"1\" being \"similar, but not the same, content,\" and \"2\" being \"essentially the same content.\" By using fewer categories, raters found the job of rating easier and were able to make reliable ratings.",
  "ko": "관찰자의 과업을 단순화하는 것의 이점을 설명하기 위해, 심리학자 William Ickes의 \"일상적 마음 읽기\" 연구를 살펴보자. 그가 그러한 마음 읽기를 연구하는 한 가지 방법은 서로 모르는 두 사람을 상호 작용하게 함으로써이다. 그는 그 상호 작용을 녹화하고, 그러고는 각 참가자가 그 녹화 테이프를 보게 한다. 참가자들은 다양한 시점에서 그 녹화 테이프를 멈추고 자신이 무엇을 생각하고 있는지를 말해야 한다. 그런 다음 참가자들은 그 녹화 테이프를 다시 보고, 다양한 시점에서 그것을 멈춰서 자신의 상호 작용 상대가 그 시점에서 무엇을 생각하고 있었는지를 적어야 한다. 관찰자들은 참가자의 추측, 즉 상대가 무엇을 생각하고 있었는지에 대한 추측이 상대가 실제로 생각하고 있었던 내용과 일치하는 정도를 평가한다. Ickes는 관찰자들이 0(전혀 일치하지 않음)부터 100(완전히 일치함)까지의 척도로 판단을 내리게 할 수도 있었다. 그러나 그는 관찰자들이 3점 척도를 사용하게 했는데, \"0\"은 \"본질적으로 다른 내용\", \"1\"은 \"비슷하지만 동일하지는 않은 내용\", \"2\"는 \"본질적으로 동일한 내용\"이었다. 더 적은 범주를 사용함으로써, 평가자들은 평가 작업이 더 쉽다고 생각했고 신뢰할 만한 평가를 할 수 있었다.",

  "en": "Instinct is the most difficult of the motivation words to define. At the everyday level it is used often. For example, a sports commentator might say, 'He made that pass instinctively.' This means that the pass was made easily, automatically, with great skill and with a seemingly intuitive knowledge of the state of the game. However, at a technical level the word refers to behaviours that are built in, always appear in a similar form and are specific to a species. So, a spider builds a web instinctively and a bird's mating display might be instinctive. It is unlikely, though, that there is any equivalent instinctive behaviour in human beings. Some people might argue that a mother's reaction to her newly born child is instinctive, but certainly not all mothers react in the same way and even when they do, they express it in myriad forms. In general, instinct has been found to be a not very useful construct in giving accounts of the 'why' of behaviour.",
  "ko": "'본능'은 동기에 관한 단어들 중 가장 정의하기 어려운 단어이다. 일상적인 수준에서 그것은 자주 사용된다. 예를 들어, 스포츠 해설자는 '그는 본능적으로 그 패스를 했습니다.'라고 말할 수도 있다. 이는 그 패스가 쉽게, 자동적으로, 뛰어난 기술로, 그리고 마치 경기 상황을 직관적으로 아는 것 같은 지식을 가지고 이루어졌다는 뜻이다. 그러나 전문적인 수준에서 그 단어는 내재되어 있고, 항상 유사한 형태로 나타나며, 특정 종에 고유한 행동을 나타낸다. 그러므로 거미는 본능적으로 거미줄을 치며, 새의 짝짓기 과시 행동은 본능적일 수도 있다. 그러나 인간에게 어떤 형태로든 그에 상당하는 본능적인 행동이 있을 가능성은 낮다. 어떤 사람들은 어머니의 갓 태어난 아이에 대한 반응이 본능적이라고 주장할 수도 있지만, 분명히 모든 어머니가 같은 방식으로 반응하는 것은 아니며, 그렇게 반응할 때조차 그들은 그것을 무수한 형태로 표현한다. 보통, 본능은 행동의 '이유'를 설명할 때 그다지 유용하지 않은 개념으로 밝혀졌다.",

  "en": "An indication of the power of TV to \"capture\" people's memory is provided by the results of a study by James Ost and coworkers, who approached people in an English shopping center and asked if they would be willing to participate in a study examining how well people can remember tragic events. The target event involved Princess Diana and her companion Dodi Fayed, whose deaths in a car crash in Paris on August 31, 1997, were widely covered on British television. Participants were asked to respond to the following statement: \"Have you seen the paparazzi's video-recording of the car crash in which Diana, Princess of Wales, and Dodi Fayed lost their lives?\" Of the 45 people who responded to this question, 20 said they had seen the film. This was, however, impossible, because no such film exists. The car crash was reported on TV, but not actually shown. The extensive media coverage of this event apparently caused some people to remember something ─ seeing the film ─ that didn't actually occur.",
  "ko": "TV가 사람들의 기억을 '사로잡는' 힘의 표시는 James Ost와 동료들의 연구 결과에 의해 제공되는데, 그들은 영국의 한 쇼핑센터에서 사람들에게 다가가 비극적인 사건을 얼마나 잘 기억할 수 있는지를 조사하는 연구에 참여할 의향이 있는지를 물었다. 대상 사건은 Diana 왕세자비와 그녀의 동행 Dodi Fayed와 관련되었는데, 1997년 8월 31일 파리에서 발생한 자동차 사고로 인한 그들의 사망은 영국 텔레비전에서 광범위하게 보도되었다. 참가자들은 다음 진술에 응답하도록 요청받았는데, 그것은 '당신은 웨일즈 공작부인 Diana와 Dodi Fayed가 목숨을 잃은 자동차 사고 장면을 파파라치가 녹화한 영상을 본 적이 있습니까?'였다. 이 질문에 응답한 45명 중 20명이 그 영상을 본 적이 있다고 답했다. 그러나 이는 불가능한 것이었는데, 왜냐하면 그런 영상은 존재하지 않기 때문이다. 그 자동차 사고는 TV에서 보도되었지만, 실제로 방영되지는 않았다. 이 사건에 대한 언론의 광범위한 보도가 보아하니 일부 사람들로 하여금 실제로 일어나지 않은 어떤 일 ― 영상을 본 일 ― 을 기억하게 만들었다.",

  "no": "4",
  "title": "Framing Effects in Political Decisions: 'Welfare' vs 'Assistance to the Poor'",

  "page": "수능특강 영어독해연습 02강 · 지문 4",
  "oneline": "<span class='g'>프레이밍</span>이 정치적 결정을 좌우한다 — 태도는 <span class='g'>느슨한 묶음</span>이라 <span class='g'>부르는 말</span>에 따라 다른 측면이 활성화. 3개년 조사: \"<span class='g'>복지</span>\"에 과소 지출이라는 응답은 20~25%인데, \"<span class='g'>빈곤층 지원</span>\"에 과소 지출은 63~65% — 같은 실체에 <span class='g'>3배 차이</span>. 이는 <span class='g'>민주적 선택 = 선호 서열</span>이라는 <span class='g'>서사</span>를 <span class='g'>조롱</span>거리로 만들고, 우리는 <span class='g'>자유 의지</span> 서사와 <span class='g'>충돌</span>해서 결과를 <span class='g'>받아들이지 않는다</span>.",

  "en": "Our political decisions are determined by how the options are framed, and this mechanism can make a mockery of the feeling that our democratic choices proceed by ordering our desires or preferences. Political conversation evokes a range of loosely connected attitudes. In three successive years, researchers from the General Social Survey asked whether we were spending \"too much, too little, or about the right amount\" on a variety of government programs. In each year, 20 to 25 percent of the respondents said that too little was being spent on \"welfare,\" but 63 to 65 percent said that too little was being spent on \"assistance to the poor.\" Once again, if our democratic choices were based on the ranking of preferences, our decisions wouldn't be affected differently by the terms \"welfare\" and \"assistance to the poor.\" But these two concepts could certainly tap into different aspects of our attitudes toward this assistance. And we may resist these findings because they conflict with a story we hold dear about free will and choice ─ in this case, democratic choice.",
  "ko": "우리의 정치적 결정은 선택지가 어떻게 표현되는지에 의해 결정되며, 이 메커니즘은 우리의 민주적 선택이 우리의 욕망이나 선호의 순서를 정함으로써 이루어진다는 느낌을 조롱거리로 만들 수 있다. 정치적 대화는 느슨하게 연결된 다양한 태도를 불러일으킨다. 연속된 세 해에 걸쳐 General Social Survey의 연구자들은 다양한 정부 프로그램에 우리가 \"지나치게 많이, 지나치게 적게, 또는 적당히\" 지출하고 있는지를 물었다. 매년 20~25%의 응답자가 \"복지\"에 너무 적게 지출되고 있다고 답했지만, 63~65%는 \"빈곤층 지원\"에 너무 적게 지출되고 있다고 답했다. 다시 말하지만, 우리의 민주적 선택이 선호도의 순위에 기반한다면, \"복지\"와 \"빈곤층 지원\"이라는 용어에 의해 우리의 결정이 다르게 영향을 받지는 않을 것이다. 그러나 이 두 개념은 분명히 우리가 이런 지원에 대해 가지고 있는 태도의 서로 다른 측면을 이용할 수 있다. 그리고 우리는 이 연구 결과를 받아들이지 않을 수도 있는데, 왜냐하면 그것이 우리가 자유 의지와 선택에 대해 소중히 여기는 이야기, 이 경우에는 민주적 선택과 상충하기 때문이다.",

  "en": "Computing the sum or average of several positive and negative values indeed lies within the normal repertoire of what elementary circuits of neurons can do without consciousness. Even a monkey can learn to make a decision based on the total value brought about by a series of arbitrary shapes, and the firing of parietal neurons keeps track of the sum. In my laboratory, we proved that approximate addition is within grasp of the human unconscious. In one experiment, we flashed a series of five arrows and asked subjects whether more arrows were pointing right or pointing left. When the arrows were made invisible by masking, participants were asked to guess, and indeed they thought that they were responding randomly, but in reality they continued to do much better than chance would predict. Signals from their parietal cortex gave evidence that their brain was unconsciously computing the approximate sum of the overall evidence. The arrows were subjectively invisible, but they still made their way into the brain's weighting and decision systems.",

  "en": "It has often been noted that men of genius have bad memories, and that persons having extraordinary memories, like Cardinal Mezzofanti, have little else. The truth is that there are two quite distinct kinds of memory: the memory for external facts and words, apart from their significance; and the memory for spiritual facts and principles. The man of genius, who may have no special reason for cultivating the lower kind of memory, may even find it rather a hindrance than a help. His prayer is, \"Let not my heart forget the things my eyes have seen.\" So long as his heart retains the significance of the facts he has seen and the words he has heard, he is willing to let the words and the facts go, as a man casts away the shells after he has eaten the oysters. The \"well-informed\" person commonly differs from the man of genius in this: that he carries about with him all the shells of all the oysters he has ever eaten, and that his soul has grown thin under the burden.",

  "en": "The scientific process is invariably non-linear and can be long and drawn out, with hypotheses sitting on the shelf until the time has come to dust them down, if that ever finally arrives. Sometimes you sit waiting for the tide to come in, but it never actually does. For every new theory and paper, there are many that fell by the wayside for lack of time, funding or data. Like the music industry, the hits are few and far between and don't always come when or from where you expect. It's important not to be discouraged by this: the fact that not every idea comes to fruition isn't a good reason to have fewer of them. Scientific breakthroughs ultimately depend on people working away without the immediate reward of achieving anything tangible: trying things that don't work (but might still be useful) and devising bits of a solution that won't be relevant until some undefined point in the future. Such patience is the bedrock on which progress is eventually achieved ─ stitched together from all those loose bits of fabric that could so easily have been discarded.",
  "ko": "과학적 과정은 언제나 비선형적이며 시간이 오래 걸리고 길어질 수 있는데, 가설들은 먼지를 털어낼 때가 마침내 온다면 그때까지는 선반에 방치되어 있다. 여러분은 가끔 가만히 앉아 밀물이 들어오기를 기다리지만, 밀물은 사실상 결코 들어오지 않는다. 매 새로운 이론과 논문마다, 시간·자금·자료의 부족으로 도중에 실패한 많은 것들이 있다. 음악 산업과 마찬가지로, 히트하는 결과는 아주 드물고, 여러분이 예상하는 때나 장소로부터 늘 나오는 것도 아니다. 이로 인해 낙담하지 않는 것이 중요한데, 모든 아이디어가 결실을 보는 것은 아니라는 사실이 아이디어를 더 적게 가져야 할 적절한 이유가 되지는 않는다. 과학 분야의 비약적 발전은 결국 사람들이 유형의 무언가를 달성하는 즉각적인 보상 없이 꾸준히 일하는 것 — 곧 효과가 없는(그러나 여전히 유용할 수도 있는) 일들을 시도하고, 미래의 어떤 불특정한 시점에야 비로소 유의미해질 해결책의 일부를 고안하는 것 — 에 달려 있다. 그런 끈기는 진전이 결국 그 위에서 달성되는 튼튼한 기반인데 ― 너무나 쉽게 버려질 수도 있었던 그 모든 분리된 천 조각들로 함께 꿰매진 것이다.",

  "en": "Contingency implies selection and uncertainty. It means that there are a number of possible options to choose from, and our decisions could always be different. However, algorithms by definition do not know uncertainty; they do not choose between possibilities, nor are they creative, being designed to follow the instructions that program their behavior. In this sense, algorithms are not contingent ─ which is why they can operate so efficiently and reliably. Just like traditional machines, we expect algorithms to be neither unpredictable nor idiosyncratic, even when they deliver information. Different watches should all indicate the same time to all users, if they work properly. As von Forster observed, if the outcome of a traditional machine becomes unpredictable, we do not think that it is creative or original ─ we think that it is broken. We do not care about the moods nor the perspectives of machines, only about their results. We repair them precisely to restore their predictability.",

  "en": "Pleasure as conscious enjoyment of our sensory endowment, enhanced by the capacity both to anticipate and to remember it, heightens enjoyment in the moment of listening to music, eating good food, dancing, swimming, sunbathing, and so variously on. Enjoyment 'in the moment' is the greater for not being subjected to intellectual analysis as it occurs; obviously, we do better to leave it to unfold as purely itself. But it is equally obvious that reflection on the nature and sources of pleasure is not irrelevant to their best enjoyment. The pleasure of a half-hour listening to music is the greater because the music was chosen, the quality of sound reproduction is good, anticipation and expectation were engaged, and one prepared oneself to listen. Think of the informative contrast here, how pain or discomfort is exacerbated by fearful anticipation; the tense dental patient who has been dreading the drill for days has a worse time than a relaxed patient. The key to seeing pleasure as a good is to see how it fits into an overall conception of the life worth living; this is how the ill consequences of certain types of pleasures-of-the-moment discount them as options.",
  "ko": "우리의 감각적인 능력을 의식적으로 누리는 것으로서의 쾌락은, 그것을 예상하고 기억할 수 있는 능력 모두에 의해 증진되어, 음악을 듣고, 맛있는 음식을 먹으며, 춤을 추고, 수영을 하며, 일광욕을 하는 것, 그리고 기타 다양한 활동을 하는 순간의 즐거움을 높인다. '그 순간의' 즐거움은 그것이 생길 때 지적 분석을 받지 않으므로 그만큼 더 크며, 그래서 분명한 것은 그것이 오로지 그 자체로 전개되도록 두는 것이 더 좋다는 것이다. 그러나 쾌락의 본질과 근원에 관한 성찰이 그것들을 최대로 즐기는 것과 무관하지 않다는 것도 또한 분명하다. 음악을 30분 동안 듣는 쾌락은, 그 음악이 선택되었고, 소리 재생의 품질이 좋으며, 기대와 예상이 동원되었고, 스스로 들을 준비를 했기 때문에 그만큼 더 크다. 여기서 유익한 대조적 상황, 즉 고통이나 불편함이 두려운 예상에 의해 어떻게 악화되는가를 생각해 보라 — 며칠 동안 드릴을 두려워해 온 긴장한 치과 환자는 느긋한 환자보다 더 힘든 시간을 보낸다. 쾌락을 선(善)으로 보는 것의 핵심은, 그것이 살 만한 가치가 있는 삶의 전반적인 개념 속에 어떻게 들어맞는지를 보는 것이며, 이런 방식으로 특정 유형의 순간적 쾌락이 가지는 나쁜 결과가 그것들을 선택지로서 고려하지 않게 한다.",

  "en": "The sciences do make extensive use of idealizations. The ideal gas law describes the relationship of pressure, volume, and temperature of gases under conditions that never perfectly obtain. In particular, it makes simplifying assumptions about the molecules making up gases ─ for example, that they do not attract or repel one another and do not themselves take up volume. The molecules of real gases are not like this, but their behavior is nonetheless close enough to ideal ones that the gas law is useful. Indeed, there are philosophers of science who argue that this is the best way to think about scientific theories in general; they are best regarded as models that are precisely accurate only under conditions that are never entirely realized. Even on such views, however, the theories are still meant to be descriptive. They are to be used to make predictions and offer explanations about the behavior of gases or whatever phenomena are at issue in real situations. There are, accordingly, constraints as to how idealized they can be. They cannot be so far removed from real world systems as to be worthless in describing actual phenomena with acceptable degrees of accuracy.",
  "ko": "여러 과학 분야는 실제로 이상화를 광범위하게 사용한다. 이상 기체 법칙은 결코 완벽하게 성립하지 않는 조건하에서 기체의 압력, 부피, 그리고 온도의 관계를 기술한다. 특히, 그것은 기체를 구성하는 분자들에 대해 단순화 가정을 하는데 ― 예를 들어, 분자들은 서로 끌어당기거나 밀어내지 않으며 그 자체로 부피를 차지하지 않는다는 것이다. 실제 기체의 분자들은 이와 같지 않지만, 그럼에도 불구하고 그것들의 반응은 이상 기체 법칙이 유용할 정도로 이상 기체에 충분히 가깝다. 실은 이것이 과학 이론 일반에 대해 생각하는 최선의 방식이라고 주장하는 과학 철학자들이 있는데, 과학 이론은 결코 완전히는 실현되지 않는 조건하에서만 엄밀하게 정확한 모형으로 여겨지는 것이 가장 적절하다는 것이다. 그러나 심지어 그러한 견해에서도, 그 이론들은 여전히 기술적(記述的)이어야 한다. 그것들은 실제 상황에서 기체의 반응이나 문제가 되는 어떤 현상에 대해 예측하고 설명을 제공하는 데 사용되어야 한다. 따라서, 과학 이론이 얼마나 이상화될 수 있는지에 관해서는 제약이 있다. 과학 이론은 허용 가능한 수준의 정확도로 실제 현상을 기술하는 데 쓸모가 없을 정도로 그렇게 실제 세계의 체계와 멀리 떨어져 있을 수 없다.",

  "en": "What is true is that regret happens when we view a large-world problem like a small-world problem. In a small world, where all choices, consequences, and probabilities are known, we can be certain about how much we would have won if only we had picked a different horse in a race or chosen different numbers in the lottery. However, in a large world, where not all choices, consequences, and probabilities are known, we can never truly compare the choices we made with those we didn't make. We can never know what would have happened if we had taken another job, or married another person, or moved to another city because those scenarios don't play out without us. So, when we conjure up regrets about what might have been, we are comparing what we know to what we don't know. What's worse is that, much like the upward social comparisons we make on social media, we torture ourselves with how the realities of our situation stack up against an imagined ideal.",
  "ko": "어김없는 진실은, 큰 세계의 문제를 작은 세계의 문제처럼 바라볼 때 후회가 생긴다는 것이다. 작은 세계에서는, 모든 선택, 결과, 그리고 확률이 알려져 있어서, 경주에서 다른 말을 고르거나 복권에서 다른 번호를 선택하기만 했더라면 얼마를 땄을지를 확실하게 안다고 할 수 있다. 그러나 큰 세계에서는, 모든 선택, 결과, 확률이 알려져 있는 것은 아니므로, 우리가 한 선택을 하지 않은 선택과 결코 제대로 비교할 수 없다. 우리는 만약 다른 직업을 선택했거나, 다른 사람과 결혼했거나, 또는 다른 도시로 이사했더라면 무슨 일이 일어났을지 결코 알 수 없는데, 왜냐하면 그러한 시나리오들은 우리 없이는 전개되지 않기 때문이다. 그러므로 어떠했을 수도 있는 것에 대한 후회를 떠올릴 때, 우리는 아는 것을 모르는 것과 비교하고 있는 것이다. 더 나쁜 것은, 우리가 소셜 미디어에서 하는 상향 사회적 비교와 아주 흡사하게, 우리가 처한 상황의 현실이 상상된 이상적 모습과 어떻게 비교되는지를 가지고 자신을 몹시 괴롭힌다는 것이다.",

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">배경지식 30초</span>
      <span class="thint">— 이 글이 어떤 글이냐</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout bg">${d.bg}</p></div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 작동 원리</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

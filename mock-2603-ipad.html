<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 고3 2026 3월 모의고사 7지문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   고3 3월 모의 7지문 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body>
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">2026학년도 고3 3월 모의고사</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 고3 3월 모의고사 7개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data": [{"no": "no.24", "title": "Translation Restores Strangeness", "ktitle": "번역은 ‘돌을 다시 돌답게’ 만든다", "field": "문학 · 번역론", "page": "2026 3월 모의 · no.24", "oneline": "너무 익숙해진 위대한 작품은 명성에 묻혀 <span class='r'>‘증발’</span>하지만, <span class='g'>번역</span>이 다른 언어로 옮겨 그 안의 ‘낯섦’을 되살린다.", "metaphor": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 명성에 묻혀 매끈하게 닳은 회색 돌이, 번역을 거쳐 오른쪽에서 거칠고 각진 '돌다운 돌'로 되살아나는 대조 그림\">\n  <g transform=\"translate(20,32)\">\n    <rect x=\"0\" y=\"0\" width=\"220\" height=\"178\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>\n    <text x=\"110\" y=\"-9\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">너무 익숙해진 작품 — 증발</text>\n    <path d=\"M 62 110 Q 56 74 96 68 Q 152 62 168 95 Q 175 126 136 140 Q 80 147 62 110 Z\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"1.4\"/>\n    <line x1=\"62\" y1=\"92\" x2=\"170\" y2=\"92\" stroke=\"#ccc\" stroke-width=\"7\" opacity=\"0.7\"/>\n    <line x1=\"60\" y1=\"114\" x2=\"168\" y2=\"114\" stroke=\"#ccc\" stroke-width=\"7\" opacity=\"0.7\"/>\n    <text x=\"115\" y=\"106\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#999\">smooth, dulled</text>\n    <text x=\"78\" y=\"52\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#999\">fame · cliches · study guides</text>\n    <text x=\"110\" y=\"166\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">taken for granted, evaporated</text>\n  </g>\n  <g transform=\"translate(258,118)\">\n    <line x1=\"0\" y1=\"0\" x2=\"54\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"54,0 46,-5 46,5\" fill=\"#1FA34A\"/>\n    <text x=\"27\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">translation</text>\n    <text x=\"27\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">다른 언어로</text>\n  </g>\n  <g transform=\"translate(330,32)\">\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"178\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"120\" y=\"-9\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">다시 '돌답게' — 낯섦 회복</text>\n    <polygon points=\"72,76 112,62 152,73 172,102 150,138 100,144 62,118 56,92\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.8\"/>\n    <g stroke=\"#1a1a1a\" stroke-width=\"0.9\" fill=\"none\">\n      <line x1=\"112\" y1=\"62\" x2=\"106\" y2=\"102\"/>\n      <line x1=\"62\" y1=\"118\" x2=\"106\" y2=\"102\"/>\n      <line x1=\"172\" y1=\"102\" x2=\"106\" y2=\"102\"/>\n      <line x1=\"100\" y1=\"144\" x2=\"106\" y2=\"102\"/>\n      <line x1=\"72\" y1=\"76\" x2=\"106\" y2=\"102\"/>\n    </g>\n    <g stroke=\"#c8102e\" stroke-width=\"1.5\">\n      <line x1=\"152\" y1=\"55\" x2=\"161\" y2=\"44\"/>\n      <line x1=\"180\" y1=\"94\" x2=\"193\" y2=\"90\"/>\n      <line x1=\"60\" y1=\"68\" x2=\"49\" y2=\"60\"/>\n    </g>\n    <text x=\"112\" y=\"106\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">stony again</text>\n    <text x=\"120\" y=\"166\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">strange, newly strange</text>\n  </g>\n</svg>", "caption": "친숙해져 '증발해 버린' 작품을 번역이 다른 언어로 옮겨, 안에 이미 있던 '낯섦'을 다시 살린다.", "tldr": ["너무 길든(익숙해진) 것은 더 쉬워지는 게 아니라 <span style=\"color:#c8102e;font-weight:700\">존재감이 사라진다</span>.", "번역은 위대한 작품을 고리타분한 명성에서 풀어내 <span style=\"color:#1FA34A;font-weight:700\">다시 ‘낯설게’</span> 만든다.", "단, 본래 낯섦이 없는 평범한 글은 번역해도 <span style=\"color:#c8102e;font-weight:700\">아무 일도 일어나지 않는다</span>."], "analogy": "오래 걸어 둔 명화는 벽지처럼 눈에 안 들어오죠. 다른 액자·다른 조명으로 옮겨 걸면 ‘어, 이런 그림이었나’ <span style=\"color:#1FA34A;font-weight:700\">다시 새로 보입니다</span>. 번역이 작품에 그렇게 해 줘요.", "bg": "분야는 문학·번역론이에요. 너무 익숙해진 위대한 작품이 명성에 묻혀 ‘증발’한다는 것이 출발점. → 번역(translation)이 그 작품에 무엇을 되살리는지에 주목하며 읽으세요.", "flow": [{"kind": "질문", "t": "번역은 위대한 작품에 무엇을 하는가?"}, {"kind": "도입", "t": "너무 길들면(domesticated) 작품은 <span class='r'>증발</span>한다"}, {"kind": "주제", "t": "<span class='g'>번역</span> = 돌을 다시 돌답게 만드는 ‘낯섦 회복’의 예술"}, {"kind": "경계", "t": "본래 낯섦 없는 ‘나쁜 텍스트’는 번역해도 무효"}, {"kind": "결론", "t": "진짜 작품의 번역 = 더 낯설게, 새롭게 낯설게 — 하나의 존재 양식", "cls": "close"}], "vocab": [["domesticated / domesticate", "길든·익숙해진"], ["evaporate", "증발하다·(존재가) 사라져 버리다"], ["take", "~을 당연히 여기다"], ["restore", "회복시키다·복원하다"], ["visibility / visible", "가시성·보임"], ["accumulate", "축적하다·쌓이다"], ["cliche", "상투적인 표현·진부한 말"], ["scholarship", "학술 연구·학문"], ["stodgy", "따분한·고리타분한"], ["lack", "~이 결여되다·부족하다"], ["native", "본래의·고유의 (← '원주민의' 아님)"], ["strangeness / strange", "낯섦·기이함"], ["reinforce", "강화하다·보강하다"], ["enhance", "높이다·향상시키다"], ["inherent", "내재된·고유의"], ["makeshift", "임시방편(의)"]], "quiz": [["‘너무 길들었다(domesticated)’는 게 작품에 일어나는 일은?", "더 쉬워지는 게 아니라 명성·모방에 묻혀 <b>존재감(가시성)이 사라진다(증발)</b>는 거예요."], ["번역이 위대한 작품에 하는 일을 한 마디로?", "고리타분한 명성에서 풀어내 <b>다시 ‘낯설게’</b> 만들어 가시성을 회복시켜요."]], "en": "Something too domesticated isn't actually more accessible or approachable, it evaporates altogether ─ we just take it for granted until art restores its visibility. And perhaps translation is an art especially well suited for this task: while a great work of literature accumulates imitations and cliches and a body of scholarship and analysis and study guides that may well bury it, translations of that work free it from its stodgy fame and make the stone stony again, precisely by putting it in another language. A bad text is one that, in Berman's terms, lacks \"native strangeness\" ─ and when you translate it, nothing happens. The translation of a true work of art is significant because it reinforces and enhances qualities already inherent in it: \"translation is not a makeshift, but the mode of existence by which a work reaches us as etrange\" (translated by Heyvaert as \"foreign,\" but I'm not sure about that). As Wilson put it, translation makes the work \"seem more strange, and newly strange.\"", "ko": "지나치게 익숙해진 것은 실제로 더 다가가기 쉽거나 이해하기 쉬운 것이 아니라, 완전히 증발해 버리며, 우리는 예술이 그것의 가시성을 회복할 때까지 그것을 당연하게 여길 뿐이다. 그리고 아마도 번역은 이러한 과업에 특히 잘 맞는 예술인데, 위대한 문학 작품은 모방작과 상투적인 표현과 많은 양의 학술 연구와 분석과 학습 가이드를 축적하고 이는 그것을 묻어 버릴 수도 있는 반면, 그 작품의 번역본은 정확히는 그것을 다른 언어로 옮김으로써, 그 작품을 자신의 고리타분한 명성으로부터 해방시키고 그 돌을 다시 돌답게 만든다. 안 좋은 텍스트란 Berman의 용어로 '본래의 낯섦'이 결여된 것이며, 여러분이 그것을 번역할 때 아무 일도 일어나지 않는다. 진정한 예술 작품의 번역은 그것이 작품 안에 이미 내재된 자질을 강화하고 높이기 때문에 의미 있다. \"번역은 임시방편이 아니라, 한 작품이 우리에게 '낯선 것'(원문 étrange — Heyvaert는 이를 'foreign'으로 옮겼지만, 나는 그 번역이 맞는지 확신하지 못한다)으로 다가오는 존재 양식이다.\" Wilson이 말했듯, 번역은 작품을 '더 낯설게, 그리고 새롭게 낯설게 보이도록' 한다.", "read": [{"en": "Something too domesticated isn't actually more accessible or approachable, it evaporates altogether ─ we just take it for granted until art restores its visibility.", "ko": "지나치게 익숙해진 것은 실제로 더 다가가기 쉽거나 이해하기 쉬운 것이 아니라, 완전히 증발해 버리며, 우리는 예술이 그것의 가시성을 회복할 때까지 그것을 당연하게 여길 뿐이다.", "chunks": [["Something too domesticated", "너무나 길든 것은"], ["isn't actually more accessible or approachable,", "실제로 더 다가가기 쉽거나 이해하기 쉬운 것이 아니라,"], ["it evaporates altogether ─", "그것은 완전히 증발해 버리며,"], ["we just take it for granted", "우리는 그것을 당연하게 여길 뿐이다"], ["until art restores its visibility.", "예술이 그것의 가시성을 회복할 때까지."]]}, {"en": "And perhaps translation is an art especially well suited for this task: while a great work of literature accumulates imitations and cliches and a body of scholarship and analysis and study guides that may well bury it, translations of that work free it from its stodgy fame and make the stone stony again, precisely by putting it in another language.", "ko": "그리고 아마도 번역은 이러한 과업에 특히 잘 맞는 예술인데, 위대한 문학 작품은 모방작과 상투적인 표현과 많은 양의 학술 연구와 분석과 학습 가이드를 축적하고 이는 그것을 묻어 버릴 수도 있는 반면, 그 작품의 번역본은 정확히는 그것을 다른 언어로 옮김으로써, 그 작품을 자신의 고리타분한 명성으로부터 해방시키고 그 돌을 다시 돌답게 만든다.", "chunks": [["And perhaps translation is an art", "그리고 아마도 번역은 예술이다"], ["especially well suited for this task:", "이러한 과업에 특히 잘 맞는,"], ["while a great work of literature accumulates", "위대한 문학 작품은 축적하는 반면"], ["imitations and cliches and a body of scholarship", "모방작과 상투적 표현과 많은 양의 학술 연구"], ["and analysis and study guides", "그리고 분석과 학습 가이드를"], ["that may well bury it,", "그 작품을 묻어 버릴 수도 있는,"], ["translations of that work free it from its stodgy fame", "그 작품의 번역본은 그것을 고리타분한 명성에서 해방시키고"], ["and make the stone stony again,", "돌을 다시 돌답게 만든다"], ["precisely by putting it in another language.", "정확히 그것을 다른 언어로 옮김으로써."]]}, {"en": "A bad text is one that, in Berman's terms, lacks \"native strangeness\" ─ and when you translate it, nothing happens.", "ko": "안 좋은 텍스트란 Berman의 용어로 '본래의 낯섦'이 결여된 것이며, 여러분이 그것을 번역할 때 아무 일도 일어나지 않는다.", "chunks": [["A bad text is one", "안 좋은 텍스트란 ~한 것이다"], ["that, in Berman's terms,", "Berman의 용어로,"], ["lacks \"native strangeness\" ─", "\"본래의 낯섦\"이 결여된 ─"], ["and when you translate it,", "그리고 여러분이 그것을 번역할 때,"], ["nothing happens.", "아무 일도 일어나지 않는다."]]}, {"en": "The translation of a true work of art is significant because it reinforces and enhances qualities already inherent in it: \"translation is not a makeshift, but the mode of existence by which a work reaches us as etrange\" (translated by Heyvaert as \"foreign,\" but I'm not sure about that).", "ko": "진정한 예술 작품의 번역은 그것이 작품 안에 이미 내재된 자질을 강화하고 높이기 때문에 의미 있다. \"번역은 임시방편이 아니라, 한 작품이 우리에게 '낯선 것'(원문 étrange — Heyvaert는 이를 'foreign'으로 옮겼지만, 나는 그 번역이 맞는지 확신하지 못한다)으로 다가오는 존재 양식이다.\"", "chunks": [["The translation of a true work of art", "진정한 예술 작품의 번역은"], ["is significant", "의미 있다"], ["because it reinforces and enhances qualities", "왜냐하면 그것은 자질을 강화하고 높이기 때문이다"], ["already inherent in it:", "그것 안에 이미 내재된,"], ["\"translation is not a makeshift,", "\"번역은 임시방편이 아니라,"], ["but the mode of existence", "존재 양식이다"], ["by which a work reaches us as etrange\"", "한 작품이 '낯선 것'으로 우리에게 다가오는,\""], ["(translated by Heyvaert as \"foreign,\"", "(Heyvaert에 의해 \"이질적인\"으로 번역되었지만,"], ["but I'm not sure about that).", "나는 그것에 대해 확신하지 못한다)."]]}, {"en": "As Wilson put it, translation makes the work \"seem more strange, and newly strange.\"", "ko": "Wilson이 말했듯, 번역은 작품을 '더 낯설게, 그리고 새롭게 낯설게 보이도록' 한다.", "chunks": [["As Wilson put it,", "Wilson이 말했듯이,"], ["translation makes the work", "번역은 작품이 ~하도록 한다"], ["\"seem more strange, and newly strange.\"", "\"더 낯설고, 새롭게 낯설게 보이도록\"."]]}]}, {"no": "no.30", "title": "Categorization Abstracts Particularities", "ktitle": "이름은 차이를 지우고, 확대는 고유성을 드러낸다", "field": "언어 · 인지", "page": "2026 3월 모의 · no.30", "oneline": "개념화·범주화·명명은 대상의 <span class='r'>개별성을 추상화해 지우지만</span>, <span class='g'>확대해 보면</span> 고유성은 어디에나 있다.", "metaphor": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에서 데이지·클로버·풀잎이 'flower·lawn' 이름표에 눌려 균일한 회색 카펫으로 납작해지고, 오른쪽에서 돋보기로 확대하면 각자 고유한 이름을 되찾는 그림\">\n  <g transform=\"translate(20,32)\">\n    <rect x=\"0\" y=\"0\" width=\"220\" height=\"178\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n    <text x=\"110\" y=\"-9\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">이름 = 차이를 지움</text>\n    <g transform=\"translate(40,26)\">\n      <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <g stroke=\"#1a1a1a\" stroke-width=\"1\" fill=\"none\"><ellipse cx=\"-8\" cy=\"0\" rx=\"4\" ry=\"2\"/><ellipse cx=\"8\" cy=\"0\" rx=\"4\" ry=\"2\"/><ellipse cx=\"0\" cy=\"-8\" rx=\"2\" ry=\"4\"/><ellipse cx=\"0\" cy=\"8\" rx=\"2\" ry=\"4\"/></g>\n    </g>\n    <g transform=\"translate(110,26)\">\n      <circle cx=\"-5\" cy=\"-3\" r=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <circle cx=\"5\" cy=\"-3\" r=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <circle cx=\"0\" cy=\"4\" r=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    </g>\n    <g transf ranslate(258,118)\">\n    <line x1=\"0\" y1=\"0\" x2=\"54\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"54,0 46,-5 46,5\" fill=\"#1FA34A\"/>\n    <text x=\"27\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">zoom in</text>\n    <text x=\"27\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">확대하면</text>\n  </g>\n  <g transform=\"translate(330,32)\">\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"178\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"120\" y=\"-9\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">확대 = 각자의 이름</text>\n    <g transform=\"translate(70,66)\">\n      <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <g stroke=\"#1a1a1a\" stroke-width=\"1\" fill=\"#ffffff\"><ellipse cx=\"-9\" cy=\"0\" rx=\"4.5\" ry=\"2.3\"/><ellipse cx=\"9\" cy=\"0\" rx=\"4.5\" ry=\"2.3\"/><ellipse cx=\"0\" cy=\"-9\" rx=\"2.3\" ry=\"4.5\"/><ellipse cx=\"0\" cy=\"9\" rx=\"2.3\" ry=\"4.5\"/></g>\n      <circle cx=\"0\" cy=\"0\" r=\"2.5\" fill=\"#c8102e\"/>\n      <text x=\"0\" y=\"24\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"700\">daisy A</text>\n    </g>\n    <g transform=\"translate(132,92)\">\n      <circle cx=\"-5\" cy=\"-3\" r=\"4.5\" fill=\"#1FA34A\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <circle cx=\"5\" cy=\"-3\" r=\"4.5\" fill=\"#1FA34A\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <circle cx=\"0\" cy=\"5\" r=\"4.5\" fill=\"#1FA34A\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <line x1=\"0\" y1=\"5\" x2=\"0\" y2=\"15\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n      <text x=\"0\" y=\"30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"700\">clover B</text>\n    </g>\n    <g transform=\"translate(186,72)\" stroke=\"#1FA34A\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M 0,14 Q -3,0 -1,-14\"/><path d=\"M 0,14 Q 3,0 1,-14\"/><text x=\"0\" y=\"30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"700\" stroke=\"none\" fill=\"#1a1a1a\">blade 7</text></g>\n    <circle cx=\"118\" cy=\"82\" r=\"60\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"2.4\"/>\n    <line x1=\"161\" y1=\"125\" x2=\"192\" y2=\"156\" stroke=\"#c8102e\" stroke-width=\"3.4\"/>\n    <text x=\"120\" y=\"168\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">each has its own name</text>\n  </g>\n</svg>", "caption": "이름은 차이를 묶어 '균일한 카펫'을 만들고, 확대는 그 안의 '각자의 이름'을 드러낸다.", "tldr": ["‘꽃’·‘잔디’ 같은 이름은 서로 다른 것들을 한 묶음으로 싸잡아 <span style=\"color:#c8102e;font-weight:700\">차이를 지운다</span>.", "대부분의 실용적 목적에선 그 차이를 무시해도 된다.", "그러나 확대해 보면 <span style=\"color:#1FA34A;font-weight:700\">개별성·고유성은 어디에나 있다</span> — 관리인에겐 잔디 하나하나가 다르다."], "analogy": "멀리서 보면 잔디밭은 균일한 초록 카펫이죠. 그런데 돋보기로 들이대면 데이지·클로버가 <span style=\"color:#1FA34A;font-weight:700\">제각각 이름과 모양을 드러냅니다</span>. ‘이름 붙이기’는 그 차이를 멀리서 뭉뚱그리는 일이에요.", "bg": "분야는 언어·인지예요. 개념화·범주화·명명이 대상의 ‘개별성(particularity)’을 추상화해 지운다는 것이 핵심. → 이름을 붙이는 일이 무엇을 잃게 하는지에 주목하며 읽으세요.", "flow": [{"kind": "질문", "t": "범주화·이름 붙이기는 대상에 무엇을 하는가?"}, {"kind": "주제", "t": "개념화·범주화·명명 = 개별성을 <span class='r'>추상화해 무시</span>"}, {"kind": "예시", "t": "‘꽃’·‘잔디’는 색·종류가 다른 것을 한 묶음으로 싸잡음"}, {"kind": "전환", "t": "<span class='g'>확대하면</span> 고유성은 어디에나 있다"}, {"kind": "결론", "t": "실용 목적엔 무시 OK — 그러나 관리인에겐 잔디 하나하나가 다르다", "cls": "close"}], "vocab": [["conceptualize", "개념화하다"], ["co-categorize", "(함께) 한 범주로 묶다"], ["leave out", "빼다·생략하다"], ["zoom in", "확대하다·자세히 들여다보다"], ["and the like", "~ 따위·등등"], ["abstract", "(세부를) 추상하여 걸러 내다"], ["proper name", "고유 명사"], ["neglect", "무시하다·도외시하다"], ["glance", "힐끗 봄"], ["constituent", "구성하는·구성 요소의"], ["groundskeeper", "(경기장) 관리인"], ["blade", "(풀)잎·날"], ["distinct", "뚜렷이 다른·구별되는"], ["fellow", "동류·같은 부류의 것"]], "quiz": [["‘꽃’이라는 이름이 하는 일은?", "흰색·노란색·베이지색처럼 서로 다른 것들을 <b>한 범주로 묶어 차이를 지운다</b>."], ["차이를 무시하면 안 되는 예는?", "잔디를 관리하는 <b>관리인(groundskeeper)</b>에겐 잔디 종류 하나하나의 차이가 중요해요."]], "en": "Every time you conceptualize, categorize, and put a name on something that is not a proper name, you abstract away from its particularities. Picture daisies and clover flowers in a lawn. Those four ordinary nouns leave out their differences. \"Flower\" co-categorizes the white and yellow types with the beige ones, and all the many other sorts to be found elsewhere. \"Lawn\" neglects the varieties of grass and all the nongrassy plants that are there. Zoom in, and you will find individuality and uniqueness everywhere. No two daisies, no two clovers, are exactly alike, and yet they present to a quick glance a carpet patterned uniformly enough. For most practical purposes, the differences can be ignored ─ making a daisy chain, sunbathing, and the like. Not so, however, for the groundskeeper of a sports stadium, where the constituent grasses and their stages of growth really do matter. And to an infinite mind, with infinite memory, each blade of grass, with its own distinct life history, need not be co-categorized with all its fellows. Each could have its own name, as you yourself do.", "ko": "고유 명사가 아닌 무언가를 개념화하고, 범주화하고, 명명할 때마다, 여러분은 그 대상의 개별적 특성을 추상화해 덜어 낸다. 잔디밭에 있는 데이지와 클로버 꽃을 떠올려 보라. 그 네 개의 보통 명사는 그것들의 차이를 생략한다. '꽃'이라는 말은 흰색과 노란색 종류를 베이지색 종류, 그리고 다른 곳에서 발견되는 모든 수많은 다른 종류와 함께 하나의 범주로 묶어 버린다. '잔디'라는 말은 그곳에 있는 다양한 종류의 풀과 모든 풀이 아닌 식물을 무시한다. 확대해 보면, 여러분은 개별성과 고유성을 어디에서나 발견할 수 있을 것이다. 어떤 데이지 두 송이도, 어떤 클로버 두 포기도 정확히 같지 않지만, 재빨리 힐끗 한 번 보기에 그것들은 충분히 균일한 무늬의 카펫으로 보인다. 데이지 꽃목걸이 만들기나 일광욕하기 등과 같은 대부분의 실용적인 목적을 위해서라면 그 차이들을 무시할 수 있다. 그러나 스포츠 경기장의 관리인에게는 그렇지 않은데, 그곳에서는 (잔디를) 구성하는 풀들과 그것들의 성장 단계가 실제로 정말 중요하다. 그리고 무한한 기억력을 지닌, 무한한 정신에게, 각각의 풀잎은, 각기 고유한 생애 이력을 지닌 채, 그것의 모든 비슷한 것과 함께 하나의 범주로 묶일 필요가 없다. 여러분 자신이 그러하듯, 각각은 자기만의 이름을 가질 수 있다.", "read": [{"en": "Every time you conceptualize, categorize, and put a name on something that is not a proper name, you abstract away from its particularities.", "ko": "고유 명사가 아닌 무언가를 개념화하고, 범주화하고, 명명할 때마다, 여러분은 그 대상의 개별적 특성을 추상화해 덜어 낸다.", "chunks": [["Every time you conceptualize, categorize,", "여러분이 개념화하고, 범주화하고,"], ["and put a name on something", "그리고 무언가에 이름을 붙일 때마다"], ["that is not a proper name,", "고유 명사가 아닌,"], ["you abstract away from", "여러분은 ~에서 추상화하여 멀어진다"], ["its particularities.", "그것의 개별적 특성으로부터."]]}, {"en": "Picture daisies and clover flowers in a lawn.", "ko": "잔디밭에 있는 데이지와 클로버 꽃을 떠올려 보라.", "chunks": [["Picture", "떠올려 보라"], ["daisies and clover flowers", "데이지와 클로버 꽃을"], ["in a lawn.", "잔디밭에 있는."]]}, {"en": "Those four ordinary nouns leave out their differences.", "ko": "그 네 개의 보통 명사는 그것들의 차이를 생략한다.", "chunks": [["Those four ordinary nouns", "그 네 개의 보통 명사는"], ["leave out", "생략한다"], ["their differences.", "그것들의 차이를."]]}, {"en": "\"Flower\" co-categorizes the white and yellow types with the beige ones, and all the many other sorts to be found elsewhere.", "ko": "'꽃'이라는 말은 흰색과 노란색 종류를 베이지색 종류, 그리고 다른 곳에서 발견되는 모든 수많은 다른 종류와 함께 하나의 범주로 묶어 버린다.", "chunks": [["\"Flower\" co-categorizes", "'꽃'이라는 말은 한 범주로 묶는다"], ["the white and yellow types", "흰색과 노란색 종류를"], ["with the beige ones,", "베이지색 종류와 함께,"], ["and all the many other sorts", "그리고 다른 모든 수많은 종류와"], ["to be found elsewhere.", "다른 곳에서 발견되는."]]}, {"en": "\"Lawn\" neglects the varieties of grass and all the nongrassy plants that are there.", "ko": "'잔디'라는 말은 그곳에 있는 다양한 종류의 풀과 모든 풀이 아닌 식물을 무시한다.", "chunks": [["\"Lawn\" neglects", "'잔디'라는 말은 무시한다"], ["the varieties of grass", "다양한 종류의 풀과"], ["and all the nongrassy plants", "모든 풀이 아닌 식물을"], ["that are there.", "그곳에 있는."]]}, {"en": "Zoom in, and you will find individuality and uniqueness everywhere.", "ko": "확대해 보면, 여러분은 개별성과 고유성을 어디에서나 발견할 수 있을 것이다.", "chunks": [["Zoom in,", "확대해 보라,"], ["and you will find", "그러면 발견할 것이다"], ["individuality .", "그것의 모든 비슷한 것과 함께."]]}, {"en": "Each could have its own name, as you yourself do.", "ko": "여러분 자신이 그러하듯, 각각은 자기만의 이름을 가질 수 있다.", "chunks": [["Each could have", "각각은 가질 수 있다"], ["its own name,", "자기만의 이름을,"], ["as you yourself do.", "여러분 자신이 그러하듯."]]}]}, {"no": "no.33", "title": "Architecture as Spatial Choreography", "ktitle": "잘 된 건축은 설명서 없이 행동을 이끈다", "field": "건축 · 디자인", "page": "2026 3월 모의 · no.33", "oneline": "건축은 행동을 유도하는 <span class='g'>‘공간적 연출’</span>이며, 좋은 설계는 사용자의 욕구와 <span class='r'>공명</span>해 설명서 없이 스스로를 드러낸다.", "metaphor": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"집 단면 안 사람의 초록 시선이 자연히 창을 거쳐 정원·햇빛으로 향하고, 초록 동선이 계단을 거쳐 위층으로 이어지며, 설명서·표지판은 필요 없다는 그림\">\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\">공간이 욕구에 '응답' — 무언의 안무(choreography)</text>\n  <!-- garden + sun outside -->\n  <g transform=\"translate(52,72)\">\n    <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <g stroke=\"#1FA34A\" stroke-width=\"1.3\"><line x1=\"0\" y1=\"-16\" x2=\"0\" y2=\"-21\"/><line x1=\"-12\" y1=\"-12\" x2=\"-15\" y2=\"-15\"/><line x1=\"-16\" y1=\"0\" x2=\"-21\" y2=\"0\"/><line x1=\"-12\" y1=\"12\" x2=\"-15\" y2=\"15\"/></g>\n    <text x=\"0\" y=\"34\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">garden · sun</text>\n  </g>\n  <!-- house cross-section -->\n  <rect x=\"78\" y=\"40\" width=\"290\" height=\"168\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n  <line x1=\"78\" y1=\"126\" x2=\"368\" y2=\"126\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n  <!-- window on left wall, upper floor -->\n  <rect x=\"74\" y=\"66\" width=\"8\" height=\"34\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n  <text x=\"118\" y=\"58\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\">wi "#1FA34A\"/>\n  <text x=\"250\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">go up →</text>\n  <!-- manual crossed out -->\n  <g transform=\"translate(470,98)\">\n    <rect x=\"-32\" y=\"-30\" width=\"64\" height=\"74\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.3\"/>\n    <line x1=\"-22\" y1=\"-14\" x2=\"22\" y2=\"-14\" stroke=\"#999\" stroke-width=\"1\"/>\n    <line x1=\"-22\" y1=\"-2\" x2=\"22\" y2=\"-2\" stroke=\"#999\" stroke-width=\"1\"/>\n    <line x1=\"-22\" y1=\"10\" x2=\"22\" y2=\"10\" stroke=\"#999\" stroke-width=\"1\"/>\n    <line x1=\"-22\" y1=\"22\" x2=\"14\" y2=\"22\" stroke=\"#999\" stroke-width=\"1\"/>\n    <text x=\"0\" y=\"-38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#999\">manual · signage</text>\n    <line x1=\"-34\" y1=\"-32\" x2=\"34\" y2=\"46\" stroke=\"#c8102e\" stroke-width=\"2.4\"/>\n    <line x1=\"34\" y1=\"-32\" x2=\"-34\" y2=\"46\" stroke=\"#c8102e\" stroke-width=\"2.4\"/>\n    <text x=\"0\" y=\"64\" font-family=\"Noto Serif KR\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">설명서·표지판 불필요</text>\n  </g>\n</svg>", "caption": "창문은 '내다보고 싶은 곳'에, 계단은 '가고 싶은 곳'에 — 잘 된 건축은 사람의 의도와 무언으로 공명한다.", "tldr": ["모든 건축 구조는 움직임·지각·감정을 유도하는 <span style=\"color:#1FA34A;font-weight:700\">‘공간적 연출(choreography)’</span>이다.", "세심한 설계자는 사용자의 욕구를 직관으로 알아, 설계가 그 욕구와 공명한다.", "성공적 건축은 <span style=\"color:#1FA34A;font-weight:700\">설명서·표지판 없이 스스로 사용법을 드러낸다</span>."], "analogy": "잘 만든 집은 들어서면 ‘창은 여기서 밖을 보고 싶지’, ‘계단은 이리로 올라가고 싶지’ 하는 <span style=\"color:#1FA34A;font-weight:700\">마음의 동선과 딱 맞아떨어지죠</span>. 설명 안 해도 몸이 자연스럽게 움직여요.", "bg": "분야는 건축·디자인이에요. 핵심 비유는 건축이 행동을 유도하는 ‘공간적 연출(spatial choreography)’이라는 것. → 좋은 설계가 사용자와 어떻게 ‘공명’하는지에 주목하며 읽으세요.", "flow": [{"kind": "주제", "t": "건축 = 행동을 유도하는 <span class='g'>공간적 연출</span>"}, {"kind": "확장", "t": "움직임뿐 아니라 지각·감정까지 이끈다"}, {"kind": "핵심", "t": "좋은 설계자는 사용자 <span class='r'>욕구와 공명</span>"}, {"kind": "예시", "t": "창문은 내다보고 싶은 곳에, 계단은 가고 싶은 곳에"}, {"kind": "결론", "t": "성공적 건축 = 설명서 없이 스스로 드러냄", "cls": "close"}], "vocab": [["choreography", "(공간) 연출·안무"], ["predetermine", "미리 결정하다"], ["resonate", "공명하다·공감을 일으키다"], ["on behalf of", "~을 대신하여·~을 위하여"], ["experiential / experience", "경험적인·체험의"], ["instinctual / instinct", "본능적인"], ["wordless / word", "무언의·말없는"], ["facilitate", "촉진하다·쉽게 하다"], ["prohibit", "금지하다·막다"], ["inhibit", "억제하다·저해하다"], ["intuit", "직관으로 알다"], ["empathic", "공감하는"], ["occupant", "입주자·사용자"], ["dweller", "거주자"], ["signage", "표지판·안내 표시"], ["profound", "심오한·깊은"]], "quiz": [["건축을 ‘공간적 연출(choreography)’이라 부르는 이유는?", "공간이 사람의 <b>움직임·지각·감정을 촉진·억제하며 이끌기</b> 때문이에요."], ["‘성공적 건축’의 기준은?", "설명서나 표지판 없이도 <b>스스로 사용법을 드러내는</b> 거예요."]], "en": "All architectural structures are forms of spatial choreography that guides action; space facilitates or prohibits, encourages or prevents, invites or inhibits. This choreography predetermines patterns of movement and behavior, but it also guides experiential characteristics, perceptions, imageries, emotions and feelings. A sensitive and empathic designer intuits human behavior and desire, and this intuitive architectural scripting resonates with the actual user/occupant's natural and instinctual needs and intentions. While designing a house, the designer lives, uses and feels the non-existent house in his imagination on behalf of the future dweller. A correctly placed window is located exactly where the occupant wishes to look out into the garden, or where daylight is needed. The stairway is located where the dweller wishes to enter the floor above or below. Successful architecture does not need manuals or signage for its use, as it reveals its very structure and use in a wordless manner. A profound building is an extension of human bodily and mental actions and capabilities.", "ko": "모든 건축 구조물은 행동을 유도하는 공간적 연출의 형태인데, 공간은 촉진하거나 금지하고, 권장하거나 막고, 초대하거나 억제한다. 이러한 연출은 움직임과 행동 양식을 미리 결정하지만, 그것은 또한 경험적 특성, 지각, 심상, 감정과 느낌을 유도한다. 세심하고 공감 능력이 있는 설계자는 인간의 행동과 욕망을 직관으로 알며, 이러한 직관적인 건축적 스크립팅은 실제 사용자 또는 입주자의 자연스럽고 본능적인 욕구 및 의도와 공명한다. 주택을 설계하는 동안, 설계자는 자신의 상상 속에서 미래 거주자를 대신하여 존재하지 않는 집을 경험하고, 사용하고, 느낀다. 올바르게 배치된 창문은 입주자가 정원을 내다보고 싶어 하는, 또는 햇빛이 필요한 바로 그곳에 설치된다. 계단은 거주자가 위층이나 아래층으로 들어가고 싶어 하는 곳에 설치된다. 성공적인 건축에는 그것의 사용을 위한 설명서나 표지판이 필요하지 않은데, 성공적인 건축은 무언의 방식으로 바로 그 구조와 용도를 드러내기 때문이다. 깊이 있는 건축물은 인간의 신체적 그리고 정신적 행동과 능력의 연장이다.", "read": [{"en": "All architectural structures are forms of spatial choreography that guides action; space facilitates or prohibits, encourages or prevents, invites or inhibits.", "ko": "모든 건축 구조물은 행동을 유도하는 공간적 연출의 형태인데, 공간은 촉진하거나 금지하고, 권장하거나 막고, 초대하거나 억제한다.", "chunks": [["All architectural structures", "모든 건축 구조물은"], ["are forms of spatial choreography", "공간적 연출의 형태이다"], ["that guides action;", "행동을 유도하는;"], ["space facilitates or prohibits,", "공간은 촉진하거나 금지하고,"], ["encourages or prevents,", "권장하거나 막고,"], ["invites or inhibits.", "초대하거나 억제한다."]]}, {"en": "This choreography predetermines patterns of movement and behavior, but it also guides experiential characteristics, perceptions, imageries, emotions and feelings.", "ko": "이러한 연출은 움직임과 행동 양식을 미리 결정하지만, 그것은 또한 경험적 특성, 지각, 심상, 감정과 느낌을 유도한다.", "chunks": [["This choreography predetermines", "이러한 연출은 미리 결정한다"], ["patterns of movement and behavior,", "움직임과 행동 양식을,"], ["but it also guides", "그러나 그것은 또한 유도한다"], ["experiential characteristics, perceptions, imageries,", "경험적 특성, 지각, 심상,"], ["emotions and feelings.", "감정과 느낌을."]]}, {"en": "A sensitive and empathic designer intuits human behavior and desire, and this intuitive architectural scripting resonates with the actual user/occupant's natural and instinctual needs and intentions.", "ko": "세심하고 공감 능력이 있는 설계자는 인간의 행동과 욕망을 직관으로 알며, 이러한 직관적인 건축적 스크립팅은 실제 사용자 또는 입주자의 자연스럽고 본능적인 욕구 및 의도와 공명한다.", "chunks": [["A sensitive and empathic designer", "세심하고 공감 능력이 있는 설계자는"], ["intuits human behavior and desire,", "인간의 행동과 욕망을 직관으로 알며,"], ["and this intuitive architectural scripting", "그리고 이러한 직관적인 건축적 스크립팅은"], ["resonates with the actual user/occupant's", "실제 사용자 또는 입주자의 ~와 공명한다"], ["natural and instinctual needs and intentions.", "자연스럽고 본능적인 욕구 및 의도와."]]}, {"en": "While designing a house, the designer lives, uses and feels the non-existent house in his imagination on behalf of the future dweller.", "ko": "주택을 설계하는 동안, 설계자는 자신의 상상 속에서 미래 거주자를 대신하여 존재하지 않는 집을 경험하고, 사용하고, 느낀다.", "chunks": [["While designing a house,", "주택을 설계하는 동안,"], ["the designer lives, uses and feels", "설계자는 경험하고, 사용하고, 느낀다"], ["the non-existent house", "존재하지 않는 집을"], ["in his imagination", "자신의 상상 속에서"], ["on behalf of the future dweller.", "미래 거주자를 대신하여."]]}, {"en": "A correctly placed window is located exactly where the occupant wishes to look out into the garden, or where daylight is needed.", "ko": "올바르게 배치된 창문은 입주자가 정원을 내다보고 싶어 하는, 또는 햇빛이 필요한 바로 그곳에 설치된다.", "chunks": [["A correctly placed window", "올바르게 배치된 창문은"], ["is located exactly where", "바로 그곳에 설치된다"], ["the occupant wishes to look out into the garden,", "입주자가 정원을 내다보고 싶어 하는,"], ["or where daylight is needed.", "또는 햇빛이 필요한."]]}, {"en": "The stairway is located where the dweller wishes to enter the floor above or below.", "ko": "계단은 거주자가 위층이나 아래층으로 들어가고 싶어 하는 곳에 설치된다.", "chunks": [["The stairway is located", "계단은 설치된다"], ["where the dweller wishes to enter", "거주자가 들어가고 싶어 하는 곳에"], ["the floor above or below.", "위층이나 아래층으로."]]}, {"en": "Successful architecture does not need manuals or signage for its use, as it reveals its very structure and use in a wordless manner.", "ko": "성공적인 건축에는 그것의 사용을 위한 설명서나 표지판이 필요하지 않은데, 성공적인 건축은 무언의 방식으로 바로 그 구조와 용도를 드러내기 때문이다.", "chunks": [["Successful architecture does not need", "성공적인 건축에는 필요하지 않다"], ["manuals or signage for its use,", "그것의 사용을 위한 설명서나 표지판이,"], ["as it reveals", "왜냐하면 그것은 드러내기 때문이다"], ["its very structure and use", "바로 그 구조와 용도를"], ["in a wordless manner.", "무언의 방식으로."]]}, {"en": "A profound building is an extension of human bodily and mental actions and capabilities.", "ko": "깊이 있는 건축물은 인간의 신체적 그리고 정신적 행동과 능력의 연장이다.", "chunks": [["A profound building", "심오한 건물은"], ["is an extension of", "~의 연장이다"], ["human bodily and mental actions and capabilities.", "인간의 신체적·정신적 행동과 능력의."]]}]}, {"no": "no.36", "title": "Moral Considerations as Conversation-Stoppers", "ktitle": "도덕적 판단은 끝없는 ‘왜?’를 멈춰 결정을 가능하게 한다", "field": "철학 · 윤리", "page": "2026 3월 모의 · no.36", "oneline": "인간은 이성적이라 어떤 답에도 <span class='r'>‘왜?’를 끝없이</span> 물어 결정을 못 내릴 위험이 있는데, 도덕적 고려는 그 사슬을 멈추는 <span class='g'>‘대화 중단자’</span>다.", "metaphor": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"끝없이 이어지는 'Why?' 정당화 사슬을 빨간 STOP 표지가 멈춰 도덕적 판단으로 결정이 가능해지는 그림\">\n  <g transform=\"translate(20,30)\">\n    <rect x=\"0\" y=\"0\" width=\"280\" height=\"180\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"140\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">끝없는 정당화 요구</text>\n    <g transform=\"translate(35,35)\"><ellipse cx=\"0\" cy=\"0\" rx=\"32\" ry=\"16\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.1\"/><text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" text-anchor=\"middle\">Why?</text></g>\n    <line x1=\"67\" y1=\"35\" x2=\"100\" y2=\"60\" stroke=\"#999\" stroke-width=\"1.1\"/><polygon points=\"100,60 92,58 96,52\" fill=\"#999\"/>\n    <g transform=\"translate(135,75)\"><ellipse cx=\"0\" cy=\"0\" rx=\"32\" ry=\"16\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.1\"/><text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" text-anchor=\"middle\">Why?</text></g>\n    <line x1=\"167\" y1=\"75\" x2=\"40\" y2=\"115\" stroke=\"#999\" stroke-width=\"1.1\"/><polygon points=\"40,115 50,113 46,120\" fill=\"#999\"/>\n    <g transform=\"translate(45,130)\"><ellipse cx=\"0\" cy=\"0\" rx=\"32\" ry=\"16\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.1\"/><text x=\"0\" y KR\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">→ 결정 가능</text>\n    <text x=\"96\" y=\"116\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">no further justification needed</text>\n    <text x=\"96\" y=\"130\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">\"that's all there is to it\"</text>\n  </g>\n</svg>", "caption": "이성은 \"좋아, 그런데 왜?\"를 무한히 던질 수 있다 — 도덕적 판단은 그 사슬을 여기서 멈춤으로써 결정을 가능하게 한다.", "tldr": ["인간은 이성적이라 어떤 정당화에도 <span style=\"color:#c8102e;font-weight:700\">‘그건 또 왜?’를 끝없이</span> 물을 수 있다.", "그러면 <span style=\"color:#c8102e;font-weight:700\">결정을 못 내린 채 무한히 의심만</span> 하게 된다(사적·공적 모두).", "도덕적 고려는 그 숙고를 즉시 멈추는 <span style=\"color:#1FA34A;font-weight:700\">‘대화 중단자’</span> 역할을 한다."], "analogy": "끝말잇기처럼 ‘왜? 왜? 왜?’를 계속 물으면 영원히 안 끝나죠. ‘그건 도덕적으로 옳지 않아’라는 말은 거기서 딱 — 더 묻지 말고 결정하자는 <span style=\"color:#1FA34A;font-weight:700\">정지 신호</span>예요.", "bg": "분야는 철학·윤리예요. Daniel Dennett의 ‘대화 중단자(conversation-stopper)’ 개념이 핵심 — 끝없는 ‘왜?’의 사슬을 멈추는 도덕적 고려. → 도덕이 왜 그런 역할을 하는지에 주목하며 읽으세요.", "flow": [{"kind": "주제", "t": "도덕적 고려 = <span class='g'>대화 중단자</span>"}, {"kind": "장점", "t": "인간은 이성적 — 늘 정당화를 요구할 수 있다"}, {"kind": "함정", "t": "‘그건 또 왜?’가 <span class='r'>끝없이</span> → 결정 못 함"}, {"kind": "확대", "t": "사적 숙고에도, 공적 논의에도 같은 문제"}, {"kind": "해결", "t": "도덕적 주장이 숙고를 즉시 멈춰 결정 가능", "cls": "close"}], "vocab": [["deliberation", "심사숙고·숙고"], ["rational", "이성적인·합리적인"], ["justification", "타당한 이유·정당화"], ["bring", "~을 끝내다·마무리하다"], ["in its tracks", "즉시·그 자리에서"], ["sensibly / sensible", "분별 있게·현명하게"], ["interpersonal", "대인 간의·사람 사이의"], ["moral", "도덕적인"], ["consideration", "고려 (사항)"], ["conceptual", "개념적인"], ["repertoire", "레퍼토리·보유 목록"], ["trait", "특성·특징"], ["hesitant", "망설이는·주저하는"], ["undone", "좌절된·무너진"], ["tempting", "솔깃한·유혹적인"]], "quiz": [["인간 이성의 ‘함정’은 무엇인가?", "어떤 답에도 ‘왜?’를 <b>끝없이 되물어</b> 결정을 못 내리게 되는 거예요."], ["‘그건 도덕적으로 옳지 않아’가 하는 기능은?", "끝없는 정당화 요구를 <b>멈추는 대화 중단자</b> 역할이에요."]], "en": "Daniel Dennett argues that one benefit of having moral considerations in our conceptual repertoire is that they can serve as conversation-stoppers: their value is to bring deliberations to a close. We are rational creatures, always able to ask for justification, and this is a trait that has served us well in many contexts. The problem is that upon receiving a perfectly good answer we can always sensibly respond \"Okay, but what justifies that?\" ─ and we can potentially do so endlessly, never coming to a decision, forever hesitant and doubting, undone by our own rational capacity. This is potentially as much a problem for our own private deliberations as for our public interpersonal ones. Dennett suggests that it is useful to have \"consideration-generator-squelchers\": items that, once introduced, stop any further deliberation in its tracks. \"That would be morally wrong!\" would appear to work in this manner. Once the claim is accepted then there is no need or room for seeking further justification: the action mustn't be done, even if it is tempting, and that's all there is to it.", "ko": "Daniel Dennett은 우리의 개념적 레퍼토리에 도덕적 고려 사항들을 포함하는 것의 한 가지 이점은 그것들이 '대화 중단자'의 역할을 할 수 있다는 것이라고 주장하는데, 즉 그것들의 가치는 심사숙고를 끝내는 데 있다. 우리는 이성적인 존재로, 항상 정당화를 요구할 수 있으며, 이것은 많은 맥락에서 우리에게 상당히 도움이 되어 온 특성이다. 문제는 우리가 충분히 타당한 답변을 받자마자 언제든지 \"좋아, 그런데 그 답은 또 무엇으로 정당화되지?\"라고 분별 있게 응수할 수 있다는 점이고, 우리는 어쩌면 무한히 그렇게 할 수 있으며 결코 결정을 내리지 못하고, 영원히 망설이고 의심하며, 우리 자신의 이성적 역량에 의해 완전히 좌절하고 만다. 이것은 우리의 공적인 대인 간 심사숙고에서만큼이나 우리 자신의 사적인 심사숙고에서도 잠재적으로 문제이다. Dennett은 '고려 사항 생성기를 잠재우는 장치'을 갖는 것이 쓸모 있다고 말하는데, 이는 일단 도입되면 어떤 그 이상의 심사숙고도 즉시 멈추게 하는 항목이다. \"그것은 도덕적으로 잘못된 것일 거야!\"는 이러한 방식으로 작동하는 것처럼 보일 것이다. 일단 그 주장이 받아들여지면, 더 이상의 정당화를 찾을 필요도 여지도 없고, 그 행동은 비록 솔깃해도 해서는 안되며, 그저 그뿐이다.", "read": [{"en": "Daniel Dennett argues that one benefit of having moral considerations in our conceptual repertoire is that they can serve as conversation-stoppers: their value is to bring deliberations to a close.", "ko": "Daniel Dennett은 우리의 개념적 레퍼토리에 도덕적 고려 사항들을 포함하는 것의 한 가지 이점은 그것들이 '대화 중단자'의 역할을 할 수 있다는 것이라고 주장하는데, 즉 그것들의 가치는 심사숙고를 끝내는 데 있다.", "chunks": [["Daniel Dennett argues that", "Daniel Dennett은 ~라고 주장한다"], ["one benefit of having moral considerations", "도덕적 고려 사항을 포함하는 것의 한 가지 이점은"], ["in our conceptual repertoire", "우리의 개념적 레퍼토리에"], ["is that they can serve as conversation-stoppers:", "그것들이 '대화 중단자'의 역할을 할 수 있다는 것이라고:"], ["their value is to bring deliberations to a close.", "즉 그것들의 가치는 심사숙고를 끝내는 데 있다."]]}, {"en": "We are rational creatures, always able to ask for justification, and this is a trait that has served us well in many contexts.", "ko": "우리는 이성적인 존재로, 항상 정당화를 요구할 수 있으며, 이것은 많은 맥락에서 우리에게 상당히 도움이 되어 온 특성이다.", "chunks": [["We are rational creatures,", "우리는 이성적인 존재로,"], ["always able to ask for justification,", "항상 정당화를 요구할 수 있으며,"], ["and this is a trait", "그리고 이것은 특성이다"], ["that has served us well in many contexts.", "많은 맥락에서 우리에게 상당히 도움이 되어 온."]]}, {"en": "The problem is that upon receiving a perfectly good answer we can always sensibly respond \"Okay, but what justifies that?\" ─ and we can potentially do so endlessly, never coming to a decision, forever hesitant and doubting, undone by our own rational capacity.", "ko": "문제는 우리가 충분히 타당한 답변을 받자마자 언제든지 \"좋아, 그런데 그 답은 또 무엇으로 정당화되지?\"라고 분별 있게 응수할 수 있다는 점이고, 우리는 어쩌면 무한히 그렇게 할 수 있으며 결코 결정을 내리지 못하고, 영원히 망설이고 의심하며, 우리 자신의 이성적 역량에 의해 완전히 좌절하고 만다.", "chunks": [["The problem is that", "문제는 ~라는 점이다"], ["upon receiving a perfectly good answer", "충분히 타당한 답변을 받자마자"], ["we can always sensibly respond", "우리가 언제든지 분별 있게 응수할 수 있다는"], ["\"Okay, but what justifies that?\" ─", "\"좋아, 그런데 그 답은 또 무엇으로 정당화되지?\"라고 ─"], ["and we can potentially do so endlessly,", "그리고 우리는 어쩌면 무한히 그렇게 할 수 있으며,"], ["never coming to a decision,", "결코 결정을 내리지 못하고,"], ["forever hesitant and doubting,", "영원히 망설이고 의심하며,"], ["undone by our own rational capacity.", "우리 자신의 이성적 역량에 의해 완전히 좌절하고 만다."]]}, {"en": "This is potentially as much a problem for our own private deliberations as for our public interpersonal ones.", "ko": "이것은 우리의 공적인 대인 간 심사숙고에서만큼이나 우리 자신의 사적인 심사숙고에서도 잠재적으로 문제이다.", "chunks": [["This is potentially", "이것은 잠재적으로"], ["as much a problem", "~만큼이나 문제이다"], ["for our own private deliberations", "우리 자신의 사적인 심사숙고에서도"], ["as for our public interpersonal ones.", "우리의 공적인 대인 간 심사숙고에서."]]}, {"en": "Dennett suggests that it is useful to have \"consideration-generator-squelchers\": items that, once introduced, stop any further deliberation in its tracks.", "ko": "Dennett은 '고려 사항 생성기를 잠재우는 장치'을 갖는 것이 쓸모 있다고 말하는데, 이는 일단 도입되면 어떤 그 이상의 심사숙고도 즉시 멈추게 하는 항목이다.", "chunks": [["Dennett suggests that", "Dennett은 ~라고 말한다"], ["it is useful to have \"consideration-generator-squelchers\":", "'고려 사항 생성기를 잠재우는 장치'을 갖는 것이 쓸모 있다고:"], ["items that, once introduced,", "즉 일단 도입되면,"], ["stop any further deliberation in its tracks.", "어떤 그 이상의 심사숙고도 즉시 멈추게 하는 항목이다."]]}, {"en": "\"That would be morally wrong!\" would appear to work in this manner.", "ko": "\"그것은 도덕적으로 잘못된 것일 거야!\"는 이러한 방식으로 작동하는 것처럼 보일 것이다.", "chunks": [["\"That would be morally wrong!\"", "\"그것은 도덕적으로 잘못된 것일 거야!\"는"], ["would appear to work", "작동하는 것처럼 보일 것이다"], ["in this manner.", "이러한 방식으로."]]}, {"en": "Once the claim is accepted then there is no need or room for seeking further justification: the action mustn't be done, even if it is tempting, and that's all there is to it.", "ko": "일단 그 주장이 받아들여지면, 더 이상의 정당화를 찾을 필요도 여지도 없고, 그 행동은 비록 솔깃해도 해서는 안되며, 그저 그뿐이다.", "chunks": [["Once the claim is accepted", "일단 그 주장이 받아들여지면"], ["then there is no need or room", "더 이상 필요도 여지도 없고"], ["for seeking further justification:", "더 이상의 타당한 이유를 찾을:"], ["the action mustn't be done,", "그 행동은 해서는 안 되며,"], ["even if it is tempting,", "비록 그것이 솔깃해도,"], ["and that's all there is to it.", "그저 그뿐이다."]]}]}, {"no": "no.38", "title": "Speech and Gesture Are Co-Expressive", "ktitle": "말과 제스처는 맞물려야 하나의 생각이 된다", "field": "언어 · 인지", "page": "2026 3월 모의 · no.38", "oneline": "언어는 ‘완료/진행’ 같은 <span class='r'>범주적 선택을 강요</span>하지만, 제스처는 그런 선택 없이 요소를 잇는 <span class='g'>접착제</span>라, 둘이 맞물려야 사고가 완성된다.", "metaphor": "<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에서 말은 칸칸이 끊긴 범주적 블록이고 제스처는 연속된 초록 띠(접착제)인데, 오른쪽에서 그 띠가 블록들을 하나로 엮어 단일한 '사고'가 되는 그림\">\n  <g transform=\"translate(20,34)\">\n    <rect x=\"0\" y=\"0\" width=\"252\" height=\"176\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    <text x=\"126\" y=\"-9\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">따로면 — 둘 다 불완전</text>\n    <text x=\"126\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">language: \"either / or\", categorical</text>\n    <g>\n      <rect x=\"22\" y=\"34\" width=\"58\" height=\"38\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <text x=\"51\" y=\"57\" font-family=\"Noto Serif KR\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\">완료</text>\n      <rect x=\"97\" y=\"34\" width=\"58\" height=\"38\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <text x=\"126\" y=\"58\" font-family=\"Noto Serif\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c8102e\">?</text>\n      <rect x=\"172\" y=\"34\" width=\"58\" height=\"38\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <text x=\"201\" y=\"57\" font-family=\"Noto Serif KR\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\">진행</text>\n    </g>\n    <text x=\"126\" y=\"98\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">칸칸이 끊긴 선택 (이산)</text>\n    <path d=\"M 22 132 Q 50 116 80 132 Q 110 148 140 132 Q 170 116 200 132 Q 218 142 230 132\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"3\"/>\n    <text x=\"126\" y=\"160\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">gesture: a continuous \"glue\"</text>\n  </g>\n  <g transform=\"translate(286,118)\">\n    <line x1=\"0\" y1=\"0\" x2=\"40\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n    <polygon points=\"40,0 32,-5 32,5\" fill=\"#1a1a1a\"/>\n    <text x=\"20\" y=\"-9\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\">맞물림</text>\n  </g>\n  <g transform=\"translate(338,34)\">\n    <rect x=\"0\" y=\"0\" width=\"240\" height=\"176\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    <text x=\"120\" y=\"-9\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">맞물리면 — 하나의 사고</text>\n    <rect x=\"22\" y=\"48\" width=\"196\" height=\"86\" rx=\"14\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <g>\n      <rect x=\"40\" y=\"68\" width=\"40\" height=\"36\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <rect x=\"100\" y=\"68\" width=\"40\" height=\"36\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <rect x=\"160\" y=\"68\" width=\"40\" height=\"36\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    </g>\n    <path d=\"M 40 86 Q 70 70 100 86 Q 130 102 160 86 Q 185 74 200 86\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"3\"/>\n    <text x=\"120\" y=\"126\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1a1a1a\">one thought</text>\n    <text x=\"120\" y=\"158\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"imagistic-categorial\"</text>\n  </g>\n</svg>", "caption": "말은 '완료/진행 중' either/or 선택을 강제하고, 제스처는 그 사이를 잇는 접착제 — 사고는 둘이 맞물려야 완성된다.", "tldr": ["제스처는 말과 동시에 나오므로 언어·제스처는 <span style=\"color:#1FA34A;font-weight:700\">‘공동 표현적(co-expressive)’</span>이다.", "언어는 ‘완료냐 진행이냐’ 같은 <span style=\"color:#c8102e;font-weight:700\">범주적 선택을 강요</span>한다.", "제스처는 그런 선택 없이 접착제처럼 요소를 이어, <span style=\"color:#1FA34A;font-weight:700\">둘은 중복도 번역도 아니다</span>."], "analogy": "두 톱니바퀴를 떠올려 보세요. 하나(말)는 칸이 정해져 딱딱 끊어 돌고, 다른 하나(제스처)는 이미지처럼 통째로 굴러갑니다. 어느 쪽도 상대의 번역이나 반복이 아니라, 서로 다른 방식이라 <span style=\"color:#1FA34A;font-weight:700\">둘이 맞물려야 하나의 생각이 온전히 돌아가요</span>.", "bg": "분야는 언어·인지예요. 핵심 대비 — 언어는 ‘완료/진행’ 같은 범주적 선택을 강요하지만, 제스처(gesture)는 그렇지 않다는 것. → 말과 몸짓이 어떻게 ‘함께’ 사고를 완성하는지에 주목하며 읽으세요.", "flow": [{"kind": "주제", "t": "말 + 제스처 = <span class='g'>공동 표현적</span>"}, {"kind": "언어", "t": "‘완료/진행’ 같은 <span class='r'>범주적 선택 강요</span>"}, {"kind": "제스처", "t": "그런 선택 없이 요소를 잇는 ‘접착제’"}, {"kind": "결론", "t": "둘은 중복도 번역도 아니다 — 맞물려 하나의 사고", "cls": "close"}], "vocab": [["co-expressive", "공동 표현적인"], ["semiotic", "기호의·기호 체계의"], ["redundant", "중복되는·불필요한"], ["in terms of", "~의 관점에서·~의 측면에서"], ["in that", "~라는 점에서"], ["systematically / systematic", "체계적으로"], ["conceptualize / concept", "개념화하다"], ["categorical / category", "범주적인·단정적인"], ["demonstrate", "입증하다·보여 주다"], ["formulate", "명확하게 말하다·체계화하다"], ["integrated", "결합된·통합된"], ["imagistic", "심상적인·이미지의"], ["ongoing", "진행 중인"], ["affix", "접사 (접두사·접미사)"], ["unite", "결합하다·하나로 묶다"], ["represented", "표현된·나타내어진"]], "quiz": [["언어가 화자에게 강요하는 것은?", "사건이 ‘완료됐는지 진행 중인지’ 같은 <b>범주적 선택</b>을 하도록 강요해요."], ["제스처의 역할을 한 마디로?", "선택을 강요하지 않고 <b>요소를 잇는 접착제</b> — 말과 맞물려 사고를 완성해요."]], "en": "Scholars have demonstrated that the gestures hearing people produce while they are speaking are systematically made at the same time with speech such that language and gesture must be considered \"co-expressive\". This tightly integrated pairing of language and gesture enables speakers to conceptualize and formulate their thoughts in terms of both the \"categorical\" requirements of language, and the \"imagistic\" possibilities of gesture. For example, in describing an event, one must decide if the event has been completed or is ongoing if the language being spoken at that moment has a verbal affix for each meaning and one or the other must be chosen. This kind of choice is characteristic of language as a semiotic system. According to McNeil and Duncan, gesture is different from language in that it does not present the speaker with such choices. Instead, it offers a kind of glue, which helps unite linguistic elements in a larger semiotic expression, which, as a whole, shares important characteristics with the represented objects. In this view, speech and gesture are not redundant nor is one a \"translation\" of the other. Rather, the minimal processing unit for the expression of thought is a combination of the two: it is \"imagistic-categorial\" in nature.", "ko": "학자들은 들을 수 있는 사람(청인)이 말하는 동안 보여 주는 제스처가, 언어와 제스처를 반드시 '공동 표현적'이라고 간주해야 할 만큼, 말과 동시에 체계적으로 만들어진다는 것을 입증해 왔다. 이러한 언어와 제스처의 단단히 결합된 한 쌍은 화자가 언어의 '범주적' 요구와 제스처의 '심상적' 가능성 두 관점 모두에서 자기 생각을 개념화하고 명확하게 말할 수 있게 한다. 예를 들어, 어떤 사건을 묘사할 때, 만약 그 순간에 말해지고 있는 언어가 각 의미를 표시하는 동사 접사를 가지고 있고 둘 중 하나를 반드시 선택해야 한다면, 한 사람(화자)은 그 사건이 완료되었는지 또는 진행 중인지를 반드시 결정해야 한다. 이러한 종류의 선택은 기호 체계로서 언어의 특징이다. McNeil과 Duncan에 따르면, 제스처는 화자에게 그러한 선택을 제시하지 않는다는 점에서 언어와 다르다. 대신에, 제스처는 일종의 접착제를 제공한다. 이 접착제는 언어적 요소들을 더 큰 기호 표현 안에서 결합하도록 돕고, 그 결합체는 전체로서 표현된 대상과 중요한 특징을 공유한다. 이러한 관점에서, 말과 제스처는 중복되는 것이 아니며 어느 하나가 다른 하나의 '번역'도 아니다. 오히려, 사고 표현을 위한 최소 처리 단위는 이 둘의 결합이며, 그것은 본질적으로 '심상적-범주적'이다.", "read": [{"en": "Scholars have demonstrated that the gestures hearing people produce while they are speaking are systematically made at the same time with speech such that language and gesture must be considered \"co-expressive\".", "ko": "학자들은 들을 수 있는 사람(청인)이 말하는 동안 보여 주는 제스처가, 언어와 제스처를 반드시 '공동 표현적'이라고 간주해야 할 만큼, 말과 동시에 체계적으로 만들어진다는 것을 입증해 왔다.", "chunks": [["Scholars have demonstrated that", "학자들은 ~라는 것을 입증해 왔다"], ["the gestures hearing people produce", "들을 수 있는 사람(청인)이 보여 주는 제스처가"], ["while they are speaking", "그들이 말하는 동안"], ["are systematically made at the same time with speech", "말과 동시에 체계적으로 만들어진다는"], ["such that language and gesture must be considered \"co-expressive\".", "언어와 제스처를 반드시 '공동 표현적'이라고 간주해야 할 만큼."]]}, {"en": "This tightly integrated pairing of language and gesture enables speakers to conceptualize and formulate their thoughts in terms of both the \"categorical\" requirements of language, and the \"imagistic\" possibilities of gesture.", "ko": "이러한 언어와 제스처의 단단히 결합된 한 쌍은 화자가 언어의 '범주적' 요구와 제스처의 '심상적' 가능성 두 관점 모두에서 자기 생각을 개념화하고 명확하게 말할 수 있게 한다.", "chunks": [["This tightly integrated pairing", "이러한 단단히 결합된 한 쌍은"], ["of language and gesture", "언어와 제스처의"], ["enables speakers to conceptualize and formulate their thoughts", "화자가 자기 생각을 개념화하고 명확하게 말할 수 있게 한다"], ["in terms of both the \"categorical\" requirements of language,", "언어의 '범주적' 요구와,"], ["and the \"imagistic\" possibilities of gesture.", "제스처의 '심상적' 가능성 두 관점 모두에서."]]}, {"en": "For example, in describing an event, one must decide if the event has been completed or is ongoing if the language being spoken at that moment has a verbal affix for each meaning and one or the other must be chosen.", "ko": "예를 들어, 어떤 사건을 묘사할 때, 만약 그 순간에 말해지고 있는 언어가 각 의미를 표시하는 동사 접사를 가지고 있고 둘 중 하나를 반드시 선택해야 한다면, 한 사람(화자)은 그 사건이 완료되었는지 또는 진행 중인지를 반드시 결정해야 한다.", "chunks": [["For example, in describing an event,", "예를 들어, 어떤 사건을 묘사할 때,"], ["one must decide if the event has been completed or is ongoing", "한 사람(화자)은 그 사건이 완료되었는지 또는 진행 중인지를 반드시 결정해야 한다"], ["if the language being spoken at that moment", "만약 그 순간에 말해지고 있는 언어가"], ["has a verbal affix for each meaning", "각 의미에 대한 동사 접사를 가지고 있고"], ["and one or the other must be chosen.", "둘 중 하나를 반드시 선택해야 한다면."]]}, {"en": "This kind of choice is characteristic of language as a semiotic system.", "ko": "이러한 종류의 선택은 기호 체계로서 언어의 특징이다.", "chunks": [["This kind of choice", "이러한 종류의 선택은"], ["is characteristic of language", "언어의 특징이다"], ["as a semiotic system.", "기호 체계로서."]]}, {"en": "According to McNeil and Duncan, gesture is different from language in that it does not present the speaker with such choices.", "ko": "McNeil과 Duncan에 따르면, 제스처는 화자에게 그러한 선택을 제시하지 않는다는 점에서 언어와 다르다.", "chunks": [["According to McNeil and Duncan,", "McNeil과 Duncan에 따르면,"], ["gesture is different from language", "제스처는 언어와 다르다"], ["in that it does not present the speaker with such choices.", "화자에게 그러한 선택을 제시하지 않는다는 점에서."]]}, {"en": "Instead, it offers a kind of glue, which helps unite linguistic elements in a larger semiotic expression, which, as a whole, shares important characteristics with the represented objects.", "ko": "대신에, 제스처는 일종의 접착제를 제공한다. 이 접착제는 언어적 요소들을 더 큰 기호 표현 안에서 결합하도록 돕고, 그 결합체는 전체로서 표현된 대상과 중요한 특징을 공유한다.", "chunks": [["Instead, it offers a kind of glue,", "대신에, 그것은 일종의 접착제를 제공하는데,"], ["which helps unite linguistic elements", "그것은 언어적 요소들을 결합하도록 돕고"], ["in a larger semiotic expression,", "더 큰 기호 표현 안에서,"], ["which, as a whole, shares important characteristics", "그것은, 전체로서, 중요한 특징을 공유한다"], ["with the represented objects.", "표현된 대상과."]]}, {"en": "In this view, speech and gesture are not redundant nor is one a \"translation\" of the other.", "ko": "이러한 관점에서, 말과 제스처는 중복되는 것이 아니며 어느 하나가 다른 하나의 '번역'도 아니다.", "chunks": [["In this view,", "이러한 관점에서,"], ["speech and gesture are not redundant", "말과 제스처는 중복되는 것이 아니며"], ["nor is one a \"translation\" of the other.", "어느 하나가 다른 하나의 '번역'도 아니다."]]}, {"en": "Rather, the minimal processing unit for the expression of thought is a combination of the two: it is \"imagistic-categorial\" in nature.", "ko": "오히려, 사고 표현을 위한 최소 처리 단위는 이 둘의 결합이며, 그것은 본질적으로 '심상적-범주적'이다.", "chunks": [["Rather, the minimal processing unit", "오히려, 최소 처리 단위는"], ["for the expression of thought", "사고 표현을 위한"], ["is a combination of the two:", "이 둘의 결합이며:"], ["it is \"imagistic-categorial\" in nature.", "그것은 본질적으로 '심상적-범주적'이다."]]}]}, {"no": "no.39", "title": "Epistemic Communities and Outsiders", "ktitle": "공개해도 외부인에겐 보이지 않는다 — 지식 공동체", "field": "사회 · 인식론", "page": "2026 3월 모의 · no.39", "oneline": "전문 지식 습득은 <span class='g'>‘지식 공동체’ 입회</span>이며, 이상은 비밀에서 개방성으로 옮겨갔지만, 완전히 투명한 관행조차 <span class='r'>외부인에겐 여전히 장막</span>이다.", "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"같은 문서를 훈련 없는 외부인은 이해하지 못

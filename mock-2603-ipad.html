=\"155\" y2=\"86\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n  <g transform=\"translate(206,90)\">\n    <line x1=\"-7\" y1=\"-7\" x2=\"7\" y2=\"7\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <line x1=\"-7\" y1=\"7\" x2=\"7\" y2=\"-7\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n  </g>\n  <text x=\"205\" y=\"116\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">cannot make sense</text>\n  <g transform=\"translate(490,80)\">\n    <circle cx=\"0\" cy=\"0\" r=\"22\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <circle cx=\"-8\" cy=\"-2\" r=\"2\" fill=\"#1a1a1a\"/><circle cx=\"8\" cy=\"-2\" r=\"2\" fill=\"#1a1a1a\"/>\n    <path d=\"M -6 8 Q 0 13 6 8\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <polygon points=\"-22,-18 22,-18 0,-26\" fill=\"#1a1a1a\"/>\n    <line x1=\"0\" y1=\"22\" x2=\"0\" y2=\"60\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <line x1=\"0\" y1=\"35\" x2=\"-14\" y2=\"55\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <line x1=\"0\" y1=\"35\" x2=\"14\" y2=\"55\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"0\" y=\"-36\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">✓</text>\n    <text x=\"0\" y=\"80\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">공동체 구성원</text>\n    <text x=\"0\" y=\"94\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">years of training</text>\n  </g>\n  <line x1=\"340\" y1=\"100\" x2=\"442\" y2=\"86\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n  <polygon points=\"442,86 434,85 437,92\" fill=\"#1FA34A\"/>\n  <text x=\"395\" y=\"116\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">meaning extracted</text>\n  <g transform=\"translate(110,196)\">\n    <rect x=\"0\" y=\"0\" width=\"380\" height=\"40\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/>\n    <text x=\"190\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">입회 절차 — 능력 시험 · 공동 관행 사회화</text>\n    <text x=\"190\" y=\"31\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">admittance · tests of abilities · socialization</text>\n  </g>\n</svg>", "caption": "같은 문서가 외부인 앞에서는 장막으로, 훈련받은 내부인 앞에서는 의미로 작동한다 — '투명성'만으로는 부족하다.", "tldr": ["전문 지식을 얻는다는 건 <span style=\"color:#1FA34A;font-weight:700\">‘지식 공동체’의 일원</span>이 되는 것이다.", "전근대엔 비밀·충성 시험이 중요했지만, 오늘날 이상은 <span style=\"color:#1FA34A;font-weight:700\">‘개방성’으로 옮겨갔다</span>.", "그러나 완전히 투명한 관행조차 훈련받지 않은 <span style=\"color:#c8102e;font-weight:700\">외부인에겐 의미가 보이지 않는다</span>."], "analogy": "같은 설계도라도 일반인이 보면 선 뭉치일 뿐이지만, 훈련받은 건축가가 보면 집이 보이죠. ‘공개’했다고 누구나 이해하는 게 아니에요 — <span style=\"color:#1FA34A;font-weight:700\">읽는 훈련이 있어야 의미가 보입니다</span>.", "bg": "분야는 사회·인식론이에요. 핵심 개념은 ‘지식 공동체(epistemic communities)’ — 전문 지식 습득이 곧 입회라는 것. → 개방적 관행조차 외부인에겐 왜 여전히 장막인지에 주목하며 읽으세요.", "flow": [{"kind": "주제", "t": "전문 지식 습득 = <span class='g'>지식 공동체 입회</span>"}, {"kind": "과정", "t": "입회 절차·능력 시험을 거쳐 사회화"}, {"kind": "전근대", "t": "비밀·충성 시험 (지식이 ‘잘못된 손’에 갈 두려움)"}, {"kind": "오늘날", "t": "이상이 <span class='g'>개방성</span>으로 이동"}, {"kind": "반전", "t": "투명해도 외부인에겐 여전히 <span class='r'>장막</span>", "cls": "close"}], "vocab": [["acquire", "습득하다·얻다"], ["epistemic community", "지식 공동체"], ["admittance / admit", "입회·입장 (허가)"], ["premodern", "전근대의"], ["not least", "특히·그중에서도"], ["on the whole", "전체적으로 보아·대체로"], ["to some extent", "어느 정도(까지)"], ["lift the veil", "장막을 걷어 내다·베일을 벗기다"], ["make sense of", "~을 이해하다·납득하다"], ["knowledge bearer", "지식 보유자"], ["newcomer", "신참·새로 온 사람"], ["socialize", "사회화시키다·적응시키다"], ["candidate", "후보자·지원자"], ["trace", "흔적·자취"], ["transparent", "투명한·명백한"], ["accessible", "접근 가능한"]], "quiz": [["전문 지식을 습득한다는 것은 무엇이 되는 것인가?", "해당 분야의 <b>지식 공동체(epistemic community)의 일원</b>이 되는 거예요."], ["‘투명성·개방성’만으로 부족한 이유는?", "완전히 공개된 관행조차 <b>훈련받지 않은 외부인에겐 의미가 보이지 않기</b> 때문이에요."]], "en": "To acquire expert knowledge, one needs to become a member of the relevant group of knowledge bearers, for which I will use the term \"epistemic communities.\" A newcomer learns from experts and is socialized into the common practices of the relevant epistemic community. Often there are admittance processes, combined with tests of a candidate's abilities. In the premodern era, epistemic communities were often kept secret, with strict tests of loyalty for new members, not least because of fears that specialized knowledge would fall into the \"wrong hands.\" Some traces of these older practices may still be present today, but on the whole, the ideal has shifted to openness among the members of epistemic communities, and also, to some extent, toward outsiders. Nonetheless, for most outsiders even completely transparent practices do not lift the veil behind which such forms of knowledge are hidden ─ without the relevant training and acquisition of skills, which often take many years, one simply cannot make sense of the information that is being shared. Other, more active strategies are needed to make certain forms of knowledge as \"accessible\" as is realistically possible.", "ko": "전문 지식을 습득하기 위해서는 관련 지식 보유자 집단의 구성원이 되어야 하는데, 나는 그런 집단을 '지식 공동체'라고 부르겠다. 새로 온 사람은 전문가들로부터 배우며, 관련 지식 공동체의 공동 관행에 사회화된다. 자주 후보자의 능력에 대한 시험과 결합한 입회 절차가 존재한다. 전근대적인 시대에는, 지식 공동체가 자주 비밀에 부쳐졌고, 신입 구성원에게 엄격한 충성심 시험이 있었는데, 특히 전문적인 지식이 '잘못된 손'에 들어갈 것이라는 두려움 때문이었다. 이러한 오래된 관행의 일부 흔적이 오늘날에도 여전히 존재할 수 있지만, 전체적으로 보아, 이상(理想)은 지식 공동체 구성원 사이에서 개방성, 그리고 또한, 어느 정도는, 외부인을 향한 것으로 옮겨 갔다. 그럼에도 불구하고, 대부분의 외부인에게는 완전히 투명한 관행조차도 그러한 형태의 지식이 뒤에 감추어져 있는 장막을 걷어 내지 못한다. 즉, 자주 수년이 걸리는 관련 교육과 기술의 습득 없이는 공유되고 있는 정보를 그야말로 이해할 수 없다. 특정한 형태의 지식을 현실적으로 가능한 한 '접근 가능하게' 만들기 위해서는, 다른, 보다 더 적극적인 전략이 필요하다.", "read": [{"en": "To acquire expert knowledge, one needs to become a member of the relevant group of knowledge bearers, for which I will use the term \"epistemic communities.\"", "ko": "전문 지식을 습득하기 위해서는 관련 지식 보유자 집단의 구성원이 되어야 하는데, 나는 그런 집단을 '지식 공동체'라고 부르겠다.", "chunks": [["To acquire expert knowledge,", "전문 지식을 습득하기 위해서는,"], ["one needs to become a member", "사람은 구성원이 되어야 한다"], ["of the relevant group of knowledge bearers,", "관련 지식 보유자 집단의,"], ["for which I will use the term", "그것에 나는 ~라는 용어를 사용하겠다"], ["\"epistemic communities.\"", "'지식 공동체'라는."]]}, {"en": "A newcomer learns from experts and is socialized into the common practices of the relevant epistemic community.", "ko": "새로 온 사람은 전문가들로부터 배우며, 관련 지식 공동체의 공동 관행에 사회화된다.", "chunks": [["A newcomer learns from experts", "새로 온 사람은 전문가들로부터 배우며"], ["and is socialized into", "그리고 ~에 사회화된다"], ["the common practices", "공동 관행에"], ["of the relevant epistemic community.", "관련 지식 공동체의."]]}, {"en": "Often there are admittance processes, combined with tests of a candidate's abilities.", "ko": "자주 후보자의 능력에 대한 시험과 결합한 입회 절차가 존재한다.", "chunks": [["Often there are", "자주 ~이 존재한다"], ["admittance processes,", "입회 절차가,"], ["combined with tests", "시험과 결합된"], ["of a candidate's abilities.", "후보자의 능력에 대한."]]}, {"en": "In the premodern era, epistemic communities were often kept secret, with strict tests of loyalty for new members, not least because of fears that specialized knowledge would fall into the \"wrong hands.\"", "ko": "전근대적인 시대에는, 지식 공동체가 자주 비밀에 부쳐졌고, 신입 구성원에게 엄격한 충성심 시험이 있었는데, 특히 전문적인 지식이 '잘못된 손'에 들어갈 것이라는 두려움 때문이었다.", "chunks": [["In the premodern era,", "전근대적인 시대에는,"], ["epistemic communities were often kept secret,", "지식 공동체가 자주 비밀에 부쳐졌다,"], ["with strict tests of loyalty for new members,", "신입 구성원에게 엄격한 충성심 시험과 함께,"], ["not least because of fears", "특히 ~라는 두려움 때문에"], ["that specialized knowledge would fall", "전문적인 지식이 들어갈 것이라는"], ["into the \"wrong hands.\"", "'잘못된 손'에."]]}, {"en": "Some traces of these older practices may still be present today, but on the whole, the ideal has shifted to openness among the members of epistemic communities, and also, to some extent, toward outsiders.", "ko": "이러한 오래된 관행의 일부 흔적이 오늘날에도 여전히 존재할 수 있지만, 전체적으로 보아, 이상(理想)은 지식 공동체 구성원 사이에서 개방성, 그리고 또한, 어느 정도는, 외부인을 향한 것으로 옮겨 갔다.", "chunks": [["Some traces of these older practices", "이러한 오래된 관행의 일부 흔적이"], ["may still be present today,", "오늘날에도 여전히 존재할 수 있다,"], ["but on the whole,", "그러나 전체적으로 보아,"], ["the ideal has shifted to openness", "이상은 개방성으로 옮겨 갔다"], ["among the members of epistemic communities,", "지식 공동체 구성원 사이에서,"], ["and also, to some extent, toward outsiders.", "그리고 또한, 어느 정도, 외부인을 향해서도."]]}, {"en": "Nonetheless, for most outsiders even completely transparent practices do not lift the veil behind which such forms of knowledge are hidden ─ without the relevant training and acquisition of skills, which often take many years, one simply cannot make sense of the information that is being shared.", "ko": "그럼에도 불구하고, 대부분의 외부인에게는 완전히 투명한 관행조차도 그러한 형태의 지식이 뒤에 감추어져 있는 장막을 걷어 내지 못한다. 즉, 자주 수년이 걸리는 관련 교육과 기술의 습득 없이는 공유되고 있는 정보를 그야말로 이해할 수 없다.", "chunks": [["Nonetheless, for most outsiders", "그럼에도 불구하고, 대부분의 외부인에게는"], ["even completely transparent practices", "완전히 투명한 관행조차도"], ["do not lift the veil", "장막을 들어 올리지 못한다"], ["behind which such forms of knowledge are hidden ─", "그 뒤에 그러한 형태의 지식이 감추어진 ─"], ["without the relevant training and acquisition of skills,", "관련 교육과 기술의 습득 없이는,"], ["which often take many years,", "자주 수년이 걸리는,"], ["one simply cannot make sense of", "사람은 그야말로 이해할 수 없다"], ["the information that is being shared.", "공유되고 있는 정보를."]]}, {"en": "Other, more active strategies are needed to make certain forms of knowledge as \"accessible\" as is realistically possible.", "ko": "특정한 형태의 지식을 현실적으로 가능한 한 '접근 가능하게' 만들기 위해서는, 다른, 보다 더 적극적인 전략이 필요하다.", "chunks": [["Other, more active strategies", "다른, 보다 더 적극적인 전략이"], ["are needed", "필요하다"], ["to make certain forms of knowledge", "특정한 형태의 지식을 만들기 위해"], ["as \"accessible\"", "'접근 가능하게'"], ["as is realistically possible.", "현실적으로 가능한 한."]]}]}, {"no": "no.41-42", "title": "Literature as an Imperfect Mirror", "ktitle": "문학은 결함과 사각지대가 있는 거울이다", "field": "문학 · 비평", "page": "2026 3월 모의 · no.41-42", "oneline": "문학은 현실을 비추는 거울이지만 <span class='r'>결함·사각지대</span>가 있어, <span class='g'>비추지 않는 것</span>으로도 의미가 있고 결코 완전한 상이 아니다.", "metaphor": "<svg viewBox=\"0 0 600 262\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 현실(해·나무·집)이 가운데 금이 가고 사각지대가 있는 거울을 거쳐, 오른쪽 상에는 해·나무만 비치고 집은 점선 윤곽의 부재로 남으며, 거울에 잡히지 않는 관점이 따로 있다는 그림\">\n  <!-- reality -->\n  <g transform=\"translate(20,40)\">\n    <rect x=\"0\" y=\"0\" width=\"160\" height=\"160\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <text x=\"80\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">현실 — 있는 그대로</text>\n    <circle cx=\"40\" cy=\"40\" r=\"12\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <g stroke=\"#1FA34A\" stroke-width=\"1.2\"><line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"14\"/><line x1=\"22\" y1=\"40\" x2=\"16\" y2=\"40\"/><line x1=\"27\" y1=\"27\" x2=\"23\" y2=\"23\"/></g>\n    <line x1=\"100\" y1=\"135\" x2=\"100\" y2=\"95\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <circle cx=\"100\" cy=\"82\" r=\"18\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <g><polygon points=\"40,135 60,108 80,135\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/></g>\n    <text x=\"80\" y=\"152\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">sun · tree · hill</text>\n  </g>\n  <!-- defective mirror -->\n  <g transform=\"translate(218,40)\">\n    <text x=\"72\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">결함 있는 거울</text>\n    <rect x=\"0\" y=\"0\" width=\"144\" height=\"160\" fill=\"#fafafa\" stroke=\"#1a1a1a\" stroke-width=\"2.4\"/>\n    <line x1=\"20\" y1=\"8\" x2=\"120\" y2=\"120\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n    <line x1=\"90\" y1=\"10\" x2=\"60\" y2=\"150\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"3 2\"/>\n    <rect x=\"96\" y=\"86\" width=\"48\" height=\"74\" fill=\"#1a1a1a\" opacity=\"0.82\"/>\n    <text x=\"120\" y=\"120\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#ffffff\">blind</text>\n    <text x=\"120\" y=\"132\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#ffffff\">spot</text>\n    <text x=\"40\" y=\"50\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\">cracks</text>\n  </g>\n  <!-- reflection with absence -->\n  <g transform=\"translate(410,40)\">\n    <rect x=\"0\" y=\"0\" width=\"170\" height=\"160\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\" stroke-dasharray=\"3 2\"/>\n    <text x=\"85\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">비친 상 — 부재</text>\n    <g opacity=\"0.55\">\n      <circle cx=\"48\" cy=\"42\" r=\"12\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <polygon points=\"40,135 60,108 80,135\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    </g>\n    <g>\n      <rect x=\"104\" y=\"84\" width=\"44\" height=\"56\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n      <text x=\"126\" y=\"108\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">사각지대</text>\n      <text x=\"126\" y=\"122\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">(not reflected)</text>\n    </g>\n    <text x=\"85\" y=\"152\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">absence made faintly present</text>\n  </g>\n  <!-- invisible viewpoint -->\n  <g transform=\"translate(300,228)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"13\" ry=\"8\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\" stroke-dasharray=\"2 2\"/>\n    <circle cx=\"0\" cy=\"0\" r=\"3.5\" fill=\"#1a1a1a\"/>\n    <line x1=\"0\" y1=\"-9\" x2=\"0\" y2=\"-24\" stroke=\"#999\" stroke-width=\"1.2\" stroke-dasharray=\"2 2\"/>\n    <polygon points=\"0,-24 -4,-18 4,-18\" fill=\"#999\"/>\n    <text x=\"24\" y=\"3\" font-family=\"Noto Serif KR\" font-size=\"9.5\" fill=\"#5e5e5e\">관점은 거울에 안 잡힘 — invisible viewpoint</text>\n  </g>\n</svg>", "caption": "거울 자체가 '균열·흐림·사각지대'를 갖고 있고, 거울에 잡히지 않는 '관점'이 그 뒤에 숨어 있다.", "tldr": ["문학이 현실을 비춘다 해도 그 비추기는 <span style=\"color:#c8102e;font-weight:700\">결코 직접적인 상이 아니다</span>.", "거울에는 <span style=\"color:#c8102e;font-weight:700\">결함·사각지대</span>가 있어, 작가가 의식 못 한 모순까지 드러낸다.", "문학은 일관된 전체가 아니라 조각날 수 있다 — <span style=\"color:#c8102e;font-weight:700\">거울은 본래 불완전하다</span>."], "analogy": "금이 가고 군데군데 흐린 거울을 떠올려 보세요. 어떤 풍경은 비치고 어떤 건 사각지대로 안 비치죠. 게다가 <span style=\"color:#c8102e;font-weight:700\">거울 자체의 각도(관점)는 거울에 안 잡혀요</span>. 문학이 현실을 비추는 방식이 그래요.", "bg": "분야는 문학·비평이에요. 비평가 Macherey가 문학을 현실을 비추는 ‘거울’에 빗댄 것이 핵심(톨스토이·레닌 논의). → 그 거울의 ‘결함·사각지대’가 어떤 의미인지에 주목하며 읽으세요.", "flow": [{"kind": "도입", "t": "문학 = 현실의 거울 — 그러나 <span class='r'>직접적인 상이 아님</span>"}, {"kind": "본질", "t": "거울에는 결함·사각지대가 있다"}, {"kind": "역설", "t": "<span class='g'>비추지 않는 것(부재)</span>으로도 의미가 있다"}, {"kind": "단편성", "t": "일관된 전체가 아니라 조각날 수 있다"}, {"kind": "인용", "t": "George Eliot: ‘거울은 분명 결함이 있다’", "cls": "close"}], "vocab": [["mirroring", "거울 비추기·반영"], ["distortion", "왜곡·뒤틀림"], ["coherent", "일관된·통일성 있는"], ["by no means", "결코 ~이 아닌"], ["tell it like it is", "있는 그대로 말하다"], ["beyond question", "의심할 여지 없는"], ["reflection / reflect", "상(像)·반영"], ["exclusion / exclude", "배제·제외"], ["defective / defect", "불완전한·결함 있는"], ["commentary", "논평·해설"], ["flaw", "결함·흠"], ["contradiction", "모순"], ["conscious", "의식하는·자각하는"], ["absence", "부재·없음"], ["discordant", "조화롭지 못한·불협화의"], ["reproach", "비난하다·꾸짖다"], ["viewpoint", "관점·시점"], ["figure", "나타나다·등장하다"]], "quiz": [["문학이라는 ‘거울’의 특징은?", "결함·사각지대가 있어 <b>완전하거나 직접적인 상을 주지 못한다</b>."], ["거울이 ‘비추지 않는 것’이 왜 중요한가?", "작가가 <b>의식하지 못한 모순·배제</b>를 드러내, 없는 것을 더 또렷이 보게 하기 때문이에요."]], "en": "Writing of a commentary by Lenin on Leo Tolstoy, the critic Pierre Macherey agrees with Lenin's claim that Tolstoy's work holds up a mirror to the Russian revolution of 1905. Yet this mirroring, Macherey argues, is a complex affair, by no means a direct reflection of the world as it stands. If literary works are in some sense mirrors, they are mirrors marked by flaws and blind spots. In fact, they are as significant for what they don't reflect ─ for their exclusions and distortions ─ as for what they do. There are things which do not and cannot figure in the mirror ─ in the case of Tolstoy, certain contradictions in society of which he could not be conscious. Even so, the mirror makes us aware of these absences, which thus become faintly present. It is as though it allows us to see more clearly what isn't there. There is also no reason to assume that what we see in the mirror must form a coherent whole. On the contrary, it may be in pieces and discordant. 'The mirror is doubtless defective; the outlines will sometimes be disturbed; the reflection faint or confused', remarks George Eliot in Adam Bede, reproaching the kind of naive realism which holds that art (or mirrors) always tell it like it is. A mirror offers us a version of reality, but it does so from a viewpoint which cannot be captured in the mirror itself. And because this viewpoint is invisible to us, we might be tempted to take it as beyond question.", "ko": "Leo Tolstoy에 대한 Lenin의 논평에 관해 기술하며, 비평가 Pierre Macherey는 Tolstoy의 작품이 1905년 러시아 혁명을 비추는 거울 역할을 한다는 Lenin의 주장에 동의한다. 하지만 Macherey는 이러한 거울 비추기가 복잡한 일이며, 결코 있는 그대로의 세상에 대한 직접적인 상(像)이 아니라고 주장한다. 만약 문학 작품이 어떤 의미에서 거울이라면, 그것은 결함과 사각지대에 의해 특징지어지는 거울이다. 사실 그것은 그것이 비추는 것만큼이나 비추지 않는 것, 즉 배제와 왜곡으로 인해 중요하다. 거울 속에 나타나지 않으며 나타날 수도 없는 것들이 있는데, Tolstoy의 경우 그가 의식할 수 없었던 사회의 특정 모순들이 그러하다. 그렇다 하더라도, 거울은 우리에게 이러한 부재를 인식하게 하며, 그리하여 그것들은 희미하게 존재하게 된다. 그것은 마치 거울이 우리가 그곳에 없는 것을 더 명확하게 볼 수 있게 해 주는 것과 같다. 우리가 거울 속에서 보는 것이 틀림없이 일관된 전체를 형성할 것이라고 가정할 이유 또한 없다. 그와는 반대로 그것은 조각나 있고 서로 어긋나 있을 수도 있다. George Eliot은 Adam Bede에서 \"그 거울은 의심할 바 없이 불완전하고, 윤곽은 때때로 흐트러질 것이며, 상(像)은 희미하거나 혼란스러울 수도 있을 것이다.\"라고 언급하며, 예술 (또는 거울)이 언제나 있는 그대로를 말해 준다고 믿는 종류의 소박실재론을 비판한다. 거울은 우리에게 현실의 한 버전을 제공하지만, 그것은 거울 그 자체에서는 포착될 수 없는 관점에서 그렇게 하는 것이다. 그리고 이 관점은 우리에게 보이지 않기 때문에, 우리는 그것을 의심할 여지가 없는 것으로 받아들이고 싶은 유혹을 느낄지도 모른다.", "read": [{"en": "Writing of a commentary by Lenin on Leo Tolstoy, the critic Pierre Macherey agrees with Lenin's claim that Tolstoy's work holds up a mirror to the Russian revolution of 1905.", "ko": "Leo Tolstoy에 대한 Lenin의 논평에 관해 기술하며, 비평가 Pierre Macherey는 Tolstoy의 작품이 1905년 러시아 혁명을 비추는 거울 역할을 한다는 Lenin의 주장에 동의한다.", "chunks": [["Writing of a commentary by Lenin on Leo Tolstoy,", "Leo Tolstoy에 대한 Lenin의 논평에 관해 기술하며,"], ["the critic Pierre Macherey agrees with Lenin's claim", "비평가 Pierre Macherey는 Lenin의 주장에 동의한다"], ["that Tolstoy's work holds up a mirror", "Tolstoy의 작품이 거울 역할을 한다는"], ["to the Russian revolution of 1905.", "1905년 러시아 혁명에."]]}, {"en": "Yet this mirroring, Macherey argues, is a complex affair, by no means a direct reflection of the world as it stands.", "ko": "하지만 Macherey는 이러한 거울 비추기가 복잡한 일이며, 결코 있는 그대로의 세상에 대한 직접적인 상(像)이 아니라고 주장한다.", "chunks": [["Yet this mirroring, Macherey argues,", "하지만 이러한 거울 비추기는, Macherey가 주장하기를,"], ["is a complex affair,", "복잡한 일이며,"], ["by no means a direct reflection of the world", "결코 세상에 대한 직접적인 상(像)이 아니다"], ["as it stands.", "있는 그대로의."]]}, {"en": "If literary works are in some sense mirrors, they are mirrors marked by flaws and blind spots.", "ko": "만약 문학 작품이 어떤 의미에서 거울이라면, 그것은 결함과 사각지대에 의해 특징지어지는 거울이다.", "chunks": [["If literary works are in some sense mirrors,", "만약 문학 작품이 어떤 의미에서 거울이라면,"], ["they are mirrors marked by", "그것은 ~에 의해 특징지어지는 거울이다"], ["flaws and blind spots.", "결함과 사각지대."]]}, {"en": "In fact, they are as significant for what they don't reflect ─ for their exclusions and distortions ─ as for what they do.", "ko": "사실 그것은 그것이 비추는 것만큼이나 비추지 않는 것, 즉 배제와 왜곡으로 인해 중요하다.", "chunks": [["In fact, they are as significant", "사실 그것은 ~만큼이나 중요하다"], ["for what they don't reflect ─", "그것이 비추지 않는 것 ─"], ["for their exclusions and distortions ─", "즉 배제와 왜곡으로 인해 ─"], ["as for what they do.", "그것이 비추는 것만큼."]]}, {"en": "There are things which do not and cannot figure in the mirror ─ in the case of Tolstoy, certain contradictions in society of which he could not be conscious.", "ko": "거울 속에 나타나지 않으며 나타날 수도 없는 것들이 있는데, Tolstoy의 경우 그가 의식할 수 없었던 사회의 특정 모순들이 그러하다.", "chunks": [["There are things which do not and cannot figure in the mirror ─", "거울 속에 나타나지 않으며 나타날 수도 없는 것들이 있는데 ─"], ["in the case of Tolstoy,", "Tolstoy의 경우,"], ["certain contradictions in society", "사회의 특정 모순들이 그러하다"], ["of which he could not be conscious.", "그가 의식할 수 없었던."]]}, {"en": "Even so, the mirror makes us aware of these absences, which thus become faintly present.", "ko": "그렇다 하더라도, 거울은 우리에게 이러한 부재를 인식하게 하며, 그리하여 그것들은 희미하게 존재하게 된다.", "chunks": [["Even so, the mirror makes us aware of", "그렇다 하더라도, 거울은 우리에게 ~을 인식하게 한다"], ["these absences,", "이러한 부재를,"], ["which thus become faintly present.", "그리하여 그것들은 희미하게 존재하게 된다."]]}, {"en": "It is as though it allows us to see more clearly what isn't there.", "ko": "그것은 마치 거울이 우리가 그곳에 없는 것을 더 명확하게 볼 수 있게 해 주는 것과 같다.", "chunks": [["It is as though", "그것은 마치 ~과 같다"], ["it allows us to see more clearly", "거울이 우리가 더 명확하게 볼 수 있게 해 주는"], ["what isn't there.", "그곳에 없는 것을."]]}, {"en": "There is also no reason to assume that what we see in the mirror must form a coherent whole.", "ko": "우리가 거울 속에서 보는 것이 틀림없이 일관된 전체를 형성할 것이라고 가정할 이유 또한 없다.", "chunks": [["There is also no reason to assume", "~라고 가정할 이유 또한 없다"], ["that what we see in the mirror", "우리가 거울 속에서 보는 것이"], ["must form a coherent whole.", "틀림없이 일관된 전체를 형성할 것이라고."]]}, {"en": "On the contrary, it may be in pieces and discordant.", "ko": "그와는 반대로 그것은 조각나 있고 서로 어긋나 있을 수도 있다.", "chunks": [["On the contrary,", "그와는 반대로,"], ["it may be in pieces and discordant.", "그것은 단편적이고 조화를 이루지 못할 수도 있다."]]}, {"en": "'The mirror is doubtless defective; the outlines will sometimes be disturbed; the reflection faint or confused', remarks George Eliot in Adam Bede, reproaching the kind of naive realism which holds that art (or mirrors) always tell it like it is.", "ko": "George Eliot은 Adam Bede에서 \"그 거울은 의심할 바 없이 불완전하고, 윤곽은 때때로 흐트러질 것이며, 상(像)은 희미하거나 혼란스러울 수도 있을 것이다.\"라고 언급하며, 예술 (또는 거울)이 언제나 있는 그대로를 말해 준다고 믿는 종류의 소박실재론을 비판한다.", "chunks": [["'The mirror is doubtless defective;", "\"그 거울은 의심할 바 없이 불완전하고;"], ["the outlines will sometimes be disturbed;", "윤곽은 때때로 흐트러질 것이며;"], ["the reflection faint or confused',", "상(像)은 희미하거나 분명치 않기도 할 것이다\","], ["remarks George Eliot in Adam Bede,", "George Eliot은 Adam Bede에서 언급하며,"], ["reproaching the kind of naive realism", "소박실재론을 비판한다"], ["which holds that art (or mirrors) always tell it like it is.", "예술(또는 거울)이 언제나 있는 그대로를 말해 준다고 믿는 종류의."]]}, {"en": "A mirror offers us a version of reality, but it does so from a viewpoint which cannot be captured in the mirror itself.", "ko": "거울은 우리에게 현실의 한 버전을 제공하지만, 그것은 거울 그 자체에서는 포착될 수 없는 관점에서 그렇게 하는 것이다.", "chunks": [["A mirror offers us a version of reality,", "거울은 우리에게 현실의 한 버전을 제공하지만,"], ["but it does so from a viewpoint", "그것은 한 관점에서 그렇게 하는 것이다"], ["which cannot be captured in the mirror itself.", "거울 그 자체에서는 포착될 수 없는."]]}, {"en": "And because this viewpoint is invisible to us, we might be tempted to take it as beyond question.", "ko": "그리고 이 관점은 우리에게 보이지 않기 때문에, 우리는 그것을 의심할 여지가 없는 것으로 받아들이고 싶은 유혹을 느낄지도 모른다.", "chunks": [["And because this viewpoint is invisible to us,", "그리고 이 관점은 우리에게 보이지 않기 때문에,"], ["we might be tempted to take it", "우리는 그것을 받아들이고 싶은 유혹을 느낄지도 모른다"], ["as beyond question.", "의심할 여지가 없는 것으로."]]}]}]};

   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

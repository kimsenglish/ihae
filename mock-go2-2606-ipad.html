o Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">노점상이 선택</text>\n  </g>\n\n  <!-- ★ 빈칸·결론 strip -->\n  <rect x=\"40\" y=\"168\" width=\"520\" height=\"70\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n  <text x=\"58\" y=\"190\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1a1a1a\">★ 노점상은 무료 보행로로 값비싼 상업 공간을 대체한다</text>\n  <text x=\"58\" y=\"208\" font-family=\"Noto Serif\" font-size=\"9\" fill=\"#5e5e5e\">They <tspan font-weight=\"700\" fill=\"#1FA34A\">substitute public sidewalks for costly commercial space</tspan>.</text>\n  <text x=\"58\" y=\"226\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#999\">전제: 대도시의 비싼 토지 값 → 자원의 효율적 활용이 관건 (뉴욕에만 노점 카트 <tspan font-weight=\"700\" fill=\"#1FA34A\">3,000+대</tspan>)</text>\n</svg>", "caption": "한쪽엔 ‘연 2만 달러’ 임대 간판이 붙은 매장, 다른 쪽엔 ‘무료’ 보도 위 핫도그 카트 — 영리한 선택을 가리키는 그림.", "tldr": ["뉴욕에만 3,000대가 넘는 보도 카트 — <span style=\"color:#1FA34A;font-weight:700\">왜 이렇게 인기일까요?</span>", "핫도그 공급 자원 중 가장 비싼 것은 <span style=\"color:#c8102e;font-weight:700\">토지(상업 공간 임대료)</span> — 카트 한 대 넓이도 연 최대 2만 달러.", "반면 공공 보행로는 노점상에게 <span style=\"color:#1FA34A;font-weight:700\">무료</span> → 이익 극대화 노점상은 보도를 값비싼 상업 공간 대신 써요."], "analogy": "푸드트럭이 임대료 비싼 1층 매장 대신 길가에 서는 것과 같아요. 똑같은 핫도그를 팔아도 ‘땅값’을 안 내니 남는 게 다르죠 — 위치 선택이 곧 비용 절감 전략이에요.", "bg": "분야는 도시경제학이에요. ‘land price(토지 가격)’가 자원 배분을 좌우한다는 게 출발점이고, ‘substitute A for B(B 대신 A를 쓰다)’가 빈칸의 핵심 구문. → ‘무엇이 가장 비싼가?’라는 질문 → 임대료 수치 제시 → 보도는 무료라는 대비 → 결론(빈칸)으로 이어지는 경제 추론을 따라가며 읽으세요.", "flow": [{"kind": "주제", "t": "대도시의 비싼 토지 값이 자원의 효율적 활용에 영향"}, {"kind": "예시·질문", "t": "뉴욕의 보도 카트(3,000대+) — 왜 이렇게 인기일까?"}, {"kind": "분석", "t": "핫도그 공급 자원 중 무엇이 가장 비싼가?"}, {"kind": "근거", "t": "상업 공간 임대료: 카트 한 대 넓이도 <span style=\"color:#c8102e;font-weight:700\">연 최대 2만 달러</span>"}, {"kind": "반전", "t": "반면 공공 보행로는 노점상에게 <span style=\"color:#1FA34A;font-weight:700\">무료</span>"}, {"kind": "결론(빈칸)", "t": "노점상은 무료 보행로를 값비싼 상업 공간 대신 사용"}], "vocab": [["metropolitan", "대도시의"], ["implication", "영향·함의"], ["efficient", "효율적인"], ["employment", "활용·사용·고용"], ["resource", "자원"], ["vending cart", "판매 카트·노점 카트"], ["labor", "노동·노동력"], ["capital", "자본"], ["entrepreneurial", "기업가의·사업가적인"], ["intermediate", "중간의·중간 단계의"], ["ingredient", "재료·성분"], ["retail space", "소매 공간·매장"], ["rent", "임대되다·임차하다"], ["permit", "허가·허가증"], ["vendor", "노점상·판매상"], ["profit-maximizing", "이익 극대화의"], ["substitute A for B", "B 대신 A를 쓰다"]], "quiz": [["핫도그 공급 자원 중 뉴욕에서 가장 비싼 것은?", "<b>토지(상업 공간 임대료)</b>예요 — 카트 한 대 넓이만 빌려도 연 2만 달러까지 들죠."], ["노점상이 보도를 택하는 경제적 이유는?", "공공 보행로는 <b>(필수 허가 외엔) 무료</b>라서, 이익을 극대화하려면 <b>값비싼 상업 공간 대신</b> 보도를 쓰는 게 합리적이에요."]], "en": "The high price of land in metropolitan areas has implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so popular, with over 3,000 in New York City alone? Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for costly commercial space.", "ko": "대도시의 높은 토지 가격은 자원의 효율적 활용에 영향을 미친다. 예를 들어, 뉴욕시에서는, 많은 대도시에서처럼, 보행로 판매 카트는 핫도그부터 아이스크림까지 모든 것을 판매한다. 왜 뉴욕시에서만 3,000대가 넘는 카트들이 이렇게 인기가 많을까? 핫도그를 공급하는 데 사용되는 자원인 토지, 노동력, 자본, 기업가의 능력과 이에 더해 핫도그 소시지, 빵, 그리고 기타 재료 같은 중간재들을 살펴보자. 당신은 이 중 뉴욕시에서 가장 비싼 것은 무엇이라고 생각하는가? Madison Avenue를 따라 있는 소매 공간은 평방피트당 연평균 550달러로 임대된다. 핫도그 카트 운영에는 약 4제곱야드가 필요하므로, 그만큼의 상업 공간을 임대하는 데는 일 년에 20,000달러까지 비용이 들 수 있다. 그러나, 필수적인 공공 허가 말고는, 공공 보행로 위의 공간은 노점상들에게 무료이다. 이익 극대화를 추구하는 노점상들은 공공 보행로를 값비싼 상업 공간 대신으로 쓴다.", "read": [{"en": "The high price of land in metropolitan areas has implications for the efficient employment of resources.", "ko": "대도시의 높은 토지 가격은 자원의 효율적 활용에 영향을 미친다.", "chunks": [["The high price of land", "높은 토지 가격은"], ["in metropolitan areas", "대도시의"], ["has implications for the efficient employment of resources.", "자원의 효율적 활용에 영향을 미친다."]]}, {"en": "For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream.", "ko": "예를 들어, 뉴욕시에서는, 많은 대도시에서처럼, 보행로 판매 카트는 핫도그부터 아이스크림까지 모든 것을 판매한다.", "chunks": [["For example, in New York City, as in many large cities,", "예를 들어, 뉴욕시에서는, 많은 대도시에서처럼,"], ["sidewalk vending carts sell everything", "보행로 판매 카트는 모든 것을 판매한다"], ["from hot dogs to ice cream.", "핫도그부터 아이스크림까지."]]}, {"en": "Why are these carts so popular, with over 3,000 in New York City alone?", "ko": "왜 뉴욕시에서만 3,000대가 넘는 카트들이 이렇게 인기가 많을까?", "chunks": [["Why are these carts so popular,", "왜 이 카트들이 이렇게 인기가 많을까,"], ["with over 3,000 in New York City alone?", "뉴욕시에서만 3,000대가 넘는?"]]}, {"en": "Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients.", "ko": "핫도그를 공급하는 데 사용되는 자원인 토지, 노동력, 자본, 기업가의 능력과 이에 더해 핫도그 소시지, 빵, 그리고 기타 재료 같은 중간재들을 살펴보자.", "chunks": [["Consider the resources used to supply hot dogs:", "핫도그를 공급하는 데 사용되는 자원을 살펴보자:"], ["land, labor, capital, entrepreneurial ability,", "토지, 노동력, 자본, 기업가의 능력,"], ["plus intermediate goods such as hot dogs, buns, and other ingredients.", "이에 더해 핫도그 소시지, 빵, 그리고 기타 재료 같은 중간재들을."]]}, {"en": "Which of these do you suppose is most expensive in New York City?", "ko": "당신은 이 중 뉴욕시에서 가장 비싼 것은 무엇이라고 생각하는가?", "chunks": [["Which of these do you suppose", "당신은 이 중 무엇이라고 생각하는가"], ["is most expensive in New York City?", "뉴욕시에서 가장 비싼 것은?"]]}, {"en": "Retail space along Madison Avenue rents for an average of $550 a year per square foot.", "ko": "Madison Avenue를 따라 있는 소매 공간은 평방피트당 연평균 550달러로 임대된다.", "chunks": [["Retail space along Madison Avenue", "Madison Avenue를 따라 있는 소매 공간은"], ["rents for an average of $550 a year", "연평균 550달러로 임대된다"], ["per square foot.", "평방피트당."]]}, {"en": "Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space.", "ko": "핫도그 카트 운영에는 약 4제곱야드가 필요하므로, 그만큼의 상업 공간을 임대하는 데는 일 년에 20,000달러까지 비용이 들 수 있다.", "chunks": [["Because operating a hot dog cart requires about 4 square yards,", "핫도그 카트 운영에는 약 4제곱야드가 필요하므로,"], ["it could cost as much as $20,000 a year", "일 년에 20,000달러까지 비용이 들 수 있다"], ["to rent that much commercial space.", "그만큼의 상업 공간을 임대하는 데는."]]}, {"en": "Aside from the necessary public permits, however, space on the public sidewalk is free to vendors.", "ko": "그러나, 필수적인 공공 허가 말고는, 공공 보행로 위의 공간은 노점상들에게 무료이다.", "chunks": [["Aside from the necessary public permits, however,", "그러나, 필수적인 공공 허가 말고는,"], ["space on the public sidewalk", "공공 보행로 위의 공간은"], ["is free to vendors.", "노점상들에게 무료이다."]]}, {"en": "Profit-maximizing street vendors substitute public sidewalks for costly commercial space.", "ko": "이익 극대화를 추구하는 노점상들은 공공 보행로를 값비싼 상업 공간 대신으로 쓴다.", "chunks": [["Profit-maximizing street vendors", "이익 극대화를 추구하는 노점상들은"], ["substitute public sidewalks for costly commercial space.", "공공 보행로를 값비싼 상업 공간 대신으로 쓴다."]]}]}, {"no": "no.35", "title": "Understanding Art Through Its Context", "ktitle": "예술은 ‘맥락’을 알 때 보인다", "field": "예술 · 감상론", "page": "2026 6월 학평 · no.35 (무관한 문장)", "oneline": "예술 감상은 시각만이 아니라 <span style=\"color:#1FA34A;font-weight:700\">정신적 과정</span> — 작품의 <span style=\"color:#1FA34A;font-weight:700\">맥락 정보</span>가 의미 해석을 돕습니다 (<span style=\"color:#c8102e;font-weight:700\">무관 문장 = ‘맥락을 무시하라’</span>).", "metaphor": "<svg viewBox=\"0 0 600 272\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"작품의 위치·시기·문화·창작자 같은 맥락 정보가 작품의 의미와 상징 해석을 돕는 흐름과, 그와 반대로 맥락을 무시하고 보이는 대로 이해하라는 무관 문장 S4를 빨간 X 표시로 가려낸 그림\">\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Understanding Art Through Its Context — 맥락 정보 → 의미 해석</text>\n\n  <!-- 맥락 정보 박스 -->\n  <rect x=\"22\" y=\"62\" width=\"156\" height=\"92\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n  <text x=\"100\" y=\"80\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">맥락 정보</text>\n  <text x=\"100\" y=\"100\" font-family=\"Noto Serif\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">where · when</text>\n  <text x=\"100\" y=\"116\" font-family=\"Noto Serif\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">culture</text>\n  <text x=\"100\" y=\"132\" font-family=\"Noto Serif\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">creator · why</text>\n  <text x=\"100\" y=\"148\" font-family=\"Noto Serif KR\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#999\">의미의 단서</text>\n\n  <!-- 작품 -->\n  <line x1=\"178\" y1=\"108\" x2=\"210\" y2=\"108\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n  <polygon points=\"210,108 203,104.5 203,111.5\" fill=\"#1a1a1a\"/>\n  <rect x=\"216\" y=\"70\" width=\"92\" height=\"76\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n  <rect x=\"224\" y=\"78\" width=\"76\" height=\"60\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"0.7\"/>\n  <circle cx=\"248\" cy=\"98\" r=\"7\" fill=\"#999\"/>\n  <polygon points=\"234,130 260,104 286,130\" fill=\"#ccc\"/>\n  <text x=\"262\" y=\"160\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">작품 (artwork)</text>\n\n  <!-- 해석 출력 -->\n  <line x1=\"308\" y1=\"108\" x2=\"416\" y2=\"108\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n  <polygon points=\"416,108 407,103 407,113\" fill=\"#1FA34A\"/>\n  <text x=\"362\" y=\"100\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\">맥락으로 해석</text>\n  <rect x=\"420\" y=\"80\" width=\"158\" height=\"58\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n  <text x=\"499\" y=\"104\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">의미 · 상징 해석</text>\n  <text x=\"499\" y=\"122\" font-family=\"Noto Serif\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">interpret what it means</text>\n\n  <!-- S4 무관 문장 (빨강 점선 + 벡터 X) -->\n  <rect x=\"22\" y=\"196\" width=\"556\" height=\"62\" rx=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/>\n  <!-- 벡터 X (텍스트 글리프 아님) -->\n  <g stroke=\"#c8102e\" stroke-width=\"3\" stroke-linecap=\"round\">\n    <line x1=\"44\" y1=\"216\" x2=\"68\" y2=\"240\"/>\n    <line x1=\"68\" y1=\"216\" x2=\"44\" y2=\"240\"/>\n  </g>\n  <text x=\"86\" y=\"222\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#c8102e\">③ (S4) 무관 문장 — 글의 흐름과 반대</text>\n  <text x=\"86\" y=\"240\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#5e5e5e\">“맥락에 영향받지 말고 <tspan font-weight=\"700\" fill=\"#c8102e\">보이는 대로 이해하라</tspan>” → 맥락 활용이라는 주제와 모순</text>\n</svg>", "caption": "한 줄로 이어지는 ‘맥락으로 의미 읽기’ 화살표들 사이에, ‘맥락 무시하고 보이는 대로’라는 역방향 화살표 하나가 거꾸로 박힌 그림.", "tldr": ["예술 감상 = 시각 + <span style=\"color:#1FA34A;font-weight:700\">정신적 과정</span> — 식별·분류 가능한 요소에 기반해요.", "어디서·언제·어떤 문화·누가·왜 만들었나 같은 <span style=\"color:#1FA34A;font-weight:700\">맥락</span>이 의미의 단서를 줍니다.", "끼어든 문장: <span style=\"color:#c8102e;font-weight:700\">‘맥락에 영향받지 말고 보이는 대로 이해하라’</span> — 글의 흐름을 정반대로 거슬러요."], "analogy": "같은 그림도 ‘전쟁 직후에 그렸다’를 알면 다르게 보이죠. 그런데 글 중간에 ‘배경은 무시하고 보세요’라는 문장이 끼면, 다큐 내레이션 중에 반대 주장이 튀어나온 셈 — 그게 무관 문장이에요.", "bg": "분야는 미술 감상론이에요. ‘context(맥락)’ — 작품의 시대·문화·작가·제작 이유 — 가 의미 해석의 열쇠라는 게 글 전체의 축. → 모든 문장이 ‘맥락이 이해를 돕는다’를 향하는지 점검하며 읽으세요. 한 문장만 정반대(맥락을 배제하라)를 말합니다.", "flow": [{"kind": "주제", "t": "예술 감상 = 시각 + <span style=\"color:#1FA34A;font-weight:700\">정신적 과정</span>, 식별·분류 가능한 요소에 기반"}, {"kind": "전개", "t": "위치·시기·문화·창작자·이유 등 맥락이 의미의 단서를 줌"}, {"kind": "무관", "t": "<span style=\"color:#c8102e;font-weight:700\">맥락에 영향받지 말고 보이는 대로 이해하라</span> — 흐름 역행"}, {"kind": "근거", "t": "수집 가능한 모든 정보가 작품의 맥락 이해를 도움"}, {"kind": "결론", "t": "모은 맥락 정보를 사용해 의미·상징을 해석"}], "vocab": [["make sense of", "이해하다·의미를 파악하다"], ["visual", "시각적인"], ["mental", "정신적인"], ["element", "요소"], ["identify", "식별하다·확인하다"], ["categorize", "분류하다"], ["clue", "단서"], ["strive", "애쓰다·노력하다"], ["influence", "영향을 주다"], ["background", "배경"], ["creator", "창작자"], ["historical", "역사적인"], ["context", "맥락·배경"], ["gather", "수집하다·모으다"], ["contextual", "맥락의"], ["interpret", "해석하다"], ["symbolize", "상징하다"]], "quiz": [["글이 말하는 예술 감상의 핵심은?", "감상은 <b>시각만이 아니라 정신적 과정</b>이고, <b>작품의 맥락(시대·문화·작가·이유) 정보가 의미 해석을 돕는다</b>는 거예요."], ["무관 문장이 ‘무관’한 이유는?", "글의 축은 ‘<b>맥락이 이해를 돕는다</b>’인데, 그 문장만 ‘<b>맥락을 무시하고 보이는 대로 이해하라</b>’며 정반대를 말하기 때문이에요."]], "en": "The process we go through when we look at a work of art to determine if we recognize and can make sense of its content is not just a visual one. It is a mental process as well, largely based on the elements within and about the work we can identify and categorize. As we look and think, we may be given clues about what the work means by where it is, when it was made, what culture it came from, who created it, or why it was made. We should strive to understand a work of art as we see it, without being influenced by the background of the work, its creator, or its historical context. Any information we can gather helps us understand the work’s context, that is, for what historical, social, personal, political, or scientific reasons the work of art was made. And then, using all the contextual information we have gathered, we interpret the work of art’s content to discover what it means or symbolizes.", "ko": "예술 작품을 볼 때 우리가 그것의 내용을 인식하고 이해할 수 있는지를 결정하기 위해 우리가 거치는 과정은 단지 시각적인 것만은 아니다. 그것은 또한 정신적인 과정이며, 우리가 식별하고 분류할 수 있는 작품 안에 있는 그리고 작품에 관한 요소들에 주로 기반한다. 우리가 보고 생각할 때, 우리는 그것이 어디에 있는지, 그것이 언제 만들어졌는지, 그것이 어떤 문화에서 왔는지, 누가 그것을 창조했는지, 또는 왜 그것이 만들어졌는지에 의해 그 작품이 무엇을 의미하는지에 대한 단서들을 제공받을 수도 있다. (우리는 작품의 배경, 그것의 창작자, 또는 역사적 맥락에 의해 영향을 받지 않고, 우리가 예술 작품을 보는 대로 그것을 이해하도록 노력해야 한다.) 우리가 수집할 수 있는 어떤 정보라도 우리가 그 작품의 맥락, 즉, 예술 작품이 어떤 역사적, 사회적, 개인적, 정치적, 또는 과학적 이유들로 만들어졌는지를 이해하는 데 도움을 준다. 그리고 나서, 우리가 수집해온 모든 맥락적 정보를 사용하여, 우리는 그것이 무엇을 의미하거나 상징하는지를 발견하기 위해 예술 작품의 내용을 해석한다.", "read": [{"en": "The process we go through when we look at a work of art to determine if we recognize and can make sense of its content is not just a visual one.", "ko": "예술 작품을 볼 때 우리가 그것의 내용을 인식하고 이해할 수 있는지를 결정하기 위해 우리가 거치는 과정은 단지 시각적인 것만은 아니다.", "chunks": [["The process we go through", "우리가 거치는 과정은"], ["when we look at a work of art", "우리가 예술 작품을 볼 때"], ["to determine if we recognize and can make sense of its content", "우리가 그것의 내용을 인식하고 이해할 수 있는지를 결정하기 위해"], ["is not just a visual one.", "단지 시각적인 것만은 아니다."]]}, {"en": "It is a mental process as well, largely based on the elements within and about the work we can identify and categorize.", "ko": "그것은 또한 정신적인 과정이며, 우리가 식별하고 분류할 수 있는 작품 안에 있는 그리고 작품에 관한 요소들에 주로 기반한다.", "chunks": [["It is a mental process as well,", "그것은 또한 정신적인 과정이며,"], ["largely based on the elements", "요소들에 주로 기반한다"], ["within and about the work", "작품 안에 있는 그리고 작품에 관한"], ["we can identify and categorize.", "우리가 식별하고 분류할 수 있는."]]}, {"en": "As we look and think, we may be given clues about what the work means by where it is, when it was made, what culture it came from, who created it, or why it was made.", "ko": "우리가 보고 생각할 때, 우리는 그것이 어디에 있는지, 그것이 언제 만들어졌는지, 그것이 어떤 문화에서 왔는지, 누가 그것을 창조했는지, 또는 왜 그것이 만들어졌는지에 의해 그 작품이 무엇을 의미하는지에 대한 단서들을 제공받을 수도 있다.", "chunks": [["As we look and think,", "우리가 보고 생각할 때,"], ["we may be given clues about what the work means", "우리는 그 작품이 무엇을 의미하는지에 대한 단서들을 제공받을 수도 있다"], ["by where it is, when it was made,", "그것이 어디에 있는지, 그것이 언제 만들어졌는지에 의해,"], ["what culture it came from, who created it, or why it was made.", "그것이 어떤 문화에서 왔는지, 누가 그것을 창조했는지, 또는 왜 그것이 만들어졌는지."]]}, {"en": "We should strive to understand a work of art as we see it, without being influenced by the background of the work, its creator, or its historical context.", "ko": "(우리는 작품의 배경, 그것의 창작자, 또는 역사적 맥락에 의해 영향을 받지 않고, 우리가 예술 작품을 보는 대로 그것을 이해하도록 노력해야 한다.)", "chunks": [["We should strive to understand a work of art", "우리는 예술 작품을 이해하도록 노력해야 한다"], ["as we see it,", "우리가 그것을 보는 대로,"], ["without being influenced by the background of the work,", "작품의 배경에 의해 영향을 받지 않고,"], ["its creator, or its historical context.", "그것의 창작자, 또는 역사적 맥락에 의해."]]}, {"en": "Any information we can gather helps us understand the work’s context, that is, for what historical, social, personal, political, or scientific reasons the work of art was made.", "ko": "우리가 수집할 수 있는 어떤 정보라도 우리가 그 작품의 맥락, 즉, 예술 작품이 어떤 역사적, 사회적, 개인적, 정치적, 또는 과학적 이유들로 만들어졌는지를 이해하는 데 도움을 준다.", "chunks": [["Any information we can gather", "우리가 수집할 수 있는 어떤 정보라도"], ["helps us understand the work’s context,", "우리가 그 작품의 맥락을 이해하는 데 도움을 준다,"], ["that is, for what historical, social, personal, political, or scientific reasons", "즉, 어떤 역사적, 사회적, 개인적, 정치적, 또는 과학적 이유들로"], ["the work of art was made.", "예술 작품이 만들어졌는지."]]}, {"en": "And then, using all the contextual information we have gathered, we interpret the work of art’s content to discover what it means or symbolizes.", "ko": "그리고 나서, 우리가 수집해온 모든 맥락적 정보를 사용하여, 우리는 그것이 무엇을 의미하거나 상징하는지를 발견하기 위해 예술 작품의 내용을 해석한다.", "chunks": [["And then,", "그리고 나서,"], ["using all the contextual information we have gathered,", "우리가 수집해온 모든 맥락적 정보를 사용하여,"], ["we interpret the work of art’s content", "우리는 예술 작품의 내용을 해석한다"], ["to discover what it means or symbolizes.", "그것이 무엇을 의미하거나 상징하는지를 발견하기 위해."]]}]}, {"no": "no.36", "title": "From Survival to Affluence", "ktitle": "생존 투쟁에서 풍요와 여유로", "field": "인류학 · 진화", "page": "2026 6월 학평 · no.36 (글의 순서)", "oneline": "동물·초기 조상은 <span style=\"color:#c8102e;font-weight:700\">생존 투쟁에 모든 시간</span>을 썼지만, <span style=\"color:#1FA34A;font-weight:700\">효율적 사냥꾼으로 진화</span>하며 풍요와 여유(time on their hands)를 누리게 됐어요.", "metaphor": "<svg viewBox=\"0 0 600 264\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 사람이 온종일 사냥감을 쫓으며 생존에 모든 시간을 쓰다가, 가운데 도구로 효율적으로 사냥하는 사람으로 발전하고, 오른쪽 여유롭게 쉬는 사람으로 풍요에 이르는 세 장면을 보여 주는 그림\">\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">From Survival to Affluence — 생존 투쟁 → 효율 사냥 → 여유</text>\n\n  <!-- ① 생존 투쟁 (B) -->\n  <g transform=\"translate(30, 42)\">\n    <rect x=\"0\" y=\"0\" width=\"166\" height=\"118\" rx=\"6\" fill=\"#ffffff\" stroke=\"#ccc\" stroke-width=\"1.2\"/>\n    <rect x=\"0\" y=\"0\" width=\"166\" height=\"18\" rx=\"6\" fill=\"#fdf2f4\"/>\n    <rect x=\"0\" y=\"9\" width=\"166\" height=\"9\" fill=\"#fdf2f4\"/>\n    <text x=\"83\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">① 생존 투쟁 (B)</text>\n    <!-- 해 -->\n    <circle cx=\"28\" cy=\"38\" r=\"6\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n    <g stroke=\"#c8102e\" stroke-width=\"0.9\"><line x1=\"28\" y1=\"28\" x2=\"28\" y2=\"24\"/><line x1=\"18\" y1=\"38\" x2=\"14\" y2=\"38\"/><line x1=\"21\" y1=\"31\" x2=\"18\" y2=\"28\"/></g>\n    <!-- 달리는 사냥꾼 -->\n    <g transform=\"translate(74, 60)\" stroke=\"#1a1a1a\" stroke-width=\"1.5\" fill=\"none\">\n      <circle cx=\"0\" cy=\"-30\" r=\"7\" fill=\"#ffffff\"/>\n      <line x1=\"0\" y1=\"-23\" x2=\"7\" y2=\"-4\"/>\n      <line x1=\"3\" y1=\"-16\" x2=\"-9\" y2=\"-21\"/>\n      <line x1=\"3\" y1=\"-16\" x2=\"14\" y2=\"-11\"/>\n      <line x1=\"7\" y1=\"-4\" x2=\"-8\" y2=\"10\"/>\n      <line x1=\"7\" y1=\"-4\" x2=\"19\" y2=\"6\"/>\n    </g>\n    <!-- 도망가는 사냥감 -->\n    <g transform=\"translate(132, 64)\" stroke=\"#1a1a1a\" stroke-width=\"1.2\" fill=\"none\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"11\" ry=\"6\"/>\n      <circle cx=\"11\" cy=\"-4\" r=\"3.5\"/>\n      <line x1=\"-7\" y1=\"6\" x2=\"-7\" y2=\"12\"/><line x1=\"0\" y1=\"6\" x2=\"0\" y2=\"12\"/><line x1=\"7\" y1=\"6\" x2=\"7\" y2=\"12\"/>\n    </g>\n    <text x=\"83\" y=\"92\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">온종일 쫓김 — 모든 시간 소모</text>\n    <text x=\"83\" y=\"106\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">struggle to survive</text>\n  </g>\n\n  <!-- ② 효율적 사냥꾼 (A) -->\n  <g transform=\"translate(217, 42)\">\n    <rect x=\"0\" y=\"0\" width=\"166\" height=\"118\" rx=\"6\" fill=\"#ffffff\" stroke=\"#ccc\" stroke-width=\"1.2\"/>\n    <rect x=\"0\" y=\"0\" width=\"166\" height=\"18\" rx=\"6\" fill=\"#f6f6f6\"/>\n    <rect x=\"0\" y=\"9\" width=\"166\" height=\"9\" fill=\"#f6f6f6\"/>\n    <text x=\"83\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">② 효율적 사냥꾼 (A)</text>\n    <!-- 아이디어(지능) 전구 -->\n    <g transform=\"translate(60, 34)\">\n      <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <rect x=\"-3\" y=\"5\" width=\"6\" height=\"4\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n      <g stroke=\"#1FA34A\" stroke-width=\"0.8\"><line x1=\"0\" y1=\"-10\" x2=\"0\" y2=\"-13\"/><line x1=\"9\" y1=\"0\" x2=\"12\" y2=\"0\"/><line x1=\"6\" y1=\"-7\" x2=\"9\" y2=\"-10\"/></g>\n    </g>\n    <!-- 창 든 사냥꾼 -->\n    <g transform=\"translate(72, 58)\" stroke=\"#1a1a1a\" stroke-width=\"1.5\" fill=\"none\">\n      <circle cx=\"0\" cy=\"-28\" r=\"7\" fill=\"#ffffff\"/>\n      <line x1=\"0\" y1=\"-21\" x2=\"0\" y2=\"2\"/>\n      <line x1=\"0\" y1=\"-14\" x2=\"-12\" y2=\"-8\"/>\n      <line x1=\"0\" y1=\"-14\" x2=\"14\" y2=\"-20\"/>\n      <line x1=\"0\" y1=\"2\" x2=\"-8\" y2=\"18\"/>\n      <line x1=\"0\" y1=\"2\" x2=\"9\" y2=\"18\"/>\n      <!-- 창 -->\n      <line x1=\"14\" y1=\"-28\" x2=\"14\" y2=\"2\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <polygon points=\"14,-28 11,-22 17,-22\" fill=\"#1FA34A\" stroke=\"none\"/>\n    </g>\n    <!-- 잡힌 사냥감 (누움) -->\n    <g transform=\"translate(126, 76)\" stroke=\"#1FA34A\" stroke-width=\"1.2\" fill=\"none\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"11\" ry=\"5\"/>\n      <circle cx=\"-11\" cy=\"-2\" r=\"3\"/>\n      <line x1=\"-5\" y1=\"5\" x2=\"-5\" y2=\"9\"/><line x1=\"4\" y1=\"5\" x2=\"4\" y2=\"9\"/>\n    </g>\n    <text x=\"83\" y=\"92\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">지능 ↑ — 적은 노력으로 사냥</text>\n    <text x=\"83\" y=\"106\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">efficient hunters</text>\n  </g>\n\n  <!-- ③ 풍요 · 여유 (C) -->\n  <g transform=\"translate(404, 42)\">\n    <rect x=\"0\" y=\"0\" width=\"166\" height=\"118\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <rect x=\"0\" y=\"0\" width=\"166\" height=\"18\" rx=\"6\" fill=\"#e3f5ea\"/>\n    <rect x=\"0\" y=\"9\" width=\"166\" height=\"9\" fill=\"#e3f5ea\"/>\n    <text x=\"83\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">③ 풍요 · 여유 (C)</text>\n    <!-- 해 -->\n    <circle cx=\"30\" cy=\"36\" r=\"7\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n    <g stroke=\"#1FA34A\" stroke-width=\"0.9\"><line x1=\"30\" y1=\"25\" x2=\"30\" y2=\"21\"/><line x1=\"19\" y1=\"36\" x2=\"15\" y2=\"36\"/><line x1=\"41\" y1=\"36\" x2=\"45\" y2=\"36\"/></g>\n    <!-- 쉬는 사람 (기댄 자세) -->\n    <g transform=\"translate(74, 80)\" stroke=\"#1a1a1a\" stroke-width=\"1.5\" fill=\"none\">\n      <line x1=\"-26\" y1=\"0\" x2=\"40\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <circle cx=\"-14\" cy=\"-22\" r=\"7\" fill=\"#ffffff\"/>\n      <line x1=\"-9\" y1=\"-17\" x2=\"14\" y2=\"-2\"/>\n      <path d=\"M -14 -15 Q -22 -10 -18 -2\" />\n      <path d=\"M -14 -15 Q -6 -12 -2 -6\" />\n      <line x1=\"14\" y1=\"-2\" x2=\"34\" y2=\"-2\"/>\n      <line x1=\"24\" y1=\"-2\" x2=\"30\" y2=\"-10\"/>\n    </g>\n    <text x=\"83\" y=\"92\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">여유 시간 (time on hands)</text>\n    <text x=\"83\" y=\"106\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">affluence · leisure</text>\n  </g>\n\n  <!-- 진행 화살표 -->\n  <g stroke=\"#1a1a1a\" stroke-width=\"1.6\" fill=\"#1a1a1a\">\n    <line x1=\"198\" y1=\"101\" x2=\"215\" y2=\"101\"/><polygon points=\"215,101 207,97 207,105\"/>\n    <line x1=\"385\" y1=\"101\" x2=\"402\" y2=\"101\"/><polygon points=\"402,101 394,97 394,105\"/>\n  </g>\n\n  <!-- 순서 strip -->\n  <rect x=\"40\" y=\"176\" width=\"520\" height=\"62\" rx=\"6\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n  <text x=\"58\" y=\"200\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1a1a1a\">단락 순서: 주어진 글 → (B) → (A) → (C)</text>\n  <text x=\"58\" y=\"222\" font-family=\"Noto Serif\" font-size=\"9\" fill=\"#5e5e5e\">주어진글 · B(생존·휴식) → A(<tspan font-style=\"italic\">This was also true</tspan> → 진화) → C(prosperity → 여유)</text>\n</svg>", "caption": "쉴 틈 없이 먹이를 쫓던 들판 풍경이, 두뇌로 사냥을 효율화한 뒤 한가로이 쉬는 풍요로운 풍경으로 바뀌는 그림.", "tldr": ["대부분의 동물은 먹이·체온·포식자 회피·번식에 <span style=\"color:#c8102e;font-weight:700\">모든 에너지</span>를 써요 — 남는 시간은 쉬거나 잠.", "초기 인간 조상도 마찬가지였지만, <span style=\"color:#1FA34A;font-weight:700\">효율적 사냥꾼으로 진화</span>하며 상황이 달라졌어요.", "비결은 <span style=\"color:#1FA34A;font-weight:700\">지능 발달(근육이 아닌 두뇌)</span> — 사냥 시대 끝엔 이미 어느 정도의 풍요와 여유 시간을 누렸죠."], "analogy": "온종일 손빨래만 하던 시절엔 쉴 틈이 없었지만, 세탁기가 생기자 그 시간에 책도 읽고 산책도 하게 됐죠. ‘두뇌라는 도구’가 인류에게 그런 세탁기 역할을 한 거예요.", "bg": "분야는 인류학·진화예요. ‘struggle for survival(생존 투쟁)’에서 ‘affluence(풍요)’로의 이동이 축이고, ‘brains, not muscle(근육이 아닌 두뇌)’이 전환의 열쇠. → ‘동물 = 여유 없음’이라는 일반 명제가 인간 조상의 예외(진화)로 어떻게 뒤집히는지, 순서 흐름을 따라가며 읽으세요.", "flow": [{"kind": "도입", "t": "대부분 동물: 생존 투쟁이 모든 시간·에너지를 차지"}, {"kind": "부연(B)", "t": "남는 시간은 쉬거나 잠 — 놀이는 어린 동물만 가능"}, {"kind": "전환(A)", "t": "인간 조상도 그랬으나 — <span style=\"color:#1FA34A;font-weight:700\">효율적 사냥꾼으로 진화</span> → 상황 변화"}, {"kind": "귀결(A)", "t": "지능 발달(두뇌>완력) → 사냥 시대 끝엔 이미 <span style=\"color:#1FA34A;font-weight:700\">풍요</span>"}, {"kind": "결말(C)", "t": "먹잇감 풍부 + 기술 발전 → 번영 → 여유 시간 확보"}], "vocab": [["struggle", "고투·투쟁"], ["take up", "차지하다·잡아먹다"], ["predator", "포식자"], ["reproduce", "번식하다"], ["use up", "다 써 버리다·소모하다"], ["spare", "여분의·남는"], ["surplus", "잉여·여분"], ["ancestor", "조상"], ["constant", "끊임없는"], ["evolve", "진화하다"], ["efficient", "효율적인"], ["intelligence", "지능"], ["brawn", "근력·완력"], ["prey", "먹잇감"], ["affluence", "풍부함·부유함"], ["plentiful", "풍부한"], ["prosperity", "번영"], ["on one’s hands", "(처리해야 할) 수중에·남아도는"]], "quiz": [["동물 대부분이 ‘여유 시간’이 없는 이유는?", "먹이·체온 유지·포식자 회피·번식 같은 <b>생존 투쟁이 모든 시간과 에너지를 소모</b>하기 때문이에요."], ["인간 조상이 풍요에 이른 결정적 비결은?", "<b>지능의 발달</b>이에요 — 근육이 아니라 두뇌로 사냥을 효율화해 여유 시간을 확보했죠."]], "en": "For most animals the struggle to survive takes up all their time. Finding food and drink, keeping warm and clean, avoiding predators, migrating and reproducing use up all their energies. If they do have any time to spare, they spend it resting or sleeping. Only very young animals, under the protection of their parents, have enough surplus energy to engage in lively bouts of play. This was also true for our early ancestors. The constant search for food would have put heavy demands upon them. But as they slowly evolved into more and more efficient hunters, the situation changed. The secret of their success was the development of much greater intelligence. They used brain not brawn to kill their prey. At the end of the long hunting era, before they turned to farming, they were already enjoying some degree of affluence. In certain regions, at particular times of year, the prey was sufficiently plentiful and their hunting techniques sufficiently advanced for them to experience a remarkable degree of prosperity. They had time on their hands.", "ko": "대부분의 동물들에게 생존하기 위한 고투는 그들의 모든 시간을 차지한다. 먹이와 마실 것을 찾는 것, 체온과 청결함을 유지하는 것, 포식자를 피하는 것, 이동하는 것과 번식하는 것은 그들의 모든 에너지를 소모한다. 만약 그들이 아낀 시간이 조금이라도 있다면, 그들은 그것을 쉬거나 잠자는 데에 쓴다. 아주 어린 동물들만이, 그들 부모의 보호 아래에서, 활기찬 놀이의 한 차례들에 참여할 수 있을 만큼 충분한 잉여 에너지를 가지고 있다. 이는 우리의 초기 조상들에게도 또한 사실이었다. 끊임없는 식량 찾기는 그들에게 큰 부담을 주었을 것이다. 그러나 그들이 점점 더 효율적인 사냥꾼으로 서서히 진화함에 따라, 상황은 달라졌다. 그들의 성공 비결은 훨씬 더 뛰어난 지능의 발달이었다. 그들은 그들의 먹잇감을 죽이기 위해 근육이 아니라 두뇌를 사용했다. 오랜 사냥 시대 끝에서, 그들이 농경으로 전환하기 전, 그들은 이미 어느 정도의 풍부함을 누리고 있는 중이었다. 특정 지역들에서는, 한 해의 특정 시기에, 먹잇감은 충분히 풍부했고 그들의 사냥 기술들이 충분히 발전해서 그들이 놀라울 정도의 번영을 경험했다. 그들은 여유 시간이 있었다.", "read": [{"en": "For most animals the struggle to survive takes up all their time.", "ko": "대부분의 동물들에게 생존하기 위한 고투는 그들의 모든 시간을 차지한다.", "chunks": [["For most animals", "대부분의 동물들에게"], ["the struggle to survive", "생존하기 위한 고투는"], ["takes up all their time.", "그들의 모든 시간을 차지한다."]]}, {"en": "Finding food and drink, keeping warm and clean, avoiding predators, migrating and reproducing use up all their energies.", "ko": "먹이와 마실 것을 찾는 것, 체온과 청결함을 유지하는 것, 포식자를 피하는 것, 이동하는 것과 번식하는 것은 그들의 모든 에너지를 소모한다.", "chunks": [["Finding food and drink, keeping warm and clean,", "먹이와 마실 것을 찾는 것, 체온과 청결함을 유지하는 것,"], ["avoiding predators, migrating and reproducing", "포식자를 피하는 것, 이동하는 것과 번식하는 것은"], ["use up all their energies.", "그들의 모든 에너지를 소모한다."]]}, {"en": "If they do have any time to spare, they spend it resting or sleeping.", "ko": "만약 그들이 아낀 시간이 조금이라도 있다면, 그들은 그것을 쉬거나 잠자는 데에 쓴다.", "chunks": [["If they do have any time to spare,", "만약 그들이 아낄 시간이 조금이라도 있다면,"], ["they spend it resting or sleeping.", "그들은 그것을 쉬거나 잠자는 데에 쓴다."]]}, {"en": "Only very young animals, under the protection of their parents, have enough surplus energy to engage in lively bouts of play.", "ko": "아주 어린 동물들만이, 그들 부모의 보호 아래에서, 활기찬 놀이의 한 차례들에 참여할 수 있을 만큼 충분한 잉여 에너지를 가지고 있다.", "chunks": [["Only very young animals,", "아주 어린 동물들만이,"], ["under the protection of their parents,", "그들 부모의 보호 아래에서,"], ["have enough surplus energy", "충분한 잉여 에너지를 가지고 있다"], ["to engage in lively bouts of play.", "활기찬 놀이의 한 차례들에 참여할 수 있을 만큼."]]}, {"en": "This was also true for our early ancestors.", "ko": "이는 우리의 초기 조상들에게도 또한 사실이었다.", "chunks": [["This was also true", "이는 또한 사실이었다"], ["for our early ancestors.", "우리의 초기 조상들에게도."]]}, {"en": "The constant search for food would have put heavy demands upon them.", "ko": "끊임없는 식량 찾기는 그들에게 큰 부담을 주었을 것이다.", "chunks": [["The constant search for food", "끊임없는 식량 찾기는"], ["would have put heavy demands upon them.", "그들에게 큰 부담을 주었을 것이다."]]}, {"en": "But as they slowly evolved into more and more efficient hunters, the situation changed.", "ko": "그러나 그들이 점점 더 효율적인 사냥꾼으로 서서히 진화함에 따라, 상황은 달라졌다.", "chunks": [["But as they slowly evolved", "그러나 그들이 서서히 진화함에 따라"], ["into more and more efficient hunters,", "점점 더 효율적인 사냥꾼으로,"], ["the situation changed.", "상황은 달라졌다."]]}, {"en": "The secret of their success was the development of much greater intelligence.", "ko": "그들의 성공 비결은 훨씬 더 뛰어난 지능의 발달이었다.", "chunks": [["The secret of their success", "그들의 성공 비결은"], ["was the development of much greater intelligence.", "훨씬 더 뛰어난 지능의 발달이었다."]]}, {"en": "They used brain not brawn to kill their prey.", "ko": "그들은 그들의 먹잇감을 죽이기 위해 근육이 아니라 두뇌를 사용했다.", "chunks": [["They used brain not brawn", "그들은 근육이 아니라 두뇌를 사용했다"], ["to kill their prey.", "그들의 먹잇감을 죽이기 위해."]]}, {"en": "At the end of the long hunting era, before they turned to farming, they were already enjoying some degree of affluence.", "ko": "오랜 사냥 시대 끝에서, 그들이 농경으로 전환하기 전, 그들은 이미 어느 정도의 풍부함을 누리고 있는 중이었다.", "chunks": [["At the end of the long hunting era,", "오랜 사냥 시대 끝에서,"], ["before they turned to farming,", "그들이 농경으로 전환하기 전,"], ["they were already enjoying some degree of affluence.", "그들은 이미 어느 정도의 풍부함을 누리고 있는 중이었다."]]}, {"en": "In certain regions, at particular times of year, the prey was sufficiently plentiful and their hunting techniques sufficiently advanced for them to experience a remarkable degree of prosperity.", "ko": "특정 지역들에서는, 한 해의 특정 시기에, 먹잇감은 충분히 풍부했고 그들의 사냥 기술들이 충분히 발전해서 그들이 놀라울 정도의 번영을 경험했다.", "chunks": [["In certain regions, at particular times of year,", "특정 지역들에서는, 한 해의 특정 시기에,"], ["the prey was sufficiently plentiful", "먹잇감은 충분히 풍부했고"], ["and their hunting techniques sufficiently advanced", "그들의 사냥 기술들이 충분히 발전해서"], ["for them to experience a remarkable degree of prosperity.", "그들이 놀라울 정도의 번영을 경험할 정도로."]]}, {"en": "They had time on their hands.", "ko": "그들은 여유 시간이 있었다.", "chunks": [["They had time on their hands.", "그들은 여유 시간이 있었다."]]}]}, {"no": "no.37", "title": "The Freeze Response and Language", "ktitle": "얼어붙는 몸, 멈추는 말", "field": "심리 · 신경과학", "page": "2026 6월 학평 · no.37 (글의 순서)", "oneline": "놀라면 몸이 굳고 <span style=\"color:#c8102e;font-weight:700\">언어가 억제</span>돼요(소리로 위치 노출 방지) — 위협이 지나면 회복되지만, <span style=\"color:#c8102e;font-weight:700\">만성적 공포</span>는 만성 스트레스·정신 질환을 부릅니다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"놀란 사람이 몸이 굳고 입이 봉인되는 동결 반응을 보인 뒤, 위쪽 갈래에서는 위협이 지나가 얼음이 녹고 다시 말할 수 있게 회복되지만, 아래쪽 갈래에서는 금이 간 얼음 속에 갇힌 채 만성 공포와 정신 질환으로 이어짐을 보여 주는 분기 그림\">\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">The Freeze Response — 동결 → 회복 / 만성화 두 갈래</text>\n\n  <!-- 놀람 + 동결 인물 (좌) -->\n  <text x=\"95\" y=\"48\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">놀람 → 동결(freeze)</text>\n  <!-- 번개(놀람) -->\n  <polygon points=\"58,58 70,58 63,70 73,70 56,90 62,76 52,76\" fill=\"#1a1a1a\"/>\n  <!-- 동결 인물 (경직) -->\n  <g transform=\"translate(110,108)\" stroke=\"#1a1a1a\" stroke-width=\"1.6\" fill=\"none\">\n    <circle cx=\"0\" cy=\"-30\" r=\"8\" fill=\"#ffffff\"/>\n    <circle cx=\"-3\" cy=\"-31\" r=\"1.1\" fill=\"#1a1a1a\"/><circle cx=\"3\" cy=\"-31\" r=\"1.1\" fill=\"#1a1a1a\"/>\n    <line x1=\"-4\" y1=\"-24\" x2=\"4\" y2=\"-24\"/>\n    <line x1=\"0\" y1=\"-22\" x2=\"0\" y2=\"6\"/>\n    <line x1=\"0\" y1=\"-16\" x2=\"-7\" y2=\"2\"/>\n    <line x1=\"0\" y1=\"-16\" x2=\"7\" y2=\"2\"/>\n    <line x1=\"0\" y1=\"6\" x2=\"-5\" y2=\"24\"/>\n    <line x1=\"0\" y1=\"6\" x2=\"5\" y2=\"24\"/>\n  </g>\n  <!-- 얼음 결정 -->\n  <g stroke=\"#999\" stroke-width=\"1\">\n    <g transform=\"translate(84,80)\"><line x1=\"-4\" y1=\"0\" x2=\"4\" y2=\"0\"/><line x1=\"0\" y1=\"-4\" x2=\"0\" y2=\"4\"/><line x1=\"-3\" y1=\"-3\" x2=\"3\" y2=\"3\"/><line x1=\"-3\" y1=\"3\" x2=\"3\" y2=\"-3\"/></g>\n    <g transform=\"translate(138,90)\"><line x1=\"-4\" y1=\"0\" x2=\"4\" y2=\"0\"/><line x1=\"0\" y1=\"-4\" x2=\"0\" y2=\"4\"/><line x1=\"-3\" y1=\"-3\" x2=\"3\" y2=\"3\"/><line x1=\"-3\" y1=\"3\" x2=\"3\" y2=\"-3\"/></g>\n    <g transform=\"translate(92,124)\"><line x1=\"-3\" y1=\"0\" x2=\"3\" y2=\"0\"/><line x1=\"0\" y1=\"-3\" x2=\"0\" y2=\"3\"/><line x1=\"-2\" y1=\"-2\" x2=\"2\" y2=\"2\"/><line x1=\"-2\" y1=\"2\" x2=\"2\" y2=\"-2\"/></g>\n  </g>\n  <text x=\"95\" y=\"150\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">입 봉인 — 언어 억제 (적응적)</text>\n\n  <!-- 분기 화살표 -->\n  <g fill=\"none\">\n    <path d=\"M 168 104 Q 240 92 296 74\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <polygon points=\"296,74 287,75 290,82\" fill=\"#1FA34A\"/>\n    <path d=\"M 168 120 Q 240 150 296 184\" stroke=\"#c8102e\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n    <polygon points=\"296,184 287,179 285,187\" fill=\"#c8102e\"/>\n  </g>\n\n  <!-- 위 갈래: 회복 (초록 실선) -->\n  <g transform=\"translate(300, 44)\">\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"68\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"135\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">위협이 지나감 → 회복 (정상)</text>\n    <!-- 녹은(이완) 인물 -->\n    <g transform=\"translate(40, 52)\" stroke=\"#1FA34A\" stroke-width=\"1.5\" fill=\"none\">\n      <circle cx=\"0\" cy=\"-26\" r=\"7\" fill=\"#ffffff\"/>\n      <circle cx=\"0\" cy=\"-23\" r=\"2\" fill=\"#ffffff\"/>\n      <line x1=\"0\" y1=\"-19\" x2=\"0\" y2=\"2\"/>\n      <line x1=\"0\" y1=\"-13\" x2=\"-11\" y2=\"-18\"/>\n      <line x1=\"0\" y1=\"-13\" x2=\"11\" y2=\"-18\"/>\n      <line x1=\"0\" y1=\"2\" x2=\"-8\" y2=\"16\"/>\n      <line x1=\"0\" y1=\"2\" x2=\"8\" y2=\"16\"/>\n    </g>\n    <!-- 말풍선(언어 회복) -->\n    <g transform=\"translate(64, 26)\" stroke=\"#1FA34A\" stroke-width=\"1.2\" fill=\"#ffffff\">\n      <rect x=\"0\" y=\"0\" width=\"22\" height=\"14\" rx=\"4\"/>\n      <polygon points=\"6,14 6,20 12,14\" stroke=\"none\" fill=\"#1FA34A\"/>\n      <line x1=\"4\" y1=\"5\" x2=\"18\" y2=\"5\" stroke-width=\"0.9\"/><line x1=\"4\" y1=\"9\" x2=\"14\" y2=\"9\" stroke-width=\"0.9\"/>\n    </g>\n    <text x=\"150\" y=\"44\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#1a1a1a\">얼음 녹음 · 다시 말할 수 있음</text>\n    <text x=\"150\" y=\"59\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#5e5e5e\">threat passes → recovery</text>\n  </g>\n\n  <!-- 아래 갈래: 만성화 (빨강 점선) -->\n  <g transform=\"translate(300, 152)\">\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"68\" rx=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"5 3\"/>\n    <text x=\"135\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">회복 못 함 · 만성 공포</text>\n    <!-- 금 간 얼음 블록 속 인물 -->\n    <g transform=\"translate(40, 50)\">\n      <rect x=\"-22\" y=\"-32\" width=\"44\" height=\"48\" rx=\"2\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <polyline points=\"-22,-14 -8,-6 -14,4 0,12 -6,16\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      <polyline points=\"6,-32 12,-18 4,-8 14,2 8,16\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n      <g stroke=\"#c8102e\" stroke-width=\"1.4\" fill=\"none\">\n        <circle cx=\"-4\" cy=\"-20\" r=\"5\" fill=\"#ffffff\"/>\n        <line x1=\"-4\" y1=\"-15\" x2=\"-4\" y2=\"0\"/>\n        <line x1=\"-4\" y1=\"-11\" x2=\"-11\" y2=\"-5\"/><line x1=\"-4\" y1=\"-11\" x2=\"3\" y2=\"-5\"/>\n        <line x1=\"-4\" y1=\"0\" x2=\"-9\" y2=\"12\"/><line x1=\"-4\" y1=\"0\" x2=\"1\" y2=\"12\"/>\n      </g>\n    </g>\n    <text x=\"150\" y=\"44\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#c8102e\" font-weight=\"700\">→ 만성 스트레스 · 정신 질환</text>\n    <text x=\"150\" y=\"59\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#5e5e5e\">chronic fear → mental illness</text>\n  </g>\n\n  <!-- 순서 strip -->\n  <rect x=\"40\" y=\"232\" width=\"520\" height=\"32\" rx=\"5\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n  <text x=\"58\" y=\"252\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1a1a1a\">단락 순서: 주어진 글 → C(동결의 기능) → B(자연선택·회복) → A(But 만성화 반전)</text>\n</svg>", "caption": "위협 앞에서 입에 자물쇠가 채워지듯 굳어 버린 사람, 위협이 지나가자 자물쇠가 풀려 다시 말문이 트이는 두 장면의 대조.", "tldr": ["깜짝 놀란 순간 — 정지·동결·호흡 멈춤. 이는 <span style=\"color:#1FA34A;font-weight:700\">탐지를 피하고 위험을 파악</span>하려는 반응이에요.", "언어가 정교해도 <span style=\"color:#c8102e;font-weight:700\">소리는 위치를 노출</span>하죠 → 그래서 동결 반응이 언어를 억제해요(자연 선택이 보존한 규칙).", "위협이 지나면 회복되지만, <span style=\"color:#c8102e;font-weight:700\">결코 긴장을 못 풀면</span> 뇌가 지속적 공포 상태 → 만성 스트레스·정신 질환으로 이어져요."], "analogy": "숨바꼭질에서 들킬까 봐 숨을 죽이고 꼼짝 안 하죠. 몸이 자동으로 ‘조용·정지’ 모드에 들어가는 거예요. 문제는 술래가 영영 안 떠나는 상황 — 그 긴장이 안 풀리면 몸이 고장 나기 시작해요.", "bg": "분야는 신경과학·심리예요. ‘freeze response(동결 반응)’는 위협 앞에서 굳는 자동 반응(fight·flight와 한 묶음), ‘suppression of language(언어 억제)’가 핵심 연결. → 동결 반응의 ‘이로운 기능’이 먼저 나오고, ‘But what if’에서 만성화의 위험으로 꺾이는 구조를 잡으며 읽으세요.", "flow": [{"kind": "도입", "t": "놀랐던 순간 회상 — 정지·동결·호흡 정지 반응"}, {"kind": "기능(C)", "t": "탐지 회피·위험 파악·전투/도주 능력을 극대화"}, {"kind": "전환(C→B)", "t": "언어가 정교해도 <span style=\"color:#c8102e;font-weight:700\">소리가 위치 노출</span> → 동결 반응 = 언어 억제"}, {"kind": "배경(B)", "t": "자연 선택: 언어 촉진 + 동결 규칙 보존 → 위협 지나면 회복"}, {"kind": "반전(A)", "t": "But what if 회복 못 함? 뇌가 <span style=\"color:#c8102e;font-weight:700\">지속적 공포 상태</span>"}, {"kind": "결말(A)", "t": "신경망 발달·통합 방해 → 만성 스트레스·정신 질환"}], "vocab": [["startled", "깜짝 놀란"], ["freeze", "얼어붙다·굳다"], ["scan", "살피다·훑어보다"], ["threat", "위협"], ["maximize", "최대화하다"], ["detection", "탐지·발각"], ["flee", "도망치다"], ["sophisticated", "정교한"], ["give away", "드러내다·노출하다"], ["inhibition", "억제"], ["traumatic", "외상적인·정신적 충격의"], ["natural selection", "자연 선택"], ["promote", "촉진하다"], ["conserve", "보존하다"], ["interference", "방해·간섭"], ["integration", "통합"], ["chronic", "만성적인"]], "quiz": [["놀랐을 때 ‘언어가 억제되는’ 이유는?", "<b>소리가 포식자에게 위치를 노출</b>하기 때문이에요. 동결 반응이 소리(언어)를 눌러 탐지를 피하게 해요."], ["동결 반응이 ‘해로워지는’ 경우는?", "위협이 지나도 <b>긴장을 풀지 못하고 뇌가 지속적 공포 상태</b>에 머물 때예요 — 만성 스트레스·정신 질환으로 이어지죠."]], "en": "Think about a time when you were startled. Did you come to a sudden stop, freeze all your movements, and hold your breath as you scanned the environment for a threat? All these responses maximize our ability to avoid detection, locate the source of possible danger, and prepare to fight or flee. As sophisticated as language has become, it is still the creation of sound that might give away our location to a potential predator. Because of this, the freeze response results in the inhibition of language in highly stressful and traumatic situations. Natural selection promoted the evolution of language but conserved the freeze rule. When the threat passes, we begin to relax and find our voices again, perhaps even to laugh at our own reactions. But what if we can never relax? What if our experiences shape our brain to be in a constant state of fear? This interference with the proper development and integration of neural networks can result in chronic stress and even mental illness.", "ko": "당신이 깜짝 놀랐던 한 순간에 대해 생각해 보라. 당신은 위협에 대해 주변 환경을 살피는 동안 갑자기 정지하고, 당신의 모든 움직임들을 멈추고, 그리고 당신의 숨을 참았는가? 이러한 모든 반응들은 탐지를 피하고, 잠재적 위험의 근원을 찾아내며, 싸우거나 도망칠 준비를 하는 우리의 능력을 최대화한다. 언어가 아무리 정교해졌다고 해도, 잠재적인 포식자에게 우리의 위치를 드러낼지도 모르는 것은 바로 여전히 소리의 생성이다. 이것 때문에, 동결 반응은 매우 스트레스가 크고 외상적인 상황들에서 언어의 억제를 초래한다. 자연 선택은 언어의 진화를 촉진했지만 동결 규칙은 보존했다. 그 위협이 지나갈 때, 우리는 긴장을 풀기 시작하고 다시 우리의 목소리들을 찾으며, 아마도 심지어 우리 자신의 반응들에 웃기까지 한다. 그러나 만약 우리가 결코 긴장을 풀 수 없다면 어떨까? 우리의 경험이 뇌를 지속적인 공포 상태에 있도록 만든다면 어떨까? 신경망의 적절한 발달과 통합에 대한 이러한 방해는 만성적인 스트레스와 심지어 정신 질환을 초래할 수 있다.", "read": [{"en": "Think about a time when you were startled.", "ko": "당신이 깜짝 놀랐던 한 순간에 대해 생각해 보라.", "chunks": [["Think about a time", "한 순간에 대해 생각해 보라"], ["when you were startled.", "당신이 깜짝 놀랐던."]]}, {"en": "Did you come to a sudden stop, freeze all your movements, and hold your breath as you scanned the environment for a threat?", "ko": "당신은 위협에 대해 주변 환경을 살피는 동안 갑자기 정지하고, 당신의 모든 움직임들을 멈추고, 그리고 당신의 숨을 참았는가?", "chunks": [["Did you come to a sudden stop,", "당신은 갑자기 정지하고,"], ["freeze all your movements,", "당신의 모든 움직임들을 멈추고,"], ["and hold your breath", "그리고 당신의 숨을 참았는가"], ["as you scanned the environment for a threat?", "위협에 대해 주변 환경을 살피는 동안?"]]}, {"en": "All these responses maximize our ability to avoid detection, locate the source of possible danger, and prepare to fight or flee.", "ko": "이러한 모든 반응들은 탐지를 피하고, 잠재적 위험의 근원을 찾아내며, 싸우거나 도망칠 준비를 하는 우리의 능력을 최대화한다.", "chunks": [["All these responses maximize our ability", "이러한 모든 반응들은 우리의 능력을 최대화한다"], ["to avoid detection, locate the source of possible danger,", "탐지를 피하고, 잠재적 위험의 근원을 찾아내며,"], ["and prepare to fight or flee.", "그리고 싸우거나 도망칠 준비를 하는."]]}, {"en": "As sophisticated as language has become, it is still the creation of sound that might give away our location to a potential predator.", "ko": "언어가 아무리 정교해졌다고 해도, 잠재적인 포식자에게 우리의 위치를 드러낼지도 모르는 것은 바로 여전히 소리의 생성이다.", "chunks": [["As sophisticated as language has become,", "언어가 아무리 정교해졌다고 해도,"], ["it is still the creation of sound", "바로 여전히 소리의 생성이다"], ["that might give away our location", "우리의 위치를 드러낼지도 모르는 것은"], ["to a potential predator.", "잠재적인 포식자에게."]]}, {"en": "Because of this, the freeze response results in the inhibition of language in highly stressful and traumatic situations.", "ko": "이것 때문에, 동결 반응은 매우 스트레스가 크고 외상적인 상황들에서 언어의 억제를 초래한다.", "chunks": [["Because of this,", "이것 때문에,"], ["the freeze response results in the inhibition of language", "동결 반응은 언어의 억제를 초래한다"], ["in highly stressful and traumatic situations.", "매우 스트레스가 크고 외상적인 상황들에서."]]}, {"en": "Natural selection promoted the evolution of language but conserved the freeze rule.", "ko": "자연 선택은 언어의 진화를 촉진했지만 동결 규칙은 보존했다.", "chunks": [["Natural selection promoted the evolution of language", "자연 선택은 언어의 진화를 촉진했지만"], ["but conserved the freeze rule.", "동결 규칙은 보존했다."]]}, {"en": "When the threat passes, we begin to relax and find our voices again, perhaps even to laugh at our own reactions.", "ko": "그 위협이 지나갈 때, 우리는 긴장을 풀기 시작하고 다시 우리의 목소리들을 찾으며, 아마도 심지어 우리 자신의 반응들에 웃기까지 한다.", "chunks": [["When the threat passes,", "그 위협이 지나갈 때,"], ["we begin to relax and find our voices again,", "우리는 긴장을 풀기 시작하고 다시 우리의 목소리들을 찾으며,"], ["perhaps even to laugh at our own reactions.", "아마도 심지어 우리 자신의 반응들에 웃기까지 한다."]]}, {"en": "But what if we can never relax?", "ko": "그러나 만약 우리가 결코 긴장을 풀 수 없다면 어떨까?", "chunks": [["But what if we can never relax?", "그러나 만약 우리가 결코 긴장을 풀 수 없다면 어떨까?"]]}, {"en": "What if our experiences shape our brain to be in a constant state of fear?", "ko": "우리의 경험이 뇌를 지속적인 공포 상태에 있도록 만든다면 어떨까?", "chunks": [["What if our experiences", "우리의 경험이 ~한다면 어떨까"], ["shape our brain to be", "뇌를 ~에 있도록 만든다면"], ["in a constant state of fear?", "지속적인 공포 상태에."]]}, {"en": "This interference with the proper development and integration of neural networks can result in chronic stress and even mental illness.", "ko": "신경망의 적절한 발달과 통합에 대한 이러한 방해는 만성적인 스트레스와 심지어 정신 질환을 초래할 수 있다.", "chunks": [["This interference", "이러한 방해는"], ["with the proper development and integration of neural networks", "신경망의 적절한 발달과 통합에 대한"], ["can result in chronic stress and even mental illness.", "만성적인 스트레스와 심지어 정신 질환을 초래할 수 있다."]]}]}, {"no": "no.38", "title": "Video Games and Empathy", "ktitle": "폭력 게임이 공감을 무디게 한다", "field": "심리 · 미디어", "page": "2026 6월 학평 · no.38 (문장 삽입)", "oneline": "폭력적 비디오 게임에 반복 노출 → 정상 정서 반응이 무뎌짐(<span style=\"color:#c8102e;font-weight:700\">탈감각</span>) → 정서 반응 감소 → <span style=\"color:#c8102e;font-weight:700\">공감 저하</span>로 이어집니다.", "metaphor": "<svg viewBox=\"0 0 600 256\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"폭력적 비디오 게임에 반복 노출되면 정상 정서 반응이 무뎌지는 탈감각이 일어나고 정서 반응이 감소해 공감이 저하되는, 점점 낮아지는 세 단계 막대 그림\">\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Video Games and Empathy — 반복 노출 → 탈감각 → 공감 저하</text>\n\n  <!-- y축 라벨 -->\n  <text x=\"22\" y=\"120\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" fill=\"#5e5e5e\" transform=\"rotate(-90 22 120)\" text-anchor=\"middle\">정서 반응 · 공감</text>\n  <line x1=\"46\" y1=\"56\" x2=\"46\" y2=\"196\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"46\" y1=\"196\" x2=\"566\" y2=\"196\" stroke=\"#999\" stroke-width=\"1\"/>\n\n  <!-- 3 막대 (하강) -->\n  <!-- 1 정상 -->\n  <rect x=\"78\" y=\"68\" width=\"120\" height=\"128\" fill=\"#1a1a1a\"/>\n  <text x=\"138\" y=\"60\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1a1a1a\">정상 반응</text>\n  <text x=\"138\" y=\"120\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">폭력 목격</text>\n  <text x=\"138\" y=\"138\" font-family=\"Noto Serif KR\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#ffffff\">부정 감정·생리 각성</text>\n  <text x=\"138\" y=\"212\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">① 정상 정서 반응</text>\n  <!-- 2 탈감각 (삽입⑤) -->\n  <rect x=\"240\" y=\"108\" width=\"120\" height=\"88\" fill=\"#c8102e\"/>\n  <text x=\"300\" y=\"100\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">반복 노출</text>\n  <text x=\"300\" y=\"142\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">무뎌짐</text>\n  <text x=\"300\" y=\"159\" font-family=\"Noto Serif\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#ffffff\">desensitization</text>\n  <text x=\"300\" y=\"212\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">② 탈감각 (삽입 ⑤)</text>\n  <!-- 3 공감 저하 -->\n  <rect x=\"402\" y=\"146\" width=\"120\" height=\"50\" fill=\"#c8102e\" fill-opacity=\"0.55\"/>\n  <text x=\"462\" y=\"138\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">정서 반응 ↓</text>\n  <text x=\"462\" y=\"172\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">공감 저하</text>\n  <text x=\"462\" y=\"212\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">③ 공감 능력 감소</text>\n\n  <!-- 하강 추세선 (빨강) -->\n  <polyline points=\"138,68 300,108 462,146\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"/>\n  <polygon points=\"462,146 456,138 467,140\" fill=\"#c8102e\"/>\n\n  <!-- 삽입 위치 태그 -->\n  <rect x=\"246\" y=\"226\" width=\"108\" height=\"20\" rx=\"10\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif KR\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">주어진 문장 = ⑤</text>\n</svg>", "caption": "처음엔 또렷하던 ‘놀람·혐오’ 감정 신호가, 같은 폭력 장면이 반복될수록 점점 흐릿해져 무덤덤해지는 그림.", "tldr": ["비디오 게임은 공감 측면에서 <span style=\"color:#1FA34A;font-weight:700\">가장 많이 연구된 기술</span> 중 하나예요(폭력 게임 우려로 연구 축적).", "폭력을 목격할 때 부정적 감정·생리적 각성을 느끼는 건 <span style=\"color:#1FA34A;font-weight:700\">정상 반응</span> — 그런데 반복 노출되면 그 반응이 무뎌져요(<span style=\"color:#c8102e;font-weight:700\">탈감각</span>).", "다음 단계는 <span style=\"color:#c8102e;font-weight:700\">정서 반응 감소 → 공감 능력 저하</span> — 다수 연구가 그 연관성을 입증해요."], "analogy": "공포 영화도 처음엔 소름 끼치지만 열 번 보면 무덤덤해지죠. 자극이 반복되면 감각이 닳아요. 문제는 그 닳음이 ‘남의 아픔에 반응하는 능력’까지 깎아낸다는 점이에요.", "bg": "분야는 미디어심리예요. ‘desensitization(탈감각)’이 핵심어 — 반복 자극으로 정상 반응이 둔해지는 현상이에요. ‘empathy(공감)’가 그 종착점. → ‘정상 반응 → 반복 노출 → 탈감각 → 공감 저하’라는 단계 사슬에서, 삽입 문장이 어느 칸을 메우는지 보며 읽으세요.", "flow": [{"kind": "도입", "t": "비디오 게임 = 공감 측면 최다 연구, 폭력 게임 우려로 연구 축적"}, {"kind": "전개", "t": "과학자들이 게임이 공감에 영향을 주는 방식을 설명"}, {"kind": "메커니즘 ①", "t": "폭력 목격 시 부정적 감정·생리적 각성 = <span style=\"color:#1FA34A;font-weight:700\">정상 반응</span>"}, {"kind": "삽입", "t": "반복 노출 → 정상 반응이 무뎌짐 = <span style=\"color:#c8102e;font-weight:700\">탈감각</span>"}, {"kind": "귀결", "t": "다음 단계 = 정서 반응 감소 → <span style=\"color:#c8102e;font-weight:700\">공감 능력 저하</span>"}, {"kind": "결론", "t": "폭력 게임 ↔ 공감 감소의 연관성을 다수 연구가 입증"}], "vocab": [["empathy", "공감"], ["with regard to", "~과 관련하여"], ["longstanding", "오래 지속된"], ["concern", "우려·걱정"], ["conduct", "(연구를) 수행하다"], ["measure", "측정하다"], ["document", "기록하다"], ["formulate", "명확히 표현하다·만들어 내다"], ["credible", "신뢰할 만한"], ["witness", "목격하다"], ["physiological", "생리적인"], ["arousal", "각성·흥분"], ["disgust", "혐오"], ["exposure", "노출"], ["blunted", "무뎌진"], ["desensitization", "탈감각·둔감화"], ["diminished", "감소된"], ["sympathize", "공감하다·동정하다"], ["association", "연관성"]], "quiz": [["‘탈감각(desensitization)’이란 무엇인가요?", "폭력에 <b>반복 노출되면서 부정적 감정·생리적 각성 같은 정상 반응이 무뎌지는</b> 현상이에요."], ["탈감각이 공감으로 이어지는 경로는?", "<b>반복 노출 → 탈감각 → 폭력에 대한 정서 반응 감소 → 타인 인식·공감 능력 저하</b>예요."]], "en": "Video gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust. With repeated exposure to violent events — such as what might happen when a person plays violent video games — this normal reaction might become blunted, a phenomenon known as desensitization. The next step in this problematic process would be having diminished emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy. A significant body of work shows an association between extensive violent video gaming and reduced empathy in people.", "ko": "비디오 게임하기는 공감과 관련하여 가장 많이 연구된 기술들 중 하나이다. 청소년에게 미치는 폭력적인 비디오 게임의 영향에 대해 오랫동안 지속되어 온 우려들이 존재해 왔기 때문에, 그 주제에 대해 많은 연구가 지난 이삼십 년 동안 수행되어 왔다. 비디오 게임 폭력의 영향을 측정하고 기록하는 동안, 과학자들은 어떻게 비디오 게임을 하는 것이 공감에 영향을 미칠 수 있는지에 대한 신뢰할 만한 설명들을 명확하게 내놓았다. 폭력적인 사건들을 목격하는 것에 대한 정상적이고 건강한 반응의 부분은 부정적인 감정들을 느끼는 것이고, 두려움이나 혐오와 연결된 생리적 각성을 경험하는 것이다. 폭력적인 사건들에 대한 반복된 노출과 함께 — 한 사람이 폭력적인 비디오 게임들을 할 때 일어날 수 있는 것과 같은 — 이러한 정상적인 반응은 무뎌질 수 있는데, 탈감각이라고 알려진 현상이다. 이 문제적인 과정의 다음 단계는 폭력에 대한 감소된 정서적 반응들을 가지는 것일 것이며, 이는 또한 다른 사람들을 인식하고/인식하거나 공감하는 능력을 방해할 수 있어서, 감소된 공감으로 이어진다. 일단의 상당한 연구가 사람들에게서 광범위한 폭력적 비디오 게임을 하는 것과 감소된 공감 사이의 연관성을 보여 준다.", "read": [{"en": "Video gaming is one of the most studied technologies with regard to empathy.", "ko": "비디오 게임하기는 공감과 관련하여 가장 많이 연구된 기술들 중 하나이다.", "chunks": [["Video gaming is one of the most studied technologies", "비디오 게임하기는 가장 많이 연구된 기술들 중 하나이다"], ["with regard to empathy.", "공감과 관련하여."]]}, {"en": "Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic.", "ko": "청소년에게 미치는 폭력적인 비디오 게임의 영향에 대해 오랫동안 지속되어 온 우려들이 존재해 왔기 때문에, 그 주제에 대해 많은 연구가 지난 이삼십 년 동안 수행되어 왔다.", "chunks": [["Because there have been longstanding concerns", "오랫동안 지속되어 온 우려들이 존재해 왔기 때문에"], ["about the impact of violent video games on youth,", "청소년에게 미치는 폭력적인 비디오 게임의 영향에 대해,"], ["much research has been conducted", "많은 연구가 수행되어 왔다"], ["over the last couple of decades on the topic.", "지난 이삼십 년 동안 그 주제에 대해."]]}, {"en": "While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy.", "ko": "비디오 게임 폭력의 영향을 측정하고 기록하는 동안, 과학자들은 어떻게 비디오 게임을 하는 것이 공감에 영향을 미칠 수 있는지에 대한 신뢰할 만한 설명들을 명확하게 내놓았다.", "chunks": [["While measuring and documenting", "측정하고 기록하는 동안"], ["the impact of video game violence,", "비디오 게임 폭력의 영향을,"], ["scientists have formulated credible explanations", "과학자들은 신뢰할 만한 설명들을 명확하게 내놓았다"], ["of how video gaming could affect empathy.", "어떻게 비디오 게임을 하는 것이 공감에 영향을 미칠 수 있는지에 대한."]]}, {"en": "Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust.", "ko": "폭력적인 사건들을 목격하는 것에 대한 정상적이고 건강한 반응의 부분은 부정적인 감정들을 느끼는 것이고, 두려움이나 혐오와 연결된 생리적 각성을 경험하는 것이다.", "chunks": [["Part of a normal, healthy reaction", "정상적이고 건강한 반응의 부분은"], ["to witnessing violent events", "폭력적인 사건들을 목격하는 것에 대한"], ["is to feel negative emotions,", "부정적인 감정들을 느끼는 것이고,"], ["and to experience physiological arousal", "그리고 생리적 각성을 경험하는 것이다"], ["that is connected to fear or disgust.", "두려움이나 혐오와 연결된."]]}, {"en": "With repeated exposure to violent events — such as what might happen when a person plays violent video games — this normal reaction might become blunted, a phenomenon known as desensitization.", "ko": "폭력적인 사건들에 대한 반복된 노출과 함께 — 한 사람이 폭력적인 비디오 게임들을 할 때 일어날 수 있는 것과 같은 — 이러한 정상적인 반응은 무뎌질 수 있는데, 탈감각이라고 알려진 현상이다.", "chunks": [["With repeated exposure to violent events", "폭력적인 사건들에 대한 반복된 노출과 함께"], ["— such as what might happen when a person plays violent video games —", "— 한 사람이 폭력적인 비디오 게임들을 할 때 일어날 수 있는 것과 같은 —"], ["this normal reaction might become blunted,", "이러한 정상적인 반응은 무뎌질 수 있는데,"], ["a phenomenon known as desensitization.", "탈감각이라고 알려진 현상이다."]]}, {"en": "The next step in this problematic process would be having diminished emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy.", "ko": "이 문제적인 과정의 다음 단계는 폭력에 대한 감소된 정서적 반응들을 가지는 것일 것이며, 이는 또한 다른 사람들을 인식하고/인식하거나 공감하는 능력을 방해할 수 있어서, 감소된 공감으로 이어진다.", "chunks": [["The next step in this problematic process", "이 문제적인 과정의 다음 단계는"], ["would be having diminished emotional responses to violence,", "폭력에 대한 감소된 정서적 반응들을 가지는 것일 것이며,"], ["which could also interfere with the ability", "이는 또한 능력을 방해할 수 있어서"], ["to recognize and/or to sympathize with others,", "다른 사람들을 인식하고/인식하거나 공감하는,"], ["leading to reduced empathy.", "감소된 공감으로 이어진다."]]}, {"en": "A significant body of work shows an association between extensive violent video gaming and reduced empathy in people.", "ko": "일단의 상당한 연구가 사람들에게서 광범위한 폭력적 비디오 게임을 하는 것과 감소된 공감 사이의 연관성을 보여 준다.", "chunks": [["A significant body of work", "일단의 상당한 연구가"], ["shows an association", "연관성을 보여 준다"], ["between extensive violent video gaming and reduced empathy in people.", "사람들에게서 광범위한 폭력적 비디오 게임을 하는 것과 감소된 공감 사이의."]]}]}, {"no": "no.39", "title": "Purpose-Washing in Brands", "ktitle": "‘목적-세탁’ — 착한 척하는 브랜드", "field": "마케팅 · 윤리", "page": "2026 6월 학평 · no.39 (문장 삽입)", "oneline": "실제 선행 없이 사회적 목적을 <span style=\"color:#c8102e;font-weight:700\">홍보 수단으로만</span> 쓰는 ‘목적-세탁’ 브랜드는 <span style=\"color:#1FA34A;font-weight:700\">잠깐의 차별화</span>만 얻고 <span style=\"color:#c8102e;font-weight:700\">결국 손해</span>를 봅니다.", "metaphor": "<svg viewBox=\"0 0 600 262\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽은 브랜드 간판에 목적이라는 글자를 얇게 칠해 페인트가 흘러내리고 모서리가 벗겨지는 목적 세탁으로 잠깐 차별화 뒤 손해를 보고, 오른쪽은 목적이 나무의 뿌리처럼 깊이 박혀 회사 전체가 실천해 진짜 성공으로 자라는 모습을 대조한 그림\">\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Purpose-Washing — 겉칠한 ‘목적’ vs 뿌리내린 ‘목적’</text>\n\n  <!-- 좌: 목적-세탁 (겉칠·벗겨짐, 빨강 점선) -->\n  <g transform=\"translate(28, 46)\">\n    <rect x=\"0\" y=\"0\" width=\"262\" height=\"126\" rx=\"6\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"6 3\"/>\n    <text x=\"131\" y=\"15\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">목적-세탁 (purpose-washing)</text>\n    <!-- 간판 -->\n    <rect x=\"62\" y=\"28\" width=\"112\" height=\"40\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"118\" y=\"44\" font-family=\"Noto Serif\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">BRAND</text>\n    <line x1=\"118\" y1=\"68\" x2=\"118\" y2=\"96\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <!-- 얇게 칠한 '목적' 띠 -->\n    <rect x=\"68\" y=\"50\" width=\"100\" height=\"14\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/>\n    <text x=\"112\" y=\"60\" font-family=\"Noto Serif KR\" font-size=\"8\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">목적 PURPOSE</text>\n    <!-- 벗겨진 모서리 -->\n    <path d=\"M 168 50 q 11 1 9 12 q -6 -5 -9 -12 Z\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    <!-- 페인트 붓 -->\n    <g transform=\"translate(58, 40)\">\n      <line x1=\"0\" y1=\"14\" x2=\"-18\" y2=\"-2\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <rect x=\"-4\" y=\"10\" width=\"10\" height=\"7\" transform=\"rotate(42 1 13)\" fill=\"#c8102e\" stroke=\"#c8102e\"/>\n    </g>\n    <!-- 흘러내리는 페인트 -->\n    <g stroke=\"#c8102e\" stroke-width=\"1.2\">\n      <line x1=\"82\" y1=\"64\" x2=\"82\" y2=\"76\"/><circle cx=\"82\" cy=\"78\" r=\"1.8\" fill=\"#c8102e\" stroke=\"none\"/>\n      <line x1=\"108\" y1=\"64\" x2=\"108\" y2=\"80\"/><circle cx=\"108\" cy=\"82\" r=\"1.8\" fill=\"#c8102e\" stroke=\"none\"/>\n      <line x1=\"138\" y1=\"64\" x2=\"138\" y2=\"74\"/><circle cx=\"138\" cy=\"76\" r=\"1.8\" fill=\"#c8102e\" stroke=\"none\"/>\n    </g>\n    <!-- 결과 -->\n    <line x1=\"118\" y1=\"98\" x2=\"118\" y2=\"108\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <polygon points=\"118,110 114,102 122,102\" fill=\"#c8102e\"/>\n    <text x=\"131\" y=\"120\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">말뿐 → 잠깐 차별화 → 손해</text>\n  </g>\n\n  <text x=\"300\" y=\"112\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#999\">vs</text>\n\n  <!-- 우: 진정한 헌신 (뿌리내림, 초록 실선) -->\n  <g transform=\"translate(312, 46)\">\n    <rect x=\"0\" y=\"0\" width=\"260\" height=\"126\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"130\" y=\"15\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">진정한 헌신 (authentic)</text>\n    <!-- 나무 수관(성장) -->\n    <circle cx=\"96\" cy=\"44\" r=\"16\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <circle cx=\"82\" cy=\"50\" r=\"11\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <circle cx=\"110\" cy=\"50\" r=\"11\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <text x=\"170\" y=\"40\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" fill=\"#1FA34A\">진짜 성공</text>\n    <text x=\"170\" y=\"54\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#5e5e5e\">real growth</text>\n    <!-- 줄기 -->\n    <rect x=\"90\" y=\"58\" width=\"12\" height=\"32\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <!-- 지표선 -->\n    <line x1=\"40\" y1=\"90\" x2=\"180\" y2=\"90\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <!-- 뿌리 = 목적(실천) -->\n    <g stroke=\"#1FA34A\" stroke-width=\"1.6\" fill=\"none\">\n      <path d=\"M 96 90 Q 80 102 70 116\"/>\n      <path d=\"M 96 90 Q 96 104 96 118\"/>\n      <path d=\"M 96 90 Q 112 102 124 114\"/>\n      <path d=\"M 78 108 q -6 4 -10 4\"/>\n      <path d=\"M 114 106 q 6 4 11 4\"/>\n    </g>\n    <text x=\"170\" y=\"108\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" fill=\"#1FA34A\">목적 = 뿌리(실천)</text>\n    <text x=\"170\" y=\"122\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#5e5e5e\">whole company lives it</text>\n  </g>\n\n  <!-- 삽입 위치 strip -->\n  <rect x=\"40\" y=\"182\" width=\"520\" height=\"56\" rx=\"6\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n  <text x=\"58\" y=\"204\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1a1a1a\">문장 삽입 위치 = ②</text>\n  <text x=\"58\" y=\"224\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#5e5e5e\">①(목적을 홍보에 활용) → <tspan font-weight=\"700\" fill=\"#c8102e\">「명성 띄우기에 이용」</tspan> → ②뒤(겉치레식 ‘정의’ 설명) 사이</text>\n</svg>", "caption": "‘선한 목적’ 간판은 번쩍이는데 그 뒤 공장은 텅 비어 있고, 시간이 지나자 간판마저 빛이 바래는 그림.", "tldr": ["일부 브랜드는 실제 선행 전에 사회적 목적부터 <span style=\"color:#c8102e;font-weight:700\">널리 알려요</span> — 목적을 ‘받아들이기’보다 명성 띄우기에 이용하는 거죠.", "진짜 성공은 <span style=\"color:#1FA34A;font-weight:700\">회사 전체의 진정한 헌신</span>에서만 나와요 — 그렇지 않으면 ‘<span style=\"color:#c8102e;font-weight:700\">목적-세탁</span>’(그린-워싱과 유사).", "결과: 차별화는 <span style=\"color:#c8102e;font-weight:700\">잠깐뿐</span> — 미래 시장 손해 + 직원 사기 저하로 돌아와요."], "analogy": "공부는 안 하고 책상 위에 문제집만 잔뜩 쌓아 ‘열심히 하는 척’하는 것과 같아요. 잠깐은 그럴듯해 보여도 시험 점수(시장·직원 신뢰)로 결국 들통나죠.", "bg": "분야는 브랜드 마케팅 윤리예요. ‘purpose-washing(목적-세탁)’은 환경 분야의 ‘greenwashing(그린-워싱)’을 사회적 목적에 적용한 말 — 실속 없이 명분만 내세우는 행태예요. → ‘진정한 헌신 vs 겉치레’의 대비, 그리고 삽입 문장이 ‘마케터의 의도’를 어떻게 폭로하는지 보며 읽으세요.", "flow": [{"kind": "도입", "t": "일부 브랜드: 실제 선행 전에 사회적 목적부터 널리 알림"}, {"kind": "삽입", "t": "마케터는 목적을 받아들이기보다 <span style=\"color:#c8102e;font-weight:700\">명성 띄우기에 이용</span>"}, {"kind": "대조", "t": "진짜 성공은 <span style=\"color:#1FA34A;font-weight:700\">회사 전체의 진정한 헌신</span>에서 나옴"}, {"kind": "정의", "t": "진정성 없으면 겉치레 = ‘목적-세탁’(그린-워싱과 유사)"}, {"kind": "인용", "t": "권위자 비판: 되돌려 주지 않는 엘리트의 속임수"}, {"kind": "결말", "t": "잠깐의 차별화뿐 → <span style=\"color:#c8102e;font-weight:700\">미래 시장 손해 + 직원 사기 저하</span>"}], "vocab": [["differentiation", "차별화"], ["broadcast", "널리 알리다·방송하다"], ["social purpose", "사회적 목적"], ["marketer", "마케터·마케팅 담당자"], ["boost", "끌어올리다·신장시키다"], ["reputation", "명성·평판"], ["embrace", "받아들이다·포용하다"], ["authentic", "진정한·진짜의"], ["commitment", "헌신·전념"], ["window-dressing", "겉치레·눈가림"], ["purpose-washing", "목적-세탁"], ["publicity", "홍보·선전"], ["charade", "뻔한 속임수·연극"], ["disrupt", "붕괴시키다·교란하다"], ["positioning", "포지셔닝·자리매김"], ["lose out", "손해를 보다·뒤처지다"]], "quiz": [["‘목적-세탁(purpose-washing)’이란?", "실제 선행 없이 <b>사회적 목적을 주로 홍보 수단으로 내세우는</b> 행태예요 — 환경 분야의 그린-워싱과 닮았죠."], ["목적-세탁이 결국 손해인 이유는?", "차별화 효과가 <b>잠깐뿐</b>이고, 진정성이 들통나면 <b>미래 시장과 직원 사기에 손해</b>로 돌아오기 때문이에요."]], "en": "Realising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to boost the brand’s reputation, rather than embracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to follow from an authentic, company-wide commitment to the purpose. Otherwise the mission is just window-dressing, or what we call “purpose-washing” ― similar to green-washing, where purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridhardas describes in Winners Take All: “social purpose that just furthers the charade of elites disrupting the old order without giving much back”. Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel worse about working for them.", "ko": "차별화의 이점들을 인식하면서, 몇몇 브랜드들은 그들이 많은 실제적인 선을 행하기 전에 그들의 사회적 목적을 널리 알린다. 그들의 마케터들은 그 목적 자체를 받아들이기보다는, 그 브랜드의 명성을 끌어올리기 위해 사회적 목적을 이용하고 있다. 사회적 문제들에 대해서 실제적인 차이를 만들어 내는 것은 충분히 어려우므로 성공하기 위해, 그것은 그 목적에 대한 진정한, 회사 전체에 걸친 헌신의 결과로 일어나야 한다. 그렇지 않으면 그 임무는 단지 겉치레에 불과하며, 또는 우리가 “목적-세탁”이라고 부르는 것 ― 그린-워싱과 유사하며, 그 경우에는 목적 주도 활동들이 주로 홍보 목적의 역할을 한다. 우리는 결국 Anand Giridhardas가 Winners Take All에서 묘사하는 것에 이르게 된다. “많은 것을 되돌려 주지 않으면서 옛 질서를 붕괴시키는 엘리트들의 뻔한 속임수를 단지 더 부추길 뿐인 사회적 목적”. 목적-세탁 브랜드들은 사회적 목적의 이점들 중 하나, 차별화를 얻지만, 그러나 단지 잠깐 동안만이다. 그들은 미래 시장들을 위한 포지셔닝에서 손해를 보며, 그들은 심지어 직원들로 하여금 그것들을 위해 일하는 것에 대해 더 나쁘게 느끼게 만들지도 모른다.", "read": [{"en": "Realising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good.", "ko": "차별화의 이점들을 인식하면서, 몇몇 브랜드들은 그들이 많은 실제적인 선을 행하기 전에 그들의 사회적 목적을 널리 알린다.", "chunks": [["Realising the benefits of differentiation,", "차별화의 이점들을 인식하면서,"], ["some brands broadcast their social purpose", "몇몇 브랜드들은 그들의 사회적 목적을 널리 알린다"], ["before they do much actual good.", "그들이 많은 실제적인 선을 행하기 전에."]]}, {"en": "Their marketers are using social purpose to boost the brand’s reputation, rather than embracing the purpose itself.", "ko": "그들의 마케터들은 그 목적 자체를 받아들이기보다는, 그 브랜드의 명성을 끌어올리기 위해 사회적 목적을 이용하고 있다.", "chunks": [["Their marketers are using social purpose", "그들의 마케터들은 사회적 목적을 이용하고 있다"], ["to boost the brand’s reputation,", "그 브랜드의 명성을 끌어올리기 위해,"], ["rather than embracing the purpose itself.", "그 목적 자체를 받아들이기보다는."]]}, {"en": "Making a real difference with social problems is hard enough; to succeed, it has to follow from an authentic, company-wide commitment to the purpose.", "ko": "사회적 문제들에 대해서 실제적인 차이를 만들어 내는 것은 충분히 어려우므로 성공하기 위해, 그것은 그 목적에 대한 진정한, 회사 전체에 걸친 헌신의 결과로 일어나야 한다.", "chunks": [["Making a real difference with social problems is hard enough;", "사회적 문제들에 대해서 실제적인 차이를 만들어 내는 것은 충분히 어려우므로;"], ["to succeed,", "성공하기 위해,"], ["it has to follow from an authentic, company-wide commitment to the purpose.", "그것은 그 목적에 대한 진정한, 회사 전체에 걸친 헌신의 결과로 일어나야 한다."]]}, {"en": "Otherwise the mission is just window-dressing, or what we call “purpose-washing” ― similar to green-washing, where purpose-driven activities serve mainly for publicity purposes.", "ko": "그렇지 않으면 그 임무는 단지 겉치레에 불과하며, 또는 우리가 “목적-세탁”이라고 부르는 것 ― 그린-워싱과 유사하며, 그 경우에는 목적 주도 활동들이 주로 홍보 목적의 역할을 한다.", "chunks": [["Otherwise the mission is just window-dressing,", "그렇지 않으면 그 임무는 단지 겉치레에 불과하며,"], ["or what we call “purpose-washing”", "또는 우리가 “목적-세탁”이라고 부르는 것"], ["― similar to green-washing,", "― 그린-워싱과 유사하며,"], ["where purpose-driven activities serve mainly for publicity purposes.", "그 경우에는 목적 주도 활동들이 주로 홍보 목적의 역할을 한다."]]}, {"en": "We end up with what Anand Giridhardas describes in Winners Take All: “social purpose that just furthers the charade of elites disrupting the old order without giving much back”.", "ko": "우리는 결국 Anand Giridhardas가 Winners Take All에서 묘사하는 것에 이르게 된다. “많은 것을 되돌려 주지 않으면서 옛 질서를 붕괴시키는 엘리트들의 뻔한 속임수를 단지 더 부추길 뿐인 사회적 목적”.", "chunks": [["We end up with", "우리는 결국 ~에 이르게 된다"], ["what Anand Giridhardas describes in Winners Take All:", "Anand Giridhardas가 Winners Take All에서 묘사하는 것:"], ["“social purpose that just furthers the charade of elites disrupting the old order", "“옛 질서를 붕괴시키는 엘리트들의 뻔한 속임수를 단지 더 부추길 뿐인 사회적 목적"], ["without giving much back”.", "많은 것을 되돌려 주지 않으면서”."]]}, {"en": "Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while.", "ko": "목적-세탁 브랜드들은 사회적 목적의 이점들 중 하나, 차별화를 얻지만, 그러나 단지 잠깐 동안만이다.", "chunks": [["Purpose-washing brands gain", "목적-세탁 브랜드들은 얻지만,"], ["one of the benefits of social purpose, differentiation,", "사회적 목적의 이점들 중 하나, 차별화를,"], ["but only for a short while.", "그러나 단지 잠깐 동안만이다."]]}, {"en": "They lose out on positioning for future markets, and they might even make employees feel worse about working for them.", "ko": "그들은 미래 시장들을 위한 포지셔닝에서 손해를 보며, 그들은 심지어 직원들로 하여금 그것들을 위해 일하는 것에 대해 더 나쁘게 느끼게 만들지도 모른다.", "chunks": [["They lose out on positioning for future markets,", "그들은 미래 시장들을 위한 포지셔닝에서 손해를 보며,"], ["and they might even make employees feel worse", "그리고 그들은 심지어 직원들로 하여금 더 나쁘게 느끼게 만들지도 모른다"], ["about working for them.", "그것들을 위해 일하는 것에 대해."]]}]}, {"no": "no.40", "title": "Music and Violated Expectations", "ktitle": "음악은 ‘기대를 깨면서’ 감동을 준다", "field": "인지 · 음악", "page": "2026 6월 학평 · no.40 (문단 요약)", "oneline": "뇌는 일정 박자의 <span style=\"color:#1FA34A;font-weight:700\">도식(기대)</span>을 만들고, 음악은 그 기대에 대한 <span style=\"color:#c8102e;font-weight:700\">체계적 위반</span>으로 감정을 전달 — 예상 밖 요소가 없으면 음악은 밋밋해집니다.", "metaphor": "<svg viewBox=\"0 0 600 262\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"뇌가 일정한 박자의 기대 도식을 만들고 음악이 그 기대에 대한 체계적 위반으로 감정을 전달하며, 위반이 없으면 음악이 밋밋해진다는 대조 그림\">\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Music and Violated Expectations — 기대(도식) → 위반 → 감정</text>\n\n  <!-- 위: 기대 + 위반 → 감정 -->\n  <text x=\"34\" y=\"58\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" fill=\"#5e5e5e\">기대 + 위반</text>\n  <line x1=\"40\" y1=\"92\" x2=\"356\" y2=\"92\" stroke=\"#999\" stroke-width=\"1\"/>\n  <!-- 규칙적 박자 (회색) -->\n  <g stroke=\"#1a1a1a\" stroke-width=\"2\">\n    <line x1=\"70\" y1=\"92\" x2=\"70\" y2=\"68\"/>\n    <line x1=\"118\" y1=\"92\" x2=\"118\" y2=\"68\"/>\n    <line x1=\"166\" y1=\"92\" x2=\"166\" y2=\"68\"/>\n    <line x1=\"262\" y1=\"92\" x2=\"262\" y2=\"68\"/>\n    <line x1=\"310\" y1=\"92\" x2=\"310\" y2=\"68\"/>\n  </g>\n  <!-- 위반 박자 (빨강, 위치·길이 이탈) -->\n  <line x1=\"208\" y1=\"92\" x2=\"208\" y2=\"50\" stroke=\"#c8102e\" stroke-width=\"2.6\"/>\n  <text x=\"208\" y=\"44\" font-family=\"Noto Serif KR\" font-size=\"8\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">위반!</text>\n  <text x=\"120\" y=\"108\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">일정 박자 도식(schema) = 기대</text>\n  <!-- 감정 화살표 -->\n  <line x1=\"356\" y1=\"80\" x2=\"404\" y2=\"80\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n  <polygon points=\"404,80 395,75 395,85\" fill=\"#1FA34A\"/>\n  <rect x=\"408\" y=\"58\" width=\"166\" height=\"46\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n  <text x=\"491\" y=\"80\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">감정 전달</text>\n  <text x=\"491\" y=\"96\" font-family=\"Noto Serif\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">musical emotion</text>\n\n  <!-- 아래: 위반 없음 → 밋밋 -->\n  <text x=\"34\" y=\"142\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" fill=\"#5e5e5e\">위반 없음</text>\n  <line x1=\"40\" y1=\"158\" x2=\"356\" y2=\"158\" stroke=\"#999\" stroke-width=\"1\"/>\n  <g stroke=\"#ccc\" stroke-width=\"2\">\n    <line x1=\"70\" y1=\"158\" x2=\"70\" y2=\"142\"/>\n    <line x1=\"118\" y1=\"158\" x2=\"118\" y2=\"142\"/>\n    <line x1=\"166\" y1=\"158\" x2=\"166\" y2=\"142\"/>\n    <line x1=\"214\" y1=\"158\" x2=\"214\" y2=\"142\"/>\n    <line x1=\"262\" y1=\"158\" x2=\"262\" y2=\"142\"/>\n    <line x1=\"310\" y1=\"158\" x2=\"310\" y2=\"142\"/>\n  </g>\n  <text x=\"120\" y=\"174\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#999\">완전히 규칙적 (예상 밖 요소 없음)</text>\n  <line x1=\"356\" y1=\"150\" x2=\"404\" y2=\"150\" stroke=\"#999\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n  <polygon points=\"404,150 395,145 395,155\" fill=\"#999\"/>\n  <rect x=\"408\" y=\"128\" width=\"166\" height=\"46\" rx=\"6\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"1\"/>\n  <text x=\"491\" y=\"150\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5e5e5e\">밋밋 · 기계적</text>\n  <text x=\"491\" y=\"166\" font-family=\"Noto Serif KR\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#999\">아무도 듣고 싶지 않음</text>\n\n  <!-- 요약 strip -->\n  <rect x=\"24\" y=\"194\" width=\"552\" height=\"56\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n  <text x=\"42\" y=\"216\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#1a1a1a\">뇌는 일정 박자의 <tspan font-weight=\"700\" fill=\"#1FA34A\">(A) 기대(도식)</tspan>를 만들고, 음악은 그에 대한</text>\n  <text x=\"42\" y=\"236\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#1a1a1a\"><tspan font-weight=\"700\" fill=\"#1FA34A\">(B) 위반</tspan>으로 감정을 전달한다 — 위반이 없으면 음악은 밋밋해진다.</text>\n</svg>", "caption": "규칙적인 박자 격자 위로 음표 하나가 ‘예상 밖’의 자리에 톡 튀어 떨어지자 마음에 물결이 번지는 그림.", "tldr": ["뇌는 일정 박자의 <span style=\"color:#1FA34A;font-weight:700\">도식(schema)</span>을 만들어 — 음악가가 그것을 벗어나는 순간을 감지해요.", "음악적 감정의 핵심 = <span style=\"color:#1FA34A;font-weight:700\">기대 형성</span>, 그리고 그 기대에 대한 <span style=\"color:#c8102e;font-weight:700\">체계적 위반</span>(음높이·리듬·속도 등).", "위반(예상 밖 요소)이 <span style=\"color:#c8102e;font-weight:700\">없으면</span> 밋밋·기계적 — 아무도 듣고 싶지 않은 음악이 돼요."], "analogy": "농담은 ‘예상 못 한 반전’에서 빵 터지죠. 다 아는 결말이면 안 웃겨요. 음악도 똑같아요 — 뇌가 예상한 박자를 살짝 비틀 때 ‘소름’이 돋는 거예요.", "bg": "분야는 음악인지예요. ‘schema(도식)’는 뇌가 만든 기대의 틀, ‘violation(위반)’은 그 틀을 벗어나는 것 — 기대와 위반의 긴장이 감정을 만든다는 게 논지. → ‘기대를 만든다 → 그것을 깬다 → 그래서 감동한다’는 인과를 잡고, ‘위반이 없으면 어떻게 되는가’ 결론을 확인하며 읽으세요.", "flow": [{"kind": "주제", "t": "뇌는 일정 박자의 <span style=\"color:#1FA34A;font-weight:700\">도식(schema)</span>을 만들어 이탈을 감지"}, {"kind": "유추", "t": "멜로디 변주도 동일 — 원래 멜로디의 표상이 있어야 변형 인지"}, {"kind": "정의", "t": "박자적 추출(기대 형성) = 음악적 감정의 핵심"}, {"kind": "핵심", "t": "음악은 기대에 대한 <span style=\"color:#c8102e;font-weight:700\">체계적 위반</span>으로 감정을 전달"}, {"kind": "강조", "t": "위반은 어느 영역에서든 가능하나 반드시 일어나야 함"}, {"kind": "결론", "t": "예상 밖 요소 없으면 밋밋·기계적 — 아무도 듣고 싶지 않은 음악"}], "vocab": [["constant", "일정한·변치 않는"], ["pulse", "박자·맥박"], ["schema", "도식·스키마"], ["conform to", "~에 따르다·순응하다"], ["variation", "변주·변형"], ["representation", "표상·표현"], ["appreciate", "판단하다·진가를 알아보다"], ["take liberties with", "~을 멋대로 바꾸다"], ["metrical", "박자의·운율의"], ["extraction", "추출"], ["crucial", "중요한·결정적인"], ["violation", "위반"], ["systematic", "체계적인"], ["domain", "영역"], ["unexpected", "예상치 못한"], ["flat", "밋밋한·단조로운"], ["robotic", "기계적인"]], "quiz": [["음악이 감정을 전달하는 핵심 원리는?", "뇌가 만든 <b>박자·멜로디 기대(도식)</b>를 음악이 <b>체계적으로 위반</b>할 때 감정이 생긴다는 거예요."], ["‘예상 밖 요소가 없는’ 음악은 어떻게 되나요?", "조직화가 지나쳐 <b>감정적으로 밋밋하고 기계적</b>이 돼요 — 기술적으론 음악이어도 아무도 듣고 싶어 하지 않죠."]], "en": "The brain needs to create a model of a constant pulse ― a schema ― so that we know when the musicians are not conforming to it. This is similar to variations of a melody: We need to have a mental representation of what the melody is in order to know ― and appreciate ― when the musician is taking liberties with it. Metrical extraction, knowing what the pulse is and when we expect it to occur, is a crucial part of musical emotion. Music communicates to us emotionally through systematic violations of expectations. These violations can occur in any domain ― the domain of pitch, rhythm, tempo, and so on ― but occur they must. Music is organized sound, but the organization has to involve some element of the unexpected or it is emotionally flat and robotic. Too much organization may technically still be music, but it would be music that no one wants to listen to.", "ko": "뇌는 우리가 언제 음악가들이 그것에 따르고 있지 않는지를 알게 하기 위해 일정한 박자의 모형 ― 도식 ― 을 창조할 필요가 있다. 이는 멜로디의 변주들과 유사한데, 즉 우리는 언제 음악가가 멋대로 그것을 바꾸는지를 인지하고 ― 그리고 판단하기 위해 ― 그 멜로디가 무엇인지에 대한 정신적 표상을 가지고 있을 필요가 있다. 박자적 추출, 즉 박자가 무엇인지와 언제 우리가 그것이 발생할 것이라고 기대하는 지를 아는 것은 음악적 감정의 중요한 한 부분이다. 음악은 기대에 대한 체계적인 위반들을 통해 우리에게 감정적으로 소통한다. 이러한 위반은 어떤 영역 ― 음높이, 리듬, 속도 등의 영역 ― 에서든 발생할 수 있지만 그것들은 반드시 발생해야 한다. 음악은 조직화된 소리이지만, 그 조직화는 예상치 못한 약간의 요소를 포함해야만 하며 그렇지 않으면 그것은 감정적으로 밋밋하고 기계적이다. 너무 많은 조직화는 기술적으로는 여전히 음악일 수도 있지만, 그것은 아무도 듣고 싶어 하지 않는 음악일 것이다.", "read": [{"en": "The brain needs to create a model of a constant pulse ― a schema ― so that we know when the musicians are not conforming to it.", "ko": "뇌는 우리가 언제 음악가들이 그것에 따르고 있지 않는지를 알게 하기 위해 일정한 박자의 모형 ― 도식 ― 을 창조할 필요가 있다.", "chunks": [["The brain needs to create", "뇌는 창조할 필요가 있다"], ["a model of a constant pulse ― a schema ―", "일정한 박자의 모형 ― 도식 ― 을"], ["so that we know", "우리가 알게 하기 위해"], ["when the musicians are not conforming to it.", "언제 음악가들이 그것에 따르고 있지 않은지를."]]}, {"en": "This is similar to variations of a melody: We need to have a mental representation of what the melody is in order to know ― and appreciate ― when the musician is taking liberties with it.", "ko": "이는 멜로디의 변주들과 유사한데, 즉 우리는 언제 음악가가 멋대로 그것을 바꾸는지를 인지하고 ― 그리고 판단하기 위해 ― 그 멜로디가 무엇인지에 대한 정신적 표상을 가지고 있을 필요가 있다.", "chunks": [["This is similar to variations of a melody:", "이는 멜로디의 변주들과 유사한데:"], ["We need to have a mental representation of what the melody is", "우리는 그 멜로디가 무엇인지에 대한 정신적 표상을 가지고 있을 필요가 있다"], ["in order to know ― and appreciate ―", "인지하고 ― 그리고 판단하기 위해 ―"], ["when the musician is taking liberties with it.", "언제 음악가가 멋대로 그것을 바꾸는지를."]]}, {"en": "Metrical extraction, knowing what the pulse is and when we expect it to occur, is a crucial part of musical emotion.", "ko": "박자적 추출, 즉 박자가 무엇인지와 언제 우리가 그것이 발생할 것이라고 기대하는 지를 아는 것은 음악적 감정의 중요한 한 부분이다.", "chunks": [["Metrical extraction,", "박자적 추출,"], ["knowing what the pulse is and when we expect it to occur,", "즉 박자가 무엇인지와 언제 우리가 그것이 발생할 것이라고 기대하는 지를 아는 것은,"], ["is a crucial part of musical emotion.", "음악적 감정의 중요한 한 부분이다."]]}, {"en": "Music communicates to us emotionally through systematic violations of expectations.", "ko": "음악은 기대에 대한 체계적인 위반들을 통해 우리에게 감정적으로 소통한다.", "chunks": [["Music communicates to us emotionally", "음악은 우리에게 감정적으로 소통한다"], ["through systematic violations of expectations.", "기대에 대한 체계적인 위반들을 통해."]]}, {"en": "These violations can occur in any domain ― the domain of pitch, rhythm, tempo, and so on ― but occur they must.", "ko": "이러한 위반은 어떤 영역 ― 음높이, 리듬, 속도 등의 영역 ― 에서든 발생할 수 있지만 그것들은 반드시 발생해야 한다.", "chunks": [["These violations can occur in any domain", "이러한 위반은 어떤 영역에서든 발생할 수 있지만"], ["― the domain of pitch, rhythm, tempo, and so on ―", "― 음높이, 리듬, 속도 등의 영역 ―"], ["but occur they must.", "그것들은 반드시 발생해야 한다."]]}, {"en": "Music is organized sound, but the organization has to involve some element of the unexpected or it is emotionally flat and robotic.", "ko": "음악은 조직화된 소리이지만, 그 조직화는 예상치 못한 약간의 요소를 포함해야만 하며 그렇지 않으면 그것은 감정적으로 밋밋하고 기계적이다.", "chunks": [["Music is organized sound,", "음악은 조직화된 소리이지만,"], ["but the organization has to involve some element of the unexpected", "그 조직화는 예상치 못한 약간의 요소를 포함해야만 하며"], ["or it is emotionally flat and robotic.", "그렇지 않으면 그것은 감정적으로 밋밋하고 기계적이다."]]}, {"en": "Too much organization may technically still be music, but it would be music that no one wants to listen to.", "ko": "너무 많은 조직화는 기술적으로는 여전히 음악일 수도 있지만, 그것은 아무도 듣고 싶어 하지 않는 음악일 것이다.", "chunks": [["Too much organization", "너무 많은 조직화는"], ["may technically still be music,", "기술적으로는 여전히 음악일 수도 있지만,"], ["but it would be music that no one wants t

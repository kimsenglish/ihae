e": "Jacob Lawrence, Painter of African-American Life", "ktitle": "흑인의 삶을 그린 화가, Jacob Lawrence", "field": "전기 · 예술가", "page": "2026 6월 학평 · no.26 (내용 불일치)", "oneline": "화가 Jacob Lawrence 전기 — 출생(1917) → Harlem 미술 공부 → 대표작 The Migration Series → 전시 복무 → 16년 교편 → 명예 학위까지, <span style=\"color:#1FA34A;font-weight:700\">연도·고유명사·수치가 곧 선지의 근거</span>.", "metaphor": "<svg viewBox=\"0 0 600 262\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"화가 Jacob Lawrence의 생애를 출생 1917년부터 13세 Harlem 이주와 미술 공부, 화풍과 대표작 The Migration Series, 2차 대전 중 해안 경비대 복무와 작품 소실, 16년 교편, 명예 학위, 사망 직전까지의 활동까지 시간 순으로 배열한 연표\">\n  <text x=\"300\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Jacob Lawrence — 생애 연표 (선지의 근거 = 연도·고유명사·사실)</text>\n  <!-- 타임라인 -->\n  <line x1=\"34\" y1=\"131\" x2=\"566\" y2=\"131\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n  <polygon points=\"566,131 558,127 558,135\" fill=\"#1a1a1a\"/>\n\n  <!-- 노드 7개 -->\n  <!-- 1 출생 (위) -->\n  <g transform=\"translate(60, 131)\">\n    <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#1FA34A\" stroke=\"#1FA34A\"/>\n    <line x1=\"0\" y1=\"-6\" x2=\"0\" y2=\"-34\" stroke=\"#999\" stroke-width=\"0.9\"/>\n    <text x=\"0\" y=\"-48\" font-family=\"Noto Serif\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">1917</text>\n    <text x=\"0\" y=\"-36\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">Atlantic City 출생</text>\n  </g>\n  <!-- 2 Harlem (아래) -->\n  <g transform=\"translate(143, 131)\">\n    <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <line x1=\"0\" y1=\"6\" x2=\"0\" y2=\"30\" stroke=\"#999\" stroke-width=\"0.9\"/>\n    <text x=\"0\" y=\"44\" font-family=\"Noto Serif\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">age 13</text>\n    <text x=\"0\" y=\"56\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">Harlem 이주 · 미술 공부</text>\n  </g>\n  <!-- 3 화풍·대표작 (위) -->\n  <g transform=\"translate(238, 131)\">\n    <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <line x1=\"0\" y1=\"-6\" x2=\"0\" y2=\"-30\" stroke=\"#999\" stroke-width=\"0.9\"/>\n    <text x=\"0\" y=\"-44\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">The Migration Series</text>\n    <text x=\"0\" y=\"-32\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">밝은 색·단순 형태 · 전국적 인정</text>\n  </g>\n  <!-- 4 Coast Guard (아래) -->\n  <g transform=\"translate(333, 131)\">\n    <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <line x1=\"0\" y1=\"6\" x2=\"0\" y2=\"30\" stroke=\"#999\" stroke-width=\"0.9\"/>\n    <text x=\"0\" y=\"44\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">WWII · Coast Guard</text>\n    <text x=\"0\" y=\"56\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">작품 대부분 소실</text>\n  </g>\n  <!-- 5 교편 (위) -->\n  <g transform=\"translate(415, 131)\">\n    <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <line x1=\"0\" y1=\"-6\" x2=\"0\" y2=\"-30\" stroke=\"#999\" stroke-width=\"0.9\"/>\n    <text x=\"0\" y=\"-44\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">16 years teaching</text>\n    <text x=\"0\" y=\"-32\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">Univ. of Washington</text>\n  </g>\n  <!-- 6 명예학위 (아래) -->\n  <g transform=\"translate(490, 131)\">\n    <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <line x1=\"0\" y1=\"6\" x2=\"0\" y2=\"30\" stroke=\"#999\" stroke-width=\"0.9\"/>\n    <text x=\"0\" y=\"44\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">honorary degrees</text>\n    <text x=\"0\" y=\"56\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">Harvard 등</text>\n  </g>\n  <!-- 7 사망 직전 (위) -->\n  <g transform=\"translate(550, 131)\">\n    <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#c8102e\" stroke=\"#c8102e\"/>\n    <line x1=\"0\" y1=\"-6\" x2=\"0\" y2=\"-30\" stroke=\"#999\" stroke-width=\"0.9\"/>\n    <text x=\"0\" y=\"-44\" font-family=\"Noto Serif KR\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">사망 직전까지</text>\n    <text x=\"0\" y=\"-32\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">계속 그림</text>\n  </g>\n\n  <!-- 대표작 미니 캔버스 -->\n  <g transform=\"translate(238, 168)\">\n    <rect x=\"-26\" y=\"0\" width=\"52\" height=\"36\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    <rect x=\"-22\" y=\"4\" width=\"14\" height=\"28\" fill=\"#c8102e\" fill-opacity=\"0.5\"/>\n    <rect x=\"-6\" y=\"4\" width=\"12\" height=\"28\" fill=\"#1FA34A\" fill-opacity=\"0.45\"/>\n    <rect x=\"8\" y=\"4\" width=\"14\" height=\"28\" fill=\"#1a1a1a\" fill-opacity=\"0.3\"/>\n  </g>\n\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5e5e5e\">scenes of African-American life — vivid, until weeks before his death</text>\n</svg>", "caption": "밝은 색채의 단순한 형태로 그려진 연대기 벽화 — 1917년 출생부터 붓을 놓지 않은 마지막 몇 주까지 이어지는 그림.", "tldr": ["1917년 Atlantic City 출생 — 13세에 Harlem 이주, Utopia Children's Center에서 미술을 공부했어요.", "밝은 색채·단순화된 형태가 화풍 — 걸작 <span style=\"color:#1FA34A;font-weight:700\">The Migration Series</span>로 전국적 인정.", "2차 대전 중 해안 경비대 복무(작품 대부분 소실) → Washington 대학교 16년 교편 → Harvard 등 명예 학위 — <span style=\"color:#1FA34A;font-weight:700\">사망 몇 주 전까지 그림으로 흑인의 삶을 탐구</span>했습니다."], "analogy": "미술관 전시 끝 벽에 붙은 ‘작가 연보’를 읽는 글이에요. 내용 일치 문제는 그 연보의 연도·지명·숫자를 선지와 맞춰 보는 ‘틀린 그림 찾기’ — 연보를 정확히 읽으면 끝나죠.", "bg": "분야는 예술가 전기예요. The Migration Series는 아프리카계 미국인의 북부 대이주를 그린 연작으로 그의 걸작 — ‘African-American life(흑인의 삶)’가 평생의 주제였어요. → 연도(1917)·수치(13세·16년)·고유명사(Harlem, Migration Series, Washington, Harvard)에 표시하며 사건 순서를 잡고 읽으세요.", "flow": [{"kind": "도입", "t": "아프리카계 미국인의 역사·일상을 생생하게 그린 미국 화가"}, {"kind": "성장", "t": "1917년 Atlantic City 출생 → 13세 Harlem 이주 → 미술 공부"}, {"kind": "화풍·대표작", "t": "밝은 색채·단순화된 형태 + 걸작 <span style=\"color:#1FA34A;font-weight:700\">The Migration Series</span>로 전국적 인정"}, {"kind": "전시·교육", "t": "2차 대전 해안 경비대 복무(작품 대부분 소실) + Washington 대학교 16년 교편"}, {"kind": "명예", "t": "Harvard 등 여러 대학에서 명예 학위"}, {"kind": "헌신", "t": "사망 몇 주 전까지도 그림으로 아프리카계 미국인의 삶을 탐구"}], "vocab": [["painter", "화가"], ["known for", "~로 알려진"], ["vivid", "생생한·선명한"], ["scene", "장면"], ["simplified", "단순화된"], ["shape", "형태·모양"], ["widely", "널리"], ["regard A as B", "A를 B로 여기다·간주하다"], ["masterpiece", "걸작·명작"], ["recognition", "인정·인지"], ["serve in", "~에서 복무하다"], ["produce", "제작하다·만들어 내다"], ["honorary degree", "명예 학위"], ["including", "~을 포함하여"], ["explore", "탐구하다·탐험하다"], ["throughout", "~ 내내·~ 전체에 걸쳐"]], "quiz": [["Lawrence에게 전국적 인정을 안긴 작품은?", "<b>The Migration Series</b> — 그의 걸작으로 널리 여겨지는 연작이에요."], ["전쟁 중 그가 만든 작품들은 어떻게 되었나요?", "해안 경비대 복무 중 많은 그림을 그렸지만 <b>대부분 소실</b>됐어요 — 내용 일치 단골 포인트죠."]], "en": "Jacob Lawrence was an American painter known for vivid scenes of African-American history and daily life. Born in Atlantic City in 1917, he moved to Harlem at 13 and studied art at Utopia Children’s Center. He used bright colors and simplified shapes in his paintings. The Migration Series, widely regarded as Jacob Lawrence’s masterpiece, brought him national recognition. During World War II, he served in the U.S. Coast Guard and produced many paintings, but most of them were lost. Later, he taught at the University of Washington for 16 years. Throughout his lifetime, he received honorary degrees from several universities, including Harvard. Until a few weeks before his death, he continued to explore the lives of African-Americans through his painting.", "ko": "Jacob Lawrence는 아프리카계 미국인의 역사와 일상생활의 생생한 장면들로 알려진 미국인 화가였다. 1917년 Atlantic City에서 태어나서, 그는 13세에 Harlem으로 이주해 Utopia Children’s Center에서 미술을 공부했다. 그는 그의 그림들에 밝은 색채와 단순화된 형태를 사용했다. Jacob Lawrence의 걸작으로 널리 여겨지는 The Migration Series는 그가 전국적인 인정을 받게 해 주었다. 제2차 세계대전 동안, 그는 미국 해안 경비대에서 복무했으며 많은 그림을 제작했지만, 그것들 중 대부분이 소실되었다. 이후, 그는 Washington 대학교에서 16년 동안 가르쳤다. 그의 생애 동안, Harvard를 포함하여, 여러 대학교에서 명예 학위를 받았다. 그의 사망 몇 주 전까지도, 그는 그의 그림을 통해 아프리카계 미국인들의 삶을 계속 탐구했다.", "read": [{"en": "Jacob Lawrence was an American painter known for vivid scenes of African-American history and daily life.", "ko": "Jacob Lawrence는 아프리카계 미국인의 역사와 일상생활의 생생한 장면들로 알려진 미국인 화가였다.", "chunks": [["Jacob Lawrence was an American painter", "Jacob Lawrence는 미국인 화가였다"], ["known for vivid scenes", "생생한 장면들로 알려진"], ["of African-American history and daily life.", "아프리카계 미국인의 역사와 일상생활의."]]}, {"en": "Born in Atlantic City in 1917, he moved to Harlem at 13 and studied art at Utopia Children’s Center.", "ko": "1917년 Atlantic City에서 태어나서, 그는 13세에 Harlem으로 이주해 Utopia Children’s Center에서 미술을 공부했다.", "chunks": [["Born in Atlantic City in 1917,", "1917년 Atlantic City에서 태어나서,"], ["he moved to Harlem at 13", "그는 13세에 Harlem으로 이주했고"], ["and studied art at Utopia Children’s Center.", "Utopia Children’s Center에서 미술을 공부했다."]]}, {"en": "He used bright colors and simplified shapes in his paintings.", "ko": "그는 그의 그림들에 밝은 색채와 단순화된 형태를 사용했다.", "chunks": [["He used bright colors and simplified shapes", "그는 밝은 색채와 단순화된 형태를 사용했다"], ["in his paintings.", "그의 그림들에."]]}, {"en": "The Migration Series, widely regarded as Jacob Lawrence’s masterpiece, brought him national recognition.", "ko": "Jacob Lawrence의 걸작으로 널리 여겨지는 The Migration Series는 그가 전국적인 인정을 받게 해 주었다.", "chunks": [["The Migration Series,", "The Migration Series는,"], ["widely regarded as Jacob Lawrence’s masterpiece,", "Jacob Lawrence의 걸작으로 널리 여겨지는데,"], ["brought him national recognition.", "그가 전국적인 인정을 받게 해 주었다."]]}, {"en": "During World War II, he served in the U.S. Coast Guard and produced many paintings, but most of them were lost.", "ko": "제2차 세계대전 동안, 그는 미국 해안 경비대에서 복무했으며 많은 그림을 제작했지만, 그것들 중 대부분이 소실되었다.", "chunks": [["During World War II,", "제2차 세계대전 동안,"], ["he served in the U.S. Coast Guard", "그는 미국 해안 경비대에서 복무했고"], ["and produced many paintings,", "많은 그림을 제작했지만,"], ["but most of them were lost.", "그것들 중 대부분이 소실되었다."]]}, {"en": "Later, he taught at the University of Washington for 16 years.", "ko": "이후, 그는 Washington 대학교에서 16년 동안 가르쳤다.", "chunks": [["Later,", "이후,"], ["he taught at the University of Washington", "그는 Washington 대학교에서 가르쳤다"], ["for 16 years.", "16년 동안."]]}, {"en": "Throughout his lifetime, he received honorary degrees from several universities, including Harvard.", "ko": "그의 생애 동안, Harvard를 포함하여, 여러 대학교에서 명예 학위를 받았다.", "chunks": [["Throughout his lifetime,", "그의 생애 동안,"], ["he received honorary degrees", "그는 명예 학위를 받았다"], ["from several universities, including Harvard.", "Harvard를 포함하여 여러 대학교에서."]]}, {"en": "Until a few weeks before his death, he continued to explore the lives of African-Americans through his painting.", "ko": "그의 사망 몇 주 전까지도, 그는 그의 그림을 통해 아프리카계 미국인들의 삶을 계속 탐구했다.", "chunks": [["Until a few weeks before his death,", "그의 사망 몇 주 전까지도,"], ["he continued to explore the lives of African-Americans", "그는 아프리카계 미국인들의 삶을 계속 탐구했다"], ["through his painting.", "그의 그림을 통해."]]}]}, {"no": "no.29", "title": "Coupons That Save Thought, Not Just Money", "ktitle": "쿠폰은 돈만이 아니라 ‘생각’을 아껴 준다", "field": "심리 · 소비행동", "page": "2026 6월 학평 · no.29 (어법)", "oneline": "할인 쿠폰의 진짜 ‘진보’ = 돈만이 아니라 <span style=\"color:#1FA34A;font-weight:700\">생각하는 수고까지 덜어 주는 이중 임무</span> — <span style=\"color:#c8102e;font-weight:700\">절약 없는 쿠폰조차</span> 똑같은 반응을 끌어냈어요.", "metaphor": "<svg viewBox=\"0 0 600 258\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"할인 쿠폰 한 장이 동시에 지갑에 돈을 남기고 머리 위에 얽힌 생각의 매듭을 들어내, 돈 절약과 생각 수고 절약의 두 임무를 함께 하며, 아래에 절약이 0원인 쿠폰도 같은 머리 이완을 만들어 이중 임무를 증명함을 보여 주는 그림\">\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Coupons — 한 장이 두 일을 (이중 임무)</text>\n\n  <!-- 쿠폰 (좌, 두 출력의 가운데 높이) -->\n  <g transform=\"translate(34, 108)\">\n    <text x=\"60\" y=\"-30\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">할인 쿠폰</text>\n    <rect x=\"0\" y=\"-22\" width=\"120\" height=\"44\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <line x1=\"80\" y1=\"-22\" x2=\"80\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n    <circle cx=\"80\" cy=\"-22\" r=\"3.5\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n    <circle cx=\"80\" cy=\"22\" r=\"3.5\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n    <text x=\"40\" y=\"6\" font-family=\"Noto Serif\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">$</text>\n    <text x=\"100\" y=\"-3\" font-family=\"Noto Serif\" font-size=\"8\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">SAVE</text>\n    <text x=\"100\" y=\"11\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">쿠폰</text>\n  </g>\n\n  <!-- 두 갈래 초록 화살표 (동시에) -->\n  <g stroke=\"#1FA34A\" stroke-width=\"2\" fill=\"#1FA34A\">\n    <line x1=\"158\" y1=\"98\" x2=\"232\" y2=\"74\"/>\n    <polygon points=\"232,74 223,73 226,80\"/>\n    <line x1=\"158\" y1=\"118\" x2=\"232\" y2=\"158\"/>\n    <polygon points=\"232,158 223,155 226,162\"/>\n  </g>\n  <text x=\"192\" y=\"112\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">does both</text>\n\n  <!-- 출력 1: 돈 절약 (지갑 + 코인 들어감) -->\n  <g transform=\"translate(244, 50)\">\n    <text x=\"0\" y=\"-8\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#1FA34A\">① 돈 절약</text>\n    <rect x=\"0\" y=\"2\" width=\"62\" height=\"38\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <path d=\"M 0 14 L 62 14\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n    <rect x=\"46\" y=\"18\" width=\"14\" height=\"11\" rx=\"2\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n    <circle cx=\"86\" cy=\"8\" r=\"9\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n    <text x=\"86\" y=\"12\" font-family=\"Noto Serif\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">$</text>\n    <line x1=\"78\" y1=\"13\" x2=\"60\" y2=\"20\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n    <polygon points=\"60,20 67,18 66,24\" fill=\"#1FA34A\"/>\n    <text x=\"31\" y=\"54\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">money stays saved</text>\n  </g>\n\n  <!-- 출력 2: 생각 수고 절약 (머리 + 들려 나가는 매듭) -->\n  <g transform=\"translate(244, 132)\">\n    <text x=\"0\" y=\"0\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#1FA34A\">② 생각 수고 던다</text>\n    <!-- 머리 (이완) -->\n    <circle cx=\"18\" cy=\"40\" r=\"15\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <circle cx=\"12\" cy=\"38\" r=\"1.5\" fill=\"#1a1a1a\"/>\n    <circle cx=\"24\" cy=\"38\" r=\"1.5\" fill=\"#1a1a1a\"/>\n    <path d=\"M 11 46 Q 18 51 25 46\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <!-- 들려 나가는 생각 매듭 (strain) -->\n    <g transform=\"translate(40, 30)\">\n      <path d=\"M -8 0 Q -14 -7 -6 -9 Q 3 -10 -1 -3 Q -4 1 5 -1 Q 12 -3 8 -9\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.3\" stroke-dasharray=\"2 2\"/>\n      <line x1=\"12\" y1=\"-3\" x2=\"30\" y2=\"-15\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <polygon points=\"30,-15 22,-14 25,-8\" fill=\"#1FA34A\"/>\n      <text x=\"44\" y=\"-13\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" fill=\"#999\" font-weight=\"700\">brain strain</text>\n    </g>\n    <text x=\"40\" y=\"50\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">less mental effort</text>\n  </g>\n\n  <!-- 하단: $0 쿠폰 실험 = 증거 -->\n  <g transform=\"translate(20, 198)\">\n    <rect x=\"0\" y=\"0\" width=\"560\" height=\"50\" rx=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <!-- $0 쿠폰 아이콘 -->\n    <g transform=\"translate(20, 25)\">\n      <rect x=\"0\" y=\"-13\" width=\"54\" height=\"26\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>\n      <text x=\"27\" y=\"4\" font-family=\"Noto Serif\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">$0</text>\n      <line x1=\"6\" y1=\"11\" x2=\"48\" y2=\"-11\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n    </g>\n    <text x=\"110\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"9.5\" fill=\"#1a1a1a\" font-weight=\"700\">절약 0원 쿠폰도</text>\n    <text x=\"110\" y=\"36\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#5e5e5e\">saves no money at all</text>\n    <!-- 화살표 -->\n    <g transform=\"translate(235, 25)\" stroke=\"#1FA34A\" stroke-width=\"2\" fill=\"#1FA34A\">\n      <line x1=\"0\" y1=\"0\" x2=\"26\" y2=\"0\"/>\n      <polygon points=\"26,0 18,-5 18,5\"/>\n    </g>\n    <!-- 같은 이완 머리 + 체크 -->\n    <g transform=\"translate(290, 25)\">\n      <circle cx=\"0\" cy=\"0\" r=\"13\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-2\" r=\"1.2\" fill=\"#1FA34A\"/>\n      <circle cx=\"4\" cy=\"-2\" r=\"1.2\" fill=\"#1FA34A\"/>\n      <path d=\"M -5 4 Q 0 8 5 4\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n    </g>\n    <text x=\"335\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#1FA34A\">→ 같은 반응 (이완)</text>\n    <text x=\"335\" y=\"37\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1a1a1a\">∴ 진짜 값어치 = 생각 수고를 던 것 (이중 임무 증명)</text>\n  </g>\n</svg>", "caption": "‘쿠폰’ 한 장이 동전 주머니와 머릿속 톱니바퀴 양쪽에 동시에 ‘절약’ 도장을 찍는 그림.", "tldr": ["Whitehead: 문명은 <span style=\"color:#1FA34A;font-weight:700\">생각 없이 할 수 있는 작업을 늘림</span>으로써 진보한다 — 쿠폰이 그 예예요.", "타이어 회사 실험: <span style=\"color:#c8102e;font-weight:700\">절약이 전혀 없는(인쇄 오류) 쿠폰</span>도 진짜 할인 쿠폰만큼 반응을 일으켰어요.", "교훈: 우리는 쿠폰에 <span style=\"color:#1FA34A;font-weight:700\">이중 임무</span>를 기대해요 — 돈 + 생각하는 시간·정신적 에너지(두뇌 부담)까지 절약."], "analogy": "‘1+1’ 딱지만 보면 계산도 안 하고 집어 들죠. 진짜 이득인지 따지는 수고를 딱지가 대신 해 주니까요. 쿠폰은 지갑이 아니라 머리를 먼저 쉬게 해 주는 도구예요.", "bg": "분야는 소비심리예요. ‘price elasticity’가 아니라 여기선 ‘brain strain(두뇌 부담)’과 ‘double duty(이중 임무)’가 열쇠 — 쿠폰이 돈과 ‘생각’ 둘 다를 아껴 준다는 역설이죠. → Whitehead 인용(생각 없이 하는 작업 = 진보)이 쿠폰 실험으로 어떻게 증명되는지 따라가며 읽으세요.", "flow": [{"kind": "주제(인용)", "t": "Whitehead: 문명은 <span style=\"color:#1FA34A;font-weight:700\">생각 없이 할 수 있는 작업을 늘림</span>으로써 진보"}, {"kind": "예시 도입", "t": "할인 쿠폰 = 그 ‘진보’의 사례 — 제시하면 할인받으리라 가정하게 함"}, {"kind": "실험 도입", "t": "기계적으로 반응하는 정도를 타이어 회사 사례로 입증"}, {"kind": "실험 결과", "t": "<span style=\"color:#c8102e;font-weight:700\">절약이 전혀 없는 쿠폰</span>도 진짜 할인 쿠폰만큼 반응을 일으킴"}, {"kind": "요지", "t": "교훈 = 우리는 쿠폰에 <span style=\"color:#1FA34A;font-weight:700\">이중 임무</span>를 기대"}, {"kind": "결론", "t": "돈 절약뿐 아니라 생각하는 시간·정신적 에너지(두뇌 부담)까지 절약 기대"}], "vocab": [["renowned", "저명한·유명한"], ["assert", "주장하다·단언하다"], ["civilization", "문명"], ["advance", "진보·발전"], ["extend", "확장하다·늘리다"], ["operation", "작업·수행·동작"], ["consumer", "소비자"], ["assume", "가정하다·추정하다"], ["reduced", "할인된·줄어든"], ["extent", "정도·범위"], ["mechanically", "기계적으로·무의식적으로"], ["assumption", "가정·전제"], ["illustrate", "설명하다·예시하다"], ["recipient", "수령자·받는 사람"], ["substantial", "상당한"], ["instructive", "교훈적인·유익한"], ["do double duty", "이중 임무를 하다"], ["strain", "부담·압박"]], "quiz": [["‘절약 없는 쿠폰’ 실험이 증명한 것은?", "우리가 쿠폰을 보면 <b>따져 보지 않고 기계적으로 반응</b>한다는 것 — 진짜 할인이 없어도 똑같이 반응했어요."], ["쿠폰의 ‘이중 임무(double duty)’란?", "<b>돈을 아껴 주는 것</b>과, 어떻게 할지 <b>생각하는 시간·정신적 에너지를 아껴 주는 것</b> 두 가지예요."]], "en": "The renowned British philosopher Alfred North Whitehead asserted that “civilization advances by extending the number of operations we can perform without thinking about them.” Take, for example, the “advance” offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that ― because of a printing error ― offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. In today’s world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important ― brain strain.", "ko": "저명한 영국 철학자 Alfred North Whitehead는 “문명은 우리가 그것들에 대해 생각하지 않고 수행할 수 있는 작업들의 수를 확장함으로써 진보한다.”라고 주장했다. 예를 들어, 할인 쿠폰에 의해 문명에 제공되는 “진보”를 살펴보면, 이것은 소비자가 쿠폰을 제시함으로써 그들이 할인된 구매 가격을 받을 것이라고 가정하도록 해 준다. 우리가 그 가정에 기반하여 기계적으로 움직이는 법을 배워 온 정도는 한 자동차 타이어 회사의 경험에서 설명된다. 수령자에게 아무런 절약도 제공하지 않는 ― 인쇄 오류로 인해 ― 우편 발송된 쿠폰들이 상당한 절약을 제공했던 오류 없는 쿠폰들이 그랬던 것과 똑같이 많은 고객 반응을 만들어 냈다. 여기서 명백하지만 교훈적인 점은 우리가 할인 쿠폰들이 이중 임무를 수행할 것으로 기대한다는 것이다. 우리는 그것들이 우리에게 돈을 절약하게 해 줄 것을 기대할 뿐만 아니라, 또한 우리는 그것을 어떻게 할지에 대해 생각하는 데 필요한 시간과 정신적 에너지도 그것들이 절약해 줄 것으로 기대한다. 오늘날의 세상에서, 우리는 금전적인 부담을 처리하는 첫 번째 이점이 필요하지만, 우리는 잠재적으로 더 중요한 무언가를 처리하는 두 번째 이점도 필요하다 ― 두뇌 부담.", "read": [{"en": "The renowned British philosopher Alfred North Whitehead asserted that “civilization advances by extending the number of operations we can perform without thinking about them.”", "ko": "저명한 영국 철학자 Alfred North Whitehead는 “문명은 우리가 그것들에 대해 생각하지 않고 수행할 수 있는 작업들의 수를 확장함으로써 진보한다.”라고 주장했다.", "chunks": [["The renowned British philosopher Alfred North Whitehead asserted", "저명한 영국 철학자 Alfred North Whitehead는 주장했다"], ["that “civilization advances", "“문명은 진보한다"], ["by extending the number of operations", "작업들의 수를 확장함으로써"], ["we can perform without thinking about them.”", "우리가 그것들에 대해 생각하지 않고 수행할 수 있는.”라고."]]}, {"en": "Take, for example, the “advance” offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon.", "ko": "예를 들어, 할인 쿠폰에 의해 문명에 제공되는 “진보”를 살펴보면, 이것은 소비자가 쿠폰을 제시함으로써 그들이 할인된 구매 가격을 받을 것이라고 가정하도록 해 준다.", "chunks": [["Take, for example, the “advance”", "예를 들어, “진보”를 살펴보면"], ["offered to civilization by the discount coupon,", "할인 쿠폰에 의해 문명에 제공되는,"], ["which allows consumers to assume", "이것은 소비자가 가정하도록 해 준다"], ["that they will receive a reduced purchase price", "그들이 할인된 구매 가격을 받을 것이라고"], ["by presenting the coupon.", "쿠폰을 제시함으로써."]]}, {"en": "The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company.", "ko": "우리가 그 가정에 기반하여 기계적으로 움직이는 법을 배워 온 정도는 한 자동차 타이어 회사의 경험에서 설명된다.", "chunks": [["The extent to which we have learned", "우리가 배워 온 정도는"], ["to operate mechanically on that assumption", "그 가정에 기반하여 기계적으로 움직이는 법을"], ["is illustrated in the experience", "그 경험에서 설명된다"], ["of one automobile-tire company.", "한 자동차 타이어 회사의."]]}, {"en": "Mailed-out coupons that ― because of a printing error ― offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings.", "ko": "수령자에게 아무런 절약도 제공하지 않는 ― 인쇄 오류로 인해 ― 우편 발송된 쿠폰들이 상당한 절약을 제공했던 오류 없는 쿠폰들이 그랬던 것과 똑같이 많은 고객 반응을 만들어 냈다.", "chunks": [["Mailed-out coupons that", "우편 발송된 쿠폰들이"], ["― because of a printing error ―", "― 인쇄 오류로 인해 ―"], ["offered no savings to recipients", "수령자에게 아무런 절약도 제공하지 않는"], ["produced just as much customer response", "똑같이 많은 고객 반응을 만들어 냈다"], ["as did error-free coupons", "오류 없는 쿠폰들이 그랬던 것과"], ["that offered substantial savings.", "상당한 절약을 제공했던."]]}, {"en": "The obvious but instructive point here is that we expect discount coupons to do double duty.", "ko": "여기서 명백하지만 교훈적인 점은 우리가 할인 쿠폰들이 이중 임무를 수행할 것으로 기대한다는 것이다.", "chunks": [["The obvious but instructive point here", "여기서 명백하지만 교훈적인 점은"], ["is that we expect discount coupons", "우리가 할인 쿠폰들을 기대한다는 것이다"], ["to do double duty.", "이중 임무를 수행할 것으로."]]}, {"en": "Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it.", "ko": "우리는 그것들이 우리에게 돈을 절약하게 해 줄 것을 기대할 뿐만 아니라, 또한 우리는 그것을 어떻게 할지에 대해 생각하는 데 필요한 시간과 정신적 에너지도 그것들이 절약해 줄 것으로 기대한다.", "chunks": [["Not only do we expect them to save us money,", "우리는 그것들이 우리에게 돈을 절약하게 해 줄 것을 기대할 뿐만 아니라,"], ["we also expect them to save us", "또한 우리는 그것들이 우리에게 절약해 줄 것으로 기대한다"], ["the time and mental energy", "시간과 정신적 에너지도"], ["required to think about how to do it.", "그것을 어떻게 할지에 대해 생각하는 데 필요한."]]}, {"en": "In today’s world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important ― brain strain.", "ko": "오늘날의 세상에서, 우리는 금전적인 부담을 처리하는 첫 번째 이점이 필요하지만, 우리는 잠재적으로 더 중요한 무언가를 처리하는 두 번째 이점도 필요하다 ― 두뇌 부담.", "chunks": [["In today’s world, we need the first advantage", "오늘날의 세상에서, 우리는 첫 번째 이점이 필요하다"], ["to handle pocketbook strain;", "금전적인 부담을 처리하는;"], ["but we need the second advantage", "하지만 우리는 두 번째 이점도 필요하다"], ["to handle something potentially more important", "잠재적으로 더 중요한 무언가를 처리하는"], ["― brain strain.", "― 두뇌 부담."]]}]}, {"no": "no.30", "title": "Why High-Tech Prices Barely Move Demand", "ktitle": "첨단 제품 가격은 왜 수요를 거의 못 바꾸나", "field": "경제 · 마케팅", "page": "2026 6월 학평 · no.30 (어휘)", "oneline": "혁신적 첨단 제품은 <span style=\"color:#c8102e;font-weight:700\">가격 탄력성이 낮아요</span> — 대체품이 없고, 부유한 초기 구매자는 가격에 둔감하며, 높은 값은 오히려 <span style=\"color:#1FA34A;font-weight:700\">품질의 신호</span>로 작동합니다.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 가격이 크게 오르내려도 가운데를 지나 오른쪽 수요가 거의 변하지 않는 평평한 막대를 보여 주고, 아래에 대체품 부족·부유한 초기 구매자·높은 가격이 품질 신호라는 세 가지 이유를 적은 그림\">\n  <!-- 좌: 가격 큰 변동 -->\n  <g transform=\"translate(20, 28)\">\n    <text x=\"95\" y=\"-6\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">가격은 크게 변동</text>\n    <rect x=\"0\" y=\"4\" width=\"190\" height=\"120\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.2\"/>\n    <line x1=\"95\" y1=\"20\" x2=\"95\" y2=\"108\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <!-- 위 화살표 -->\n    <line x1=\"95\" y1=\"56\" x2=\"95\" y2=\"24\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <polygon points=\"95,24 90,33 100,33\" fill=\"#c8102e\"/>\n    <!-- 아래 화살표 -->\n    <line x1=\"95\" y1=\"72\" x2=\"95\" y2=\"104\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <polygon points=\"95,104 90,95 100,95\" fill=\"#c8102e\"/>\n    <text x=\"95\" y=\"68\" font-family=\"Noto Serif\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">price</text>\n    <text x=\"124\" y=\"40\" font-family=\"Noto Serif\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\">↑ raise</text>\n    <text x=\"124\" y=\"100\" font-family=\"Noto Serif\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\">↓ cut</text>\n  </g>\n\n  <!-- 가운데 -->\n  <g transform=\"translate(218, 90)\">\n    <line x1=\"0\" y1=\"0\" x2=\"46\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.8\"/>\n    <polygon points=\"46,0 38,-5 38,5\" fill=\"#1a1a1a\"/>\n    <text x=\"23\" y=\"-9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">but</text>\n  </g>\n\n  <!-- 우: 수요 거의 불변 -->\n  <g transform=\"translate(290, 28)\">\n    <text x=\"155\" y=\"-6\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">수요는 거의 그대로 — 낮은 탄력성</text>\n    <rect x=\"0\" y=\"4\" width=\"290\" height=\"120\" fill=\"#f0faf3\" fill-opacity=\"0.45\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <line x1=\"20\" y1=\"108\" x2=\"270\" y2=\"108\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <!-- 세 막대 거의 동일 높이 -->\n    <rect x=\"50\" y=\"50\" width=\"40\" height=\"58\" fill=\"#1FA34A\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n    <rect x=\"125\" y=\"47\" width=\"40\" height=\"61\" fill=\"#1FA34A\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n    <rect x=\"200\" y=\"52\" width=\"40\" height=\"56\" fill=\"#1FA34A\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n    <text x=\"70\" y=\"122\" font-family=\"Noto Serif\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">low price</text>\n    <text x=\"145\" y=\"122\" font-family=\"Noto Serif\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">mid</text>\n    <text x=\"220\" y=\"122\" font-family=\"Noto Serif\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">high price</text>\n    <text x=\"145\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">demand barely moves</text>\n  </g>\n\n  <!-- 하단: 3 이유 -->\n  <g transform=\"translate(0, 168)\">\n    <text x=\"36\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#1a1a1a\">왜? — 세 가지 이유</text>\n    <g font-family=\"Noto Serif KR\" font-size=\"9.5\">\n      <g transform=\"translate(36, 24)\">\n        <rect x=\"0\" y=\"0\" width=\"170\" height=\"58\" rx=\"5\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <text x=\"12\" y=\"22\" font-weight=\"700\" fill=\"#1a1a1a\">① 대체품이 거의 없음</text>\n        <text x=\"12\" y=\"42\" fill=\"#5e5e5e\" font-size=\"8.5\">few substitutes · high switching cost</text>\n      </g>\n      <g transform=\"translate(216, 24)\">\n        <rect x=\"0\" y=\"0\" width=\"170\" height=\"58\" rx=\"5\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n        <text x=\"12\" y=\"22\" font-weight=\"700\" fill=\"#1a1a1a\">② 부유한 초기 구매자</text>\n        <text x=\"12\" y=\"42\" fill=\"#5e5e5e\" font-size=\"8.5\">less sensitive to price</text>\n      </g>\n      <g transform=\"translate(396, 24)\">\n        <rect x=\"0\" y=\"0\" width=\"170\" height=\"58\" rx=\"5\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n        <text x=\"12\" y=\"22\" font-weight=\"700\" fill=\"#1FA34A\">③ 높은 가격 = 품질 신호</text>\n        <text x=\"12\" y=\"42\" fill=\"#5e5e5e\" font-size=\"8.5\">a sign of quality · builds trust</text>\n      </g>\n    </g>\n  </g>\n</svg>", "caption": "가격표가 위아래로 크게 흔들려도 수요 곡선은 거의 미동도 않는 그림 — 옆엔 백만장자 고객과 ‘프리미엄’ 라벨.", "tldr": ["혁신적 첨단 제품 = <span style=\"color:#c8102e;font-weight:700\">낮은 가격 탄력성</span> — 가격이 오르내려도 수요는 거의 그대로.", "이유 1) <span style=\"color:#c8102e;font-weight:700\">대체품이 거의 없어</span> 전환 비용이 높음 / 이유 2) 초기 구매자(혁신자·선구자)는 <span style=\"color:#c8102e;font-weight:700\">가격보다 성능</span>을 봄.", "고급 휴대폰은 부유층 겨냥 → 경쟁사도 같은 층을 노려 가격 인하 안 함 → 높은 가격은 <span style=\"color:#1FA34A;font-weight:700\">우수함의 신호</span>로 신뢰를 강화."], "analogy": "신상 명품 가방은 값을 올려도 줄이 더 길어지죠. ‘비싸다’가 흠이 아니라 ‘좋다’는 증표가 되니까요. 첨단 제품 초기 시장도 똑같은 심리로 돌아가요.", "bg": "분야는 경제·마케팅이에요. ‘price elasticity(가격 탄력성)’는 가격 변화에 수요가 얼마나 반응하는지를 가리키는 개념 — 낮을수록 가격을 바꿔도 수요가 안 변해요. → ‘왜 안 변하는가’의 이유들(대체품·구매자 성향·가격=품질 신호)이 어떻게 쌓이는지 세어 가며 읽으세요.", "flow": [{"kind": "주제", "t": "혁신적 첨단 제품 = <span style=\"color:#c8102e;font-weight:700\">낮은 가격 탄력성</span>"}, {"kind": "정의", "t": "가격이 크게 변해도(상승·하락) 수요는 거의 변하지 않음"}, {"kind": "이유 1", "t": "대체품이 거의 없어 전환 비용이 높음"}, {"kind": "이유 2", "t": "초기 구매자(혁신자·선구자)는 <span style=\"color:#c8102e;font-weight:700\">가격에 덜 민감</span>"}, {"kind": "예시", "t": "고급 휴대폰은 부유층 겨냥, 경쟁사도 같은 층을 노려 인하 안 함"}, {"kind": "결론", "t": "높은 가격은 <span style=\"color:#1FA34A;font-weight:700\">품질의 신호</span>로 인식되어 고객 신뢰 강화"}], "vocab": [["innovative", "혁신적인"], ["price elasticity", "가격 탄력성"], ["variation", "변동·변화"], ["modify", "바꾸다·변경하다"], ["demand", "수요"], ["substitute", "대체품"], ["switch", "전환하다·바꾸다"], ["sensitive", "민감한"], ["performance", "성능·수행"], ["forerunner", "선구자·전조"], ["have deep pockets", "자금력이 풍부하다"], ["outstanding", "뛰어난·두드러진"], ["range", "범위·제품군·대"], ["aim at", "겨냥하다·목표로 하다"], ["competitor", "경쟁사·경쟁자"], ["perceive", "인식하다·받아들이다"], ["reinforce", "강화하다"], ["confidence", "신뢰·자신감"]], "quiz": [["첨단 제품의 수요가 가격에 둔감한 두 이유는?", "<b>대체품이 거의 없어 전환 비용이 높고</b>, <b>부유한 초기 구매자가 가격보다 성능을 중시</b>하기 때문이에요."], ["높은 가격이 오히려 ‘도움’이 되는 이유는?", "높은 가격이 <b>우수함(품질)의 신호</b>로 인식되어 고객의 신뢰를 강화하기 때문이에요."]], "en": "Usually, innovative high-tech products have low price elasticity. This means that high variation in price, an increase as well as a decrease, does not significantly modify demand. These high-tech products have few substitutes, meaning that the costs to switch to another product are high. Additionally, at the first stage of the technology, buyers — either innovators or forerunners — are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product. For instance, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than $2.5 million; those are customers who are ready to accept the price range the manufacturer has set. At that stage, the competitors are not interested in lowering their price significantly whatsoever, because they are chasing the same categories of customers, not sensitive to price. Furthermore, the high price of these products is often perceived as a sign of quality and reinforces a customer’s confidence in the company.", "ko": "일반적으로, 혁신적인 첨단 기술 제품은 낮은 가격 탄력성을 지닌다. 이는, 하락뿐만 아니라 상승인, 높은 가격 변동이 수요를 크게 바꾸지 않는다는 것을 의미한다. 이러한 첨단 제품은 대체품이 거의 없는데, 이는 다른 제품으로 전환하는 비용이 높다는 것을 의미한다. 게다가, 기술 초기 단계에서, 구매자들은 — 혁신자들 또는 선구자들은 — 추가 성능보다 가격에 덜 민감하며, 그들은 흔히 자금력이 풍부하거나 혁신적이고 뛰어난 신제품에 많은 돈을 쓸 준비가 되어 있다. 예를 들어, 한 고급형 휴대전화 제조업체는, 그것의 새로운 제품군으로, 250만 달러가 넘는 자산을 가진 3퍼센트의 백만장자 가구를 겨냥하고 있는데, 그들은 제조업체가 선정한 가격대를 수용할 준비가 된 고객들이다. 그 단계에서, 경쟁사들은 그들의 가격을 크게 인하하는 데 전혀 관심이 없는데, 왜냐하면 그들은 가격에 민감하지 않은, 동일한 고객층을 겨냥하고 있기 때문이다. 더욱이, 이러한 제품들의 높은 가격은 흔히 우수함의 표시로 인식되고 그 회사에 대한 고객의 신뢰를 강화한다.", "read": [{"en": "Usually, innovative high-tech products have low price elasticity.", "ko": "일반적으로, 혁신적인 첨단 기술 제품은 낮은 가격 탄력성을 지닌다.", "chunks": [["Usually, innovative high-tech products", "일반적으로, 혁신적인 첨단 기술 제품은"], ["have low price elasticity.", "낮은 가격 탄력성을 지닌다."]]}, {"en": "This means that high variation in price, an increase as well as a decrease, does not significantly modify demand.", "ko": "이는, 하락뿐만 아니라 상승인, 높은 가격 변동이 수요를 크게 바꾸지 않는다는 것을 의미한다.", "chunks": [["This means that high variation in price,", "이는 높은 가격 변동이 ~ 의미한다,"], ["an increase as well as a decrease,", "하락뿐만 아니라 상승인,"], ["does not significantly modify demand.", "수요를 크게 바꾸지 않는다는 것을."]]}, {"en": "These high-tech products have few substitutes, meaning that the costs to switch to another product are high.", "ko": "이러한 첨단 제품은 대체품이 거의 없는데, 이는 다른 제품으로 전환하는 비용이 높다는 것을 의미한다.", "chunks": [["These high-tech products have few substitutes,", "이러한 첨단 제품은 대체품이 거의 없는데,"], ["meaning that the costs to switch to another product", "이는 다른 제품으로 전환하는 비용이 ~ 의미한다"], ["are high.", "높다는 것을."]]}, {"en": "Additionally, at the first stage of the technology, buyers — either innovators or forerunners — are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product.", "ko": "게다가, 기술 초기 단계에서, 구매자들은 — 혁신자들 또는 선구자들은 — 추가 성능보다 가격에 덜 민감하며, 그들은 흔히 자금력이 풍부하거나 혁신적이고 뛰어난 신제품에 많은 돈을 쓸 준비가 되어 있다.", "chunks": [["Additionally, at the first stage of the technology,", "게다가, 기술 초기 단계에서,"], ["buyers — either innovators or forerunners —", "구매자들은 — 혁신자들 또는 선구자들은 —"], ["are less sensitive to price than to additional performance;", "추가 성능보다 가격에 덜 민감하며;"], ["they often have deep pockets or are ready to spend a lot", "그들은 흔히 자금력이 풍부하거나 많은 돈을 쓸 준비가 되어 있다"], ["for a new innovative and outstanding product.", "혁신적이고 뛰어난 신제품에."]]}, {"en": "For instance, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than $2.5 million; those are customers who are ready to accept the price range the manufacturer has set.", "ko": "예를 들어, 한 고급형 휴대전화 제조업체는, 그것의 새로운 제품군으로, 250만 달러가 넘는 자산을 가진 3퍼센트의 백만장자 가구를 겨냥하고 있는데, 그들은 제조업체가 선정한 가격대를 수용할 준비가 된 고객들이다.", "chunks": [["For instance, with its new product range,", "예를 들어, 그것의 새로운 제품군으로,"], ["a high-end mobile phone manufacturer is aiming at", "한 고급형 휴대전화 제조업체는 겨냥하고 있다"], ["the 3% of millionaire households with assets of more than $2.5 million;", "250만 달러가 넘는 자산을 가진 3퍼센트의 백만장자 가구를;"], ["those are customers who are ready to accept", "그들은 ~ 수용할 준비가 된 고객들이다"], ["the price range the manufacturer has set.", "제조업체가 선정한 가격대를."]]}, {"en": "At that stage, the competitors are not interested in lowering their price significantly whatsoever, because they are chasing the same categories of customers, not sensitive to price.", "ko": "그 단계에서, 경쟁사들은 그들의 가격을 크게 인하하는 데 전혀 관심이 없는데, 왜냐하면 그들은 가격에 민감하지 않은, 동일한 고객층을 겨냥하고 있기 때문이다.", "chunks": [["At that stage, the competitors are not interested", "그 단계에서, 경쟁사들은 관심이 없는데"], ["in lowering their price significantly whatsoever,", "그들의 가격을 크게 인하하는 데 전혀,"], ["because they are chasing the same categories of customers,", "왜냐하면 그들은 동일한 고객층을 겨냥하고 있기 때문이다,"], ["not sensitive to price.", "가격에 민감하지 않은."]]}, {"en": "Furthermore, the high price of these products is often perceived as a sign of quality and reinforces a customer’s confidence in the company.", "ko": "더욱이, 이러한 제품들의 높은 가격은 흔히 우수함의 표시로 인식되고 그 회사에 대한 고객의 신뢰를 강화한다.", "chunks": [["Furthermore, the high price of these products", "더욱이, 이러한 제품들의 높은 가격은"], ["is often perceived as a sign of quality", "흔히 우수함의 표시로 인식되고"], ["and reinforces a customer’s confidence in the company.", "그 회사에 대한 고객의 신뢰를 강화한다."]]}]}, {"no": "no.31", "title": "The Future-Proof City Street", "ktitle": "거리는 ‘미래에 강한’ 기술이다", "field": "도시 · 건축", "page": "2026 6월 학평 · no.31 (빈칸 추론)", "oneline": "도시의 거리·광장은 <span style=\"color:#1FA34A;font-weight:700\">같은 기반 시설 위에서 파는 물건만 바꿔 가며</span> 시대를 견뎌 내는 <span style=\"color:#1FA34A;font-weight:700\">‘미래 적응형(future-proof)’ 기술</span>입니다.", "metaphor": "<svg viewBox=\"0 0 600 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"외형이 똑같은 가게 건물 네 채가 같은 거리 위에 늘어서 있고, 간판과 진열창의 물건만 마차 채찍에서 타자기, 휴대폰 수리, 버블티로 시대에 따라 바뀌어, 동일한 기반시설이 진화하는 용도를 지원함을 보여 주는 그림\">\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">The Future-Proof Street — 같은 건물, 간판만 시대따라 교체</text>\n\n  <!-- 4채의 동일한 건물 (외형 동일·간판/진열품만 다름) -->\n  <!-- building template: 지붕 + 벽 + 간판띠 + 진열창 + 문 -->\n  <!-- 1. 마차 채찍 -->\n  <g transform=\"translate(30, 40)\">\n    <path d=\"M 0 22 L 56 3 L 112 22 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <rect x=\"4\" y=\"22\" width=\"104\" height=\"82\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <rect x=\"4\" y=\"22\" width=\"104\" height=\"13\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n    <text x=\"56\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">마차 채찍</text>\n    <rect x=\"18\" y=\"40\" width=\"76\" height=\"30\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <rect x=\"46\" y=\"78\" width=\"20\" height=\"26\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <g transform=\"translate(56, 55)\" stroke=\"#1a1a1a\" stroke-width=\"1.4\" fill=\"none\"><line x1=\"-12\" y1=\"8\" x2=\"-3\" y2=\"-7\"/><path d=\"M -3 -7 Q 10 -10 7 0 Q 5 9 13 7\"/></g>\n  </g>\n  <!-- 2. 타자기 -->\n  <g transform=\"translate(160, 40)\">\n    <path d=\"M 0 22 L 56 3 L 112 22 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <rect x=\"4\" y=\"22\" width=\"104\" height=\"82\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <rect x=\"4\" y=\"22\" width=\"104\" height=\"13\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n    <text x=\"56\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">타자기</text>\n    <rect x=\"18\" y=\"40\" width=\"76\" height=\"30\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <rect x=\"46\" y=\"78\" width=\"20\" height=\"26\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <g transform=\"translate(56, 55)\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"><rect x=\"-13\" y=\"-1\" width=\"26\" height=\"12\" fill=\"#ffffff\"/><rect x=\"-7\" y=\"-11\" width=\"14\" height=\"10\" fill=\"#ffffff\"/><line x1=\"-9\" y1=\"3\" x2=\"9\" y2=\"3\"/><line x1=\"-9\" y1=\"7\" x2=\"9\" y2=\"7\"/></g>\n  </g>\n  <!-- 3. 휴대폰 수리 -->\n  <g transform=\"translate(290, 40)\">\n    <path d=\"M 0 22 L 56 3 L 112 22 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <rect x=\"4\" y=\"22\" width=\"104\" height=\"82\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <rect x=\"4\" y=\"22\" width=\"104\" height=\"13\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n    <text x=\"56\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">휴대폰 수리</text>\n    <rect x=\"18\" y=\"40\" width=\"76\" height=\"30\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <rect x=\"46\" y=\"78\" width=\"20\" height=\"26\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <g transform=\"translate(56, 55)\"><rect x=\"-9\" y=\"-12\" width=\"16\" height=\"24\" rx=\"2\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/><circle cx=\"-1\" cy=\"8\" r=\"1.3\" fill=\"#1a1a1a\"/><line x1=\"9\" y1=\"-9\" x2=\"16\" y2=\"-2\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/><circle cx=\"16\" cy=\"-2\" r=\"2.4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/></g>\n  </g>\n  <!-- 4. 버블티 -->\n  <g transform=\"translate(420, 40)\">\n    <path d=\"M 0 22 L 56 3 L 112 22 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <rect x=\"4\" y=\"22\" width=\"104\" height=\"82\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <rect x=\"4\" y=\"22\" width=\"104\" height=\"13\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n    <text x=\"56\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">버블티</text>\n    <rect x=\"18\" y=\"40\" width=\"76\" height=\"30\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <rect x=\"46\" y=\"78\" width=\"20\" height=\"26\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <g transform=\"translate(56, 54)\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"><path d=\"M -9 -10 L 9 -10 L 7 12 L -7 12 Z\" fill=\"#ffffff\"/><line x1=\"3\" y1=\"-16\" x2=\"6\" y2=\"-10\"/><circle cx=\"-3\" cy=\"8\" r=\"1.6\" fill=\"#1a1a1a\" stroke=\"none\"/><circle cx=\"2\" cy=\"9\" r=\"1.6\" fill=\"#1a1a1a\" stroke=\"none\"/><circle cx=\"5\" cy=\"6\" r=\"1.6\" fill=\"#1a1a1a\" stroke=\"none\"/></g>\n  </g>\n\n  <!-- 시대 진행 화살표 (건물 사이, 검정) -->\n  <g stroke=\"#1a1a1a\" stroke-width=\"1.4\" fill=\"#1a1a1a\">\n    <line x1=\"144\" y1=\"80\" x2=\"158\" y2=\"80\"/><polygon points=\"158,80 151,76.5 151,83.5\"/>\n    <line x1=\"274\" y1=\"80\" x2=\"288\" y2=\"80\"/><polygon points=\"288,80 281,76.5 281,83.5\"/>\n    <line x1=\"404\" y1=\"80\" x2=\"418\" y2=\"80\"/><polygon points=\"418,80 411,76.5 411,83.5\"/>\n  </g>\n\n  <!-- 동일한 거리·기반시설 (초록 띠 = 변하지 않는 토대) -->\n  <rect x=\"20\" y=\"146\" width=\"560\" height=\"20\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n  <text x=\"40\" y=\"160\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#5e5e5e\">과거</text>\n  <text x=\"300\" y=\"160\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">동일한 거리 · 기반시설 — 변하지 않음 (same infrastructure)</text>\n  <text x=\"560\" y=\"160\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"end\" fill=\"#5e5e5e\">현재</text>\n\n  <!-- ★ 빈칸·결론 strip -->\n  <rect x=\"40\" y=\"176\" width=\"520\" height=\"80\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n  <text x=\"58\" y=\"196\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1FA34A\">★ 동일한 기반시설이 진화하는 용도를 지원한다</text>\n  <text x=\"58\" y=\"213\" font-family=\"Noto Serif\" font-size=\"9\" fill=\"#5e5e5e\">The same infrastructure supports evolving uses.</text>\n  <text x=\"58\" y=\"230\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#1a1a1a\">→ 그래서 거리·광장은 온라인 시대에도 살아남는 <tspan font-weight=\"700\">미래 적응형(future-proof)</tspan> 기술</text>\n  <text x=\"58\" y=\"247\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#5e5e5e\" font-style=\"italic\">— 도시경제학자 <tspan font-style=\"normal\" font-weight=\"700\">Jane Jacobs</tspan>가 《The Death and Life of Great American Cities》에서 강조</text>\n</svg>", "caption": "한 자리의 상점 간판이 ‘마차 채찍 → 타자기 → 휴대폰 수리 → 버블티’로 시대마다 바뀌어 걸리지만 건물은 그대로인 그림.", "tldr": ["중세 광장(Marrakesh·Siena)은 <span style=\"color:#1FA34A;font-weight:700\">파는 물건이 500년간 바뀌어도</span> 여전히 매일 장이 서요.", "한 상점이 마차 채찍·타자기 → 휴대폰 수리·버블티로 — <span style=\"color:#1FA34A;font-weight:700\">같은 기반 시설이 진화하는 용도를 지원</span>합니다.", "Jane Jacobs: 도시 건축의 큰 이점은 <span style=\"color:#1FA34A;font-weight:700\">용도 변화를 지원하는 능력</span> — 그래서 거리는 온라인 시대에도 살아남아요."], "analogy": "오래된 한옥이 카페가 됐다가 서점이 됐다가 갤러리가 되죠. 집은 그대로인데 쓰임만 갈아입어요. 도시의 거리는 그렇게 ‘용도를 갈아입으며’ 수백 년을 버티는 옷걸이 같은 거예요.", "bg": "분야는 도시학·건축이에요. ‘future-proof(미래를 견뎌 내는)’가 핵심어이고, ‘infrastructure(기반 시설)’는 그대로 둔 채 용도만 바뀐다는 게 논지. Jane Jacobs는 도시 경제를 통찰한 저술가예요. → 중세 광장·상점 예시가 빈칸 문장(같은 기반 시설이 무엇을 지원하나)으로 어떻게 모이는지 따라가며 읽으세요.", "flow": [{"kind": "주제", "t": "도시 거리·광장의 핵심 특성 = ‘미래를 견뎌 내는’ 속성"}, {"kind": "예시 1", "t": "중세 광장: 파는 물건은 바뀌어도 여전히 매일 장이 섬"}, {"kind": "확장", "t": "광장·쇼핑 거리는 온라인 시대에도 살아남는 future-proof 기술"}, {"kind": "예시 2", "t": "같은 상점이 마차 채찍·타자기 → 휴대폰 수리·버블티로 용도 전환"}, {"kind": "핵심(빈칸)", "t": "동일한 기반 시설이 <span style=\"color:#1FA34A;font-weight:700\">진화하는 용도들을 지원</span>"}, {"kind": "결론(권위)", "t": "Jane Jacobs: 건축의 이점 = 용도 변화 지원 능력"}], "vocab": [["underappreciated", "과소평가되는"], ["feature", "특징·특성"], ["future-proof", "미래를 견뎌 내는·미래 적응형의"], ["medieval", "중세의"], ["square", "광장"], ["fairly", "상당히·꽤"], ["infrastructure", "기반 시설"], ["evolving", "진화하는·변화하는"], ["prophet", "예언자"], ["make much of", "~을 중시하다"], ["architecture", "건축·구조"], ["persistence", "지속성·끈기"], ["predict", "예측하다"], ["rise", "부상·등장"], ["unlike", "~와 달리"]], "quiz": [["거리·광장이 ‘미래에 강한’ 이유는?", "<b>같은 기반 시설을 그대로 두고 파는 물건(용도)만 바꿔 가며</b> 시대 변화에 적응하기 때문이에요."], ["Jane Jacobs가 강조한 도시 건축의 이점은?", "<b>용도들의 변화를 지원하는 능력</b> — 그 능력이 도시의 지속성을 만든다고 봤어요."]], "en": "One easily underappreciated feature of a city street or square is its “future-proof” nature. The ancient medieval squares in places like Marrakesh and Siena are still places where stuff is sold every day, even if the stuff itself has changed over the last five hundred years. The city square is a fairly future-proof technology, as is the shopping street, even in an age of online shopping. For example, the same physical store that once sold buggy whips and typewriters might now repair damaged phones and sell bubble tea. The same infrastructure supports evolving uses. Jane Jacobs, the great prophet of the city economy, made much of this fact in her books, including The Death and Life of Great American Cities and The Nature of Economies. As she pointed out, the great advantage of a city architecture is its ability to support change in uses, and Jacobs correctly predicted the persistence of the city itself, unlike those who predicted the rise of the Internet would mean the death of the city.", "ko": "도시의 거리나 광장에 대한 한 가지 쉽게 과소평가되는 특징은 그것의 “미래를 견뎌 내는” 속성이다. Marrakesh와 Siena 같은 장소들 안의 먼 옛날의 중세 광장들은, 비록 물건 자체가 지난 오백 년 동안에 걸쳐 바뀌었을지라도, 여전히 매일 물건이 팔리는 장소들이다. 도시 광장은, 쇼핑 거리가 그렇듯, 온라인 쇼핑의 시대에서조차, 상당히 미래를 견뎌 내는 기술이다. 예를 들어, 한때 마차 채찍과 타자기를 팔았던 동일한 물리적 상점이 지금은 손상된 전화기들을 수리하고 버블티를 팔지도 모른다. 동일한 기반 시설이 진화하는 용도들을 지원한다. 도시 경제의 위대한 예언자인 Jane Jacobs는, The Death and Life of Great American Cities와 The Nature of Economies를 포함하는 그녀의 책들에서, 이 사실을 많이 중시했다. 그녀가 지적했듯이, 도시 건축의 큰 이점은 용도들의 변화를 지원하는 그것의 능력이며, 그리고 Jacobs는, 인터넷의 부상이 도시의 소멸을 의미할 것이라고 예측했던 사람들과는 달리, 도시 그 자체의 지속성을 정확히 예측했다.", "read": [{"en": "One easily underappreciated feature of a city street or square is its “future-proof” nature.", "ko": "도시의 거리나 광장에 대한 한 가지 쉽게 과소평가되는 특징은 그것의 “미래를 견뎌 내는” 속성이다.", "chunks": [["One easily underappreciated feature", "쉽게 과소평가되는 한 가지 특징은"], ["of a city street or square", "도시의 거리나 광장에 대한"], ["is its “future-proof” nature.", "그것의 “미래를 견뎌 내는” 속성이다."]]}, {"en": "The ancient medieval squares in places like Marrakesh and Siena are still places where stuff is sold every day, even if the stuff itself has changed over the last five hundred years.", "ko": "Marrakesh와 Siena 같은 장소들 안의 먼 옛날의 중세 광장들은, 비록 물건 자체가 지난 오백 년 동안에 걸쳐 바뀌었을지라도, 여전히 매일 물건이 팔리는 장소들이다.", "chunks": [["The ancient medieval squares in places like Marrakesh and Siena", "Marrakesh와 Siena 같은 장소들 안의 먼 옛날의 중세 광장들은,"], ["are still places where stuff is sold every day,", "여전히 매일 물건이 팔리는 장소들이다,"], ["even if the stuff itself has changed", "비록 물건 자체가 바뀌었을지라도"], ["over the last five hundred years.", "지난 오백 년 동안에 걸쳐."]]}, {"en": "The city square is a fairly future-proof technology, as is the shopping street, even in an age of online shopping.", "ko": "도시 광장은, 쇼핑 거리가 그렇듯, 온라인 쇼핑의 시대에서조차, 상당히 미래를 견뎌 내는 기술이다.", "chunks": [["The city square is a fairly future-proof technology,", "도시 광장은 상당히 미래를 견뎌 내는 기술이다,"], ["as is the shopping street,", "쇼핑 거리가 그렇듯,"], ["even in an age of online shopping.", "온라인 쇼핑의 시대에서조차."]]}, {"en": "For example, the same physical store that once sold buggy whips and typewriters might now repair damaged phones and sell bubble tea.", "ko": "예를 들어, 한때 마차 채찍과 타자기를 팔았던 동일한 물리적 상점이 지금은 손상된 전화기들을 수리하고 버블티를 팔지도 모른다.", "chunks": [["For example, the same physical store", "예를 들어, 동일한 물리적 상점이"], ["that once sold buggy whips and typewriters", "한때 마차 채찍과 타자기를 팔았던"], ["might now repair damaged phones and sell bubble tea.", "지금은 손상된 전화기들을 수리하고 버블티를 팔지도 모른다."]]}, {"en": "The same infrastructure supports evolving uses.", "ko": "동일한 기반 시설이 진화하는 용도들을 지원한다.", "chunks": [["The same infrastructure supports evolving uses.", "동일한 기반 시설이 진화하는 용도들을 지원한다."]]}, {"en": "Jane Jacobs, the great prophet of the city economy, made much of this fact in her books, including The Death and Life of Great American Cities and The Nature of Economies.", "ko": "도시 경제의 위대한 예언자인 Jane Jacobs는, The Death and Life of Great American Cities와 The Nature of Economies를 포함하는 그녀의 책들에서, 이 사실을 많이 중시했다.", "chunks": [["Jane Jacobs, the great prophet of the city economy,", "도시 경제의 위대한 예언자인 Jane Jacobs는,"], ["made much of this fact in her books,", "이 사실을 그녀의 책들에서 많이 중시했다,"], ["including The Death and Life of Great American Cities and The Nature of Economies.", "The Death and Life of Great American Cities와 The Nature of Economies를 포함하는."]]}, {"en": "As she pointed out, the great advantage of a city architecture is its ability to support change in uses, and Jacobs correctly predicted the persistence of the city itself, unlike those who predicted the rise of the Internet would mean the death of the city.", "ko": "그녀가 지적했듯이, 도시 건축의 큰 이점은 용도들의 변화를 지원하는 그것의 능력이며, 그리고 Jacobs는, 인터넷의 부상이 도시의 소멸을 의미할 것이라고 예측했던 사람들과는 달리, 도시 그 자체의 지속성을 정확히 예측했다.", "chunks": [["As she pointed out,", "그녀가 지적했듯이,"], ["the great advantage of a city architecture", "도시 건축의 큰 이점은"], ["is its ability to support change in uses,", "용도들의 변화를 지원하는 그것의 능력이며,"], ["and Jacobs correctly predicted the persistence of the city itself,", "그리고 Jacobs는 도시 그 자체의 지속성을 정확히 예측했다,"], ["unlike those who predicted the rise of the Internet would mean the death of the city.", "인터넷의 부상이 도시의 소멸을 의미할 것이라고 예측했던 사람들과는 달리."]]}]}, {"no": "no.32", "title": "How Touch Slows a Plant’s Growth", "ktitle": "건드리기만 해도 식물은 성장을 멈춘다", "field": "생물 · 식물학", "page": "2026 6월 학평 · no.32 (빈칸 추론)", "oneline": "접촉만으로 식물은 유전자 발현을 대대적으로 바꿔 — 에너지를 성장에서 돌려 — <span style=\"color:#c8102e;font-weight:700\">위로 자라는 성장을 억제</span>합니다(반복 접촉 시 최대 30% 감소).", "metaphor": "<svg viewBox=\"0 0 600 264\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"식물에 접촉이 가해지면 30분 안에 게놈의 10퍼센트가 변형되고 에너지가 성장에서 다른 곳으로 전환되어 위로 자라는 성장이 최대 30퍼센트까지 억제된다는 인과 사슬 그림\">\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">How Touch Slows a Plant’s Growth — 접촉 → 유전자 반응 → 성장 억제</text>\n\n  <!-- 인과 사슬 3박스 -->\n  <g font-family=\"Noto Serif KR\" text-anchor=\"middle\">\n    <!-- ① 접촉 -->\n    <rect x=\"26\" y=\"58\" width=\"120\" height=\"92\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"86\" y=\"78\" font-size=\"10\" font-weight=\"700\">① 접촉 (touch)</text>\n    <!-- 붓 아이콘: 손잡이 + 솔 -->\n    <line x1=\"64\" y1=\"120\" x2=\"92\" y2=\"100\" stroke=\"#1a1a1a\" stroke-width=\"2\"/>\n    <path d=\"M92 100 L104 96 L108 104 L96 108 Z\" fill=\"#1a1a1a\"/>\n    <line x1=\"60\" y1=\"128\" x2=\"112\" y2=\"128\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n    <text x=\"86\" y=\"143\" font-family=\"Noto Serif\" font-size=\"8\" fill=\"#5e5e5e\">brush stroke</text>\n    <!-- ② 게놈 변형 -->\n    <rect x=\"186\" y=\"58\" width=\"120\" height=\"92\" rx=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n    <text x=\"246\" y=\"80\" font-size=\"10\" font-weight=\"700\" fill=\"#c8102e\">② 게놈 10% 변형</text>\n    <text x=\"246\" y=\"100\" font-family=\"Noto Serif\" font-size=\"15\" font-weight=\"700\" fill=\"#c8102e\">10%</text>\n    <text x=\"246\" y=\"120\" font-size=\"8.5\" fill=\"#5e5e5e\">30분 이내</text>\n    <text x=\"246\" y=\"135\" font-family=\"Noto Serif\" font-size=\"8\" fill=\"#5e5e5e\">genome altered</text>\n    <!-- ③ 에너지 전환 -->\n    <rect x=\"346\" y=\"58\" width=\"120\" height=\"92\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"406\" y=\"80\" font-size=\"10\" font-weight=\"700\">③ 에너지 전환</text>\n    <text x=\"406\" y=\"100\" font-size=\"8.5\" fill=\"#5e5e5e\">성장 → 다른 곳</text>\n    <text x=\"406\" y=\"118\" font-family=\"Noto Serif\" font-size=\"8\" fill=\"#5e5e5e\">energy rerouted</text>\n    <text x=\"406\" y=\"135\" font-family=\"Noto Serif\" font-size=\"8\" fill=\"#5e5e5e\">away from height</text>\n  </g>\n  <!-- 화살표 -->\n  <g stroke=\"#1a1a1a\" stroke-width=\"1.4\" fill=\"#1a1a1a\">\n    <line x1=\"146\" y1=\"104\" x2=\"184\" y2=\"104\"/><polygon points=\"184,104 177,100.5 177,107.5\"/>\n    <line x1=\"306\" y1=\"104\" x2=\"344\" y2=\"104\"/><polygon points=\"344,104 337,100.5 337,107.5\"/>\n  </g>\n  <!-- → 결과: 성장 억제 (식물 키 비교) -->\n  <line x1=\"466\" y1=\"104\" x2=\"496\" y2=\"104\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n  <polygon points=\"496,104 489,100.5 489,107.5\" fill=\"#1a1a1a\"/>\n  <!-- 정상 식물 (초록 실선, 큼) -->\n  <g>\n    <line x1=\"512\" y1=\"150\" x2=\"512\" y2=\"74\" stroke=\"#1FA34A\" stroke-width=\"2.4\"/>\n    <path d=\"M512 92 q-12 -8 -18 4 q12 4 18 -4\" fill=\"#1FA34A\"/>\n    <path d=\"M512 104 q12 -8 18 4 q-12 4 -18 -4\" fill=\"#1FA34A\"/>\n    <line x1=\"500\" y1=\"150\" x2=\"524\" y2=\"150\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <text x=\"512\" y=\"164\" font-family=\"Noto Serif KR\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">정상</text>\n  </g>\n  <!-- 접촉 식물 (짧음, 빨강 −30%) -->\n  <g>\n    <line x1=\"558\" y1=\"150\" x2=\"558\" y2=\"110\" stroke=\"#c8102e\" stroke-width=\"2.4\"/>\n    <path d=\"M558 118 q-10 -6 -15 3 q10 3 15 -3\" fill=\"#c8102e\"/>\n    <line x1=\"546\" y1=\"150\" x2=\"570\" y2=\"150\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <text x=\"558\" y=\"164\" font-family=\"Noto Serif\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">−30%</text>\n  </g>\n  <line x1=\"500\" y1=\"74\" x2=\"572\" y2=\"74\" stroke=\"#999\" stroke-width=\"0.7\" stroke-dasharray=\"3 3\"/>\n\n  <!-- ★ 빈칸·결론 strip -->\n  <rect x=\"26\" y=\"186\" width=\"548\" height=\"58\" rx=\"6\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n  <text x=\"44\" y=\"208\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" fill=\"#c8102e\">★ 접촉만으로 유전자 발현이 극적으로 바뀌어 — 위로 자라는 성장을 억제한다</text>\n  <text x=\"44\" y=\"228\" font-family=\"Noto Serif\" font-size=\"9\" fill=\"#5e5e5e\">Touch triggers a dramatic genetic response that <tspan font-weight=\"700\" fill=\"#c8102e\">inhibits their growth</tspan> (up to −30%).</text>\n</svg>", "caption": "붓이 잎을 스치는 순간 식물 안쪽의 유전자 스위치들이 줄줄이 켜지고, 위로 뻗던 줄기가 멈칫하는 그림.", "tldr": ["유전체학 덕분에 <span style=\"color:#1FA34A;font-weight:700\">접촉이 식물에 미치는 영향</span>을 깊이 확인할 수 있게 됐어요.", "붓으로 쓰다듬은 지 <span style=\"color:#c8102e;font-weight:700\">30분 이내에 게놈의 10%가 변형</span> — 식물이 우선순위를 재편하고 성장에서 에너지를 돌려요.", "반복 접촉 시 위로 자라는 성장률을 <span style=\"color:#c8102e;font-weight:700\">최대 30%까지</span> 줄였습니다 — 접촉이 성장을 억제하는 거죠."], "analogy": "누가 자꾸 어깨를 툭툭 치면 하던 일에 집중을 못 하죠. 식물도 자꾸 건드리면 ‘키 크기’ 작업을 멈추고 경계 태세로 에너지를 돌려요. 바람 많은 곳 나무가 키는 작고 단단한 이유예요.", "bg": "분야는 식물학·유전체학이에요. ‘genomics(유전체학)’는 유전자 전체를 분석하는 분야, ‘Arabidopsis(애기장대)’는 식물 연구의 ‘실험용 쥐’예요. ‘gene expression(유전자 발현)’이 핵심어. → 접촉 → 유전자 변화 → 에너지 재배분 → 성장 억제로 이어지는 인과 사슬을 따라가며 읽으세요.", "flow": [{"kind": "도입", "t": "유전체학 덕분에 접촉이 식물에 미치는 영향을 깊이 확인 가능"}, {"kind": "핵심(빈칸)", "t": "접촉이 호르몬·유전자 발현에 극적 반응 → <span style=\"color:#c8102e;font-weight:700\">성장을 억제</span>"}, {"kind": "실험 방법", "t": "붓으로 쓰다듬은 뒤 식물의 유전적 반응을 분석"}, {"kind": "결과 1", "t": "접촉 30분 이내에 <span style=\"color:#c8102e;font-weight:700\">게놈의 10%가 변형</span>"}, {"kind": "해석", "t": "우선순위를 재편하고 성장에서 에너지를 다른 곳으로 돌림"}, {"kind": "결과 2", "t": "반복 접촉 시 위로 자라는 성장률을 <span style=\"color:#c8102e;font-weight:700\">최대 30%까지 감소</span>"}], "vocab": [["genomics", "유전체학"], ["revolution", "혁명·대변혁"], ["impactful", "영향력 있는"], ["peer at", "유심히 들여다보다"], ["weedy", "잡초 같은·잡초가 무성한"], ["trigger", "유발하다·촉발하다"], ["dramatic", "극적인·급격한"], ["gene expression", "유전자 발현"], ["substantially", "상당히·크게"], ["inhibit", "억제하다·저해하다"], ["stroke", "쓰다듬다"], ["analyze", "분석하다"], ["alter", "변형하다·바꾸다"], ["reorganize", "재조직하다·재편하다"], ["priority", "우선순위"], ["disturbance", "교란·방해"], ["reroute", "경로를 바꾸다·우회시키다"]], "quiz": [["접촉 후 식물의 게놈에 일어난 변화는?", "쓰다듬은 지 <b>30분 이내에 게놈의 10%가 변형</b>됐어요 — 접촉이 유전자 발현을 바꾼 거죠."], ["식물이 성장을 억제하는 이유는?", "접촉이라는 교란에 대처하려고 <b>우선순위를 재편하고, ‘키 크기’에서 에너지를 다른 곳으로 돌리기</b> 때문이에요."]], "en": "The genomics revolution made it possible to see just how impactful touch is to plants on a deeper level. Peering at the genes of Arabidopsis thaliana, a weedy plant in the mustard family and the lab rat of the plant biology world, researchers saw that touch quietly triggered such a dramatic response in their hormones and gene expression that it could substantially inhibit their growth. They stroked the arabidopsis with soft paintbrushes, and then analyzed the plants’ genetic responses. Within thirty minutes of being touched, 10 percent of the plant’s genome was altered. Clearly, the plant was reorganizing its priorities to deal with the disturbance, and rerouting energy away from the hard work of getting taller. Touched multiple times, arabidopsis cut its upward growth rate by as much as 30 percent.", "ko": "유전체학 혁명은 접촉이 식물에 정말 얼마나 영향을 미치는지를 더 깊은 차원에서 확인할 수 있게 해 주었다. 겨자과 잡초이자 식물생물학계의 실험용 쥐인 Arabidopsis thaliana의 유전자들을 들여다 보면서, 연구자들은 접촉이 그것들의 호르몬과 유전자 발현에 매우 극적인 반응을 조용히 유발해 상당히 그들의 성장을 억제할 수 있음을 확인했다. 그들은 부드러운 페인트 붓으로 애기장대를 쓰다듬었고, 그리고 나서 그 식물들의 유전적 반응을 분석했다. 접촉된 지 30분 이내에, 그 식물 게놈의 10퍼센트가 변형되었다. 분명히, 그 식물은 그 교란에 대처하기 위해 그것의 우선순위들을 재조직하고 있었으며, 더 키가 커지는 힘든 작업으로부터 에너지를 다른 곳으로 돌리고 있었다. 여러 번 접촉되었을 때, 애기장대는 그것의 위로 자라는 성장률을 많게는 30퍼센트까지 줄였다.", "read": [{"en": "The genomics revolution made it possible to see just how impactful touch is to plants on a deeper level.", "ko": "유전체학 혁명은 접촉이 식물에 정말 얼마나 영향을 미치는지를 더 깊은 차원에서 확인할 수 있게 해 주었다.", "chunks": [["The genomics revolution made it possible", "유전체학 혁명은 ~ 가능하게 해 주었다"], ["to see just how impactful touch is to plants", "접촉이 식물에 정말 얼마나 영향을 미치는지를 확인하는 것을"], ["on a deeper level.", "더 깊은 차원에서."]]}, {"en": "Peering at the genes of Arabidopsis thaliana, a weedy plant in the mustard family and the lab rat of the plant biology world, researchers saw that touch quietly triggered such a dramatic response in their hormones and gene expression that it could substantially inhibit their growth.", "ko": "겨자과 잡초이자 식물생물학계의 실험용 쥐인 Arabidopsis thaliana의 유전자들을 들여다 보면서, 연구자들은 접촉이 그것들의 호르몬과 유전자 발현에 매우 극적인 반응을 조용히 유발해 상당히 그들의 성장을 억제할 수 있음을 확인했다.", "chunks": [["Peering at the genes of Arabidopsis thaliana,", "Arabidopsis thaliana의 유전자들을 들여다 보면서,"], ["a weedy plant in the mustard family and the lab rat of the plant biology world,", "겨자과 잡초이자 식물생물학계의 실험용 쥐인,"], ["researchers saw that touch quietly triggered such a dramatic response", "연구자들은 접촉이 매우 극적인 반응을 조용히 유발한다는 것을 확인했다"], ["in their hormones and gene expression", "그것들의 호르몬과 유전자 발현에"], ["that it could substantially inhibit their growth.", "그것이 상당히 그들의 성장을 억제할 수 있을 정도로."]]}, {"en": "They stroked the arabidopsis with soft paintbrushes, and then analyzed the plants’ genetic responses.", "ko": "그들은 부드러운 페인트 붓으로 애기장대를 쓰다듬었고, 그리고 나서 그 식물들의 유전적 반응을 분석했다.", "chunks": [["They stroked the arabidopsis with soft paintbrushes,", "그들은 부드러운 페인트 붓으로 애기장대를 쓰다듬었고,"], ["and then analyzed the plants’ genetic responses.", "그리고 나서 그 식물들의 유전적 반응을 분석했다."]]}, {"en": "Within thirty minutes of being touched, 10 percent of the plant’s genome was altered.", "ko": "접촉된 지 30분 이내에, 그 식물 게놈의 10퍼센트가 변형되었다.", "chunks": [["Within thirty minutes of being touched,", "접촉된 지 30분 이내에,"], ["10 percent of the plant’s genome was altered.", "그 식물 게놈의 10퍼센트가 변형되었다."]]}, {"en": "Clearly, the plant was reorganizing its priorities to deal with the disturbance, and rerouting energy away from the hard work of getting taller.", "ko": "분명히, 그 식물은 그 교란에 대처하기 위해 그것의 우선순위들을 재조직하고 있었으며, 더 키가 커지는 힘든 작업으로부터 에너지를 다른 곳으로 돌리고 있었다.", "chunks": [["Clearly, the plant was reorganizing its priorities", "분명히, 그 식물은 그것의 우선순위들을 재조직하고 있었으며"], ["to deal with the disturbance,", "그 교란에 대처하기 위해,"], ["and rerouting energy away from the hard work", "그리고 힘든 작업으로부터 에너지를 다른 곳으로 돌리고 있었다"], ["of getting taller.", "더 키가 커지는."]]}, {"en": "Touched multiple times, arabidopsis cut its upward growth rate by as much as 30 percent.", "ko": "여러 번 접촉되었을 때, 애기장대는 그것의 위로 자라는 성장률을 많게는 30퍼센트까지 줄였다.", "chunks": [["Touched multiple times,", "여러 번 접촉되었을 때,"], ["arabidopsis cut its upward growth rate", "애기장대는 그것의 위로 자라는 성장률을 줄였다"], ["by as much as 30 percent.", "많게는 30퍼센트까지."]]}]}, {"no": "no.33", "title": "Evolution Keeps Tracking a Changing World", "ktitle": "진화는 변하는 세상을 끝없이 추적한다", "field": "생물 · 진화", "page": "2026 6월 학평 · no.33 (빈칸 추론)", "oneline": "환경은 긴 시간 규모에서 끊임없이 변하므로, 진화는 멈추지 않고 <span style=\"color:#1FA34A;font-weight:700\">변하는 환경을 계속 추적</span>하며 선택 압력의 방향을 양방향으로 따라갑니다.", "metaphor": "<svg viewBox=\"0 0 600 258\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 추운 시기에는 온도계가 낮고 동물의 털이 길어지고, 오른쪽 더운 시기에는 온도계가 높고 털이 짧아지며, 가운데 양방향 화살표가 환경이 변하면 진화가 양쪽 방향으로 끊임없이 따라 추적함을 보여 주는 그림\">\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Evolution Tracks the Environment — 환경이 변하면, 진화도 따라 (양방향)</text>\n\n  <!-- 좌: 추운 시기 → 긴 털 -->\n  <g transform=\"translate(34, 36)\">\n    <text x=\"110\" y=\"6\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">추운 시기 (기온 ↓)</text>\n    <!-- 온도계 (낮음) -->\n    <g transform=\"translate(24, 22)\">\n      <rect x=\"-5\" y=\"0\" width=\"10\" height=\"56\" rx=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <rect x=\"-3\" y=\"40\" width=\"6\" height=\"16\" fill=\"#c8102e\"/>\n      <circle cx=\"0\" cy=\"62\" r=\"9\" fill=\"#c8102e\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"90\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">cold ↓</text>\n    </g>\n    <!-- 긴 털 동물 -->\n    <g transform=\"translate(130, 56)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"24\" ry=\"13\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-22\" cy=\"-6\" r=\"8\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-25\" cy=\"-12\" r=\"1\" fill=\"#1FA34A\"/>\n      <line x1=\"-13\" y1=\"12\" x2=\"-13\" y2=\"24\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"13\" x2=\"0\" y2=\"25\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <line x1=\"13\" y1=\"12\" x2=\"13\" y2=\"24\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <g stroke=\"#1FA34A\" stroke-width=\"1\">\n        <line x1=\"-18\" y1=\"-11\" x2=\"-22\" y2=\"-21\"/><line x1=\"-10\" y1=\"-13\" x2=\"-12\" y2=\"-24\"/>\n        <line x1=\"-2\" y1=\"-13\" x2=\"-3\" y2=\"-25\"/><line x1=\"6\" y1=\"-13\" x2=\"7\" y2=\"-24\"/>\n        <line x1=\"14\" y1=\"-11\" x2=\"18\" y2=\"-21\"/><line x1=\"20\" y1=\"-7\" x2=\"28\" y2=\"-13\"/>\n        <line x1=\"22\" y1=\"2\" x2=\"31\" y2=\"2\"/><line x1=\"20\" y1=\"9\" x2=\"28\" y2=\"15\"/>\n        <line x1=\"-20\" y1=\"8\" x2=\"-29\" y2=\"14\"/>\n      </g>\n      <text x=\"0\" y=\"44\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">longer coat</text>\n    </g>\n    <text x=\"110\" y=\"118\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">→ 더 긴 털</text>\n  </g>\n\n  <!-- 가운데: 양방향 추적 -->\n  <g transform=\"translate(300, 92)\">\n    <text x=\"0\" y=\"-30\" font-family=\"Noto Serif KR\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">양방향 추적</text>\n    <g stroke=\"#1FA34A\" stroke-width=\"2.2\" fill=\"#1FA34A\">\n      <line x1=\"-26\" y1=\"0\" x2=\"26\" y2=\"0\"/>\n      <polygon points=\"-26,0 -18,-5 -18,5\"/>\n      <polygon points=\"26,0 18,-5 18,5\"/>\n    </g>\n    <text x=\"0\" y=\"20\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">tracks both ways</text>\n    <text x=\"0\" y=\"34\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">기온↓→털↑ · 기온↑→털↓</text>\n  </g>\n\n  <!-- 우: 더운 시기 → 짧은 털 -->\n  <g transform=\"translate(356, 36)\">\n    <text x=\"110\" y=\"6\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">더운 시기 (기온 ↑)</text>\n    <!-- 온도계 (높음) -->\n    <g transform=\"translate(24, 22)\">\n      <rect x=\"-5\" y=\"0\" width=\"10\" height=\"56\" rx=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <rect x=\"-3\" y=\"10\" width=\"6\" height=\"46\" fill=\"#c8102e\"/>\n      <circle cx=\"0\" cy=\"62\" r=\"9\" fill=\"#c8102e\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"90\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">warm ↑</text>\n    </g>\n    <!-- 짧은 털 동물 (매끈) -->\n    <g transform=\"translate(130, 56)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"24\" ry=\"13\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-22\" cy=\"-6\" r=\"8\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-25\" cy=\"-12\" r=\"1\" fill=\"#1FA34A\"/>\n      <line x1=\"-13\" y1=\"12\" x2=\"-13\" y2=\"24\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"13\" x2=\"0\" y2=\"25\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <line x1=\"13\" y1=\"12\" x2=\"13\" y2=\"24\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"44\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">shorter coat</text>\n    </g>\n    <text x=\"110\" y=\"118\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">→ 더 짧은 털</text>\n  </g>\n\n  <!-- ★ 빈칸·결론 strip -->\n  <rect x=\"40\" y=\"172\" width=\"520\" height=\"68\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n  <text x=\"58\" y=\"194\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1FA34A\">★ 진화는 멈추지 않고 변하는 환경을 끊임없이 추적한다 (양방향)</text>\n  <text x=\"58\" y=\"212\" font-family=\"Noto Serif\" font-size=\"9\" fill=\"#5e5e5e\">Evolution never stops — it constantly tracks the changing environment, both ways.</text>\n  <text x=\"58\" y=\"230\" font-family=\"Noto Serif KR\" font-size=\"9\" fill=\"#1a1a1a\">빈칸 = <tspan font-weight=\"700\">constantly tracks the changing environment</tspan> (변하는 환경을 끊임없이 추적)</text>\n</svg>", "caption": "기온 그래프가 내려갈 땐 동물의 털이 길어지고, 다시 올라갈 땐 짧아지는 — 환경 곡선을 그림자처럼 뒤따르는 진화 그림.", "tldr": ["진화는 환경이 변하지 않으면 멈춰요 — 하지만 빙하기·강수량·바람 같은 변화는 <span style=\"color:#1FA34A;font-weight:700\">긴 시간 규모에선 실제로 일어나요</span>.", "그래서 진화는 정지하지 않고 <span style=\"color:#1FA34A;font-weight:700\">변화하는 환경을 끊임없이 추적</span>합니다.", "기온이 내려가면 선택 압력이 <span style=\"color:#c8102e;font-weight:700\">긴 털</span> 방향으로, 다시 오르면 <span style=\"color:#1FA34A;font-weight:700\">짧은 털</span> 방향으로 — 방향까지 역전돼요."], "analogy": "내비게이션은 목적지에 도착할 때까지 길이 막히면 경로를 계속 다시 짜죠. 진화도 환경이라는 ‘교통 상황’이 바뀔 때마다 방향을 다시 잡는 내비게이션이에요 — 멈추는 건 길이 안 변할 때뿐.", "bg": "분야는 진화생물학이에요. ‘selection pressure(선택 압력)’는 어떤 형질이 살아남도록 미는 환경의 힘 — 환경이 바뀌면 압력의 방향도 바뀐다는 게 논지. → ‘진화가 멈추는 조건’과 ‘실제로는 멈추지 않는 이유’를 대비시키고, 긴 털·짧은 털 예시가 빈칸(진화가 무엇을 하는가)을 어떻게 채우는지 보며 읽으세요.", "flow": [{"kind": "전제", "t": "진화는 환경이 변하지 않으면 멈춘다 (빙하기·강수량·바람 등)"}, {"kind": "근거", "t": "진화만큼 긴 시간을 보면 그런 환경 변화는 실제로 일어남"}, {"kind": "주장(빈칸)", "t": "따라서 진화는 멈추지 않고 <span style=\"color:#1FA34A;font-weight:700\">변하는 환경을 끊임없이 추적</span>"}, {"kind": "예시 1", "t": "기온이 꾸준히 내려가면 선택 압력이 <span style=\"color:#c8102e;font-weight:700\">긴 털</span> 방향으로"}, {"kind": "예시 2(반전)", "t": "기온이 다시 오르면 압력이 <span style=\"color:#1FA34A;font-weight:700\">짧은 털</span> 방향으로 역전"}], "vocab": [["come to a standstill", "정지하다·멈추다"], ["onset", "시작·개시"], ["prevailing wind", "항상풍·탁월풍"], ["timescale", "시간 규모·기간"], ["evolutionary", "진화적인·진화의"], ["come to a halt", "멈추다·정지하다"], ["constantly", "끊임없이·계속"], ["track", "추적하다·따라가다"], ["steady", "꾸준한·지속적인"], ["drift", "추세·이동"], ["persist", "지속되다·계속되다"], ["successive", "잇따른·연속적인"], ["propel", "나아가게 하다·추진하다"], ["selection pressure", "선택 압력"], ["reverse", "역전되다·뒤바뀌다"], ["creep up", "서서히 올라가다"]], "quiz": [["진화가 ‘멈추는’ 조건은?", "<b>환경(상황)이 변하지 않을 때</b>예요. 하지만 긴 시간 규모에선 환경이 실제로 변하므로 진화는 거의 멈추지 않아요."], ["긴 털·짧은 털 예시가 보여주는 것은?", "선택 압력의 <b>방향이 환경에 따라 양방향으로 바뀐다</b>는 것 — 추워지면 긴 털, 따뜻해지면 짧은 털로요."]], "en": "Evolution will come to a standstill until something in the conditions changes: the onset of an ice age, a change in the average rainfall of the area, a shift in the prevailing wind. Such changes do happen when we are dealing with a timescale as long as the evolutionary one. As a consequence, evolution normally does not come to a halt, but constantly tracks the changing environment. If there is a steady downward drift in the average temperature in the area, a drift that persists over centuries, successive generations of animals will be propelled by a steady selection ‘pressure’ in the direction, say, of growing longer coats of hair. If after a few thousand years of reduced temperature the trend reverses and average temperatures creep up again, the animals will come under the influence of a new selection pressure, and will be pushed towards growing shorter coats again.", "ko": "진화는 빙하기의 시작, 그 지역의 평균 강수량의 변화, 항상풍의 변화와 같은, 상황들 속의 어떤 것이 변할 때까지 정지할 것이다. 그러한 변화들은 우리가 진화적인 것만큼 긴 시간 규모를 다루고 있을 때 실제로 일어난다. 그 결과, 진화는 보통 정지하지 않고, 변화하는 환경을 끊임없이 추적한다. 만약 그 지역에서, 수 세기에 걸쳐 지속되는 추세인, 평균 기온의 꾸준한 하향 추세가 있다면, 꾸준한 선택 ‘압력’에 의해 동물들의 다음 세대는, 이를테면 더 긴 털을 자라게 하는 방향으로, 나아가게 될 것이다. 만약 수천 년의 낮아진 기온 이후에 그 추세가 역전되고 평균 기온이 다시 서서히 올라간다면, 그 동물들은 새로운 선택 압력의 영향 아래 놓이게 될 것이며, 다시 더 짧은 털을 자라게 하는 쪽으로 나아가게 될 것이다.", "read": [{"en": "Evolution will come to a standstill until something in the conditions changes: the onset of an ice age, a change in the average rainfall of the area, a shift in the prevailing wind.", "ko": "진화는 빙하기의 시작, 그 지역의 평균 강수량의 변화, 항상풍의 변화와 같은, 상황들 속의 어떤 것이 변할 때까지 정지할 것이다.", "chunks": [["Evolution will come to a standstill", "진화는 정지할 것이다"], ["until something in the conditions changes:", "상황들 속의 어떤 것이 변할 때까지:"], ["the onset of an ice age,", "빙하기의 시작,"], ["a change in the average rainfall of the area,", "그 지역의 평균 강수량의 변화,"], ["a shift in the prevailing wind.", "항상풍의 변화."]]}, {"en": "Such changes do happen when we are dealing with a timescale as long as the evolutionary one.", "ko": "그러한 변화들은 우리가 진화적인 것만큼 긴 시간 규모를 다루고 있을 때 실제로 일어난다.", "chunks": [["Such changes do happen", "그러한 변화들은 실제로 일어난다"], ["when we are dealing with a timescale", "우리가 시간 규모를 다루고 있을 때"], ["as long as the evolutionary one.", "진화적인 것만큼 긴."]]}, {"en": "As a consequence, evolution normally does not come to a halt, but constantly tracks the changing environment.", "ko": "그 결과, 진화는 보통 정지하지 않고, 변화하는 환경을 끊임없이 추적한다.", "chunks": [["As a consequence,", "그 결과,"], ["evolution normally does not come to a halt,", "진화는 보통 정지하지 않고,"], ["but constantly tracks the changing environment.", "변화하는 환경을 끊임없이 추적한다."]]}, {"en": "If there is a steady downward drift in the average temperature in the area, a drift that persists over centuries, successive generations of animals will be propelled by a steady selection ‘pressure’ in the direction, say, of growing longer coats of hair.", "ko": "만약 그 지역에서, 수 세기에 걸쳐 지속되는 추세인, 평균 기온의 꾸준한 하향 추세가 있다면, 꾸준한 선택 ‘압력’에 의해 동물들의 다음 세대는, 이를테면 더 긴 털을 자라게 하는 방향으로, 나아가게 될 것이다.", "chunks": [["If there is a steady downward drift in the average temperature in the area,", "만약 그 지역에서 평균 기온의 꾸준한 하향 추세가 있다면,"], ["a drift that persists over centuries,", "수 세기에 걸쳐 지속되는 추세인,"], ["successive generations of animals will be propelled", "동물들의 다음 세대는 나아가게 될 것이다"], ["by a steady selection ‘pressure’ in the direction,", "꾸준한 선택 ‘압력’에 의해 그 방향으로,"], ["say, of growing longer coats of hair.", "이를테면, 더 긴 털을 자라게 하는."]]}, {"en": "If after a few thousand years of reduced temperature the trend reverses and average temperatures creep up again, the animals will come under the influence of a new selection pressure, and will be pushed towards growing shorter coats again.", "ko": "만약 수천 년의 낮아진 기온 이후에 그 추세가 역전되고 평균 기온이 다시 서서히 올라간다면, 그 동물들은 새로운 선택 압력의 영향 아래 놓이게 될 것이며, 다시 더 짧은 털을 자라게 하는 쪽으로 나아가게 될 것이다.", "chunks": [["If after a few thousand years of reduced temperature", "만약 수천 년의 낮아진 기온 이후에"], ["the trend reverses and average temperatures creep up again,", "그 추세가 역전되고 평균 기온이 다시 서서히 올라간다면,"], ["the animals will come under the influence of a new selection pressure,", "그 동물들은 새로운 선택 압력의 영향 아래 놓이게 될 것이며,"], ["and will be pushed towards growing shorter coats again.", "다시 더 짧은 털을 자라게 하는 쪽으로 나아가게 될 것이다."]]}]}, {"no": "no.34", "title": "Why Street Vendors Choose the Sidewalk", "ktitle": "노점상이 보도를 택하는 경제학", "field": "경제 · 도시", "page": "2026 6월 학평 · no.34 (빈칸 추론)", "oneline": "대도시의 토지 값이 너무 비싸기에, 이익을 극대화하려는 노점상은 <span style=\"color:#1FA34A;font-weight:700\">무료인 공공 보행로</span>를 <span style=\"color:#c8102e;font-weight:700\">값비싼 상업 공간 대신</span> 씁니다.", "metaphor": "<svg viewBox=\"0 0 600 256\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 연 2만 달러의 값비싼 상점은 자물쇠로 잠겨 회피되고, 오른쪽 무료 공공 보행로에는 노점상이 카트를 펼쳐 장사하여, 노점상이 비싼 상업 공간을 무료 보도로 대체함을 보여 주는 거리 장면\">\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Why Vendors Choose the Sidewalk — 비싼 상점 대신 무료 보도</text>\n\n  <!-- 좌: 값비싼 상업 공간 (잠김·회피, 빨강 점선) -->\n  <g transform=\"translate(34, 40)\">\n    <text x=\"95\" y=\"8\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">값비싼 상업 공간</text>\n    <rect x=\"0\" y=\"22\" width=\"190\" height=\"100\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/>\n    <rect x=\"0\" y=\"22\" width=\"190\" height=\"16\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    <text x=\"95\" y=\"34\" font-family=\"Noto Serif KR\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">상점 · commercial space</text>\n    <rect x=\"18\" y=\"48\" width=\"46\" height=\"26\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    <rect x=\"126\" y=\"48\" width=\"46\" height=\"26\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1\"/>\n    <rect x=\"76\" y=\"82\" width=\"38\" height=\"40\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n    <!-- 자물쇠 (잠김) -->\n    <g transform=\"translate(95, 98)\" stroke=\"#c8102e\" stroke-width=\"1.6\">\n      <rect x=\"-8\" y=\"0\" width=\"16\" height=\"13\" rx=\"2\" fill=\"#fdf2f4\"/>\n      <path d=\"M -5 0 V -4 A 5 5 0 0 1 5 -4 V 0\" fill=\"none\"/>\n      <circle cx=\"0\" cy=\"6\" r=\"1.4\" fill=\"#c8102e\" stroke=\"none\"/>\n    </g>\n    <!-- 가격표 (매달림) -->\n    <g transform=\"translate(136, 0)\">\n      <rect x=\"0\" y=\"0\" width=\"66\" height=\"21\" rx=\"3\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <text x=\"33\" y=\"14\" font-family=\"Noto Serif\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">$20,000/yr</text>\n    </g>\n    <text x=\"95\" y=\"138\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">너무 비쌈 → 회피</text>\n  </g>\n\n  <!-- 가운데: substitute -->\n  <g transform=\"translate(246, 86)\">\n    <line x1=\"0\" y1=\"0\" x2=\"42\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2.4\"/>\n    <polygon points=\"42,0 33,-6 33,6\" fill=\"#1FA34A\"/>\n    <text x=\"21\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">substitute</text>\n    <text x=\"21\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">대체</text>\n  </g>\n\n  <!-- 우: 무료 공공 보행로 (선택, 초록) -->\n  <g transform=\"translate(300, 36)\">\n    <text x=\"138\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\">무료 공공 보행로 ($0 · FREE)</text>\n    <!-- 보도 -->\n    <rect x=\"0\" y=\"98\" width=\"276\" height=\"14\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <g stroke=\"#1FA34A\" stroke-width=\"0.8\">\n      <line x1=\"46\" y1=\"98\" x2=\"46\" y2=\"112\"/><line x1=\"100\" y1=\"98\" x2=\"100\" y2=\"112\"/>\n      <line x1=\"176\" y1=\"98\" x2=\"176\" y2=\"112\"/><line x1=\"230\" y1=\"98\" x2=\"230\" y2=\"112\"/>\n    </g>\n    <!-- 노점 카트 -->\n    <g transform=\"translate(80, 46)\">\n      <path d=\"M -32 8 Q 0 -20 32 8 Z\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"8\" x2=\"0\" y2=\"36\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <rect x=\"-30\" y=\"30\" width=\"60\" height=\"22\" rx=\"2\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"-16\" cy=\"26\" r=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n      <circle cx=\"-5\" cy=\"26\" r=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n      <circle cx=\"6\" cy=\"26\" r=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.1\"/>\n      <circle cx=\"-18\" cy=\"56\" r=\"5\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <circle cx=\"18\" cy=\"56\" r=\"5\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    </g>\n    <!-- 노점상 -->\n    <g transform=\"translate(180, 60)\" stroke=\"#1FA34A\" stroke-width=\"1.4\" fill=\"none\">\n      <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#ffffff\"/>\n      <circle cx=\"-2.5\" cy=\"-1\" r=\"0.9\" fill=\"#1FA34A\" stroke=\"none\"/>\n      <circle cx=\"2.5\" cy=\"-1\" r=\"0.9\" fill=\"#1FA34A\" stroke=\"none\"/>\n      <line x1=\"0\" y1=\"7\" x2=\"0\" y2=\"32\"/>\n      <line x1=\"0\" y1=\"15\" x2=\"-12\" y2=\"22\"/>\n      <line x1=\"0\" y1=\"15\" x2=\"12\" y2=\"22\"/>\n      <line x1=\"0\" y1=\"32\" x2=\"-9\" y2=\"50\"/>\n      <line x1=\"0\" y1=\"32\" x2=\"9\" y2=\"50\"/>\n    </g>\n    <text x=\"180\" y=\"128\" font-family=\"Not

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 고2 2026학년도 6월 학력평가 22지문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   고2 2026학년도 6월 학력평가 22지문 지문 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body>
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">2026학년도 고2 6월 학력평가</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 고2 2026학년도 6월 학력평가 22개 지문
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가

"48,0 39,-6 39,6\" fill=\"#1FA34A\"/>\n    <text x=\"24\" y=\"-11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">explained</text>\n    <text x=\"24\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">주문이 뒤바뀜</text>\n  </g>\n\n  <!-- 우: 안도 -->\n  <g transform=\"translate(330, 30)\">\n    <text x=\"125\" y=\"-6\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">끝 — 안도 · 만족</text>\n    <rect x=\"0\" y=\"0\" width=\"250\" height=\"190\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <!-- 초콜릿 케이크 -->\n    <g transform=\"translate(65, 70)\">\n      <rect x=\"-34\" y=\"0\" width=\"68\" height=\"34\" rx=\"3\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <path d=\"M -34 0 Q 0 -16 34 0\" fill=\"#1FA34A\" fill-opacity=\"0.18\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-size=\"8.5\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">chocolate</text>\n      <text x=\"0\" y=\"50\" font-family=\"Noto Serif\" font-size=\"11\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"Happy 70th\"</text>\n    </g>\n    <!-- 만족 표정 -->\n    <g transform=\"translate(180, 70)\">\n      <circle cx=\"0\" cy=\"0\" r=\"22\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <path d=\"M -8 -3 Q -5 -7 -2 -3\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <path d=\"M 2 -3 Q 5 -7 8 -3\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 미소 -->\n      <path d=\"M -10 6 Q 0 16 10 6\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n    </g>\n    <text x=\"125\" y=\"172\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"perfect — even better than I imagined\"</text>\n  </g>\n</svg>", "caption": "물음표가 가득 떠 있던 케이크 상자가, 제빵사의 설명과 함께 제대로 된 케이크와 웃는 얼굴로 바뀌는 그림.", "tldr": ["아빠의 70번째 생일 케이크를 찾으러 갔는데 — 상자엔 <span style=\"color:#c8102e;font-weight:700\">레몬 케이크 + ‘50번째 생일’ 문구</span>!", "‘내가 주문을 잘못했나?’ 의아해하는 Luna — 제빵사가 잠시 자리를 비웠다 돌아와요.", "두 개의 비슷한 주문이 뒤바뀐 것 — 진짜 케이크를 받아 들고 <span style=\"color:#1FA34A;font-weight:700\">‘상상보다 더 좋아요’</span>, 혼란이 만족으로."], "analogy": "배달 앱에서 내 치킨 대신 남의 피자가 왔을 때의 그 표정이에요. ‘내가 잘못 시켰나?’ 싶던 찰나, 사장님이 진짜 내 주문을 들고 나타나면 — 화는커녕 더 반갑죠.", "bg": "분야는 서사문, 심경 변화 유형이에요. 감정 단서는 ‘couldn't understand(이해할 수 없었다)’, ‘wondered(의아해했다)’ 같은 혼란 표현과, 마지막 ‘perfect·better than I imagined’ 같은 만족 표현. → 혼란이 풀리는 ‘전환 계기’가 어느 문장인지 짚으며 읽으세요.", "flow": [{"kind": "도입", "t": "아빠 70번째 생일용 초콜릿 케이크를 찾으러 빵집에"}, {"kind": "혼란 시작", "t": "상자를 열자 <span style=\"color:#c8102e;font-weight:700\">레몬 케이크 + ‘50번째’ 문구</span> — 이해 불가"}, {"kind": "혼란 심화", "t": "“이해가 안 돼요” + 자기 실수인지 의아해함"}, {"kind": "전환 계기", "t": "제빵사가 돌아와 <span style=\"color:#1FA34A;font-weight:700\">주문이 뒤바뀌었음을 설명</span>"}, {"kind": "안도·만족", "t": "“완벽해 보이고, 상상보다 더 좋다” — 혼란이 만족으로"}], "vocab": [["bakery", "빵집·제과점"], ["pick up", "(찾아서) 가져오다"], ["flavor", "맛·풍미"], ["notice", "알아차리다·발견하다"], ["message", "메시지·문구"], ["I don't get it", "이해가 안 된다"], ["wonder", "궁금해하다·의아해하다"], ["mistake", "실수·잘못"], ["order", "주문하다"], ["walk away", "자리를 떠나다"], ["return", "돌아오다"], ["explain", "설명하다"], ["similar", "비슷한·유사한"], ["quality", "양질의·고급의"], ["imagine", "상상하다"]], "quiz": [["Luna의 심경 변화를 정리하면?", "<b>혼란·의아(confused) → 안도·만족(relieved·satisfied)</b>. 잘못된 케이크가 혼란을, 제빵사의 설명과 진짜 케이크가 만족을 만들어요."], ["혼란의 정체는 무엇이었나요?", "빵집이 <b>비슷한 주문 두 개를 받아 케이크가 뒤바뀐 것</b> — Luna의 실수가 아니었어요."]], "en": "Luna went to the bakery to pick up a chocolate cake for her dad’s 70th birthday. As she opened the box, she couldn’t understand what she saw. It was a lemon cake. Then she noticed the message on top. It said, “Happy 50th Birthday, Dad!” Luna said to the baker, “I don’t get it. The flavor and the message are wrong.” She wondered if she made a mistake when ordering. The baker asked her to wait and walked away. Moments later, he returned with her cake, explaining they had received two similar orders. Knowing she had chosen a quality bakery, Luna said, “I see. Well, this looks perfect, even better than I imagined.”", "ko": "Luna는 아빠의 70번째 생일을 위한 초콜릿 케이크를 가지러 빵집에 갔다. 그녀가 상자를 열었을 때, 그녀는 자신이 본 것을 이해할 수 없었다. 그것은 레몬 케이크였다. 그때 그녀는 윗면에 있는 메시지를 발견했다. “아빠, 50번째 생일 축하해요!”라고 쓰여 있었다. Luna가 제빵사에게 “이해가 안 돼요. 맛도 메시지도 틀려요.”라고 말했다. 그녀는 주문했을 때 자신이 실수를 한 건지 궁금했다. 제빵사는 잠시만 기다리라고 요청하고 자리를 떴다. 잠시 후, 그는 그녀의 케이크를 들고 돌아와 자신들이 두 개의 비슷한 주문을 받았다고 설명했다. 훌륭한 빵집을 선택했다는 것을 확신하며, Luna는 “그렇군요. 음, 이건 완벽해 보이고, 제가 상상했던 것보다 훨씬 더 좋아요.”라고 말했다.", "read": [{"en": "Luna went to the bakery to pick up a chocolate cake for her dad’s 70th birthday.", "ko": "Luna는 아빠의 70번째 생일을 위한 초콜릿 케이크를 가지러 빵집에 갔다.", "chunks": [["Luna went to the bakery", "Luna는 빵집에 갔다"], ["to pick up a chocolate cake", "초콜릿 케이크를 가지러"], ["for her dad’s 70th birthday.", "아빠의 70번째 생일을 위한."]]}, {"en": "As she opened the box, she couldn’t understand what she saw.", "ko": "그녀가 상자를 열었을 때, 그녀는 자신이 본 것을 이해할 수 없었다.", "chunks": [["As she opened the box,", "그녀가 상자를 열었을 때,"], ["she couldn’t understand", "그녀는 이해할 수 없었다"], ["what she saw.", "자신이 본 것을."]]}, {"en": "It was a lemon cake.", "ko": "그것은 레몬 케이크였다.", "chunks": [["It was a lemon cake.", "그것은 레몬 케이크였다."]]}, {"en": "Then she noticed the message on top.", "ko": "그때 그녀는 윗면에 있는 메시지를 발견했다.", "chunks": [["Then she noticed the message on top.", "그때 그녀는 윗면에 있는 메시지를 발견했다."]]}, {"en": "It said, “Happy 50th Birthday, Dad!”", "ko": "“아빠, 50번째 생일 축하해요!”라고 쓰여 있었다.", "chunks": [["It said, “Happy 50th Birthday, Dad!”", "“아빠, 50번째 생일 축하해요!”라고 쓰여 있었다."]]}, {"en": "Luna said to the baker, “I don’t get it. The flavor and the message are wrong.”", "ko": "Luna가 제빵사에게 “이해가 안 돼요. 맛도 메시지도 틀려요.”라고 말했다.", "chunks": [["Luna said to the baker,", "Luna가 제빵사에게 말했다,"], ["“I don’t get it.", "“이해가 안 돼요."], ["The flavor and the message are wrong.”", "맛도 메시지도 틀려요.”라고."]]}, {"en": "She wondered if she made a mistake when ordering.", "ko": "그녀는 주문했을 때 자신이 실수를 한 건지 궁금했다.", "chunks": [["She wondered", "그녀는 궁금해했다"], ["if she made a mistake", "자신이 실수를 한 건지"], ["when ordering.", "주문했을 때."]]}, {"en": "The baker asked her to wait and walked away.", "ko": "제빵사는 잠시만 기다리라고 요청하고 자리를 떴다.", "chunks": [["The baker asked her to wait", "제빵사는 그녀에게 기다리라고 요청했다"], ["and walked away.", "그리고 자리를 떴다."]]}, {"en": "Moments later, he returned with her cake, explaining they had received two similar orders.", "ko": "잠시 후, 그는 그녀의 케이크를 들고 돌아와 자신들이 두 개의 비슷한 주문을 받았다고 설명했다.", "chunks": [["Moments later, he returned with her cake,", "잠시 후, 그는 그녀의 케이크를 들고 돌아왔다,"], ["explaining", "설명하면서"], ["they had received two similar orders.", "자신들이 두 개의 비슷한 주문을 받았다고."]]}, {"en": "Knowing she had chosen a quality bakery, Luna said, “I see. Well, this looks perfect, even better than I imagined.”", "ko": "훌륭한 빵집을 선택했다는 것을 확신하며, Luna는 “그렇군요. 음, 이건 완벽해 보이고, 제가 상상했던 것보다 훨씬 더 좋아요.”라고 말했다.", "chunks": [["Knowing she had chosen a quality bakery,", "훌륭한 빵집을 선택했다는 것을 확신하며,"], ["Luna said, “I see.", "Luna는 “그렇군요."], ["Well, this looks perfect, even better than I imagined.”", "음, 이건 완벽해 보이고, 제가 상상했던 것보다 훨씬 더 좋아요.”라고 말했다."]]}]}, {"no": "no.20", "title": "The Fallacy of Composition", "ktitle": "좋은 부분을 모아도 좋은 전체가 안 될 수 있다", "field": "논리 · 조직론", "page": "2026 6월 학평 · no.20 (필자의 주장)", "oneline": "부분이 좋다고 전체가 좋으리란 보장은 없어요(<span style=\"color:#c8102e;font-weight:700\">구성의 오류</span>) — 팀을 꾸릴 땐 개개인뿐 아니라 <span style=\"color:#1FA34A;font-weight:700\">전체적 관점</span>도 확인하세요.", "metaphor": "<svg viewBox=\"0 0 600 258\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 좋은 부품들이 각각 우수해도, 조립한 전체는 부분들의 상호작용을 고려하지 못해 불안정하게 무너질 수 있음을 보여 주고, 아래에 팀 구성 시 전체적 관점도 확인하라는 주장을 적은 그림\">\n  <!-- 좌: 좋은 부분들 -->\n  <g transform=\"translate(20, 26)\">\n    <text x=\"120\" y=\"-4\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">각 부분은 우수함</text>\n    <rect x=\"0\" y=\"4\" width=\"240\" height=\"150\" fill=\"#f0faf3\" fill-opacity=\"0.45\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <g font-family=\"Noto Serif\" font-style=\"italic\" font-weight=\"700\" fill=\"#1FA34A\" font-size=\"9\">\n      <g transform=\"translate(60, 48)\"><circle cx=\"0\" cy=\"0\" r=\"24\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/><text x=\"0\" y=\"3\" text-anchor=\"middle\">productive</text></g>\n      <g transform=\"translate(178, 44)\"><circle cx=\"0\" cy=\"0\" r=\"24\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/><text x=\"0\" y=\"2\" text-anchor=\"middle\">efficient</text></g>\n      <g transform=\"translate(58, 112)\"><circle cx=\"0\" cy=\"0\" r=\"24\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/><text x=\"0\" y=\"-1\" text-anchor=\"middle\">good</text><text x=\"0\" y=\"10\" text-anchor=\"middle\">people</text></g>\n      <g transform=\"translate(176, 110)\"><circle cx=\"0\" cy=\"0\" r=\"24\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/><text x=\"0\" y=\"-1\" text-anchor=\"middle\">good</text><text x=\"0\" y=\"10\" text-anchor=\"middle\">ideas</text></g>\n    </g>\n  </g>\n\n  <!-- 가운데: 조립 화살표 -->\n  <g transform=\"translate(268, 96)\">\n    <line x1=\"0\" y1=\"0\" x2=\"46\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.8\"/>\n    <polygon points=\"46,0 38,-5 38,5\" fill=\"#1a1a1a\"/>\n    <text x=\"23\" y=\"-9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">assemble</text>\n    <text x=\"23\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">전체로 합침</text>\n  </g>\n\n  <!-- 우: 전체 - 불안정 -->\n  <g transform=\"translate(330, 26)\">\n    <text x=\"125\" y=\"-4\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">전체는 꼭 좋지 않다</text>\n    <rect x=\"0\" y=\"4\" width=\"250\" height=\"150\" fill=\"#fdf2f4\" fill-opacity=\"0.4\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n    <!-- 기울어 무너지는 탑 (불안정) -->\n    <g transform=\"translate(125, 130)\">\n      <rect x=\"-30\" y=\"-22\" width=\"60\" height=\"22\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <rect x=\"-22\" y=\"-44\" width=\"52\" height=\"22\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\" transform=\"rotate(-5 4 -33)\"/>\n      <rect x=\"-8\" y=\"-66\" width=\"46\" height=\"22\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\" transform=\"rotate(-12 15 -55)\"/>\n      <!-- 기우뚱 표시 -->\n      <path d=\"M 40 -60 Q 56 -50 52 -30\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <polygon points=\"52,-30 47,-37 56,-37\" fill=\"#c8102e\"/>\n      <line x1=\"-34\" y1=\"0\" x2=\"42\" y2=\"0\" stroke=\"#999\" stroke-width=\"1\"/>\n    </g>\n    <text x=\"125\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">no stable center · doomed</text>\n    <text x=\"125\" y=\"148\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">상호작용을 고려하지 못함</text>\n  </g>\n\n  <!-- 하단 주장 -->\n  <g transform=\"translate(0, 192)\">\n    <rect x=\"60\" y=\"0\" width=\"480\" height=\"50\" rx=\"6\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">★ 부분이 좋다고 전체가 좋으리란 보장은 없다</text>\n    <text x=\"300\" y=\"39\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">check the overall view as well as the individuals</text>\n  </g>\n</svg>", "caption": "하나하나 빛나는 톱니바퀴들을 모아 끼웠는데 서로 맞물리지 않아 기계가 멈춰 있는 그림.", "tldr": ["흔한 가정: 구성원이 모두 유능하면 <span style=\"color:#c8102e;font-weight:700\">조직도 유능할 것</span> — 꼭 그렇지 않아요.", "구성의 오류 = 부분들의 <span style=\"color:#c8102e;font-weight:700\">상호작용을 고려하지 못함</span> — 서로 ‘저 사람이 하겠지’ 하면 구멍이 나죠.", "주장: 팀을 구성할 때 개개인만 보지 말고 <span style=\"color:#1FA34A;font-weight:700\">전체적 관점을 항상 확인</span>하세요."], "analogy": "올스타팀이 꼭 우승하진 않죠. 에이스 11명을 모아도 패스가 안 맞으면 동네 팀에도 져요. 선수 개개인의 능력표가 아니라 ‘합’이 따로 채점되는 거예요.", "bg": "분야는 논리학·조직론이에요. ‘fallacy of composition(구성의 오류)’은 부분의 속성을 전체의 속성으로 잘못 옮기는 논리적 오류 — 이 글은 그걸 스타트업 팀에 적용해요. → 통념(부분=전체) → 반례(상호작용) → 주장(전체 관점 확인)으로 이어지는 설득 구조를 따라가며 읽으세요.", "flow": [{"kind": "도입(통념)", "t": "전체가 각 부분만큼 좋을 것이라는 흔한 가정"}, {"kind": "예시 설정", "t": "구성원 모두가 생산적·효율적인 스타트업을 가정"}, {"kind": "반전", "t": "전체도 그러리라 보이지만 — <span style=\"color:#c8102e;font-weight:700\">꼭 사실은 아니다</span>"}, {"kind": "핵심 개념", "t": "구성의 오류 = 부분들의 상호작용을 고려하지 못함 (책임 떠넘김 예)"}, {"kind": "부연", "t": "좋은 사람·아이디어로 구성돼도 프로젝트는 실패할 수 있음"}, {"kind": "주장", "t": "팀 구성 시 개개인뿐 아니라 <span style=\"color:#1FA34A;font-weight:700\">전체적 관점도 항상 확인</span>하라"}], "vocab": [["assume", "가정하다·여기다"], ["whole", "전체"], ["be in charge of", "~을 책임지다·담당하다"], ["startup", "신생 기업·스타트업"], ["productive", "생산적인"], ["efficient", "효율적인"], ["logical", "논리적인"], ["necessarily", "반드시·필연적으로"], ["fallacy", "오류·그릇된 생각"], ["composition", "구성"], ["allow for", "~을 고려하다·감안하다"], ["interact", "상호작용하다"], ["administrator", "행정 담당자·관리자"], ["collate", "대조 확인하다·취합하다"], ["prototype", "시제품·원형"], ["doomed", "운이 다한·실패할 운명의"], ["stable", "안정적인"], ["overall", "전체적인·종합적인"]], "quiz": [["‘구성의 오류’란 무엇인가요?", "부분이 좋으면 전체도 좋으리라 가정하면서 <b>부분들이 서로 어떻게 상호작용하는지 고려하지 못하는</b> 오류예요."], ["글 속 IT 책임자·행정 담당자 예시가 보여주는 것은?", "둘 다 유능해도 <b>서로 상대가 그 일을 맡았다고 생각하면</b> 일이 빠져요 — 상호작용의 구멍이 전체를 망치죠."]], "en": "We can sometimes assume that the whole will be as good as each of its parts. Suppose, for example, you’re in charge of a startup, and you know that everyone you’ve brought on board is productive and efficient. It might seem logical to assume that, as a result, the startup will be productive and efficient, too — but this isn’t necessarily true. The fallacy of composition fails to allow for how the different “parts” interact with each other — if, for example, your efficient administrator and your highly skilled head of IT each assumes the other is in charge of collating prototype test results, then you have a problem. Equally, a unit composed of good people can still be working on a doomed project, and a project composed of good ideas may lack a stable center. When assembling a team with a common goal, always check the overall view as well as the individuals involved.", "ko": "우리는 때때로 전체가 그것의 각 부분들만큼 좋을 것이라고 가정할 수 있다. 예를 들어, 당신이 스타트업의 책임을 지고 있고, 당신이 합류시킨 모든 사람이 생산적이고 효율적이라는 것을 안다고 가정해 보자. 그 결과, 스타트업 역시 생산적이고 효율적일 것이라고 가정하는 것이 논리적으로 보일 수 있지만 — 이것이 꼭 사실은 아니다. 구성의 오류는 다른 “부분”들이 어떻게 서로 상호작용하는지를 고려하지 못한다 — 예를 들어, 당신의 효율적인 행정 담당자와 고도로 숙련된 IT 책임자가 서로 상대방이 시제품 테스트 결과를 대조 확인하는 것을 담당한다고 생각한다면, 당신은 문제를 가지게 된다. 동일하게, 훌륭한 인재들로 구성된 팀이 운이 다한 프로젝트를 여전히 진행할 수도 있으며, 훌륭한 아이디어로 구성된 프로젝트가 안정적인 중심이 결여될 수도 있다. 공동의 목표를 가진 팀을 구성할 때, 관련된 개개인뿐만 아니라 전체적인 관점도 항상 확인하라.", "read": [{"en": "We can sometimes assume that the whole will be as good as each of its parts.", "ko": "우리는 때때로 전체가 그것의 각 부분들만큼 좋을 것이라고 가정할 수 있다.", "chunks": [["We can sometimes assume", "우리는 때때로 가정할 수 있다"], ["that the whole will be as good", "전체가 ~만큼 좋을 것이라고"], ["as each of its parts.", "그것의 각 부분들만큼."]]}, {"en": "Suppose, for example, you’re in charge of a startup, and you know that everyone you’ve brought on board is productive and efficient.", "ko": "예를 들어, 당신이 스타트업의 책임을 지고 있고, 당신이 합류시킨 모든 사람이 생산적이고 효율적이라는 것을 안다고 가정해 보자.", "chunks": [["Suppose, for example,", "예를 들어, 가정해 보자"], ["you’re in charge of a startup,", "당신이 스타트업의 책임을 지고 있고,"], ["and you know that everyone you’ve brought on board", "당신이 합류시킨 모든 사람이"], ["is productive and efficient.", "생산적이고 효율적이라는 것을 안다고."]]}, {"en": "It might seem logical to assume that, as a result, the startup will be productive and efficient, too — but this isn’t necessarily true.", "ko": "그 결과, 스타트업 역시 생산적이고 효율적일 것이라고 가정하는 것이 논리적으로 보일 수 있지만 — 이것이 꼭 사실은 아니다.", "chunks": [["It might seem logical to assume", "가정하는 것이 논리적으로 보일 수 있다"], ["that, as a result, the startup will be productive and efficient, too", "그 결과 스타트업 역시 생산적이고 효율적일 것이라고"], ["— but this isn’t necessarily true.", "— 하지만 이것이 꼭 사실은 아니다."]]}, {"en": "The fallacy of composition fails to allow for how the different “parts” interact with each other — if, for example, your efficient administrator and your highly skilled head of IT each assumes the other is in charge of collating prototype test results, then you have a problem.", "ko": "구성의 오류는 다른 “부분”들이 어떻게 서로 상호작용하는지를 고려하지 못한다 — 예를 들어, 당신의 효율적인 행정 담당자와 고도로 숙련된 IT 책임자가 서로 상대방이 시제품 테스트 결과를 대조 확인하는 것을 담당한다고 생각한다면, 당신은 문제를 가지게 된다.", "chunks": [["The fallacy of composition fails to allow for", "구성의 오류는 ~을 고려하지 못한다"], ["how the different “parts” interact with each other", "다른 “부분”들이 어떻게 서로 상호작용하는지를"], ["— if, for example, your efficient administrator and your highly skilled head of IT", "— 예를 들어, 당신의 효율적인 행정 담당자와 고도로 숙련된 IT 책임자가"], ["each assumes the other is in charge of collating prototype test results,", "서로 상대방이 시제품 테스트 결과를 대조 확인하는 것을 담당한다고 각자 생각한다면,"], ["then you have a problem.", "그러면 당신은 문제를 가지게 된다."]]}, {"en": "Equally, a unit composed of good people can still be working on a doomed project, and a project composed of good ideas may lack a stable center.", "ko": "동일하게, 훌륭한 인재들로 구성된 팀이 운이 다한 프로젝트를 여전히 진행할 수도 있으며, 훌륭한 아이디어로 구성된 프로젝트가 안정적인 중심이 결여될 수도 있다.", "chunks": [["Equally, a unit composed of good people", "동일하게, 훌륭한 인재들로 구성된 팀이"], ["can still be working on a doomed project,", "운이 다한 프로젝트를 여전히 진행할 수도 있으며,"], ["and a project composed of good ideas", "훌륭한 아이디어로 구성된 프로젝트가"], ["may lack a stable center.", "안정적인 중심이 결여될 수도 있다."]]}, {"en": "When assembling a team with a common goal, always check the overall view as well as the individuals involved.", "ko": "공동의 목표를 가진 팀을 구성할 때, 관련된 개개인뿐만 아니라 전체적인 관점도 항상 확인하라.", "chunks": [["When assembling a team with a common goal,", "공동의 목표를 가진 팀을 구성할 때,"], ["always check the overall view", "항상 전체적인 관점을 확인하라"], ["as well as the individuals involved.", "관련된 개개인뿐만 아니라."]]}]}, {"no": "no.21", "title": "Why Imagination Can Never Be the Real Thing", "ktitle": "상상이 ‘진짜’만 못하게 설계된 이유", "field": "뇌과학 · 진화", "page": "2026 6월 학평 · no.21 (함축적 의미)", "oneline": "심상은 결코 실제만큼 진짜일 수 없고, 그것이 <span style=\"color:#1FA34A;font-weight:700\">유전자의 지혜로운 자기 절제</span> — 완벽한 대체물이라면 음식 찾을 동기를 잃고 <span style=\"color:#c8102e;font-weight:700\">굶어 죽을</span> 테니까요.", "metaphor": "<svg viewBox=\"0 0 600 264\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 머릿속 상상의 사과는 점선으로 흐릿하고 오른쪽 실제 사과는 실선으로 선명해, 심상은 결코 실제만큼 진짜일 수 없음을 보여 주고, 아래에 완벽한 대체물이면 굶어 죽으므로 이는 유전자의 지혜로운 자기 절제임을 적은 그림\">\n  <!-- 좌: 상상 -->\n  <g transform=\"translate(20, 24)\">\n    <text x=\"125\" y=\"-4\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">상상 — 내적 예행연습</text>\n    <rect x=\"0\" y=\"4\" width=\"250\" height=\"138\" fill=\"#fdf2f4\" fill-opacity=\"0.35\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n    <!-- 머리 옆모습 -->\n    <g transform=\"translate(70, 78)\">\n      <path d=\"M -28 26 Q -40 -2 -18 -22 Q 8 -38 30 -18 Q 40 -4 32 16 L 30 26 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"22\" cy=\"-4\" r=\"1.6\" fill=\"#1a1a1a\"/>\n      <!-- 상상의 사과 (점선·흐림) -->\n      <g opacity=\"0.6\" transform=\"translate(2, -2)\">\n        <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n        <path d=\"M 0 -11 Q 4 -16 8 -15\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      </g>\n    </g>\n    <text x=\"125\" y=\"118\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">rehearse · same brain regions</text>\n  </g>\n\n  <!-- 가운데 -->\n  <text x=\"300\" y=\"86\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n  <text x=\"300\" y=\"103\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\">not authentic</text>\n\n  <!-- 우: 실제 -->\n  <g transform=\"translate(330, 24)\">\n    <text x=\"125\" y=\"-4\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">실제 — the real thing</text>\n    <rect x=\"0\" y=\"4\" width=\"250\" height=\"138\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <!-- 실제 사과 (선명) -->\n    <g transform=\"translate(125, 76)\">\n      <circle cx=\"0\" cy=\"0\" r=\"26\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <path d=\"M 0 -26 Q 6 -36 14 -33\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n      <path d=\"M -3 -26 Q -10 -34 -16 -30\" fill=\"#1FA34A\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n    </g>\n    <text x=\"125\" y=\"120\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">vivid · authentic</text>\n  </g>\n\n  <!-- 하단: 함축 - 자기 절제 -->\n  <g transform=\"translate(0, 168)\">\n    <rect x=\"20\" y=\"0\" width=\"560\" height=\"78\" rx=\"6\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    <text x=\"40\" y=\"22\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" fill=\"#1a1a1a\">★ 함축 — 유전자의 지혜로운 자기 절제 (a wise bit of self-restraint)</text>\n    <!-- 조건 흐름 -->\n    <text x=\"48\" y=\"46\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#c8102e\">완벽한 대체물이면</text>\n    <line x1=\"152\" y1=\"42\" x2=\"180\" y2=\"42\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n    <polygon points=\"180,42 173,38 173,46\" fill=\"#c8102e\"/>\n    <text x=\"188\" y=\"46\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#c8102e\">음식 찾을 동기 없음</text>\n    <line x1=\"300\" y1=\"42\" x2=\"328\" y2=\"42\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n    <polygon points=\"328,42 321,38 321,46\" fill=\"#c8102e\"/>\n    <text x=\"336\" y=\"46\" font-family=\"Noto Serif KR\" font-size=\"10\" fill=\"#c8102e\" font-weight=\"700\">굶어 죽음 (starve)</text>\n    <!-- 야윈 인물 -->\n    <g transform=\"translate(495, 48)\" stroke=\"#c8102e\" stroke-width=\"1.3\" fill=\"none\">\n      <circle cx=\"0\" cy=\"-22\" r=\"6\" fill=\"#ffffff\"/>\n      <line x1=\"0\" y1=\"-16\" x2=\"0\" y2=\"-2\"/>\n      <line x1=\"0\" y1=\"-12\" x2=\"-7\" y2=\"-6\"/><line x1=\"0\" y1=\"-12\" x2=\"7\" y2=\"-6\"/>\n      <line x1=\"0\" y1=\"-2\" x2=\"-5\" y2=\"10\"/><line x1=\"0\" y1=\"-2\" x2=\"5\" y2=\"10\"/>\n    </g>\n    <text x=\"300\" y=\"68\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">∴ imagination cannot cloy the hungry edge of appetite</text>\n  </g>\n</svg>", "caption": "머릿속 상상의 진수성찬은 반투명하게 그려지고, 식탁의 진짜 빵 한 조각만 또렷한 — 일부러 흐리게 설계된 상상력 그림.", "tldr": ["인간은 시각적 심상의 달인 — 위험 없이 행동을 <span style=\"color:#1FA34A;font-weight:700\">미리 예행연습</span>하는 내적 모델을 진화시켰어요(상상할 때 실제 볼 때와 같은 뇌 영역 사용).", "그러나 진화는 심상이 <span style=\"color:#c8102e;font-weight:700\">결코 실제만큼 진짜일 수 없게</span> 만들었습니다.", "이유: 상상이 완벽한 대체물이면 배고플 때 진수성찬을 상상만 하고 — <span style=\"color:#c8102e;font-weight:700\">실제 음식을 찾을 동기를 잃어 굶어 죽을</span> 테니까요."], "analogy": "게임 속 음식 아이템을 아무리 먹어도 현실 배는 안 부르죠. 만약 게임 음식이 진짜 배를 채워 준다면 아무도 밥을 안 차릴 거예요. 상상이 ‘덜 진짜’인 건 버그가 아니라 생존용 사양이에요.", "bg": "분야는 진화심리·뇌과학이에요. ‘mental imagery(심상)’는 머릿속 그림, ‘self-restraint(자기 절제)’가 함축 표현의 핵심 — 능력의 한계가 사실은 ‘일부러 둔 한계’라는 역설이에요. → 심상의 ‘뛰어남’을 말하는 전반부와 ‘일부러 못 미치게 한’ 후반부가 어떻게 연결되는지 주목하며 읽으세요.", "flow": [{"kind": "주제", "t": "인간은 시각적 심상에 뛰어남"}, {"kind": "기능", "t": "위험 없이 행동을 예행연습하는 내적 모델 — 상상·실제 시 <span style=\"color:#1FA34A;font-weight:700\">같은 뇌 영역</span> 사용"}, {"kind": "반전", "t": "단, 진화는 심상이 <span style=\"color:#c8102e;font-weight:700\">결코 실제만큼 진짜일 수 없도록</span> 함"}, {"kind": "함축", "t": "이것은 유전자 편의 <span style=\"color:#1FA34A;font-weight:700\">지혜로운 자기 절제</span>"}, {"kind": "이유(가정)", "t": "완벽한 대체물이면 음식 찾을 동기 없이 굶어 죽음"}, {"kind": "인용", "t": "상상만으로는 굶주린 식욕을 채울 수 없다 (Bard)"}], "vocab": [["excel at", "~에 뛰어나다"], ["visual imagery", "시각적 심상"], ["evolve", "진화시키다·진화하다"], ["internal", "내적인"], ["rehearse", "예행연습하다"], ["forthcoming", "다가올·곧 있을"], ["penalty", "불이익·벌"], ["region", "영역·부위"], ["see to it that", "반드시 ~하도록 하다"], ["representation", "표상·표현"], ["authentic", "진짜의·진정한"], ["self-restraint", "자기 절제"], ["substitute", "대체물"], ["banquet", "연회·잔치"], ["consume", "먹다·소비하다"], ["incentive", "동기·유인"], ["starve to death", "굶어 죽다"]], "quiz": [["‘유전자의 지혜로운 자기 절제’가 뜻하는 것은?", "상상력을 <b>일부러 실제보다 덜 진짜로 설계</b>했다는 뜻이에요. 능력의 한계가 사실은 생존 장치인 거죠."], ["상상이 완벽한 대체물이면 왜 위험한가요?", "배고플 때 <b>진수성찬을 상상하는 것으로 만족</b>해 버려 실제 음식을 찾을 동기를 잃고 <b>굶어 죽게</b> 되니까요."]], "en": "Humans excel at visual imagery. Our brains evolved this ability to create an internal mental picture or model of the world in which we can rehearse forthcoming actions, without the risks or the penalties of doing them in the real world. There are even hints from brain-imaging studies by Harvard University psychologist Steve Kosslyn showing that your brain uses the same regions to imagine a scene as when you actually view one. But evolution has seen to it that such internally generated representations are never as authentic as the real thing. This is a wise bit of self-restraint on your genes’ part. If your internal model of the world were a perfect substitute, then anytime you felt hungry you could simply imagine yourself at a banquet, consuming a feast. You would have no incentive to find real food and would soon starve to death. As the Bard said, “You cannot cloy the hungry edge of appetite by bare imagination of a feast.”", "ko": "인간은 시각적 심상에 뛰어나다. 우리의 뇌는 실제 세계에서 그것들을 행하는 위험이나 불이익 없이, 다가올 행동들을 예행 연습할 수 있는 세계의 내적 정신적 그림 혹은 모델을 만들어내는 이 능력을 진화시켰다. 심지어 당신의 뇌가 장면을 상상하기 위해 당신이 실제로 장면을 볼 때와 같은 영역을 사용하는 것을 보여주는 Harvard 대학교 심리학자 Steve Kosslyn에 의한 뇌 영상 연구로부터 나온 단서도 있다. 그러나 진화는 그러한 내적으로 생성된 표상들이 결코 실제만큼 진짜일 수는 없도록 해 왔다. 이것은 당신의 유전자 편에서는 하나의 지혜로운 자기 절제이다. 만약 세계에 대한 당신의 내적 모델이 완벽한 대체물이라면, 당신이 언제든 배고픔을 느낄 때 연회에서 당신 자신이 진수성찬을 먹는 것을 단순히 상상할 것이다. 당신은 실제 음식을 찾을 동기가 전혀 없게 되고 곧 굶어 죽게 될 것이다. Bard가 말했듯, “진수성찬에 대한 있는 그대로의 상상으로 식욕의 굶주린 날을 배 불릴 수 없다.”", "read": [{"en": "Humans excel at visual imagery.", "ko": "인간은 시각적 심상에 뛰어나다.", "chunks": [["Humans excel at visual imagery.", "인간은 시각적 심상에 뛰어나다."]]}, {"en": "Our brains evolved this ability to create an internal mental picture or model of the world in which we can rehearse forthcoming actions, without the risks or the penalties of doing them in the real world.", "ko": "우리의 뇌는 실제 세계에서 그것들을 행하는 위험이나 불이익 없이, 다가올 행동들을 예행 연습할 수 있는 세계의 내적 정신적 그림 혹은 모델을 만들어내는 이 능력을 진화시켰다.", "chunks": [["Our brains evolved this ability", "우리의 뇌는 이 능력을 진화시켰다"], ["to create an internal mental picture or model of the world", "세계의 내적 정신적 그림 혹은 모델을 만들어내는"], ["in which we can rehearse forthcoming actions,", "그 안에서 우리가 다가올 행동들을 예행 연습할 수 있는,"], ["without the risks or the penalties", "위험이나 불이익 없이"], ["of doing them in the real world.", "실제 세계에서 그것들을 행하는."]]}, {"en": "There are even hints from brain-imaging studies by Harvard University psychologist Steve Kosslyn showing that your brain uses the same regions to imagine a scene as when you actually view one.", "ko": "심지어 당신의 뇌가 장면을 상상하기 위해 당신이 실제로 장면을 볼 때와 같은 영역을 사용하는 것을 보여주는 Harvard 대학교 심리학자 Steve Kosslyn에 의한 뇌 영상 연구로부터 나온 단서도 있다.", "chunks": [["There are even hints from brain-imaging studies", "심지어 뇌 영상 연구로부터 나온 단서도 있다"], ["by Harvard University psychologist Steve Kosslyn", "Harvard 대학교 심리학자 Steve Kosslyn에 의한"], ["showing that your brain uses the same regions", "당신의 뇌가 같은 영역을 사용하는 것을 보여주는"], ["to imagine a scene as when you actually view one.", "장면을 상상하기 위해 당신이 실제로 장면을 볼 때와 같은."]]}, {"en": "But evolution has seen to it that such internally generated representations are never as authentic as the real thing.", "ko": "그러나 진화는 그러한 내적으로 생성된 표상들이 결코 실제만큼 진짜일 수는 없도록 해 왔다.", "chunks": [["But evolution has seen to it", "그러나 진화는 반드시 ~하도록 해 왔다"], ["that such internally generated representations", "그러한 내적으로 생성된 표상들이"], ["are never as authentic as the real thing.", "결코 실제만큼 진짜일 수는 없도록."]]}, {"en": "This is a wise bit of self-restraint on your genes’ part.", "ko": "이것은 당신의 유전자 편에서는 하나의 지혜로운 자기 절제이다.", "chunks": [["This is a wise bit of self-restraint", "이것은 하나의 지혜로운 자기 절제이다"], ["on your genes’ part.", "당신의 유전자 편에서는."]]}, {"en": "If your internal model of the world were a perfect substitute, then anytime you felt hungry you could simply imagine yourself at a banquet, consuming a feast.", "ko": "만약 세계에 대한 당신의 내적 모델이 완벽한 대체물이라면, 당신이 언제든 배고픔을 느낄 때 연회에서 당신 자신이 진수성찬을 먹는 것을 단순히 상상할 것이다.", "chunks": [["If your internal model of the world were a perfect substitute,", "만약 세계에 대한 당신의 내적 모델이 완벽한 대체물이라면,"], ["then anytime you felt hungry", "당신이 언제든 배고픔을 느낄 때"], ["you could simply imagine yourself at a banquet,", "연회에서 당신 자신을 단순히 상상할 것이다,"], ["consuming a feast.", "진수성찬을 먹는."]]}, {"en": "You would have no incentive to find real food and would soon starve to death.", "ko": "당신은 실제 음식을 찾을 동기가 전혀 없게 되고 곧 굶어 죽게 될 것이다.", "chunks": [["You would have no incentive", "당신은 동기가 전혀 없게 될 것이다"], ["to find real food", "실제 음식을 찾을"], ["and would soon starve to death.", "그리고 곧 굶어 죽게 될 것이다."]]}, {"en": "As the Bard said, “You cannot cloy the hungry edge of appetite by bare imagination of a feast.”", "ko": "Bard가 말했듯, “진수성찬에 대한 있는 그대로의 상상으로 식욕의 굶주린 날을 배 불릴 수 없다.”", "chunks": [["As the Bard said,", "Bard가 말했듯,"], ["“You cannot cloy the hungry edge of appetite", "“식욕의 굶주린 날을 배 불릴 수 없다"], ["by bare imagination of a feast.”", "진수성찬에 대한 있는 그대로의 상상으로.”"]]}]}, {"no": "no.22", "title": "We Overestimate Low-Probability Events", "ktitle": "작은 확률일수록 크게 보인다", "field": "심리 · 행동경제", "page": "2026 6월 학평 · no.22 (글의 요지)", "oneline": "사람들은 낮은 확률 사건을 객관적 확률보다 <span style=\"color:#c8102e;font-weight:700\">더 크게 의사결정에 반영</span>해요 — 확률이 작을수록 <span style=\"color:#c8102e;font-weight:700\">과대평가는 더 심해집니다</span>.", "metaphor": "<svg viewBox=\"0 0 600 258\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 객관적 1퍼센트의 작은 막대가 가운데 돋보기를 지나며 오른쪽 주관적 5퍼센트로 부풀려져, 낮은 확률 사건을 과대평가함을 보여 주고 아래에 복권의 1억 7천5백만 분의 1 예시를 적은 그림\">\n  <!-- 좌: 객관 확률 -->\n  <g transform=\"translate(20, 28)\">\n    <text x=\"95\" y=\"-6\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">객관적 확률</text>\n    <rect x=\"0\" y=\"4\" width=\"190\" height=\"120\" fill=\"#ffffff\" stroke=\"#999\" stroke-width=\"1.2\"/>\n    <!-- 작은 막대 1% -->\n    <line x1=\"30\" y1=\"105\" x2=\"160\" y2=\"105\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <rect x=\"80\" y=\"96\" width=\"30\" height=\"9\" fill=\"#1a1a1a\"/>\n    <text x=\"95\" y=\"88\" font-family=\"Noto Serif\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">1%</text>\n    <text x=\"95\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">objective</text>\n    <text x=\"95\" y=\"53\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">실제 가능성</text>\n  </g>\n\n  <!-- 가운데: 돋보기 (왜곡) -->\n  <g transform=\"translate(248, 88)\">\n    <circle cx=\"0\" cy=\"0\" r=\"26\" fill=\"#fdf2f4\" fill-opacity=\"0.5\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <line x1=\"18\" y1=\"18\" x2=\"38\" y2=\"38\" stroke=\"#c8102e\" stroke-width=\"3\"/>\n    <text x=\"0\" y=\"4\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">weight</text>\n    <text x=\"0\" y=\"-40\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">주관적 가중</text>\n  </g>\n  <g transform=\"translate(300, 88)\">\n    <line x1=\"0\" y1=\"0\" x2=\"22\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n    <polygon points=\"22,0 14,-5 14,5\" fill=\"#c8102e\"/>\n  </g>\n\n  <!-- 우: 주관 확률 (부풀림) -->\n  <g transform=\"translate(340, 28)\">\n    <text x=\"120\" y=\"-6\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">주관적 가중 — 과대평가</text>\n    <rect x=\"0\" y=\"4\" width=\"240\" height=\"120\" fill=\"#fdf2f4\" fill-opacity=\"0.4\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n    <line x1=\"30\" y1=\"105\" x2=\"210\" y2=\"105\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <rect x=\"95\" y=\"44\" width=\"48\" height=\"61\" fill=\"#c8102e\" fill-opacity=\"0.55\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n    <text x=\"119\" y=\"36\" font-family=\"Noto Serif\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">5%</text>\n    <text x=\"119\" y=\"120\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">feels like</text>\n  </g>\n\n  <!-- 하단: 일반화 + 복권 예시 -->\n  <g transform=\"translate(0, 162)\">\n    <rect x=\"20\" y=\"0\" width=\"560\" height=\"80\" rx=\"6\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    <text x=\"40\" y=\"24\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" fill=\"#1a1a1a\">★ 요지 — 확률이 작을수록 과대평가가 더 심하다</text>\n    <text x=\"40\" y=\"46\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" fill=\"#5e5e5e\">the smaller the probability, the more we overestimate it</text>\n    <!-- 복권 -->\n    <g transform=\"translate(360, 14)\">\n      <rect x=\"0\" y=\"0\" width=\"180\" height=\"52\" rx=\"4\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n      <text x=\"90\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">LOTTERY · \"I'll win!\"</text>\n      <text x=\"90\" y=\"40\" font-family=\"Noto Serif\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">odds: 1 in 175,000,000</text>\n    </g>\n  </g>\n</svg>", "caption": "저울 위 ‘1%’ 추가 주관의 돋보기를 통과하자 ‘5%’만큼 무겁게 내려앉는 그림 — 옆엔 복권 한 장.", "tldr": ["우리는 1퍼센트의 가능성을 정말 1퍼센트로 취급할까요? — 아니요.", "낮은 확률 사건(약 25% 이하)은 마땅한 정도보다 <span style=\"color:#c8102e;font-weight:700\">더 크게 의사결정에 반영</span>돼요 — 객관적 1%가 주관적 5%처럼 보이죠.", "확률이 작을수록 과대평가는 심해져요 — 복권 구매자의 낙관 vs 실제 당첨 확률 <span style=\"color:#c8102e;font-weight:700\">1억 7,500만 분의 1</span>."], "analogy": "비행기 사고 확률은 벼락 맞을 확률보다 낮은데도 이륙 때마다 손잡이를 꽉 쥐죠. 반대로 복권은 ‘혹시 나?’ 하고요. 아주 작은 확률 앞에서 우리 마음의 저울은 늘 한쪽으로 기울어요.", "bg": "분야는 행동경제학, 확률 인지예요. ‘objective probability(객관적 확률)’와 ‘subjective weight(주관적 가중치)’의 어긋남이 주제 — 전망 이론에서 다루는 대표적 편향이에요. → ‘1%를 1%로 취급하는가?’라는 질문에 글이 어떤 답과 근거(수치 예시)를 내놓는지 따라가며 읽으세요.", "flow": [{"kind": "도입", "t": "객관적 확률 vs 주관적 가중치 — 1퍼센트를 그대로 받아들이는가?"}, {"kind": "정의", "t": "낮은 확률 사건 = 약 25퍼센트 이하의 확률"}, {"kind": "요지", "t": "낮은 확률 사건은 <span style=\"color:#c8102e;font-weight:700\">마땅한 정도보다 더 크게 의사결정에 반영</span>"}, {"kind": "부연", "t": "객관적 1퍼센트가 주관적 5퍼센트처럼 보임 → 가능성 과대평가"}, {"kind": "일반화", "t": "확률이 작을수록 과대평가가 더 심함"}, {"kind": "예시", "t": "복권 구매자의 낙관 vs 실제 당첨 <span style=\"color:#c8102e;font-weight:700\">1억 7,500만 분의 1</span>"}], "vocab": [["objective", "객관적인"], ["probability", "확률·가능성"], ["subjective", "주관적인"], ["weight", "가중치·비중"], ["treat", "취급하다·다루다"], ["be likely", "그럴 듯하다·가능성이 높다"], ["define", "정의하다"], ["factor into", "~에 반영되다·요인이 되다"], ["occur", "발생하다·일어나다"], ["overestimate", "과대평가하다"], ["likelihood", "가능성"], ["optimistic", "낙관적인"], ["odds", "확률·승산"], ["lottery", "복권"], ["on the order of", "대략 ~의 정도로"]], "quiz": [["‘객관적 1%가 주관적 5%처럼 보인다’는 말의 뜻은?", "실제 확률은 1%인데 의사결정에서는 <b>5%만큼의 무게로 반영</b>된다는 — 낮은 확률의 과대평가예요."], ["복권 예시가 보여주는 일반 원리는?", "<b>확률이 작을수록 과대평가가 더 심해진다</b>는 것 — 1억 7,500만 분의 1인데도 사람들은 당첨을 낙관해요."]], "en": "For each objective probability — from one percent to 100 percent — we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could happen but aren’t likely — low-probability events — can be defined as probabilities up to about 25 percent. Low-probability events tend to factor more into decisions than they should. That is, an event that has an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. We overestimate the likelihood of these low-probability events. In general, the smaller the probability, the more we overestimate its likelihood. For example, people who play the lottery are often optimistic about winning. However, the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million.", "ko": "각각의 객관적 확률 — 1퍼센트부터 100퍼센트까지 — 에 대해 우리는 주관적인 확률의 가중치를 알고 싶어 한다. 우리가 의사를 결정할 때, 우리는 1퍼센트의 가능성을 단순히 1퍼센트로 취급하는가, 아니면 다른 것으로 취급하는가? 발생할 수 있으나 그럴 것 같지 않은 사건들은 — 낮은 확률 사건들은 — 대략 25퍼센트까지의 확률로 정의될 수 있다. 낮은 확률 사건들은 그래야 하는 것보다 더 크게 의사결정에 반영되는 경향이 있다. 즉, 객관적인 1퍼센트의 발생 가능성을 가진 사건이 주관적으로는 5퍼센트의 발생 가능성을 가진 것처럼 보일 수 있다. 우리는 이러한 낮은 확률 사건의 가능성을 과대평가한다. 일반적으로, 확률이 더 작을수록, 우리는 그것의 가능성을 더 과대평가한다. 예를 들어, 복권을 사는 사람들은 당첨되는 것에 대해 낙관하는 경우가 흔하다. 그러나, 가장 규모가 크고, 가장 인기있는 미국 복권에 단 하나의 티켓이 당첨될 가능성은 1억 7,500만 분의 1과 비슷하다.", "read": [{"en": "For each objective probability — from one percent to 100 percent — we want to know the subjective probability weight.", "ko": "각각의 객관적 확률 — 1퍼센트부터 100퍼센트까지 — 에 대해 우리는 주관적인 확률의 가중치를 알고 싶어 한다.", "chunks": [["For each objective probability", "각각의 객관적 확률에 대해"], ["— from one percent to 100 percent —", "— 1퍼센트부터 100퍼센트까지 —"], ["we want to know the subjective probability weight.", "우리는 주관적인 확률의 가중치를 알고 싶어 한다."]]}, {"en": "When we make decisions, do we treat a one-percent chance just like one percent, or like something else?", "ko": "우리가 의사를 결정할 때, 우리는 1퍼센트의 가능성을 단순히 1퍼센트로 취급하는가, 아니면 다른 것으로 취급하는가?", "chunks": [["When we make decisions,", "우리가 의사를 결정할 때,"], ["do we treat a one-percent chance just like one percent,", "우리는 1퍼센트의 가능성을 단순히 1퍼센트로 취급하는가,"], ["or like something else?", "아니면 다른 것으로 취급하는가?"]]}, {"en": "Events that could happen but aren’t likely — low-probability events — can be defined as probabilities up to about 25 percent.", "ko": "발생할 수 있으나 그럴 것 같지 않은 사건들은 — 낮은 확률 사건들은 — 대략 25퍼센트까지의 확률로 정의될 수 있다.", "chunks": [["Events that could happen but aren’t likely", "발생할 수 있으나 그럴 것 같지 않은 사건들은"], ["— low-probability events —", "— 낮은 확률 사건들은 —"], ["can be defined as probabilities up to about 25 percent.", "대략 25퍼센트까지의 확률로 정의될 수 있다."]]}, {"en": "Low-probability events tend to factor more into decisions than they should.", "ko": "낮은 확률 사건들은 그래야 하는 것보다 더 크게 의사결정에 반영되는 경향이 있다.", "chunks": [["Low-probability events tend to factor more into decisions", "낮은 확률 사건들은 의사결정에 더 크게 반영되는 경향이 있다"], ["than they should.", "그래야 하는 것보다."]]}, {"en": "That is, an event that has an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring.", "ko": "즉, 객관적인 1퍼센트의 발생 가능성을 가진 사건이 주관적으로는 5퍼센트의 발생 가능성을 가진 것처럼 보일 수 있다.", "chunks": [["That is, an event", "즉, 한 사건이"], ["that has an objective one-percent chance of occurring", "객관적인 1퍼센트의 발생 가능성을 가진"], ["could subjectively seem like", "주관적으로는 ~처럼 보일 수 있다"], ["it has a five-percent chance of occurring.", "5퍼센트의 발생 가능성을 가진 것."]]}, {"en": "We overestimate the likelihood of these low-probability events.", "ko": "우리는 이러한 낮은 확률 사건의 가능성을 과대평가한다.", "chunks": [["We overestimate the likelihood", "우리는 가능성을 과대평가한다"], ["of these low-probability events.", "이러한 낮은 확률 사건들의."]]}, {"en": "In general, the smaller the probability, the more we overestimate its likelihood.", "ko": "일반적으로, 확률이 더 작을수록, 우리는 그것의 가능성을 더 과대평가한다.", "chunks": [["In general,", "일반적으로,"], ["the smaller the probability,", "확률이 더 작을수록,"], ["the more we overestimate its likelihood.", "우리는 그것의 가능성을 더 과대평가한다."]]}, {"en": "For example, people who play the lottery are often optimistic about winning.", "ko": "예를 들어, 복권을 사는 사람들은 당첨되는 것에 대해 낙관하는 경우가 흔하다.", "chunks": [["For example,", "예를 들어,"], ["people who play the lottery", "복권을 사는 사람들은"], ["are often optimistic about winning.", "당첨되는 것에 대해 낙관하는 경우가 흔하다."]]}, {"en": "However, the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million.", "ko": "그러나, 가장 규모가 크고, 가장 인기있는 미국 복권에 단 하나의 티켓이 당첨될 가능성은 1억 7,500만 분의 1과 비슷하다.", "chunks": [["However, the odds of a single ticket winning", "그러나, 단 하나의 티켓이 당첨될 가능성은"], ["the largest, most popular U.S. lotteries", "가장 규모가 크고, 가장 인기있는 미국 복권에서"], ["are on the order of one in 175 million.", "1억 7,500만 분의 1과 비슷하다."]]}]}, {"no": "no.23", "title": "How a Common Currency Lowers Trade Barriers", "ktitle": "공동 통화 — 쓸모없는 비용을 생산적 비용으로", "field": "경제 · 무역", "page": "2026 6월 학평 · no.23 (글의 주제)", "oneline": "공동 통화는 <span style=\"color:#c8102e;font-weight:700\">거래 비용</span>을 없애 그 절감분을 <span style=\"color:#1FA34A;font-weight:700\">생산성·혁신에 재투자</span>하게 하고 — 경제 전체에 강력한 토대를 제공합니다.", "metaphor": "<svg viewBox=\"0 0 600 256\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 전환·지급·헤지 같은 거래 비용으로 동전이 새어 나가는 모습이, 가운데 공동 통화를 거쳐 오른쪽 절감분이 생산성·혁신에 재투자되는 강력한 경제 토대로 바뀌는 그림\">\n  <!-- 좌: 거래 비용 (낭비) -->\n  <g transform=\"translate(20, 26)\">\n    <text x=\"115\" y=\"-4\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">거래 비용 — 쓸모없는 비용</text>\n    <rect x=\"0\" y=\"4\" width=\"230\" height=\"160\" fill=\"#fdf2f4\" fill-opacity=\"0.4\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n    <!-- 새는 돈자루 -->\n    <g transform=\"translate(60, 64)\">\n      <!-- 묶인 목 + 매듭 끈 -->\n      <path d=\"M -10 -34 L 10 -34 L 7 -24 L -7 -24 Z\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <line x1=\"-10\" y1=\"-30\" x2=\"10\" y2=\"-30\" stroke=\"#c8102e\" stroke-width=\"2\"/>\n      <path d=\"M -10 -34 Q -17 -37 -14 -29\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <path d=\"M 10 -34 Q 17 -37 14 -29\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.2\"/>\n      <!-- 자루 몸통 (바닥에 찢어진 V 구멍) -->\n      <path d=\"M -7 -24 Q -30 -18 -30 6 Q -30 26 -10 30 L -3 30 L 3 21 L 9 30 L 10 30 Q 30 26 30 6 Q 30 -18 7 -24 Z\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <!-- 돈 표시 -->\n      <text x=\"0\" y=\"7\" font-family=\"Noto Serif\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">$</text>\n      <!-- 구멍에서 새어 나가는 동전 (아래로) -->\n      <g fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.1\">\n        <circle cx=\"3\" cy=\"41\" r=\"5.5\"/>\n        <circle cx=\"-3\" cy=\"54\" r=\"4.5\"/>\n        <circle cx=\"4\" cy=\"66\" r=\"3.8\"/>\n      </g>\n      <text x=\"3\" y=\"44\" font-family=\"Noto Serif\" font-size=\"7\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">$</text>\n      <text x=\"-3\" y=\"57\" font-family=\"Noto Serif\" font-size=\"6\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">$</text>\n    </g>\n    <g font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#c8102e\" font-weight=\"700\">\n      <text x=\"150\" y=\"50\">converting</text>\n      <text x=\"150\" y=\"78\">paying</text>\n      <text x=\"150\" y=\"106\">hedging</text>\n    </g>\n    <text x=\"115\" y=\"150\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">시장 진입 비용 = 진짜 장벽</text>\n  </g>\n\n  <!-- 가운데: 공동 통화 -->\n  <g transform=\"translate(258, 92)\">\n    <line x1=\"0\" y1=\"0\" x2=\"46\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"2.2\"/>\n    <polygon points=\"46,0 37,-6 37,6\" fill=\"#1FA34A\"/>\n    <circle cx=\"23\" cy=\"-26\" r=\"15\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <text x=\"23\" y=\"-22\" font-family=\"Noto Serif\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">$</text>\n    <text x=\"23\" y=\"-44\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">공동 통화</text>\n    <text x=\"23\" y=\"20\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">costs disappear</text>\n  </g>\n\n  <!-- 우: 재투자 -->\n  <g transform=\"translate(330, 26)\">\n    <text x=\"125\" y=\"-4\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">생산적 비용 — 재투자</text>\n    <rect x=\"0\" y=\"4\" width=\"250\" height=\"160\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <!-- 토대 블록 + 위로 자라는 화살표 -->\n    <g transform=\"translate(125, 118)\">\n      <rect x=\"-80\" y=\"0\" width=\"160\" height=\"22\" fill=\"#1FA34A\" fill-opacity=\"0.18\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <text x=\"0\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">strong economic foundation</text>\n      <!-- 성장 화살표 -->\n      <line x1=\"-40\" y1=\"0\" x2=\"-40\" y2=\"-46\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <polygon points=\"-40,-46 -45,-38 -35,-38\" fill=\"#1FA34A\"/>\n      <text x=\"-40\" y=\"-54\" font-family=\"Noto Serif\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">productivity</text>\n      <line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"-58\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <polygon points=\"40,-58 35,-50 45,-50\" fill=\"#1FA34A\"/>\n      <text x=\"40\" y=\"-66\" font-family=\"Noto Serif\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">innovation</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">useless costs turn into productive costs — all can benefit</text>\n</svg>", "caption": "국경마다 서 있던 ‘환전·수수료’ 톨게이트들이 하나의 통화 깃발 아래 사라지고, 그 돈이 공장과 연구소로 흘러드는 그림.", "tldr": ["무역 장벽의 진짜 원인은 시장 부족이 아니라 <span style=\"color:#c8102e;font-weight:700\">시장 진입 비용</span> — 교환·전환·지급·헤지 비용이 상당해요.", "공동 통화 → 그 거래 비용들이 사라지고 절감분이 <span style=\"color:#1FA34A;font-weight:700\">생산성과 혁신에 재투자</span>됩니다.", "쓸모없는 비용이 생산적 비용으로 — 통화를 통합한 경제는 독립체일 때보다 더 성장해요."], "analogy": "해외 직구할 때마다 환전 수수료·카드 수수료가 붙으면 그만큼 물건값이 비싸지죠. 같은 화폐를 쓰는 순간 그 수수료가 통째로 사라지고 — 아낀 돈으로 더 좋은 물건을 만들 수 있게 되는 거예요.", "bg": "분야는 경제학, 통화·무역이에요. ‘transaction costs(거래 비용)’는 거래 자체에 드는 부대 비용, ‘common currency(공동 통화)’는 유로화처럼 여러 나라가 함께 쓰는 화폐. → ‘장벽의 진짜 원인’ 진단에서 출발해 공동 통화가 그 비용을 어떻게 바꾸는지, 변환의 사슬을 따라가며 읽으세요.", "flow": [{"kind": "문제", "t": "무역 장벽의 진짜 원인 = 시장 부족이 아니라 <span style=\"color:#c8102e;font-weight:700\">시장 진입 비용</span>"}, {"kind": "배경", "t": "거래 비용 = 직접 교환 + 전환·지급·헤지 비용"}, {"kind": "주제", "t": "공동 통화 → 거래 비용 소멸, 절감분을 <span style=\"color:#1FA34A;font-weight:700\">생산성·혁신에 재투자</span>"}, {"kind": "전환", "t": "쓸모없는 비용이 생산적 비용으로 — 경제 전체에 장기 이익"}, {"kind": "근거", "t": "통화 통합 시 독립체일 때보다 더 많이 이익·성장"}, {"kind": "결론", "t": "공동 통화 = 모두가 이익 얻는 강력한 경제적 토대"}], "vocab": [["barrier", "장벽·장애물"], ["a lack of", "~의 부족"], ["competitive", "경쟁력 있는"], ["transaction cost", "거래 비용"], ["significant", "상당한·중요한"], ["straight", "직접적인"], ["convert", "전환하다"], ["hedge", "헤지 거래를 하다·위험을 회피하다"], ["common currency", "공동 통화"], ["disappear", "사라지다"], ["savings", "절감분·절약액"], ["reinvest", "재투자하다"], ["productivity", "생산성"], ["innovation", "혁신"], ["productive", "생산적인"], ["unify", "통합하다"], ["foundation", "토대·기반"]], "quiz": [["무역 장벽의 ‘진짜 원인’으로 글이 지목하는 것은?", "시장·고객의 부족이 아니라, 제품을 경쟁력 있는 가격에 내놓기 어렵게 만드는 <b>거래 비용(전환·지급·헤지 등)</b>이에요."], ["‘쓸모없는 비용 → 생산적 비용’ 전환의 의미는?", "환전·수수료에 새던 돈이 공동 통화로 절약되어 <b>생산성과 혁신에 재투자</b>된다는 뜻이에요."]], "en": "Many of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at competitive prices. Transaction costs are significant for companies — not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency means that many of those transaction costs disappear and the savings can be reinvested back into firms’ productivity and innovation. Basically, useless costs turn into productive costs — with longer-term benefits to the whole economy. By unifying some of the currencies, whole economies benefit and grow more than they would as independents. So a common currency provides for a strong economic foundation that all can benefit from.", "ko": "무역에 대한 많은 장벽들은 시장이나 고객의 부족 때문이 아니라, 제품들을 경쟁력 있는 가격으로 시장에 내놓는 데에 큰 장벽들이 있기 때문에 존재하는 것이다. 거래 비용은 기업들에 상당한데 — 단지 직접적인 교환 비용들뿐만 아니라, 상품과 서비스에 대해 지불하기 위해서 자금을 전환하고, 지급하고, 그리고 헤지 거래를 하는 비용 또한 그러하다. 공동 통화를 갖는다는 것은 그러한 많은 거래 비용들이 사라지고 그 절감분이 기업들의 생산성과 혁신으로 재투자될 수 있음을 의미한다. 기본적으로, 쓸모없는 비용들이 생산적인 비용들로 전환된다 — 전체 경제에 대한 더 장기적인 이익들과 함께. 일부 통화들을 통합함으로써, 전체 경제들은 독립체들로서 그렇게 될 것보다 더 많이 이익을 받고 성장한다. 그러므로 공동 통화는 모두가 이익을 얻을 수 있는 강력한 경제적 토대를 제공한다.", "read": [{"en": "Many of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at competitive prices.", "ko": "무역에 대한 많은 장벽들은 시장이나 고객의 부족 때문이 아니라, 제품들을 경쟁력 있는 가격으로 시장에 내놓는 데에 큰 장벽들이 있기 때문에 존재하는 것이다.", "chunks": [["Many of the barriers to trade exist", "무역에 대한 많은 장벽들은 존재한다"], ["not because of a lack of markets or customers,", "시장이나 고객의 부족 때문이 아니라,"], ["but because there are major barriers", "큰 장벽들이 있기 때문에"], ["to getting products to market at competitive prices.", "제품들을 경쟁력 있는 가격으로 시장에 내놓는 데에."]]}, {"en": "Transaction costs are significant for companies — not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services.", "ko": "거래 비용은 기업들에 상당한데 — 단지 직접적인 교환 비용들뿐만 아니라, 상품과 서비스에 대해 지불하기 위해서 자금을 전환하고, 지급하고, 그리고 헤지 거래를 하는 비용 또한 그러하다.", "chunks": [["Transaction costs are significant for companies", "거래 비용은 기업들에 상당하다"], ["— not only the straight exchange costs,", "— 단지 직접적인 교환 비용들뿐만 아니라,"], ["but also the cost of converting, paying, and hedging funds", "자금을 전환하고, 지급하고, 그리고 헤지 거래를 하는 비용 또한"], ["just to pay for the goods and services.", "상품과 서비스에 대해 지불하기 위해서."]]}, {"en": "Having a common currency means that many of those transaction costs disappear and the savings can be reinvested back into firms’ productivity and innovation.", "ko": "공동 통화를 갖는다는 것은 그러한 많은 거래 비용들이 사라지고 그 절감분이 기업들의 생산성과 혁신으로 재투자될 수 있음을 의미한다.", "chunks": [["Having a common currency means", "공동 통화를 갖는다는 것은 의미한다"], ["that many of those transaction costs disappear", "그러한 많은 거래 비용들이 사라지고"], ["and the savings can be reinvested", "그 절감분이 재투자될 수 있음을"], ["back into firms’ productivity and innovation.", "기업들의 생산성과 혁신으로."]]}, {"en": "Basically, useless costs turn into productive costs — with longer-term benefits to the whole economy.", "ko": "기본적으로, 쓸모없는 비용들이 생산적인 비용들로 전환된다 — 전체 경제에 대한 더 장기적인 이익들과 함께.", "chunks": [["Basically,", "기본적으로,"], ["useless costs turn into productive costs", "쓸모없는 비용들이 생산적인 비용들로 전환된다"], ["— with longer-term benefits to the whole economy.", "— 전체 경제에 대한 더 장기적인 이익들과 함께."]]}, {"en": "By unifying some of the currencies, whole economies benefit and grow more than they would as independents.", "ko": "일부 통화들을 통합함으로써, 전체 경제들은 독립체들로서 그렇게 될 것보다 더 많이 이익을 받고 성장한다.", "chunks": [["By unifying some of the currencies,", "일부 통화들을 통합함으로써,"], ["whole economies benefit and grow more", "전체 경제들은 더 많이 이익을 받고 성장한다"], ["than they would as independents.", "독립체들로서 그렇게 될 것보다."]]}, {"en": "So a common currency provides for a strong economic foundation that all can benefit from.", "ko": "그러므로 공동 통화는 모두가 이익을 얻을 수 있는 강력한 경제적 토대를 제공한다.", "chunks": [["So a common currency provides for", "그러므로 공동 통화는 제공한다"], ["a strong economic foundation", "강력한 경제적 토대를"], ["that all can benefit from.", "모두가 이익을 얻을 수 있는."]]}]}, {"no": "no.24", "title": "Looking at Stars Is Looking Back in Time", "ktitle": "별을 본다는 것은 과거를 본다는 것", "field": "천문 · 우주", "page": "2026 6월 학평 · no.24 (글의 제목)", "oneline": "별빛은 도달까지 시간이 걸려요 — 별을 본다는 것은 <span style=\"color:#1FA34A;font-weight:700\">과거를 보는 것</span>, 더 먼 빛일수록 더 먼 과거이고 그래서 <span style=\"color:#1FA34A;font-weight:700\">우주의 역사</span>를 이해할 수 있죠.", "metaphor": "<svg viewBox=\"0 0 600 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"오른쪽 지구의 관측자에게 가까운 별은 4년, Betelgeuse는 600년 이상, Orion 벨트는 천 년 이상 전에 출발한 빛이 도달해, 별을 보는 것은 곧 과거를 보는 것임을 거리·시간 축으로 보여 주는 그림\">\n  <!-- 시간 축 -->\n  <g transform=\"translate(20, 40)\">\n    <text x=\"280\" y=\"-12\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">멀수록 더 먼 과거 — looking back in time</text>\n    <line x1=\"0\" y1=\"150\" x2=\"560\" y2=\"150\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"6\" y=\"168\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#5e5e5e\">deep past</text>\n    <text x=\"540\" y=\"168\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#5e5e5e\">now</text>\n\n    <!-- 관측자(지구) 우측 -->\n    <g transform=\"translate(520, 110)\">\n      <circle cx=\"0\" cy=\"0\" r=\"16\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <ellipse cx=\"0\" cy=\"0\" rx=\"16\" ry=\"6\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n      <text x=\"0\" y=\"34\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">Earth</text>\n    </g>\n\n    <!-- 별1: 가까운 별 4yr -->\n    <g transform=\"translate(400, 60)\">\n      <g fill=\"#1a1a1a\"><polygon points=\"0,-7 2,-2 7,-2 3,1 4,6 0,3 -4,6 -3,1 -7,-2 -2,-2\"/></g>\n      <line x1=\"6\" y1=\"2\" x2=\"104\" y2=\"48\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>\n      <polygon points=\"104,48 96,45 99,52\" fill=\"#c8102e\"/>\n      <text x=\"0\" y=\"-14\" font-family=\"Noto Serif\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">nearest star</text>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">4 years ago</text>\n    </g>\n    <!-- 별2: Betelgeuse 600+ -->\n    <g transform=\"translate(225, 48)\">\n      <g fill=\"#1a1a1a\"><polygon points=\"0,-8 2,-2 8,-2 3,1 5,7 0,3 -5,7 -3,1 -8,-2 -2,-2\"/></g>\n      <line x1=\"7\" y1=\"3\" x2=\"278\" y2=\"68\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>\n      <polygon points=\"278,68 270,65 272,72\" fill=\"#c8102e\"/>\n      <text x=\"0\" y=\"-15\" font-family=\"Noto Serif\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">Betelgeuse</text>\n      <text x=\"0\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">600+ yrs ago</text>\n    </g>\n    <!-- 별3: Orion 1000+ -->\n    <g transform=\"translate(55, 38)\">\n      <g fill=\"#1a1a1a\"><polygon points=\"0,-9 2,-2 9,-2 3,2 5,8 0,4 -5,8 -3,2 -9,-2 -2,-2\"/></g>\n      <line x1=\"8\" y1=\"4\" x2=\"448\" y2=\"80\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>\n      <polygon points=\"448,80 440,78 441,85\" fill=\"#c8102e\"/>\n      <text x=\"0\" y=\"-16\" font-family=\"Noto Serif\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">Orion's belt</text>\n      <text x=\"0\" y=\"24\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">1,000+ yrs travel</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <text x=\"300\" y=\"238\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">★ Looking at stars is looking back in time — understanding the universe's history</text>\n</svg>", "caption": "밤하늘을 올려다보는 사람의 시선이 망원경을 지나 중세의 풍경, 천 년 전의 풍경으로 거슬러 올라가는 — 하늘이 타임머신인 그림.", "tldr": ["가장 가까운 별의 빛도 우리에게 오는 데 <span style=\"color:#1FA34A;font-weight:700\">4년</span>이 걸려요 — 별을 보는 건 과거를 보는 것.", "더 먼 빛을 모을수록 더 먼 과거 — Betelgeuse의 붉은 빛은 <span style=\"color:#1FA34A;font-weight:700\">중세에 출발</span>(600년+), Orion 벨트의 빛은 최소 1,000년을 여행했어요.", "그 덕분에 우리는 우주의 더 먼 부분을 수천·수백만·수십억 년 전 모습으로 보며 <span style=\"color:#1FA34A;font-weight:700\">우주의 역사</span>를 이해할 수 있습니다."], "analogy": "지금 도착한 손편지가 사실 600년 전에 부쳐진 거라면, 그 편지를 읽는 건 600년 전의 소식을 읽는 거죠. 밤하늘은 그런 편지가 끝없이 도착하는 우편함이에요 — 멀리서 온 편지일수록 더 오래된 소식.", "bg": "분야는 천문학이에요. 빛의 속도는 유한해서 별빛이 지구에 닿기까지 시간이 걸린다는 게 출발점 — Betelgeuse(베텔게우스)는 Orion(오리온)자리의 붉은 별이에요. → ‘별 보기 = 과거 보기’라는 핵심 등식이 두 예시(600년·1,000년)를 거쳐 어떤 결론(우주의 역사)으로 확장되는지 따라가며 읽으세요.", "flow": [{"kind": "도입", "t": "가장 가까운 별빛조차 도달에 4년"}, {"kind": "핵심", "t": "별을 본다는 것 = <span style=\"color:#1FA34A;font-weight:700\">과거를 보는 것</span> — 놀라운 선물"}, {"kind": "원리", "t": "더 먼 빛일수록 더 먼 과거"}, {"kind": "예시 1", "t": "Betelgeuse = 600년 이상 거슬러 — 그 빛은 중세에 출발"}, {"kind": "예시 2", "t": "Orion 벨트 별빛 = 최소 1,000년을 이동해 도달"}, {"kind": "결론", "t": "먼 별빛 덕에 <span style=\"color:#1FA34A;font-weight:700\">우주의 역사를 이해할 기회</span>"}], "vocab": [["stellar", "별의"], ["neighbour", "이웃"], ["look back in time", "과거의 시간을 돌아보다"], ["incredible", "놀라운·믿기 힘든"], ["the further ~, the further", "더 멀수록, 더 멀리"], ["collect", "모으다·수집하다"], ["glow", "빛나다"], ["constellation", "별자리"], ["wind ~ back", "~을 거슬러 올라가다·되감다"], ["reddish", "붉은빛이 도는"], ["journey", "여정·여행"], ["the Middle Ages", "중세 시대"], ["belt", "벨트·띠"], ["familiar", "익숙한"], ["generation", "세대"], ["distant", "먼·멀리 떨어진"], ["the history of the universe", "우주의 역사"]], "quiz": [["‘별을 본다 = 과거를 본다’가 성립하는 이유는?", "빛이 우리에게 <b>도달하기까지 시간이 걸리기 때문</b>이에요. 지금 보는 별빛은 수년~수천 년 전에 출발한 빛이죠."], ["Betelgeuse의 빛이 ‘중세에 출발했다’는 말의 의미는?", "그 별이 <b>600년 이상 떨어져 있어서</b>, 지금 보이는 붉은 빛이 중세 시대에 그 별을 떠난 빛이라는 뜻이에요."]], "en": "The light from even our nearest stellar neighbour takes four years to reach us. When we look at the stars, we are looking back in time. This is an incredible gift. We can see parts of space, parts of our universe, as they were many years ago. The further we can collect light from, the further back in time we can look. If you look at the bright star Betelgeuse, which glows in the Orion constellation, you wind time back more than six hundred years. Its reddish glow started its journey to Earth in the Middle Ages. The stars in Orion’s belt are even further away. Their light, familiar to generations of humans, has travelled at least 1,000 years to reach us. This means we have a chance of understanding the history of the universe because we can see the more distant parts of it as they were in the past, thousands or millions or billions of years ago.", "ko": "심지어 우리의 가장 가까운 별의 이웃으로부터 온 빛도 우리에게 도달하는 데 4년이 걸린다. 우리가 별들을 바라볼 때, 우리는 과거의 시간을 돌아보고 있다. 이는 놀라운 선물이다. 우리는 우주 공간의 일부분, 우리 우주의 일부분들을 수년 전의 모습대로 볼 수 있다. 우리가 더 멀리서 온 빛을 모을수록, 우리는 과거의 더 먼 시간을 되돌아볼 수 있다. Orion 자리에서 빛나는 밝은 별 Betelgeuse를 바라보면, 당신은 600년 이상의 시간을 거슬러 올라간다. 그것의 붉은 빛은 중세 시대에 지구로 향하는 여정을 시작했다. Orion 벨트의 별들은 훨씬 더 멀리 떨어져 있다. 여러 세대의 인간에게 익숙한, 그것들의 빛은 최소 1,000년을 이동하여 우리에게 도달했다. 이는 우리가 그것의 더 먼 부분들을 수천 또는 수백만 또는 수십억 년 전 과거의 모습대로 볼 수 있기 때문에 우주의 역사를 이해할 기회를 가질 수 있음을 의미한다.", "read": [{"en": "The light from even our nearest stellar neighbour takes four years to reach us.", "ko": "심지어 우리의 가장 가까운 별의 이웃으로부터 온 빛도 우리에게 도달하는 데 4년이 걸린다.", "chunks": [["The light from even our nearest stellar neighbour", "심지어 우리의 가장 가까운 별의 이웃으로부터 온 빛도"], ["takes four years to reach us.", "우리에게 도달하는 데 4년이 걸린다."]]}, {"en": "When we look at the stars, we are looking back in time.", "ko": "우리가 별들을 바라볼 때, 우리는 과거의 시간을 돌아보고 있다.", "chunks": [["When we look at the stars,", "우리가 별들을 바라볼 때,"], ["we are looking back in time.", "우리는 과거의 시간을 돌아보고 있다."]]}, {"en": "This is an incredible gift.", "ko": "이는 놀라운 선물이다.", "chunks": [["This is an incredible gift.", "이는 놀라운 선물이다."]]}, {"en": "We can see parts of space, parts of our universe, as they were many years ago.", "ko": "우리는 우주 공간의 일부분, 우리 우주의 일부분들을 수년 전의 모습대로 볼 수 있다.", "chunks": [["We can see parts of space,", "우리는 우주 공간의 일부분을 볼 수 있다,"], ["parts of our universe,", "우리 우주의 일부분들을,"], ["as they were many years ago.", "수년 전의 모습대로."]]}, {"en": "The further we can collect light from, the further back in time we can look.", "ko": "우리가 더 멀리서 온 빛을 모을수록, 우리는 과거의 더 먼 시간을 되돌아볼 수 있다.", "chunks": [["The further", "더 멀리"], ["we can collect light from,", "우리가 빛을 모을 수 있을수록,"], ["the further back in time we can look.", "우리는 과거의 더 먼 시간을 되돌아볼 수 있다."]]}, {"en": "If you look at the bright star Betelgeuse, which glows in the Orion constellation, you wind time back more than six hundred years.", "ko": "Orion 자리에서 빛나는 밝은 별 Betelgeuse를 바라보면, 당신은 600년 이상의 시간을 거슬러 올라간다.", "chunks": [["If you look at the bright star Betelgeuse,", "밝은 별 Betelgeuse를 바라보면,"], ["which glows in the Orion constellation,", "Orion 자리에서 빛나는,"], ["you wind time back more than six hundred years.", "당신은 600년 이상의 시간을 거슬러 올라간다."]]}, {"en": "Its reddish glow started its journey to Earth in the Middle Ages.", "ko": "그것의 붉은 빛은 중세 시대에 지구로 향하는 여정을 시작했다.", "chunks": [["Its reddish glow started its journey to Earth", "그것의 붉은 빛은 지구로 향하는 여정을 시작했다"], ["in the Middle Ages.", "중세 시대에."]]}, {"en": "The stars in Orion’s belt are even further away.", "ko": "Orion 벨트의 별들은 훨씬 더 멀리 떨어져 있다.", "chunks": [["The stars in Orion’s belt", "Orion 벨트의 별들은"], ["are even further away.", "훨씬 더 멀리 떨어져 있다."]]}, {"en": "Their light, familiar to generations of humans, has travelled at least 1,000 years to reach us.", "ko": "여러 세대의 인간에게 익숙한, 그것들의 빛은 최소 1,000년을 이동하여 우리에게 도달했다.", "chunks": [["Their light, familiar to generations of humans,", "여러 세대의 인간에게 익숙한, 그것들의 빛은"], ["has travelled at least 1,000 years", "최소 1,000년을 이동했다"], ["to reach us.", "우리에게 도달하기 위해."]]}, {"en": "This means we have a chance of understanding the history of the universe because we can see the more distant parts of it as they were in the past, thousands or millions or billions of years ago.", "ko": "이는 우리가 그것의 더 먼 부분들을 수천 또는 수백만 또는 수십억 년 전 과거의 모습대로 볼 수 있기 때문에 우주의 역사를 이해할 기회를 가질 수 있음을 의미한다.", "chunks": [["This means we have a chance", "이는 우리가 기회를 가질 수 있음을 의미한다"], ["of understanding the history of the universe", "우주의 역사를 이해할"], ["because we can see the more distant parts of it", "왜냐하면 우리는 그것의 더 먼 부분들을 볼 수 있기 때문에"], ["as they were in the past,", "과거의 모습대로,"], ["thousands or millions or billions of years ago.", "수천 또는 수백만 또는 수십억 년 전의."]]}]}, {"no": "no.26", "titl

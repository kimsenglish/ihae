o listen to.", "그것은 아무도 듣고 싶어 하지 않는 음악일 것이다."]]}]}, {"no": "no.41-42", "title": "Beyond Oil: The Rise of Fuel Cell Technology", "ktitle": "석유 너머 — 연료전지가 부를 변화", "field": "에너지 · 경제", "page": "2026 6월 학평 · no.41~42 (장문: 제목·어휘)", "oneline": "비싼 석유가 더 효율적인 엔진을 낳았듯, <span style=\"color:#1FA34A;font-weight:700\">연료전지 기술의 도약</span>은 석유 가격을 <span style=\"color:#c8102e;font-weight:700\">급락</span>시켜 산유국·석유 기업이 대체 수입원·다른 산업으로 다각화하게 만듭니다.", "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"위 레인은 과거 비싼 석유가 더 효율적인 엔진을 낳은 선례를 회색으로 보여 주고, 아래 레인은 같은 논리로 연료전지 기술의 도약이 석유 가격을 절벽처럼 급락시켜 동전이 새는 석유통처럼 산유국 수입이 줄고, 그 결과 여러 신산업으로 다각화하는 인과를 보여 주는 평행 그림\">\n  <text x=\"300\" y=\"20\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">Beyond Oil — 과거 선례 ∥ 연료전지發 유가 급락 → 다각화</text>\n\n  <!-- 위 레인: 과거 선례 (회색) -->\n  <rect x=\"30\" y=\"34\" width=\"540\" height=\"58\" rx=\"6\" fill=\"#f6f6f6\" stroke=\"#bdbdbd\" stroke-width=\"1.2\"/>\n  <text x=\"44\" y=\"50\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" fill=\"#777\">과거 선례 (analogy · 지난 30년)</text>\n  <!-- 비싼 석유 (배럴 + 가격↑) -->\n  <g transform=\"translate(96, 72)\">\n    <rect x=\"-12\" y=\"-16\" width=\"24\" height=\"30\" rx=\"2\" fill=\"#ffffff\" stroke=\"#777\" stroke-width=\"1.2\"/>\n    <ellipse cx=\"0\" cy=\"-16\" rx=\"12\" ry=\"3.5\" fill=\"#ffffff\" stroke=\"#777\" stroke-width=\"1.2\"/>\n    <line x1=\"-12\" y1=\"-4\" x2=\"12\" y2=\"-4\" stroke=\"#777\" stroke-width=\"0.8\"/><line x1=\"-12\" y1=\"6\" x2=\"12\" y2=\"6\" stroke=\"#777\" stroke-width=\"0.8\"/>\n    <line x1=\"20\" y1=\"10\" x2=\"20\" y2=\"-12\" stroke=\"#777\" stroke-width=\"1.4\"/><polygon points=\"20,-14 16,-6 24,-6\" fill=\"#777\"/>\n    <text x=\"0\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#777\">비싼 석유 $↑</text>\n  </g>\n  <g stroke=\"#777\" stroke-width=\"1.5\" fill=\"#777\"><line x1=\"150\" y1=\"64\" x2=\"196\" y2=\"64\"/><polygon points=\"196,64 188,60 188,68\"/></g>\n  <text x=\"173\" y=\"56\" font-family=\"Noto Serif KR\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#777\">낳음</text>\n  <!-- 효율 엔진 (기어) -->\n  <g transform=\"translate(244, 64)\" stroke=\"#777\" stroke-width=\"1.2\" fill=\"#ffffff\">\n    <circle cx=\"0\" cy=\"0\" r=\"13\"/>\n    <circle cx=\"0\" cy=\"0\" r=\"4.5\"/>\n    <g stroke=\"#777\" stroke-width=\"2.4\"><line x1=\"0\" y1=\"-13\" x2=\"0\" y2=\"-18\"/><line x1=\"0\" y1=\"13\" x2=\"0\" y2=\"18\"/><line x1=\"-13\" y1=\"0\" x2=\"-18\" y2=\"0\"/><line x1=\"13\" y1=\"0\" x2=\"18\" y2=\"0\"/><line x1=\"-9\" y1=\"-9\" x2=\"-13\" y2=\"-13\"/><line x1=\"9\" y1=\"9\" x2=\"13\" y2=\"13\"/><line x1=\"-9\" y1=\"9\" x2=\"-13\" y2=\"13\"/><line x1=\"9\" y1=\"-9\" x2=\"13\" y2=\"-13\"/></g>\n  </g>\n  <text x=\"244\" y=\"88\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#777\">더 효율적인 엔진</text>\n  <text x=\"430\" y=\"60\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#777\">a price shock</text>\n  <text x=\"430\" y=\"74\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#777\">drives adaptation</text>\n\n  <!-- ∥ 같은 논리 -->\n  <text x=\"48\" y=\"108\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" fill=\"#1FA34A\">∥ 같은 논리로, 지금은…</text>\n\n  <!-- 아래 레인: 연료전지發 인과 -->\n  <!-- 연료전지 (도약) -->\n  <g transform=\"translate(74, 156)\">\n    <rect x=\"-17\" y=\"-17\" width=\"34\" height=\"34\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <line x1=\"-7\" y1=\"-17\" x2=\"-7\" y2=\"17\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/><line x1=\"7\" y1=\"-17\" x2=\"7\" y2=\"17\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n    <polygon points=\"2,-9 -6,2 0,2 -2,11 7,-1 1,-1\" fill=\"#1FA34A\"/>\n    <line x1=\"22\" y1=\"6\" x2=\"22\" y2=\"-12\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/><polygon points=\"22,-15 18,-6 26,-6\" fill=\"#1a1a1a\"/>\n    <text x=\"0\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">연료전지 도약</text>\n  </g>\n  <g stroke=\"#1a1a1a\" stroke-width=\"1.6\" fill=\"#1a1a1a\"><line x1=\"116\" y1=\"150\" x2=\"150\" y2=\"150\"/><polygon points=\"150,150 142,146 142,154\"/></g>\n\n  <!-- 유가 절벽 급락 (빨강) -->\n  <g transform=\"translate(160, 130)\">\n    <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"44\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <line x1=\"0\" y1=\"44\" x2=\"64\" y2=\"44\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    <polyline points=\"6,6 20,9 32,16 40,40\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"2.2\"/>\n    <polygon points=\"40,42 33,34 44,33\" fill=\"#c8102e\"/>\n    <text x=\"32\" y=\"-4\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#777\">유가</text>\n    <text x=\"32\" y=\"58\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">급락</text>\n  </g>\n  <g stroke=\"#c8102e\" stroke-width=\"1.6\" fill=\"#c8102e\"><line x1=\"240\" y1=\"150\" x2=\"274\" y2=\"150\"/><polygon points=\"274,150 266,146 266,154\"/></g>\n\n  <!-- 수입 손실 (동전 새는 석유통, 빨강) -->\n  <g transform=\"translate(312, 152)\">\n    <rect x=\"-13\" y=\"-18\" width=\"26\" height=\"34\" rx=\"2\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n    <ellipse cx=\"0\" cy=\"-18\" rx=\"13\" ry=\"3.8\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n    <text x=\"0\" y=\"2\" font-family=\"Noto Serif\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">OIL</text>\n    <g fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.1\">\n      <circle cx=\"18\" cy=\"14\" r=\"4\"/><circle cx=\"26\" cy=\"22\" r=\"4\"/><circle cx=\"22\" cy=\"30\" r=\"4\"/>\n    </g>\n    <text x=\"20\" y=\"17\" font-family=\"Noto Serif\" font-size=\"6\" text-anchor=\"middle\" fill=\"#c8102e\">$</text>\n    <text x=\"0\" y=\"34\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">수입 손실</text>\n  </g>\n  <g stroke=\"#1FA34A\" stroke-width=\"1.8\" fill=\"#1FA34A\"><line x1=\"352\" y1=\"150\" x2=\"392\" y2=\"150\"/><polygon points=\"392,150 383,145 383,155\"/></g>\n  <text x=\"372\" y=\"142\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">대응</text>\n\n  <!-- 다각화 (여러 신산업, 초록) -->\n  <g transform=\"translate(410, 150)\">\n    <text x=\"4\" y=\"-30\" font-family=\"Noto Serif KR\" font-size=\"9\" font-weight=\"700\" fill=\"#1FA34A\">다각화</text>\n    <text x=\"4\" y=\"-18\" font-family=\"Noto Serif KR\" font-size=\"7\" fill=\"#5e5e5e\">대체 수입원 · 다른 산업</text>\n    <g stroke=\"#1FA34A\" stroke-width=\"1.4\" fill=\"none\">\n      <path d=\"M 8 0 Q 50 -18 86 -22\"/><path d=\"M 8 0 Q 50 2 92 6\"/><path d=\"M 8 0 Q 50 22 86 30\"/>\n    </g>\n    <!-- 공장 -->\n    <g transform=\"translate(90, -30)\" stroke=\"#1FA34A\" stroke-width=\"1.2\" fill=\"#f0faf3\">\n      <rect x=\"0\" y=\"2\" width=\"24\" height=\"14\"/><polygon points=\"6,2 6,-4 12,2\"/><rect x=\"14\" y=\"-6\" width=\"4\" height=\"8\"/>\n    </g>\n    <!-- 풍력 터빈 -->\n    <g transform=\"translate(100, 6)\" stroke=\"#1FA34A\" stroke-width=\"1.3\" fill=\"none\">\n      <line x1=\"0\" y1=\"2\" x2=\"0\" y2=\"16\"/><line x1=\"0\" y1=\"2\" x2=\"0\" y2=\"-8\"/><line x1=\"0\" y1=\"2\" x2=\"9\" y2=\"6\"/><line x1=\"0\" y1=\"2\" x2=\"-9\" y2=\"6\"/><circle cx=\"0\" cy=\"2\" r=\"1.6\" fill=\"#1FA34A\"/>\n    </g>\n    <!-- 빌딩 -->\n    <g transform=\"translate(90, 24)\" stroke=\"#1FA34A\" stroke-width=\"1.2\" fill=\"#f0faf3\">\n      <rect x=\"0\" y=\"0\" width=\"16\" height=\"20\"/>\n      <g stroke=\"#1FA34A\" stroke-width=\"0.7\"><line x1=\"5\" y1=\"4\" x2=\"5\" y2=\"16\"/><line x1=\"11\" y1=\"4\" x2=\"11\" y2=\"16\"/><line x1=\"0\" y1=\"8\" x2=\"16\" y2=\"8\"/><line x1=\"0\" y1=\"13\" x2=\"16\" y2=\"13\"/></g>\n    </g>\n  </g>\n\n  <!-- 결론 strip -->\n  <rect x=\"40\" y=\"224\" width=\"520\" height=\"48\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n  <text x=\"58\" y=\"244\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" fill=\"#1a1a1a\">★ 연료전지 도약 → 유가 급락 → 산유국·석유기업이 대체 수입원·다른 산업으로 <tspan fill=\"#1FA34A\">다각화</tspan></text>\n  <text x=\"58\" y=\"262\" font-family=\"Noto Serif KR\" font-size=\"8.5\" fill=\"#5e5e5e\">41 제목 = ‘석유를 넘어, 연료전지로’ · 42 어휘 = exclude → <tspan font-weight=\"700\" fill=\"#c8102e\">develop</tspan>(다각화 방향)</text>\n</svg>", "caption": "기름통에서 물방울 연료전지로 동력원이 바뀌자 석유 가격 그래프가 곤두박질치고, 석유 기업이 새 산업 간판으로 갈아타는 그림.", "tldr": ["석유의 주 소비자는 운송 — 비싼 석유가 30년간 엔진을 <span style=\"color:#1FA34A;font-weight:700\">더 효율적·덜 오염되게</span> 만들었어요.", "석유값이 더 오르면 <span style=\"color:#1FA34A;font-weight:700\">연료전지 기술</span>이 탄력 — 자동차 기업은 이미 시제품을 만들고, 미래 이익이 여기 달려 있죠.", "연료전지에 획기적 발전이 오면 석유값 <span style=\"color:#c8102e;font-weight:700\">급락</span> → 산유국·석유 기업은 <span style=\"color:#1FA34A;font-weight:700\">대체 수입원·다른 산업</span>으로 다각화할 수밖에 없어요."], "analogy": "디지털 카메라가 나오자 필름 회사가 화장품·제약으로 갈아탔죠(코닥의 교훈). 연료전지가 석유에 그런 충격을 주면, 산유국과 석유 기업도 ‘기름 너머’의 살길을 찾아야 한다는 거예요.", "bg": "분야는 에너지·경제예요. ‘fuel cell(연료전지)’은 물 등에서 에너지를 만드는 기술, ‘price elasticity’가 아니라 여기선 ‘공급 대비 수요 급감 → 가격 급락’의 경제 논리가 축. ‘diversify(다각화하다)’가 결론의 핵심어. → ‘비싼 석유 → 효율 엔진’이라는 과거 사례가 ‘연료전지 → 석유값 급락’이라는 미래 시나리오로 어떻게 확장되는지 따라가며 읽으세요.", "flow": [{"kind": "도입", "t": "석유의 주 소비자는 운송 — 비싼 석유가 30년간 엔진을 더 효율적으로 만듦"}, {"kind": "전망", "t": "미래의 차는 오늘의 차와 전혀 다를 것 — 변화는 멈추지 않음"}, {"kind": "핵심", "t": "석유값이 더 오르면 <span style=\"color:#1FA34A;font-weight:700\">연료전지 기술</span>이 탄력 — 기업은 이미 시제품"}, {"kind": "가정", "t": "연료전지에 획기적 발전이 있다면 석유 가격은?"}, {"kind": "결과", "t": "석유값 <span style=\"color:#c8102e;font-weight:700\">급락</span> → 산유국·석유 기업 수입 손실 → 대체 수입원 탐색"}, {"kind": "결론", "t": "석유 메이저는 에너지 기업으로 다각화, OPEC은 다른 산업 개발 시도"}], "vocab": [["consumer", "소비자·소비 주체"], ["transport", "운송·수송"], ["internal combustion engine", "내연기관"], ["efficient", "효율적인"], ["consumption", "소비·소모"], ["polluting", "오염을 일으키는"], ["fuel cell", "연료전지"], ["momentum", "탄력·추진력"], ["multinational", "다국적 기업"], ["prototype", "시제품·원형"], ["performance", "성능·수행"], ["depend upon", "~에 달려 있다·의존하다"], ["breakthrough", "획기적 발전·돌파구"], ["dramatically", "극적으로·급격히"], ["demand", "수요·요구"], ["stand to", "~하게 될 처지이다·~할 듯하다"], ["alternative", "대체의·대안의"], ["diversify", "다각화하다·다양화하다"]], "quiz": [["비싼 석유가 가져온 ‘긍정적’ 변화는?", "지난 30여 년간 자동차 엔진이 <b>훨씬 더 효율적이고 덜 오염되게</b> 발전했어요 — 비싼 값이 기술 혁신을 밀었죠."], ["연료전지가 도약하면 석유 기업은 어떻게 될까요?", "석유값 급락으로 수입이 줄어 <b>대체 수입원·다른 산업으로 다각화</b>해야 해요(석유 메이저는 에너지 기업으로, OPEC은 새 산업으로)."]], "en": "The major consumer of oil is transport. But consider what has happened over the last 30 years or so to the technology involved in producing the internal combustion engine. Because oil is expensive, car engines today are far more efficient in their consumption of fuel (and far less polluting) than they were in 1972. The cars that Asia buys tomorrow will certainly not be anything like those Americans use today. Americans will not buy today’s cars tomorrow either. In fact, if the price of oil does rise much further then fuel cell technology (which produces energy from water!) will receive yet another momentum. The big car multinationals have already produced the prototype motors ― they are currently racing to try and get prices down and engine performances up. Their future profits depend upon it. Imagine now if there is a breakthrough in fuel cell technology. What would happen to oil prices? They would fall dramatically ― signalling much less demand than supply ― and oil companies and OPEC oil producers would stand to lose much income. The fact that this threat is real is driving the producers to look for alternative sources of income. The ‘oil majors’ have diversified and are now more energy companies than oil companies these days and the OPEC countries are urgently attempting to develop other industries.", "ko": "석유의 주요 소비자는 운송이다. 그러나 지난 30여 년에 걸쳐 내연기관 생산에 관련된 기술에 어떤 일이 일어났는지 생각해 보자. 석유가 비싸기 때문에, 오늘날 자동차 엔진들은 1972년에 그들이 그랬던 것보다 그들의 연료 소모에 있어서 훨씬 더 효율적이다(그리고 오염도 훨씬 더 적다). 아시아가 내일 구매할 자동차는 분명히 미국인들이 오늘 사용하는 자동차와 전혀 다를 것이다. 미국인들도 오늘의 자동차를 내일 구매하지는 않을 것이다. 사실, 석유 가격이 훨씬 더 상승한다면 연료전지 기술(물로부터 에너지를 생산하는!)이 또 다른 모멘텀을 받을 것이다. 대형 자동차 다국적 기업들은 시제품 모터들을 이미 생산해 오고 있다 ― 그들은 현재 가격들을 낮추고 엔진 성능들을 높이려고 애쓰는 중이다. 그들의 미래 이익은 이것에 달려 있다. 이제 연료전지 기술에 획기적인 발전이 있다고 상상해보자. 무슨 일이 석유 가격들에 일어날까? 그것들은 급락할 것이며 ― 공급보다 훨씬 더 적은 수요를 나타내며 ― 그리고 석유 회사들과 OPEC 산유국들은 막대한 수입을 잃게 될 것이다. 이 위협이 실재한다는 사실은 생산자들이 대체 수입원들을 찾도록 몰아가고 있다. ‘석유 메이저들’은 사업을 다각화하여, 오늘날에는 이제 석유 회사라기보다 더욱 에너지 기업들이 되었으며, OPEC 국가들은 다른 산업들을 개발하고자 긴급하게 시도하는 중이다.", "read": [{"en": "The major consumer of oil is transport.", "ko": "석유의 주요 소비자는 운송이다.", "chunks": [["The major consumer of oil", "석유의 주요 소비자는"], ["is transport.", "운송이다."]]}, {"en": "But consider what has happened over the last 30 years or so to the technology involved in producing the internal combustion engine.", "ko": "그러나 지난 30여 년에 걸쳐 내연기관 생산에 관련된 기술에 어떤 일이 일어났는지 생각해 보자.", "chunks": [["But consider what has happened", "그러나 어떤 일이 일어났는지 생각해 보자"], ["over the last 30 years or so", "지난 30여 년에 걸쳐"], ["to the technology involved", "관련된 기술에"], ["in producing the internal combustion engine.", "내연기관을 생산하는 데."]]}, {"en": "Because oil is expensive, car engines today are far more efficient in their consumption of fuel (and far less polluting) than they were in 1972.", "ko": "석유가 비싸기 때문에, 오늘날 자동차 엔진들은 1972년에 그들이 그랬던 것보다 그들의 연료 소모에 있어서 훨씬 더 효율적이다(그리고 오염도 훨씬 더 적다).", "chunks": [["Because oil is expensive,", "석유가 비싸기 때문에,"], ["car engines today are far more efficient", "오늘날 자동차 엔진들은 훨씬 더 효율적이다"], ["in their consumption of fuel (and far less polluting)", "연료 소모에 있어서 (그리고 오염도 훨씬 더 적다)"], ["than they were in 1972.", "1972년에 그들이 그랬던 것보다."]]}, {"en": "The cars that Asia buys tomorrow will certainly not be anything like those Americans use today.", "ko": "아시아가 내일 구매할 자동차는 분명히 미국인들이 오늘 사용하는 자동차와 전혀 다를 것이다.", "chunks": [["The cars that Asia buys tomorrow", "아시아가 내일 구매할 자동차는"], ["will certainly not be anything like", "분명히 ~와 전혀 다를 것이다"], ["those Americans use today.", "미국인들이 오늘 사용하는 자동차들과."]]}, {"en": "Americans will not buy today’s cars tomorrow either.", "ko": "미국인들도 오늘의 자동차를 내일 구매하지는 않을 것이다.", "chunks": [["Americans will not buy", "미국인들도 구매하지 않을 것이다"], ["today’s cars tomorrow either.", "오늘의 자동차를 내일, 마찬가지로."]]}, {"en": "In fact, if the price of oil does rise much further then fuel cell technology (which produces energy from water!) will receive yet another momentum.", "ko": "사실, 석유 가격이 훨씬 더 상승한다면 연료전지 기술(물로부터 에너지를 생산하는!)이 또 다른 모멘텀을 받을 것이다.", "chunks": [["In fact, if the price of oil does rise much further", "사실, 석유 가격이 훨씬 더 상승한다면"], ["then fuel cell technology (which produces energy from water!)", "연료전지 기술(물로부터 에너지를 생산하는!)이"], ["will receive yet another momentum.", "또 다른 모멘텀을 받을 것이다."]]}, {"en": "The big car multinationals have already produced the prototype motors ― they are currently racing to try and get prices down and engine performances up.", "ko": "대형 자동차 다국적 기업들은 시제품 모터들을 이미 생산해 오고 있다 ― 그들은 현재 가격들을 낮추고 엔진 성능들을 높이려고 애쓰는 중이다.", "chunks": [["The big car multinationals", "대형 자동차 다국적 기업들은"], ["have already produced the prototype motors", "시제품 모터들을 이미 생산해 오고 있다"], ["― they are currently racing", "― 그들은 현재 경쟁하는 중이다"], ["to try and get prices down and engine performances up.", "가격들을 낮추고 엔진 성능들을 높이려고 애쓰며."]]}, {"en": "Their future profits depend upon it.", "ko": "그들의 미래 이익은 이것에 달려 있다.", "chunks": [["Their future profits", "그들의 미래 이익은"], ["depend upon it.", "이것에 달려 있다."]]}, {"en": "Imagine now if there is a breakthrough in fuel cell technology.", "ko": "이제 연료전지 기술에 획기적인 발전이 있다고 상상해보자.", "chunks": [["Imagine now", "이제 상상해보자"], ["if there is a breakthrough", "획기적인 발전이 있다고"], ["in fuel cell technology.", "연료전지 기술에."]]}, {"en": "What would happen to oil prices?", "ko": "무슨 일이 석유 가격들에 일어날까?", "chunks": [["What would happen", "무슨 일이 일어날까"], ["to oil prices?", "석유 가격들에?"]]}, {"en": "They would fall dramatically ― signalling much less demand than supply ― and oil companies and OPEC oil producers would stand to lose much income.", "ko": "그것들은 급락할 것이며 ― 공급보다 훨씬 더 적은 수요를 나타내며 ― 그리고 석유 회사들과 OPEC 산유국들은 막대한 수입을 잃게 될 것이다.", "chunks": [["They would fall dramatically", "그것들은 급락할 것이며"], ["― signalling much less demand than supply ―", "― 공급보다 훨씬 더 적은 수요를 나타내며 ―"], ["and oil companies and OPEC oil producers", "그리고 석유 회사들과 OPEC 산유국들은"], ["would stand to lose much income.", "막대한 수입을 잃게 될 것이다."]]}, {"en": "The fact that this threat is real is driving the producers to look for alternative sources of income.", "ko": "이 위협이 실재한다는 사실은 생산자들이 대체 수입원들을 찾도록 몰아가고 있다.", "chunks": [["The fact that this threat is real", "이 위협이 실재한다는 사실은"], ["is driving the producers", "생산자들을 몰아가고 있다"], ["to look for alternative sources of income.", "대체 수입원들을 찾도록."]]}, {"en": "The ‘oil majors’ have diversified and are now more energy companies than oil companies these days and the OPEC countries are urgently attempting to develop other industries.", "ko": "‘석유 메이저들’은 사업을 다각화하여, 오늘날에는 이제 석유 회사라기보다 더욱 에너지 기업들이 되었으며, OPEC 국가들은 다른 산업들을 개발하고자 긴급하게 시도하는 중이다.", "chunks": [["The ‘oil majors’ have diversified", "‘석유 메이저들’은 사업을 다각화하여"], ["and are now more energy companies than oil companies these days", "오늘날에는 이제 석유 회사라기보다 더욱 에너지 기업들이 되었으며"], ["and the OPEC countries are urgently attempting", "그리고 OPEC 국가들은 긴급하게 시도하는 중이다"], ["to develop other industries.", "다른 산업들을 개발하고자."]]}]}, {"no": "no.43-45", "title": "A Letter, a Jar of Jam, and a Garden", "ktitle": "편지 한 통, 잼 한 병, 그리고 정원", "field": "서사 · 따뜻한 교류", "page": "2026 6월 학평 · no.43~45 (장문: 순서·지칭·내용)", "oneline": "Anna의 <span style=\"color:#1FA34A;font-weight:700\">응원 편지</span>가 정원을 잃은 Mrs. Pike의 마음을 다시 일으켜, 두 사람이 <span style=\"color:#1FA34A;font-weight:700\">허브를 함께 가꾸며</span> 이어 가는 따뜻한 교류의 이야기.", "metaphor": "<svg viewBox=\"0 0 600 274\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Anna가 보낸 응원의 편지가 정원을 잃은 Mrs. Pike의 마음을 다시 일으켜, 잼 소포와 마을 방문, 함께 씨앗 심기를 거쳐 매달 이어 가는 따뜻한 교류로 발전하는 네 단계 이야기를 순서 A D B C로 보여 주는 그림\">\n  <text x=\"300\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">A Letter, a Jar of Jam, and a Garden — 이야기 순서 (A)→(D)→(B)→(C)</text>\n\n  <g font-family=\"Noto Serif KR\" text-anchor=\"middle\">\n    <!-- (A) 편지 -->\n    <rect x=\"24\" y=\"44\" width=\"126\" height=\"160\" rx=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <rect x=\"32\" y=\"50\" width=\"40\" height=\"16\" rx=\"8\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n    <text x=\"52\" y=\"62\" font-size=\"9\" font-weight=\"700\" fill=\"#1FA34A\">(A)</text>\n    <!-- 봉투 아이콘 -->\n    <rect x=\"62\" y=\"86\" width=\"50\" height=\"34\" rx=\"2\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <polyline points=\"62,86 87,106 112,86\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"87\" y=\"140\" font-size=\"9.5\" font-weight=\"700\">응원 편지</text>\n    <text x=\"87\" y=\"158\" font-size=\"8\" fill=\"#5e5e5e\">친절 프로젝트 ·</text>\n    <text x=\"87\" y=\"171\" font-size=\"8\" fill=\"#5e5e5e\">발코니 정원 그림</text>\n    <text x=\"87\" y=\"190\" font-family=\"Noto Serif\" font-size=\"7.5\" fill=\"#999\">expressing hope</text>\n\n    <!-- (D) 답장·잼 -->\n    <rect x=\"166\" y=\"44\" width=\"126\" height=\"160\" rx=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <rect x=\"174\" y=\"50\" width=\"40\" height=\"16\" rx=\"8\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n    <text x=\"194\" y=\"62\" font-size=\"9\" font-weight=\"700\" fill=\"#1FA34A\">(D)</text>\n    <!-- 잼 병 아이콘 -->\n    <rect x=\"212\" y=\"80\" width=\"34\" height=\"14\" rx=\"2\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <rect x=\"208\" y=\"92\" width=\"42\" height=\"32\" rx=\"4\" fill=\"#fdf2f4\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <text x=\"229\" y=\"113\" font-size=\"7.5\" fill=\"#c8102e\">jam</text>\n    <text x=\"229\" y=\"142\" font-size=\"9.5\" font-weight=\"700\">답장 · 잼 소포</text>\n    <text x=\"229\" y=\"160\" font-size=\"8\" fill=\"#5e5e5e\">딸기민트 잼 +</text>\n    <text x=\"229\" y=\"173\" font-size=\"8\" fill=\"#5e5e5e\">접힌 편지</text>\n    <text x=\"229\" y=\"190\" font-family=\"Noto Serif\" font-size=\"7.5\" fill=\"#1FA34A\">reminded me of garden</text>\n\n    <!-- (B) 방문·심기 -->\n    <rect x=\"308\" y=\"44\" width=\"126\" height=\"160\" rx=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <rect x=\"316\" y=\"50\" width=\"40\" height=\"16\" rx=\"8\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n    <text x=\"336\" y=\"62\" font-size=\"9\" font-weight=\"700\" fill=\"#1FA34A\">(B)</text>\n    <!-- 새싹 아이콘 -->\n    <line x1=\"371\" y1=\"124\" x2=\"371\" y2=\"96\" stroke=\"#1FA34A\" stroke-width=\"2\"/>\n    <path d=\"M371 104 q-12 -8 -18 4 q12 4 18 -4\" fill=\"#1FA34A\"/>\n    <path d=\"M371 112 q12 -8 18 4 q-12 4 -18 -4\" fill=\"#1FA34A\"/>\n    <line x1=\"358\" y1=\"124\" x2=\"384\" y2=\"124\" stroke=\"#5e5e5e\" stroke-width=\"1.4\"/>\n    <text x=\"371\" y=\"142\" font-size=\"9.5\" font-weight=\"700\">방문 · 함께 심기</text>\n    <text x=\"371\" y=\"160\" font-size=\"8\" fill=\"#5e5e5e\">허브 정원 구경,</text>\n    <text x=\"371\" y=\"173\" font-size=\"8\" fill=\"#5e5e5e\">씨앗을 함께 심음</text>\n    <text x=\"371\" y=\"190\" font-family=\"Noto Serif\" font-size=\"7.5\" fill=\"#999\">deeply moved</text>\n\n    <!-- (C) 그 후 -->\n    <rect x=\"450\" y=\"44\" width=\"126\" height=\"160\" rx=\"7\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <rect x=\"458\" y=\"50\" width=\"40\" height=\"16\" rx=\"8\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1\"/>\n    <text x=\"478\" y=\"62\" font-size=\"9\" font-weight=\"700\" fill=\"#1FA34A\">(C)</text>\n    <!-- 자란 식물 + 로즈마리 병 -->\n    <line x1=\"513\" y1=\"124\" x2=\"513\" y2=\"88\" stroke=\"#1FA34A\" stroke-width=\"2.2\"/>\n    <path d=\"M513 96 q-13 -9 -20 4 q13 5 20 -4\" fill=\"#1FA34A\"/>\n    <path d=\"M513 106 q13 -9 20 4 q-13 5 -20 -4\" fill=\"#1FA34A\"/>\n    <path d=\"M513 116 q-11 -7 -17 4 q11 4 17 -4\" fill=\"#1FA34A\"/>\n    <line x1=\"500\" y1=\"124\" x2=\"526\" y2=\"124\" stroke=\"#5e5e5e\" stroke-width=\"1.4\"/>\n    <text x=\"513\" y=\"142\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1FA34A\">매달 이어진 교류</text>\n    <text x=\"513\" y=\"160\" font-size=\"8\" fill=\"#5e5e5e\">편지·정원 동아리,</text>\n    <text x=\"513\" y=\"173\" font-size=\"8\" fill=\"#5e5e5e\">잼병에 로즈마리</text>\n    <text x=\"513\" y=\"190\" font-family=\"Noto Serif\" font-size=\"7.5\" fill=\"#5e5e5e\">a daily reminder</text>\n  </g>\n\n  <!-- 화살표 (초록 = 성장·온기) -->\n  <g stroke=\"#1FA34A\" stroke-width=\"1.8\" fill=\"#1FA34A\">\n    <line x1=\"150\" y1=\"124\" x2=\"165\" y2=\"124\"/><polygon points=\"165,124 158,120 158,128\"/>\n    <line x1=\"292\" y1=\"124\" x2=\"307\" y2=\"124\"/><polygon points=\"307,124 300,120 300,128\"/>\n    <line x1=\"434\" y1=\"124\" x2=\"449\" y2=\"124\"/><polygon points=\"449,124 442,120 442,128\"/>\n  </g>\n\n  <!-- 주제 strip -->\n  <rect x=\"24\" y=\"218\" width=\"552\" height=\"46\" rx=\"6\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.2\"/>\n  <text x=\"300\" y=\"240\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">작은 응원 한 통이 멈췄던 정원과 마음을 다시 자라게 했다</text>\n  <text x=\"300\" y=\"257\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">“사람도 식물처럼 약간의 햇빛이 필요하다” — people need a little sunlight too</text>\n</svg>", "caption": "학생의 손편지가 노부인의 멈춘 화단에 씨앗을 다시 심게 하고, 두 사람이 나란히 허브를 가꾸는 장면 — 잼 병엔 로즈마리 한 줄기.", "tldr": ["친절 프로젝트로 Anna가 Mrs. Pike에게 <span style=\"color:#1FA34A;font-weight:700\">발코니 정원·꽃 그림</span>을 담은 응원 편지를 써요.", "한 달 뒤 소포 도착 — 접힌 편지와 <span style=\"color:#1FA34A;font-weight:700\">딸기민트 잼</span>. 남편을 잃고 멈췄던 정원을 ‘<span style=\"color:#1FA34A;font-weight:700\">네 편지가 다시 일깨웠다</span>’는 답장이었죠.", "감동한 Anna가 마을을 방문해 함께 씨앗을 심고 — 이후 매달 편지·정원 동아리·로즈마리로 이어지는 교류. <span style=\"color:#1FA34A;font-weight:700\">사람도 약간의 햇빛이 필요하다</span>는 걸 매일 일깨우면서요."], "analogy": "꺼진 줄 알았던 모닥불에 누군가 입김을 후 불자 다시 불씨가 살아나는 장면이에요. Anna의 편지가 그 입김 — 작은 친절 하나가 멈췄던 누군가의 삶을 다시 피워 올리는 이야기죠.", "bg": "분야는 서사문, 따뜻한 교류 이야기예요. 두 인물(학생 Anna·노부인 Mrs. Pike)이 편지·잼·정원을 매개로 이어져요 — 감정선은 외로움 → 위로 → 재생. → 장문은 사건 순서와 지칭(she·it이 누구·무엇인지)이 문제 포인트. 장면이 바뀔 때마다 ‘누구의 시점·무슨 물건’인지 적으며 읽으세요.", "flow": [{"kind": "발단(A)", "t": "친절 프로젝트로 Anna가 Mrs. Pike에게 발코니 정원·꽃 그림 담은 응원 편지"}, {"kind": "전개(D)", "t": "한 달 뒤 소포 — 접힌 편지 + <span style=\"color:#1FA34A;font-weight:700\">딸기민트 잼</span>, 멈췄던 정원을 Anna의 편지가 일깨움"}, {"kind": "절정(B)", "t": "감동한 Anna가 마을 방문 — Mrs. Pike가 허브 정원을 보여 주고 함께 씨앗을 심음"}, {"kind": "결말(C)", "t": "이후 매달 편지·정원 동아리·잼 병 속 로즈마리 — <span style=\"color:#1FA34A;font-weight:700\">사람도 약간의 햇빛이 필요</span>함을 일깨움"}], "vocab": [["cheerful", "명랑한·응원이 되는"], ["elder", "어르신·연장자"], ["countryside", "시골·전원"], ["balcony", "발코니"], ["limited", "제한된·한정된"], ["conclude", "끝맺다·마무리하다"], ["package", "소포·꾸러미"], ["address", "(우편물을) ~앞으로 보내다"], ["folded", "접힌"], ["jar", "병·단지"], ["used to", "(예전에) ~하곤 했다"], ["remind", "상기시키다·일깨우다"], ["deeply moved", "몹시 감동받은"], ["thrilled", "신난·매우 들뜬"], ["greet", "맞이하다·인사하다"], ["comment on", "~에 대해 언급하다"], ["brighten", "밝게 하다·환하게 하다"], ["spirit", "마음·기분·영혼"], ["recycled", "재활용된"], ["reminder", "상기시켜 주는 것·일깨움"]], "quiz": [["Mrs. Pike가 정원을 다시 시작하게 된 계기는?", "<b>Anna의 응원 편지</b>예요 — 남편이 죽은 뒤 멈췄던 정원을, 그 편지가 ‘얼마나 그리웠는지’ 일깨워 줬어요."], ["이야기가 전하는 메시지를 한 줄로?", "작은 친절(편지)이 멈춘 누군가의 삶을 다시 피워 올린다는 것 — <b>사람도 약간의 햇빛이 필요하다</b>는 거예요."]], "en": "As part of a kindness project, Orange High School students wrote cheerful letters to elders in a countryside village. Anna wrote to Mrs. Pike. She shared about her balcony garden at home and included drawings of flowers. Anna mentioned that despite having limited space, she enjoyed taking care of her plants. Her letter concluded by expressing hope that Mrs. Pike also had a nice garden. After sending the letter, Anna forgot about it until a month later when a package arrived at her home. Anna noticed the box in front of her door. She walked closer and saw it was addressed to her. When Anna opened it, she found a folded letter and a jar of homemade strawberry mint jam from Mrs. Pike. She wrote, “Your words made me smile. I used to have a garden, but when my husband died, I stopped planting. Your letter reminded me how much I missed it. So I planted some herbs. Have a taste!” The letter was signed, “Love, Mrs. Pike.” Anna was deeply moved by Mrs. Pike’s response. When her teacher announced that her class would visit the village to meet the seniors, Anna was thrilled. As they arrived, Mrs. Pike warmly greeted Anna with open arms. She pointed to a green space beside her house, saying, “Look at my herbs.” Anna smiled and commented on how wonderful they must smell. Together, they spent the day planting seeds. Mrs. Pike even gave Anna some herbs to take home. Mrs. Pike thanked Anna for brightening her spirit. After the visit, Anna continued writing to Mrs. Pike every month. She also started a gardening club where students planted seeds in recycled jars and cups. Anna used the empty jam jar to plant some rosemary, which reminded her of Mrs. Pike’s herb garden. The rosemary grew by the window. Whenever Anna looked at it, she had a warm feeling. It was a daily reminder that people, like plants, sometimes just need a little sunlight.", "ko": "친절 프로젝트의 일환으로, Orange 고등학교 학생들은 시골 마을 노인들에게 응원의 편지들을 썼다. Anna는 Pike 부인에게 편지를 썼다. 그녀는 자신의 집에 있는 발코니 정원에 대해 말하며 꽃 그림을 넣었다. Anna는 제한된 공간을 가지고 있음에도, 그녀는 그녀의 식물들을 돌보는 것을 즐긴다고 언급했다. 그녀의 편지는 Pike 부인도 또한 멋진 정원을 가지고 있기를 바라는 희망을 표현함으로써 마무리했다. 편지를 보낸 후, Anna는 한 달 뒤 그녀의 집에 소포 하나가 도착할 때까지 그것에 대해 잊고 있었다. Anna는 문 앞에서 그 상자를 발견했다. 그녀는 더 가까이 걸어갔고, 그것이 자신에게 보내어진 것임을 알았다. Anna가 그것을 열었을 때, 그녀는 Pike 부인에게서 온 접혀진 편지와 집에서 만든 딸기민트 잼 한 병을 발견했다. 그녀는 “너의 말이 나를 미소 짓게 했어. 나는 정원이 있었지만, 나의 남편이 죽었을 때, 심기를 멈추었지. 너의 편지가 나에게 내가 얼마나 그것을 그리워하는지 일깨워 주었어. 그래서 나는 허브를 몇 개 심었어. 한 번 맛보렴!”이라고 썼다. 그 편지는 “사랑을 담아, Pike 부인”이라고 서명되어 있었다. Anna는 Pike 부인의 답변에 몹시 감동 받았다. 그녀의 선생님이 그녀의 학급이 노인분들을 만나기 위해 그 마을을 방문할 것이라 발표했을 때, Anna는 신이 났다. 그들이 도착했을 때, Pike 부인은 Anna를 두 팔 벌려 따뜻하게 맞이하였다. 그녀는 “나의 허브들을 봐.”라고 말하며, 자신의 집 옆의 녹색 공간을 가리켰다. Anna는 미소 지으며 그것들이 얼마나 향이 좋을지에 대해 언급했다. 함께, 그들은 씨앗을 심으며 그날을 보냈다. Pike 부인은 심지어 Anna에게 집에 가져갈 약간의 허브들을 주었다. Pike 부인은 그녀의 영혼을 밝혀 준 것에 대해 Anna에게 감사했다. 방문 후, Anna는 매달 Pike 부인에게 편지를 계속 썼다. 또한 그녀는 학생들이 재활용된 병들과 컵들에 씨앗들을 심는 정원 가꾸기 동아리를 시작했다. Anna는 약간의 로즈마리를 심기 위해 빈 잼 병을 활용하였고, 그것은 그녀에게 Pike 부인의 허브 정원을 떠오르게 했다. 그 로즈마리는 창가에서 자랐다. Anna가 그것을 볼 때마다, 그녀는 따뜻한 감정을 느꼈다. 그것은 식물처럼 사람들도 가끔씩 그저 약간의 햇빛이 필요함을 매일 상기시켜 주는 것이었다.", "read": [{"en": "As part of a kindness project, Orange High School students wrote cheerful letters to elders in a countryside village.", "ko": "친절 프로젝트의 일환으로, Orange 고등학교 학생들은 시골 마을 노인들에게 응원의 편지들을 썼다.", "chunks": [["As part of a kindness project,", "친절 프로젝트의 일환으로,"], ["Orange High School students wrote cheerful letters", "Orange 고등학교 학생들은 응원의 편지들을 썼다"], ["to elders in a countryside village.", "시골 마을 노인들에게."]]}, {"en": "Anna wrote to Mrs. Pike.", "ko": "Anna는 Pike 부인에게 편지를 썼다.", "chunks": [["Anna wrote", "Anna는 편지를 썼다"], ["to Mrs. Pike.", "Pike 부인에게."]]}, {"en": "She shared about her balcony garden at home and included drawings of flowers.", "ko": "그녀는 자신의 집에 있는 발코니 정원에 대해 말하며 꽃 그림을 넣었다.", "chunks": [["She shared about her balcony garden at home", "그녀는 자신의 집에 있는 발코니 정원에 대해 말했다"], ["and included drawings of flowers.", "그리고 꽃 그림을 넣었다."]]}, {"en": "Anna mentioned that despite having limited space, she enjoyed taking care of her plants.", "ko": "Anna는 제한된 공간을 가지고 있음에도, 그녀는 그녀의 식물들을 돌보는 것을 즐긴다고 언급했다.", "chunks": [["Anna mentioned that", "Anna는 ~라고 언급했다"], ["despite having limited space,", "제한된 공간을 가지고 있음에도,"], ["she enjoyed taking care of her plants.", "그녀가 자신의 식물들을 돌보는 것을 즐긴다고."]]}, {"en": "Her letter concluded by expressing hope that Mrs. Pike also had a nice garden.", "ko": "그녀의 편지는 Pike 부인도 또한 멋진 정원을 가지고 있기를 바라는 희망을 표현함으로써 마무리했다.", "chunks": [["Her letter concluded", "그녀의 편지는 마무리했다"], ["by expressing hope", "희망을 function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  var _i = d.bg.indexOf('→');
  var _intro = _i>=0 ? d.bg.slice(0,_i).trim() : d.bg.trim();
  var _dir = _i>=0 ? d.bg.slice(_i+1).trim() : '';
  var _body = '<p class="callout bg">'+_intro+'</p>' + (_dir ? '<p class="callout bg" style="margin-top:7px"><span style="color:#c8102e;font-weight:700">→ 이렇게 읽어요</span><br>'+_dir+'</p>' : '');
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">읽기 전 30초</span>
      <span class="thint">— 분야와 읽는 방향</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${_body}</div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 흐름</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>

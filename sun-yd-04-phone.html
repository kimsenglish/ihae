<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지문 이해 보조 자료 · 수능특강 영어독해연습 04강 (지문 1-12)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   김가영어학원 · KIM KA YOUNG ENGLISH
   수능특강 영어독해연습 04강 지문 1-12 이해 — 도구 상자(Toolbox) 디지털 자료
   Brand v2.1 · System B (학습자료 본문 전용)
   ============================================================ */

:root {
  --paper:    #ffffff;
  --ink:      #1a1a1a;
  --ink-80:   #333333;
  --ink-60:   #5e5e5e;
  --ink-40:   #999;
  --ink-20:   #cccccc;
  --ink-10:   #e8e8e8;
  --ink-05:   #f6f6f6;
  --red:      #c8102e;
  --red-tint: #fdf2f4;
  --green:    #1FA34A;
  --green-tint: #f0faf3;
  --serif-kr: 'Noto Serif KR', serif;
  --serif-en: 'Noto Serif', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--serif-kr);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

em { font-family: var(--serif-en); font-style: italic; }
.en { font-family: var(--serif-en); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 80px;
}

/* ============================================================
   학원 브랜드 헤더
   ============================================================ */
.brand {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 4px;
}
.brand .b-title h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.brand .b-title .b-sub {
  font-size: 11px;
  color: var(--ink-60);
  margin-top: 2px;
  font-family: var(--serif-en);
  font-style: italic;
  letter-spacing: 0.05em;
}
.brand .b-meta {
  font-size: 11.5px;
  color: var(--ink-60);
  text-align: right;
  line-height: 1.5;
}
.brand .b-meta .en { font-style: italic; }

/* ============================================================
   사용 안내 (도구 상자 가이드)
   ============================================================ */
.guide {
  background: var(--ink-05);
  border-left: 3px solid var(--red);
  padding: 13px 16px 12px;
  margin: 14px 0;
  border-radius: 0 4px 4px 0;
}
.guide .g-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 9px;
  font-family: var(--serif-kr);
}
.guide .g-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.guide .g-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.55;
  word-break: keep-all;
}
.guide .g-when {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--ink);
  min-width: 96px;
}
.guide .g-sep {
  color: var(--ink-40);
  font-family: var(--serif-en);
  flex: 0 0 auto;
}
.guide .g-tools {
  color: var(--ink-80);
  flex: 1;
}
.guide .g-tools .k {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--ink);
  font-size: 12px;
  padding: 0 3px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 3px;
  margin-right: 2px;
}
.guide .g-note {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
  font-size: 12px;
  color: var(--ink-60);
  line-height: 1.5;
  word-break: keep-all;
}
.guide .g-note b { color: var(--red); }

/* ============================================================
   탭 (지문 선택)
   ============================================================ */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--ink-10);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 10px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 5px;
  padding: 7px 12px 5px;
  font-family: var(--serif-kr);
  color: var(--ink-60);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  min-width: 78px;
}
.tab .tab-no {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.05em;
}
.tab .tab-field {
  display: block;
  font-size: 10.5px;
  color: var(--ink-40);
  margin-top: 1px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.tab:hover { border-color: var(--ink-60); color: var(--ink); }
.tab.active {
  background: var(--red-tint);
  border-color: var(--red);
  color: var(--red);
}
.tab.active .tab-field { color: var(--red); }

/* ============================================================
   PASSAGE PANEL
   ============================================================ */
.passage { display: none; padding-top: 18px; }
.passage.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.p-head .field {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--red);
  border: 0.7px solid var(--red);
  padding: 2px 8px;
  letter-spacing: 0.15em;
  margin-bottom: 10px;
  border-radius: 2px;
}
.p-head h2 {
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.p-head .p-kt {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-80);
  word-break: keep-all;
}
.p-head .p-page {
  font-size: 10.5px;
  color: var(--ink-40);
  font-family: var(--serif-en);
  letter-spacing: 0.12em;
  margin-top: 5px;
}

/* ============================================================
   한 줄 핵심 (anchor)
   ============================================================ */
.oneline {
  margin: 18px 0 22px;
  padding: 16px 18px 17px;
  background: var(--ink-05);
  border-left: 3px solid var(--ink);
  border-radius: 0 6px 6px 0;
  font-size: 17.5px;
  font-weight: 500;
  line-height: 1.55;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
.oneline::before {
  content: "한 줄 핵심";
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: 0.22em;
  margin-bottom: 7px;
}
.oneline .r { color: var(--red); font-weight: 700; }
.oneline .g { color: var(--green); font-weight: 700; }
.oneline em { font-style: italic; }

/* ============================================================
   메타포 SVG (지문별 한 컷 — 항상 펼쳐짐)
   ============================================================ */
.metaphor {
  margin: 20px 0 22px;
  border: 1px solid var(--ink-20);
  border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.metaphor .m-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 11px 16px;
  border-bottom: 1px solid var(--ink-10);
  background: var(--ink-05);
}
.metaphor .m-head .label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--ink-60);
}
.metaphor .m-head .sub {
  font-family: var(--serif-en);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-60);
}
.metaphor figure { padding: 18px 18px 14px; }
.metaphor figure svg {
  width: 100%;
  height: auto;
  display: block;
}
.metaphor figcaption {
  text-align: center;
  font-size: 13px;
  color: var(--ink-60);
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
  line-height: 1.55;
}
.metaphor figcaption .en { font-style: italic; color: var(--ink-80); }
.metaphor figcaption .r { color: var(--red); font-weight: 700; }
.metaphor figcaption .g { color: var(--green); font-weight: 700; }

/* ============================================================
   TOOLBOX 안내 라인
   ============================================================ */
.tools-intro {
  font-size: 12px;
  color: var(--ink-60);
  letter-spacing: 0.04em;
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tools-intro::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--ink);
  display: inline-block;
}
.tools-intro b { color: var(--ink); font-weight: 700; }

/* ============================================================
   도구 카드 (Tool) — 아코디언
   ============================================================ */
.tool {
  background: var(--paper);
  border: 1px solid var(--ink-20);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.tool[open] { border-color: var(--ink-80); }
.tool > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14.5px;
  font-weight: 500;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--ink-05); }
.tool > summary .tname {
  flex: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.tool > summary .thint {
  font-size: 11.5px;
  color: var(--ink-40);
  font-weight: 400;
}
.tool > summary .arr {
  color: var(--ink-40);
  font-family: var(--serif-en);
  font-size: 11px;
  transition: transform 0.2s;
  flex: 0 0 auto;
}
.tool[open] > summary .arr { transform: rotate(90deg); color: var(--ink); }
.tool > summary .ticon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-60);
  background: var(--ink-05);
  border: 0.7px solid var(--ink-20);
}
.tool[open] > summary .ticon {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tool .body { padding: 4px 16px 18px; }

/* ============================================================
   도구별 컨텐츠 스타일
   ============================================================ */

/* 30초 요약 */
.tldr {
  list-style: none;
  counter-reset: t;
}
.tldr li {
  position: relative;
  padding: 9px 0 9px 30px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.55;
  border-bottom: 1px dashed var(--ink-10);
  word-break: keep-all;
}
.tldr li:last-child { border-bottom: none; }
.tldr li::before {
  counter-increment: t;
  content: counter(t);
  position: absolute;
  left: 0;
  top: 11px;
  width: 20px;
  height: 20px;
  background: var(--paper);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 50%;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 비유 / 배경지식 */
.callout {
  font-size: 14.5px;
  line-height: 1.7;
  padding: 13px 15px;
  border-radius: 6px;
  word-break: keep-all;
  background: var(--ink-05);
}
.callout.analogy { border-left: 3px solid var(--green); }
.callout.bg      { border-left: 3px solid var(--ink); }
.callout em { font-style: italic; }

/* 논지 흐름 */
.flow { display: flex; flex-direction: column; gap: 6px; }
.flow-step {
  display: flex;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  background: var(--paper);
  align-items: flex-start;
}
.flow-step .kind {
  flex: 0 0 60px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  text-align: center;
  border-radius: 3px;
  letter-spacing: 0.04em;
  background: var(--ink-05);
  color: var(--ink-80);
  border: 0.7px solid var(--ink-20);
}
.flow-step.pivot .kind {
  background: var(--red-tint); color: var(--red); border-color: var(--red);
}
.flow-step.close .kind {
  background: var(--green-tint); color: var(--green); border-color: var(--green);
}
.flow-step .body { flex: 1; }
.flow-step .t {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.flow-step .t .r { color: var(--red); font-weight: 700; }
.flow-step .t .g { color: var(--green); font-weight: 700; }
.flow-step .d {
  font-size: 12.5px;
  color: var(--ink-60);
  margin-top: 4px;
  word-break: keep-all;
}
.flow-arrow {
  text-align: center;
  color: var(--ink-20);
  font-size: 13px;
  font-family: var(--serif-en);
  font-weight: 700;
  margin: 0;
  padding: 0;
}

/* 끊어읽기 */
.read-sent {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 11px 13px 11px;
  margin-bottom: 8px;
  background: var(--paper);
}
.read-sent .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  word-break: keep-all;
}
.read-sent .chunks {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--ink-10);
}
.read-sent .chunk {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
  padding: 3px 0;
  font-size: 12.5px;
  border-bottom: 1px dotted var(--ink-10);
}
.read-sent .chunk:last-child { border-bottom: none; }
.read-sent .chunk .ce {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--ink-80);
  word-break: keep-all;
}
.read-sent .chunk .ck { color: var(--ink-60); word-break: keep-all; }
.read-sent .ko {
  margin-top: 9px;
  padding: 7px 11px;
  background: var(--ink-05);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-80);
  word-break: keep-all;
  line-height: 1.6;
}
.read-sent .ko b { color: var(--ink); font-weight: 700; }

/* 어휘 chip */
.vocab {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--ink-10);
}
.vocab .vlabel {
  width: 100%;
  font-size: 11px;
  color: var(--ink-60);
  letter-spacing: 0.18em;
  margin-bottom: 4px;
  font-weight: 600;
}
.vocab .chip {
  font-size: 12.5px;
  padding: 5px 9px;
  background: var(--paper);
  border: 0.7px solid var(--ink-20);
  border-radius: 4px;
  line-height: 1.4;
}
.vocab .chip b {
  font-family: var(--serif-en);
  font-style: italic;
  color: var(--red);
  font-weight: 700;
}
.vocab .chip span { color: var(--ink-80); margin-left: 5px; }

/* 퀴즈 */
.quiz-item {
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  margin-bottom: 6px;
  background: var(--paper);
}
.quiz-item > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-item > summary::-webkit-details-marker { display: none; }
.quiz-item .qn {
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--green);
  border-radius: 3px;
  padding: 2px 6px;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.quiz-item .qarr {
  margin-left: auto;
  font-size: 11px;
  color: var(--green);
  flex: 0 0 auto;
  font-family: var(--serif-en);
  font-style: italic;
  font-weight: 700;
}
.quiz-item[open] .qarr { visibility: hidden; }
.quiz-item .qa {
  padding: 0 13px 13px 44px;
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.65;
  word-break: keep-all;
}
.quiz-item .qa b { color: var(--green); font-weight: 700; }

/* 영어 원문 + 한글 해석 */
.src {
  background: var(--paper);
  border: 1px solid var(--ink-10);
  border-radius: 7px;
  padding: 14px 16px;
}
.src .en {
  font-family: var(--serif-en);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.85;
  word-break: keep-all;
}
.src .ko {
  font-size: 13.5px;
  color: var(--ink-80);
  line-height: 1.85;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed var(--ink-10);
  word-break: keep-all;
}

/* ============================================================
   FOOTER
   ============================================================ */
.foot {
  margin-top: 36px;
  padding-top: 14px;
  border-top: 1px solid var(--ink-10);
  font-size: 10.5px;
  color: var(--ink-40);
  text-align: center;
  font-family: var(--serif-kr);
  letter-spacing: 0.03em;
}
.foot .pub {
  font-family: var(--serif-en);
  font-style: italic;
  display: block;
  margin-top: 4px;
  color: var(--ink-60);
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width: 540px) {
  .wrap { padding: 14px 13px 60px; }
  .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand .b-meta { text-align: left; }
  .guide .g-row { flex-direction: column; gap: 1px; padding-bottom: 4px; }
  .guide .g-row + .g-row { border-top: 1px dashed var(--ink-10); padding-top: 5px; }
  .guide .g-when { font-size: 12px; min-width: 0; }
  .guide .g-sep { display: none; }
  .guide .g-tools { font-size: 12.5px; }
  .p-head h2 { font-size: 20px; }
  .oneline { font-size: 16px; padding: 14px 14px; }
  .read-sent .chunk { grid-template-columns: 1fr; gap: 1px; }
  .read-sent .chunk .ck { padding-left: 4px; color: var(--ink-60); font-size: 12px; }
  .flow-step { padding: 10px 11px; gap: 9px; }
  .flow-step .kind { flex-basis: 52px; font-size: 10.5px; }
  .tool > summary { padding: 12px 13px; font-size: 14px; }
  .tool > summary .thint { display: none; }
  .metaphor figure { padding: 13px 13px 10px; }
  .metaphor figcaption { font-size: 12px; }
}
</style>
</head>
<body class="dev-ipad">
<div class="wrap">

<!-- 학원 브랜드 헤더 -->
<header class="brand">
  <div class="b-title">
    <h1>지문 이해 보조 자료</h1>
    <div class="b-sub">수능특강 영어독해연습 04강 · 지문 1-12</div>
  </div>
  <div class="b-meta">
    김가영어학원<br>
    <span class="en">KIM KA YOUNG ENGLISH</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- 지문 패널 -->
<main id="main"></main>

<!-- 콜로폰 -->
<footer class="foot">
  김가영어학원 · KIM KA YOUNG ENGLISH &nbsp;·&nbsp; 지문 이해 보조 자료
  <span class="pub">published by warm &amp; wise books</span>
</footer>

</div>

<script>
/* ============================================================
   데이터 (P.data) — 수능특강 영어독해연습 04강 지문 1-12
   각 지문에 metaphor(SVG 문자열) + caption 필드 추가
   ============================================================ */
const P = {"data": [{"no": "1", "title": "Probabilistic Categorization & Bats", "ktitle": "전형적 범주는 빠르게 인식되지만, 박쥐 같은 비전형은 분류 어려움과 두려움을 만든다.", "field": "수능특강 영어독해연습", "page": "04강 Ex.01", "oneline": "확률론적 분류 체계에서 전형적 구성원은 공유 특징이 많아 빠르게 인식되지만, 박쥐 같은 비전형(아웃라이어)은 잘못 분류되어 인지 부담을 주며 — 이 분류 어려움이 두려움으로 이어진다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 포유류 원과 오른쪽 조류 원 안에 각각 강아지와 새가 전형으로 놓여 있고, 두 원 사이 변두리에 박쥐가 빨강 점선과 물음표 마크와 함께 양쪽 모두 비전형으로 표시되며 하단에 잘못 분류 → 인지 부담 → 두려움의 인과 사슬이 그려진 그림\">\n\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">확률론적 분류 — 박쥐는 두 범주 모두에서 비전형</text>\n\n  <!-- 좌측 원: Mammals -->\n  <circle cx=\"170\" cy=\"130\" r=\"72\" fill=\"#f0faf3\" fill-opacity=\"0.35\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n  <text x=\"170\" y=\"46\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">Mammals · 포유류</text>\n\n  <!-- 좌측 전형: 강아지 -->\n  <g transform=\"translate(170, 135)\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"18\" ry=\"10\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n    <circle cx=\"-15\" cy=\"-3\" r=\"7\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <ellipse cx=\"-19\" cy=\"-9\" rx=\"2.5\" ry=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    <circle cx=\"-17\" cy=\"-3\" r=\"0.9\" fill=\"#1a1a1a\"/>\n    <line x1=\"-8\" y1=\"10\" x2=\"-8\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <line x1=\"2\" y1=\"10\" x2=\"2\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"16\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <path d=\"M 18 -2 Q 24 -8 26 -10\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"m y=\"-9\" r=\"0.6\" fill=\"#ffffff\"/>\n    <!-- 날개 (막날개) -->\n    <path d=\"M -5 -2 Q -20 -8 -28 -2 Q -25 6 -18 8 Q -10 6 -5 5 Z\" fill=\"#1a1a1a\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n    <path d=\"M 5 -2 Q 20 -8 28 -2 Q 25 6 18 8 Q 10 6 5 5 Z\" fill=\"#1a1a1a\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n    <!-- 날개 막 살(rib) -->\n    <line x1=\"-10\" y1=\"-3\" x2=\"-12\" y2=\"4\" stroke=\"#ffffff\" stroke-width=\"0.5\"/>\n    <line x1=\"-18\" y1=\"-5\" x2=\"-20\" y2=\"3\" stroke=\"#ffffff\" stroke-width=\"0.5\"/>\n    <line x1=\"10\" y1=\"-3\" x2=\"12\" y2=\"4\" stroke=\"#ffffff\" stroke-width=\"0.5\"/>\n    <line x1=\"18\" y1=\"-5\" x2=\"20\" y2=\"3\" stroke=\"#ffffff\" stroke-width=\"0.5\"/>\n  </g>\n\n  <!-- 박쥐 위 ? 마크 -->\n  <g transform=\"translate(300, 92)\">\n    <circle cx=\"0\" cy=\"0\" r=\"12\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n    <text x=\"0\" y=\"5\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">?</text>\n  </g>\n\n  <!-- 박쥐에서 두 원 가장자리로 점선 (양쪽 다 outlier) -->\n  <line x1=\"263\" y1=\"150\" x2=\"240\" y2=\"135\" stroke=\"#c8102e\" stroke-width=\"0.9\" stroke-dasharray=\"2 2\" opacity=\"0.55\"/>\n  <line x1=\"337\" y1=\"150\" x2=\"360\" y2=\"135\" stroke=\"#c8102e\" stroke-width=\"0.9\" stroke-dasharray=\"2 2\" opacity=\"0.55\"/>\n\n  <!-- 박쥐 라벨 -->\n  <text x=\"300\" y=\"195\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">atypical in BOTH</text>\n  <text x=\"300\" y=\"207\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">아웃라이어 — 조류처럼 생기고 행동 / 시력 X</text>\n\n  <!-- 하단 인과 사슬: misclassified → cognitive load → fear -->\n  <g transform=\"translate(0, 232)\">\n    <g transform=\"translate(75, 0)\">\n      <rect x=\"0\" y=\"0\" width=\"110\" height=\"26\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <text x=\"55\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">misclassified</text>\n    </g>\n    <line x1=\"190\" y1=\"13\" x2=\"215\" y2=\"13\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <polygon points=\"215,13 207,9 207,17\" fill=\"#c8102e\"/>\n    <g transform=\"translate(220, 0)\">\n      <rect x=\"0\" y=\"0\" width=\"130\" height=\"26\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"3 2\"/>\n      <text x=\"65\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">cognitive load</text>\n    </g>\n    <line x1=\"355\" y1=\"13\" x2=\"380\" y2=\"13\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <polygon points=\"380,13 372,9 372,17\" fill=\"#c8102e\"/>\n    <g transform=\"translate(385, 0)\">\n      <rect x=\"0\" y=\"0\" width=\"140\" height=\"26\" rx=\"3\" fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n      <text x=\"70\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">fear · 두려움</text>\n    </g>\n  </g>\n</svg>", "caption": "두 범주 어느 쪽에서도 비전형 — 박쥐는 왜 두려운가", "tldr": ["확률론적 분류 체계에서 전형적 구성원은 공유 특징이 많아 빠르게 인식되지만, 박쥐 같은 비전형(아웃라이어)은 잘못 분류되어 인지 부담을 주며 — 이 분류 어려움이 두려움으로 이어진다.", "두 범주 어느 쪽에서도 비전형 — 박쥐는 왜 두려운가", "확률론적 분류 체계에서 전형(중심)은 공유 특징이 많아 빠르게 인식되지만, 박쥐 같은 비전형(아웃라이어)은 잘못 분류되어 인지 부담을 주며 — 이 분류 어려움이 두려움으로 이어진다."], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [], "vocab": [["probabilistic", "확률론적·확률에 기반한"], ["exemplar", "전형·본보기"], ["category member", "범주 구성원·범주에 속하는 것"], ["share features with", "~와 특징을 공유하다"], ["in a sense", "어떤 의미에서는"], ["atypical", "비전형적인·이례적인"], ["outlier", "아웃라이어·예외적 사례 (분포에서 벗어난 것)"], ["lousy", "형편없는·매우 안 좋은"], ["observable", "관찰할 수 있는"], ["misclassify", "잘못 분류하다"]], "quiz": [["이 지문의 핵심 구조는?", "두 범주 어느 쪽에서도 비전형 — 박쥐는 왜 두려운가"], ["도식이 강조하는 결론은?", "확률론적 분류 체계에서 전형(중심)은 공유 특징이 많아 빠르게 인식되지만, 박쥐 같은 비전형(아웃라이어)은 잘못 분류되어 인지 부담을 주며 — 이 분류 어려움이 두려움으로 이어진다."]], "en": "In the probabilistic view, the typical exemplars or category members are recognized more quickly because they share more features with other category members. In a sense, the typical category member is closer to the centre of the category. And a similar effect might be observed with the exceptional category members. A very atypical member of a category (like bats as atypical mammals, or even as atypical birds if your category for \"bird\" is based on observable features) is really an outlier. It really is the case that the bat is a lousy member of the mammal category. It looks like a bird, acts like a bird, and cannot see very well. A probabilistic categorization system would assume that bats will be misclassified and will present people with some difficulty. It is plausible that our own inability to classify them readily corresponds to the fact that bats are often feared. Perhaps we fear bats because they do not fit into a simple, basic category very easily.", "ko": "확률론적 관점에서, 전형적인 예나 범주 구성원은 다른 구성원들과 더 많은 특징을 공유하기 때문에 더 빠르게 인식된다. 어떤 의미에서는, 전형적인 범주 구성원은 범주의 중심에 더 가깝다. 그리고 예외적인 범주 구성원에 대해서도 비슷한 효과가 관찰될 수 있다. 범주의 매우 비전형적인 구성원(가령 비전형적 포유류로서의 박쥐, 또는 '조류' 범주를 관찰 가능한 특징으로 정의한다면 비전형적 조류로서의 박쥐)은 진짜 아웃라이어이다. 박쥐가 포유류 범주의 형편없는 구성원이라는 것은 정말 사실이다. 박쥐는 조류처럼 생겼고, 조류처럼 행동하며, 시력이 좋지 않다. 확률론적 분류 체계는 박쥐가 잘못 분류되며 사람들에게 다소 어려움을 줄 것이라고 가정할 것이다. 우리가 박쥐를 쉽게 분류하지 못한다는 점이, 박쥐가 흔히 두려워지는 대상이라는 사실과 부합한다는 것이 그럴듯하다. 어쩌면 우리가 박쥐를 두려워하는 것은, 그것이 단순하고 기본적인 범주에 쉽게 들어맞지 않기 때문일지도 모른다.", "read": [{"en": "In the probabilistic view, the typical exemplars or category members are recognized more quickly because they share more features with other category members.", "ko": "확률론적 관점에서, 전형적인 예나 범주 구성원은 다른 구성원들과 더 많은 특징을 공유하기 때문에 더 빠르게 인식된다.", "chunks": []}, {"en": "In a sense, the typical category member is closer to the centre of the category.", "ko": "어떤 의미에서는, 전형적인 범주 구성원은 범주의 중심에 더 가깝다.", "chunks": []}, {"en": "And a similar effect might be observed with the exceptional category members.", "ko": "그리고 예외적인 범주 구성원에 대해서도 비슷한 효과가 관찰될 수 있다.", "chunks": []}, {"en": "A very atypical member of a category (like bats as atypical mammals, or even as atypical birds if your category for \"bird\" is based on observable features) is really an outlier.", "ko": "범주의 매우 비전형적인 구성원(가령 비전형적 포유류로서의 박쥐, 또는 '조류' 범주를 관찰 가능한 특징으로 정의한다면 비전형적 조류로서의 박쥐)은 진짜 아웃라이어이다.", "chunks": []}, {"en": "It really is the case that the bat is a lousy member of the mammal category.", "ko": "박쥐가 포유류 범주의 형편없는 구성원이라는 것은 정말 사실이다.", "chunks": []}, {"en": "It looks like a bird, acts like a bird, and cannot see very well.", "ko": "박쥐는 조류처럼 생겼고, 조류처럼 행동하며, 시력이 좋지 않다.", "chunks": []}, {"en": "A probabilistic categorization system would assume that bats will be misclassified and will present people with some difficulty.", "ko": "확률론적 분류 체계는 박쥐가 잘못 분류되며 사람들에게 다소 어려움을 줄 것이라고 가정할 것이다.", "chunks": []}, {"en": "It is plausible that our own inability to classify them readily corresponds to the fact that bats are often feared.", "ko": "우리가 박쥐를 쉽게 분류하지 못한다는 점이, 박쥐가 흔히 두려워지는 대상이라는 사실과 부합한다는 것이 그럴듯하다.", "chunks": []}, {"en": "Perhaps we fear bats because they do not fit into a simple, basic category very easily.", "ko": "어쩌면 우리가 박쥐를 두려워하는 것은, 그것이 단순하고 기본적인 범주에 쉽게 들어맞지 않기 때문일지도 모른다.", "chunks": []}]}, {"no": "2", "title": "Brilliant Leadership: Empathy & Authenticity", "ktitle": "훌륭한 리더십은 공감과 진정성의 결합이다. 공감은 수단이 아니라 그 자체로 가치다.", "field": "수능특강 영어독해연습", "page": "04강 Ex.02", "oneline": "훌륭한 리더십은 공감(empathy)과 진정성(authenticity)의 연결을 핵심으로 한다 — 공감은 조직 목표를 위한 수단이 아니라 그 자체로 가치이며, 칸트의 의무론적 인격 개념과 일치한다. 진정성은 공감을 결과 중심이 아닌 가치 중심으로 규정한다.", "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 칸트의 진실성 인용이 놓이고, 좌측에는 일반 리더가 공감을 도구처럼 들고 결과 박스로 화살표를 쏘는 수단주의 모습, 우측에는 공감 원과 진정성 원이 양방향 화살표로 결합한 가치 중심 리더십의 모습이 대조된 그림\">\n\n  <!-- 상단 Kant 인용 박스 -->\n  <g transform=\"translate(110, 8)\">\n    <rect x=\"0\" y=\"0\" width=\"380\" height=\"36\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <text x=\"190\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\" letter-spacing=\"0.18em\">— KANT · 의무론</text>\n    <text x=\"190\" y=\"29\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">\"truthfulness is the heart of virtue · 인격 = 진실성\"</text>\n  </g>\n\n  <!-- 좌측: 일반 리더 — 수단주의 -->\n  <g transform=\"translate(15, 55)\">\n    <text x=\"135\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">일반 리더 — empathy = a means</text>\n    <rect x=\"0\" y=\"6\" width=\"270\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n\n    <!-- stick figure 리더 -->\n    <g transform=\"translate(55, 90)\">\n      <circle cx=\"0\" cy=\"0\" r=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-1\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"-1\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <line x1=\"-3\" y1=\"5\" x2=\"3\" y2=\"5\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"13\" x2=\"0\" y2=\"52\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"18\" y2=\"14\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"-12\" y2=\"32\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"52\" x2=\"-8\" y2=\"76\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"52\" x2=\"8\" y2=\"76\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"92\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">leader</text>\n    </g>\n\n    <!-- 손에 든 하트 (공감 = 도구) -->\n    <g transform=\"translate(88, 90)\">\n      <path d=\"M 0 0 C -3 -6 -11 -6 -11 0 C -11 5 0 12 0 12 C 0 12 11 5 11 0 C 11 -6 3 -6 0 0 Z\"\n            fill=\"#c8102e\" stroke=\"#c8102e\" stroke-width=\"0.8\"/>\n      <text x=\"0\" y=\"-10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">empathy</text>\n      <text x=\"0\" y=\"25\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">tool · 수단</text>\n    </g>\n\n    <!-- 화살표: 도구를 결과를 향해 -->\n    <line x1=\"108\" y1=\"98\" x2=\"170\" y2=\"120\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n    <polygon points=\"170,120 161,117 164,124\" fill=\"#c8102e\"/>\n\n    <!-- outcome 박스 -->\n    <g transform=\"translate(170, 105)\">\n      <rect x=\"0\" y=\"0\" width=\"90\" height=\"42\" rx=\"3\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n      <text x=\"45\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">outcome</text>\n      <text x=\"45\" y=\"32\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\">조직 목표</text>\n    </g>\n\n    <!-- 하단 라벨 -->\n    <text x=\"135\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">outcome-driven · 결과 중심</text>\n  </g>\n\n  <!-- 가운데 vs -->\n  <text x=\"299\" y=\"165\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n\n  <!-- 우측: 훌륭한 리더 — 가치 중심 결합 -->\n  <g transform=\"translate(315, 55)\">\n    <text x=\"135\" y=\"-2\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">훌륭한 리더 — empathy in its own right</text>\n    <rect x=\"0\" y=\"6\" width=\"270\" height=\"200\" fill=\"#f0faf3\" fill-opacity=\"0.4\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n\n    <!-- empathy 원 -->\n    <g transform=\"translate(80, 110)\">\n      <circle cx=\"0\" cy=\"0\" r=\"38\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">empathy</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">공감</text>\n    </g>\n\n    <!-- authenticity 원 -->\n    <g transform=\"translate(190, 110)\">\n      <circle cx=\"0\" cy=\"0\" r=\"42\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.7\"/>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">authenticity</text>\n      <text x=\"0\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">진정성</text>\n    </g>\n\n    <!-- 양방향 화살표 ⇄ -->\n    <g transform=\"translate(135, 110)\">\n      <line x1=\"-12\" y1=\"-5\" x2=\"12\" y2=\"-5\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <polygon points=\"12,-5 5,-9 5,-1\" fill=\"#1FA34A\"/>\n      <line x1=\"-12\" y1=\"5\" x2=\"12\" y2=\"5\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <polygon points=\"-12,5 -5,1 -5,9\" fill=\"#1FA34A\"/>\n    </g>\n\n    <!-- 결합 라벨 (위) -->\n    <text x=\"135\" y=\"62\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">→ Brilliant Leadership ←</text>\n\n    <!-- 하단 라벨 -->\n    <text x=\"135\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">values-driven · 가치 중심</text>\n  </g>\n</svg>", "caption": "공감을 수단이 아닌 그 자체 가치로 — 진정성과의 결합", "tldr": ["훌륭한 리더십은 공감(empathy)과 진정성(authenticity)의 연결을 핵심으로 한다 — 공감은 조직 목표를 위한 수단이 아니라 그 자체로 가치이며, 칸트의 의무론적 인격 개념과 일치한다. 진정성은 공감을 결과 중심이 아닌 가치 중심으로 규정한다.", "공감을 수단이 아닌 그 자체 가치로 — 진정성과의 결합", "훌륭한 리더십의 핵심은 공감과 진정성의 결합. 일반 리더는 공감을 조직 목표를 위한 수단으로 쓰지만, 훌륭한 리더는 공감을 그 자체로 가치 (칸트의 의무론적 인격)로 본다 — 진정성이 공감을 결과가 아닌 가치 중심으로 규정한다."], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [], "vocab": [["central to", "~의 중심에 있는·핵심인"], ["linkage", "연결고리·연관 관계"], ["empathy", "공감·감정이입"], ["authenticity", "진정성·진실성"], ["on the premise that", "~라는 전제하에"], ["sensitivity", "민감성·세심함"], ["in its own right", "그 자체로·독립적으로"], ["underscore", "강조하다·역설하다"], ["virtue", "미덕·덕목"], ["stakeholder", "이해관계자 (조직과 이해를 공유하는 자)"]], "quiz": [["이 지문의 핵심 구조는?", "공감을 수단이 아닌 그 자체 가치로 — 진정성과의 결합"], ["도식이 강조하는 결론은?", "훌륭한 리더십의 핵심은 공감과 진정성의 결합. 일반 리더는 공감을 조직 목표를 위한 수단으로 쓰지만, 훌륭한 리더는 공감을 그 자체로 가치 (칸트의 의무론적 인격)로 본다 — 진정성이 공감을 결과가 아닌 가치 중심으로 규정한다."]], "en": "Central to the notion of brilliant leadership is the critical linkage between empathy and authenticity. While leaders may act on the premise that sensitivity to employee concerns is helpful in achieving organizational goals, brilliant leaders believe that empathy has value in its own right. In this regard, empathy is less a means to an end (e.g., profiting) but rather is consistent with Kant's notion of \"Character,\" which underscores truthfulness as a core element of virtue. From a stakeholder perspective, particularly employees, brilliant leaders would be seen as behaving in ways that reveal a genuineness of motives. Guided by the deontologically-based philosophical guidepost, \"We should do our duty for no other reason than because it's the right thing to do,\" the brilliant leader's empathetic conduct is derived less from strategic or tactical interests than it is from one's personal sense of integrity. That, then, is a defining feature of authenticity: it frames empathy as values-driven rather than outcome-driven.", "ko": "훌륭한 리더십이라는 개념의 중심에는 공감과 진정성 사이의 매우 중요한 연결고리가 있다. 리더들은 직원의 관심사에 민감하게 반응하는 것이 조직 목표 달성에 도움이 된다는 전제하에 행동할 수 있지만, 훌륭한 리더는 공감이 그 자체로 가치가 있다고 믿는다. 이런 점에서, 공감은 목적(이익 등)을 위한 수단이라기보다는 — 진실성을 미덕의 핵심으로 강조하는 칸트의 '인격' 개념과 일치한다. 이해관계자, 특히 직원의 관점에서 볼 때 훌륭한 리더는 동기의 진실성을 드러내는 방식으로 행동한다고 여겨질 것이다. 의무론에 기반한 철학적 지침(\"그것이 옳은 일이라는 이유 외에 다른 이유 없이 의무를 다해야 한다\")에 따라, 훌륭한 리더의 공감적 행동은 전략적·전술적 이익보다는 진실성에 대한 개인적 감각에서 비롯된다. 그렇다면 그것은 진정성의 결정적인 특징이다 — 진정성은 공감을 결과 중심이 아닌 가치 중심으로 규정한다.", "read": [{"en": "Central to the notion of brilliant leadership is the critical linkage between empathy and authenticity.", "ko": "훌륭한 리더십이라는 개념의 중심에는 공감과 진정성 사이의 매우 중요한 연결고리가 있다.", "chunks": []}, {"en": "While leaders may act on the premise that sensitivity to employee concerns is helpful in achieving organizational goals, brilliant leaders believe that empathy has value in its own right.", "ko": "리더들은 직원의 관심사에 민감하게 반응하는 것이 조직 목표 달성에 도움이 된다는 전제하에 행동할 수 있지만, 훌륭한 리더는 공감이 그 자체로 가치가 있다고 믿는다.", "chunks": []}, {"en": "In this regard, empathy is less a means to an end (e.g., profiting) but rather is consistent with Kant's notion of \"Character,\" which underscores truthfulness as a core element of virtue.", "ko": "이런 점에서, 공감은 목적(이익 등)을 위한 수단이라기보다는 — 진실성을 미덕의 핵심으로 강조하는 칸트의 '인격' 개념과 일치한다.", "chunks": []}, {"en": "From a stakeholder perspective, particularly employees, brilliant leaders would be seen as behaving in ways that reveal a genuineness of motives.", "ko": "이해관계자, 특히 직원의 관점에서 볼 때 훌륭한 리더는 동기의 진실성을 드러내는 방식으로 행동한다고 여겨질 것이다.", "chunks": []}, {"en": "Guided by the deontologically-based philosophical guidepost, \"We should do our duty for no other reason than because it's the right thing to do,\" the brilliant leader's empathetic conduct is derived less from strategic or tactical interests than it is from one's personal sense of integrity.", "ko": "의무론에 기반한 철학적 지침(\"그것이 옳은 일이라는 이유 외에 다른 이유 없이 의무를 다해야 한다\")에 따라, 훌륭한 리더의 공감적 행동은 전략적·전술적 이익보다는 진실성에 대한 개인적 감각에서 비롯된다.", "chunks": []}, {"en": "That, then, is a defining feature of authenticity: it frames empathy as values-driven rather than outcome-driven.", "ko": "그렇다면 그것은 진정성의 결정적인 특징이다 — 진정성은 공감을 결과 중심이 아닌 가치 중심으로 규정한다.", "chunks": []}]}, {"no": "3", "title": "Language vs Emotion: Two Constructions", "ktitle": "언어와 감정은 평행하지만 서로를 증명하지 않는다. 감정 단어의 부재가 감정 회로의 부재는 아니다.", "field": "수능특강 영어독해연습", "page": "04강 Ex.03", "oneline": "언어는 사회적으로, 감정은 생물학적으로 구성되며 서로 독립적으로 형성된다 — 그래서 한 문화의 감정 단어 유무는 그 감정 회로의 유무를 보장하지 않는다. 감정과 언어는 평행하지만 서로의 존재를 보장하지 않는다 (타히티 사례가 보여줌).", "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"위 트랙에 사람들이 단어 풍선으로 grief sadness joy를 말하는 사회적 언어 구성과, 아래 트랙에 뇌 회로 세 개가 점선으로 연결된 생물학적 감정 구성이 평행으로 놓이고 사이에 ≠ 기호가 반복되며 하단에 타히티 사례 박스가 결론을 입증하는 그림\">\n\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">두 평행 트랙 — 서로의 존재를 입증하지 못한다</text>\n\n  <!-- Language track (위) -->\n  <g transform=\"translate(20, 28)\">\n    <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#1a1a1a\">Language · 언어 (socially constructed)</text>\n    <rect x=\"0\" y=\"8\" width=\"560\" height=\"65\" rx=\"3\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n\n    <!-- 사람 1 -->\n    <g transform=\"translate(50, 48)\">\n      <circle cx=\"0\" cy=\"0\" r=\"8\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <circle cx=\"-2\" cy=\"-1\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <circle cx=\"2\" cy=\"-1\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <line x1=\"0\" y1=\"8\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <line x1=\"0\" y1=\"13\" x2=\"-6\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"0\" y1=\"13\" x2=\"6\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <!-- 말풍선 -->\n      <ellipse cx=\"34\" cy=\"-12\" rx=\"24\" ry=\"9\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <text x=\"34\" y=\"-9\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"7 -3\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n    </g>\n\n    <!-- 우측 부가 라벨 -->\n    <text x=\"525\" y=\"48\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">단어가 먼저</text>\n    <text x=\"525\" y=\"60\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">의미 부여</text>\n  </g>\n\n  <!-- ≠ markers between tracks -->\n  <g font-family=\"Noto Serif\" font-weight=\"700\" font-size=\"22\" fill=\"#c8102e\" text-anchor=\"middle\">\n    <text x=\"120\" y=\"140\">≠</text>\n    <text x=\"295\" y=\"140\">≠</text>\n    <text x=\"470\" y=\"140\">≠</text>\n  </g>\n\n  <!-- Emotion track (아래) -->\n  <g transform=\"translate(20, 156)\">\n    <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" fill=\"#1a1a1a\">Basic Emotions · 감정 (biologically constructed)</text>\n    <rect x=\"0\" y=\"8\" width=\"560\" height=\"65\" rx=\"3\" fill=\"#f6f6f6\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n\n    <!-- 뇌 회로 1 -->\n    <g transform=\"translate(50, 40)\">\n      <path d=\"M -16 0 Q -18 -10 -12 -14 Q -10 -18 -2 -18 Q 0 -22 8 -18 Q 16 -18 18 -10 Q 22 -6 18 0 Q 20 6 14 10 Q 12 16 4 14 Q -2 18 -10 12 Q -18 10 -16 0 Z\"\n            fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <path d=\"M -8 -4 Q 0 -8 6 -2 M -4 4 Q 4 8 10 2 M -10 0 Q -4 2 0 -2\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\" font-weight=\"700\">circuit</text>\n    </g>\n\n    <!-- 뇌 회로 2 -->\n    <g transform=\"translate(225, 40)\">\n      <path d=\"M -16 0 Q -18 -10 -12 -14 Q -10 -18 -2 -18 Q 0 -22 8 -18 Q 16 -18 18 -10 Q 22 -6 18 0 Q 20 6 14 10 Q 12 16 4 14 Q -2 18 -10 12 Q -18 10 -16 0 Z\"\n            fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <path d=\"M -8 -4 Q 0 -8 6 -2 M -4 4 Q 4 8 10 2 M -10 0 Q -4 2 0 -2\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\" font-weight=\"700\">circuit</text>\n    </g>\n\n    <!-- 뇌 회로 3 -->\n    <g transform=\"translate(400, 40)\">\n      <path d=\"M -16 0 Q -18 -10 -12 -14 Q -10 -18 -2 -18 Q 0 -22 8 -18 Q 16 -18 18 -10 Q 22 -6 18 0 Q 20 6 14 10 Q 12 16 4 14 Q -2 18 -10 12 Q -18 10 -16 0 Z\"\n            fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <path d=\"M -8 -4 Q 0 -8 6 -2 M -4 4 Q 4 8 10 2 M -10 0 Q -4 2 0 -2\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\" font-weight=\"700\">circuit</text>\n    </g>\n\n    <!-- 회로 간 연결 (점선) -->\n    <line x1=\"76\" y1=\"40\" x2=\"200\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1\" stroke-dasharray=\"3 2\" opacity=\"0.6\"/>\n    <line x1=\"251\" y1=\"40\" x2=\"375\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1\" stroke-dasharray=\"3 2\" opacity=\"0.6\"/>\n\n    <!-- 우측 부가 라벨 -->\n    <text x=\"525\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">반응이 먼저</text>\n    <text x=\"525\" y=\"52\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">단어와 무관</text>\n  </g>\n\n  <!-- 하단 타히티 사례 박스 -->\n  <g transform=\"translate(70, 252)\">\n    <rect x=\"0\" y=\"-12\" width=\"460\" height=\"22\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.3\"/>\n    <text x=\"230\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">Tahiti — no word for 'grief' / yet feels \"aching &amp; strange\" ✓</text>\n  </g>\n</svg>", "caption": "언어 = 사회적 / 감정 = 생물학적 — 평행하지만 서로를 보장하지 못함", "tldr": ["언어는 사회적으로, 감정은 생물학적으로 구성되며 서로 독립적으로 형성된다 — 그래서 한 문화의 감정 단어 유무는 그 감정 회로의 유무를 보장하지 않는다. 감정과 언어는 평행하지만 서로의 존재를 보장하지 않는다 (타히티 사례가 보여줌).", "언어 = 사회적 / 감정 = 생물학적 — 평행하지만 서로를 보장하지 못함", "언어는 사회적으로, 감정은 생물학적으로 구성되며 독립적으로 형성된다. 한 문화의 감정 단어 유무는 그 감정 회로의 유무를 보장하지 않는다 — 타히티 사례(슬픔 단어 없어도 슬픔은 있음)가 이를 보여 준다."], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [{"kind": "출발", "t": "언어 = 사회적"}, {"kind": "결론", "t": "감정 = 생물학적 — 평행하지만 서로를 입증하지 못함"}], "vocab": [["socially constructed", "사회적으로 구성된"], ["cultural collective", "문화 공동체"], ["agree upon", "~에 합의하다·동의하다"], ["abstract", "추상적인"], ["represent", "나타내다·대표하다"], ["conversely", "반대로·역으로"], ["craft", "(정교하게) 만들어 내다"], ["circuitry", "(신경) 회로 체계"], ["phenomenology", "현상학·주관적 경험"], ["analogous", "유사한·비슷한"]], "quiz": [["이 지문의 핵심 구조는?", "언어 = 사회적 / 감정 = 생물학적 — 평행하지만 서로를 보장하지 못함"], ["도식이 강조하는 결론은?", "언어는 사회적으로, 감정은 생물학적으로 구성되며 독립적으로 형성된다. 한 문화의 감정 단어 유무는 그 감정 회로의 유무를 보장하지 않는다 — 타히티 사례(슬픔 단어 없어도 슬픔은 있음)가 이를 보여 준다."]], "en": "Language is socially constructed; over time our cultural collectives agreed upon various abstract symbols and sounds to represent objects, people, places, and experiences. Conversely, basic emotions are biologically constructed; over time evolution repeatedly crafted responses to important life situations ─ which we later associated with symbols, words, and phrases. The presence of a unique emotion word in one culture does not imply the presence of unique circuitry or unique phenomenology for a special emotion found only in that culture. Similarly, the absence of a specific basic emotion word in one culture does not imply the absence of analogous basic emotion circuitry. Emotions and language are parallel processes that can inform and provide context about one another, but ultimately cannot guarantee the existence of one another. An example of this is in Robert Levy's pioneering work in Tahiti, where he found that Tahitians had no words for \"grief\" and \"sadness.\" Nevertheless, they experienced a \"sick, strange\" feeling when processing the loss of a loved one.", "ko": "언어는 사회적으로 구성된다 — 시간이 흐르면서 우리 문화 공동체는 사물·사람·장소·경험을 나타내기 위해 다양한 추상적 기호와 소리에 합의해 왔기 때문이다. 반대로, 기본 감정은 생물학적으로 구성된다 — 시간이 흐르며 진화가 중요한 삶의 상황에 대한 반응을 거듭 만들어 냈고, 이를 우리가 나중에 기호·단어·구절과 연관 지었다. 한 문화에 고유한 감정 단어가 있다고 해서, 그 문화에만 있는 특별한 감정의 고유 신경 회로나 고유 주관적 경험이 존재하는 것은 아니다. 마찬가지로, 한 문화에 특정 기본 감정 단어가 없다고 해서 유사한 기본 감정 회로가 없다는 뜻은 아니다. 감정과 언어는 평행한 과정이다 — 서로에 대한 정보를 주고 맥락을 제공할 수 있지만, 궁극적으로 서로의 존재를 보장하지는 못한다. 이에 대한 한 예는 Robert Levy의 타히티 선구 연구에 있다 — 거기서 그는 타히티인들에게 '비탄'과 '슬픔'을 뜻하는 단어가 없다는 것을 발견했다. 그럼에도 불구하고, 타히티인들은 사랑하는 사람의 상실을 처리하는 과정에서 '아프고, 이상한' 감정을 경험했다.", "read": [{"en": "Language is socially constructed; over time our cultural collectives agreed upon various abstract symbols and sounds to represent objects, people, places, and experiences.", "ko": "언어는 사회적으로 구성된다 — 시간이 흐르면서 우리 문화 공동체는 사물·사람·장소·경험을 나타내기 위해 다양한 추상적 기호와 소리에 합의해 왔기 때문이다.", "chunks": []}, {"en": "Conversely, basic emotions are biologically constructed; over time evolution repeatedly crafted responses to important life situations ─ which we later associated with symbols, words, and phrases.", "ko": "반대로, 기본 감정은 생물학적으로 구성된다 — 시간이 흐르며 진화가 중요한 삶의 상황에 대한 반응을 거듭 만들어 냈고, 이를 우리가 나중에 기호·단어·구절과 연관 지었다.", "chunks": []}, {"en": "The presence of a unique emotion word in one culture does not imply the presence of unique circuitry or unique phenomenology for a special emotion found only in that culture.", "ko": "한 문화에 고유한 감정 단어가 있다고 해서, 그 문화에만 있는 특별한 감정의 고유 신경 회로나 고유 주관적 경험이 존재하는 것은 아니다.", "chunks": []}, {"en": "Similarly, the absence of a specific basic emotion word in one culture does not imply the absence of analogous basic emotion circuitry.", "ko": "마찬가지로, 한 문화에 특정 기본 감정 단어가 없다고 해서 유사한 기본 감정 회로가 없다는 뜻은 아니다.", "chunks": []}, {"en": "Emotions and language are parallel processes that can inform and provide context about one another, but ultimately cannot guarantee the existence of one another.", "ko": "감정과 언어는 평행한 과정이다 — 서로에 대한 정보를 주고 맥락을 제공할 수 있지만, 궁극적으로 서로의 존재를 보장하지는 못한다.", "chunks": []}, {"en": "An example of this is in Robert Levy's pioneering work in Tahiti, where he found that Tahitians had no words for \"grief\" and \"sadness.\"", "ko": "이에 대한 한 예는 Robert Levy의 타히티 선구 연구에 있다 — 거기서 그는 타히티인들에게 '비탄'과 '슬픔'을 뜻하는 단어가 없다는 것을 발견했다.", "chunks": []}, {"en": "Nevertheless, they experienced a \"sick, strange\" feeling when processing the loss of a loved one.", "ko": "그럼에도 불구하고, 타히티인들은 사랑하는 사람의 상실을 처리하는 과정에서 '아프고, 이상한' 감정을 경험했다.", "chunks": []}]}, {"no": "4", "title": "Saving the Planet: Not All-or-Nothing", "ktitle": "친환경 생활은 전부 아니면 전무가 아니다. 가능한 만큼 작은 변화가 진짜 중요하다.", "field": "수능특강 영어독해연습", "page": "04강 Ex.04", "oneline": "친환경 생활(식물성 식단·제로 웨이스트)은 전부 아니면 전무의 양자택일이 아니다 — 가능한 만큼 작은 변화를 실천하는 것이 완벽한 실천보다 진짜 중요하다.", "metaphor": "<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 양자택일 사고가 압박과 죄책감을 만든다는 빨강 점선 박스, 중앙에 0퍼센트에서 100퍼센트로 이어진 스펙트럼 슬라이더 위 세 곳에 초록 체크 핸들이 어디든 가능함을 보여주고 양 끝은 회색 X로 통념을 부정하며 하단에 작은 실천도 의미 있다는 초록 박스가 결론을 적은 그림\">\n\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">친환경은 양자택일이 아니다 — 스펙트럼이다</text>\n\n  <!-- 상단 빨강 박스: all-or-nothing 통념 -->\n  <g transform=\"translate(60, 26)\">\n    <rect x=\"0\" y=\"0\" width=\"480\" height=\"42\" rx=\"4\" fill=\"#fdf2f4\" fill-opacity=\"0.5\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n    <text x=\"240\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">\"all-or-nothing\"  ·  binary venture ✗</text>\n    <text x=\"240\" y=\"33\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">완벽한 비건/제로 웨이스트 못 하면 죄책감 · 압박감</text>\n  </g>\n\n  <!-- 가운데 스펙트럼 슬라이더 -->\n  <g transform=\"translate(60, 110)\">\n    <!-- 트랙 -->\n    <line x1=\"0\" y1=\"22\" x2=\"480\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width     <line x1=\"3.5\" y1=\"-3.5\" x2=\"-3.5\" y2=\"3.5\" stroke=\"#999\" stroke-width=\"1.5\"/>\n      </g>\n    </g>\n\n    <!-- 슬라이더 핸들 3개 (어디든 OK) -->\n    <g transform=\"translate(140, 22)\">\n      <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#1FA34A\" stroke=\"#ffffff\" stroke-width=\"1.6\"/>\n      <path d=\"M -4 0 L -1 3.5 L 5 -3\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2\"/>\n    </g>\n    <g transform=\"translate(250, 22)\">\n      <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#1FA34A\" stroke=\"#ffffff\" stroke-width=\"1.6\"/>\n      <path d=\"M -4 0 L -1 3.5 L 5 -3\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2\"/>\n    </g>\n    <g transform=\"translate(340, 22)\">\n      <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#1FA34A\" stroke=\"#ffffff\" stroke-width=\"1.6\"/>\n      <path d=\"M -4 0 L -1 3.5 L 5 -3\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2\"/>\n    </g>\n\n    <!-- \"where you can\" 위 라벨 -->\n    <text x=\"240\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"where you can\"  —  어디든 OK</text>\n  </g>\n\n  <!-- 하단 초록 박스: 작은 실천도 의미 있음 -->\n  <g transform=\"translate(60, 206)\">\n    <rect x=\"0\" y=\"0\" width=\"480\" height=\"42\" rx=\"4\" fill=\"#f0faf3\" fill-opacity=\"0.5\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n    <text x=\"240\" y=\"17\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"where/how you can\"  ·  small actions count ✓</text>\n    <text x=\"240\" y=\"33\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\">육·유제품 조금 줄이기 / 가능할 때 낱개 구매 — 진짜 중요한 것</text>\n  </g>\n</svg>", "caption": "친환경은 양자택일 아닌 스펙트럼 — 가능한 만큼이 진짜 중요", "tldr": ["친환경 생활(식물성 식단·제로 웨이스트)은 전부 아니면 전무의 양자택일이 아니다 — 가능한 만큼 작은 변화를 실천하는 것이 완벽한 실천보다 진짜 중요하다.", "친환경은 양자택일 아닌 스펙트럼 — 가능한 만큼이 진짜 중요", "친환경 생활(식물성 식단·제로 웨이스트)은 전부 아니면 전무의 양자택일이 아니다 — 가능한 만큼 작은 변화를 실천하는 것이 완벽한 실천보다 진짜 중요하다."], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [], "vocab": [["lifestyle change", "생활 방식의 변화"], ["plant-based diet", "식물성 식단 (육·유제품 최소화)"], ["pledge to", "~하기로 약속·맹세하다"], ["zero-waste", "제로 웨이스트의·쓰레기 무배출"], ["drastic", "급진적인·과감한"], ["feel pressured into", "~로 떠밀린 듯 느끼다"], ["follow suit", "(남이 한 대로) 따라하다"], ["inadequate", "불충분한·부적절한"], ["all-or-nothing", "전부 아니면 전무의·양자택일"], ["venture", "시도·모험적 사업"]], "quiz": [["이 지문의 핵심 구조는?", "친환경은 양자택일 아닌 스펙트럼 — 가능한 만큼이 진짜 중요"], ["도식이 강조하는 결론은?", "친환경 생활(식물성 식단·제로 웨이스트)은 전부 아니면 전무의 양자택일이 아니다 — 가능한 만큼 작은 변화를 실천하는 것이 완벽한 실천보다 진짜 중요하다."]], "en": "There are some pretty big lifestyle changes you can choose to make if you want to help the planet. For instance, you could follow a plant-based diet, or you could pledge to go zero-waste. If you're surrounded by people who are making these drastic changes, you might feel pressured into following suit: you might feel that if you don't make these changes, your efforts to save the planet are inadequate. Despite what you might hear, a plant-based diet or zero-waste living is not necessarily an all-or-nothing venture. Reducing your meat and dairy intake a little is better than not doing so at all; buying fruit, veg and grains loose when you can is better than always buying them wrapped in plastic. The fact is, you don't have to follow a vegan or a zero-waste lifestyle perfectly to make a difference. Making little changes where you can and how you can is what truly counts.", "ko": "지구를 돕고 싶다면 선택해서 실천할 수 있는 꽤 큰 생활 방식의 변화가 몇 가지 있다. 예를 들어, 식물성 식단을 따르거나 제로 웨이스트를 실천하겠다고 약속할 수 있다. 이런 급진적 변화를 실천하는 사람들에게 둘러싸여 있다면, 따라 해야 한다는 압박감을 느낄 수 있다 — 이런 변화를 실천하지 않으면 지구를 구하려는 노력이 부족하다고 느낄 수 있다. 여러분이 듣게 될지도 모르는 것과는 달리, 식물성 식단이나 제로 웨이스트 생활은 반드시 전부 아니면 전무의 시도는 아니다. 육류·유제품을 조금이라도 줄이는 것이 전혀 안 줄이는 것보다 낫다 — 가능할 때 과일·채소·곡물을 포장 없이 낱개로 사는 것이 늘 비닐 포장된 것을 사는 것보다 낫다. 사실, 변화를 만들기 위해 비건이나 제로 웨이스트 생활을 완벽하게 따라야 할 필요는 없다. 가능한 곳에서 가능한 방식으로 작은 변화를 실천하는 것이야말로 진짜 중요한 것이다.", "read": [{"en": "There are some pretty big lifestyle changes you can choose to make if you want to help the planet.", "ko": "지구를 돕고 싶다면 선택해서 실천할 수 있는 꽤 큰 생활 방식의 변화가 몇 가지 있다.", "chunks": []}, {"en": "For instance, you could follow a plant-based diet, or you could pledge to go zero-waste.", "ko": "예를 들어, 식물성 식단을 따르거나 제로 웨이스트를 실천하겠다고 약속할 수 있다.", "chunks": []}, {"en": "If you're surrounded by people who are making these drastic changes, you might feel pressured into following suit: you might feel that if you don't make these changes, your efforts to save the planet are inadequate.", "ko": "이런 급진적 변화를 실천하는 사람들에게 둘러싸여 있다면, 따라 해야 한다는 압박감을 느낄 수 있다 — 이런 변화를 실천하지 않으면 지구를 구하려는 노력이 부족하다고 느낄 수 있다.", "chunks": []}, {"en": "Despite what you might hear, a plant-based diet or zero-waste living is not necessarily an all-or-nothing venture.", "ko": "여러분이 듣게 될지도 모르는 것과는 달리, 식물성 식단이나 제로 웨이스트 생활은 반드시 전부 아니면 전무의 시도는 아니다.", "chunks": []}, {"en": "Reducing your meat and dairy intake a little is better than not doing so at all; buying fruit, veg and grains loose when you can is better than always buying them wrapped in plastic.", "ko": "육류·유제품을 조금이라도 줄이는 것이 전혀 안 줄이는 것보다 낫다 — 가능할 때 과일·채소·곡물을 포장 없이 낱개로 사는 것이 늘 비닐 포장된 것을 사는 것보다 낫다.", "chunks": []}, {"en": "The fact is, you don't have to follow a vegan or a zero-waste lifestyle perfectly to make a difference.", "ko": "사실, 변화를 만들기 위해 비건이나 제로 웨이스트 생활을 완벽하게 따라야 할 필요는 없다.", "chunks": []}, {"en": "Making little changes where you can and how you can is what truly counts.", "ko": "가능한 곳에서 가능한 방식으로 작은 변화를 실천하는 것이야말로 진짜 중요한 것이다.", "chunks": []}]}, {"no": "5", "title": "Diminishing Marginal Utility & Pro Sports", "ktitle": "소득이 늘어도 한 재화는 한계효용 체감으로 무한정 사지 않는다 — 프로 스포츠는 예외", "field": "수능특강 영어독해연습", "page": "04강 Ex.05", "oneline": "소득이 늘면 수요도 늘지만 한 재화를 무한정 사지는 않는다 — 각 단위의 유용성(한계효용)이 점점 줄어 결국 0이 되기 때문이다. 그러나 프로 팀 스포츠는 이 '체감' 가정에 모순된다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에 일반 한계효용 그래프가 가파르게 0으로 떨어지는 감소곡선과 아이스크림 아이콘이 있고, 가운데 co xt x=\"3\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\">demand</text>\n\n    <!-- X축 -->\n    <line x1=\"30\" y1=\"135\" x2=\"225\" y2=\"135\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <polygon points=\"225,135 218,131 218,139\" fill=\"#1a1a1a\"/>\n    <text x=\"190\" y=\"148\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#1a1a1a\">games available</text>\n\n    <!-- 상승 곡선 -->\n    <path d=\"M 30 110 Q 80 85 130 60 Q 175 40 210 25\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"2.2\"/>\n\n    <!-- 끝점 표시 -->\n    <circle cx=\"210\" cy=\"25\" r=\"3.5\" fill=\"#1FA34A\"/>\n    <text x=\"170\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#1FA34A\" font-weight=\"700\">\"want more\"</text>\n\n    <!-- 축구공 아이콘 -->\n    <g transform=\"translate(75, 95)\">\n      <circle cx=\"0\" cy=\"0\" r=\"11\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 오각형 -->\n      <polygon points=\"0,-5 4.5,-1.5 3,4 -3,4 -4.5,-1.5\" fill=\"#1a1a1a\"/>\n      <!-- 외곽 선들 -->\n      <line x1=\"-4.5\" y1=\"-1.5\" x2=\"-11\" y2=\"-3\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n      <line x1=\"4.5\" y1=\"-1.5\" x2=\"11\" y2=\"-3\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n      <line x1=\"-3\" y1=\"4\" x2=\"-7\" y2=\"9\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n      <line x1=\"3\" y1=\"4\" x2=\"7\" y2=\"9\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n      <line x1=\"0\" y1=\"-5\" x2=\"0\" y2=\"-11\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n    </g>\n\n    <!-- 우상단 라벨: T20 / UEFA -->\n    <g transform=\"translate(110, 25)\">\n      <rect x=\"0\" y=\"0\" width=\"60\" height=\"14\" rx=\"2\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n      <text x=\"30\" y=\"10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">T20 cricket</text>\n    </g>\n    <g transform=\"translate(110, 43)\">\n      <rect x=\"0\" y=\"0\" width=\"60\" height=\"14\" rx=\"2\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"0.9\"/>\n      <text x=\"30\" y=\"10\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">UEFA reform</text>\n    </g>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 240)\">\n    <rect x=\"80\" y=\"0\" width=\"440\" height=\"22\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/>\n    <text x=\"300\" y=\"15\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">프로 스포츠 = 한계 효용을 거스르는 반례</text>\n  </g>\n</svg>", "caption": "한계효용은 결국 0으로 — 그러나 프로 스포츠는 예외", "tldr": ["소득이 늘면 수요도 늘지만 한 재화를 무한정 사지는 않는다 — 각 단위의 유용성(한계효용)이 점점 줄어 결국 0이 되기 때문이다. 그러나 프로 팀 스포츠는 이 '체감' 가정에 모순된다.", "한계효용은 결국 0으로 — 그러나 프로 스포츠는 예외"], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [], "vocab": [["income", "소득·수입"], ["quantity demanded", "수요량"], ["demand", "수요·요구·요구하다"], ["double", "두 배가 되다"], ["a particular good or service", "특정 재화나 서비스"], ["only so many", "~의 한계가 있는·~만큼만"], ["tub", "통·욕조"], ["marginal utility", "한계 효용 (각 추가 단위의 효용)"], ["drop to zero", "0으로 떨어지다"], ["contradict", "모순되다·반박하다"], ["assumption", "가정·추정"], ["play out", "전개되다·펼쳐지다"], ["advent", "출현·도래"]], "quiz": [["이 지문의 핵심 구조는?", "한계효용은 결국 0으로 — 그러나 프로 스포츠는 예외"], ["도식이 강조하는 결론은?", "소득이 늘면 수요도 늘지만 한 재화를 무한정 사지는 않는다 — 각 단위의 유용성(한계효용)이 점점 줄어 결국 0이 되기 때문이다. 그러나 프로 팀 스포츠는 이 '체감' 가정에 모순된다."]], "en": "When income rises, so will the quantity demanded. When income falls, so will demand. However, if your income doubles, you would not always buy twice as much of a particular good or service. For example, there are only so many tubs of ice cream you would want to eat, no matter how wealthy you are. This is an example of \"marginal utility.\" Marginal utility is the concept that each unit of a good or service is a little less useful to you than the first. At some point, you will not want it anymore, and the marginal utility drops to zero. We can see that professional team sports contradict this assumption. Fans (consumers) often want more games to watch. We have seen this example play out in recent years in relation to the number of sport matches on live television increasing and through the advents of new competitions or formats of the game (e.g., Twenty20 cricket) or expansions of league reforms to fit in additional fixtures (e.g., UEFA Champions League reforms for 2024).", "ko": "소득이 증가하면, 수요량도 증가할 것이다. 소득이 감소하면, 수요도 감소할 것이다. 그러나 소득이 두 배가 된다고 해서 특정 재화나 서비스를 늘 두 배만큼 사지는 않을 것이다. 예를 들어, 아무리 부유하더라도 먹고 싶어 하는 아이스크림 통수에는 한계가 있다. 이것이 '한계 효용'의 예이다. 한계 효용은 재화나 서비스의 각 단위가 처음 단위보다 조금씩 덜 유용하다는 개념이다. 어느 시점이 되면 더 이상 그것을 원하지 않게 되고, 한계 효용은 0으로 떨어진다. 우리는 프로 팀 스포츠가 이 가정에 모순된다는 것을 알 수 있다. 팬(소비자)들은 흔히 더 많은 경기를 보고 싶어 한다. 최근 몇 년간 이 예가 펼쳐지는 것을 우리는 봐 왔다 — 생방송 스포츠 경기 수의 증가, 새로운 대회·경기 형식(예: Twenty20 크리켓)의 출현, 추가 경기를 위한 리그 개편(예: 2024 UEFA 챔피언스 리그 개편)을 통해.", "read": [{"en": "When income rises, so will the quantity demanded.", "ko": "소득이 증가하면, 수요량도 증가할 것이다."}, {"en": "When income falls, so will demand.", "ko": "소득이 감소하면, 수요도 감소할 것이다."}, {"en": "However, if your income doubles, you would not always buy twice as much of a particular good or service.", "ko": "그러나 소득이 두 배가 된다고 해서 특정 재화나 서비스를 늘 두 배만큼 사지는 않을 것이다."}, {"en": "For example, there are only so many tubs of ice cream you would want to eat, no matter how wealthy you are.", "ko": "예를 들어, 아무리 부유하더라도 먹고 싶어 하는 아이스크림 통수에는 한계가 있다."}, {"en": "This is an example of \"marginal utility.\"", "ko": "이것이 '한계 효용'의 예이다."}, {"en": "Marginal utility is the concept that each unit of a good or service is a little less useful to you than the first.", "ko": "한계 효용은 재화나 서비스의 각 단위가 처음 단위보다 조금씩 덜 유용하다는 개념이다."}, {"en": "At some point, you will not want it anymore, and the marginal utility drops to zero.", "ko": "어느 시점이 되면 더 이상 그것을 원하지 않게 되고, 한계 효용은 0으로 떨어진다."}, {"en": "We can see that professional team sports contradict this assumption.", "ko": "우리는 프로 팀 스포츠가 이 가정에 모순된다는 것을 알 수 있다."}, {"en": "Fans (consumers) often want more games to watch.", "ko": "팬(소비자)들은 흔히 더 많은 경기를 보고 싶어 한다."}, {"en": "We have seen this example play out in recent years in relation to the number of sport matches on live television increasing and through the advents of new competitions or formats of the game (e.g., Twenty20 cricket) or expansions of league reforms to fit in additional fixtures (e.g., UEFA Champions League reforms for 2024).", "ko": "최근 몇 년간 이 예가 펼쳐지는 것을 우리는 봐 왔다 — 생방송 스포츠 경기 수의 증가, 새로운 대회·경기 형식(예: Twenty20 크리켓)의 출현, 추가 경기를 위한 리그 개편(예: 2024 UEFA 챔피언스 리그 개편)을 통해."}]}, {"no": "6", "title": "Resisting Fast Fashion: Slow Fashion", "ktitle": "공장에서 폐기로 단절된 패스트패션에 맞서, 짓고 고쳐 입는 슬로우 패션으로", "field": "수능특강 영어독해연습", "page": "04강 Ex.06", "oneline": "패스트패션은 공장에서 가게, 폐기로 이어지며 소비자를 생산과 분리시킨다 — 이에 맞선 슬로우 패션은 직접 바느질하고 수선하며 생산과 소비를 다시 잇는다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 산업화 후 패스트 패션은 공장에서 가게로 그리고 폐기로 이어지며 소비자와 분리된 모습이고, 오른쪽 슬로우 패션은 사람이 직접 바느질하고 수선하며 생산과 소비가 양방향으로 재연결된 모습으로, 하단 가운데 조용한 행동주의 라벨이 있는 그림\">\n\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">생산-소비의 끊긴 연결 ↔ 회복된 연결</text>\n\n  <!-- 좌측: 산업화 후 (분리) -->\n  <g transform=\"translate(20, 30)\">\n    <rect x=\"0\" y=\"0\" width=\"265\" height=\"180\" fill=\"#fdf2f4\" fill-opacity=\"0.25\" stroke=\"#c8102e\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n    <text x=\"132\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">산업화 후 — fast fashion</text>\n\n    <!-- 공장 -->\n    <g transform=\"translate(35, 70)\">\n      <!-- 공장 본체 -->\n      <rect x=\"0\" y=\"0\" width=\"38\" height=\"26\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 굴뚝 -->\n      <rect x=\"6\" y=\"-12\" width=

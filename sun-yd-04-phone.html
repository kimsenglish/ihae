font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#999\">consumer · 멀리</text>\n    </g>\n\n    <!-- 분리 표시: 두꺼운 점선 벽 -->\n    <line x1=\"100\" y1=\"120\" x2=\"100\" y2=\"170\" stroke=\"#c8102e\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\" opacity=\"0.65\"/>\n\n    <!-- 결론 -->\n    <text x=\"132\" y=\"170\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">disconnected · 생산↔소비 끊김</text>\n  </g>\n\n  <!-- 가운데 화살표 -->\n  <g transform=\"translate(290, 110)\">\n    <line x1=\"0\" y1=\"0\" x2=\"20\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n    <polygon points=\"20,0 13,-4 13,4\" fill=\"#1FA34A\"/>\n    <text x=\"10\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">resist</text>\n    <text x=\"10\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">저항</text>\n  </g>\n\n  <!-- 우측: 슬로우 패션 (재연결) -->\n  <g transform=\"translate(315, 30)\">\n    <rect x=\"0\" y=\"0\" width=\"265\" height=\"180\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"132\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">슬로우 패션 — return to connection</text>\n\n    <!-- 사람 (제작자 + 소비자 = 같은 사람) -->\n    <g transform=\"translate(70, 90)\">\n      <!-- 머리 -->\n      <circle cx=\"0\" cy=\"-22\" r=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-23\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"-23\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <path d=\"M -4 -17 Q 0 -14 4 -17\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <!-- 몸 (앉아서 작업 자세) -->\n      <line x1=\"0\" y1=\"-9\" x2=\"0\" y2=\"20\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <!-- 팔 — 바느질하는 자세 -->\n      <line x1=\"0\" y1=\"0\" x2=\"-15\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"15\" y2=\"10\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 다리 -->\n      <line x1=\"0\" y1=\"20\" x2=\"-9\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"20\" x2=\"9\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">maker · wearer · 한 사람</text>\n    </g>\n\n    <!-- 옷·바늘·실 -->\n    <g transform=\"translate(98, 95)\">\n      <!-- 옷감 -->\n      <rect x=\"0\" y=\"0\" width=\"30\" height=\"22\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <!-- 패치 (수선) -->\n      <rect x=\"3\" y=\"3\" width=\"8\" height=\"6\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"0.9\" stroke-dasharray=\"1 1\"/>\n      <!-- 바늘 -->\n      <line x1=\"-3\" y1=\"-3\" x2=\"22\" y2=\"14\" stroke=\"#1a1a1a\" stroke-width=\"0.9\"/>\n      <circle cx=\"-3\" cy=\"-3\" r=\"1.2\" fill=\"#1a1a1a\"/>\n      <!-- 실 -->\n      <path d=\"M -3 -3 Q -8 0 -10 4 Q -12 8 -8 10\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"0.8\"/>\n    </g>\n\n    <!-- 양방향 화살표: 생산 ↔ 소비 -->\n    <g transform=\"translate(170, 105)\">\n      <line x1=\"0\" y1=\"0\" x2=\"60\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <polygon points=\"0,0 7,-4 7,4\" fill=\"#1FA34A\"/>\n      <polygon points=\"60,0 53,-4 53,4\" fill=\"#1FA34A\"/>\n      <text x=\"30\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">production ↔ consumption</text>\n      <text x=\"30\" y=\"15\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">연결 회복</text>\n    </g>\n\n    <!-- 세 행동 강령 -->\n    <g transform=\"translate(0, 168)\">\n      <text x=\"132\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">fewer · better · longer / local / critical thinking</text>\n    </g>\n  </g>\n\n  <!-- 하단 라벨: quiet activism -->\n  <g transform=\"translate(0, 240)\">\n    <rect x=\"170\" y=\"0\" width=\"260\" height=\"22\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <text x=\"300\" y=\"15\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">\"quiet activism\" — 조용한 행동주의 (Fiona Hackney)</text>\n  </g>\n</svg>", "caption": "단절된 패스트패션 vs 다시 잇는 슬로우 패션", "tldr": ["패스트패션은 공장에서 가게, 폐기로 이어지며 소비자를 생산과 분리시킨다 — 이에 맞선 슬로우 패션은 직접 바느질하고 수선하며 생산과 소비를 다시 잇는다.", "단절된 패스트패션 vs 다시 잇는 슬로우 패션"], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [], "vocab": [["resist", "저항하다·거부하다"], ["fast fashion", "패스트 패션 (저가·신속 생산 의류)"], ["informed", "정보에 기반한·잘 아는"], ["ethical", "윤리적인"], ["locally", "지역적으로·현지에서"], ["think critically about", "~에 대해 비판적으로 사고하다"], ["distribution", "유통·분배"], ["quiet activism", "조용한 행동주의·일상적 행동"], ["emergence", "출현·등장"], ["historically conscious", "역사를 의식하는"], ["intimate connection", "긴밀한 연결·밀접한 관계"], ["industrialization", "산업화"], ["garment", "의류·의복 (한 벌)"]], "quiz": [["이 지문의 핵심 구조는?", "단절된 패스트패션 vs 다시 잇는 슬로우 패션"], ["도식이 강조하는 결론은?", "패스트패션은 공장에서 가게, 폐기로 이어지며 소비자를 생산과 분리시킨다 — 이에 맞선 슬로우 패션은 직접 바느질하고 수선하며 생산과 소비를 다시 잇는다."]], "en": "Among the attempts to resist fast fashion are consumer movements to make more informed, ethical decisions as they purchase, use, and repair their clothing. The \"slow fashion\" movement, for example, encourages buying fewer clothes of higher quality and wearing them longer, purchasing clothes produced (or at least sold) locally, and thinking critically about the labor and environmental conditions surrounding their production and distribution. Some consumers have become more active in producing (sewing or knitting) and repairing their own clothing. The design historian Fiona Hackney refers to the \"quiet activism\" of everyday making. She argues for \"the emergence of a new, historically conscious, socially engaged amateur practice.\" This practice represents a return to the intimate connection of production (making) with consumption (use, wear) before the industrialization of fibers, textiles, and apparel. Industrialization changed the production-consumption dynamic in at least two ways: Factory-made, store-bought clothes were more detached from consumer-made ones, and they also tended to be less expensive. Prior to industrialization, only wealthy people could afford a closet of many garments. Among working-class people, formal clothes were often prized possessions that were included in wills.", "ko": "패스트 패션에 저항하려는 시도 가운데에는 옷을 구매·사용·수선할 때 더 정보에 기반한 윤리적 결정을 내리려는 소비자 운동이 있다. 예를 들어 '슬로우 패션' 운동은 더 적은 수의 좋은 품질 옷을 오래 입을 것, 지역에서 생산(또는 적어도 판매)된 옷을 살 것, 그리고 옷의 생산·유통을 둘러싼 노동·환경 조건에 대해 비판적으로 사고할 것을 장려한다. 일부 소비자들은 자신의 옷을 만들고(바느질하거나 뜨개질하고) 수선하는 데 더 적극적이 되었다. 디자인 사학자 Fiona Hackney는 이를 일상적 만들기의 '조용한 행동주의'라고 일컫는다. 그녀는 '새로운, 역사적으로 의식 있고, 사회적으로 참여하는 아마추어 실천의 출현'을 주장한다. 이 실천은 섬유·직물·의류의 산업화 이전, 생산(만들기)과 소비(사용·착용)가 긴밀히 연결돼 있던 시기로의 회귀를 의미한다. 산업화는 생산-소비의 역학을 적어도 두 가지로 바꿨다 — 공장에서 만들고 가게에서 산 옷은 소비자가 직접 만든 옷과 분리되었고, 더 저렴해지는 경향이 있었다. 산업화 이전에는, 부유한 사람들만이 많은 옷이 들어찬 옷장을 감당할 수 있었다. 노동계급 사람들 사이에서, 정장 옷은 흔히 유언장에 포함되는 소중한 소유물이었다.", "read": [{"en": "Among the attempts to resist fast fashion are consumer movements to make more informed, ethical decisions as they purchase, use, and repair their clothing.", "ko": "패스트 패션에 저항하려는 시도 가운데에는 옷을 구매·사용·수선할 때 더 정보에 기반한 윤리적 결정을 내리려는 소비자 운동이 있다."}, {"en": "The \"slow fashion\" movement, for example, encourages buying fewer clothes of higher quality and wearing them longer, purchasing clothes produced (or at least sold) locally, and thinking critically about the labor and environmental conditions surrounding their production and distribution.", "ko": "예를 들어 '슬로우 패션' 운동은 더 적은 수의 좋은 품질 옷을 오래 입을 것, 지역에서 생산(또는 적어도 판매)된 옷을 살 것, 그리고 옷의 생산·유통을 둘러싼 노동·환경 조건에 대해 비판적으로 사고할 것을 장려한다."}, {"en": "Some consumers have become more active in producing (sewing or knitting) and repairing their own clothing.", "ko": "일부 소비자들은 자신의 옷을 만들고(바느질하거나 뜨개질하고) 수선하는 데 더 적극적이 되었다."}, {"en": "The design historian Fiona Hackney refers to the \"quiet activism\" of everyday making.", "ko": "디자인 사학자 Fiona Hackney는 이를 일상적 만들기의 '조용한 행동주의'라고 일컫는다."}, {"en": "She argues for \"the emergence of a new, historically conscious, socially engaged amateur practice.\"", "ko": "그녀는 '새로운, 역사적으로 의식 있고, 사회적으로 참여하는 아마추어 실천의 출현'을 주장한다."}, {"en": "This practice represents a return to the intimate connection of production (making) with consumption (use, wear) before the industrialization of fibers, textiles, and apparel.", "ko": "이 실천은 섬유·직물·의류의 산업화 이전, 생산(만들기)과 소비(사용·착용)가 긴밀히 연결돼 있던 시기로의 회귀를 의미한다."}, {"en": "Industrialization changed the production-consumption dynamic in at least two ways: Factory-made, store-bought clothes were more detached from consumer-made ones, and they also tended to be less expensive.", "ko": "산업화는 생산-소비의 역학을 적어도 두 가지로 바꿨다 — 공장에서 만들고 가게에서 산 옷은 소비자가 직접 만든 옷과 분리되었고, 더 저렴해지는 경향이 있었다."}, {"en": "Prior to industrialization, only wealthy people could afford a closet of many garments.", "ko": "산업화 이전에는, 부유한 사람들만이 많은 옷이 들어찬 옷장을 감당할 수 있었다."}, {"en": "Among working-class people, formal clothes were often prized possessions that were included in wills.", "ko": "노동계급 사람들 사이에서, 정장 옷은 흔히 유언장에 포함되는 소중한 소유물이었다."}]}, {"no": "7", "title": "Grice: Communicative vs Natural Meaning", "ktitle": "의도가 전달되는 '의사소통적 의미' vs 발신자 없이도 성립하는 '자연적 의미'", "field": "수능특강 영어독해연습", "page": "04강 Ex.07", "oneline": "그라이스는 두 의미를 구분한다 — 발신자가 의도를 담아 전하는 의사소통적 의미와, '다이너마이트' 표시처럼 누가 의도하지 않아도 위험을 인지시키는 자연적 의미.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에 발신자에서 말풍선을 거쳐 수신자에게 의도가 전달되는 의사소통적 의미가 있고 오른쪽에 다이너마이트 상자 자체가 발신자 없이도 발견자에게 위험을 인지시키는 자연적 의미가 있는 두 의미 대조 그림\">\n\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">Grice의 두 의미 — 의도 ≠ 의미</text>\n\n  <!-- 좌측: 의사소통적 의미 -->\n  <g transform=\"translate(20, 30)\">\n    <rect x=\"0\" y=\"0\" width=\"265\" height=\"200\" fill=\"#f0faf3\" fill-opacity=\"0.25\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"132\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">(a) communicative · 의사소통적</text>\n\n    <!-- 발신자 -->\n    <g transform=\"translate(40, 105)\">\n      <circle cx=\"0\" cy=\"-22\" r=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-23\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"-23\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <path d=\"M -4 -17 Q 0 -14 4 -17\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"-9\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"-13\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"13\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"-8\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"8\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"58\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">sender</text>\n    </g>\n\n    <!-- 말풍선 -->\n    <g transform=\"translate(105, 70)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"34\" ry=\"18\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n      <text x=\"0\" y=\"3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">\"danger!\"</text>\n      <!-- 풍선 꼬리 -->\n      <path d=\"M -22 12 L -32 24 L -16 16 Z\" fill=\"#ffffff\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    </g>\n\n    <!-- 의도 화살표 (발신자 → 수신자) -->\n    <g transform=\"translate(0, 110)\">\n      <line x1=\"68\" y1=\"0\" x2=\"190\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.6\"/>\n      <polygon points=\"190,0 182,-4 182,4\" fill=\"#1FA34A\"/>\n      <text x=\"129\" y=\"-7\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">intention</text>\n      <text x=\"129\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">의도 ✓</text>\n    </g>\n\n    <!-- 수신자 -->\n    <g transform=\"translate(220, 105)\">\n      <circle cx=\"0\" cy=\"-22\" r=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-23\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"-23\" r=\"1.3\" fill=\"#1a1a1a\"/>\n      <path d=\"M -4 -17 Q 0 -14 4 -17\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"-9\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"-13\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"13\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"-8\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"8\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"58\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">receiver</text>\n    </g>\n\n    <text x=\"132\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">intention REQUIRED</text>\n  </g>\n\n  <!-- 가운데 vs -->\n  <g transform=\"translate(290, 130)\">\n    <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n  </g>\n\n  <!-- 우측: 자연적 의미 -->\n  <g transform=\"translate(315, 30)\">\n    <rect x=\"0\" y=\"0\" width=\"265\" height=\"200\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <text x=\"132\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">(b) natural · 자연적 ('사물' 자체)</text>\n\n    <!-- 발신자 자리 — X 표시 -->\n    <g transform=\"translate(40, 105)\">\n      <!-- 큰 X -->\n      <line x1=\"-16\" y1=\"-16\" x2=\"16\" y2=\"16\" stroke=\"#c8102e\" stroke-width=\"2.5\"/>\n      <line x1=\"16\" y1=\"-16\" x2=\"-16\" y2=\"16\" stroke=\"#c8102e\" stroke-width=\"2.5\"/>\n      <text x=\"0\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">no sender</text>\n      <text x=\"0\" y=\"52\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\">발신자 X</text>\n    </g>\n\n    <!-- 다이너마이트 상자 (가운데) -->\n    <g transform=\"translate(132, 85)\">\n      <!-- 상자 -->\n      <rect x=\"-30\" y=\"-20\" width=\"60\" height=\"40\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.6\"/>\n      <!-- 상자 그림자/3D 효과 (단순) -->\n      <line x1=\"-30\" y1=\"-20\" x2=\"-26\" y2=\"-24\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"30\" y1=\"-20\" x2=\"34\" y2=\"-24\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"-26\" y1=\"-24\" x2=\"34\" y2=\"-24\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <!-- TNT 라벨 -->\n      <rect x=\"-22\" y=\"-12\" width=\"44\" height=\"14\" fill=\"#c8102e\"/>\n      <text x=\"0\" y=\"-2\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\">TNT</text>\n      <!-- 도화선 -->\n      <path d=\"M -8 -20 Q -10 -28 -6 -32\" fill=\"none\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- 도화선 끝 점 -->\n      <circle cx=\"-6\" cy=\"-32\" r=\"1.3\" fill=\"#c8102e\"/>\n      <text x=\"0\" y=\"38\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">'dynamite'</text>\n    </g>\n\n    <!-- 다이너마이트 → 수신자 화살표 -->\n    <g transform=\"translate(0, 105)\">\n      <line x1=\"162\" y1=\"0\" x2=\"200\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <polygon points=\"200,0 192,-4 192,4\" fill=\"#c8102e\"/>\n    </g>\n\n    <!-- 수신자 (놀란) -->\n    <g transform=\"translate(228, 105)\">\n      <circle cx=\"0\" cy=\"-22\" r=\"13\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <circle cx=\"-4\" cy=\"-24\" r=\"1.5\" fill=\"#1a1a1a\"/>\n      <circle cx=\"4\" cy=\"-24\" r=\"1.5\" fill=\"#1a1a1a\"/>\n      <!-- 놀란 입(O) -->\n      <ellipse cx=\"0\" cy=\"-17\" rx=\"2\" ry=\"2.5\" fill=\"#1a1a1a\"/>\n      <line x1=\"0\" y1=\"-9\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <!-- 팔 (놀라 위로) -->\n      <line x1=\"0\" y1=\"-2\" x2=\"-12\" y2=\"-12\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"-2\" x2=\"12\" y2=\"-12\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"-8\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"8\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <!-- ! 마크 -->\n      <text x=\"22\" y=\"-30\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"20\" font-weight=\"700\" fill=\"#c8102e\">!</text>\n    </g>\n\n    <text x=\"132\" y=\"190\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">intention NOT required</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 240)\">\n    <rect x=\"80\" y=\"0\" width=\"440\" height=\"22\" rx=\"3\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/>\n    <text x=\"300\" y=\"15\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">'dynamite' = danger · 누구의 의도와도 무관하게</text>\n  </g>\n</svg>", "caption": "의도된 의사소통적 의미 vs 의도 없는 자연적 의미", "tldr": ["그라이스는 두 의미를 구분한다 — 발신자가 의도를 담아 전하는 의사소통적 의미와, '다이너마이트' 표시처럼 누가 의도하지 않아도 위험을 인지시키는 자연적 의미.", "의도된 의사소통적 의미 vs 의도 없는 자연적 의미"], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [], "vocab": [["philosopher of language", "언어 철학자"], ["propose", "제안하다·주장하다"], ["communicative", "의사소통적인"], ["refer to A as B", "A를 B로 부르다·일컫다"], ["characterized by", "~을 특징으로 하는"], ["regardless of whether", "~인지 아닌지에 상관없이"], ["communicative intention", "의사소통적 의도"], ["on one's part", "~의 측에서·~ 쪽에서"], ["frighten", "두렵게 하다·놀라게 하다"], ["intentionally", "의도적으로·고의로"], ["with the intention of", "~할 의도로"], ["feel in danger", "위험에 처해 있다고 느끼다"], ["whether or not", "~인지 아닌지 (와 무관하게)"]], "quiz": [["이 지문의 핵심 구조는?", "의도된 의사소통적 의미 vs 의도 없는 자연적 의미"], ["도식이 강조하는 결론은?", "그라이스는 두 의미를 구분한다 — 발신자가 의도를 담아 전하는 의사소통적 의미와, '다이너마이트' 표시처럼 누가 의도하지 않아도 위험을 인지시키는 자연적 의미."]], "en": "Grice, a British philosopher of language, proposed that, in addition to communicative meaning, there is another kind of meaning, which he referred to as natural meaning, characterized by 'things' that have meaning regardless of whether there is any communicative intention on anyone's part. For example, I have learned that dynamite means danger. Thus, if I find a box of dynamite in my garage, dynamite is/means danger to me and I am going to be frightened. To recognize the danger, it is not necessary for me to recognize that someone intentionally placed the dynamite there with the intention of getting me to recognize that dynamite is dangerous; that is, it is not necessary that I recognize any communicative intention behind the box being there to recognize danger. And, further, even if the dynamite had been put there with the intention of getting me to recognize I was in danger, it would not be necessary for me to recognize that in order to feel in danger. Simply put, the word 'dynamite' on a box means danger whether or not anyone intended to have me recognize that meaning.", "ko": "영국 언어 철학자 Grice는, 의사소통적 의미 외에 — 누구의 측에서도 의사소통적 의도가 있든 없든 의미를 갖는 '사물'을 특징으로 하는 — 다른 종류의 의미가 있다고 제안했고, 그는 이를 '자연적 의미'라고 불렀다. 예를 들어, 나는 다이너마이트가 위험을 의미한다는 것을 배웠다. 따라서 차고에서 다이너마이트 한 상자를 발견하면, 다이너마이트는 나에게 위험이거나 위험을 의미하며 나는 겁을 먹을 것이다. 위험을 인지하기 위해, 누군가가 내가 위험을 인지하도록 하려는 의도로 다이너마이트를 거기 둔 것이라고 인지할 필요는 없다 — 즉, 위험을 인지하기 위해 상자 존재 뒤에 어떤 의사소통적 의도가 있다는 것을 인지할 필요는 없다. 게다가 설령 다이너마이트가 내가 위험을 인지하도록 하려는 의도로 거기 놓였다 하더라도, 위험을 느끼기 위해 내가 그 의도를 인지할 필요는 없을 것이다. 간단히 말해, 상자에 적힌 '다이너마이트'라는 단어는 누군가가 내가 그 의미를 인지하도록 의도했든 아니든 위험을 의미한다.", "read": [{"en": "Grice, a British philosopher of language, proposed that, in addition to communicative meaning, there is another kind of meaning, which he referred to as natural meaning, characterized by 'things' that have meaning regardless of whether there is any communicative intention on anyone's part.", "ko": "영국 언어 철학자 Grice는, 의사소통적 의미 외에 — 누구의 측에서도 의사소통적 의도가 있든 없든 의미를 갖는 '사물'을 특징으로 하는 — 다른 종류의 의미가 있다고 제안했고, 그는 이를 '자연적 의미'라고 불렀다."}, {"en": "For example, I have learned that dynamite means danger.", "ko": "예를 들어, 나는 다이너마이트가 위험을 의미한다는 것을 배웠다."}, {"en": "Thus, if I find a box of dynamite in my garage, dynamite is/means danger to me and I am going to be frightened.", "ko": "따라서 차고에서 다이너마이트 한 상자를 발견하면, 다이너마이트는 나에게 위험이거나 위험을 의미하며 나는 겁을 먹을 것이다."}, {"en": "To recognize the danger, it is not necessary for me to recognize that someone intentionally placed the dynamite there with the intention of getting me to recognize that dynamite is dangerous; that is, it is not necessary that I recognize any communicative intention behind the box being there to recognize danger.", "ko": "위험을 인지하기 위해, 누군가가 내가 위험을 인지하도록 하려는 의도로 다이너마이트를 거기 둔 것이라고 인지할 필요는 없다 — 즉, 위험을 인지하기 위해 상자 존재 뒤에 어떤 의사소통적 의도가 있다는 것을 인지할 필요는 없다."}, {"en": "And, further, even if the dynamite had been put there with the intention of getting me to recognize I was in danger, it would not be necessary for me to recognize that in order to feel in danger.", "ko": "게다가 설령 다이너마이트가 내가 위험을 인지하도록 하려는 의도로 거기 놓였다 하더라도, 위험을 느끼기 위해 내가 그 의도를 인지할 필요는 없을 것이다."}, {"en": "Simply put, the word 'dynamite' on a box means danger whether or not anyone intended to have me recognize that meaning.", "ko": "간단히 말해, 상자에 적힌 '다이너마이트'라는 단어는 누군가가 내가 그 의미를 인지하도록 의도했든 아니든 위험을 의미한다."}]}, {"no": "8", "title": "Scientific Progress: Contemplative to Practical", "ktitle": "과학의 이상이 관조에서 실용으로 — 복지를 늘렸지만 '고통의 바다'라는 그늘도", "field": "수능특강 영어독해연습", "page": "04강 Ex.08", "oneline": "과학 진보의 이상은 관조적인 것에서 자연의 위협에 대응하는 실용적인 것으로 바뀌었다 — 그러나 그 결과가 다 좋은 것은 아니어서, 복지 증진과 함께 고령층의 '고통의 바다'라는 그늘도 따른다.", "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"상단에 과학 진보가 관조적 이상에서 실용적 이상으로 대체되며 자연 위협에 대응하는 흐름과 가운데 But not all 박스 이후 아래쪽으로 복지 증진과 고통의 바다 두 갈래로 분기되는 그림\">\n\n  <!-- 상단: 진보의 정의 -->\n  <g transform=\"translate(0, 10)\">\n    <text x=\"300\" y=\"12\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">과학 진보 = 이해 + 자연 통제·방향 전환</text>\n\n    <!-- 좌측: 관조적 이상 -->\n    <g transform=\"translate(35, 25)\">\n      <rect x=\"0\" y=\"0\" width=\"115\" height=\"38\" rx=\"3\" fill=\"#f6f6f6\" stroke=\"#999\" stroke-width=\"1.1\" stroke-dasharray=\"3 2\"/>\n      <text x=\"57\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\" font-weight=\"700\">contemplative</text>\n      <text x=\"57\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5e5e5e\">관조적 이상 (그 자체)</text>\n    </g>\n\n    <!-- 가운데 Wieland 화살표 (대체) -->\n    <g transform=\"translate(155, 47)\">\n      <line x1=\"0\" y1=\"0\" x2=\"40\" y2=\"0\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"/>\n      <polygon points=\"40,0 33,-4 33,4\" fill=\"#1a1a1a\"/>\n      <text x=\"20\" y=\"-6\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\" font-weight=\"700\">replaced</text>\n      <text x=\"20\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8\" text-anchor=\"middle\" fill=\"#5e5e5e\">(Wieland)</text>\n    </g>\n\n    <!-- 우측: 실용적 이상 -->\n    <g transform=\"translate(200, 25)\">\n      <rect x=\"0\" y=\"0\" width=\"115\" height=\"38\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.3\"/>\n      <text x=\"57\" y=\"15\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">practical</text>\n      <text x=\"57\" y=\"28\" font-family=\"Noto Serif KR\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\">실용적 이상 (인류 위한)</text>\n    </g>\n\n    <!-- 자연의 위협 -->\n    <g transform=\"translate(330, 25)\">\n      <rect x=\"0\" y=\"0\" width=\"235\" height=\"38\" rx=\"3\" fill=\"#ffffff\" stroke=\"#c8102e\" stroke-width=\"1.1\" stroke-dasharray=\"3 2\"/>\n      <text x=\"117\" y=\"13\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">nature's threats — 자연의 위협</text>\n      <text x=\"117\" y=\"27\" font-family=\"Noto Serif KR\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">굶주림 · 유아기·이른 성인기 사망 · 재해</text>\n    </g>\n  </g>\n\n  <!-- 가운데 BUT 박스 -->\n  <g transform=\"translate(0, 90)\">\n    <rect x=\"150\" y=\"0\" width=\"300\" height=\"32\" rx=\"4\" fill=\"#fdf2f4\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n    <text x=\"300\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">BUT not all control adds to human welfare</text>\n    <text x=\"300\" y=\"27\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\">모든 통제·방향 전환이 복지에 보태는 것은 아니다</text>\n  </g>\n\n  <!-- 분기 화살표 -->\n  <g transform=\"translate(150, 132)\">\n    <!-- 좌하 분기 (긍정·통제 성공) -->\n    <line x1=\"150\" y1=\"0\" x2=\"80\" y2=\"20\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n    <polygon points=\"80,20 88,17 86,25\" fill=\"#1FA34A\"/>\n    <!-- 우하 분기 (그늘) -->\n    <line x1=\"150\" y1=\"0\" x2=\"220\" y2=\"20\" stroke=\"#c8102e\" stroke-width=\"1.8\"/>\n    <polygon points=\"220,20 213,16 215,24\" fill=\"#c8102e\"/>\n  </g>\n\n  <!-- 하단 좌측: 복지 증진 (긍정) -->\n  <g transform=\"translate(35, 165)\">\n    <rect x=\"0\" y=\"0\" width=\"225\" height=\"95\" rx=\"4\" fill=\"#f0faf3\" fill-opacity=\"0.3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"112\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">통제 ✓ 복지 ↑</text>\n\n    <!-- ✓ 큰 원 -->\n    <g transform=\"translate(50, 55)\">\n      <circle cx=\"0\" cy=\"0\" r=\"20\" fill=\"#1FA34A\"/>\n      <path d=\"M -9 0 L -2 8 L 11 -7\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"3\"/>\n    </g>\n\n    <!-- 라벨들 -->\n    <g transform=\"translate(85, 40)\">\n      <text x=\"0\" y=\"0\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" fill=\"#1FA34A\" font-weight=\"700\">famine ↓</text>\n      <text x=\"0\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" fill=\"#1FA34A\" font-weight=\"700\">disasters ↓</text>\n      <text x=\"0\" y=\"28\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" fill=\"#1FA34A\" font-weight=\"700\">early death ↓</text>\n    </g>\n\n    <text x=\"112\" y=\"85\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\">\"adds to welfare\"</text>\n  </g>\n\n  <!-- 하단 우측: 고통의 바다 -->\n  <g transform=\"translate(340, 165)\">\n    <rect x=\"0\" y=\"0\" width=\"225\" height=\"95\" rx=\"4\" fill=\"#fdf2f4\" fill-opacity=\"0.4\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <text x=\"112\" y=\"16\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">의료 기술 — 수명 ↑ but 고통 기간 ↑</text>\n\n    <!-- 침상 누운 사람 -->\n    <g transform=\"translate(50, 60)\">\n      <!-- 침대 -->\n      <rect x=\"-25\" y=\"0\" width=\"50\" height=\"6\" fill=\"#999\"/>\n      <rect x=\"-28\" y=\"6\" width=\"3\" height=\"10\" fill=\"#999\"/>\n      <rect x=\"25\" y=\"6\" width=\"3\" height=\"10\" fill=\"#999\"/>\n      <!-- 머리 -->\n      <circle cx=\"-18\" cy=\"-5\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 이불 (몸 덮음) -->\n      <path d=\"M -13 0 L 22 0 L 22 -4 L -13 -4 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <!-- 만성 표시 (회색 ZZZ) -->\n      <text x=\"-22\" y=\"-12\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" fill=\"#999\" font-weight=\"700\">···</text>\n    </g>\n\n    <!-- 고통의 바다 — 파도 -->\n    <g transform=\"translate(165, 55)\">\n      <!-- 파도 3겹 -->\n      <path d=\"M -28 12 Q -21 4 -14 12 Q -7 20 0 12 Q 7 4 14 12 Q 21 20 28 12\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.5\"/>\n      <path d=\"M -28 6 Q -21 -2 -14 6 Q -7 14 0 6 Q 7 -2 14 6 Q 21 14 28 6\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.3\" opacity=\"0.7\"/>\n      <path d=\"M -28 0 Q -21 -8 -14 0 Q -7 8 0 0 Q 7 -8 14 0 Q 21 8 28 0\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.1\" opacity=\"0.5\"/>\n    </g>\n\n    <text x=\"112\" y=\"85\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">\"sea of suffering\" — The Lancet</text>\n  </g>\n</svg>", "caption": "관조 → 실용으로 바뀐 과학 — 복지와 고통의 두 갈래", "tldr": ["과학 진보의 이상은 관조적인 것에서 자연의 위협에 대응하는 실용적인 것으로 바뀌었다 — 그러나 그 결과가 다 좋은 것은 아니어서, 복지 증진과 함께 고령층의 '고통의 바다'라는 그늘도 따른다.", "관조 → 실용으로 바뀐 과학 — 복지와 고통의 두 갈래"], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [], "vocab": [["measure", "측정하다·평가하다"], ["control over", "~에 대한 통제"], ["redirection", "방향 전환·재조정"], ["contemplative", "관조적·명상적인"], ["for their own sake", "그 자체를 위한·그 자체로"], ["replace", "대체하다"], ["in the service of", "~을 위해·~에 봉사하여"], ["present a threat to", "~에 위협을 가하다"], ["infancy", "유아기"], ["lengthen", "늘이다·길게 하다"], ["chronic disease", "만성 질환"], ["condemn A to B", "A를 B에 처하게 하다·A에게 B를 강제하다"], ["illustrious", "저명한·유명한"]], "quiz": [["이 지문의 핵심 구조는?", "관조 → 실용으로 바뀐 과학 — 복지와 고통의 두 갈래"], ["도식이 강조하는 결론은?", "과학 진보의 이상은 관조적인 것에서 자연의 위협에 대응하는 실용적인 것으로 바뀌었다 — 그러나 그 결과가 다 좋은 것은 아니어서, 복지 증진과 함께 고령층의 '고통의 바다'라는 그늘도 따른다."]], "en": "Scientific progress is measured not only by an increase in understanding but by an increase in control over nature and redirection of nature's course. \"The contemplative ideal of scientific investigations for their own sake has been replaced in modern times,\" Wieland comments, \"by the practical ideal of scientific research in the service of humanity.\" The natural course of things once presented and still presents threats to human welfare: people went and still go hungry, die in infancy and early adulthood, and face natural disasters. But not all control and redirection add to human welfare. Medical technology, based on science, has lengthened the number of years human beings suffer from chronic diseases, condemning them to lonely, bedridden existences. End-of-lite treatments, which prove medical innovation and competence, can sustain life, but not living. The illustrious medical journal The Lancet reports frequently on the \"sea of suffering\" in aging populations.", "ko": "과학적 진보는 이해의 증가뿐만 아니라 자연에 대한 통제와 자연 흐름의 방향 전환의 증가에 의해서도 측정된다. Wieland는 \"'그 자체를 위한 과학적 탐구의 관조적 이상'은 현대에 와서 '인류를 위한 과학 연구의 실용적 이상'으로 대체되었다\"고 논평한다. 만물의 자연적 흐름은 한때 인간 복지에 위협을 가했고 지금도 가하고 있다 — 사람들은 굶주렸고 지금도 굶주리며, 유아기와 이른 성인기에 죽고, 자연재해에 직면한다. 그러나 모든 통제와 방향 전환이 인간 복지에 보태는 것은 아니다. 과학에 기반한 의료 기술은 인간이 만성 질환에 시달리는 햇수를 늘렸고, 그 결과 그들을 외로운, 침대에 누운 존재로 처하게 했다. 연명 치료는 의학적 혁신과 역량을 입증하지만, 생명은 유지하나 '살아 있음'은 유지하지 못한다. 저명한 의학 저널 The Lancet은 고령 인구의 '고통의 바다'에 대해 자주 보도한다.", "read": [{"en": "Scientific progress is measured not only by an increase in understanding but by an increase in control over nature and redirection of nature's course.", "ko": "과학적 진보는 이해의 증가뿐만 아니라 자연에 대한 통제와 자연 흐름의 방향 전환의 증가에 의해서도 측정된다."}, {"en": "\"The contemplative ideal of scientific investigations for their own sake has been replaced in modern times,\" Wieland comments, \"by the practical ideal of scientific research in the service of humanity.\"", "ko": "Wieland는 \"'그 자체를 위한 과학적 탐구의 관조적 이상'은 현대에 와서 '인류를 위한 과학 연구의 실용적 이상'으로 대체되었다\"고 논평한다."}, {"en": "The natural course of things once presented and still presents threats to human welfare: people went and still go hungry, die in infancy and early adulthood, and face natural disasters.", "ko": "만물의 자연적 흐름은 한때 인간 복지에 위협을 가했고 지금도 가하고 있다 — 사람들은 굶주렸고 지금도 굶주리며, 유아기와 이른 성인기에 죽고, 자연재해에 직면한다."}, {"en": "But not all control and redirection add to human welfare.", "ko": "그러나 모든 통제와 방향 전환이 인간 복지에 보태는 것은 아니다."}, {"en": "Medical technology, based on science, has lengthened the number of years human beings suffer from chronic diseases, condemning them to lonely, bedridden existences.", "ko": "과학에 기반한 의료 기술은 인간이 만성 질환에 시달리는 햇수를 늘렸고, 그 결과 그들을 외로운, 침대에 누운 존재로 처하게 했다."}, {"en": "End-of-lite treatments, which prove medical innovation and competence, can sustain life, but not living.", "ko": "연명 치료는 의학적 혁신과 역량을 입증하지만, 생명은 유지하나 '살아 있음'은 유지하지 못한다."}, {"en": "The illustrious medical journal The Lancet reports frequently on the \"sea of suffering\" in aging populations.", "ko": "저명한 의학 저널 The Lancet은 고령 인구의 '고통의 바다'에 대해 자주 보도한다."}]}, {"no": "9", "title": "Animal Welfare: Natural Behaviour & Perches", "ktitle": "야생 들닭의 자연 행동(횃대)에서 가축 닭의 복지 욕구를 추론·검증한다", "field": "수능특강 영어독해연습", "page": "04강 Ex.09", "oneline": "동물이 무엇을 원하는지 알려면 자연 상태의 행동을 알아야 한다 — 야생 들닭이 횃대에 앉는다는 사실에서 가축 닭에게도 횃대가 중요하리라는 가설을 세우고 검증할 수 있다.", "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에 밤 풍경 속 나무 위에서 횃대에 앉은 야생 들닭이 있고 가운데 화살표를 거쳐 가축 닭에게 횃대가 중요할 수 있다는 가설 박스가 있으며 오른쪽 양계장 안 횃대 위에 가축 닭이 they do 라벨과 함께 검증된 그림\">\n\n  <!-- 상단 단계 라벨 -->\n  <text x=\"105\" y=\"14\" font-family=\"Noto Serif KR\" font- 양계장 윤곽 (간단 박스) -->\n    <rect x=\"20\" y=\"50\" width=\"140\" height=\"120\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n    <!-- 지붕 -->\n    <polygon points=\"14,50 90,30 166,50\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n\n    <!-- 횃대 (가로 막대) -->\n    <rect x=\"35\" y=\"118\" width=\"110\" height=\"5\" fill=\"#1a1a1a\"/>\n    <!-- 횃대 다리 -->\n    <line x1=\"45\" y1=\"123\" x2=\"45\" y2=\"160\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n    <line x1=\"135\" y1=\"123\" x2=\"135\" y2=\"160\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n\n    <!-- 닭 1 (좌) -->\n    <g transform=\"translate(60, 108)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"11\" ry=\"8\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <circle cx=\"9\" cy=\"-5\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <polygon points=\"14,-5 18,-6 14,-3\" fill=\"#c8102e\"/>\n      <path d=\"M 7 -10 Q 9 -12 11 -10 Q 10 -8 9 -9 Z\" fill=\"#c8102e\"/>\n      <circle cx=\"10\" cy=\"-6\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <path d=\"M -10 -1 Q -16 -4 -14 1 Q -16 3 -12 3 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"-3\" y1=\"8\" x2=\"-3\" y2=\"11\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"3\" y1=\"8\" x2=\"3\" y2=\"11\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    </g>\n\n    <!-- 닭 2 (우) -->\n    <g transform=\"translate(118, 108)\">\n      <ellipse cx=\"0\" cy=\"0\" rx=\"11\" ry=\"8\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <circle cx=\"9\" cy=\"-5\" r=\"5\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <polygon points=\"14,-5 18,-6 14,-3\" fill=\"#c8102e\"/>\n      <path d=\"M 7 -10 Q 9 -12 11 -10 Q 10 -8 9 -9 Z\" fill=\"#c8102e\"/>\n      <circle cx=\"10\" cy=\"-6\" r=\"0.7\" fill=\"#1a1a1a\"/>\n      <path d=\"M -10 -1 Q -16 -4 -14 1 Q -16 3 -12 3 Z\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1\"/>\n      <line x1=\"-3\" y1=\"8\" x2=\"-3\" y2=\"11\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n      <line x1=\"3\" y1=\"8\" x2=\"3\" y2=\"11\" stroke=\"#1a1a1a\" stroke-width=\"1.1\"/>\n    </g>\n\n    <!-- ✓ 큰 마크 -->\n    <g transform=\"translate(150, 60)\">\n      <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#1FA34A\"/>\n      <path d=\"M -6 0 L -1 5 L 7 -5\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.5\"/>\n    </g>\n\n    <text x=\"90\" y=\"183\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"they do\" — 실제 횃대 원함</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 245)\">\n    <rect x=\"80\" y=\"0\" width=\"440\" height=\"22\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"300\" y=\"15\" font-family=\"Noto Serif KR\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">자연 행동 지식 → 가설 → 검증 — 동물 복지 이해 완성</text>\n  </g>\n</svg>", "caption": "자연 행동(횃대) → 가축 동물의 복지 욕구 가설", "tldr": ["동물이 무엇을 원하는지 알려면 자연 상태의 행동을 알아야 한다 — 야생 들닭이 횃대에 앉는다는 사실에서 가축 닭에게도 횃대가 중요하리라는 가설을 세우고 검증할 수 있다.", "자연 행동(횃대) → 가축 동물의 복지 욕구 가설"], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [], "vocab": [["discover", "알아내다·발견하다"], ["behavioural repertoire", "행동 목록·행동 레퍼토리"], ["species", "종(種)"], ["vital", "필수적인·매우 중요한"], ["welfare", "복지"], ["draw attention to", "~에 주의를 기울이게 하다"], ["captive", "사육되는·갇힌"], ["necessarily", "필연적으로·반드시"], ["candidate", "후보·가능성 있는 것"], ["jungle fowl", "야생 들닭 (가축화된 닭의 조상)"], ["roost", "홰에 앉다·횃대에서 자다"], ["domestic", "가축화된·집의"], ["plausible hypothesis", "그럴듯한 가설"]], "quiz": [["이 지문의 핵심 구조는?", "자연 행동(횃대) → 가축 동물의 복지 욕구 가설"], ["도식이 강조하는 결론은?", "동물이 무엇을 원하는지 알려면 자연 상태의 행동을 알아야 한다 — 야생 들닭이 횃대에 앉는다는 사실에서 가축 닭에게도 횃대가 중요하리라는 가설을 세우고 검증할 수 있다."]], "en": "In the process of discovering what animals want to do, a knowledge of the natural or normal behavioural repertoire of a species is a vital step in understanding what is good for their welfare. It draws our attention to the differences between wild and captive members of that species and therefore makes us aware of the possible behaviours that the captive ones might want to do. It does not say that they will necessarily want to do them just because they are natural but it provides obvious candidates to be tested. The fact that the jungle fowl ancestors of our domestic chickens always roost in trees at night, for example, highlights the possible importance of roosting to modern breeds. It does not tell us that all modern chickens still definitely want to roost, but it provides a very plausible hypothesis that this might be important to them. Such a hypothesis can then be tested by investigating whether modern chickens still want to roost (they do).", "ko": "동물들이 무엇을 하고 싶어 하는지를 알아가는 과정에서, 어떤 종의 자연적·정상적인 행동 목록에 대한 지식은 그들의 복지에 무엇이 좋은지를 이해하는 데 필수적인 단계이다. 그 지식은 우리의 주의를 그 종의 야생 개체와 사육 개체의 차이에 기울이게 하고, 따라서 사육 개체들이 하고 싶어 할 수 있는 가능한 행동들을 인식하게 만든다. 그 지식이 단지 자연스럽다는 이유만으로 그들이 반드시 그것을 하고 싶어 할 것이라고 말하지는 않지만, 검증해 볼 수 있는 분명한 후보들을 제공한다. 예를 들어, 우리의 가축화된 닭의 조상인 야생 들닭이 밤에 항상 나무에서 횃대에 앉는다는 사실은 현대 품종에 횃대에 앉기가 갖는 가능한 중요성을 부각시킨다. 그것은 모든 현대 닭이 여전히 분명히 횃대에 앉고 싶어 한다고 말하지는 않지만, 이것이 그들에게 중요할 수 있다는 매우 그럴듯한 가설을 제공한다. 그러한 가설은 이후 현대 닭이 여전히 횃대에 앉고 싶어 하는지 조사함으로써 검증될 수 있다 (그들은 실제로 그러하다).", "read": [{"en": "In the process of discovering what animals want to do, a knowledge of the natural or normal behavioural repertoire of a species is a vital step in understanding what is good for their welfare.", "ko": "동물들이 무엇을 하고 싶어 하는지를 알아가는 과정에서, 어떤 종의 자연적·정상적인 행동 목록에 대한 지식은 그들의 복지에 무엇이 좋은지를 이해하는 데 필수적인 단계이다."}, {"en": "It draws our attention to the differences between wild and captive members of that species and therefore makes us aware of the possible behaviours that the captive ones might want to do.", "ko": "그 지식은 우리의 주의를 그 종의 야생 개체와 사육 개체의 차이에 기울이게 하고, 따라서 사육 개체들이 하고 싶어 할 수 있는 가능한 행동들을 인식하게 만든다."}, {"en": "It does not say that they will necessarily want to do them just because they are natural but it provides obvious candidates to be tested.", "ko": "그 지식이 단지 자연스럽다는 이유만으로 그들이 반드시 그것을 하고 싶어 할 것이라고 말하지는 않지만, 검증해 볼 수 있는 분명한 후보들을 제공한다."}, {"en": "The fact that the jungle fowl ancestors of our domestic chickens always roost in trees at night, for example, highlights the possible importance of roosting to modern breeds.", "ko": "예를 들어, 우리의 가축화된 닭의 조상인 야생 들닭이 밤에 항상 나무에서 횃대에 앉는다는 사실은 현대 품종에 횃대에 앉기가 갖는 가능한 중요성을 부각시킨다."}, {"en": "It does not tell us that all modern chickens still definitely want to roost, but it provides a very plausible hypothesis that this might be important to them.", "ko": "그것은 모든 현대 닭이 여전히 분명히 횃대에 앉고 싶어 한다고 말하지는 않지만, 이것이 그들에게 중요할 수 있다는 매우 그럴듯한 가설을 제공한다."}, {"en": "Such a hypothesis can then be tested by investigating whether modern chickens still want to roost (they do).", "ko": "그러한 가설은 이후 현대 닭이 여전히 횃대에 앉고 싶어 하는지 조사함으로써 검증될 수 있다 (그들은 실제로 그러하다)."}]}, {"no": "10", "title": "Electoral Systems: Proportional vs Not", "ktitle": "득표를 그대로 비추는 비례제 vs 한 정당에 다수를 몰아주는 비비례제", "field": "수능특강 영어독해연습", "page": "04강 Ex.10", "oneline": "선거제도는 점점 복잡해진다 — 비례제는 정당 득표율을 의석에 거울처럼 반영하지만, 비례적이지 않은 제도에서는 같은 득표 분포가 한 정당의 명확한 다수로 바뀐다.", "metaphor": "<svg viewBox=\"0 0 600 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽에 비례 제도가 정당 득표율 40 30 20 10 막대를 그대로 동일 의석 비율로 거울처럼 반영하고, 오른쪽 비례적이지 않은 제도는 같은 득표 분포를 60 25 10 5 의석 분포로 왜곡하여 한 정당의 다수 의석과 안정 정부를 보여주는 두 막대 비교 그림\">\n\n  <!-- 상단 공통 라벨: 같은 득표 출발 -->\n  <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">표 → 의석 전환의 두 방식 (같은 득표 · 다른 의석)</text>\n\n  <!-- 좌측: 비례 제도 (거울) -->\n  <g transform=\"translate(15, 28)\">\n    <rect x=\"0\" y=\"0\" width=\"280\" height=\"215\" rx=\"4\" fill=\"#f0faf3\" fill-opacity=\"0.25\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"140\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">비례 제도 — proportional · mirror</text>\n\n    <!-- 득표 (좌) -->\n -weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">vs</text>\n  </g>\n\n  <!-- 우측: 비례적이지 않은 제도 (왜곡) -->\n  <g transform=\"translate(305, 28)\">\n    <rect x=\"0\" y=\"0\" width=\"280\" height=\"215\" rx=\"4\" fill=\"#fdf2f4\" fill-opacity=\"0.3\" stroke=\"#c8102e\" stroke-width=\"1.4\"/>\n    <text x=\"140\" y=\"18\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c8102e\">비비례 제도 — non-proportional · majority</text>\n\n    <!-- 득표 (좌) -->\n    <text x=\"60\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\" font-weight=\"700\">votes %</text>\n    <g transform=\"translate(20, 50)\">\n      <rect x=\"0\" y=\"0\" width=\"80\" height=\"14\" fill=\"#1FA34A\"/>\n      <text x=\"-3\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#1a1a1a\">A</text>\n      <text x=\"84\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#1FA34A\" font-weight=\"700\">40</text>\n      <rect x=\"0\" y=\"18\" width=\"60\" height=\"14\" fill=\"#1a1a1a\"/>\n      <text x=\"-3\" y=\"29\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#1a1a1a\">B</text>\n      <text x=\"64\" y=\"29\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#1a1a1a\" font-weight=\"700\">30</text>\n      <rect x=\"0\" y=\"36\" width=\"40\" height=\"14\" fill=\"#c8102e\"/>\n      <text x=\"-3\" y=\"47\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#1a1a1a\">C</text>\n      <text x=\"44\" y=\"47\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#c8102e\" font-weight=\"700\">20</text>\n      <rect x=\"0\" y=\"54\" width=\"20\" height=\"14\" fill=\"#999\"/>\n      <text x=\"-3\" y=\"65\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"end\" fill=\"#1a1a1a\">D</text>\n      <text x=\"24\" y=\"65\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#999\" font-weight=\"700\">10</text>\n    </g>\n\n    <!-- 왜곡 화살표 -->\n    <g transform=\"translate(130, 80)\">\n      <path d=\"M 0 0 Q 11 -8 22 0\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.6\"/>\n      <polygon points=\"22,0 15,-4 15,4\" fill=\"#c8102e\"/>\n      <text x=\"11\" y=\"-13\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">distort</text>\n    </g>\n\n    <!-- 의석 (우) — 왜곡 (60, 25, 10, 5) -->\n    <text x=\"220\" y=\"40\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\" font-weight=\"700\">seats %</text>\n    <g transform=\"translate(160, 50)\">\n      <!-- A 60% (다수 보너스) -->\n      <rect x=\"0\" y=\"0\" width=\"100\" height=\"14\" fill=\"#1FA34A\"/>\n      <text x=\"104\" y=\"11\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#1FA34A\" font-weight=\"700\">60</text>\n      <!-- 보너스 표시 (점선) -->\n      <rect x=\"80\" y=\"0\" width=\"20\" height=\"14\" fill=\"none\" stroke=\"#c8102e\" stroke-width=\"1.1\" stroke-dasharray=\"2 2\"/>\n      <text x=\"90\" y=\"-3\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">+ bonus</text>\n      <!-- B 25% -->\n      <rect x=\"0\" y=\"18\" width=\"50\" height=\"14\" fill=\"#1a1a1a\"/>\n      <text x=\"54\" y=\"29\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#1a1a1a\" font-weight=\"700\">25</text>\n      <!-- C 10% (반토막) -->\n      <rect x=\"0\" y=\"36\" width=\"20\" height=\"14\" fill=\"#c8102e\"/>\n      <text x=\"24\" y=\"47\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#c8102e\" font-weight=\"700\">10</text>\n      <!-- D 5% (반토막) -->\n      <rect x=\"0\" y=\"54\" width=\"10\" height=\"14\" fill=\"#999\"/>\n      <text x=\"14\" y=\"65\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" fill=\"#999\" font-weight=\"700\">5</text>\n    </g>\n\n    <!-- 왜곡 라벨 -->\n    <text x=\"140\" y=\"155\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">\"clear majority of seats\"</text>\n    <text x=\"140\" y=\"170\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">한 정당의 다수 의석 → 안정 정부</text>\n\n    <!-- 가치 -->\n    <text x=\"140\" y=\"195\" font-family=\"Noto Serif KR\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#5e5e5e\">가치 — 강력·안정적 정부 (소수 표심 사장 ↓)</text>\n  </g>\n</svg>", "caption": "득표를 비추는 비례제 vs 다수를 만드는 비비례제", "tldr": ["선거제도는 점점 복잡해진다 — 비례제는 정당 득표율을 의석에 거울처럼 반영하지만, 비례적이지 않은 제도에서는 같은 득표 분포가 한 정당의 명확한 다수로 바뀐다.", "득표를 비추는 비례제 vs 다수를 만드는 비비례제"], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [], "vocab": [["inevitably", "필연적으로·불가피하게"], ["electoral system", "선거 제도"], ["crowded", "혼잡한·붐비는"], ["analyst", "분석가"], ["typology", "유형 분류 (체계)"], ["classification", "분류·구분"], ["output", "산출물·결과"], ["translate A into B", "A를 B로 전환·변환하다"], ["proportional", "비례적인"], ["reflect", "반영하다"], ["attach importance to", "~에 중요성을 부여하다"], ["majority", "다수·과반수"], ["prospect", "가능성·전망"]], "quiz": [["이 지문의 핵심 구조는?", "득표를 비추는 비례제 vs 다수를 만드는 비비례제"], ["도식이 강조하는 결론은?", "선거제도는 점점 복잡해진다 — 비례제는 정당 득표율을 의석에 거울처럼 반영하지만, 비례적이지 않은 제도에서는 같은 득표 분포가 한 정당의 명확한 다수로 바뀐다."]], "en": "Inevitably, the world of electoral systems is crowded and complex and becoming more so all the time: one country's electoral system is never the same as another's (although in some cases the differences are quite small). Given the range of variations among the different electoral systems, this makes life quite difficult for the analyst seeking to produce an acceptable typology. One option might be to simply base a classification of the systems in terms of their outputs, that is, with reference to the process of translating votes into seats where one distinguishes between those systems which have 'proportional' outcomes and those with 'non-proportional' outcomes. The essence of proportional systems is to ensure that the number of seats each party wins reflects as closely as possible the number of votes it has received. In non-proportional systems, by contrast, greater importance is attached to ensuring that one party has a clear majority of seats over its competitors, thereby (hopefully) increasing the prospect of a strong and stable government.", "ko": "필연적으로 선거 제도의 세계는 혼잡하고 복잡하며, 줄곧 더 그렇게 되어 가고 있어서, 한 나라의 선거 제도는 결코 다른 나라의 제도와 같지 않다(물론 몇몇 경우에는 그 차이가 매우 작을 수도 있기는 하다). 서로 다른 선거 제도 사이에 있는 차이의 범위를 고려할 때, 이것은 받아들일 만한 유형 분류 체계를 만들고자 하는 분석가를 상당히 힘들게 한다. 한 가지 선택지는 단순히 그 '산출물'의 면에서, 즉 표를 의석으로 전환하는 과정과 관련하여 그 제도 분류의 근거를 두는 것일 수도 있는데, 그럴 경우 '비례적인' 결과를 내는 제도와 '비례적이지 않은' 결과를 내는 제도를 구별하게 된다. 비례 제도의 본질은 각 정당이 얻는 의석수가 받은 득표수를 가능한 한 가깝게 반영하도록 보장하는 것이다. 대조적으로 비례적이지 않은 제도에서는, 한 정당이 경쟁 정당들에 비해 명확한 다수의 의석을 확보하고, 그리하여 (잘만 되면) 강력하고 안정적인 정부의 가능성을 높이도록 보장하는 데 더 큰 중요성이 부여된다.", "read": [{"en": "Inevitably, the world of electoral systems is crowded and complex and becoming more so all the time: one country's electoral system is never the same as another's (although in some cases the differences are quite small).", "ko": "필연적으로 선거 제도의 세계는 혼잡하고 복잡하며, 줄곧 더 그렇게 되어 가고 있어서, 한 나라의 선거 제도는 결코 다른 나라의 제도와 같지 않다(물론 몇몇 경우에는 그 차이가 매우 작을 수도 있기는 하다)."}, {"en": "Given the range of variations among the different electoral systems, this makes life quite difficult for the analyst seeking to produce an acceptable typology.", "ko": "서로 다른 선거 제도 사이에 있는 차이의 범위를 고려할 때, 이것은 받아들일 만한 유형 분류 체계를 만들고자 하는 분석가를 상당히 힘들게 한다."}, {"en": "One option might be to simply base a classification of the systems in terms of their outputs, that is, with reference to the process of translating votes into seats where one distinguishes between those systems which have 'proportional' outcomes and those with 'non-proportional' outcomes.", "ko": "한 가지 선택지는 단순히 그 '산출물'의 면에서, 즉 표를 의석으로 전환하는 과정과 관련하여 그 제도 분류의 근거를 두는 것일 수도 있는데, 그럴 경우 '비례적인' 결과를 내는 제도와 '비례적이지 않은' 결과를 내는 제도를 구별하게 된다."}, {"en": "The essence of proportional systems is to ensure that the number of seats each party wins reflects as closely as possible the number of votes it has received.", "ko": "비례 제도의 본질은 각 정당이 얻는 의석수가 받은 득표수를 가능한 한 가깝게 반영하도록 보장하는 것이다."}, {"en": "In non-proportional systems, by contrast, greater importance is attached to ensuring that one party has a clear majority of seats over its competitors, thereby (hopefully) increasing the prospect of a strong and stable government.", "ko": "대조적으로 비례적이지 않은 제도에서는, 한 정당이 경쟁 정당들에 비해 명확한 다수의 의석을 확보하고, 그리하여 (잘만 되면) 강력하고 안정적인 정부의 가능성을 높이도록 보장하는 데 더 큰 중요성이 부여된다."}]}, {"no": "11", "title": "Melody = Relative Pattern, Not Absolute Pitch", "ktitle": "멜로디는 절대 음높이가 아니라 음 사이의 상대적 패턴으로 정의된다", "field": "수능특강 영어독해연습", "page": "04강 Ex.11", "oneline": "멜로디는 각 음의 절대값이 아니라 음들 사이의 패턴으로 정의된다 — 의자를 옮기고 뒤집고 색칠해도 같은 의자이듯, 멜로디도 키를 옮겨 상대적 거리가 같으면 같은 멜로디다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"위쪽에 의자가 정상 다른 방 이동 거꾸로 뒤집기 빨강 칠하기 세 변형에도 같은 의자 정체성을 유지하고 아래쪽에 같은 멜로디 패턴이 낮은 키 정상 키 높은 키로 옮겨가도 같은 노래로 인식되는 두 평행 비유 그림\">\n\n  <!-- 위쪽: 의자 비유 -->\n  <g transform=\"translate(0, 5)\">\n    <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">의자 비유 — 변형되어도 같은 의자</text>\n\n    <!-- 의자 1: 정상 -->\n    <g transform=\"translate(80, 50)\">\n      <!-- 등받이 -->\n      <rect x=\"-12\" y=\"-30\" width=\"24\" height=\"22\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"-7\" y1=\"-30\" x2=\"-7\" y2=\"-8\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n      <line x1=\"0\" y1=\"-30\" x2=\"0\" y2=\"-8\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n      <line x1=\"7\" y1=\"-30\" x2=\"7\" y2=\"-8\" stroke=\"#1a1a1a\" stroke-width=\"0.8\"/>\n      <!-- 좌면 --> 23\" y2=\"-17\" stroke=\"#1a1a1a\" stroke-width=\"1.2\"/>\n      <text x=\"0\" y=\"22\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1a1a1a\">high · loud</text>\n    </g>\n\n    <!-- 패턴 강조 — 4개 음표 사이 점선 (상대 관계) -->\n    <g transform=\"translate(80, 65)\" opacity=\"0.5\">\n      <line x1=\"-22\" y1=\"8\" x2=\"-9\" y2=\"5\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"2 1\"/>\n      <line x1=\"-9\" y1=\"5\" x2=\"5\" y2=\"11\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"2 1\"/>\n      <line x1=\"5\" y1=\"11\" x2=\"20\" y2=\"6\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"2 1\"/>\n    </g>\n    <g transform=\"translate(190, 65)\" opacity=\"0.5\">\n      <line x1=\"-22\" y1=\"3\" x2=\"-9\" y2=\"0\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"2 1\"/>\n      <line x1=\"-9\" y1=\"0\" x2=\"5\" y2=\"6\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"2 1\"/>\n      <line x1=\"5\" y1=\"6\" x2=\"20\" y2=\"1\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"2 1\"/>\n    </g>\n    <g transform=\"translate(300, 65)\" opacity=\"0.5\">\n      <line x1=\"-22\" y1=\"-2\" x2=\"-9\" y2=\"-5\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"2 1\"/>\n      <line x1=\"-9\" y1=\"-5\" x2=\"5\" y2=\"1\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"2 1\"/>\n      <line x1=\"5\" y1=\"1\" x2=\"20\" y2=\"-4\" stroke=\"#c8102e\" stroke-width=\"0.8\" stroke-dasharray=\"2 1\"/>\n    </g>\n\n    <!-- 결론 화살표 -->\n    <g transform=\"translate(360, 65)\">\n      <line x1=\"0\" y1=\"0\" x2=\"50\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.8\"/>\n      <polygon points=\"50,0 43,-4 43,4\" fill=\"#1FA34A\"/>\n    </g>\n\n    <!-- ✓ 같은 노래 -->\n    <g transform=\"translate(440, 65)\">\n      <circle cx=\"0\" cy=\"0\" r=\"16\" fill=\"#1FA34A\"/>\n      <path d=\"M -7 0 L -2 6 L 8 -6\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.5\"/>\n      <text x=\"0\" y=\"32\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">same melody</text>\n    </g>\n\n    <!-- 패턴 라벨 -->\n    <text x=\"500\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#c8102e\" font-weight=\"700\">pattern preserved</text>\n    <text x=\"500\" y=\"68\" font-family=\"Noto Serif KR\" font-size=\"8\" text-anchor=\"middle\" fill=\"#c8102e\">상대 관계 보존</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 248)\">\n    <rect x=\"80\" y=\"0\" width=\"440\" height=\"20\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\"/>\n    <text x=\"300\" y=\"13\" font-family=\"Noto Serif KR\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1FA34A\">melody = 음높이 간 패턴 — 변형되어도 정체성 유지 (auditory object)</text>\n  </g>\n</svg>", "caption": "키가 달라도 상대 패턴이 같으면 같은 멜로디", "tldr": ["멜로디는 각 음의 절대값이 아니라 음들 사이의 패턴으로 정의된다 — 의자를 옮기고 뒤집고 색칠해도 같은 의자이듯, 멜로디도 키를 옮겨 상대적 거리가 같으면 같은 멜로디다.", "키가 달라도 상대 패턴이 같으면 같은 멜로디"], "bg": "수능특강 영어독해연습 04강 지문 이해 자료입니다.", "flow": [], "vocab": [["melody", "멜로디·선율"], ["absolute value", "절대적인 값"], ["pitch", "음높이"], ["successive", "연속적인·잇따른"], ["recognize", "인식하다·알아보다"], ["key", "(음악) 조"], ["float freely", "자유롭게 떠다니다"], ["abstract prototype", "추상적인 원형"], ["be derived from", "~에서 끌어내지다·유래하다"], ["instrumentation", "악기 구성·악기 편성"], ["cognitive psychologist", "인지 심리학자"], ["auditory object", "청각적 대상"], ["identity", "정체성"]], "quiz": [["이 지문의 핵심 구조는?", "키가 달라도 상대 패턴이 같으면 같은 멜로디"], ["도식이 강조하는 결론은?", "멜로디는 각 음의 절대값이 아니라 음들 사이의 패턴으로 정의된다 — 의자를 옮기고 뒤집고 색칠해도 같은 의자이듯, 멜로디도 키를 옮겨 상대적 거리가 같으면 같은 멜로디다."]], "en": "Melodies are defined not by the absolute value of each pitch, but by the pattern or relation of successive pitches across time; most people have no trouble recognizing a melody that is played in a higher or lower key than they've heard it in before. In fact, many melodies do not have a \"correct\" starting pitch; they just float freely in space, starting anywhere. \"Happy Birthday\" is an example of this. One way to think about a melody, then, is as an abstract prototype that is derived from specific combinations of key, tempo, instrumentation, and so on. A cognitive psychologist would say that a melody is an auditory object that maintains its identity in spite of transformations, just as a chair maintains its identity when you move it to the other room, turn it upside down, or paint it red. So, for example, if you hear a song played louder than you are accustomed to, you still identify it as the same song. The same holds for changes in the absolute pitch values of the song, which can be changed so long as the relative distances between them remain the same.", "ko": "멜로디는 각 음높이의 절대적인 값에 의해서가 아니라, 시간에 걸친 연속적인 음높이의 패턴 또는 관계에 의해 정의되며, 그래서 대부분의 사람들은 이전에 들었던 것보다 더 높거나 낮은 조로 연주되는 멜로디를 인식하는 데 어려움을 느끼지 않는다. 사실상 많은 멜로디에는 '올바른' 시작 음높이가 없으며, 그래서 그것들은 공간 속에서 자유롭게 그저 떠다니다가 어디서나 시작된다. '생일 축하 노래'가 이것의 예이다. 그렇다면, 멜로디를 생각하는 한 가지 방법은 음조, 템포, 악기 구성 등의 특정한 조합에서 끌어낸 '추상적인 원형'으로서이다. 인지 심리학자는 마치 의자가 다른 방으로 옮겨지거나, 거꾸로 뒤집히거나, 빨간색으로 칠해져도 그 정체성을 유지하는 것과 같이, 멜로디란 변형에도 불구하고 그 정체성을 유지하는 청각적 대상이라고 말할 것이다. 그래서 예를 들어, 익숙한 것보다 더 크게 연주되는 노래를 듣더라도, 여전히 그것을 같은 노래로 인식하는 것이다. 같은 현상이 노래의 절대적인 음높이 값의 변화에도 적용되는데, 그 음높이는 그것들 사이의 상대적인 거리가 동일하게 유지되는 한 바뀔 수 있다.", "read": [{"en": "Melodies are defined not by the absolute value of each pitch, but by the pattern or relation of successive pitches across time; most people have no trouble recognizing a melody that is played in a higher or lower key than they've heard it in before.", "ko": "멜로디는 각 음높이의 절대적인 값에 의해서가 아니라, 시간에 걸친 연속적인 음높이의 패턴 또는 관계에 의해 정의되며, 그래서 대부분의 사람들은 이전에 들었던 것보다 더 높거나 낮은 조로 연주되는 멜로디를 인식하는 데 어려움을 느끼지 않는다."}, {"en": "In fact, many melodies do not have a \"correct\" starting pitch; they just float freely in space, starting anywhere.", "ko": "사실상 많은 멜로디에는 '올바른' 시작 음높이가 없으며, 그래서 그것들은 공간 속에서 자유롭게 그저 떠다니다가 어디서나 시작된다."}, {"en": "\"Happy Birthday\" is an example of this.", "ko": "'생일 축하 노래'가 이것의 예이다."}, {"en": "One way to think about a melody, then, is as an abstract prototype that is derived from specific combinations of key, tempo, instrumentation, and so on.", "ko": "그렇다면, 멜로디를 생각하는 한 가지 방법은 음조, 템포, 악기 구성 등의 특정한 조합에서 끌어낸 '추상적인 원형'으로서이다."}, {"en": "A cognitive psychologist would say that a melody is an auditory object that maintains its identity in spite of transformations, just as a chair maintains its identity when you move it to the other room, turn it upside down, or paint it red.", "ko": "인지 심리학자는 마치 의자가 다른 방으로 옮겨지거나, 거꾸로 뒤집히거나, 빨간색으로 칠해져도 그 정체성을 유지하는 것과 같이, 멜로디란 변형에도 불구하고 그 정체성을 유지하는 청각적 대상이라고 말할 것이다."}, {"en": "So, for example, if you hear a song played louder than you are accustomed to, you still identify it as the same song.", "ko": "그래서 예를 들어, 익숙한 것보다 더 크게 연주되는 노래를 듣더라도, 여전히 그것을 같은 노래로 인식하는 것이다."}, {"en": "The same holds for changes in the absolute pitch values of the song, which can be changed so long as the relative distances between them remain the same.", "ko": "같은 현상이 노래의 절대적인 음높이 값의 변화에도 적용되는데, 그 음높이는 그것들 사이의 상대적인 거리가 동일하게 유지되는 한 바뀔 수 있다."}]}, {"no": "12", "title": "Participatory Journalism: De Correspondent", "ktitle": "기사를 일방 전달하던 전통 미디어 vs 독자를 조언자로 삼는 양방향 저널리즘", "field": "수능특강 영어독해연습", "page": "04강 Ex.12", "oneline": "네덜란드 De Correspondent는 독자 참여를 저널리즘에 통합했다 — 기자가 완성된 기사를 일방적으로 전하던 전통 미디어와 달리, 기자와 독자가 양방향으로 질문과 지식을 주고받는다.", "metaphor": "<svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"왼쪽 전통 미디어는 기자가 완성된 기사를 독자에게 일방향으로 전달하고 댓글은 별도 영역에 놓이지만 오른쪽 De Correspondent는 기자와 독자가 양방향으로 질문과 기여를 주고받으며 진행 중인 기사의 다음 버전으로 통합되는 두 모델 비교 그림\">\n\n  <!-- 상단 라벨 -->\n  <text x=\"300\" y=\"14\" font-family=\"Noto Serif KR\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1a1a\">전통 미디어 vs De Correspondent — 독자 관계의 전환</text>\n\n  <!-- 좌측: 전통 미디어 (일방향) -->\n  <g transform=\"translate(15, 28)\">\n    <rect x=\"0\" y=\"0\" width=\"265\" height=\"200\" 1a\" stroke-width=\"1\"/>\n      <line x1=\"0\" y1=\"-7\" x2=\"0\" y2=\"22\" stroke=\"#1a1a1a\" stroke-width=\"1.4\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"-12\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"0\" x2=\"12\" y2=\"8\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"-8\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <line x1=\"0\" y1=\"22\" x2=\"8\" y2=\"40\" stroke=\"#1a1a1a\" stroke-width=\"1.3\"/>\n      <text x=\"0\" y=\"55\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">co-creator</text>\n    </g>\n\n    <!-- 독자 → 기사 (contributions, 역방향) -->\n    <g transform=\"translate(0, 115)\">\n      <line x1=\"208\" y1=\"0\" x2=\"166\" y2=\"0\" stroke=\"#1FA34A\" stroke-width=\"1.5\"/>\n      <polygon points=\"166,0 174,-4 174,4\" fill=\"#1FA34A\"/>\n      <text x=\"186\" y=\"14\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">contributions</text>\n    </g>\n\n    <!-- 기사 → 다음 버전 화살표 (위 → 아래로 통합) -->\n    <g transform=\"translate(140, 115)\">\n      <path d=\"M 0 0 Q 0 12 0 20\" fill=\"none\" stroke=\"#1FA34A\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/>\n      <polygon points=\"0,20 -3,14 3,14\" fill=\"#1FA34A\"/>\n      <text x=\"0\" y=\"35\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">next version</text>\n    </g>\n\n    <!-- 하단 라벨: contributions = comments 격상 -->\n    <text x=\"140\" y=\"180\" font-family=\"Noto Serif\" font-style=\"italic\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1FA34A\" font-weight=\"700\">\"not comments BUT contributions\"</text>\n  </g>\n\n  <!-- 하단 결론 -->\n  <g transform=\"translate(0, 245)\">\n    <rect x=\"60\" y=\"0\" width=\"480\" height=\"22\" rx=\"3\" fill=\"#f0faf3\" stroke=\"#1FA34A\" stroke-width=\"1.4\ n ongoing story.'", "ko": "기자들은 또한 댓글이 아니라 '기여'라고 불리는 토론 스레드를 관리하는데, 가장 훌륭한 추가 의견을 부각시키고 진행 중인 기사의 다음 버전에 유용한 자료를 끌어 넣기 위해서이다."}, {"en": "Some of these crowdsourcing techniques have been used by journalists on more mainstream papers, notably David Fahrenthold of the Washington Post.", "ko": "이러한 크라우드소싱 기법들 가운데 일부는 더 많은 주류 신문사의 기자들에 의해서도 사용되었는데, 특히 Washington Post의 David Fahrenthold가 그렇다."}]}]};

/* ============================================================
   RENDER
   ============================================================ */
function renderTabs() {
  const tabs = P.data.map((d, i) =>
    `<button class="tab${i===0?' active':''}" data-t="${d.no}">
       <span class="tab-no">${d.no}</span>
       <span class="tab-field">${d.field}</span>
     </button>`).join('');
  document.getElementById('tabs').innerHTML = tabs;
}

function renderTLDR(d) {
  if (!d.tldr || !d.tldr.length) return '';
  const items = d.tldr.map(t => `<li>${t}</li>`).join('');
  return `<details class="tool" data-tool="tldr" open>
    <summary>
      <span class="ticon">A</span>
      <span class="tname">30초 요약</span>
      <span class="thint">— 빠르게 한 컷</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><ol class="tldr">${items}</ol></div>
  </details>`;
}

function renderAnalogy(d) {
  if (!d.analogy) return '';
  return `<details class="tool" data-tool="analogy">
    <summary>
      <span class="ticon">B</span>
      <span class="tname">이게 무슨 말이냐면</span>
      <span class="thint">— 일상 비유</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout analogy">${d.analogy}</p></div>
  </details>`;
}

function renderBG(d) {
  if (!d.bg) return '';
  return `<details class="tool" data-tool="bg">
    <summary>
      <span class="ticon">C</span>
      <span class="tname">배경지식 30초</span>
      <span class="thint">— 이 글이 어떤 글이냐</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body"><p class="callout bg">${d.bg}</p></div>
  </details>`;
}

function renderFlow(d) {
  if (!d.flow || !d.flow.length) return '';
  let body = '<div class="flow">';
  d.flow.forEach((s, i) => {
    const cls = s.cls ? ' ' + s.cls : '';
    body += `<div class="flow-step${cls}">
      <div class="kind">${s.kind}</div>
      <div class="body">
        <div class="t">${s.t}</div>
        ${s.d ? `<div class="d">${s.d}</div>` : ''}
      </div>
    </div>`;
    if (i < d.flow.length - 1) body += '<div class="flow-arrow">▼</div>';
  });
  body += '</div>';
  return `<details class="tool" data-tool="flow">
    <summary>
      <span class="ticon">D</span>
      <span class="tname">글의 작동 원리</span>
      <span class="thint">— 논지 흐름</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderRead(d) {
  if (!d.read || !d.read.length) return '';
  let body = '';
  d.read.forEach(r => {
    let chunks = '';
    if (r.chunks && r.chunks.length) {
      chunks = '<div class="chunks">' + r.chunks.map(ch =>
        `<div class="chunk"><div class="ce">${ch[0]}</div><div class="ck">${ch[1]}</div></div>`
      ).join('') + '</div>';
    }
    body += `<div class="read-sent">
      <div class="en">${r.en}</div>
      ${chunks}
      <div class="ko"><b>전체 해석:</b> ${r.ko}</div>
    </div>`;
  });
  let vocab = '';
  if (d.vocab && d.vocab.length) {
    vocab = '<div class="vocab"><div class="vlabel">핵심 어휘</div>' +
      d.vocab.map(v => `<div class="chip"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('') +
      '</div>';
  }
  return `<details class="tool" data-tool="read">
    <summary>
      <span class="ticon">E</span>
      <span class="tname">끊어읽기 + 어휘</span>
      <span class="thint">— 문장 단위</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${body}${vocab}</div>
  </details>`;
}

function renderQuiz(d) {
  if (!d.quiz || !d.quiz.length) return '';
  const items = d.quiz.map((q, i) =>
    `<details class="quiz-item">
      <summary>
        <span class="qn">Q${i+1}</span>
        <span>${q[0]}</span>
        <span class="qarr">정답 ▾</span>
      </summary>
      <div class="qa">${q[1]}</div>
    </details>`).join('');
  return `<details class="tool" data-tool="quiz">
    <summary>
      <span class="ticon">F</span>
      <span class="tname">확인 퀴즈</span>
      <span class="thint">— 스스로 점검</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">${items}</div>
  </details>`;
}

function renderSource(d) {
  if (!d.en && !d.ko) return '';
  return `<details class="tool" data-tool="source">
    <summary>
      <span class="ticon">G</span>
      <span class="tname">영어 원문 + 해석</span>
      <span class="thint">— 시험 직전 점검용</span>
      <span class="arr">▶</span>
    </summary>
    <div class="body">
      <div class="src">
        <div class="en">${d.en}</div>
        <div class="ko">${d.ko}</div>
      </div>
    </div>
  </details>`;
}

function renderPassage(d, idx) {
  let html = `<section class="passage${idx===0?' active':''}" id="p${d.no}">`;
  html += `<div class="p-head">
    <span class="field">${d.field}</span>
    <h2>${d.title}</h2>
    <p class="p-kt">${d.ktitle}</p>
    <p class="p-page">${d.page}</p>
  </div>`;
  html += `<div class="oneline">${d.oneline}</div>`;
  if (d.metaphor) {
    html += `<div class="metaphor">
      <div class="m-head">
        <span class="label">중심 비유</span>
        <span class="sub">visual metaphor</span>
      </div>
      <figure>
        ${d.metaphor}
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}
      </figure>
    </div>`;
  }
  html += `<div class="tools-intro">막힌 곳만 펴 보세요 · <b>도구 상자</b></div>`;
  html += renderTLDR(d);
  html += renderAnalogy(d);
  html += renderBG(d);
  html += renderFlow(d);
  html += renderRead(d);
  html += renderQuiz(d);
  html += renderSource(d);
  html += `</section>`;
  return html;
}

renderTabs();
document.getElementById('main').innerHTML = P.data.map((d, i) => renderPassage(d, i)).join('');

/* 탭 클릭 */
document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.passage').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('p' + b.dataset.t).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
